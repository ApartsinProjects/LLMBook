<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="Helvetica, Arial, sans-serif">
  <title>SR 11-7 three lines of defense</title>
  <rect width="1100" height="500" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">SR 11-7 three lines of defense</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">No team grades its own work</text>

  <defs>
    <linearGradient id="g3752L1" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#eef4fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dbe6f2" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g3752L2" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f4ecf7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e6d6ed" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g3752L3" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fdeee8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f9d9c9" stop-opacity="1"/>
    </linearGradient>
    <marker id="arr3752" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <!-- Risk flow arrow on the left (top to bottom: increasing oversight) -->
  <g transform="translate(40, 100)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#5a4a3a">Risk</text>
    <text x="0" y="16" font-size="12" font-weight="700" fill="#5a4a3a">flow</text>
    <line x1="30" y1="20" x2="30" y2="300" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr3752)"/>
    <text x="44" y="40" font-size="11" font-style="italic" fill="#5a4a3a">issue</text>
    <text x="44" y="170" font-size="11" font-style="italic" fill="#5a4a3a">escalates</text>
    <text x="44" y="300" font-size="11" font-style="italic" fill="#5a4a3a">up the lines</text>
  </g>

  <!-- First line -->
  <g transform="translate(180, 100)">
    <rect x="0" y="0" width="880" height="90" rx="10" fill="url(#g3752L1)" stroke="#0f3460" stroke-width="2.5"/>
    <text x="20" y="34" font-size="16" font-weight="700" fill="#0f3460">First line</text>
    <text x="20" y="56" font-size="13" font-weight="700" fill="#1a1a2e">Model owners and developers</text>
    <text x="20" y="78" font-size="11" font-style="italic" fill="#5a4a3a">Build and run the model; own day-to-day operation; monitor live behavior</text>
    <!-- right-side mini boxes -->
    <g transform="translate(620, 14)">
      <rect x="0" y="0" width="240" height="64" rx="8" fill="#ffffff" stroke="#0f3460" stroke-width="1.5"/>
      <text x="120" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">Owns the model</text>
      <text x="120" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">data, training, prompts,</text>
      <text x="120" y="56" font-size="11" text-anchor="middle" fill="#1a1a2e">deployment, runtime monitoring</text>
    </g>
  </g>

  <!-- Second line -->
  <g transform="translate(180, 210)">
    <rect x="0" y="0" width="880" height="90" rx="10" fill="url(#g3752L2)" stroke="#722f8a" stroke-width="2.5"/>
    <text x="20" y="34" font-size="16" font-weight="700" fill="#722f8a">Second line</text>
    <text x="20" y="56" font-size="13" font-weight="700" fill="#1a1a2e">Model risk management</text>
    <text x="20" y="78" font-size="11" font-style="italic" fill="#5a4a3a">Independent validation; reviews first line against model risk policy</text>
    <g transform="translate(620, 14)">
      <rect x="0" y="0" width="240" height="64" rx="8" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="120" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Challenges the model</text>
      <text x="120" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">replicates evals, benchmarks,</text>
      <text x="120" y="56" font-size="11" text-anchor="middle" fill="#1a1a2e">approves go-live</text>
    </g>
  </g>

  <!-- Third line -->
  <g transform="translate(180, 320)">
    <rect x="0" y="0" width="880" height="90" rx="10" fill="url(#g3752L3)" stroke="#b3401b" stroke-width="2.5"/>
    <text x="20" y="34" font-size="16" font-weight="700" fill="#b3401b">Third line</text>
    <text x="20" y="56" font-size="13" font-weight="700" fill="#1a1a2e">Internal audit</text>
    <text x="20" y="78" font-size="11" font-style="italic" fill="#5a4a3a">Reports to the board; verifies first two lines are doing their jobs</text>
    <g transform="translate(620, 14)">
      <rect x="0" y="0" width="240" height="64" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="120" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">Audits the process</text>
      <text x="120" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">independent of model team,</text>
      <text x="120" y="56" font-size="11" text-anchor="middle" fill="#1a1a2e">reports to board / regulator</text>
    </g>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 430)">
    <rect x="0" y="0" width="1020" height="60" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Three lines, three independent owners</text>
    <text x="510" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">SR 11-7 (2011) predates LLMs but now applies in practice to LLM-based decision systems in banking.</text>
  </g>
</svg>
