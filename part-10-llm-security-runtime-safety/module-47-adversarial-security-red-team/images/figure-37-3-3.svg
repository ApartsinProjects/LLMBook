<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="Helvetica, Arial, sans-serif">
  <title>Three complementary documentation strategies</title>
  <rect width="1100" height="520" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Three documentation strategies</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Model card, datasheet, system card — progressively broader scope</text>

  <defs>
    <linearGradient id="g3733M" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#eef4fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dbe6f2" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g3733D" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f4ecf7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e6d6ed" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g3733S" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ecf6ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d8ecdd" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Row labels (axis: what each captures) -->
  <g transform="translate(40, 130)">
    <text x="0" y="40" font-size="13" font-weight="700" fill="#5a4a3a">Captures</text>
  </g>
  <g transform="translate(40, 200)">
    <rect x="0" y="0" width="160" height="50" rx="10" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="80" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#5a4a3a">Model</text>
  </g>
  <g transform="translate(40, 270)">
    <rect x="0" y="0" width="160" height="50" rx="10" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="80" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#5a4a3a">Data</text>
  </g>
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="160" height="50" rx="10" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="80" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#5a4a3a">Deployment</text>
  </g>

  <!-- Column 1: Model card -->
  <g transform="translate(230, 110)">
    <rect x="0" y="0" width="270" height="290" rx="10" fill="url(#g3733M)" stroke="#0f3460" stroke-width="2.5"/>
    <text x="135" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">Model card</text>
    <text x="135" y="54" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Mitchell et al. 2019</text>
    <!-- model row check -->
    <circle cx="135" cy="115" r="14" fill="#1f7a3a"/>
    <text x="135" y="120" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">+</text>
    <text x="135" y="155" font-size="11" text-anchor="middle" fill="#1a1a2e">intended use, perf,</text>
    <text x="135" y="170" font-size="11" text-anchor="middle" fill="#1a1a2e">known limits</text>
    <!-- data row partial -->
    <circle cx="135" cy="205" r="14" fill="#a67c1a"/>
    <text x="135" y="210" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">·</text>
    <text x="135" y="240" font-size="11" text-anchor="middle" fill="#1a1a2e">brief data description</text>
    <!-- deployment row empty -->
    <circle cx="135" cy="265" r="14" fill="#cfd5d9"/>
    <text x="135" y="270" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">–</text>
  </g>

  <!-- Column 2: Datasheet -->
  <g transform="translate(530, 110)">
    <rect x="0" y="0" width="270" height="290" rx="10" fill="url(#g3733D)" stroke="#722f8a" stroke-width="2.5"/>
    <text x="135" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">Datasheet</text>
    <text x="135" y="54" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Gebru et al. 2021</text>
    <!-- model row empty -->
    <circle cx="135" cy="115" r="14" fill="#cfd5d9"/>
    <text x="135" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">–</text>
    <text x="135" y="155" font-size="11" text-anchor="middle" fill="#1a1a2e">(model-agnostic)</text>
    <!-- data row check -->
    <circle cx="135" cy="205" r="14" fill="#1f7a3a"/>
    <text x="135" y="210" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">+</text>
    <text x="135" y="240" font-size="11" text-anchor="middle" fill="#1a1a2e">provenance, demographics,</text>
    <text x="135" y="255" font-size="11" text-anchor="middle" fill="#1a1a2e">consent</text>
    <!-- deployment row empty -->
    <circle cx="135" cy="275" r="14" fill="#cfd5d9"/>
    <text x="135" y="280" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">–</text>
  </g>

  <!-- Column 3: System card -->
  <g transform="translate(830, 110)">
    <rect x="0" y="0" width="230" height="290" rx="10" fill="url(#g3733S)" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="115" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">System card</text>
    <text x="115" y="54" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">application-level</text>
    <!-- model row partial -->
    <circle cx="115" cy="115" r="14" fill="#a67c1a"/>
    <text x="115" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">·</text>
    <text x="115" y="150" font-size="11" text-anchor="middle" fill="#1a1a2e">references model card</text>
    <!-- data row partial -->
    <circle cx="115" cy="205" r="14" fill="#a67c1a"/>
    <text x="115" y="210" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">·</text>
    <text x="115" y="240" font-size="11" text-anchor="middle" fill="#1a1a2e">references datasheet</text>
    <!-- deployment row check -->
    <circle cx="115" cy="265" r="14" fill="#1f7a3a"/>
    <text x="115" y="270" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">+</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 430)">
    <rect x="0" y="0" width="1020" height="70" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Use all three together for full auditability</text>
    <text x="510" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Model card documents the trained model; datasheet documents its training data;</text>
    <text x="510" y="65" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">system card documents the deployed application (UI, retrieval, safety filters).</text>
  </g>
</svg>
