<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>EU AI Act: GPAI model obligations</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">EU AI Act: GPAI model obligations</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Every provider has base duties; systemic-risk models carry four more</text>

  <g transform="translate(390, 90)">
    <rect width="320" height="58" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="160" y="36" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">GPAI model</text>
  </g>

  <g transform="translate(440, 180)">
    <polygon points="110,0 220,40 110,80 0,40" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="110" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Systemic risk?</text>
  </g>

  <line x1="550" y1="148" x2="550" y2="178" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

  <line x1="440" y1="220" x2="280" y2="220" stroke="#1a1a2e" stroke-width="1.6"/>
  <line x1="280" y1="220" x2="280" y2="280" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="350" y="212" font-size="13" font-weight="700" fill="#1f7a3a">No</text>

  <line x1="660" y1="220" x2="820" y2="220" stroke="#1a1a2e" stroke-width="1.6"/>
  <line x1="820" y1="220" x2="820" y2="280" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="740" y="212" font-size="13" font-weight="700" fill="#b3401b">Yes</text>

  <g transform="translate(60, 290)">
    <rect width="440" height="200" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="220" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Base obligations (all GPAI)</text>

    <rect x="20" y="50" width="190" height="48" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.4"/>
    <text x="115" y="78" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Technical docs</text>

    <rect x="230" y="50" width="190" height="48" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.4"/>
    <text x="325" y="78" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Data summary</text>

    <rect x="20" y="110" width="190" height="48" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.4"/>
    <text x="115" y="138" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Copyright policy</text>

    <rect x="230" y="110" width="190" height="48" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.4"/>
    <text x="325" y="138" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Downstream info</text>
  </g>

  <g transform="translate(600, 290)">
    <rect width="440" height="200" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="220" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">Systemic-risk additions</text>

    <rect x="20" y="50" width="190" height="48" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.4"/>
    <text x="115" y="78" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Eval + red team</text>

    <rect x="230" y="50" width="190" height="48" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.4"/>
    <text x="325" y="78" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Risk assessment</text>

    <rect x="20" y="110" width="190" height="48" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.4"/>
    <text x="115" y="138" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Incident reporting</text>

    <rect x="230" y="110" width="190" height="48" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.4"/>
    <text x="325" y="138" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Cybersecurity</text>
  </g>

  <text x="820" y="510" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">systemic-risk models also inherit base duties</text>

  <g transform="translate(60, 520)">
    <rect width="980" height="64" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#a67c1a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Four base duties for every GPAI provider; four extra duties for systemic-risk models (compute &gt; 10^25 FLOP or EC-designated).</text>
  </g>
</svg>
