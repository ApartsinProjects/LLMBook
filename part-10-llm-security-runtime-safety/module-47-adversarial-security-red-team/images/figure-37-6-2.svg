<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="Helvetica, Arial, sans-serif">
  <title>Differentially-private SGD</title>
  <rect width="1100" height="500" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Differentially-private SGD</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Per-example clip, then add calibrated Gaussian noise</text>

  <defs>
    <linearGradient id="g3762A" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#eef4fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dbe6f2" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g3762B" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5dc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fae9be" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g3762C" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f4ecf7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e6d6ed" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g3762D" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ecf6ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d8ecdd" stop-opacity="1"/>
    </linearGradient>
    <marker id="arr3762" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <!-- Stage 1: per-example gradient -->
  <g transform="translate(40, 150)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="url(#g3762A)" stroke="#0f3460" stroke-width="2.5"/>
    <text x="100" y="34" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">Per-example gradient</text>
    <text x="100" y="62" font-size="12" text-anchor="middle" fill="#1a1a2e">compute g_i for each</text>
    <text x="100" y="80" font-size="12" text-anchor="middle" fill="#1a1a2e">training example x_i</text>
    <text x="100" y="106" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">independent gradients</text>
  </g>
  <line x1="240" y1="210" x2="290" y2="210" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr3762)"/>

  <!-- Stage 2: clip -->
  <g transform="translate(290, 150)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="url(#g3762B)" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="100" y="34" font-size="15" font-weight="700" text-anchor="middle" fill="#a67c1a">Clip</text>
    <text x="100" y="62" font-size="12" text-anchor="middle" fill="#1a1a2e">scale ||g_i|| to ≤ C</text>
    <text x="100" y="80" font-size="12" text-anchor="middle" fill="#1a1a2e">bounds any one</text>
    <text x="100" y="98" font-size="12" text-anchor="middle" fill="#1a1a2e">example's influence</text>
  </g>
  <line x1="490" y1="210" x2="540" y2="210" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr3762)"/>

  <!-- Stage 3: noise -->
  <g transform="translate(540, 150)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="url(#g3762C)" stroke="#722f8a" stroke-width="2.5"/>
    <text x="100" y="34" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Add Gaussian noise</text>
    <text x="100" y="62" font-size="12" text-anchor="middle" fill="#1a1a2e">aggregate clipped g_i,</text>
    <text x="100" y="80" font-size="12" text-anchor="middle" fill="#1a1a2e">add N(0, σ²C²I)</text>
    <text x="100" y="106" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">privacy budget (ε, δ)</text>
  </g>
  <line x1="740" y1="210" x2="790" y2="210" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr3762)"/>

  <!-- Stage 4: parameter update -->
  <g transform="translate(790, 150)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="url(#g3762D)" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="100" y="34" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Parameter update</text>
    <text x="100" y="62" font-size="12" text-anchor="middle" fill="#1a1a2e">θ ← θ − η · g_noisy</text>
    <text x="100" y="86" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">model never sees raw,</text>
    <text x="100" y="102" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">per-example gradients</text>
  </g>

  <!-- Loop back -->
  <path d="M 890 270 Q 890 350 540 350 Q 200 350 140 270" fill="none" stroke="#0f3460" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr3762)"/>
  <text x="540" y="370" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">next mini-batch</text>

  <!-- Noise injection callout -->
  <g transform="translate(540, 95)">
    <rect x="0" y="0" width="200" height="40" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="100" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">noise injection</text>
    <text x="100" y="33" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">σ controls privacy strength</text>
  </g>
  <line x1="640" y1="135" x2="640" y2="150" stroke="#b3401b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Takeaway -->
  <g transform="translate(40, 410)">
    <rect x="0" y="0" width="1020" height="70" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Clipping bounds, noise blurs — together they certify (ε, δ)-DP</text>
    <text x="510" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Stronger privacy (smaller ε) needs more noise, which costs more training compute for the same accuracy.</text>
    <text x="510" y="65" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">No individual training example can be recovered from the final model parameters.</text>
  </g>
</svg>
