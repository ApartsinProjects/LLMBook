<g transform="translate(60,130)"><rect x="0" y="0" width="280" height="56" rx="10" fill="url(#g_50_3_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="140" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Llama Guard 3</text></g><g transform="translate(360,130)"><rect x="0" y="0" width="350" height="56" rx="10" fill="url(#g_50_3_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="175" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">open, fine-tunable</text></g><g transform="translate(730,130)"><rect x="0" y="0" width="330" height="56" rx="10" fill="url(#g_50_3_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="165" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">lat 30ms / cov 12 categories</text></g><g transform="translate(60,200)"><rect x="0" y="0" width="280" height="56" rx="10" fill="url(#g_50_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="140" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">ShieldGemma</text></g><g transform="translate(360,200)"><rect x="0" y="0" width="350" height="56" rx="10" fill="url(#g_50_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="175" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Google policy alignment</text></g><g transform="translate(730,200)"><rect x="0" y="0" width="330" height="56" rx="10" fill="url(#g_50_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="165" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">lat 25ms / cov 10 categories</text></g><g transform="translate(60,270)"><rect x="0" y="0" width="280" height="56" rx="10" fill="url(#g_50_3_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="140" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Granite Guardian</text></g><g transform="translate(360,270)"><rect x="0" y="0" width="350" height="56" rx="10" fill="url(#g_50_3_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="175" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">IBM enterprise</text></g><g transform="translate(730,270)"><rect x="0" y="0" width="330" height="56" rx="10" fill="url(#g_50_3_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="165" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">lat 40ms / cov 14 categories</text></g><g transform="translate(60,340)"><rect x="0" y="0" width="280" height="56" rx="10" fill="url(#g_50_3_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="140" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">NeMo Guardrails</text></g><g transform="translate(360,340)"><rect x="0" y="0" width="350" height="56" rx="10" fill="url(#g_50_3_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="175" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">NVIDIA rules engine</text></g><g transform="translate(730,340)"><rect x="0" y="0" width="330" height="56" rx="10" fill="url(#g_50_3_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="165" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">lat 50ms / cov configurable</text></g><g transform="translate(40,440)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Open-weight guards have caught up to proprietary</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Llama Guard 3 and ShieldGemma are within 1-2 F1 of closed APIs on standard moderation benchmarks.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Pick on data-residency, license, and integration surface, not raw quality.</text></g></svg>
