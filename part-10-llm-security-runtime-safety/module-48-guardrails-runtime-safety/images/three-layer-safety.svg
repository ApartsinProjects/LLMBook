<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Three layers of LLM safety</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Three layers of LLM safety</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Alignment shapes dispositions; guardrails enforce policy at runtime</text>
  <defs><linearGradient id="g_50_1_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_50_1_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_50_1_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_50_1_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_50_1_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_50_1_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_50_1_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_50_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_50_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_50_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_50_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(60,140)"><rect x="0" y="0" width="300" height="240" rx="10" fill="url(#g_50_1_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="150" y="112" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Alignment</text><text x="150" y="132" font-size="11" text-anchor="middle" fill="#1a1a2e">RLHF / DPO / Constitutional</text><text x="150" y="150" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">shape model behavior</text></g><g transform="translate(380,140)"><rect x="0" y="0" width="300" height="240" rx="10" fill="url(#g_50_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="150" y="112" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">System prompt</text><text x="150" y="132" font-size="11" text-anchor="middle" fill="#1a1a2e">policy + persona</text><text x="150" y="150" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">soft, model can drift</text></g><g transform="translate(700,140)"><rect x="0" y="0" width="300" height="240" rx="10" fill="url(#g_50_1_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="150" y="112" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Runtime guardrails</text><text x="150" y="132" font-size="11" text-anchor="middle" fill="#1a1a2e">external classifiers</text><text x="150" y="150" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">hard, auditable</text></g><line x1="360" y1="260" x2="380" y2="260" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_50_1_1)"/><line x1="680" y1="260" x2="700" y2="260" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_50_1_1)"/><g transform="translate(40,410)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Defense in depth, not single point</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Alignment is best-effort; system prompts can be jailbroken; guardrails catch what slips through.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Each layer alone is insufficient; together they get you to enterprise-grade safety.</text></g></svg>
