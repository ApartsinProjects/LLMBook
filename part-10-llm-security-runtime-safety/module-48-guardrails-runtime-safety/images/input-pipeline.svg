<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Input guardrail pipeline</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Input guardrail pipeline</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Regex first (cheapest), classifier second, LLM-judge for ambiguous cases</text>
  <defs><linearGradient id="g_50_2_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_50_2_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_50_2_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_50_2_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_50_2_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_50_2_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_50_2_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_50_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_50_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_50_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_50_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,200)"><rect x="0" y="0" width="180" height="90" rx="10" fill="url(#g_50_2_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="90" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">User input</text><text x="90" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">raw text/image</text></g><g transform="translate(250,200)"><rect x="0" y="0" width="180" height="90" rx="10" fill="url(#g_50_2_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="90" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Regex / PII</text><text x="90" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">&lt;1 ms</text></g><g transform="translate(460,200)"><rect x="0" y="0" width="180" height="90" rx="10" fill="url(#g_50_2_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="90" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Classifier</text><text x="90" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">ModerationAPI / Granite</text><text x="90" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">5-30 ms</text></g><g transform="translate(670,200)"><rect x="0" y="0" width="180" height="90" rx="10" fill="url(#g_50_2_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="90" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">LLM judge</text><text x="90" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">ambiguous only</text><text x="90" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">200-800 ms</text></g><g transform="translate(880,200)"><rect x="0" y="0" width="180" height="90" rx="10" fill="url(#g_50_2_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="90" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Allow / route</text><text x="90" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">to LLM</text></g><line x1="221" y1="245" x2="249" y2="245" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_50_2_1)"/><line x1="431" y1="245" x2="459" y2="245" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG_50_2_1)"/><line x1="641" y1="245" x2="669" y2="245" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_50_2_1)"/><line x1="851" y1="245" x2="879" y2="245" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_50_2_1)"/><g transform="translate(250,370)"><rect x="0" y="0" width="200" height="70" rx="10" fill="url(#g_50_2_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="100" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Block</text><text x="100" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">policy violation</text></g><g transform="translate(460,370)"><rect x="0" y="0" width="200" height="70" rx="10" fill="url(#g_50_2_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="100" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Sanitize</text><text x="100" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">redact PII</text></g><line x1="350" y1="290" x2="350" y2="369" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_50_2_1)"/><line x1="560" y1="290" x2="560" y2="369" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_50_2_1)"/><g transform="translate(40,460)"><rect x="0" y="0" width="1020" height="54" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Run cheap checks first to keep cost bounded</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Most traffic clears the regex+classifier filter in under 50 ms; only ~1-3% needs LLM-judge cost.</text></g></svg>
