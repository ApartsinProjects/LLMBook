<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>EU AI Act risk tiers: cascading staircase of obligations</title>
  <rect width="1100" height="540" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">EU AI Act risk tiers</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Higher tiers inherit every duty below</text>

  <!-- PROHIBITED -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#b3401b">PROHIBITED</text>
    <text x="20" y="50" font-size="11" font-style="italic" fill="#5a4a3a">Art. 5</text>
    <text x="20" y="70" font-size="11" font-weight="700" fill="#b3401b">Unacceptable risk</text>
  </g>
  <g transform="translate(280, 100)">
    <rect x="0" y="0" width="500" height="80" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
    <text x="20" y="22" font-size="11" fill="#1a1a2e">Social scoring; subliminal manipulation;</text>
    <text x="20" y="40" font-size="11" fill="#1a1a2e">real-time biometric ID in public;</text>
    <text x="20" y="58" font-size="11" fill="#1a1a2e">predictive policing; untargeted face scraping</text>
  </g>
  <g transform="translate(800, 100)">
    <rect x="0" y="0" width="260" height="80" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#b3401b">Banned</text>
    <text x="20" y="42" font-size="11" fill="#1a1a2e">Up to 35M EUR or 7%</text>
    <text x="20" y="60" font-size="11" fill="#1a1a2e">of global turnover</text>
  </g>

  <!-- HIGH RISK -->
  <g transform="translate(70, 200)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#b3401b">HIGH RISK</text>
    <text x="20" y="50" font-size="11" font-style="italic" fill="#5a4a3a">Art. 6, Annex III</text>
    <text x="20" y="70" font-size="11" font-weight="700" fill="#b3401b">Strict regulation</text>
  </g>
  <g transform="translate(310, 200)">
    <rect x="0" y="0" width="470" height="80" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
    <text x="20" y="22" font-size="11" fill="#1a1a2e">Employment, education, credit scoring,</text>
    <text x="20" y="40" font-size="11" fill="#1a1a2e">law enforcement, justice,</text>
    <text x="20" y="58" font-size="11" fill="#1a1a2e">migration and border control</text>
  </g>
  <g transform="translate(800, 200)">
    <rect x="0" y="0" width="260" height="80" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#b3401b">Full compliance</text>
    <text x="20" y="40" font-size="11" fill="#1a1a2e">risk mgmt, data quality,</text>
    <text x="20" y="58" font-size="11" fill="#1a1a2e">docs, logs, CE mark</text>
  </g>

  <!-- LIMITED RISK -->
  <g transform="translate(100, 300)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#7a5e1a">LIMITED RISK</text>
    <text x="20" y="50" font-size="11" font-style="italic" fill="#5a4a3a">Art. 50</text>
    <text x="20" y="70" font-size="11" font-weight="700" fill="#7a5e1a">Transparency duties</text>
  </g>
  <g transform="translate(340, 300)">
    <rect x="0" y="0" width="440" height="80" rx="8" fill="#ffffff" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="11" fill="#1a1a2e">Chatbots; emotion recognition;</text>
    <text x="20" y="40" font-size="11" fill="#1a1a2e">AI-generated text, image, audio, video;</text>
    <text x="20" y="58" font-size="11" fill="#1a1a2e">synthetic media in news</text>
  </g>
  <g transform="translate(800, 300)">
    <rect x="0" y="0" width="260" height="80" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Transparency only</text>
    <text x="20" y="40" font-size="11" fill="#1a1a2e">disclose AI use,</text>
    <text x="20" y="58" font-size="11" fill="#1a1a2e">label/watermark output</text>
  </g>

  <!-- MINIMAL RISK -->
  <g transform="translate(130, 400)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#1f7a3a">MINIMAL RISK</text>
    <text x="20" y="50" font-size="11" font-style="italic" fill="#5a4a3a">Default</text>
    <text x="20" y="70" font-size="11" font-weight="700" fill="#1f7a3a">Free to deploy</text>
  </g>
  <g transform="translate(370, 400)">
    <rect x="0" y="0" width="410" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="11" fill="#1a1a2e">Spam filters; code completion;</text>
    <text x="20" y="40" font-size="11" fill="#1a1a2e">games and recommenders;</text>
    <text x="20" y="58" font-size="11" fill="#1a1a2e">inventory forecasting</text>
  </g>
  <g transform="translate(800, 400)">
    <rect x="0" y="0" width="260" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#1f7a3a">No specific duties</text>
    <text x="20" y="40" font-size="11" fill="#1a1a2e">GDPR still applies;</text>
    <text x="20" y="58" font-size="11" fill="#1a1a2e">voluntary codes</text>
  </g>

  <!-- Side label -->
  <text x="-300" y="20" font-size="11" font-weight="700" fill="#5a4a3a" transform="rotate(-90)" text-anchor="middle">decreasing risk and obligations</text>
  <line x1="22" y1="100" x2="22" y2="480" stroke="#5a4a3a" stroke-width="1.5"/>

  <!-- Takeaway -->
  <g transform="translate(40, 500)">
    <rect x="0" y="0" width="1020" height="30" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">Map your product to a tier first; the obligations follow automatically</text>
  </g>
</svg>
