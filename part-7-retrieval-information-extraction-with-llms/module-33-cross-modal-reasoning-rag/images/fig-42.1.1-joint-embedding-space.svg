<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Joint multimodal embedding space</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Joint multimodal embedding space</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each modality maps to the same vector space; cosine = similarity</text>
  <defs><linearGradient id="g_42_1_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_42_1_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_42_1_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_42_1_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_42_1_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_42_1_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_42_1_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_42_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_42_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_42_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_42_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,150)"><rect x="0" y="0" width="170" height="80" rx="10" fill="url(#g_42_1_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="85" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Image enc</text><text x="85" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">ViT / CLIP</text></g><g transform="translate(40,260)"><rect x="0" y="0" width="170" height="80" rx="10" fill="url(#g_42_1_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="85" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Text enc</text><text x="85" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">Transformer</text></g><g transform="translate(40,370)"><rect x="0" y="0" width="170" height="80" rx="10" fill="url(#g_42_1_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="85" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Audio enc</text><text x="85" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">CLAP-style</text></g><ellipse cx="650" cy="290" rx="220" ry="170" fill="url(#g_42_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="650" y="230" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">Shared embedding space</text><text x="650" y="256" font-size="12" font-weight="400" text-anchor="middle" fill="#0f3460" font-style="italic">d = 768 typical</text><circle cx="697" cy="384" r="5" fill="#0f3460"/><circle cx="520" cy="256" r="5" fill="#1f7a3a"/><circle cx="748" cy="293" r="5" fill="#0f3460"/><circle cx="744" cy="281" r="5" fill="#1f7a3a"/><circle cx="611" cy="319" r="5" fill="#722f8a"/><circle cx="644" cy="225" r="5" fill="#722f8a"/><circle cx="628" cy="326" r="5" fill="#1f7a3a"/><circle cx="575" cy="269" r="5" fill="#722f8a"/><circle cx="537" cy="365" r="5" fill="#0f3460"/><circle cx="741" cy="333" r="5" fill="#722f8a"/><circle cx="681" cy="301" r="5" fill="#0f3460"/><circle cx="604" cy="331" r="5" fill="#0f3460"/><circle cx="726" cy="323" r="5" fill="#0f3460"/><circle cx="531" cy="330" r="5" fill="#722f8a"/><circle cx="547" cy="374" r="5" fill="#0f3460"/><circle cx="500" cy="346" r="5" fill="#0f3460"/><circle cx="670" cy="252" r="5" fill="#1f7a3a"/><circle cx="666" cy="370" r="5" fill="#722f8a"/><g transform="translate(950,250)"><rect x="0" y="0" width="130" height="80" rx="10" fill="url(#g_42_1_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="65" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Cosine sim</text><text x="65" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">retrieval</text></g><line x1="211" y1="190" x2="432" y2="240" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_42_1_1)"/><line x1="211" y1="300" x2="432" y2="290" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_42_1_1)"/><line x1="211" y1="410" x2="432" y2="350" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_42_1_1)"/><line x1="870" y1="290" x2="949" y2="290" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_42_1_1)"/><g transform="translate(40,480)"><rect x="0" y="0" width="1020" height="54" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Distance is the universal query</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Once everything is a vector, search reduces to ANN lookup regardless of input modality.</text></g></svg>
