<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <title>GraphRAG: indexing pipeline and query modes</title>
  <rect width="1100" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">GraphRAG indexing and query modes</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Four indexing stages build the graph; queries pick local or global retrieval</text>

  <g transform="translate(60, 100)">
    <rect width="980" height="150" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#1a4078">Indexing pipeline (one-time, offline)</text>

    <rect x="40" y="50" width="170" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="125" y="78" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">1. Extract</text>
    <text x="125" y="100" font-size="11" text-anchor="middle" fill="#1a1a2e">entity, rel, entity</text>
    <text x="125" y="116" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">LLM per chunk</text>

    <rect x="230" y="50" width="170" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="315" y="78" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. Merge</text>
    <text x="315" y="100" font-size="11" text-anchor="middle" fill="#1a1a2e">coref resolution</text>
    <text x="315" y="116" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">"Dr. Smith" = "she"</text>

    <rect x="420" y="50" width="170" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="505" y="78" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. Cluster</text>
    <text x="505" y="100" font-size="11" text-anchor="middle" fill="#1a1a2e">community detection</text>
    <text x="505" y="116" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">Leiden algorithm</text>

    <rect x="610" y="50" width="170" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="695" y="78" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">4. Summarise</text>
    <text x="695" y="100" font-size="11" text-anchor="middle" fill="#1a1a2e">per-community summary</text>
    <text x="695" y="116" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">LLM per cluster</text>

    <g stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)">
      <line x1="210" y1="90" x2="228" y2="90"/>
      <line x1="400" y1="90" x2="418" y2="90"/>
      <line x1="590" y1="90" x2="608" y2="90"/>
    </g>

    <rect x="810" y="50" width="140" height="80" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="880" y="78" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Knowledge graph</text>
    <text x="880" y="100" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">graph DB + index</text>
    <line x1="780" y1="90" x2="808" y2="90" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>

  <line x1="880" y1="250" x2="880" y2="295" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="880" y1="295" x2="280" y2="295" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="880" y1="295" x2="780" y2="295" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="280" y1="295" x2="280" y2="320" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="780" y1="295" x2="780" y2="320" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g transform="translate(60, 320)">
    <rect width="440" height="170" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="220" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Local search</text>
    <text x="220" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">specific, entity-centric questions</text>

    <text x="30" y="86" font-size="12" fill="#1a1a2e">1. Match query to entities</text>
    <text x="30" y="108" font-size="12" fill="#1a1a2e">2. Expand to k-hop neighbourhood</text>
    <text x="30" y="130" font-size="12" fill="#1a1a2e">3. Pull chunks linked to entities</text>
  </g>

  <g transform="translate(560, 320)">
    <rect width="440" height="170" rx="10" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="220" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#a67c1a">Global search</text>
    <text x="220" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">broad, thematic questions</text>

    <text x="30" y="86" font-size="12" fill="#1a1a2e">1. Map: score community summaries</text>
    <text x="30" y="108" font-size="12" fill="#1a1a2e">2. Reduce: synthesise top summaries</text>
    <text x="30" y="130" font-size="12" fill="#1a1a2e">3. Cite contributing communities</text>
  </g>

  <g transform="translate(60, 520)">
    <rect width="980" height="80" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#a67c1a">Key idea</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">Indexing pays a one-time LLM cost (extract, merge, cluster, summarise);</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">each query then chooses local graph traversal or global map-reduce based on its scope.</text>
  </g>
</svg>
