<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>GraphRAG pipeline</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrGR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">GraphRAG pipeline</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Build a knowledge graph offline; route each query to local or global search</text>

  <!-- INDEXING phase: 4 stages -->
  <g transform="translate(40, 100)">
    <rect width="1020" height="160" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#5a4a3a">Indexing (offline, once per corpus)</text>

    <rect x="20" y="50" width="220" height="90" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="130" y="78" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Documents</text>
    <text x="130" y="106" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">chunked passages</text>

    <line x1="245" y1="95" x2="285" y2="95" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrGR)"/>

    <rect x="290" y="50" width="220" height="90" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="400" y="78" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Entity extraction</text>
    <text x="400" y="106" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">LLM produces triples</text>

    <line x1="515" y1="95" x2="555" y2="95" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrGR)"/>

    <rect x="560" y="50" width="220" height="90" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="670" y="78" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Knowledge graph</text>
    <text x="670" y="106" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">entities + relations</text>

    <line x1="785" y1="95" x2="825" y2="95" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrGR)"/>

    <rect x="830" y="50" width="170" height="90" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="915" y="78" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Communities</text>
    <text x="915" y="106" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Leiden + summaries</text>
  </g>

  <!-- QUERY phase -->
  <g transform="translate(40, 290)">
    <rect width="1020" height="200" rx="10" fill="#fff8f0" stroke="#bdbdbd" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#5a4a3a">Query (per user question)</text>

    <rect x="20" y="80" width="160" height="60" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">User query</text>

    <line x1="185" y1="110" x2="225" y2="110" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrGR)"/>

    <polygon points="230,80 320,110 230,140 280,110" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="280" y="105" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">Router</text>
    <text x="280" y="125" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">local / global</text>

    <!-- Local branch -->
    <line x1="330" y1="100" x2="380" y2="80" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrGR)"/>
    <text x="345" y="74" font-size="11" font-style="italic" fill="#5a4a3a">specific</text>

    <rect x="390" y="50" width="280" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="530" y="76" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Local search</text>
    <text x="530" y="96" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">entity neighbours + chunks</text>

    <!-- Global branch -->
    <line x1="330" y1="120" x2="380" y2="140" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrGR)"/>
    <text x="345" y="155" font-size="11" font-style="italic" fill="#5a4a3a">broad</text>

    <rect x="390" y="120" width="280" height="60" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="530" y="146" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Global search</text>
    <text x="530" y="166" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">map-reduce over summaries</text>

    <!-- Answer -->
    <line x1="675" y1="80" x2="820" y2="105" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrGR)"/>
    <line x1="675" y1="150" x2="820" y2="115" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrGR)"/>

    <rect x="830" y="80" width="170" height="60" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="915" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Answer</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 510)">
    <rect width="1020" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Specific questions hit local neighbourhoods; broad questions aggregate community summaries</text>
    <text x="510" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">Offline graph construction separates from per-query routing.</text>
  </g>
</svg>
