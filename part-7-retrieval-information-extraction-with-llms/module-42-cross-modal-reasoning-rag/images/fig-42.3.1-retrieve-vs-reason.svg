<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Retrieve vs reason: 2x2 decision rubric</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Retrieve vs reason: 2x2 decision rubric</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Query type and freshness pick the strategy</text>
  <defs><linearGradient id="g_42_3_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_42_3_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_42_3_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_42_3_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_42_3_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_42_3_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_42_3_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_42_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_42_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_42_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_42_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(160,130)"><rect x="0" y="0" width="380" height="130" rx="10" fill="url(#g_42_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="190" y="57" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Reason only</text><text x="190" y="77" font-size="11" text-anchor="middle" fill="#1a1a2e">fresh + closed-domain</text><text x="190" y="95" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">model already knows</text></g><g transform="translate(560,130)"><rect x="0" y="0" width="380" height="130" rx="10" fill="url(#g_42_3_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="190" y="57" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Retrieve + reason</text><text x="190" y="77" font-size="11" text-anchor="middle" fill="#1a1a2e">fresh + open-domain</text><text x="190" y="95" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">RAG default</text></g><g transform="translate(160,280)"><rect x="0" y="0" width="380" height="130" rx="10" fill="url(#g_42_3_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="190" y="57" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Cached reason</text><text x="190" y="77" font-size="11" text-anchor="middle" fill="#1a1a2e">stale + closed-domain</text><text x="190" y="95" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">precompute and serve</text></g><g transform="translate(560,280)"><rect x="0" y="0" width="380" height="130" rx="10" fill="url(#g_42_3_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="190" y="57" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Retrieve + tools</text><text x="190" y="77" font-size="11" text-anchor="middle" fill="#1a1a2e">stale + open-domain</text><text x="190" y="95" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">web search + LLM</text></g><text x="550" y="110" font-size="13" font-weight="400" text-anchor="middle" fill="#5a4a3a" font-style="italic">Open domain -&gt;</text><text x="120" y="270" font-size="13" font-style="italic" fill="#5a4a3a" transform="rotate(-90 120 270)">Fresh -></text><g transform="translate(40,450)"><rect x="0" y="0" width="1020" height="54" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">The split is across two axes: domain breadth and recency</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Retrieval pays off when the answer lives outside training (open-domain) or post-cutoff (fresh).</text></g></svg>
