<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Modern datasheet creation pipeline</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Modern datasheet creation pipeline</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Automated tools handle descriptive stats; humans answer ethics + intent</text>
  <defs><linearGradient id="g_57_2_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_57_2_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_57_2_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_57_2_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_57_2_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_57_2_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_57_2_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_57_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_57_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_57_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_57_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,140)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_57_2_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Raw dataset</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">any modality</text></g><g transform="translate(260,140)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_57_2_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Auto stats</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">size, dist, missing</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">scripted</text></g><g transform="translate(480,140)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_57_2_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Auto risk scan</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">PII, bias signals</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">classifiers</text></g><g transform="translate(700,140)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_57_2_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Human review</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">intent, ethics, consent</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">manual</text></g><g transform="translate(920,140)"><rect x="0" y="0" width="140" height="110" rx="10" fill="url(#g_57_2_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="70" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Datasheet</text><text x="70" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">published</text></g><line x1="241" y1="195" x2="259" y2="195" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_57_2_1)"/><line x1="461" y1="195" x2="479" y2="195" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_57_2_1)"/><line x1="681" y1="195" x2="699" y2="195" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_57_2_1)"/><line x1="901" y1="195" x2="919" y2="195" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_57_2_1)"/><g transform="translate(40,400)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Automate the boring, document the meaningful</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Stats + risk scan are programmatic; intent and consent must be answered by humans.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">End-to-end: ~1 day for a 100k-row dataset; ~1 week for a multi-modal frontier corpus.</text></g></svg>
