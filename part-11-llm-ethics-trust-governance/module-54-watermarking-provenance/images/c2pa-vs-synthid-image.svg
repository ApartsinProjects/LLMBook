<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>C2PA vs SynthID-Image</title>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">C2PA vs SynthID-Image</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Cryptographic provenance vs robust statistical watermark</text>
  <defs><linearGradient id="g_56_3_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_56_3_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_56_3_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_56_3_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_56_3_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_56_3_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_56_3_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_56_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_56_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_56_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_56_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<text x="280" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">C2PA (metadata signature)</text><g transform="translate(40,120)"><rect x="0" y="0" width="540" height="80" rx="10" fill="url(#g_56_3_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="270" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Sign at capture</text><text x="270" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">camera or model adds signed manifest</text></g><g transform="translate(40,220)"><rect x="0" y="0" width="540" height="80" rx="10" fill="url(#g_56_3_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="270" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Strip-resistant: NO</text><text x="270" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">screenshot removes manifest</text></g><g transform="translate(40,320)"><rect x="0" y="0" width="540" height="80" rx="10" fill="url(#g_56_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="270" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Strong proof when present</text><text x="270" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">cryptographic chain of custody</text></g><text x="820" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">SynthID-Image (pixel watermark)</text><g transform="translate(620,120)"><rect x="0" y="0" width="440" height="80" rx="10" fill="url(#g_56_3_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="220" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Embed at generation</text><text x="220" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">imperceptible pixel pattern</text></g><g transform="translate(620,220)"><rect x="0" y="0" width="440" height="80" rx="10" fill="url(#g_56_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="220" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Strip-resistant: PARTIAL</text><text x="220" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">survives crop / re-encode</text></g><g transform="translate(620,320)"><rect x="0" y="0" width="440" height="80" rx="10" fill="url(#g_56_3_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="220" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Statistical detection</text><text x="220" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">confidence score, not proof</text></g><g transform="translate(40,430)"><rect x="0" y="0" width="1020" height="54" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Use both together: each fails differently</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">C2PA gives you legal-grade proof; SynthID gives robustness; combined they cover both attack surfaces.</text></g></svg>
