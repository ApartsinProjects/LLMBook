<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Helvetica, Arial, sans-serif">
  <title>AI provenance ecosystem</title>
  <rect width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">AI provenance ecosystem</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Generators, distributors, and consumers cooperate via standards</text>
  <defs><linearGradient id="g_56_1_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_56_1_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_56_1_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_56_1_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_56_1_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_56_1_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_56_1_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_56_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_56_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_56_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_56_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,140)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_56_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Generators</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">OpenAI, Adobe</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">embed signature</text></g><g transform="translate(280,140)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_56_1_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Distributors</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">TikTok, YouTube</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">preserve metadata</text></g><g transform="translate(520,140)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_56_1_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Verifiers</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">Truepic, C2PA tools</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">validate chain</text></g><g transform="translate(760,140)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_56_1_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Consumers</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">browsers, apps</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">display badge</text></g><line x1="241" y1="195" x2="279" y2="195" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_56_1_1)"/><line x1="481" y1="195" x2="519" y2="195" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_56_1_1)"/><line x1="721" y1="195" x2="759" y2="195" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_56_1_1)"/><g transform="translate(280,320)"><rect x="0" y="0" width="680" height="100" rx="10" fill="url(#g_56_1_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="340" y="42" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Adversary</text><text x="340" y="62" font-size="11" text-anchor="middle" fill="#1a1a2e">screenshots, re-encodes, paraphrases</text><text x="340" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">tries to break the chain</text></g><line x1="620" y1="320" x2="620" y2="250" stroke="#b3401b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrR_56_1_1)"/><g transform="translate(40,450)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Strong provenance is a cooperative game</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Even the best watermark fails if distributors strip metadata or consumers ignore badges.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">C2PA, SynthID, and platform policies are the load-bearing pieces in 2026.</text></g></svg>
