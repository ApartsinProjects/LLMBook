<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Helvetica, Arial, sans-serif">
  <title>Watermark removal attack tree</title>
  <rect width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Watermark removal attack tree</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Branches by attack family and damage they inflict</text>
  <defs><linearGradient id="g_56_5_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_56_5_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_56_5_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_56_5_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_56_5_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_56_5_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_56_5_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_56_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_56_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_56_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_56_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(440,110)"><rect x="0" y="0" width="220" height="80" rx="10" fill="url(#g_56_5_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Watermarked image</text><text x="110" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">target</text></g><g transform="translate(40,240)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_56_5_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Geometric</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">crop, rotate, scale</text><text x="100" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">low damage</text></g><g transform="translate(260,240)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_56_5_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Compression</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">JPEG, WebP</text><text x="100" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">moderate damage</text></g><g transform="translate(480,240)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_56_5_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Filter / noise</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">blur, denoise</text><text x="100" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">moderate damage</text></g><g transform="translate(700,240)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_56_5_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Regeneration</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">diffusion-based</text><text x="100" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">high damage</text></g><g transform="translate(920,240)"><rect x="0" y="0" width="140" height="90" rx="10" fill="url(#g_56_5_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="70" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Combo</text><text x="70" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">stacks above</text></g><g transform="translate(40,400)"><rect x="0" y="0" width="1020" height="80" rx="10" fill="url(#g_56_5_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="510" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Robust watermark</text><text x="510" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">survives all but regeneration</text></g><line x1="440" y1="190" x2="140" y2="239" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_56_5_1)"/><line x1="490" y1="190" x2="360" y2="239" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_56_5_1)"/><line x1="550" y1="190" x2="580" y2="239" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_56_5_1)"/><line x1="610" y1="190" x2="800" y2="239" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_56_5_1)"/><line x1="660" y1="190" x2="990" y2="239" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_56_5_1)"/><g transform="translate(40,510)"><rect x="0" y="0" width="1020" height="54" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">The hardest attacks regenerate the image</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Diffusion-based re-synthesis defeats most pixel watermarks; only semantic watermarks (yet to mature) resist.</text></g></svg>
