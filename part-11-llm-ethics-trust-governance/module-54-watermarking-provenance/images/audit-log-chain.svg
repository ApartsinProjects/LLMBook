<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Hash-chained audit log</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Hash-chained audit log</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each entry holds the previous entry&#x27;s hash, so tampering breaks the chain</text>
  <defs><linearGradient id="g_57_4_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_57_4_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_57_4_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_57_4_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_57_4_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_57_4_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_57_4_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_57_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_57_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_57_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_57_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(60,180)"><rect x="0" y="0" width="200" height="130" rx="10" fill="url(#g_57_4_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="57" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Entry 1</text><text x="100" y="77" font-size="11" text-anchor="middle" fill="#1a1a2e">prev_hash, event, ts</text><text x="100" y="95" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">sha256(...)</text></g><line x1="260" y1="245" x2="310" y2="245" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_57_4_1)"/><g transform="translate(310,180)"><rect x="0" y="0" width="200" height="130" rx="10" fill="url(#g_57_4_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="57" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Entry 2</text><text x="100" y="77" font-size="11" text-anchor="middle" fill="#1a1a2e">prev_hash, event, ts</text><text x="100" y="95" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">sha256(...)</text></g><line x1="510" y1="245" x2="560" y2="245" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_57_4_1)"/><g transform="translate(560,180)"><rect x="0" y="0" width="200" height="130" rx="10" fill="url(#g_57_4_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="57" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Entry 3</text><text x="100" y="77" font-size="11" text-anchor="middle" fill="#1a1a2e">prev_hash, event, ts</text><text x="100" y="95" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">sha256(...)</text></g><line x1="760" y1="245" x2="810" y2="245" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_57_4_1)"/><g transform="translate(810,180)"><rect x="0" y="0" width="200" height="130" rx="10" fill="url(#g_57_4_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="57" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Entry 4</text><text x="100" y="77" font-size="11" text-anchor="middle" fill="#1a1a2e">prev_hash, event, ts</text><text x="100" y="95" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">sha256(...)</text></g><g transform="translate(60,380)"><rect x="0" y="0" width="1000" height="70" rx="10" fill="url(#g_57_4_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="500" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Tampering breaks the chain</text><text x="500" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">edit Entry 2 -&gt; Entry 3&#x27;s prev_hash mismatches -&gt; auditor flags</text></g><g transform="translate(40,470)"><rect x="0" y="0" width="1020" height="54" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Tamper-evidence is free with a hash chain</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Append-only + sha256 + storage in WORM media gets you most of the way to forensic-grade logs.</text></g></svg>
