<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Three complementary explainability views</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Three complementary explainability views</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">SHAP, attention, counterfactual: same decision, different lenses</text>
  <defs><linearGradient id="g_57_5_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_57_5_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_57_5_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_57_5_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_57_5_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_57_5_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_57_5_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_57_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_57_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_57_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_57_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,140)"><rect x="0" y="0" width="250" height="200" rx="10" fill="url(#g_57_5_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="125" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">SHAP attribution</text><text x="125" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">per-feature credit</text><text x="125" y="130" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">additive model</text></g><g transform="translate(330,140)"><rect x="0" y="0" width="250" height="200" rx="10" fill="url(#g_57_5_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="125" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Attention weights</text><text x="125" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">what the model looked at</text><text x="125" y="130" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">transformer internals</text></g><g transform="translate(620,140)"><rect x="0" y="0" width="250" height="200" rx="10" fill="url(#g_57_5_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="125" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Counterfactual</text><text x="125" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">minimal change to flip</text><text x="125" y="130" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">what would change it</text></g><g transform="translate(910,140)"><rect x="0" y="0" width="150" height="200" rx="10" fill="url(#g_57_5_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="75" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Decision</text><text x="75" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">the one we explain</text></g><line x1="290" y1="240" x2="329" y2="240" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_57_5_1)"/><line x1="580" y1="240" x2="619" y2="240" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_57_5_1)"/><line x1="870" y1="240" x2="909" y2="240" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_57_5_1)"/><g transform="translate(40,380)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">No single explanation works for everyone</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Engineers want SHAP/attention; regulators want counterfactuals; users want plain language.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Produce all three on demand; let consumers pick the lens.</text></g></svg>
