<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="Helvetica, Arial, sans-serif">
  <title>Hallucination detection-and-response pipeline</title>
  <rect width="1100" height="500" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Hallucination detection and response</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Risk tier picks the strategy</text>

  <defs>
    <linearGradient id="g37231" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#eef4fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dbe6f2" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g37232" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ecf6ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d8ecdd" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g37233" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5dc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fae9be" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g37234" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fdeee8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f9d9c9" stop-opacity="1"/>
    </linearGradient>
    <marker id="arr37231" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <!-- LLM output (input) -->
  <g transform="translate(40, 180)">
    <rect x="0" y="0" width="170" height="80" rx="10" fill="url(#g37231)" stroke="#0f3460" stroke-width="2.5"/>
    <text x="85" y="38" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">LLM output</text>
    <text x="85" y="60" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">draft answer</text>
  </g>

  <!-- Arrow into detection -->
  <line x1="210" y1="220" x2="260" y2="220" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr37231)"/>

  <!-- Detection block -->
  <g transform="translate(260, 100)">
    <rect x="0" y="0" width="320" height="240" rx="10" fill="url(#g37232)" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="160" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Detection</text>

    <!-- Sub-box: Consistency -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="280" height="50" rx="10" fill="#ffffff" stroke="#1f7a3a" stroke-width="2"/>
      <text x="140" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Consistency</text>
      <text x="140" y="40" font-size="11" text-anchor="middle" fill="#1a1a2e">sample agreement</text>
    </g>
    <!-- Sub-box: Citation -->
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="280" height="50" rx="10" fill="#ffffff" stroke="#1f7a3a" stroke-width="2"/>
      <text x="140" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Citation</text>
      <text x="140" y="40" font-size="11" text-anchor="middle" fill="#1a1a2e">source verification</text>
    </g>
    <!-- Sub-box: NLI -->
    <g transform="translate(20, 170)">
      <rect x="0" y="0" width="280" height="50" rx="10" fill="#ffffff" stroke="#1f7a3a" stroke-width="2"/>
      <text x="140" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">NLI</text>
      <text x="140" y="40" font-size="11" text-anchor="middle" fill="#1a1a2e">entailment check</text>
    </g>
  </g>

  <!-- Arrow into strategy -->
  <line x1="580" y1="220" x2="630" y2="220" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr37231)"/>

  <!-- Strategy gate -->
  <g transform="translate(630, 100)">
    <rect x="0" y="0" width="200" height="240" rx="10" fill="url(#g37233)" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="100" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#a67c1a">Risk-tier gate</text>
    <text x="100" y="60" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">confidence + risk</text>
    <text x="100" y="80" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">selects strategy</text>
    <line x1="20" y1="100" x2="180" y2="100" stroke="#a67c1a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="100" y="130" font-size="11" text-anchor="middle" fill="#1a1a2e">High stakes</text>
    <text x="100" y="148" font-size="11" text-anchor="middle" fill="#1a1a2e">+ low confidence</text>
    <text x="100" y="172" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">default abstain</text>
    <text x="100" y="200" font-size="11" text-anchor="middle" fill="#1a1a2e">Low stakes</text>
    <text x="100" y="218" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">emit answer</text>
  </g>

  <!-- Arrows fanning out to three responses -->
  <line x1="830" y1="150" x2="900" y2="120" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr37231)"/>
  <line x1="830" y1="220" x2="900" y2="220" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr37231)"/>
  <line x1="830" y1="290" x2="900" y2="320" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr37231)"/>

  <!-- Response: grounded answer -->
  <g transform="translate(900, 80)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="url(#g37232)" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="90" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Grounded answer</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">cited, verified</text>
  </g>
  <!-- Response: abstain -->
  <g transform="translate(900, 190)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="url(#g37233)" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="90" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Abstain</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">"I don't know"</text>
  </g>
  <!-- Response: human escalation -->
  <g transform="translate(900, 300)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="url(#g37234)" stroke="#b3401b" stroke-width="2.5"/>
    <text x="90" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">Human escalation</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">expert review</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 410)">
    <rect x="0" y="0" width="1020" height="60" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">High-stakes domains default to abstention when confidence is low</text>
    <text x="510" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Medical, legal, financial pipelines refuse rather than risk a confident hallucination.</text>
  </g>
</svg>
