<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">RWKV Block Architecture</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Two pre-norm sub-blocks (Time-Mixing, Channel-Mixing) with residual connections; linear-attention substitute.</text>

  <!-- Input -->
  <g transform="translate(560, 90)">
    <rect x="0" y="0" width="180" height="46" rx="6" fill="#1a1a2e" stroke="#0f3460"/>
    <text x="90" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Input  x_t</text>
    <text x="90" y="38" font-size="11" font-style="italic" text-anchor="middle" fill="#ffffff">token at time t</text>
  </g>

  <!-- Time-Mixing sub-block -->
  <g transform="translate(140, 170)">
    <rect x="0" y="0" width="500" height="280" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="250" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Time-Mixing sub-block</text>
    <text x="250" y="42" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">"attention" replacement, mixes across time</text>

    <!-- LayerNorm -->
    <g transform="translate(170, 60)">
      <rect x="0" y="0" width="160" height="38" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="80" y="24" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">LayerNorm</text>
    </g>

    <!-- R, W, K, V -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="450" height="84" rx="6" fill="#ffffff" stroke="#1a4078"/>
      <text x="225" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">R, W, K, V operations</text>
      <g transform="translate(20, 30)">
        <rect x="0" y="0" width="180" height="44" rx="4" fill="#eef4fa" stroke="#1a4078"/>
        <text x="90" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">R (Receptance)</text>
        <text x="90" y="36" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">sigmoid gate</text>
      </g>
      <g transform="translate(220, 30)">
        <rect x="0" y="0" width="210" height="44" rx="4" fill="#fef3e0" stroke="#7a5e1a"/>
        <text x="105" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">WKV  (weighted KV)</text>
        <text x="105" y="36" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">recurrent decay W along time</text>
      </g>
    </g>

    <g transform="translate(170, 230)">
      <rect x="0" y="0" width="160" height="40" rx="5" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="80" y="25" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Output projection</text>
    </g>

    <line x1="250" y1="98" x2="130" y2="158" stroke="#1a1a2e" stroke-width="1.3" marker-end="url(#arr)"/>
    <line x1="250" y1="98" x2="345" y2="158" stroke="#1a1a2e" stroke-width="1.3" marker-end="url(#arr)"/>
    <line x1="130" y1="204" x2="220" y2="228" stroke="#1a1a2e" stroke-width="1.3" marker-end="url(#arr)"/>
    <line x1="345" y1="204" x2="280" y2="228" stroke="#1a1a2e" stroke-width="1.3" marker-end="url(#arr)"/>
    <text x="170" y="222" font-size="11" fill="#5a4a3a">gates</text>
    <text x="350" y="222" font-size="11" fill="#5a4a3a">produces</text>
  </g>

  <!-- Residual Add 1 -->
  <g transform="translate(560, 480)">
    <ellipse cx="90" cy="22" rx="90" ry="22" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="90" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Residual Add</text>
  </g>
  <line x1="650" y1="138" x2="650" y2="170" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  <!-- skip from input around TM to Residual1 -->
  <path d="M 740 113 C 850 113, 850 480, 740 490" fill="none" stroke="#b3401b" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="850" y="320" font-size="11" font-weight="700" fill="#b3401b">skip</text>
  <line x1="390" y1="450" x2="600" y2="490" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Channel-Mixing sub-block (right) -->
  <g transform="translate(660, 170)">
    <rect x="0" y="0" width="480" height="280" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="240" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Channel-Mixing sub-block</text>
    <text x="240" y="42" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">"FFN" replacement, mixes across channels</text>

    <g transform="translate(160, 60)">
      <rect x="0" y="0" width="160" height="38" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="80" y="24" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">LayerNorm</text>
    </g>

    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="440" height="84" rx="6" fill="#ffffff" stroke="#722f8a"/>
      <text x="220" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">R, K operations</text>
      <g transform="translate(20, 30)">
        <rect x="0" y="0" width="180" height="44" rx="4" fill="#eef4fa" stroke="#1a4078"/>
        <text x="90" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">R (Receptance)</text>
        <text x="90" y="36" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">sigmoid gate</text>
      </g>
      <g transform="translate(220, 30)">
        <rect x="0" y="0" width="200" height="44" rx="4" fill="#f4ecf7" stroke="#722f8a"/>
        <text x="100" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">K (Key)</text>
        <text x="100" y="36" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">squared ReLU</text>
      </g>
    </g>

    <g transform="translate(160, 230)">
      <rect x="0" y="0" width="160" height="40" rx="5" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="80" y="25" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Value projection</text>
    </g>

    <line x1="240" y1="98" x2="130" y2="158" stroke="#1a1a2e" stroke-width="1.3" marker-end="url(#arr)"/>
    <line x1="240" y1="98" x2="340" y2="158" stroke="#1a1a2e" stroke-width="1.3" marker-end="url(#arr)"/>
    <line x1="130" y1="204" x2="210" y2="228" stroke="#1a1a2e" stroke-width="1.3" marker-end="url(#arr)"/>
    <line x1="340" y1="204" x2="270" y2="228" stroke="#1a1a2e" stroke-width="1.3" marker-end="url(#arr)"/>
    <text x="160" y="222" font-size="11" fill="#5a4a3a">gates</text>
    <text x="345" y="222" font-size="11" fill="#5a4a3a">produces</text>
  </g>
  <line x1="740" y1="502" x2="900" y2="450" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Residual Add 2 -->
  <g transform="translate(560, 580)">
    <ellipse cx="90" cy="22" rx="90" ry="22" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="90" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Residual Add</text>
  </g>
  <line x1="820" y1="450" x2="700" y2="582" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M 560 502 C 470 502, 470 590, 560 590" fill="none" stroke="#b3401b" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="430" y="552" font-size="11" font-weight="700" fill="#b3401b">skip</text>

  <!-- Output -->
  <g transform="translate(560, 650)">
    <rect x="0" y="0" width="180" height="46" rx="6" fill="#1a1a2e" stroke="#0f3460"/>
    <text x="90" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Output  x_{t+1}</text>
    <text x="90" y="38" font-size="11" font-style="italic" text-anchor="middle" fill="#ffffff">passed to next block</text>
  </g>
  <line x1="650" y1="624" x2="650" y2="648" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Why callout -->
  <g transform="translate(20, 480)">
    <rect x="0" y="0" width="120" height="190" rx="6" fill="#fff5dc" stroke="#d4b96a"/>
    <text x="60" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">Why RWKV?</text>
    <text x="60" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">Trains in</text>
    <text x="60" y="56" font-size="11" text-anchor="middle" fill="#1a1a2e">parallel like</text>
    <text x="60" y="70" font-size="11" text-anchor="middle" fill="#1a1a2e">a Transformer,</text>
    <text x="60" y="92" font-size="11" text-anchor="middle" fill="#1a1a2e">infers in O(1)</text>
    <text x="60" y="106" font-size="11" text-anchor="middle" fill="#1a1a2e">memory like</text>
    <text x="60" y="120" font-size="11" text-anchor="middle" fill="#1a1a2e">an RNN.</text>
    <text x="60" y="146" font-size="11" text-anchor="middle" fill="#1a1a2e">Decay W stores</text>
    <text x="60" y="160" font-size="11" text-anchor="middle" fill="#1a1a2e">past KV in a</text>
    <text x="60" y="174" font-size="11" text-anchor="middle" fill="#1a1a2e">small state.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 720)">
    <rect x="0" y="0" width="1220" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">RWKV mirrors the Transformer's two-sub-block layout (mix-time then mix-channel), but replaces softmax attention with a recurrent weighted-KV operator gated by a learned receptance, giving RNN-like inference and Transformer-like training.</text>
  </g>
</svg>
