<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">A world model: Vision, Memory, Controller</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">The classic V-M-C architecture, with the controller trained inside the memory's imagined dreams</text>

  <!-- Environment box (left) -->
  <g transform="translate(70, 320)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#1a1a2e" stroke="#1a4078" stroke-width="2"/>
    <text x="80" y="40" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Environment</text>
    <text x="80" y="70" font-size="12" text-anchor="middle" fill="#bfd6ec">observation</text>
    <text x="80" y="92" font-size="13" font-style="italic" text-anchor="middle" fill="#ffffff">o_t (raw pixels)</text>
  </g>

  <!-- V: Vision (top center) -->
  <g transform="translate(290, 110)">
    <rect x="0" y="0" width="420" height="170" rx="12" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="210" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">V: Vision Model (VAE)</text>

    <!-- Encoder -->
    <rect x="30" y="55" width="150" height="90" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="105" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Encoder</text>
    <text x="105" y="105" font-size="11" text-anchor="middle" fill="#1a1a2e">compress</text>
    <text x="105" y="121" font-size="11" text-anchor="middle" fill="#1a1a2e">observation</text>

    <!-- Latent z_t -->
    <rect x="240" y="55" width="150" height="90" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="315" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Latent z_t</text>
    <text x="315" y="105" font-size="11" text-anchor="middle" fill="#1a1a2e">compact code</text>
    <text x="315" y="121" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">~32 dims</text>

    <line x1="180" y1="100" x2="240" y2="100" stroke="#1a4078" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- M: Memory (middle right) -->
  <g transform="translate(290, 320)">
    <rect x="0" y="0" width="620" height="170" rx="12" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="310" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">M: Memory Model (RNN with mixture-density head)</text>

    <!-- h_{t-1} -->
    <rect x="20" y="55" width="120" height="90" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="80" y="85" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Hidden</text>
    <text x="80" y="108" font-size="13" font-style="italic" text-anchor="middle" fill="#1a1a2e">h_{t-1}</text>

    <!-- RNN -->
    <rect x="180" y="55" width="140" height="90" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="250" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">RNN cell</text>
    <text x="250" y="105" font-size="11" text-anchor="middle" fill="#1a1a2e">predict next</text>
    <text x="250" y="121" font-size="11" text-anchor="middle" fill="#1a1a2e">latent state</text>

    <!-- h_t -->
    <rect x="360" y="30" width="120" height="60" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="420" y="55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Hidden</text>
    <text x="420" y="76" font-size="13" font-style="italic" text-anchor="middle" fill="#1a1a2e">h_t</text>

    <!-- z_pred -->
    <rect x="360" y="110" width="120" height="50" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="420" y="132" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Predicted</text>
    <text x="420" y="151" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">z_{t+1}</text>

    <!-- internal arrows -->
    <line x1="140" y1="100" x2="180" y2="100" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="320" y1="85" x2="360" y2="60" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="320" y1="115" x2="360" y2="135" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- C: Controller (bottom center) -->
  <g transform="translate(290, 540)">
    <rect x="0" y="0" width="620" height="150" rx="12" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="310" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">C: Controller (tiny linear policy)</text>

    <!-- Concat -->
    <rect x="20" y="50" width="160" height="80" rx="8" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="100" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Concatenate</text>
    <text x="100" y="103" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">[z_t , h_t]</text>

    <!-- Linear -->
    <rect x="220" y="50" width="160" height="80" rx="8" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="300" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Linear policy</text>
    <text x="300" y="103" font-size="11" text-anchor="middle" fill="#1a1a2e">few hundred params</text>

    <!-- Action -->
    <rect x="420" y="50" width="180" height="80" rx="8" fill="#fef3e0" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="510" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Action</text>
    <text x="510" y="103" font-size="13" font-style="italic" text-anchor="middle" fill="#1a1a2e">a_t</text>

    <line x1="180" y1="90" x2="220" y2="90" stroke="#722f8a" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="380" y1="90" x2="420" y2="90" stroke="#722f8a" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Cross-block flows -->
  <g stroke="#1a1a2e" stroke-width="1.5" fill="none">
    <!-- Env -> Encoder (raw pixels) -->
    <path d="M 230 360 L 270 360 L 270 195 L 320 195" marker-end="url(#arr)"/>
    <text x="248" y="280" font-size="11" fill="#5a4a3a" font-style="italic">raw pixels</text>

    <!-- z_t -> RNN -->
    <path d="M 605 250 L 605 290 L 250 290 L 250 320" marker-end="url(#arr)"/>
    <text x="430" y="285" font-size="11" fill="#5a4a3a" font-style="italic">z_t</text>

    <!-- z_t -> Concat -->
    <path d="M 605 250 L 605 530 L 100 530 L 100 590" marker-end="url(#arr)"/>
    <text x="100" y="525" font-size="11" fill="#5a4a3a" font-style="italic">z_t</text>

    <!-- h_t -> Concat -->
    <path d="M 770 410 L 770 510 L 140 510 L 140 590" marker-end="url(#arr)"/>
    <text x="160" y="505" font-size="11" fill="#5a4a3a" font-style="italic">h_t</text>

    <!-- Action -> Env (closes the loop) -->
    <path d="M 800 670 L 150 670 L 150 440" marker-end="url(#arr)" stroke-dasharray="0"/>
    <text x="450" y="685" font-size="11" fill="#5a4a3a" font-style="italic">a_t (act in environment)</text>

    <!-- Action -> RNN (feed action back into memory) -->
    <path d="M 870 540 L 870 460 L 250 460 L 250 410" marker-end="url(#arr)"/>
    <text x="600" y="455" font-size="11" fill="#5a4a3a" font-style="italic">a_t</text>
  </g>

  <!-- Dream training callout (right side) -->
  <g transform="translate(950, 320)">
    <rect x="0" y="0" width="290" height="170" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="145" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Dream training</text>
    <text x="145" y="56" font-size="12" text-anchor="middle" fill="#1a1a2e">Controller never touches the</text>
    <text x="145" y="72" font-size="12" text-anchor="middle" fill="#1a1a2e">real environment during RL.</text>
    <text x="145" y="100" font-size="12" text-anchor="middle" fill="#1a1a2e">It learns inside M's imagined</text>
    <text x="145" y="116" font-size="12" text-anchor="middle" fill="#1a1a2e">trajectories of future latents,</text>
    <text x="145" y="132" font-size="12" text-anchor="middle" fill="#1a1a2e">then transfers back to the real</text>
    <text x="145" y="148" font-size="12" text-anchor="middle" fill="#1a1a2e">world at test time.</text>
  </g>

  <!-- Dream arrows (dashed, red) -->
  <g stroke="#b3401b" stroke-width="1.5" fill="none" stroke-dasharray="6,4">
    <path d="M 910 405 L 950 405" marker-end="url(#arrDash)"/>
    <text x="855" y="395" font-size="11" fill="#b3401b" font-style="italic">imagined z_{t+1}</text>

    <path d="M 1095 490 L 1095 615 L 600 615" marker-end="url(#arrDash)"/>
    <text x="800" y="608" font-size="11" fill="#b3401b" font-style="italic">optimizes the linear policy</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 720)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">A world model splits perception (V), prediction (M), and action (C); the tiny controller learns inside the model's dreams, so real-world interaction stays cheap.</text>
  </g>
</svg>
