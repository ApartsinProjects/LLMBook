<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Common Attention Head Types in Transformers</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Each head learns a stylised attention pattern; arrows show which earlier token the query attends to.</text>

  <!-- four panels in a row -->
  <!-- helper coordinates: each panel 290 wide, gap 20, x-start 30 -->

  <!-- PANEL 1: Previous Token -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="290" height="430" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="145" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Previous-Token Head</text>
    <text x="145" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">attends to position t − 1</text>

    <!-- token strip -->
    <g transform="translate(20, 90)">
      <rect x="0"   y="0" width="42" height="32" rx="4" fill="#ffffff" stroke="#1a4078"/>
      <text x="21"  y="21" font-size="12" text-anchor="middle" fill="#1a1a2e">The</text>
      <rect x="50"  y="0" width="42" height="32" rx="4" fill="#ffffff" stroke="#1a4078"/>
      <text x="71"  y="21" font-size="12" text-anchor="middle" fill="#1a1a2e">cat</text>
      <rect x="100" y="0" width="42" height="32" rx="4" fill="#ffffff" stroke="#1a4078"/>
      <text x="121" y="21" font-size="12" text-anchor="middle" fill="#1a1a2e">sat</text>
      <rect x="150" y="0" width="42" height="32" rx="4" fill="#ffffff" stroke="#1a4078"/>
      <text x="171" y="21" font-size="12" text-anchor="middle" fill="#1a1a2e">on</text>
      <rect x="200" y="0" width="42" height="32" rx="4" fill="#1a4078" stroke="#1a4078"/>
      <text x="221" y="21" font-size="12" text-anchor="middle" fill="#ffffff">the</text>
    </g>
    <!-- attention arrow: query "the" -> prev "on" -->
    <path d="M 240 122 C 230 160 200 160 192 130" stroke="#1a4078" stroke-width="1.8" fill="none" marker-end="url(#arrSmall)"/>
    <text x="145" y="200" font-size="11" text-anchor="middle" fill="#1a1a2e">query token (dark) looks at</text>
    <text x="145" y="216" font-size="11" text-anchor="middle" fill="#1a1a2e">the immediately preceding token</text>

    <!-- mini attention matrix -->
    <g transform="translate(60, 240)">
      <text x="85" y="-8" font-size="11" text-anchor="middle" fill="#5a4a3a">attention pattern</text>
      <!-- 5x5 grid, sub-diagonal filled -->
      <g>
        <rect x="0"  y="0"  width="30" height="30" fill="#f0f0f0" stroke="#bdbdbd"/>
        <rect x="0"  y="34" width="30" height="30" fill="#1a4078" stroke="#bdbdbd"/>
        <rect x="34" y="34" width="30" height="30" fill="#f0f0f0" stroke="#bdbdbd"/>
        <rect x="34" y="68" width="30" height="30" fill="#1a4078" stroke="#bdbdbd"/>
        <rect x="68" y="68" width="30" height="30" fill="#f0f0f0" stroke="#bdbdbd"/>
        <rect x="68" y="102" width="30" height="30" fill="#1a4078" stroke="#bdbdbd"/>
        <rect x="102" y="102" width="30" height="30" fill="#f0f0f0" stroke="#bdbdbd"/>
        <rect x="102" y="136" width="30" height="30" fill="#1a4078" stroke="#bdbdbd"/>
        <rect x="136" y="136" width="30" height="30" fill="#f0f0f0" stroke="#bdbdbd"/>
        <!-- empty other cells -->
      </g>
      <text x="85" y="180" font-size="11" text-anchor="middle" fill="#5a4a3a">rows = query, cols = key</text>
    </g>
  </g>

  <!-- PANEL 2: Induction Head -->
  <g transform="translate(340, 100)">
    <rect x="0" y="0" width="290" height="430" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="145" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Induction Head</text>
    <text x="145" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">copies a previously seen pattern</text>

    <g transform="translate(20, 90)">
      <rect x="0"   y="0" width="40" height="32" rx="4" fill="#1f7a3a" stroke="#1f7a3a"/>
      <text x="20"  y="21" font-size="11" text-anchor="middle" fill="#ffffff">A</text>
      <rect x="48"  y="0" width="40" height="32" rx="4" fill="#a8d5b3" stroke="#1f7a3a"/>
      <text x="68"  y="21" font-size="11" text-anchor="middle" fill="#1a1a2e">B</text>
      <rect x="96"  y="0" width="40" height="32" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
      <text x="116" y="21" font-size="11" text-anchor="middle" fill="#1a1a2e">C</text>
      <rect x="144" y="0" width="40" height="32" rx="4" fill="#1f7a3a" stroke="#1f7a3a"/>
      <text x="164" y="21" font-size="11" text-anchor="middle" fill="#ffffff">A</text>
      <rect x="192" y="0" width="40" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-dasharray="3 2"/>
      <text x="212" y="21" font-size="11" text-anchor="middle" fill="#b3401b">?</text>
    </g>
    <!-- arrow: "?" looks back to first "B" -->
    <path d="M 232 132 C 200 175 110 175 88 132" stroke="#1f7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrSmall)"/>
    <text x="145" y="200" font-size="11" text-anchor="middle" fill="#1a1a2e">after seeing A → B once,</text>
    <text x="145" y="216" font-size="11" text-anchor="middle" fill="#1a1a2e">the next A predicts B again</text>

    <!-- prefix matching arc -->
    <g transform="translate(40, 240)">
      <text x="105" y="-8" font-size="11" text-anchor="middle" fill="#5a4a3a">prefix match → copy</text>
      <rect x="0"   y="0" width="30" height="22" fill="#1f7a3a"/>
      <text x="15"  y="16" font-size="11" text-anchor="middle" fill="#ffffff">A</text>
      <rect x="34"  y="0" width="30" height="22" fill="#a8d5b3"/>
      <text x="49"  y="16" font-size="11" text-anchor="middle" fill="#1a1a2e">B</text>
      <text x="80" y="16" font-size="11" fill="#5a4a3a">. . .</text>
      <rect x="120" y="0" width="30" height="22" fill="#1f7a3a"/>
      <text x="135" y="16" font-size="11" text-anchor="middle" fill="#ffffff">A</text>
      <rect x="154" y="0" width="30" height="22" fill="#fdeee8" stroke="#b3401b" stroke-dasharray="3 2"/>
      <text x="169" y="16" font-size="11" text-anchor="middle" fill="#b3401b">?</text>
      <path d="M 169 0 C 169 -25 49 -25 49 0" stroke="#b3401b" stroke-width="1.5" fill="none" marker-end="url(#arrSmall)"/>
      <text x="105" y="60" font-size="11" text-anchor="middle" fill="#1f7a3a">predict: B</text>
      <text x="105" y="92" font-size="11" text-anchor="middle" fill="#5a4a3a">basis of in-context learning</text>
      <text x="105" y="106" font-size="11" text-anchor="middle" fill="#5a4a3a">(Olsson et al., 2022)</text>
    </g>
  </g>

  <!-- PANEL 3: Positional / BOS -->
  <g transform="translate(650, 100)">
    <rect x="0" y="0" width="290" height="430" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="145" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Positional Head</text>
    <text x="145" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">attends to BOS or first token</text>

    <g transform="translate(20, 90)">
      <rect x="0"   y="0" width="46" height="32" rx="4" fill="#7a5e1a" stroke="#7a5e1a"/>
      <text x="23"  y="21" font-size="11" text-anchor="middle" fill="#ffffff">[BOS]</text>
      <rect x="54"  y="0" width="40" height="32" rx="4" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="74"  y="21" font-size="11" text-anchor="middle" fill="#1a1a2e">tok</text>
      <rect x="102" y="0" width="40" height="32" rx="4" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="122" y="21" font-size="11" text-anchor="middle" fill="#1a1a2e">tok</text>
      <rect x="150" y="0" width="40" height="32" rx="4" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="170" y="21" font-size="11" text-anchor="middle" fill="#1a1a2e">tok</text>
      <rect x="198" y="0" width="40" height="32" rx="4" fill="#fef3e0" stroke="#7a5e1a"/>
      <text x="218" y="21" font-size="11" text-anchor="middle" fill="#1a1a2e">qry</text>
    </g>
    <!-- multiple arrows from each token back to BOS -->
    <path d="M 94  140 C 90  170 70  165 55  130" stroke="#7a5e1a" stroke-width="1.4" fill="none" marker-end="url(#arrSmall)"/>
    <path d="M 142 140 C 130 175 70  170 50  130" stroke="#7a5e1a" stroke-width="1.4" fill="none" marker-end="url(#arrSmall)"/>
    <path d="M 190 140 C 160 185 70  175 48  130" stroke="#7a5e1a" stroke-width="1.4" fill="none" marker-end="url(#arrSmall)"/>
    <path d="M 238 140 C 200 195 70  180 45  130" stroke="#7a5e1a" stroke-width="1.4" fill="none" marker-end="url(#arrSmall)"/>
    <text x="145" y="220" font-size="11" text-anchor="middle" fill="#1a1a2e">many queries dump attention</text>
    <text x="145" y="236" font-size="11" text-anchor="middle" fill="#1a1a2e">on BOS — an "attention sink"</text>

    <g transform="translate(60, 270)">
      <text x="85" y="-8" font-size="11" text-anchor="middle" fill="#5a4a3a">first column dominates</text>
      <rect x="0"   y="0" width="30" height="30" fill="#7a5e1a"/>
      <rect x="34"  y="0" width="30" height="30" fill="#f0f0f0"/>
      <rect x="68"  y="0" width="30" height="30" fill="#f0f0f0"/>
      <rect x="102" y="0" width="30" height="30" fill="#f0f0f0"/>
      <rect x="136" y="0" width="30" height="30" fill="#f0f0f0"/>

      <rect x="0"   y="34" width="30" height="30" fill="#7a5e1a"/>
      <rect x="34"  y="34" width="30" height="30" fill="#fef3e0"/>
      <rect x="68"  y="34" width="30" height="30" fill="#f0f0f0"/>
      <rect x="102" y="34" width="30" height="30" fill="#f0f0f0"/>
      <rect x="136" y="34" width="30" height="30" fill="#f0f0f0"/>

      <rect x="0"   y="68" width="30" height="30" fill="#7a5e1a"/>
      <rect x="34"  y="68" width="30" height="30" fill="#fef3e0"/>
      <rect x="68"  y="68" width="30" height="30" fill="#fef3e0"/>
      <rect x="102" y="68" width="30" height="30" fill="#f0f0f0"/>
      <rect x="136" y="68" width="30" height="30" fill="#f0f0f0"/>

      <rect x="0"   y="102" width="30" height="30" fill="#7a5e1a"/>
      <rect x="34"  y="102" width="30" height="30" fill="#fef3e0"/>
      <rect x="68"  y="102" width="30" height="30" fill="#fef3e0"/>
      <rect x="102" y="102" width="30" height="30" fill="#fef3e0"/>
      <rect x="136" y="102" width="30" height="30" fill="#f0f0f0"/>
    </g>
  </g>

  <!-- PANEL 4: Semantic -->
  <g transform="translate(960, 100)">
    <rect x="0" y="0" width="290" height="430" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="145" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Semantic Head</text>
    <text x="145" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">attends to topically related tokens</text>

    <g transform="translate(15, 90)">
      <rect x="0"   y="0" width="44" height="32" rx="4" fill="#d4c0e0" stroke="#722f8a"/>
      <text x="22"  y="21" font-size="11" text-anchor="middle" fill="#1a1a2e">Paris</text>
      <rect x="52"  y="0" width="38" height="32" rx="4" fill="#ffffff" stroke="#722f8a"/>
      <text x="71"  y="21" font-size="11" text-anchor="middle" fill="#1a1a2e">is</text>
      <rect x="98"  y="0" width="32" height="32" rx="4" fill="#ffffff" stroke="#722f8a"/>
      <text x="114" y="21" font-size="11" text-anchor="middle" fill="#1a1a2e">a</text>
      <rect x="138" y="0" width="44" height="32" rx="4" fill="#d4c0e0" stroke="#722f8a"/>
      <text x="160" y="21" font-size="11" text-anchor="middle" fill="#1a1a2e">city</text>
      <rect x="190" y="0" width="38" height="32" rx="4" fill="#ffffff" stroke="#722f8a"/>
      <text x="209" y="21" font-size="11" text-anchor="middle" fill="#1a1a2e">in</text>
      <rect x="236" y="0" width="44" height="32" rx="4" fill="#722f8a" stroke="#722f8a"/>
      <text x="258" y="21" font-size="11" text-anchor="middle" fill="#ffffff">France</text>
    </g>
    <!-- arrows: France -> Paris and France -> city -->
    <path d="M 273 140 C 240 195 60 195 35 130" stroke="#722f8a" stroke-width="1.8" fill="none" marker-end="url(#arrSmall)"/>
    <path d="M 273 140 C 250 175 180 175 168 130" stroke="#722f8a" stroke-width="1.8" fill="none" marker-end="url(#arrSmall)"/>
    <text x="145" y="220" font-size="11" text-anchor="middle" fill="#1a1a2e">"France" attends to topically</text>
    <text x="145" y="236" font-size="11" text-anchor="middle" fill="#1a1a2e">related tokens (Paris, city),</text>
    <text x="145" y="252" font-size="11" text-anchor="middle" fill="#1a1a2e">not just nearby ones</text>

    <g transform="translate(30, 290)">
      <text x="115" y="-10" font-size="11" text-anchor="middle" fill="#5a4a3a">scattered, content-driven pattern</text>
      <!-- random scattered bright cells -->
      <g>
        <rect x="0"   y="0"  width="32" height="20" fill="#722f8a"/>
        <rect x="34"  y="0"  width="32" height="20" fill="#f0f0f0"/>
        <rect x="68"  y="0"  width="32" height="20" fill="#d4c0e0"/>
        <rect x="102" y="0"  width="32" height="20" fill="#f0f0f0"/>
        <rect x="136" y="0"  width="32" height="20" fill="#722f8a"/>
        <rect x="170" y="0"  width="32" height="20" fill="#f0f0f0"/>
        <rect x="204" y="0"  width="32" height="20" fill="#d4c0e0"/>

        <rect x="0"   y="24" width="32" height="20" fill="#f0f0f0"/>
        <rect x="34"  y="24" width="32" height="20" fill="#722f8a"/>
        <rect x="68"  y="24" width="32" height="20" fill="#f0f0f0"/>
        <rect x="102" y="24" width="32" height="20" fill="#d4c0e0"/>
        <rect x="136" y="24" width="32" height="20" fill="#f0f0f0"/>
        <rect x="170" y="24" width="32" height="20" fill="#722f8a"/>
        <rect x="204" y="24" width="32" height="20" fill="#f0f0f0"/>

        <rect x="0"   y="48" width="32" height="20" fill="#d4c0e0"/>
        <rect x="34"  y="48" width="32" height="20" fill="#f0f0f0"/>
        <rect x="68"  y="48" width="32" height="20" fill="#722f8a"/>
        <rect x="102" y="48" width="32" height="20" fill="#f0f0f0"/>
        <rect x="136" y="48" width="32" height="20" fill="#d4c0e0"/>
        <rect x="170" y="48" width="32" height="20" fill="#f0f0f0"/>
        <rect x="204" y="48" width="32" height="20" fill="#722f8a"/>
      </g>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 605)">
    <rect x="0" y="0" width="1220" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Mechanistic interpretability finds these recurring head families across many models; previous-token and induction heads in particular underpin in-context</text>
    <text x="20" y="62" font-size="12" fill="#1a1a2e">learning, while positional sinks and semantic heads explain memory routing and content-based retrieval inside the residual stream.</text>
  </g>
</svg>
