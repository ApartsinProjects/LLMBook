<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrDot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a5e1a"/>
    </marker>
  </defs>
  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Mamba Block Architecture</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">A selective state-space model gated by an input-dependent branch; linear-time alternative to attention.</text>

  <!-- Input -->
  <g transform="translate(560, 90)">
    <rect x="0" y="0" width="180" height="46" rx="6" fill="#1a1a2e" stroke="#0f3460"/>
    <text x="90" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Input  x</text>
    <text x="90" y="38" font-size="11" font-style="italic" text-anchor="middle" fill="#ffffff">sequence tokens</text>
  </g>

  <!-- Two branches -->
  <g transform="translate(120, 170)">
    <rect x="0" y="0" width="500" height="380" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="250" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Main branch (data path)</text>

    <g transform="translate(120, 50)">
      <rect x="0" y="0" width="260" height="46" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="130" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Linear projection</text>
      <text x="130" y="38" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">expand dim</text>
    </g>

    <g transform="translate(120, 120)">
      <rect x="0" y="0" width="260" height="46" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="130" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Conv1D</text>
      <text x="130" y="38" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">local context</text>
    </g>

    <g transform="translate(120, 190)">
      <rect x="0" y="0" width="260" height="40" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="130" y="25" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">SiLU activation</text>
    </g>

    <g transform="translate(70, 260)">
      <rect x="0" y="0" width="360" height="100" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
      <text x="180" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Selective SSM</text>
      <text x="180" y="42" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">selective scan over hidden state h_t</text>
      <text x="180" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">h_t = A_bar(x) h_{t-1} + B_bar(x) x_t</text>
      <text x="180" y="82" font-size="11" text-anchor="middle" fill="#1a1a2e">y_t = C(x) h_t</text>
    </g>

    <line x1="250" y1="96" x2="250" y2="118" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="250" y1="166" x2="250" y2="188" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="250" y1="230" x2="250" y2="258" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>

  <!-- Gate branch -->
  <g transform="translate(680, 170)">
    <rect x="0" y="0" width="320" height="380" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="160" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Gate branch (modulation)</text>

    <g transform="translate(50, 80)">
      <rect x="0" y="0" width="220" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="110" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Linear projection</text>
      <text x="110" y="38" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">expand dim</text>
    </g>
    <g transform="translate(50, 170)">
      <rect x="0" y="0" width="220" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="110" y="27" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">SiLU activation</text>
    </g>
    <line x1="160" y1="130" x2="160" y2="168" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>

    <text x="160" y="244" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">acts as a sigmoid-like gate</text>
    <text x="160" y="262" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">on the SSM output</text>
  </g>

  <!-- Input splits to both branches -->
  <line x1="650" y1="138" x2="370" y2="218" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="650" y1="138" x2="840" y2="248" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Selective parameters callout (right side) -->
  <g transform="translate(1020, 170)">
    <rect x="0" y="0" width="260" height="200" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="130" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Input-dependent params</text>
    <text x="130" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">make the SSM "selective"</text>

    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="220" height="36" rx="4" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#1a1a2e">B(x)  input matrix</text>
    </g>
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="220" height="36" rx="4" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#1a1a2e">C(x)  output matrix</text>
    </g>
    <g transform="translate(20, 144)">
      <rect x="0" y="0" width="220" height="36" rx="4" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#1a1a2e">delta(x)  step size</text>
    </g>
  </g>

  <!-- dotted projections from main SiLU into selective params, then into SSM -->
  <path d="M 500 380 C 700 380, 900 270, 1015 270" fill="none" stroke="#7a5e1a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrDot)"/>
  <text x="900" y="300" font-size="11" fill="#7a5e1a">projects into B, C, delta</text>
  <path d="M 1020 270 C 880 270, 700 470, 500 470" fill="none" stroke="#7a5e1a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrDot)"/>
  <text x="800" y="500" font-size="11" fill="#7a5e1a">feeds back into Selective SSM</text>

  <!-- Multiply gate -->
  <g transform="translate(560, 580)">
    <ellipse cx="90" cy="22" rx="90" ry="22" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="90" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Multiply (gate)</text>
  </g>
  <line x1="370" y1="500" x2="600" y2="580" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="840" y1="430" x2="700" y2="580" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Output projection + output -->
  <g transform="translate(560, 650)">
    <rect x="0" y="0" width="180" height="44" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="90" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Output projection</text>
    <text x="90" y="38" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">reduce dim</text>
  </g>
  <line x1="650" y1="624" x2="650" y2="648" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>

  <g transform="translate(560, 712)">
    <rect x="0" y="0" width="180" height="40" rx="6" fill="#1a1a2e" stroke="#0f3460"/>
    <text x="90" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Output  y</text>
    <text x="90" y="34" font-size="11" font-style="italic" text-anchor="middle" fill="#ffffff">same shape as x</text>
  </g>
  <line x1="650" y1="694" x2="650" y2="710" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Why callout -->
  <g transform="translate(20, 580)">
    <rect x="0" y="0" width="220" height="170" rx="6" fill="#fff5dc" stroke="#d4b96a"/>
    <text x="14" y="20" font-size="12" font-weight="700" fill="#7a5e1a">Why selective?</text>
    <text x="14" y="40" font-size="11" fill="#1a1a2e">Classical SSMs use fixed</text>
    <text x="14" y="54" font-size="11" fill="#1a1a2e">A, B, C; they cannot decide</text>
    <text x="14" y="68" font-size="11" fill="#1a1a2e">what to remember.</text>
    <text x="14" y="92" font-size="11" fill="#1a1a2e">Mamba lets B, C, and delta</text>
    <text x="14" y="106" font-size="11" fill="#1a1a2e">depend on the input,</text>
    <text x="14" y="120" font-size="11" fill="#1a1a2e">enabling content-aware</text>
    <text x="14" y="134" font-size="11" fill="#1a1a2e">forgetting and selective</text>
    <text x="14" y="148" font-size="11" fill="#1a1a2e">recall, like attention but</text>
    <text x="14" y="162" font-size="11" fill="#1a1a2e">at O(L) cost.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 760)">
    <rect x="0" y="0" width="1220" height="34" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="12" fill="#1a1a2e"><tspan font-weight="700" fill="#1f7a3a">Key idea  </tspan>Mamba pairs a selective SSM with a sigmoid-style gate, giving content-dependent memory at linear cost in sequence length.</text>
  </g>
</svg>
