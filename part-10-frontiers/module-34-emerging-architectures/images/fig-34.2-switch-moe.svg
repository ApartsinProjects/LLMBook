<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrMute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Switch Transformer MoE Layer</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">A router sends each token to exactly one expert FFN; only the chosen experts compute.</text>

  <!-- Input tokens row -->
  <g transform="translate(0, 100)">
    <text x="120" y="0" font-size="13" font-weight="700" fill="#1a4078">Input tokens</text>
    <g transform="translate(120, 14)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#1a1a2e" stroke="#0f3460"/>
      <text x="40" y="25" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Token 1</text>
    </g>
    <g transform="translate(220, 14)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#1a1a2e" stroke="#0f3460"/>
      <text x="40" y="25" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Token 2</text>
    </g>
    <g transform="translate(320, 14)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#1a1a2e" stroke="#0f3460"/>
      <text x="40" y="25" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Token 3</text>
    </g>
    <g transform="translate(420, 14)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#1a1a2e" stroke="#0f3460"/>
      <text x="40" y="25" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Token 4</text>
    </g>
  </g>

  <!-- Self-Attention -->
  <g transform="translate(120, 180)">
    <rect x="0" y="0" width="380" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="190" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Self-Attention Layer</text>
    <text x="190" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">standard multi-head attention</text>
  </g>
  <line x1="160" y1="154" x2="180" y2="178" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="260" y1="154" x2="265" y2="178" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="360" y1="154" x2="345" y2="178" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="460" y1="154" x2="430" y2="178" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- LayerNorm + Residual -->
  <g transform="translate(120, 250)">
    <rect x="0" y="0" width="380" height="40" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="190" y="25" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">LayerNorm + Residual</text>
  </g>
  <line x1="310" y1="230" x2="310" y2="248" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Router (the centerpiece) -->
  <g transform="translate(120, 320)">
    <rect x="0" y="0" width="380" height="80" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="190" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Router Network</text>
    <text x="190" y="46" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">softmax over experts; each token picks top-1</text>
    <text x="190" y="66" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">scoring matrix W_r in R^(d x N)</text>
  </g>
  <line x1="310" y1="290" x2="310" y2="318" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Expert pool -->
  <g transform="translate(540, 320)">
    <rect x="0" y="0" width="600" height="200" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="300" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Expert FFN pool</text>
    <text x="300" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">N independent feed-forward networks</text>

    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="120" height="120" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="2"/>
      <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Expert 1</text>
      <text x="60" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">FFN</text>
      <rect x="14" y="60" width="92" height="22" rx="3" fill="#fef3e0" stroke="#7a5e1a"/>
      <text x="60" y="76" font-size="11" text-anchor="middle" fill="#1a1a2e">tokens 1, 3</text>
      <text x="60" y="100" font-size="11" text-anchor="middle" fill="#1f7a3a" font-weight="700">ACTIVE</text>
    </g>

    <g transform="translate(160, 60)">
      <rect x="0" y="0" width="120" height="120" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="2"/>
      <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Expert 2</text>
      <text x="60" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">FFN</text>
      <rect x="14" y="60" width="92" height="22" rx="3" fill="#fef3e0" stroke="#7a5e1a"/>
      <text x="60" y="76" font-size="11" text-anchor="middle" fill="#1a1a2e">token 2</text>
      <text x="60" y="100" font-size="11" text-anchor="middle" fill="#1f7a3a" font-weight="700">ACTIVE</text>
    </g>

    <g transform="translate(300, 60)">
      <rect x="0" y="0" width="120" height="120" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#5a4a3a">Expert 3</text>
      <text x="60" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">FFN</text>
      <rect x="14" y="60" width="92" height="22" rx="3" fill="#f0f0f0" stroke="#5a4a3a"/>
      <text x="60" y="76" font-size="11" text-anchor="middle" fill="#5a4a3a">none</text>
      <text x="60" y="100" font-size="11" text-anchor="middle" fill="#5a4a3a" font-weight="700">SKIPPED</text>
    </g>

    <g transform="translate(440, 60)">
      <rect x="0" y="0" width="120" height="120" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="2"/>
      <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Expert N</text>
      <text x="60" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">FFN</text>
      <rect x="14" y="60" width="92" height="22" rx="3" fill="#fef3e0" stroke="#7a5e1a"/>
      <text x="60" y="76" font-size="11" text-anchor="middle" fill="#1a1a2e">token 4</text>
      <text x="60" y="100" font-size="11" text-anchor="middle" fill="#1f7a3a" font-weight="700">ACTIVE</text>
    </g>
  </g>

  <!-- Router to experts arrows -->
  <path d="M 500 360 C 540 360, 540 390, 580 390" fill="none" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="540" y="354" font-size="11" fill="#1a1a2e">tokens 1, 3</text>
  <path d="M 500 370 C 600 370, 660 400, 720 390" fill="none" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="610" y="368" font-size="11" fill="#1a1a2e">token 2</text>
  <path d="M 500 380 C 700 380, 780 400, 860 390" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrMute)"/>
  <text x="730" y="378" font-size="11" fill="#5a4a3a">(unused)</text>
  <path d="M 500 390 C 800 390, 900 410, 1000 390" fill="none" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="850" y="388" font-size="11" fill="#1a1a2e">token 4</text>

  <!-- Combine and output -->
  <g transform="translate(540, 550)">
    <rect x="0" y="0" width="600" height="46" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="300" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Weighted Combine</text>
    <text x="300" y="38" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">router score x expert output</text>
  </g>
  <line x1="600" y1="520" x2="700" y2="548" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="740" y1="520" x2="800" y2="548" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="1020" y1="520" x2="950" y2="548" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>

  <g transform="translate(540, 620)">
    <rect x="0" y="0" width="600" height="40" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="300" y="25" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">LayerNorm + Residual  ->  Output Tokens</text>
  </g>
  <line x1="840" y1="596" x2="840" y2="618" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Why callout -->
  <g transform="translate(20, 420)">
    <rect x="0" y="0" width="100" height="240" rx="6" fill="#fff5dc" stroke="#d4b96a"/>
    <text x="50" y="20" font-size="11" font-weight="700" text-anchor="middle" fill="#7a5e1a">Why MoE?</text>
    <text x="50" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">Trillions of</text>
    <text x="50" y="56" font-size="11" text-anchor="middle" fill="#1a1a2e">parameters,</text>
    <text x="50" y="70" font-size="11" text-anchor="middle" fill="#1a1a2e">but only one</text>
    <text x="50" y="84" font-size="11" text-anchor="middle" fill="#1a1a2e">FFN runs per</text>
    <text x="50" y="98" font-size="11" text-anchor="middle" fill="#1a1a2e">token. Compute</text>
    <text x="50" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">stays close</text>
    <text x="50" y="126" font-size="11" text-anchor="middle" fill="#1a1a2e">to a dense</text>
    <text x="50" y="140" font-size="11" text-anchor="middle" fill="#1a1a2e">model of one</text>
    <text x="50" y="154" font-size="11" text-anchor="middle" fill="#1a1a2e">expert size.</text>
    <line x1="10" y1="170" x2="90" y2="170" stroke="#d4b96a"/>
    <text x="50" y="188" font-size="11" font-weight="700" text-anchor="middle" fill="#7a5e1a">Watch out</text>
    <text x="50" y="206" font-size="11" text-anchor="middle" fill="#1a1a2e">Load imbalance,</text>
    <text x="50" y="220" font-size="11" text-anchor="middle" fill="#1a1a2e">add aux loss to</text>
    <text x="50" y="234" font-size="11" text-anchor="middle" fill="#1a1a2e">balance experts.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 700)">
    <rect x="0" y="0" width="1220" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Switch routing turns a wide FFN into a sparse mixture: capacity scales with the number of experts, while per-token compute stays at one expert. The router is the only learned coordinator.</text>
  </g>
</svg>
