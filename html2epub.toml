# html2epub config for "Building Language AI: From Tokens to Agents"
# Run: python -m html2epub build .
[book]
title = "Building Language AI: From Tokens to Agents"
subtitle = "A practitioner's guide to large language models, retrieval-augmented generation, fine-tuning, and agentic systems"
edition = "Second Edition"
language = "en"
identifier = "urn:uuid:6a9170ca-2f8c-4b06-a557-addc5741d575"
publisher = "Apartsin & Aperstein"
rights = "Copyright (c) 2026 Alexander Apartsin and Yehudit Aperstein. All rights reserved."
publication_date = "2026-06-18"
description = """A practitioner's guide to language AI across the full stack: tokens, embeddings, \
attention, transformer architectures, prompting, retrieval-augmented generation, fine-tuning, \
alignment, multimodal systems, agents, evaluation, security, governance, scalable serving, \
LLMOps, and real-world applications. Every core idea is built from first principles and then \
shown with the modern libraries and tools that make it practical, with extensive diagrams, \
runnable code, case studies, exercises, and implementation guidance."""
keywords = [
  "large language models LLM transformer PyTorch tutorial",
  "retrieval augmented generation RAG vector database",
  "prompt engineering agents LangChain LangGraph",
  "fine tuning LoRA QLoRA RLHF DPO alignment",
  "LLMOps evaluation observability guardrails",
  "multimodal AI language vision audio agents",
  "AI security governance responsible AI",
]

[[book.authors]]
name = "Alexander Apartsin"
file_as = "Apartsin, Alexander"
role = "aut"

[[book.authors]]
name = "Yehudit Aperstein"
file_as = "Aperstein, Yehudit"
role = "aut"

[content]
source_dir = "."
spine = "auto"
front_matter_dir = "front-matter"
parts_glob = "part-*"
module_glob = "module-*"
appendices_dir = "appendices"
capstone_dir = "capstone"
section_glob = "section-*.html"
fm_order = [
  "foreword.html",
  "fm-what-this-book-covers.html",
  "fm-who-should-read.html",
  "look-inside-preview.html",
  "fm-how-to-use.html",
  "about-authors.html",
  "about-the-series.html",
  "copyright.html",
]

[styling]
stylesheets = ["styles/book.css", "styles/pygments.css"]

[math]
render = "katex"
node_exe = "node"
katex_path = "KDP/build/node_modules"

[images]
max_side = 1100
jpeg_quality = 80
compress_pngs = true

[cover]
path = "KDP/cover/cover_kdp.jpg"

[transforms]
wide_table_min_cols = 6
slim_index_lists = true
drop_inline_style_over = 1500
drop_selectors = [
  ".no-epub",
  ".header-search",
  "script[src*='pagefind']",
  "link[href*='pagefind']",
  "script[src*='analytics']",
  "script[src*='book.js']",
]

[output]
epub = "KDP/output/building-language-ai.epub"

[optimize]
repair_entities = true
