<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>Durable workflow frameworks: Temporal vs Inngest vs LangGraph</title>
  <rect width="1100" height="560" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Three durable workflow frameworks</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Pick by infrastructure tolerance and persistence model</text>

  <!-- Temporal -->
  <g transform="translate(40, 100)">
    <rect width="320" height="320" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <rect x="0" y="0" width="320" height="56" rx="10" fill="#1a4078"/>
    <text x="160" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Temporal</text>
    <text x="160" y="48" font-size="11" font-style="italic" text-anchor="middle" fill="#eef4fa">infrastructure-level</text>

    <text x="20" y="86" font-size="11" font-weight="700" fill="#1a4078">PERSISTENCE</text>
    <text x="20" y="108" font-size="12" fill="#1a1a2e">event-history replay</text>

    <text x="20" y="138" font-size="11" font-weight="700" fill="#1a4078">DETERMINISM</text>
    <text x="20" y="160" font-size="12" fill="#1a1a2e">strict, compiler-enforced</text>

    <text x="20" y="190" font-size="11" font-weight="700" fill="#b3401b">COST</text>
    <text x="20" y="212" font-size="12" fill="#1a1a2e">runs a dedicated cluster</text>

    <rect x="20" y="240" width="280" height="60" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="160" y="262" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">Choose when</text>
    <text x="160" y="284" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">multi-day workflows need exactly-once</text>
  </g>

  <!-- Inngest -->
  <g transform="translate(390, 100)">
    <rect width="320" height="320" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <rect x="0" y="0" width="320" height="56" rx="10" fill="#1f7a3a"/>
    <text x="160" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Inngest</text>
    <text x="160" y="48" font-size="11" font-style="italic" text-anchor="middle" fill="#ecf6ee">event-driven</text>

    <text x="20" y="86" font-size="11" font-weight="700" fill="#1f7a3a">PERSISTENCE</text>
    <text x="20" y="108" font-size="12" fill="#1a1a2e">per-step memoization</text>

    <text x="20" y="138" font-size="11" font-weight="700" fill="#1f7a3a">DETERMINISM</text>
    <text x="20" y="160" font-size="12" fill="#1a1a2e">loose at step boundaries</text>

    <text x="20" y="190" font-size="11" font-weight="700" fill="#b3401b">COST</text>
    <text x="20" y="212" font-size="12" fill="#1a1a2e">SaaS pricing per run</text>

    <rect x="20" y="240" width="280" height="60" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="160" y="262" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">Choose when</text>
    <text x="160" y="284" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">event-driven jobs, minimal ops</text>
  </g>

  <!-- LangGraph -->
  <g transform="translate(740, 100)">
    <rect width="320" height="320" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <rect x="0" y="0" width="320" height="56" rx="10" fill="#722f8a"/>
    <text x="160" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">LangGraph</text>
    <text x="160" y="48" font-size="11" font-style="italic" text-anchor="middle" fill="#f4ecf7">application-level</text>

    <text x="20" y="86" font-size="11" font-weight="700" fill="#722f8a">PERSISTENCE</text>
    <text x="20" y="108" font-size="12" fill="#1a1a2e">per-node snapshots</text>

    <text x="20" y="138" font-size="11" font-weight="700" fill="#722f8a">DETERMINISM</text>
    <text x="20" y="160" font-size="12" fill="#1a1a2e">you manage state</text>

    <text x="20" y="190" font-size="11" font-weight="700" fill="#b3401b">COST</text>
    <text x="20" y="212" font-size="12" fill="#1a1a2e">one Python library</text>

    <rect x="20" y="240" width="280" height="60" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="160" y="262" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">Choose when</text>
    <text x="160" y="284" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">in-app agent state, HITL pauses</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 450)">
    <rect width="1020" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Pick the lowest abstraction that meets your durability needs</text>
    <text x="510" y="54" font-size="12" text-anchor="middle" fill="#1a1a2e">LangGraph for in-app agent state. Inngest for event-driven jobs. Temporal when guarantees justify the cluster.</text>
  </g>
</svg>
