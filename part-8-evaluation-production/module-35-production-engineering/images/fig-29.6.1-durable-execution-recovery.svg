<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>Durable execution recovery</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrDE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Durable execution recovery</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">A crashed workflow replays history and resumes at the failed step</text>

  <!-- Lane 1: Normal -->
  <g transform="translate(40, 100)">
    <rect width="1020" height="110" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Normal execution</text>

    <rect x="20" y="40" width="220" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="130" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Search web</text>
    <text x="130" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">checkpointed</text>

    <line x1="245" y1="70" x2="275" y2="70" stroke="#5a4a3a" stroke-width="1.8" marker-end="url(#arrDE)"/>

    <rect x="280" y="40" width="220" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="390" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Extract content</text>
    <text x="390" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">checkpointed</text>

    <line x1="505" y1="70" x2="535" y2="70" stroke="#5a4a3a" stroke-width="1.8" marker-end="url(#arrDE)"/>

    <rect x="540" y="40" width="220" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="650" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">LLM summarize</text>
    <text x="650" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">checkpointed</text>

    <line x1="765" y1="70" x2="795" y2="70" stroke="#5a4a3a" stroke-width="1.8" marker-end="url(#arrDE)"/>

    <rect x="800" y="40" width="200" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="900" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Final report</text>
    <text x="900" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">delivered</text>
  </g>

  <!-- Lane 2: Crash -->
  <g transform="translate(40, 230)">
    <rect width="1020" height="110" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#b3401b">Crash at step 3</text>

    <rect x="20" y="40" width="220" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="130" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Search web</text>
    <text x="130" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">recorded</text>

    <rect x="280" y="40" width="220" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="390" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Extract content</text>
    <text x="390" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">recorded</text>

    <rect x="540" y="40" width="220" height="60" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="650" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">LLM summarize</text>
    <text x="650" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">CRASH</text>

    <rect x="800" y="40" width="200" height="60" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="900" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#5a4a3a">Final report</text>
    <text x="900" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">never reached</text>
  </g>

  <!-- Lane 3: Recovery -->
  <g transform="translate(40, 360)">
    <rect width="1020" height="120" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1a4078">Durable recovery</text>

    <rect x="20" y="40" width="220" height="70" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="130" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Replay step 1</text>
    <text x="130" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">cached, no side effect</text>

    <line x1="245" y1="75" x2="275" y2="75" stroke="#722f8a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrDE)"/>

    <rect x="280" y="40" width="220" height="70" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="390" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Replay step 2</text>
    <text x="390" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">cached, no side effect</text>

    <line x1="505" y1="75" x2="535" y2="75" stroke="#722f8a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrDE)"/>

    <rect x="540" y="40" width="220" height="70" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="650" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">Re-execute step 3</text>
    <text x="650" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">fresh LLM call</text>

    <line x1="765" y1="75" x2="795" y2="75" stroke="#1a4078" stroke-width="1.8" marker-end="url(#arrDE)"/>

    <rect x="800" y="40" width="200" height="70" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="900" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">Execute step 4</text>
    <text x="900" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">workflow completes</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 500)">
    <rect width="1020" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Completed steps replay deterministically; execution restarts where it failed</text>
    <text x="510" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">Without it, a step-3 crash forces a full re-run, paying for steps 1 and 2 a second time.</text>
  </g>
</svg>
