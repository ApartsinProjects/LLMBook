<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>Kubernetes stack for LLM workloads</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Three layers of a K8s LLM stack</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Workloads on top, orchestration in the middle, GPU infrastructure at the base</text>

  <g transform="translate(60, 100)">
    <rect width="980" height="100" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#722f8a">Layer 1: LLM workloads</text>

    <rect x="40" y="42" width="430" height="46" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="255" y="71" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Distributed training</text>

    <rect x="510" y="42" width="430" height="46" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="725" y="71" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Model serving</text>
  </g>

  <line x1="275" y1="200" x2="275" y2="225" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="825" y1="200" x2="825" y2="225" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g transform="translate(60, 230)">
    <rect width="980" height="140" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#1a4078">Layer 2: Kubernetes orchestration</text>

    <rect x="40" y="50" width="200" height="76" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="140" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Kueue</text>
    <text x="140" y="104" font-size="11" text-anchor="middle" fill="#5a4a3a">queue + quotas</text>

    <rect x="250" y="50" width="200" height="76" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="350" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Volcano</text>
    <text x="350" y="104" font-size="11" text-anchor="middle" fill="#5a4a3a">gang scheduling</text>

    <rect x="500" y="50" width="200" height="76" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="600" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">KServe</text>
    <text x="600" y="104" font-size="11" text-anchor="middle" fill="#5a4a3a">canary + routing</text>

    <rect x="710" y="50" width="230" height="76" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="825" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Custom HPA</text>
    <text x="825" y="104" font-size="11" text-anchor="middle" fill="#5a4a3a">scale on queue + GPU</text>
  </g>

  <line x1="275" y1="370" x2="275" y2="395" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="825" y1="370" x2="825" y2="395" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g transform="translate(60, 400)">
    <rect width="980" height="100" rx="10" fill="#1a1a2e" stroke="#0f1f3a" stroke-width="2.5"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#ffffff">Layer 3: GPU infrastructure</text>

    <rect x="40" y="42" width="430" height="46" rx="6" fill="#2a2a44" stroke="#fef3e0" stroke-width="1.5"/>
    <text x="255" y="71" font-size="13" font-weight="700" text-anchor="middle" fill="#fef3e0">NVIDIA GPU Operator</text>

    <rect x="510" y="42" width="430" height="46" rx="6" fill="#2a2a44" stroke="#ffffff" stroke-width="1.5"/>
    <text x="725" y="71" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">GPU nodes (A100, H100)</text>
  </g>

  <g transform="translate(60, 520)">
    <rect width="980" height="64" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Training and inference share one GPU floor but use different orchestration: Kueue/Volcano for batch jobs, KServe + HPA for online serving.</text>
  </g>
</svg>
