<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <title>Saga pattern: forward then compensate</title>
  <rect width="1100" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Saga: forward then compensate</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Failed step rolls back by running registered undos in reverse order</text>

  <text x="60" y="110" font-size="13" font-weight="700" fill="#1f7a3a">Forward path</text>

  <g transform="translate(60, 130)">
    <rect width="200" height="74" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="100" y="34" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">1. Book flight</text>
    <text x="100" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">register cancel_flight</text>
  </g>
  <line x1="260" y1="167" x2="290" y2="167" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(290, 130)">
    <rect width="200" height="74" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="100" y="34" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">2. Book hotel</text>
    <text x="100" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">register cancel_hotel</text>
  </g>
  <line x1="490" y1="167" x2="520" y2="167" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(520, 130)">
    <rect width="200" height="74" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="100" y="34" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">3. Generate itinerary</text>
    <text x="100" y="56" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">FAILS</text>
  </g>

  <line x1="720" y1="167" x2="760" y2="167" stroke="#b3401b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="740" y="158" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">trigger rollback</text>

  <g transform="translate(770, 130)">
    <rect width="220" height="74" rx="10" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="110" y="34" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Cancel hotel</text>
    <text x="110" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#a67c1a">undo step 2</text>
  </g>

  <text x="60" y="260" font-size="13" font-weight="700" fill="#a67c1a">Compensation path (LIFO)</text>

  <line x1="880" y1="220" x2="880" y2="290" stroke="#a67c1a" stroke-width="2" marker-end="url(#arrAmber)"/>

  <g transform="translate(770, 290)">
    <rect width="220" height="74" rx="10" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="110" y="34" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Cancel flight</text>
    <text x="110" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#a67c1a">undo step 1</text>
  </g>

  <line x1="770" y1="327" x2="320" y2="327" stroke="#a67c1a" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="545" y="318" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">reverse order, idempotent</text>

  <g transform="translate(110, 290)">
    <rect width="200" height="74" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="100" y="34" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Report failure</text>
    <text x="100" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#722f8a">state restored</text>
  </g>

  <g transform="translate(60, 400)">
    <rect width="320" height="120" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#a67c1a">Why register as you go?</text>
    <text x="20" y="46" font-size="11" fill="#1a1a2e">A saga has no single transaction to abort.</text>
    <text x="20" y="64" font-size="11" fill="#1a1a2e">Each forward step pushes its undo onto a stack.</text>
    <text x="20" y="82" font-size="11" fill="#1a1a2e">On failure, runtime pops in reverse.</text>
    <text x="20" y="104" font-size="11" font-weight="700" fill="#a67c1a">Compensations must be idempotent.</text>
  </g>

  <g transform="translate(390, 400)">
    <rect width="320" height="120" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#1a4078">Three flows in this diagram</text>
    <text x="20" y="46" font-size="11" fill="#1f7a3a">Green forward: each success registers undo.</text>
    <text x="20" y="64" font-size="11" fill="#b3401b">Red failure: aborts forward, triggers rollback.</text>
    <text x="20" y="82" font-size="11" fill="#a67c1a">Amber compensation: runs undos LIFO.</text>
  </g>

  <g transform="translate(720, 400)">
    <rect width="320" height="120" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#b3401b">Failure modes</text>
    <text x="20" y="46" font-size="11" fill="#1a1a2e">1. Compensation itself fails: retry + alert</text>
    <text x="20" y="64" font-size="11" fill="#1a1a2e">2. Partial side effects need semantic undo</text>
    <text x="20" y="82" font-size="11" fill="#1a1a2e">3. Concurrent sagas: lock or version</text>
  </g>

  <g transform="translate(60, 540)">
    <rect width="980" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Sagas trade ACID transactions for explicit ordered compensations. Each forward step pushes its undo; failure pops them in reverse.</text>
  </g>
</svg>
