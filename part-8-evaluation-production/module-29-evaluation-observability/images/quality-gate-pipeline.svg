<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="600" y="40" font-size="22" font-weight="600" text-anchor="middle" fill="#1a1a2e">Quality Gate Pipeline for LLM Releases</text>
  <text x="600" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a">Each stage must pass before the next runs; failure rolls back to the last green build</text>

  <g>
    <rect x="60" y="140" width="190" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="155" y="172" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">1 · Unit eval</text>
    <text x="155" y="195" font-size="11" text-anchor="middle" fill="#5a4a3a">offline test set</text>
    <text x="155" y="213" font-size="11" text-anchor="middle" fill="#5a4a3a">accuracy &gt; baseline</text>

    <rect x="290" y="140" width="190" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="385" y="172" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">2 · Regression</text>
    <text x="385" y="195" font-size="11" text-anchor="middle" fill="#5a4a3a">prior-known failures</text>
    <text x="385" y="213" font-size="11" text-anchor="middle" fill="#5a4a3a">no new break</text>

    <rect x="520" y="140" width="190" height="100" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="615" y="172" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">3 · Safety</text>
    <text x="615" y="195" font-size="11" text-anchor="middle" fill="#5a4a3a">red-team prompts</text>
    <text x="615" y="213" font-size="11" text-anchor="middle" fill="#5a4a3a">refusal + hallucination</text>

    <rect x="750" y="140" width="190" height="100" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="845" y="172" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">4 · Canary</text>
    <text x="845" y="195" font-size="11" text-anchor="middle" fill="#5a4a3a">5% of traffic, 24h</text>
    <text x="845" y="213" font-size="11" text-anchor="middle" fill="#5a4a3a">live metric guardrails</text>

    <rect x="980" y="140" width="170" height="100" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="1065" y="172" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">5 · Promote</text>
    <text x="1065" y="195" font-size="11" text-anchor="middle" fill="#5a4a3a">100% rollout</text>

    <line x1="250" y1="190" x2="290" y2="190" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="480" y1="190" x2="520" y2="190" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="710" y1="190" x2="750" y2="190" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="940" y1="190" x2="980" y2="190" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <g transform="translate(60, 280)">
    <rect x="0" y="0" width="1090" height="60" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#b3401b">⊗ Failure at any gate</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Roll back to the last green release immediately. Open a high-priority incident; do NOT promote on red.</text>
  </g>

  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="1090" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Each gate progressively widens exposure: from offline to in-house to 5% traffic to 100%. The cost of a missed regression scales with how late the gate sits.</text>
  </g>
</svg>
