<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="725" y="40" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">Experiment Design Flow: Hypothesis to Reproducible Report</text>
  <text x="725" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each phase produces a concrete artifact; downstream phases consume it.</text>

  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="320" height="430" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="36" rx="10" fill="#1a4078"/>
    <text x="160" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">1. DESIGN</text>

    <g transform="translate(16, 52)">
      <rect x="0" y="0" width="288" height="78" rx="5" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <text x="10" y="20" font-size="13" font-weight="700" fill="#1a4078">Hypothesis (testable)</text>
      <text x="10" y="40" font-size="12" fill="#1a1a2e">"Adding RAG lifts factual-QA</text>
      <text x="10" y="56" font-size="12" fill="#1a1a2e">accuracy by 5+ points vs.</text>
      <text x="10" y="72" font-size="12" fill="#1a1a2e">the closed-book baseline."</text>
    </g>

    <g transform="translate(16, 142)">
      <rect x="0" y="0" width="288" height="80" rx="5" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <text x="10" y="20" font-size="13" font-weight="700" fill="#1a4078">Variable matrix</text>
      <text x="10" y="38" font-size="11" fill="#1a1a2e">IV: retrieval on / off</text>
      <text x="10" y="54" font-size="11" fill="#1a1a2e">DV: exact-match accuracy</text>
      <text x="10" y="70" font-size="11" fill="#1a1a2e">Control: model, prompt, temp=0</text>
    </g>

    <g transform="translate(16, 234)">
      <rect x="0" y="0" width="288" height="100" rx="5" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="10" y="20" font-size="13" font-weight="700" fill="#7a5e1a">Power calculator</text>
      <text x="10" y="40" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">delta = 0.05  alpha = 0.05</text>
      <text x="10" y="56" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">power = 0.80  sigma = 0.40</text>
      <text x="10" y="76" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">=&gt; n &gt;= 1000 per arm</text>
      <text x="10" y="92" font-size="11" font-style="italic" fill="#5a4a3a">two-sample, two-sided t-test</text>
    </g>

    <g transform="translate(16, 346)">
      <rect x="0" y="0" width="288" height="68" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="10" y="20" font-size="12" font-weight="700" fill="#1f7a3a">Artifact: design.yaml</text>
      <text x="10" y="38" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">hypothesis, n, alpha, power,</text>
      <text x="10" y="54" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">arms[], metrics[], dataset</text>
    </g>
  </g>

  <g transform="translate(380, 100)">
    <rect x="0" y="0" width="320" height="430" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="36" rx="10" fill="#1f7a3a"/>
    <text x="160" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">2. EXECUTE</text>

    <g transform="translate(16, 52)">
      <rect x="0" y="0" width="288" height="78" rx="5" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="10" y="20" font-size="13" font-weight="700" fill="#1f7a3a">Fix all randomness</text>
      <text x="10" y="38" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">random.seed(42)</text>
      <text x="10" y="54" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">np.random.seed(42)</text>
      <text x="10" y="70" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">torch.manual_seed(42); cudnn=det</text>
    </g>

    <g transform="translate(16, 142)">
      <rect x="0" y="0" width="288" height="80" rx="5" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="10" y="20" font-size="13" font-weight="700" fill="#1f7a3a">Replicate runs</text>
      <text x="10" y="38" font-size="11" fill="#1a1a2e">5 seeds x 2 arms = 10 runs</text>
      <text x="10" y="54" font-size="11" fill="#1a1a2e">stratified split, balanced</text>
      <text x="10" y="70" font-size="11" font-style="italic" fill="#5a4a3a">never report a single seed</text>
    </g>

    <g transform="translate(16, 234)">
      <rect x="0" y="0" width="288" height="100" rx="5" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="10" y="20" font-size="13" font-weight="700" fill="#7a5e1a">Log everything</text>
      <text x="10" y="40" font-size="11" fill="#1a1a2e">model SHA, prompt template,</text>
      <text x="10" y="56" font-size="11" fill="#1a1a2e">decoding params, dataset hash,</text>
      <text x="10" y="72" font-size="11" fill="#1a1a2e">latency, cost, GPU type,</text>
      <text x="10" y="88" font-size="11" fill="#1a1a2e">git commit, env lockfile</text>
    </g>

    <g transform="translate(16, 346)">
      <rect x="0" y="0" width="288" height="68" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="10" y="20" font-size="12" font-weight="700" fill="#1f7a3a">Artifact: runs.parquet</text>
      <text x="10" y="38" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">run_id, seed, arm, prompt,</text>
      <text x="10" y="54" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">output, metric, latency_ms</text>
    </g>
  </g>

  <g transform="translate(720, 100)">
    <rect x="0" y="0" width="320" height="430" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="36" rx="10" fill="#722f8a"/>
    <text x="160" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">3. ANALYZE</text>

    <g transform="translate(16, 52)">
      <rect x="0" y="0" width="288" height="78" rx="5" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
      <text x="10" y="20" font-size="13" font-weight="700" fill="#722f8a">Ablation matrix</text>
      <text x="10" y="38" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">[full]   [-rerank]   [-rag]</text>
      <text x="10" y="54" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e"> 0.78    0.74        0.69</text>
      <text x="10" y="70" font-size="11" font-style="italic" fill="#5a4a3a">isolate each component's lift</text>
    </g>

    <g transform="translate(16, 142)">
      <rect x="0" y="0" width="288" height="80" rx="5" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="10" y="20" font-size="13" font-weight="700" fill="#7a5e1a">Statistical test</text>
      <text x="10" y="38" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">paired bootstrap, B=10000</text>
      <text x="10" y="54" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">delta = +0.087  CI [.06,.11]</text>
      <text x="10" y="70" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">p &lt; 0.001  =&gt; reject H0</text>
    </g>

    <g transform="translate(16, 234)">
      <rect x="0" y="0" width="288" height="100" rx="5" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
      <text x="10" y="20" font-size="13" font-weight="700" fill="#722f8a">Human eval (200 sample)</text>
      <text x="10" y="40" font-size="11" fill="#1a1a2e">3 raters per item, blinded</text>
      <text x="10" y="56" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">Cohen kappa = 0.71 (substantial)</text>
      <text x="10" y="72" font-size="11" fill="#1a1a2e">disagreements: adjudicate or</text>
      <text x="10" y="88" font-size="11" fill="#1a1a2e">drop and flag in report</text>
    </g>

    <g transform="translate(16, 346)">
      <rect x="0" y="0" width="288" height="68" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="10" y="20" font-size="12" font-weight="700" fill="#1f7a3a">Artifact: analysis.ipynb</text>
      <text x="10" y="38" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">tables, plots, CIs, p-values,</text>
      <text x="10" y="54" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">qualitative error buckets</text>
    </g>
  </g>

  <g transform="translate(1060, 100)">
    <rect x="0" y="0" width="350" height="430" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <rect x="0" y="0" width="350" height="36" rx="10" fill="#b3401b"/>
    <text x="175" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">4. REPORT &amp; SHIP</text>

    <g transform="translate(16, 52)">
      <rect x="0" y="0" width="318" height="78" rx="5" fill="#ffffff" stroke="#b3401b" stroke-width="1.2"/>
      <text x="10" y="20" font-size="13" font-weight="700" fill="#b3401b">Results with error bars</text>
      <text x="10" y="40" font-size="11" fill="#1a1a2e">Baseline:  0.694 +/- 0.012</text>
      <text x="10" y="56" font-size="11" fill="#1a1a2e">+RAG:      0.781 +/- 0.014</text>
      <text x="10" y="72" font-size="11" font-style="italic" fill="#5a4a3a">mean +/- 95% CI across 5 seeds</text>
    </g>

    <g transform="translate(16, 142)">
      <rect x="0" y="0" width="318" height="80" rx="5" fill="#ffffff" stroke="#b3401b" stroke-width="1.2"/>
      <text x="10" y="20" font-size="13" font-weight="700" fill="#b3401b">Negative findings and limits</text>
      <text x="10" y="38" font-size="11" fill="#1a1a2e">"No lift on multi-hop subset"</text>
      <text x="10" y="54" font-size="11" fill="#1a1a2e">"Held out: post-2024 questions"</text>
      <text x="10" y="70" font-size="11" font-style="italic" fill="#5a4a3a">honesty over impressive numbers</text>
    </g>

    <g transform="translate(16, 234)">
      <rect x="0" y="0" width="318" height="100" rx="5" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="10" y="20" font-size="13" font-weight="700" fill="#7a5e1a">Reproducibility bundle</text>
      <text x="10" y="40" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">code/    requirements.lock</text>
      <text x="10" y="56" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">data/    prompts/   configs/</text>
      <text x="10" y="72" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">runs.parquet  README.md</text>
      <text x="10" y="88" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">model_card.md  LICENSE</text>
    </g>

    <g transform="translate(16, 346)">
      <rect x="0" y="0" width="318" height="68" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="10" y="20" font-size="12" font-weight="700" fill="#1f7a3a">Artifact: release_v1.tar.gz</text>
      <text x="10" y="38" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">someone else can re-run it</text>
      <text x="10" y="54" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">and get the same numbers</text>
    </g>
  </g>

  <line x1="362" y1="315" x2="378" y2="315" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="702" y1="315" x2="718" y2="315" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1042" y1="315" x2="1058" y2="315" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <text x="725" y="600" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each phase consumes the previous artifact and emits a new one (left to right)</text>

  <g transform="translate(40, 670)">
    <rect x="0" y="0" width="1370" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">A trustworthy experiment is a chain of artifacts: design.yaml fixes the question, runs.parquet captures the evidence, analysis.ipynb interprets it,</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">and release.tar.gz lets someone else reproduce your numbers. Skip any link and the result becomes a story instead of a finding.</text>
  </g>
</svg>
