<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
  </defs>

  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Durable Execution Recovery</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Checkpoints persist progress so a crashed workflow replays history and resumes at the failed step</text>

  <!-- Lane 1: NORMAL -->
  <g transform="translate(60,100)">
    <rect x="0" y="0" width="1180" height="160" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#1f7a3a">Normal Execution</text>
    <text x="180" y="28" font-size="11" font-style="italic" fill="#5a4a3a">all four steps complete; checkpoints written between each</text>

    <!-- step boxes -->
    <g>
      <rect x="60" y="60" width="200" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.7"/>
      <text x="160" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Step 1</text>
      <text x="160" y="106" font-size="12" text-anchor="middle" fill="#1a1a2e">Search Web</text>
      <text x="160" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">checkpointed</text>
    </g>
    <line x1="260" y1="100" x2="335" y2="100" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arrG)"/>
    <text x="297" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">checkpoint</text>

    <g>
      <rect x="335" y="60" width="200" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.7"/>
      <text x="435" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Step 2</text>
      <text x="435" y="106" font-size="12" text-anchor="middle" fill="#1a1a2e">Extract Content</text>
      <text x="435" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">checkpointed</text>
    </g>
    <line x1="535" y1="100" x2="610" y2="100" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arrG)"/>
    <text x="572" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">checkpoint</text>

    <g>
      <rect x="610" y="60" width="200" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.7"/>
      <text x="710" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Step 3</text>
      <text x="710" y="106" font-size="12" text-anchor="middle" fill="#1a1a2e">LLM Summarize</text>
      <text x="710" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">checkpointed</text>
    </g>
    <line x1="810" y1="100" x2="885" y2="100" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arrG)"/>
    <text x="847" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">checkpoint</text>

    <g>
      <rect x="885" y="60" width="200" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.7"/>
      <text x="985" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Step 4</text>
      <text x="985" y="106" font-size="12" text-anchor="middle" fill="#1a1a2e">Final Report</text>
      <text x="985" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">delivered</text>
    </g>
  </g>

  <!-- Lane 2: FAILURE -->
  <g transform="translate(60,290)">
    <rect x="0" y="0" width="1180" height="160" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#b3401b">Crash at Step 3</text>
    <text x="190" y="28" font-size="11" font-style="italic" fill="#5a4a3a">progress through Step 2 is durable in the workflow log; Step 3 dies mid-call</text>

    <g>
      <rect x="60" y="60" width="200" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.7"/>
      <text x="160" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Step 1</text>
      <text x="160" y="106" font-size="12" text-anchor="middle" fill="#1a1a2e">Search Web</text>
      <text x="160" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">recorded</text>
    </g>
    <g>
      <rect x="335" y="60" width="200" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.7"/>
      <text x="435" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Step 2</text>
      <text x="435" y="106" font-size="12" text-anchor="middle" fill="#1a1a2e">Extract Content</text>
      <text x="435" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">recorded</text>
    </g>
    <g>
      <rect x="610" y="60" width="200" height="80" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
      <text x="710" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">Step 3</text>
      <text x="710" y="106" font-size="12" text-anchor="middle" fill="#1a1a2e">LLM Summarize</text>
      <text x="710" y="124" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">CRASH</text>
    </g>
    <g>
      <rect x="885" y="60" width="200" height="80" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="5,4"/>
      <text x="985" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#5a4a3a">Step 4</text>
      <text x="985" y="106" font-size="12" text-anchor="middle" fill="#5a4a3a">Final Report</text>
      <text x="985" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">never reached</text>
    </g>
    <!-- crash icon -->
    <g transform="translate(710,40)">
      <polygon points="0,0 7,18 -3,18 4,38 -10,18 0,18" fill="#b3401b"/>
    </g>
  </g>

  <!-- Lane 3: RECOVERY -->
  <g transform="translate(60,480)">
    <rect x="0" y="0" width="1180" height="170" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#1a4078">Durable Recovery</text>
    <text x="190" y="28" font-size="11" font-style="italic" fill="#5a4a3a">on restart, replay history (no re-execution), then re-run from the failed step</text>

    <g>
      <rect x="60" y="60" width="200" height="90" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.7"/>
      <text x="160" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Step 1</text>
      <text x="160" y="106" font-size="12" text-anchor="middle" fill="#1a1a2e">Replay from log</text>
      <text x="160" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">no side effects</text>
      <text x="160" y="140" font-size="11" text-anchor="middle" fill="#5a4a3a">cached result reused</text>
    </g>
    <line x1="260" y1="105" x2="335" y2="105" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
    <text x="297" y="98" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">skip</text>

    <g>
      <rect x="335" y="60" width="200" height="90" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.7"/>
      <text x="435" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Step 2</text>
      <text x="435" y="106" font-size="12" text-anchor="middle" fill="#1a1a2e">Replay from log</text>
      <text x="435" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">no side effects</text>
      <text x="435" y="140" font-size="11" text-anchor="middle" fill="#5a4a3a">cached result reused</text>
    </g>
    <line x1="535" y1="105" x2="610" y2="105" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
    <text x="572" y="98" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">skip</text>

    <g>
      <rect x="610" y="60" width="200" height="90" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
      <text x="710" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Step 3</text>
      <text x="710" y="106" font-size="12" text-anchor="middle" fill="#1a1a2e">Re-execute</text>
      <text x="710" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">resume here</text>
      <text x="710" y="140" font-size="11" text-anchor="middle" fill="#5a4a3a">fresh LLM call</text>
    </g>
    <line x1="810" y1="105" x2="885" y2="105" stroke="#1a4078" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="847" y="98" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">checkpoint</text>

    <g>
      <rect x="885" y="60" width="200" height="90" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
      <text x="985" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Step 4</text>
      <text x="985" y="106" font-size="12" text-anchor="middle" fill="#1a1a2e">Execute</text>
      <text x="985" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">workflow completes</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 668)">
    <rect x="0" y="0" width="1180" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Durable execution turns a crashed workflow into a resumable one: completed steps replay deterministically from the log without re-running side effects,</text>
    <text x="20" y="64" font-size="12" fill="#1a1a2e">and execution restarts at the exact step that failed. Without it, a Step 3 crash would force a full re-run, paying for Step 1 and Step 2 a second time.</text>
  </g>
</svg>
