<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Durable Workflow Frameworks: Temporal vs Inngest vs LangGraph</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Three layers of abstraction; pick by infrastructure tolerance and persistence needs.</text>

  <!-- Three columns -->
  <!-- Temporal -->
  <g transform="translate(60, 100)">
    <rect width="380" height="430" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="60" rx="10" fill="#1a4078"/>
    <text x="190" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Temporal</text>
    <text x="190" y="50" font-size="12" text-anchor="middle" fill="#eef4fa" font-style="italic">Infrastructure-level</text>

    <g transform="translate(20, 80)">
      <rect width="340" height="80" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a1a2e">Temporal Server</text>
      <text x="14" y="42" font-size="11" fill="#5a4a3a">Manages event history, replays state on</text>
      <text x="14" y="58" font-size="11" fill="#5a4a3a">crash, separate cluster (Cassandra / RDS).</text>
      <text x="14" y="74" font-size="11" font-style="italic" fill="#1a4078">Cost: dedicated infra to operate.</text>
    </g>
    <g transform="translate(20, 175)">
      <rect width="340" height="70" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a1a2e">Workers</text>
      <text x="14" y="42" font-size="11" fill="#5a4a3a">Stateless, horizontally scalable; long-poll</text>
      <text x="14" y="58" font-size="11" fill="#5a4a3a">tasks from the server.</text>
    </g>
    <g transform="translate(20, 260)">
      <rect width="340" height="80" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a1a2e">Workflows + Activities</text>
      <text x="14" y="42" font-size="11" fill="#5a4a3a">Strict deterministic / non-deterministic</text>
      <text x="14" y="58" font-size="11" fill="#5a4a3a">split. Compiler enforces purity in workflow</text>
      <text x="14" y="74" font-size="11" fill="#5a4a3a">code; side effects live in activities.</text>
    </g>
    <g transform="translate(20, 355)">
      <rect width="340" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Choose when</text>
      <text x="14" y="40" font-size="11" fill="#1a1a2e">Complex multi-day workflows with strict</text>
      <text x="14" y="55" font-size="11" fill="#1a1a2e">durability and exactly-once guarantees.</text>
    </g>
  </g>

  <!-- Inngest -->
  <g transform="translate(460, 100)">
    <rect width="380" height="430" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="60" rx="10" fill="#1f7a3a"/>
    <text x="190" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Inngest</text>
    <text x="190" y="50" font-size="12" text-anchor="middle" fill="#ecf6ee" font-style="italic">Event-driven</text>

    <g transform="translate(20, 80)">
      <rect width="340" height="80" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a1a2e">Event Bus</text>
      <text x="14" y="42" font-size="11" fill="#5a4a3a">Functions trigger on events (cron,</text>
      <text x="14" y="58" font-size="11" fill="#5a4a3a">webhook, custom). Hosted control plane.</text>
      <text x="14" y="74" font-size="11" font-style="italic" fill="#1f7a3a">Cost: SaaS pricing per run.</text>
    </g>
    <g transform="translate(20, 175)">
      <rect width="340" height="70" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a1a2e">step.run()</text>
      <text x="14" y="42" font-size="11" fill="#5a4a3a">Per-step checkpointing; each step's</text>
      <text x="14" y="58" font-size="11" fill="#5a4a3a">result is memoized for retries.</text>
    </g>
    <g transform="translate(20, 260)">
      <rect width="340" height="80" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a1a2e">Runs in your app</text>
      <text x="14" y="42" font-size="11" fill="#5a4a3a">FastAPI, Flask, Next.js endpoints; no</text>
      <text x="14" y="58" font-size="11" fill="#5a4a3a">separate worker fleet. Inngest invokes</text>
      <text x="14" y="74" font-size="11" fill="#5a4a3a">your HTTP routes.</text>
    </g>
    <g transform="translate(20, 355)">
      <rect width="340" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Choose when</text>
      <text x="14" y="40" font-size="11" fill="#1a1a2e">Event-driven jobs, fast onboarding,</text>
      <text x="14" y="55" font-size="11" fill="#1a1a2e">minimal infrastructure to operate.</text>
    </g>
  </g>

  <!-- LangGraph -->
  <g transform="translate(860, 100)">
    <rect width="380" height="430" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="60" rx="10" fill="#7a5e1a"/>
    <text x="190" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">LangGraph</text>
    <text x="190" y="50" font-size="12" text-anchor="middle" fill="#fef3e0" font-style="italic">Application-level</text>

    <g transform="translate(20, 80)">
      <rect width="340" height="80" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a1a2e">State Graph</text>
      <text x="14" y="42" font-size="11" fill="#5a4a3a">Nodes (functions) and edges (transitions),</text>
      <text x="14" y="58" font-size="11" fill="#5a4a3a">conditional routing. Lives inside your app.</text>
      <text x="14" y="74" font-size="11" font-style="italic" fill="#7a5e1a">Cost: just a Python library.</text>
    </g>
    <g transform="translate(20, 175)">
      <rect width="340" height="70" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a1a2e">Checkpointer</text>
      <text x="14" y="42" font-size="11" fill="#5a4a3a">Bring-your-own store: PostgreSQL, SQLite,</text>
      <text x="14" y="58" font-size="11" fill="#5a4a3a">Redis. Snapshots state per node.</text>
    </g>
    <g transform="translate(20, 260)">
      <rect width="340" height="80" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a1a2e">interrupt_before</text>
      <text x="14" y="42" font-size="11" fill="#5a4a3a">Pause graph at chosen node for</text>
      <text x="14" y="58" font-size="11" fill="#5a4a3a">human-in-the-loop review or approval.</text>
      <text x="14" y="74" font-size="11" fill="#5a4a3a">Resume from snapshot.</text>
    </g>
    <g transform="translate(20, 355)">
      <rect width="340" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Choose when</text>
      <text x="14" y="40" font-size="11" fill="#1a1a2e">LangChain agents needing simple</text>
      <text x="14" y="55" font-size="11" fill="#1a1a2e">persistence and HITL pauses.</text>
    </g>
  </g>

  <!-- Comparison strip -->
  <g transform="translate(60, 555)">
    <rect width="1180" height="105" rx="8" fill="#ffffff" stroke="#5a4a3a" stroke-width="1.2"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#1a1a2e">At a glance</text>

    <g transform="translate(14, 38)">
      <text font-size="11" font-weight="700" fill="#5a4a3a"><tspan x="0">Operates as</tspan></text>
      <text font-size="11" fill="#1a1a2e"><tspan x="0" y="18">Temporal: separate cluster</tspan><tspan x="0" y="34">Inngest: SaaS + your HTTP app</tspan><tspan x="0" y="50">LangGraph: in-process library</tspan></text>
    </g>
    <g transform="translate(310, 38)">
      <text font-size="11" font-weight="700" fill="#5a4a3a"><tspan x="0">Persistence model</tspan></text>
      <text font-size="11" fill="#1a1a2e"><tspan x="0" y="18">Event-history replay</tspan><tspan x="0" y="34">Per-step memoization</tspan><tspan x="0" y="50">Per-node snapshots</tspan></text>
    </g>
    <g transform="translate(610, 38)">
      <text font-size="11" font-weight="700" fill="#5a4a3a"><tspan x="0">Determinism rules</tspan></text>
      <text font-size="11" fill="#1a1a2e"><tspan x="0" y="18">Strict (compiler enforced)</tspan><tspan x="0" y="34">Loose (step boundaries)</tspan><tspan x="0" y="50">None (you manage state)</tspan></text>
    </g>
    <g transform="translate(880, 38)">
      <text font-size="11" font-weight="700" fill="#5a4a3a"><tspan x="0">Operational cost</tspan></text>
      <text font-size="11" fill="#1a1a2e"><tspan x="0" y="18">High (run a cluster)</tspan><tspan x="0" y="34">Medium (SaaS bill)</tspan><tspan x="0" y="50">Low (one library)</tspan></text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 685)">
    <rect width="1180" height="55" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="23" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="44" font-size="12" fill="#1a1a2e">Pick the lowest abstraction that meets your durability needs: LangGraph for in-app agent state, Inngest for event-driven jobs, Temporal when guarantees and complexity justify the cluster.</text>
  </g>
</svg>
