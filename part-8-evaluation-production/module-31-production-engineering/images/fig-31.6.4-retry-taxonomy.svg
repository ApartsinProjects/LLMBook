<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Retry Strategy Taxonomy</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Three retry patterns, each fixing a problem the previous one creates</text>

  <!-- Root -->
  <g>
    <rect x="540" y="90" width="220" height="50" rx="10" fill="#5a4a3a" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="650" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Retry Strategies</text>
  </g>

  <!-- Tree edges to 3 children -->
  <line x1="650" y1="140" x2="220" y2="195" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="650" y1="140" x2="650" y2="195" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="650" y1="140" x2="1080" y2="195" stroke="#1a1a2e" stroke-width="1.5"/>

  <!-- Branch labels along edges -->
  <text x="380" y="170" font-size="11" font-weight="700" fill="#5a4a3a" text-anchor="middle">simplest</text>
  <text x="685" y="170" font-size="11" font-weight="700" fill="#5a4a3a" text-anchor="middle">+ delay</text>
  <text x="920" y="170" font-size="11" font-weight="700" fill="#5a4a3a" text-anchor="middle">+ randomness</text>

  <!-- Card 1: Immediate Retry -->
  <g transform="translate(60,195)">
    <rect x="0" y="0" width="320" height="320" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="42" rx="10" fill="#b3401b"/>
    <text x="160" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Immediate Retry</text>

    <text x="20" y="72" font-size="12" font-weight="700" fill="#b3401b">Delay</text>
    <text x="20" y="92" font-size="13" fill="#1a1a2e">0s -- fire again at once</text>

    <line x1="20" y1="108" x2="300" y2="108" stroke="#b3401b" stroke-width="0.5" stroke-dasharray="3,3"/>

    <text x="20" y="132" font-size="12" font-weight="700" fill="#b3401b">Best for</text>
    <text x="20" y="152" font-size="12" fill="#1a1a2e">Brief network blips,</text>
    <text x="20" y="170" font-size="12" fill="#1a1a2e">single-packet drops</text>

    <line x1="20" y1="188" x2="300" y2="188" stroke="#b3401b" stroke-width="0.5" stroke-dasharray="3,3"/>

    <text x="20" y="212" font-size="12" font-weight="700" fill="#b3401b">Risk</text>
    <text x="20" y="232" font-size="12" fill="#1a1a2e">Worsens rate limits;</text>
    <text x="20" y="250" font-size="12" fill="#1a1a2e">amplifies overload</text>

    <line x1="20" y1="268" x2="300" y2="268" stroke="#b3401b" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="20" y="290" font-size="11" font-style="italic" fill="#5a4a3a">delay schedule:</text>
    <text x="20" y="308" font-size="12" font-family="Consolas, monospace" fill="#1a1a2e">[0, 0, 0, ...]</text>
  </g>

  <!-- Card 2: Exponential Backoff -->
  <g transform="translate(490,195)">
    <rect x="0" y="0" width="320" height="320" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="42" rx="10" fill="#7a5e1a"/>
    <text x="160" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Exponential Backoff</text>

    <text x="20" y="72" font-size="12" font-weight="700" fill="#7a5e1a">Delay</text>
    <text x="20" y="92" font-size="13" fill="#1a1a2e">1s, 2s, 4s, 8s, ...</text>

    <line x1="20" y1="108" x2="300" y2="108" stroke="#7a5e1a" stroke-width="0.5" stroke-dasharray="3,3"/>

    <text x="20" y="132" font-size="12" font-weight="700" fill="#7a5e1a">Best for</text>
    <text x="20" y="152" font-size="12" fill="#1a1a2e">Provider recovery,</text>
    <text x="20" y="170" font-size="12" fill="#1a1a2e">429 / 503 responses</text>

    <line x1="20" y1="188" x2="300" y2="188" stroke="#7a5e1a" stroke-width="0.5" stroke-dasharray="3,3"/>

    <text x="20" y="212" font-size="12" font-weight="700" fill="#7a5e1a">Risk</text>
    <text x="20" y="232" font-size="12" fill="#1a1a2e">Thundering herd: many</text>
    <text x="20" y="250" font-size="12" fill="#1a1a2e">clients retry in lockstep</text>

    <line x1="20" y1="268" x2="300" y2="268" stroke="#7a5e1a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="20" y="290" font-size="11" font-style="italic" fill="#5a4a3a">delay schedule:</text>
    <text x="20" y="308" font-size="12" font-family="Consolas, monospace" fill="#1a1a2e">[1, 2, 4, 8, 16]</text>
  </g>

  <!-- Card 3: Jittered Backoff (recommended) -->
  <g transform="translate(920,195)">
    <rect x="0" y="0" width="320" height="320" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <rect x="0" y="0" width="320" height="42" rx="10" fill="#1f7a3a"/>
    <text x="160" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Jittered Backoff</text>

    <!-- recommended ribbon -->
    <g transform="translate(225,52)">
      <rect x="0" y="0" width="80" height="22" rx="4" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="40" y="16" font-size="11" font-weight="700" text-anchor="middle" fill="#7a5e1a">DEFAULT</text>
    </g>

    <text x="20" y="72" font-size="12" font-weight="700" fill="#1f7a3a">Delay</text>
    <text x="20" y="92" font-size="13" fill="#1a1a2e">base * 2^n +/- random</text>

    <line x1="20" y1="108" x2="300" y2="108" stroke="#1f7a3a" stroke-width="0.5" stroke-dasharray="3,3"/>

    <text x="20" y="132" font-size="12" font-weight="700" fill="#1f7a3a">Best for</text>
    <text x="20" y="152" font-size="12" fill="#1a1a2e">Shared outages and</text>
    <text x="20" y="170" font-size="12" fill="#1a1a2e">multi-client workloads</text>

    <line x1="20" y1="188" x2="300" y2="188" stroke="#1f7a3a" stroke-width="0.5" stroke-dasharray="3,3"/>

    <text x="20" y="212" font-size="12" font-weight="700" fill="#1f7a3a">Why this is the default</text>
    <text x="20" y="232" font-size="12" fill="#1a1a2e">Spreads retries across</text>
    <text x="20" y="250" font-size="12" fill="#1a1a2e">time, breaking the herd</text>

    <line x1="20" y1="268" x2="300" y2="268" stroke="#1f7a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="20" y="290" font-size="11" font-style="italic" fill="#5a4a3a">delay schedule:</text>
    <text x="20" y="308" font-size="12" font-family="Consolas, monospace" fill="#1a1a2e">[1.3, 1.7, 4.6, 7.2]</text>
  </g>

  <!-- Evolution arrows below cards -->
  <g transform="translate(0,545)">
    <line x1="380" y1="0" x2="490" y2="0" stroke="#1a1a2e" stroke-width="1.7" marker-end="url(#arr)"/>
    <text x="435" y="-8" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">add delay</text>

    <line x1="810" y1="0" x2="920" y2="0" stroke="#1a1a2e" stroke-width="1.7" marker-end="url(#arr)"/>
    <text x="865" y="-8" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">add randomness</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="1180" height="90" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Each strategy fixes the failure mode of the previous one. Immediate retry is fine for one packet drop but hammers a struggling backend; exponential backoff</text>
    <text x="20" y="64" font-size="12" fill="#1a1a2e">spaces attempts but synchronizes clients into a herd; jittered backoff randomizes the wait so retries fan out smoothly. Use jittered backoff as the default and</text>
    <text x="20" y="82" font-size="12" fill="#1a1a2e">drop down to a simpler tier only when you have a specific reason.</text>
  </g>
</svg>
