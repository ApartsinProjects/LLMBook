<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">OpenTelemetry trace of an LLM request: spans, attributes, exporter</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">A single user request becomes a parent span with four child spans; gen_ai.* attributes make it queryable in any OTEL backend</text>

  <!-- Header row: trace id and request -->
  <g transform="translate(60, 100)">
    <rect width="1180" height="56" rx="8" fill="#1a1a2e" stroke="#0f3460" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#ffffff">User request</text>
    <text x="20" y="44" font-size="12" fill="#bcd4ff" font-family="Courier New, monospace">trace_id: abc123def456 . . . . . . . . . . . . . . . . . . . . . . . . . duration: 4250 ms</text>
    <text x="1160" y="34" font-size="12" font-weight="700" text-anchor="end" fill="#ffffff">parent span</text>
  </g>

  <!-- Time axis -->
  <g transform="translate(60, 178)">
    <line x1="280" y1="0" x2="1140" y2="0" stroke="#5a4a3a" stroke-width="1"/>
    <line x1="280" y1="-5" x2="280" y2="5" stroke="#5a4a3a"/>
    <line x1="495" y1="-5" x2="495" y2="5" stroke="#5a4a3a"/>
    <line x1="710" y1="-5" x2="710" y2="5" stroke="#5a4a3a"/>
    <line x1="925" y1="-5" x2="925" y2="5" stroke="#5a4a3a"/>
    <line x1="1140" y1="-5" x2="1140" y2="5" stroke="#5a4a3a"/>
    <text x="280" y="-10" font-size="11" text-anchor="middle" fill="#5a4a3a">0 ms</text>
    <text x="495" y="-10" font-size="11" text-anchor="middle" fill="#5a4a3a">1000</text>
    <text x="710" y="-10" font-size="11" text-anchor="middle" fill="#5a4a3a">2000</text>
    <text x="925" y="-10" font-size="11" text-anchor="middle" fill="#5a4a3a">3000</text>
    <text x="1140" y="-10" font-size="11" text-anchor="middle" fill="#5a4a3a">4250</text>
  </g>

  <!-- Span 1: Embedding -->
  <g transform="translate(60, 200)">
    <rect width="220" height="80" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="12" y="22" font-size="13" font-weight="700" fill="#1a4078">Span: Embedding</text>
    <text x="12" y="40" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">gen_ai.system: openai</text>
    <text x="12" y="54" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">model: text-embedding-3</text>
    <text x="12" y="68" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">input_tokens: 128</text>
  </g>
  <!-- bar 1: 0-180ms -->
  <g transform="translate(280, 218)">
    <rect width="38" height="22" rx="3" fill="#1a4078"/>
    <text x="44" y="16" font-size="11" fill="#5a4a3a">180 ms</text>
  </g>

  <!-- Span 2: Vector search -->
  <g transform="translate(60, 300)">
    <rect width="220" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="12" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Span: Vector search</text>
    <text x="12" y="40" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">db.system: chromadb</text>
    <text x="12" y="54" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">db.operation: query</text>
    <text x="12" y="68" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">response.count: 5</text>
  </g>
  <!-- bar 2: 180-400ms -->
  <g transform="translate(318, 318)">
    <rect width="48" height="22" rx="3" fill="#1f7a3a"/>
    <text x="56" y="16" font-size="11" fill="#5a4a3a">220 ms</text>
  </g>

  <!-- Span 3: LLM -->
  <g transform="translate(60, 400)">
    <rect width="220" height="100" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="12" y="22" font-size="13" font-weight="700" fill="#722f8a">Span: LLM call</text>
    <text x="12" y="40" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">gen_ai.system: anthropic</text>
    <text x="12" y="54" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">model: claude-sonnet</text>
    <text x="12" y="68" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">input_tokens: 2048</text>
    <text x="12" y="82" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">output_tokens: 512</text>
    <text x="12" y="96" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">temperature: 0.7</text>
  </g>
  <!-- bar 3: 400-3500ms -->
  <g transform="translate(366, 428)">
    <rect width="666" height="22" rx="3" fill="#722f8a"/>
    <text x="333" y="16" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">3100 ms (dominant cost)</text>
  </g>

  <!-- Span 4: Tool -->
  <g transform="translate(60, 520)">
    <rect width="220" height="80" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="12" y="22" font-size="13" font-weight="700" fill="#b3401b">Span: Tool call</text>
    <text x="12" y="40" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">tool.name: search_web</text>
    <text x="12" y="54" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">tool.status: success</text>
    <text x="12" y="68" font-size="11" fill="#1a1a2e" font-family="Courier New, monospace">duration_ms: 340</text>
  </g>
  <!-- bar 4: 3500-3840 -->
  <g transform="translate(1032, 538)">
    <rect width="74" height="22" rx="3" fill="#b3401b"/>
    <text x="80" y="16" font-size="11" fill="#5a4a3a">340 ms</text>
  </g>

  <!-- Exporter callout -->
  <g transform="translate(900, 200)">
    <rect width="340" height="180" rx="8" fill="#1a1a2e" stroke="#0f3460" stroke-width="2"/>
    <text x="20" y="26" font-size="14" font-weight="700" fill="#ffffff">Export to backend</text>
    <text x="20" y="46" font-size="11" fill="#bcd4ff" font-style="italic">OTLP gRPC or HTTP, batched</text>

    <text x="20" y="78" font-size="12" fill="#ffffff">Jaeger</text>
    <text x="20" y="98" font-size="12" fill="#ffffff">Grafana Tempo</text>
    <text x="20" y="118" font-size="12" fill="#ffffff">Datadog APM</text>
    <text x="20" y="138" font-size="12" fill="#ffffff">Honeycomb</text>
    <text x="20" y="158" font-size="11" fill="#bcd4ff" font-style="italic">All read the same gen_ai.* schema</text>
  </g>
  <path d="M 700 290 Q 800 270 900 270" fill="none" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Why callout -->
  <g transform="translate(310, 520)">
    <rect width="640" height="120" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/>
    <text x="20" y="26" font-size="14" font-weight="700" fill="#7a5e1a">Why standard span attributes matter</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">The OTEL gen_ai semantic convention defines names like gen_ai.system,</text>
    <text x="20" y="64" font-size="12" fill="#1a1a2e">gen_ai.request.model, and gen_ai.usage.input_tokens. Once spans use those</text>
    <text x="20" y="80" font-size="12" fill="#1a1a2e">keys, every backend can group, filter, and chart by model, by tenant, by</text>
    <text x="20" y="96" font-size="12" fill="#1a1a2e">tool name, without custom code. Cost dashboards write themselves.</text>
    <text x="20" y="114" font-size="11" fill="#5a4a3a" font-style="italic">Diagnose: long parent span + short children = network or queueing, not the LLM.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 670)">
    <rect width="1180" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Wrap every external call (embed, vector DB, LLM, tool) in an OTEL span with gen_ai.* attributes. The trace becomes a Gantt chart that pinpoints which step burns time and tokens, in any backend you choose.</text>
  </g>
</svg>
