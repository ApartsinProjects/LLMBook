<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Kubernetes Stack for LLM Workloads</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Three layers: workloads on top, orchestration in the middle, GPU infrastructure at the base.</text>

  <!-- Layer side labels -->
  <g font-size="12" font-weight="700" fill="#5a4a3a" text-anchor="end">
    <text x="50" y="135">Layer 1</text>
    <text x="50" y="150" font-size="11" font-weight="400" font-style="italic">workloads</text>
    <text x="50" y="290">Layer 2</text>
    <text x="50" y="305" font-size="11" font-weight="400" font-style="italic">orchestration</text>
    <text x="50" y="555">Layer 3</text>
    <text x="50" y="570" font-size="11" font-weight="400" font-style="italic">GPU infra</text>
  </g>

  <!-- LAYER 1: Workloads -->
  <g transform="translate(70, 95)">
    <rect width="1180" height="110" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#722f8a">LLM Workloads</text>

    <g transform="translate(40, 45)">
      <rect width="540" height="55" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.4"/>
      <text x="20" y="24" font-size="13" font-weight="700" fill="#1a1a2e">Distributed Training</text>
      <text x="20" y="42" font-size="11" fill="#5a4a3a">Multi-node PyTorchJob, DeepSpeed, FSDP across 8-256 GPUs.</text>
    </g>
    <g transform="translate(600, 45)">
      <rect width="540" height="55" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.4"/>
      <text x="20" y="24" font-size="13" font-weight="700" fill="#1a1a2e">Model Serving</text>
      <text x="20" y="42" font-size="11" fill="#5a4a3a">vLLM, TGI, SGLang inference replicas behind a load balancer.</text>
    </g>
  </g>

  <!-- Connectors between layers 1 and 2 -->
  <line x1="340" y1="205" x2="340" y2="245" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900" y1="205" x2="900" y2="245" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LAYER 2: Orchestration -->
  <g transform="translate(70, 245)">
    <rect width="1180" height="245" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#1a4078">Kubernetes Orchestration Layer</text>

    <!-- Sub-panel: Training scheduling -->
    <g transform="translate(30, 50)">
      <rect width="555" height="180" rx="8" fill="#f7faff" stroke="#1a4078" stroke-width="1.4"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a4078">Training Scheduling</text>

      <g transform="translate(14, 38)">
        <rect width="170" height="125" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
        <text x="85" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Kueue</text>
        <text x="85" y="44" font-size="11" text-anchor="middle" fill="#5a4a3a">Admission</text>
        <text x="85" y="60" font-size="11" text-anchor="middle" fill="#5a4a3a">control,</text>
        <text x="85" y="80" font-size="11" text-anchor="middle" fill="#5a4a3a">quotas,</text>
        <text x="85" y="96" font-size="11" text-anchor="middle" fill="#5a4a3a">fair sharing</text>
        <text x="85" y="115" font-size="11" font-style="italic" text-anchor="middle" fill="#1a4078">queue gate</text>
      </g>
      <g transform="translate(192, 38)">
        <rect width="170" height="125" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
        <text x="85" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Volcano</text>
        <text x="85" y="44" font-size="11" text-anchor="middle" fill="#5a4a3a">Gang</text>
        <text x="85" y="60" font-size="11" text-anchor="middle" fill="#5a4a3a">scheduling,</text>
        <text x="85" y="80" font-size="11" text-anchor="middle" fill="#5a4a3a">topology</text>
        <text x="85" y="96" font-size="11" text-anchor="middle" fill="#5a4a3a">awareness</text>
        <text x="85" y="115" font-size="11" font-style="italic" text-anchor="middle" fill="#1a4078">all-or-nothing</text>
      </g>
      <g transform="translate(370, 38)">
        <rect width="170" height="125" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
        <text x="85" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Training Operator</text>
        <text x="85" y="44" font-size="11" text-anchor="middle" fill="#5a4a3a">PyTorchJob</text>
        <text x="85" y="60" font-size="11" text-anchor="middle" fill="#5a4a3a">CRD,</text>
        <text x="85" y="80" font-size="11" text-anchor="middle" fill="#5a4a3a">elastic worker</text>
        <text x="85" y="96" font-size="11" text-anchor="middle" fill="#5a4a3a">restart</text>
        <text x="85" y="115" font-size="11" font-style="italic" text-anchor="middle" fill="#1a4078">job lifecycle</text>
      </g>
    </g>

    <!-- Sub-panel: Inference serving -->
    <g transform="translate(610, 50)">
      <rect width="540" height="180" rx="8" fill="#f4faf5" stroke="#1f7a3a" stroke-width="1.4"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Inference Serving</text>

      <g transform="translate(14, 38)">
        <rect width="245" height="125" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
        <text x="122" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">KServe</text>
        <text x="122" y="46" font-size="11" text-anchor="middle" fill="#5a4a3a">Model routing,</text>
        <text x="122" y="64" font-size="11" text-anchor="middle" fill="#5a4a3a">canary rollout,</text>
        <text x="122" y="82" font-size="11" text-anchor="middle" fill="#5a4a3a">multi-model server</text>
        <text x="122" y="110" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">request layer</text>
      </g>
      <g transform="translate(267, 38)">
        <rect width="245" height="125" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
        <text x="122" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Custom HPA</text>
        <text x="122" y="46" font-size="11" text-anchor="middle" fill="#5a4a3a">Scale on queue depth</text>
        <text x="122" y="64" font-size="11" text-anchor="middle" fill="#5a4a3a">+ GPU utilization,</text>
        <text x="122" y="82" font-size="11" text-anchor="middle" fill="#5a4a3a">not just CPU</text>
        <text x="122" y="110" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">elasticity</text>
      </g>
    </g>
  </g>

  <!-- Connectors between layers 2 and 3 -->
  <line x1="340" y1="490" x2="340" y2="525" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900" y1="490" x2="900" y2="525" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LAYER 3: GPU infra -->
  <g transform="translate(70, 525)">
    <rect width="1180" height="130" rx="10" fill="#1a1a2e" stroke="#0f1f3a" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#ffffff">GPU Infrastructure</text>

    <g transform="translate(40, 45)">
      <rect width="540" height="70" rx="6" fill="#2a2a44" stroke="#fef3e0" stroke-width="1.4"/>
      <text x="20" y="24" font-size="13" font-weight="700" fill="#fef3e0">NVIDIA GPU Operator</text>
      <text x="20" y="44" font-size="11" fill="#cfcfdf">Driver lifecycle, MIG partitioning, DCGM metrics,</text>
      <text x="20" y="60" font-size="11" fill="#cfcfdf">device plugin, container toolkit.</text>
    </g>
    <g transform="translate(600, 45)">
      <rect width="540" height="70" rx="6" fill="#2a2a44" stroke="#ffffff" stroke-width="1.4"/>
      <text x="20" y="24" font-size="13" font-weight="700" fill="#ffffff">GPU Nodes</text>
      <text x="20" y="44" font-size="11" fill="#cfcfdf">A100, H100, NVLink topology, RDMA networking,</text>
      <text x="20" y="60" font-size="11" fill="#cfcfdf">node labels for affinity scheduling.</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(70, 685)">
    <rect width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Training and inference share the same GPU floor but use different orchestration: Kueue/Volcano/Training Operator for batch jobs, KServe + custom HPA for online serving.</text>
  </g>
</svg>
