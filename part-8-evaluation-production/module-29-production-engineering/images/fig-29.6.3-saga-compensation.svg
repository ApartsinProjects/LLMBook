<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Saga Pattern: Forward Then Compensate</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">A failed long-running workflow rolls back by invoking each registered compensation in reverse order.</text>

  <!-- Cycle layout: forward arc on top, compensation arc on bottom -->
  <!-- Six nodes positioned in a horizontal cycle -->

  <!-- Top row: forward path -->
  <g>
    <!-- Step 1: Book Flight -->
    <g transform="translate(110, 160)">
      <circle cx="60" cy="60" r="60" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
      <text x="60" y="50" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Book Flight</text>
      <text x="60" y="68" font-size="11" text-anchor="middle" fill="#1f7a3a" font-style="italic">success</text>
      <text x="60" y="84" font-size="11" text-anchor="middle" fill="#5a4a3a">step 1</text>
    </g>

    <!-- Forward arrow 1 -->
    <g>
      <path d="M 235 220 L 405 220" stroke="#1f7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
      <text x="320" y="208" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">register</text>
      <text x="320" y="240" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">cancel_flight</text>
    </g>

    <!-- Step 2: Book Hotel -->
    <g transform="translate(410, 160)">
      <circle cx="60" cy="60" r="60" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
      <text x="60" y="50" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Book Hotel</text>
      <text x="60" y="68" font-size="11" text-anchor="middle" fill="#1f7a3a" font-style="italic">success</text>
      <text x="60" y="84" font-size="11" text-anchor="middle" fill="#5a4a3a">step 2</text>
    </g>

    <!-- Forward arrow 2 -->
    <g>
      <path d="M 535 220 L 705 220" stroke="#1f7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
      <text x="620" y="208" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">register</text>
      <text x="620" y="240" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">cancel_hotel</text>
    </g>

    <!-- Step 3: Generate Itinerary FAILS -->
    <g transform="translate(710, 160)">
      <circle cx="60" cy="60" r="60" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
      <text x="60" y="46" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Generate</text>
      <text x="60" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Itinerary</text>
      <text x="60" y="80" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">FAILS</text>
    </g>

    <!-- Trigger compensations arrow -->
    <g>
      <path d="M 830 175 Q 970 90 1080 175" stroke="#b3401b" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arr)"/>
      <text x="955" y="105" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">trigger compensations</text>
    </g>

    <!-- Step 4: Cancel Hotel -->
    <g transform="translate(1010, 160)">
      <circle cx="60" cy="60" r="60" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2.5"/>
      <text x="60" y="50" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Cancel Hotel</text>
      <text x="60" y="68" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">undo step 2</text>
      <text x="60" y="84" font-size="11" text-anchor="middle" fill="#5a4a3a">comp 1</text>
    </g>
  </g>

  <!-- Bottom row: compensation path (right to left) -->
  <g>
    <!-- Cancel Hotel -> Cancel Flight (downward to bottom) -->
    <g>
      <path d="M 1070 285 L 1070 380" stroke="#7a5e1a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    </g>

    <!-- Step 5: Cancel Flight -->
    <g transform="translate(1010, 380)">
      <circle cx="60" cy="60" r="60" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2.5"/>
      <text x="60" y="50" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Cancel Flight</text>
      <text x="60" y="68" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">undo step 1</text>
      <text x="60" y="84" font-size="11" text-anchor="middle" fill="#5a4a3a">comp 2</text>
    </g>

    <!-- Cancel Flight -> Report Failure -->
    <g>
      <path d="M 1010 440 L 305 440" stroke="#7a5e1a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
      <text x="660" y="430" font-size="11" font-weight="700" text-anchor="middle" fill="#7a5e1a">reverse order, idempotent</text>
    </g>

    <!-- Report Failure -->
    <g transform="translate(170, 380)">
      <circle cx="65" cy="60" r="65" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
      <text x="65" y="50" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Report Failure</text>
      <text x="65" y="70" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">clean state</text>
      <text x="65" y="86" font-size="11" text-anchor="middle" fill="#5a4a3a">restored</text>
    </g>
  </g>

  <!-- Side legend / callouts -->
  <g transform="translate(60, 540)">
    <rect width="370" height="135" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Why register compensations as you go?</text>
    <text x="14" y="42" font-size="11" fill="#1a1a2e">A saga has no single transaction to abort. Each forward</text>
    <text x="14" y="58" font-size="11" fill="#1a1a2e">step pushes its undo onto a stack. On failure, the runtime</text>
    <text x="14" y="74" font-size="11" fill="#1a1a2e">pops and runs them in reverse, restoring a consistent state</text>
    <text x="14" y="90" font-size="11" fill="#1a1a2e">across services.</text>
    <text x="14" y="114" font-size="11" font-weight="700" fill="#7a5e1a">Compensations must be idempotent.</text>
  </g>

  <g transform="translate(450, 540)">
    <rect width="370" height="135" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#1a4078">Forward path (green)</text>
    <text x="14" y="40" font-size="11" fill="#1a1a2e">Each successful step registers its compensation.</text>
    <text x="14" y="62" font-size="12" font-weight="700" fill="#b3401b">Failure (red)</text>
    <text x="14" y="80" font-size="11" fill="#1a1a2e">Aborts forward execution and triggers rollback.</text>
    <text x="14" y="102" font-size="12" font-weight="700" fill="#7a5e1a">Compensation path (orange)</text>
    <text x="14" y="120" font-size="11" fill="#1a1a2e">Runs registered undos in LIFO order.</text>
  </g>

  <g transform="translate(840, 540)">
    <rect width="400" height="135" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#b3401b">Failure modes to handle</text>
    <text x="14" y="42" font-size="11" fill="#1a1a2e">1. Compensation itself fails: retry with backoff,</text>
    <text x="14" y="58" font-size="11" fill="#1a1a2e">    then alert a human if exhausted.</text>
    <text x="14" y="76" font-size="11" fill="#1a1a2e">2. Partial side effects (email sent, payment captured)</text>
    <text x="14" y="92" font-size="11" fill="#1a1a2e">    need explicit semantic undo, not just delete.</text>
    <text x="14" y="110" font-size="11" fill="#1a1a2e">3. Concurrent sagas: lock or version the resource.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 690)">
    <rect width="1180" height="55" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="23" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="44" font-size="12" fill="#1a1a2e">Sagas trade ACID transactions for explicit, ordered compensations. Every forward step pushes its undo; failure pops them in reverse. Idempotency is non-negotiable.</text>
  </g>
</svg>
