<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="700" y="46" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">Fill-in-the-Middle (FIM): rearranging code so a left-to-right LM can infill</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">A causal LM can only attend to the past. FIM exposes both prefix and suffix by moving the suffix into the prompt and asking the model to generate the missing middle.</text>

  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="1280" height="320" rx="10" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="1280" height="40" rx="10" fill="#1a4078"/>
    <text x="20" y="27" font-size="16" font-weight="700" fill="#ffffff">Source code with hole to fill (the "middle")</text>
    <text x="1260" y="27" font-size="13" text-anchor="end" fill="#ffffff">user's editor view</text>

    <rect x="20" y="60" width="1240" height="240" rx="6" fill="#1a1a2e"/>

    <g font-family="Consolas, Monaco, monospace" font-size="15">
      <text x="36"  y="92" fill="#5a4a3a">1</text>
      <text x="64"  y="92" fill="#7fc4e3">def</text>
      <text x="104" y="92" fill="#f4d35e">binary_search</text>
      <text x="216" y="92" fill="#e0e0e0">(arr, target):</text>
      <text x="36"  y="118" fill="#5a4a3a">2</text>
      <text x="84"  y="118" fill="#9aa0a6">"""Return index of target in sorted arr, or -1."""</text>
      <text x="36"  y="144" fill="#5a4a3a">3</text>
      <text x="84"  y="144" fill="#e0e0e0">lo, hi = 0, len(arr) - 1</text>
      <text x="36"  y="170" fill="#5a4a3a">4</text>
      <text x="84"  y="170" fill="#7fc4e3">while</text>
      <text x="140" y="170" fill="#e0e0e0">lo &lt;= hi:</text>
    </g>

    <rect x="120" y="184" width="1100" height="62" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="670" y="208" font-size="15" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">MIDDLE --- the model must generate the missing 3 lines</text>
    <text x="670" y="232" font-size="13" font-style="italic" text-anchor="middle" fill="#b3401b">mid = (lo + hi) // 2; if arr[mid] == target: return mid; ...</text>

    <g font-family="Consolas, Monaco, monospace" font-size="15">
      <text x="36"  y="270" fill="#5a4a3a">8</text>
      <text x="84"  y="270" fill="#7fc4e3">return</text>
      <text x="148" y="270" fill="#e0e0e0">-1</text>
    </g>

    <g transform="translate(880, 60)">
      <rect x="0"   y="6" width="14" height="14" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="22"  y="18" font-size="12" fill="#ffffff">prefix (lines 1-4)</text>
      <rect x="0"   y="28" width="14" height="14" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="22"  y="40" font-size="12" fill="#ffffff">middle (the hole)</text>
      <rect x="0"   y="50" width="14" height="14" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="22"  y="62" font-size="12" fill="#ffffff">suffix (line 8)</text>
    </g>
  </g>

  <g transform="translate(700, 440)">
    <line x1="0" y1="0" x2="0" y2="36" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="20" y="22" font-size="13" font-style="italic" fill="#5a4a3a">rearrange + insert sentinels</text>
  </g>

  <g transform="translate(60, 490)">
    <rect x="0" y="0" width="1280" height="160" rx="10" fill="#ffffff" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="1280" height="36" rx="10" fill="#1f7a3a"/>
    <text x="20" y="24" font-size="15" font-weight="700" fill="#ffffff">PSM mode --- Prefix, Suffix, Middle</text>
    <text x="1260" y="24" font-size="13" text-anchor="end" fill="#ffffff">used by GPT-3 / OpenAI Codex</text>

    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="90" height="48" rx="5" fill="#722f8a"/>
      <text x="45" y="22" font-size="13" font-family="Consolas, monospace" font-weight="700" text-anchor="middle" fill="#ffffff">&lt;PRE&gt;</text>
      <text x="45" y="38" font-size="11" text-anchor="middle" fill="#e6d4ec">sentinel</text>

      <rect x="98" y="0" width="320" height="48" rx="5" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="258" y="22" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">def binary_search(arr, target):</text>
      <text x="258" y="40" font-size="13" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">  ... lo, hi = 0, ... while lo &lt;= hi:</text>

      <rect x="426" y="0" width="90" height="48" rx="5" fill="#722f8a"/>
      <text x="471" y="22" font-size="13" font-family="Consolas, monospace" font-weight="700" text-anchor="middle" fill="#ffffff">&lt;SUF&gt;</text>
      <text x="471" y="38" font-size="11" text-anchor="middle" fill="#e6d4ec">sentinel</text>

      <rect x="524" y="0" width="220" height="48" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="634" y="30" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">    return -1</text>

      <rect x="752" y="0" width="90" height="48" rx="5" fill="#722f8a"/>
      <text x="797" y="22" font-size="13" font-family="Consolas, monospace" font-weight="700" text-anchor="middle" fill="#ffffff">&lt;MID&gt;</text>
      <text x="797" y="38" font-size="11" text-anchor="middle" fill="#e6d4ec">cursor</text>

      <rect x="850" y="0" width="370" height="48" rx="5" fill="#fdeee8" stroke="#b3401b" stroke-width="2" stroke-dasharray="5,4"/>
      <text x="1035" y="22" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">mid = (lo+hi)//2; if arr[mid] == target:</text>
      <text x="1035" y="40" font-size="13" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">return mid; elif ...   (model writes here)</text>
    </g>

    <text x="20" y="135" font-size="13" font-style="italic" fill="#5a4a3a">Order: &lt;PRE&gt; prefix &lt;SUF&gt; suffix &lt;MID&gt; --- model continues after &lt;MID&gt;, stops at end-of-text.</text>
  </g>

  <g transform="translate(60, 670)">
    <rect x="0" y="0" width="1280" height="160" rx="10" fill="#ffffff" stroke="#7a5e1a" stroke-width="2"/>
    <rect x="0" y="0" width="1280" height="36" rx="10" fill="#7a5e1a"/>
    <text x="20" y="24" font-size="15" font-weight="700" fill="#ffffff">SPM mode --- Suffix, Prefix, Middle</text>
    <text x="1260" y="24" font-size="13" text-anchor="end" fill="#ffffff">used by StarCoder / Code Llama / DeepSeek-Coder</text>

    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="90" height="48" rx="5" fill="#722f8a"/>
      <text x="45" y="22" font-size="13" font-family="Consolas, monospace" font-weight="700" text-anchor="middle" fill="#ffffff">&lt;PRE&gt;</text>
      <text x="45" y="38" font-size="11" text-anchor="middle" fill="#e6d4ec">sentinel</text>

      <rect x="98" y="0" width="90" height="48" rx="5" fill="#722f8a"/>
      <text x="143" y="22" font-size="13" font-family="Consolas, monospace" font-weight="700" text-anchor="middle" fill="#ffffff">&lt;SUF&gt;</text>
      <text x="143" y="38" font-size="11" text-anchor="middle" fill="#e6d4ec">sentinel</text>

      <rect x="196" y="0" width="220" height="48" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="306" y="30" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">    return -1</text>

      <rect x="424" y="0" width="90" height="48" rx="5" fill="#722f8a"/>
      <text x="469" y="22" font-size="13" font-family="Consolas, monospace" font-weight="700" text-anchor="middle" fill="#ffffff">&lt;MID&gt;</text>
      <text x="469" y="38" font-size="11" text-anchor="middle" fill="#e6d4ec">sentinel</text>

      <rect x="522" y="0" width="320" height="48" rx="5" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="682" y="22" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">def binary_search(arr, target):</text>
      <text x="682" y="40" font-size="13" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">  ... lo, hi = 0, ... while lo &lt;= hi:</text>

      <rect x="850" y="0" width="370" height="48" rx="5" fill="#fdeee8" stroke="#b3401b" stroke-width="2" stroke-dasharray="5,4"/>
      <text x="1035" y="22" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">mid = (lo+hi)//2; if arr[mid] == target:</text>
      <text x="1035" y="40" font-size="13" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">return mid; elif ...   (model writes here)</text>
    </g>

    <text x="20" y="135" font-size="13" font-style="italic" fill="#5a4a3a">Order: &lt;PRE&gt; &lt;SUF&gt; suffix &lt;MID&gt; prefix --- model writes middle directly after the prefix it just consumed.</text>
  </g>

  <g transform="translate(60, 850)">
    <rect x="0" y="0" width="1280" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="52" font-size="13" fill="#1a1a2e">FIM teaches an autoregressive model to infill by training on randomly-split documents reformatted with three sentinel tokens. Same architecture, no encoder needed: the "middle" is generated</text>
    <text x="20" y="70" font-size="13" fill="#1a1a2e">left-to-right after the model has seen both prefix and suffix. PSM puts the cursor at the end; SPM puts it adjacent to the prefix, which empirically improves stop-token discipline.</text>
  </g>
</svg>
