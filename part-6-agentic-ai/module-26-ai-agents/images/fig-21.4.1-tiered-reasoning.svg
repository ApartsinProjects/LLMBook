<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Tiered Reasoning: Right-Size the Model per Query</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">A lightweight classifier routes simple queries to small models, hard ones to reasoning models — saves cost without losing quality</text>

  <!-- Input -->
  <g>
    <rect x="60" y="160" width="200" height="80" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="160" y="190" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">User query</text>
    <text x="160" y="212" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">any complexity, mixed traffic</text>
  </g>

  <line x1="260" y1="200" x2="320" y2="200" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Classifier -->
  <g>
    <rect x="320" y="160" width="220" height="80" rx="10" fill="#1a1a2e" stroke="#0f3460" stroke-width="2"/>
    <text x="430" y="190" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Complexity classifier</text>
    <text x="430" y="212" font-size="11" font-style="italic" text-anchor="middle" fill="#cfd8e3">tiny model, ~10 ms, $0.0001</text>
  </g>

  <!-- 3 routing arrows with traffic % -->
  <line x1="540" y1="190" x2="640" y2="130" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="585" y="115" font-size="13" font-weight="700" fill="#1f7a3a">80%</text>

  <line x1="540" y1="200" x2="640" y2="320" stroke="#1a4078" stroke-width="2" marker-end="url(#arr)"/>
  <text x="555" y="282" font-size="13" font-weight="700" fill="#1a4078">15%</text>

  <line x1="540" y1="220" x2="640" y2="510" stroke="#7a5e1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="555" y="425" font-size="13" font-weight="700" fill="#7a5e1a">5%</text>

  <!-- Tier 1 -->
  <g>
    <rect x="640" y="100" width="290" height="100" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="785" y="128" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Tier 1 · Fast model</text>
    <text x="785" y="152" font-size="12" text-anchor="middle" fill="#1a1a2e">Claude Haiku · ~200 ms · $0.001/req</text>
    <text x="785" y="180" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">FAQ, status checks, simple formatting</text>
  </g>

  <!-- Tier 2 -->
  <g>
    <rect x="640" y="290" width="290" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="785" y="318" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Tier 2 · Standard model</text>
    <text x="785" y="342" font-size="12" text-anchor="middle" fill="#1a1a2e">Claude Sonnet · ~2 s · $0.01/req</text>
    <text x="785" y="370" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">troubleshooting, tool use, analysis</text>
  </g>

  <!-- Tier 3 -->
  <g>
    <rect x="640" y="480" width="290" height="100" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2.5"/>
    <text x="785" y="508" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">Tier 3 · Reasoning model</text>
    <text x="785" y="532" font-size="12" text-anchor="middle" fill="#1a1a2e">Extended thinking · ~15 s · $0.10/req</text>
    <text x="785" y="560" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">novel problems, multi-service debug, planning</text>
  </g>

  <!-- Convergence to response -->
  <line x1="930" y1="150" x2="1080" y2="320" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="930" y1="340" x2="1080" y2="340" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="930" y1="530" x2="1080" y2="360" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="1080" y="290" width="180" height="100" rx="10" fill="#1a1a2e" stroke="#0f3460" stroke-width="2.5"/>
    <text x="1170" y="328" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Response</text>
    <text x="1170" y="358" font-size="11" font-style="italic" text-anchor="middle" fill="#cfd8e3">unified output</text>
  </g>

  <!-- Cost savings panel -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="1200" height="80" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7a5e1a">Cost arithmetic (per 1k requests)</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Naive: 1000 × $0.10 = $100. Tiered: 800 × $0.001 + 150 × $0.01 + 50 × $0.10 = $0.80 + $1.50 + $5.00 = <tspan font-weight="700" fill="#1f7a3a">$7.30 (93% saved)</tspan></text>
    <text x="20" y="70" font-size="12" font-style="italic" fill="#5a4a3a">Quality is preserved because the classifier escalates correctly &gt; 95% of the time on production traffic.</text>
  </g>
</svg>
