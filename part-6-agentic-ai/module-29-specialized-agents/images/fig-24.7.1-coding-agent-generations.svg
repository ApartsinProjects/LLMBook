<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Four Generations of Coding Agents</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">From inline autocomplete to autonomous task ownership: each step expands context and authority</text>

  <!-- Timeline axis -->
  <line x1="80" y1="555" x2="1220" y2="555" stroke="#5a4a3a" stroke-width="1.5"/>
  <text x="80" y="585" font-size="11" fill="#5a4a3a">2021</text>
  <text x="380" y="585" font-size="11" fill="#5a4a3a">2023</text>
  <text x="680" y="585" font-size="11" fill="#5a4a3a">2024</text>
  <text x="1100" y="585" font-size="11" fill="#5a4a3a">2025+</text>
  <text x="1245" y="560" font-size="11" fill="#5a4a3a">time</text>

  <!-- Gen 1 -->
  <g transform="translate(80,110)">
    <rect x="0" y="0" width="240" height="200" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="36" rx="10" fill="#1a4078"/>
    <text x="120" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Gen 1 -- 2021-2022</text>
    <text x="120" y="62" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Autocomplete</text>
    <text x="120" y="92" font-size="12" text-anchor="middle" fill="#1a1a2e">Inline predictions</text>
    <text x="120" y="112" font-size="12" text-anchor="middle" fill="#1a1a2e">Single-file context</text>
    <text x="120" y="132" font-size="12" text-anchor="middle" fill="#1a1a2e">Token-level suggest</text>
    <line x1="20" y1="150" x2="220" y2="150" stroke="#1a4078" stroke-width="0.7" stroke-dasharray="2,2"/>
    <text x="120" y="170" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Examples</text>
    <text x="120" y="188" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">Copilot</text>
  </g>
  <circle cx="200" cy="555" r="6" fill="#1a4078"/>

  <!-- arrow 1->2 -->
  <line x1="320" y1="210" x2="380" y2="210" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="350" y="200" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">+context</text>

  <!-- Gen 2 -->
  <g transform="translate(380,110)">
    <rect x="0" y="0" width="240" height="200" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="36" rx="10" fill="#1f7a3a"/>
    <text x="120" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Gen 2 -- 2023</text>
    <text x="120" y="62" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Chat</text>
    <text x="120" y="92" font-size="12" text-anchor="middle" fill="#1a1a2e">Q&amp;A about code</text>
    <text x="120" y="112" font-size="12" text-anchor="middle" fill="#1a1a2e">Snippet generation</text>
    <text x="120" y="132" font-size="12" text-anchor="middle" fill="#1a1a2e">Conversational loop</text>
    <line x1="20" y1="150" x2="220" y2="150" stroke="#1f7a3a" stroke-width="0.7" stroke-dasharray="2,2"/>
    <text x="120" y="170" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Examples</text>
    <text x="120" y="188" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">ChatGPT, Cody</text>
  </g>
  <circle cx="500" cy="555" r="6" fill="#1f7a3a"/>

  <!-- arrow 2->3 -->
  <line x1="620" y1="210" x2="680" y2="210" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="650" y="200" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">+multi-file</text>

  <!-- Gen 3 -->
  <g transform="translate(680,110)">
    <rect x="0" y="0" width="240" height="200" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="36" rx="10" fill="#722f8a"/>
    <text x="120" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Gen 3 -- 2024</text>
    <text x="120" y="62" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Multi-File Edit</text>
    <text x="120" y="92" font-size="12" text-anchor="middle" fill="#1a1a2e">Codebase context</text>
    <text x="120" y="112" font-size="12" text-anchor="middle" fill="#1a1a2e">Coordinated changes</text>
    <text x="120" y="132" font-size="12" text-anchor="middle" fill="#1a1a2e">Refactor across files</text>
    <line x1="20" y1="150" x2="220" y2="150" stroke="#722f8a" stroke-width="0.7" stroke-dasharray="2,2"/>
    <text x="120" y="170" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Examples</text>
    <text x="120" y="188" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Cursor, Aider</text>
  </g>
  <circle cx="800" cy="555" r="6" fill="#722f8a"/>

  <!-- arrow 3->4 -->
  <line x1="920" y1="210" x2="980" y2="210" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="950" y="200" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">+autonomy</text>

  <!-- Gen 4 highlighted -->
  <g transform="translate(980,100)">
    <rect x="0" y="0" width="240" height="220" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="2.5"/>
    <rect x="0" y="0" width="240" height="36" rx="10" fill="#7a5e1a"/>
    <text x="120" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Gen 4 -- 2025+</text>
    <text x="120" y="62" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Agentic</text>
    <text x="120" y="92" font-size="12" text-anchor="middle" fill="#1a1a2e">Task ownership</text>
    <text x="120" y="112" font-size="12" text-anchor="middle" fill="#1a1a2e">Plan, execute, test</text>
    <text x="120" y="132" font-size="12" text-anchor="middle" fill="#1a1a2e">Iterate to completion</text>
    <text x="120" y="152" font-size="12" text-anchor="middle" fill="#1a1a2e">Long-horizon loop</text>
    <line x1="20" y1="170" x2="220" y2="170" stroke="#7a5e1a" stroke-width="0.7" stroke-dasharray="2,2"/>
    <text x="120" y="190" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Examples</text>
    <text x="120" y="208" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">Claude Code, Devin</text>
  </g>
  <circle cx="1100" cy="555" r="7" fill="#7a5e1a"/>

  <!-- Axis growing-bar showing context/authority -->
  <g transform="translate(80,400)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#5a4a3a">Context window</text>
    <rect x="120" y="-12" width="60" height="14" fill="#1a4078" opacity="0.7"/>
    <rect x="420" y="-12" width="120" height="14" fill="#1f7a3a" opacity="0.7"/>
    <rect x="720" y="-12" width="200" height="14" fill="#722f8a" opacity="0.7"/>
    <rect x="1020" y="-12" width="200" height="14" fill="#7a5e1a" opacity="0.7"/>

    <text x="0" y="40" font-size="12" font-weight="700" fill="#5a4a3a">Agent authority</text>
    <rect x="120" y="28" width="40" height="14" fill="#1a4078" opacity="0.7"/>
    <rect x="420" y="28" width="80" height="14" fill="#1f7a3a" opacity="0.7"/>
    <rect x="720" y="28" width="160" height="14" fill="#722f8a" opacity="0.7"/>
    <rect x="1020" y="28" width="200" height="14" fill="#7a5e1a" opacity="0.7"/>

    <text x="0" y="80" font-size="12" font-weight="700" fill="#5a4a3a">Human oversight</text>
    <rect x="120" y="68" width="200" height="14" fill="#b3401b" opacity="0.7"/>
    <rect x="420" y="68" width="160" height="14" fill="#b3401b" opacity="0.6"/>
    <rect x="720" y="68" width="100" height="14" fill="#b3401b" opacity="0.5"/>
    <rect x="1020" y="68" width="50" height="14" fill="#b3401b" opacity="0.4"/>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 615)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Each generation expands context and shifts decisions away from the developer; agentic tools own the full plan-execute-test loop while humans set goals and review outcomes.</text>
  </g>
</svg>
