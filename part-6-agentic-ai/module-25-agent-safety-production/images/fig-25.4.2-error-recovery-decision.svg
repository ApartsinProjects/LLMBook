<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Error Recovery Decision Flow</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">From error detection through retry, fallback, circuit breaking, and graceful degradation</text>

  <!-- Error detected -->
  <g>
    <rect x="540" y="90" width="220" height="48" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="650" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Error Detected</text>
  </g>

  <!-- TRANS diamond -->
  <line x1="650" y1="138" x2="650" y2="170" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <g>
    <polygon points="650,170 850,235 650,300 450,235" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="650" y="225" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Transient?</text>
    <text x="650" y="245" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">timeout, rate limit, 5xx</text>
  </g>

  <!-- Yes -> retry -->
  <line x1="450" y1="235" x2="280" y2="235" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="365" y="225" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Yes</text>
  <g>
    <rect x="80" y="200" width="200" height="70" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="180" y="228" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Retry</text>
    <text x="180" y="250" font-size="11" text-anchor="middle" fill="#5a4a3a">exponential backoff +</text>
    <text x="180" y="264" font-size="11" text-anchor="middle" fill="#5a4a3a">jitter, capped attempts</text>
  </g>

  <!-- retry -> SUCC1 -->
  <line x1="180" y1="270" x2="180" y2="320" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <g>
    <polygon points="180,320 320,365 180,410 40,365" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="180" y="370" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Succeeded?</text>
  </g>

  <!-- No -> Q PERM -->
  <line x1="650" y1="300" x2="650" y2="335" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="668" y="324" font-size="12" font-weight="700" fill="#b3401b">No</text>
  <g>
    <polygon points="650,335 850,395 650,455 450,395" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="650" y="385" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Alternative</text>
    <text x="650" y="405" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">available?</text>
  </g>

  <!-- PERM Yes -> FALL -->
  <line x1="850" y1="395" x2="980" y2="395" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="915" y="385" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Yes</text>
  <g>
    <rect x="985" y="360" width="220" height="70" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="1095" y="388" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Fallback Chain</text>
    <text x="1095" y="410" font-size="11" text-anchor="middle" fill="#5a4a3a">secondary provider,</text>
    <text x="1095" y="424" font-size="11" text-anchor="middle" fill="#5a4a3a">cached or smaller model</text>
  </g>

  <!-- SUCC1 No -> FALL (curve right & up to FALL) -->
  <path d="M 320 365 C 600 365 850 395 985 395" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="540" y="356" font-size="11" font-weight="700" fill="#b3401b">No, max retries</text>

  <!-- SUCC1 Yes -> Continue -->
  <line x1="180" y1="410" x2="180" y2="445" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="430" font-size="12" font-weight="700" fill="#1f7a3a">Yes</text>

  <!-- FALL -> SUCC2 -->
  <line x1="1095" y1="430" x2="1095" y2="475" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <g>
    <polygon points="1095,475 1235,520 1095,565 955,520" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="1095" y="525" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Succeeded?</text>
  </g>

  <!-- SUCC2 Yes -> DONE Continue (long curve down-left) -->
  <path d="M 955 520 C 600 540 400 540 280 510" fill="none" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="700" y="535" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Yes</text>

  <!-- DONE: Continue -->
  <g>
    <rect x="80" y="445" width="200" height="65" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="180" y="475" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Continue</text>
    <text x="180" y="495" font-size="11" text-anchor="middle" fill="#5a4a3a">recovered, resume task</text>
  </g>

  <!-- PERM No -> CB -->
  <line x1="650" y1="455" x2="650" y2="555" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="668" y="510" font-size="12" font-weight="700" fill="#b3401b">No</text>

  <!-- SUCC2 No -> CB -->
  <path d="M 1095 565 C 1095 600 850 605 760 595" fill="none" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="990" y="592" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">No</text>

  <!-- Circuit Breaker -->
  <g>
    <rect x="540" y="555" width="220" height="80" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="650" y="585" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Circuit Breaker</text>
    <text x="650" y="606" font-size="11" text-anchor="middle" fill="#5a4a3a">stop calling failed</text>
    <text x="650" y="622" font-size="11" text-anchor="middle" fill="#5a4a3a">component, set timer</text>
  </g>

  <!-- CB -> Graceful -->
  <line x1="650" y1="635" x2="650" y2="670" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <g>
    <rect x="500" y="670" width="300" height="70" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="2.5"/>
    <text x="650" y="700" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Graceful Degradation</text>
    <text x="650" y="720" font-size="11" text-anchor="middle" fill="#5a4a3a">return partial result, default response,</text>
    <text x="650" y="734" font-size="11" text-anchor="middle" fill="#5a4a3a">or surface a clear error to caller</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 762)">
    <rect x="0" y="0" width="1140" height="48" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="20" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="38" font-size="12" fill="#1a1a2e">Classify the error first; transient faults retry, permanent faults fall back, and only when nothing works do you trip the breaker and degrade gracefully.</text>
  </g>
</svg>
