<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" font-family="Helvetica, Arial, sans-serif">
  <title>Picking an agent framework</title>
  <rect width="1100" height="650" fill="#ffffff"/>
  <defs>
    <marker id="arrFW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Picking an agent framework</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">First question is architectural; framework features come second</text>

  <!-- Top: single vs multi -->
  <polygon points="550,100 720,140 550,180 380,140" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
  <text x="550" y="146" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Single or multi agent?</text>

  <line x1="430" y1="165" x2="280" y2="220" stroke="#5a4a3a" stroke-width="1.8" marker-end="url(#arrFW)"/>
  <text x="320" y="195" font-size="12" font-weight="700" fill="#5a4a3a">single</text>

  <line x1="670" y1="165" x2="820" y2="220" stroke="#5a4a3a" stroke-width="1.8" marker-end="url(#arrFW)"/>
  <text x="760" y="195" font-size="12" font-weight="700" fill="#5a4a3a">multi</text>

  <!-- Left branch: Q2 typed outputs -->
  <polygon points="250,220 420,260 250,300 80,260" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
  <text x="250" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Strict typed outputs?</text>

  <line x1="150" y1="290" x2="100" y2="340" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arrFW)"/>
  <text x="90" y="320" font-size="11" font-weight="700" fill="#5a4a3a">yes</text>
  <line x1="350" y1="290" x2="400" y2="340" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arrFW)"/>
  <text x="395" y="320" font-size="11" font-weight="700" fill="#5a4a3a">no</text>

  <rect x="20" y="345" width="180" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
  <text x="110" y="370" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">PydanticAI</text>
  <text x="110" y="392" font-size="11" text-anchor="middle" fill="#1a1a2e">type-safe outputs</text>

  <rect x="320" y="345" width="180" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
  <text x="410" y="370" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">OpenAI Agents SDK</text>
  <text x="410" y="392" font-size="11" text-anchor="middle" fill="#1a1a2e">tightest GPT integration</text>

  <!-- Right branch: Q3 checkpoints -->
  <polygon points="850,220 1020,260 850,300 680,260" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
  <text x="850" y="258" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Need checkpoints +</text>
  <text x="850" y="274" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">recovery?</text>

  <line x1="750" y1="290" x2="700" y2="340" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arrFW)"/>
  <text x="690" y="320" font-size="11" font-weight="700" fill="#5a4a3a">yes</text>
  <line x1="950" y1="290" x2="1000" y2="340" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arrFW)"/>
  <text x="995" y="320" font-size="11" font-weight="700" fill="#5a4a3a">no</text>

  <rect x="620" y="345" width="180" height="70" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="2.5"/>
  <text x="710" y="370" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">LangGraph</text>
  <text x="710" y="392" font-size="11" text-anchor="middle" fill="#1a1a2e">checkpoint + recovery</text>

  <rect x="920" y="345" width="160" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
  <text x="1000" y="370" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">CrewAI</text>
  <text x="1000" y="392" font-size="11" text-anchor="middle" fill="#1a1a2e">role-based, quickest</text>

  <!-- Three patterns at bottom -->
  <g transform="translate(40, 450)">
    <rect width="1020" height="180" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="510" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Three architecture patterns underneath</text>

    <text x="20" y="58" font-size="13" font-weight="700" fill="#1a4078">Graph-based</text>
    <text x="20" y="80" font-size="11" fill="#1a1a2e">LangGraph: typed state dict, conditional edges</text>
    <text x="20" y="100" font-size="11" font-style="italic" fill="#5a4a3a">multi-agent with state recovery</text>

    <text x="360" y="58" font-size="13" font-weight="700" fill="#1f7a3a">Role-based</text>
    <text x="360" y="80" font-size="11" fill="#1a1a2e">CrewAI, AutoGen: personas + orchestrator</text>
    <text x="360" y="100" font-size="11" font-style="italic" fill="#5a4a3a">quick multi-agent prototypes</text>

    <text x="700" y="58" font-size="13" font-weight="700" fill="#722f8a">Code-first</text>
    <text x="700" y="80" font-size="11" fill="#1a1a2e">OpenAI SDK, PydanticAI: plain function calls</text>
    <text x="700" y="100" font-size="11" font-style="italic" fill="#5a4a3a">single-agent with strong typing</text>

    <text x="510" y="150" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Pick the pattern first; the framework name is secondary.</text>
  </g>
</svg>
