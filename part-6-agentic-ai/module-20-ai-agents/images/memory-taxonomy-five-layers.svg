<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Five Layers of Agent Memory</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Working memory is the LLM's context window; the other four are external stores that load into it on demand</text>

  <!-- Working memory at center -->
  <g>
    <circle cx="650" cy="370" r="120" fill="#fdeee8" stroke="#b3401b" stroke-width="3"/>
    <text x="650" y="358" font-size="18" font-weight="700" text-anchor="middle" fill="#b3401b">Working memory</text>
    <text x="650" y="382" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">LLM context window</text>
    <text x="650" y="402" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">fast · bounded</text>
    <text x="650" y="422" font-size="11" text-anchor="middle" fill="#5a4a3a">(everything else loads here)</text>
  </g>

  <!-- 4 external stores around it -->
  <g>
    <!-- Episodic (top-left) -->
    <rect x="120" y="130" width="240" height="120" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="240" y="160" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Episodic memory</text>
    <text x="240" y="186" font-size="12" text-anchor="middle" fill="#1a1a2e">conversation history</text>
    <text x="240" y="206" font-size="12" text-anchor="middle" fill="#1a1a2e">events, timestamps</text>
    <text x="240" y="232" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">e.g. "yesterday user asked about X"</text>

    <!-- Semantic (top-right) -->
    <rect x="940" y="130" width="240" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="1060" y="160" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Semantic memory</text>
    <text x="1060" y="186" font-size="12" text-anchor="middle" fill="#1a1a2e">facts, summaries</text>
    <text x="1060" y="206" font-size="12" text-anchor="middle" fill="#1a1a2e">distilled knowledge</text>
    <text x="1060" y="232" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">e.g. "user is on the Pro plan"</text>

    <!-- Profile (bottom-left) -->
    <rect x="120" y="490" width="240" height="120" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="240" y="520" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">Profile memory</text>
    <text x="240" y="546" font-size="12" text-anchor="middle" fill="#1a1a2e">prefs, persona, config</text>
    <text x="240" y="566" font-size="12" text-anchor="middle" fill="#1a1a2e">timezone, language</text>
    <text x="240" y="592" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">e.g. "respond in French"</text>

    <!-- Retrieval (bottom-right) -->
    <rect x="940" y="490" width="240" height="120" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="1060" y="520" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Retrieval memory</text>
    <text x="1060" y="546" font-size="12" text-anchor="middle" fill="#1a1a2e">vector store, docs</text>
    <text x="1060" y="566" font-size="12" text-anchor="middle" fill="#1a1a2e">external knowledge base</text>
    <text x="1060" y="592" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">e.g. RAG over company wiki</text>
  </g>

  <!-- Bidirectional arrows: load (solid) + write-back (dashed) -->
  <g stroke="#1a1a2e" stroke-width="1.5" fill="none">
    <!-- Episodic -->
    <line x1="360" y1="200" x2="540" y2="320" marker-end="url(#arr)"/>
    <text x="395" y="245" font-size="11" font-style="italic" fill="#1a4078">load</text>
  </g>
  <g stroke="#722f8a" stroke-width="1.5" stroke-dasharray="5 3" fill="none">
    <line x1="540" y1="350" x2="360" y2="220" marker-end="url(#arr)"/>
    <text x="455" y="290" font-size="11" font-style="italic" fill="#722f8a">write back</text>
  </g>

  <g stroke="#1a1a2e" stroke-width="1.5" fill="none">
    <!-- Semantic -->
    <line x1="940" y1="200" x2="760" y2="320" marker-end="url(#arr)"/>
    <text x="855" y="245" font-size="11" font-style="italic" fill="#1f7a3a">load</text>
  </g>
  <g stroke="#722f8a" stroke-width="1.5" stroke-dasharray="5 3" fill="none">
    <line x1="760" y1="350" x2="940" y2="220" marker-end="url(#arr)"/>
  </g>

  <g stroke="#1a1a2e" stroke-width="1.5" fill="none">
    <!-- Profile -->
    <line x1="360" y1="540" x2="540" y2="420" marker-end="url(#arr)"/>
    <text x="395" y="495" font-size="11" font-style="italic" fill="#7a5e1a">load</text>
  </g>
  <g stroke="#722f8a" stroke-width="1.5" stroke-dasharray="5 3" fill="none">
    <line x1="540" y1="390" x2="360" y2="520" marker-end="url(#arr)"/>
  </g>

  <g stroke="#1a1a2e" stroke-width="1.5" fill="none">
    <!-- Retrieval -->
    <line x1="940" y1="540" x2="760" y2="420" marker-end="url(#arr)"/>
    <text x="855" y="495" font-size="11" font-style="italic" fill="#722f8a">load</text>
  </g>
  <g stroke="#722f8a" stroke-width="1.5" stroke-dasharray="5 3" fill="none">
    <line x1="760" y1="390" x2="940" y2="520" marker-end="url(#arr)"/>
  </g>

  <!-- Legend -->
  <g transform="translate(540, 640)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="50" y="14" font-size="11" fill="#5a4a3a">load into context</text>
    <line x1="180" y1="10" x2="220" y2="10" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="230" y="14" font-size="11" fill="#5a4a3a">write back / persist</text>
  </g>
</svg>
