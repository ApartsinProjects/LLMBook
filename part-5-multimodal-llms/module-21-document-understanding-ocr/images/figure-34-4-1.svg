<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Canonical seven-stage document AI pipeline</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Canonical seven-stage document AI pipeline</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each stage is independently swappable; modern systems collapse stages 2-5 into one MLLM call</text>
  <defs><linearGradient id="g_34_4_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_34_4_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_34_4_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_34_4_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_34_4_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_34_4_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_34_4_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_34_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_34_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_34_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_34_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(30,180)"><rect x="0" y="0" width="145" height="95" rx="10" fill="url(#g_34_4_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="72" y="39" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Ingest</text><text x="72" y="59" font-size="11" text-anchor="middle" fill="#1a1a2e">PDF/scan</text><text x="72" y="77" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">stage 1</text></g><line x1="175" y1="227" x2="180" y2="227" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_34_4_1)"/><g transform="translate(180,180)"><rect x="0" y="0" width="145" height="95" rx="10" fill="url(#g_34_4_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="72" y="39" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Pre-process</text><text x="72" y="59" font-size="11" text-anchor="middle" fill="#1a1a2e">deskew</text><text x="72" y="77" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">stage 2</text></g><line x1="325" y1="227" x2="330" y2="227" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_34_4_1)"/><g transform="translate(330,180)"><rect x="0" y="0" width="145" height="95" rx="10" fill="url(#g_34_4_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="72" y="39" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">OCR</text><text x="72" y="59" font-size="11" text-anchor="middle" fill="#1a1a2e">text</text><text x="72" y="77" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">stage 3</text></g><line x1="475" y1="227" x2="480" y2="227" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_34_4_1)"/><g transform="translate(480,180)"><rect x="0" y="0" width="145" height="95" rx="10" fill="url(#g_34_4_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="72" y="39" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Layout</text><text x="72" y="59" font-size="11" text-anchor="middle" fill="#1a1a2e">regions</text><text x="72" y="77" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">stage 4</text></g><line x1="625" y1="227" x2="630" y2="227" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_34_4_1)"/><g transform="translate(630,180)"><rect x="0" y="0" width="145" height="95" rx="10" fill="url(#g_34_4_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="72" y="39" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Parse</text><text x="72" y="59" font-size="11" text-anchor="middle" fill="#1a1a2e">fields</text><text x="72" y="77" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">stage 5</text></g><line x1="775" y1="227" x2="780" y2="227" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_34_4_1)"/><g transform="translate(780,180)"><rect x="0" y="0" width="145" height="95" rx="10" fill="url(#g_34_4_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="72" y="39" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Validate</text><text x="72" y="59" font-size="11" text-anchor="middle" fill="#1a1a2e">rules</text><text x="72" y="77" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">stage 6</text></g><line x1="925" y1="227" x2="930" y2="227" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG_34_4_1)"/><g transform="translate(930,180)"><rect x="0" y="0" width="145" height="95" rx="10" fill="url(#g_34_4_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="72" y="39" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Persist</text><text x="72" y="59" font-size="11" text-anchor="middle" fill="#1a1a2e">DB / API</text><text x="72" y="77" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">stage 7</text></g><g transform="translate(40,380)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Swappability is the whole point</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Each stage has an open-source default and a commercial premium; you can mix and match.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Frontier MLLMs (GPT-4o, Gemini 2.5, Claude) collapse OCR -&gt; layout -&gt; parse into one model call.</text></g></svg>
