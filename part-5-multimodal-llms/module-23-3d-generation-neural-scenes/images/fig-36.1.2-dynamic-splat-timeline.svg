<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Dynamic Gaussian Splat evolution (18 months)</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Dynamic Gaussian Splat evolution (18 months)</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each variant trades off memory, motion fidelity, and training time</text>
  <defs><linearGradient id="g_36_1_2_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_36_1_2_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_36_1_2_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_36_1_2_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_36_1_2_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_36_1_2_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_36_1_2_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_36_1_2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_36_1_2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_36_1_2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_36_1_2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,130)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_36_1_2_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Static 3DGS</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">2023 baseline</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">no motion</text></g><g transform="translate(260,130)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_36_1_2_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">4D GS</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">per-frame deltas</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">memory heavy</text></g><g transform="translate(480,130)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_36_1_2_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Deformable GS</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">neural deform field</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">compact</text></g><g transform="translate(700,130)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_36_1_2_red)" stroke="#b3401b" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">STG</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">spacetime polynomials</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">smooth motion</text></g><g transform="translate(40,280)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_36_1_2_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Compressed 3DGS</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">self-organizing</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">ship-ready</text></g><g transform="translate(260,280)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_36_1_2_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Mip-Splatting</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">anti-alias 3DGS</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">filtering</text></g><g transform="translate(480,280)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_36_1_2_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Generative GS</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">diffusion seed</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">text-&gt;splat</text></g><g transform="translate(700,280)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_36_1_2_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Hierarchical GS</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">LOD pyramid</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">real-time city</text></g><line x1="241" y1="185" x2="259" y2="185" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_36_1_2)"/><line x1="461" y1="185" x2="479" y2="185" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_36_1_2)"/><line x1="681" y1="185" x2="699" y2="185" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_36_1_2)"/><line x1="241" y1="335" x2="259" y2="335" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG_36_1_2)"/><line x1="461" y1="335" x2="479" y2="335" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG_36_1_2)"/><line x1="681" y1="335" x2="699" y2="335" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_36_1_2)"/><line x1="140" y1="240" x2="140" y2="279" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_36_1_2)"/><g transform="translate(40,430)"><rect x="0" y="0" width="1020" height="54" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Two parallel pressures: motion fidelity and deployability</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Top row chases scene dynamism; bottom row chases delivery (compression, anti-alias, LOD).</text></g></svg>
