<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Direct 3D diffusion</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Direct 3D diffusion</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Sample in a 3D latent, decode once</text>
  <defs><linearGradient id="g_36_4_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_36_4_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_36_4_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_36_4_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_36_4_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_36_4_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_36_4_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_36_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_36_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_36_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_36_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,150)"><rect x="0" y="0" width="220" height="130" rx="10" fill="url(#g_36_4_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="110" y="57" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Text / image</text><text x="110" y="77" font-size="11" text-anchor="middle" fill="#1a1a2e">conditioning</text><text x="110" y="95" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">CLIP / T5</text></g><g transform="translate(290,150)"><rect x="0" y="0" width="240" height="130" rx="10" fill="url(#g_36_4_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="120" y="57" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">3D Latent diffusion</text><text x="120" y="77" font-size="11" text-anchor="middle" fill="#1a1a2e">denoise tri-plane / voxel</text><text x="120" y="95" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">30-100 steps</text></g><g transform="translate(560,150)"><rect x="0" y="0" width="240" height="130" rx="10" fill="url(#g_36_4_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="120" y="57" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">3D decoder</text><text x="120" y="77" font-size="11" text-anchor="middle" fill="#1a1a2e">latent -&gt; mesh or splats</text><text x="120" y="95" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">single forward pass</text></g><g transform="translate(830,150)"><rect x="0" y="0" width="230" height="130" rx="10" fill="url(#g_36_4_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="115" y="57" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">3D asset</text><text x="115" y="77" font-size="11" text-anchor="middle" fill="#1a1a2e">textured mesh</text><text x="115" y="95" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">minutes -&gt; seconds</text></g><line x1="261" y1="215" x2="289" y2="215" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_36_4_1)"/><line x1="531" y1="215" x2="559" y2="215" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_36_4_1)"/><line x1="801" y1="215" x2="829" y2="215" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_36_4_1)"/><g transform="translate(40,380)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">One-shot vs two-stage trade-off</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Direct 3D is fast but constrained by 3D training data; multi-view is more flexible but slower.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">2026 hybrids do both: multi-view warm start + direct 3D refinement in one model.</text></g></svg>
