<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Helvetica, Arial, sans-serif">
  <title>Inverse rendering</title>
  <rect width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Inverse rendering</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Factor observed radiance into geometry, material, and illumination</text>
  <defs><linearGradient id="g_36_5_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_36_5_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_36_5_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_36_5_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_36_5_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_36_5_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_36_5_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_36_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_36_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_36_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_36_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(60,200)"><rect x="0" y="0" width="220" height="120" rx="10" fill="url(#g_36_5_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="110" y="52" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Captured images</text><text x="110" y="72" font-size="11" text-anchor="middle" fill="#1a1a2e">multi-view photos</text></g><g transform="translate(360,100)"><rect x="0" y="0" width="230" height="100" rx="10" fill="url(#g_36_5_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="115" y="42" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Geometry</text><text x="115" y="62" font-size="11" text-anchor="middle" fill="#1a1a2e">mesh / splats</text><text x="115" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">shape</text></g><g transform="translate(360,230)"><rect x="0" y="0" width="230" height="100" rx="10" fill="url(#g_36_5_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="115" y="42" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Material</text><text x="115" y="62" font-size="11" text-anchor="middle" fill="#1a1a2e">BRDF maps</text><text x="115" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">albedo, roughness</text></g><g transform="translate(360,360)"><rect x="0" y="0" width="230" height="100" rx="10" fill="url(#g_36_5_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="115" y="42" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Illumination</text><text x="115" y="62" font-size="11" text-anchor="middle" fill="#1a1a2e">env map / lights</text><text x="115" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">where light comes from</text></g><g transform="translate(670,230)"><rect x="0" y="0" width="240" height="100" rx="10" fill="url(#g_36_5_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="120" y="42" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Re-render</text><text x="120" y="62" font-size="11" text-anchor="middle" fill="#1a1a2e">edit any factor</text><text x="120" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">physically-based</text></g><line x1="281" y1="245" x2="359" y2="150" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_36_5_1)"/><line x1="281" y1="270" x2="359" y2="280" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_36_5_1)"/><line x1="281" y1="290" x2="359" y2="410" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_36_5_1)"/><line x1="591" y1="150" x2="669" y2="270" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_36_5_1)"/><line x1="591" y1="280" x2="669" y2="280" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_36_5_1)"/><line x1="591" y1="410" x2="669" y2="290" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_36_5_1)"/><g transform="translate(40,490)"><rect x="0" y="0" width="1020" height="54" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Disentangle, then re-render</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Inverse rendering is what lets you swap lighting, materials, or geometry independently.</text></g></svg>
