<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>NeRF vs 3D Gaussian Splatting</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">NeRF vs 3D Gaussian Splatting</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Implicit MLP rays vs explicit splat rasterization</text>
  <defs><linearGradient id="g_36_1_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_36_1_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_36_1_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_36_1_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_36_1_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_36_1_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_36_1_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_36_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_36_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_36_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_36_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<text x="280" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">NeRF (implicit)</text><g transform="translate(40,120)"><rect x="0" y="0" width="180" height="80" rx="10" fill="url(#g_36_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Ray casting</text><text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">per-pixel rays</text></g><g transform="translate(240,120)"><rect x="0" y="0" width="180" height="80" rx="10" fill="url(#g_36_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">MLP query</text><text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">color + density</text></g><g transform="translate(40,230)"><rect x="0" y="0" width="380" height="70" rx="10" fill="url(#g_36_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="190" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Volume render</text><text x="190" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">integrate samples per ray</text></g><line x1="221" y1="160" x2="239" y2="160" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_36_1_1)"/><line x1="231" y1="200" x2="231" y2="229" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_36_1_1)"/><text x="820" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">3D Gaussian Splatting (explicit)</text><g transform="translate(620,120)"><rect x="0" y="0" width="180" height="80" rx="10" fill="url(#g_36_1_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">3D splats</text><text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">millions of blobs</text></g><g transform="translate(820,120)"><rect x="0" y="0" width="180" height="80" rx="10" fill="url(#g_36_1_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Project + sort</text><text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">tile rasterizer</text></g><g transform="translate(620,230)"><rect x="0" y="0" width="380" height="70" rx="10" fill="url(#g_36_1_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="190" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Alpha blend</text><text x="190" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">front to back, GPU friendly</text></g><line x1="801" y1="160" x2="819" y2="160" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG_36_1_1)"/><line x1="811" y1="200" x2="811" y2="229" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG_36_1_1)"/><g transform="translate(40,380)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Rendering speed: 3DGS wins by 10-100x</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">NeRF must MLP-evaluate every sample along every ray; 3DGS rasterizes pre-computed primitives.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Editing favors 3DGS too: you can grab a splat. NeRF requires re-baking a neural field.</text></g></svg>
