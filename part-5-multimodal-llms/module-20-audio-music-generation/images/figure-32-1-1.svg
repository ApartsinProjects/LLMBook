<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>VITS end-to-end TTS architecture</title>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">VITS end-to-end TTS architecture</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Posterior encoder, normalizing-flow prior, and HiFi-GAN decoder trained jointly</text>
  <defs><linearGradient id="g_32_1_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_32_1_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_32_1_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_32_1_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_32_1_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_32_1_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_32_1_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_32_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_32_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_32_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_32_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,100)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_32_1_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Phonemes</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">linguistic input</text><text x="100" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">text encoder</text></g><g transform="translate(40,240)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_32_1_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Waveform</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">ground truth</text><text x="100" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">linear spectrogram</text></g><g transform="translate(310,100)"><rect x="0" y="0" width="220" height="90" rx="10" fill="url(#g_32_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="110" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Prior encoder</text><text x="110" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">text -&gt; latent dist</text><text x="110" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">duration predictor</text></g><g transform="translate(310,240)"><rect x="0" y="0" width="220" height="90" rx="10" fill="url(#g_32_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="110" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Posterior encoder</text><text x="110" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">spectrogram -&gt; z</text><text x="110" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">training only</text></g><g transform="translate(590,170)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_32_1_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Normalizing flow</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">aligns prior and posterior</text><text x="100" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">invertible</text></g><g transform="translate(850,170)"><rect x="0" y="0" width="210" height="90" rx="10" fill="url(#g_32_1_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="105" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">HiFi-GAN decoder</text><text x="105" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">z -&gt; waveform</text><text x="105" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">GAN adversarial loss</text></g><line x1="240" y1="145" x2="304" y2="145" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_32_1_1)"/><line x1="240" y1="285" x2="304" y2="285" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG_32_1_1)"/><line x1="530" y1="145" x2="586" y2="200" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_32_1_1)"/><line x1="530" y1="285" x2="586" y2="230" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_32_1_1)"/><line x1="790" y1="215" x2="846" y2="215" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_32_1_1)"/><g transform="translate(40,400)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">One model, three losses</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">KL between prior and posterior + adversarial + feature-matching, trained end to end</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">No separate acoustic model, vocoder, or aligner stages.</text></g></svg>
