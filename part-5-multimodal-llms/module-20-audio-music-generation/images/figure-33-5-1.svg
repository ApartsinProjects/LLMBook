<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>2026 long-form AI video pipeline</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">2026 long-form AI video pipeline</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Storyboard -&gt; shotlist -&gt; per-shot generation -&gt; editorial assembly</text>
  <defs><linearGradient id="g_33_5_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_33_5_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_33_5_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_33_5_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_33_5_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_33_5_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_33_5_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_33_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_33_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_33_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_33_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,130)"><rect x="0" y="0" width="165" height="90" rx="10" fill="url(#g_33_5_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="82" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Script + bible</text><text x="82" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">characters, beats</text><text x="82" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">human or LLM</text></g><g transform="translate(235,130)"><rect x="0" y="0" width="165" height="90" rx="10" fill="url(#g_33_5_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="82" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Storyboard</text><text x="82" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">panel images</text><text x="82" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">T2I + sketch</text></g><g transform="translate(430,130)"><rect x="0" y="0" width="165" height="90" rx="10" fill="url(#g_33_5_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="82" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Shotlist</text><text x="82" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">camera + lens</text><text x="82" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">structured JSON</text></g><g transform="translate(625,130)"><rect x="0" y="0" width="165" height="90" rx="10" fill="url(#g_33_5_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="82" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Per-shot gen</text><text x="82" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">T2V / I2V</text><text x="82" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">8-15s clips</text></g><g transform="translate(820,130)"><rect x="0" y="0" width="165" height="90" rx="10" fill="url(#g_33_5_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="82" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Editorial</text><text x="82" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">cut, score, dub</text><text x="82" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">NLE timeline</text></g><g transform="translate(430,290)"><rect x="0" y="0" width="360" height="90" rx="10" fill="url(#g_33_5_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="180" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Continuity controller</text><text x="180" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">character ID + ref images</text><text x="180" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">spans every shot</text></g><line x1="206" y1="175" x2="234" y2="175" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_33_5_1)"/><line x1="401" y1="175" x2="429" y2="175" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_33_5_1)"/><line x1="596" y1="175" x2="624" y2="175" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_33_5_1)"/><line x1="791" y1="175" x2="819" y2="175" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_33_5_1)"/><line x1="707" y1="285" x2="707" y2="225" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_33_5_1)"/><g transform="translate(40,410)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Long-form is mostly orchestration, not one big model</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Each shot is short; the magic is character continuity, editorial pacing, and audio scoring across shots.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Runway Gen-4, Sora 2, Veo 3, Kling 2 plug into the same scaffold via different APIs.</text></g></svg>
