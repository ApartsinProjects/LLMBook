<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="Helvetica, Arial, sans-serif">
  <title>LayoutLMv3-Large error attribution on FUNSD</title>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">LayoutLMv3-Large error attribution on FUNSD</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Where does the F1 gap come from on noisy real-world forms?</text>
  <defs><linearGradient id="g_34_2_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_34_2_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_34_2_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_34_2_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_34_2_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_34_2_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_34_2_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_34_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_34_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_34_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_34_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<rect x="100" y="151" width="140" height="209" rx="10" fill="url(#g_34_2_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="170" y="139" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">38%</text><text x="170" y="382" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">OCR errors</text><rect x="290" y="239" width="140" height="121" rx="10" fill="url(#g_34_2_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="360" y="227" font-size="16" font-weight="700" text-anchor="middle" fill="#a67c1a">22%</text><text x="360" y="382" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Reading order</text><rect x="480" y="261" width="140" height="99" rx="10" fill="url(#g_34_2_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="550" y="249" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">18%</text><text x="550" y="382" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Long-tail keys</text><rect x="670" y="283" width="140" height="77" rx="10" fill="url(#g_34_2_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="740" y="271" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">14%</text><text x="740" y="382" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Layout drift</text><rect x="860" y="316" width="140" height="44" rx="10" fill="url(#g_34_2_1_neutral)" stroke="#5a4a3a" stroke-width="2.5"/><text x="930" y="304" font-size="16" font-weight="700" text-anchor="middle" fill="#5a4a3a">8%</text><text x="930" y="382" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Other</text><text x="550" y="110" font-size="13" font-weight="400" text-anchor="middle" fill="#5a4a3a" font-style="italic">Error share by category (percentage of mis-extractions)</text><g transform="translate(40,410)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">OCR is still the dominant failure mode</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Even with strong layout pretraining, ~38% of remaining errors stem from upstream text recognition.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Cleaning the OCR step yields more F1 than scaling LayoutLM parameters by 4x.</text></g></svg>
