<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>The multimodal fusion spectrum</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">The multimodal fusion spectrum</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Early fusion (all-shared) -&gt; hybrid -&gt; late fusion (separate stacks)</text>
  <defs><linearGradient id="g_37_2_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_37_2_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_37_2_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_37_2_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_37_2_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_37_2_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_37_2_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_37_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_37_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_37_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_37_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,130)"><rect x="0" y="0" width="240" height="200" rx="10" fill="url(#g_37_2_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="120" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Early fusion</text><text x="120" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">all layers shared</text><text x="120" y="130" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">one tokenizer</text></g><g transform="translate(300,130)"><rect x="0" y="0" width="240" height="200" rx="10" fill="url(#g_37_2_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="120" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Mid fusion</text><text x="120" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">shared trunk + heads</text><text x="120" y="130" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">per-modality input</text></g><g transform="translate(560,130)"><rect x="0" y="0" width="240" height="200" rx="10" fill="url(#g_37_2_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="120" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Hybrid</text><text x="120" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">cross-attn adapters</text><text x="120" y="130" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">BLIP-2 family</text></g><g transform="translate(820,130)"><rect x="0" y="0" width="240" height="200" rx="10" fill="url(#g_37_2_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="120" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Late fusion</text><text x="120" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">separate stacks</text><text x="120" y="130" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">fused only at output</text></g><line x1="280" y1="230" x2="300" y2="230" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_37_2_1)"/><line x1="540" y1="230" x2="560" y2="230" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_37_2_1)"/><line x1="800" y1="230" x2="820" y2="230" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_37_2_1)"/><g transform="translate(40,380)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Earlier fusion = more cross-modal alignment, more data needed</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Early fusion (Chameleon, GPT-4o) wins on joint reasoning; late fusion is easier to fine-tune.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Hybrid (CLIP + LLM via adapter) is the most popular 2026 pattern for moderate budgets.</text></g></svg>
