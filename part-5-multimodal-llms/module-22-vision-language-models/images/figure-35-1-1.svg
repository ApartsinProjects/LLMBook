<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Vision Transformer (ViT)</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Vision Transformer (ViT)</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Image -&gt; patches -&gt; tokens -&gt; transformer blocks -&gt; class or features</text>
  <defs><linearGradient id="g_35_1_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_35_1_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_35_1_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_35_1_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_35_1_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_35_1_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_35_1_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_35_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_35_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_35_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_35_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,130)"><rect x="0" y="0" width="160" height="110" rx="10" fill="url(#g_35_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="80" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">224 x 224 image</text><text x="80" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">RGB pixels</text><text x="80" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">input</text></g><g transform="translate(240,130)"><rect x="0" y="0" width="170" height="110" rx="10" fill="url(#g_35_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="85" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">16x16 patches</text><text x="85" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">196 patches</text><text x="85" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">flatten + linear</text></g><g transform="translate(450,130)"><rect x="0" y="0" width="170" height="110" rx="10" fill="url(#g_35_1_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="85" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Token sequence</text><text x="85" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">[CLS] + 196</text><text x="85" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">+ pos embeddings</text></g><g transform="translate(660,130)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_35_1_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Transformer x L</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">self-attention</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">12 / 24 / 32 layers</text></g><g transform="translate(900,130)"><rect x="0" y="0" width="160" height="110" rx="10" fill="url(#g_35_1_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="80" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Features</text><text x="80" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">[CLS] vector</text><text x="80" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">or all patches</text></g><line x1="201" y1="185" x2="239" y2="185" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_35_1_1)"/><line x1="411" y1="185" x2="449" y2="185" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_35_1_1)"/><line x1="621" y1="185" x2="659" y2="185" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_35_1_1)"/><line x1="861" y1="185" x2="899" y2="185" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_35_1_1)"/><g transform="translate(40,380)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Same transformer block as text, different tokenizer</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Patches replace BPE tokens; positional embeddings encode spatial location.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">[CLS] feeds classifiers; full sequence feeds VLM cross-attention or LLM prefix.</text></g></svg>
