<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>LLaVA-NeXT AnyRes dynamic-resolution pipeline</title>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">LLaVA-NeXT AnyRes dynamic-resolution pipeline</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">High-res image is split into native-resolution tiles + thumbnail for context</text>
  <defs><linearGradient id="g_35_3_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_35_3_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_35_3_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_35_3_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_35_3_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_35_3_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_35_3_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_35_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_35_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_35_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_35_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,130)"><rect x="0" y="0" width="175" height="100" rx="10" fill="url(#g_35_3_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="87" y="42" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Input image</text><text x="87" y="62" font-size="11" text-anchor="middle" fill="#1a1a2e">any aspect ratio</text><text x="87" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">e.g. 1500x900</text></g><g transform="translate(255,100)"><rect x="0" y="0" width="180" height="60" rx="10" fill="url(#g_35_3_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="90" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Tile 1</text><text x="90" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">672x672</text></g><g transform="translate(255,170)"><rect x="0" y="0" width="180" height="60" rx="10" fill="url(#g_35_3_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="90" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Tile 2</text><text x="90" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">672x672</text></g><g transform="translate(255,240)"><rect x="0" y="0" width="180" height="60" rx="10" fill="url(#g_35_3_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="90" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Tile N</text><text x="90" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">scaled grid</text></g><g transform="translate(475,200)"><rect x="0" y="0" width="180" height="70" rx="10" fill="url(#g_35_3_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="90" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Thumbnail</text><text x="90" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">global view</text></g><g transform="translate(700,100)"><rect x="0" y="0" width="180" height="60" rx="10" fill="url(#g_35_3_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="90" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">CLIP encoder</text><text x="90" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">per-tile</text></g><g transform="translate(700,170)"><rect x="0" y="0" width="180" height="60" rx="10" fill="url(#g_35_3_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="90" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">CLIP encoder</text><text x="90" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">shared weights</text></g><g transform="translate(700,240)"><rect x="0" y="0" width="180" height="60" rx="10" fill="url(#g_35_3_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="90" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">CLIP encoder</text><text x="90" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">thumb pass</text></g><g transform="translate(910,170)"><rect x="0" y="0" width="150" height="90" rx="10" fill="url(#g_35_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="75" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">LLM</text><text x="75" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">tile tokens</text><text x="75" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">concatenated</text></g><line x1="216" y1="165" x2="254" y2="130" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_35_3_1)"/><line x1="216" y1="175" x2="254" y2="200" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_35_3_1)"/><line x1="216" y1="195" x2="254" y2="270" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_35_3_1)"/><line x1="216" y1="220" x2="474" y2="230" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_35_3_1)"/><line x1="435" y1="130" x2="699" y2="130" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_35_3_1)"/><line x1="435" y1="200" x2="699" y2="200" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_35_3_1)"/><line x1="435" y1="270" x2="699" y2="270" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_35_3_1)"/><line x1="880" y1="195" x2="909" y2="210" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_35_3_1)"/><g transform="translate(40,400)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Token count grows with resolution, not parameters</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">AnyRes preserves fine detail (small text, charts) without retraining the vision encoder.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Trades off latency: 4 tiles + thumbnail = 5x the vision tokens vs single-image VLM.</text></g></svg>
