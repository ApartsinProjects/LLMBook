ext x="90" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Image dec</text><text x="90" y="44" font-size="11" text-anchor="middle" fill="#1a1a2e">diffusion</text></g><g transform="translate(840,200)"><rect x="0" y="0" width="180" height="65" rx="10" fill="url(#g_37_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="90" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Audio dec</text><text x="90" y="44" font-size="11" text-anchor="middle" fill="#1a1a2e">neural codec</text></g><g transform="translate(840,290)"><rect x="0" y="0" width="180" height="65" rx="10" fill="url(#g_37_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="90" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Video dec</text><text x="90" y="44" font-size="11" text-anchor="middle" fill="#1a1a2e">DiT</text></g><g transform="translate(840,380)"><rect x="0" y="0" width="180" height="65" rx="10" fill="url(#g_37_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="90" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Text out</text><text x="90" y="44" font-size="11" text-anchor="middle" fill="#1a1a2e">AR head</text></g><line x1="201" y1="142" x2="359" y2="250" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_37_3_1)"/><line x1="201" y1="232" x2="359" y2="270" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_37_3_1)"/><line x1="201" y1="322" x2="359" y2="290" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_37_3_1)"/><line x1="201" y1="412" x2="359" y2="330" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_37_3_1)"/><line x1="681" y1="250" x2="839" y2="142" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_37_3_1)"/><line x1="681" y1="270" x2="839" y2="232" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_37_3_1)"/><line x1="681" y1="290" x2="839" y2="322" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_37_3_1)"/><line x1="681" y1="330" x2="839" y2="412" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_37_3_1)"/><g transform="translate(40,470)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">The LLM is the universal translator</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Each modality has its own encoder/decoder; the LLM core does the actual cross-modal reasoning.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Adding a modality = bolt on one more encoder/decoder pair, finetune adapters.</text></g></svg>
