<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="760" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Per-request cost stacks in three production layers</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each layer has its own optimization lever. Knowing the share tells you where the next dollar saves the most.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <g transform="translate(100, 130)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#1a1a2e">Single request</text>
    <text x="0" y="22" font-size="12" font-style="italic" fill="#5a4a3a">$0.02 total (mid-range RAG example)</text>
    <rect x="0" y="40" width="80" height="380" rx="6" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5"/>

    <rect x="0" y="40" width="80" height="190" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="40" y="125" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">50%</text>
    <text x="40" y="145" font-size="11" text-anchor="middle" fill="#1f7a3a">inference</text>

    <rect x="0" y="230" width="80" height="115" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="40" y="280" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">30%</text>
    <text x="40" y="298" font-size="11" text-anchor="middle" fill="#722f8a">orch.</text>

    <rect x="0" y="345" width="80" height="75" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="40" y="378" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">20%</text>
    <text x="40" y="395" font-size="11" text-anchor="middle" fill="#1a4078">integ.</text>
  </g>

  <g transform="translate(500, 130)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#1a1a2e">Layer breakdown</text>
    <text x="0" y="22" font-size="12" font-style="italic" fill="#5a4a3a">what each layer pays for</text>

    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="700" height="120" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="20" y="26" font-size="15" font-weight="700" fill="#1f7a3a">1. Inference (40-70%)</text>
      <text x="20" y="48" font-size="12" fill="#1a1a2e">Per-token API spend (OpenAI / Anthropic / Google) or amortized GPU time for self-hosted.</text>
      <text x="20" y="66" font-size="12" fill="#1a1a2e">Optimize with: prompt caching (50-90% savings), routing to cheap tier, batch API for offline jobs.</text>
      <text x="20" y="92" font-size="11" font-style="italic" fill="#5a4a3a">Largest layer. Most teams over-spend here by defaulting to the flagship model for every request.</text>
      <text x="20" y="108" font-size="11" font-style="italic" fill="#5a4a3a">Section 47.2 has the breakeven math; section 16.4 has the routing pattern.</text>
    </g>

    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="700" height="110" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="20" y="26" font-size="15" font-weight="700" fill="#722f8a">2. Orchestration (20-40%)</text>
      <text x="20" y="48" font-size="12" fill="#1a1a2e">Vector store queries, RAG retrieval, embedding generation, agent-loop overhead.</text>
      <text x="20" y="66" font-size="12" fill="#1a1a2e">Optimize with: smaller embeddings (Matryoshka), hybrid search, agent step caps.</text>
      <text x="20" y="92" font-size="11" font-style="italic" fill="#5a4a3a">Grows fast with agentic loops. A 6-step agent loop pays 6x the orchestration overhead.</text>
    </g>

    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="700" height="100" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
      <text x="20" y="26" font-size="15" font-weight="700" fill="#1a4078">3. Integration (5-15%)</text>
      <text x="20" y="48" font-size="12" fill="#1a1a2e">Gateway overhead, observability ingest, logging, monitoring, telemetry.</text>
      <text x="20" y="66" font-size="12" fill="#1a1a2e">Optimize with: sampled tracing, smaller log payloads, observability tier selection.</text>
      <text x="20" y="86" font-size="11" font-style="italic" fill="#5a4a3a">Smallest layer but easiest to cut first if budget is tight.</text>
    </g>
  </g>

  <line x1="190" y1="135" x2="490" y2="170" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="190" y1="288" x2="490" y2="305" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="190" y1="383" x2="490" y2="430" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="1240" height="148" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="620" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a2e">Per-request cost as a 4-line pseudo-formula</text>
    <text x="40" y="56" font-size="13" font-family="Cambria Math, Cambria, Times, serif" font-style="italic" fill="#1a1a2e">cost = inference_cost + orchestration_cost + integration_cost</text>
    <text x="40" y="80" font-size="13" font-family="Cambria Math, Cambria, Times, serif" font-style="italic" fill="#1a1a2e">inference_cost = tokens_in * price_in + tokens_out * price_out</text>
    <text x="40" y="100" font-size="13" font-family="Cambria Math, Cambria, Times, serif" font-style="italic" fill="#1a1a2e">orchestration_cost = vector_queries * cost_per_query + agent_steps * cost_per_step</text>
    <text x="40" y="120" font-size="13" font-family="Cambria Math, Cambria, Times, serif" font-style="italic" fill="#1a1a2e">integration_cost = gateway_overhead + observability_per_event</text>
    <text x="620" y="140" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Every optimization in Section 47.x is a substitution into one of these four lines.</text>
  </g>
</svg>
