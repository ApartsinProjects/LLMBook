<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Scaled Dot-Product Attention</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Attention(Q, K, V) = softmax(Q · Kᵀ / √d_k) · V — the core operation of every transformer</text>

  <!-- Q, K, V inputs along the top -->
  <g>
    <rect x="100" y="120" width="170" height="80" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="185" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="#1a4078">Q</text>
    <text x="185" y="172" font-size="12" text-anchor="middle" fill="#5a4a3a">queries</text>
    <text x="185" y="190" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">(n × d_k)</text>

    <rect x="380" y="120" width="170" height="80" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="465" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="#1a4078">K</text>
    <text x="465" y="172" font-size="12" text-anchor="middle" fill="#5a4a3a">keys</text>
    <text x="465" y="190" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">(m × d_k)</text>

    <rect x="660" y="120" width="170" height="80" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="745" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="#1f7a3a">V</text>
    <text x="745" y="172" font-size="12" text-anchor="middle" fill="#5a4a3a">values</text>
    <text x="745" y="190" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">(m × d_v)</text>
  </g>

  <!-- Q, K → MatMul -->
  <line x1="185" y1="200" x2="280" y2="260" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="465" y1="200" x2="370" y2="260" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 1: MatMul Q·Kᵀ -->
  <g>
    <rect x="220" y="270" width="220" height="60" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="330" y="295" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">1 · MatMul</text>
    <text x="330" y="318" font-size="13" font-family="monospace" text-anchor="middle" fill="#1a1a2e">scores = Q · Kᵀ</text>
  </g>

  <line x1="330" y1="330" x2="330" y2="380" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="350" y="358" font-size="11" font-style="italic" fill="#5a4a3a">(n × m) raw scores</text>

  <!-- Step 2: Scale -->
  <g>
    <rect x="220" y="390" width="220" height="60" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="330" y="415" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">2 · Scale</text>
    <text x="330" y="438" font-size="13" font-family="monospace" text-anchor="middle" fill="#1a1a2e">scores / √d_k</text>
  </g>

  <line x1="330" y1="450" x2="330" y2="500" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: Mask (optional) -->
  <g>
    <rect x="220" y="510" width="220" height="60" rx="8" fill="#fafbfc" stroke="#cfd8e3" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="330" y="535" font-size="15" font-weight="700" text-anchor="middle" fill="#5a4a3a">3 · Mask (optional)</text>
    <text x="330" y="558" font-size="11" text-anchor="middle" fill="#5a4a3a">−∞ on illegal positions</text>
  </g>

  <line x1="330" y1="570" x2="330" y2="620" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4: Softmax -->
  <g>
    <rect x="220" y="630" width="220" height="60" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="330" y="655" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">4 · Softmax</text>
    <text x="330" y="678" font-size="11" text-anchor="middle" fill="#5a4a3a">rows sum to 1 (attention weights)</text>
  </g>

  <!-- Step 5: MatMul with V -->
  <line x1="440" y1="660" x2="540" y2="660" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="745" y1="200" x2="745" y2="640" stroke="#1f7a3a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <g>
    <rect x="540" y="630" width="240" height="60" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="660" y="655" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">5 · MatMul</text>
    <text x="660" y="678" font-size="13" font-family="monospace" text-anchor="middle" fill="#1a1a2e">output = α · V</text>
  </g>

  <line x1="780" y1="660" x2="860" y2="660" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Output -->
  <g>
    <rect x="860" y="620" width="200" height="80" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="960" y="650" font-size="18" font-weight="700" text-anchor="middle" fill="#722f8a">Output</text>
    <text x="960" y="675" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">(n × d_v)</text>
    <text x="960" y="690" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">contextualized rep.</text>
  </g>

  <!-- Right callout -->
  <g transform="translate(890, 130)">
    <rect x="0" y="0" width="370" height="450" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="185" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Why each step?</text>
    <line x1="20" y1="46" x2="350" y2="46" stroke="#d4b96a" stroke-width="0.6"/>

    <text x="20" y="74" font-size="13" font-weight="600" fill="#1a4078">Q vs K dot product</text>
    <text x="20" y="94" font-size="11" fill="#1a1a2e">"how much does each query care</text>
    <text x="20" y="110" font-size="11" fill="#1a1a2e">about each key?" — pairwise affinity.</text>

    <text x="20" y="142" font-size="13" font-weight="600" fill="#7a5e1a">Divide by √d_k</text>
    <text x="20" y="162" font-size="11" fill="#1a1a2e">Without it, dot products grow with</text>
    <text x="20" y="178" font-size="11" fill="#1a1a2e">d_k, pushing softmax into saturation</text>
    <text x="20" y="194" font-size="11" fill="#1a1a2e">(near-zero gradients).</text>

    <text x="20" y="226" font-size="13" font-weight="600" fill="#5a4a3a">Mask (causal / padding)</text>
    <text x="20" y="246" font-size="11" fill="#1a1a2e">Causal: prevent looking at future</text>
    <text x="20" y="262" font-size="11" fill="#1a1a2e">tokens (decoder). Padding: ignore</text>
    <text x="20" y="278" font-size="11" fill="#1a1a2e">batch padding tokens.</text>

    <text x="20" y="310" font-size="13" font-weight="600" fill="#7a5e1a">Softmax → weights</text>
    <text x="20" y="330" font-size="11" fill="#1a1a2e">Normalize each row to a probability</text>
    <text x="20" y="346" font-size="11" fill="#1a1a2e">distribution over keys/values.</text>

    <text x="20" y="378" font-size="13" font-weight="600" fill="#1f7a3a">Multiply by V</text>
    <text x="20" y="398" font-size="11" fill="#1a1a2e">Weighted sum of value vectors —</text>
    <text x="20" y="414" font-size="11" fill="#1a1a2e">each output is a content-mix</text>
    <text x="20" y="430" font-size="11" fill="#1a1a2e">indexed by attention weights.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 730)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Five lightweight tensor ops, no recurrence, fully parallel across positions. Multi-head attention = repeat this h times with different learned projections, then concatenate and project.</text>
  </g>
</svg>
