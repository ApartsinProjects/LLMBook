<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>Four positional encoding strategies</title>
  <rect width="1100" height="600" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Four positional encoding strategies</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">How transformers tell apart "dog bites man" from "man bites dog"</text>

  <g transform="translate(60, 100)">
    <rect width="240" height="350" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <rect x="0" y="0" width="240" height="44" rx="10" fill="#1a4078"/>
    <text x="120" y="29" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Sinusoidal</text>
    <text x="120" y="74" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">fixed sin/cos waves</text>

    <text x="20" y="120" font-size="12" font-weight="700" fill="#1a4078">Type</text>
    <text x="20" y="138" font-size="12" fill="#1a1a2e">absolute, additive</text>

    <text x="20" y="170" font-size="12" font-weight="700" fill="#1a4078">Params</text>
    <text x="20" y="188" font-size="12" fill="#1a1a2e">0 (closed-form)</text>

    <text x="20" y="220" font-size="12" font-weight="700" fill="#1a4078">Extrapolation</text>
    <text x="20" y="238" font-size="12" fill="#1a1a2e">limited past train len</text>

    <text x="20" y="270" font-size="12" font-weight="700" fill="#1a4078">Used by</text>
    <text x="20" y="288" font-size="12" fill="#1a1a2e">Vaswani 2017</text>
    <text x="20" y="306" font-size="11" font-style="italic" fill="#5a4a3a">(the original)</text>
  </g>

  <g transform="translate(310, 100)">
    <rect width="240" height="350" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <rect x="0" y="0" width="240" height="44" rx="10" fill="#1f7a3a"/>
    <text x="120" y="29" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Learned</text>
    <text x="120" y="74" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">trainable embedding table</text>

    <text x="20" y="120" font-size="12" font-weight="700" fill="#1f7a3a">Type</text>
    <text x="20" y="138" font-size="12" fill="#1a1a2e">absolute, additive</text>

    <text x="20" y="170" font-size="12" font-weight="700" fill="#1f7a3a">Params</text>
    <text x="20" y="188" font-size="12" fill="#1a1a2e">N x d trainable</text>

    <text x="20" y="220" font-size="12" font-weight="700" fill="#1f7a3a">Extrapolation</text>
    <text x="20" y="238" font-size="12" fill="#1a1a2e">none past N</text>

    <text x="20" y="270" font-size="12" font-weight="700" fill="#1f7a3a">Used by</text>
    <text x="20" y="288" font-size="12" fill="#1a1a2e">BERT, GPT-2, ViT</text>
  </g>

  <g transform="translate(560, 100)">
    <rect width="240" height="350" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <rect x="0" y="0" width="240" height="44" rx="10" fill="#722f8a"/>
    <text x="120" y="29" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">RoPE</text>
    <text x="120" y="74" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">rotate Q, K by angle</text>

    <text x="20" y="120" font-size="12" font-weight="700" fill="#722f8a">Type</text>
    <text x="20" y="138" font-size="12" fill="#1a1a2e">relative, per-layer</text>

    <text x="20" y="170" font-size="12" font-weight="700" fill="#722f8a">Params</text>
    <text x="20" y="188" font-size="12" fill="#1a1a2e">0 (rotation matrices)</text>

    <text x="20" y="220" font-size="12" font-weight="700" fill="#722f8a">Extrapolation</text>
    <text x="20" y="238" font-size="12" fill="#1a1a2e">good with NTK / YaRN</text>

    <text x="20" y="270" font-size="12" font-weight="700" fill="#722f8a">Used by</text>
    <text x="20" y="288" font-size="12" fill="#1a1a2e">Llama, Mistral, Qwen</text>
  </g>

  <g transform="translate(810, 100)">
    <rect width="240" height="350" rx="10" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <rect x="0" y="0" width="240" height="44" rx="10" fill="#a67c1a"/>
    <text x="120" y="29" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">ALiBi</text>
    <text x="120" y="74" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">linear distance penalty</text>

    <text x="20" y="120" font-size="12" font-weight="700" fill="#a67c1a">Type</text>
    <text x="20" y="138" font-size="12" fill="#1a1a2e">relative, on scores</text>

    <text x="20" y="170" font-size="12" font-weight="700" fill="#a67c1a">Params</text>
    <text x="20" y="188" font-size="12" fill="#1a1a2e">0 (per-head slope)</text>

    <text x="20" y="220" font-size="12" font-weight="700" fill="#a67c1a">Extrapolation</text>
    <text x="20" y="238" font-size="12" fill="#1a1a2e">strong, generalizes</text>

    <text x="20" y="270" font-size="12" font-weight="700" fill="#a67c1a">Used by</text>
    <text x="20" y="288" font-size="12" fill="#1a1a2e">BLOOM, MPT, Falcon</text>
  </g>

  <g transform="translate(60, 480)">
    <rect width="990" height="100" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#a67c1a">Key idea</text>
    <text x="20" y="54" font-size="12" fill="#1a1a2e">Sinusoidal and Learned encode absolute position once at the input; RoPE and ALiBi inject relative position inside attention.</text>
    <text x="20" y="78" font-size="12" fill="#1a1a2e">Modern long-context LLMs prefer the relative variants because they extend past the training sequence length more gracefully.</text>
  </g>
</svg>
