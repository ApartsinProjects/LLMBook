<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Post-LN vs Pre-LN: Two Block Architectures</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">The same components in a different order, with very different training behavior.</text>

  <!-- LEFT lane: Post-LN -->
  <g transform="translate(70, 100)">
    <rect x="0" y="0" width="555" height="470" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="278" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#b3401b">Post-LN (Original Transformer)</text>
    <text x="278" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">norm AFTER the residual add</text>

    <!-- vertical pipeline -->
    <g transform="translate(180, 80)">
      <!-- x -->
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="100" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">x  (input)</text>

      <line x1="100" y1="50" x2="100" y2="85" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- Sub-Layer -->
      <rect x="0" y="85" width="200" height="60" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="100" y="111" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Sub-Layer</text>
      <text x="100" y="130" font-size="11" text-anchor="middle" fill="#5a4a3a">Attention or FFN</text>

      <line x1="100" y1="145" x2="100" y2="180" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- + add -->
      <circle cx="100" cy="205" r="22" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
      <text x="100" y="211" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a2e">+</text>

      <line x1="100" y1="227" x2="100" y2="262" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- LayerNorm -->
      <rect x="0" y="262" width="200" height="50" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="100" y="293" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">LayerNorm</text>

      <line x1="100" y1="312" x2="100" y2="347" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- output -->
      <rect x="0" y="347" width="200" height="40" rx="6" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.2"/>
      <text x="100" y="372" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">y  (output)</text>

      <!-- residual skip -->
      <path d="M 0 25 Q -50 25 -50 205 Q -50 205 78 205" fill="none" stroke="#b3401b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrR)"/>
      <text x="-130" y="118" font-size="11" font-style="italic" fill="#b3401b">residual</text>
      <text x="-130" y="134" font-size="11" font-style="italic" fill="#b3401b">(then normed)</text>
    </g>

    <!-- consequence callout -->
    <g transform="translate(20, 410)">
      <rect x="0" y="0" width="515" height="44" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.4"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#b3401b">Consequence</text>
      <text x="12" y="36" font-size="12" fill="#1a1a2e">Residual signal gets renormalized; deep stacks need warmup, careful init.</text>
    </g>
  </g>

  <!-- RIGHT lane: Pre-LN -->
  <g transform="translate(675, 100)">
    <rect x="0" y="0" width="555" height="470" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="278" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Pre-LN (Modern: GPT-2+, Llama)</text>
    <text x="278" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">norm BEFORE the sub-layer; residual untouched</text>

    <g transform="translate(180, 80)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="100" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">x  (input)</text>

      <line x1="100" y1="50" x2="100" y2="85" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- LayerNorm -->
      <rect x="0" y="85" width="200" height="50" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="100" y="116" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">LayerNorm</text>

      <line x1="100" y1="135" x2="100" y2="170" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- Sub-Layer -->
      <rect x="0" y="170" width="200" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="100" y="196" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Sub-Layer</text>
      <text x="100" y="215" font-size="11" text-anchor="middle" fill="#5a4a3a">Attention or FFN</text>

      <line x1="100" y1="230" x2="100" y2="265" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- + add -->
      <circle cx="100" cy="290" r="22" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
      <text x="100" y="296" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a2e">+</text>

      <line x1="100" y1="312" x2="100" y2="347" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- output -->
      <rect x="0" y="347" width="200" height="40" rx="6" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.2"/>
      <text x="100" y="372" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">y  (output)</text>

      <!-- clean residual skip -->
      <path d="M 0 25 Q -50 25 -50 290 Q -50 290 78 290" fill="none" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrG)"/>
      <text x="-130" y="160" font-size="11" font-style="italic" fill="#1f7a3a">residual</text>
      <text x="-130" y="176" font-size="11" font-style="italic" fill="#1f7a3a">(clean path)</text>
    </g>

    <g transform="translate(20, 410)">
      <rect x="0" y="0" width="515" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.4"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#1f7a3a">Consequence</text>
      <text x="12" y="36" font-size="12" fill="#1a1a2e">Gradients flow undisturbed through the residual; trains stably at huge depth.</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1140" height="64" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Move LayerNorm inside the residual branch and the skip connection becomes a clean highway; this single change unlocked very deep transformers.</text>
  </g>
</svg>
