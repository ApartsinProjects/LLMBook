<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>Speculative decoding: draft, verify, resample</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Speculative decoding</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Small model proposes, large model verifies in one pass</text>

  <g transform="translate(60, 110)">
    <rect width="280" height="200" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="140" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">1. Draft</text>
    <text x="140" y="56" font-size="13" font-weight="600" text-anchor="middle" fill="#1a4078">small model (~1B)</text>
    <text x="140" y="78" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">6 fast forward passes</text>

    <g font-family="monospace" font-size="12">
      <rect x="20" y="98" width="36" height="28" rx="3" fill="#ffffff" stroke="#1a4078"/>
      <text x="38" y="117" text-anchor="middle" fill="#1a4078">The</text>
      <rect x="58" y="98" width="36" height="28" rx="3" fill="#ffffff" stroke="#1a4078"/>
      <text x="76" y="117" text-anchor="middle" fill="#1a4078">cat</text>
      <rect x="96" y="98" width="36" height="28" rx="3" fill="#ffffff" stroke="#1a4078"/>
      <text x="114" y="117" text-anchor="middle" fill="#1a4078">sat</text>
      <rect x="134" y="98" width="36" height="28" rx="3" fill="#ffffff" stroke="#1a4078"/>
      <text x="152" y="117" text-anchor="middle" fill="#1a4078">on</text>
      <rect x="172" y="98" width="36" height="28" rx="3" fill="#ffffff" stroke="#1a4078"/>
      <text x="190" y="117" text-anchor="middle" fill="#1a4078">the</text>
      <rect x="210" y="98" width="50" height="28" rx="3" fill="#ffffff" stroke="#1a4078"/>
      <text x="235" y="117" text-anchor="middle" fill="#1a4078">floor</text>
    </g>
    <text x="140" y="160" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">cost: 6x small-model latency</text>
  </g>

  <line x1="340" y1="210" x2="380" y2="210" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

  <g transform="translate(385, 110)">
    <rect width="320" height="200" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="160" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. Verify</text>
    <text x="160" y="56" font-size="13" font-weight="600" text-anchor="middle" fill="#1f7a3a">target model (70B)</text>
    <text x="160" y="78" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">scores all 6 in one pass</text>

    <g font-family="monospace" font-size="12">
      <rect x="20" y="98" width="36" height="28" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="38" y="117" text-anchor="middle" fill="#1f7a3a">The</text>
      <text x="38" y="142" font-size="13" text-anchor="middle" fill="#1f7a3a">v</text>

      <rect x="62" y="98" width="36" height="28" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="80" y="117" text-anchor="middle" fill="#1f7a3a">cat</text>
      <text x="80" y="142" font-size="13" text-anchor="middle" fill="#1f7a3a">v</text>

      <rect x="104" y="98" width="36" height="28" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="122" y="117" text-anchor="middle" fill="#1f7a3a">sat</text>
      <text x="122" y="142" font-size="13" text-anchor="middle" fill="#1f7a3a">v</text>

      <rect x="146" y="98" width="36" height="28" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="164" y="117" text-anchor="middle" fill="#1f7a3a">on</text>
      <text x="164" y="142" font-size="13" text-anchor="middle" fill="#1f7a3a">v</text>

      <rect x="188" y="98" width="36" height="28" rx="3" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="206" y="117" text-anchor="middle" fill="#b3401b">the</text>
      <text x="206" y="142" font-size="13" text-anchor="middle" fill="#b3401b">x</text>

      <rect x="230" y="98" width="50" height="28" rx="3" fill="#fafbfc" stroke="#888" stroke-dasharray="3 2"/>
      <text x="255" y="117" text-anchor="middle" fill="#888">floor</text>
      <text x="255" y="142" font-size="10" text-anchor="middle" fill="#888">drop</text>
    </g>
    <text x="160" y="180" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">accept 4, reject at position 5</text>
  </g>

  <line x1="705" y1="210" x2="745" y2="210" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

  <g transform="translate(750, 110)">
    <rect width="290" height="200" rx="10" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="145" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#a67c1a">3. Resample</text>
    <text x="145" y="56" font-size="13" font-weight="600" text-anchor="middle" fill="#a67c1a">at the rejection</text>
    <text x="145" y="78" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">use target's distribution</text>

    <g font-family="monospace" font-size="12">
      <rect x="20" y="98" width="36" height="28" rx="3" fill="#ffffff" stroke="#a67c1a"/>
      <text x="38" y="117" text-anchor="middle" fill="#a67c1a">The</text>
      <rect x="58" y="98" width="36" height="28" rx="3" fill="#ffffff" stroke="#a67c1a"/>
      <text x="76" y="117" text-anchor="middle" fill="#a67c1a">cat</text>
      <rect x="96" y="98" width="36" height="28" rx="3" fill="#ffffff" stroke="#a67c1a"/>
      <text x="114" y="117" text-anchor="middle" fill="#a67c1a">sat</text>
      <rect x="134" y="98" width="36" height="28" rx="3" fill="#ffffff" stroke="#a67c1a"/>
      <text x="152" y="117" text-anchor="middle" fill="#a67c1a">on</text>
      <rect x="172" y="98" width="50" height="28" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="197" y="117" text-anchor="middle" fill="#1f7a3a">a</text>
      <text x="197" y="142" font-size="10" text-anchor="middle" fill="#1f7a3a">(target)</text>
    </g>
    <text x="145" y="180" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">5 tokens this round</text>
  </g>

  <path d="M 900 320 Q 900 400 500 410 Q 200 410 200 320" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrPurple)"/>
  <text x="550" y="395" font-size="12" font-style="italic" font-weight="700" text-anchor="middle" fill="#722f8a">repeat: draft 6 more from current sequence</text>

  <g transform="translate(60, 440)">
    <rect width="990" height="80" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#a67c1a">Why this is faster</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">One target-model pass produces 5 accepted tokens (vs 5 separate target passes); small-model passes are nearly free.</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">Net: ~2-3x wall-clock speedup at no quality loss. Rejection sampling guarantees the same output distribution.</text>
  </g>

  <g transform="translate(60, 530)">
    <rect width="990" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Most tokens are easy. A small model agrees with the big one ~70% of the time. Spend big-model compute only where needed.</text>
  </g>
</svg>
