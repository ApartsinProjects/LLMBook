<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The Residual Stream</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Each block reads the running sum, writes its update back; information accumulates rather than being replaced.</text>

  <!-- Residual stream highway -->
  <rect x="80" y="270" width="1140" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
  <text x="100" y="305" font-size="13" font-weight="700" fill="#1a4078">Residual stream (running sum of representations)</text>

  <!-- Input -->
  <g transform="translate(100, 285)">
    <rect x="0" y="0" width="90" height="30" rx="6" fill="#1f7a3a" stroke="#155a2a" stroke-width="1.5"/>
    <text x="45" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">x_embed</text>
  </g>

  <!-- Plus nodes on the stream -->
  <g font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="320" cy="300" r="18" fill="#ffffff" stroke="#1a4078" stroke-width="2"/><text x="320" y="306" fill="#1a4078">+</text>
    <circle cx="490" cy="300" r="18" fill="#ffffff" stroke="#7a5e1a" stroke-width="2"/><text x="490" y="306" fill="#7a5e1a">+</text>
    <circle cx="710" cy="300" r="18" fill="#ffffff" stroke="#1a4078" stroke-width="2"/><text x="710" y="306" fill="#1a4078">+</text>
    <circle cx="880" cy="300" r="18" fill="#ffffff" stroke="#7a5e1a" stroke-width="2"/><text x="880" y="306" fill="#7a5e1a">+</text>
  </g>

  <!-- Layer 1 group -->
  <g>
    <rect x="270" y="120" width="270" height="120" rx="10" fill="#fbfbfd" stroke="#5a4a3a" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="405" y="142" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Layer 1</text>
    <rect x="290" y="155" width="100" height="65" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="340" y="180" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Attn 1</text>
    <text x="340" y="200" font-size="11" text-anchor="middle" fill="#5a4a3a">mixes tokens</text>
    <rect x="420" y="155" width="100" height="65" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="470" y="180" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">FFN 1</text>
    <text x="470" y="200" font-size="11" text-anchor="middle" fill="#5a4a3a">per-token map</text>
  </g>

  <!-- Layer 2 group -->
  <g>
    <rect x="660" y="120" width="270" height="120" rx="10" fill="#fbfbfd" stroke="#5a4a3a" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="795" y="142" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Layer 2</text>
    <rect x="680" y="155" width="100" height="65" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="730" y="180" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Attn 2</text>
    <text x="730" y="200" font-size="11" text-anchor="middle" fill="#5a4a3a">mixes tokens</text>
    <rect x="810" y="155" width="100" height="65" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="860" y="180" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">FFN 2</text>
    <text x="860" y="200" font-size="11" text-anchor="middle" fill="#5a4a3a">per-token map</text>
  </g>

  <!-- Read/write arrows: dashed up from + to block, solid down from block to + -->
  <g stroke-dasharray="4,3" stroke="#5a4a3a" fill="none">
    <path d="M 320 282 Q 320 250 340 220" marker-end="url(#arrMuted)"/>
    <path d="M 490 282 Q 490 250 470 220" marker-end="url(#arrMuted)"/>
    <path d="M 710 282 Q 710 250 730 220" marker-end="url(#arrMuted)"/>
    <path d="M 880 282 Q 880 250 860 220" marker-end="url(#arrMuted)"/>
  </g>
  <g stroke="#1a1a2e" fill="none" stroke-width="1.5">
    <path d="M 360 220 Q 360 260 338 285" marker-end="url(#arr)"/>
    <path d="M 450 220 Q 450 260 472 285" marker-end="url(#arr)"/>
    <path d="M 750 220 Q 750 260 728 285" marker-end="url(#arr)"/>
    <path d="M 840 220 Q 840 260 862 285" marker-end="url(#arr)"/>
  </g>

  <!-- Stream legend on right -->
  <text x="1010" y="305" font-size="14" font-weight="700" fill="#5a4a3a">. . .</text>

  <g transform="translate(1080, 285)">
    <rect x="0" y="0" width="100" height="30" rx="6" fill="#1f7a3a" stroke="#155a2a" stroke-width="1.5"/>
    <text x="50" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Output</text>
  </g>

  <!-- Read/write legend -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="320" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Read / write convention</text>
    <line x1="14" y1="40" x2="60" y2="40" stroke="#5a4a3a" stroke-dasharray="4,3" marker-end="url(#arrMuted)"/>
    <text x="70" y="44" font-size="12" fill="#1a1a2e">read: block sees current stream value</text>
    <line x1="14" y1="60" x2="60" y2="60" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="70" y="64" font-size="12" fill="#1a1a2e">write: block adds its delta back in</text>
  </g>

  <!-- Why it matters callout -->
  <g transform="translate(450, 410)">
    <rect x="0" y="0" width="370" height="80" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#722f8a">Why this matters</text>
    <text x="14" y="44" font-size="12" fill="#1a1a2e">Gradients flow straight through the highway, so</text>
    <text x="14" y="62" font-size="12" fill="#1a1a2e">100+ layer stacks train without vanishing signals.</text>
  </g>

  <!-- Interp callout -->
  <g transform="translate(850, 410)">
    <rect x="0" y="0" width="370" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Interpretability hook</text>
    <text x="14" y="44" font-size="12" fill="#1a1a2e">The stream is a shared workspace; researchers</text>
    <text x="14" y="62" font-size="12" fill="#1a1a2e">probe specific dimensions (logit lens, patching).</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1140" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Every transformer block reads the residual stream and adds an update; the stream is the model's working memory, carrying</text>
    <text x="20" y="65" font-size="12" fill="#1a1a2e">accumulated meaning from embeddings to the final unembedding without ever being overwritten.</text>
  </g>
</svg>
