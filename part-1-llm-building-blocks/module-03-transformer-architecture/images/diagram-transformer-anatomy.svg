<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" font-family="Helvetica, Arial, sans-serif">
  <title>Transformer anatomy in seven stages</title>
  <rect width="1100" height="650" fill="#ffffff"/>
  <defs>
    <marker id="arrTA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
    <marker id="arrTAdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Transformer anatomy</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Token to next-token in seven stages; every LLM is this, repeated N times</text>

  <!-- Left column: stages 1-3 -->
  <g transform="translate(60, 110)">
    <rect width="200" height="60" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">1. Tokens</text>
    <text x="100" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">integer ids</text>
  </g>
  <line x1="160" y1="170" x2="160" y2="200" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrTA)"/>

  <g transform="translate(60, 200)">
    <rect width="200" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="100" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. Token embed</text>
    <text x="100" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">vocab x d matrix</text>
  </g>
  <line x1="160" y1="260" x2="160" y2="290" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrTA)"/>

  <g transform="translate(60, 290)">
    <rect width="200" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="100" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. + position</text>
    <text x="100" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">RoPE / ALiBi</text>
  </g>

  <line x1="260" y1="320" x2="310" y2="320" stroke="#5a4a3a" stroke-width="2.5" marker-end="url(#arrTA)"/>

  <!-- Center: transformer block (4) -->
  <g transform="translate(320, 140)">
    <rect width="460" height="280" rx="10" fill="#fafbfc" stroke="#0f3460" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="230" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">4. Transformer block (x N)</text>

    <rect x="20" y="50" width="420" height="80" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="230" y="78" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">4a. Causal self-attention</text>
    <text x="230" y="100" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">softmax(QK^T / sqrt(d)) * V</text>
    <text x="230" y="118" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">residual: x + attn(x)</text>

    <rect x="20" y="150" width="420" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="230" y="178" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">4b. Feed-forward MLP</text>
    <text x="230" y="200" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">two linears around GELU / SwiGLU</text>
    <text x="230" y="218" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">residual: x + mlp(x)</text>

    <text x="230" y="262" font-size="11" font-style="italic" text-anchor="middle" fill="#a67c1a">N = 32 layers (7B), 80 (70B), 96 (175B)</text>
  </g>

  <line x1="780" y1="320" x2="830" y2="320" stroke="#5a4a3a" stroke-width="2.5" marker-end="url(#arrTA)"/>

  <!-- Right column: stages 5-7 -->
  <g transform="translate(840, 200)">
    <rect width="200" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="100" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">5. Final LayerNorm</text>
    <text x="100" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">stabilize output</text>
  </g>
  <line x1="940" y1="260" x2="940" y2="290" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrTA)"/>

  <g transform="translate(840, 290)">
    <rect width="200" height="60" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">6. LM head</text>
    <text x="100" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">tied weights E^T</text>
  </g>
  <line x1="940" y1="350" x2="940" y2="380" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrTA)"/>

  <g transform="translate(840, 380)">
    <rect width="200" height="60" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="100" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">7. Sample token</text>
    <text x="100" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">softmax + temp</text>
  </g>

  <!-- Autoregressive loop -->
  <path d="M 940 440 Q 940 480 500 480 Q 160 480 160 360" fill="none" stroke="#5a4a3a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrTAdim)"/>
  <text x="550" y="496" font-size="11" font-style="italic" fill="#5a4a3a">append token, repeat (autoregressive loop)</text>

  <!-- Takeaway -->
  <g transform="translate(40, 510)">
    <rect width="1020" height="120" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">The skeleton is constant; every variant is a substitution</text>
    <text x="510" y="60" font-size="12" text-anchor="middle" fill="#1a1a2e">Mamba replaces 4a. MoE replaces 4b with routed experts. LoRA adds low-rank adapters into 4a.</text>
    <text x="510" y="86" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Quantization changes the dtype; FlashAttention changes how 4a is computed without changing what.</text>
    <text x="510" y="108" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">In a 7B with d=4096: MLP ~60%, attention ~30%, embedding ~8%, norms ~2% of params.</text>
  </g>
</svg>
