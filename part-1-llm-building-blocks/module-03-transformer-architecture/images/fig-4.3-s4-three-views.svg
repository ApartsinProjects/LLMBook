<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>S4: three views of the same state-space model</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">S4: three views of one state-space model</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">One ODE, three forms; pick the one that fits the workload</text>

  <g transform="translate(60, 100)">
    <rect width="310" height="340" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <rect x="0" y="0" width="310" height="44" rx="10" fill="#1a4078"/>
    <text x="155" y="29" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">1. Continuous-time</text>

    <rect x="20" y="64" width="270" height="48" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="155" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">dx/dt = A x + B u</text>

    <rect x="20" y="120" width="270" height="48" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="155" y="148" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">y = C x + D u</text>

    <text x="20" y="194" font-size="12" font-weight="700" fill="#1a4078">When to use</text>
    <text x="20" y="214" font-size="12" fill="#1a1a2e">theory, parameterization of A</text>

    <text x="20" y="246" font-size="12" font-weight="700" fill="#1a4078">Cost</text>
    <text x="20" y="266" font-size="12" fill="#1a1a2e">conceptual only</text>

    <rect x="20" y="288" width="270" height="42" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.4"/>
    <text x="155" y="306" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">Mental model</text>
    <text x="155" y="322" font-size="11" text-anchor="middle" fill="#1a1a2e">a circuit, dynamical system</text>
  </g>

  <g transform="translate(380, 230)">
    <text x="20" y="-4" font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a2e">discretize</text>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <g transform="translate(430, 100)">
    <rect width="310" height="340" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <rect x="0" y="0" width="310" height="44" rx="10" fill="#1f7a3a"/>
    <text x="155" y="29" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2. Recurrent</text>

    <rect x="20" y="64" width="270" height="48" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
    <text x="155" y="92" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">x_k = A_bar x_{k-1} + B_bar u_k</text>

    <rect x="20" y="120" width="270" height="48" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
    <text x="155" y="148" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">y_k = C x_k + D u_k</text>

    <text x="20" y="194" font-size="12" font-weight="700" fill="#1f7a3a">When to use</text>
    <text x="20" y="214" font-size="12" fill="#1a1a2e">inference, streaming decode</text>

    <text x="20" y="246" font-size="12" font-weight="700" fill="#1f7a3a">Cost</text>
    <text x="20" y="266" font-size="12" fill="#1a1a2e">O(1) per step (RNN-like)</text>

    <rect x="20" y="288" width="270" height="42" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.4"/>
    <text x="155" y="306" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">Mental model</text>
    <text x="155" y="322" font-size="11" text-anchor="middle" fill="#1a1a2e">an RNN with structured weights</text>
  </g>

  <g transform="translate(750, 230)">
    <text x="20" y="-4" font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a2e">unroll</text>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <g transform="translate(800, 100)">
    <rect width="260" height="340" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <rect x="0" y="0" width="260" height="44" rx="10" fill="#722f8a"/>
    <text x="130" y="29" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">3. Convolutional</text>

    <rect x="20" y="64" width="220" height="48" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
    <text x="130" y="92" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">K = (CB, CAB, CA^2 B,...)</text>

    <rect x="20" y="120" width="220" height="48" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
    <text x="130" y="148" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">y = K * u</text>

    <text x="20" y="194" font-size="12" font-weight="700" fill="#722f8a">When to use</text>
    <text x="20" y="214" font-size="12" fill="#1a1a2e">training, full sequence</text>

    <text x="20" y="246" font-size="12" font-weight="700" fill="#722f8a">Cost</text>
    <text x="20" y="266" font-size="12" fill="#1a1a2e">O(n log n) via FFT</text>

    <rect x="20" y="288" width="220" height="42" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.4"/>
    <text x="130" y="306" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">Mental model</text>
    <text x="130" y="322" font-size="11" text-anchor="middle" fill="#1a1a2e">a long 1-D convolution</text>
  </g>

  <g transform="translate(60, 470)">
    <rect width="1000" height="120" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">All three views are mathematically equivalent; they differ only in compute cost and parallelism.</text>
    <text x="20" y="74" font-size="12" fill="#1a1a2e">S4's superpower: train as a fast parallel convolution, then deploy as a constant-memory RNN, with one shared parameterization.</text>
    <text x="20" y="100" font-size="11" font-style="italic" fill="#5a4a3a">Continuous: design and analysis. Recurrent: inference. Convolutional: training pass on a full sequence.</text>
  </g>
</svg>
