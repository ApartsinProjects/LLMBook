<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Post-Norm vs Pre-Norm</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Where you put the LayerNorm decides whether the residual stream stays clean.</text>

  <!-- divider -->
  <line x1="650" y1="100" x2="650" y2="560" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- LEFT LANE: Post-Norm -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="570" height="60" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="285" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#b3401b">Post-Norm (Vaswani 2017)</text>
    <text x="285" y="48" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">LayerNorm sits AFTER the residual add</text>

    <!-- pipeline -->
    <g transform="translate(20, 100)">
      <!-- x -->
      <rect x="0" y="60" width="80" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="40" y="84" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">x</text>
      <text x="40" y="100" font-size="11" text-anchor="middle" fill="#5a4a3a">input</text>

      <!-- arrow -->
      <line x1="80" y1="85" x2="125" y2="85" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- SubLayer -->
      <rect x="125" y="60" width="110" height="50" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="180" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">SubLayer(x)</text>
      <text x="180" y="100" font-size="11" text-anchor="middle" fill="#5a4a3a">Attn / FFN</text>

      <line x1="235" y1="85" x2="280" y2="85" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- + add -->
      <circle cx="305" cy="85" r="22" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
      <text x="305" y="90" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a2e">+</text>

      <line x1="327" y1="85" x2="370" y2="85" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- LayerNorm -->
      <rect x="370" y="60" width="110" height="50" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="425" y="90" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">LayerNorm</text>

      <line x1="480" y1="85" x2="525" y2="85" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <text x="525" y="90" font-size="13" font-weight="700" fill="#1a1a2e">y</text>

      <!-- residual skip arc -->
      <path d="M 40 60 Q 40 20 175 20 Q 305 20 305 60" fill="none" stroke="#1a4078" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
      <text x="175" y="14" font-size="11" font-style="italic" text-anchor="middle" fill="#1a4078">residual (gets normalized away)</text>
    </g>

    <!-- gradient illustration -->
    <g transform="translate(40, 280)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#b3401b">Gradient through depth</text>
      <line x1="0" y1="60" x2="490" y2="60" stroke="#5a4a3a" stroke-width="1"/>
      <line x1="0" y1="10" x2="0" y2="60" stroke="#5a4a3a" stroke-width="1"/>
      <!-- decaying curve -->
      <path d="M 0 15 Q 80 25 160 40 T 320 55 T 490 58" fill="none" stroke="#b3401b" stroke-width="2.2"/>
      <text x="245" y="80" font-size="11" text-anchor="middle" fill="#5a4a3a">signal shrinks; deep stacks need warmup, careful init</text>
    </g>

    <!-- verdict pill -->
    <g transform="translate(40, 400)">
      <rect x="0" y="0" width="490" height="56" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="15" y="22" font-size="12" font-weight="700" fill="#b3401b">Verdict</text>
      <text x="15" y="42" font-size="12" fill="#1a1a2e">Unstable past ~12 layers without tricks; rare in modern LLMs.</text>
    </g>
  </g>

  <!-- RIGHT LANE: Pre-Norm -->
  <g transform="translate(680, 100)">
    <rect x="0" y="0" width="570" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="285" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Pre-Norm (GPT-2 onward)</text>
    <text x="285" y="48" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">LayerNorm sits BEFORE the sub-layer; residual stays clean</text>

    <g transform="translate(20, 100)">
      <rect x="0" y="60" width="80" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="40" y="84" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">x</text>
      <text x="40" y="100" font-size="11" text-anchor="middle" fill="#5a4a3a">input</text>

      <line x1="80" y1="85" x2="125" y2="85" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <rect x="125" y="60" width="110" height="50" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="180" y="90" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">LayerNorm</text>

      <line x1="235" y1="85" x2="280" y2="85" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <rect x="280" y="60" width="110" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="335" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">SubLayer</text>
      <text x="335" y="100" font-size="11" text-anchor="middle" fill="#5a4a3a">Attn / FFN</text>

      <line x1="390" y1="85" x2="435" y2="85" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <circle cx="460" cy="85" r="22" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
      <text x="460" y="90" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a2e">+</text>

      <line x1="482" y1="85" x2="525" y2="85" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <text x="525" y="90" font-size="13" font-weight="700" fill="#1a1a2e">y</text>

      <!-- clean residual arc reaches the +, untouched -->
      <path d="M 40 60 Q 40 20 250 20 Q 460 20 460 60" fill="none" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>
      <text x="250" y="14" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">residual (untouched, full magnitude)</text>
    </g>

    <!-- gradient illustration -->
    <g transform="translate(40, 280)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1f7a3a">Gradient through depth</text>
      <line x1="0" y1="60" x2="490" y2="60" stroke="#5a4a3a" stroke-width="1"/>
      <line x1="0" y1="10" x2="0" y2="60" stroke="#5a4a3a" stroke-width="1"/>
      <line x1="0" y1="22" x2="490" y2="26" stroke="#1f7a3a" stroke-width="2.2"/>
      <text x="245" y="80" font-size="11" text-anchor="middle" fill="#5a4a3a">signal flows through residual; trains stably at 100+ layers</text>
    </g>

    <!-- verdict pill -->
    <g transform="translate(40, 400)">
      <rect x="0" y="0" width="490" height="56" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="15" y="22" font-size="12" font-weight="700" fill="#1f7a3a">Verdict</text>
      <text x="15" y="42" font-size="12" fill="#1a1a2e">Default for GPT-2/3/4, Llama, Mistral, Claude; scales to hundreds of layers.</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1140" height="64" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Pre-Norm leaves the residual stream untouched, giving gradients an unobstructed path; this is why every modern LLM uses it.</text>
  </g>
</svg>
