<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Causal Attention Mask</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">A token can only attend to previous positions — strict lower-triangular pattern enforces autoregressive generation</text>

  <!-- 4×4 attention matrix -->
  <g>
    <text x="370" y="115" font-size="13" font-weight="600" text-anchor="middle" fill="#1a4078">Keys (positions being attended to) →</text>

    <!-- Column headers -->
    <g font-size="13" font-weight="600" fill="#1a4078">
      <text x="240" y="155" text-anchor="middle">The</text>
      <text x="340" y="155" text-anchor="middle">cat</text>
      <text x="440" y="155" text-anchor="middle">sat</text>
      <text x="540" y="155" text-anchor="middle">down</text>
    </g>

    <text x="120" y="280" font-size="13" font-weight="600" text-anchor="middle" fill="#1a4078" transform="rotate(-90 120 280)">Queries (current position) ↓</text>

    <!-- Row labels -->
    <g font-size="13" font-weight="600" fill="#1a4078">
      <text x="180" y="200" text-anchor="end">The</text>
      <text x="180" y="270" text-anchor="end">cat</text>
      <text x="180" y="340" text-anchor="end">sat</text>
      <text x="180" y="410" text-anchor="end">down</text>
    </g>

    <!-- Grid cells (4x4) -->
    <!-- Row "The" -->
    <rect x="200" y="170" width="80" height="60" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="240" y="206" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">✓</text>
    <rect x="300" y="170" width="80" height="60" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="340" y="206" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">−∞</text>
    <rect x="400" y="170" width="80" height="60" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="440" y="206" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">−∞</text>
    <rect x="500" y="170" width="80" height="60" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="540" y="206" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">−∞</text>

    <!-- Row "cat" -->
    <rect x="200" y="240" width="80" height="60" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="240" y="276" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">✓</text>
    <rect x="300" y="240" width="80" height="60" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="340" y="276" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">✓</text>
    <rect x="400" y="240" width="80" height="60" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="440" y="276" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">−∞</text>
    <rect x="500" y="240" width="80" height="60" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="540" y="276" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">−∞</text>

    <!-- Row "sat" -->
    <rect x="200" y="310" width="80" height="60" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="240" y="346" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">✓</text>
    <rect x="300" y="310" width="80" height="60" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="340" y="346" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">✓</text>
    <rect x="400" y="310" width="80" height="60" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="440" y="346" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">✓</text>
    <rect x="500" y="310" width="80" height="60" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="540" y="346" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">−∞</text>

    <!-- Row "down" -->
    <rect x="200" y="380" width="80" height="60" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="240" y="416" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">✓</text>
    <rect x="300" y="380" width="80" height="60" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="340" y="416" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">✓</text>
    <rect x="400" y="380" width="80" height="60" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="440" y="416" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">✓</text>
    <rect x="500" y="380" width="80" height="60" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="540" y="416" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">✓</text>
  </g>

  <!-- Legend -->
  <g transform="translate(220, 480)">
    <rect x="0" y="0" width="20" height="20" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="30" y="15" font-size="12" fill="#1a1a2e">attend (score kept)</text>
    <rect x="180" y="0" width="20" height="20" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="210" y="15" font-size="12" fill="#1a1a2e">block (set to −∞ before softmax)</text>
  </g>

  <!-- Right-side callout -->
  <g transform="translate(680, 130)">
    <rect x="0" y="0" width="540" height="380" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="270" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Why mask, not just truncate?</text>
    <line x1="20" y1="46" x2="520" y2="46" stroke="#d4b96a" stroke-width="0.6"/>

    <text x="20" y="78" font-size="13" font-weight="600" fill="#1a4078">All positions computed in parallel</text>
    <text x="20" y="100" font-size="12" fill="#1a1a2e">During training, the model sees all tokens at once.</text>
    <text x="20" y="118" font-size="12" fill="#1a1a2e">The mask creates the illusion of left-to-right generation</text>
    <text x="20" y="136" font-size="12" fill="#1a1a2e">while still letting matrix multiplication parallelize.</text>

    <text x="20" y="170" font-size="13" font-weight="600" fill="#7a5e1a">Implementation</text>
    <text x="20" y="192" font-size="12" font-family="monospace" fill="#1a1a2e">scores = Q @ K.T / sqrt(d_k)</text>
    <text x="20" y="210" font-size="12" font-family="monospace" fill="#1a1a2e">scores += causal_mask  # 0 or −∞</text>
    <text x="20" y="228" font-size="12" font-family="monospace" fill="#1a1a2e">attn = softmax(scores)</text>
    <text x="20" y="252" font-size="12" font-style="italic" fill="#5a4a3a">Adding −∞ → softmax → 0 attention weight.</text>

    <text x="20" y="288" font-size="13" font-weight="600" fill="#1f7a3a">Encoder vs decoder</text>
    <text x="20" y="310" font-size="12" fill="#1a1a2e">Encoder (BERT): no mask → bidirectional context.</text>
    <text x="20" y="328" font-size="12" fill="#1a1a2e">Decoder (GPT): causal mask → autoregressive generation.</text>
    <text x="20" y="350" font-size="12" fill="#1a1a2e">T5 / encoder-decoder: encoder bidir + decoder causal.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">A causal mask = lower-triangular matrix of zeros / upper-triangular of −∞. Cheap to apply, lets the model train in parallel while obeying autoregressive ordering at inference.</text>
  </g>
</svg>
