<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Multi-Head Attention</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Run h scaled-dot-product attentions in parallel with different projections, then concatenate</text>

  <!-- Input X -->
  <g>
    <rect x="540" y="100" width="220" height="60" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="650" y="128" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">Input X</text>
    <text x="650" y="148" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">(n × d_model)</text>
  </g>

  <!-- Split into 4 heads -->
  <g stroke="#1a1a2e" stroke-width="1.5" fill="none">
    <line x1="650" y1="160" x2="200" y2="220" marker-end="url(#arr)"/>
    <line x1="650" y1="160" x2="475" y2="220" marker-end="url(#arr)"/>
    <line x1="650" y1="160" x2="825" y2="220" marker-end="url(#arr)"/>
    <line x1="650" y1="160" x2="1100" y2="220" marker-end="url(#arr)"/>
  </g>

  <!-- 4 heads side by side -->
  <g>
    <rect x="80" y="225" width="240" height="180" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="200" y="255" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Head 1</text>
    <text x="200" y="280" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">W₁ᴼ, W₁ᴷ, W₁ⱽ</text>
    <line x1="100" y1="295" x2="300" y2="295" stroke="#7a5e1a" stroke-width="0.6"/>
    <text x="200" y="320" font-size="12" text-anchor="middle" fill="#1a1a2e">attention(Q₁, K₁, V₁)</text>
    <text x="200" y="355" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">e.g. learns syntax</text>
    <text x="200" y="378" font-size="11" font-family="monospace" text-anchor="middle" fill="#5a4a3a">(n × d_k)  d_k = d_model/h</text>

    <rect x="355" y="225" width="240" height="180" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="475" y="255" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Head 2</text>
    <text x="475" y="280" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">W₂ᴼ, W₂ᴷ, W₂ⱽ</text>
    <line x1="375" y1="295" x2="575" y2="295" stroke="#7a5e1a" stroke-width="0.6"/>
    <text x="475" y="320" font-size="12" text-anchor="middle" fill="#1a1a2e">attention(Q₂, K₂, V₂)</text>
    <text x="475" y="355" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">e.g. coreference</text>
    <text x="475" y="378" font-size="11" font-family="monospace" text-anchor="middle" fill="#5a4a3a">(n × d_k)</text>

    <rect x="705" y="225" width="240" height="180" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="825" y="255" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Head 3</text>
    <text x="825" y="280" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">W₃ᴼ, W₃ᴷ, W₃ⱽ</text>
    <line x1="725" y1="295" x2="925" y2="295" stroke="#7a5e1a" stroke-width="0.6"/>
    <text x="825" y="320" font-size="12" text-anchor="middle" fill="#1a1a2e">attention(Q₃, K₃, V₃)</text>
    <text x="825" y="355" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">e.g. semantic role</text>
    <text x="825" y="378" font-size="11" font-family="monospace" text-anchor="middle" fill="#5a4a3a">(n × d_k)</text>

    <rect x="980" y="225" width="240" height="180" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="1100" y="255" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Head 4</text>
    <text x="1100" y="280" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">W₄ᴼ, W₄ᴷ, W₄ⱽ</text>
    <line x1="1000" y1="295" x2="1200" y2="295" stroke="#7a5e1a" stroke-width="0.6"/>
    <text x="1100" y="320" font-size="12" text-anchor="middle" fill="#1a1a2e">attention(Q₄, K₄, V₄)</text>
    <text x="1100" y="355" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">e.g. positional</text>
    <text x="1100" y="378" font-size="11" font-family="monospace" text-anchor="middle" fill="#5a4a3a">(n × d_k)</text>
  </g>

  <text x="650" y="200" font-size="11" font-style="italic" fill="#5a4a3a">project X into h subspaces (d_model = h · d_k, here h = 4)</text>

  <!-- Concat -->
  <g stroke="#1a1a2e" stroke-width="1.5" fill="none">
    <line x1="200" y1="405" x2="540" y2="450" marker-end="url(#arr)"/>
    <line x1="475" y1="405" x2="600" y2="450" marker-end="url(#arr)"/>
    <line x1="825" y1="405" x2="700" y2="450" marker-end="url(#arr)"/>
    <line x1="1100" y1="405" x2="760" y2="450" marker-end="url(#arr)"/>
  </g>

  <g>
    <rect x="490" y="455" width="320" height="60" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="650" y="480" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Concat</text>
    <text x="650" y="503" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">(n × h·d_k)  =  (n × d_model)</text>
  </g>

  <line x1="650" y1="515" x2="650" y2="555" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="490" y="560" width="320" height="50" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="650" y="592" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">W_O projection</text>
  </g>

  <line x1="650" y1="610" x2="650" y2="640" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="490" y="640" width="320" height="50" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="650" y="672" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Output (n × d_model)</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 0)" />
</svg>
