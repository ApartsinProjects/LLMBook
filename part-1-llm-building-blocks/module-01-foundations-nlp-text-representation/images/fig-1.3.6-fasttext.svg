<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">fastText: a word is the sum of its character n-grams</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each subword has its own vector; the word vector is built by summing them at lookup time.</text>

  <!-- Stage 1: word -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="44" font-size="20" font-weight="700" text-anchor="middle" fill="#1a4078">running</text>
    <text x="100" y="72" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">input word</text>
  </g>

  <!-- Arrow split -->
  <g>
    <line x1="280" y1="230" x2="380" y2="230" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="330" y="218" font-size="11" font-weight="600" text-anchor="middle" fill="#5a4a3a">split into</text>
    <text x="330" y="252" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">3-char n-grams</text>
  </g>

  <!-- Stage 2: n-grams -->
  <g transform="translate(380, 130)">
    <rect x="0" y="0" width="380" height="200" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="190" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">Character n-grams</text>
    <text x="190" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">word wrapped in &lt; and &gt; markers</text>

    <g font-size="14" font-weight="600" fill="#1a1a2e" text-anchor="middle">
      <rect x="20" y="68" width="70" height="36" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/><text x="55" y="92">&lt;ru</text>
      <rect x="100" y="68" width="70" height="36" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/><text x="135" y="92">run</text>
      <rect x="180" y="68" width="70" height="36" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/><text x="215" y="92">unn</text>
      <rect x="260" y="68" width="70" height="36" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/><text x="295" y="92">nni</text>

      <rect x="20" y="118" width="70" height="36" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/><text x="55" y="142">nin</text>
      <rect x="100" y="118" width="70" height="36" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/><text x="135" y="142">ing</text>
      <rect x="180" y="118" width="70" height="36" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/><text x="215" y="142">ng&gt;</text>
      <rect x="260" y="118" width="70" height="36" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1" stroke-dasharray="3 2"/><text x="295" y="142" font-size="12" fill="#5a4a3a">...</text>
    </g>
    <text x="190" y="180" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">each n-gram has its own learned vector</text>
  </g>

  <!-- Arrow to sigma -->
  <g>
    <line x1="760" y1="230" x2="860" y2="230" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="810" y="218" font-size="11" font-weight="600" text-anchor="middle" fill="#5a4a3a">embed each,</text>
    <text x="810" y="252" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">then sum</text>
  </g>

  <!-- Stage 3: sigma -->
  <g transform="translate(860, 180)">
    <circle cx="60" cy="50" r="50" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="60" y="58" font-size="34" font-weight="700" text-anchor="middle" fill="#722f8a">&#993311;</text>
    <text x="60" y="120" font-size="11" font-style="italic" text-anchor="middle" fill="#722f8a">sum subword vectors</text>
  </g>

  <!-- Arrow to final -->
  <line x1="980" y1="230" x2="1060" y2="230" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 4: final vector -->
  <g transform="translate(1060, 180)">
    <rect x="0" y="0" width="160" height="100" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="80" y="38" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">v(running)</text>
    <text x="80" y="60" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">final word vector</text>
    <text x="80" y="82" font-size="11" text-anchor="middle" fill="#5a4a3a">dim ~100-300</text>
  </g>

  <!-- Why callout -->
  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="560" height="120" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why subwords?</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">word2vec gives the OOV word "runner" a zero vector,</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">because it never saw it during training.</text>
    <text x="20" y="94" font-size="12" fill="#1a1a2e">fastText reuses n-grams "run", "unn", etc., so "runner"</text>
    <text x="20" y="112" font-size="12" fill="#1a1a2e">still gets a meaningful vector at inference time.</text>
  </g>

  <!-- Use when callout -->
  <g transform="translate(660, 400)">
    <rect x="0" y="0" width="560" height="120" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1a4078">Use when</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">- morphologically rich languages (Finnish, Turkish, Arabic)</text>
    <text x="20" y="72" font-size="12" fill="#1a1a2e">- noisy text with typos and slang ("runnning", "runn")</text>
    <text x="20" y="94" font-size="12" fill="#1a1a2e">- domains with many rare or invented words</text>
    <text x="20" y="112" font-size="12" font-style="italic" fill="#5a4a3a">handles out-of-vocabulary words gracefully</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">fastText represents a word as the sum of its character n-gram vectors, giving it generalization across morphology and a real vector for every word, even unseen ones.</text>
  </g>
</svg>
