<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The four layers of linguistic meaning</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">From surface form to speaker intent: each layer adds context the layer below cannot see.</text>

  <!-- Stack of 4 layers, top = most abstract -->
  <!-- Layer: Pragmatics (top, most abstract) -->
  <g transform="translate(260, 110)">
    <rect x="0" y="0" width="780" height="100" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#722f8a">Pragmatics</text>
    <text x="20" y="52" font-size="12" font-style="italic" fill="#5a4a3a">intent and context: what the speaker means to do</text>
    <text x="20" y="78" font-size="13" fill="#1a1a2e">Example: "Can you pass the salt?" is a request, not a question about ability.</text>
    <text x="760" y="30" font-size="11" text-anchor="end" fill="#722f8a">Layer 4 (most abstract)</text>
  </g>

  <!-- Layer: Semantics -->
  <g transform="translate(260, 230)">
    <rect x="0" y="0" width="780" height="100" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#1a4078">Semantics</text>
    <text x="20" y="52" font-size="12" font-style="italic" fill="#5a4a3a">literal meaning of words and phrases</text>
    <text x="20" y="78" font-size="13" fill="#1a1a2e">Example: "bank" can mean river edge or financial institution; sense depends on neighbors.</text>
    <text x="760" y="30" font-size="11" text-anchor="end" fill="#1a4078">Layer 3</text>
  </g>

  <!-- Layer: Syntax -->
  <g transform="translate(260, 350)">
    <rect x="0" y="0" width="780" height="100" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#7a5e1a">Syntax</text>
    <text x="20" y="52" font-size="12" font-style="italic" fill="#5a4a3a">grammar and structural relations between words</text>
    <text x="20" y="78" font-size="13" fill="#1a1a2e">Example: "Dog bites man" vs "Man bites dog": same words, opposite roles.</text>
    <text x="760" y="30" font-size="11" text-anchor="end" fill="#7a5e1a">Layer 2</text>
  </g>

  <!-- Layer: Morphology (bottom, most concrete) -->
  <g transform="translate(260, 470)">
    <rect x="0" y="0" width="780" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#1f7a3a">Morphology</text>
    <text x="20" y="52" font-size="12" font-style="italic" fill="#5a4a3a">internal structure of words: roots, prefixes, suffixes</text>
    <text x="20" y="78" font-size="13" fill="#1a1a2e">Example: "running" = run + -ing; "studies" = study + -es; pieces carry meaning.</text>
    <text x="760" y="30" font-size="11" text-anchor="end" fill="#1f7a3a">Layer 1 (most concrete)</text>
  </g>

  <!-- Side axis arrow showing abstraction direction -->
  <g>
    <line x1="220" y1="560" x2="220" y2="130" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="200" y="350" font-size="12" font-weight="600" fill="#1a1a2e" transform="rotate(-90, 200, 350)" text-anchor="middle">more abstract / context-dependent</text>
  </g>

  <!-- Right-side note -->
  <g transform="translate(1060, 110)">
    <rect x="0" y="0" width="200" height="460" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why it matters</text>
    <text x="14" y="50" font-size="11" fill="#1a1a2e">Classical NLP built one</text>
    <text x="14" y="64" font-size="11" fill="#1a1a2e">tool per layer (POS tagger,</text>
    <text x="14" y="78" font-size="11" fill="#1a1a2e">parser, WSD, coref).</text>
    <text x="14" y="106" font-size="11" fill="#1a1a2e">Modern LLMs collapse the</text>
    <text x="14" y="120" font-size="11" fill="#1a1a2e">stack: a single network</text>
    <text x="14" y="134" font-size="11" fill="#1a1a2e">learns all four layers</text>
    <text x="14" y="148" font-size="11" fill="#1a1a2e">implicitly from raw text.</text>
    <text x="14" y="180" font-size="11" fill="#1a1a2e">But the layers are still</text>
    <text x="14" y="194" font-size="11" fill="#1a1a2e">useful as a diagnostic</text>
    <text x="14" y="208" font-size="11" fill="#1a1a2e">vocabulary when a model</text>
    <text x="14" y="222" font-size="11" fill="#1a1a2e">fails: is the error in</text>
    <text x="14" y="236" font-size="11" fill="#1a1a2e">grammar (syntax) or in</text>
    <text x="14" y="250" font-size="11" fill="#1a1a2e">intent (pragmatics)?</text>
    <text x="14" y="282" font-size="11" font-weight="700" fill="#7a5e1a">Probing studies show</text>
    <text x="14" y="296" font-size="11" fill="#1a1a2e">transformer layers loosely</text>
    <text x="14" y="310" font-size="11" fill="#1a1a2e">mirror this stack: lower</text>
    <text x="14" y="324" font-size="11" fill="#1a1a2e">layers handle morphology,</text>
    <text x="14" y="338" font-size="11" fill="#1a1a2e">middle layers handle</text>
    <text x="14" y="352" font-size="11" fill="#1a1a2e">syntax, upper layers</text>
    <text x="14" y="366" font-size="11" fill="#1a1a2e">handle semantics and</text>
    <text x="14" y="380" font-size="11" fill="#1a1a2e">pragmatics.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 610)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Language is a stack: each higher layer requires the layer below plus extra context. Modern LLMs learn all four jointly, but the stack still names where errors live.</text>
  </g>
</svg>
