<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">What each ELMo layer captures</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Probing studies show that lower BiLSTM layers learn surface form; upper layers drift toward meaning.</text>

  <!-- Stack of 3 layers (top = semantics) -->

  <!-- Layer 2: semantics -->
  <g transform="translate(220, 100)">
    <rect x="0" y="0" width="700" height="120" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#1f7a3a">Layer 2 -- Semantics</text>
    <text x="20" y="52" font-size="12" font-style="italic" fill="#5a4a3a">word sense, topic, meaning in context</text>
    <text x="20" y="78" font-size="13" fill="#1a1a2e">Best probe accuracy on word-sense disambiguation: "bank" (river) vs "bank" (finance)</text>
    <text x="20" y="98" font-size="13" fill="#1a1a2e">gets distinct vectors here. Best layer for sentiment, NLI, coreference.</text>
    <text x="680" y="30" font-size="11" text-anchor="end" fill="#1f7a3a">top of stack</text>
  </g>

  <!-- Layer 1: syntax -->
  <g transform="translate(220, 240)">
    <rect x="0" y="0" width="700" height="120" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#1a4078">Layer 1 -- Syntax</text>
    <text x="20" y="52" font-size="12" font-style="italic" fill="#5a4a3a">part-of-speech, grammatical role, dependency structure</text>
    <text x="20" y="78" font-size="13" fill="#1a1a2e">Best probe accuracy on POS tagging, constituency parsing, subject-verb</text>
    <text x="20" y="98" font-size="13" fill="#1a1a2e">agreement. Best layer for parsing-style downstream tasks.</text>
    <text x="680" y="30" font-size="11" text-anchor="end" fill="#1a4078">middle</text>
  </g>

  <!-- Layer 0: morphology -->
  <g transform="translate(220, 380)">
    <rect x="0" y="0" width="700" height="120" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#7a5e1a">Layer 0 -- Morphology</text>
    <text x="20" y="52" font-size="12" font-style="italic" fill="#5a4a3a">word identity, character patterns, prefixes and suffixes</text>
    <text x="20" y="78" font-size="13" fill="#1a1a2e">Output of the character-CNN. Recognises "running", "ran", "runs" as related</text>
    <text x="20" y="98" font-size="13" fill="#1a1a2e">forms via shared characters. Best layer for spelling-sensitive tasks.</text>
    <text x="680" y="30" font-size="11" text-anchor="end" fill="#7a5e1a">bottom of stack</text>
  </g>

  <!-- Side axis -->
  <g>
    <line x1="180" y1="490" x2="180" y2="120" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="160" y="305" font-size="12" font-weight="600" fill="#1a1a2e" transform="rotate(-90, 160, 305)" text-anchor="middle">more abstract / context-dependent</text>
  </g>

  <!-- Right callout: a-weights -->
  <g transform="translate(940, 100)">
    <rect x="0" y="0" width="280" height="400" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why three layers, not one?</text>
    <text x="14" y="50" font-size="11" fill="#1a1a2e">ELMo lets each downstream</text>
    <text x="14" y="64" font-size="11" fill="#1a1a2e">task choose its own mix:</text>
    <text x="14" y="90" font-size="12" font-weight="700" fill="#1a4078">Parsing</text>
    <text x="14" y="106" font-size="11" fill="#1a1a2e">a1 (syntax) gets the highest</text>
    <text x="14" y="120" font-size="11" fill="#1a1a2e">weight.</text>
    <text x="14" y="146" font-size="12" font-weight="700" fill="#1f7a3a">Sentiment / NLI</text>
    <text x="14" y="162" font-size="11" fill="#1a1a2e">a2 (semantics) wins; the</text>
    <text x="14" y="176" font-size="11" fill="#1a1a2e">model needs meaning.</text>
    <text x="14" y="202" font-size="12" font-weight="700" fill="#7a5e1a">Spelling correction</text>
    <text x="14" y="218" font-size="11" fill="#1a1a2e">a0 (characters) dominates.</text>
    <text x="14" y="248" font-size="11" font-style="italic" fill="#5a4a3a">The weights a0, a1, a2 are</text>
    <text x="14" y="262" font-size="11" font-style="italic" fill="#5a4a3a">learned per task during</text>
    <text x="14" y="276" font-size="11" font-style="italic" fill="#5a4a3a">fine-tuning.</text>
    <text x="14" y="306" font-size="11" font-weight="700" fill="#1a1a2e">This pattern recurs</text>
    <text x="14" y="320" font-size="11" fill="#1a1a2e">in BERT and beyond:</text>
    <text x="14" y="334" font-size="11" fill="#1a1a2e">probing studies report the</text>
    <text x="14" y="348" font-size="11" fill="#1a1a2e">same low-mid-high pattern</text>
    <text x="14" y="362" font-size="11" fill="#1a1a2e">across transformer layers,</text>
    <text x="14" y="376" font-size="11" fill="#1a1a2e">even though no architectural</text>
    <text x="14" y="390" font-size="11" fill="#1a1a2e">choice forces it.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 555)">
    <rect x="0" y="0" width="1140" height="120" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">ELMo's stacked BiLSTM is not a black box: probing classifiers show layer 0 encodes form, layer 1 encodes structure,</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">and layer 2 encodes meaning. The learned scalar mix lets each downstream task pull from the right altitude.</text>
    <text x="20" y="92" font-size="12" font-style="italic" fill="#5a4a3a">Implication: a single "embedding" is the wrong abstraction. Useful representations live at many depths simultaneously.</text>
  </g>
</svg>
