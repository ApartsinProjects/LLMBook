<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Helvetica, Arial, sans-serif">
  <title>Multimodal tokens: text and images share one transformer sequence</title>
  <rect width="1100" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Text and images share one sequence</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Two front-ends project into the same embedding space</text>

  <g transform="translate(60, 110)">
    <rect width="430" height="180" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <rect x="0" y="0" width="430" height="38" rx="10" fill="#1a4078"/>
    <text x="215" y="25" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Text lane</text>

    <rect x="30" y="58" width="370" height="42" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="215" y="84" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">BPE tokenizer</text>

    <rect x="30" y="118" width="370" height="42" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="215" y="144" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Token embeddings (d)</text>
  </g>

  <g transform="translate(610, 110)">
    <rect width="430" height="180" rx="10" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <rect x="0" y="0" width="430" height="38" rx="10" fill="#a67c1a"/>
    <text x="215" y="25" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Image lane</text>

    <rect x="30" y="58" width="370" height="42" rx="6" fill="#ffffff" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="215" y="84" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Patch + projection</text>

    <rect x="30" y="118" width="370" height="42" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="215" y="144" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Patch embeddings (d)</text>
  </g>

  <line x1="275" y1="295" x2="275" y2="335" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="825" y1="295" x2="825" y2="335" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(60, 340)">
    <rect width="980" height="80" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="490" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Concatenated sequence</text>
    <text x="490" y="58" font-size="13" font-style="italic" text-anchor="middle" fill="#1a1a2e">single transformer back-end</text>
  </g>

  <g transform="translate(60, 450)">
    <rect width="980" height="100" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="490" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Key idea</text>
    <text x="490" y="58" font-size="12" text-anchor="middle" fill="#1a1a2e">A "token" is any vector in the model's embedding space. As long as text and images both project there,</text>
    <text x="490" y="78" font-size="12" text-anchor="middle" fill="#1a1a2e">the transformer treats them uniformly: same attention, same parameters, same position scheme.</text>
  </g>
</svg>
