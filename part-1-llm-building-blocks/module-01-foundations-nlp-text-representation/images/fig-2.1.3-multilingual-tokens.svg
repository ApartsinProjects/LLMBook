<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="650" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Multilingual Token Costs: Same Meaning, Different Bills</text>
  <text x="650" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">Translating "How are you today?" to 4 languages — context window remaining (out of 20 tokens)</text>

  <!-- ============================================================ -->
  <!-- Stacked horizontal bar chart                                   -->
  <!-- ============================================================ -->
  <!-- Each bar is 80 px tall, 40 px gap; total width 800 px = 20 tokens -->
  <!-- Position: bars start at x=240, end at x=1040 (800 px) -->

  <!-- Token-axis ticks (5, 10, 15, 20) -->
  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="440" y1="120" x2="440" y2="610"/>
    <line x1="640" y1="120" x2="640" y2="610"/>
    <line x1="840" y1="120" x2="840" y2="610"/>
  </g>
  <g font-size="11" fill="#5a4a3a" text-anchor="middle">
    <text x="240" y="630">0</text>
    <text x="440" y="630">5</text>
    <text x="640" y="630">10</text>
    <text x="840" y="630">15</text>
    <text x="1040" y="630">20</text>
    <text x="640" y="650" font-weight="700" fill="#1a1a2e" font-size="13">tokens</text>
  </g>

  <!-- Y-axis line -->
  <line x1="240" y1="120" x2="240" y2="610" stroke="#1a1a2e" stroke-width="2"/>

  <!-- ============================================================ -->
  <!-- Bar 1: English — 5 tokens used, 15 remaining (75% remaining)  -->
  <!-- ============================================================ -->
  <text x="225" y="170" text-anchor="end" font-size="14" font-weight="700" fill="#1a1a2e">English</text>
  <text x="225" y="190" text-anchor="end" font-size="11" fill="#5a4a3a" font-style="italic">"How are you today?"</text>
  <g filter="url(#sh)">
    <!-- USED portion: 5 tokens -> 200 px wide (200/800 * 5/5 not right; 5/20 * 800 = 200) -->
    <rect x="240" y="135" width="200" height="55" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="340" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#b3401b">5 used</text>
    <!-- REMAINING portion: 15 tokens -> 600 px wide -->
    <rect x="440" y="135" width="600" height="55" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="740" y="172" text-anchor="middle" font-size="13" fill="#1f7a3a" font-weight="700">15 remaining   (75% free)</text>
  </g>

  <!-- ============================================================ -->
  <!-- Bar 2: Spanish — 7 tokens used, 13 remaining (65% remaining)  -->
  <!-- ============================================================ -->
  <text x="225" y="240" text-anchor="end" font-size="14" font-weight="700" fill="#1a1a2e">Spanish</text>
  <text x="225" y="260" text-anchor="end" font-size="11" fill="#5a4a3a" font-style="italic">"¿Cómo estás hoy?"</text>
  <g filter="url(#sh)">
    <rect x="240" y="225" width="280" height="55" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="380" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#b3401b">7 used</text>
    <rect x="520" y="225" width="520" height="55" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="780" y="262" text-anchor="middle" font-size="13" fill="#1f7a3a" font-weight="700">13 remaining   (65% free)</text>
  </g>

  <!-- ============================================================ -->
  <!-- Bar 3: Japanese — 14 tokens used, 6 remaining (30%)            -->
  <!-- ============================================================ -->
  <text x="225" y="330" text-anchor="end" font-size="14" font-weight="700" fill="#1a1a2e">Japanese</text>
  <text x="225" y="350" text-anchor="end" font-size="11" fill="#5a4a3a" font-style="italic">"今日はお元気ですか？"</text>
  <g filter="url(#sh)">
    <rect x="240" y="315" width="560" height="55" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="520" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#b3401b">14 used</text>
    <rect x="800" y="315" width="240" height="55" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="920" y="352" text-anchor="middle" font-size="13" fill="#1f7a3a" font-weight="700">6 remaining</text>
    <text x="920" y="368" text-anchor="middle" font-size="11" fill="#5a4a3a">(30% free)</text>
  </g>

  <!-- ============================================================ -->
  <!-- Bar 4: Hindi — 18 tokens used, 2 remaining (10%)               -->
  <!-- ============================================================ -->
  <text x="225" y="420" text-anchor="end" font-size="14" font-weight="700" fill="#1a1a2e">Hindi</text>
  <text x="225" y="440" text-anchor="end" font-size="11" fill="#5a4a3a" font-style="italic">"आज आप कैसे हैं?"</text>
  <g filter="url(#sh)">
    <rect x="240" y="405" width="720" height="55" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="600" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#b3401b">18 used  (3.6× English)</text>
    <rect x="960" y="405" width="80" height="55" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="1000" y="437" text-anchor="middle" font-size="11" fill="#1f7a3a" font-weight="700">2</text>
    <text x="1000" y="453" text-anchor="middle" font-size="11" fill="#5a4a3a">(10%)</text>
  </g>

  <!-- ============================================================ -->
  <!-- KEY TAKEAWAY (right side annotation)                           -->
  <!-- ============================================================ -->
  <g transform="translate(1080, 130)">
    <rect x="0" y="0" width="200" height="350" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="100" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5e1a">Why the gap?</text>
    <line x1="20" y1="42" x2="180" y2="42" stroke="#d4b96a" stroke-width="0.8"/>
    <text x="15" y="68" font-size="11" fill="#1a1a2e">BPE tokenizers are trained</text>
    <text x="15" y="84" font-size="11" fill="#1a1a2e">on web text, dominated by</text>
    <text x="15" y="100" font-size="11" fill="#1a1a2e">English. They merge frequent</text>
    <text x="15" y="116" font-size="11" fill="#1a1a2e">English subwords aggressively</text>
    <text x="15" y="132" font-size="11" fill="#1a1a2e">→ short tokens for English.</text>
    <text x="15" y="160" font-size="11" fill="#1a1a2e">Less-represented languages</text>
    <text x="15" y="176" font-size="11" fill="#1a1a2e">fall back to byte-level</text>
    <text x="15" y="192" font-size="11" fill="#1a1a2e">tokens → many tokens per</text>
    <text x="15" y="208" font-size="11" fill="#1a1a2e">word → context fills fast.</text>
    <line x1="20" y1="225" x2="180" y2="225" stroke="#d4b96a" stroke-width="0.6" stroke-dasharray="3,2"/>
    <text x="100" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5e1a">Practical impact</text>
    <text x="15" y="270" font-size="11" fill="#1a1a2e">Same context-window quota</text>
    <text x="15" y="286" font-size="11" fill="#1a1a2e">cuts 3-4× shorter for</text>
    <text x="15" y="302" font-size="11" fill="#1a1a2e">non-English. RAG systems</text>
    <text x="15" y="318" font-size="11" fill="#1a1a2e">need language-aware budget</text>
    <text x="15" y="334" font-size="11" fill="#1a1a2e">tracking, not token quotas.</text>
  </g>

  <!-- Bottom takeaway strip -->
  <g transform="translate(80, 530)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#b3401b">⚠ Token cost grows with linguistic distance from English</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">Hindi uses 3.6× more tokens than English for the same sentence. Pricing per token + context-window limits both penalize</text>
    <text x="20" y="56" font-size="11" fill="#5a4a3a" font-style="italic">non-Latin-script languages disproportionately. Some providers (Cohere, OpenAI) report tokenizer fairness as a roadmap item.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 670)">
    <rect x="0" y="0" width="14" height="14" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
    <text x="20" y="12" font-size="11" fill="#1a1a2e">tokens used by the sentence</text>
    <rect x="240" y="0" width="14" height="14" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
    <text x="260" y="12" font-size="11" fill="#1a1a2e">tokens remaining in 20-token context window</text>
  </g>
</svg>
