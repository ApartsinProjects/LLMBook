<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Cosine Similarity: Direction, Not Length</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">cos θ = (a · b) / (‖a‖ · ‖b‖) — measures the angle between vectors, ignoring magnitude</text>

  <!-- LEFT panel: similar -->
  <g>
    <rect x="60" y="110" width="560" height="490" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="340" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">High similarity</text>
    <text x="340" y="166" font-size="13" text-anchor="middle" fill="#5a4a3a">"king" vs "queen" — small angle</text>

    <!-- Coordinate frame -->
    <line x1="180" y1="500" x2="540" y2="500" stroke="#5a4a3a" stroke-width="1"/>
    <line x1="180" y1="500" x2="180" y2="200" stroke="#5a4a3a" stroke-width="1"/>

    <!-- Vector A: king -->
    <line x1="180" y1="500" x2="500" y2="240" stroke="#1a4078" stroke-width="3" marker-end="url(#arr)"/>
    <text x="510" y="240" font-size="14" font-weight="600" fill="#1a4078">king</text>

    <!-- Vector B: queen (slightly off) -->
    <line x1="180" y1="500" x2="470" y2="220" stroke="#722f8a" stroke-width="3" marker-end="url(#arr)"/>
    <text x="430" y="210" font-size="14" font-weight="600" fill="#722f8a">queen</text>

    <!-- Angle arc -->
    <path d="M 240 440 A 80 80 0 0 0 220 410" fill="none" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="252" y="430" font-size="13" font-weight="700" fill="#1f7a3a">15°</text>

    <!-- Result label -->
    <rect x="180" y="540" width="320" height="40" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="340" y="565" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">cos 15° ≈ 0.97</text>
  </g>

  <!-- RIGHT panel: dissimilar -->
  <g>
    <rect x="680" y="110" width="560" height="490" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="960" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Low similarity</text>
    <text x="960" y="166" font-size="13" text-anchor="middle" fill="#5a4a3a">"king" vs "refrigerator" — large angle</text>

    <line x1="800" y1="500" x2="1160" y2="500" stroke="#5a4a3a" stroke-width="1"/>
    <line x1="800" y1="500" x2="800" y2="200" stroke="#5a4a3a" stroke-width="1"/>

    <!-- Vector A: king (same direction as left panel) -->
    <line x1="800" y1="500" x2="1120" y2="240" stroke="#1a4078" stroke-width="3" marker-end="url(#arr)"/>
    <text x="1130" y="240" font-size="14" font-weight="600" fill="#1a4078">king</text>

    <!-- Vector B: refrigerator (mostly horizontal, very different angle) -->
    <line x1="800" y1="500" x2="1130" y2="430" stroke="#7a5e1a" stroke-width="3" marker-end="url(#arr)"/>
    <text x="1140" y="430" font-size="14" font-weight="600" fill="#7a5e1a">refrigerator</text>

    <!-- Angle arc -->
    <path d="M 875 458 A 100 100 0 0 0 868 405" fill="none" stroke="#b3401b" stroke-width="1.5"/>
    <text x="900" y="445" font-size="13" font-weight="700" fill="#b3401b">65°</text>

    <rect x="800" y="540" width="320" height="40" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
    <text x="960" y="565" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">cos 65° ≈ 0.42</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Why direction, not length?</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Embedding magnitudes vary with word frequency (common words get longer vectors). Cosine factors that out, comparing only the "direction" — i.e., the meaning encoded by which dimensions are active.</text>
  </g>
</svg>
