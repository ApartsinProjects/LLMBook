<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>Unigram language model tokenizer: train by pruning, decode by Viterbi</title>
  <rect width="1100" height="600" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">Unigram tokenizer</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Train by pruning, decode by Viterbi</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
  </defs>

  <!-- LEFT: Training -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="500" height="36" rx="6" fill="#1a4078"/>
    <text x="20" y="24" font-size="14" font-weight="700" fill="#ffffff">Training: prune by likelihood loss</text>
  </g>

  <g transform="translate(40, 150)">
    <rect x="0" y="0" width="500" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <circle cx="32" cy="30" r="16" fill="#1a4078"/>
    <text x="32" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="60" y="26" font-size="13" font-weight="700" fill="#1a4078">Seed vocabulary</text>
    <text x="60" y="46" font-size="11" fill="#1a1a2e">200k pieces (~10x final size)</text>
  </g>

  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="500" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <circle cx="32" cy="30" r="16" fill="#1a4078"/>
    <text x="32" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="60" y="26" font-size="13" font-weight="700" fill="#1a4078">Score each token's loss</text>
    <text x="60" y="46" font-size="11" fill="#1a1a2e">how much log-likelihood drops if removed</text>
  </g>

  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="500" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <circle cx="32" cy="30" r="16" fill="#1a4078"/>
    <text x="32" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="60" y="26" font-size="13" font-weight="700" fill="#1a4078">Prune bottom 10-20%, repeat</text>
    <text x="60" y="46" font-size="11" fill="#1a1a2e">until target size (e.g. 32k)</text>
  </g>

  <g transform="translate(40, 370)">
    <rect x="0" y="0" width="500" height="40" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="250" y="26" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Output: vocabulary with p(w) for each piece</text>
  </g>

  <!-- divider -->
  <line x1="565" y1="100" x2="565" y2="450" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="6,6"/>

  <!-- RIGHT: Inference -->
  <g transform="translate(580, 100)">
    <rect x="0" y="0" width="480" height="36" rx="6" fill="#1f7a3a"/>
    <text x="20" y="24" font-size="14" font-weight="700" fill="#ffffff">Inference: Viterbi on "unhappiness"</text>
  </g>

  <g transform="translate(580, 150)">
    <rect x="0" y="0" width="480" height="40" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="240" y="26" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">u  n  h  a  p  p  i  n  e  s  s</text>
  </g>

  <!-- Lattice -->
  <g transform="translate(580, 200)">
    <rect x="0" y="0" width="480" height="180" rx="8" fill="#ffffff" stroke="#5a4a3a" stroke-width="1"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#1a1a2e">Token lattice</text>

    <!-- nodes -->
    <g fill="#ffffff" stroke="#1a1a2e" stroke-width="1">
      <circle cx="40" cy="70" r="6"/>
      <circle cx="140" cy="70" r="6"/>
      <circle cx="290" cy="70" r="6"/>
      <circle cx="440" cy="70" r="6"/>
    </g>

    <!-- best path -->
    <path d="M 40 70 Q 90 35 140 70" fill="none" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG)"/>
    <rect x="68" y="86" width="44" height="20" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.4"/>
    <text x="90" y="100" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1f7a3a">"un"</text>
    <text x="90" y="120" font-size="10" text-anchor="middle" fill="#1f7a3a">-1.2</text>

    <path d="M 140 70 Q 215 35 290 70" fill="none" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG)"/>
    <rect x="195" y="86" width="56" height="20" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.4"/>
    <text x="223" y="100" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1f7a3a">"happi"</text>
    <text x="223" y="120" font-size="10" text-anchor="middle" fill="#1f7a3a">-2.4</text>

    <path d="M 290 70 Q 365 35 440 70" fill="none" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG)"/>
    <rect x="345" y="86" width="50" height="20" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.4"/>
    <text x="370" y="100" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1f7a3a">"ness"</text>
    <text x="370" y="120" font-size="10" text-anchor="middle" fill="#1f7a3a">-1.8</text>

    <!-- alternative path -->
    <path d="M 40 70 Q 90 115 140 70" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M 140 70 Q 215 115 290 70" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M 290 70 Q 365 115 440 70" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="240" y="155" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">alternative splits rejected</text>

    <text x="240" y="172" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">score = -1.2 + -2.4 + -1.8 = -5.4</text>
  </g>

  <!-- Output -->
  <g transform="translate(580, 395)">
    <rect x="0" y="0" width="480" height="40" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="20" y="10" width="60" height="20" rx="3" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.4"/>
    <text x="50" y="24" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"un"</text>
    <rect x="90" y="10" width="80" height="20" rx="3" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.4"/>
    <text x="130" y="24" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"happi"</text>
    <rect x="180" y="10" width="70" height="20" rx="3" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.4"/>
    <text x="215" y="24" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"ness"</text>
    <text x="280" y="24" font-size="11" font-style="italic" fill="#5a4a3a">3 tokens, joint -5.4</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="1020" height="70" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Probabilistic where BPE is greedy</text>
    <text x="510" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">Training prunes by likelihood loss. Inference runs Viterbi over a token lattice. Supports subword regularization for free.</text>
  </g>
</svg>
