<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">Bag-of-Words count matrix</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each document becomes a row of word counts over a fixed vocabulary; order is discarded.</text>

  <!-- Matrix -->
  <g transform="translate(80, 120)">
    <text x="0" y="-6" font-size="13" font-weight="700" fill="#1a4078">Vocabulary (8 words)</text>

    <!-- Header row -->
    <g font-size="13" font-weight="700" fill="#1a1a2e" text-anchor="middle">
      <rect x="100" y="10" width="780" height="38" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="135" y="35">cat</text>
      <text x="232" y="35">chased</text>
      <text x="330" y="35">dog</text>
      <text x="427" y="35">log</text>
      <text x="525" y="35">mat</text>
      <text x="622" y="35">on</text>
      <text x="720" y="35">sat</text>
      <text x="817" y="35">the</text>
    </g>

    <!-- Row labels and cells -->
    <g font-size="13" font-weight="600">
      <!-- Doc 1: 1 0 0 0 1 1 1 2 -->
      <rect x="0" y="60" width="95" height="50" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="48" y="91" text-anchor="middle" fill="#1a4078">Doc 1</text>
      <g text-anchor="middle">
        <rect x="100" y="60" width="95" height="50" fill="#ecf6ee" stroke="#cccccc"/><text x="148" y="91">1</text>
        <rect x="195" y="60" width="95" height="50" fill="#f0f0f0" stroke="#cccccc"/><text x="243" y="91" fill="#5a4a3a">0</text>
        <rect x="290" y="60" width="95" height="50" fill="#f0f0f0" stroke="#cccccc"/><text x="338" y="91" fill="#5a4a3a">0</text>
        <rect x="385" y="60" width="95" height="50" fill="#f0f0f0" stroke="#cccccc"/><text x="433" y="91" fill="#5a4a3a">0</text>
        <rect x="480" y="60" width="95" height="50" fill="#ecf6ee" stroke="#cccccc"/><text x="528" y="91">1</text>
        <rect x="575" y="60" width="95" height="50" fill="#ecf6ee" stroke="#cccccc"/><text x="623" y="91">1</text>
        <rect x="670" y="60" width="95" height="50" fill="#ecf6ee" stroke="#cccccc"/><text x="718" y="91">1</text>
        <rect x="765" y="60" width="95" height="50" fill="#fef3e0" stroke="#cccccc"/><text x="813" y="91" fill="#7a5e1a">2</text>
      </g>

      <!-- Doc 2: 0 0 1 1 0 1 1 2 -->
      <rect x="0" y="115" width="95" height="50" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="48" y="146" text-anchor="middle" fill="#1a4078">Doc 2</text>
      <g text-anchor="middle">
        <rect x="100" y="115" width="95" height="50" fill="#f0f0f0" stroke="#cccccc"/><text x="148" y="146" fill="#5a4a3a">0</text>
        <rect x="195" y="115" width="95" height="50" fill="#f0f0f0" stroke="#cccccc"/><text x="243" y="146" fill="#5a4a3a">0</text>
        <rect x="290" y="115" width="95" height="50" fill="#ecf6ee" stroke="#cccccc"/><text x="338" y="146">1</text>
        <rect x="385" y="115" width="95" height="50" fill="#ecf6ee" stroke="#cccccc"/><text x="433" y="146">1</text>
        <rect x="480" y="115" width="95" height="50" fill="#f0f0f0" stroke="#cccccc"/><text x="528" y="146" fill="#5a4a3a">0</text>
        <rect x="575" y="115" width="95" height="50" fill="#ecf6ee" stroke="#cccccc"/><text x="623" y="146">1</text>
        <rect x="670" y="115" width="95" height="50" fill="#ecf6ee" stroke="#cccccc"/><text x="718" y="146">1</text>
        <rect x="765" y="115" width="95" height="50" fill="#fef3e0" stroke="#cccccc"/><text x="813" y="146" fill="#7a5e1a">2</text>
      </g>

      <!-- Doc 3: 1 1 1 0 0 0 0 2 -->
      <rect x="0" y="170" width="95" height="50" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="48" y="201" text-anchor="middle" fill="#1a4078">Doc 3</text>
      <g text-anchor="middle">
        <rect x="100" y="170" width="95" height="50" fill="#ecf6ee" stroke="#cccccc"/><text x="148" y="201">1</text>
        <rect x="195" y="170" width="95" height="50" fill="#ecf6ee" stroke="#cccccc"/><text x="243" y="201">1</text>
        <rect x="290" y="170" width="95" height="50" fill="#ecf6ee" stroke="#cccccc"/><text x="338" y="201">1</text>
        <rect x="385" y="170" width="95" height="50" fill="#f0f0f0" stroke="#cccccc"/><text x="433" y="201" fill="#5a4a3a">0</text>
        <rect x="480" y="170" width="95" height="50" fill="#f0f0f0" stroke="#cccccc"/><text x="528" y="201" fill="#5a4a3a">0</text>
        <rect x="575" y="170" width="95" height="50" fill="#f0f0f0" stroke="#cccccc"/><text x="623" y="201" fill="#5a4a3a">0</text>
        <rect x="670" y="170" width="95" height="50" fill="#f0f0f0" stroke="#cccccc"/><text x="718" y="201" fill="#5a4a3a">0</text>
        <rect x="765" y="170" width="95" height="50" fill="#fef3e0" stroke="#cccccc"/><text x="813" y="201" fill="#7a5e1a">2</text>
      </g>
    </g>

    <!-- Frame -->
    <rect x="-10" y="0" width="900" height="240" rx="6" fill="none" stroke="#1a4078" stroke-width="1" stroke-dasharray="4 3"/>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 410)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#1a1a2e">How to read each cell</text>

    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="370" height="60" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5"/>
      <text x="20" y="26" font-size="13" font-weight="700" fill="#5a4a3a">0 = absent</text>
      <text x="20" y="48" font-size="12" fill="#1a1a2e">word does not appear; matrix is mostly zeros (sparse)</text>
    </g>

    <g transform="translate(390, 20)">
      <rect x="0" y="0" width="370" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">1 = present once</text>
      <text x="20" y="48" font-size="12" fill="#1a1a2e">single occurrence in the document</text>
    </g>

    <g transform="translate(780, 20)">
      <rect x="0" y="0" width="370" height="60" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
      <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">2+ = frequent</text>
      <text x="20" y="48" font-size="12" fill="#1a1a2e">repeated word; raw counts feed downstream models</text>
    </g>
  </g>

  <!-- Callout -->
  <g transform="translate(80, 510)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Why "bag"?</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">"the cat sat" and "sat the cat" produce identical rows; word order is thrown away, like dumping words into a bag.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">BoW turns documents into fixed-length count vectors over a shared vocabulary; simple, sparse, and order-blind.</text>
  </g>
</svg>
