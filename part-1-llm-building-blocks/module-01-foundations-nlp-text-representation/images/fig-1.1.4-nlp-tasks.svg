<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">NLP tasks: understanding vs generation</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Classical NLP split tasks into two camps; modern LLMs collapse the boundary.</text>

  <!-- Understanding lane -->
  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="540" height="320" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="270" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1a4078">Understanding tasks</text>
    <text x="270" y="56" font-size="12" text-anchor="middle" fill="#5a4a3a">map text to a label, span, or answer</text>

    <g font-size="13" font-weight="600" fill="#1a1a2e">
      <rect x="40" y="90" width="210" height="80" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="145" y="120" text-anchor="middle">Classification</text>
      <text x="145" y="144" font-size="11" font-weight="400" fill="#5a4a3a" text-anchor="middle">topic, intent, spam</text>

      <rect x="290" y="90" width="210" height="80" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="395" y="120" text-anchor="middle">Named entity recognition</text>
      <text x="395" y="144" font-size="11" font-weight="400" fill="#5a4a3a" text-anchor="middle">people, places, dates</text>

      <rect x="40" y="200" width="210" height="80" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="145" y="230" text-anchor="middle">Sentiment analysis</text>
      <text x="145" y="254" font-size="11" font-weight="400" fill="#5a4a3a" text-anchor="middle">positive, neutral, negative</text>

      <rect x="290" y="200" width="210" height="80" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="395" y="230" text-anchor="middle">Question answering</text>
      <text x="395" y="254" font-size="11" font-weight="400" fill="#5a4a3a" text-anchor="middle">extract span from passage</text>
    </g>
  </g>

  <!-- Generation lane -->
  <g transform="translate(690, 110)">
    <rect x="0" y="0" width="540" height="320" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="270" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Generation tasks</text>
    <text x="270" y="56" font-size="12" text-anchor="middle" fill="#5a4a3a">produce new text token by token</text>

    <g font-size="13" font-weight="600" fill="#1a1a2e">
      <rect x="40" y="90" width="210" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="145" y="120" text-anchor="middle">Translation</text>
      <text x="145" y="144" font-size="11" font-weight="400" fill="#5a4a3a" text-anchor="middle">English to French, etc.</text>

      <rect x="290" y="90" width="210" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="395" y="120" text-anchor="middle">Summarization</text>
      <text x="395" y="144" font-size="11" font-weight="400" fill="#5a4a3a" text-anchor="middle">long doc to short gist</text>

      <rect x="165" y="200" width="210" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="270" y="230" text-anchor="middle">Open-ended generation</text>
      <text x="270" y="254" font-size="11" font-weight="400" fill="#5a4a3a" text-anchor="middle">stories, dialogue, code</text>
    </g>
  </g>

  <!-- Convergence to LLMs -->
  <g>
    <path d="M 340 440 Q 650 470 650 510" stroke="#1a1a2e" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 960 440 Q 650 470 650 510" stroke="#1a1a2e" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>

  <g transform="translate(420, 510)">
    <rect x="0" y="0" width="460" height="80" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="230" y="34" font-size="17" font-weight="700" text-anchor="middle" fill="#722f8a">LLMs perform both with one model</text>
    <text x="230" y="60" font-size="12" text-anchor="middle" fill="#1a1a2e">a single decoder reframes any task as next-token prediction</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Pre-LLM NLP shipped a different specialist model per task; an LLM unifies them by treating every task as text-in, text-out.</text>
  </g>
</svg>
