<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Helvetica, Arial, sans-serif">
  <title>Three tokenization artifacts that surprise users</title>
  <rect width="1100" height="580" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">Three tokenization surprises</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">What you type vs what the model sees</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <!-- Panel 1: Numbers -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="1020" height="130" rx="10" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="1020" height="30" rx="10" fill="#1a4078"/>
    <text x="20" y="20" font-size="13" font-weight="700" fill="#ffffff">1. Number splitting</text>

    <text x="40" y="65" font-size="12" font-weight="700" fill="#5a4a3a">You type</text>
    <rect x="40" y="75" width="200" height="40" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="140" y="100" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">128+256</text>

    <line x1="250" y1="95" x2="300" y2="95" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <text x="310" y="65" font-size="12" font-weight="700" fill="#5a4a3a">Model sees</text>
    <g transform="translate(310, 75)">
      <rect x="0" y="0" width="60" height="40" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="30" y="25" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">"12"</text>
      <rect x="65" y="0" width="40" height="40" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="85" y="25" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">"8"</text>
      <rect x="110" y="0" width="40" height="40" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="130" y="25" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"+"</text>
      <rect x="155" y="0" width="40" height="40" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="175" y="25" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">"2"</text>
      <rect x="200" y="0" width="40" height="40" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="220" y="25" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">"5"</text>
      <rect x="245" y="0" width="40" height="40" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="265" y="25" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">"6"</text>
    </g>

    <text x="780" y="80" font-size="12" font-weight="700" fill="#b3401b">Place value scrambled</text>
    <text x="780" y="100" font-size="11" fill="#1a1a2e">Result: 374, not 384</text>
  </g>

  <!-- Panel 2: Spaces -->
  <g transform="translate(40, 250)">
    <rect x="0" y="0" width="1020" height="130" rx="10" fill="#ffffff" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="1020" height="30" rx="10" fill="#1f7a3a"/>
    <text x="20" y="20" font-size="13" font-weight="700" fill="#ffffff">2. Leading-space tokens</text>

    <text x="40" y="65" font-size="12" font-weight="700" fill="#5a4a3a">You type</text>
    <rect x="40" y="75" width="200" height="40" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="140" y="100" font-size="13" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"Say hello"</text>

    <line x1="250" y1="95" x2="300" y2="95" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <text x="310" y="65" font-size="12" font-weight="700" fill="#5a4a3a">Two different prompts</text>
    <g transform="translate(310, 75)">
      <text x="0" y="14" font-size="11" fill="#1f7a3a">A: "Say hello"</text>
      <rect x="100" y="0" width="50" height="20" rx="3" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="125" y="14" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">Say</text>
      <rect x="155" y="0" width="80" height="20" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="195" y="14" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">" hello"</text>

      <text x="0" y="38" font-size="11" fill="#b3401b">B: "Say " then "hello"</text>
      <rect x="130" y="24" width="50" height="20" rx="3" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="155" y="38" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">Say</text>
      <rect x="185" y="24" width="30" height="20" rx="3" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="200" y="38" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">" "</text>
      <rect x="220" y="24" width="60" height="20" rx="3" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="250" y="38" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">hello</text>
    </g>

    <text x="780" y="80" font-size="12" font-weight="700" fill="#b3401b">Trailing space breaks</text>
    <text x="780" y="100" font-size="11" fill="#1a1a2e">prompts; use rare token IDs</text>
  </g>

  <!-- Panel 3: Emoji -->
  <g transform="translate(40, 400)">
    <rect x="0" y="0" width="1020" height="130" rx="10" fill="#ffffff" stroke="#722f8a" stroke-width="2"/>
    <rect x="0" y="0" width="1020" height="30" rx="10" fill="#722f8a"/>
    <text x="20" y="20" font-size="13" font-weight="700" fill="#ffffff">3. Emoji and rare Unicode</text>

    <text x="40" y="65" font-size="12" font-weight="700" fill="#5a4a3a">You type</text>
    <rect x="40" y="75" width="200" height="40" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="140" y="105" font-size="22" text-anchor="middle" fill="#1a1a2e">&#128512;</text>

    <line x1="250" y1="95" x2="300" y2="95" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <text x="310" y="65" font-size="12" font-weight="700" fill="#5a4a3a">Model sees 4 byte tokens</text>
    <g transform="translate(310, 75)">
      <rect x="0" y="0" width="70" height="40" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="2"/>
      <text x="35" y="25" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">&lt;0xF0&gt;</text>
      <rect x="75" y="0" width="70" height="40" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="2"/>
      <text x="110" y="25" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">&lt;0x9F&gt;</text>
      <rect x="150" y="0" width="70" height="40" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="2"/>
      <text x="185" y="25" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">&lt;0x98&gt;</text>
      <rect x="225" y="0" width="70" height="40" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="2"/>
      <text x="260" y="25" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">&lt;0x80&gt;</text>
    </g>

    <text x="780" y="80" font-size="12" font-weight="700" fill="#722f8a">4 tokens per glyph</text>
    <text x="780" y="100" font-size="11" fill="#1a1a2e">CJK and emoji cost adds up</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 550)">
    <rect x="0" y="0" width="1020" height="20" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="510" y="14" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">Numbers, whitespace, rare Unicode break in predictable ways. Check the tokenizer first.</text>
  </g>
</svg>
