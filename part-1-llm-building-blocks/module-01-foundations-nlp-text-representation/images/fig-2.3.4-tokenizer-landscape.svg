<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>The tokenizer landscape: three families that power modern LLMs</title>
  <rect width="1100" height="540" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">Three tokenizer families</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Same goal, different vocabulary algorithm</text>

  <!-- BBPE -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="320" height="340" rx="10" fill="#ffffff" stroke="#1a4078" stroke-width="2.5"/>
    <rect x="0" y="0" width="320" height="50" rx="10" fill="#1a4078"/>
    <text x="160" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Byte-level BPE</text>

    <text x="20" y="78" font-size="11" font-weight="700" fill="#1a4078">USED BY</text>
    <text x="20" y="100" font-size="12" fill="#1a1a2e">GPT-2/3/4, Llama, Mistral, Qwen</text>

    <text x="20" y="130" font-size="11" font-weight="700" fill="#1a4078">VOCAB</text>
    <text x="20" y="152" font-size="14" font-weight="700" fill="#1a4078">50k - 200k</text>

    <text x="20" y="184" font-size="11" font-weight="700" fill="#1a4078">KEY PROPERTY</text>
    <text x="20" y="206" font-size="12" fill="#1a1a2e">Lossless on any byte string</text>
    <text x="20" y="224" font-size="11" font-style="italic" fill="#5a4a3a">no [UNK]; emoji, code, every script</text>

    <text x="20" y="256" font-size="11" font-weight="700" fill="#b3401b">TRADEOFF</text>
    <text x="20" y="278" font-size="11" fill="#1a1a2e">greedy merges; no probabilities</text>

    <rect x="20" y="296" width="280" height="30" rx="5" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="160" y="316" font-size="11" font-style="italic" text-anchor="middle" fill="#7a5e1a">Pick for general-purpose LLMs</text>
  </g>

  <!-- WordPiece -->
  <g transform="translate(390, 100)">
    <rect x="0" y="0" width="320" height="340" rx="10" fill="#ffffff" stroke="#722f8a" stroke-width="2.5"/>
    <rect x="0" y="0" width="320" height="50" rx="10" fill="#722f8a"/>
    <text x="160" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">WordPiece</text>

    <text x="20" y="78" font-size="11" font-weight="700" fill="#722f8a">USED BY</text>
    <text x="20" y="100" font-size="12" fill="#1a1a2e">BERT, DistilBERT, ELECTRA, mBERT</text>

    <text x="20" y="130" font-size="11" font-weight="700" fill="#722f8a">VOCAB</text>
    <text x="20" y="152" font-size="14" font-weight="700" fill="#722f8a">~30k</text>

    <text x="20" y="184" font-size="11" font-weight="700" fill="#722f8a">KEY PROPERTY</text>
    <text x="20" y="206" font-size="12" fill="#1a1a2e">Continuation marker ##</text>
    <text x="20" y="224" font-size="11" font-style="italic" fill="#5a4a3a">"playing" -&gt; [play, ##ing]</text>

    <text x="20" y="256" font-size="11" font-weight="700" fill="#b3401b">TRADEOFF</text>
    <text x="20" y="278" font-size="11" fill="#1a1a2e">[UNK] possible for rare chars</text>

    <rect x="20" y="296" width="280" height="30" rx="5" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="160" y="316" font-size="11" font-style="italic" text-anchor="middle" fill="#7a5e1a">Pick to keep BERT vocabulary</text>
  </g>

  <!-- Unigram -->
  <g transform="translate(740, 100)">
    <rect x="0" y="0" width="320" height="340" rx="10" fill="#ffffff" stroke="#1f7a3a" stroke-width="2.5"/>
    <rect x="0" y="0" width="320" height="50" rx="10" fill="#1f7a3a"/>
    <text x="160" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Unigram LM</text>

    <text x="20" y="78" font-size="11" font-weight="700" fill="#1f7a3a">USED BY</text>
    <text x="20" y="100" font-size="12" fill="#1a1a2e">T5, mT5, ALBERT, XLNet, Gemma</text>

    <text x="20" y="130" font-size="11" font-weight="700" fill="#1f7a3a">VOCAB</text>
    <text x="20" y="152" font-size="14" font-weight="700" fill="#1f7a3a">32k - 256k</text>

    <text x="20" y="184" font-size="11" font-weight="700" fill="#1f7a3a">KEY PROPERTY</text>
    <text x="20" y="206" font-size="12" fill="#1a1a2e">Probabilistic; Viterbi decode</text>
    <text x="20" y="224" font-size="11" font-style="italic" fill="#5a4a3a">supports subword regularization</text>

    <text x="20" y="256" font-size="11" font-weight="700" fill="#b3401b">TRADEOFF</text>
    <text x="20" y="278" font-size="11" fill="#1a1a2e">more compute at inference</text>

    <rect x="20" y="296" width="280" height="30" rx="5" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="160" y="316" font-size="11" font-style="italic" text-anchor="middle" fill="#7a5e1a">Pick for multilingual models</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="1020" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="510" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Same family, different recipe</text>
    <text x="510" y="48" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">All build vocabularies of subwords. They differ in how vocabulary is built (frequency vs likelihood vs pruning) and how strings are split at inference.</text>
  </g>
</svg>
