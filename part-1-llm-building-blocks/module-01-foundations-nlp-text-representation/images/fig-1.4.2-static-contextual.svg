<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="700" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Static vs. Contextual Embeddings</text>
  <text x="700" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Same word, three sentences — does the model produce one vector or three?</text>

  <!-- LEFT panel: STATIC -->
  <g>
    <rect x="60" y="100" width="640" height="510" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="380" y="132" font-size="17" font-weight="700" text-anchor="middle" fill="#b3401b">Static (word2vec, GloVe)</text>
    <text x="380" y="156" font-size="13" text-anchor="middle" fill="#5a4a3a">one fixed vector per word, no matter the sentence</text>

    <!-- Three sentences -->
    <g font-size="13" fill="#1a1a2e">
      <rect x="100" y="180" width="560" height="40" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
      <text x="120" y="206">"I deposited money at the <tspan font-weight="700" fill="#b3401b">bank</tspan>"</text>

      <rect x="100" y="232" width="560" height="40" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
      <text x="120" y="258">"We picnicked on the river <tspan font-weight="700" fill="#b3401b">bank</tspan>"</text>

      <rect x="100" y="284" width="560" height="40" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
      <text x="120" y="310">"I <tspan font-weight="700" fill="#b3401b">bank</tspan> on her loyalty"</text>
    </g>

    <!-- Arrows converging -->
    <line x1="380" y1="324" x2="380" y2="380" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="200" y1="324" x2="370" y2="380" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="560" y1="324" x2="390" y2="380" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Single vector output -->
    <rect x="200" y="400" width="360" height="80" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="2.5"/>
    <text x="380" y="430" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">one shared vector</text>
    <text x="380" y="458" font-size="13" font-family="monospace" text-anchor="middle" fill="#1a1a2e">bank = [0.3, -0.1, 0.8, ...]</text>

    <text x="380" y="525" font-size="13" font-weight="600" text-anchor="middle" fill="#b3401b">Problem: cannot distinguish meanings</text>
    <text x="380" y="555" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">"river bank" and "money bank" get identical input</text>
    <text x="380" y="575" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">downstream model must guess from neighbors</text>
  </g>

  <!-- RIGHT panel: CONTEXTUAL -->
  <g>
    <rect x="720" y="100" width="640" height="510" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="1040" y="132" font-size="17" font-weight="700" text-anchor="middle" fill="#1f7a3a">Contextual (ELMo, BERT, GPT)</text>
    <text x="1040" y="156" font-size="13" text-anchor="middle" fill="#5a4a3a">vector depends on the surrounding sentence</text>

    <g font-size="13" fill="#1a1a2e">
      <rect x="760" y="180" width="560" height="40" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
      <text x="780" y="206">"I deposited money at the <tspan font-weight="700" fill="#1f7a3a">bank</tspan>"</text>

      <rect x="760" y="232" width="560" height="40" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
      <text x="780" y="258">"We picnicked on the river <tspan font-weight="700" fill="#1f7a3a">bank</tspan>"</text>

      <rect x="760" y="284" width="560" height="40" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
      <text x="780" y="310">"I <tspan font-weight="700" fill="#1f7a3a">bank</tspan> on her loyalty"</text>
    </g>

    <!-- Three vectors (one per sentence) -->
    <line x1="860" y1="324" x2="860" y2="370" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="740" y="380" width="240" height="56" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="860" y="402" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">"financial" sense</text>
    <text x="860" y="424" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">[0.8, 0.2, -0.5, ...]</text>

    <line x1="1040" y1="324" x2="1040" y2="455" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="920" y="465" width="240" height="56" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="1040" y="487" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">"riverbank" sense</text>
    <text x="1040" y="509" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">[-0.1, 0.7, 0.3, ...]</text>

    <line x1="1220" y1="324" x2="1220" y2="370" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="1100" y="380" width="240" height="56" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="1220" y="402" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">"rely on" sense</text>
    <text x="1220" y="424" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">[0.4, -0.3, 0.6, ...]</text>

    <text x="1040" y="555" font-size="13" font-weight="600" text-anchor="middle" fill="#1f7a3a">Win: meaning resolved at encode time</text>
    <text x="1040" y="580" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">downstream model gets the right sense up-front</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 630)">
    <rect x="0" y="0" width="1280" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Static embeddings = lookup table. Contextual embeddings = function over the entire sentence — the same word produces different vectors in different contexts. This single shift unlocked transformer-era performance on every NLP task.</text>
  </g>
</svg>
