<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">ELMo: two LSTMs read the sentence in opposite directions, then mix</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each token gets a context-aware vector built from a learned weighted sum of three layer outputs.</text>

  <!-- Input tokens -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="460" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="230" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Input tokens</text>
    <text x="230" y="46" font-size="13" text-anchor="middle" fill="#1a1a2e">"The river bank is ..."</text>
  </g>

  <!-- Character embedding (Layer 0) -->
  <g transform="translate(380, 200)">
    <rect x="0" y="0" width="540" height="60" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="270" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Character-level CNN  -  h0 (Layer 0)</text>
    <text x="270" y="46" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Builds a token vector from its characters; handles unseen words.</text>
  </g>

  <!-- Arrows to two LSTMs -->
  <line x1="500" y1="260" x2="320" y2="300" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="800" y1="260" x2="980" y2="300" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Forward LSTM stack -->
  <g transform="translate(120, 300)">
    <rect x="0" y="0" width="400" height="220" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="200" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Forward LSTM stack</text>
    <text x="200" y="46" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">predicts next token, left -&gt; right</text>

    <!-- Layer boxes inside -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="360" height="42" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="14" y="26" font-size="12" fill="#1a1a2e">LSTM layer 2 (forward)  -  h2_fwd</text>
    </g>
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="360" height="42" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="14" y="26" font-size="12" fill="#1a1a2e">LSTM layer 1 (forward)  -  h1_fwd</text>
    </g>
    <!-- Direction arrow -->
    <g transform="translate(20, 165)">
      <line x1="0" y1="20" x2="360" y2="20" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arr)"/>
      <text x="180" y="40" font-size="11" text-anchor="middle" fill="#1f7a3a">reads tokens left to right</text>
    </g>
  </g>

  <!-- Backward LSTM stack -->
  <g transform="translate(780, 300)">
    <rect x="0" y="0" width="400" height="220" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="200" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Backward LSTM stack</text>
    <text x="200" y="46" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">predicts previous token, right -&gt; left</text>

    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="360" height="42" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
      <text x="14" y="26" font-size="12" fill="#1a1a2e">LSTM layer 2 (backward)  -  h2_bwd</text>
    </g>
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="360" height="42" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
      <text x="14" y="26" font-size="12" fill="#1a1a2e">LSTM layer 1 (backward)  -  h1_bwd</text>
    </g>
    <g transform="translate(20, 165)">
      <line x1="360" y1="20" x2="0" y2="20" stroke="#722f8a" stroke-width="1.5" marker-end="url(#arr)"/>
      <text x="180" y="40" font-size="11" text-anchor="middle" fill="#722f8a">reads tokens right to left</text>
    </g>
  </g>

  <!-- Concatenation per layer + weighted sum -->
  <g transform="translate(370, 555)">
    <rect x="0" y="0" width="560" height="80" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="280" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">ELMo vector = a0 * h0 + a1 * [h1_fwd ; h1_bwd] + a2 * [h2_fwd ; h2_bwd]</text>
    <text x="280" y="46" font-size="12" text-anchor="middle" fill="#1a1a2e">Concatenate forward and backward at each layer; learn task-specific scalar weights a0, a1, a2.</text>
    <text x="280" y="64" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">A downstream task (NER, sentiment, QA) tunes its own a-weights to favour the most useful layer.</text>
  </g>

  <!-- Arrows from LSTMs to combine -->
  <line x1="320" y1="520" x2="500" y2="555" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="980" y1="520" x2="800" y2="555" stroke="#722f8a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="260" x2="650" y2="555" stroke="#7a5e1a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="660" y="410" font-size="11" fill="#7a5e1a">h0 passes through</text>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 645)">
    <rect x="0" y="0" width="1140" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="40" font-size="12" fill="#1a1a2e">ELMo gave each token a different vector in different sentences -- the first practical contextual word embedding, but still bolted together rather than jointly attended like a transformer.</text>
  </g>
</svg>
