<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="700" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Four Eras of NLP</text>
  <text x="700" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Each transition was unlocked by a specific algorithmic breakthrough — color shifts to green at the modern frontier</text>

  <line x1="100" y1="280" x2="1300" y2="280" stroke="#1a1a2e" stroke-width="2"/>

  <!-- Era 1: Rule-Based -->
  <g>
    <rect x="100" y="180" width="240" height="180" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="220" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Rule-Based</text>
    <text x="220" y="232" font-size="12" text-anchor="middle" fill="#5a4a3a">1950s — 1980s</text>
    <line x1="120" y1="246" x2="320" y2="246" stroke="#722f8a" stroke-width="0.6"/>
    <text x="220" y="270" font-size="12" text-anchor="middle" fill="#1a1a2e">hand-written grammar</text>
    <text x="220" y="288" font-size="12" text-anchor="middle" fill="#1a1a2e">pattern matching</text>
    <text x="220" y="320" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">ELIZA, SHRDLU, Cyc</text>
  </g>

  <!-- transition 1 -->
  <line x1="340" y1="270" x2="430" y2="270" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="345" y="245" width="80" height="22" rx="11" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
  <text x="385" y="260" font-size="11" text-anchor="middle" fill="#1f7a3a">+ corpora</text>

  <!-- Era 2: Statistical -->
  <g>
    <rect x="430" y="180" width="240" height="180" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="550" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Statistical</text>
    <text x="550" y="232" font-size="12" text-anchor="middle" fill="#5a4a3a">1990s — 2012</text>
    <line x1="450" y1="246" x2="650" y2="246" stroke="#722f8a" stroke-width="0.6"/>
    <text x="550" y="270" font-size="12" text-anchor="middle" fill="#1a1a2e">n-grams, HMM, SVM</text>
    <text x="550" y="288" font-size="12" text-anchor="middle" fill="#1a1a2e">TF-IDF, LDA</text>
    <text x="550" y="320" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Brown corpus, Penn Treebank</text>
  </g>

  <!-- transition 2 -->
  <line x1="670" y1="270" x2="760" y2="270" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="675" y="245" width="80" height="22" rx="11" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
  <text x="715" y="260" font-size="11" text-anchor="middle" fill="#1f7a3a">+ GPUs</text>

  <!-- Era 3: Neural -->
  <g>
    <rect x="760" y="180" width="240" height="180" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="880" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Neural / Embeddings</text>
    <text x="880" y="232" font-size="12" text-anchor="middle" fill="#5a4a3a">2013 — 2017</text>
    <line x1="780" y1="246" x2="980" y2="246" stroke="#1a4078" stroke-width="0.6"/>
    <text x="880" y="270" font-size="12" text-anchor="middle" fill="#1a1a2e">word2vec, GloVe</text>
    <text x="880" y="288" font-size="12" text-anchor="middle" fill="#1a1a2e">RNN / LSTM seq2seq</text>
    <text x="880" y="320" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">end-to-end learning</text>
  </g>

  <!-- transition 3 -->
  <line x1="1000" y1="270" x2="1090" y2="270" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="1005" y="245" width="80" height="22" rx="11" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
  <text x="1045" y="260" font-size="11" text-anchor="middle" fill="#1f7a3a">+ attention</text>

  <!-- Era 4: LLM -->
  <g>
    <rect x="1090" y="180" width="240" height="180" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="1210" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">LLM Era</text>
    <text x="1210" y="232" font-size="12" text-anchor="middle" fill="#5a4a3a">2017 — present</text>
    <line x1="1110" y1="246" x2="1310" y2="246" stroke="#1f7a3a" stroke-width="0.6"/>
    <text x="1210" y="270" font-size="12" text-anchor="middle" fill="#1a1a2e">Transformer, GPT, BERT</text>
    <text x="1210" y="288" font-size="12" text-anchor="middle" fill="#1a1a2e">foundation models</text>
    <text x="1210" y="320" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">scale → emergence</text>
  </g>

  <!-- timeline ticks -->
  <g font-size="11" fill="#5a4a3a">
    <text x="220" y="408" text-anchor="middle">1960</text>
    <text x="550" y="408" text-anchor="middle">1995</text>
    <text x="880" y="408" text-anchor="middle">2013</text>
    <text x="1210" y="408" text-anchor="middle">2017+</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 470)">
    <rect x="0" y="0" width="1280" height="100" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7a5e1a">Common thread</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Each era replaced the previous one's bottleneck. Rule-based hit human bandwidth → statistics scaled with text. Statistics plateaued → neural nets learned representations from raw text. Neural nets needed parallelism → attention let everything be computed at once. Today's LLMs combine all four lessons.</text>
    <text x="20" y="78" font-size="12" font-style="italic" fill="#5a4a3a">The next breakthrough is unlikely to discard transformers — it will fix their next bottleneck (memory, reasoning, or compute).</text>
  </g>
</svg>
