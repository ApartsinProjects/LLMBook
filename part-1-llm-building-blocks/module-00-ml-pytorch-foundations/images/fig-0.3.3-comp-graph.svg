<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">PyTorch Computational Graph</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Autograd builds a DAG as you run forward; .backward() walks it in reverse to compute gradients</text>

  <!-- Leaf tensors (left column) -->
  <g>
    <text x="160" y="120" font-size="13" font-weight="600" text-anchor="middle" fill="#1a4078">leaf tensors</text>
    <rect x="100" y="140" width="120" height="55" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="160" y="165" font-size="15" font-weight="600" text-anchor="middle" fill="#1a4078">x</text>
    <text x="160" y="183" font-size="11" text-anchor="middle" fill="#5a4a3a">requires_grad</text>

    <rect x="100" y="240" width="120" height="55" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="160" y="265" font-size="15" font-weight="600" text-anchor="middle" fill="#1a4078">w</text>
    <text x="160" y="283" font-size="11" text-anchor="middle" fill="#5a4a3a">requires_grad</text>

    <rect x="100" y="340" width="120" height="55" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="160" y="365" font-size="15" font-weight="600" text-anchor="middle" fill="#1a4078">b</text>
    <text x="160" y="383" font-size="11" text-anchor="middle" fill="#5a4a3a">requires_grad</text>

    <rect x="100" y="440" width="120" height="55" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="160" y="465" font-size="15" font-weight="600" text-anchor="middle" fill="#5a4a3a">target</text>
    <text x="160" y="483" font-size="11" text-anchor="middle" fill="#5a4a3a">constant</text>
  </g>

  <!-- Op nodes (middle) -->
  <g>
    <text x="490" y="120" font-size="13" font-weight="600" text-anchor="middle" fill="#7a5e1a">grad-fn nodes</text>

    <rect x="420" y="160" width="160" height="60" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="500" y="185" font-size="14" font-weight="600" text-anchor="middle" fill="#7a5e1a">MulBackward</text>
    <text x="500" y="206" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">z = w · x</text>

    <rect x="420" y="290" width="160" height="60" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="500" y="315" font-size="14" font-weight="600" text-anchor="middle" fill="#7a5e1a">AddBackward</text>
    <text x="500" y="336" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">y = z + b</text>
  </g>

  <!-- Loss node (right) -->
  <g>
    <text x="800" y="120" font-size="13" font-weight="600" text-anchor="middle" fill="#b3401b">terminal</text>
    <rect x="720" y="220" width="170" height="70" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="805" y="248" font-size="15" font-weight="600" text-anchor="middle" fill="#b3401b">MSELoss</text>
    <text x="805" y="270" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">L = (y − target)²</text>
  </g>

  <!-- Forward edges (solid black) -->
  <g stroke="#1a1a2e" stroke-width="1.5" fill="none">
    <line x1="220" y1="167" x2="415" y2="180" marker-end="url(#arr)"/>
    <line x1="220" y1="267" x2="415" y2="200" marker-end="url(#arr)"/>
    <line x1="500" y1="220" x2="500" y2="285" marker-end="url(#arr)"/>
    <line x1="220" y1="367" x2="415" y2="320" marker-end="url(#arr)"/>
    <line x1="580" y1="320" x2="715" y2="260" marker-end="url(#arr)"/>
    <line x1="220" y1="467" x2="715" y2="270" marker-end="url(#arr)"/>
  </g>
  <text x="320" y="155" font-size="11" font-style="italic" fill="#5a4a3a">forward</text>

  <!-- Backward edges (dashed red) -->
  <g stroke="#b3401b" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <path d="M 805 220 C 700 130 580 130 500 160" marker-end="url(#arr-r)"/>
    <path d="M 500 290 C 460 270 460 240 500 220" marker-end="url(#arr-r)"/>
  </g>
  <text x="700" y="135" font-size="12" font-style="italic" font-weight="600" fill="#b3401b">.backward()</text>

  <!-- Right-side callout -->
  <g transform="translate(950, 130)">
    <rect x="0" y="0" width="320" height="380" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="160" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">How autograd works</text>
    <line x1="20" y1="44" x2="300" y2="44" stroke="#d4b96a" stroke-width="0.8"/>

    <text x="20" y="68" font-size="13" font-weight="600" fill="#1a4078">1 · forward builds graph</text>
    <text x="20" y="88" font-size="11" fill="#1a1a2e">Every op on a requires_grad</text>
    <text x="20" y="104" font-size="11" fill="#1a1a2e">tensor records its grad-fn.</text>

    <text x="20" y="138" font-size="13" font-weight="600" fill="#7a5e1a">2 · backward walks reverse</text>
    <text x="20" y="158" font-size="11" fill="#1a1a2e">.backward() traverses the DAG</text>
    <text x="20" y="174" font-size="11" fill="#1a1a2e">topologically from loss to leaves.</text>

    <text x="20" y="208" font-size="13" font-weight="600" fill="#b3401b">3 · gradients accumulate</text>
    <text x="20" y="228" font-size="11" fill="#1a1a2e">Each leaf tensor's .grad gets</text>
    <text x="20" y="244" font-size="11" fill="#1a1a2e">∂L/∂leaf added (not replaced).</text>
    <text x="20" y="262" font-size="11" font-style="italic" fill="#b3401b">→ remember zero_grad()!</text>

    <line x1="20" y1="285" x2="300" y2="285" stroke="#d4b96a" stroke-width="0.6" stroke-dasharray="3 2"/>

    <text x="20" y="310" font-size="13" font-weight="600" fill="#1f7a3a">Why "dynamic"</text>
    <text x="20" y="330" font-size="11" fill="#1a1a2e">Graph is rebuilt every forward,</text>
    <text x="20" y="346" font-size="11" fill="#1a1a2e">so control flow (if / loops) just</text>
    <text x="20" y="362" font-size="11" fill="#1a1a2e">works — no static compilation.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Forward = build the DAG. Backward = walk it backwards multiplying local Jacobians. Leaf tensors collect gradients; ops live as grad-fn nodes that know how to differentiate themselves.</text>
  </g>
</svg>
