<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
  </defs>
  <text x="650" y="44" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Gradient Descent: Following the Slope Downhill</text>
  <text x="650" y="70" font-size="13" text-anchor="middle" fill="#5a4a3a">θ_{t+1} = θ_t − η · ∇L(θ_t) — each step opposes the local gradient, scaled by learning rate η</text>

  <!-- Plot area: loss curve L(θ) -->
  <g>
    <!-- axes -->
    <line x1="100" y1="600" x2="900" y2="600" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="100" y1="120" x2="100" y2="600" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="500" y="640" font-size="13" text-anchor="middle" fill="#5a4a3a">parameter θ</text>
    <text x="60" y="370" font-size="13" text-anchor="middle" fill="#5a4a3a" transform="rotate(-90 60 370)">loss L(θ)</text>

    <!-- Loss curve: a smooth function with local + global min -->
    <path d="M 100 200 Q 200 460 320 480 Q 380 490 430 430 Q 470 380 520 410 Q 600 460 700 560 Q 780 590 830 580 Q 870 570 900 530"
          fill="none" stroke="#1a4078" stroke-width="3"/>

    <!-- Light shaded region under curve for emphasis -->
    <path d="M 100 200 Q 200 460 320 480 Q 380 490 430 430 Q 470 380 520 410 Q 600 460 700 560 Q 780 590 830 580 Q 870 570 900 530 L 900 600 L 100 600 Z"
          fill="#eef4fa" opacity="0.4"/>

    <!-- Step trajectory (downhill) -->
    <!-- Start: high loss, shallow slope -->
    <circle cx="135" cy="240" r="9" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="135" y="225" font-size="12" font-weight="600" text-anchor="middle" fill="#b3401b">start</text>

    <!-- Step 1 -->
    <circle cx="195" cy="380" r="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="195" y="365" font-size="11" text-anchor="middle" fill="#7a5e1a">θ₁</text>
    <line x1="142" y1="246" x2="190" y2="375" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr)"/>

    <!-- Step 2 -->
    <circle cx="260" cy="455" r="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="260" y="440" font-size="11" text-anchor="middle" fill="#7a5e1a">θ₂</text>
    <line x1="201" y1="385" x2="255" y2="450" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr)"/>

    <!-- Step 3 (near local min) -->
    <circle cx="320" cy="478" r="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="320" y="463" font-size="11" text-anchor="middle" fill="#7a5e1a">θ₃</text>
    <line x1="266" y1="459" x2="315" y2="475" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr)"/>

    <!-- Local min marker -->
    <circle cx="350" cy="482" r="11" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2.5"/>
    <text x="350" y="513" font-size="12" font-weight="600" text-anchor="middle" fill="#7a5e1a">local min</text>
    <text x="350" y="528" font-size="11" text-anchor="middle" fill="#5a4a3a">(η too small? stuck)</text>

    <!-- Escape arrow (with momentum / restart / bigger η) -->
    <path d="M 355 478 C 480 360 580 410 700 555" fill="none" stroke="#b3401b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-red)"/>
    <text x="540" y="395" font-size="12" font-style="italic" fill="#b3401b">momentum / restart →</text>

    <!-- Global min marker -->
    <circle cx="710" cy="565" r="13" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="3"/>
    <text x="710" y="595" font-size="13" font-weight="600" text-anchor="middle" fill="#1f7a3a">global min</text>
    <text x="710" y="610" font-size="11" text-anchor="middle" fill="#5a4a3a">target</text>
  </g>

  <!-- Right callout: learning rate behavior -->
  <g transform="translate(960, 130)">
    <rect x="0" y="0" width="310" height="270" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="155" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Learning rate η matters</text>
    <line x1="20" y1="44" x2="290" y2="44" stroke="#d4b96a" stroke-width="0.8"/>

    <!-- Mini-figure: too small -->
    <text x="20" y="68" font-size="12" font-weight="600" fill="#1a1a2e">η too small</text>
    <path d="M 20 95 Q 80 75 140 105" fill="none" stroke="#1a4078" stroke-width="1.5"/>
    <circle cx="30" cy="89" r="2.5" fill="#7a5e1a"/>
    <circle cx="50" cy="84" r="2.5" fill="#7a5e1a"/>
    <circle cx="70" cy="80" r="2.5" fill="#7a5e1a"/>
    <circle cx="90" cy="79" r="2.5" fill="#7a5e1a"/>
    <text x="160" y="90" font-size="11" fill="#5a4a3a">slow,</text>
    <text x="160" y="105" font-size="11" fill="#5a4a3a">may stall</text>

    <!-- Mini-figure: just right -->
    <text x="20" y="135" font-size="12" font-weight="600" fill="#1a1a2e">η well-tuned</text>
    <path d="M 20 162 Q 80 135 140 165" fill="none" stroke="#1a4078" stroke-width="1.5"/>
    <circle cx="30" cy="156" r="2.5" fill="#1f7a3a"/>
    <circle cx="60" cy="142" r="2.5" fill="#1f7a3a"/>
    <circle cx="100" cy="153" r="2.5" fill="#1f7a3a"/>
    <circle cx="125" cy="161" r="2.5" fill="#1f7a3a"/>
    <text x="160" y="155" font-size="11" fill="#5a4a3a">converges</text>
    <text x="160" y="170" font-size="11" fill="#5a4a3a">smoothly</text>

    <!-- Mini-figure: too big -->
    <text x="20" y="200" font-size="12" font-weight="600" fill="#1a1a2e">η too big</text>
    <path d="M 20 230 Q 80 200 140 230" fill="none" stroke="#1a4078" stroke-width="1.5"/>
    <polyline points="30,212 55,250 80,180 110,255 135,205" fill="none" stroke="#b3401b" stroke-width="1.5"/>
    <text x="160" y="225" font-size="11" fill="#5a4a3a">overshoots,</text>
    <text x="160" y="240" font-size="11" fill="#5a4a3a">diverges</text>
  </g>

  <!-- Bottom takeaway strip -->
  <g transform="translate(80, 670)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Each iteration moves θ a small step against the gradient. Step size (η) controls speed vs. stability; momentum / Adam help escape shallow local minima toward the global solution.</text>
  </g>
</svg>
