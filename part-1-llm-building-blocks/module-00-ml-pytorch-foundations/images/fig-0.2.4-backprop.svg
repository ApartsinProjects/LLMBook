<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Backpropagation: Forward Compute, Backward Gradient</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">∂L/∂w via chain rule — multiply local derivatives backwards through the same graph</text>

  <!-- Forward lane -->
  <g>
    <rect x="60" y="110" width="1180" height="200" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="100" y="138" font-size="15" font-weight="700" fill="#1f7a3a">Forward Pass</text>
    <text x="100" y="158" font-size="12" font-style="italic" fill="#1f7a3a">compute output left → right</text>

    <!-- Inputs -->
    <rect x="160" y="200" width="110" height="60" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <text x="215" y="225" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">x</text>
    <text x="215" y="246" font-size="13" text-anchor="middle" fill="#1a1a2e">= 2</text>

    <rect x="160" y="280" width="110" height="0" />
    <rect x="290" y="200" width="110" height="60" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <text x="345" y="225" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">w</text>
    <text x="345" y="246" font-size="13" text-anchor="middle" fill="#1a1a2e">= 0.5</text>

    <line x1="270" y1="230" x2="430" y2="230" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="400" y1="230" x2="430" y2="230" stroke="#1f7a3a" stroke-width="2"/>

    <!-- z -->
    <rect x="430" y="200" width="160" height="60" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <text x="510" y="225" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">z = w·x + b</text>
    <text x="510" y="246" font-size="13" text-anchor="middle" fill="#1a1a2e">= 1.5</text>

    <line x1="590" y1="230" x2="700" y2="230" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>

    <!-- a -->
    <rect x="700" y="200" width="160" height="60" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <text x="780" y="225" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">a = ReLU(z)</text>
    <text x="780" y="246" font-size="13" text-anchor="middle" fill="#1a1a2e">= 1.5</text>

    <line x1="860" y1="230" x2="970" y2="230" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>

    <!-- L -->
    <rect x="970" y="200" width="180" height="60" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <text x="1060" y="225" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">L = (a − y)²</text>
    <text x="1060" y="246" font-size="13" text-anchor="middle" fill="#1a1a2e">= 0.25</text>
  </g>

  <!-- Backward lane -->
  <g>
    <rect x="60" y="350" width="1180" height="200" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="100" y="378" font-size="15" font-weight="700" fill="#b3401b">Backward Pass</text>
    <text x="100" y="398" font-size="12" font-style="italic" fill="#b3401b">propagate gradients right ← left, multiply by local derivative</text>

    <rect x="970" y="440" width="180" height="60" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="2"/>
    <text x="1060" y="465" font-size="14" font-weight="600" text-anchor="middle" fill="#b3401b">∂L/∂a = 2(a−y)</text>
    <text x="1060" y="486" font-size="13" text-anchor="middle" fill="#1a1a2e">= 1.0</text>

    <line x1="965" y1="470" x2="865" y2="470" stroke="#b3401b" stroke-width="2" marker-end="url(#arr-r)"/>

    <rect x="700" y="440" width="160" height="60" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="2"/>
    <text x="780" y="465" font-size="14" font-weight="600" text-anchor="middle" fill="#b3401b">∂a/∂z = 1</text>
    <text x="780" y="486" font-size="13" text-anchor="middle" fill="#1a1a2e">(z &gt; 0)</text>

    <line x1="695" y1="470" x2="595" y2="470" stroke="#b3401b" stroke-width="2" marker-end="url(#arr-r)"/>

    <rect x="430" y="440" width="160" height="60" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="2"/>
    <text x="510" y="465" font-size="14" font-weight="600" text-anchor="middle" fill="#b3401b">∂z/∂w = x</text>
    <text x="510" y="486" font-size="13" text-anchor="middle" fill="#1a1a2e">= 2</text>

    <line x1="425" y1="470" x2="345" y2="470" stroke="#b3401b" stroke-width="2" marker-end="url(#arr-r)"/>

    <rect x="160" y="440" width="180" height="60" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="2"/>
    <text x="250" y="465" font-size="14" font-weight="600" text-anchor="middle" fill="#b3401b">∂L/∂w = product</text>
    <text x="250" y="486" font-size="13" text-anchor="middle" fill="#1a1a2e">= 1.0 · 1 · 2 = 2.0</text>
  </g>

  <!-- Connector L (forward) → ∂L/∂a (backward) -->
  <path d="M 1060 260 C 1060 320 1060 380 1060 440" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="1090" y="350" font-size="11" font-style="italic" fill="#5a4a3a">.backward()</text>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 590)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Each backward node multiplies the upstream gradient by its local derivative. Chain rule turns end-to-end gradients into a sequence of cheap local computations — autograd just bookkeeps the graph.</text>
  </g>
</svg>
