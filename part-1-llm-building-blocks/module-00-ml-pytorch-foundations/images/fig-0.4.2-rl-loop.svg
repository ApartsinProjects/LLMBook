<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arr-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a4078"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The Reinforcement Learning Loop</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Agent acts on environment, environment returns reward + new state, agent updates policy</text>

  <!-- Agent (left) -->
  <g>
    <rect x="180" y="220" width="280" height="220" rx="14" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="320" y="260" font-size="20" font-weight="700" text-anchor="middle" fill="#1a4078">Agent</text>
    <line x1="220" y1="278" x2="420" y2="278" stroke="#1a4078" stroke-width="0.8"/>
    <text x="320" y="304" font-size="13" text-anchor="middle" fill="#1a1a2e">policy π(a | s)</text>
    <text x="320" y="328" font-size="13" text-anchor="middle" fill="#1a1a2e">value V(s)</text>

    <text x="320" y="370" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">examples:</text>
    <text x="320" y="392" font-size="12" font-weight="600" text-anchor="middle" fill="#1a4078">dog · LLM · robot · game-AI</text>
    <text x="320" y="416" font-size="11" text-anchor="middle" fill="#5a4a3a">decides what to do next</text>
  </g>

  <!-- Environment (right) -->
  <g>
    <rect x="840" y="220" width="280" height="220" rx="14" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="980" y="260" font-size="20" font-weight="700" text-anchor="middle" fill="#1f7a3a">Environment</text>
    <line x1="880" y1="278" x2="1080" y2="278" stroke="#1f7a3a" stroke-width="0.8"/>
    <text x="980" y="304" font-size="13" text-anchor="middle" fill="#1a1a2e">transition P(s' | s, a)</text>
    <text x="980" y="328" font-size="13" text-anchor="middle" fill="#1a1a2e">reward R(s, a)</text>

    <text x="980" y="370" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">examples:</text>
    <text x="980" y="392" font-size="12" font-weight="600" text-anchor="middle" fill="#1f7a3a">trainer · reward model · game · world</text>
    <text x="980" y="416" font-size="11" text-anchor="middle" fill="#5a4a3a">scores actions, evolves state</text>
  </g>

  <!-- Three arrows in the middle -->
  <!-- Action: agent → env (top) -->
  <g>
    <path d="M 460 270 C 600 200 740 200 840 270" fill="none" stroke="#1a4078" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <rect x="540" y="180" width="220" height="36" rx="18" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="650" y="195" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Action a</text>
    <text x="650" y="210" font-size="11" text-anchor="middle" fill="#1a1a2e">"sit" / next token / move pawn</text>
  </g>

  <!-- Reward: env → agent (middle) -->
  <g>
    <line x1="840" y1="335" x2="465" y2="335" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arr-grn)"/>
    <rect x="540" y="318" width="220" height="36" rx="18" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="650" y="333" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Reward r</text>
    <text x="650" y="348" font-size="11" text-anchor="middle" fill="#1a1a2e">treat / score / win-prob delta</text>
  </g>

  <!-- New state: env → agent (bottom) -->
  <g>
    <path d="M 840 400 C 740 470 600 470 460 400" fill="none" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arr-grn)"/>
    <rect x="540" y="465" width="220" height="36" rx="18" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="650" y="480" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">New state s'</text>
    <text x="650" y="495" font-size="11" text-anchor="middle" fill="#1a1a2e">updated context / position</text>
  </g>

  <!-- Step counter -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="120" height="40" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="60" y="25" font-size="13" font-weight="600" text-anchor="middle" fill="#7a5e1a">step t</text>
  </g>
  <g transform="translate(1100, 130)">
    <rect x="0" y="0" width="120" height="40" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="60" y="25" font-size="13" font-weight="600" text-anchor="middle" fill="#7a5e1a">step t+1</text>
  </g>
  <line x1="200" y1="150" x2="1100" y2="150" stroke="#d4b96a" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">RL learns from interaction, not labels. The agent's job is to maximize cumulative reward over time. RLHF wraps this loop around an LLM with a learned reward model standing in for human preference.</text>
  </g>
</svg>
