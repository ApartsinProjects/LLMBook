<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arr-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>
  <text x="650" y="36" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The PyTorch Training Loop</text>
  <text x="650" y="60" font-size="13" text-anchor="middle" fill="#5a4a3a">Five steps per mini-batch, repeated until the model converges or you run out of patience</text>

  <!-- 5 step circle layout -->
  <g>
    <!-- Step 0: zero grad (top) -->
    <g transform="translate(620, 140)">
      <circle cx="0" cy="0" r="62" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
      <text x="0" y="-12" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">0</text>
      <text x="0" y="10" font-size="13" font-weight="600" text-anchor="middle" fill="#722f8a">Zero grads</text>
      <text x="0" y="32" font-size="10" font-family="monospace" text-anchor="middle" fill="#5a4a3a">zero_grad()</text>
    </g>

    <!-- Step 1: forward (top right) -->
    <g transform="translate(960, 270)">
      <circle cx="0" cy="0" r="62" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
      <text x="0" y="-12" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">1</text>
      <text x="0" y="10" font-size="13" font-weight="600" text-anchor="middle" fill="#1a4078">Forward</text>
      <text x="0" y="32" font-size="10" font-family="monospace" text-anchor="middle" fill="#5a4a3a">model(x)</text>
    </g>

    <!-- Step 2: loss (bottom right) -->
    <g transform="translate(870, 520)">
      <circle cx="0" cy="0" r="62" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
      <text x="0" y="-12" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">2</text>
      <text x="0" y="10" font-size="13" font-weight="600" text-anchor="middle" fill="#b3401b">Loss</text>
      <text x="0" y="32" font-size="10" font-family="monospace" text-anchor="middle" fill="#5a4a3a">criterion(y_hat, y)</text>
    </g>

    <!-- Step 3: backward (bottom left) -->
    <g transform="translate(370, 520)">
      <circle cx="0" cy="0" r="62" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2.5"/>
      <text x="0" y="-12" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">3</text>
      <text x="0" y="10" font-size="13" font-weight="600" text-anchor="middle" fill="#7a5e1a">Backward</text>
      <text x="0" y="32" font-size="10" font-family="monospace" text-anchor="middle" fill="#5a4a3a">loss.backward()</text>
    </g>

    <!-- Step 4: optimizer step (top left) -->
    <g transform="translate(280, 270)">
      <circle cx="0" cy="0" r="62" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
      <text x="0" y="-12" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">4</text>
      <text x="0" y="10" font-size="13" font-weight="600" text-anchor="middle" fill="#1f7a3a">Step</text>
      <text x="0" y="32" font-size="10" font-family="monospace" text-anchor="middle" fill="#5a4a3a">optimizer.step()</text>
    </g>
  </g>

  <!-- Arrows around the cycle -->
  <g stroke="#1a1a2e" stroke-width="2" fill="none">
    <path d="M 680 160 C 800 160 900 200 940 220" marker-end="url(#arr)"/>
    <path d="M 970 330 C 970 390 920 460 880 470" marker-end="url(#arr)"/>
    <path d="M 810 520 L 430 520" marker-end="url(#arr)"/>
    <path d="M 360 470 C 320 460 280 390 280 330" marker-end="url(#arr)"/>
  </g>

  <!-- Loop arrow (4 → 0) dashed purple -->
  <path d="M 310 220 C 380 165 480 145 560 145" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arr-pur)"/>
  <text x="350" y="195" font-size="12" font-style="italic" fill="#722f8a">repeat for next mini-batch</text>

  <!-- Edge labels -->
  <text x="820" y="200" font-size="11" font-style="italic" fill="#5a4a3a">predictions</text>
  <text x="990" y="410" font-size="11" font-style="italic" fill="#5a4a3a">scalar loss</text>
  <text x="620" y="505" font-size="11" font-style="italic" fill="#5a4a3a">gradients populated</text>
  <text x="240" y="410" font-size="11" font-style="italic" fill="#5a4a3a">params updated</text>

  <!-- Center hub -->
  <g transform="translate(620, 340)">
    <rect x="-160" y="-50" width="320" height="100" rx="10" fill="#fafbfc" stroke="#cfd8e3" stroke-width="1.5"/>
    <text x="0" y="-22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">one mini-batch iteration</text>
    <text x="0" y="0" font-size="11" text-anchor="middle" fill="#5a4a3a">epoch = N iterations over training set</text>
    <text x="0" y="20" font-size="11" text-anchor="middle" fill="#5a4a3a">~2 GPU-hours per epoch on a typical LLM</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 660)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Forgetting any one of these five lines is the most common bug in PyTorch. Especially zero_grad() — without it, gradients accumulate across batches and training silently misbehaves.</text>
  </g>
</svg>
