<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="44" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Bias–Variance Tradeoff</text>
  <text x="650" y="70" font-size="13" text-anchor="middle" fill="#5a4a3a">Total error = bias² + variance + irreducible noise — sweet spot minimizes the sum</text>

  <!-- Plot area -->
  <g>
    <line x1="120" y1="600" x2="900" y2="600" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="120" y1="120" x2="120" y2="600" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="510" y="650" font-size="13" text-anchor="middle" fill="#5a4a3a">model complexity →</text>
    <text x="70" y="360" font-size="13" text-anchor="middle" fill="#5a4a3a" transform="rotate(-90 70 360)">error</text>

    <!-- X-axis labels -->
    <text x="180" y="620" font-size="11" text-anchor="middle" fill="#5a4a3a">simple</text>
    <text x="510" y="620" font-size="11" text-anchor="middle" fill="#5a4a3a">balanced</text>
    <text x="840" y="620" font-size="11" text-anchor="middle" fill="#5a4a3a">very complex</text>

    <!-- Bias² curve: high → low (decreasing) -->
    <path d="M 140 200 Q 280 250 430 380 Q 580 470 750 540 Q 830 565 880 575"
          fill="none" stroke="#722f8a" stroke-width="3"/>
    <text x="200" y="195" font-size="13" font-weight="600" fill="#722f8a">bias²</text>

    <!-- Variance curve: low → high (increasing) -->
    <path d="M 140 575 Q 280 565 430 500 Q 580 410 750 280 Q 830 220 880 195"
          fill="none" stroke="#7a5e1a" stroke-width="3"/>
    <text x="850" y="190" font-size="13" font-weight="600" fill="#7a5e1a">variance</text>

    <!-- Total error: TRUE U-shape (descends from high-bias side, bottoms at sweet spot, rises on high-variance side) -->
    <path d="M 140 215 Q 250 320 360 405 Q 440 460 495 462 Q 560 460 640 405 Q 760 310 880 210"
          fill="none" stroke="#1a4078" stroke-width="3.5"/>
    <text x="280" y="285" font-size="13" font-weight="600" fill="#1a4078">total error</text>

    <!-- Sweet-spot marker — at the bottom of the U -->
    <line x1="495" y1="120" x2="495" y2="600" stroke="#1f7a3a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="495" cy="462" r="9" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="495" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">sweet spot</text>
    <text x="495" y="640" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">min total error</text>

    <!-- Region labels along x-axis -->
    <rect x="140" y="125" width="180" height="22" rx="11" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
    <text x="230" y="140" font-size="11" font-weight="600" text-anchor="middle" fill="#b3401b">underfitting (high bias)</text>

    <rect x="700" y="125" width="180" height="22" rx="11" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
    <text x="790" y="140" font-size="11" font-weight="600" text-anchor="middle" fill="#b3401b">overfitting (high variance)</text>
  </g>

  <!-- Right callout -->
  <g transform="translate(960, 130)">
    <rect x="0" y="0" width="310" height="470" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="155" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Diagnose &amp; treat</text>
    <line x1="20" y1="44" x2="290" y2="44" stroke="#d4b96a" stroke-width="0.8"/>

    <text x="20" y="68" font-size="13" font-weight="600" fill="#722f8a">If bias is high</text>
    <text x="20" y="88" font-size="11" fill="#1a1a2e">• train and test loss both bad</text>
    <text x="20" y="105" font-size="11" fill="#1a1a2e">• model is too simple</text>
    <text x="20" y="125" font-size="12" font-weight="600" fill="#1a1a2e">→ add capacity, more features,</text>
    <text x="20" y="142" font-size="12" font-weight="600" fill="#1a1a2e">   train longer</text>

    <line x1="20" y1="165" x2="290" y2="165" stroke="#d4b96a" stroke-width="0.6" stroke-dasharray="3 2"/>

    <text x="20" y="190" font-size="13" font-weight="600" fill="#7a5e1a">If variance is high</text>
    <text x="20" y="210" font-size="11" fill="#1a1a2e">• train loss low, test loss high</text>
    <text x="20" y="227" font-size="11" fill="#1a1a2e">• memorizes noise</text>
    <text x="20" y="247" font-size="12" font-weight="600" fill="#1a1a2e">→ regularize, dropout, more</text>
    <text x="20" y="264" font-size="12" font-weight="600" fill="#1a1a2e">   data, early stopping</text>

    <line x1="20" y1="287" x2="290" y2="287" stroke="#d4b96a" stroke-width="0.6" stroke-dasharray="3 2"/>

    <text x="20" y="312" font-size="13" font-weight="600" fill="#1f7a3a">Sweet-spot signs</text>
    <text x="20" y="332" font-size="11" fill="#1a1a2e">• small train–test gap</text>
    <text x="20" y="349" font-size="11" fill="#1a1a2e">• test loss flattens, not yet rising</text>
    <text x="20" y="366" font-size="11" fill="#1a1a2e">• validation curve U-bottom</text>

    <line x1="20" y1="389" x2="290" y2="389" stroke="#d4b96a" stroke-width="0.6" stroke-dasharray="3 2"/>

    <text x="155" y="414" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">For LLMs</text>
    <text x="20" y="434" font-size="11" fill="#1a1a2e">Modern over-parametrized models</text>
    <text x="20" y="450" font-size="11" fill="#1a1a2e">defy classic U-curve (double descent)</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 670)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Increasing model complexity reduces bias but inflates variance. Total error is a U-shape; the goal is the bottom of the U, not the leftmost or rightmost point.</text>
  </g>
</svg>
