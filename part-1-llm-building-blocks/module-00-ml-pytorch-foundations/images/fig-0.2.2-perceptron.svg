<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="44" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The Perceptron: Building Block of Neural Networks</text>
  <text x="650" y="70" font-size="13" text-anchor="middle" fill="#5a4a3a">y = f(Σ wᵢ xᵢ + b) — weighted sum of inputs, plus bias, run through an activation function</text>

  <!-- Inputs (3 nodes on the left) -->
  <g>
    <rect x="80" y="180" width="120" height="50" rx="25" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="140" y="212" font-size="16" font-weight="600" text-anchor="middle" fill="#1a4078">x₁</text>

    <rect x="80" y="290" width="120" height="50" rx="25" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="140" y="322" font-size="16" font-weight="600" text-anchor="middle" fill="#1a4078">x₂</text>

    <rect x="80" y="400" width="120" height="50" rx="25" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="140" y="432" font-size="16" font-weight="600" text-anchor="middle" fill="#1a4078">x₃</text>

    <text x="140" y="155" font-size="13" font-weight="600" text-anchor="middle" fill="#1a4078">inputs</text>
  </g>

  <!-- Bias -->
  <g>
    <rect x="80" y="510" width="120" height="50" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="140" y="542" font-size="15" font-weight="600" text-anchor="middle" fill="#7a5e1a">bias b</text>
  </g>

  <!-- Weighted edges to summation -->
  <g stroke="#1a1a2e" stroke-width="1.5" fill="none">
    <line x1="200" y1="205" x2="490" y2="320" marker-end="url(#arr)"/>
    <line x1="200" y1="315" x2="490" y2="335" marker-end="url(#arr)"/>
    <line x1="200" y1="425" x2="490" y2="350" marker-end="url(#arr)"/>
  </g>
  <line x1="200" y1="535" x2="490" y2="380" stroke="#7a5e1a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- Edge labels (weights) -->
  <g font-size="13" font-weight="600" fill="#1a4078">
    <rect x="305" y="235" width="50" height="22" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="330" y="250" text-anchor="middle">w₁</text>
    <rect x="305" y="312" width="50" height="22" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="330" y="327" text-anchor="middle">w₂</text>
    <rect x="305" y="378" width="50" height="22" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="330" y="393" text-anchor="middle">w₃</text>
    <rect x="305" y="445" width="50" height="22" rx="4" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
    <text x="330" y="460" text-anchor="middle" fill="#7a5e1a">+b</text>
  </g>

  <!-- Summation circle -->
  <circle cx="555" cy="350" r="65" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
  <text x="555" y="345" font-size="32" font-weight="600" text-anchor="middle" fill="#722f8a">Σ</text>
  <text x="555" y="375" font-size="11" text-anchor="middle" fill="#5a4a3a">weighted sum</text>
  <text x="555" y="440" font-size="12" font-style="italic" text-anchor="middle" fill="#722f8a">z = Σ wᵢ xᵢ + b</text>

  <!-- Arrow Σ → activation -->
  <line x1="620" y1="350" x2="730" y2="350" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="635" y="320" width="60" height="22" rx="4" fill="#ffffff" stroke="#1a1a2e" stroke-width="1"/>
  <text x="665" y="335" font-size="12" text-anchor="middle" fill="#1a1a2e">z</text>

  <!-- Activation function block -->
  <rect x="730" y="290" width="200" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
  <text x="830" y="318" font-size="16" font-weight="600" text-anchor="middle" fill="#1f7a3a">f(z)</text>
  <text x="830" y="338" font-size="12" text-anchor="middle" fill="#5a4a3a">activation</text>

  <!-- Mini activation curve inside box -->
  <g transform="translate(750, 350)">
    <line x1="0" y1="40" x2="160" y2="40" stroke="#5a4a3a" stroke-width="0.8"/>
    <line x1="80" y1="10" x2="80" y2="58" stroke="#5a4a3a" stroke-width="0.8"/>
    <path d="M 5 55 Q 60 55 78 30 Q 90 10 155 8" fill="none" stroke="#1f7a3a" stroke-width="2"/>
    <text x="80" y="75" font-size="11" text-anchor="middle" fill="#5a4a3a">e.g. ReLU, sigmoid</text>
  </g>

  <!-- Arrow activation → output -->
  <line x1="930" y1="350" x2="1040" y2="350" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Output -->
  <circle cx="1100" cy="350" r="45" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2.5"/>
  <text x="1100" y="346" font-size="20" font-weight="600" text-anchor="middle" fill="#7a5e1a">y</text>
  <text x="1100" y="370" font-size="11" text-anchor="middle" fill="#5a4a3a">output</text>

  <!-- Step labels along the bottom of the flow (kept below all node visuals to avoid overlap) -->
  <g font-size="12" font-style="italic" fill="#5a4a3a">
    <text x="330" y="585" text-anchor="middle">1 · scale each input by its weight</text>
    <text x="555" y="585" text-anchor="middle">2 · sum + bias</text>
    <text x="830" y="585" text-anchor="middle">3 · activate</text>
    <text x="1100" y="585" text-anchor="middle">4 · prediction</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Stack many perceptrons in layers and you get a multilayer network. Make the activation differentiable and you can train it end-to-end with gradient descent. This is the kernel of every deep model.</text>
  </g>
</svg>
