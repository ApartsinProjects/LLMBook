<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>Diffusion language models: corrupt then denoise</title>
  <rect width="1100" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrRedD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
    <marker id="arrGreenD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Diffusion language models</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Corrupt during training, denoise at inference</text>

  <!-- Forward (top): training -->
  <g transform="translate(40, 100)">
    <rect width="1020" height="160" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#b3401b">Forward (training)</text>
    <text x="20" y="48" font-size="11" font-style="italic" fill="#5a4a3a">progressively mask each token</text>

    <!-- t=0 -->
    <g transform="translate(20, 70)">
      <text x="120" y="0" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">t = 0</text>
      <rect x="0" y="10" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
      <text x="27" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1a1a2e">The</text>
      <rect x="60" y="10" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
      <text x="87" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1a1a2e">cat</text>
      <rect x="120" y="10" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
      <text x="147" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1a1a2e">sat</text>
      <rect x="180" y="10" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
      <text x="207" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1a1a2e">on</text>
    </g>

    <line x1="290" y1="95" x2="350" y2="95" stroke="#b3401b" stroke-width="2" marker-end="url(#arrRedD)"/>
    <text x="320" y="86" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">mask</text>

    <!-- t=1 -->
    <g transform="translate(360, 70)">
      <text x="120" y="0" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">t = 1</text>
      <rect x="0" y="10" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
      <text x="27" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1a1a2e">The</text>
      <rect x="60" y="10" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
      <text x="87" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#b3401b">[M]</text>
      <rect x="120" y="10" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
      <text x="147" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1a1a2e">sat</text>
      <rect x="180" y="10" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
      <text x="207" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1a1a2e">on</text>
    </g>

    <line x1="630" y1="95" x2="690" y2="95" stroke="#b3401b" stroke-width="2" marker-end="url(#arrRedD)" stroke-dasharray="6 4"/>

    <!-- t=T -->
    <g transform="translate(700, 70)">
      <text x="120" y="0" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">t = T</text>
      <rect x="0" y="10" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
      <text x="27" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#b3401b">[M]</text>
      <rect x="60" y="10" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
      <text x="87" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#b3401b">[M]</text>
      <rect x="120" y="10" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
      <text x="147" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#b3401b">[M]</text>
      <rect x="180" y="10" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
      <text x="207" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#b3401b">[M]</text>
    </g>
  </g>

  <!-- Reverse (bottom): inference -->
  <g transform="translate(40, 280)">
    <rect width="1020" height="160" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#1f7a3a">Reverse (inference)</text>
    <text x="20" y="48" font-size="11" font-style="italic" fill="#5a4a3a">unmask step by step</text>

    <!-- Start: all masked -->
    <g transform="translate(700, 70)">
      <text x="120" y="0" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">start</text>
      <rect x="0" y="10" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
      <text x="27" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#b3401b">[M]</text>
      <rect x="60" y="10" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
      <text x="87" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#b3401b">[M]</text>
      <rect x="120" y="10" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
      <text x="147" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#b3401b">[M]</text>
      <rect x="180" y="10" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
      <text x="207" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#b3401b">[M]</text>
    </g>

    <line x1="690" y1="95" x2="630" y2="95" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrGreenD)" stroke-dasharray="6 4"/>

    <!-- partial fill -->
    <g transform="translate(360, 70)">
      <text x="120" y="0" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">partial</text>
      <rect x="0" y="10" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
      <text x="27" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#b3401b">[M]</text>
      <rect x="60" y="10" width="55" height="30" rx="3" fill="#ecf6ee" stroke="#1f7a3a"/>
      <text x="87" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1f7a3a">cat</text>
      <rect x="120" y="10" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
      <text x="147" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#b3401b">[M]</text>
      <rect x="180" y="10" width="55" height="30" rx="3" fill="#ecf6ee" stroke="#1f7a3a"/>
      <text x="207" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1f7a3a">on</text>
    </g>

    <line x1="350" y1="95" x2="290" y2="95" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrGreenD)"/>
    <text x="320" y="86" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">unmask</text>

    <!-- end: clean -->
    <g transform="translate(20, 70)">
      <text x="120" y="0" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">end</text>
      <rect x="0" y="10" width="55" height="30" rx="3" fill="#ecf6ee" stroke="#1f7a3a"/>
      <text x="27" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1f7a3a">The</text>
      <rect x="60" y="10" width="55" height="30" rx="3" fill="#ecf6ee" stroke="#1f7a3a"/>
      <text x="87" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1f7a3a">cat</text>
      <rect x="120" y="10" width="55" height="30" rx="3" fill="#ecf6ee" stroke="#1f7a3a"/>
      <text x="147" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1f7a3a">sat</text>
      <rect x="180" y="10" width="55" height="30" rx="3" fill="#ecf6ee" stroke="#1f7a3a"/>
      <text x="207" y="30" font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#1f7a3a">on</text>
    </g>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 460)">
    <rect width="1020" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Train by corrupting; generate by inverting</text>
    <text x="510" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">All positions fill jointly in T denoising steps; autoregression produces one at a time.</text>
  </g>
</svg>
