<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="Helvetica, Arial, sans-serif">
  <title>Autoregressive vs Diffusion text generation</title>
  <rect width="1100" height="500" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">Autoregressive vs Diffusion</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Token-by-token vs parallel denoising</text>

  <!-- AR lane -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="1020" height="160" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#1f7a3a">Autoregressive</text>
    <text x="1000" y="32" font-size="11" font-style="italic" text-anchor="end" fill="#5a4a3a">GPT, Llama, Mistral</text>

    <!-- step 1 -->
    <g transform="translate(40, 60)">
      <text x="0" y="-4" font-size="11" font-weight="700" fill="#5a4a3a">Step 1</text>
      <rect x="0" y="0" width="50" height="26" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <text x="25" y="17" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">The</text>
      <rect x="52" y="0" width="56" height="26" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <text x="80" y="17" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">cap.</text>
      <rect x="110" y="0" width="36" height="26" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <text x="128" y="17" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">of</text>
      <rect x="148" y="0" width="56" height="26" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <text x="176" y="17" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">Fra.</text>
      <rect x="206" y="0" width="36" height="26" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <text x="224" y="17" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">is</text>
      <rect x="244" y="0" width="56" height="26" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="272" y="17" font-size="11" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#1f7a3a">Paris</text>
      <rect x="302" y="0" width="32" height="26" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="318" y="17" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">?</text>
      <rect x="336" y="0" width="32" height="26" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="352" y="17" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">?</text>
    </g>

    <!-- step 5 -->
    <g transform="translate(40, 115)">
      <text x="0" y="-4" font-size="11" font-weight="700" fill="#5a4a3a">Step 5 (final)</text>
      <rect x="0" y="0" width="242" height="26" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <text x="121" y="17" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">The cap. of Fra. is</text>
      <rect x="244" y="0" width="56" height="26" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <text x="272" y="17" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">Paris</text>
      <rect x="302" y="0" width="20" height="26" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <text x="312" y="17" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">,</text>
      <rect x="324" y="0" width="40" height="26" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <text x="344" y="17" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">city</text>
      <rect x="366" y="0" width="20" height="26" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="376" y="17" font-size="11" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#1f7a3a">.</text>
    </g>

    <!-- right summary -->
    <g transform="translate(560, 60)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1f7a3a">5 sequential calls</text>
      <text x="0" y="20" font-size="11" fill="#1a1a2e">one new token per call</text>
      <text x="0" y="50" font-size="12" font-weight="700" fill="#1f7a3a">Latency = 5 x t_step</text>
      <text x="0" y="70" font-size="11" fill="#1a1a2e">KV-cache amortizes</text>
    </g>
  </g>

  <!-- Diffusion lane -->
  <g transform="translate(40, 280)">
    <rect x="0" y="0" width="1020" height="160" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#722f8a">Diffusion</text>
    <text x="1000" y="32" font-size="11" font-style="italic" text-anchor="end" fill="#5a4a3a">SEDD, Mercury</text>

    <!-- T=10 -->
    <g transform="translate(40, 60)">
      <text x="0" y="-4" font-size="11" font-weight="700" fill="#5a4a3a">T=10 (noise)</text>
      <g>
        <rect x="0" y="0" width="50" height="26" rx="3" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
        <text x="25" y="17" font-size="10" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">MASK</text>
        <rect x="52" y="0" width="56" height="26" rx="3" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
        <text x="80" y="17" font-size="10" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">MASK</text>
        <rect x="110" y="0" width="36" height="26" rx="3" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
        <text x="128" y="17" font-size="10" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">MK</text>
        <rect x="148" y="0" width="56" height="26" rx="3" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
        <text x="176" y="17" font-size="10" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">MASK</text>
        <rect x="206" y="0" width="36" height="26" rx="3" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
        <text x="224" y="17" font-size="10" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">MK</text>
        <rect x="244" y="0" width="56" height="26" rx="3" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
        <text x="272" y="17" font-size="10" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">MASK</text>
        <rect x="302" y="0" width="20" height="26" rx="3" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
        <text x="312" y="17" font-size="10" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">M</text>
        <rect x="324" y="0" width="40" height="26" rx="3" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
        <text x="344" y="17" font-size="10" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">MK</text>
        <rect x="366" y="0" width="20" height="26" rx="3" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
        <text x="376" y="17" font-size="10" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">M</text>
      </g>
    </g>

    <!-- T=0 -->
    <g transform="translate(40, 115)">
      <text x="0" y="-4" font-size="11" font-weight="700" fill="#5a4a3a">T=0 (all positions resolved together)</text>
      <rect x="0" y="0" width="50" height="26" rx="3" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="25" y="17" font-size="11" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">The</text>
      <rect x="52" y="0" width="56" height="26" rx="3" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="80" y="17" font-size="11" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">cap.</text>
      <rect x="110" y="0" width="36" height="26" rx="3" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="128" y="17" font-size="11" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">of</text>
      <rect x="148" y="0" width="56" height="26" rx="3" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="176" y="17" font-size="11" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">Fra.</text>
      <rect x="206" y="0" width="36" height="26" rx="3" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="224" y="17" font-size="11" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">is</text>
      <rect x="244" y="0" width="56" height="26" rx="3" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="272" y="17" font-size="11" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">Paris</text>
      <rect x="302" y="0" width="20" height="26" rx="3" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="312" y="17" font-size="11" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">,</text>
      <rect x="324" y="0" width="40" height="26" rx="3" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="344" y="17" font-size="11" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">city</text>
      <rect x="366" y="0" width="20" height="26" rx="3" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="376" y="17" font-size="11" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">.</text>
    </g>

    <!-- right summary -->
    <g transform="translate(560, 60)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#722f8a">3 to 20 denoise steps</text>
      <text x="0" y="20" font-size="11" fill="#1a1a2e">all positions in parallel</text>
      <text x="0" y="50" font-size="12" font-weight="700" fill="#722f8a">Latency = T x t_step</text>
      <text x="0" y="70" font-size="11" fill="#1a1a2e">T can be very small</text>
    </g>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="1020" height="30" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">AR pays per token. Diffusion pays per denoise step.</text>
  </g>
</svg>
