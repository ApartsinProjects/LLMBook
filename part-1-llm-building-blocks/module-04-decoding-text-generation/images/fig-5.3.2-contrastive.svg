<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>Contrastive decoding subtracts amateur from expert logits</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Contrastive decoding: expert minus amateur</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Filler tokens cancel out; only content-bearing tokens survive</text>

  <g transform="translate(60, 110)">
    <rect width="280" height="200" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <rect x="0" y="0" width="280" height="44" rx="10" fill="#1f7a3a"/>
    <text x="140" y="29" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Expert (7B)</text>
    <text x="140" y="80" font-size="13" text-anchor="middle" fill="#1a1a2e">log p_expert(token)</text>
    <text x="140" y="120" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">scores every token</text>
    <text x="140" y="160" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">good and generic alike</text>
  </g>

  <g transform="translate(60, 330)">
    <rect width="280" height="200" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <rect x="0" y="0" width="280" height="44" rx="10" fill="#b3401b"/>
    <text x="140" y="29" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Amateur (1B)</text>
    <text x="140" y="80" font-size="13" text-anchor="middle" fill="#1a1a2e">log p_amateur(token)</text>
    <text x="140" y="120" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">loves generic fillers</text>
    <text x="140" y="160" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">struggles with distinctive ones</text>
  </g>

  <g transform="translate(380, 240)">
    <circle cx="40" cy="40" r="34" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="40" y="52" font-size="28" font-weight="700" text-anchor="middle" fill="#722f8a">-</text>
    <text x="40" y="100" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">subtract</text>
  </g>

  <line x1="340" y1="210" x2="378" y2="260" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="340" y1="430" x2="378" y2="305" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

  <line x1="465" y1="280" x2="510" y2="280" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

  <g transform="translate(515, 130)">
    <rect width="540" height="300" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <rect x="0" y="0" width="540" height="44" rx="10" fill="#1a4078"/>
    <text x="270" y="29" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Contrastive distribution</text>

    <rect x="20" y="64" width="500" height="64" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="40" y="88" font-size="13" font-weight="700" fill="#1a1a2e">"brilliant"</text>
    <text x="500" y="88" font-size="12" font-weight="700" text-anchor="end" fill="#1f7a3a">amplified</text>
    <text x="40" y="112" font-size="11" font-style="italic" fill="#5a4a3a">expert loves, amateur doesn't</text>

    <rect x="20" y="138" width="500" height="64" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
    <text x="40" y="162" font-size="13" font-weight="700" fill="#1a1a2e">"the"</text>
    <text x="500" y="162" font-size="12" font-weight="700" text-anchor="end" fill="#b3401b">suppressed</text>
    <text x="40" y="186" font-size="11" font-style="italic" fill="#5a4a3a">both love generic filler, cancels</text>

    <rect x="20" y="212" width="500" height="64" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="40" y="236" font-size="13" font-weight="700" fill="#1a1a2e">"insightful"</text>
    <text x="500" y="236" font-size="12" font-weight="700" text-anchor="end" fill="#1f7a3a">amplified</text>
    <text x="40" y="260" font-size="11" font-style="italic" fill="#5a4a3a">distinctive expert pick</text>
  </g>

  <g transform="translate(60, 460)">
    <rect width="995" height="120" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#a67c1a">When and how</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Use for open-ended generation where bland or repetitive output is the failure mode (story, dialogue, creative writing).</text>
    <text x="20" y="72" font-size="12" fill="#1a1a2e">Cost: 2 forward passes per token (expert + amateur); overhead ~10-20% because amateur is small.</text>
    <text x="20" y="92" font-size="12" fill="#1a1a2e">Knob: alpha (typical 0.5-1.0) controls suppression strength. Pitfall: amateur must share the expert's tokenizer family.</text>
    <text x="20" y="112" font-size="12" font-style="italic" fill="#5a4a3a">Subtracting a weak model's logits removes "things any LM would say" and keeps "things only the strong model knows".</text>
  </g>
</svg>
