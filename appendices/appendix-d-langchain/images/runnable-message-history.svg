<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a5e1a"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">RunnableWithMessageHistory: turning a stateless chain into a chatbot</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">A wrapper loads prior turns from a session store, feeds them to the chain, and writes the new exchange back.</text>

  <!-- User Input -->
  <g transform="translate(60, 220)">
    <rect width="180" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="90" y="38" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">User Input</text>
    <text x="90" y="62" font-size="12" text-anchor="middle" fill="#1a1a2e">"What about</text>
    <text x="90" y="80" font-size="12" text-anchor="middle" fill="#1a1a2e">tomorrow?"</text>
  </g>

  <!-- RunnableWithMessageHistory wrapper -->
  <g transform="translate(320, 180)">
    <rect width="320" height="180" rx="12" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="160" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">RunnableWithMessageHistory</text>
    <text x="160" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">orchestration wrapper</text>

    <!-- LCEL chain inside -->
    <g transform="translate(40, 75)">
      <rect width="240" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="120" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">LCEL Chain</text>
      <text x="120" y="46" font-size="11" text-anchor="middle" fill="#1a1a2e">prompt | model | parser</text>
      <text x="120" y="64" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">stateless on its own</text>
    </g>
  </g>

  <!-- Response -->
  <g transform="translate(720, 220)">
    <rect width="180" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="90" y="38" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Response</text>
    <text x="90" y="62" font-size="12" text-anchor="middle" fill="#1a1a2e">"Tomorrow looks</text>
    <text x="90" y="80" font-size="12" text-anchor="middle" fill="#1a1a2e">sunny."</text>
  </g>

  <!-- History Store (memory) -->
  <g transform="translate(990, 200)">
    <ellipse cx="120" cy="35" rx="120" ry="22" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <rect x="0" y="35" width="240" height="100" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <ellipse cx="120" cy="135" rx="120" ry="22" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <line x1="0" y1="35" x2="0" y2="135" stroke="#fef3e0" stroke-width="3"/>
    <line x1="240" y1="35" x2="240" y2="135" stroke="#fef3e0" stroke-width="3"/>
    <text x="120" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">History Store</text>
    <text x="120" y="62" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">get_session_history(id)</text>
    <text x="120" y="84" font-size="11" text-anchor="middle" fill="#1a1a2e">session "abc": [</text>
    <text x="120" y="100" font-size="11" text-anchor="middle" fill="#1a1a2e">"What's the weather?"</text>
    <text x="120" y="116" font-size="11" text-anchor="middle" fill="#1a1a2e">"It is clear today."</text>
    <text x="120" y="132" font-size="11" text-anchor="middle" fill="#1a1a2e">]</text>
  </g>

  <!-- Arrows -->
  <!-- User to Wrapper -->
  <line x1="240" y1="270" x2="318" y2="270" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="279" y="260" font-size="11" text-anchor="middle" fill="#5a4a3a">1. invoke</text>

  <!-- Wrapper LCEL to Response -->
  <line x1="640" y1="270" x2="718" y2="270" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="679" y="260" font-size="11" text-anchor="middle" fill="#5a4a3a">4. return</text>

  <!-- History load (dashed in) -->
  <path d="M 990 250 Q 880 180 640 220" fill="none" stroke="#7a5e1a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <text x="800" y="178" font-size="11" font-weight="700" fill="#7a5e1a">2. load history</text>

  <!-- History save (dashed out) -->
  <path d="M 640 320 Q 880 420 990 320" fill="none" stroke="#7a5e1a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <text x="800" y="430" font-size="11" font-weight="700" fill="#7a5e1a">3. save exchange</text>

  <!-- Why callout -->
  <g transform="translate(60, 460)">
    <rect width="1180" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why a wrapper, not built-in memory</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">The chain stays pure: same input, same output. The wrapper handles the side effect of reading and writing to a store keyed by session_id, so</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">you can swap in-memory dict for Redis, Postgres, or DynamoDB without touching the prompt, the model, or the parser.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 580)">
    <rect width="1180" height="64" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">RunnableWithMessageHistory is a memory shim around a stateless chain: it loads past turns by session, runs the chain, and persists the new exchange.</text>
  </g>
</svg>
