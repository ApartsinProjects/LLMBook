<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Agent execution loop in LangChain</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">A circular dance: the LLM calls a tool, reads the observation, then decides whether to keep going or finish</text>

  <!-- Circular layout: User left, LLM center-top, Tool right, FinalAnswer bottom -->

  <!-- User input (left) -->
  <g>
    <ellipse cx="160" cy="350" rx="100" ry="70" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="160" y="345" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">User Input</text>
    <text x="160" y="368" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">prompt / question</text>
  </g>

  <!-- LLM (center-top, big) -->
  <g>
    <circle cx="650" cy="240" r="115" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="650" y="225" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">LLM</text>
    <text x="650" y="248" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">decides next action</text>
    <text x="650" y="272" font-size="11" text-anchor="middle" fill="#5a4a3a">scratchpad keeps</text>
    <text x="650" y="288" font-size="11" text-anchor="middle" fill="#5a4a3a">prior observations</text>
  </g>

  <!-- Tool (right) -->
  <g>
    <ellipse cx="1140" cy="240" rx="110" ry="75" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="1140" y="232" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">Tool</text>
    <text x="1140" y="254" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">execute action</text>
    <text x="1140" y="278" font-size="11" text-anchor="middle" fill="#5a4a3a">search, calc, API, code</text>
  </g>

  <!-- Final Answer (bottom) -->
  <g>
    <ellipse cx="1140" cy="490" rx="110" ry="65" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="1140" y="488" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">Final Answer</text>
    <text x="1140" y="510" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">no more tools</text>
  </g>

  <!-- Arrows -->
  <!-- User -> LLM -->
  <path d="M 250 320 Q 400 230 540 215" fill="none" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="245" font-size="11" font-weight="700" fill="#1a1a2e">prompt</text>

  <!-- LLM -> Tool (tool call, top arc) -->
  <path d="M 760 200 Q 950 145 1040 195" fill="none" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="900" y="145" font-size="12" font-weight="700" fill="#1a1a2e">tool call</text>

  <!-- Tool -> LLM (observation, bottom arc, dashed purple) -->
  <path d="M 1040 280 Q 940 330 760 280" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrPurple)"/>
  <text x="900" y="330" font-size="12" font-weight="700" fill="#722f8a">observation</text>

  <!-- LLM -> Final Answer (when done) -->
  <path d="M 720 340 Q 950 410 1050 460" fill="none" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="900" y="395" font-size="12" font-weight="700" fill="#1a1a2e">done</text>

  <!-- Loop badge -->
  <g transform="translate(650, 240)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#722f8a" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>

  <!-- Step ledger (left bottom) -->
  <g transform="translate(60, 440)">
    <rect x="0" y="0" width="380" height="170" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="14" y="24" font-size="13" font-weight="700" fill="#1a4078">One iteration, step by step</text>
    <text x="14" y="48" font-size="12" fill="#1a1a2e">1. LLM reads prompt + scratchpad</text>
    <text x="14" y="68" font-size="12" fill="#1a1a2e">2. Emits either Action or Finish</text>
    <text x="14" y="88" font-size="12" fill="#1a1a2e">3. If Action: tool runs, returns text</text>
    <text x="14" y="108" font-size="12" fill="#1a1a2e">4. Observation appended to scratchpad</text>
    <text x="14" y="128" font-size="12" fill="#1a1a2e">5. Loop back to step 1</text>
    <text x="14" y="152" font-size="11" font-style="italic" fill="#5a4a3a">Termination: model emits Finish, max iters hit, or budget exceeded.</text>
  </g>

  <!-- Diagnose callout -->
  <g transform="translate(460, 440)">
    <rect x="0" y="0" width="370" height="170" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Diagnose: agent stuck in a loop?</text>
    <text x="16" y="50" font-size="12" fill="#1a1a2e">Check the scratchpad. Common causes:</text>
    <text x="16" y="72" font-size="12" fill="#1a1a2e">- Tool returned an unhelpful error and</text>
    <text x="16" y="88" font-size="12" fill="#1a1a2e">  the LLM keeps retrying with same args</text>
    <text x="16" y="108" font-size="12" fill="#1a1a2e">- Tool description is ambiguous</text>
    <text x="16" y="128" font-size="12" fill="#1a1a2e">- No "Finish" example in few-shot prompt</text>
    <text x="16" y="152" font-size="11" font-style="italic" fill="#5a4a3a">Always cap iterations to fail safe.</text>
  </g>

  <!-- Key terminology -->
  <g transform="translate(850, 580)">
    <rect x="0" y="-30" width="400" height="55" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1"/>
    <text x="14" y="-10" font-size="12" font-weight="700" fill="#1a1a2e">Solid arrow = control flow.</text>
    <text x="14" y="10" font-size="12" font-weight="700" fill="#722f8a">Dashed purple = data flow back into context.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 625)">
    <rect x="0" y="0" width="1180" height="55" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">An agent loops "LLM thinks, tool acts, observation feeds back" until the model itself signals it is done.</text>
  </g>
</svg>
