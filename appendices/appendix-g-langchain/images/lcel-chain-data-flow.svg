<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">LCEL chain data flow: prompt | model | parser</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each pipe stage transforms the value before passing it to the next runnable.</text>

  <!-- Stage 1: PromptTemplate -->
  <g transform="translate(60, 200)">
    <rect width="220" height="140" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="110" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">PromptTemplate</text>
    <text x="110" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">fills variables</text>
    <line x1="20" y1="68" x2="200" y2="68" stroke="#722f8a" stroke-width="1" opacity="0.3"/>
    <text x="110" y="90" font-size="12" text-anchor="middle" fill="#1a1a2e">input: dict</text>
    <text x="110" y="108" font-size="12" text-anchor="middle" fill="#1a1a2e">{"topic": "cats"}</text>
    <text x="110" y="128" font-size="11" text-anchor="middle" fill="#5a4a3a">output: PromptValue</text>
  </g>

  <!-- Stage 2: ChatModel -->
  <g transform="translate(360, 200)">
    <rect width="220" height="140" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="110" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">ChatModel</text>
    <text x="110" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">generates response</text>
    <line x1="20" y1="68" x2="200" y2="68" stroke="#1f7a3a" stroke-width="1" opacity="0.3"/>
    <text x="110" y="90" font-size="12" text-anchor="middle" fill="#1a1a2e">input: PromptValue</text>
    <text x="110" y="108" font-size="12" text-anchor="middle" fill="#1a1a2e">calls LLM API</text>
    <text x="110" y="128" font-size="11" text-anchor="middle" fill="#5a4a3a">output: AIMessage</text>
  </g>

  <!-- Stage 3: OutputParser -->
  <g transform="translate(660, 200)">
    <rect width="220" height="140" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="110" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">OutputParser</text>
    <text x="110" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">extracts content</text>
    <line x1="20" y1="68" x2="200" y2="68" stroke="#7a5e1a" stroke-width="1" opacity="0.3"/>
    <text x="110" y="90" font-size="12" text-anchor="middle" fill="#1a1a2e">input: AIMessage</text>
    <text x="110" y="108" font-size="12" text-anchor="middle" fill="#1a1a2e">unwraps .content</text>
    <text x="110" y="128" font-size="11" text-anchor="middle" fill="#5a4a3a">output: str</text>
  </g>

  <!-- Stage 4: Result -->
  <g transform="translate(960, 200)">
    <rect width="220" height="140" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="110" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Result</text>
    <text x="110" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">clean string</text>
    <line x1="20" y1="68" x2="200" y2="68" stroke="#1a4078" stroke-width="1" opacity="0.3"/>
    <text x="110" y="90" font-size="12" text-anchor="middle" fill="#1a1a2e">"Cats are agile"</text>
    <text x="110" y="108" font-size="12" text-anchor="middle" fill="#1a1a2e">"feline mammals."</text>
    <text x="110" y="128" font-size="11" text-anchor="middle" fill="#5a4a3a">ready to use</text>
  </g>

  <!-- Pipe arrows -->
  <line x1="280" y1="270" x2="358" y2="270" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="319" y="260" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">|</text>
  <text x="319" y="290" font-size="11" text-anchor="middle" fill="#5a4a3a">pipe</text>

  <line x1="580" y1="270" x2="658" y2="270" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="619" y="260" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">|</text>
  <text x="619" y="290" font-size="11" text-anchor="middle" fill="#5a4a3a">pipe</text>

  <line x1="880" y1="270" x2="958" y2="270" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="919" y="260" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">|</text>
  <text x="919" y="290" font-size="11" text-anchor="middle" fill="#5a4a3a">pipe</text>

  <!-- Code line -->
  <g transform="translate(60, 120)">
    <rect width="1180" height="48" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1"/>
    <text x="20" y="20" font-size="11" font-weight="700" fill="#5a4a3a">LCEL expression</text>
    <text x="20" y="38" font-size="13" font-family="Consolas, Monaco, monospace" fill="#1a1a2e">chain = prompt | model | parser ; chain.invoke({"topic": "cats"})</text>
  </g>

  <!-- Why callout -->
  <g transform="translate(60, 380)">
    <rect width="1180" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why this composes</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Each component implements the Runnable interface, so it exposes invoke, batch, stream, and async variants. The pipe operator wires</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">them so the output type of one stage matches the input type of the next; you can swap any stage without changing the others.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 510)">
    <rect width="1180" height="64" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">An LCEL chain is a left-to-right pipeline of Runnables; data shape changes at each stage (dict, PromptValue, AIMessage, str) and the pipe operator handles the plumbing.</text>
  </g>
</svg>
