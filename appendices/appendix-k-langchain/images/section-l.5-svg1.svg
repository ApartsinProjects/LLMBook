<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">LangChain agent execution loop</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">The LLM keeps choosing tools until it decides it has enough information to answer</text>

  <!-- User input -->
  <g>
    <rect x="60" y="240" width="190" height="110" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="155" y="278" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">User Input</text>
    <text x="155" y="302" font-size="12" text-anchor="middle" fill="#1a1a2e">natural language</text>
    <text x="155" y="320" font-size="12" text-anchor="middle" fill="#1a1a2e">question or task</text>
  </g>

  <!-- LLM (center, larger) -->
  <g>
    <rect x="450" y="200" width="240" height="200" rx="14" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="570" y="238" font-size="17" font-weight="700" text-anchor="middle" fill="#1f7a3a">LLM</text>
    <text x="570" y="262" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">decides next action</text>
    <line x1="475" y1="278" x2="665" y2="278" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="570" y="302" font-size="12" text-anchor="middle" fill="#1a1a2e">1. read history</text>
    <text x="570" y="322" font-size="12" text-anchor="middle" fill="#1a1a2e">2. think (ReAct)</text>
    <text x="570" y="342" font-size="12" text-anchor="middle" fill="#1a1a2e">3. emit tool call</text>
    <text x="570" y="362" font-size="12" text-anchor="middle" fill="#1a1a2e">   or final answer</text>
  </g>

  <!-- Tool -->
  <g>
    <rect x="880" y="120" width="220" height="120" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="990" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">Tool</text>
    <text x="990" y="182" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">execute external action</text>
    <text x="990" y="206" font-size="12" text-anchor="middle" fill="#1a1a2e">search, calculator, API,</text>
    <text x="990" y="222" font-size="12" text-anchor="middle" fill="#1a1a2e">code, database query</text>
  </g>

  <!-- Final answer -->
  <g>
    <rect x="880" y="360" width="220" height="120" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="990" y="398" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">Final Answer</text>
    <text x="990" y="422" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">no more tools needed</text>
    <text x="990" y="446" font-size="12" text-anchor="middle" fill="#1a1a2e">return text to user,</text>
    <text x="990" y="462" font-size="12" text-anchor="middle" fill="#1a1a2e">loop terminates</text>
  </g>

  <!-- Arrows -->
  <line x1="252" y1="295" x2="446" y2="295" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="349" y="285" font-size="11" text-anchor="middle" fill="#5a4a3a">prompt</text>

  <!-- LLM -> Tool -->
  <path d="M 690 250 Q 800 200 878 180" fill="none" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="780" y="200" font-size="12" font-weight="700" fill="#1a1a2e">tool call</text>

  <!-- Tool -> LLM (observation, dashed) -->
  <path d="M 878 220 Q 770 290 692 310" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <text x="780" y="290" font-size="12" font-weight="700" fill="#722f8a">observation</text>

  <!-- LLM -> Final -->
  <path d="M 690 350 Q 800 410 878 415" fill="none" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="780" y="405" font-size="12" font-weight="700" fill="#1a1a2e">done</text>

  <!-- Loop arc indicator -->
  <g transform="translate(570, 130)">
    <path d="M -60 30 A 60 30 0 1 1 60 30" fill="none" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="0" y="20" font-size="12" font-style="italic" text-anchor="middle" fill="#722f8a">repeat until LLM stops</text>
    <text x="0" y="2" font-size="11" text-anchor="middle" fill="#5a4a3a">requesting tools</text>
  </g>

  <!-- Sidebar callout -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="340" height="160" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why a loop?</text>
    <text x="16" y="50" font-size="12" fill="#1a1a2e">A single tool call rarely answers a real</text>
    <text x="16" y="68" font-size="12" fill="#1a1a2e">question. The agent searches, reads the</text>
    <text x="16" y="86" font-size="12" fill="#1a1a2e">result, refines, then queries again. Each</text>
    <text x="16" y="104" font-size="12" fill="#1a1a2e">iteration appends to scratchpad memory</text>
    <text x="16" y="122" font-size="12" fill="#1a1a2e">so the LLM can reason about what it has</text>
    <text x="16" y="140" font-size="12" fill="#1a1a2e">already learned.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">An agent is just an LLM in a loop with tools; it stops when the model emits a final answer instead of another tool call.</text>
  </g>
</svg>
