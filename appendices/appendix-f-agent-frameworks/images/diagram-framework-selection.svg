<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="1100" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Picking an agent framework: four questions, seven endpoints</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Walk top to bottom. Architecture fit comes first; specific framework features come second.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <polygon points="700,110 950,170 700,230 450,170" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
  <text x="700" y="160" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Q1. Single agent or</text>
  <text x="700" y="180" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">multi-agent crew?</text>
  <text x="700" y="205" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(one role with tools, or several specialist roles?)</text>

  <line x1="580" y1="220" x2="300" y2="290" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="260" font-size="13" font-weight="700" fill="#1a1a2e">SINGLE</text>

  <line x1="820" y1="220" x2="1100" y2="290" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="980" y="260" font-size="13" font-weight="700" fill="#1a1a2e">MULTI</text>

  <polygon points="300,290 540,350 300,410 60,350" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
  <text x="300" y="340" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Q2. Strict typing /</text>
  <text x="300" y="360" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">structured outputs?</text>
  <text x="300" y="385" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(Pydantic models, schemas)</text>

  <polygon points="1100,290 1340,350 1100,410 860,350" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
  <text x="1100" y="340" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Q3. Need state checkpoints</text>
  <text x="1100" y="360" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">+ recovery?</text>
  <text x="1100" y="385" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(long-running, may crash)</text>

  <line x1="200" y1="395" x2="160" y2="460" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="140" y="430" font-size="13" font-weight="700" fill="#1a1a2e">YES</text>

  <line x1="400" y1="395" x2="440" y2="460" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="430" y="430" font-size="13" font-weight="700" fill="#1a1a2e">NO</text>

  <line x1="1000" y1="395" x2="960" y2="460" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="940" y="430" font-size="13" font-weight="700" fill="#1a1a2e">YES</text>

  <line x1="1200" y1="395" x2="1240" y2="460" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1220" y="430" font-size="13" font-weight="700" fill="#1a1a2e">NO</text>

  <g transform="translate(40, 465)">
    <rect x="0" y="0" width="240" height="90" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="120" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">PydanticAI</text>
    <text x="120" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">Type-safe outputs, native</text>
    <text x="120" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">structured validation</text>
    <text x="120" y="82" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Runner-up: Semantic Kernel</text>
  </g>

  <polygon points="440,460 580,500 440,540 300,500" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
  <text x="440" y="492" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Q2b. Open-source</text>
  <text x="440" y="510" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">model flexibility?</text>

  <line x1="380" y1="535" x2="340" y2="600" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="570" font-size="12" font-weight="700" fill="#1a1a2e">YES</text>

  <line x1="500" y1="535" x2="540" y2="600" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="530" y="570" font-size="12" font-weight="700" fill="#1a1a2e">NO</text>

  <g transform="translate(230, 605)">
    <rect x="0" y="0" width="220" height="90" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="110" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">smolagents</text>
    <text x="110" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">HuggingFace ecosystem,</text>
    <text x="110" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">any model on the Hub</text>
    <text x="110" y="82" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Lightest footprint</text>
  </g>

  <g transform="translate(470, 605)">
    <rect x="0" y="0" width="220" height="90" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="110" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">OpenAI Agents SDK</text>
    <text x="110" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">OpenAI-platform-only,</text>
    <text x="110" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">tightest GPT integration</text>
    <text x="110" y="82" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Runner-up: LangGraph</text>
  </g>

  <g transform="translate(840, 465)">
    <rect x="0" y="0" width="240" height="90" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="2.5"/>
    <text x="120" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">LangGraph</text>
    <text x="120" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">Explicit graph, checkpoint</text>
    <text x="120" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">+ state recovery, hot reload</text>
    <text x="120" y="82" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Most controllable</text>
  </g>

  <polygon points="1240,460 1380,500 1240,540 1100,500" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
  <text x="1240" y="492" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Q3b. Code-execution</text>
  <text x="1240" y="510" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">agents?</text>

  <line x1="1180" y1="535" x2="1140" y2="600" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1130" y="570" font-size="12" font-weight="700" fill="#1a1a2e">YES</text>

  <line x1="1300" y1="535" x2="1340" y2="600" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1320" y="570" font-size="12" font-weight="700" fill="#1a1a2e">NO</text>

  <g transform="translate(1020, 605)">
    <rect x="0" y="0" width="220" height="90" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="110" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">AutoGen</text>
    <text x="110" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">Built-in code executor,</text>
    <text x="110" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">conversational orchestration</text>
    <text x="110" y="82" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Microsoft Research</text>
  </g>

  <g transform="translate(1260, 605)">
    <rect x="0" y="0" width="120" height="90" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="60" y="26" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Q3c. .NET /</text>
    <text x="60" y="42" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Azure stack?</text>
    <text x="60" y="62" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">YES</text>
    <text x="60" y="78" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">NO</text>
  </g>

  <line x1="1310" y1="700" x2="1280" y2="740" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1340" y1="700" x2="1370" y2="740" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(1150, 745)">
    <rect x="0" y="0" width="160" height="90" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="80" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Semantic Kernel</text>
    <text x="80" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">.NET + Java SDKs,</text>
    <text x="80" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">Azure-native</text>
    <text x="80" y="82" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Microsoft</text>
  </g>

  <g transform="translate(1320, 745)">
    <rect x="0" y="0" width="76" height="90" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="38" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">CrewAI</text>
    <text x="38" y="48" font-size="10" text-anchor="middle" fill="#1a1a2e">Role-based,</text>
    <text x="38" y="62" font-size="10" text-anchor="middle" fill="#1a1a2e">quickest</text>
    <text x="38" y="76" font-size="10" text-anchor="middle" fill="#1a1a2e">prototype</text>
  </g>

  <g transform="translate(60, 870)">
    <rect x="0" y="0" width="1280" height="200" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="640" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Three architecture patterns underneath</text>
    <line x1="40" y1="50" x2="1240" y2="50" stroke="#d4d4d4" stroke-width="1"/>

    <text x="40" y="78" font-size="13" font-weight="700" fill="#1a4078">Graph-based</text>
    <text x="40" y="98" font-size="12" fill="#1a1a2e">LangGraph. State is a typed dict; nodes mutate it; edges</text>
    <text x="40" y="114" font-size="12" fill="#1a1a2e">are conditional. Pattern: most control, most ceremony.</text>
    <text x="40" y="138" font-size="11" font-style="italic" fill="#5a4a3a">Best for production multi-agent with state recovery.</text>

    <text x="450" y="78" font-size="13" font-weight="700" fill="#1f7a3a">Role-based</text>
    <text x="450" y="98" font-size="12" fill="#1a1a2e">CrewAI, AutoGen. Each agent is a persona (role, goal,</text>
    <text x="450" y="114" font-size="12" fill="#1a1a2e">backstory) with tools; orchestrator schedules conversation.</text>
    <text x="450" y="138" font-size="11" font-style="italic" fill="#5a4a3a">Best for quick multi-agent prototypes.</text>

    <text x="860" y="78" font-size="13" font-weight="700" fill="#722f8a">Code-first</text>
    <text x="860" y="98" font-size="12" fill="#1a1a2e">OpenAI Agents SDK, smolagents, PydanticAI, Semantic Kernel.</text>
    <text x="860" y="114" font-size="12" fill="#1a1a2e">Plain Python/C# function calls drive the agent; tool decorators do registration.</text>
    <text x="860" y="138" font-size="11" font-style="italic" fill="#5a4a3a">Best for single-agent with strong typing.</text>

    <text x="640" y="180" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Architecture fit comes first; specific framework features come second.</text>
  </g>
</svg>
