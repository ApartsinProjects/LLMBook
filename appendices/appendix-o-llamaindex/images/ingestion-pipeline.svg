<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">LlamaIndex ingestion pipeline</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">From raw external data to indexed nodes ready for retrieval, in four stages</text>

  <!-- Pipeline stages -->
  <!-- Stage 1: Data Sources -->
  <g>
    <rect x="60" y="180" width="240" height="170" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="180" y="212" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">STAGE 1</text>
    <text x="180" y="240" font-size="17" font-weight="700" text-anchor="middle" fill="#1a4078">Data Sources</text>
    <line x1="85" y1="254" x2="275" y2="254" stroke="#1a4078" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="180" y="278" font-size="12" text-anchor="middle" fill="#1a1a2e">PDFs, Markdown, HTML</text>
    <text x="180" y="298" font-size="12" text-anchor="middle" fill="#1a1a2e">REST APIs, Notion, Slack</text>
    <text x="180" y="318" font-size="12" text-anchor="middle" fill="#1a1a2e">Postgres, MongoDB, S3</text>
    <text x="180" y="340" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">heterogeneous, raw</text>
  </g>

  <!-- Stage 2: Connectors -->
  <g>
    <rect x="350" y="180" width="240" height="170" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="470" y="212" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">STAGE 2</text>
    <text x="470" y="240" font-size="17" font-weight="700" text-anchor="middle" fill="#7a5e1a">Connectors</text>
    <line x1="375" y1="254" x2="565" y2="254" stroke="#7a5e1a" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="470" y="278" font-size="12" text-anchor="middle" fill="#1a1a2e">Readers / Loaders</text>
    <text x="470" y="298" font-size="12" text-anchor="middle" fill="#1a1a2e">SimpleDirectoryReader,</text>
    <text x="470" y="316" font-size="12" text-anchor="middle" fill="#1a1a2e">LlamaHub plugins</text>
    <text x="470" y="340" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">read + normalize</text>
  </g>

  <!-- Stage 3: Documents -->
  <g>
    <rect x="640" y="180" width="240" height="170" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="760" y="212" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">STAGE 3</text>
    <text x="760" y="240" font-size="17" font-weight="700" text-anchor="middle" fill="#1f7a3a">Documents</text>
    <line x1="665" y1="254" x2="855" y2="254" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="760" y="278" font-size="12" text-anchor="middle" fill="#1a1a2e">+ Transformations:</text>
    <text x="760" y="298" font-size="12" text-anchor="middle" fill="#1a1a2e">chunk, clean, extract</text>
    <text x="760" y="316" font-size="12" text-anchor="middle" fill="#1a1a2e">metadata, dedupe</text>
    <text x="760" y="340" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">structured text + meta</text>
  </g>

  <!-- Stage 4: TextNodes -->
  <g>
    <rect x="930" y="180" width="240" height="170" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="1050" y="212" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">STAGE 4</text>
    <text x="1050" y="240" font-size="17" font-weight="700" text-anchor="middle" fill="#722f8a">TextNodes</text>
    <line x1="955" y1="254" x2="1145" y2="254" stroke="#722f8a" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="1050" y="278" font-size="12" text-anchor="middle" fill="#1a1a2e">stored in an Index</text>
    <text x="1050" y="298" font-size="12" text-anchor="middle" fill="#1a1a2e">(vector, summary,</text>
    <text x="1050" y="316" font-size="12" text-anchor="middle" fill="#1a1a2e">tree, keyword)</text>
    <text x="1050" y="340" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">retrieval-ready</text>
  </g>

  <!-- Arrows between stages -->
  <line x1="302" y1="265" x2="346" y2="265" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="592" y1="265" x2="636" y2="265" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="882" y1="265" x2="926" y2="265" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Arrow labels -->
  <text x="324" y="258" font-size="11" text-anchor="middle" fill="#5a4a3a">load</text>
  <text x="614" y="258" font-size="11" text-anchor="middle" fill="#5a4a3a">parse</text>
  <text x="904" y="258" font-size="11" text-anchor="middle" fill="#5a4a3a">chunk + index</text>

  <!-- Stage row label -->
  <text x="60" y="140" font-size="13" font-weight="700" fill="#1a1a2e">Pipeline flow</text>
  <line x1="60" y1="148" x2="1170" y2="148" stroke="#5a4a3a" stroke-width="0.8"/>

  <!-- Below: example artifact at each stage -->
  <text x="60" y="395" font-size="13" font-weight="700" fill="#1a1a2e">What you hold in memory</text>
  <line x1="60" y1="403" x2="1170" y2="403" stroke="#5a4a3a" stroke-width="0.8"/>

  <g font-size="11" fill="#1a1a2e">
    <rect x="60" y="415" width="240" height="80" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="72" y="434" font-weight="700" fill="#1a4078">file paths / URLs</text>
    <text x="72" y="454">"./docs/handbook.pdf"</text>
    <text x="72" y="471">"https://api.notion.com/..."</text>
    <text x="72" y="488">"s3://bucket/reports/"</text>

    <rect x="350" y="415" width="240" height="80" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
    <text x="362" y="434" font-weight="700" fill="#7a5e1a">reader instances</text>
    <text x="362" y="454">SimpleDirectoryReader(</text>
    <text x="362" y="471">  input_dir="./docs"</text>
    <text x="362" y="488">).load_data()</text>

    <rect x="640" y="415" width="240" height="80" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
    <text x="652" y="434" font-weight="700" fill="#1f7a3a">Document objects</text>
    <text x="652" y="454">Document(text="...",</text>
    <text x="652" y="471">  metadata=&#112233;"src": "..."&#112255;)</text>
    <text x="652" y="488">one per source file</text>

    <rect x="930" y="415" width="240" height="80" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
    <text x="942" y="434" font-weight="700" fill="#722f8a">TextNode objects</text>
    <text x="942" y="454">TextNode(text="chunk",</text>
    <text x="942" y="471">  embedding=[...],</text>
    <text x="942" y="488">  relationships=&#112233;...&#112255;)</text>
  </g>

  <!-- Sidebar callout -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="1110" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why this shape?</text>
    <text x="16" y="48" font-size="12" fill="#1a1a2e">Each stage has a single, well-defined job. You can swap implementations independently: change the reader without touching</text>
    <text x="16" y="66" font-size="12" fill="#1a1a2e">transformations, change the chunker without touching the index. The Document / TextNode boundary is the key abstraction.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Ingestion is a four-stage pipeline: Sources to Connectors to Documents to TextNodes; each stage refines the data and the boundaries are pluggable.</text>
  </g>
</svg>
