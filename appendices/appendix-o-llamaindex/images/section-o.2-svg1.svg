<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Four LlamaIndex index types side by side</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each index trades retrieval style for use case; pick the one that matches your query pattern</text>

  <!-- Four columns -->
  <!-- Col 1: VectorStoreIndex -->
  <g>
    <rect x="50" y="110" width="290" height="430" rx="12" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="195" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">VectorStoreIndex</text>
    <text x="195" y="162" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">the default workhorse</text>

    <line x1="70" y1="178" x2="320" y2="178" stroke="#1a4078" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="70" y="202" font-size="12" font-weight="700" fill="#1a4078">How it retrieves</text>
    <text x="70" y="224" font-size="12" fill="#1a1a2e">Embedding similarity</text>
    <text x="70" y="244" font-size="12" fill="#1a1a2e">Top-k nearest neighbors</text>

    <text x="70" y="278" font-size="12" font-weight="700" fill="#1a4078">Best for</text>
    <text x="70" y="300" font-size="12" fill="#1a1a2e">Semantic search over</text>
    <text x="70" y="318" font-size="12" fill="#1a1a2e">large corpora; standard</text>
    <text x="70" y="336" font-size="12" fill="#1a1a2e">RAG question answering.</text>

    <text x="70" y="370" font-size="12" font-weight="700" fill="#1a4078">Cost shape</text>
    <text x="70" y="392" font-size="12" fill="#1a1a2e">One LLM call per query;</text>
    <text x="70" y="410" font-size="12" fill="#1a1a2e">cheap and fast.</text>

    <text x="70" y="444" font-size="12" font-weight="700" fill="#1a4078">Trade-off</text>
    <text x="70" y="466" font-size="12" fill="#1a1a2e">Misses connections that</text>
    <text x="70" y="484" font-size="12" fill="#1a1a2e">are not embedding-close.</text>
  </g>

  <!-- Col 2: SummaryIndex -->
  <g>
    <rect x="350" y="110" width="290" height="430" rx="12" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="495" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">SummaryIndex</text>
    <text x="495" y="162" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">read everything</text>

    <line x1="370" y1="178" x2="620" y2="178" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="370" y="202" font-size="12" font-weight="700" fill="#1f7a3a">How it retrieves</text>
    <text x="370" y="224" font-size="12" fill="#1a1a2e">Sequential scan</text>
    <text x="370" y="244" font-size="12" fill="#1a1a2e">Every node visited</text>

    <text x="370" y="278" font-size="12" font-weight="700" fill="#1f7a3a">Best for</text>
    <text x="370" y="300" font-size="12" fill="#1a1a2e">Whole-corpus summaries;</text>
    <text x="370" y="318" font-size="12" fill="#1a1a2e">queries that need to see</text>
    <text x="370" y="336" font-size="12" fill="#1a1a2e">all evidence at once.</text>

    <text x="370" y="370" font-size="12" font-weight="700" fill="#1f7a3a">Cost shape</text>
    <text x="370" y="392" font-size="12" fill="#1a1a2e">N LLM calls (one per</text>
    <text x="370" y="410" font-size="12" fill="#1a1a2e">node); slow but thorough.</text>

    <text x="370" y="444" font-size="12" font-weight="700" fill="#1f7a3a">Trade-off</text>
    <text x="370" y="466" font-size="12" fill="#1a1a2e">Does not scale past a few</text>
    <text x="370" y="484" font-size="12" fill="#1a1a2e">hundred chunks.</text>
  </g>

  <!-- Col 3: TreeIndex -->
  <g>
    <rect x="650" y="110" width="290" height="430" rx="12" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="795" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">TreeIndex</text>
    <text x="795" y="162" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">drill down hierarchically</text>

    <line x1="670" y1="178" x2="920" y2="178" stroke="#722f8a" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="670" y="202" font-size="12" font-weight="700" fill="#722f8a">How it retrieves</text>
    <text x="670" y="224" font-size="12" fill="#1a1a2e">Hierarchical summaries</text>
    <text x="670" y="244" font-size="12" fill="#1a1a2e">Top-down traversal</text>

    <text x="670" y="278" font-size="12" font-weight="700" fill="#722f8a">Best for</text>
    <text x="670" y="300" font-size="12" fill="#1a1a2e">Long structured documents</text>
    <text x="670" y="318" font-size="12" fill="#1a1a2e">where coarse-to-fine</text>
    <text x="670" y="336" font-size="12" fill="#1a1a2e">navigation makes sense.</text>

    <text x="670" y="370" font-size="12" font-weight="700" fill="#722f8a">Cost shape</text>
    <text x="670" y="392" font-size="12" fill="#1a1a2e">log(N) calls at query</text>
    <text x="670" y="410" font-size="12" fill="#1a1a2e">time; build cost is high.</text>

    <text x="670" y="444" font-size="12" font-weight="700" fill="#722f8a">Trade-off</text>
    <text x="670" y="466" font-size="12" fill="#1a1a2e">Tree must be rebuilt when</text>
    <text x="670" y="484" font-size="12" fill="#1a1a2e">corpus changes.</text>
  </g>

  <!-- Col 4: KeywordTableIndex -->
  <g>
    <rect x="950" y="110" width="290" height="430" rx="12" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="1095" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">KeywordTableIndex</text>
    <text x="1095" y="162" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">exact term lookup</text>

    <line x1="970" y1="178" x2="1220" y2="178" stroke="#7a5e1a" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="970" y="202" font-size="12" font-weight="700" fill="#7a5e1a">How it retrieves</text>
    <text x="970" y="224" font-size="12" fill="#1a1a2e">Keyword extraction</text>
    <text x="970" y="244" font-size="12" fill="#1a1a2e">Exact term match</text>

    <text x="970" y="278" font-size="12" font-weight="700" fill="#7a5e1a">Best for</text>
    <text x="970" y="300" font-size="12" fill="#1a1a2e">Code, error messages,</text>
    <text x="970" y="318" font-size="12" fill="#1a1a2e">product SKUs, anything</text>
    <text x="970" y="336" font-size="12" fill="#1a1a2e">where precise tokens win.</text>

    <text x="970" y="370" font-size="12" font-weight="700" fill="#7a5e1a">Cost shape</text>
    <text x="970" y="392" font-size="12" fill="#1a1a2e">Cheapest at query time;</text>
    <text x="970" y="410" font-size="12" fill="#1a1a2e">no embeddings needed.</text>

    <text x="970" y="444" font-size="12" font-weight="700" fill="#7a5e1a">Trade-off</text>
    <text x="970" y="466" font-size="12" fill="#1a1a2e">Brittle to paraphrase or</text>
    <text x="970" y="484" font-size="12" fill="#1a1a2e">synonyms.</text>
  </g>

  <!-- Decision strip -->
  <g transform="translate(50, 555)">
    <rect x="0" y="0" width="1190" height="55" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Pick the right one</text>
    <text x="16" y="42" font-size="12" fill="#1a1a2e">Default to VectorStoreIndex. Reach for SummaryIndex when "answer needs all docs", TreeIndex for long manuals, KeywordTableIndex for code or IDs.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 625)">
    <rect x="0" y="0" width="1180" height="55" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">Indexes are not interchangeable; each one encodes a different assumption about how queries will reach the data.</text>
  </g>
</svg>
