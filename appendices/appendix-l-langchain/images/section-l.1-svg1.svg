<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Anatomy of an LCEL chain</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Four runnables, three pipes, one composable expression: prompt | model | parser produces a clean string.</text>

  <!-- Code box -->
  <g transform="translate(360, 100)">
    <rect width="580" height="50" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1"/>
    <text x="290" y="32" font-size="14" font-family="Consolas, Monaco, monospace" text-anchor="middle" fill="#1a1a2e">chain = prompt | model | parser</text>
  </g>

  <!-- Pipeline (vertical) -->
  <!-- Stage 1: PromptTemplate -->
  <g transform="translate(440, 180)">
    <rect width="420" height="80" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#722f8a">1. PromptTemplate</text>
    <text x="20" y="54" font-size="12" font-style="italic" fill="#5a4a3a">fills variables in a string template</text>
    <text x="20" y="72" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">{"topic": "cats"}  -&gt;  PromptValue</text>
  </g>

  <!-- arrow + pipe label -->
  <line x1="650" y1="262" x2="650" y2="298" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="670" y="284" font-size="13" font-weight="700" fill="#722f8a">|</text>

  <!-- Stage 2: ChatModel -->
  <g transform="translate(440, 300)">
    <rect width="420" height="80" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#1f7a3a">2. ChatModel</text>
    <text x="20" y="54" font-size="12" font-style="italic" fill="#5a4a3a">generates a response from the prompt</text>
    <text x="20" y="72" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">PromptValue  -&gt;  AIMessage(content="...")</text>
  </g>

  <line x1="650" y1="382" x2="650" y2="418" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="670" y="404" font-size="13" font-weight="700" fill="#1f7a3a">|</text>

  <!-- Stage 3: OutputParser -->
  <g transform="translate(440, 420)">
    <rect width="420" height="80" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#7a5e1a">3. OutputParser</text>
    <text x="20" y="54" font-size="12" font-style="italic" fill="#5a4a3a">extracts the .content field as a string</text>
    <text x="20" y="72" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">AIMessage  -&gt;  str</text>
  </g>

  <line x1="650" y1="502" x2="650" y2="538" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="670" y="524" font-size="13" font-weight="700" fill="#7a5e1a">|</text>

  <!-- Stage 4: Result -->
  <g transform="translate(440, 540)">
    <rect width="420" height="60" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="28" font-size="16" font-weight="700" fill="#1a4078">4. Result</text>
    <text x="20" y="50" font-size="12" font-family="Consolas, monospace" fill="#1a1a2e">"Cats are agile feline mammals."</text>
  </g>

  <!-- Side annotation -->
  <g transform="translate(60, 200)">
    <rect width="340" height="320" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why a Runnable interface?</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">Every stage exposes the same methods,</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">so the pipe operator can wire them up:</text>
    <text x="20" y="96" font-size="12" font-weight="700" fill="#1a1a2e">.invoke(x)</text>
    <text x="20" y="114" font-size="11" fill="#5a4a3a">single synchronous call</text>
    <text x="20" y="138" font-size="12" font-weight="700" fill="#1a1a2e">.batch([x, y, z])</text>
    <text x="20" y="156" font-size="11" fill="#5a4a3a">parallel execution over a list</text>
    <text x="20" y="180" font-size="12" font-weight="700" fill="#1a1a2e">.stream(x)</text>
    <text x="20" y="198" font-size="11" fill="#5a4a3a">yield tokens as they are produced</text>
    <text x="20" y="222" font-size="12" font-weight="700" fill="#1a1a2e">.ainvoke / .abatch / .astream</text>
    <text x="20" y="240" font-size="11" fill="#5a4a3a">async variants for high concurrency</text>
    <text x="20" y="276" font-size="11" fill="#1a1a2e">Swap any stage (e.g. switch model</text>
    <text x="20" y="292" font-size="11" fill="#1a1a2e">providers) without touching the others.</text>
  </g>

  <!-- Side annotation right -->
  <g transform="translate(900, 200)">
    <rect width="340" height="320" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#5a4a3a">Type contract at each pipe</text>
    <text x="20" y="56" font-size="12" font-weight="700" fill="#722f8a">dict</text>
    <text x="20" y="74" font-size="11" fill="#1a1a2e">{"topic": "cats"}</text>
    <text x="20" y="106" font-size="12" font-weight="700" fill="#722f8a">PromptValue</text>
    <text x="20" y="124" font-size="11" fill="#1a1a2e">structured prompt with role hints</text>
    <text x="20" y="156" font-size="12" font-weight="700" fill="#1f7a3a">AIMessage</text>
    <text x="20" y="174" font-size="11" fill="#1a1a2e">role + content + metadata</text>
    <text x="20" y="206" font-size="12" font-weight="700" fill="#7a5e1a">str</text>
    <text x="20" y="224" font-size="11" fill="#1a1a2e">just the assistant text</text>
    <text x="20" y="260" font-size="11" fill="#5a4a3a">Mismatch between an output type</text>
    <text x="20" y="276" font-size="11" fill="#5a4a3a">and the next input type is the most</text>
    <text x="20" y="292" font-size="11" fill="#5a4a3a">common LCEL bug; check both sides.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 630)">
    <rect width="1180" height="56" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="44" font-size="12" fill="#1a1a2e">An LCEL chain is a vertical pipeline of Runnables: a prompt becomes a model call becomes a parsed string, with the pipe operator carrying the value between stages.</text>
  </g>
</svg>
