# html2pub config for "Building Conversational AI with LLMs and Agents"
# Run: html2pub build .
# All publishing metadata derives from here (mirrors KDP/metadata/metadata.yaml).

# NOTE: KDP/metadata/metadata.yaml is the single source of truth for the
# publication metadata. The fields below MUST be kept in sync with it
# (publication_date, identifier, edition_number, rights). The publish.py
# pre-flight checks both files agree.
[book]
title = "Building Conversational AI with LLMs and Agents"
subtitle = "From the mathematics of attention to production agent systems"
edition = "Fifteenth Edition"
language = "en"
identifier = "urn:uuid:8fdafdb8-778b-51bf-9471-4aca9e01a7a0"
publisher = "Apartsin & Aperstein"
rights = "Copyright (c) 2026 Alexander Apartsin and Yehudit Aperstein. All rights reserved."
publication_date = "2026-05-16"
description = """A practitioner's guide for engineers, researchers, and students. \
Covers the mathematics of attention, modern transformer architecture, training and \
fine-tuning, retrieval-augmented generation, agentic systems, evaluation, deployment, \
and the business strategy of LLM products."""
keywords = [
  "RAG vector database semantic search",
  "LangChain LangGraph CrewAI tutorial",
  "transformer architecture from scratch attention",
  "prompt engineering ChatGPT Claude Gemini",
  "LLM fine tuning LoRA QLoRA RLHF DPO",
  "AI agent multi-agent system LLM production",
  "MLOps LLM observability evaluation engineering",
]

[[book.authors]]
name = "Alexander Apartsin"
file_as = "Apartsin, Alexander"
role = "aut"

[[book.authors]]
name = "Yehudit Aperstein"
file_as = "Aperstein, Yehudit"
role = "aut"

[content]
source_dir = "."
spine = "auto"
front_matter_dir = "front-matter"
parts_glob = "part-*"
module_glob = "module-*"
appendices_dir = "appendices"
capstone_dir = "capstone"
section_glob = "section-*.html"
# Explicit FM ordering. Default is alphabetical (which puts about-authors
# right after the FM index). The order below matches FM.1 -> FM.7.
fm_order = [
  "foreword.html",
  "look-inside-preview.html",
  "fm-what-this-book-covers.html",
  "fm-who-should-read.html",
  "fm-how-to-use.html",
  "about-authors.html",
  "copyright.html",
]

[styling]
stylesheets = ["styles/book.css", "styles/pygments.css"]
# Use our enhanced overrides (Kindle-safe tooltip suppression, callout colors,
# embedded fonts) instead of html2pub's built-in default_overrides.css.
epub_overrides = "KDP/build/epub_overrides.css"

[fonts]
# epub_overrides.css declares @font-face for these files via `../fonts/<name>`.
# KDP only supports TTF/OTF for embedded fonts (WOFF/WOFF2 are not endorsed by
# Amazon, per KDP help GH4DRT75GWWAGBTU), and the @font-face src URLs in
# epub_overrides.css reference .ttf, so the bundled files MUST be the .ttf that
# live in KDP/build/fonts/. (The earlier .woff2 entries pointed at files that
# were never generated, so no body fonts were embedded at all.)
include = [
  "KDP/build/fonts/SourceSerif4-Regular.ttf",
  "KDP/build/fonts/SourceSerif4-It.ttf",
  "KDP/build/fonts/SourceSerif4-Bold.ttf",
  "KDP/build/fonts/SourceCodePro-Regular.ttf",
]
# Applies only to the KaTeX webfont set (keeps just .woff2 KaTeX faces). Body
# fonts above are bundled regardless of this flag.
rewrite_katex_to_woff2_only = true

[math]
render = "katex"
node_exe = "node"
katex_path = "KDP/build/node_modules"

[images]
# Kindle Paperwhite (1072x1448), Kindle Oasis (1264x1680), Kindle Scribe
# (1860x2480). Most readers see 1100-1300 px effective width. 1000 px on
# the long side is visually indistinguishable on illustrations and diagrams,
# while shaving ~40% off the bundled image bytes (the largest EPUB
# contributor after page text). JPEG q=72 stays clean on the multimodal
# source art and gives a further 10-15% size cut vs q=78.
max_side = 1000
jpeg_quality = 72
compress_pngs = true

[cover]
path = "KDP/cover/cover_kdp.jpg"

[transforms]
wide_table_min_cols = 6
slim_index_lists = true
drop_inline_style_over = 1500
drop_selectors = [
  ".no-epub",
  "script[src*='analytics']",
]

[transforms.avatar_sizes]

# Fragment IDs dropped during build (rewrites links so EPUB readers don't show
# "broken anchor" errors). Wisdom council slim removes 34 of 42 cards; their
# ids must be listed here so cross-document #ref links get the fragment stripped.
[transforms.fragment_drop]
"wisdom-council" = [
  "tensor", "lexica", "dropout", "attn", "greedy", "scale", "chinchilla",
  "bert", "sparky", "quant", "spectra", "prompt", "hallux", "rag", "vec",
  "lora", "label", "reward", "merge", "probe", "census", "pixel", "echo",
  "cosine", "batch", "kv", "finetune", "token", "loss", "norm", "context",
  "synth", "distill", "sentinel",
]

[output]
epub = "KDP/output/building-conversational-ai-llms-agents.epub"

[optimize]
repair_entities = true

[plugins]
# Project-specific HTML transforms applied per chapter (Pygments syntax highlighting,
# wisdom-council slim, code-block normalization, wide-table wrapping, KaTeX class fix-ups,
# avatar sizing). Module must be importable; KDP/build is added to sys.path by the
# build script before invoking html2pub.
post_process_html = "_html2pub_hooks.post_process"
