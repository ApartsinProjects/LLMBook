<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Self-refine loop: generate, critique, revise</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">A single model role-plays writer and editor across rounds until quality crosses a threshold.</text>

  <!-- Cycle layout: 3 stages across, then final on right; dashed loop back -->
  <!-- Stage 1: GENERATE -->
  <g transform="translate(80,170)">
    <rect x="0" y="0" width="240" height="160" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="120" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">1. GENERATE</text>
    <line x1="20" y1="48" x2="220" y2="48" stroke="#1a4078" stroke-width="1" opacity="0.4"/>
    <text x="120" y="74" font-size="12" text-anchor="middle" fill="#1a1a2e">Produce an initial draft</text>
    <text x="120" y="94" font-size="12" text-anchor="middle" fill="#1a1a2e">from the task prompt.</text>
    <text x="120" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">Prompt: "Write a short</text>
    <text x="120" y="140" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">explanation of X."</text>
  </g>

  <!-- arrow 1 -->
  <line x1="320" y1="250" x2="370" y2="250" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="345" y="240" font-size="11" text-anchor="middle" fill="#5a4a3a">draft</text>

  <!-- Stage 2: CRITIQUE -->
  <g transform="translate(370,170)">
    <rect x="0" y="0" width="240" height="160" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="120" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. CRITIQUE</text>
    <line x1="20" y1="48" x2="220" y2="48" stroke="#1f7a3a" stroke-width="1" opacity="0.4"/>
    <text x="120" y="74" font-size="12" text-anchor="middle" fill="#1a1a2e">Identify specific flaws,</text>
    <text x="120" y="94" font-size="12" text-anchor="middle" fill="#1a1a2e">missing details, errors.</text>
    <text x="120" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">Prompt: "List 3 issues</text>
    <text x="120" y="140" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">with the draft above."</text>
  </g>

  <!-- arrow 2 -->
  <line x1="610" y1="250" x2="660" y2="250" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="635" y="240" font-size="11" text-anchor="middle" fill="#5a4a3a">feedback</text>

  <!-- Stage 3: REVISE -->
  <g transform="translate(660,170)">
    <rect x="0" y="0" width="240" height="160" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="120" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">3. REVISE</text>
    <line x1="20" y1="48" x2="220" y2="48" stroke="#722f8a" stroke-width="1" opacity="0.4"/>
    <text x="120" y="74" font-size="12" text-anchor="middle" fill="#1a1a2e">Fix flagged issues,</text>
    <text x="120" y="94" font-size="12" text-anchor="middle" fill="#1a1a2e">produce a new draft.</text>
    <text x="120" y="124" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">Prompt: "Rewrite the</text>
    <text x="120" y="140" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">draft, addressing each issue."</text>
  </g>

  <!-- arrow 3 to final -->
  <line x1="900" y1="250" x2="950" y2="250" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="925" y="240" font-size="11" text-anchor="middle" fill="#5a4a3a">accept</text>

  <!-- Final output -->
  <g transform="translate(950,170)">
    <rect x="0" y="0" width="240" height="160" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="120" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">Final output</text>
    <line x1="20" y1="48" x2="220" y2="48" stroke="#7a5e1a" stroke-width="1" opacity="0.4"/>
    <text x="120" y="74" font-size="12" text-anchor="middle" fill="#1a1a2e">Returned when the latest</text>
    <text x="120" y="94" font-size="12" text-anchor="middle" fill="#1a1a2e">critique finds no major</text>
    <text x="120" y="114" font-size="12" text-anchor="middle" fill="#1a1a2e">issues, or after N rounds.</text>
    <text x="120" y="142" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">Typical N: 2 to 4 rounds.</text>
  </g>

  <!-- dashed loop-back from REVISE bottom to GENERATE bottom (when threshold not met) -->
  <path d="M 780 330 L 780 410 L 200 410 L 200 330" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <rect x="430" y="395" width="320" height="32" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
  <text x="590" y="416" font-size="12" text-anchor="middle" fill="#722f8a" font-weight="700">if quality &lt; threshold: feed revision back as new draft</text>

  <!-- Side callout: why it works -->
  <g transform="translate(80,470)">
    <rect x="0" y="0" width="560" height="120" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="24" font-size="13" font-weight="700" fill="#7a5e1a">Why self-refine works</text>
    <text x="16" y="48" font-size="12" fill="#1a1a2e">Models are often better critics than first-pass writers: spotting a flaw is</text>
    <text x="16" y="68" font-size="12" fill="#1a1a2e">easier than avoiding it. Splitting the role into writer + editor lets the model</text>
    <text x="16" y="88" font-size="12" fill="#1a1a2e">use its own feedback to improve, with no extra training and no human in</text>
    <text x="16" y="108" font-size="12" fill="#1a1a2e">the loop.</text>
  </g>

  <!-- Side callout: when to stop -->
  <g transform="translate(660,470)">
    <rect x="0" y="0" width="560" height="120" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="16" y="24" font-size="13" font-weight="700" fill="#b3401b">Watch out: diminishing returns</text>
    <text x="16" y="48" font-size="12" fill="#1a1a2e">Each extra round costs tokens and latency. Most gains land in rounds 1-2;</text>
    <text x="16" y="68" font-size="12" fill="#1a1a2e">beyond round 3 the model often nitpicks or drifts. Cap N and use a small</text>
    <text x="16" y="88" font-size="12" fill="#1a1a2e">validator (rubric, regex, unit test) to decide when to exit early instead</text>
    <text x="16" y="108" font-size="12" fill="#1a1a2e">of looping forever.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Generate, then critique, then revise: the same model improves its own output across a few rounds, capped by a quality threshold or round limit.</text>
  </g>
</svg>
