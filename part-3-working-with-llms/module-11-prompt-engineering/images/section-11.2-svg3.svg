<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Choosing a Reasoning Strategy</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Walk this decision tree top-down to pick the cheapest prompting technique that meets your task's needs.</text>

  <!-- Q1 -->
  <g transform="translate(540, 100)">
    <polygon points="0,30 130,0 260,30 130,60" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="2"/>
    <text x="130" y="36" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Reasoning required?</text>
  </g>

  <!-- Q1 No -> Zero-shot -->
  <line x1="540" y1="145" x2="240" y2="195" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="370" y="170" font-size="12" font-weight="700" fill="#1f7a3a">No</text>

  <g transform="translate(80, 195)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Zero-shot prompting</text>
    <text x="100" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">just ask plainly</text>
  </g>

  <!-- Q1 Yes -> Q2 -->
  <line x1="800" y1="145" x2="800" y2="195" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="815" y="170" font-size="12" font-weight="700" fill="#b3401b">Yes</text>

  <g transform="translate(670, 195)">
    <polygon points="0,30 130,0 260,30 130,60" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="2"/>
    <text x="130" y="36" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Domain knowledge gap?</text>
  </g>

  <!-- Q2 Yes -> Step-back -->
  <line x1="670" y1="240" x2="500" y2="290" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="555" y="265" font-size="12" font-weight="700" fill="#b3401b">Yes</text>

  <g transform="translate(330, 290)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="100" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Step-back prompting</text>
    <text x="100" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">surface principles first</text>
  </g>

  <!-- Q2 No -> Q3 -->
  <line x1="930" y1="240" x2="930" y2="290" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="945" y="265" font-size="12" font-weight="700" fill="#1f7a3a">No</text>

  <g transform="translate(800, 290)">
    <polygon points="0,30 130,0 260,30 130,60" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="2"/>
    <text x="130" y="36" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Tools / external data?</text>
  </g>

  <!-- Q3 Yes -> ReAct -->
  <line x1="800" y1="335" x2="650" y2="395" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="700" y="365" font-size="12" font-weight="700" fill="#b3401b">Yes</text>

  <g transform="translate(490, 395)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="100" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">ReAct framework</text>
    <text x="100" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">interleave thought + action</text>
  </g>

  <!-- Q3 No -> Q4 -->
  <line x1="1060" y1="335" x2="1060" y2="395" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1075" y="365" font-size="12" font-weight="700" fill="#1f7a3a">No</text>

  <g transform="translate(930, 395)">
    <polygon points="0,30 130,0 260,30 130,60" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="2"/>
    <text x="130" y="36" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Reliability critical (3x cost ok)?</text>
  </g>

  <!-- Q4 Yes -> Self-consistency -->
  <line x1="930" y1="440" x2="780" y2="500" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="830" y="470" font-size="12" font-weight="700" fill="#b3401b">Yes</text>

  <g transform="translate(620, 500)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Self-consistency</text>
    <text x="100" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">sample N, majority vote</text>
  </g>

  <!-- Q4 No -> Q5 -->
  <line x1="1190" y1="440" x2="1190" y2="500" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1205" y="470" font-size="12" font-weight="700" fill="#1f7a3a">No</text>

  <g transform="translate(1060, 500)">
    <polygon points="0,30 130,0 260,30 130,60" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="2"/>
    <text x="130" y="36" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Have CoT examples?</text>
  </g>

  <!-- Q5 Yes -> Few-shot CoT -->
  <line x1="1060" y1="545" x2="970" y2="600" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1000" y="575" font-size="12" font-weight="700" fill="#b3401b">Yes</text>

  <g transform="translate(820, 600)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="100" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Few-shot CoT</text>
    <text x="100" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">2-5 worked examples</text>
  </g>

  <!-- Q5 No -> Zero-shot CoT -->
  <line x1="1320" y1="545" x2="1190" y2="600" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1230" y="575" font-size="12" font-weight="700" fill="#1f7a3a">No</text>

  <g transform="translate(1060, 600)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="100" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Zero-shot CoT</text>
    <text x="100" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">"Let's think step by step"</text>
  </g>

  <!-- Side callout: reasoning models -->
  <g transform="translate(60, 395)">
    <rect x="0" y="0" width="380" height="140" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Tip: consider a reasoning model</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">Models like o3, o4-mini, and DeepSeek R1</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">do chain-of-thought internally before answering.</text>
    <text x="20" y="92" font-size="12" fill="#1a1a2e">For these, explicit CoT prompting may add</text>
    <text x="20" y="110" font-size="12" fill="#1a1a2e">cost without improving accuracy. Try the model</text>
    <text x="20" y="128" font-size="12" fill="#1a1a2e">first; reach for these techniques only if it falls short.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 710)">
    <rect x="0" y="0" width="1200" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Start cheap (zero-shot) and only add machinery as the task demands it. Each branch trades latency or dollars for an extra reliability dimension.</text>
  </g>
</svg>
