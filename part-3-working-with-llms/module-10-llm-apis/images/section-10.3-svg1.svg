<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Graceful degradation: a 5-level fallback chain</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Each level is a safety net for the one above; users always get an answer, just less personalized as you fall.</text>

  <!-- UX gradient axis on the right -->
  <g transform="translate(1170,110)">
    <text x="40" y="0" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">best UX</text>
    <line x1="40" y1="10" x2="40" y2="430" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="40" y="450" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">worst UX</text>
    <text x="40" y="220" font-size="11" text-anchor="middle" fill="#5a4a3a" transform="rotate(90 40 220)">user experience degrades as we fall</text>
  </g>

  <!-- Cascading staircase: each lower level has more left-indent and a warmer tone -->

  <!-- Level 1 -->
  <g transform="translate(80,110)">
    <rect x="0" y="0" width="600" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <circle cx="36" cy="35" r="20" fill="#1f7a3a"/>
    <text x="36" y="40" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="76" y="30" font-size="14" font-weight="700" fill="#1f7a3a">Full LLM response (preferred path)</text>
    <text x="76" y="52" font-size="12" fill="#1a1a2e">Live call to the primary model. Fully personalized, freshest answer.</text>
  </g>
  <text x="700" y="148" font-size="11" fill="#5a4a3a" font-style="italic">if API errors, timeout, or rate-limit -> next level</text>
  <line x1="120" y1="180" x2="180" y2="200" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Level 2 -->
  <g transform="translate(160,200)">
    <rect x="0" y="0" width="600" height="70" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <circle cx="36" cy="35" r="20" fill="#1a4078"/>
    <text x="36" y="40" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="76" y="30" font-size="14" font-weight="700" fill="#1a4078">Cached response</text>
    <text x="76" y="52" font-size="12" fill="#1a1a2e">Serve a prior response for an identical or near-identical query.</text>
  </g>
  <text x="780" y="238" font-size="11" fill="#5a4a3a" font-style="italic">if cache miss -> next level</text>
  <line x1="200" y1="270" x2="260" y2="290" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Level 3 -->
  <g transform="translate(240,290)">
    <rect x="0" y="0" width="600" height="70" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <circle cx="36" cy="35" r="20" fill="#722f8a"/>
    <text x="36" y="40" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="76" y="30" font-size="14" font-weight="700" fill="#722f8a">Simpler model</text>
    <text x="76" y="52" font-size="12" fill="#1a1a2e">Route to a smaller / cheaper / on-prem model. Less nuance, still bespoke.</text>
  </g>
  <text x="860" y="328" font-size="11" fill="#5a4a3a" font-style="italic">if also unavailable -> next level</text>
  <line x1="280" y1="360" x2="340" y2="380" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Level 4 -->
  <g transform="translate(320,380)">
    <rect x="0" y="0" width="600" height="70" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <circle cx="36" cy="35" r="20" fill="#7a5e1a"/>
    <text x="36" y="40" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
    <text x="76" y="30" font-size="14" font-weight="700" fill="#7a5e1a">Static FAQ / templated answer</text>
    <text x="76" y="52" font-size="12" fill="#1a1a2e">Look up the closest preauthored answer. Generic but always available.</text>
  </g>
  <text x="940" y="418" font-size="11" fill="#5a4a3a" font-style="italic">if no FAQ match -> next level</text>
  <line x1="360" y1="450" x2="420" y2="470" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Level 5 -->
  <g transform="translate(400,470)">
    <rect x="0" y="0" width="600" height="70" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <circle cx="36" cy="35" r="20" fill="#b3401b"/>
    <text x="36" y="40" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
    <text x="76" y="30" font-size="14" font-weight="700" fill="#b3401b">Friendly error message</text>
    <text x="76" y="52" font-size="12" fill="#1a1a2e">"We are temporarily down. Try again in a moment." Last-resort safety net.</text>
  </g>

  <!-- Side callout -->
  <g transform="translate(80,570)">
    <rect x="0" y="0" width="1140" height="70" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="24" font-size="13" font-weight="700" fill="#7a5e1a">Design rule</text>
    <text x="16" y="46" font-size="12" fill="#1a1a2e">Each level must be independently deployable and faster than the level above. Otherwise the fallback adds latency without reducing failure</text>
    <text x="16" y="62" font-size="12" fill="#1a1a2e">risk. Always set short timeouts at every layer; users prefer a fast partial answer to a slow perfect one.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 650)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">A multi-level fallback turns "model is down" from an outage into a slightly worse answer. Plan all five levels before launch, not after the first incident.</text>
  </g>
</svg>
