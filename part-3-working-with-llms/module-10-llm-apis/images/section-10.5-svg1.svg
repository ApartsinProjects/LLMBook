<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Compression pipeline: prune, then quantize, then distill</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Each step shrinks the same 70B model further; combined, they yield an 8x to 16x reduction in effective size.</text>

  <!-- Big horizontal bars showing relative size -->
  <!-- Y position of pipeline stages -->
  <g transform="translate(60,130)">

    <!-- Stage 1: Dense -->
    <rect x="0" y="0" width="240" height="190" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="120" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">1. Dense baseline</text>
    <text x="120" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">70B parameters, FP16</text>
    <!-- size bar -->
    <rect x="20" y="68" width="200" height="36" rx="4" fill="#1a4078"/>
    <text x="120" y="91" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">140 GB</text>
    <text x="120" y="128" font-size="11" text-anchor="middle" fill="#5a4a3a">Starting point: too large to</text>
    <text x="120" y="144" font-size="11" text-anchor="middle" fill="#5a4a3a">serve cheaply at scale.</text>
    <text x="120" y="172" font-size="11" font-style="italic" text-anchor="middle" fill="#1a4078">baseline = 1.0x</text>
  </g>

  <line x1="300" y1="225" x2="340" y2="225" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="217" font-size="11" text-anchor="middle" fill="#5a4a3a">prune</text>

  <g transform="translate(340,130)">
    <!-- Stage 2: Pruned -->
    <rect x="0" y="0" width="240" height="190" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="120" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. Pruned</text>
    <text x="120" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">50% sparse weights</text>
    <rect x="20" y="68" width="100" height="36" rx="4" fill="#1f7a3a"/>
    <text x="70" y="91" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">70 GB*</text>
    <text x="120" y="128" font-size="11" text-anchor="middle" fill="#5a4a3a">Half the weights set to zero</text>
    <text x="120" y="144" font-size="11" text-anchor="middle" fill="#5a4a3a">and dropped from storage.</text>
    <text x="120" y="172" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">2x smaller</text>
  </g>

  <line x1="580" y1="225" x2="620" y2="225" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="217" font-size="11" text-anchor="middle" fill="#5a4a3a">quantize</text>

  <g transform="translate(620,130)">
    <!-- Stage 3: Quantized -->
    <rect x="0" y="0" width="240" height="190" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="120" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">3. Quantized</text>
    <text x="120" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">Sparse + INT4 weights</text>
    <rect x="20" y="68" width="26" height="36" rx="4" fill="#722f8a"/>
    <text x="56" y="91" font-size="14" font-weight="700" text-anchor="start" fill="#722f8a">~18 GB</text>
    <text x="120" y="128" font-size="11" text-anchor="middle" fill="#5a4a3a">Each kept weight stored in</text>
    <text x="120" y="144" font-size="11" text-anchor="middle" fill="#5a4a3a">4 bits instead of 16.</text>
    <text x="120" y="172" font-size="11" font-style="italic" text-anchor="middle" fill="#722f8a">~8x smaller than baseline</text>
  </g>

  <line x1="860" y1="225" x2="900" y2="225" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="880" y="217" font-size="11" text-anchor="middle" fill="#5a4a3a">distill</text>

  <g transform="translate(900,130)">
    <!-- Stage 4: Distilled -->
    <rect x="0" y="0" width="280" height="190" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="140" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">4. Distilled production model</text>
    <text x="140" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">Quality recovered via student</text>
    <text x="140" y="68" font-size="12" text-anchor="middle" fill="#1a1a2e">training against the original.</text>
    <rect x="20" y="80" width="26" height="36" rx="4" fill="#7a5e1a"/>
    <text x="56" y="103" font-size="13" font-weight="700" text-anchor="start" fill="#7a5e1a">~18 GB, higher accuracy</text>
    <text x="140" y="140" font-size="11" text-anchor="middle" fill="#5a4a3a">Distillation does not shrink the</text>
    <text x="140" y="156" font-size="11" text-anchor="middle" fill="#5a4a3a">student further; it claws back</text>
    <text x="140" y="172" font-size="11" text-anchor="middle" fill="#5a4a3a">accuracy lost to prune + quantize.</text>
  </g>

  <!-- Footnote callout about sparsity caveat -->
  <g transform="translate(80,360)">
    <rect x="0" y="0" width="560" height="120" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="24" font-size="13" font-weight="700" fill="#7a5e1a">* Caveat: storage vs compute</text>
    <text x="16" y="48" font-size="12" fill="#1a1a2e">Setting weights to zero halves the parameter count, but disk savings</text>
    <text x="16" y="68" font-size="12" fill="#1a1a2e">depend on the sparse storage format (CSR, block-sparse, 2:4). Compute</text>
    <text x="16" y="88" font-size="12" fill="#1a1a2e">savings depend on hardware support: NVIDIA's 2:4 sparsity gives a real</text>
    <text x="16" y="108" font-size="12" fill="#1a1a2e">speedup; unstructured sparsity often does not.</text>
  </g>

  <!-- Total compression card -->
  <g transform="translate(660,360)">
    <rect x="0" y="0" width="560" height="120" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#1f7a3a">Total compression: 8x to 16x</text>
    <text x="16" y="50" font-size="12" fill="#1a1a2e">From 140 GB to roughly 9 to 18 GB depending on prune ratio and</text>
    <text x="16" y="70" font-size="12" fill="#1a1a2e">quantization scheme. Typical wins: a 70B model that needed an A100</text>
    <text x="16" y="90" font-size="12" fill="#1a1a2e">node now fits on a single consumer GPU, and decoding throughput rises</text>
    <text x="16" y="110" font-size="12" fill="#1a1a2e">because most of the original arithmetic is gone too.</text>
  </g>

  <!-- Order matters strip -->
  <g transform="translate(80,510)">
    <rect x="0" y="0" width="1140" height="80" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="16" y="24" font-size="13" font-weight="700" fill="#b3401b">Order matters</text>
    <text x="16" y="48" font-size="12" fill="#1a1a2e">Prune first, then quantize, then distill. Quantizing a dense network and pruning afterwards usually loses more accuracy: the rounding error</text>
    <text x="16" y="68" font-size="12" fill="#1a1a2e">amplifies once you start zeroing weights. Distillation is the last step because it can repair damage from earlier compression.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Prune, quantize, and distill are complementary, not alternatives. Stack them in the right order and a 140 GB flagship becomes an ~18 GB workhorse.</text>
  </g>
</svg>
