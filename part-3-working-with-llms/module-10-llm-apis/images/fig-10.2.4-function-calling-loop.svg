<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Function Calling: 5 Steps</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">The model proposes which function to call; YOUR code executes it; the result is fed back for the final answer</text>

  <!-- 5 stages horizontally -->
  <g>
    <!-- Step 1 -->
    <rect x="50" y="130" width="220" height="120" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="160" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">1 · User query</text>
    <text x="160" y="185" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">"What's the weather</text>
    <text x="160" y="201" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">in Paris?"</text>
    <text x="160" y="232" font-size="11" text-anchor="middle" fill="#5a4a3a">+ tools schema</text>

    <line x1="270" y1="190" x2="320" y2="190" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Step 2 -->
    <rect x="320" y="130" width="220" height="120" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="430" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">2 · Model decides</text>
    <text x="430" y="185" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">finish_reason:</text>
    <text x="430" y="203" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">"tool_calls"</text>
    <text x="430" y="232" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">no answer yet — wants a tool</text>

    <line x1="540" y1="190" x2="590" y2="190" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Step 3 -->
    <rect x="590" y="130" width="220" height="120" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="700" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">3 · Tool call JSON</text>
    <text x="700" y="183" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">name: get_weather</text>
    <text x="700" y="203" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">args: {city: "Paris"}</text>
    <text x="700" y="232" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">structured request</text>

    <line x1="810" y1="190" x2="860" y2="190" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Step 4 -->
    <rect x="860" y="130" width="220" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="970" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">4 · YOU execute</text>
    <text x="970" y="183" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">get_weather("Paris")</text>
    <text x="970" y="203" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">→ "22°C, sunny"</text>
    <text x="970" y="232" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">your code, your runtime</text>

    <line x1="1080" y1="190" x2="1130" y2="190" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Step 5 (drops down) -->
    <rect x="1130" y="130" width="160" height="120" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="1210" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">5 · Final reply</text>
    <text x="1210" y="183" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">"It's 22°C and</text>
    <text x="1210" y="200" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">sunny in Paris"</text>
    <text x="1210" y="232" font-size="11" text-anchor="middle" fill="#5a4a3a">streamed to user</text>
  </g>

  <!-- Result feedback arrow -->
  <path d="M 970 250 C 970 320 1100 320 1210 270" fill="none" stroke="#1f7a3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="1090" y="335" font-size="11" font-style="italic" font-weight="600" text-anchor="middle" fill="#1f7a3a">tool result fed back as new message</text>

  <!-- Key principle highlighted box -->
  <g transform="translate(220, 380)">
    <rect x="0" y="0" width="860" height="170" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/>
    <text x="430" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">★ The model NEVER executes functions itself</text>
    <line x1="20" y1="48" x2="840" y2="48" stroke="#d4b96a" stroke-width="0.6"/>
    <text x="20" y="78" font-size="13" fill="#1a1a2e">It only proposes a structured "I'd like to call X with arguments Y" message. Your application code:</text>
    <text x="20" y="105" font-size="13" fill="#1a1a2e">1) parses the proposal,  2) validates safety/permissions,  3) actually runs the function,  4) returns the result.</text>
    <text x="20" y="138" font-size="13" font-weight="700" fill="#b3401b">This separation is the foundation of agent safety: every side-effect goes through your code, not through model output text.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1180" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Function calling is structured generation pretending to be procedural execution. The loop can repeat any number of times — that's how agents and ReAct chains are built on top of this same primitive.</text>
    <text x="20" y="68" font-size="12" font-style="italic" fill="#5a4a3a">Equivalent OpenAI / Anthropic / Gemini APIs differ in JSON shape, but every modern LLM provider supports the same 5-step contract.</text>
  </g>
</svg>
