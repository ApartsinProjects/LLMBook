<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Anatomy of an LLM API Request/Response</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Stateless HTTP POST: client sends JSON, provider runs inference, returns JSON</text>

  <!-- LEFT: Client request -->
  <g>
    <rect x="40" y="110" width="360" height="430" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="220" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">Client</text>
    <text x="220" y="166" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">request body fields</text>
    <line x1="60" y1="180" x2="380" y2="180" stroke="#1a4078" stroke-width="0.6"/>

    <g font-family="monospace" font-size="13" fill="#1a1a2e">
      <text x="60" y="210"><tspan font-weight="700" fill="#1a4078">model:</tspan>       "gpt-4o"</text>
      <text x="60" y="240"><tspan font-weight="700" fill="#1a4078">messages:</tspan>    [...]</text>
      <text x="60" y="270"><tspan font-weight="700" fill="#1a4078">temperature:</tspan> 0.7</text>
      <text x="60" y="300"><tspan font-weight="700" fill="#1a4078">max_tokens:</tspan>  200</text>
      <text x="60" y="330"><tspan font-weight="700" fill="#1a4078">tools:</tspan>       [...]</text>
      <text x="60" y="360"><tspan font-weight="700" fill="#1a4078">stream:</tspan>      false</text>
    </g>

    <line x1="60" y1="385" x2="380" y2="385" stroke="#1a4078" stroke-width="0.4" stroke-dasharray="3 2"/>
    <text x="60" y="412" font-size="11" font-style="italic" fill="#5a4a3a">Plus headers:</text>
    <text x="60" y="432" font-size="12" font-family="monospace" fill="#1a1a2e">Authorization: Bearer sk-...</text>
    <text x="60" y="452" font-size="12" font-family="monospace" fill="#1a1a2e">Content-Type: application/json</text>

    <text x="220" y="500" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">HTTP POST</text>
    <text x="220" y="520" font-size="11" font-family="monospace" text-anchor="middle" fill="#5a4a3a">/v1/chat/completions</text>
  </g>

  <!-- Middle arrow -->
  <line x1="400" y1="320" x2="490" y2="320" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- MIDDLE: Provider pipeline -->
  <g>
    <rect x="490" y="110" width="320" height="430" rx="10" fill="#1a1a2e" stroke="#0f3460" stroke-width="2"/>
    <text x="650" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">LLM Provider</text>
    <text x="650" y="166" font-size="12" font-style="italic" text-anchor="middle" fill="#cfd8e3">runs inference, billed per token</text>
    <line x1="510" y1="180" x2="790" y2="180" stroke="#cfd8e3" stroke-width="0.6"/>

    <g>
      <rect x="510" y="200" width="280" height="40" rx="6" fill="#2d2d4e" stroke="#444444" stroke-width="1"/>
      <text x="650" y="225" font-size="13" text-anchor="middle" fill="#ffffff">1. Validate + authenticate</text>

      <rect x="510" y="252" width="280" height="40" rx="6" fill="#2d2d4e" stroke="#444444" stroke-width="1"/>
      <text x="650" y="277" font-size="13" text-anchor="middle" fill="#ffffff">2. Tokenize input</text>

      <rect x="510" y="304" width="280" height="40" rx="6" fill="#2d2d4e" stroke="#444444" stroke-width="1"/>
      <text x="650" y="329" font-size="13" text-anchor="middle" fill="#ffffff">3. Run model inference</text>

      <rect x="510" y="356" width="280" height="40" rx="6" fill="#2d2d4e" stroke="#444444" stroke-width="1"/>
      <text x="650" y="381" font-size="13" text-anchor="middle" fill="#ffffff">4. Detokenize output</text>

      <rect x="510" y="408" width="280" height="40" rx="6" fill="#2d2d4e" stroke="#444444" stroke-width="1"/>
      <text x="650" y="433" font-size="13" text-anchor="middle" fill="#ffffff">5. Return JSON response</text>
    </g>

    <text x="650" y="500" font-size="11" font-style="italic" text-anchor="middle" fill="#cfd8e3">stateless: every request is fresh</text>
  </g>

  <line x1="810" y1="320" x2="900" y2="320" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- RIGHT: Response -->
  <g>
    <rect x="900" y="110" width="360" height="430" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="1080" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Response</text>
    <text x="1080" y="166" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">JSON body</text>
    <line x1="920" y1="180" x2="1240" y2="180" stroke="#1f7a3a" stroke-width="0.6"/>

    <g font-family="monospace" font-size="13" fill="#1a1a2e">
      <text x="920" y="210"><tspan font-weight="700" fill="#1f7a3a">id:</tspan>             "chatcmpl-..."</text>
      <text x="920" y="240"><tspan font-weight="700" fill="#1f7a3a">choices[0].message:</tspan></text>
      <text x="940" y="262">role: "assistant"</text>
      <text x="940" y="282">content: "..."</text>
      <text x="920" y="312"><tspan font-weight="700" fill="#1f7a3a">finish_reason:</tspan>  "stop"</text>
      <text x="920" y="342"><tspan font-weight="700" fill="#1f7a3a">usage:</tspan></text>
      <text x="940" y="362">prompt_tokens: 42</text>
      <text x="940" y="382">completion_tokens: 178</text>
      <text x="940" y="402">total_tokens: 220</text>
    </g>

    <line x1="920" y1="430" x2="1240" y2="430" stroke="#1f7a3a" stroke-width="0.4" stroke-dasharray="3 2"/>
    <text x="920" y="458" font-size="11" font-style="italic" fill="#5a4a3a">finish_reason values:</text>
    <text x="920" y="478" font-size="12" font-family="monospace" fill="#1a1a2e">"stop" · "length" ·</text>
    <text x="920" y="496" font-size="12" font-family="monospace" fill="#1a1a2e">"tool_calls" · "content_filter"</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="1180" height="100" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7a5e1a">Three things to remember</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">1. <tspan font-weight="700">Stateless</tspan> — to keep "context" you must resend the full message history every call.</text>
    <text x="20" y="72" font-size="12" fill="#1a1a2e">2. <tspan font-weight="700">Token-billed</tspan> — input AND output tokens count; usage tells you exactly what.</text>
    <text x="20" y="92" font-size="12" fill="#1a1a2e">3. <tspan font-weight="700">finish_reason</tspan> — always check it; "length" means truncated, "tool_calls" means a tool was requested.</text>
  </g>
</svg>
