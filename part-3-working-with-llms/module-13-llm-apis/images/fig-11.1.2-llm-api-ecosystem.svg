<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <title>The LLM API ecosystem: one app, five provider families, one wire format</title>
  <rect width="1100" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">The LLM API ecosystem</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">One app, five provider families, one HTTP+JSON pattern underneath</text>

  <g transform="translate(450, 90)">
    <rect width="200" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="100" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Your application</text>
  </g>

  <g transform="translate(60, 180)">
    <rect width="180" height="100" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="90" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">OpenAI</text>
    <text x="90" y="50" font-size="11" text-anchor="middle" fill="#1a1a2e">Chat Completions</text>
    <text x="90" y="72" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">GPT-4o, o3</text>
  </g>

  <g transform="translate(260, 180)">
    <rect width="180" height="100" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="90" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Anthropic</text>
    <text x="90" y="50" font-size="11" text-anchor="middle" fill="#1a1a2e">Messages API</text>
    <text x="90" y="72" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Claude Opus, Sonnet</text>
  </g>

  <g transform="translate(460, 180)">
    <rect width="180" height="100" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="90" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Google</text>
    <text x="90" y="50" font-size="11" text-anchor="middle" fill="#1a1a2e">Gemini API</text>
    <text x="90" y="72" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Gemini 2.5 Pro / Flash</text>
  </g>

  <g transform="translate(660, 180)">
    <rect width="180" height="100" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="90" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Enterprise gateways</text>
    <text x="90" y="50" font-size="11" text-anchor="middle" fill="#1a1a2e">Bedrock, Azure</text>
    <text x="90" y="72" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">IAM + data residency</text>
  </g>

  <g transform="translate(860, 180)">
    <rect width="180" height="100" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="90" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Open-source serving</text>
    <text x="90" y="50" font-size="11" text-anchor="middle" fill="#1a1a2e">vLLM, TGI, Ollama</text>
    <text x="90" y="72" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">self-hosted, compatible</text>
  </g>

  <g stroke="#1a1a2e" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <line x1="500" y1="140" x2="200" y2="178"/>
    <line x1="520" y1="140" x2="370" y2="178"/>
    <line x1="550" y1="140" x2="550" y2="178"/>
    <line x1="580" y1="140" x2="740" y2="178"/>
    <line x1="600" y1="140" x2="930" y2="178"/>
  </g>

  <g transform="translate(60, 320)">
    <rect width="980" height="80" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="490" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Common wire format: HTTP POST + JSON</text>
    <text x="490" y="54" font-size="12" text-anchor="middle" fill="#1a1a2e" font-family="Consolas, monospace">{ model, messages:[{role, content}], temperature, max_tokens, stream }</text>
    <text x="490" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">field names differ across providers; conversation-as-array shape is universal</text>
  </g>

  <g transform="translate(60, 420)">
    <rect width="320" height="76" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#a67c1a">Pricing</text>
    <text x="20" y="46" font-size="11" fill="#1a1a2e">Per-token, input cheaper than output.</text>
    <text x="20" y="62" font-size="11" fill="#5a4a3a">Cached prefixes typically 0.1x cost.</text>
  </g>
  <g transform="translate(390, 420)">
    <rect width="320" height="76" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#1a4078">Streaming</text>
    <text x="20" y="46" font-size="11" fill="#1a1a2e">Server-Sent Events deliver as produced.</text>
    <text x="20" y="62" font-size="11" fill="#5a4a3a">Lower time-to-first-token, same total.</text>
  </g>
  <g transform="translate(720, 420)">
    <rect width="320" height="76" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#b3401b">Rate limits</text>
    <text x="20" y="46" font-size="11" fill="#1a1a2e">RPM and TPM caps per tier.</text>
    <text x="20" y="62" font-size="11" fill="#5a4a3a">Plan retries with exponential backoff.</text>
  </g>

  <g transform="translate(60, 520)">
    <rect width="980" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">Every LLM API is a thin wrapper around the same exchange: send a list of role-tagged messages and parameters, receive a completion.</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">Learn one provider deeply; the rest become a matter of remapping field names and authentication.</text>
  </g>
</svg>
