<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The LLM API Ecosystem</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">One application, five provider families, one common HTTP+JSON pattern underneath.</text>

  <!-- Tier 1: Application -->
  <g>
    <rect x="540" y="92" width="220" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="650" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Your Application</text>
    <text x="650" y="132" font-size="11" text-anchor="middle" fill="#5a4a3a">SDK call or raw HTTP request</text>
  </g>

  <!-- Tier 2 label -->
  <text x="80" y="175" font-size="13" font-weight="700" fill="#5a4a3a">TIER 1 -- Provider families</text>
  <line x1="80" y1="182" x2="1220" y2="182" stroke="#d4c8b8" stroke-width="1"/>

  <!-- 5 provider columns -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- OpenAI -->
    <g transform="translate(80,200)">
      <rect width="210" height="120" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="105" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">OpenAI</text>
      <text x="105" y="44" font-size="12" text-anchor="middle" fill="#1a1a2e">Chat Completions</text>
      <text x="105" y="64" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">GPT-4o, o3, o4-mini</text>
      <text x="105" y="88" font-size="11" text-anchor="middle" fill="#1a1a2e">/v1/chat/completions</text>
      <text x="105" y="106" font-size="11" text-anchor="middle" fill="#5a4a3a">de-facto industry standard</text>
    </g>
    <!-- Anthropic -->
    <g transform="translate(310,200)">
      <rect width="210" height="120" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="105" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Anthropic</text>
      <text x="105" y="44" font-size="12" text-anchor="middle" fill="#1a1a2e">Messages API</text>
      <text x="105" y="64" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">Claude Opus, Sonnet, Haiku</text>
      <text x="105" y="88" font-size="11" text-anchor="middle" fill="#1a1a2e">/v1/messages</text>
      <text x="105" y="106" font-size="11" text-anchor="middle" fill="#5a4a3a">system prompt as top-level field</text>
    </g>
    <!-- Google -->
    <g transform="translate(540,200)">
      <rect width="210" height="120" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="105" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Google</text>
      <text x="105" y="44" font-size="12" text-anchor="middle" fill="#1a1a2e">Gemini API</text>
      <text x="105" y="64" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">Gemini 2.5 Pro / Flash</text>
      <text x="105" y="88" font-size="11" text-anchor="middle" fill="#1a1a2e">/v1beta/models/generate</text>
      <text x="105" y="106" font-size="11" text-anchor="middle" fill="#5a4a3a">"contents" + "parts" schema</text>
    </g>
    <!-- Enterprise -->
    <g transform="translate(770,200)">
      <rect width="210" height="120" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="105" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Enterprise gateways</text>
      <text x="105" y="44" font-size="12" text-anchor="middle" fill="#1a1a2e">AWS Bedrock, Azure OpenAI</text>
      <text x="105" y="64" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">multi-vendor behind one auth</text>
      <text x="105" y="88" font-size="11" text-anchor="middle" fill="#1a1a2e">IAM / VPC / data residency</text>
      <text x="105" y="106" font-size="11" text-anchor="middle" fill="#5a4a3a">audit logs, no-train guarantees</text>
    </g>
    <!-- Open Source -->
    <g transform="translate(1000,200)">
      <rect width="210" height="120" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
      <text x="105" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Open-source serving</text>
      <text x="105" y="44" font-size="12" text-anchor="middle" fill="#1a1a2e">vLLM, TGI, Ollama</text>
      <text x="105" y="64" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">Llama, Mistral, Qwen, DeepSeek</text>
      <text x="105" y="88" font-size="11" text-anchor="middle" fill="#1a1a2e">self-hosted, OpenAI-compatible</text>
      <text x="105" y="106" font-size="11" text-anchor="middle" fill="#5a4a3a">$/token = electricity + GPU time</text>
    </g>
  </g>

  <!-- Arrows from APP to providers -->
  <g stroke="#1a1a2e" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M 600 142 Q 500 160 185 200"/>
    <path d="M 625 142 Q 560 160 415 200"/>
    <path d="M 650 142 L 645 200"/>
    <path d="M 675 142 Q 740 160 875 200"/>
    <path d="M 700 142 Q 800 160 1105 200"/>
  </g>

  <!-- Tier 2 label -->
  <text x="80" y="365" font-size="13" font-weight="700" fill="#5a4a3a">TIER 2 -- The shared wire format</text>
  <line x1="80" y1="372" x2="1220" y2="372" stroke="#d4c8b8" stroke-width="1"/>

  <!-- Common pattern strip -->
  <g transform="translate(80,388)">
    <rect width="1140" height="76" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="570" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Common pattern: HTTP POST with a JSON body</text>
    <text x="570" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e" font-family="Consolas, monospace">{ model, messages:[{role, content}], temperature, max_tokens, stream }  -->  completion response</text>
    <text x="570" y="68" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">Field names differ across providers, but the conversation-as-array shape is universal.</text>
  </g>

  <!-- Arrows from providers down to common pattern -->
  <g stroke="#1a1a2e" stroke-width="1.2" fill="none" marker-end="url(#arr)">
    <path d="M 185 320 L 250 388"/>
    <path d="M 415 320 L 430 388"/>
    <path d="M 645 320 L 645 388"/>
    <path d="M 875 320 L 860 388"/>
    <path d="M 1105 320 L 1040 388"/>
  </g>

  <!-- Tier 3 label -->
  <text x="80" y="500" font-size="13" font-weight="700" fill="#5a4a3a">TIER 3 -- Operational concerns every caller meets</text>
  <line x1="80" y1="507" x2="1220" y2="507" stroke="#d4c8b8" stroke-width="1"/>

  <!-- Three concern cards -->
  <g>
    <g transform="translate(120,525)">
      <rect width="320" height="78" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="20" y="24" font-size="13" font-weight="700" fill="#7a5e1a">Pricing</text>
      <text x="20" y="46" font-size="11" fill="#1a1a2e">Per-token, input cheaper than output.</text>
      <text x="20" y="64" font-size="11" fill="#5a4a3a">Cached prompt prefixes typically 0.1x cost.</text>
    </g>
    <g transform="translate(490,525)">
      <rect width="320" height="78" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="20" y="24" font-size="13" font-weight="700" fill="#1a4078">Streaming</text>
      <text x="20" y="46" font-size="11" fill="#1a1a2e">Server-Sent Events deliver tokens as produced.</text>
      <text x="20" y="64" font-size="11" fill="#5a4a3a">Lower time-to-first-token, same total cost.</text>
    </g>
    <g transform="translate(860,525)">
      <rect width="320" height="78" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="20" y="24" font-size="13" font-weight="700" fill="#b3401b">Rate limits</text>
      <text x="20" y="46" font-size="11" fill="#1a1a2e">Per tier: requests/min and tokens/min caps.</text>
      <text x="20" y="64" font-size="11" fill="#5a4a3a">Plan retries with exponential backoff.</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80,640)">
    <rect width="1140" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Every LLM API is a thin wrapper around the same exchange: send a list of role-tagged messages and parameters, receive a completion.</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">Learn one provider deeply; the rest become a matter of remapping field names and authentication.</text>
  </g>
</svg>
