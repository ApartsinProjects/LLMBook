<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Three Levels of Structured Output</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">From "please return JSON" to grammar-constrained generation — each level trades flexibility for guarantees</text>

  <!-- Level 1 -->
  <g>
    <rect x="60" y="120" width="380" height="430" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="250" y="152" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">Level 1 · Prompt-based</text>
    <text x="250" y="174" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">"Please return JSON"</text>
    <line x1="80" y1="190" x2="420" y2="190" stroke="#7a5e1a" stroke-width="0.6"/>

    <text x="80" y="220" font-size="13" font-weight="700" fill="#1a1a2e">Reliability: ~85%</text>

    <text x="80" y="252" font-size="12" font-weight="600" fill="#1f7a3a">Pros</text>
    <text x="80" y="272" font-size="12" fill="#1a1a2e">+ trivial to implement</text>
    <text x="80" y="290" font-size="12" fill="#1a1a2e">+ works with ANY model / API</text>

    <text x="80" y="322" font-size="12" font-weight="600" fill="#b3401b">Cons</text>
    <text x="80" y="342" font-size="12" fill="#1a1a2e">− may include preamble text</text>
    <text x="80" y="360" font-size="12" fill="#1a1a2e">− no schema guarantee</text>
    <text x="80" y="378" font-size="12" fill="#1a1a2e">− still need to try/except parse</text>

    <line x1="80" y1="400" x2="420" y2="400" stroke="#7a5e1a" stroke-width="0.4" stroke-dasharray="3 2"/>
    <text x="250" y="425" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">Use when</text>
    <text x="80" y="450" font-size="12" fill="#1a1a2e">prototype, exploratory, no critical</text>
    <text x="80" y="468" font-size="12" fill="#1a1a2e">downstream parser, model is small or</text>
    <text x="80" y="486" font-size="12" fill="#1a1a2e">no API-level structured mode.</text>

    <rect x="80" y="510" width="340" height="30" rx="4" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
    <text x="250" y="530" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">"Return your answer as JSON"</text>
  </g>

  <!-- arrow → -->
  <line x1="445" y1="320" x2="490" y2="320" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Level 2 -->
  <g>
    <rect x="490" y="120" width="380" height="430" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="680" y="152" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">Level 2 · JSON mode</text>
    <text x="680" y="174" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">response_format: json_object</text>
    <line x1="510" y1="190" x2="850" y2="190" stroke="#1a4078" stroke-width="0.6"/>

    <text x="510" y="220" font-size="13" font-weight="700" fill="#1a1a2e">Reliability: ~98%</text>

    <text x="510" y="252" font-size="12" font-weight="600" fill="#1f7a3a">Pros</text>
    <text x="510" y="272" font-size="12" fill="#1a1a2e">+ always parseable JSON</text>
    <text x="510" y="290" font-size="12" fill="#1a1a2e">+ API-level guarantee (decoder forced)</text>

    <text x="510" y="322" font-size="12" font-weight="600" fill="#b3401b">Cons</text>
    <text x="510" y="342" font-size="12" fill="#1a1a2e">− schema NOT enforced</text>
    <text x="510" y="360" font-size="12" fill="#1a1a2e">− keys may vary or be missing</text>
    <text x="510" y="378" font-size="12" fill="#1a1a2e">− types may be wrong (e.g. string for int)</text>

    <line x1="510" y1="400" x2="850" y2="400" stroke="#1a4078" stroke-width="0.4" stroke-dasharray="3 2"/>
    <text x="680" y="425" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">Use when</text>
    <text x="510" y="450" font-size="12" fill="#1a1a2e">production-grade JSON safety needed</text>
    <text x="510" y="468" font-size="12" fill="#1a1a2e">but consumers are tolerant of</text>
    <text x="510" y="486" font-size="12" fill="#1a1a2e">flexible field shape (Pydantic + retry).</text>

    <rect x="510" y="510" width="340" height="30" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="680" y="530" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">response_format={"type":"json_object"}</text>
  </g>

  <line x1="875" y1="320" x2="920" y2="320" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Level 3 -->
  <g>
    <rect x="920" y="120" width="320" height="430" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="1080" y="152" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Level 3 · Schema-strict</text>
    <text x="1080" y="174" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">json_schema · strict: true</text>
    <line x1="940" y1="190" x2="1220" y2="190" stroke="#1f7a3a" stroke-width="0.6"/>

    <text x="940" y="220" font-size="13" font-weight="700" fill="#1a1a2e">Reliability: ~100%</text>

    <text x="940" y="252" font-size="12" font-weight="600" fill="#1f7a3a">Pros</text>
    <text x="940" y="272" font-size="12" fill="#1a1a2e">+ exact schema match</text>
    <text x="940" y="290" font-size="12" fill="#1a1a2e">+ type-safe fields</text>
    <text x="940" y="308" font-size="12" fill="#1a1a2e">+ enums enforced at decode time</text>

    <text x="940" y="340" font-size="12" font-weight="600" fill="#b3401b">Cons</text>
    <text x="940" y="360" font-size="12" fill="#1a1a2e">− provider-specific syntax</text>
    <text x="940" y="378" font-size="12" fill="#1a1a2e">− can hurt quality on hard tasks</text>

    <line x1="940" y1="400" x2="1220" y2="400" stroke="#1f7a3a" stroke-width="0.4" stroke-dasharray="3 2"/>
    <text x="1080" y="425" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Use when</text>
    <text x="940" y="450" font-size="12" fill="#1a1a2e">downstream code requires</text>
    <text x="940" y="468" font-size="12" fill="#1a1a2e">an exact contract — function</text>
    <text x="940" y="486" font-size="12" fill="#1a1a2e">calling, agent tools, eval pipelines.</text>

    <rect x="940" y="510" width="280" height="30" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
    <text x="1080" y="530" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a2e">"strict": true</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="1180" height="100" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7a5e1a">Choosing a level</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Default to Level 3 if your provider supports it (OpenAI, Anthropic, Gemini all do for most models). Drop to Level 2 when you need flexibility, Level 1 only for prototypes or when accessing models that don't support either.</text>
    <text x="20" y="78" font-size="12" font-style="italic" fill="#5a4a3a">Level 3's "structured generation" works by constraining the decoder's vocabulary at each step — the model literally cannot emit invalid tokens.</text>
  </g>
</svg>
