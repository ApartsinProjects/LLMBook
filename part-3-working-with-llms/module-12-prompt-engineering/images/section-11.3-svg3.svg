<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Automated prompt optimization (APO) loop</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">An optimizer LLM proposes new prompts from past prompts and their scores; the best ones survive.</text>

  <!-- Left side: history table -->
  <g transform="translate(60,110)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#1a1a2e">Optimization history</text>
    <text x="0" y="20" font-size="12" font-style="italic" fill="#5a4a3a">prompts tried so far, with validation scores</text>

    <rect x="0" y="36" width="500" height="380" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>

    <!-- table header -->
    <text x="20" y="62" font-size="12" font-weight="700" fill="#1a4078">Version</text>
    <text x="120" y="62" font-size="12" font-weight="700" fill="#1a4078">Prompt</text>
    <text x="450" y="62" font-size="12" font-weight="700" fill="#1a4078">Score</text>
    <line x1="10" y1="72" x2="490" y2="72" stroke="#1a4078" stroke-width="1" opacity="0.4"/>

    <!-- v1 -->
    <text x="20" y="96" font-size="12" font-weight="700" fill="#1a1a2e">v1</text>
    <text x="120" y="96" font-size="11" fill="#5a4a3a" font-style="italic">"Classify the text"</text>
    <text x="450" y="96" font-size="13" font-weight="700" fill="#b3401b">62%</text>

    <!-- v2 -->
    <text x="20" y="142" font-size="12" font-weight="700" fill="#1a1a2e">v2</text>
    <text x="120" y="142" font-size="11" fill="#5a4a3a" font-style="italic">"You are an expert sentiment</text>
    <text x="120" y="158" font-size="11" fill="#5a4a3a" font-style="italic">classifier. Label the text."</text>
    <text x="450" y="142" font-size="13" font-weight="700" fill="#b3401b">74%</text>

    <!-- v3 -->
    <text x="20" y="200" font-size="12" font-weight="700" fill="#1a1a2e">v3</text>
    <text x="120" y="200" font-size="11" fill="#5a4a3a" font-style="italic">"Analyze sentiment and explain</text>
    <text x="120" y="216" font-size="11" fill="#5a4a3a" font-style="italic">your reasoning briefly."</text>
    <text x="450" y="200" font-size="13" font-weight="700" fill="#7a5e1a">79%</text>

    <!-- v4 -->
    <text x="20" y="258" font-size="12" font-weight="700" fill="#1a1a2e">v4</text>
    <text x="120" y="258" font-size="11" fill="#5a4a3a" font-style="italic">"Rate the emotional tone on a</text>
    <text x="120" y="274" font-size="11" fill="#5a4a3a" font-style="italic">scale, then commit to a label."</text>
    <text x="450" y="258" font-size="13" font-weight="700" fill="#1f7a3a">85%</text>

    <!-- v5 (the new winner from this round) -->
    <rect x="6" y="290" width="488" height="52" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="312" font-size="12" font-weight="700" fill="#1f7a3a">v5 (new)</text>
    <text x="120" y="312" font-size="11" fill="#1a1a2e" font-style="italic">"Identify cue words first; weigh</text>
    <text x="120" y="328" font-size="11" fill="#1a1a2e" font-style="italic">them; then output the label."</text>
    <text x="450" y="320" font-size="14" font-weight="700" fill="#1f7a3a">88%</text>

    <text x="20" y="368" font-size="11" font-style="italic" fill="#5a4a3a">Trend: scores rise as the optimizer learns what kinds of</text>
    <text x="20" y="384" font-size="11" font-style="italic" fill="#5a4a3a">phrasing help on this validation set.</text>
  </g>

  <!-- Right side: loop -->
  <!-- Optimizer LLM -->
  <g transform="translate(700,140)">
    <rect x="0" y="0" width="540" height="130" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="270" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Optimizer LLM</text>
    <line x1="20" y1="42" x2="520" y2="42" stroke="#722f8a" stroke-width="1" opacity="0.4"/>
    <text x="270" y="66" font-size="12" text-anchor="middle" fill="#1a1a2e">Receives the history table as context.</text>
    <text x="270" y="86" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">"Given these past prompts and scores,</text>
    <text x="270" y="104" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">propose a new prompt likely to score higher."</text>
    <text x="270" y="122" font-size="11" text-anchor="middle" fill="#722f8a">-> emits candidate prompt</text>
  </g>

  <!-- arrow optimizer -> evaluator -->
  <line x1="970" y1="270" x2="970" y2="320" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="985" y="300" font-size="11" fill="#5a4a3a">candidate prompt</text>

  <!-- Evaluator -->
  <g transform="translate(700,320)">
    <rect x="0" y="0" width="540" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="270" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Evaluate on validation set</text>
    <line x1="20" y1="42" x2="520" y2="42" stroke="#1f7a3a" stroke-width="1" opacity="0.4"/>
    <text x="270" y="66" font-size="12" text-anchor="middle" fill="#1a1a2e">Run the candidate prompt across N held-out examples.</text>
    <text x="270" y="86" font-size="12" text-anchor="middle" fill="#1a1a2e">Compute accuracy (or any task metric).</text>
    <text x="270" y="108" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">e.g. v5 -> 88% on the dev split</text>
  </g>

  <!-- arrow evaluator -> append to history -->
  <line x1="970" y1="440" x2="970" y2="490" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="985" y="470" font-size="11" fill="#5a4a3a">score</text>

  <!-- Append to history -->
  <g transform="translate(700,490)">
    <rect x="0" y="0" width="540" height="80" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="270" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Append (prompt, score) to history</text>
    <text x="270" y="58" font-size="12" text-anchor="middle" fill="#1a1a2e">If score &gt; current best, keep as new champion.</text>
  </g>

  <!-- Loop arrow back to optimizer (across to history -> in to optimizer) -->
  <path d="M 700 530 L 580 530 L 580 600 L 970 600 L 970 270" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrPurple)"/>
  <rect x="640" y="608" width="280" height="28" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
  <text x="780" y="627" font-size="12" text-anchor="middle" font-weight="700" fill="#722f8a">repeat with updated history</text>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 670)">
    <rect x="0" y="0" width="1160" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Treat prompt design as search. An optimizer LLM proposes new prompts conditioned on the score history; evaluation on a held-out set tells</text>
    <text x="20" y="62" font-size="12" fill="#1a1a2e">you which to keep. No gradient descent, no fine-tuning -- just a loop driven by the model's own pattern recognition.</text>
  </g>
</svg>
