<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Anatomy of a Production Prompt</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">A prompt has two halves: a system message that fixes role and rules, and a user turn that supplies data and examples.</text>

  <!-- Left lane: System message -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="540" height="470" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="270" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">SYSTEM MESSAGE</text>
    <text x="270" y="52" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Persistent across the conversation</text>

    <!-- Role -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="480" height="80" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#722f8a">1. Role assignment</text>
      <text x="16" y="46" font-size="12" fill="#1a1a2e">"You are a senior Python developer."</text>
      <text x="16" y="66" font-size="11" font-style="italic" fill="#5a4a3a">Sets persona, expertise, and tone the model will adopt.</text>
    </g>

    <!-- Instructions -->
    <g transform="translate(30, 190)">
      <rect x="0" y="0" width="480" height="80" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#722f8a">2. Task instructions</text>
      <text x="16" y="46" font-size="12" fill="#1a1a2e">"Classify the following code snippets by bug type."</text>
      <text x="16" y="66" font-size="11" font-style="italic" fill="#5a4a3a">The verb-driven directive that defines the work.</text>
    </g>

    <!-- Output format -->
    <g transform="translate(30, 300)">
      <rect x="0" y="0" width="480" height="100" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#722f8a">3. Constraints and output format</text>
      <text x="16" y="46" font-size="12" fill="#1a1a2e">"Output JSON with keys: bug_type, severity, fix."</text>
      <text x="16" y="66" font-size="11" font-style="italic" fill="#5a4a3a">Schema, prohibitions, safety rules. Parsed downstream,</text>
      <text x="16" y="84" font-size="11" font-style="italic" fill="#5a4a3a">so be exact about field names and types.</text>
    </g>

    <!-- Arrows down the lane -->
    <line x1="270" y1="160" x2="270" y2="190" stroke="#722f8a" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="270" y1="270" x2="270" y2="300" stroke="#722f8a" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- Right lane: User message -->
  <g transform="translate(680, 100)">
    <rect x="0" y="0" width="540" height="470" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="270" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">USER TURN</text>
    <text x="270" y="52" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Sent fresh on each request</text>

    <!-- Few-shot -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="480" height="100" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#1f7a3a">A. Few-shot examples (optional)</text>
      <text x="16" y="46" font-size="12" fill="#1a1a2e">User: example input</text>
      <text x="16" y="64" font-size="12" fill="#1a1a2e">Assistant: example output (canonical JSON)</text>
      <text x="16" y="84" font-size="11" font-style="italic" fill="#5a4a3a">Two to five demonstrations anchor the format.</text>
    </g>

    <!-- Context -->
    <g transform="translate(30, 210)">
      <rect x="0" y="0" width="480" height="80" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#1f7a3a">B. Context (if any)</text>
      <text x="16" y="46" font-size="12" fill="#1a1a2e">Retrieved docs, prior turns, file excerpts.</text>
      <text x="16" y="66" font-size="11" font-style="italic" fill="#5a4a3a">Grounds the model in specific facts.</text>
    </g>

    <!-- Query -->
    <g transform="translate(30, 320)">
      <rect x="0" y="0" width="480" height="80" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#1f7a3a">C. Input data / query</text>
      <text x="16" y="46" font-size="12" fill="#1a1a2e">The actual code snippet to classify.</text>
      <text x="16" y="66" font-size="11" font-style="italic" fill="#5a4a3a">Placed last so the model sees it most recently.</text>
    </g>

    <line x1="270" y1="180" x2="270" y2="210" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="270" y1="290" x2="270" y2="320" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- Cross-lane connection -->
  <line x1="620" y1="335" x2="680" y2="335" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <text x="650" y="328" font-size="11" text-anchor="middle" fill="#5a4a3a">applies to</text>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Separate stable rules (system) from per-call payload (user). Few-shot examples sit on the user side so they can vary by request without retraining your prompt template.</text>
  </g>
</svg>
