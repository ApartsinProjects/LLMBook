<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="900" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Mid-2026 API models on the price-quality Pareto frontier</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Input price per million tokens (log scale) vs LM Arena Elo. Frontier = no cheaper option at this quality.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="700" y="820" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e">Input price (USD per 1M tokens, log scale)</text>
  <text x="60" y="450" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 60 450)">Quality (LM Arena Elo)</text>

  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="160" y1="780" x2="1320" y2="780"/>
    <line x1="160" y1="660" x2="1320" y2="660"/>
    <line x1="160" y1="540" x2="1320" y2="540"/>
    <line x1="160" y1="420" x2="1320" y2="420"/>
    <line x1="160" y1="300" x2="1320" y2="300"/>
    <line x1="160" y1="180" x2="1320" y2="180"/>
  </g>
  <g font-size="11" fill="#5a4a3a" text-anchor="end">
    <text x="150" y="784">1200</text>
    <text x="150" y="664">1240</text>
    <text x="150" y="544">1280</text>
    <text x="150" y="424">1320</text>
    <text x="150" y="304">1360</text>
    <text x="150" y="184">1400</text>
  </g>

  <line x1="160" y1="180" x2="160" y2="780" stroke="#1a1a2e" stroke-width="1.2"/>
  <line x1="160" y1="780" x2="1320" y2="780" stroke="#1a1a2e" stroke-width="1.2"/>

  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="368" y1="180" x2="368" y2="780"/>
    <line x1="624" y1="180" x2="624" y2="780"/>
    <line x1="880" y1="180" x2="880" y2="780"/>
    <line x1="1136" y1="180" x2="1136" y2="780"/>
  </g>
  <g font-size="11" fill="#5a4a3a" text-anchor="middle">
    <text x="160" y="800">$0.10</text>
    <text x="368" y="800">$0.50</text>
    <text x="624" y="800">$1</text>
    <text x="880" y="800">$5</text>
    <text x="1136" y="800">$15</text>
    <text x="1320" y="800">$50</text>
  </g>

  <polyline points="218,520 510,400 720,300 880,240" fill="none" stroke="#d4b96a" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="500" y="240" font-size="13" font-style="italic" fill="#a67c1a" font-weight="600">Pareto frontier (cheap to flagship)</text>
  <text x="500" y="258" font-size="11" font-style="italic" fill="#5a4a3a">no cheaper option at this quality</text>

  <g>
    <circle cx="218" cy="520" r="11" fill="#1a4078" stroke="#0a2040" stroke-width="2"/>
    <text x="218" y="498" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">Gemini 2.5 Flash</text>
    <text x="218" y="555" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">$0.15</text>
  </g>

  <g>
    <circle cx="280" cy="500" r="11" fill="#1a4078" stroke="#0a2040" stroke-width="2"/>
    <text x="280" y="478" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">Llama 3.3 70B</text>
    <text x="280" y="540" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">$0.30</text>
  </g>

  <g>
    <circle cx="318" cy="440" r="11" fill="#1a4078" stroke="#0a2040" stroke-width="2"/>
    <text x="318" y="418" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">DeepSeek-V3.1</text>
    <text x="318" y="478" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">$0.27</text>
  </g>

  <g>
    <circle cx="510" cy="400" r="11" fill="#1a4078" stroke="#0a2040" stroke-width="2"/>
    <text x="510" y="378" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">GPT-5-mini</text>
    <text x="510" y="435" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">$0.25</text>
  </g>

  <g>
    <circle cx="720" cy="300" r="11" fill="#1f7a3a" stroke="#0a4020" stroke-width="2"/>
    <text x="720" y="278" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Claude Haiku 4.5</text>
    <text x="720" y="335" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">$1</text>
  </g>

  <g>
    <circle cx="788" cy="230" r="11" fill="#1f7a3a" stroke="#0a4020" stroke-width="2"/>
    <text x="788" y="208" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Gemini 2.5 Pro</text>
    <text x="788" y="265" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">$2</text>
  </g>

  <g>
    <circle cx="880" cy="240" r="11" fill="#1f7a3a" stroke="#0a4020" stroke-width="2"/>
    <text x="880" y="218" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">GPT-5</text>
    <text x="880" y="275" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">$3</text>
  </g>

  <g>
    <circle cx="1136" cy="210" r="11" fill="#722f8a" stroke="#3a164a" stroke-width="2"/>
    <text x="1136" y="188" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Claude Opus 4.5</text>
    <text x="1136" y="245" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">$15</text>
  </g>

  <g transform="translate(1050, 470)">
    <rect x="0" y="0" width="260" height="120" rx="6" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>
    <text x="130" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Legend</text>
    <circle cx="22" cy="42" r="8" fill="#1a4078" stroke="#0a2040" stroke-width="1.5"/>
    <text x="38" y="46" font-size="11" fill="#1a1a2e">Cheap tier (under $0.50)</text>
    <circle cx="22" cy="66" r="8" fill="#1f7a3a" stroke="#0a4020" stroke-width="1.5"/>
    <text x="38" y="70" font-size="11" fill="#1a1a2e">Mid tier ($1 - $5)</text>
    <circle cx="22" cy="90" r="8" fill="#722f8a" stroke="#3a164a" stroke-width="1.5"/>
    <text x="38" y="94" font-size="11" fill="#1a1a2e">Flagship tier ($15+)</text>
    <line x1="6" y1="110" x2="38" y2="110" stroke="#d4b96a" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="44" y="114" font-size="11" fill="#1a1a2e">Pareto frontier</text>
  </g>

  <g transform="translate(160, 850)">
    <rect x="0" y="0" width="1160" height="44" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="20" font-size="13" font-weight="700" fill="#a67c1a">Routing pattern</text>
    <text x="20" y="38" font-size="12" fill="#1a1a2e">Default to a Pareto-frontier point at the cheap end (Gemini 2.5 Flash or GPT-5-mini); escalate to a flagship only when your own eval shows a real quality gap.</text>
  </g>
</svg>
