<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>From production logs to training datasets</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrLD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">From production logs to training datasets</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Four stages turn raw chat traffic into four artifacts</text>

  <!-- Sources -->
  <g transform="translate(40, 110)">
    <rect width="180" height="220" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Sources</text>
    <text x="90" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">raw, sensitive</text>

    <rect x="15" y="70" width="150" height="40" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
    <text x="90" y="94" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Chat logs</text>

    <rect x="15" y="120" width="150" height="40" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
    <text x="90" y="144" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Tool traces</text>

    <rect x="15" y="170" width="150" height="40" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
    <text x="90" y="194" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">User feedback</text>
  </g>

  <line x1="225" y1="220" x2="265" y2="220" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrLD)"/>

  <!-- Extract -->
  <g transform="translate(270, 110)">
    <rect width="160" height="220" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="80" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">1. Extract</text>
    <text x="80" y="76" font-size="11" text-anchor="middle" fill="#1a1a2e">parse, group, join</text>
    <text x="80" y="112" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">conversations + feedback</text>
    <text x="80" y="170" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">jq, polars, duckdb</text>
  </g>

  <line x1="435" y1="220" x2="475" y2="220" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrLD)"/>

  <!-- Normalize -->
  <g transform="translate(480, 110)">
    <rect width="160" height="220" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="80" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. Normalize</text>
    <text x="80" y="76" font-size="11" text-anchor="middle" fill="#1a1a2e">dedup, UTC, hash IDs</text>
    <text x="80" y="112" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">duplicates dominate traffic</text>
    <text x="80" y="170" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">simhash, minhash</text>
  </g>

  <line x1="645" y1="220" x2="685" y2="220" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrLD)"/>

  <!-- Filter -->
  <g transform="translate(690, 110)">
    <rect width="160" height="220" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="80" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">3. Filter</text>
    <text x="80" y="76" font-size="11" text-anchor="middle" fill="#1a1a2e">PII redact, quality</text>
    <text x="80" y="112" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">non-negotiable gate</text>
    <text x="80" y="170" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">presidio, detoxify</text>
  </g>

  <line x1="855" y1="220" x2="895" y2="220" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrLD)"/>

  <!-- Format / four outputs -->
  <g transform="translate(900, 110)">
    <rect width="160" height="220" rx="10" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="80" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">4. Format</text>

    <rect x="15" y="50" width="130" height="34" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
    <text x="80" y="72" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">SFT</text>

    <rect x="15" y="92" width="130" height="34" rx="4" fill="#ffffff" stroke="#b3401b" stroke-width="1.2"/>
    <text x="80" y="114" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">DPO</text>

    <rect x="15" y="134" width="130" height="34" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
    <text x="80" y="156" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">Tool-use</text>

    <rect x="15" y="176" width="130" height="34" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
    <text x="80" y="198" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">Eval (held out)</text>
  </g>

  <!-- Privacy gate -->
  <g transform="translate(40, 360)">
    <rect width="1020" height="60" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="2"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#a67c1a">Privacy gate</text>
    <text x="20" y="48" font-size="11" font-style="italic" fill="#1a1a2e">No row leaves Stage 3 with raw PII. Training data is a regulated derivative, not a copy.</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 440)">
    <rect width="1020" height="120" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Production traffic is a goldmine, with discipline</text>
    <text x="510" y="62" font-size="12" text-anchor="middle" fill="#1a1a2e">Extract, normalize, filter, then fan out.</text>
    <text x="510" y="88" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">One cleaned stream feeds four datasets; each training method consumes its own shape.</text>
  </g>
</svg>
