<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">From Production Logs to Training Datasets</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">A four-stage pipeline that turns raw chat traffic into four distinct, ready-to-train artifacts.</text>

  <!-- Sources column -->
  <g transform="translate(40,110)">
    <rect width="220" height="430" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="110" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Production sources</text>
    <text x="110" y="52" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">raw, noisy, sensitive</text>

    <g transform="translate(20,80)">
      <rect width="180" height="90" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#722f8a">Chat logs</text>
      <text x="14" y="42" font-size="11" fill="#1a1a2e">user + assistant turns</text>
      <text x="14" y="58" font-size="11" fill="#5a4a3a">JSONL, append-only</text>
      <text x="14" y="76" font-size="11" fill="#5a4a3a">timestamped per request</text>
    </g>

    <g transform="translate(20,190)">
      <rect width="180" height="90" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#722f8a">Tool traces</text>
      <text x="14" y="42" font-size="11" fill="#1a1a2e">function calls + results</text>
      <text x="14" y="58" font-size="11" fill="#5a4a3a">arguments, return values,</text>
      <text x="14" y="76" font-size="11" fill="#5a4a3a">errors, retry counts</text>
    </g>

    <g transform="translate(20,300)">
      <rect width="180" height="90" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#722f8a">User feedback</text>
      <text x="14" y="42" font-size="11" fill="#1a1a2e">thumbs up / thumbs down</text>
      <text x="14" y="58" font-size="11" fill="#5a4a3a">edits, regenerations,</text>
      <text x="14" y="76" font-size="11" fill="#5a4a3a">"copy" or "share" events</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 265 325 L 305 325" stroke="#1a1a2e" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Stage 1: Extract -->
  <g transform="translate(310,110)">
    <rect width="180" height="430" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">1. Extract</text>
    <g transform="translate(15,60)">
      <text x="0" y="14" font-size="11" font-weight="700" fill="#1a4078">What it does</text>
      <text x="0" y="34" font-size="11" fill="#1a1a2e">Parse JSONL records.</text>
      <text x="0" y="50" font-size="11" fill="#1a1a2e">Group turns into</text>
      <text x="0" y="66" font-size="11" fill="#1a1a2e">conversations by session.</text>
      <text x="0" y="86" font-size="11" fill="#1a1a2e">Join feedback events on</text>
      <text x="0" y="102" font-size="11" fill="#1a1a2e">turn_id keys.</text>

      <text x="0" y="138" font-size="11" font-weight="700" fill="#1a4078">Watch out for</text>
      <text x="0" y="158" font-size="11" fill="#5a4a3a">- truncated logs</text>
      <text x="0" y="174" font-size="11" fill="#5a4a3a">- missing tool replies</text>
      <text x="0" y="190" font-size="11" fill="#5a4a3a">- orphan feedback rows</text>

      <text x="0" y="226" font-size="11" font-weight="700" fill="#1a4078">Tools</text>
      <text x="0" y="246" font-size="11" fill="#5a4a3a" font-family="Consolas, monospace">jq, polars, duckdb</text>

      <text x="0" y="282" font-size="11" font-style="italic" fill="#5a4a3a">Output: rows of</text>
      <text x="0" y="298" font-size="11" font-style="italic" fill="#5a4a3a">complete conversations</text>
    </g>
  </g>

  <path d="M 495 325 L 525 325" stroke="#1a1a2e" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Stage 2: Normalize -->
  <g transform="translate(530,110)">
    <rect width="180" height="430" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. Normalize</text>
    <g transform="translate(15,60)">
      <text x="0" y="14" font-size="11" font-weight="700" fill="#1f7a3a">What it does</text>
      <text x="0" y="34" font-size="11" fill="#1a1a2e">Deduplicate identical</text>
      <text x="0" y="50" font-size="11" fill="#1a1a2e">turns and prompts.</text>
      <text x="0" y="70" font-size="11" fill="#1a1a2e">Convert all timestamps</text>
      <text x="0" y="86" font-size="11" fill="#1a1a2e">to UTC.</text>
      <text x="0" y="106" font-size="11" fill="#1a1a2e">Resolve user IDs to</text>
      <text x="0" y="122" font-size="11" fill="#1a1a2e">stable hashes.</text>

      <text x="0" y="158" font-size="11" font-weight="700" fill="#1f7a3a">Why it matters</text>
      <text x="0" y="178" font-size="11" fill="#5a4a3a">Duplicates dominate</text>
      <text x="0" y="194" font-size="11" fill="#5a4a3a">production traffic and</text>
      <text x="0" y="210" font-size="11" fill="#5a4a3a">silently bias training.</text>

      <text x="0" y="246" font-size="11" font-weight="700" fill="#1f7a3a">Tools</text>
      <text x="0" y="266" font-size="11" fill="#5a4a3a" font-family="Consolas, monospace">simhash, minhash,</text>
      <text x="0" y="282" font-size="11" fill="#5a4a3a" font-family="Consolas, monospace">pandas, datasketch</text>
    </g>
  </g>

  <path d="M 715 325 L 745 325" stroke="#1a1a2e" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Stage 3: Filter -->
  <g transform="translate(750,110)">
    <rect width="180" height="430" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">3. Filter</text>
    <g transform="translate(15,60)">
      <text x="0" y="14" font-size="11" font-weight="700" fill="#b3401b">What it does</text>
      <text x="0" y="34" font-size="11" fill="#1a1a2e">Redact PII (names,</text>
      <text x="0" y="50" font-size="11" fill="#1a1a2e">emails, IDs, addresses).</text>
      <text x="0" y="70" font-size="11" fill="#1a1a2e">Score quality, drop</text>
      <text x="0" y="86" font-size="11" fill="#1a1a2e">low-confidence rows.</text>
      <text x="0" y="106" font-size="11" fill="#1a1a2e">Remove toxic content.</text>
      <text x="0" y="126" font-size="11" fill="#1a1a2e">Apply length bounds.</text>

      <text x="0" y="162" font-size="11" font-weight="700" fill="#b3401b">Non-negotiable</text>
      <text x="0" y="182" font-size="11" fill="#5a4a3a">Run PII redaction first;</text>
      <text x="0" y="198" font-size="11" fill="#5a4a3a">all later stages assume</text>
      <text x="0" y="214" font-size="11" fill="#5a4a3a">data is clean.</text>

      <text x="0" y="250" font-size="11" font-weight="700" fill="#b3401b">Tools</text>
      <text x="0" y="270" font-size="11" fill="#5a4a3a" font-family="Consolas, monospace">presidio, fasttext,</text>
      <text x="0" y="286" font-size="11" fill="#5a4a3a" font-family="Consolas, monospace">detoxify, regex</text>
    </g>
  </g>

  <path d="M 935 325 L 965 325" stroke="#1a1a2e" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Stage 4: Format, four outputs -->
  <g transform="translate(970,90)">
    <rect width="290" height="470" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="145" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">4. Format -- four outputs</text>
    <text x="145" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">one clean stream, four shapes</text>

    <g transform="translate(15,68)">
      <rect width="260" height="90" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#1a4078">SFT dataset</text>
      <text x="14" y="40" font-size="11" fill="#5a4a3a" font-family="Consolas, monospace">{instruction, response}</text>
      <text x="14" y="58" font-size="11" fill="#1a1a2e">Trains base behavior; the</text>
      <text x="14" y="74" font-size="11" fill="#1a1a2e">target output is the gold answer.</text>
    </g>

    <g transform="translate(15,170)">
      <rect width="260" height="90" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#b3401b">DPO dataset</text>
      <text x="14" y="40" font-size="11" fill="#5a4a3a" font-family="Consolas, monospace">{prompt, chosen, rejected}</text>
      <text x="14" y="58" font-size="11" fill="#1a1a2e">Built from thumbs-up vs</text>
      <text x="14" y="74" font-size="11" fill="#1a1a2e">thumbs-down on the same prompt.</text>
    </g>

    <g transform="translate(15,272)">
      <rect width="260" height="90" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#1f7a3a">Tool-use dataset</text>
      <text x="14" y="40" font-size="11" fill="#5a4a3a" font-family="Consolas, monospace">{call, schema, response}</text>
      <text x="14" y="58" font-size="11" fill="#1a1a2e">Sourced from tool traces;</text>
      <text x="14" y="74" font-size="11" fill="#1a1a2e">teaches function calling shape.</text>
    </g>

    <g transform="translate(15,374)">
      <rect width="260" height="80" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#722f8a">Eval dataset</text>
      <text x="14" y="40" font-size="11" fill="#5a4a3a" font-family="Consolas, monospace">{query, expected}</text>
      <text x="14" y="58" font-size="11" fill="#1a1a2e">Held out; never used for</text>
      <text x="14" y="72" font-size="11" fill="#1a1a2e">training. Measures regression.</text>
    </g>
  </g>

  <!-- Privacy callout -->
  <g transform="translate(40,580)">
    <rect width="1220" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Privacy gate</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">No row leaves Stage 3 with raw PII. Track every redaction; the training set is a regulated derivative of production traffic, not a copy of it.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40,660)">
    <rect width="1220" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Production traffic is a goldmine, but only after extract -- normalize -- filter discipline.</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">The same cleaned stream then forks into four datasets; each downstream training method (SFT, DPO, tool-use, eval) consumes the shape that fits it.</text>
  </g>
</svg>
