<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The DSPy Optimization Loop</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Define the contract, let the optimizer search prompts, compile the winner.</text>

  <!-- Phase 1: Define -->
  <g transform="translate(40,110)">
    <rect width="300" height="540" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="150" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">1. Define</text>
    <text x="150" y="52" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">You write code, not prompts</text>

    <g transform="translate(20,80)">
      <rect width="260" height="80" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a4078">Signature</text>
      <text x="14" y="42" font-size="11" fill="#1a1a2e">Input/output contract</text>
      <text x="14" y="60" font-size="11" fill="#5a4a3a" font-family="Consolas, monospace">"question -&gt; answer"</text>
      <text x="14" y="74" font-size="11" fill="#5a4a3a">declarative, not a prompt string</text>
    </g>

    <g transform="translate(20,180)">
      <rect width="260" height="80" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a4078">Module</text>
      <text x="14" y="42" font-size="11" fill="#1a1a2e">Reasoning strategy wrapper</text>
      <text x="14" y="60" font-size="11" fill="#5a4a3a" font-family="Consolas, monospace">Predict, ChainOfThought,</text>
      <text x="14" y="74" font-size="11" fill="#5a4a3a" font-family="Consolas, monospace">ReAct, ProgramOfThought</text>
    </g>

    <g transform="translate(20,280)">
      <rect width="260" height="80" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a4078">Metric</text>
      <text x="14" y="42" font-size="11" fill="#1a1a2e">A function that scores outputs</text>
      <text x="14" y="60" font-size="11" fill="#5a4a3a">accuracy, F1, exact-match,</text>
      <text x="14" y="74" font-size="11" fill="#5a4a3a">or a custom LLM-as-judge call</text>
    </g>

    <g transform="translate(20,390)">
      <rect width="260" height="130" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Why this layer matters</text>
      <text x="14" y="44" font-size="11" fill="#1a1a2e">You commit only to the shape of</text>
      <text x="14" y="60" font-size="11" fill="#1a1a2e">the task, never to wording.</text>
      <text x="14" y="82" font-size="11" fill="#1a1a2e">When the model changes (GPT-4o</text>
      <text x="14" y="98" font-size="11" fill="#1a1a2e">to Claude), you re-compile;</text>
      <text x="14" y="114" font-size="11" fill="#1a1a2e">no prompt rewriting required.</text>
    </g>
  </g>

  <!-- Arrow Define -> Optimize -->
  <path d="M 345 380 L 405 380" stroke="#1a1a2e" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Phase 2: Optimize (the cycle) -->
  <g transform="translate(410,110)">
    <rect width="540" height="540" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="270" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">2. Optimize -- the search loop</text>
    <text x="270" y="52" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">The optimizer proposes; the dev set decides; the loop tightens.</text>

    <!-- Cycle nodes arranged in a square -->
    <!-- Top: Training Examples -->
    <g transform="translate(180,80)">
      <rect width="180" height="64" rx="32" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="90" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Training examples</text>
      <text x="90" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">10 to 200 input/output pairs</text>
    </g>

    <!-- Right: Optimizer -->
    <g transform="translate(360,200)">
      <rect width="160" height="80" rx="8" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="2"/>
      <text x="80" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Optimizer</text>
      <text x="80" y="48" font-size="11" text-anchor="middle" fill="#ffffff">BootstrapFewShot</text>
      <text x="80" y="64" font-size="11" text-anchor="middle" fill="#ffffff">MIPROv2, COPRO</text>
    </g>

    <!-- Bottom: Evaluate -->
    <g transform="translate(180,330)">
      <rect width="180" height="64" rx="32" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="90" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Evaluate on dev set</text>
      <text x="90" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">run candidates, score with metric</text>
    </g>

    <!-- Left: Refine -->
    <g transform="translate(20,200)">
      <rect width="160" height="80" rx="8" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="80" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Refine</text>
      <text x="80" y="46" font-size="11" text-anchor="middle" fill="#5a4a3a">tweak instructions</text>
      <text x="80" y="62" font-size="11" text-anchor="middle" fill="#5a4a3a">+ swap demonstrations</text>
    </g>

    <!-- Cycle arrows -->
    <g stroke="#722f8a" stroke-width="2" fill="none" marker-end="url(#arrPurple)">
      <path d="M 360 130 Q 420 160 440 200"/>
      <path d="M 440 280 Q 420 320 360 350"/>
      <path d="M 180 350 Q 120 320 100 280"/>
      <path d="M 100 200 Q 120 160 180 130"/>
    </g>

    <!-- Center label -->
    <g transform="translate(220,210)">
      <text x="50" y="14" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">iterate until</text>
      <text x="50" y="30" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">metric plateaus</text>
      <text x="50" y="50" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">~10 to 50 rounds</text>
      <text x="50" y="66" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">typical for MIPROv2</text>
    </g>

    <!-- Inner annotations -->
    <g transform="translate(20,420)">
      <rect width="500" height="100" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">What is being optimized?</text>
      <text x="14" y="42" font-size="11" fill="#1a1a2e">- The instruction text inside the prompt template</text>
      <text x="14" y="58" font-size="11" fill="#1a1a2e">- Which few-shot demonstrations get included</text>
      <text x="14" y="74" font-size="11" fill="#1a1a2e">- The order and format of those demonstrations</text>
      <text x="14" y="90" font-size="11" fill="#5a4a3a" font-style="italic">Model weights are never touched -- this is purely prompt search.</text>
    </g>
  </g>

  <!-- Arrow Optimize -> Compile -->
  <path d="M 955 380 L 1015 380" stroke="#1a1a2e" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Phase 3: Compile -->
  <g transform="translate(1020,110)">
    <rect width="240" height="540" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="120" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. Compile</text>
    <text x="120" y="52" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">Frozen artifact, ready to ship</text>

    <g transform="translate(20,80)">
      <rect width="200" height="220" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="100" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Optimized prompt</text>
      <line x1="14" y1="38" x2="186" y2="38" stroke="#1f7a3a" stroke-width="0.8" stroke-dasharray="3,2"/>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#1a1a2e">Instructions</text>
      <text x="14" y="74" font-size="11" fill="#5a4a3a">refined natural-language</text>
      <text x="14" y="88" font-size="11" fill="#5a4a3a">task description</text>
      <text x="14" y="116" font-size="11" font-weight="700" fill="#1a1a2e">Few-shot examples</text>
      <text x="14" y="132" font-size="11" fill="#5a4a3a">k chosen demonstrations</text>
      <text x="14" y="146" font-size="11" fill="#5a4a3a">in the proven order</text>
      <text x="14" y="174" font-size="11" font-weight="700" fill="#1a1a2e">Output format</text>
      <text x="14" y="190" font-size="11" fill="#5a4a3a">parser, JSON schema, or</text>
      <text x="14" y="204" font-size="11" fill="#5a4a3a">structured fields</text>
    </g>

    <g transform="translate(20,320)">
      <rect width="200" height="200" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Use when</text>
      <text x="14" y="44" font-size="11" fill="#1a1a2e">- You can write a metric</text>
      <text x="14" y="60" font-size="11" fill="#1a1a2e">- You have &gt;= 20 examples</text>
      <text x="14" y="76" font-size="11" fill="#1a1a2e">- Quality matters more</text>
      <text x="14" y="92" font-size="11" fill="#1a1a2e">  than per-call latency</text>
      <text x="14" y="118" font-size="12" font-weight="700" fill="#7a5e1a">Skip when</text>
      <text x="14" y="140" font-size="11" fill="#1a1a2e">- One-shot exploratory</text>
      <text x="14" y="156" font-size="11" fill="#1a1a2e">  prompts</text>
      <text x="14" y="172" font-size="11" fill="#1a1a2e">- No labeled data and</text>
      <text x="14" y="188" font-size="11" fill="#1a1a2e">  no judge model available</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40,680)">
    <rect width="1220" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">DSPy turns prompt engineering into program compilation: you specify a contract and a metric; the optimizer searches the prompt space and emits the best-scoring artifact.</text>
  </g>
</svg>
