<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>The DSPy optimization loop</title>
  <rect width="1100" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrDSPy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
    <marker id="arrDSPyP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">DSPy optimization loop</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Define the contract; let the optimizer search prompts; compile the winner</text>

  <!-- Phase 1: Define -->
  <g transform="translate(40, 110)">
    <rect width="280" height="320" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="140" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">1. Define</text>
    <text x="140" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">you write code, not prompts</text>

    <rect x="20" y="74" width="240" height="60" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="140" y="96" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Signature</text>
    <text x="140" y="118" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">input/output contract</text>

    <rect x="20" y="146" width="240" height="60" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="140" y="168" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Module</text>
    <text x="140" y="190" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Predict, ChainOfThought, ReAct</text>

    <rect x="20" y="218" width="240" height="60" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="140" y="240" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Metric</text>
    <text x="140" y="262" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">function scoring outputs</text>
  </g>

  <line x1="328" y1="270" x2="370" y2="270" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrDSPy)"/>

  <!-- Phase 2: Optimize -->
  <g transform="translate(380, 110)">
    <rect width="360" height="320" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="180" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">2. Optimize</text>
    <text x="180" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">propose, score, refine</text>

    <!-- Top: Training Examples -->
    <rect x="100" y="74" width="160" height="44" rx="22" fill="#ffffff" stroke="#722f8a" stroke-width="1.8"/>
    <text x="180" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Training examples</text>

    <!-- Right: Optimizer -->
    <rect x="240" y="138" width="100" height="60" rx="8" fill="#722f8a" stroke="#722f8a" stroke-width="1.5"/>
    <text x="290" y="160" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Optimizer</text>
    <text x="290" y="178" font-size="10" text-anchor="middle" fill="#ffffff">MIPROv2</text>

    <!-- Bottom: Evaluate -->
    <rect x="100" y="218" width="160" height="44" rx="22" fill="#ffffff" stroke="#722f8a" stroke-width="1.8"/>
    <text x="180" y="244" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Evaluate on dev set</text>

    <!-- Left: Refine -->
    <rect x="20" y="138" width="100" height="60" rx="8" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="70" y="160" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Refine</text>
    <text x="70" y="178" font-size="10" text-anchor="middle" fill="#5a4a3a">demos, instr</text>

    <!-- Cycle arrows -->
    <g stroke="#722f8a" stroke-width="2" fill="none" marker-end="url(#arrDSPyP)">
      <path d="M 240 110 Q 280 130 290 138"/>
      <path d="M 290 198 Q 280 230 240 240"/>
      <path d="M 120 240 Q 80 230 70 198"/>
      <path d="M 70 138 Q 80 130 120 110"/>
    </g>

    <text x="180" y="284" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">~10 to 50 rounds; model weights never touched</text>
  </g>

  <line x1="748" y1="270" x2="790" y2="270" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrDSPy)"/>

  <!-- Phase 3: Compile -->
  <g transform="translate(800, 110)">
    <rect width="260" height="320" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="130" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. Compile</text>
    <text x="130" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">frozen artifact</text>

    <rect x="20" y="74" width="220" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="130" y="96" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Instructions</text>
    <text x="130" y="118" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">refined natural language</text>

    <rect x="20" y="146" width="220" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="130" y="168" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Few-shot examples</text>
    <text x="130" y="190" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">k demos, proven order</text>

    <rect x="20" y="218" width="220" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="130" y="240" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Output parser</text>
    <text x="130" y="262" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">JSON schema / fields</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 460)">
    <rect width="1020" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Prompt engineering as program compilation</text>
    <text x="510" y="54" font-size="12" text-anchor="middle" fill="#1a1a2e">Specify a contract and a metric. The optimizer searches the prompt space and emits the best artifact.</text>
  </g>
</svg>
