<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Memory bandwidth, not FLOPs, sets inference token latency</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Effective memory bandwidth per chip family, mid-2026. Higher bar = faster batch-1 generation for a fixed model.</text>

  <!-- Chart area: x=140..1320 (1180 wide), y=130..680 (550 tall) -->
  <!-- y-axis: 0 to 25,000 GB/s. Each tick = 5000. y_px = 680 - (v/25000) * 550 -->

  <!-- Y-axis label -->
  <text x="60" y="400" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 60 400)">Effective memory bandwidth (GB/s, log scale)</text>

  <!-- Grid lines + y-axis ticks (log scale: 100, 1000, 10000, 100000 GB/s) -->
  <!-- y_px = 680 - log10(v / 100) / log10(100000/100) * 550 = 680 - log10(v/100)/3 * 550 -->
  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="140" y1="680" x2="1320" y2="680"/>
    <line x1="140" y1="497" x2="1320" y2="497"/>
    <line x1="140" y1="313" x2="1320" y2="313"/>
    <line x1="140" y1="130" x2="1320" y2="130"/>
  </g>
  <g font-size="11" fill="#5a4a3a" text-anchor="end">
    <text x="130" y="684">100</text>
    <text x="130" y="501">1,000</text>
    <text x="130" y="317">10,000</text>
    <text x="130" y="134">100,000</text>
  </g>
  <!-- y-axis line -->
  <line x1="140" y1="130" x2="140" y2="680" stroke="#1a1a2e" stroke-width="1.2"/>
  <!-- x-axis line -->
  <line x1="140" y1="680" x2="1320" y2="680" stroke="#1a1a2e" stroke-width="1.2"/>

  <!-- Bars: 6 chip families. Each ~150 wide, ~190 gap -->
  <!-- bar centers at x = 240, 430, 620, 810, 1000, 1190 -->
  <!-- bar widths 130. y_px = 680 - log10(v/100)/3 * 550 -->
  <!-- A100 80GB HBM2e: ~2,000 GB/s -> y=680 - log10(20)/3*550 = 680 - 1.301/3*550 = 680 - 238.5 = 441.5 -->
  <!-- H100 SXM HBM3: ~3,350 GB/s -> y=680 - log10(33.5)/3*550 = 680 - 1.525/3*550 = 680 - 279.6 = 400.4 -->
  <!-- B200 HBM3e: ~8,000 GB/s -> y=680 - log10(80)/3*550 = 680 - 1.903/3*550 = 680 - 348.9 = 331.1 -->
  <!-- AMD MI355X: ~6,000 GB/s -> y=680 - log10(60)/3*550 = 680 - 1.778/3*550 = 680 - 325.9 = 354.1 -->
  <!-- Groq LPU (SRAM): ~80,000 GB/s -> y=680 - log10(800)/3*550 = 680 - 2.903/3*550 = 680 - 532.2 = 147.8 -->
  <!-- Cerebras CS-3 (wafer SRAM): ~21,000,000 GB/s   but on this log scale capped at 100k. Use 21000 (PB/s shown as note): for chart effect, use 21,000 GB/s of HBM-equivalent comparison... -->
  <!-- Actually Cerebras is 21 PB/s = 21,000,000 GB/s. Way off chart. We'll cap at 100,000 with overflow indicator. -->
  <!-- Using 100,000 visual cap with overflow flag for Cerebras: y=130 -->

  <!-- Bar 1: A100 -->
  <g>
    <rect x="175" y="441.5" width="130" height="238.5" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="240" y="431" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">2,000</text>
    <text x="240" y="700" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">NVIDIA A100</text>
    <text x="240" y="718" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">80GB HBM2e</text>
    <text x="240" y="734" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(2020)</text>
  </g>

  <!-- Bar 2: H100 -->
  <g>
    <rect x="365" y="400.4" width="130" height="279.6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="430" y="391" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">3,350</text>
    <text x="430" y="700" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">NVIDIA H100</text>
    <text x="430" y="718" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">80GB HBM3</text>
    <text x="430" y="734" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(2022)</text>
  </g>

  <!-- Bar 3: AMD MI355X -->
  <g>
    <rect x="555" y="354.1" width="130" height="325.9" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="620" y="345" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">6,000</text>
    <text x="620" y="700" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">AMD MI355X</text>
    <text x="620" y="718" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">288GB HBM3e</text>
    <text x="620" y="734" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(2025)</text>
  </g>

  <!-- Bar 4: B200 -->
  <g>
    <rect x="745" y="331.1" width="130" height="348.9" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="810" y="322" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">8,000</text>
    <text x="810" y="700" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">NVIDIA B200</text>
    <text x="810" y="718" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">192GB HBM3e</text>
    <text x="810" y="734" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(2025)</text>
  </g>

  <!-- Bar 5: Groq LPU -->
  <g>
    <rect x="935" y="147.8" width="130" height="532.2" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <text x="1000" y="138" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">80,000</text>
    <text x="1000" y="700" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Groq LPU / LPX</text>
    <text x="1000" y="718" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">on-die SRAM</text>
    <text x="1000" y="734" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(now NVIDIA)</text>
  </g>

  <!-- Bar 6: Cerebras (off-scale) -->
  <g>
    <rect x="1125" y="130" width="130" height="550" fill="#fff5dc" stroke="#d4b96a" stroke-width="2.5"/>
    <text x="1190" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">21,000,000</text>
    <!-- off-scale break marker -->
    <line x1="1125" y1="155" x2="1255" y2="145" stroke="#ffffff" stroke-width="4"/>
    <line x1="1125" y1="160" x2="1255" y2="150" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="1125" y1="165" x2="1255" y2="155" stroke="#ffffff" stroke-width="4"/>
    <line x1="1125" y1="170" x2="1255" y2="160" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="1190" y="700" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Cerebras CS-3</text>
    <text x="1190" y="718" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">wafer SRAM</text>
    <text x="1190" y="734" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(off-scale, 21 PB/s)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(1060, 130)">
    <rect x="0" y="0" width="240" height="92" rx="6" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>
    <text x="120" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Legend</text>
    <rect x="14" y="32" width="14" height="14" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="34" y="44" font-size="11" fill="#1a1a2e">NVIDIA HBM family</text>
    <rect x="14" y="52" width="14" height="14" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="34" y="64" font-size="11" fill="#1a1a2e">Second-source HBM (AMD)</text>
    <rect x="14" y="72" width="14" height="14" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="34" y="84" font-size="11" fill="#1a1a2e">SRAM-class (off-die rules change)</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(140, 752)">
    <rect x="0" y="0" width="1180" height="52" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#a67c1a">Takeaway</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">At batch-1, the bar height predicts token latency. SRAM-class silicon (Groq, Cerebras) jumps a full log unit past HBM, which is why they hold the latency crown despite far lower FLOPs.</text>
  </g>
</svg>
