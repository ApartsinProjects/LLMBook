<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <title>DeMo collapses 140 GB of gradients into ~140 MB per step</title>
  <rect width="1100" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">DeMo: 140 GB gradients collapse to ~140 MB</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">One optimizer step on a heterogeneous worker fleet</text>

  <g transform="translate(60, 100)">
    <rect width="240" height="160" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="120" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Worker fleet</text>
    <text x="120" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">heterogeneous</text>
    <text x="20" y="84" font-size="11" fill="#1a1a2e">- cloud H100 (80 GB)</text>
    <text x="20" y="104" font-size="11" fill="#1a1a2e">- university A100 (40 GB)</text>
    <text x="20" y="124" font-size="11" fill="#1a1a2e">- hobbyist RTX 4090 (24 GB)</text>
    <text x="20" y="144" font-size="11" fill="#1a1a2e">- rented L40S (48 GB)</text>
  </g>

  <line x1="300" y1="180" x2="340" y2="180" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

  <g transform="translate(345, 100)">
    <rect width="220" height="160" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Step 1: extract</text>
    <text x="110" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">local, on each worker</text>
    <text x="20" y="84" font-size="11" fill="#1a1a2e">- compute full gradient</text>
    <text x="20" y="104" font-size="11" fill="#1a1a2e">- update local momentum</text>
    <text x="20" y="124" font-size="11" fill="#1a1a2e">- pick top-k (~0.1%)</text>
    <text x="110" y="148" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">to send: ~140 MB</text>
  </g>

  <line x1="565" y1="180" x2="605" y2="180" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

  <g transform="translate(610, 100)">
    <rect width="200" height="160" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Step 2: attest</text>
    <text x="100" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Solana layer</text>
    <text x="20" y="84" font-size="11" fill="#1a1a2e">- submit update hash</text>
    <text x="20" y="104" font-size="11" fill="#1a1a2e">- peers re-execute sample</text>
    <text x="20" y="124" font-size="11" fill="#1a1a2e">- aggregate valid updates</text>
    <text x="100" y="148" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">audit ~20-30%</text>
  </g>

  <line x1="810" y1="180" x2="850" y2="180" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

  <g transform="translate(855, 100)">
    <rect width="200" height="160" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Step 3: merge</text>
    <text x="100" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">local, on each worker</text>
    <text x="20" y="84" font-size="11" fill="#1a1a2e">- pull aggregated update</text>
    <text x="20" y="104" font-size="11" fill="#1a1a2e">- apply to local params</text>
    <text x="20" y="124" font-size="11" fill="#1a1a2e">- keep residual momentum</text>
    <text x="100" y="148" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">next step</text>
  </g>

  <g transform="translate(60, 300)">
    <rect width="990" height="200" rx="10" fill="#fafbfc" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="495" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Bandwidth per step at 70B (fp16)</text>

    <text x="170" y="68" font-size="12" font-weight="700" text-anchor="end" fill="#1a1a2e">Synchronous DDP</text>
    <rect x="180" y="54" width="780" height="20" fill="#eef4fa" stroke="#1a4078" stroke-width="1.8"/>
    <text x="570" y="69" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">~140 GB / step (full gradient all-reduce)</text>

    <text x="170" y="104" font-size="12" font-weight="700" text-anchor="end" fill="#1a1a2e">FSDP / ZeRO-3</text>
    <rect x="180" y="90" width="500" height="20" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.8"/>
    <text x="430" y="105" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">~70 GB / step (shard + reduce-scatter)</text>

    <text x="170" y="140" font-size="12" font-weight="700" text-anchor="end" fill="#1a1a2e">DiLoCo</text>
    <rect x="180" y="126" width="160" height="20" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.8"/>
    <text x="260" y="141" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">~14 GB / step</text>

    <text x="170" y="176" font-size="12" font-weight="700" text-anchor="end" fill="#1a1a2e">DeMo / DisTrO</text>
    <rect x="180" y="162" width="18" height="20" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.8"/>
    <text x="220" y="177" font-size="11" font-weight="700" fill="#a67c1a">~140 MB / step  (~1000x)</text>
  </g>

  <g transform="translate(60, 520)">
    <rect width="990" height="80" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#a67c1a">Why this changes deployment</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">At 140 MB per step a 1 Gbps home connection suffices. The InfiniBand-or-nothing constraint that made hyperscaler training</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">mandatory through 2024 is no longer mathematical. Verifiability and convergence at GPT-4 scale are the open questions.</text>
  </g>
</svg>
