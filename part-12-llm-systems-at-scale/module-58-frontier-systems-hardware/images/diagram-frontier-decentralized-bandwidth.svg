<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Per-step communication bandwidth: classical vs decentralized training</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Gradient bytes per optimizer step for a 70B fp16 model. Lower bar = more practical over the public internet.</text>

  <!-- Chart area: x=180..1320 (1140 wide), y=140..680 (540 tall) -->
  <!-- log scale: 0.01 GB to 1000 GB, 5 decades. y_px = 680 - log10(v/0.01)/5 * 540 -->

  <text x="60" y="410" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 60 410)">Inter-worker bytes per step (GB, log scale)</text>

  <!-- gridlines + ticks -->
  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="180" y1="680" x2="1320" y2="680"/>
    <line x1="180" y1="572" x2="1320" y2="572"/>
    <line x1="180" y1="464" x2="1320" y2="464"/>
    <line x1="180" y1="356" x2="1320" y2="356"/>
    <line x1="180" y1="248" x2="1320" y2="248"/>
    <line x1="180" y1="140" x2="1320" y2="140"/>
  </g>
  <g font-size="11" fill="#5a4a3a" text-anchor="end">
    <text x="170" y="684">0.01</text>
    <text x="170" y="576">0.1</text>
    <text x="170" y="468">1</text>
    <text x="170" y="360">10</text>
    <text x="170" y="252">100</text>
    <text x="170" y="144">1,000</text>
  </g>

  <line x1="180" y1="140" x2="180" y2="680" stroke="#1a1a2e" stroke-width="1.2"/>
  <line x1="180" y1="680" x2="1320" y2="680" stroke="#1a1a2e" stroke-width="1.2"/>

  <!-- Bars. Bar width ~140, gap ~80. centers at x = 250, 470, 690, 910, 1130, 1310 (5 bars + spacer for separation) -->
  <!-- Actually use 5 bars centered cleanly across width. x_centers = 290, 510, 730, 950, 1170, 1310 hm too many; use 5 -->
  <!-- bars: x_centers at 290, 500, 710, 920, 1130, 1280. Use 5: 290, 540, 790, 1040, 1290 -->
  <!-- Order: DDP (~280 GB), FSDP (~140 GB), ZeRO-3 (~70 GB), DeMo top-1% (~0.14 GB), DisTrO async (~0.04 GB) -->
  <!-- 280 GB: log10(280/0.01)=4.447, y=680-4.447/5*540=680-480=200 -->
  <!-- 140 GB: log10(140/0.01)=4.146, y=680-4.146/5*540=680-447.8=232 -->
  <!-- 70 GB: log10(70/0.01)=3.845, y=680-3.845/5*540=680-415.3=265 -->
  <!-- 0.14 GB: log10(0.14/0.01)=1.146, y=680-1.146/5*540=680-123.8=556 -->
  <!-- 0.04 GB: log10(0.04/0.01)=0.602, y=680-0.602/5*540=680-65=615 -->

  <!-- Group 1: classical (HBM-cluster only) in muted navy -->
  <!-- Group 2: decentralized in accent navy -->

  <!-- DDP -->
  <rect x="220" y="200" width="140" height="480" fill="#5a7da6" rx="3"/>
  <text x="290" y="195" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">~280 GB</text>
  <text x="290" y="708" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e">DDP</text>
  <text x="290" y="728" font-size="11" text-anchor="middle" fill="#5a4a3a">all-reduce</text>
  <text x="290" y="744" font-size="11" text-anchor="middle" fill="#5a4a3a">2 · |params|</text>

  <!-- FSDP -->
  <rect x="430" y="232" width="140" height="448" fill="#5a7da6" rx="3"/>
  <text x="500" y="227" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">~140 GB</text>
  <text x="500" y="708" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e">FSDP</text>
  <text x="500" y="728" font-size="11" text-anchor="middle" fill="#5a4a3a">sharded params,</text>
  <text x="500" y="744" font-size="11" text-anchor="middle" fill="#5a4a3a">all-gather + reduce</text>

  <!-- ZeRO-3 -->
  <rect x="640" y="265" width="140" height="415" fill="#5a7da6" rx="3"/>
  <text x="710" y="260" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">~70 GB</text>
  <text x="710" y="708" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e">ZeRO-3</text>
  <text x="710" y="728" font-size="11" text-anchor="middle" fill="#5a4a3a">optimizer-state</text>
  <text x="710" y="744" font-size="11" text-anchor="middle" fill="#5a4a3a">+ grad shard</text>

  <!-- DeMo top-1% -->
  <rect x="850" y="556" width="140" height="124" fill="#0f3460" rx="3"/>
  <text x="920" y="551" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">~0.14 GB</text>
  <text x="920" y="708" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e">DeMo v2</text>
  <text x="920" y="728" font-size="11" text-anchor="middle" fill="#5a4a3a">top-1% sparse</text>
  <text x="920" y="744" font-size="11" text-anchor="middle" fill="#5a4a3a">+ decoupled momentum</text>

  <!-- DisTrO async -->
  <rect x="1060" y="615" width="140" height="65" fill="#0f3460" rx="3"/>
  <text x="1130" y="610" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">~0.04 GB</text>
  <text x="1130" y="708" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e">DisTrO async</text>
  <text x="1130" y="728" font-size="11" text-anchor="middle" fill="#5a4a3a">DeMo + async</text>
  <text x="1130" y="744" font-size="11" text-anchor="middle" fill="#5a4a3a">+ fault tolerance</text>

  <!-- Annotation: 1000x arrow between ZeRO-3 and DeMo -->
  <line x1="800" y1="430" x2="1240" y2="430" stroke="#a23434" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="1240,430 1230,425 1230,435" fill="#a23434"/>
  <polygon points="800,430 810,425 810,435" fill="#a23434"/>
  <rect x="930" y="412" width="180" height="36" fill="#ffffff" stroke="#a23434" stroke-width="1"/>
  <text x="1020" y="427" font-size="13" font-weight="700" text-anchor="middle" fill="#a23434">~500-1000x compression</text>
  <text x="1020" y="442" font-size="11" text-anchor="middle" fill="#a23434">DeMo's central claim</text>

  <!-- Group labels at top -->
  <line x1="220" y1="118" x2="780" y2="118" stroke="#5a7da6" stroke-width="2.5"/>
  <text x="500" y="110" font-size="13" font-weight="700" text-anchor="middle" fill="#5a7da6">Co-located GPUs (NVLink / InfiniBand only)</text>

  <line x1="850" y1="118" x2="1200" y2="118" stroke="#0f3460" stroke-width="2.5"/>
  <text x="1025" y="110" font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">Public-internet capable</text>

  <!-- Legend -->
  <g transform="translate(1090, 158)">
    <rect x="0" y="0" width="220" height="56" fill="#ffffff" stroke="#d4d4d4" stroke-width="1" rx="4"/>
    <rect x="12" y="12" width="18" height="14" fill="#5a7da6"/>
    <text x="38" y="24" font-size="11" fill="#1a1a2e">classical data-parallel</text>
    <rect x="12" y="34" width="18" height="14" fill="#0f3460"/>
    <text x="38" y="46" font-size="11" fill="#1a1a2e">decentralized (Nous stack)</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="180" y="772" width="1140" height="36" fill="#f7f9fc" stroke="#0f3460" stroke-width="1.2" rx="3"/>
  <text x="750" y="795" font-size="13" font-style="italic" text-anchor="middle" fill="#1a1a2e">A 70B model that costs 70-280 GB per step in NVLink clusters drops to 40-140 MB on DeMo, well inside a residential uplink.</text>
</svg>
