<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>FlashAttention-4 tile motion on Blackwell</title>
  <rect width="1100" height="560" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">FlashAttention-4 on Blackwell</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Tile data toward registers; pipeline matmul and softmax asymmetrically</text>

  <!-- HBM outer -->
  <rect x="40" y="100" width="280" height="280" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
  <text x="180" y="128" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">HBM3e</text>
  <text x="180" y="148" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">192 GB at ~8 TB/s</text>
  <rect x="70" y="170" width="220" height="40" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
  <text x="180" y="194" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">full Q, K, V matrices</text>
  <rect x="70" y="220" width="220" height="40" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
  <text x="180" y="244" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">never materialize S, P</text>
  <text x="180" y="290" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">Naive: S = QK^T (32 GB at 128k)</text>
  <text x="180" y="306" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">tensor cores starve on HBM</text>

  <!-- SRAM middle -->
  <rect x="360" y="100" width="380" height="280" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
  <text x="550" y="128" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">SRAM / L1</text>
  <text x="550" y="148" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">228 KB per SM at ~20 TB/s</text>

  <rect x="380" y="170" width="160" height="40" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
  <text x="460" y="194" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Q tile resident</text>

  <rect x="560" y="170" width="160" height="40" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
  <text x="640" y="194" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">K, V tiles stream</text>

  <!-- Asymmetric partitions -->
  <rect x="380" y="230" width="160" height="100" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
  <text x="460" y="252" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">Tensor partition</text>
  <text x="460" y="272" font-size="11" text-anchor="middle" fill="#1a1a2e">matmul (MMA)</text>
  <text x="460" y="292" font-size="11" text-anchor="middle" fill="#1a1a2e">QK^T, PV</text>

  <rect x="560" y="230" width="160" height="100" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
  <text x="640" y="252" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">SFU partition</text>
  <text x="640" y="272" font-size="11" text-anchor="middle" fill="#1a1a2e">softmax</text>
  <text x="640" y="292" font-size="11" text-anchor="middle" fill="#1a1a2e">exp, division</text>

  <path d="M 460 340 Q 550 360 640 340" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="550" y="362" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">async pipelined</text>

  <!-- Registers inner -->
  <rect x="780" y="100" width="280" height="280" rx="10" fill="#0f3460" stroke="#0f3460" stroke-width="2.5"/>
  <text x="920" y="128" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Registers</text>
  <text x="920" y="148" font-size="11" font-style="italic" text-anchor="middle" fill="#d4dfee">~64 KB block at ~80 TB/s</text>

  <rect x="810" y="170" width="220" height="40" rx="6" fill="#ffffff" stroke="#a67c1a" stroke-width="1.5"/>
  <text x="920" y="194" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">online softmax stats</text>

  <rect x="810" y="220" width="220" height="40" rx="6" fill="#ffffff" stroke="#a67c1a" stroke-width="1.5"/>
  <text x="920" y="244" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">running max, sum, output</text>

  <text x="920" y="290" font-size="11" font-style="italic" text-anchor="middle" fill="#d4dfee">never spill to HBM until exit</text>

  <!-- Bandwidth bar -->
  <text x="550" y="430" font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">Bandwidth across the hierarchy</text>
  <g transform="translate(140, 442)">
    <rect x="0" y="0" width="180" height="22" fill="#5a7da6"/>
    <text x="90" y="16" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">HBM ~8 TB/s</text>
    <rect x="200" y="0" width="280" height="22" fill="#722f8a"/>
    <text x="340" y="16" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">SRAM ~20 TB/s</text>
    <rect x="500" y="0" width="320" height="22" fill="#0f3460"/>
    <text x="660" y="16" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">Registers ~80 TB/s</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 480)">
    <rect x="0" y="0" width="1020" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">FA-4 schedules matmul and softmax on different SM partitions so they overlap</text>
    <text x="510" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">~2x speedup over FA-3 by eliminating bubbles where softmax stalled the GEMM pipeline.</text>
  </g>
</svg>
