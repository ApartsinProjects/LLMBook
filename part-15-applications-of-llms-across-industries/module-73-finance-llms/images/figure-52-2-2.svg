<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Finance LLM regulatory landscape</title>
  <rect width="1100" height="540" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Finance LLM regulatory landscape</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Regulators (top) layered over financial use cases (bottom)</text>

  <defs>
    <linearGradient id="g5222Reg" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fdeee8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f9d9c9" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g5222Use" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#eef4fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dbe6f2" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g5222Priv" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f4ecf7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e6d6ed" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Regulator row label -->
  <text x="40" y="130" font-size="13" font-weight="700" fill="#b3401b">Regulators</text>

  <!-- Regulators row -->
  <g transform="translate(40, 145)">
    <rect x="0" y="0" width="190" height="100" rx="10" fill="url(#g5222Reg)" stroke="#b3401b" stroke-width="2.5"/>
    <text x="95" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">SEC</text>
    <text x="95" y="56" font-size="11" text-anchor="middle" fill="#1a1a2e">automated advice,</text>
    <text x="95" y="72" font-size="11" text-anchor="middle" fill="#1a1a2e">disclosure rules,</text>
    <text x="95" y="88" font-size="11" text-anchor="middle" fill="#1a1a2e">market-manipulation</text>
  </g>
  <g transform="translate(245, 145)">
    <rect x="0" y="0" width="190" height="100" rx="10" fill="url(#g5222Reg)" stroke="#b3401b" stroke-width="2.5"/>
    <text x="95" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">FINRA</text>
    <text x="95" y="56" font-size="11" text-anchor="middle" fill="#1a1a2e">broker-dealer oversight,</text>
    <text x="95" y="72" font-size="11" text-anchor="middle" fill="#1a1a2e">comms supervision,</text>
    <text x="95" y="88" font-size="11" text-anchor="middle" fill="#1a1a2e">Rule 3110 / 4511</text>
  </g>
  <g transform="translate(450, 145)">
    <rect x="0" y="0" width="190" height="100" rx="10" fill="url(#g5222Reg)" stroke="#b3401b" stroke-width="2.5"/>
    <text x="95" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">EU AI Act</text>
    <text x="95" y="56" font-size="11" text-anchor="middle" fill="#1a1a2e">high-risk classification</text>
    <text x="95" y="72" font-size="11" text-anchor="middle" fill="#1a1a2e">for credit + insurance,</text>
    <text x="95" y="88" font-size="11" text-anchor="middle" fill="#1a1a2e">conformity assessments</text>
  </g>
  <g transform="translate(655, 145)">
    <rect x="0" y="0" width="190" height="100" rx="10" fill="url(#g5222Reg)" stroke="#b3401b" stroke-width="2.5"/>
    <text x="95" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">SR 11-7</text>
    <text x="95" y="56" font-size="11" text-anchor="middle" fill="#1a1a2e">US Fed model risk,</text>
    <text x="95" y="72" font-size="11" text-anchor="middle" fill="#1a1a2e">independent validation,</text>
    <text x="95" y="88" font-size="11" text-anchor="middle" fill="#1a1a2e">three lines of defense</text>
  </g>
  <g transform="translate(860, 145)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="url(#g5222Priv)" stroke="#722f8a" stroke-width="2.5"/>
    <text x="100" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">GDPR / MiFID II</text>
    <text x="100" y="56" font-size="11" text-anchor="middle" fill="#1a1a2e">personal data and</text>
    <text x="100" y="72" font-size="11" text-anchor="middle" fill="#1a1a2e">transaction reporting</text>
    <text x="100" y="88" font-size="11" text-anchor="middle" fill="#1a1a2e">apply across the EU</text>
  </g>

  <!-- Connecting strip -->
  <g transform="translate(40, 270)">
    <rect x="0" y="0" width="1020" height="30" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Every use case below must satisfy the applicable rules above</text>
  </g>

  <!-- Use case row label -->
  <text x="40" y="340" font-size="13" font-weight="700" fill="#0f3460">Use cases</text>

  <!-- Use cases row -->
  <g transform="translate(40, 355)">
    <rect x="0" y="0" width="240" height="100" rx="10" fill="url(#g5222Use)" stroke="#0f3460" stroke-width="2.5"/>
    <text x="120" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">Credit and lending</text>
    <text x="120" y="58" font-size="11" text-anchor="middle" fill="#1a1a2e">underwriting summaries,</text>
    <text x="120" y="74" font-size="11" text-anchor="middle" fill="#1a1a2e">adverse-action letters</text>
    <text x="120" y="92" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">EU AI Act: high-risk</text>
  </g>
  <g transform="translate(295, 355)">
    <rect x="0" y="0" width="240" height="100" rx="10" fill="url(#g5222Use)" stroke="#0f3460" stroke-width="2.5"/>
    <text x="120" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">Trading signals</text>
    <text x="120" y="58" font-size="11" text-anchor="middle" fill="#1a1a2e">news + filing sentiment,</text>
    <text x="120" y="74" font-size="11" text-anchor="middle" fill="#1a1a2e">earnings-call analysis</text>
    <text x="120" y="92" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">SEC market-abuse rules</text>
  </g>
  <g transform="translate(550, 355)">
    <rect x="0" y="0" width="240" height="100" rx="10" fill="url(#g5222Use)" stroke="#0f3460" stroke-width="2.5"/>
    <text x="120" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">Advisory and chat</text>
    <text x="120" y="58" font-size="11" text-anchor="middle" fill="#1a1a2e">robo-advice, client Q&amp;A,</text>
    <text x="120" y="74" font-size="11" text-anchor="middle" fill="#1a1a2e">suitability checks</text>
    <text x="120" y="92" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">FINRA Rule 2111</text>
  </g>
  <g transform="translate(805, 355)">
    <rect x="0" y="0" width="255" height="100" rx="10" fill="url(#g5222Use)" stroke="#0f3460" stroke-width="2.5"/>
    <text x="127" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">Compliance and AML</text>
    <text x="127" y="58" font-size="11" text-anchor="middle" fill="#1a1a2e">transaction monitoring,</text>
    <text x="127" y="74" font-size="11" text-anchor="middle" fill="#1a1a2e">SAR drafting, KYC review</text>
    <text x="127" y="92" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">BSA / FinCEN, OFAC</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 480)">
    <rect x="0" y="0" width="1020" height="50" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Financial LLMs must be explainable, auditable, and human-overseen</text>
    <text x="510" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Multinational deployments stack regulators: model risk policy + sector rules + privacy law.</text>
  </g>
</svg>
