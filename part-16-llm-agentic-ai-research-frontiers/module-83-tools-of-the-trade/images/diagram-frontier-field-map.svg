<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">A map of the LLM field, mid-2026</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Concentric rings: closer to the centre = closer to the model itself. Outer rings consume the inner.</text>

  <!-- Concentric rings centered at cx=700, cy=440 -->
  <!-- Ring radii: r1=110 (frontier labs), r2=220 (open weights), r3=320 (tooling), r4=400 (applications) -->

  <!-- Ring 4: Applications (outermost) -->
  <circle cx="700" cy="440" r="380" fill="#f7f9fc" stroke="#5a7da6" stroke-width="1.5"/>
  <!-- Ring 3: Tooling -->
  <circle cx="700" cy="440" r="290" fill="#e8edf5" stroke="#5a7da6" stroke-width="1.5"/>
  <!-- Ring 2: Open-weights ecosystem -->
  <circle cx="700" cy="440" r="200" fill="#d4dfee" stroke="#0f3460" stroke-width="1.5"/>
  <!-- Ring 1: Frontier labs (center) -->
  <circle cx="700" cy="440" r="110" fill="#0f3460" stroke="#0f3460" stroke-width="2"/>

  <!-- Ring labels -->
  <text x="700" y="380" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">FRONTIER LABS</text>
  <text x="700" y="398" font-size="9" text-anchor="middle" fill="#ffffff">closed-weight, frontier capability</text>

  <!-- Ring 1 entries (frontier labs) -->
  <g font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">
    <text x="700" y="426">Anthropic</text>
    <text x="700" y="442">OpenAI</text>
    <text x="700" y="458">Google DeepMind</text>
    <text x="700" y="474">xAI · Meta FAIR</text>
    <text x="700" y="490">DeepSeek · Qwen</text>
  </g>

  <!-- Ring 2 label (open weights) -->
  <text x="700" y="265" font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">OPEN-WEIGHT FRONTIER</text>
  <text x="700" y="280" font-size="9" text-anchor="middle" fill="#5a4a3a">weights downloadable, near-frontier scores</text>

  <!-- Ring 2 entries placed around the ring (top, bottom-left, bottom-right of inner) -->
  <g font-size="10" font-weight="600" text-anchor="middle" fill="#1a1a2e">
    <!-- top -->
    <text x="540" y="320">Llama 4</text>
    <text x="540" y="334">Qwen3</text>
    <!-- right -->
    <text x="860" y="320">DeepSeek V4</text>
    <text x="860" y="334">Mistral Magistral</text>
    <!-- bottom-left -->
    <text x="540" y="560">SmolLM2 · Phi-4</text>
    <text x="540" y="574">Liquid LFM2.5</text>
    <!-- bottom-right -->
    <text x="860" y="560">Gemma 3</text>
    <text x="860" y="574">Falcon-3</text>
  </g>

  <!-- Ring 3 label (tooling) -->
  <text x="700" y="170" font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">TOOLING LAYER</text>
  <text x="700" y="185" font-size="9" text-anchor="middle" fill="#5a4a3a">frameworks, inference engines, training stacks, datasets</text>

  <!-- Ring 3 entries scattered around the middle ring -->
  <g font-size="10" font-weight="500" text-anchor="middle" fill="#1a1a2e">
    <!-- top region -->
    <text x="490" y="230">PyTorch</text>
    <text x="912" y="230">JAX / Flax</text>
    <text x="700" y="218">HuggingFace · transformers · accelerate</text>

    <!-- left side: inference -->
    <text x="380" y="380">vLLM</text>
    <text x="380" y="396">SGLang</text>
    <text x="380" y="412">llama.cpp</text>
    <text x="380" y="428">Ollama</text>
    <text x="380" y="444">MLX</text>

    <!-- right side: training -->
    <text x="1020" y="380">TRL · unsloth</text>
    <text x="1020" y="396">torchtune · Axolotl</text>
    <text x="1020" y="412">DeepSpeed · FSDP</text>
    <text x="1020" y="428">DisTrO · Nous Psyche</text>
    <text x="1020" y="444">TensorRT-LLM</text>

    <!-- bottom region: data + eval -->
    <text x="490" y="660">FineWeb-Edu</text>
    <text x="490" y="676">The Stack v2</text>
    <text x="912" y="660">lm-eval-harness</text>
    <text x="912" y="676">LMArena · ArtAnalysis</text>
    <text x="700" y="668">Pile-2 · MMLU · GPQA · SWE-bench</text>
  </g>

  <!-- Ring 4 label (applications) -->
  <text x="700" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">APPLICATION LAYER</text>
  <text x="700" y="95" font-size="9" text-anchor="middle" fill="#5a4a3a">products and agents people actually use</text>

  <!-- Ring 4 entries: scattered far out -->
  <g font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a2e">
    <!-- top -->
    <text x="700" y="118">ChatGPT · Claude.ai · Gemini · Grok</text>

    <!-- left -->
    <text x="220" y="320">Cursor</text>
    <text x="220" y="338">Windsurf</text>
    <text x="220" y="356">Continue</text>
    <text x="220" y="374">Aider</text>

    <!-- far left bottom -->
    <text x="220" y="500">Perplexity</text>
    <text x="220" y="518">You.com</text>
    <text x="220" y="536">Phind</text>

    <!-- right -->
    <text x="1180" y="320">Claude Code</text>
    <text x="1180" y="338">Cline · Roo</text>
    <text x="1180" y="356">GitHub Copilot</text>
    <text x="1180" y="374">Devin</text>

    <!-- far right bottom -->
    <text x="1180" y="500">Notion AI</text>
    <text x="1180" y="518">Cursor agents</text>
    <text x="1180" y="536">Glean enterprise</text>

    <!-- bottom -->
    <text x="700" y="780">LangChain · LlamaIndex · DSPy · CrewAI · agno · n8n agents</text>
  </g>

  <!-- Annotations: arrows from outer to inner showing dependence -->
  <defs>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f3460" opacity="0.55"/>
    </marker>
  </defs>

  <!-- Arrow from app ring into tooling ring (representing dependency direction) -->
  <path d="M 230 600 Q 320 540 380 480" fill="none" stroke="#0f3460" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.55" marker-end="url(#map-arrow)"/>
  <text x="310" y="618" font-size="9" font-style="italic" fill="#5a4a3a">apps consume tooling</text>

  <!-- Arrow from tooling into open weights -->
  <path d="M 440 200 Q 500 240 540 290" fill="none" stroke="#0f3460" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.55" marker-end="url(#map-arrow)"/>

  <!-- Arrow from open weights to frontier labs (research feedback) -->
  <path d="M 540 350 Q 595 380 640 405" fill="none" stroke="#0f3460" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.55" marker-end="url(#map-arrow)"/>
  <text x="600" y="345" font-size="9" font-style="italic" fill="#5a4a3a">open ecosystem informs labs</text>

  <!-- Legend -->
  <g transform="translate(60, 730)">
    <rect x="0" y="0" width="14" height="14" fill="#0f3460"/>
    <text x="22" y="12" font-size="11" fill="#1a1a2e">frontier-lab inner ring</text>
    <rect x="170" y="0" width="14" height="14" fill="#d4dfee" stroke="#0f3460" stroke-width="1"/>
    <text x="192" y="12" font-size="11" fill="#1a1a2e">open-weight near-frontier</text>
    <rect x="370" y="0" width="14" height="14" fill="#e8edf5" stroke="#5a7da6" stroke-width="1"/>
    <text x="392" y="12" font-size="11" fill="#1a1a2e">tooling layer</text>
    <rect x="500" y="0" width="14" height="14" fill="#f7f9fc" stroke="#5a7da6" stroke-width="1"/>
    <text x="522" y="12" font-size="11" fill="#1a1a2e">applications</text>
  </g>
</svg>
