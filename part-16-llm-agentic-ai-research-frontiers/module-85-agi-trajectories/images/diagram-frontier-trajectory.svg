<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Frontier benchmarks: still climbing, but the slope tells you where</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Top frontier-model score per benchmark, January 2025 to May 2026.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="700" y="745" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e">Release date</text>
  <text x="60" y="430" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 60 430)">Top model score (%)</text>

  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="160" y1="680" x2="1320" y2="680"/>
    <line x1="160" y1="570" x2="1320" y2="570"/>
    <line x1="160" y1="460" x2="1320" y2="460"/>
    <line x1="160" y1="350" x2="1320" y2="350"/>
    <line x1="160" y1="240" x2="1320" y2="240"/>
    <line x1="160" y1="130" x2="1320" y2="130"/>
  </g>
  <g font-size="11" fill="#5a4a3a" text-anchor="end">
    <text x="150" y="684">0</text>
    <text x="150" y="574">20</text>
    <text x="150" y="464">40</text>
    <text x="150" y="354">60</text>
    <text x="150" y="244">80</text>
    <text x="150" y="134">100</text>
  </g>

  <line x1="160" y1="130" x2="160" y2="680" stroke="#1a1a2e" stroke-width="1.2"/>
  <line x1="160" y1="680" x2="1320" y2="680" stroke="#1a1a2e" stroke-width="1.2"/>

  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="320" y1="130" x2="320" y2="680"/>
    <line x1="480" y1="130" x2="480" y2="680"/>
    <line x1="640" y1="130" x2="640" y2="680"/>
    <line x1="800" y1="130" x2="800" y2="680"/>
    <line x1="960" y1="130" x2="960" y2="680"/>
    <line x1="1120" y1="130" x2="1120" y2="680"/>
