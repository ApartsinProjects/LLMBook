    <text x="320" y="700">May 25</text>
    <text x="480" y="700">Sep 25</text>
    <text x="640" y="700">Jan 26</text>
    <text x="800" y="700">May 26</text>
  </g>

  <line x1="160" y1="240" x2="1320" y2="240" stroke="#b3401b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1305" y="232" font-size="11" font-style="italic" text-anchor="end" fill="#b3401b">Expert human PhD ~ 90%</text>

  <g>
    <polyline points="160,636 240,597 320,564 400,531 480,498 560,476 640,449 720,427 800,400 880,372 960,328 1040,317 1120,306 1200,295 1280,284" fill="none" stroke="#1a4078" stroke-width="3"/>
    <circle cx="160" cy="636" r="6" fill="#1a4078"/>
    <circle cx="640" cy="449" r="6" fill="#1a4078"/>
    <circle cx="1120" cy="306" r="6" fill="#1a4078"/>
    <text x="174" y="630" font-size="11" fill="#1a4078">8%</text>
    <text x="654" y="445" font-size="11" fill="#1a4078">29%</text>
    <text x="1132" y="302" font-size="11" fill="#1a4078">44.7%</text>
    <text x="1240" y="285" font-size="13" font-weight="700" fill="#1a4078">HLE</text>
  </g>

  <g>
    <polyline points="320,653 480,609 640,520 800,420 960,361 1120,339 1280,328" fill="none" stroke="#722f8a" stroke-width="3"/>
    <circle cx="320" cy="653" r="6" fill="#722f8a"/>
    <circle cx="800" cy="420" r="6" fill="#722f8a"/>
    <circle cx="1280" cy="328" r="6" fill="#722f8a"/>
    <text x="334" y="667" font-size="11" fill="#722f8a">5%</text>
    <text x="814" y="435" font-size="11" fill="#722f8a">38%</text>
    <text x="1240" y="350" font-size="13" font-weight="700" fill="#722f8a">ARC-AGI-2</text>
    <text x="1248" y="365" font-size="10" font-style="italic" fill="#722f8a">(cost-uncapped)</text>
  </g>

  <g>
    <polyline points="480,667 640,634 800,602 960,575 1120,553 1280,520" fill="none" stroke="#1f7a3a" stroke-width="3"/>
    <circle cx="480" cy="667" r="6" fill="#1f7a3a"/>
    <circle cx="800" cy="602" r="6" fill="#1f7a3a"/>
    <circle cx="1280" cy="520" r="6" fill="#1f7a3a"/>
    <text x="494" y="681" font-size="11" fill="#1f7a3a">2%</text>
    <text x="810" y="618" font-size="11" fill="#1f7a3a">14%</text>
    <text x="1296" y="540" font-size="13" font-weight="700" text-anchor="end" fill="#1f7a3a">FrontierMath</text>
    <text x="1300" y="555" font-size="10" font-style="italic" text-anchor="end" fill="#1f7a3a">Tier 4: 29% best</text>
  </g>

  <line x1="640" y1="220" x2="640" y2="160" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="640" y="155" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">o3 / Claude 4 release wave</text>

  <line x1="1120" y1="276" x2="1120" y2="160" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1120" y="155" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Gemini 3 / GPT-5.5 wave</text>

  <g transform="translate(180, 165)">
    <rect x="0" y="0" width="240" height="92" rx="6" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>
    <text x="120" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Three benchmarks, three slopes</text>
    <line x1="14" y1="36" x2="40" y2="36" stroke="#1a4078" stroke-width="3"/>
    <text x="46" y="40" font-size="11" fill="#1a1a2e">HLE: steep, ~3% / month</text>
    <line x1="14" y1="56" x2="40" y2="56" stroke="#722f8a" stroke-width="3"/>
    <text x="46" y="60" font-size="11" fill="#1a1a2e">ARC-AGI-2: jumps in waves</text>
    <line x1="14" y1="76" x2="40" y2="76" stroke="#1f7a3a" stroke-width="3"/>
    <text x="46" y="80" font-size="11" fill="#1a1a2e">FrontierMath: flat-then-fast</text>
  </g>

  <g transform="translate(160, 755)">
    <rect x="0" y="0" width="1160" height="44" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="20" font-size="13" font-weight="700" fill="#a67c1a">Trajectory readout</text>
    <text x="20" y="38" font-size="12" fill="#1a1a2e">HLE's slope crosses 80% in mid-2027 if it holds. ARC-AGI-2 and FrontierMath are flatter; the 2027 question hinges on whether they accelerate or stay slow.</text>
  </g>
</svg>
