<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <title>Augmentation in aggregate, displacement in specific roles</title>
  <rect width="1100" height="620" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Augmentation dominates aggregate; displacement is per role</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Anthropic 2025 labor data + aggressive-adopter firm cuts</text>

  <g transform="translate(60, 100)">
    <rect width="490" height="300" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="245" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Aggregate Claude usage</text>
    <text x="245" y="54" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">all roles, 2025</text>

    <rect x="40" y="80" width="86" height="50" fill="#b3401b"/>
    <text x="83" y="110" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">21%</text>

    <rect x="126" y="80" width="324" height="50" fill="#0f3460"/>
    <text x="288" y="110" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">79%</text>

    <text x="83" y="158" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">automation</text>
    <text x="83" y="174" font-size="10" text-anchor="middle" fill="#5a4a3a">model executes</text>

    <text x="288" y="158" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">augmentation</text>
    <text x="288" y="174" font-size="10" text-anchor="middle" fill="#5a4a3a">human-in-the-loop</text>

    <text x="40" y="216" font-size="13" font-weight="700" fill="#1a1a2e">U.S. layoff attribution, 2025</text>
    <rect x="40" y="226" width="22" height="28" fill="#b3401b"/>
    <rect x="62" y="226" width="388" height="28" fill="#888"/>
    <text x="51" y="245" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">5%</text>
    <text x="256" y="245" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">95% (other causes)</text>
    <text x="40" y="278" font-size="11" fill="#1a1a2e">~55k of 1.17M layoffs attributed to AI</text>
  </g>

  <g transform="translate(580, 100)">
    <rect width="460" height="300" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="230" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">Aggressive-adopter firms</text>
    <text x="230" y="54" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">per-role workforce change</text>

    <text x="20" y="84" font-size="11" font-weight="700" fill="#1a1a2e">Junior copywriters</text>
    <rect x="180" y="72" width="200" height="18" fill="#b3401b"/>
    <text x="390" y="86" font-size="11" font-weight="700" fill="#b3401b">-50%</text>

    <text x="20" y="114" font-size="11" font-weight="700" fill="#1a1a2e">Voice-over artists</text>
    <rect x="180" y="102" width="180" height="18" fill="#b3401b"/>
    <text x="370" y="116" font-size="11" font-weight="700" fill="#b3401b">-45%</text>

    <text x="20" y="144" font-size="11" font-weight="700" fill="#1a1a2e">Tier-1 support</text>
    <rect x="180" y="132" width="140" height="18" fill="#b3401b"/>
    <text x="330" y="146" font-size="11" font-weight="700" fill="#b3401b">-35%</text>

    <text x="20" y="174" font-size="11" font-weight="700" fill="#1a1a2e">Paralegals</text>
    <rect x="180" y="162" width="120" height="18" fill="#a67c1a"/>
    <text x="310" y="176" font-size="11" font-weight="700" fill="#a67c1a">-30%</text>

    <text x="20" y="204" font-size="11" font-weight="700" fill="#1a1a2e">Basic translation</text>
    <rect x="180" y="192" width="100" height="18" fill="#a67c1a"/>
    <text x="290" y="206" font-size="11" font-weight="700" fill="#a67c1a">-25%</text>

    <text x="20" y="234" font-size="11" font-weight="700" fill="#1a1a2e">Senior SWE</text>
    <rect x="180" y="222" width="48" height="18" fill="#1f7a3a"/>
    <text x="238" y="236" font-size="11" font-weight="700" fill="#1f7a3a">+12%</text>

    <text x="20" y="264" font-size="11" font-weight="700" fill="#1a1a2e">AI / ML engineers</text>
    <rect x="180" y="252" width="240" height="18" fill="#1f7a3a"/>
    <text x="430" y="266" font-size="11" font-weight="700" fill="#1f7a3a">+85%</text>
  </g>

  <g transform="translate(60, 420)">
    <rect width="980" height="180" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#a67c1a">Both views are true at once</text>
    <text x="20" y="54" font-size="12" fill="#1a1a2e">Aggregate augmentation is dominant. Per-role displacement is real and concentrated.</text>
    <text x="20" y="80" font-size="12" fill="#1a1a2e">Mainstream framing ("AI just shifts jobs") is correct at the aggregate. The per-role view is what specific workers experience.</text>
    <text x="20" y="108" font-size="12" fill="#1a1a2e">Policy that averages over occupations misses the concentrated impact.</text>
    <text x="20" y="132" font-size="12" fill="#1a1a2e">Product strategy that averages over teams misses where adoption is fast.</text>
    <text x="20" y="160" font-size="11" font-style="italic" fill="#5a4a3a">2027 data either confirms ~70% augmentation or shows the flip toward automation as agents scale.</text>
  </g>
</svg>
