<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Diffusion language models: corrupt during training, denoise at inference</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Forward pass progressively masks tokens; reverse pass learns to fill them back in over T steps.</text>

  <!-- Forward lane (top) -->
  <g>
    <rect x="60" y="110" width="1180" height="220" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="80" y="138" font-size="16" font-weight="700" fill="#b3401b">Forward process  (training: add noise by masking)</text>
    <text x="80" y="158" font-size="12" font-style="italic" fill="#5a4a3a">Schedule q(x_t | x_0): probability of masking each token grows with t.</text>

    <!-- t=0 -->
    <g>
      <rect x="100" y="180" width="280" height="115" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="240" y="205" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">t = 0   (clean data)</text>
      <g font-family="ui-monospace, Menlo, monospace" font-size="13">
        <rect x="120" y="225" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
        <text x="147" y="245" text-anchor="middle" fill="#1a1a2e">The</text>
        <rect x="180" y="225" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
        <text x="207" y="245" text-anchor="middle" fill="#1a1a2e">cat</text>
        <rect x="240" y="225" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
        <text x="267" y="245" text-anchor="middle" fill="#1a1a2e">sat</text>
        <rect x="300" y="225" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
        <text x="327" y="245" text-anchor="middle" fill="#1a1a2e">on</text>
      </g>
      <text x="240" y="280" font-size="11" text-anchor="middle" fill="#5a4a3a">0 of 4 tokens masked</text>
    </g>

    <!-- t=1 -->
    <g>
      <rect x="510" y="180" width="280" height="115" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="650" y="205" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">t = 1   (partial corruption)</text>
      <g font-family="ui-monospace, Menlo, monospace" font-size="13">
        <rect x="530" y="225" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
        <text x="557" y="245" text-anchor="middle" fill="#1a1a2e">The</text>
        <rect x="590" y="225" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
        <text x="617" y="245" text-anchor="middle" fill="#b3401b">[M]</text>
        <rect x="650" y="225" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
        <text x="677" y="245" text-anchor="middle" fill="#1a1a2e">sat</text>
        <rect x="710" y="225" width="55" height="30" rx="3" fill="#eef4fa" stroke="#1a4078"/>
        <text x="737" y="245" text-anchor="middle" fill="#1a1a2e">on</text>
      </g>
      <text x="650" y="280" font-size="11" text-anchor="middle" fill="#5a4a3a">1 of 4 tokens masked</text>
    </g>

    <!-- t=T -->
    <g>
      <rect x="920" y="180" width="280" height="115" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="1060" y="205" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">t = T   (full noise)</text>
      <g font-family="ui-monospace, Menlo, monospace" font-size="13">
        <rect x="940" y="225" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
        <text x="967" y="245" text-anchor="middle" fill="#b3401b">[M]</text>
        <rect x="1000" y="225" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
        <text x="1027" y="245" text-anchor="middle" fill="#b3401b">[M]</text>
        <rect x="1060" y="225" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
        <text x="1087" y="245" text-anchor="middle" fill="#b3401b">[M]</text>
        <rect x="1120" y="225" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
        <text x="1147" y="245" text-anchor="middle" fill="#b3401b">[M]</text>
      </g>
      <text x="1060" y="280" font-size="11" text-anchor="middle" fill="#5a4a3a">all 4 masked</text>
    </g>

    <line x1="380" y1="237" x2="510" y2="237" stroke="#b3401b" stroke-width="2" marker-end="url(#arrRed)"/>
    <text x="445" y="225" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">mask</text>
    <line x1="790" y1="237" x2="920" y2="237" stroke="#b3401b" stroke-width="2" marker-end="url(#arrRed)" stroke-dasharray="6 4"/>
    <text x="855" y="225" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">. . .</text>
  </g>

  <!-- Reverse lane (bottom) -->
  <g>
    <rect x="60" y="360" width="1180" height="220" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="80" y="388" font-size="16" font-weight="700" fill="#1f7a3a">Reverse process  (inference: model unmasks step-by-step)</text>
    <text x="80" y="408" font-size="12" font-style="italic" fill="#5a4a3a">Learn p_theta(x_{t-1} | x_t): each step replaces some [M] tokens with predictions.</text>

    <!-- T -->
    <g>
      <rect x="920" y="430" width="280" height="115" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="1060" y="455" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">start: all [MASK]</text>
      <g font-family="ui-monospace, Menlo, monospace" font-size="13">
        <rect x="940" y="475" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
        <text x="967" y="495" text-anchor="middle" fill="#b3401b">[M]</text>
        <rect x="1000" y="475" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
        <text x="1027" y="495" text-anchor="middle" fill="#b3401b">[M]</text>
        <rect x="1060" y="475" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
        <text x="1087" y="495" text-anchor="middle" fill="#b3401b">[M]</text>
        <rect x="1120" y="475" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
        <text x="1147" y="495" text-anchor="middle" fill="#b3401b">[M]</text>
      </g>
      <text x="1060" y="530" font-size="11" text-anchor="middle" fill="#5a4a3a">noise prior</text>
    </g>

    <!-- middle -->
    <g>
      <rect x="510" y="430" width="280" height="115" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="650" y="455" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">step: partial fill</text>
      <g font-family="ui-monospace, Menlo, monospace" font-size="13">
        <rect x="530" y="475" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
        <text x="557" y="495" text-anchor="middle" fill="#b3401b">[M]</text>
        <rect x="590" y="475" width="55" height="30" rx="3" fill="#ecf6ee" stroke="#1f7a3a"/>
        <text x="617" y="495" text-anchor="middle" fill="#1f7a3a">cat</text>
        <rect x="650" y="475" width="55" height="30" rx="3" fill="#fdeee8" stroke="#b3401b"/>
        <text x="677" y="495" text-anchor="middle" fill="#b3401b">[M]</text>
        <rect x="710" y="475" width="55" height="30" rx="3" fill="#ecf6ee" stroke="#1f7a3a"/>
        <text x="737" y="495" text-anchor="middle" fill="#1f7a3a">on</text>
      </g>
      <text x="650" y="530" font-size="11" text-anchor="middle" fill="#5a4a3a">2 of 4 unmasked</text>
    </g>

    <!-- final -->
    <g>
      <rect x="100" y="430" width="280" height="115" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="240" y="455" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">end: clean sample</text>
      <g font-family="ui-monospace, Menlo, monospace" font-size="13">
        <rect x="120" y="475" width="55" height="30" rx="3" fill="#ecf6ee" stroke="#1f7a3a"/>
        <text x="147" y="495" text-anchor="middle" fill="#1f7a3a">The</text>
        <rect x="180" y="475" width="55" height="30" rx="3" fill="#ecf6ee" stroke="#1f7a3a"/>
        <text x="207" y="495" text-anchor="middle" fill="#1f7a3a">cat</text>
        <rect x="240" y="475" width="55" height="30" rx="3" fill="#ecf6ee" stroke="#1f7a3a"/>
        <text x="267" y="495" text-anchor="middle" fill="#1f7a3a">sat</text>
        <rect x="300" y="475" width="55" height="30" rx="3" fill="#ecf6ee" stroke="#1f7a3a"/>
        <text x="327" y="495" text-anchor="middle" fill="#1f7a3a">on</text>
      </g>
      <text x="240" y="530" font-size="11" text-anchor="middle" fill="#5a4a3a">all tokens predicted</text>
    </g>

    <line x1="920" y1="487" x2="790" y2="487" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrGreen)" stroke-dasharray="6 4"/>
    <text x="855" y="475" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">. . .</text>
    <line x1="510" y1="487" x2="380" y2="487" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrGreen)"/>
    <text x="445" y="475" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">unmask</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 605)">
    <rect x="0" y="0" width="1180" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Diffusion LMs train by deliberately corrupting clean text (left-to-right, top), then learn to invert the corruption (right-to-left, bottom). Generation is parallel,</text>
    <text x="20" y="64" font-size="12" fill="#1a1a2e">all positions are filled jointly in T denoising steps, in contrast to autoregressive models which produce one token at a time.</text>
  </g>
</svg>
