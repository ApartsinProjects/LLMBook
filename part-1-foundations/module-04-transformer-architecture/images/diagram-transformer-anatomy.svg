<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1180" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="1180" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Transformer anatomy: token to next-token in seven stages</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Every modern LLM is this diagram repeated N times. Tensor shapes annotated for a single example with sequence length T and width d.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <g transform="translate(160, 130)">
    <rect x="0" y="0" width="240" height="80" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="120" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">1. Tokens</text>
    <text x="120" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">"The cat sat" -&gt; [464, 3797, 3332]</text>
    <text x="120" y="68" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">shape: (T,) integer ids</text>
  </g>

  <line x1="280" y1="210" x2="280" y2="248" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(160, 250)">
    <rect x="0" y="0" width="240" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="120" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. Token embedding</text>
    <text x="120" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">E: vocab x d learned matrix</text>
    <text x="120" y="68" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">output: (T, d) dense vectors</text>
  </g>

  <line x1="280" y1="330" x2="280" y2="368" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(160, 370)">
    <rect x="0" y="0" width="240" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="120" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. + position info</text>
    <text x="120" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">RoPE / ALiBi / learned PE</text>
    <text x="120" y="68" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">shape unchanged: (T, d)</text>
  </g>

  <line x1="400" y1="410" x2="500" y2="410" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(510, 220)">
    <rect x="0" y="0" width="600" height="380" rx="10" fill="#fafbfc" stroke="#1a1a2e" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="300" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a2e">4. Transformer block (repeats N times)</text>

    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="540" height="70" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="270" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">4a. LayerNorm + multi-head causal self-attention</text>
      <text x="270" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">project Q, K, V; per-head attn(Q, K, V) = softmax(QK^T / sqrt(d_k)) * V; concat; project back</text>
      <text x="270" y="58" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">shape preserved: (T, d). cost: O(T^2 * d) attention plus O(T * d^2) projections</text>
    </g>

    <text x="300" y="138" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">residual: x + attn(x)</text>
    <line x1="300" y1="148" x2="300" y2="166" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <g transform="translate(30, 170)">
      <rect x="0" y="0" width="540" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="270" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">4b. LayerNorm + feed-forward (MLP)</text>
      <text x="270" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">two linear layers around an activation (GELU, SwiGLU); hidden width ~4*d</text>
      <text x="270" y="58" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">shape preserved: (T, d). cost: O(T * d^2) dominates inference for short sequences</text>
    </g>

    <text x="300" y="258" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">residual: x + mlp(x)</text>
    <line x1="300" y1="268" x2="300" y2="286" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <g transform="translate(30, 290)">
      <rect x="0" y="0" width="540" height="56" rx="6" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
      <text x="270" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">x N (e.g. 32 layers for 7B, 80 for 70B, 96 for 175B)</text>
      <text x="270" y="42" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">ghost copies represent the repetition; each layer's params are independent</text>
    </g>
  </g>

  <line x1="1110" y1="410" x2="1170" y2="410" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(1180, 250)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="100" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">5. Final LayerNorm</text>
    <text x="100" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">stabilize output before head</text>
    <text x="100" y="68" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(T, d) unchanged</text>
  </g>

  <line x1="1280" y1="330" x2="1280" y2="368" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(1180, 370)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">6. LM head</text>
    <text x="100" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">linear E^T (tied weights)</text>
    <text x="100" y="68" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">output: (T, vocab) logits</text>
  </g>

  <line x1="1280" y1="450" x2="1280" y2="488" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(1180, 490)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="2.5"/>
    <text x="100" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#a67c1a">7. Sample next token</text>
    <text x="100" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">softmax + temperature</text>
    <text x="100" y="68" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">"on" (id 319)</text>
  </g>

  <path d="M 1280 570 Q 1280 760 700 760 Q 280 760 280 210" fill="none" stroke="#5a4a3a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-dim)"/>
  <text x="780" y="780" font-size="12" font-style="italic" fill="#5a4a3a">append token, repeat for next generation step (autoregressive loop)</text>

  <g transform="translate(160, 820)">
    <text x="540" y="0" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a2e">Where each stage's parameters live (~7B example, d=4096, N=32, vocab=128k)</text>
    <rect x="0" y="20" width="1080" height="200" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>

    <text x="40" y="56" font-size="13" font-weight="700" fill="#1a4078">Token embedding E</text>
    <text x="320" y="56" font-size="13" font-family="Cambria Math, Cambria, Times, serif" fill="#1a1a2e">vocab * d = 128k * 4k ~ 0.52 B params</text>
    <text x="700" y="56" font-size="11" font-style="italic" fill="#5a4a3a">~8% of total</text>

    <text x="40" y="86" font-size="13" font-weight="700" fill="#722f8a">Attention (Q, K, V, O) x N</text>
    <text x="320" y="86" font-size="13" font-family="Cambria Math, Cambria, Times, serif" fill="#1a1a2e">N * 4 * d^2 = 32 * 4 * 16M ~ 2.1 B params</text>
    <text x="700" y="86" font-size="11" font-style="italic" fill="#5a4a3a">~30% of total</text>

    <text x="40" y="116" font-size="13" font-weight="700" fill="#1f7a3a">MLP (gate, up, down) x N</text>
    <text x="320" y="116" font-size="13" font-family="Cambria Math, Cambria, Times, serif" fill="#1a1a2e">N * ~3 * 4 * d^2 = 32 * 12 * 16M ~ 6.3 B params</text>
    <text x="700" y="116" font-size="11" font-style="italic" fill="#5a4a3a">~60% of total</text>

    <text x="40" y="146" font-size="13" font-weight="700" fill="#a67c1a">LayerNorms + final + head</text>
    <text x="320" y="146" font-size="13" font-family="Cambria Math, Cambria, Times, serif" fill="#1a1a2e">~negligible vs above (head tied to E)</text>
    <text x="700" y="146" font-size="11" font-style="italic" fill="#5a4a3a">~2% of total</text>

    <text x="540" y="186" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Total ~ 9 B params (numbers approximate; modern 7B uses GQA + SwiGLU and ends near 6.7-7.0 B)</text>
  </g>

  <g transform="translate(140, 1080)">
    <rect x="0" y="0" width="1120" height="80" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#a67c1a">Why this diagram is load-bearing</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">Every variant in Parts II-XII is a substitution into one of these seven boxes. Mamba replaces 4a; MoE replaces 4b with a routed expert pool; LoRA inserts low-rank adapters into 4a's projections;</text>
    <text x="20" y="58" font-size="12" fill="#1a1a2e">quantization changes the dtype inside the boxes; FlashAttention changes how 4a is computed without changing what it computes. The skeleton stays constant.</text>
  </g>
</svg>
