<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Circuit Complexity Classes — Where Transformers Live</text>
  <text x="550" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">Each class is contained in the next; fixed-depth Transformers correspond to TC⁰</text>

  <!-- Outermost: P -->
  <g filter="url(#sh)">
    <rect x="50" y="100" width="1000" height="600" rx="14" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="80" y="135" font-size="22" font-weight="700" fill="#722f8a" font-style="italic">P</text>
    <text x="80" y="158" font-size="13" fill="#5a4a3a" font-style="italic">polynomial-time decision problems</text>
  </g>

  <!-- NC^1 -->
  <g filter="url(#sh)">
    <rect x="120" y="190" width="860" height="490" rx="12" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="150" y="225" font-size="22" font-weight="700" fill="#1a4078" font-style="italic">NC¹</text>
    <text x="150" y="248" font-size="13" fill="#5a4a3a" font-style="italic">log-depth Boolean circuits  •  examples: graph connectivity, Boolean formula eval</text>
  </g>

  <!-- TC^0 (highlighted - this is where Transformers live) -->
  <g filter="url(#sh)">
    <rect x="200" y="290" width="700" height="370" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="3.5"/>
    <text x="230" y="325" font-size="22" font-weight="700" fill="#1f7a3a" font-style="italic">TC⁰</text>
    <text x="230" y="348" font-size="13" fill="#5a4a3a" font-style="italic">constant-depth threshold circuits  •  examples: integer multiplication, sorting</text>
  </g>

  <!-- Transformer marker inside TC^0 -->
  <g filter="url(#sh)">
    <rect x="320" y="395" width="460" height="160" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="2.5"/>
    <text x="550" y="430" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">Fixed-depth Transformers  ≈  TC⁰</text>
    <text x="550" y="455" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">(with log-precision arithmetic)</text>
    <line x1="350" y1="470" x2="750" y2="470" stroke="#d4b96a" stroke-width="0.8"/>
    <text x="550" y="492" text-anchor="middle" font-size="12" fill="#1a1a2e">No matter how wide you scale a Transformer, its expressive</text>
    <text x="550" y="510" text-anchor="middle" font-size="12" fill="#1a1a2e">power is bounded by what TC⁰ circuits can compute</text>
    <text x="550" y="535" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5e1a">→ Hence chain-of-thought (sequential compute) helps:</text>
    <text x="550" y="551" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5e1a">  it lifts effective depth, escaping TC⁰</text>
  </g>

  <!-- AC^0 (innermost) -->
  <g filter="url(#sh)">
    <rect x="280" y="585" width="540" height="60" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="305" y="615" font-size="18" font-weight="700" fill="#b3401b" font-style="italic">AC⁰</text>
    <text x="350" y="615" font-size="12" fill="#5a4a3a" font-style="italic">unbounded fan-in, constant-depth  •  cannot compute parity</text>
  </g>

  <!-- Inclusion arrows on right side -->
  <g transform="translate(1000, 110)">
    <text x="0" y="20" font-size="13" font-weight="700" fill="#1a1a2e">⊃</text>
    <text x="-15" y="40" font-size="11" fill="#5a4a3a">contains</text>
  </g>

  <!-- Bottom callout: takeaway -->
  <g transform="translate(50, 720)">
    <rect x="0" y="0" width="1000" height="60" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Inclusion order</text>
    <text x="20" y="42" font-size="13" fill="#1a1a2e" font-family="Cambria Math, Cambria, Times, serif"><tspan font-style="italic">AC⁰ ⊊ TC⁰ ⊆ NC¹ ⊆ P</tspan>  &#8212; each class is strictly contained in the next; Transformers cap out at TC⁰</text>
  </g>
</svg>
