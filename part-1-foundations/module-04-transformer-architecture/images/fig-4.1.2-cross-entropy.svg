<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Cross-Entropy = Entropy + KL Divergence</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Training loss decomposes into the data's irreducible uncertainty plus the model's avoidable extra cost.</text>

  <!-- Entropy box (left) -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="280" height="160" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="140" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">Entropy  H(P)</text>
    <line x1="20" y1="50" x2="260" y2="50" stroke="#1a4078" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="140" y="78" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">Irreducible uncertainty</text>
    <text x="20" y="104" font-size="12" fill="#1a1a2e">The cost of encoding samples</text>
    <text x="20" y="122" font-size="12" fill="#1a1a2e">from the true distribution P,</text>
    <text x="20" y="140" font-size="12" fill="#1a1a2e">even with a perfect model.</text>
  </g>

  <!-- KL box (left, lower) -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="280" height="160" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="140" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">KL Divergence  D_KL(P || Q)</text>
    <line x1="20" y1="50" x2="260" y2="50" stroke="#b3401b" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="140" y="78" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">Extra cost from using Q</text>
    <text x="20" y="104" font-size="12" fill="#1a1a2e">How much you waste because</text>
    <text x="20" y="122" font-size="12" fill="#1a1a2e">your model Q is not the truth P.</text>
    <text x="20" y="140" font-size="12" font-weight="700" fill="#b3401b">Training minimizes this.</text>
  </g>

  <!-- Cross entropy box (center) -->
  <g transform="translate(490, 250)">
    <rect x="0" y="0" width="320" height="180" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2.5"/>
    <text x="160" y="36" font-size="18" font-weight="700" text-anchor="middle" fill="#7a5e1a">Cross-Entropy</text>
    <text x="160" y="58" font-size="15" text-anchor="middle" fill="#7a5e1a" font-weight="700">H(P, Q)</text>
    <line x1="20" y1="74" x2="300" y2="74" stroke="#7a5e1a" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="160" y="100" font-size="14" text-anchor="middle" fill="#1a1a2e">H(P, Q)  =  H(P)  +  D_KL(P || Q)</text>
    <text x="160" y="130" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">The actual training loss</text>
    <text x="160" y="152" font-size="12" text-anchor="middle" fill="#1a1a2e">Average bits per token under model Q</text>
    <text x="160" y="168" font-size="12" text-anchor="middle" fill="#1a1a2e">when truth is P.</text>
  </g>

  <!-- Perplexity box (right) -->
  <g transform="translate(940, 250)">
    <rect x="0" y="0" width="280" height="180" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="140" y="36" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Perplexity</text>
    <line x1="20" y1="50" x2="260" y2="50" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="140" y="84" font-size="14" text-anchor="middle" fill="#1a1a2e" font-weight="700">PPL  =  exp( H(P, Q) )</text>
    <text x="20" y="116" font-size="12" fill="#1a1a2e">"Effective vocabulary size"</text>
    <text x="20" y="134" font-size="12" fill="#1a1a2e">the model is choosing among</text>
    <text x="20" y="152" font-size="12" fill="#1a1a2e">at each step. Lower = better.</text>
    <text x="20" y="170" font-size="11" font-style="italic" fill="#5a4a3a">PPL = 10 means ~10-way confusion.</text>
  </g>

  <!-- Arrows: Entropy + KL -> CE -->
  <line x1="360" y1="240" x2="488" y2="295" stroke="#1a1a2e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="404" y="260" font-size="14" font-weight="700" fill="#1a1a2e">+</text>
  <line x1="360" y1="440" x2="488" y2="385" stroke="#1a1a2e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="404" y="425" font-size="14" font-weight="700" fill="#1a1a2e">+</text>

  <!-- Arrow CE -> PPL -->
  <line x1="810" y1="340" x2="938" y2="340" stroke="#1a1a2e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="874" y="332" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">exp</text>

  <!-- Why callout -->
  <g transform="translate(80, 555)">
    <rect x="0" y="0" width="560" height="50" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Why this decomposition matters</text>
    <text x="14" y="40" font-size="12" fill="#1a1a2e">H(P) is a fixed floor; only KL is reducible. Loss can never drop below entropy.</text>
  </g>
  <g transform="translate(660, 555)">
    <rect x="0" y="0" width="560" height="50" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#722f8a">When you read papers</text>
    <text x="14" y="40" font-size="12" fill="#1a1a2e">"Loss = 2.3" and "PPL = 9.97" describe the same model: PPL = exp(loss).</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 615)">
    <rect x="0" y="0" width="1140" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Cross-entropy is what you optimize, but it splits cleanly into entropy (the data's noise floor) and KL (your model's gap to truth).</text>
    <text x="20" y="65" font-size="12" fill="#1a1a2e">Perplexity is just exp(cross-entropy), a more intuitive "branching factor" view of the same number.</text>
  </g>
</svg>
