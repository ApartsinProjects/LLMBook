<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a4078"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">RoPE: Rotary Position Embeddings</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Position is encoded by rotating each query/key vector in 2D planes; dot products then depend only on relative distance.</text>

  <!-- Three rotation panels -->
  <!-- Panel: pos 0 -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="280" height="320" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="140" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">pos = 0</text>
    <text x="140" y="46" font-size="12" text-anchor="middle" fill="#5a4a3a">No rotation (identity)</text>
    <!-- axes -->
    <line x1="40" y1="200" x2="240" y2="200" stroke="#5a4a3a" stroke-width="1"/>
    <line x1="140" y1="100" x2="140" y2="300" stroke="#5a4a3a" stroke-width="1"/>
    <circle cx="140" cy="200" r="80" fill="none" stroke="#1a4078" stroke-width="0.8" stroke-dasharray="3,3"/>
    <!-- vector pointing right -->
    <line x1="140" y1="200" x2="220" y2="200" stroke="#1a4078" stroke-width="3" marker-end="url(#arrBlue)"/>
    <text x="225" y="195" font-size="13" font-weight="700" fill="#1a4078">q</text>
    <text x="140" y="320" font-size="11" text-anchor="middle" fill="#5a4a3a">angle = 0</text>
  </g>

  <!-- Panel: pos 3 -->
  <g transform="translate(420, 110)">
    <rect x="0" y="0" width="280" height="320" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="140" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">pos = 3</text>
    <text x="140" y="46" font-size="12" text-anchor="middle" fill="#5a4a3a">Rotated by 3&#995522;</text>
    <line x1="40" y1="200" x2="240" y2="200" stroke="#5a4a3a" stroke-width="1"/>
    <line x1="140" y1="100" x2="140" y2="300" stroke="#5a4a3a" stroke-width="1"/>
    <circle cx="140" cy="200" r="80" fill="none" stroke="#1a4078" stroke-width="0.8" stroke-dasharray="3,3"/>
    <!-- arc indicator -->
    <path d="M 220 200 A 80 80 0 0 0 174 128" fill="none" stroke="#722f8a" stroke-width="1.5"/>
    <text x="200" y="160" font-size="12" font-weight="700" fill="#722f8a">3&#995522;</text>
    <!-- rotated vector approx 60 deg up-right -->
    <line x1="140" y1="200" x2="200" y2="148" stroke="#1a4078" stroke-width="3" marker-end="url(#arrBlue)"/>
    <text x="208" y="142" font-size="13" font-weight="700" fill="#1a4078">k</text>
    <text x="140" y="320" font-size="11" text-anchor="middle" fill="#5a4a3a">angle = 3&#995522;</text>
  </g>

  <!-- Panel: pos 5 -->
  <g transform="translate(740, 110)">
    <rect x="0" y="0" width="280" height="320" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="140" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">pos = 5</text>
    <text x="140" y="46" font-size="12" text-anchor="middle" fill="#5a4a3a">Rotated by 5&#995522;</text>
    <line x1="40" y1="200" x2="240" y2="200" stroke="#5a4a3a" stroke-width="1"/>
    <line x1="140" y1="100" x2="140" y2="300" stroke="#5a4a3a" stroke-width="1"/>
    <circle cx="140" cy="200" r="80" fill="none" stroke="#1a4078" stroke-width="0.8" stroke-dasharray="3,3"/>
    <path d="M 220 200 A 80 80 0 0 0 116 124" fill="none" stroke="#722f8a" stroke-width="1.5"/>
    <text x="186" y="142" font-size="12" font-weight="700" fill="#722f8a">5&#995522;</text>
    <line x1="140" y1="200" x2="160" y2="123" stroke="#1a4078" stroke-width="3" marker-end="url(#arrBlue)"/>
    <text x="166" y="118" font-size="13" font-weight="700" fill="#1a4078">q</text>
    <text x="140" y="320" font-size="11" text-anchor="middle" fill="#5a4a3a">angle = 5&#995522;</text>
  </g>

  <!-- Right side: relative-distance equation -->
  <g transform="translate(1050, 110)">
    <rect x="0" y="0" width="220" height="320" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="110" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Key property</text>
    <text x="110" y="68" font-size="13" text-anchor="middle" fill="#1a1a2e" font-weight="700">q(pos=5) . k(pos=3)</text>
    <text x="110" y="92" font-size="12" text-anchor="middle" fill="#5a4a3a">depends only on</text>
    <text x="110" y="118" font-size="14" text-anchor="middle" fill="#1f7a3a" font-weight="700">|5 - 3| = 2</text>
    <line x1="20" y1="140" x2="200" y2="140" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="110" y="170" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Translation invariant</text>
    <text x="20" y="196" font-size="11" fill="#1a1a2e">Shifting both tokens by +k</text>
    <text x="20" y="214" font-size="11" fill="#1a1a2e">leaves their dot product</text>
    <text x="20" y="232" font-size="11" fill="#1a1a2e">unchanged. Only the gap</text>
    <text x="20" y="250" font-size="11" fill="#1a1a2e">between positions matters.</text>
    <text x="110" y="290" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">Enables length</text>
    <text x="110" y="306" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">extrapolation.</text>
  </g>

  <!-- Why callout band -->
  <g transform="translate(100, 470)">
    <rect x="0" y="0" width="600" height="100" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="13" font-weight="700" fill="#7a5e1a">Why rotate instead of add?</text>
    <text x="14" y="48" font-size="12" fill="#1a1a2e">Sinusoidal embeddings ADD position into the input. RoPE MULTIPLIES the</text>
    <text x="14" y="66" font-size="12" fill="#1a1a2e">query and key by a 2D rotation matrix R(pos*&#995522;). When q and k are dotted,</text>
    <text x="14" y="84" font-size="12" fill="#1a1a2e">the absolute angles cancel and only the difference (relative position) survives.</text>
  </g>

  <g transform="translate(720, 470)">
    <rect x="0" y="0" width="480" height="100" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="13" font-weight="700" fill="#722f8a">Where you see it</text>
    <text x="14" y="48" font-size="12" fill="#1a1a2e">LLaMA, Mistral, Qwen, DeepSeek: all use RoPE. Long-context</text>
    <text x="14" y="66" font-size="12" fill="#1a1a2e">tricks (NTK scaling, YaRN) work by rescaling the &#995522; frequencies</text>
    <text x="14" y="84" font-size="12" fill="#1a1a2e">to stretch positions seen during training to longer sequences.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1140" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">RoPE rotates each query/key by an angle proportional to its position. The dot product q . k then depends only on the gap</text>
    <text x="20" y="65" font-size="12" fill="#1a1a2e">between the two tokens, giving the model native, translation invariant relative position with no extra parameters.</text>
  </g>
</svg>
