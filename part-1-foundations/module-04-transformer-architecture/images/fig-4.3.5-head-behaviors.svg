<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>Attention head specializations</title>
  <rect width="1100" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrAH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Attention head specializations</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Different heads in the same layer learn distinct attention patterns</text>

  <!-- Head 1: Syntactic -->
  <g transform="translate(40, 100)">
    <rect width="240" height="240" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="120" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Syntactic</text>
    <text x="120" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">verb attends to subject</text>

    <g font-size="13" fill="#1a1a2e">
      <text x="20" y="130">The</text>
      <text x="60" y="130" font-weight="700" fill="#1a4078">cat</text>
      <text x="100" y="130">slept,</text>
      <text x="160" y="130" font-weight="700" fill="#1a4078">jumps</text>
    </g>
    <path d="M 170 122 Q 110 90 70 122" fill="none" stroke="#1a4078" stroke-width="2.5" marker-end="url(#arrAH)"/>
    <text x="120" y="180" font-size="11" text-anchor="middle" fill="#5a4a3a">long-range grammar</text>
    <text x="120" y="210" font-size="11" font-style="italic" text-anchor="middle" fill="#1a4078">agreement head</text>
  </g>

  <!-- Head 2: Local -->
  <g transform="translate(300, 100)">
    <rect width="240" height="240" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="120" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Local</text>
    <text x="120" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">sliding window pattern</text>

    <!-- 4x4 diagonal heatmap -->
    <g transform="translate(70, 80)">
      <rect x="0" y="0" width="22" height="22" fill="#1f7a3a"/>
      <rect x="22" y="0" width="22" height="22" fill="#1f7a3a" opacity="0.4"/>
      <rect x="44" y="0" width="22" height="22" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="0.5"/>
      <rect x="66" y="0" width="22" height="22" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="0.5"/>
      <rect x="0" y="22" width="22" height="22" fill="#1f7a3a" opacity="0.4"/>
      <rect x="22" y="22" width="22" height="22" fill="#1f7a3a"/>
      <rect x="44" y="22" width="22" height="22" fill="#1f7a3a" opacity="0.4"/>
      <rect x="66" y="22" width="22" height="22" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="0.5"/>
      <rect x="0" y="44" width="22" height="22" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="0.5"/>
      <rect x="22" y="44" width="22" height="22" fill="#1f7a3a" opacity="0.4"/>
      <rect x="44" y="44" width="22" height="22" fill="#1f7a3a"/>
      <rect x="66" y="44" width="22" height="22" fill="#1f7a3a" opacity="0.4"/>
      <rect x="0" y="66" width="22" height="22" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="0.5"/>
      <rect x="22" y="66" width="22" height="22" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="0.5"/>
      <rect x="44" y="66" width="22" height="22" fill="#1f7a3a" opacity="0.4"/>
      <rect x="66" y="66" width="22" height="22" fill="#1f7a3a"/>
    </g>
    <text x="120" y="210" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">diagonal band</text>
  </g>

  <!-- Head 3: Induction -->
  <g transform="translate(560, 100)">
    <rect width="240" height="240" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="120" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Induction</text>
    <text x="120" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">copies prior pattern</text>

    <g font-size="16" font-weight="700">
      <text x="30" y="130" fill="#722f8a">A</text>
      <text x="55" y="130" fill="#722f8a">B</text>
      <text x="85" y="130" fill="#5a4a3a">. . .</text>
      <text x="140" y="130" fill="#722f8a">A</text>
      <text x="170" y="130" fill="#1a1a2e">?</text>
    </g>
    <path d="M 145 140 Q 145 170 175 140" fill="none" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arrAH)"/>
    <text x="200" y="143" font-size="14" font-weight="700" fill="#722f8a">B</text>

    <text x="120" y="200" font-size="11" font-style="italic" text-anchor="middle" fill="#722f8a">in-context learning</text>
  </g>

  <!-- Head 4: Positional -->
  <g transform="translate(820, 100)">
    <rect width="240" height="240" rx="10" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="120" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Positional</text>
    <text x="120" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">attends to fixed offset</text>

    <rect x="60" y="80" width="120" height="22" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="120" y="96" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">[BOS]</text>
    <rect x="60" y="108" width="120" height="22" fill="#ffffff" stroke="#a67c1a" stroke-width="1"/>
    <text x="120" y="124" font-size="12" text-anchor="middle" fill="#1a1a2e">tok 1</text>
    <rect x="60" y="136" width="120" height="22" fill="#ffffff" stroke="#a67c1a" stroke-width="1"/>
    <text x="120" y="152" font-size="12" text-anchor="middle" fill="#1a1a2e">tok 2</text>

    <path d="M 55 119 Q 35 110 55 102" fill="none" stroke="#a67c1a" stroke-width="1.8" marker-end="url(#arrAH)"/>
    <path d="M 55 147 Q 25 124 55 102" fill="none" stroke="#a67c1a" stroke-width="1.8" marker-end="url(#arrAH)"/>

    <text x="120" y="200" font-size="11" font-style="italic" text-anchor="middle" fill="#a67c1a">attention sink</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 380)">
    <rect width="1020" height="150" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">A multi-head layer is a committee of specialists</text>
    <text x="510" y="60" font-size="12" text-anchor="middle" fill="#1a1a2e">Heads spontaneously divide the labor of language. The roles emerge from training, not design.</text>
    <text x="510" y="92" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Visualize attention matrices: diagonals (local), arcs (syntactic), A-B-A spikes (induction).</text>
    <text x="510" y="120" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Pruning and quantization can target head types: keep induction heads at full bits.</text>
  </g>
</svg>
