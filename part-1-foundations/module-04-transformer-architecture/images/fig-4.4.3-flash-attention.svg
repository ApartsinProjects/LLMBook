<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">FlashAttention: Tile Through SRAM, Never Materialize T×T</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">IO-aware attention — same math, but never writes the full attention matrix to slow HBM</text>

  <!-- LEFT: Naive attention -->
  <g>
    <rect x="60" y="110" width="560" height="380" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="340" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Naive attention</text>
    <text x="340" y="166" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">materializes full T × T matrix in HBM</text>

    <!-- Big T×T matrix -->
    <rect x="180" y="200" width="320" height="200" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="340" y="295" font-size="18" font-weight="700" text-anchor="middle" fill="#b3401b">scores T × T</text>
    <text x="340" y="320" font-size="12" text-anchor="middle" fill="#5a4a3a">e.g. 8192 × 8192 = 67M floats</text>
    <text x="340" y="340" font-size="12" text-anchor="middle" fill="#5a4a3a">= 256 MB at fp32</text>

    <text x="340" y="430" font-size="12" font-weight="600" text-anchor="middle" fill="#b3401b">⚠ HBM bandwidth-bound</text>
    <text x="340" y="450" font-size="11" text-anchor="middle" fill="#5a4a3a">most time spent moving the matrix</text>
    <text x="340" y="468" font-size="11" text-anchor="middle" fill="#5a4a3a">between HBM and SRAM (3 round trips)</text>
  </g>

  <!-- RIGHT: FlashAttention -->
  <g>
    <rect x="680" y="110" width="560" height="380" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="960" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">FlashAttention</text>
    <text x="960" y="166" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">tiled compute, never touches full matrix</text>

    <!-- Tiled grid 4x4 -->
    <g>
      <text x="960" y="195" font-size="11" font-weight="600" text-anchor="middle" fill="#1f7a3a">Q × Kᵀ tiled</text>

      <!-- 4x4 tiles -->
      <g>
        <!-- Single highlighted tile + faded others -->
        <rect x="800" y="210" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
        <rect x="880" y="210" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
        <rect x="960" y="210" width="80" height="50" fill="#1f7a3a" stroke="#1f7a3a" stroke-width="2"/>
        <text x="1000" y="240" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">tile</text>
        <rect x="1040" y="210" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>

        <rect x="800" y="260" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
        <rect x="880" y="260" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
        <rect x="960" y="260" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
        <rect x="1040" y="260" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>

        <rect x="800" y="310" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
        <rect x="880" y="310" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
        <rect x="960" y="310" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
        <rect x="1040" y="310" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>

        <rect x="800" y="360" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
        <rect x="880" y="360" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
        <rect x="960" y="360" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
        <rect x="1040" y="360" width="80" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
      </g>
    </g>

    <text x="960" y="445" font-size="12" font-weight="600" text-anchor="middle" fill="#1f7a3a">★ each tile fits in fast SRAM (~100 KB)</text>
    <text x="960" y="465" font-size="11" text-anchor="middle" fill="#5a4a3a">online softmax keeps running max + sum</text>
    <text x="960" y="483" font-size="11" text-anchor="middle" fill="#5a4a3a">→ output accumulated tile-by-tile, no T×T storage</text>
  </g>

  <!-- Bottom: 4-step recipe -->
  <g transform="translate(60, 510)">
    <rect x="0" y="0" width="1180" height="160" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="590" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">FlashAttention recipe (per tile)</text>
    <line x1="20" y1="46" x2="1160" y2="46" stroke="#7a5e1a" stroke-width="0.6"/>

    <g font-size="13" fill="#1a1a2e">
      <text x="40" y="78"><tspan font-weight="700" fill="#7a5e1a">1.</tspan> Load Q-block and K-block from HBM into SRAM</text>
      <text x="40" y="105"><tspan font-weight="700" fill="#7a5e1a">2.</tspan> Compute tile of scores = Q · Kᵀ (entirely in SRAM, no HBM round trip)</text>
      <text x="40" y="132"><tspan font-weight="700" fill="#7a5e1a">3.</tspan> Online softmax: track running max + sum across tiles to keep numerical stability</text>
    </g>
    <g font-size="13" fill="#1a1a2e">
      <text x="640" y="78"><tspan font-weight="700" fill="#7a5e1a">4.</tspan> Multiply by V-block and accumulate into output tile</text>
      <text x="640" y="105"><tspan font-weight="700" fill="#7a5e1a">5.</tspan> Move to next tile; only output (n × d) ever written to HBM</text>
      <text x="640" y="138" font-style="italic" fill="#1f7a3a">Result: 2-4× speedup, O(N) memory instead of O(N²)</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 690)">
    <rect x="0" y="0" width="1180" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">FlashAttention is mathematically identical to standard attention. The win is hardware-aware scheduling: keep small tiles in SRAM, never round-trip the full T × T matrix through HBM.</text>
  </g>
</svg>
