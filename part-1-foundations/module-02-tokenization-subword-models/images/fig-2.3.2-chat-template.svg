<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Anatomy of a Chat Template</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">The friendly "messages array" your code passes is rendered into one flat string with role markers the model was trained on.</text>

  <!-- Section labels -->
  <text x="290" y="100" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">What you write (Python)</text>
  <text x="780" y="100" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">What the model actually sees (rendered string)</text>

  <!-- Left: Python messages list -->
  <g transform="translate(60,120)">
    <rect width="460" height="500" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1a1a2e">
      <text x="20" y="32">messages = [</text>
      <text x="40" y="56">{</text>
      <text x="60" y="80">"role": "system",</text>
      <text x="60" y="104">"content": "You are a helpful</text>
      <text x="60" y="120">             assistant."</text>
      <text x="40" y="144">},</text>
      <text x="40" y="172">{</text>
      <text x="60" y="196">"role": "user",</text>
      <text x="60" y="220">"content": "Explain BPE vs</text>
      <text x="60" y="236">             WordPiece."</text>
      <text x="40" y="260">},</text>
      <text x="40" y="288">{</text>
      <text x="60" y="312">"role": "assistant",</text>
      <text x="60" y="336">"content": "BPE merges the most</text>
      <text x="60" y="352">             frequent pairs..."</text>
      <text x="40" y="376">}</text>
      <text x="20" y="400">]</text>
    </g>
    <line x1="20" y1="420" x2="440" y2="420" stroke="#1a4078" stroke-width="0.8" stroke-dasharray="3,3"/>
    <text x="20" y="446" font-size="12" fill="#1a1a2e" font-family="Consolas, monospace">tokenizer.apply_chat_template(</text>
    <text x="40" y="464" font-size="12" fill="#1a1a2e" font-family="Consolas, monospace">messages, tokenize=False)</text>
    <text x="20" y="488" font-size="11" font-style="italic" fill="#5a4a3a">A tiny Jinja template inside the</text>
    <text x="20" y="504" font-size="11" font-style="italic" fill="#5a4a3a">tokenizer does the conversion.</text>
  </g>

  <!-- Arrow between -->
  <g transform="translate(530,360)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="20" y="-10" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">render</text>
  </g>

  <!-- Right: rendered string with role blocks -->
  <g transform="translate(580,120)">
    <rect width="500" height="500" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>

    <!-- System block -->
    <g transform="translate(20,24)">
      <rect width="460" height="92" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
      <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1a1a2e">
        <text x="14" y="24" fill="#722f8a" font-weight="700">&lt;|im_start|&gt;system</text>
        <text x="14" y="46">You are a helpful assistant.</text>
        <text x="14" y="68" fill="#722f8a" font-weight="700">&lt;|im_end|&gt;</text>
      </g>
      <!-- anchor for callout A -->
      <circle cx="455" cy="24" r="11" fill="#d4b96a" stroke="#7a5e1a" stroke-width="1.2"/>
      <text x="455" y="28" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">A</text>
    </g>

    <!-- User block -->
    <g transform="translate(20,134)">
      <rect width="460" height="92" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1a1a2e">
        <text x="14" y="24" fill="#1a4078" font-weight="700">&lt;|im_start|&gt;user</text>
        <text x="14" y="46">Explain BPE vs WordPiece.</text>
        <text x="14" y="68" fill="#1a4078" font-weight="700">&lt;|im_end|&gt;</text>
      </g>
      <circle cx="455" cy="24" r="11" fill="#d4b96a" stroke="#7a5e1a" stroke-width="1.2"/>
      <text x="455" y="28" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">B</text>
    </g>

    <!-- Assistant block -->
    <g transform="translate(20,244)">
      <rect width="460" height="112" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
      <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1a1a2e">
        <text x="14" y="24" fill="#1f7a3a" font-weight="700">&lt;|im_start|&gt;assistant</text>
        <text x="14" y="46">BPE merges the most frequent pairs...</text>
        <text x="14" y="68" fill="#1f7a3a" font-weight="700">&lt;|im_end|&gt;</text>
      </g>
      <circle cx="455" cy="24" r="11" fill="#d4b96a" stroke="#7a5e1a" stroke-width="1.2"/>
      <text x="455" y="28" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">C</text>
    </g>

    <!-- Generation prompt -->
    <g transform="translate(20,374)">
      <rect width="460" height="56" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.2" stroke-dasharray="5,3"/>
      <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1a1a2e">
        <text x="14" y="22" fill="#b3401b" font-weight="700">&lt;|im_start|&gt;assistant</text>
        <text x="14" y="42" font-style="italic" fill="#5a4a3a">(model generates from here)</text>
      </g>
      <circle cx="455" cy="22" r="11" fill="#d4b96a" stroke="#7a5e1a" stroke-width="1.2"/>
      <text x="455" y="26" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">D</text>
    </g>

    <text x="20" y="450" font-size="11" font-style="italic" fill="#5a4a3a">Format shown: ChatML (Qwen, OpenAI internal). Llama 3 uses</text>
    <text x="20" y="466" font-size="11" font-style="italic" fill="#5a4a3a">&lt;|begin_of_text|&gt; + &lt;|start_header_id|&gt;; Mistral uses [INST]...[/INST].</text>
    <text x="20" y="486" font-size="11" font-style="italic" fill="#5a4a3a">Different markers, same idea: special tokens delimit roles.</text>
  </g>

  <!-- Side callouts at right -->
  <g transform="translate(1100,120)">
    <!-- Callout A -->
    <g>
      <rect width="180" height="100" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="10" fill="#d4b96a" stroke="#7a5e1a" stroke-width="1"/>
      <text x="14" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">A</text>
      <text x="34" y="20" font-size="12" font-weight="700" fill="#7a5e1a">Special tokens</text>
      <text x="14" y="44" font-size="11" fill="#1a1a2e">&lt;|im_start|&gt; / &lt;|im_end|&gt;</text>
      <text x="14" y="60" font-size="11" fill="#1a1a2e">are single token IDs,</text>
      <text x="14" y="76" font-size="11" fill="#1a1a2e">added during training so</text>
      <text x="14" y="92" font-size="11" fill="#1a1a2e">the model recognizes them.</text>
    </g>
    <!-- Callout B -->
    <g transform="translate(0,114)">
      <rect width="180" height="100" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="10" fill="#d4b96a" stroke="#7a5e1a" stroke-width="1"/>
      <text x="14" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">B</text>
      <text x="34" y="20" font-size="12" font-weight="700" fill="#7a5e1a">Role tag</text>
      <text x="14" y="44" font-size="11" fill="#1a1a2e">"system", "user", or</text>
      <text x="14" y="60" font-size="11" fill="#1a1a2e">"assistant" follows the</text>
      <text x="14" y="76" font-size="11" fill="#1a1a2e">opener; this is plain</text>
      <text x="14" y="92" font-size="11" fill="#1a1a2e">text, not a special token.</text>
    </g>
    <!-- Callout C -->
    <g transform="translate(0,228)">
      <rect width="180" height="116" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="10" fill="#d4b96a" stroke="#7a5e1a" stroke-width="1"/>
      <text x="14" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">C</text>
      <text x="34" y="20" font-size="12" font-weight="700" fill="#7a5e1a">Past assistant turn</text>
      <text x="14" y="44" font-size="11" fill="#1a1a2e">Prior assistant replies</text>
      <text x="14" y="60" font-size="11" fill="#1a1a2e">are included verbatim so</text>
      <text x="14" y="76" font-size="11" fill="#1a1a2e">the model has the full</text>
      <text x="14" y="92" font-size="11" fill="#1a1a2e">conversation context, not</text>
      <text x="14" y="108" font-size="11" fill="#1a1a2e">just the latest user msg.</text>
    </g>
    <!-- Callout D -->
    <g transform="translate(0,358)">
      <rect width="180" height="120" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="10" fill="#b3401b" stroke="#b3401b" stroke-width="1"/>
      <text x="14" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">D</text>
      <text x="34" y="20" font-size="12" font-weight="700" fill="#b3401b">Generation prompt</text>
      <text x="14" y="44" font-size="11" fill="#1a1a2e">An open assistant header</text>
      <text x="14" y="60" font-size="11" fill="#1a1a2e">with no closing tag tells</text>
      <text x="14" y="76" font-size="11" fill="#1a1a2e">the model: "your turn."</text>
      <text x="14" y="98" font-size="11" font-style="italic" fill="#5a4a3a">Forget this and the model</text>
      <text x="14" y="114" font-size="11" font-style="italic" fill="#5a4a3a">may produce a user reply.</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60,650)">
    <rect width="1180" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">A "chat" is just a flat string of tokens; the structured messages list is convenience syntax that the tokenizer renders into the exact role-marker format the model was trained on.</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">Always use apply_chat_template() rather than concatenating strings yourself; each model family has its own special tokens.</text>
  </g>
</svg>
