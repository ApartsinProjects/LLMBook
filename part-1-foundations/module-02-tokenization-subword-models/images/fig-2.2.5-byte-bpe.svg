<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Byte-level BPE: every Unicode string is reachable via 256 byte fallback</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Encode text as UTF-8 bytes first; learn merges over a closed 256-symbol alphabet so unknown characters never break the tokenizer</text>

  <!-- Pipeline stages -->
  <!-- Stage 1: Characters -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="280" height="170" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="140" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">1. Raw characters</text>
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="50" height="50" rx="6" fill="#ffffff" stroke="#1a4078"/>
      <text x="25" y="33" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">H</text>
      <rect x="60" y="0" width="50" height="50" rx="6" fill="#ffffff" stroke="#1a4078"/>
      <text x="85" y="33" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">i</text>
      <rect x="120" y="0" width="50" height="50" rx="6" fill="#ffffff" stroke="#1a4078"/>
      <text x="145" y="33" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">你</text>
      <rect x="180" y="0" width="50" height="50" rx="6" fill="#ffffff" stroke="#1a4078"/>
      <text x="205" y="33" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">好</text>
    </g>
    <text x="140" y="130" font-size="11" text-anchor="middle" fill="#5a4a3a">Mixed scripts: ASCII + CJK</text>
    <text x="140" y="150" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">4 characters total</text>
  </g>

  <!-- Arrow -->
  <line x1="345" y1="195" x2="395" y2="195" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="370" y="185" font-size="11" text-anchor="middle" fill="#5a4a3a">UTF-8 encode</text>

  <!-- Stage 2: Bytes -->
  <g transform="translate(400, 110)">
    <rect x="0" y="0" width="460" height="170" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="230" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">2. UTF-8 byte stream (alphabet of 256)</text>
    <g transform="translate(20, 48)">
      <!-- H = 0x48 -->
      <g>
        <rect x="0" y="0" width="50" height="42" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
        <text x="25" y="18" font-size="11" text-anchor="middle" fill="#5a4a3a">H</text>
        <text x="25" y="34" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">0x48</text>
      </g>
      <g transform="translate(54, 0)">
        <rect x="0" y="0" width="50" height="42" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
        <text x="25" y="18" font-size="11" text-anchor="middle" fill="#5a4a3a">i</text>
        <text x="25" y="34" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">0x69</text>
      </g>
      <!-- 你 -->
      <g transform="translate(118, 0)">
        <rect x="0" y="0" width="160" height="42" rx="4" fill="#ffffff" stroke="#7a5e1a" stroke-width="1.5"/>
        <text x="80" y="18" font-size="11" text-anchor="middle" fill="#5a4a3a">你 (3 bytes)</text>
        <text x="80" y="34" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">0xE4 0xBD 0xA0</text>
      </g>
      <!-- 好 -->
      <g transform="translate(282, 0)">
        <rect x="0" y="0" width="160" height="42" rx="4" fill="#ffffff" stroke="#7a5e1a" stroke-width="1.5"/>
        <text x="80" y="18" font-size="11" text-anchor="middle" fill="#5a4a3a">好 (3 bytes)</text>
        <text x="80" y="34" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">0xE5 0xA5 0xBD</text>
      </g>
    </g>
    <text x="230" y="118" font-size="11" text-anchor="middle" fill="#5a4a3a">8 bytes total. ASCII = 1 byte; non-Latin = 2 to 4 bytes.</text>
    <text x="230" y="138" font-size="11" text-anchor="middle" fill="#1a1a2e" font-weight="700">Alphabet is closed at 256 symbols, so coverage is total.</text>
    <text x="230" y="156" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">No &lt;UNK&gt; ever needed.</text>
  </g>

  <!-- Arrow -->
  <line x1="865" y1="195" x2="915" y2="195" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="890" y="185" font-size="11" text-anchor="middle" fill="#5a4a3a">BPE merges</text>

  <!-- Stage 3: Tokens -->
  <g transform="translate(920, 110)">
    <rect x="0" y="0" width="320" height="170" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="160" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. After BPE merges</text>
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="70" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="35" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Hi</text>
      <text x="35" y="40" font-size="11" text-anchor="middle" fill="#5a4a3a">2 bytes merged</text>

      <rect x="80" y="0" width="80" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="120" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">你</text>
      <text x="120" y="40" font-size="11" text-anchor="middle" fill="#5a4a3a">3 bytes merged</text>

      <rect x="170" y="0" width="80" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="210" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">好</text>
      <text x="210" y="40" font-size="11" text-anchor="middle" fill="#5a4a3a">3 bytes merged</text>
    </g>
    <text x="160" y="130" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">3 tokens</text>
    <text x="160" y="150" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">8 bytes compressed by learned merges</text>
  </g>

  <!-- BYTE FALLBACK callout -->
  <g transform="translate(60, 320)">
    <rect x="0" y="0" width="580" height="270" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#7a5e1a">Why byte fallback matters</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">A char-level BPE crashes on unseen Unicode (emoji, rare scripts, control chars).</text>
    <text x="20" y="72" font-size="12" fill="#1a1a2e">Byte-level BPE is closed under all of Unicode because every code point decomposes</text>
    <text x="20" y="88" font-size="12" fill="#1a1a2e">into bytes from the fixed 0x00 to 0xFF alphabet.</text>

    <!-- Example: rare emoji -->
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="540" height="60" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#7a5e1a">Example: a never-seen emoji 🦄</text>
      <text x="12" y="40" font-size="12" fill="#1a1a2e">UTF-8 = 0xF0 0x9F 0xA6 0x84  -&gt;  4 byte tokens, no merge needed, no &lt;UNK&gt;</text>
      <text x="12" y="54" font-size="11" fill="#5a4a3a" font-style="italic">Decoding produces the original emoji byte-for-byte.</text>
    </g>

    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="540" height="72" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#7a5e1a">Tradeoff</text>
      <text x="12" y="40" font-size="12" fill="#1a1a2e">CJK and rare scripts cost more tokens per character than Latin text.</text>
      <text x="12" y="58" font-size="12" fill="#1a1a2e">Worth it: total coverage with no special-case unknown-token handling.</text>
    </g>
  </g>

  <!-- Right: Vocabulary structure -->
  <g transform="translate(680, 320)">
    <rect x="0" y="0" width="560" height="270" rx="10" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#1a4078">Vocabulary anatomy (e.g. GPT-2 / Llama BPE)</text>

    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="520" height="50" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Base layer: 256 byte tokens</text>
      <text x="12" y="40" font-size="11" fill="#1a1a2e">0x00 ... 0xFF — guaranteed coverage of any input</text>
    </g>

    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="520" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Merge layer: ~50k learned pairs</text>
      <text x="12" y="40" font-size="11" fill="#1a1a2e">Pairs of bytes (or earlier merges) ranked by training-corpus frequency</text>
    </g>

    <g transform="translate(20, 170)">
      <rect x="0" y="0" width="520" height="50" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#722f8a">Special tokens</text>
      <text x="12" y="40" font-size="11" fill="#1a1a2e">&lt;|bos|&gt;, &lt;|eos|&gt;, &lt;|pad|&gt;, chat-template markers</text>
    </g>

    <text x="20" y="244" font-size="11" fill="#5a4a3a" font-style="italic">Final vocab size = 256 + merges + special tokens (e.g. 50,257 for GPT-2)</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 660)">
    <rect x="0" y="0" width="1180" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Byte-level BPE swaps the unbounded character alphabet for the fixed 256-byte UTF-8 alphabet, then learns merges on top.</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">The 256-byte base layer guarantees lossless coverage of any Unicode input; merges supply efficiency for the common scripts seen during training.</text>
  </g>
</svg>
