<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>Byte-level BPE: every Unicode string is reachable</title>
  <rect width="1100" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrBPE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Byte-level BPE</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">UTF-8 first, then learn merges over a fixed 256-symbol alphabet</text>

  <!-- Stage 1: characters -->
  <g transform="translate(40, 100)">
    <rect width="240" height="140" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="120" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Raw characters</text>

    <rect x="20" y="48" width="44" height="44" rx="4" fill="#ffffff" stroke="#1a4078"/>
    <text x="42" y="78" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a2e">H</text>
    <rect x="72" y="48" width="44" height="44" rx="4" fill="#ffffff" stroke="#1a4078"/>
    <text x="94" y="78" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a2e">i</text>
    <rect x="124" y="48" width="44" height="44" rx="4" fill="#ffffff" stroke="#1a4078"/>
    <text x="146" y="78" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a2e">你</text>
    <rect x="176" y="48" width="44" height="44" rx="4" fill="#ffffff" stroke="#1a4078"/>
    <text x="198" y="78" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a2e">好</text>

    <text x="120" y="120" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">ASCII + CJK mix</text>
  </g>

  <line x1="285" y1="170" x2="335" y2="170" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrBPE)"/>
  <text x="310" y="160" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">UTF-8 encode</text>

  <!-- Stage 2: bytes -->
  <g transform="translate(340, 100)">
    <rect width="380" height="140" rx="10" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="190" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">UTF-8 byte stream</text>
    <text x="190" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">256-symbol alphabet</text>

    <rect x="20" y="62" width="50" height="36" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
    <text x="45" y="84" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">0x48</text>

    <rect x="76" y="62" width="50" height="36" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
    <text x="101" y="84" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">0x69</text>

    <rect x="132" y="62" width="106" height="36" rx="4" fill="#ffffff" stroke="#a67c1a" stroke-width="1.2"/>
    <text x="185" y="84" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">0xE4 BD A0</text>

    <rect x="244" y="62" width="106" height="36" rx="4" fill="#ffffff" stroke="#a67c1a" stroke-width="1.2"/>
    <text x="297" y="84" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">0xE5 A5 BD</text>

    <text x="190" y="125" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">8 bytes; no UNK ever</text>
  </g>

  <line x1="725" y1="170" x2="775" y2="170" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrBPE)"/>
  <text x="750" y="160" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">BPE merges</text>

  <!-- Stage 3: tokens -->
  <g transform="translate(780, 100)">
    <rect width="280" height="140" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="140" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">After BPE merges</text>

    <rect x="20" y="50" width="70" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="55" y="78" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a2e">Hi</text>

    <rect x="100" y="50" width="70" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="135" y="78" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a2e">你</text>

    <rect x="180" y="50" width="70" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="215" y="78" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a2e">好</text>

    <text x="140" y="120" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">3 tokens</text>
  </g>

  <!-- Vocabulary structure -->
  <g transform="translate(40, 280)">
    <rect width="500" height="200" rx="10" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <text x="250" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Vocabulary anatomy</text>

    <rect x="20" y="46" width="460" height="40" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="40" y="71" font-size="12" font-weight="700" fill="#a67c1a">256 byte tokens (0x00 to 0xFF)</text>

    <rect x="20" y="98" width="460" height="40" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="40" y="123" font-size="12" font-weight="700" fill="#1f7a3a">~50k learned merges</text>

    <rect x="20" y="150" width="460" height="40" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="40" y="175" font-size="12" font-weight="700" fill="#722f8a">special tokens (bos, eos, pad)</text>
  </g>

  <!-- Byte fallback callout -->
  <g transform="translate(560, 280)">
    <rect width="500" height="200" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="2"/>
    <text x="250" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Byte fallback</text>

    <text x="20" y="58" font-size="12" fill="#1a1a2e">Char-level BPE crashes on unseen Unicode.</text>
    <text x="20" y="80" font-size="12" fill="#1a1a2e">Byte BPE is closed under all of Unicode.</text>

    <text x="20" y="118" font-size="12" font-weight="700" fill="#a67c1a">Example: never-seen emoji</text>
    <text x="20" y="140" font-size="12" fill="#1a1a2e">UTF-8 = 0xF0 9F A6 84 to 4 byte tokens</text>
    <text x="20" y="162" font-size="11" font-style="italic" fill="#5a4a3a">Decodes byte-for-byte; no UNK.</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 500)">
    <rect width="1020" height="50" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Fixed 256-byte base guarantees coverage; merges supply efficiency</text>
    <text x="510" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">Final vocab = 256 bytes + ~50k merges + a handful of special tokens.</text>
  </g>
</svg>
