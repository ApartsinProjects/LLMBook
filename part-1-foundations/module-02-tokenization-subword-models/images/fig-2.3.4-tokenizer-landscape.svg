<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="750" y="46" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">The tokenizer landscape: three families that power modern LLMs</text>
  <text x="750" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Almost every production tokenizer is a variant of one of these three. Pick one based on language coverage, vocabulary budget, and training algorithm.</text>

  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="450" height="600" rx="14" fill="#ffffff" stroke="#1a4078" stroke-width="2.5"/>
    <rect x="0" y="0" width="450" height="70" rx="14" fill="#1a4078"/>
    <text x="225" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">Byte-level BPE (BBPE)</text>
    <text x="225" y="58" font-size="13" font-style="italic" text-anchor="middle" fill="#cfd8e6">Greedy merges over raw UTF-8 bytes</text>

    <g transform="translate(20, 90)">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#1a4078">USED BY</text>
      <rect x="0"   y="24" width="135" height="34" rx="5" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="68"  y="46" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">GPT-2/3/4</text>
      <rect x="142" y="24" width="135" height="34" rx="5" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="210" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Llama 2/3</text>
      <rect x="285" y="24" width="125" height="34" rx="5" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="347" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">RoBERTa</text>
      <rect x="0"   y="64" width="135" height="34" rx="5" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="68"  y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Mistral</text>
      <rect x="142" y="64" width="135" height="34" rx="5" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="210" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Qwen</text>
      <rect x="285" y="64" width="125" height="34" rx="5" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="347" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">DeepSeek</text>
    </g>

    <g transform="translate(20, 220)">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#1a4078">VOCAB SIZE</text>
      <rect x="0" y="24" width="410" height="60" rx="6" fill="#f6f9fc" stroke="#1a4078" stroke-width="1"/>
      <text x="205" y="50" font-size="22" font-weight="700" text-anchor="middle" fill="#1a4078">50k - 200k</text>
      <text x="205" y="72" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">GPT-4: 100k, Llama-3: 128k, Qwen-2: 152k</text>
    </g>

    <g transform="translate(20, 320)">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#1a4078">KEY PROPERTY</text>
      <rect x="0" y="24" width="410" height="100" rx="6" fill="#f6f9fc" stroke="#1a4078" stroke-width="1"/>
      <text x="14" y="48" font-size="14" font-weight="700" fill="#1a1a2e">Lossless on any byte string</text>
      <text x="14" y="70" font-size="13" fill="#1a1a2e">Operates on raw bytes, so it never produces</text>
      <text x="14" y="88" font-size="13" fill="#1a1a2e">[UNK]. Handles emoji, code, every script</text>
      <text x="14" y="106" font-size="13" fill="#1a1a2e">on Earth, and arbitrary binary blobs.</text>
    </g>

    <g transform="translate(20, 450)">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#1a4078">TRADEOFF</text>
      <rect x="0" y="24" width="410" height="50" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="14" y="46" font-size="13" fill="#1a1a2e">Greedy merges. No backtracking,</text>
      <text x="14" y="62" font-size="13" fill="#1a1a2e">no probability scores at inference.</text>
    </g>

    <g transform="translate(20, 520)">
      <rect x="0" y="0" width="410" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Pick when</text>
      <text x="14" y="42" font-size="12" fill="#1a1a2e">you ship a general-purpose LLM that must accept</text>
      <text x="14" y="56" font-size="12" fill="#1a1a2e">arbitrary user input without preprocessing.</text>
    </g>
  </g>

  <g transform="translate(525, 110)">
    <rect x="0" y="0" width="450" height="600" rx="14" fill="#ffffff" stroke="#722f8a" stroke-width="2.5"/>
    <rect x="0" y="0" width="450" height="70" rx="14" fill="#722f8a"/>
    <text x="225" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">WordPiece</text>
    <text x="225" y="58" font-size="13" font-style="italic" text-anchor="middle" fill="#e6d4ec">Greedy merges by likelihood gain, not frequency</text>

    <g transform="translate(20, 90)">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#722f8a">USED BY</text>
      <rect x="0"   y="24" width="135" height="34" rx="5" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="68"  y="46" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">BERT</text>
      <rect x="142" y="24" width="135" height="34" rx="5" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="210" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">DistilBERT</text>
      <rect x="285" y="24" width="125" height="34" rx="5" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="347" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">ELECTRA</text>
      <rect x="0"   y="64" width="135" height="34" rx="5" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="68"  y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">mBERT</text>
      <rect x="142" y="64" width="268" height="34" rx="5" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="276" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">most encoder-only NLP models</text>
    </g>

    <g transform="translate(20, 220)">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#722f8a">VOCAB SIZE</text>
      <rect x="0" y="24" width="410" height="60" rx="6" fill="#faf6fb" stroke="#722f8a" stroke-width="1"/>
      <text x="205" y="50" font-size="22" font-weight="700" text-anchor="middle" fill="#722f8a">~30k</text>
      <text x="205" y="72" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">BERT-base: 30,522 pieces</text>
    </g>

    <g transform="translate(20, 320)">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#722f8a">KEY PROPERTY</text>
      <rect x="0" y="24" width="410" height="100" rx="6" fill="#faf6fb" stroke="#722f8a" stroke-width="1"/>
      <text x="14" y="48" font-size="14" font-weight="700" fill="#1a1a2e">Continuation marker (## prefix)</text>
      <text x="14" y="70" font-size="13" fill="#1a1a2e">"playing" splits to ["play", "##ing"].</text>
      <text x="14" y="88" font-size="13" fill="#1a1a2e">Trained by maximizing corpus likelihood;</text>
      <text x="14" y="106" font-size="13" fill="#1a1a2e">decode is greedy longest-match.</text>
    </g>

    <g transform="translate(20, 450)">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#722f8a">TRADEOFF</text>
      <rect x="0" y="24" width="410" height="50" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="14" y="46" font-size="13" fill="#1a1a2e">Character-level fallback for rare strings;</text>
      <text x="14" y="62" font-size="13" fill="#1a1a2e">[UNK] possible for chars outside training.</text>
    </g>

    <g transform="translate(20, 520)">
      <rect x="0" y="0" width="410" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Pick when</text>
      <text x="14" y="42" font-size="12" fill="#1a1a2e">you fine-tune a BERT-family model and need</text>
      <text x="14" y="56" font-size="12" fill="#1a1a2e">to keep its existing 30k vocabulary intact.</text>
    </g>
  </g>

  <g transform="translate(1010, 110)">
    <rect x="0" y="0" width="450" height="600" rx="14" fill="#ffffff" stroke="#1f7a3a" stroke-width="2.5"/>
    <rect x="0" y="0" width="450" height="70" rx="14" fill="#1f7a3a"/>
    <text x="225" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">Unigram LM</text>
    <text x="225" y="58" font-size="13" font-style="italic" text-anchor="middle" fill="#cfe6d5">Probabilistic vocabulary, Viterbi decode</text>

    <g transform="translate(20, 90)">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#1f7a3a">USED BY</text>
      <rect x="0"   y="24" width="135" height="34" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="68"  y="46" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">T5 / Flan-T5</text>
      <rect x="142" y="24" width="135" height="34" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="210" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">ALBERT</text>
      <rect x="285" y="24" width="125" height="34" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="347" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">XLNet</text>
      <rect x="0"   y="64" width="135" height="34" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="68"  y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">mT5</text>
      <rect x="142" y="64" width="135" height="34" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="210" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">XLM-R</text>
      <rect x="285" y="64" width="125" height="34" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="347" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Gemma</text>
    </g>

    <g transform="translate(20, 220)">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#1f7a3a">VOCAB SIZE</text>
      <rect x="0" y="24" width="410" height="60" rx="6" fill="#f4faf6" stroke="#1f7a3a" stroke-width="1"/>
      <text x="205" y="50" font-size="22" font-weight="700" text-anchor="middle" fill="#1f7a3a">32k - 256k</text>
      <text x="205" y="72" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">T5: 32k, mT5: 250k (multilingual)</text>
    </g>

    <g transform="translate(20, 320)">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#1f7a3a">KEY PROPERTY</text>
      <rect x="0" y="24" width="410" height="100" rx="6" fill="#f4faf6" stroke="#1f7a3a" stroke-width="1"/>
      <text x="14" y="48" font-size="14" font-weight="700" fill="#1a1a2e">Probabilistic, supports sampling</text>
      <text x="14" y="70" font-size="13" fill="#1a1a2e">Each token has p(w). Decode by Viterbi</text>
      <text x="14" y="88" font-size="13" fill="#1a1a2e">over a lattice; or sample alt splits</text>
      <text x="14" y="106" font-size="13" fill="#1a1a2e">("subword regularization") during training.</text>
    </g>

    <g transform="translate(20, 450)">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#1f7a3a">TRADEOFF</text>
      <rect x="0" y="24" width="410" height="50" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="14" y="46" font-size="13" fill="#1a1a2e">More compute at inference</text>
      <text x="14" y="62" font-size="13" fill="#1a1a2e">(Viterbi vs greedy lookup).</text>
    </g>

    <g transform="translate(20, 520)">
      <rect x="0" y="0" width="410" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Pick when</text>
      <text x="14" y="42" font-size="12" fill="#1a1a2e">you build multilingual models or want</text>
      <text x="14" y="56" font-size="12" fill="#1a1a2e">tokenization-aware regularization at train time.</text>
    </g>
  </g>

  <g transform="translate(40, 730)">
    <rect x="0" y="0" width="1420" height="100" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="52" font-size="13" fill="#1a1a2e">All three are subword tokenizers; they differ in how the vocabulary is BUILT (frequency vs likelihood vs pruning) and how a string is SPLIT at inference (greedy left-right vs Viterbi best-path).</text>
    <text x="20" y="78" font-size="13" fill="#1a1a2e">Modern decoder-only LLMs are dominated by BBPE (no [UNK], byte-safe). BERT-era encoders use WordPiece. Multilingual T5-family models prefer Unigram for its principled handling of rare scripts.</text>
  </g>
</svg>
