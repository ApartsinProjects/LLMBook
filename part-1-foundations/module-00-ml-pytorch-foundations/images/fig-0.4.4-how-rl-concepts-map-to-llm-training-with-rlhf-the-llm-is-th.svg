<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>How RL concepts map to LLM training with RLHF</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">RL terms mapped to RLHF roles</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Top row: classic RL concept. Bottom row: its RLHF realization.</text>

  <text x="60" y="100" font-size="12" font-weight="700" fill="#5a4a3a">RL term</text>
  <text x="60" y="240" font-size="12" font-weight="700" fill="#5a4a3a">RLHF role</text>

  <g transform="translate(60, 110)">
    <rect width="180" height="70" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">State</text>
    <text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">observation</text>
  </g>
  <g transform="translate(60, 250)">
    <rect width="180" height="70" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Prompt</text>
    <text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">input tokens</text>
  </g>

  <g transform="translate(260, 110)">
    <rect width="180" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Policy</text>
    <text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">picks actions</text>
  </g>
  <g transform="translate(260, 250)">
    <rect width="180" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">LLM</text>
    <text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">next-token model</text>
  </g>

  <g transform="translate(460, 110)">
    <rect width="180" height="70" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Trajectory</text>
    <text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">episode rollout</text>
  </g>
  <g transform="translate(460, 250)">
    <rect width="180" height="70" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Response</text>
    <text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">generated reply</text>
  </g>

  <g transform="translate(660, 110)">
    <rect width="180" height="70" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Reward</text>
    <text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">scalar feedback</text>
  </g>
  <g transform="translate(660, 250)">
    <rect width="180" height="70" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Reward model</text>
    <text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">learned scorer</text>
  </g>

  <g transform="translate(860, 110)">
    <rect width="180" height="70" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Optimizer</text>
    <text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">policy gradient</text>
  </g>
  <g transform="translate(860, 250)">
    <rect width="180" height="70" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">PPO</text>
    <text x="90" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">clipped + KL</text>
  </g>

  <g stroke="#1a1a2e" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="245" y1="145" x2="258" y2="145"/>
    <line x1="445" y1="145" x2="458" y2="145"/>
    <line x1="645" y1="145" x2="658" y2="145"/>
    <line x1="845" y1="145" x2="858" y2="145"/>
    <line x1="245" y1="285" x2="258" y2="285"/>
    <line x1="445" y1="285" x2="458" y2="285"/>
    <line x1="645" y1="285" x2="658" y2="285"/>
    <line x1="845" y1="285" x2="858" y2="285"/>
  </g>

  <path d="M 950 320 L 950 380 L 350 380 L 350 320" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrPurple)"/>
  <text x="650" y="372" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">update policy weights, close the loop</text>

  <g transform="translate(60, 420)">
    <rect width="980" height="140" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#a67c1a">Key idea</text>
    <text x="20" y="54" font-size="12" fill="#1a1a2e">RLHF reuses the classic agent loop: the LLM is the policy, generated tokens are actions, a learned reward model</text>
    <text x="20" y="74" font-size="12" fill="#1a1a2e">substitutes for environment reward (language has none for free), and PPO closes the loop.</text>
    <text x="20" y="100" font-size="12" font-style="italic" fill="#5a4a3a">PPO over vanilla PG: clipping bounds per-step drift, KL leash to base LLM prevents reward hacking</text>
    <text x="20" y="118" font-size="12" font-style="italic" fill="#5a4a3a">and preserves general language ability.</text>
  </g>
</svg>
