<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">How RL Concepts Map to LLM Training with RLHF</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">The LLM acts as the policy; the reward model scores responses; PPO closes the loop.</text>

  <!-- Two-row layout: top row = RL term, bottom row = LLM realization -->
  <g font-size="12" fill="#1a1a2e">

    <!-- Stage labels (top row, RL concept) -->
    <text x="170" y="115" font-size="12" font-weight="700" text-anchor="middle" fill="#5a4a3a">RL term</text>
    <text x="170" y="305" font-size="12" font-weight="700" text-anchor="middle" fill="#5a4a3a">LLM realization</text>

    <!-- Node 1: State / Prompt -->
    <g transform="translate(80, 130)">
      <rect width="180" height="120" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
      <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">State</text>
      <text x="90" y="58" font-size="12" text-anchor="middle">Initial situation</text>
      <text x="90" y="78" font-size="12" text-anchor="middle">the agent observes</text>
      <text x="90" y="102" font-size="11" text-anchor="middle" fill="#5a4a3a">(in classic RL: a frame,</text>
      <text x="90" y="116" font-size="11" text-anchor="middle" fill="#5a4a3a">a board, a sensor reading)</text>
    </g>
    <g transform="translate(80, 320)">
      <rect width="180" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
      <text x="90" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">User Prompt</text>
      <text x="90" y="56" font-size="12" text-anchor="middle">Tokens fed to the model</text>
      <text x="90" y="76" font-size="12" text-anchor="middle">as starting context</text>
    </g>

    <!-- Arrow 1 -->
    <line x1="265" y1="190" x2="320" y2="190" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="265" y1="370" x2="320" y2="370" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Node 2: Policy / LLM -->
    <g transform="translate(325, 130)">
      <rect width="180" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Policy</text>
      <text x="90" y="58" font-size="12" text-anchor="middle">Function pi(action | state)</text>
      <text x="90" y="78" font-size="12" text-anchor="middle">that picks the next action</text>
      <text x="90" y="102" font-size="11" text-anchor="middle" fill="#5a4a3a">Trainable parameters</text>
      <text x="90" y="116" font-size="11" text-anchor="middle" fill="#5a4a3a">we optimize</text>
    </g>
    <g transform="translate(325, 320)">
      <rect width="180" height="100" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="90" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">LLM (the policy)</text>
      <text x="90" y="56" font-size="12" text-anchor="middle">P(next token | context);</text>
      <text x="90" y="76" font-size="12" text-anchor="middle">weights are updated</text>
    </g>

    <line x1="510" y1="190" x2="565" y2="190" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="510" y1="370" x2="565" y2="370" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Node 3: Action / Response -->
    <g transform="translate(570, 130)">
      <rect width="180" height="120" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
      <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Action / Trajectory</text>
      <text x="90" y="58" font-size="12" text-anchor="middle">Sequence of choices</text>
      <text x="90" y="78" font-size="12" text-anchor="middle">the policy takes</text>
      <text x="90" y="102" font-size="11" text-anchor="middle" fill="#5a4a3a">An episode rolled out</text>
      <text x="90" y="116" font-size="11" text-anchor="middle" fill="#5a4a3a">in the environment</text>
    </g>
    <g transform="translate(570, 320)">
      <rect width="180" height="100" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
      <text x="90" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Complete Response</text>
      <text x="90" y="56" font-size="12" text-anchor="middle">Each generated token is</text>
      <text x="90" y="76" font-size="12" text-anchor="middle">an action; full reply = trajectory</text>
    </g>

    <line x1="755" y1="190" x2="810" y2="190" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="755" y1="370" x2="810" y2="370" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Node 4: Reward / Reward model -->
    <g transform="translate(815, 130)">
      <rect width="180" height="120" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Reward Signal</text>
      <text x="90" y="58" font-size="12" text-anchor="middle">Scalar feedback from</text>
      <text x="90" y="78" font-size="12" text-anchor="middle">the environment</text>
      <text x="90" y="102" font-size="11" text-anchor="middle" fill="#5a4a3a">Tells the agent how</text>
      <text x="90" y="116" font-size="11" text-anchor="middle" fill="#5a4a3a">good its trajectory was</text>
    </g>
    <g transform="translate(815, 320)">
      <rect width="180" height="100" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="90" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Reward Model</text>
      <text x="90" y="56" font-size="12" text-anchor="middle">Learned scorer trained on</text>
      <text x="90" y="76" font-size="12" text-anchor="middle">human preference pairs</text>
    </g>

    <line x1="1000" y1="190" x2="1055" y2="190" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="1000" y1="370" x2="1055" y2="370" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Node 5: Optimizer / PPO -->
    <g transform="translate(1060, 130)">
      <rect width="180" height="120" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="90" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Optimizer</text>
      <text x="90" y="58" font-size="12" text-anchor="middle">Updates policy weights</text>
      <text x="90" y="78" font-size="12" text-anchor="middle">to raise expected reward</text>
      <text x="90" y="102" font-size="11" text-anchor="middle" fill="#5a4a3a">Policy-gradient family</text>
      <text x="90" y="116" font-size="11" text-anchor="middle" fill="#5a4a3a">(REINFORCE, A2C, PPO)</text>
    </g>
    <g transform="translate(1060, 320)">
      <rect width="180" height="100" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="90" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">PPO</text>
      <text x="90" y="56" font-size="12" text-anchor="middle">Clipped policy update</text>
      <text x="90" y="76" font-size="12" text-anchor="middle">with KL leash to base LLM</text>
    </g>
  </g>

  <!-- Feedback loop arrow PPO -> LLM (dashed, purple) -->
  <path d="M 1150 420 L 1150 490 L 415 490 L 415 425" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <text x="780" y="483" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">update policy weights (close the loop)</text>

  <!-- Callout: Why a learned reward model? -->
  <g transform="translate(80, 515)">
    <rect width="540" height="92" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Why a learned reward model?</text>
    <text x="14" y="44" font-size="12" fill="#1a1a2e">Real environments hand back rewards for free (game score, win/loss).</text>
    <text x="14" y="62" font-size="12" fill="#1a1a2e">Language has no built-in reward, so RLHF trains a model on human</text>
    <text x="14" y="80" font-size="12" fill="#1a1a2e">preference rankings to act as the reward function.</text>
  </g>

  <!-- Callout: Why PPO and not vanilla PG? -->
  <g transform="translate(680, 515)">
    <rect width="540" height="92" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Why PPO, not vanilla policy gradient?</text>
    <text x="14" y="44" font-size="12" fill="#1a1a2e">PPO clips the per-step update so the policy cannot drift far from</text>
    <text x="14" y="62" font-size="12" fill="#1a1a2e">the previous version. A KL penalty against the base LLM prevents</text>
    <text x="14" y="80" font-size="12" fill="#1a1a2e">reward hacking and preserves general language ability.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 625)">
    <rect width="1180" height="58" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="45" font-size="12" fill="#1a1a2e">RLHF reuses the classic agent loop, with the LLM as the policy, generated tokens as actions, a learned reward model as the environment, and PPO as the optimizer that closes the loop.</text>
  </g>
</svg>
