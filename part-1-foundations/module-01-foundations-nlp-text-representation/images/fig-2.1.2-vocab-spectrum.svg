<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 650" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Tokenizer Granularity Spectrum</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Trade-off between vocab size and sequence length — subword tokenizers find the sweet spot</text>

  <!-- spectrum bar -->
  <line x1="120" y1="490" x2="1180" y2="490" stroke="#5a4a3a" stroke-width="1.5"/>
  <text x="120" y="520" font-size="12" text-anchor="start" fill="#5a4a3a">smaller vocab · longer sequences</text>
  <text x="1180" y="520" font-size="12" text-anchor="end" fill="#5a4a3a">larger vocab · shorter sequences</text>

  <!-- Three columns -->
  <g>
    <rect x="120" y="120" width="320" height="340" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="280" y="155" font-size="17" font-weight="700" text-anchor="middle" fill="#b3401b">Character-level</text>
    <line x1="140" y1="170" x2="420" y2="170" stroke="#b3401b" stroke-width="0.6"/>
    <text x="140" y="200" font-size="12" font-weight="600" fill="#1a1a2e">Vocab size</text>
    <text x="420" y="200" font-size="12" text-anchor="end" fill="#1a1a2e">~256</text>
    <text x="140" y="225" font-size="12" font-weight="600" fill="#1a1a2e">Sequence length</text>
    <text x="420" y="225" font-size="12" text-anchor="end" fill="#1a1a2e">very long</text>
    <text x="140" y="250" font-size="12" font-weight="600" fill="#1a1a2e">OOV rate</text>
    <text x="420" y="250" font-size="12" text-anchor="end" fill="#1a1a2e">0%</text>

    <line x1="140" y1="270" x2="420" y2="270" stroke="#b3401b" stroke-width="0.4" stroke-dasharray="3 2"/>

    <text x="280" y="298" font-size="12" font-weight="600" text-anchor="middle" fill="#b3401b">"unbreakable"</text>
    <text x="280" y="322" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">u, n, b, r, e, a, k,</text>
    <text x="280" y="340" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">a, b, l, e</text>
    <text x="280" y="362" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">11 tokens</text>

    <text x="280" y="402" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Pros: zero OOV</text>
    <text x="280" y="420" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Cons: tiny semantics per</text>
    <text x="280" y="438" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">token, huge context burn</text>
  </g>

  <g>
    <rect x="490" y="120" width="320" height="340" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="3"/>
    <text x="650" y="155" font-size="17" font-weight="700" text-anchor="middle" fill="#1f7a3a">Subword (BPE / WordPiece)</text>
    <line x1="510" y1="170" x2="790" y2="170" stroke="#1f7a3a" stroke-width="0.6"/>
    <text x="510" y="200" font-size="12" font-weight="600" fill="#1a1a2e">Vocab size</text>
    <text x="790" y="200" font-size="12" text-anchor="end" fill="#1a1a2e">32K – 100K</text>
    <text x="510" y="225" font-size="12" font-weight="600" fill="#1a1a2e">Sequence length</text>
    <text x="790" y="225" font-size="12" text-anchor="end" fill="#1a1a2e">moderate</text>
    <text x="510" y="250" font-size="12" font-weight="600" fill="#1a1a2e">OOV rate</text>
    <text x="790" y="250" font-size="12" text-anchor="end" fill="#1a1a2e">~0% (byte fallback)</text>

    <line x1="510" y1="270" x2="790" y2="270" stroke="#1f7a3a" stroke-width="0.4" stroke-dasharray="3 2"/>

    <text x="650" y="298" font-size="12" font-weight="600" text-anchor="middle" fill="#1f7a3a">"unbreakable"</text>
    <text x="650" y="322" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">un, break, able</text>
    <text x="650" y="362" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">3 tokens</text>

    <text x="650" y="402" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Pros: morphology-aware,</text>
    <text x="650" y="420" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">balances vocab and length</text>
    <text x="650" y="438" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">★ used by all modern LLMs</text>
  </g>

  <g>
    <rect x="860" y="120" width="320" height="340" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="1020" y="155" font-size="17" font-weight="700" text-anchor="middle" fill="#7a5e1a">Whole-word</text>
    <line x1="880" y1="170" x2="1160" y2="170" stroke="#7a5e1a" stroke-width="0.6"/>
    <text x="880" y="200" font-size="12" font-weight="600" fill="#1a1a2e">Vocab size</text>
    <text x="1160" y="200" font-size="12" text-anchor="end" fill="#1a1a2e">100K+</text>
    <text x="880" y="225" font-size="12" font-weight="600" fill="#1a1a2e">Sequence length</text>
    <text x="1160" y="225" font-size="12" text-anchor="end" fill="#1a1a2e">short</text>
    <text x="880" y="250" font-size="12" font-weight="600" fill="#1a1a2e">OOV rate</text>
    <text x="1160" y="250" font-size="12" text-anchor="end" fill="#1a1a2e">significant</text>

    <line x1="880" y1="270" x2="1160" y2="270" stroke="#7a5e1a" stroke-width="0.4" stroke-dasharray="3 2"/>

    <text x="1020" y="298" font-size="12" font-weight="600" text-anchor="middle" fill="#7a5e1a">"unbreakable"</text>
    <text x="1020" y="322" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">unbreakable</text>
    <text x="1020" y="350" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(or &lt;UNK&gt; if rare)</text>
    <text x="1020" y="378" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">1 token</text>

    <text x="1020" y="412" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Pros: each token = full word</text>
    <text x="1020" y="430" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Cons: massive embed table,</text>
    <text x="1020" y="448" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">brittle on new words</text>
  </g>

  <!-- Sweet spot indicator on bar -->
  <polygon points="640,485 660,485 650,475" fill="#1f7a3a"/>
  <text x="650" y="555" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">★ sweet spot</text>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Why subword wins</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Subword tokenization keeps the vocabulary tractable, handles novel/rare words gracefully via decomposition, and exposes morphology to the model — at the cost of slightly longer sequences than whole-word.</text>
  </g>
</svg>
