<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Skip-gram: Predict Context From Center Word</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">For each center word, learn to predict which words appear within a window — that's word2vec</text>

  <!-- Sentence with window -->
  <g>
    <text x="650" y="125" font-size="13" font-weight="600" text-anchor="middle" fill="#5a4a3a">window = 2 (2 words on each side of the center)</text>

    <!-- Tokens -->
    <rect x="190" y="160" width="120" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="250" y="195" font-size="16" font-weight="600" text-anchor="middle" fill="#1a4078">the</text>
    <text x="250" y="240" font-size="11" text-anchor="middle" fill="#5a4a3a">context</text>

    <rect x="330" y="160" width="120" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="390" y="195" font-size="16" font-weight="600" text-anchor="middle" fill="#1a4078">cat</text>
    <text x="390" y="240" font-size="11" text-anchor="middle" fill="#5a4a3a">context</text>

    <rect x="470" y="150" width="160" height="80" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="3"/>
    <text x="550" y="190" font-size="20" font-weight="700" text-anchor="middle" fill="#1f7a3a">sat</text>
    <text x="550" y="215" font-size="11" font-weight="600" text-anchor="middle" fill="#1f7a3a">CENTER</text>
    <text x="550" y="250" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">the input we predict from</text>

    <rect x="650" y="160" width="120" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="710" y="195" font-size="16" font-weight="600" text-anchor="middle" fill="#1a4078">on</text>
    <text x="710" y="240" font-size="11" text-anchor="middle" fill="#5a4a3a">context</text>

    <rect x="790" y="160" width="120" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="850" y="195" font-size="16" font-weight="600" text-anchor="middle" fill="#1a4078">the</text>
    <text x="850" y="240" font-size="11" text-anchor="middle" fill="#5a4a3a">context</text>

    <!-- arcs from center to each context -->
    <path d="M 470 175 C 380 90 290 90 250 155" fill="none" stroke="#1f7a3a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <path d="M 470 180 C 430 130 410 130 390 155" fill="none" stroke="#1f7a3a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <path d="M 630 180 C 670 130 690 130 710 155" fill="none" stroke="#1f7a3a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <path d="M 630 175 C 720 90 810 90 850 155" fill="none" stroke="#1f7a3a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  </g>

  <!-- Training pairs box -->
  <g transform="translate(160, 320)">
    <rect x="0" y="0" width="540" height="200" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="270" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">4 training pairs from this single center</text>
    <line x1="20" y1="46" x2="520" y2="46" stroke="#7a5e1a" stroke-width="0.6"/>
    <g font-size="13" font-family="monospace" fill="#1a1a2e">
      <text x="40" y="78">(sat, the)</text>
      <text x="280" y="78">(sat, cat)</text>
      <text x="40" y="105">(sat, on)</text>
      <text x="280" y="105">(sat, the)</text>
    </g>
    <text x="40" y="142" font-size="12" font-style="italic" fill="#5a4a3a">Each pair: input = center embedding, target =</text>
    <text x="40" y="160" font-size="12" font-style="italic" fill="#5a4a3a">context word in vocabulary (softmax over V).</text>
    <text x="40" y="184" font-size="12" font-weight="600" fill="#7a5e1a">Slide window across corpus → millions of pairs.</text>
  </g>

  <!-- Resulting embedding callout -->
  <g transform="translate(740, 320)">
    <rect x="0" y="0" width="450" height="200" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="225" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">What gets learned</text>
    <line x1="20" y1="46" x2="430" y2="46" stroke="#d4b96a" stroke-width="0.6"/>
    <text x="20" y="74" font-size="12" fill="#1a1a2e">Words appearing in similar contexts</text>
    <text x="20" y="92" font-size="12" fill="#1a1a2e">end up with similar embeddings.</text>
    <text x="20" y="124" font-size="12" font-weight="600" fill="#1f7a3a">"king" and "queen" share many contexts</text>
    <text x="20" y="142" font-size="12" font-weight="600" fill="#1f7a3a">→ vectors point similar directions.</text>
    <text x="20" y="174" font-size="11" font-style="italic" fill="#5a4a3a">CBOW = same idea reversed (context → center).</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 540)">
    <rect x="0" y="0" width="1180" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">"You shall know a word by the company it keeps." Skip-gram operationalizes this with one neural net and a sliding window.</text>
  </g>
</svg>
