<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Helvetica, Arial, sans-serif">
  <title>Anatomy of a chat template</title>
  <rect width="1100" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arrCT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Anatomy of a chat template</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Messages array gets rendered into one flat string with role markers</text>

  <!-- Left: Python messages -->
  <g transform="translate(40, 100)">
    <rect width="420" height="380" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="210" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">What you write</text>
    <text x="210" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Python messages list</text>

    <g font-family="Consolas, monospace" font-size="12" fill="#1a1a2e">
      <text x="20" y="84">messages = [</text>
      <text x="40" y="106">  {"role": "system",</text>
      <text x="40" y="126">   "content": "You are helpful."},</text>
      <text x="40" y="156">  {"role": "user",</text>
      <text x="40" y="176">   "content": "Explain BPE."},</text>
      <text x="40" y="206">  {"role": "assistant",</text>
      <text x="40" y="226">   "content": "BPE merges..."},</text>
      <text x="20" y="248">]</text>
    </g>

    <line x1="20" y1="280" x2="400" y2="280" stroke="#1a4078" stroke-width="0.8" stroke-dasharray="3,3"/>
    <text x="20" y="306" font-size="12" font-family="Consolas, monospace" fill="#1a1a2e">tokenizer.apply_chat_template(</text>
    <text x="40" y="324" font-size="12" font-family="Consolas, monospace" fill="#1a1a2e">messages, tokenize=False)</text>
    <text x="20" y="356" font-size="11" font-style="italic" fill="#5a4a3a">A Jinja template inside the tokenizer</text>
  </g>

  <line x1="475" y1="290" x2="525" y2="290" stroke="#5a4a3a" stroke-width="2.5" marker-end="url(#arrCT)"/>
  <text x="500" y="280" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">render</text>

  <!-- Right: rendered string -->
  <g transform="translate(540, 100)">
    <rect width="520" height="380" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="260" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">What the model sees</text>
    <text x="260" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">flat string, role markers</text>

    <!-- System block -->
    <rect x="20" y="68" width="480" height="56" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
    <g font-family="Consolas, monospace" font-size="12" fill="#1a1a2e">
      <text x="34" y="88" fill="#722f8a" font-weight="700">&lt;|im_start|&gt;system</text>
      <text x="34" y="106">You are helpful.</text>
      <text x="34" y="120" fill="#722f8a" font-weight="700">&lt;|im_end|&gt;</text>
    </g>

    <!-- User block -->
    <rect x="20" y="136" width="480" height="56" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
    <g font-family="Consolas, monospace" font-size="12" fill="#1a1a2e">
      <text x="34" y="156" fill="#1a4078" font-weight="700">&lt;|im_start|&gt;user</text>
      <text x="34" y="174">Explain BPE.</text>
      <text x="34" y="188" fill="#1a4078" font-weight="700">&lt;|im_end|&gt;</text>
    </g>

    <!-- Assistant block -->
    <rect x="20" y="204" width="480" height="56" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
    <g font-family="Consolas, monospace" font-size="12" fill="#1a1a2e">
      <text x="34" y="224" fill="#1f7a3a" font-weight="700">&lt;|im_start|&gt;assistant</text>
      <text x="34" y="242">BPE merges...</text>
      <text x="34" y="256" fill="#1f7a3a" font-weight="700">&lt;|im_end|&gt;</text>
    </g>

    <!-- Generation prompt -->
    <rect x="20" y="272" width="480" height="46" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <g font-family="Consolas, monospace" font-size="12" fill="#1a1a2e">
      <text x="34" y="290" fill="#b3401b" font-weight="700">&lt;|im_start|&gt;assistant</text>
      <text x="34" y="308" font-style="italic" fill="#5a4a3a">(model generates from here)</text>
    </g>

    <text x="260" y="345" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">ChatML format. Llama uses different markers, same idea.</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 500)">
    <rect width="1020" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">A chat is just a flat string with role-marker tokens</text>
    <text x="510" y="48" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">Always use apply_chat_template; never concatenate strings by hand.</text>
  </g>
</svg>
