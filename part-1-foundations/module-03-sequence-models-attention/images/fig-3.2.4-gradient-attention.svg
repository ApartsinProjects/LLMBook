<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <title>How gradients flow through attention: two paths</title>
  <rect width="1100" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a4078"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Gradients reach each h_j via two paths</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">A direct route weighted by a_j and an indirect route through softmax</text>

  <g transform="translate(60, 120)">
    <rect width="180" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="90" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Hidden states</text>
    <text x="90" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">h_1 ... h_n</text>
  </g>

  <line x1="240" y1="150" x2="300" y2="150" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(300, 120)">
    <rect width="180" height="60" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="90" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">softmax</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">a = softmax(scores)</text>
  </g>

  <line x1="480" y1="150" x2="540" y2="150" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(540, 120)">
    <rect width="180" height="60" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="90" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">context</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">c = sum a_j h_j</text>
  </g>

  <line x1="720" y1="150" x2="780" y2="150" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(780, 120)">
    <rect width="160" height="60" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="80" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Loss L</text>
    <text x="80" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">downstream + target</text>
  </g>

  <text x="550" y="220" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Backward: dL/dh_j has two paths</text>

  <path d="M 780 270 Q 630 270 540 270" fill="none" stroke="#1a4078" stroke-width="3" marker-end="url(#arrBlue)"/>
  <path d="M 540 270 Q 350 270 240 200" fill="none" stroke="#1a4078" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="500" y="300" font-size="12" font-weight="700" fill="#1a4078">Path A: direct, dL/dh_j = a_j * dL/dc</text>
  <text x="500" y="318" font-size="11" font-style="italic" fill="#1a4078">large for attended tokens (high a_j), tiny otherwise</text>

  <path d="M 780 360 Q 650 360 480 360" fill="none" stroke="#b3401b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <path d="M 380 360 Q 320 360 240 230" fill="none" stroke="#b3401b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <text x="500" y="392" font-size="12" font-weight="700" fill="#b3401b">Path B: indirect via softmax, routes through ALL a_k</text>
  <text x="500" y="410" font-size="11" font-style="italic" fill="#b3401b">cross-token coupling; this trains the attention pattern</text>

  <g transform="translate(60, 440)">
    <rect width="490" height="160" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#a67c1a">Why two paths matter</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">Each h_j enters the loss in two ways:</text>
    <text x="20" y="74" font-size="12" fill="#1a4078">A. as a value mixed into c with weight a_j</text>
    <text x="20" y="96" font-size="12" fill="#b3401b">B. as a key/query that shapes the entire a vector</text>
    <text x="20" y="124" font-size="11" font-style="italic" fill="#5a4a3a">Path A only updates value content;</text>
    <text x="20" y="140" font-size="11" font-style="italic" fill="#5a4a3a">Path B is what reshapes attention during training.</text>
  </g>

  <g transform="translate(580, 440)">
    <rect width="460" height="160" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Practical consequences</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">Sharp attention: direct path dominates, like a pointer.</text>
    <text x="20" y="74" font-size="12" fill="#1a1a2e">Uniform attention: every token gets small nonzero signal.</text>
    <text x="20" y="98" font-size="12" fill="#1a1a2e">Long sequences: gradient does not vanish with distance</text>
    <text x="20" y="116" font-size="12" fill="#1a1a2e">the way it does in RNNs.</text>
    <text x="20" y="142" font-size="11" font-style="italic" fill="#5a4a3a">It is bounded by a_j, not by a product of Jacobians.</text>
  </g>
</svg>
