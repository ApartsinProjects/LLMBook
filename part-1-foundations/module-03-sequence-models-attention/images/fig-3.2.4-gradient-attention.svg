<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a4078"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">How gradients flow through attention</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Two paths reach each hidden state h_j: a direct route weighted by a_j, and an indirect route through the softmax that reweights all peers.</text>

  <!-- FORWARD COLUMN (left) -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#1a4078">Forward pass</text>

    <!-- Hidden states -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="220" height="290" rx="10" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
      <text x="110" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Hidden states h_1 ... h_n</text>

      <g transform="translate(20, 44)">
        <rect x="0" y="0" width="180" height="38" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
        <text x="90" y="24" font-size="13" text-anchor="middle" fill="#1a1a2e">h_1</text>
      </g>
      <g transform="translate(20, 92)">
        <rect x="0" y="0" width="180" height="38" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
        <text x="90" y="24" font-size="13" text-anchor="middle" fill="#1a1a2e">h_2</text>
      </g>
      <g transform="translate(20, 140)">
        <rect x="0" y="0" width="180" height="38" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
        <text x="90" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">h_3</text>
        <text x="90" y="32" font-size="11" text-anchor="middle" fill="#1f7a3a" font-style="italic">high a_3</text>
      </g>
      <g transform="translate(20, 188)">
        <rect x="0" y="0" width="180" height="38" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
        <text x="90" y="24" font-size="13" text-anchor="middle" fill="#1a1a2e">h_4</text>
      </g>

      <text x="110" y="252" font-size="11" text-anchor="middle" fill="#5a4a3a">scores_j = q · k_j</text>
      <text x="110" y="270" font-size="11" text-anchor="middle" fill="#5a4a3a">a = softmax(scores)</text>
    </g>
  </g>

  <!-- Forward arrows to softmax -->
  <line x1="280" y1="200" x2="380" y2="200" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="330" y="190" font-size="11" text-anchor="middle" fill="#5a4a3a">scores</text>

  <!-- SOFTMAX block -->
  <g transform="translate(380, 168)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="110" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">softmax</text>
    <text x="110" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">a = softmax(scores)</text>
    <text x="110" y="66" font-size="11" text-anchor="middle" fill="#5a4a3a">a_1 a_2 a_3 a_4 sum to 1</text>
  </g>

  <!-- Forward arrow to context -->
  <line x1="600" y1="208" x2="700" y2="208" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="650" y="198" font-size="11" text-anchor="middle" fill="#5a4a3a">a, h</text>

  <!-- CONTEXT block -->
  <g transform="translate(700, 168)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="110" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">context</text>
    <text x="110" y="48" font-size="13" text-anchor="middle" fill="#1a1a2e">c = sum_j a_j · h_j</text>
    <text x="110" y="66" font-size="11" text-anchor="middle" fill="#5a4a3a">attention output</text>
  </g>

  <!-- Forward to LOSS -->
  <line x1="920" y1="208" x2="1020" y2="208" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="970" y="198" font-size="11" text-anchor="middle" fill="#5a4a3a">c</text>

  <!-- LOSS block -->
  <g transform="translate(1020, 168)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="100" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Loss L</text>
    <text x="100" y="56" font-size="11" text-anchor="middle" fill="#1a1a2e">downstream layers + target</text>
  </g>

  <!-- BACKWARD PATHS -->
  <text x="650" y="316" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Backward pass: dL / dh_j has TWO paths</text>

  <!-- Direct path arrow: from LOSS back to context, then back to h_3 (direct) -->
  <!-- We illustrate gradient arrows beneath the forward layout -->
  <g>
    <!-- Path A: Loss -> context -> h_j (direct, weighted by a_j) -->
    <path d="M 1020 360 Q 870 360 810 280" fill="none" stroke="#1a4078" stroke-width="3" stroke-dasharray="0" marker-end="url(#arrBlue)"/>
    <path d="M 700 360 Q 500 380 280 280" fill="none" stroke="#1a4078" stroke-width="3" marker-end="url(#arrBlue)"/>
    <text x="500" y="392" font-size="12" fill="#1a4078" font-weight="700">Path A (direct): dL/dh_j = a_j · dL/dc</text>
    <text x="500" y="408" font-size="11" fill="#1a4078" font-style="italic">large for the attended tokens (high a_j), tiny for the rest</text>

    <!-- Path B: Loss -> context -> softmax -> scores -> all hidden states -->
    <path d="M 1020 440 Q 800 460 600 290" fill="none" stroke="#b3401b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
    <path d="M 380 460 Q 320 460 280 290" fill="none" stroke="#b3401b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
    <text x="500" y="492" font-size="12" fill="#b3401b" font-weight="700">Path B (indirect via softmax): dL/dh_j routes through ALL a_k via dq, dk</text>
    <text x="500" y="508" font-size="11" fill="#b3401b" font-style="italic">cross-token coupling; this is what lets attention weights themselves learn</text>
  </g>

  <!-- Math callout: Why softmax matters -->
  <g transform="translate(60, 540)">
    <rect x="0" y="0" width="600" height="120" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why two paths?</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">Each h_j enters the loss in two ways:</text>
    <text x="40" y="70" font-size="12" fill="#1a4078">A. as a value mixed into c with weight a_j (linear path)</text>
    <text x="40" y="88" font-size="12" fill="#b3401b">B. as part of k_j and q which determine the entire a vector (softmax path)</text>
    <text x="20" y="108" font-size="11" fill="#5a4a3a" font-style="italic">Path B is what reshapes the attention pattern during training; Path A only updates the value content.</text>
  </g>

  <!-- Practical implications -->
  <g transform="translate(680, 540)">
    <rect x="0" y="0" width="540" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Practical consequences</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Sharp attention (one a_j near 1): direct path dominates, like a hard pointer.</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">Uniform attention: all tokens receive small but nonzero gradient signal.</text>
    <text x="20" y="84" font-size="12" fill="#1a1a2e">Long sequences: gradient does not vanish with distance the way it does in RNNs;</text>
    <text x="20" y="100" font-size="12" fill="#1a1a2e">it is bounded by a_j, not by a product of recurrent Jacobians.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 686)">
    <rect x="0" y="0" width="1160" height="60" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#b3401b">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Gradients reach each hidden state both directly (scaled by a_j) and indirectly (through the softmax that reweights every peer); the indirect path is what trains the attention pattern itself.</text>
  </g>
</svg>
