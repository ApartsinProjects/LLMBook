<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Vanishing Gradients in RNNs</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Each timestep multiplies gradient by W — over many steps it shrinks (or explodes) exponentially</text>

  <!-- Sequence of 4 timesteps as RNN cells -->
  <g>
    <rect x="80" y="160" width="180" height="100" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="170" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">t = 0</text>
    <text x="170" y="215" font-size="12" text-anchor="middle" fill="#1a1a2e">furthest from loss</text>
    <text x="170" y="240" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">‖∇‖ → 0  (vanished)</text>

    <rect x="365" y="160" width="160" height="100" rx="10" fill="#fafbfc" stroke="#cfd8e3" stroke-width="2"/>
    <text x="445" y="190" font-size="14" font-weight="700" text-anchor="middle" fill="#5a4a3a">t = 15</text>
    <text x="445" y="215" font-size="12" text-anchor="middle" fill="#5a4a3a">‖∇‖ ≈ 10⁻³</text>

    <rect x="630" y="160" width="160" height="100" rx="10" fill="#fafbfc" stroke="#cfd8e3" stroke-width="2"/>
    <text x="710" y="190" font-size="14" font-weight="700" text-anchor="middle" fill="#5a4a3a">t = 50</text>
    <text x="710" y="215" font-size="12" text-anchor="middle" fill="#5a4a3a">‖∇‖ ≈ 10⁻¹</text>

    <rect x="900" y="160" width="180" height="100" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="990" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">t = 99</text>
    <text x="990" y="215" font-size="12" text-anchor="middle" fill="#1a1a2e">loss computed here</text>
    <text x="990" y="240" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">‖∇‖ ≈ 1</text>
  </g>

  <!-- Backward arrows getting thinner -->
  <line x1="900" y1="210" x2="800" y2="210" stroke="#b3401b" stroke-width="3.5" marker-end="url(#arr)"/>
  <line x1="630" y1="210" x2="535" y2="210" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="365" y1="210" x2="270" y2="210" stroke="#b3401b" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="850" y="195" font-size="11" font-style="italic" fill="#5a4a3a">strong</text>
  <text x="585" y="195" font-size="11" font-style="italic" fill="#5a4a3a">weaker</text>
  <text x="320" y="195" font-size="11" font-style="italic" fill="#5a4a3a">faint</text>

  <!-- Plot: gradient magnitude vs time -->
  <g>
    <rect x="80" y="320" width="660" height="280" rx="8" fill="#fafbfc" stroke="#cfd8e3" stroke-width="1"/>
    <text x="410" y="350" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">gradient magnitude vs. distance to loss</text>

    <line x1="130" y1="560" x2="700" y2="560" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="130" y1="380" x2="130" y2="560" stroke="#1a1a2e" stroke-width="1.5"/>

    <text x="415" y="590" font-size="12" text-anchor="middle" fill="#5a4a3a">timesteps back from loss →</text>
    <text x="100" y="475" font-size="12" text-anchor="middle" fill="#5a4a3a" transform="rotate(-90 100 475)">‖∇‖ (log)</text>

    <!-- Exponential decay curve (W eigenval &lt; 1) -->
    <path d="M 700 400 Q 600 415 500 450 Q 400 490 300 530 Q 200 555 130 558"
          fill="none" stroke="#b3401b" stroke-width="3"/>
    <text x="500" y="430" font-size="13" font-weight="700" fill="#b3401b">vanishing (W spectral radius &lt; 1)</text>

    <!-- Stable -->
    <line x1="130" y1="470" x2="700" y2="470" stroke="#1f7a3a" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="160" y="463" font-size="12" font-style="italic" fill="#1f7a3a">ideal: gradient flows uniformly</text>

    <!-- Exploding curve -->
    <path d="M 700 470 Q 600 460 500 430 Q 400 395 300 380"
          fill="none" stroke="#722f8a" stroke-width="3" stroke-dasharray="5 3"/>
    <text x="160" y="395" font-size="13" font-weight="700" fill="#722f8a">exploding (radius &gt; 1)</text>

    <!-- X-axis labels -->
    <text x="700" y="578" font-size="11" text-anchor="middle" fill="#5a4a3a">0</text>
    <text x="490" y="578" font-size="11" text-anchor="middle" fill="#5a4a3a">25</text>
    <text x="280" y="578" font-size="11" text-anchor="middle" fill="#5a4a3a">75</text>
    <text x="135" y="578" font-size="11" text-anchor="middle" fill="#5a4a3a">99</text>
  </g>

  <!-- Right callout: solutions -->
  <g transform="translate(770, 320)">
    <rect x="0" y="0" width="450" height="280" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="225" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Mitigations</text>
    <line x1="20" y1="46" x2="430" y2="46" stroke="#d4b96a" stroke-width="0.6"/>

    <text x="20" y="74" font-size="13" font-weight="600" fill="#1a4078">LSTM / GRU gates</text>
    <text x="20" y="94" font-size="11" fill="#1a1a2e">Constant-error carousel preserves</text>
    <text x="20" y="110" font-size="11" fill="#1a1a2e">gradient through the cell state.</text>

    <text x="20" y="142" font-size="13" font-weight="600" fill="#7a5e1a">Gradient clipping</text>
    <text x="20" y="162" font-size="11" fill="#1a1a2e">Cap ‖∇‖ at threshold to handle</text>
    <text x="20" y="178" font-size="11" fill="#1a1a2e">explosion (vanishing harder to fix).</text>

    <text x="20" y="210" font-size="13" font-weight="600" fill="#1f7a3a">Skip / residual / attention</text>
    <text x="20" y="230" font-size="11" fill="#1a1a2e">Add a direct path from t=0 to loss.</text>
    <text x="20" y="246" font-size="11" font-weight="700" fill="#1f7a3a">Transformers solve this entirely:</text>
    <text x="20" y="262" font-size="11" fill="#1a1a2e">attention reaches any position in O(1) hops.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 630)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Long sequences = many matrix multiplications stacked. If the gradient flow factor isn't ≈1, you get exponential decay (vanishing) or growth (explosion). This was the bottleneck attention was designed to bypass.</text>
  </g>
</svg>
