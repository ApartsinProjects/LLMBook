<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The LSTM cell: a memory highway with three gates</text>
  <text x="650" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">The cell state runs across the top with only additive edits, which is what defeats vanishing gradients.</text>

  <!-- Cell state highway (top) -->
  <g>
    <rect x="100" y="120" width="1100" height="60" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="650" y="148" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Cell state c(t): memory highway</text>
    <text x="650" y="168" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">flows through with additive interactions only -- gradients survive long sequences</text>
  </g>

  <!-- c(t-1) input on the left -->
  <g transform="translate(20, 130)">
    <rect x="0" y="0" width="70" height="40" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="35" y="25" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">c(t-1)</text>
  </g>
  <line x1="90" y1="150" x2="100" y2="150" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- c(t) output on the right -->
  <line x1="1200" y1="150" x2="1220" y2="150" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(1220, 130)">
    <rect x="0" y="0" width="60" height="40" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="30" y="25" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">c(t)</text>
  </g>

  <!-- Three gates feeding the highway -->
  <!-- Forget gate -->
  <g transform="translate(180, 280)">
    <rect x="0" y="0" width="220" height="100" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="110" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">Forget gate</text>
    <text x="110" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">f = sigma(W [h, x])</text>
    <text x="110" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">decides what to erase</text>
    <text x="110" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">from the cell state</text>
  </g>
  <line x1="290" y1="280" x2="290" y2="190" stroke="#b3401b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="305" y="240" font-size="11" font-weight="600" fill="#b3401b">erase</text>

  <!-- Input gate -->
  <g transform="translate(440, 280)">
    <rect x="0" y="0" width="220" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="110" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Input gate</text>
    <text x="110" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">i = sigma(W [h, x])</text>
    <text x="110" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">decides what new info</text>
    <text x="110" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">to write</text>
  </g>
  <line x1="550" y1="280" x2="550" y2="190" stroke="#1a4078" stroke-width="2" marker-end="url(#arr)"/>
  <text x="565" y="240" font-size="11" font-weight="600" fill="#1a4078">gate</text>

  <!-- Candidate -->
  <g transform="translate(700, 280)">
    <rect x="0" y="0" width="220" height="100" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="110" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Candidate</text>
    <text x="110" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">g = tanh(W [h, x])</text>
    <text x="110" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">proposes new content</text>
    <text x="110" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">to mix in</text>
  </g>
  <line x1="810" y1="280" x2="810" y2="190" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="825" y="240" font-size="11" font-weight="600" fill="#1f7a3a">add</text>

  <!-- Output gate -->
  <g transform="translate(960, 280)">
    <rect x="0" y="0" width="220" height="100" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="110" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">Output gate</text>
    <text x="110" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">o = sigma(W [h, x])</text>
    <text x="110" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">decides what part of</text>
    <text x="110" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">memory to expose</text>
  </g>
  <!-- output gate reads from highway and produces h(t) below -->
  <line x1="1070" y1="190" x2="1070" y2="280" stroke="#7a5e1a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1085" y="240" font-size="11" font-weight="600" fill="#7a5e1a">read</text>

  <!-- h(t) hidden state output -->
  <line x1="1070" y1="380" x2="1070" y2="430" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(1010, 430)">
    <rect x="0" y="0" width="120" height="44" rx="6" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="60" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">h(t)</text>
    <text x="60" y="38" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">hidden state out</text>
  </g>

  <!-- Inputs label at bottom -->
  <g transform="translate(180, 410)">
    <rect x="0" y="0" width="740" height="44" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1"/>
    <text x="370" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#5a4a3a">All gates share inputs: previous hidden state h(t-1) and current input x(t)</text>
    <text x="370" y="38" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">each gate has its own learned weight matrix W</text>
  </g>

  <!-- Diagnose callout -->
  <g transform="translate(80, 500)">
    <rect x="0" y="0" width="1140" height="80" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why this beats a vanilla RNN</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">A vanilla RNN multiplies the hidden state by a weight matrix at every step, so gradients shrink (or explode) exponentially over long sequences.</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">The LSTM cell state is updated additively (c(t) = f * c(t-1) + i * g), so gradients flow back nearly unchanged across hundreds of steps.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Three gates (forget, input, output) regulate a protected memory highway; this is what lets LSTMs remember information across long sequences.</text>
  </g>
</svg>
