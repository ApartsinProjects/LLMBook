<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="720" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">FlashAttention rewrites itself for every GPU generation</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Four versions, four years. Each adapts to one new SM architecture and one new tensor-core instruction set.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <line x1="120" y1="350" x2="1280" y2="350" stroke="#1a1a2e" stroke-width="3"/>
  <polygon points="1280,340 1310,350 1280,360" fill="#1a1a2e"/>

  <text x="120" y="380" font-size="13" font-weight="700" fill="#5a4a3a">2022</text>
  <text x="430" y="380" font-size="13" font-weight="700" fill="#5a4a3a">2023</text>
  <text x="740" y="380" font-size="13" font-weight="700" fill="#5a4a3a">2024</text>
  <text x="1050" y="380" font-size="13" font-weight="700" fill="#5a4a3a">2026</text>

  <circle cx="200" cy="350" r="12" fill="#1a4078" stroke="#0a2040" stroke-width="2.5"/>
  <circle cx="500" cy="350" r="12" fill="#1a4078" stroke="#0a2040" stroke-width="2.5"/>
  <circle cx="800" cy="350" r="12" fill="#1a4078" stroke="#0a2040" stroke-width="2.5"/>
  <circle cx="1120" cy="350" r="14" fill="#722f8a" stroke="#3a164a" stroke-width="3"/>

  <line x1="200" y1="180" x2="200" y2="338" stroke="#1a4078" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="500" y1="180" x2="500" y2="338" stroke="#1a4078" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="800" y1="180" x2="800" y2="338" stroke="#1a4078" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1120" y1="180" x2="1120" y2="336" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <g transform="translate(70, 100)">
    <rect x="0" y="0" width="260" height="80" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="130" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">FlashAttention-1</text>
    <text x="130" y="40" font-size="12" text-anchor="middle" fill="#1a1a2e">A100, Ampere SM</text>
    <text x="130" y="58" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">IO-aware tiling +</text>
    <text x="130" y="72" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">online softmax (FP16)</text>
  </g>

  <g transform="translate(370, 100)">
    <rect x="0" y="0" width="260" height="80" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="130" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">FlashAttention-2</text>
    <text x="130" y="40" font-size="12" text-anchor="middle" fill="#1a1a2e">H100, Hopper SM</text>
    <text x="130" y="58" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Reordered work,</text>
    <text x="130" y="72" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">better SM occupancy</text>
  </g>

  <g transform="translate(670, 100)">
    <rect x="0" y="0" width="260" height="80" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="130" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">FlashAttention-3</text>
    <text x="130" y="40" font-size="12" text-anchor="middle" fill="#1a1a2e">H100, Hopper SM</text>
    <text x="130" y="58" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Warp-specialization +</text>
    <text x="130" y="72" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">FP8 (~1.5-2x)</text>
  </g>

  <g transform="translate(990, 100)">
    <rect x="0" y="0" width="260" height="80" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="130" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">FlashAttention-4</text>
    <text x="130" y="40" font-size="12" text-anchor="middle" fill="#1a1a2e">B200/B300, Blackwell</text>
    <text x="130" y="58" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Asymmetric SM</text>
    <text x="130" y="72" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">pipelining (~2x over FA-3)</text>
  </g>

  <line x1="200" y1="362" x2="200" y2="468" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="500" y1="362" x2="500" y2="468" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="800" y1="362" x2="800" y2="468" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1120" y1="364" x2="1120" y2="468" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <g transform="translate(70, 470)">
    <rect x="0" y="0" width="260" height="74" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="130" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Architectural change</text>
    <text x="130" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">Made long-context</text>
    <text x="130" y="58" font-size="11" text-anchor="middle" fill="#1a1a2e">training feasible</text>
  </g>

  <g transform="translate(370, 470)">
    <rect x="0" y="0" width="260" height="74" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="130" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Architectural change</text>
    <text x="130" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">Async copy +</text>
    <text x="130" y="58" font-size="11" text-anchor="middle" fill="#1a1a2e">TMA on Hopper</text>
  </g>

  <g transform="translate(670, 470)">
    <rect x="0" y="0" width="260" height="74" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="130" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Architectural change</text>
    <text x="130" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">FP8 tensor cores +</text>
    <text x="130" y="58" font-size="11" text-anchor="middle" fill="#1a1a2e">warp specialization</text>
  </g>

  <g transform="translate(990, 470)">
    <rect x="0" y="0" width="260" height="74" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="130" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">Architectural change</text>
    <text x="130" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">Asymmetric tensor cores</text>
    <text x="130" y="58" font-size="11" text-anchor="middle" fill="#1a1a2e">+ FP4 path</text>
  </g>

  <g transform="translate(140, 590)">
    <rect x="0" y="0" width="1120" height="80" rx="6" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="560" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">The kernel-as-architecture pattern</text>
    <text x="560" y="44" font-size="12" text-anchor="middle" fill="#1a1a2e">Every GPU generation breaks the previous kernel; FA must be rewritten.</text>
    <text x="560" y="62" font-size="12" text-anchor="middle" fill="#1a1a2e">A new attention variant (GQA, sliding window, DeepSeek CSA) ships with its own kernel or it never reaches production.</text>
  </g>
</svg>
