<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">EU AI Act risk tiers: cascading staircase of obligations</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Higher tiers inherit every duty below them; build your compliance plan from the bottom up</text>

  <!-- Column headers -->
  <g transform="translate(50, 100)">
    <text x="20" y="20" font-size="13" font-weight="700" fill="#1a1a2e">Risk tier</text>
    <text x="430" y="20" font-size="13" font-weight="700" fill="#1a1a2e">Example systems</text>
    <text x="900" y="20" font-size="13" font-weight="700" fill="#1a1a2e">Compliance obligations</text>
  </g>
  <line x1="50" y1="112" x2="1250" y2="112" stroke="#5a4a3a" stroke-width="1"/>

  <!-- Staircase: top step is PROHIBITED (highest risk), descends to MINIMAL -->
  <!-- Step 1: PROHIBITED (top, indented most) -->
  <g transform="translate(50, 130)">
    <!-- tier label -->
    <rect width="280" height="120" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#b3401b">PROHIBITED</text>
    <text x="20" y="52" font-size="11" fill="#5a4a3a" font-style="italic">Article 5</text>
    <g transform="translate(20, 64)">
      <circle cx="8" cy="8" r="8" fill="#b3401b"/>
      <text x="8" y="12" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">!</text>
      <text x="24" y="12" font-size="12" font-weight="700" fill="#b3401b">Unacceptable risk</text>
    </g>
    <text x="20" y="100" font-size="11" fill="#5a4a3a">Banned outright across the EU.</text>

    <!-- examples -->
    <g transform="translate(300, 0)">
      <rect width="540" height="120" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="16" y="24" font-size="12" fill="#1a1a2e">. Social scoring by public authorities</text>
      <text x="16" y="44" font-size="12" fill="#1a1a2e">. Subliminal manipulation causing harm</text>
      <text x="16" y="64" font-size="12" fill="#1a1a2e">. Real-time remote biometric ID in public (with narrow exceptions)</text>
      <text x="16" y="84" font-size="12" fill="#1a1a2e">. Predictive policing based solely on profiling</text>
      <text x="16" y="104" font-size="12" fill="#1a1a2e">. Untargeted scraping of facial images for databases</text>
    </g>

    <!-- obligations -->
    <g transform="translate(850, 0)">
      <rect width="350" height="120" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#b3401b">Banned</text>
      <text x="16" y="44" font-size="12" fill="#1a1a2e">Cannot be placed on the EU market,</text>
      <text x="16" y="60" font-size="12" fill="#1a1a2e">put into service, or used.</text>
      <text x="16" y="84" font-size="12" font-weight="700" fill="#1a1a2e">Penalty:</text>
      <text x="80" y="84" font-size="12" fill="#1a1a2e">up to 35M EUR or 7% of</text>
      <text x="16" y="100" font-size="12" fill="#1a1a2e">global turnover, whichever higher.</text>
    </g>
  </g>

  <!-- Step 2: HIGH RISK (offset right) -->
  <g transform="translate(80, 270)">
    <rect width="280" height="120" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#b3401b">HIGH RISK</text>
    <text x="20" y="52" font-size="11" fill="#5a4a3a" font-style="italic">Article 6, Annex III</text>
    <g transform="translate(20, 64)">
      <circle cx="8" cy="8" r="8" fill="#b3401b"/>
      <text x="8" y="12" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
      <text x="24" y="12" font-size="12" font-weight="700" fill="#b3401b">Strict regulation</text>
    </g>
    <text x="20" y="100" font-size="11" fill="#5a4a3a">Allowed with full compliance.</text>

    <g transform="translate(300, 0)">
      <rect width="540" height="120" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="16" y="24" font-size="12" fill="#1a1a2e">. Employment screening, CV filtering, performance evaluation</text>
      <text x="16" y="44" font-size="12" fill="#1a1a2e">. Education admissions and exam scoring</text>
      <text x="16" y="64" font-size="12" fill="#1a1a2e">. Credit scoring and insurance pricing</text>
      <text x="16" y="84" font-size="12" fill="#1a1a2e">. Law enforcement, migration and border control</text>
      <text x="16" y="104" font-size="12" fill="#1a1a2e">. Administration of justice and democratic processes</text>
    </g>

    <g transform="translate(850, 0)">
      <rect width="350" height="120" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="16" y="22" font-size="13" font-weight="700" fill="#b3401b">Full compliance regime</text>
      <text x="16" y="40" font-size="11" fill="#1a1a2e">. Risk management system</text>
      <text x="16" y="56" font-size="11" fill="#1a1a2e">. Data governance and quality</text>
      <text x="16" y="72" font-size="11" fill="#1a1a2e">. Technical documentation</text>
      <text x="16" y="88" font-size="11" fill="#1a1a2e">. Logging and traceability</text>
      <text x="16" y="104" font-size="11" fill="#1a1a2e">. Conformity assessment + CE mark</text>
    </g>
  </g>

  <!-- Step 3: LIMITED RISK (offset further right) -->
  <g transform="translate(110, 410)">
    <rect width="280" height="120" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#7a5e1a">LIMITED RISK</text>
    <text x="20" y="52" font-size="11" fill="#5a4a3a" font-style="italic">Article 50</text>
    <g transform="translate(20, 64)">
      <circle cx="8" cy="8" r="8" fill="#7a5e1a"/>
      <text x="8" y="12" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
      <text x="24" y="12" font-size="12" font-weight="700" fill="#7a5e1a">Transparency duties</text>
    </g>
    <text x="20" y="100" font-size="11" fill="#5a4a3a">Tell users they are using AI.</text>

    <g transform="translate(300, 0)">
      <rect width="540" height="120" rx="8" fill="#ffffff" stroke="#7a5e1a" stroke-width="1.5"/>
      <text x="16" y="24" font-size="12" fill="#1a1a2e">. Customer-facing chatbots and virtual assistants</text>
      <text x="16" y="44" font-size="12" fill="#1a1a2e">. Emotion recognition and biometric categorization (non-banned uses)</text>
      <text x="16" y="64" font-size="12" fill="#1a1a2e">. AI-generated text, images, audio, video (deepfakes)</text>
      <text x="16" y="84" font-size="12" fill="#1a1a2e">. Synthetic media in news or public-interest content</text>
    </g>

    <g transform="translate(850, 0)">
      <rect width="350" height="120" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
      <text x="16" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Transparency only</text>
      <text x="16" y="42" font-size="11" fill="#1a1a2e">. Inform user they interact with AI</text>
      <text x="16" y="58" font-size="11" fill="#1a1a2e">. Label AI-generated content as</text>
      <text x="16" y="74" font-size="11" fill="#1a1a2e">  artificially generated</text>
      <text x="16" y="94" font-size="11" fill="#1a1a2e">. Machine-readable watermarks</text>
      <text x="16" y="110" font-size="11" fill="#1a1a2e">  where technically feasible</text>
    </g>
  </g>

  <!-- Step 4: MINIMAL RISK -->
  <g transform="translate(140, 550)">
    <rect width="280" height="120" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#1f7a3a">MINIMAL RISK</text>
    <text x="20" y="52" font-size="11" fill="#5a4a3a" font-style="italic">Default category</text>
    <g transform="translate(20, 64)">
      <circle cx="8" cy="8" r="8" fill="#1f7a3a"/>
      <text x="8" y="12" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
      <text x="24" y="12" font-size="12" font-weight="700" fill="#1f7a3a">Free to deploy</text>
    </g>
    <text x="20" y="100" font-size="11" fill="#5a4a3a">Most AI systems land here.</text>

    <g transform="translate(300, 0)">
      <rect width="540" height="120" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="16" y="24" font-size="12" fill="#1a1a2e">. Spam filters and email classification</text>
      <text x="16" y="44" font-size="12" fill="#1a1a2e">. Code completion and IDE assistants (internal use)</text>
      <text x="16" y="64" font-size="12" fill="#1a1a2e">. AI-enabled video games and recommender systems</text>
      <text x="16" y="84" font-size="12" fill="#1a1a2e">. Internal productivity tools (search, summarization)</text>
      <text x="16" y="104" font-size="12" fill="#1a1a2e">. Inventory forecasting, predictive maintenance</text>
    </g>

    <g transform="translate(850, 0)">
      <rect width="350" height="120" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="16" y="22" font-size="13" font-weight="700" fill="#1f7a3a">No specific obligations</text>
      <text x="16" y="42" font-size="11" fill="#1a1a2e">. General product safety law</text>
      <text x="16" y="58" font-size="11" fill="#1a1a2e">. GDPR still applies as always</text>
      <text x="16" y="78" font-size="11" fill="#1a1a2e">. Voluntary codes of conduct</text>
      <text x="16" y="94" font-size="11" fill="#1a1a2e">  encouraged by the Commission</text>
    </g>
  </g>

  <!-- Risk arrow on far left indicating decreasing severity -->
  <g transform="translate(20, 130)">
    <line x1="10" y1="10" x2="10" y2="660" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="-560" y="20" font-size="11" font-weight="700" fill="#5a4a3a" transform="rotate(-90)" text-anchor="start">decreasing risk, fewer obligations</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(50, 700)">
    <rect width="1200" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">The EU AI Act sorts every system into one of four tiers. Map your product to the right step first; the corresponding obligations (or ban) follow automatically and dictate the engineering, legal, and audit work you owe.</text>
  </g>
</svg>
