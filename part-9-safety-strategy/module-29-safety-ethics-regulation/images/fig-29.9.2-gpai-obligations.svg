<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">EU AI Act: GPAI Model Obligations</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Every GPAI provider has base duties; systemic-risk models carry four additional ones.</text>

  <!-- Top: GPAI definition -->
  <g transform="translate(450, 90)">
    <rect width="400" height="70" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="200" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a2e">General-Purpose AI Model</text>
    <text x="200" y="50" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">Models trained on broad data for diverse tasks</text>
  </g>

  <!-- Decision diamond -->
  <g transform="translate(550, 195)">
    <polygon points="100,0 200,55 100,110 0,55" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="100" y="42" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Systemic risk?</text>
    <text x="100" y="62" font-size="11" text-anchor="middle" fill="#5a4a3a">Compute &gt; 10^25 FLOP</text>
    <text x="100" y="78" font-size="11" text-anchor="middle" fill="#5a4a3a">or designated by EC</text>
  </g>

  <!-- Arrow from GPAI to diamond -->
  <line x1="650" y1="160" x2="650" y2="193" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- No branch (left) -->
  <line x1="550" y1="250" x2="330" y2="250" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="330" y1="250" x2="330" y2="335" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="430" y="242" font-size="12" font-weight="700" fill="#1f7a3a">No</text>

  <!-- Yes branch (right) -->
  <line x1="750" y1="250" x2="970" y2="250" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="970" y1="250" x2="970" y2="335" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="855" y="242" font-size="12" font-weight="700" fill="#b3401b">Yes</text>

  <!-- Left tag: All GPAI -->
  <g transform="translate(220, 335)">
    <rect width="220" height="44" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="110" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">All GPAI Models</text>
  </g>

  <!-- Right tag: Systemic risk -->
  <g transform="translate(860, 335)">
    <rect width="220" height="44" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="110" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Systemic-Risk Models</text>
  </g>

  <!-- Base obligations panel -->
  <g transform="translate(80, 410)">
    <rect width="500" height="180" rx="10" fill="#f7fbf8" stroke="#1f7a3a" stroke-width="2"/>
    <text x="250" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Base Obligations (apply to all)</text>

    <g transform="translate(20, 50)">
      <rect width="220" height="55" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="110" y="24" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Technical documentation</text>
      <text x="110" y="42" font-size="11" text-anchor="middle" fill="#5a4a3a">Model card, capabilities, limits</text>
    </g>
    <g transform="translate(260, 50)">
      <rect width="220" height="55" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="110" y="24" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Training data summary</text>
      <text x="110" y="42" font-size="11" text-anchor="middle" fill="#5a4a3a">Public template (Art. 53)</text>
    </g>
    <g transform="translate(20, 115)">
      <rect width="220" height="55" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="110" y="24" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Copyright policy</text>
      <text x="110" y="42" font-size="11" text-anchor="middle" fill="#5a4a3a">Honour TDM opt-outs</text>
    </g>
    <g transform="translate(260, 115)">
      <rect width="220" height="55" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="110" y="24" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Downstream provider info</text>
      <text x="110" y="42" font-size="11" text-anchor="middle" fill="#5a4a3a">Integration guidance</text>
    </g>
  </g>

  <!-- Additional obligations panel -->
  <g transform="translate(720, 410)">
    <rect width="500" height="180" rx="10" fill="#fdf4f0" stroke="#b3401b" stroke-width="2"/>
    <text x="250" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">Additional Obligations (systemic-risk only)</text>

    <g transform="translate(20, 50)">
      <rect width="220" height="55" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.2"/>
      <text x="110" y="24" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Model evaluation + red team</text>
      <text x="110" y="42" font-size="11" text-anchor="middle" fill="#5a4a3a">Adversarial testing</text>
    </g>
    <g transform="translate(260, 50)">
      <rect width="220" height="55" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.2"/>
      <text x="110" y="24" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Systemic risk assessment</text>
      <text x="110" y="42" font-size="11" text-anchor="middle" fill="#5a4a3a">Mitigation plan</text>
    </g>
    <g transform="translate(20, 115)">
      <rect width="220" height="55" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.2"/>
      <text x="110" y="24" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Incident reporting</text>
      <text x="110" y="42" font-size="11" text-anchor="middle" fill="#5a4a3a">Notify EC AI Office</text>
    </g>
    <g transform="translate(260, 115)">
      <rect width="220" height="55" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.2"/>
      <text x="110" y="24" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Cybersecurity measures</text>
      <text x="110" y="42" font-size="11" text-anchor="middle" fill="#5a4a3a">Protect weights, prevent leak</text>
    </g>
  </g>

  <!-- Connectors from tags to panels -->
  <line x1="330" y1="379" x2="330" y2="408" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="970" y1="379" x2="970" y2="408" stroke="#b3401b" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Systemic also inherits Base -->
  <path d="M 870 357 Q 600 380 580 480" stroke="#1a4078" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)"/>
  <text x="700" y="395" font-size="11" font-style="italic" fill="#1a4078">also inherits base</text>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 670)">
    <rect width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Every GPAI provider has four base duties (docs, data summary, copyright, downstream info); systemic-risk models add four more (evals, risk assessment, incident reporting, cybersecurity).</text>
  </g>
</svg>
