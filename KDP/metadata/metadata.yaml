# KDP marketplace submission fields
kdp:
  primary_marketplace: "Amazon.com"
  language: "English"
  publishing_rights: "I own the copyright and I hold the necessary publishing rights."
  age_range: ""         # leave empty unless explicitly aimed at minors
  reading_age: ""
  grade_range: ""

  # KDP allows up to 7 keywords (50 chars each). Refreshed 2026-05-28:
  #   - dropped title-restating keywords (Amazon already indexes the title)
  #   - kept framework + model names that capture co-purchase searches
  #   - added DeepSeek-R1 and Claude 4 to the reasoning-models keyword
  #   - added TIGER (the new Edition 16 LLM-recsys chapter) to recsys keyword
  #   - added GRPO + RLVR to fine-tuning keyword
  keywords:
    - "RAG vector database semantic search LangGraph"
    - "transformer attention from scratch PyTorch"
    - "prompt engineering ChatGPT Claude o1 DeepSeek-R1"
    - "LLM fine tuning LoRA QLoRA RLHF DPO GRPO RLVR"
    - "AI agent multi-agent MCP tool use production"
    - "MLOps LLMOps observability evaluation engineering"
    - "Whisper wav2vec HuBERT CLAP TIGER recommender"

  # KDP allows up to 3 BISAC subject categories. Refreshed 2026-05-10:
  #   - dropped Programming/General (too broad to rank in)
  #   - added Programming Languages > Python (narrower, easier Top 100 rank)
  categories:
    - code: "COM004000"
      label: "COMPUTERS / Intelligence (AI) & Semantics"
    - code: "COM051460"
      label: "COMPUTERS / Programming Languages / Python"
    - code: "COM044000"
      label: "COMPUTERS / Neural Networks"

  # Adult content / low-content / public-domain flags
  adult_content: false
  low_content: false   # Coloring/journal/notebook style; this is a textbook
  public_domain: false

  # Pricing — set during submission; not stored in EPUB itself
  pricing_notes: |
    KDP Royalty Options:
      - 35%: USD 0.99 to 200.00, no delivery fee, all territories
      - 70%: USD 2.99 to 9.99, deducts per-MB delivery fee (~USD 0.15/MB),
             only in select territories, must enroll in KDP Select for some markets
    Recommended price for a technical textbook: USD 9.99 (max for 70% royalty)
    or USD 14.99-19.99 (35% royalty for higher per-unit revenue).

