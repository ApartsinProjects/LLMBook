[book]
title = "Tiny Test Book"
subtitle = "A html2pub fixture"
authors = [
    { name = "Test Author", file_as = "Author, Test", role = "aut" },
]
language = "en"
identifier = "urn:uuid:00000000-0000-4000-a000-000000000001"
publisher = "html2pub"
rights = "Copyright (c) 2026 Test Author."
publication_date = "2026-01-01"
description = "A tiny test book used to smoke-test html2pub builds."
keywords = ["test", "fixture"]

[content]
source_dir = "."
spine = "auto"
front_matter_dir = "front-matter"
parts_glob = "part-*"
module_glob = "chapter-*"
appendices_dir = "appendices"

[styling]
stylesheets = ["styles/book.css"]

[fonts]
include = []

[math]
render = "off"

[images]
max_side = 800
jpeg_quality = 78

[transforms]
wide_table_min_cols = 6
slim_index_lists = false
drop_selectors = []

[transforms.avatar_sizes]

[output]
epub = "output/tiny.epub"
