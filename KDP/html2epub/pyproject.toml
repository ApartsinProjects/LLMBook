[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "html2epub"
version = "0.1.0"
description = "Convert a directory of HTML files into a publishable EPUB 3."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "html2epub contributors" }]
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "Pillow>=10.0",
    "Pygments>=2.17",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
fonts = ["fonttools[woff]>=4.50"]

[project.scripts]
html2epub = "html2epub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
html2epub = ["default_overrides.css", "render_math.js"]
