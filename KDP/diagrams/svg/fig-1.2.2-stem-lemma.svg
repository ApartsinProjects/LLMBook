<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Stemming vs lemmatization: chop suffixes or look up the dictionary form</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Stemming is fast and crude; lemmatization is slow and accurate. Pick the trade you can live with.</text>

  <!-- Shared input -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="220" height="62" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="110" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Input words</text>
    <text x="110" y="48" font-size="13" text-anchor="middle" fill="#1a1a2e">running, studies, better</text>
  </g>
  <line x1="540" y1="180" x2="370" y2="220" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="760" y1="180" x2="930" y2="220" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LEFT LANE: Stemming -->
  <g transform="translate(80, 220)">
    <rect x="0" y="0" width="540" height="340" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="270" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Stemming (rule-based suffix chopping)</text>
    <text x="270" y="48" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Porter, Snowball: strip "-ing", "-es", "-ly" by pattern.</text>

    <!-- Examples -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="480" height="44" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1"/>
      <text x="14" y="28" font-size="13" fill="#1a1a2e">running  -&gt;  <tspan font-weight="700" fill="#1f7a3a">run</tspan></text>
      <text x="460" y="28" font-size="13" text-anchor="end" fill="#1f7a3a">correct</text>
    </g>
    <g transform="translate(30, 124)">
      <rect x="0" y="0" width="480" height="44" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1"/>
      <text x="14" y="28" font-size="13" fill="#1a1a2e">studies  -&gt;  <tspan font-weight="700" fill="#b3401b">studi</tspan></text>
      <text x="460" y="28" font-size="13" text-anchor="end" fill="#b3401b">not a real word</text>
    </g>
    <g transform="translate(30, 178)">
      <rect x="0" y="0" width="480" height="44" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1"/>
      <text x="14" y="28" font-size="13" fill="#1a1a2e">university  -&gt;  <tspan font-weight="700" fill="#b3401b">univers</tspan></text>
      <text x="460" y="28" font-size="13" text-anchor="end" fill="#b3401b">conflates with universe</text>
    </g>
    <g transform="translate(30, 232)">
      <rect x="0" y="0" width="480" height="44" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1"/>
      <text x="14" y="28" font-size="13" fill="#1a1a2e">better  -&gt;  <tspan font-weight="700" fill="#b3401b">better</tspan></text>
      <text x="460" y="28" font-size="13" text-anchor="end" fill="#b3401b">irregular form missed</text>
    </g>

    <!-- Properties -->
    <g transform="translate(30, 290)">
      <text x="0" y="14" font-size="11" font-weight="700" fill="#b3401b">Cost: microseconds per word</text>
      <text x="0" y="32" font-size="11" fill="#1a1a2e">No dictionary, no POS tag needed. Output may not be a real word.</text>
    </g>
  </g>

  <!-- RIGHT LANE: Lemmatization -->
  <g transform="translate(660, 220)">
    <rect x="0" y="0" width="540" height="340" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="270" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Lemmatization (dictionary lookup)</text>
    <text x="270" y="48" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">WordNet, spaCy: map word + POS to its canonical lemma.</text>

    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="480" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="14" y="28" font-size="13" fill="#1a1a2e">running  -&gt;  <tspan font-weight="700" fill="#1f7a3a">run</tspan></text>
      <text x="460" y="28" font-size="13" text-anchor="end" fill="#1f7a3a">correct</text>
    </g>
    <g transform="translate(30, 124)">
      <rect x="0" y="0" width="480" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="14" y="28" font-size="13" fill="#1a1a2e">studies  -&gt;  <tspan font-weight="700" fill="#1f7a3a">study</tspan></text>
      <text x="460" y="28" font-size="13" text-anchor="end" fill="#1f7a3a">handles inflection</text>
    </g>
    <g transform="translate(30, 178)">
      <rect x="0" y="0" width="480" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="14" y="28" font-size="13" fill="#1a1a2e">university  -&gt;  <tspan font-weight="700" fill="#1f7a3a">university</tspan></text>
      <text x="460" y="28" font-size="13" text-anchor="end" fill="#1f7a3a">noun preserved</text>
    </g>
    <g transform="translate(30, 232)">
      <rect x="0" y="0" width="480" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="14" y="28" font-size="13" fill="#1a1a2e">better  -&gt;  <tspan font-weight="700" fill="#1f7a3a">good</tspan></text>
      <text x="460" y="28" font-size="13" text-anchor="end" fill="#1f7a3a">irregular handled</text>
    </g>

    <g transform="translate(30, 290)">
      <text x="0" y="14" font-size="11" font-weight="700" fill="#1f7a3a">Cost: ~10-100x slower; needs POS</text>
      <text x="0" y="32" font-size="11" fill="#1a1a2e">Dictionary memory; output is always a real lexicon entry.</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1140" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Stemming hashes word forms into a smaller key space at the cost of accuracy; lemmatization preserves meaning at the cost of speed.</text>
    <text x="20" y="64" font-size="12" fill="#1a1a2e">Modern subword tokenizers (BPE, WordPiece) sidestep both: they learn statistical pieces from data, no rules or dictionary required.</text>
  </g>
</svg>
