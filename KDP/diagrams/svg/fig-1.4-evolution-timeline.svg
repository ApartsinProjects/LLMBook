<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Evolution of Text Representation, 1990s - Present</text>
  <text x="700" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">Each generation solved a specific limitation of the previous one</text>

  <!-- Main timeline axis at y=410 -->
  <line x1="80" y1="410" x2="1320" y2="410" stroke="#1a1a2e" stroke-width="3"/>

  <!-- Era markers on the axis (4 eras: 1990s, 2013, 2018, 2020+) -->
  <g stroke="#1a1a2e" stroke-width="2">
    <line x1="180"  y1="405" x2="180"  y2="425"/>
    <line x1="540"  y1="405" x2="540"  y2="425"/>
    <line x1="850"  y1="405" x2="850"  y2="425"/>
    <line x1="1180" y1="405" x2="1180" y2="425"/>
  </g>
  <g font-size="13" font-weight="700" fill="#1a1a2e" text-anchor="middle">
    <text x="180"  y="450">1990s - 2012</text>
    <text x="540"  y="450">2013 - 2017</text>
    <text x="850"  y="450">2018</text>
    <text x="1180" y="450">2018 - present</text>
  </g>

  <!-- ============================================================ -->
  <!-- 4 Era cards (above the axis)                                  -->
  <!-- ============================================================ -->

  <!-- Era 1: BoW / TF-IDF -->
  <g filter="url(#sh)">
    <line x1="180" y1="408" x2="180" y2="320" stroke="#722f8a" stroke-width="2"/>
    <circle cx="180" cy="410" r="9" fill="#722f8a" stroke="#ffffff" stroke-width="2"/>
    <rect x="80" y="125" width="200" height="195" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="180" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">BoW / TF-IDF</text>
    <text x="180" y="175" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">bag-of-words era</text>
    <line x1="100" y1="190" x2="260" y2="190" stroke="#722f8a" stroke-width="0.6"/>
    <text x="180" y="212" text-anchor="middle" font-size="12" fill="#1a1a2e">Each word = one</text>
    <text x="180" y="228" text-anchor="middle" font-size="12" fill="#1a1a2e">dimension; sparse</text>
    <text x="180" y="244" text-anchor="middle" font-size="12" fill="#1a1a2e">vector counts.</text>
    <text x="180" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#b3401b">Limitation:</text>
    <text x="180" y="294" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">no semantic similarity</text>
    <text x="180" y="308" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">("car" ≈ "automobile" ?)</text>
  </g>

  <!-- Need-meaning arrow between eras -->
  <line x1="285" y1="410" x2="430" y2="410" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="290" y="378" width="135" height="22" rx="11" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="357" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#1f7a3a">need: meaning</text>

  <!-- Era 2: Word2Vec / GloVe -->
  <g filter="url(#sh)">
    <line x1="540" y1="408" x2="540" y2="320" stroke="#d4b96a" stroke-width="2"/>
    <circle cx="540" cy="410" r="9" fill="#d4b96a" stroke="#ffffff" stroke-width="2"/>
    <rect x="440" y="125" width="200" height="195" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/>
    <text x="540" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Word2Vec / GloVe</text>
    <text x="540" y="175" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">static embeddings era</text>
    <line x1="460" y1="190" x2="620" y2="190" stroke="#d4b96a" stroke-width="0.6"/>
    <text x="540" y="212" text-anchor="middle" font-size="12" fill="#1a1a2e">Dense vectors learned</text>
    <text x="540" y="228" text-anchor="middle" font-size="12" fill="#1a1a2e">from co-occurrence;</text>
    <text x="540" y="244" text-anchor="middle" font-size="12" fill="#1a1a2e">"king − man + woman"</text>
    <text x="540" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#b3401b">Limitation:</text>
    <text x="540" y="294" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">one vector per word —</text>
    <text x="540" y="308" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">"bank" loses ambiguity</text>
  </g>

  <line x1="645" y1="410" x2="745" y2="410" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="650" y="378" width="135" height="22" rx="11" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="717" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#1f7a3a">need: context</text>

  <!-- Era 3: ELMo -->
  <g filter="url(#sh)">
    <line x1="850" y1="408" x2="850" y2="320" stroke="#1a4078" stroke-width="2"/>
    <circle cx="850" cy="410" r="9" fill="#1a4078" stroke="#ffffff" stroke-width="2"/>
    <rect x="750" y="125" width="200" height="195" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="850" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">ELMo</text>
    <text x="850" y="175" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">contextual era</text>
    <line x1="770" y1="190" x2="930" y2="190" stroke="#1a4078" stroke-width="0.6"/>
    <text x="850" y="212" text-anchor="middle" font-size="12" fill="#1a1a2e">Bi-LSTM produces</text>
    <text x="850" y="228" text-anchor="middle" font-size="12" fill="#1a1a2e">a different vector for</text>
    <text x="850" y="244" text-anchor="middle" font-size="12" fill="#1a1a2e">each occurrence.</text>
    <text x="850" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#b3401b">Limitation:</text>
    <text x="850" y="294" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">sequential RNN —</text>
    <text x="850" y="308" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">slow, no parallelism</text>
  </g>

  <line x1="955" y1="410" x2="1075" y2="410" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="960" y="378" width="135" height="22" rx="11" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="1027" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#1f7a3a">need: speed</text>

  <!-- Era 4: Transformers (highlighted as current) -->
  <g filter="url(#sh)">
    <line x1="1180" y1="408" x2="1180" y2="320" stroke="#1f7a3a" stroke-width="2.5"/>
    <circle cx="1180" cy="410" r="11" fill="#1f7a3a" stroke="#ffffff" stroke-width="2"/>
    <rect x="1080" y="120" width="200" height="200" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="1180" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Transformers</text>
    <text x="1180" y="170" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">BERT, GPT, ... — current</text>
    <line x1="1100" y1="185" x2="1260" y2="185" stroke="#1f7a3a" stroke-width="0.6"/>
    <text x="1180" y="207" text-anchor="middle" font-size="12" fill="#1a1a2e">Self-attention enables</text>
    <text x="1180" y="223" text-anchor="middle" font-size="12" fill="#1a1a2e">parallel computation</text>
    <text x="1180" y="239" text-anchor="middle" font-size="12" fill="#1a1a2e">across all tokens.</text>
    <text x="1180" y="275" text-anchor="middle" font-size="11" font-weight="700" fill="#1f7a3a">✓ Solved:</text>
    <text x="1180" y="291" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">meaning + context</text>
    <text x="1180" y="307" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">+ speed at scale</text>
  </g>

  <!-- Bottom callout -->
  <g transform="translate(80, 510)">
    <rect x="0" y="0" width="1240" height="85" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Why this trajectory?</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Each era's STRENGTH became the next era's bottleneck. BoW had structure but no meaning; Word2Vec added meaning but lost</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">context; ELMo added context but lost speed. Transformers solved all three — the dominant architecture from 2018 onward.</text>
    <text x="20" y="80" font-size="11" fill="#5a4a3a" font-style="italic">The pattern continues: today's bottleneck (long-context efficiency, structured reasoning) will define the next era.</text>
  </g>

  <!-- Era band labels at y=620 -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1240" height="60" rx="6" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#5a4a3a">Generation properties:</text>
    <text x="180" y="22" text-anchor="middle" font-size="11" fill="#722f8a" font-weight="700">Sparse, no semantics</text>
    <text x="540" y="22" text-anchor="middle" font-size="11" fill="#7a5e1a" font-weight="700">Dense, but static</text>
    <text x="850" y="22" text-anchor="middle" font-size="11" fill="#1a4078" font-weight="700">Contextual, but slow</text>
    <text x="1180" y="22" text-anchor="middle" font-size="11" fill="#1f7a3a" font-weight="700">Contextual, parallel, fast</text>
    <text x="20" y="48" font-size="11" fill="#5a4a3a" font-style="italic">Pre-deep-learning representation methods used hand-crafted features; deep methods learned representations from data.</text>
  </g>
</svg>
