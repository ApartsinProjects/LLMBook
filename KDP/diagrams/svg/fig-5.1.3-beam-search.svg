<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Beam Search (beam = 2)</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Keep the k best partial sequences at every step — explores promising paths greedy decoding misses</text>

  <!-- Step labels -->
  <g font-size="13" font-weight="600" fill="#5a4a3a">
    <text x="120" y="120" text-anchor="middle">Step 0</text>
    <text x="370" y="120" text-anchor="middle">Step 1</text>
    <text x="650" y="120" text-anchor="middle">Step 2</text>
    <text x="970" y="120" text-anchor="middle">Step 3</text>
  </g>

  <!-- Step 0: root -->
  <rect x="60" y="290" width="160" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
  <text x="140" y="316" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">"The"</text>
  <text x="140" y="336" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">log p = 0.0</text>

  <!-- Edges to Step 1 -->
  <line x1="220" y1="310" x2="290" y2="220" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="220" y1="330" x2="290" y2="430" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 1 (2 beams kept) -->
  <rect x="290" y="180" width="180" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
  <text x="380" y="206" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">"The cat"</text>
  <text x="380" y="226" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">log p = −1.2</text>

  <rect x="290" y="400" width="180" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
  <text x="380" y="426" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">"The old"</text>
  <text x="380" y="446" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">log p = −1.5</text>

  <!-- Edges to Step 2 -->
  <line x1="470" y1="210" x2="540" y2="290" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="470" y1="430" x2="540" y2="350" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 (2 beams kept after expansion of all candidates) -->
  <rect x="540" y="270" width="200" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
  <text x="640" y="296" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">"The cat sat"</text>
  <text x="640" y="316" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">log p = −2.1</text>

  <rect x="540" y="340" width="200" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
  <text x="640" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">"The old cat"</text>
  <text x="640" y="386" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">log p = −1.9</text>

  <!-- Edges to Step 3 -->
  <line x1="740" y1="290" x2="810" y2="220" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="740" y1="370" x2="810" y2="430" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="810" y="180" width="280" height="60" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
  <text x="950" y="206" font-size="14" font-weight="600" text-anchor="middle" fill="#7a5e1a">"The cat sat on"</text>
  <text x="950" y="226" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">log p = −2.6  (greedy would pick this earlier)</text>

  <rect x="810" y="400" width="280" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="3"/>
  <text x="950" y="426" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">"The old cat purred"  ★</text>
  <text x="950" y="446" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">log p = −2.3</text>
  <text x="950" y="464" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">best after global comparison</text>

  <!-- Right callout -->
  <g transform="translate(1130, 130)">
    <rect x="0" y="0" width="160" height="380" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="80" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Beam = k</text>
    <line x1="15" y1="42" x2="145" y2="42" stroke="#d4b96a" stroke-width="0.6"/>
    <text x="15" y="68" font-size="11" fill="#1a1a2e">k = 1: greedy</text>
    <text x="15" y="86" font-size="11" fill="#1a1a2e">(may miss better</text>
    <text x="15" y="104" font-size="11" fill="#1a1a2e">paths)</text>

    <text x="15" y="138" font-size="11" fill="#1a1a2e">k = 2-5: typical</text>
    <text x="15" y="156" font-size="11" fill="#1a1a2e">for translation</text>

    <text x="15" y="190" font-size="11" fill="#1a1a2e">Larger k = wider</text>
    <text x="15" y="208" font-size="11" fill="#1a1a2e">search, costs k×</text>
    <text x="15" y="226" font-size="11" fill="#1a1a2e">more compute.</text>

    <text x="15" y="260" font-size="11" font-weight="700" fill="#b3401b">⚠ Bland output:</text>
    <text x="15" y="278" font-size="11" fill="#1a1a2e">over-large k tends</text>
    <text x="15" y="296" font-size="11" fill="#1a1a2e">toward generic,</text>
    <text x="15" y="314" font-size="11" fill="#1a1a2e">repetitive text.</text>

    <text x="15" y="348" font-size="11" font-weight="600" fill="#1f7a3a">Modern open-ended</text>
    <text x="15" y="366" font-size="11" font-weight="600" fill="#1f7a3a">gen → sampling.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 590)">
    <rect x="0" y="0" width="1180" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">At each step, expand all current beams, score every candidate by cumulative log-prob, then keep only the top-k. Greedy would have committed to "The cat" at step 1 and missed the higher-scoring "The old cat purred".</text>
    <text x="20" y="70" font-size="12" font-style="italic" fill="#5a4a3a">Used heavily in MT and summarization; less suited to creative generation, where sampling produces more diverse output.</text>
  </g>
</svg>
