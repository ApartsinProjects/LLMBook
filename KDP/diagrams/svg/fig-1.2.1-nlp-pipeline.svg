<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="700" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Classic NLP Preprocessing Pipeline</text>
  <text x="700" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Each stage strips noise so downstream features capture meaning, not surface form</text>

  <!-- 6 stages in a row, each with input → output example -->
  <g>
    <!-- 1: Raw text -->
    <rect x="50" y="160" width="180" height="120" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="140" y="188" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Raw Text</text>
    <line x1="70" y1="200" x2="210" y2="200" stroke="#7a5e1a" stroke-width="0.6"/>
    <text x="140" y="225" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">"Cats are</text>
    <text x="140" y="243" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">running fast!"</text>
    <text x="140" y="270" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">noisy input</text>
  </g>

  <line x1="230" y1="220" x2="280" y2="220" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="280" y="160" width="180" height="120" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="370" y="188" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Normalize</text>
    <line x1="300" y1="200" x2="440" y2="200" stroke="#1a4078" stroke-width="0.6"/>
    <text x="370" y="225" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">"cats are</text>
    <text x="370" y="243" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">running fast"</text>
    <text x="370" y="270" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">unicode + lowercase</text>
  </g>

  <line x1="460" y1="220" x2="510" y2="220" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="510" y="160" width="180" height="120" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="600" y="188" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Tokenize</text>
    <line x1="530" y1="200" x2="670" y2="200" stroke="#1a4078" stroke-width="0.6"/>
    <text x="600" y="225" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">["cats", "are",</text>
    <text x="600" y="243" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">"running", "fast"]</text>
    <text x="600" y="270" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">split on word boundary</text>
  </g>

  <line x1="690" y1="220" x2="740" y2="220" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="740" y="160" width="180" height="120" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="830" y="188" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Stop Words</text>
    <line x1="760" y1="200" x2="900" y2="200" stroke="#1a4078" stroke-width="0.6"/>
    <text x="830" y="225" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">["cats",</text>
    <text x="830" y="243" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">"running", "fast"]</text>
    <text x="830" y="270" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">drop "are"</text>
  </g>

  <line x1="920" y1="220" x2="970" y2="220" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="970" y="160" width="180" height="120" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="1060" y="188" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Lemmatize</text>
    <line x1="990" y1="200" x2="1130" y2="200" stroke="#1a4078" stroke-width="0.6"/>
    <text x="1060" y="225" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">["cat",</text>
    <text x="1060" y="243" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">"run", "fast"]</text>
    <text x="1060" y="270" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">root forms</text>
  </g>

  <line x1="1150" y1="220" x2="1200" y2="220" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="1200" y="160" width="180" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="1290" y="188" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Features</text>
    <line x1="1220" y1="200" x2="1360" y2="200" stroke="#1f7a3a" stroke-width="0.6"/>
    <text x="1290" y="225" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">[42, 17, 8]</text>
    <text x="1290" y="243" font-size="12" font-family="monospace" text-anchor="middle" fill="#1a1a2e">or vector(...)</text>
    <text x="1290" y="270" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">downstream input</text>
  </g>

  <!-- Step numbers -->
  <g font-size="14" font-weight="700" fill="#5a4a3a">
    <text x="140" y="140" text-anchor="middle">1</text>
    <text x="370" y="140" text-anchor="middle">2</text>
    <text x="600" y="140" text-anchor="middle">3</text>
    <text x="830" y="140" text-anchor="middle">4</text>
    <text x="1060" y="140" text-anchor="middle">5</text>
    <text x="1290" y="140" text-anchor="middle">6</text>
  </g>

  <!-- Modern note callout -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="1280" height="80" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7a5e1a">In modern LLM pipelines</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Steps 4 (stop-word removal) and 5 (lemmatization) are typically SKIPPED. Subword tokenizers (BPE / SentencePiece) handle morphology implicitly, and transformers learn that "the" carries weak signal on their own.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="1280" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">The pipeline reduces surface variation so downstream models see semantic content. Each step is lossy — choose what to drop based on the task (search keeps stop-words; sentiment doesn't).</text>
  </g>
</svg>
