<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrFw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
    <marker id="arrRev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <!-- Noise pattern (gradient) -->
    <linearGradient id="noiseHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>
    <linearGradient id="noiseMed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bbbbbb"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>
    <linearGradient id="noiseLo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfd8e3"/>
      <stop offset="100%" stop-color="#9eb1c3"/>
    </linearGradient>
    <radialGradient id="cleanImg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff5dc"/>
      <stop offset="100%" stop-color="#d4b96a"/>
    </radialGradient>
  </defs>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Diffusion Models: Forward and Reverse Processes</text>
  <text x="700" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">A neural network learns to invert a fixed noise-addition process, generating images from pure noise</text>

  <!-- ============================================================ -->
  <!-- FORWARD PROCESS (top row, left → right)                       -->
  <!-- ============================================================ -->
  <g transform="translate(0,110)">
    <!-- Section label -->
    <rect x="40" y="0" width="1320" height="32" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="60" y="22" font-size="14" font-weight="700" fill="#b3401b">Forward process  q(x_t | x_{t-1})  —  fixed Gaussian noise schedule, no learning</text>
    <text x="700" y="22" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">add a small amount of noise at each step</text>

    <!-- Image x_0 (clean) -->
    <g filter="url(#sh)" transform="translate(60,55)">
      <rect x="0" y="0" width="120" height="120" rx="6" fill="url(#cleanImg)" stroke="#1f7a3a" stroke-width="2"/>
      <!-- A simple "object" inside -->
      <circle cx="60" cy="55" r="20" fill="#ffffff" opacity="0.7"/>
      <rect x="40" y="80" width="40" height="25" rx="3" fill="#ffffff" opacity="0.5"/>
      <text x="60" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e" font-style="italic">x₀</text>
      <text x="60" y="162" text-anchor="middle" font-size="11" fill="#5a4a3a">clean image</text>
    </g>

    <!-- arrow + step -->
    <line x1="190" y1="115" x2="240" y2="115" stroke="#b3401b" stroke-width="2" marker-end="url(#arrFw)"/>
    <text x="215" y="105" text-anchor="middle" font-size="11" fill="#b3401b">+ε</text>

    <!-- Image x_1 (slight noise) -->
    <g filter="url(#sh)" transform="translate(245,55)">
      <rect x="0" y="0" width="120" height="120" rx="6" fill="url(#cleanImg)" stroke="#5a4a3a" stroke-width="1.5"/>
      <circle cx="60" cy="55" r="20" fill="#ffffff" opacity="0.5"/>
      <rect x="40" y="80" width="40" height="25" rx="3" fill="#ffffff" opacity="0.35"/>
      <!-- noise speckles -->
      <g opacity="0.3" fill="#1a1a2e">
        <circle cx="20" cy="20" r="2"/><circle cx="100" cy="30" r="2"/>
        <circle cx="40" cy="100" r="2"/><circle cx="80" cy="60" r="1.5"/>
        <circle cx="30" cy="50" r="1.5"/><circle cx="90" cy="90" r="2"/>
      </g>
      <text x="60" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e" font-style="italic">x₁</text>
      <text x="60" y="162" text-anchor="middle" font-size="11" fill="#5a4a3a">a little noise</text>
    </g>

    <!-- arrow + ... -->
    <line x1="375" y1="115" x2="425" y2="115" stroke="#b3401b" stroke-width="2" marker-end="url(#arrFw)"/>
    <text x="400" y="105" text-anchor="middle" font-size="11" fill="#b3401b">+ε</text>

    <!-- Image x_t (medium noise) -->
    <g filter="url(#sh)" transform="translate(430,55)">
      <rect x="0" y="0" width="120" height="120" rx="6" fill="url(#noiseLo)" stroke="#5a4a3a" stroke-width="1.5"/>
      <g opacity="0.6" fill="#1a1a2e">
        <circle cx="20" cy="20" r="2"/><circle cx="100" cy="30" r="2.5"/>
        <circle cx="40" cy="100" r="2"/><circle cx="80" cy="60" r="2.5"/>
        <circle cx="30" cy="50" r="2"/><circle cx="90" cy="90" r="2.5"/>
        <circle cx="60" cy="20" r="2"/><circle cx="40" cy="60" r="2"/>
        <circle cx="100" cy="100" r="2"/><circle cx="60" cy="100" r="1.5"/>
      </g>
      <text x="60" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e" font-style="italic">x_t</text>
      <text x="60" y="162" text-anchor="middle" font-size="11" fill="#5a4a3a">medium noise</text>
    </g>

    <!-- ... -->
    <text x="595" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#5a4a3a">···</text>

    <!-- Image x_T (pure noise) -->
    <g filter="url(#sh)" transform="translate(620,55)">
      <rect x="0" y="0" width="120" height="120" rx="6" fill="url(#noiseHi)" stroke="#5a4a3a" stroke-width="1.5"/>
      <g opacity="0.85" fill="#ffffff">
        <rect x="5" y="5" width="3" height="3"/><rect x="20" y="10" width="3" height="3"/>
        <rect x="35" y="20" width="3" height="3"/><rect x="50" y="8" width="3" height="3"/>
        <rect x="65" y="30" width="3" height="3"/><rect x="80" y="15" width="3" height="3"/>
        <rect x="95" y="50" width="3" height="3"/><rect x="110" y="40" width="3" height="3"/>
        <rect x="10" y="60" width="3" height="3"/><rect x="25" y="80" width="3" height="3"/>
        <rect x="45" y="95" width="3" height="3"/><rect x="60" y="70" width="3" height="3"/>
        <rect x="75" y="100" width="3" height="3"/><rect x="90" y="90" width="3" height="3"/>
        <rect x="105" y="110" width="3" height="3"/><rect x="15" y="105" width="3" height="3"/>
      </g>
      <g opacity="0.85" fill="#000000">
        <rect x="13" y="20" width="3" height="3"/><rect x="28" y="40" width="3" height="3"/>
        <rect x="43" y="55" width="3" height="3"/><rect x="58" y="38" width="3" height="3"/>
        <rect x="73" y="63" width="3" height="3"/><rect x="88" y="48" width="3" height="3"/>
        <rect x="103" y="83" width="3" height="3"/><rect x="18" y="93" width="3" height="3"/>
        <rect x="33" y="73" width="3" height="3"/><rect x="48" y="113" width="3" height="3"/>
      </g>
      <text x="60" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e" font-style="italic">x_T</text>
      <text x="60" y="162" text-anchor="middle" font-size="11" fill="#5a4a3a">pure Gaussian noise</text>
    </g>

    <!-- Right side: equation -->
    <g transform="translate(800,55)">
      <rect x="0" y="0" width="540" height="120" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1"/>
      <text x="20" y="25" font-size="13" font-weight="700" fill="#b3401b">Forward step (closed form, no learning)</text>
      <text x="20" y="55" font-size="14" fill="#1a1a2e" font-style="italic">x_t  =  √(1 − β_t) · x_{t−1}  +  √β_t · ε,    ε ~ N(0, I)</text>
      <text x="20" y="85" font-size="12" fill="#5a4a3a">β_t is the noise schedule (small early, larger later).</text>
      <text x="20" y="103" font-size="12" fill="#5a4a3a">Equivalent to: at any step t, sample x_t directly from N(√(α̅_t)x_0, (1−α̅_t)I).</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- REVERSE PROCESS (bottom row, right → left, same images       -->
  <!-- ============================================================ -->
  <g transform="translate(0,400)">
    <rect x="40" y="0" width="1320" height="32" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="60" y="22" font-size="14" font-weight="700" fill="#1f7a3a">Reverse process  p_θ(x_{t-1} | x_t)  —  learned denoiser (U-Net or DiT)</text>
    <text x="700" y="22" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">predict and remove noise at each step, conditioned on text prompt</text>

    <!-- Pure noise (start) -->
    <g filter="url(#sh)" transform="translate(620,55)">
      <rect x="0" y="0" width="120" height="120" rx="6" fill="url(#noiseHi)" stroke="#5a4a3a" stroke-width="1.5"/>
      <g opacity="0.85" fill="#ffffff">
        <rect x="5" y="5" width="3" height="3"/><rect x="20" y="10" width="3" height="3"/>
        <rect x="35" y="20" width="3" height="3"/><rect x="50" y="8" width="3" height="3"/>
        <rect x="65" y="30" width="3" height="3"/><rect x="80" y="15" width="3" height="3"/>
        <rect x="95" y="50" width="3" height="3"/><rect x="110" y="40" width="3" height="3"/>
        <rect x="10" y="60" width="3" height="3"/><rect x="25" y="80" width="3" height="3"/>
        <rect x="45" y="95" width="3" height="3"/><rect x="60" y="70" width="3" height="3"/>
      </g>
      <text x="60" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e" font-style="italic">x_T  (start here)</text>
    </g>

    <line x1="615" y1="115" x2="565" y2="115" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrRev)"/>
    <text x="590" y="105" text-anchor="middle" font-size="11" fill="#1f7a3a">−ε̂</text>
    <text x="595" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#5a4a3a">···</text>

    <!-- Medium noise -->
    <g filter="url(#sh)" transform="translate(430,55)">
      <rect x="0" y="0" width="120" height="120" rx="6" fill="url(#noiseLo)" stroke="#5a4a3a" stroke-width="1.5"/>
      <g opacity="0.6" fill="#1a1a2e">
        <circle cx="20" cy="20" r="2"/><circle cx="100" cy="30" r="2.5"/>
        <circle cx="40" cy="100" r="2"/><circle cx="80" cy="60" r="2.5"/>
        <circle cx="30" cy="50" r="2"/><circle cx="90" cy="90" r="2.5"/>
      </g>
      <text x="60" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e" font-style="italic">x_t</text>
    </g>

    <line x1="425" y1="115" x2="375" y2="115" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrRev)"/>
    <text x="400" y="105" text-anchor="middle" font-size="11" fill="#1f7a3a">−ε̂</text>

    <g filter="url(#sh)" transform="translate(245,55)">
      <rect x="0" y="0" width="120" height="120" rx="6" fill="url(#cleanImg)" stroke="#5a4a3a" stroke-width="1.5"/>
      <circle cx="60" cy="55" r="20" fill="#ffffff" opacity="0.5"/>
      <rect x="40" y="80" width="40" height="25" rx="3" fill="#ffffff" opacity="0.35"/>
      <text x="60" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e" font-style="italic">x₁</text>
    </g>

    <line x1="240" y1="115" x2="190" y2="115" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrRev)"/>
    <text x="215" y="105" text-anchor="middle" font-size="11" fill="#1f7a3a">−ε̂</text>

    <g filter="url(#sh)" transform="translate(60,55)">
      <rect x="0" y="0" width="120" height="120" rx="6" fill="url(#cleanImg)" stroke="#1f7a3a" stroke-width="2.5"/>
      <circle cx="60" cy="55" r="20" fill="#ffffff" opacity="0.7"/>
      <rect x="40" y="80" width="40" height="25" rx="3" fill="#ffffff" opacity="0.5"/>
      <text x="60" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e" font-style="italic">x₀  (generated)</text>
      <text x="60" y="163" text-anchor="middle" font-size="11" fill="#1f7a3a" font-weight="700">clean image!</text>
    </g>

    <!-- Right side: equation -->
    <g transform="translate(800,55)">
      <rect x="0" y="0" width="540" height="120" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Reverse step (learned by neural network)</text>
      <text x="20" y="55" font-size="14" fill="#1a1a2e" font-style="italic">ε̂_θ(x_t, t, c)  ≈  the noise that was added at step t</text>
      <text x="20" y="85" font-size="12" fill="#5a4a3a">Subtract predicted noise → cleaner x_{t-1}.   c = optional text condition (CLIP).</text>
      <text x="20" y="103" font-size="12" fill="#5a4a3a">Training loss:  ‖ε − ε̂_θ(x_t, t)‖²  on noisy training images.</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- BOTTOM CALLOUT                                                -->
  <!-- ============================================================ -->
  <g transform="translate(60,640)">
    <rect x="0" y="0" width="1280" height="50" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Key insight</text>
    <text x="120" y="22" font-size="12" fill="#1a1a2e">Predicting the noise at step t is equivalent to learning the score function ∇log p(x_t) of the data distribution.</text>
    <text x="20" y="40" font-size="12" fill="#5a4a3a" font-style="italic">Sampling: start from random Gaussian noise, apply the learned denoiser T times (typically 20-1000 steps with DDIM/EDM schedulers).</text>
  </g>
</svg>
