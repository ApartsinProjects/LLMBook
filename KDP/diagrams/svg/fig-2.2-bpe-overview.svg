<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Byte Pair Encoding (BPE)</text>
  <text x="600" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">Bottom-up tokenization: start with characters, iteratively merge the most frequent pair</text>

  <!-- Helper for character tokens -->
  <!-- Step 1 -->
  <g>
    <circle cx="60" cy="120" r="22" fill="#1a4078"/>
    <text x="60" y="127" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">1</text>
    <text x="100" y="115" font-size="18" font-weight="700" fill="#1a1a2e">Start: split text into characters</text>
    <text x="100" y="138" font-size="13" fill="#5a4a3a" font-style="italic">corpus: "low lower newest widest"  (toy example)</text>
  </g>
  <g transform="translate(100,160)">
    <!-- Each char as a small box -->
    <g font-size="14" font-weight="600" fill="#1a1a2e">
      <rect x="0"   y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="11" y="20" text-anchor="middle">l</text>
      <rect x="26"  y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="37" y="20" text-anchor="middle">o</text>
      <rect x="52"  y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="63" y="20" text-anchor="middle">w</text>
      <rect x="78"  y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="89" y="20" text-anchor="middle">l</text>
      <rect x="104" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="115" y="20" text-anchor="middle">o</text>
      <rect x="130" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="141" y="20" text-anchor="middle">w</text>
      <rect x="156" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="167" y="20" text-anchor="middle">e</text>
      <rect x="182" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="193" y="20" text-anchor="middle">r</text>
      <rect x="216" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="227" y="20" text-anchor="middle">n</text>
      <rect x="242" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="253" y="20" text-anchor="middle">e</text>
      <rect x="268" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="279" y="20" text-anchor="middle">w</text>
      <rect x="294" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="305" y="20" text-anchor="middle">e</text>
      <rect x="320" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="331" y="20" text-anchor="middle">s</text>
      <rect x="346" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="357" y="20" text-anchor="middle">t</text>
      <rect x="380" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="391" y="20" text-anchor="middle">w</text>
      <rect x="406" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="417" y="20" text-anchor="middle">i</text>
      <rect x="432" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="443" y="20" text-anchor="middle">d</text>
      <rect x="458" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="469" y="20" text-anchor="middle">e</text>
      <rect x="484" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="495" y="20" text-anchor="middle">s</text>
      <rect x="510" y="0" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/><text x="521" y="20" text-anchor="middle">t</text>
    </g>
    <text x="650" y="20" font-size="13" fill="#5a4a3a" font-style="italic">vocab: 26 characters</text>
  </g>

  <!-- Down arrow -->
  <line x1="600" y1="220" x2="600" y2="265" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 2: Count pairs -->
  <g transform="translate(0,275)">
    <circle cx="60" cy="30" r="22" fill="#1a4078"/>
    <text x="60" y="37" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">2</text>
    <text x="100" y="25" font-size="18" font-weight="700" fill="#1a1a2e">Count adjacent pair frequencies</text>
    <text x="100" y="48" font-size="13" fill="#5a4a3a" font-style="italic">scan the corpus and tally every adjacent character pair</text>

    <!-- Frequency table -->
    <g transform="translate(100,75)" font-size="14">
      <rect x="0" y="0" width="380" height="120" rx="4" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>
      <text x="20" y="22" font-weight="700" fill="#1a1a2e">Pair</text>
      <text x="120" y="22" font-weight="700" fill="#1a1a2e">Count</text>
      <line x1="10" y1="32" x2="240" y2="32" stroke="#5a4a3a" stroke-width="1"/>
      <text x="20" y="50" fill="#1a1a2e" font-family="monospace">("e", "s")</text>
      <text x="140" y="50" fill="#1a1a2e">2</text>
      <text x="20" y="70" fill="#1a1a2e" font-family="monospace">("s", "t")</text>
      <text x="140" y="70" fill="#1a1a2e">2</text>
      <text x="20" y="90" fill="#1a1a2e" font-family="monospace">("l", "o")</text>
      <text x="140" y="90" fill="#1a1a2e">2</text>
      <text x="20" y="110" fill="#1a1a2e" font-family="monospace">("o", "w")</text>
      <text x="140" y="110" fill="#1a1a2e">2</text>

      <!-- Highlight winner -->
      <rect x="240" y="35" width="130" height="22" rx="4" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="305" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5e1a">most frequent → merge</text>
    </g>
    <text x="600" y="105" font-size="14" fill="#5a4a3a" font-style="italic">Tie-break: take the first listed pair, here ("e","s")</text>
  </g>

  <!-- Down arrow -->
  <line x1="600" y1="430" x2="600" y2="475" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 3: Merge -->
  <g transform="translate(0,485)">
    <circle cx="60" cy="30" r="22" fill="#1a4078"/>
    <text x="60" y="37" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">3</text>
    <text x="100" y="25" font-size="18" font-weight="700" fill="#1a1a2e">Merge the winning pair into a new token</text>
    <text x="100" y="48" font-size="13" fill="#5a4a3a" font-style="italic">replace every occurrence of the pair with a new combined token; vocab grows by 1</text>

    <!-- Before/after side by side -->
    <g transform="translate(100,70)">
      <text x="0" y="15" font-size="13" font-weight="600" fill="#5a4a3a">before:</text>
      <g font-size="14" font-weight="600" fill="#1a1a2e">
        <rect x="0"  y="22" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/><text x="11" y="42" text-anchor="middle">n</text>
        <rect x="26" y="22" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/><text x="37" y="42" text-anchor="middle">e</text>
        <rect x="52" y="22" width="22" height="28" rx="3" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/><text x="63" y="42" text-anchor="middle">e</text>
        <rect x="78" y="22" width="22" height="28" rx="3" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/><text x="89" y="42" text-anchor="middle">s</text>
        <rect x="104" y="22" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/><text x="115" y="42" text-anchor="middle">t</text>
      </g>
    </g>
    <line x1="280" y1="105" x2="335" y2="105" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="307" y="98" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">merge</text>

    <g transform="translate(345,70)">
      <text x="0" y="15" font-size="13" font-weight="600" fill="#5a4a3a">after:</text>
      <g font-size="14" font-weight="600" fill="#1a1a2e">
        <rect x="0"  y="22" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/><text x="11" y="42" text-anchor="middle">n</text>
        <rect x="26" y="22" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/><text x="37" y="42" text-anchor="middle">e</text>
        <rect x="52" y="22" width="42" height="28" rx="3" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/><text x="73" y="42" text-anchor="middle">es</text>
        <rect x="98" y="22" width="22" height="28" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/><text x="109" y="42" text-anchor="middle">t</text>
      </g>
    </g>

    <text x="700" y="100" font-size="13" fill="#5a4a3a" font-style="italic">vocab: 26 + 1 = 27 tokens</text>
    <text x="700" y="120" font-size="13" fill="#1a4078" font-weight="600">add merge rule:  ("e", "s")  →  "es"</text>
  </g>

  <!-- Down arrow -->
  <line x1="600" y1="640" x2="600" y2="685" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 4: Repeat -->
  <g transform="translate(0,695)">
    <circle cx="60" cy="30" r="22" fill="#1a4078"/>
    <text x="60" y="37" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">4</text>
    <text x="100" y="25" font-size="18" font-weight="700" fill="#1a1a2e">Repeat steps 2-3 until the vocabulary reaches the target size</text>
    <text x="100" y="48" font-size="13" fill="#5a4a3a" font-style="italic">each pass adds one merged token; common subwords (-ing, -tion, the) emerge naturally</text>

    <!-- Final vocab examples -->
    <g transform="translate(100,75)">
      <rect x="0" y="0" width="700" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="20" y="25" font-size="14" font-weight="700" fill="#1f7a3a">Final vocabulary  (after k merges, e.g. k=50,000 for GPT-4)</text>
      <text x="20" y="50" font-size="14" fill="#1a1a2e" font-family="monospace">{ a, b, c, ..., z,  es,  est,  low,  newest,  widest,  ing,  tion,  the,  ... }</text>
      <text x="20" y="68" font-size="12" fill="#5a4a3a" font-style="italic">single-character tokens kept as fallback for rare words; merge rules applied left-to-right at inference</text>
    </g>
  </g>

  <!-- Side note -->
  <g transform="translate(900,275)">
    <rect x="0" y="0" width="280" height="220" rx="8" fill="#fff8e7" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="140" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5e1a">Why this works</text>
    <text x="20" y="55" font-size="12" fill="#1a1a2e">• Frequent multi-char patterns get</text>
    <text x="20" y="73" font-size="12" fill="#1a1a2e">  promoted to single tokens</text>
    <text x="20" y="98" font-size="12" fill="#1a1a2e">• Rare words still split into smaller</text>
    <text x="20" y="116" font-size="12" fill="#1a1a2e">  pieces — vocab stays bounded</text>
    <text x="20" y="141" font-size="12" fill="#1a1a2e">• Greedy + deterministic — same text</text>
    <text x="20" y="159" font-size="12" fill="#1a1a2e">  always tokenizes the same way</text>
    <text x="20" y="184" font-size="12" fill="#1a1a2e">• Used by GPT-2, GPT-3, GPT-4,</text>
    <text x="20" y="202" font-size="12" fill="#1a1a2e">  Llama, and most modern LLMs</text>
  </g>
</svg>
