<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="650" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Compute-Optimal Inference: Easy vs Hard Tasks</text>
  <text x="650" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">For a fixed compute budget, the optimal model + sampling recipe depends on task difficulty</text>

  <!-- ============================================================ -->
  <!-- LEFT PANEL: Easy tasks                                        -->
  <!-- ============================================================ -->
  <g filter="url(#sh)">
    <rect x="60" y="100" width="600" height="600" rx="14" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="360" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a3a">Easy tasks</text>
    <text x="360" y="158" text-anchor="middle" font-size="12" fill="#5a4a3a" font-style="italic">e.g. classification, factual lookup, short Q&amp;A</text>
  </g>

  <!-- Mini chart in left panel -->
  <rect x="100" y="200" width="520" height="280" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>

  <!-- Y axis: accuracy -->
  <text x="80" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e" transform="rotate(-90 80 345)">accuracy</text>
  <g font-size="11" fill="#5a4a3a" text-anchor="end">
    <text x="95" y="210">95%</text>
    <text x="95" y="345">75%</text>
    <text x="95" y="480">50%</text>
  </g>

  <!-- X axis: compute -->
  <text x="360" y="510" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">compute (FLOPs, log)</text>
  <g font-size="11" fill="#5a4a3a" text-anchor="middle">
    <text x="120" y="495">10²⁰</text>
    <text x="370" y="495">10²¹</text>
    <text x="620" y="495">10²²</text>
  </g>

  <!-- Big-model curve (wins on easy) -->
  <path d="M 130,370 Q 250,290 400,250 T 610,225" fill="none" stroke="#1a4078" stroke-width="3.5"/>
  <g fill="#1a4078">
    <circle cx="130" cy="370" r="5"/>
    <circle cx="400" cy="250" r="5"/>
    <circle cx="610" cy="225" r="5"/>
  </g>
  <text x="445" y="232" font-size="11" font-weight="700" fill="#1a4078">70B, 1 sample</text>

  <!-- Small + many samples curve (loses on easy) -->
  <path d="M 130,400 Q 250,360 400,330 T 610,295" fill="none" stroke="#722f8a" stroke-width="2.5" stroke-dasharray="6,3"/>
  <g fill="#722f8a">
    <circle cx="130" cy="400" r="4"/>
    <circle cx="400" cy="330" r="4"/>
    <circle cx="610" cy="295" r="4"/>
  </g>
  <text x="445" y="312" font-size="11" font-weight="700" fill="#722f8a">7B, 64 samples</text>

  <!-- Winner annotation -->
  <g transform="translate(100, 530)">
    <rect x="0" y="0" width="520" height="150" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="260" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5e1a">✓  Optimal recipe: bigger model, single sample</text>
    <text x="20" y="55" font-size="12" fill="#1a1a2e"><tspan font-weight="700">Why:</tspan> easy tasks are bottlenecked by knowledge / capacity,</text>
    <text x="20" y="73" font-size="12" fill="#1a1a2e">not by reasoning. Big models already know the answer; extra samples just add noise.</text>
    <text x="20" y="100" font-size="12" font-weight="700" fill="#1f7a3a">Recommendation: 70B, 1 sample, no PRM</text>
    <text x="20" y="120" font-size="11" fill="#5a4a3a" font-style="italic">spend compute on parameters, not samples.</text>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL: Hard tasks                                       -->
  <!-- ============================================================ -->
  <g filter="url(#sh)">
    <rect x="690" y="100" width="600" height="600" rx="14" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="990" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#b3401b">Hard tasks</text>
    <text x="990" y="158" text-anchor="middle" font-size="12" fill="#5a4a3a" font-style="italic">e.g. competition math, multi-step reasoning, theorem proving</text>
  </g>

  <rect x="730" y="200" width="520" height="280" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>

  <text x="710" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e" transform="rotate(-90 710 345)">accuracy</text>
  <g font-size="11" fill="#5a4a3a" text-anchor="end">
    <text x="725" y="210">75%</text>
    <text x="725" y="345">50%</text>
    <text x="725" y="480">25%</text>
  </g>

  <text x="990" y="510" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">compute (FLOPs, log)</text>
  <g font-size="11" fill="#5a4a3a" text-anchor="middle">
    <text x="750" y="495">10²⁰</text>
    <text x="1000" y="495">10²¹</text>
    <text x="1240" y="495">10²²</text>
  </g>

  <!-- Big-model curve (loses on hard - plateaus) -->
  <path d="M 760,420 Q 880,400 1030,385 T 1240,375" fill="none" stroke="#1a4078" stroke-width="2.5" stroke-dasharray="6,3"/>
  <g fill="#1a4078">
    <circle cx="760" cy="420" r="4"/>
    <circle cx="1030" cy="385" r="4"/>
    <circle cx="1240" cy="375" r="4"/>
  </g>
  <text x="1075" y="372" font-size="11" font-weight="700" fill="#1a4078">70B, 1 sample</text>

  <!-- Small + many samples + PRM curve (wins on hard) -->
  <path d="M 760,440 Q 880,360 1030,275 T 1240,210" fill="none" stroke="#1f7a3a" stroke-width="3.5"/>
  <g fill="#1f7a3a">
    <circle cx="760" cy="440" r="5"/>
    <circle cx="1030" cy="275" r="5"/>
    <circle cx="1240" cy="210" r="5"/>
  </g>
  <text x="1075" y="225" font-size="11" font-weight="700" fill="#1f7a3a">7B, 64 samples + PRM</text>

  <g transform="translate(730, 530)">
    <rect x="0" y="0" width="520" height="150" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="260" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5e1a">✓  Optimal recipe: smaller model, many samples + PRM</text>
    <text x="20" y="55" font-size="12" fill="#1a1a2e"><tspan font-weight="700">Why:</tspan> hard tasks are bottlenecked by reasoning quality.</text>
    <text x="20" y="73" font-size="12" fill="#1a1a2e">More samples + a process reward model find better reasoning paths.</text>
    <text x="20" y="100" font-size="12" font-weight="700" fill="#1f7a3a">Recommendation: 7B, 64 samples + PRM scoring</text>
    <text x="20" y="120" font-size="11" fill="#5a4a3a" font-style="italic">spend compute on test-time search, not parameters.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 720)">
    <rect x="0" y="0" width="1230" height="60" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#722f8a">The compute-optimal frontier</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">There is no universal "best" recipe. For a fixed compute budget, ALLOCATE between model-size vs sample-count based on task difficulty:</text>
    <text x="20" y="55" font-size="11" fill="#5a4a3a" font-style="italic">→ easy tasks: maximize parameters.    → hard tasks: maximize samples + use a verifier.    The crossover happens around middle-difficulty problems.</text>
  </g>
</svg>
