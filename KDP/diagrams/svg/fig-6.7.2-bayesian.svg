<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">In-context learning as Bayesian inference over latent concepts</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Few-shot examples narrow a broad prior into a posterior, which is then used to predict.</text>

  <!-- Stage 1: Prior -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="260" height="180" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="130" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">1. Prior  P(c)</text>
    <text x="130" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">Many candidate concepts c</text>

    <!-- Mini distribution visualization (uniform-ish bars) -->
    <g transform="translate(20, 70)">
      <rect x="0"  y="35" width="22" height="55" fill="#722f8a" opacity="0.6"/>
      <rect x="28" y="40" width="22" height="50" fill="#722f8a" opacity="0.6"/>
      <rect x="56" y="30" width="22" height="60" fill="#722f8a" opacity="0.6"/>
      <rect x="84" y="42" width="22" height="48" fill="#722f8a" opacity="0.6"/>
      <rect x="112" y="36" width="22" height="54" fill="#722f8a" opacity="0.6"/>
      <rect x="140" y="44" width="22" height="46" fill="#722f8a" opacity="0.6"/>
      <rect x="168" y="38" width="22" height="52" fill="#722f8a" opacity="0.6"/>
      <rect x="196" y="42" width="22" height="48" fill="#722f8a" opacity="0.6"/>
      <line x1="0" y1="92" x2="218" y2="92" stroke="#1a1a2e" stroke-width="1"/>
      <text x="109" y="108" font-size="11" text-anchor="middle" fill="#5a4a3a">candidate concepts</text>
    </g>
    <text x="130" y="170" font-size="11" text-anchor="middle" fill="#1a1a2e" font-style="italic">"Could be translation, sentiment,</text>
  </g>
  <text x="190" y="324" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">arithmetic, ..."</text>

  <!-- Arrow 1 -->
  <line x1="320" y1="220" x2="385" y2="220" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="352" y="210" font-size="11" text-anchor="middle" fill="#5a4a3a">update with</text>

  <!-- Stage 2: Few-shot examples -->
  <g transform="translate(390, 130)">
    <rect x="0" y="0" width="260" height="180" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="130" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">2. Few-shot examples  D</text>
    <text x="130" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">k labeled (x_i, y_i) pairs in context</text>

    <g transform="translate(20, 64)">
      <rect x="0" y="0" width="220" height="22" rx="4" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <text x="10" y="16" font-size="11" fill="#1a1a2e">"perro" -&gt; "dog"</text>
      <rect x="0" y="28" width="220" height="22" rx="4" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <text x="10" y="44" font-size="11" fill="#1a1a2e">"gato" -&gt; "cat"</text>
      <rect x="0" y="56" width="220" height="22" rx="4" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <text x="10" y="72" font-size="11" fill="#1a1a2e">"casa" -&gt; "house"</text>
    </g>
    <text x="130" y="170" font-size="11" text-anchor="middle" fill="#1a1a2e" font-style="italic">Acts as evidence about which c</text>
  </g>
  <text x="520" y="324" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">generated this data.</text>

  <!-- Arrow 2 -->
  <line x1="650" y1="220" x2="715" y2="220" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="682" y="210" font-size="11" text-anchor="middle" fill="#5a4a3a">Bayes rule</text>

  <!-- Stage 3: Posterior -->
  <g transform="translate(720, 130)">
    <rect x="0" y="0" width="260" height="180" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="130" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">3. Posterior  P(c | D)</text>
    <text x="130" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">Mass concentrates on c* (Spanish-&gt;English)</text>

    <!-- Spiked distribution -->
    <g transform="translate(20, 70)">
      <rect x="0"  y="80" width="22" height="10" fill="#1a4078" opacity="0.6"/>
      <rect x="28" y="84" width="22" height="6"  fill="#1a4078" opacity="0.6"/>
      <rect x="56" y="78" width="22" height="12" fill="#1a4078" opacity="0.6"/>
      <rect x="84" y="6"  width="22" height="84" fill="#1a4078"/>
      <rect x="112" y="82" width="22" height="8" fill="#1a4078" opacity="0.6"/>
      <rect x="140" y="86" width="22" height="4" fill="#1a4078" opacity="0.6"/>
      <rect x="168" y="84" width="22" height="6" fill="#1a4078" opacity="0.6"/>
      <rect x="196" y="86" width="22" height="4" fill="#1a4078" opacity="0.6"/>
      <line x1="0" y1="92" x2="218" y2="92" stroke="#1a1a2e" stroke-width="1"/>
      <text x="95" y="0" font-size="11" text-anchor="middle" fill="#1a4078" font-weight="700">c*</text>
    </g>
    <text x="130" y="170" font-size="11" text-anchor="middle" fill="#1a1a2e" font-style="italic">Other concepts ruled out by D.</text>
  </g>

  <!-- Arrow 3 (down) -->
  <line x1="850" y1="320" x2="850" y2="375" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="870" y="352" font-size="11" fill="#5a4a3a">predict</text>

  <!-- Stage 4: Prediction -->
  <g transform="translate(720, 380)">
    <rect x="0" y="0" width="260" height="140" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="130" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">4. Predict  P(y | x, c*)</text>
    <text x="130" y="50" font-size="11" text-anchor="middle" fill="#5a4a3a">Given new query x = "libro"</text>
    <g transform="translate(40, 64)">
      <rect x="0" y="0" width="180" height="32" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="90" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">y = "book"</text>
    </g>
    <text x="130" y="124" font-size="11" text-anchor="middle" fill="#1a1a2e" font-style="italic">Sample / argmax under c*.</text>
  </g>

  <!-- Bayes formula box -->
  <g transform="translate(70, 380)">
    <rect x="0" y="0" width="600" height="140" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Bayes rule, written explicitly</text>
    <text x="20" y="62" font-size="16" fill="#1a1a2e" font-style="italic">P(c | D) = P(D | c) P(c) / P(D)</text>
    <text x="20" y="92" font-size="12" fill="#1a1a2e">The pretrained LM provides P(c) (prior over tasks it has seen) and P(D | c)</text>
    <text x="20" y="110" font-size="12" fill="#1a1a2e">(how likely the demonstrations are under each task). The forward pass over the</text>
    <text x="20" y="128" font-size="12" fill="#1a1a2e">prompt approximates this update implicitly, with no weight changes.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(70, 540)">
    <rect x="0" y="0" width="1160" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Few-shot prompting is best understood as Bayesian inference: the prompt is evidence that re-weights a prior over latent tasks; the model then predicts using the most likely task, not by changing any weights.</text>
  </g>

  <!-- Citation strip -->
  <g transform="translate(70, 615)">
    <text x="0" y="14" font-size="11" fill="#5a4a3a" font-style="italic">Theoretical framing: Xie et al., "An Explanation of In-context Learning as Implicit Bayesian Inference" (2022).</text>
  </g>
</svg>
