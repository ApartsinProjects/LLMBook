<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="700" y="46" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">Three tokenization artifacts that surprise users</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each panel: the input you typed (left) versus the token chips the model actually sees (right).</text>

  <!-- ============================================================ -->
  <!-- Panel 1: Number splitting -->
  <!-- ============================================================ -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="1280" height="240" rx="10" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="1280" height="36" rx="10" fill="#1a4078"/>
    <text x="20" y="24" font-size="16" font-weight="700" fill="#ffffff">1. Number splitting --- digits are not atomic</text>
    <text x="1260" y="24" font-size="13" text-anchor="end" fill="#ffffff">Why arithmetic fails</text>

    <!-- BEFORE -->
    <text x="30" y="70" font-size="14" font-weight="700" fill="#5a4a3a">BEFORE (you type)</text>
    <rect x="30" y="84" width="380" height="120" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="220" y="135" font-size="22" font-family="Consolas, Monaco, monospace" text-anchor="middle" fill="#1a1a2e">"What is 128+256?"</text>
    <text x="220" y="172" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">two clean three-digit numbers</text>

    <!-- arrow -->
    <line x1="430" y1="144" x2="500" y2="144" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="465" y="135" font-size="12" text-anchor="middle" fill="#5a4a3a">tokenize</text>

    <!-- AFTER chips -->
    <text x="520" y="70" font-size="14" font-weight="700" fill="#5a4a3a">AFTER (model sees)</text>
    <g transform="translate(520, 95)">
      <!-- normal chips -->
      <rect x="0"   y="20" width="80"  height="44" rx="5" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="40"  y="48" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"What"</text>
      <rect x="88"  y="20" width="60"  height="44" rx="5" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="118" y="48" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">" is"</text>

      <!-- broken number 128 -->
      <rect x="156" y="20" width="60"  height="44" rx="5" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="186" y="48" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">" 12"</text>
      <rect x="220" y="20" width="44"  height="44" rx="5" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="242" y="48" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">"8"</text>
      <text x="210" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">128 = " 12" + "8"</text>

      <rect x="272" y="20" width="36"  height="44" rx="5" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="290" y="48" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"+"</text>

      <!-- broken number 256 -->
      <rect x="316" y="20" width="44"  height="44" rx="5" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="338" y="48" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">"2"</text>
      <rect x="364" y="20" width="44"  height="44" rx="5" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="386" y="48" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">"5"</text>
      <rect x="412" y="20" width="44"  height="44" rx="5" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="434" y="48" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">"6"</text>
      <text x="386" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">256 = "2"+"5"+"6"</text>

      <rect x="460" y="20" width="40"  height="44" rx="5" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="480" y="48" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"?"</text>
    </g>

    <!-- callout -->
    <g transform="translate(1040, 84)">
      <rect x="0" y="0" width="220" height="120" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Diagnose</text>
      <text x="12" y="46" font-size="12" fill="#1a1a2e">"128" tokenizes as 2 tokens,</text>
      <text x="12" y="62" font-size="12" fill="#1a1a2e">"256" as 3. Place value is</text>
      <text x="12" y="78" font-size="12" fill="#1a1a2e">scrambled before the model</text>
      <text x="12" y="94" font-size="12" fill="#1a1a2e">ever computes anything.</text>
      <text x="12" y="112" font-size="12" font-weight="700" fill="#b3401b">Result: 374 instead of 384.</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- Panel 2: Leading-space token -->
  <!-- ============================================================ -->
  <g transform="translate(60, 370)">
    <rect x="0" y="0" width="1280" height="240" rx="10" fill="#ffffff" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="1280" height="36" rx="10" fill="#1f7a3a"/>
    <text x="20" y="24" font-size="16" font-weight="700" fill="#ffffff">2. Leading-space tokens --- " hello" and "hello" are different IDs</text>
    <text x="1260" y="24" font-size="13" text-anchor="end" fill="#ffffff">Why prompt-end matters</text>

    <text x="30" y="70" font-size="14" font-weight="700" fill="#5a4a3a">BEFORE (two prompts)</text>
    <rect x="30" y="84" width="380" height="120" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="220" y="118" font-size="18" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">A: "Say hello"</text>
    <text x="220" y="156" font-size="18" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">B: "Say "  &#8594;  then "hello"</text>
    <text x="220" y="186" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">visually identical to the user</text>

    <line x1="430" y1="144" x2="500" y2="144" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="465" y="135" font-size="12" text-anchor="middle" fill="#5a4a3a">tokenize</text>

    <text x="520" y="70" font-size="14" font-weight="700" fill="#5a4a3a">AFTER (different IDs)</text>
    <g transform="translate(520, 90)">
      <text x="0" y="22" font-size="13" font-weight="700" fill="#1f7a3a">A:</text>
      <rect x="30" y="0" width="68" height="40" rx="5" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="64" y="20" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"Say"</text>
      <text x="64" y="34" font-size="11" text-anchor="middle" fill="#5a4a3a">id 9180</text>
      <rect x="106" y="0" width="100" height="40" rx="5" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="156" y="20" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">" hello"</text>
      <text x="156" y="34" font-size="11" text-anchor="middle" fill="#1f7a3a">id 24343  (with space)</text>

      <text x="0" y="84" font-size="13" font-weight="700" fill="#b3401b">B:</text>
      <rect x="30" y="62" width="68" height="40" rx="5" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="64" y="82" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"Say"</text>
      <rect x="106" y="62" width="44" height="40" rx="5" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="128" y="82" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">" "</text>
      <rect x="158" y="62" width="100" height="40" rx="5" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="208" y="82" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"hello"</text>
      <text x="208" y="96" font-size="11" text-anchor="middle" fill="#b3401b">id 31373 (no space)</text>
    </g>

    <g transform="translate(1040, 84)">
      <rect x="0" y="0" width="220" height="120" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Why?</text>
      <text x="12" y="46" font-size="12" fill="#1a1a2e">BPE merges include the</text>
      <text x="12" y="62" font-size="12" fill="#1a1a2e">leading space. Trailing</text>
      <text x="12" y="78" font-size="12" fill="#1a1a2e">whitespace in your prompt</text>
      <text x="12" y="94" font-size="12" fill="#1a1a2e">forces the rare "no-space"</text>
      <text x="12" y="112" font-size="12" font-weight="700" fill="#b3401b">variant: degraded outputs.</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- Panel 3: Emoji byte fragments -->
  <!-- ============================================================ -->
  <g transform="translate(60, 630)">
    <rect x="0" y="0" width="1280" height="240" rx="10" fill="#ffffff" stroke="#722f8a" stroke-width="2"/>
    <rect x="0" y="0" width="1280" height="36" rx="10" fill="#722f8a"/>
    <text x="20" y="24" font-size="16" font-weight="700" fill="#ffffff">3. Emoji and rare Unicode --- one glyph, many byte tokens</text>
    <text x="1260" y="24" font-size="13" text-anchor="end" fill="#ffffff">Why emojis cost 4-8 tokens</text>

    <text x="30" y="70" font-size="14" font-weight="700" fill="#5a4a3a">BEFORE (one character)</text>
    <rect x="30" y="84" width="380" height="120" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="220" y="146" font-size="48" text-anchor="middle" fill="#1a1a2e">&#128512;</text>
    <text x="220" y="186" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">U+1F600  "grinning face"  (4 UTF-8 bytes)</text>

    <line x1="430" y1="144" x2="500" y2="144" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="465" y="135" font-size="12" text-anchor="middle" fill="#5a4a3a">byte BPE</text>

    <text x="520" y="70" font-size="14" font-weight="700" fill="#5a4a3a">AFTER (4 byte-tokens)</text>
    <g transform="translate(520, 105)">
      <rect x="0"   y="0" width="100" height="50" rx="5" fill="#ffffff" stroke="#722f8a" stroke-width="2"/>
      <text x="50"  y="22" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">&lt;0xF0&gt;</text>
      <text x="50"  y="40" font-size="11" text-anchor="middle" fill="#5a4a3a">byte 1</text>

      <rect x="110" y="0" width="100" height="50" rx="5" fill="#ffffff" stroke="#722f8a" stroke-width="2"/>
      <text x="160" y="22" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">&lt;0x9F&gt;</text>
      <text x="160" y="40" font-size="11" text-anchor="middle" fill="#5a4a3a">byte 2</text>

      <rect x="220" y="0" width="100" height="50" rx="5" fill="#ffffff" stroke="#722f8a" stroke-width="2"/>
      <text x="270" y="22" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">&lt;0x98&gt;</text>
      <text x="270" y="40" font-size="11" text-anchor="middle" fill="#5a4a3a">byte 3</text>

      <rect x="330" y="0" width="100" height="50" rx="5" fill="#ffffff" stroke="#722f8a" stroke-width="2"/>
      <text x="380" y="22" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">&lt;0x80&gt;</text>
      <text x="380" y="40" font-size="11" text-anchor="middle" fill="#5a4a3a">byte 4</text>

      <text x="215" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">4 tokens for one glyph (and the model has never seen a smiley as a unit)</text>
    </g>

    <g transform="translate(1040, 84)">
      <rect x="0" y="0" width="220" height="120" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Use when budgeting</text>
      <text x="12" y="46" font-size="12" fill="#1a1a2e">An emoji-heavy chat can</text>
      <text x="12" y="62" font-size="12" fill="#1a1a2e">eat 5-10x more tokens than</text>
      <text x="12" y="78" font-size="12" fill="#1a1a2e">plain English. Same for</text>
      <text x="12" y="94" font-size="12" fill="#1a1a2e">CJK, math symbols, rare</text>
      <text x="12" y="112" font-size="12" fill="#1a1a2e">scripts; cost goes way up.</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 900)">
    <rect x="0" y="0" width="1280" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="52" font-size="13" fill="#1a1a2e">The model never sees your characters; it sees token IDs assigned by frequency. Numbers, whitespace, and rare Unicode all break in predictable ways --- check the tokenizer when an answer looks "nearly right" but off by a digit or a word.</text>
  </g>
</svg>
