<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Attention Head Specializations</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Different heads in the same layer learn distinct attention patterns; these roles emerge from training, not design.</text>

  <!-- Four head panels in a 2x2 grid would be tighter; do 1x4 row -->
  <!-- Head 1: Syntactic -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="290" height="280" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="145" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Head 1: Syntactic</text>
    <text x="145" y="48" font-size="12" text-anchor="middle" fill="#5a4a3a">verb attends to its subject</text>
    <!-- mini sentence with arc -->
    <g font-size="13" fill="#1a1a2e">
      <text x="40" y="130">The</text>
      <text x="80" y="130" font-weight="700" fill="#1a4078">cat</text>
      <text x="120" y="130">that</text>
      <text x="170" y="130">slept</text>
      <text x="225" y="130" font-weight="700" fill="#1a4078">jumps</text>
    </g>
    <!-- arc from "jumps" back to "cat" -->
    <path d="M 240 120 Q 170 70 90 120" fill="none" stroke="#1a4078" stroke-width="2" marker-end="url(#arr)"/>
    <text x="145" y="200" font-size="11" text-anchor="middle" fill="#5a4a3a">Tracks long-range</text>
    <text x="145" y="216" font-size="11" text-anchor="middle" fill="#5a4a3a">grammatical dependencies.</text>
    <text x="145" y="252" font-size="11" font-style="italic" text-anchor="middle" fill="#1a4078">"agreement head"</text>
  </g>

  <!-- Head 2: Local -->
  <g transform="translate(370, 110)">
    <rect x="0" y="0" width="290" height="280" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="145" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Head 2: Local</text>
    <text x="145" y="48" font-size="12" text-anchor="middle" fill="#5a4a3a">sliding window pattern</text>
    <!-- diagonal band heatmap -->
    <g transform="translate(70, 80)">
      <!-- 6x6 grid -->
      <g font-size="11" fill="#5a4a3a">
        <text x="-12" y="20">q</text>
        <text x="60" y="-4" text-anchor="middle">k</text>
      </g>
      <g>
        <!-- row 0 -->
        <rect x="0" y="0" width="22" height="22" fill="#1f7a3a" opacity="0.9"/><rect x="22" y="0" width="22" height="22" fill="#1f7a3a" opacity="0.4"/><rect x="44" y="0" width="22" height="22" fill="#ecf6ee"/><rect x="66" y="0" width="22" height="22" fill="#ecf6ee"/><rect x="88" y="0" width="22" height="22" fill="#ecf6ee"/><rect x="110" y="0" width="22" height="22" fill="#ecf6ee"/>
        <rect x="0" y="22" width="22" height="22" fill="#1f7a3a" opacity="0.4"/><rect x="22" y="22" width="22" height="22" fill="#1f7a3a" opacity="0.9"/><rect x="44" y="22" width="22" height="22" fill="#1f7a3a" opacity="0.4"/><rect x="66" y="22" width="22" height="22" fill="#ecf6ee"/><rect x="88" y="22" width="22" height="22" fill="#ecf6ee"/><rect x="110" y="22" width="22" height="22" fill="#ecf6ee"/>
        <rect x="0" y="44" width="22" height="22" fill="#ecf6ee"/><rect x="22" y="44" width="22" height="22" fill="#1f7a3a" opacity="0.4"/><rect x="44" y="44" width="22" height="22" fill="#1f7a3a" opacity="0.9"/><rect x="66" y="44" width="22" height="22" fill="#1f7a3a" opacity="0.4"/><rect x="88" y="44" width="22" height="22" fill="#ecf6ee"/><rect x="110" y="44" width="22" height="22" fill="#ecf6ee"/>
        <rect x="0" y="66" width="22" height="22" fill="#ecf6ee"/><rect x="22" y="66" width="22" height="22" fill="#ecf6ee"/><rect x="44" y="66" width="22" height="22" fill="#1f7a3a" opacity="0.4"/><rect x="66" y="66" width="22" height="22" fill="#1f7a3a" opacity="0.9"/><rect x="88" y="66" width="22" height="22" fill="#1f7a3a" opacity="0.4"/><rect x="110" y="66" width="22" height="22" fill="#ecf6ee"/>
        <rect x="0" y="88" width="22" height="22" fill="#ecf6ee"/><rect x="22" y="88" width="22" height="22" fill="#ecf6ee"/><rect x="44" y="88" width="22" height="22" fill="#ecf6ee"/><rect x="66" y="88" width="22" height="22" fill="#1f7a3a" opacity="0.4"/><rect x="88" y="88" width="22" height="22" fill="#1f7a3a" opacity="0.9"/><rect x="110" y="88" width="22" height="22" fill="#1f7a3a" opacity="0.4"/>
        <rect x="0" y="110" width="22" height="22" fill="#ecf6ee"/><rect x="22" y="110" width="22" height="22" fill="#ecf6ee"/><rect x="44" y="110" width="22" height="22" fill="#ecf6ee"/><rect x="66" y="110" width="22" height="22" fill="#ecf6ee"/><rect x="88" y="110" width="22" height="22" fill="#1f7a3a" opacity="0.4"/><rect x="110" y="110" width="22" height="22" fill="#1f7a3a" opacity="0.9"/>
        <rect x="0" y="0" width="132" height="132" fill="none" stroke="#1f7a3a" stroke-width="1"/>
      </g>
    </g>
    <text x="145" y="252" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">"+/- 1 token band"</text>
  </g>

  <!-- Head 3: Induction -->
  <g transform="translate(680, 110)">
    <rect x="0" y="0" width="290" height="280" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="145" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Head 3: Induction</text>
    <text x="145" y="48" font-size="12" text-anchor="middle" fill="#5a4a3a">copies a previous pattern</text>
    <!-- A B ... A -> predict B -->
    <g font-size="14" font-weight="700">
      <text x="40" y="120" fill="#722f8a">A</text>
      <text x="70" y="120" fill="#722f8a">B</text>
      <text x="100" y="120" fill="#5a4a3a">. . .</text>
      <text x="160" y="120" fill="#722f8a">A</text>
      <text x="195" y="120" fill="#1a1a2e">?</text>
    </g>
    <!-- arrow from second A to predict B -->
    <path d="M 165 130 Q 165 165 200 132" fill="none" stroke="#722f8a" stroke-width="2" marker-end="url(#arr)"/>
    <text x="225" y="135" font-size="13" font-weight="700" fill="#722f8a">B</text>
    <text x="145" y="190" font-size="11" text-anchor="middle" fill="#5a4a3a">"I saw A-B before; if I see A</text>
    <text x="145" y="206" font-size="11" text-anchor="middle" fill="#5a4a3a">again, the next token is B."</text>
    <text x="145" y="252" font-size="11" font-style="italic" text-anchor="middle" fill="#722f8a">core of in-context learning</text>
  </g>

  <!-- Head 4: Positional -->
  <g transform="translate(990, 110)">
    <rect x="0" y="0" width="250" height="280" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="125" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">Head 4: Positional</text>
    <text x="125" y="48" font-size="12" text-anchor="middle" fill="#5a4a3a">attends to a fixed offset</text>
    <!-- vertical column of tokens, all attend to first -->
    <g font-size="12">
      <rect x="40" y="80" width="170" height="22" fill="#fef3e0" stroke="#7a5e1a"/>
      <text x="50" y="96" fill="#7a5e1a" font-weight="700">[BOS]</text>
      <text x="180" y="96" fill="#5a4a3a" text-anchor="end">pos 0</text>
      <rect x="40" y="108" width="170" height="22" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="50" y="124" fill="#1a1a2e">tok 1</text>
      <rect x="40" y="136" width="170" height="22" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="50" y="152" fill="#1a1a2e">tok 2</text>
      <rect x="40" y="164" width="170" height="22" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="50" y="180" fill="#1a1a2e">tok 3</text>
    </g>
    <!-- arrows from each lower token to BOS -->
    <g stroke="#7a5e1a" stroke-width="1.5" fill="none">
      <path d="M 35 119 Q 20 112 35 102" marker-end="url(#arr)"/>
      <path d="M 35 147 Q 12 124 35 102" marker-end="url(#arr)"/>
      <path d="M 35 175 Q 8 138 35 102" marker-end="url(#arr)"/>
    </g>
    <text x="125" y="220" font-size="11" text-anchor="middle" fill="#5a4a3a">All queries focus on a</text>
    <text x="125" y="236" font-size="11" text-anchor="middle" fill="#5a4a3a">specific anchor position.</text>
    <text x="125" y="262" font-size="11" font-style="italic" text-anchor="middle" fill="#7a5e1a">"attention sink"</text>
  </g>

  <!-- Note callout -->
  <g transform="translate(80, 430)">
    <rect x="0" y="0" width="1140" height="70" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7a5e1a">Emergent, not engineered</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">No one writes "head 5 = induction" in code. These specializations appear during training as the optimizer discovers reusable</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">circuits. Mechanistic interpretability work (Anthropic, EleutherAI) reverse-engineers them to understand model behavior.</text>
  </g>

  <!-- Where used -->
  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="560" height="70" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="14" y="24" font-size="13" font-weight="700" fill="#1a4078">How to find them</text>
    <text x="14" y="46" font-size="12" fill="#1a1a2e">Visualize attention matrices on diverse prompts; look</text>
    <text x="14" y="62" font-size="12" fill="#1a1a2e">for diagonals (local), arcs (syntactic), or A-B-A spikes.</text>
  </g>
  <g transform="translate(660, 520)">
    <rect x="0" y="0" width="560" height="70" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="13" font-weight="700" fill="#722f8a">Why it matters for you</text>
    <text x="14" y="46" font-size="12" fill="#1a1a2e">Pruning, quantization, and KV-cache schemes can target</text>
    <text x="14" y="62" font-size="12" fill="#1a1a2e">specific head types (e.g., keep induction heads at full bits).</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 610)">
    <rect x="0" y="0" width="1140" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">A multi-head layer is a committee of specialists. Heads spontaneously divide the labor of language: some track syntax,</text>
    <text x="20" y="65" font-size="12" fill="#1a1a2e">some watch local context, some copy patterns, some anchor to position; their outputs concatenate into a richer representation.</text>
  </g>
</svg>
