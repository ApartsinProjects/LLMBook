<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Retrieval-Augmented Generation (RAG) Pipeline</text>
  <text x="700" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">Two phases: offline indexing of documents and online query-time retrieval + generation</text>

  <!-- ============================================================ -->
  <!-- LANE A: INGEST (offline)                                     -->
  <!-- ============================================================ -->
  <rect x="40" y="100" width="1320" height="280" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
  <g transform="translate(60,125)">
    <circle cx="20" cy="20" r="20" fill="#1a4078"/>
    <text x="20" y="27" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">A</text>
    <text x="55" y="20" font-size="18" font-weight="700" fill="#1a4078">Ingestion (offline, one-time per corpus)</text>
    <text x="55" y="42" font-size="12" fill="#5a4a3a" font-style="italic">Build a searchable index from the raw documents</text>
  </g>

  <!-- Documents (cylinder for source data) -->
  <g filter="url(#sh)" transform="translate(80,200)">
    <ellipse cx="50" cy="20" rx="50" ry="12" fill="#e0e7ef" stroke="#1a4078" stroke-width="1.5"/>
    <rect x="0" y="20" width="100" height="80" fill="#e0e7ef" stroke="#1a4078" stroke-width="1.5"/>
    <ellipse cx="50" cy="100" rx="50" ry="12" fill="#cfd8e3" stroke="#1a4078" stroke-width="1.5"/>
    <ellipse cx="50" cy="20" rx="50" ry="12" fill="none" stroke="#1a4078" stroke-width="1.5"/>
    <text x="50" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Documents</text>
    <text x="50" y="82" text-anchor="middle" font-size="11" fill="#5a4a3a">PDF, HTML, MD</text>
  </g>

  <line x1="190" y1="260" x2="240" y2="260" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Chunker -->
  <g filter="url(#sh)" transform="translate(245,225)">
    <rect x="0" y="0" width="120" height="70" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="60" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Chunker</text>
    <text x="60" y="50" text-anchor="middle" font-size="11" fill="#5a4a3a">~512 tokens,</text>
    <text x="60" y="64" text-anchor="middle" font-size="11" fill="#5a4a3a">w/ overlap</text>
  </g>

  <line x1="370" y1="260" x2="420" y2="260" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Embedding model -->
  <g filter="url(#sh)" transform="translate(425,225)">
    <rect x="0" y="0" width="160" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.8"/>
    <text x="80" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Embedding Model</text>
    <text x="80" y="48" text-anchor="middle" font-size="11" fill="#5a4a3a">text → vector</text>
    <text x="80" y="62" text-anchor="middle" font-size="11" fill="#5a4a3a">e.g. OpenAI ada-3</text>
  </g>

  <line x1="590" y1="260" x2="640" y2="260" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Vector DB (cylinder) -->
  <g filter="url(#sh)" transform="translate(645,200)">
    <ellipse cx="80" cy="20" rx="80" ry="13" fill="#fef3e0" stroke="#d4b96a" stroke-width="1.8"/>
    <rect x="0" y="20" width="160" height="80" fill="#fef3e0" stroke="#d4b96a" stroke-width="1.8"/>
    <ellipse cx="80" cy="100" rx="80" ry="13" fill="#f0d9a8" stroke="#d4b96a" stroke-width="1.8"/>
    <ellipse cx="80" cy="20" rx="80" ry="13" fill="none" stroke="#d4b96a" stroke-width="1.8"/>
    <text x="80" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Vector Database</text>
    <text x="80" y="76" text-anchor="middle" font-size="11" fill="#5a4a3a">Pinecone, Qdrant,</text>
    <text x="80" y="89" text-anchor="middle" font-size="11" fill="#5a4a3a">FAISS, Weaviate</text>
  </g>

  <!-- Annotation: built once -->
  <text x="700" y="335" text-anchor="middle" font-size="12" fill="#5a4a3a" font-style="italic">Index is built once and updated incrementally as new docs arrive</text>

  <!-- ============================================================ -->
  <!-- LANE B: QUERY (online)                                       -->
  <!-- ============================================================ -->
  <rect x="40" y="410" width="1320" height="320" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
  <g transform="translate(60,435)">
    <circle cx="20" cy="20" r="20" fill="#d4b96a"/>
    <text x="20" y="27" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">B</text>
    <text x="55" y="20" font-size="18" font-weight="700" fill="#7a5e1a">Query time (online, per request)</text>
    <text x="55" y="42" font-size="12" fill="#5a4a3a" font-style="italic">Retrieve relevant chunks, append to prompt, generate grounded answer</text>
  </g>

  <!-- Step 1: User query -->
  <g filter="url(#sh)" transform="translate(80,520)">
    <rect x="0" y="0" width="140" height="60" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="70" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">User Query</text>
    <text x="70" y="48" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">"What is RAG?"</text>
  </g>
  <line x1="225" y1="550" x2="280" y2="550" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="252" y="540" text-anchor="middle" font-size="11" font-weight="600" fill="#5a4a3a">1</text>

  <!-- Step 2: Embed query -->
  <g filter="url(#sh)" transform="translate(285,520)">
    <rect x="0" y="0" width="140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="70" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Embed Query</text>
    <text x="70" y="42" text-anchor="middle" font-size="11" fill="#5a4a3a">same model</text>
    <text x="70" y="55" text-anchor="middle" font-size="11" fill="#5a4a3a">as ingestion</text>
  </g>
  <line x1="430" y1="550" x2="485" y2="550" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="457" y="540" text-anchor="middle" font-size="11" font-weight="600" fill="#5a4a3a">2</text>

  <!-- Step 3: Retrieve top-k from vector DB -->
  <g filter="url(#sh)" transform="translate(490,510)">
    <rect x="0" y="0" width="160" height="80" rx="6" fill="#fef3e0" stroke="#d4b96a" stroke-width="1.8"/>
    <text x="80" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Top-k Retrieval</text>
    <text x="80" y="44" text-anchor="middle" font-size="11" fill="#5a4a3a">cosine similarity</text>
    <text x="80" y="58" text-anchor="middle" font-size="11" fill="#5a4a3a">ANN search (HNSW)</text>
    <text x="80" y="72" text-anchor="middle" font-size="11" fill="#5a4a3a">return k chunks</text>
  </g>
  <!-- Connection from vector DB down to retrieval -->
  <path d="M 725 320 Q 725 380, 600 380 Q 570 480, 570 510" fill="none" stroke="#d4b96a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="610" y="430" font-size="11" fill="#5a4a3a" font-style="italic">indexed vectors</text>

  <line x1="655" y1="550" x2="710" y2="550" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="682" y="540" text-anchor="middle" font-size="11" font-weight="600" fill="#5a4a3a">3</text>

  <!-- Step 4: Prompt builder (orchestration purple) -->
  <g filter="url(#sh)" transform="translate(715,510)">
    <rect x="0" y="0" width="160" height="80" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.8"/>
    <text x="80" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Prompt Builder</text>
    <text x="80" y="44" text-anchor="middle" font-size="11" fill="#5a4a3a">concat: [system prompt</text>
    <text x="80" y="58" text-anchor="middle" font-size="11" fill="#5a4a3a">+ chunks + question]</text>
  </g>
  <line x1="880" y1="550" x2="935" y2="550" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="907" y="540" text-anchor="middle" font-size="11" font-weight="600" fill="#5a4a3a">4</text>

  <!-- Step 5: LLM (model green) -->
  <g filter="url(#sh)" transform="translate(940,510)">
    <rect x="0" y="0" width="140" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.8"/>
    <text x="70" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">LLM</text>
    <text x="70" y="50" text-anchor="middle" font-size="11" fill="#5a4a3a">GPT-4o, Claude,</text>
    <text x="70" y="64" text-anchor="middle" font-size="11" fill="#5a4a3a">Llama-3, ...</text>
  </g>
  <line x1="1085" y1="550" x2="1140" y2="550" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1112" y="540" text-anchor="middle" font-size="11" font-weight="600" fill="#5a4a3a">5</text>

  <!-- Step 6: Grounded answer -->
  <g filter="url(#sh)" transform="translate(1145,520)">
    <rect x="0" y="0" width="170" height="60" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="85" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Grounded Answer</text>
    <text x="85" y="42" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">"RAG is a technique that..."</text>
    <text x="85" y="54" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">+ citations to sources</text>
  </g>

  <!-- Failure-points callout -->
  <g transform="translate(80,615)">
    <rect x="0" y="0" width="1235" height="95" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="20" y="25" font-size="14" font-weight="700" fill="#b3401b">⚠ Failure points (each step can break the pipeline)</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e"><tspan font-weight="700">step 2:</tspan> embedding may not capture user intent  •  <tspan font-weight="700">step 3:</tspan> retrieval may return irrelevant chunks  •  <tspan font-weight="700">step 4:</tspan> prompt may exceed context window</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e"><tspan font-weight="700">step 5:</tspan> LLM may ignore the retrieved context (unfaithful generation) or cite a chunk while misrepresenting it (citation hallucination)</text>
    <text x="20" y="84" font-size="12" font-style="italic" fill="#5a4a3a">RAG reduces hallucination but does not eliminate it. Production systems need a faithfulness verification layer.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(1170,108)">
    <rect x="0" y="0" width="180" height="70" rx="4" fill="#ffffff" stroke="#5a4a3a" stroke-width="1"/>
    <text x="90" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#5a4a3a">Legend</text>
    <rect x="10" y="22" width="14" height="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
    <text x="30" y="31" font-size="11" fill="#1a1a2e">model / inference</text>
    <rect x="10" y="36" width="14" height="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="1"/>
    <text x="30" y="45" font-size="11" fill="#1a1a2e">orchestration</text>
    <rect x="10" y="50" width="14" height="10" fill="#fef3e0" stroke="#d4b96a" stroke-width="1"/>
    <text x="30" y="59" font-size="11" fill="#1a1a2e">data store</text>
  </g>

  <!-- Caption -->
  <text x="700" y="775" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">Figure 20.1.3 — Two-phase RAG pipeline. Phase A indexes documents once; Phase B runs per query.</text>
</svg>
