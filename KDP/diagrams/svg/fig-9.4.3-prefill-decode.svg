<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">LLM Request Latency: Prefill + Decode</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">end-to-end = TTFT + N × TPOT — two distinct phases with very different compute profiles</text>

  <!-- Time axis bar showing the two phases -->
  <g>
    <text x="120" y="170" font-size="13" font-weight="600" text-anchor="end" fill="#1a4078">Prefill (TTFT)</text>
    <rect x="140" y="155" width="180" height="40" fill="#1a4078"/>
    <text x="230" y="180" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">single big batched compute</text>

    <rect x="320" y="155" width="20" height="40" fill="#1f7a3a"/>
    <rect x="345" y="155" width="20" height="40" fill="#1f7a3a"/>
    <rect x="370" y="155" width="20" height="40" fill="#1f7a3a"/>
    <rect x="395" y="155" width="20" height="40" fill="#1f7a3a"/>
    <rect x="420" y="155" width="20" height="40" fill="#1f7a3a"/>
    <rect x="445" y="155" width="20" height="40" fill="#1f7a3a"/>
    <rect x="470" y="155" width="20" height="40" fill="#1f7a3a"/>
    <rect x="495" y="155" width="20" height="40" fill="#1f7a3a"/>
    <rect x="520" y="155" width="20" height="40" fill="#1f7a3a"/>
    <rect x="545" y="155" width="20" height="40" fill="#1f7a3a"/>
    <rect x="570" y="155" width="20" height="40" fill="#1f7a3a"/>
    <rect x="595" y="155" width="20" height="40" fill="#1f7a3a"/>
    <text x="475" y="220" font-size="13" font-weight="600" text-anchor="middle" fill="#1f7a3a">Decode: N tokens × TPOT each</text>

    <text x="700" y="180" font-size="11" text-anchor="start" fill="#5a4a3a">… token N</text>

    <line x1="140" y1="240" x2="320" y2="240" stroke="#1a4078" stroke-width="2"/>
    <text x="230" y="260" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">e.g. 200 ms</text>

    <line x1="320" y1="240" x2="700" y2="240" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="260" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">e.g. 200 × 30 ms = 6 s</text>

    <text x="780" y="180" font-size="13" font-weight="700" fill="#1a1a2e">end-to-end ≈ 6.2 s</text>
  </g>

  <!-- Two side-by-side detail panels -->
  <g>
    <rect x="60" y="310" width="580" height="280" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="350" y="342" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">Prefill phase</text>
    <text x="350" y="364" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">processes the entire prompt at once</text>
    <line x1="80" y1="378" x2="620" y2="378" stroke="#1a4078" stroke-width="0.6"/>

    <text x="80" y="408" font-size="13" fill="#1a1a2e">• Compute: <tspan font-weight="700">compute-bound</tspan> (lots of matmul)</text>
    <text x="80" y="432" font-size="13" fill="#1a1a2e">• Throughput-friendly: scales with batch size</text>
    <text x="80" y="456" font-size="13" fill="#1a1a2e">• Metric: <tspan font-family="monospace">TTFT</tspan> (time to first token)</text>
    <text x="80" y="480" font-size="13" fill="#1a1a2e">• Typical: 100-500 ms for a few-K-token prompt</text>
    <text x="80" y="514" font-size="12" font-style="italic" fill="#5a4a3a">Long prompts inflate TTFT linearly with input length.</text>
    <text x="80" y="540" font-size="12" font-weight="700" fill="#1a4078">Optimization: prompt caching, chunked prefill</text>
  </g>

  <g>
    <rect x="660" y="310" width="580" height="280" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="950" y="342" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Decode phase</text>
    <text x="950" y="364" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">generates one token at a time, autoregressively</text>
    <line x1="680" y1="378" x2="1220" y2="378" stroke="#1f7a3a" stroke-width="0.6"/>

    <text x="680" y="408" font-size="13" fill="#1a1a2e">• Compute: <tspan font-weight="700">memory-bound</tspan> (waits on KV-cache reads)</text>
    <text x="680" y="432" font-size="13" fill="#1a1a2e">• GPU largely idle, dominated by HBM bandwidth</text>
    <text x="680" y="456" font-size="13" fill="#1a1a2e">• Metric: <tspan font-family="monospace">TPOT</tspan> (time per output token)</text>
    <text x="680" y="480" font-size="13" fill="#1a1a2e">• Typical: 20-50 ms per token for 70B model</text>
    <text x="680" y="514" font-size="12" font-style="italic" fill="#5a4a3a">Long outputs dominate latency — each token is its own pass.</text>
    <text x="680" y="540" font-size="12" font-weight="700" fill="#1f7a3a">Optimization: speculative decoding, MQA / GQA, quantize</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Why this distinction matters</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Optimizations for prefill (e.g. larger batches) often hurt decode latency, and vice versa. Disaggregated serving runs them on separate GPUs to optimize each independently.</text>
  </g>
</svg>
