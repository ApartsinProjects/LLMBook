<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arr-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Agent Execution Loop (LangChain / LangGraph style)</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">User input → LLM decides → tool runs → observation flows back → repeat until done</text>

  <!-- User input -->
  <g>
    <rect x="60" y="280" width="180" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="150" y="316" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">User input</text>
    <text x="150" y="342" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">"book me a flight</text>
    <text x="150" y="358" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">to Tokyo Friday"</text>
  </g>

  <line x1="240" y1="330" x2="380" y2="330" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- LLM (decides) -->
  <g>
    <rect x="380" y="220" width="280" height="220" rx="14" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="520" y="258" font-size="17" font-weight="700" text-anchor="middle" fill="#1f7a3a">LLM</text>
    <text x="520" y="282" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">decides next action</text>
    <line x1="400" y1="298" x2="640" y2="298" stroke="#1f7a3a" stroke-width="0.6"/>
    <text x="520" y="330" font-size="12" text-anchor="middle" fill="#1a1a2e">option A → call a tool</text>
    <text x="520" y="358" font-size="12" text-anchor="middle" fill="#1a1a2e">option B → ask user</text>
    <text x="520" y="386" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">option C → final answer</text>
    <text x="520" y="416" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">also: read prior observations</text>
  </g>

  <!-- Tool branch (top right) -->
  <line x1="660" y1="280" x2="800" y2="200" stroke="#1a1a2e" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="700" y="225" width="100" height="22" rx="11" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
  <text x="750" y="240" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">tool call</text>

  <g>
    <rect x="800" y="150" width="280" height="120" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2.5"/>
    <text x="940" y="180" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">Tool</text>
    <text x="940" y="204" font-size="12" text-anchor="middle" fill="#1a1a2e">search_flights("NRT", "Fri")</text>
    <text x="940" y="226" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">runs in YOUR runtime</text>
    <text x="940" y="248" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(API call, DB query, code exec…)</text>
  </g>

  <!-- Observation back -->
  <path d="M 800 230 C 700 230 700 280 660 290" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-pur)"/>
  <rect x="700" y="155" width="100" height="22" rx="11" fill="#f4ecf7" stroke="#722f8a" stroke-width="1"/>
  <text x="750" y="170" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">observation</text>

  <!-- Final answer branch (bottom right) -->
  <line x1="660" y1="380" x2="800" y2="460" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="700" y="430" width="80" height="22" rx="11" fill="#f4ecf7" stroke="#722f8a" stroke-width="1"/>
  <text x="740" y="445" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">done</text>

  <g>
    <rect x="800" y="430" width="280" height="120" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="940" y="460" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Final answer</text>
    <text x="940" y="484" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">"Booked JL043, departs 11:25am"</text>
    <text x="940" y="510" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">streamed to user</text>
    <text x="940" y="532" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">finish_reason = "stop"</text>
  </g>

  <!-- Loop label -->
  <text x="520" y="180" font-size="12" font-style="italic" font-weight="600" text-anchor="middle" fill="#722f8a">↻ tool/observation loop until LLM emits final answer</text>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1180" height="80" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7a5e1a">Three knobs that turn LLMs into agents</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">1. <tspan font-weight="700">Tools</tspan> exposed via JSON schema. 2. <tspan font-weight="700">Loop</tspan> in your code that re-invokes the LLM with each tool result.  3. <tspan font-weight="700">Stop condition</tspan> (max steps, finish_reason, budget).</text>
    <text x="20" y="72" font-size="12" font-style="italic" fill="#5a4a3a">Frameworks (LangChain, LlamaIndex, Anthropic SDK) provide opinionated versions of this loop, but the primitive is yours.</text>
  </g>
</svg>
