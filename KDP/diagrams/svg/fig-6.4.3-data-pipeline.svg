<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">Pretraining Data Pipeline</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">From 100 TB of raw web crawl down to 3 TB of curated tokens, each stage filters aggressively.</text>

  <!-- Stage tube: 6 boxes left to right -->
  <!-- Layout: x positions 60, 260, 460, 660, 860, 1060; width 180; y center 280 -->

  <!-- Stage 1: Web Crawl (warning/raw) -->
  <g>
    <rect x="60" y="220" width="180" height="120" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="150" y="252" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">1. Web Crawl</text>
    <text x="150" y="278" font-size="12" text-anchor="middle" fill="#5a4a3a">Common Crawl,</text>
    <text x="150" y="294" font-size="12" text-anchor="middle" fill="#5a4a3a">archives, books</text>
    <text x="150" y="324" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">~100 TB raw</text>
  </g>

  <!-- Stage 2: Text Extract -->
  <g>
    <rect x="260" y="220" width="180" height="120" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="350" y="252" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">2. Text Extract</text>
    <text x="350" y="278" font-size="12" text-anchor="middle" fill="#5a4a3a">Strip HTML, boilerplate,</text>
    <text x="350" y="294" font-size="12" text-anchor="middle" fill="#5a4a3a">nav, ads, JS</text>
    <text x="350" y="324" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">~20 TB</text>
  </g>

  <!-- Stage 3: Dedup -->
  <g>
    <rect x="460" y="220" width="180" height="120" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="550" y="252" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">3. Deduplicate</text>
    <text x="550" y="278" font-size="12" text-anchor="middle" fill="#5a4a3a">MinHash LSH,</text>
    <text x="550" y="294" font-size="12" text-anchor="middle" fill="#5a4a3a">near-duplicate removal</text>
    <text x="550" y="324" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">~12 TB</text>
  </g>

  <!-- Stage 4: Quality Filter -->
  <g>
    <rect x="660" y="220" width="180" height="120" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="750" y="252" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">4. Quality Filter</text>
    <text x="750" y="278" font-size="12" text-anchor="middle" fill="#5a4a3a">Classifier-based;</text>
    <text x="750" y="294" font-size="12" text-anchor="middle" fill="#5a4a3a">drops low-info pages</text>
    <text x="750" y="324" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">~5 TB</text>
  </g>

  <!-- Stage 5: Safety Filter -->
  <g>
    <rect x="860" y="220" width="180" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="950" y="252" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">5. Safety Filter</text>
    <text x="950" y="278" font-size="12" text-anchor="middle" fill="#5a4a3a">PII, CSAM, toxic,</text>
    <text x="950" y="294" font-size="12" text-anchor="middle" fill="#5a4a3a">copyright flags</text>
    <text x="950" y="324" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">~4 TB</text>
  </g>

  <!-- Stage 6: Domain Mix -->
  <g>
    <rect x="1060" y="220" width="180" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="1150" y="252" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">6. Domain Mix</text>
    <text x="1150" y="278" font-size="12" text-anchor="middle" fill="#5a4a3a">Reweight code, math,</text>
    <text x="1150" y="294" font-size="12" text-anchor="middle" fill="#5a4a3a">books, multilingual</text>
    <text x="1150" y="324" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">~3 TB final</text>
  </g>

  <!-- Arrows between stages -->
  <line x1="245" y1="280" x2="255" y2="280" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="445" y1="280" x2="455" y2="280" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="645" y1="280" x2="655" y2="280" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="845" y1="280" x2="855" y2="280" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1045" y1="280" x2="1055" y2="280" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Reduction annotation underneath, showing 100->3 TB cascade -->
  <g transform="translate(60, 380)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1a1a2e">Volume reduction at each stage</text>
    <text x="0" y="22" font-size="12" fill="#5a4a3a">100 TB &#8594; 20 TB (extract, -80%) &#8594; 12 TB (dedup, -40%) &#8594; 5 TB (quality, -58%) &#8594; 4 TB (safety, -20%) &#8594; 3 TB (mix)</text>
    <text x="0" y="42" font-size="12" fill="#5a4a3a">Net throughput: ~97% of raw bytes are discarded before a single token reaches the model.</text>
  </g>

  <!-- Why-it-matters callout -->
  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="540" height="130" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why dedup matters</text>
    <text x="16" y="50" font-size="12" fill="#1a1a2e">Repeated documents bias the loss toward memorization and</text>
    <text x="16" y="68" font-size="12" fill="#1a1a2e">waste compute on samples the model has already seen.</text>
    <text x="16" y="92" font-size="12" fill="#1a1a2e">MinHash LSH finds near-duplicates in O(n) instead of O(n^2)</text>
    <text x="16" y="110" font-size="12" fill="#1a1a2e">pairwise comparison, making web-scale dedup tractable.</text>
  </g>

  <g transform="translate(680, 460)">
    <rect x="0" y="0" width="540" height="130" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why domain mix is the last lever</text>
    <text x="16" y="50" font-size="12" fill="#1a1a2e">Raw web is ~90% prose, ~2% code, &lt;1% math. Upsampling</text>
    <text x="16" y="68" font-size="12" fill="#1a1a2e">code and math (e.g., 15% / 5%) sharply lifts reasoning</text>
    <text x="16" y="92" font-size="12" fill="#1a1a2e">benchmarks without changing model size or training steps.</text>
    <text x="16" y="110" font-size="12" fill="#1a1a2e">Mix ratios are tuned with small proxy runs before scale-up.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Pretraining data is a funnel, not a dataset. Most of the work, and most of the differentiation between labs, happens in the filtering stages, not in the crawl itself.</text>
  </g>
</svg>
