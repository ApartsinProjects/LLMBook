<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Speculative Decoding</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Small "draft" model proposes many tokens; large "target" model verifies them all in one pass</text>

  <!-- Step 1: Draft -->
  <g>
    <rect x="60" y="140" width="320" height="200" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="220" y="172" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">1 · Draft</text>
    <text x="220" y="196" font-size="13" font-weight="600" text-anchor="middle" fill="#1a4078">small model (~1 B params)</text>
    <text x="220" y="220" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">runs 6 fast forward passes</text>

    <!-- Generated tokens -->
    <g font-family="monospace" font-size="13">
      <rect x="80" y="240" width="42" height="32" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
      <text x="101" y="261" text-anchor="middle" fill="#1a4078">The</text>
      <rect x="124" y="240" width="42" height="32" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
      <text x="145" y="261" text-anchor="middle" fill="#1a4078">cat</text>
      <rect x="168" y="240" width="42" height="32" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
      <text x="189" y="261" text-anchor="middle" fill="#1a4078">sat</text>
      <rect x="212" y="240" width="42" height="32" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
      <text x="233" y="261" text-anchor="middle" fill="#1a4078">on</text>
      <rect x="256" y="240" width="42" height="32" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
      <text x="277" y="261" text-anchor="middle" fill="#1a4078">the</text>
      <rect x="300" y="240" width="60" height="32" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
      <text x="330" y="261" text-anchor="middle" fill="#1a4078">floor</text>
    </g>
    <text x="220" y="305" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">cost: 6× small-model latency</text>
  </g>

  <line x1="380" y1="240" x2="450" y2="240" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: Verify -->
  <g>
    <rect x="450" y="140" width="380" height="200" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="640" y="172" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">2 · Verify</text>
    <text x="640" y="196" font-size="13" font-weight="600" text-anchor="middle" fill="#1f7a3a">target model (70 B params)</text>
    <text x="640" y="220" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">scores all 6 tokens in ONE forward pass</text>

    <!-- Tokens with accept/reject status -->
    <g font-family="monospace" font-size="13">
      <rect x="470" y="240" width="42" height="32" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="491" y="261" text-anchor="middle" fill="#1f7a3a">The</text>
      <text x="491" y="285" font-size="14" text-anchor="middle" fill="#1f7a3a">✓</text>

      <rect x="514" y="240" width="42" height="32" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="535" y="261" text-anchor="middle" fill="#1f7a3a">cat</text>
      <text x="535" y="285" font-size="14" text-anchor="middle" fill="#1f7a3a">✓</text>

      <rect x="558" y="240" width="42" height="32" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="579" y="261" text-anchor="middle" fill="#1f7a3a">sat</text>
      <text x="579" y="285" font-size="14" text-anchor="middle" fill="#1f7a3a">✓</text>

      <rect x="602" y="240" width="42" height="32" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="623" y="261" text-anchor="middle" fill="#1f7a3a">on</text>
      <text x="623" y="285" font-size="14" text-anchor="middle" fill="#1f7a3a">✓</text>

      <rect x="646" y="240" width="42" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="667" y="261" text-anchor="middle" fill="#b3401b">the</text>
      <text x="667" y="285" font-size="14" text-anchor="middle" fill="#b3401b">✗</text>

      <rect x="690" y="240" width="60" height="32" rx="4" fill="#fafbfc" stroke="#cfd8e3" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="720" y="261" text-anchor="middle" fill="#5a4a3a">floor</text>
      <text x="720" y="285" font-size="11" text-anchor="middle" fill="#5a4a3a">discarded</text>
    </g>
    <text x="640" y="320" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">accept 4, reject at position 5</text>
  </g>

  <line x1="830" y1="240" x2="900" y2="240" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Resample -->
  <g>
    <rect x="900" y="140" width="320" height="200" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="1060" y="172" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">3 · Resample</text>
    <text x="1060" y="196" font-size="13" font-weight="600" text-anchor="middle" fill="#7a5e1a">at the rejection point</text>
    <text x="1060" y="220" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">use target's true distribution</text>

    <g font-family="monospace" font-size="13">
      <rect x="920" y="240" width="42" height="32" rx="4" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <text x="941" y="261" text-anchor="middle" fill="#7a5e1a">The</text>
      <rect x="964" y="240" width="42" height="32" rx="4" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <text x="985" y="261" text-anchor="middle" fill="#7a5e1a">cat</text>
      <rect x="1008" y="240" width="42" height="32" rx="4" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <text x="1029" y="261" text-anchor="middle" fill="#7a5e1a">sat</text>
      <rect x="1052" y="240" width="42" height="32" rx="4" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <text x="1073" y="261" text-anchor="middle" fill="#7a5e1a">on</text>
      <rect x="1096" y="240" width="60" height="32" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="1126" y="261" text-anchor="middle" fill="#1f7a3a">a</text>
      <text x="1126" y="290" font-size="11" text-anchor="middle" fill="#1f7a3a">(target picks)</text>
    </g>
    <text x="1060" y="320" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">5 tokens accepted/sampled this round</text>
  </g>

  <!-- Loop arrow -->
  <path d="M 1060 340 C 1060 420 600 470 220 380" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)"/>
  <text x="640" y="455" font-size="12" font-style="italic" font-weight="600" text-anchor="middle" fill="#722f8a">repeat: draft 6 more from current sequence</text>

  <!-- Result panel -->
  <g transform="translate(60, 510)">
    <rect x="0" y="0" width="1180" height="100" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#7a5e1a">Why this is faster than serial decoding</text>
    <text x="20" y="56" font-size="12" fill="#1a1a2e">One target-model forward pass produces 5 accepted tokens (vs. 5 separate target passes), and the small-model passes are nearly free.</text>
    <text x="20" y="76" font-size="12" fill="#1a1a2e">Net: ~2-3× wall-clock speedup at no quality loss — the math (rejection sampling) guarantees the output distribution exactly matches the target model alone.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 630)">
    <rect x="0" y="0" width="1180" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">Speculation works because most LLM tokens are easy — a small model agrees with the big one ~70% of the time. Spend big-model compute only where it's actually needed.</text>
  </g>
</svg>
