<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="700" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Three Generations of RAG</text>
  <text x="700" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">From a 3-stage pipeline to a modular composition of pluggable components</text>

  <!-- Naive RAG (left) -->
  <g>
    <rect x="40" y="110" width="380" height="540" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="230" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">Naive RAG</text>
    <text x="230" y="164" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">2020 baseline</text>

    <rect x="100" y="200" width="240" height="70" rx="8" fill="#ffffff" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="220" y="226" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">1 · Index</text>
    <text x="220" y="252" font-size="11" text-anchor="middle" fill="#5a4a3a">chunk + embed docs</text>

    <line x1="220" y1="270" x2="220" y2="310" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="100" y="320" width="240" height="70" rx="8" fill="#ffffff" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="220" y="346" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">2 · Retrieve</text>
    <text x="220" y="372" font-size="11" text-anchor="middle" fill="#5a4a3a">top-k by cosine sim</text>

    <line x1="220" y1="390" x2="220" y2="430" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="100" y="440" width="240" height="70" rx="8" fill="#ffffff" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="220" y="466" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">3 · Generate</text>
    <text x="220" y="492" font-size="11" text-anchor="middle" fill="#5a4a3a">LLM with retrieved context</text>

    <text x="230" y="560" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">simple, often weak —</text>
    <text x="230" y="578" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">retrieval misses, no filtering</text>
  </g>

  <!-- arrow -->
  <line x1="425" y1="380" x2="475" y2="380" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="450" y="365" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">add pre/post</text>

  <!-- Advanced RAG (middle) -->
  <g>
    <rect x="475" y="110" width="380" height="540" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="665" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">Advanced RAG</text>
    <text x="665" y="164" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">2023 production standard</text>

    <rect x="535" y="190" width="260" height="55" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="665" y="212" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">0 · Pre-retrieval</text>
    <text x="665" y="232" font-size="11" text-anchor="middle" fill="#5a4a3a">query rewrite, HyDE</text>

    <line x1="665" y1="245" x2="665" y2="270" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>

    <rect x="535" y="275" width="260" height="55" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="665" y="297" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">1 · Index</text>
    <text x="665" y="317" font-size="11" text-anchor="middle" fill="#5a4a3a">chunk + embed + metadata</text>

    <line x1="665" y1="330" x2="665" y2="355" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>

    <rect x="535" y="360" width="260" height="55" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="665" y="382" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">2 · Retrieve</text>
    <text x="665" y="402" font-size="11" text-anchor="middle" fill="#5a4a3a">hybrid dense + sparse (BM25)</text>

    <line x1="665" y1="415" x2="665" y2="440" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>

    <rect x="535" y="445" width="260" height="55" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="665" y="467" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">3 · Post-retrieval</text>
    <text x="665" y="487" font-size="11" text-anchor="middle" fill="#5a4a3a">re-rank, compress, filter</text>

    <line x1="665" y1="500" x2="665" y2="525" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>

    <rect x="535" y="530" width="260" height="55" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="665" y="552" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">4 · Generate</text>
    <text x="665" y="572" font-size="11" text-anchor="middle" fill="#5a4a3a">LLM with refined context</text>

    <text x="665" y="615" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">3-5× quality lift over naive</text>
  </g>

  <line x1="860" y1="380" x2="910" y2="380" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="885" y="365" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">modularize</text>

  <!-- Modular RAG (right) -->
  <g>
    <rect x="910" y="110" width="450" height="540" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="1135" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Modular RAG</text>
    <text x="1135" y="164" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">2024+ composable graph</text>

    <!-- Modules around a router -->
    <rect x="940" y="200" width="180" height="60" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="1030" y="225" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Search module</text>
    <text x="1030" y="245" font-size="11" text-anchor="middle" fill="#5a4a3a">pluggable retriever</text>

    <rect x="1150" y="200" width="180" height="60" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="1240" y="225" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Memory module</text>
    <text x="1240" y="245" font-size="11" text-anchor="middle" fill="#5a4a3a">conversation state</text>

    <rect x="1010" y="290" width="240" height="70" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="1130" y="316" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Routing module</text>
    <text x="1130" y="340" font-size="11" text-anchor="middle" fill="#5a4a3a">adaptive pipeline · LLM-decided</text>

    <line x1="1030" y1="260" x2="1080" y2="290" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="1240" y1="260" x2="1180" y2="290" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>

    <rect x="1010" y="385" width="240" height="60" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="1130" y="410" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Predict module</text>
    <text x="1130" y="430" font-size="11" text-anchor="middle" fill="#5a4a3a">LLM generation</text>

    <line x1="1130" y1="360" x2="1130" y2="385" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>

    <rect x="1010" y="465" width="240" height="60" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="1130" y="490" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">Verify module</text>
    <text x="1130" y="510" font-size="11" text-anchor="middle" fill="#5a4a3a">self-correction · grounding check</text>

    <line x1="1130" y1="445" x2="1130" y2="465" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Retry loop -->
    <path d="M 1010 500 C 950 500 950 320 1005 320" fill="none" stroke="#722f8a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
    <text x="945" y="410" font-size="11" font-style="italic" font-weight="600" fill="#722f8a">retry</text>

    <text x="1135" y="565" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">graph of pluggable modules,</text>
    <text x="1135" y="582" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">routing decided per query</text>
    <text x="1135" y="612" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">→ blends with agent patterns</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 680)">
    <rect x="0" y="0" width="1320" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Where to start</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Build naive first to baseline. Move to advanced when retrieval quality limits answers (most production systems land here). Reach for modular when you need adaptive routing or self-correction (legal, medical, agentic flows).</text>
  </g>
</svg>
