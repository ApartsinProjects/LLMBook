<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">GraphRAG: Indexing Pipeline and Query Modes</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Four indexing stages produce a knowledge graph; queries pick local (entity neighbourhood) or global (map-reduce) retrieval.</text>

  <!-- Indexing pipeline strip -->
  <g>
    <rect x="40" y="95" width="1220" height="190" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="60" y="118" font-size="14" font-weight="700" fill="#1a4078">Indexing Pipeline (one-time, offline)</text>

    <!-- Documents -->
    <rect x="60" y="145" width="140" height="120" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <text x="130" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Documents</text>
    <text x="130" y="192" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">unstructured</text>
    <text x="130" y="208" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">corpus</text>
    <!-- doc icons -->
    <g transform="translate(95, 220)">
      <rect x="0" y="0" width="20" height="26" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <rect x="25" y="0" width="20" height="26" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <rect x="50" y="0" width="20" height="26" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
    </g>

    <!-- Stage 1 -->
    <rect x="230" y="145" width="200" height="120" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <circle cx="252" cy="167" r="13" fill="#1f7a3a"/>
    <text x="252" y="171" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="345" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Entity &amp; Relation</text>
    <text x="345" y="189" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Extraction</text>
    <text x="330" y="215" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">LLM per chunk</text>
    <text x="330" y="240" font-size="11" text-anchor="middle" fill="#1f7a3a">(entity, rel, entity)</text>
    <text x="330" y="255" font-size="11" text-anchor="middle" fill="#1f7a3a">triples</text>

    <!-- Stage 2 -->
    <rect x="460" y="145" width="200" height="120" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <circle cx="482" cy="167" r="13" fill="#1f7a3a"/>
    <text x="482" y="171" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="572" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Graph Construction</text>
    <text x="560" y="189" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">&amp; Merging</text>
    <text x="560" y="215" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">coreference resolution</text>
    <text x="560" y="240" font-size="11" text-anchor="middle" fill="#1f7a3a">"Dr. Smith" = "Smith"</text>
    <text x="560" y="255" font-size="11" text-anchor="middle" fill="#1f7a3a">= "she"</text>

    <!-- Stage 3 -->
    <rect x="690" y="145" width="200" height="120" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <circle cx="712" cy="167" r="13" fill="#1f7a3a"/>
    <text x="712" y="171" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="800" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Community</text>
    <text x="800" y="189" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Detection</text>
    <text x="790" y="215" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">Leiden algorithm</text>
    <!-- mini cluster vis -->
    <g transform="translate(745, 225)">
      <circle cx="10" cy="15" r="3" fill="#1f7a3a"/>
      <circle cx="20" cy="22" r="3" fill="#1f7a3a"/>
      <circle cx="14" cy="28" r="3" fill="#1f7a3a"/>
      <circle cx="55" cy="15" r="3" fill="#722f8a"/>
      <circle cx="65" cy="22" r="3" fill="#722f8a"/>
      <circle cx="60" cy="30" r="3" fill="#722f8a"/>
      <circle cx="95" cy="20" r="3" fill="#b3401b"/>
      <circle cx="105" cy="28" r="3" fill="#b3401b"/>
    </g>

    <!-- Stage 4 -->
    <rect x="920" y="145" width="200" height="120" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <circle cx="942" cy="167" r="13" fill="#1f7a3a"/>
    <text x="942" y="171" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
    <text x="1030" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Community</text>
    <text x="1030" y="189" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Summarisation</text>
    <text x="1020" y="215" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">LLM per community</text>
    <text x="1020" y="240" font-size="11" text-anchor="middle" fill="#1f7a3a">"Cluster A: Bayesian</text>
    <text x="1020" y="255" font-size="11" text-anchor="middle" fill="#1f7a3a">methods, 2018-2022"</text>

    <!-- arrows between stages -->
    <line x1="200" y1="205" x2="228" y2="205" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="430" y1="205" x2="458" y2="205" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="660" y1="205" x2="688" y2="205" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="890" y1="205" x2="918" y2="205" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- pointer to KG -->
    <line x1="1170" y1="205" x2="1218" y2="205" stroke="#1a1a2e" stroke-width="1.5"/>
  </g>

  <!-- KG store -->
  <g>
    <rect x="500" y="320" width="300" height="100" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2.5"/>
    <text x="650" y="350" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a2e">Knowledge Graph (store)</text>
    <text x="650" y="372" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">entities + communities + summaries</text>
    <text x="650" y="395" font-size="11" text-anchor="middle" fill="#7a5e1a">persisted: graph DB + summary index + chunk pointers</text>

    <!-- arrow from indexing strip down to KG -->
    <line x1="1020" y1="265" x2="800" y2="320" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Query modes -->
  <g>
    <rect x="40" y="455" width="1220" height="190" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="60" y="478" font-size="14" font-weight="700" fill="#722f8a">Query Modes (per user question)</text>

    <!-- Local search box -->
    <rect x="80" y="505" width="540" height="125" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="350" y="530" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Local Search</text>
    <text x="350" y="552" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">specific, entity-centric questions</text>
    <g transform="translate(105, 565)">
      <text x="0" y="14" font-size="12" fill="#1a1a2e">1. Match query → entities in graph</text>
      <text x="0" y="32" font-size="12" fill="#1a1a2e">2. Expand to k-hop graph neighbourhood</text>
      <text x="0" y="50" font-size="12" fill="#1a1a2e">3. Pull chunks linked to those entities</text>
    </g>
    <!-- mini graph icon -->
    <g transform="translate(515, 575)">
      <line x1="10" y1="10" x2="40" y2="20" stroke="#1f7a3a" stroke-width="1.2"/>
      <line x1="40" y1="20" x2="70" y2="10" stroke="#1f7a3a" stroke-width="1.2"/>
      <line x1="40" y1="20" x2="50" y2="50" stroke="#1f7a3a" stroke-width="1.2"/>
      <circle cx="10" cy="10" r="5" fill="#1f7a3a"/>
      <circle cx="40" cy="20" r="6" fill="#b3401b"/>
      <circle cx="70" cy="10" r="5" fill="#1f7a3a"/>
      <circle cx="50" cy="50" r="5" fill="#1f7a3a"/>
    </g>

    <!-- Global search box -->
    <rect x="680" y="505" width="540" height="125" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="950" y="530" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Global Search</text>
    <text x="950" y="552" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">broad, thematic questions over the whole corpus</text>
    <g transform="translate(705, 565)">
      <text x="0" y="14" font-size="12" fill="#1a1a2e">1. <tspan font-weight="700">Map:</tspan> score every community summary against query</text>
      <text x="0" y="32" font-size="12" fill="#1a1a2e">2. <tspan font-weight="700">Reduce:</tspan> synthesise top summaries into answer</text>
      <text x="0" y="50" font-size="12" fill="#1a1a2e">3. Cite contributing communities</text>
    </g>

    <!-- arrows from KG into query modes -->
    <line x1="600" y1="420" x2="350" y2="505" stroke="#722f8a" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="700" y1="420" x2="950" y2="505" stroke="#722f8a" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 670)">
    <rect x="0" y="0" width="1220" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Indexing pays a one-time LLM cost (extract, merge, cluster, summarise); each query then chooses local graph traversal or global map-reduce based on its scope.</text>
  </g>
</svg>
