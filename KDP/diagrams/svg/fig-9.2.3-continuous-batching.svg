<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Static vs. Continuous Batching</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Continuous batching reclaims GPU cycles by filling completed slots immediately instead of waiting for the slowest request</text>

  <!-- LEFT: Static -->
  <g>
    <rect x="60" y="100" width="580" height="490" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="350" y="132" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Static batching</text>
    <text x="350" y="156" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">batch held until ALL requests finish</text>

    <!-- Time axis -->
    <line x1="100" y1="500" x2="610" y2="500" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="355" y="525" font-size="12" text-anchor="middle" fill="#5a4a3a">time →</text>

    <!-- Request rows -->
    <g font-size="12" fill="#1a1a2e">
      <text x="80" y="210" text-anchor="end">A</text>
      <rect x="100" y="195" width="240" height="22" fill="#1a4078"/>
      <rect x="340" y="195" width="240" height="22" fill="#cfd8e3"/>
      <text x="460" y="210" text-anchor="middle" font-size="11" fill="#5a4a3a">idle (done early)</text>

      <text x="80" y="260" text-anchor="end">B</text>
      <rect x="100" y="245" width="380" height="22" fill="#1a4078"/>
      <rect x="480" y="245" width="100" height="22" fill="#cfd8e3"/>

      <text x="80" y="310" text-anchor="end">C</text>
      <rect x="100" y="295" width="180" height="22" fill="#1a4078"/>
      <rect x="280" y="295" width="300" height="22" fill="#cfd8e3"/>

      <text x="80" y="360" text-anchor="end">D</text>
      <rect x="100" y="345" width="480" height="22" fill="#1a4078"/>
    </g>

    <!-- Batch boundaries -->
    <line x1="100" y1="180" x2="100" y2="380" stroke="#b3401b" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="580" y1="180" x2="580" y2="380" stroke="#b3401b" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="100" y="175" font-size="11" font-weight="600" text-anchor="middle" fill="#b3401b">batch start</text>
    <text x="580" y="175" font-size="11" font-weight="600" text-anchor="middle" fill="#b3401b">all done</text>

    <text x="350" y="455" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">⚠ ~50% GPU utilization</text>
    <text x="350" y="478" font-size="11" text-anchor="middle" fill="#5a4a3a">(grey = wasted GPU cycles padding short requests)</text>
  </g>

  <!-- RIGHT: Continuous -->
  <g>
    <rect x="660" y="100" width="580" height="490" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="950" y="132" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Continuous batching</text>
    <text x="950" y="156" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">finished slots refilled immediately</text>

    <line x1="700" y1="500" x2="1210" y2="500" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="955" y="525" font-size="12" text-anchor="middle" fill="#5a4a3a">time →</text>

    <g font-size="12" fill="#1a1a2e">
      <text x="680" y="210" text-anchor="end">A</text>
      <rect x="700" y="195" width="240" height="22" fill="#1f7a3a"/>
      <rect x="940" y="195" width="120" height="22" fill="#722f8a"/>
      <text x="1000" y="210" text-anchor="middle" font-size="11" fill="#ffffff">E</text>
      <rect x="1060" y="195" width="150" height="22" fill="#7a5e1a"/>
      <text x="1135" y="210" text-anchor="middle" font-size="11" fill="#ffffff">F</text>

      <text x="680" y="260" text-anchor="end">B</text>
      <rect x="700" y="245" width="380" height="22" fill="#1f7a3a"/>
      <rect x="1080" y="245" width="130" height="22" fill="#1a4078"/>
      <text x="1145" y="260" text-anchor="middle" font-size="11" fill="#ffffff">G</text>

      <text x="680" y="310" text-anchor="end">C</text>
      <rect x="700" y="295" width="180" height="22" fill="#1f7a3a"/>
      <rect x="880" y="295" width="200" height="22" fill="#722f8a"/>
      <text x="980" y="310" text-anchor="middle" font-size="11" fill="#ffffff">H</text>
      <rect x="1080" y="295" width="130" height="22" fill="#7a5e1a"/>
      <text x="1145" y="310" text-anchor="middle" font-size="11" fill="#ffffff">I</text>

      <text x="680" y="360" text-anchor="end">D</text>
      <rect x="700" y="345" width="480" height="22" fill="#1f7a3a"/>
      <rect x="1180" y="345" width="30" height="22" fill="#722f8a"/>
    </g>

    <line x1="700" y1="180" x2="700" y2="380" stroke="#1f7a3a" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="1210" y1="180" x2="1210" y2="380" stroke="#1f7a3a" stroke-width="2" stroke-dasharray="4 3"/>

    <text x="950" y="455" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">★ ~95% GPU utilization</text>
    <text x="950" y="478" font-size="11" text-anchor="middle" fill="#5a4a3a">2-3× higher throughput at same latency budget</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">vLLM, TGI, and TensorRT-LLM all use continuous batching as the default. It's the single biggest serving-throughput win for LLMs since FlashAttention.</text>
  </g>
</svg>
