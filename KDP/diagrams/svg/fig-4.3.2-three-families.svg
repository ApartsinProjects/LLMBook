<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Three Transformer Families</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Same building blocks, three attention masks, three job descriptions.</text>

  <!-- Encoder-Only column -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="360" height="460" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="360" height="46" rx="10" fill="#1a4078"/>
    <text x="180" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Encoder-Only</text>

    <!-- mini attention pictogram: full bidirectional -->
    <g transform="translate(110, 70)">
      <text x="70" y="14" font-size="12" font-weight="600" text-anchor="middle" fill="#1a4078">Attention pattern</text>
      <g stroke="#1a4078" stroke-width="1.2" fill="#cfe0f2">
        <rect x="10"  y="22" width="24" height="24"/>
        <rect x="40"  y="22" width="24" height="24"/>
        <rect x="70"  y="22" width="24" height="24"/>
        <rect x="100" y="22" width="24" height="24"/>
        <rect x="10"  y="52" width="24" height="24"/>
        <rect x="40"  y="52" width="24" height="24"/>
        <rect x="70"  y="52" width="24" height="24"/>
        <rect x="100" y="52" width="24" height="24"/>
        <rect x="10"  y="82" width="24" height="24"/>
        <rect x="40"  y="82" width="24" height="24"/>
        <rect x="70"  y="82" width="24" height="24"/>
        <rect x="100" y="82" width="24" height="24"/>
        <rect x="10"  y="112" width="24" height="24"/>
        <rect x="40"  y="112" width="24" height="24"/>
        <rect x="70"  y="112" width="24" height="24"/>
        <rect x="100" y="112" width="24" height="24"/>
      </g>
      <text x="70" y="156" font-size="11" text-anchor="middle" fill="#5a4a3a">every token sees every token</text>
    </g>

    <line x1="20" y1="280" x2="340" y2="280" stroke="#1a4078" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <text x="20" y="305" font-size="13" font-weight="700" fill="#1a4078">Mechanism</text>
    <text x="20" y="324" font-size="12" fill="#1a1a2e">Bidirectional self-attention</text>

    <text x="20" y="356" font-size="13" font-weight="700" fill="#1a4078">Models</text>
    <text x="20" y="375" font-size="12" fill="#1a1a2e">BERT, RoBERTa, DeBERTa</text>

    <text x="20" y="407" font-size="13" font-weight="700" fill="#1a4078">Best for</text>
    <text x="20" y="426" font-size="12" fill="#1a1a2e">Classification, NER, retrieval,</text>
    <text x="20" y="442" font-size="12" fill="#1a1a2e">embeddings, span tasks</text>
  </g>

  <!-- Decoder-Only column -->
  <g transform="translate(470, 110)">
    <rect x="0" y="0" width="360" height="460" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="360" height="46" rx="10" fill="#1f7a3a"/>
    <text x="180" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Decoder-Only</text>

    <!-- causal triangle attention -->
    <g transform="translate(110, 70)">
      <text x="70" y="14" font-size="12" font-weight="600" text-anchor="middle" fill="#1f7a3a">Attention pattern</text>
      <g stroke="#1f7a3a" stroke-width="1.2">
        <rect x="10"  y="22" width="24" height="24" fill="#cfe7d3"/>
        <rect x="40"  y="22" width="24" height="24" fill="#f0f0f0"/>
        <rect x="70"  y="22" width="24" height="24" fill="#f0f0f0"/>
        <rect x="100" y="22" width="24" height="24" fill="#f0f0f0"/>
        <rect x="10"  y="52" width="24" height="24" fill="#cfe7d3"/>
        <rect x="40"  y="52" width="24" height="24" fill="#cfe7d3"/>
        <rect x="70"  y="52" width="24" height="24" fill="#f0f0f0"/>
        <rect x="100" y="52" width="24" height="24" fill="#f0f0f0"/>
        <rect x="10"  y="82" width="24" height="24" fill="#cfe7d3"/>
        <rect x="40"  y="82" width="24" height="24" fill="#cfe7d3"/>
        <rect x="70"  y="82" width="24" height="24" fill="#cfe7d3"/>
        <rect x="100" y="82" width="24" height="24" fill="#f0f0f0"/>
        <rect x="10"  y="112" width="24" height="24" fill="#cfe7d3"/>
        <rect x="40"  y="112" width="24" height="24" fill="#cfe7d3"/>
        <rect x="70"  y="112" width="24" height="24" fill="#cfe7d3"/>
        <rect x="100" y="112" width="24" height="24" fill="#cfe7d3"/>
      </g>
      <text x="70" y="156" font-size="11" text-anchor="middle" fill="#5a4a3a">causal mask: only past visible</text>
    </g>

    <line x1="20" y1="280" x2="340" y2="280" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <text x="20" y="305" font-size="13" font-weight="700" fill="#1f7a3a">Mechanism</text>
    <text x="20" y="324" font-size="12" fill="#1a1a2e">Causal (left-to-right) attention</text>

    <text x="20" y="356" font-size="13" font-weight="700" fill="#1f7a3a">Models</text>
    <text x="20" y="375" font-size="12" fill="#1a1a2e">GPT, Llama, Mistral, Claude</text>

    <text x="20" y="407" font-size="13" font-weight="700" fill="#1f7a3a">Best for</text>
    <text x="20" y="426" font-size="12" fill="#1a1a2e">Text generation, chat, code,</text>
    <text x="20" y="442" font-size="12" fill="#1a1a2e">reasoning, instruction following</text>
  </g>

  <!-- Encoder-Decoder column -->
  <g transform="translate(860, 110)">
    <rect x="0" y="0" width="360" height="460" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <rect x="0" y="0" width="360" height="46" rx="10" fill="#722f8a"/>
    <text x="180" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Encoder-Decoder</text>

    <!-- two stacks bridged by cross-attention -->
    <g transform="translate(40, 68)">
      <rect x="0"   y="20" width="120" height="60" rx="6" fill="#e2cce8" stroke="#722f8a" stroke-width="1.4"/>
      <text x="60" y="44" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Encoder</text>
      <text x="60" y="62" font-size="11" text-anchor="middle" fill="#5a4a3a">bidirectional</text>

      <rect x="160" y="20" width="120" height="60" rx="6" fill="#e2cce8" stroke="#722f8a" stroke-width="1.4"/>
      <text x="220" y="44" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Decoder</text>
      <text x="220" y="62" font-size="11" text-anchor="middle" fill="#5a4a3a">causal</text>

      <path d="M 120 50 L 160 50" stroke="#722f8a" stroke-width="2" marker-end="url(#arr)"/>
      <text x="140" y="100" font-size="11" font-weight="600" text-anchor="middle" fill="#722f8a">cross-attention</text>
      <text x="140" y="116" font-size="11" text-anchor="middle" fill="#5a4a3a">bridge</text>

      <text x="140" y="156" font-size="11" text-anchor="middle" fill="#5a4a3a">read everything, then write</text>
    </g>

    <line x1="20" y1="280" x2="340" y2="280" stroke="#722f8a" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <text x="20" y="305" font-size="13" font-weight="700" fill="#722f8a">Mechanism</text>
    <text x="20" y="324" font-size="12" fill="#1a1a2e">Encode source, decode target</text>

    <text x="20" y="356" font-size="13" font-weight="700" fill="#722f8a">Models</text>
    <text x="20" y="375" font-size="12" fill="#1a1a2e">T5, BART, mBART, FLAN-T5</text>

    <text x="20" y="407" font-size="13" font-weight="700" fill="#722f8a">Best for</text>
    <text x="20" y="426" font-size="12" fill="#1a1a2e">Translation, summarization,</text>
    <text x="20" y="442" font-size="12" fill="#1a1a2e">structured seq2seq tasks</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1140" height="64" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">The attention mask alone splits the family tree: bidirectional for understanding, causal for generation, both for sequence-to-sequence.</text>
  </g>
</svg>
