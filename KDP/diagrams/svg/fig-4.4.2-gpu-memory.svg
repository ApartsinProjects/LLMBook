<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">GPU Memory Hierarchy (NVIDIA H100)</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Bandwidth drops and capacity grows as you move away from the compute units; LLM kernels live or die by where data sits.</text>

  <!-- Pyramid / staircase: 4 tiers, narrow top -> wide bottom -->
  <!-- Tier widths -->
  <!-- REG -->
  <g transform="translate(450, 110)">
    <rect x="0" y="0" width="400" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#1f7a3a">Registers</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Per-thread, on-chip. Used for live values inside a kernel.</text>
    <text x="20" y="70" font-size="12" font-weight="700" fill="#1a1a2e">~20 TB/s  &#118833;  256 KB / SM  &#118833;  ~1 cycle latency</text>
  </g>

  <!-- SM / Shared L1 -->
  <g transform="translate(380, 210)">
    <rect x="0" y="0" width="540" height="80" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#1a4078">Shared Memory / L1</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Per-SM scratchpad. FlashAttention tiles q, k, v here to skip HBM round trips.</text>
    <text x="20" y="70" font-size="12" font-weight="700" fill="#1a1a2e">~19 TB/s  &#118833;  228 KB / SM  &#118833;  ~30 cycles latency</text>
  </g>

  <!-- L2 -->
  <g transform="translate(280, 310)">
    <rect x="0" y="0" width="740" height="80" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#7a5e1a">L2 Cache</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Chip-wide cache, shared across all SMs. Catches reused weight blocks.</text>
    <text x="20" y="70" font-size="12" font-weight="700" fill="#1a1a2e">~5 TB/s  &#118833;  50 MB (H100)  &#118833;  ~200 cycles latency</text>
  </g>

  <!-- HBM -->
  <g transform="translate(120, 410)">
    <rect x="0" y="0" width="1060" height="80" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#b3401b">HBM (Global Memory)</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Off-chip stacked DRAM. Where weights, activations, and the KV cache live by default.</text>
    <text x="20" y="70" font-size="12" font-weight="700" fill="#1a1a2e">3.35 TB/s  &#118833;  80 GB  &#118833;  ~400 cycles latency</text>
  </g>

  <!-- Down arrow on left: capacity grows -->
  <g transform="translate(60, 110)">
    <line x1="20" y1="10" x2="20" y2="380" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="0" y="200" font-size="12" font-weight="700" fill="#5a4a3a" transform="rotate(-90 0 200)">capacity grows</text>
  </g>
  <!-- Up arrow on right: bandwidth grows -->
  <g transform="translate(1220, 110)">
    <line x1="20" y1="380" x2="20" y2="10" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="40" y="240" font-size="12" font-weight="700" fill="#5a4a3a" transform="rotate(-90 40 240)">bandwidth grows</text>
  </g>

  <!-- Insight callouts -->
  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="370" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="13" font-weight="700" fill="#7a5e1a">Why HBM is the bottleneck</text>
    <text x="14" y="46" font-size="12" fill="#1a1a2e">Decode of one token reads the full KV cache</text>
    <text x="14" y="64" font-size="12" fill="#1a1a2e">from HBM. 5x the bandwidth = 5x the tokens/sec.</text>
  </g>

  <g transform="translate(465, 520)">
    <rect x="0" y="0" width="370" height="80" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="14" y="24" font-size="13" font-weight="700" fill="#1a4078">FlashAttention's trick</text>
    <text x="14" y="46" font-size="12" fill="#1a1a2e">Tile q, k, v into shared memory and stream the</text>
    <text x="14" y="64" font-size="12" fill="#1a1a2e">softmax. Bandwidth jumps from 3.35 to ~19 TB/s.</text>
  </g>

  <g transform="translate(850, 520)">
    <rect x="0" y="0" width="370" height="80" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="13" font-weight="700" fill="#722f8a">Diagnose your kernel</text>
    <text x="14" y="46" font-size="12" fill="#1a1a2e">Use Nsight to spot HBM-bound ops; fuse them or</text>
    <text x="14" y="64" font-size="12" fill="#1a1a2e">move tiles into SRAM to recover idle compute.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 615)">
    <rect x="0" y="0" width="1140" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Each tier up the pyramid is roughly 5x faster but 100-1000x smaller. Modern LLM kernels (FlashAttention, paged KV) are</text>
    <text x="20" y="65" font-size="12" fill="#1a1a2e">essentially careful schedules that keep the hot working set in SRAM and shared memory, only touching HBM in big bursts.</text>
  </g>
</svg>
