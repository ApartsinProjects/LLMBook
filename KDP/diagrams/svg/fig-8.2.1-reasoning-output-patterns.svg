<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Three patterns for reasoning model output</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Vendors expose intermediate "thinking" tokens differently: hidden, fully visible, or budgeted.</text>

  <!-- Three lanes -->
  <!-- Lane 1: OpenAI -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="380" height="460" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="44" rx="10" fill="#1a4078"/>
    <text x="190" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">OpenAI o-series</text>
    <text x="190" y="68" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">Hidden chain of thought</text>

    <!-- Prompt -->
    <rect x="30" y="90" width="320" height="44" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="190" y="117" font-size="13" text-anchor="middle" fill="#1a1a2e">User prompt</text>

    <!-- Hidden reasoning box -->
    <rect x="30" y="160" width="320" height="120" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="190" y="184" font-size="13" font-weight="700" text-anchor="middle" fill="#5a4a3a">Hidden reasoning (server-side)</text>
    <text x="190" y="208" font-size="11" text-anchor="middle" fill="#5a4a3a">Tokens generated, billed,</text>
    <text x="190" y="224" font-size="11" text-anchor="middle" fill="#5a4a3a">but not returned in full.</text>
    <text x="190" y="252" font-size="11" text-anchor="middle" fill="#1a1a2e">reasoning_effort: low / medium / high</text>
    <text x="190" y="268" font-size="11" text-anchor="middle" fill="#1a1a2e">controls how many think-tokens are spent.</text>

    <!-- Optional summary -->
    <rect x="30" y="298" width="320" height="48" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="190" y="318" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">reasoning_summary (optional)</text>
    <text x="190" y="335" font-size="11" text-anchor="middle" fill="#1a1a2e">A short, sanitized recap of the hidden trace.</text>

    <!-- Final answer -->
    <rect x="30" y="370" width="320" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="190" y="392" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Final answer (visible)</text>
    <text x="190" y="412" font-size="11" text-anchor="middle" fill="#1a1a2e">Only the user-facing message text.</text>

    <line x1="190" y1="134" x2="190" y2="156" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="190" y1="280" x2="190" y2="296" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="190" y1="346" x2="190" y2="368" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Lane 2: DeepSeek / QwQ -->
  <g transform="translate(460, 110)">
    <rect x="0" y="0" width="380" height="460" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="44" rx="10" fill="#1f7a3a"/>
    <text x="190" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">DeepSeek R1 / Qwen QwQ</text>
    <text x="190" y="68" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">Visible chain of thought</text>

    <rect x="30" y="90" width="320" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="190" y="117" font-size="13" text-anchor="middle" fill="#1a1a2e">User prompt</text>

    <!-- Visible thinking -->
    <rect x="30" y="160" width="320" height="170" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="190" y="184" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">&lt;think&gt; ... &lt;/think&gt;</text>
    <text x="190" y="208" font-size="11" text-anchor="middle" fill="#1a1a2e">Full reasoning trace returned</text>
    <text x="190" y="224" font-size="11" text-anchor="middle" fill="#1a1a2e">in the streamed output.</text>
    <text x="50" y="254" font-size="11" fill="#5a4a3a">"Let me check the constraints..."</text>
    <text x="50" y="272" font-size="11" fill="#5a4a3a">"Case 1: if x &gt; 0 then..."</text>
    <text x="50" y="290" font-size="11" fill="#5a4a3a">"Wait, I made an error above,"</text>
    <text x="50" y="308" font-size="11" fill="#5a4a3a">"reconsidering..."</text>

    <rect x="30" y="370" width="320" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="190" y="392" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Final answer (visible)</text>
    <text x="190" y="412" font-size="11" text-anchor="middle" fill="#1a1a2e">Strip the &lt;think&gt; block client-side if needed.</text>

    <line x1="190" y1="134" x2="190" y2="156" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="190" y1="330" x2="190" y2="368" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Lane 3: Gemini -->
  <g transform="translate(860, 110)">
    <rect x="0" y="0" width="380" height="460" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="44" rx="10" fill="#722f8a"/>
    <text x="190" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Gemini 2.5</text>
    <text x="190" y="68" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">Budgeted thinking tokens</text>

    <rect x="30" y="90" width="320" height="44" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="190" y="117" font-size="13" text-anchor="middle" fill="#1a1a2e">User prompt + thinking_budget</text>

    <rect x="30" y="160" width="320" height="170" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="190" y="184" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Thinking tokens (exposed)</text>
    <text x="190" y="208" font-size="11" text-anchor="middle" fill="#1a1a2e">Returned alongside answer,</text>
    <text x="190" y="224" font-size="11" text-anchor="middle" fill="#1a1a2e">capped by thinking_budget param.</text>

    <!-- Budget meter -->
    <rect x="60" y="248" width="260" height="14" rx="3" fill="#f0f0f0" stroke="#722f8a" stroke-width="1"/>
    <rect x="60" y="248" width="160" height="14" rx="3" fill="#722f8a" opacity="0.7"/>
    <text x="190" y="282" font-size="11" text-anchor="middle" fill="#5a4a3a">budget = 4096 tokens (used: ~2500)</text>
    <text x="190" y="306" font-size="11" text-anchor="middle" fill="#1a1a2e">Set 0 to disable, larger for hard tasks.</text>

    <rect x="30" y="370" width="320" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="190" y="392" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Final answer (visible)</text>
    <text x="190" y="412" font-size="11" text-anchor="middle" fill="#1a1a2e">Output text + separate thoughts field.</text>

    <line x1="190" y1="134" x2="190" y2="156" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="190" y1="330" x2="190" y2="368" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="1180" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">All three families burn extra tokens to "think" before answering, but the contract differs: OpenAI hides the trace and bills it,</text>
    <text x="20" y="62" font-size="12" fill="#1a1a2e">DeepSeek streams it inside &lt;think&gt; tags, and Gemini exposes it under an explicit token budget you control.</text>
  </g>
</svg>
