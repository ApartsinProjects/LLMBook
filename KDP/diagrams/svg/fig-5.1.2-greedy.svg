<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Greedy decoding can miss the higher-probability sequence</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Picking the locally best token at each step (0.6) closes off a globally better continuation (0.216 &gt; 0.12).</text>

  <!-- Start token -->
  <g>
    <rect x="80" y="290" width="120" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="140" y="318" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a2e">Prompt</text>
    <text x="140" y="338" font-size="13" text-anchor="middle" fill="#1a1a2e">"The"</text>
  </g>

  <!-- Greedy lane (top) -->
  <g>
    <rect x="260" y="120" width="820" height="180" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="280" y="148" font-size="15" font-weight="700" fill="#b3401b">Greedy path  (chooses max P at each step)</text>
    <text x="280" y="168" font-size="12" fill="#5a4a3a">Joint probability:  0.6 x 0.4 x 0.5  =  0.12</text>

    <!-- Greedy boxes -->
    <g>
      <rect x="300" y="195" width="180" height="80" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="390" y="222" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">cat</text>
      <text x="390" y="245" font-size="12" text-anchor="middle" fill="#5a4a3a">P = 0.6  (highest)</text>
      <text x="390" y="262" font-size="11" text-anchor="middle" fill="#b3401b">picked greedily</text>
    </g>
    <g>
      <rect x="540" y="195" width="180" height="80" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="630" y="222" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">sat</text>
      <text x="630" y="245" font-size="12" text-anchor="middle" fill="#5a4a3a">P = 0.4</text>
    </g>
    <g>
      <rect x="780" y="195" width="180" height="80" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="870" y="222" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">on</text>
      <text x="870" y="245" font-size="12" text-anchor="middle" fill="#5a4a3a">P = 0.5</text>
    </g>

    <line x1="480" y1="235" x2="540" y2="235" stroke="#b3401b" stroke-width="1.5" marker-end="url(#arrRed)"/>
    <line x1="720" y1="235" x2="780" y2="235" stroke="#b3401b" stroke-width="1.5" marker-end="url(#arrRed)"/>
  </g>

  <!-- Better lane (bottom) -->
  <g>
    <rect x="260" y="380" width="820" height="180" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="280" y="408" font-size="15" font-weight="700" fill="#1f7a3a">Better path  (lower first-step prob, higher overall)</text>
    <text x="280" y="428" font-size="12" fill="#5a4a3a">Joint probability:  0.3 x 0.9 x 0.8  =  0.216  (1.8x greedy)</text>

    <g>
      <rect x="300" y="455" width="180" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="390" y="482" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">old</text>
      <text x="390" y="505" font-size="12" text-anchor="middle" fill="#5a4a3a">P = 0.3  (skipped)</text>
      <text x="390" y="522" font-size="11" text-anchor="middle" fill="#1f7a3a">unlocks better future</text>
    </g>
    <g>
      <rect x="540" y="455" width="180" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="630" y="482" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">cat</text>
      <text x="630" y="505" font-size="12" text-anchor="middle" fill="#5a4a3a">P = 0.9</text>
    </g>
    <g>
      <rect x="780" y="455" width="180" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="870" y="482" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">purred</text>
      <text x="870" y="505" font-size="12" text-anchor="middle" fill="#5a4a3a">P = 0.8</text>
    </g>

    <line x1="480" y1="495" x2="540" y2="495" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arrGreen)"/>
    <line x1="720" y1="495" x2="780" y2="495" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  </g>

  <!-- Branches from prompt -->
  <path d="M 200 320 C 240 320, 260 235, 300 235" fill="none" stroke="#b3401b" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <path d="M 200 320 C 240 320, 260 495, 300 495" fill="none" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arrGreen)"/>

  <!-- Why-callout -->
  <g transform="translate(1100, 195)">
    <rect x="0" y="0" width="170" height="365" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="12" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Why?</text>
    <text x="12" y="46" font-size="11" fill="#1a1a2e">Greedy is myopic: it</text>
    <text x="12" y="60" font-size="11" fill="#1a1a2e">commits to the locally</text>
    <text x="12" y="74" font-size="11" fill="#1a1a2e">best token without</text>
    <text x="12" y="88" font-size="11" fill="#1a1a2e">looking ahead.</text>
    <text x="12" y="116" font-size="11" fill="#1a1a2e">Beam search keeps the</text>
    <text x="12" y="130" font-size="11" fill="#1a1a2e">top-k partial paths so</text>
    <text x="12" y="144" font-size="11" fill="#1a1a2e">a lower-prob first step</text>
    <text x="12" y="158" font-size="11" fill="#1a1a2e">can survive long enough</text>
    <text x="12" y="172" font-size="11" fill="#1a1a2e">to win on joint score.</text>
    <text x="12" y="200" font-size="11" font-weight="700" fill="#7a5e1a">Trade-off</text>
    <text x="12" y="218" font-size="11" fill="#1a1a2e">Wider beams = better</text>
    <text x="12" y="232" font-size="11" fill="#1a1a2e">scores but more compute</text>
    <text x="12" y="246" font-size="11" fill="#1a1a2e">and blander, repetitive</text>
    <text x="12" y="260" font-size="11" fill="#1a1a2e">text on open-ended</text>
    <text x="12" y="274" font-size="11" fill="#1a1a2e">generation.</text>
    <text x="12" y="302" font-size="11" font-weight="700" fill="#7a5e1a">Use when</text>
    <text x="12" y="320" font-size="11" fill="#1a1a2e">Translation, summari-</text>
    <text x="12" y="334" font-size="11" fill="#1a1a2e">zation, captioning:</text>
    <text x="12" y="348" font-size="11" fill="#1a1a2e">tasks with one good</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Always picking the highest-probability next token is locally optimal but globally suboptimal; beam search trades a wider frontier for a higher-scoring sequence.</text>
  </g>
</svg>
