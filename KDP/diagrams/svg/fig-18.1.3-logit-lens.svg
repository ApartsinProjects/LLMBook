<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The logit lens: peeking at predictions layer by layer</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Project each layer's hidden state through the unembedding W_U to see what token the model would emit at that depth.</text>

  <!-- Input prompt box -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="280" height="80" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="140" y="28" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">INPUT PROMPT</text>
    <text x="140" y="56" font-size="14" text-anchor="middle" fill="#1a1a2e" font-style="italic">"The Eiffel Tower is in ___"</text>
  </g>

  <!-- Unembedding box (shared) -->
  <g transform="translate(940, 110)">
    <rect x="0" y="0" width="280" height="80" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="140" y="28" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">UNEMBEDDING W_U</text>
    <text x="140" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">Shared projection: hidden state</text>
    <text x="140" y="66" font-size="12" text-anchor="middle" fill="#1a1a2e">to vocabulary logits</text>
  </g>

  <!-- Arrow input to first layer -->
  <line x1="220" y1="190" x2="220" y2="230" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Stack of layers -->
  <g transform="translate(80, 240)">
    <!-- Layer 0 -->
    <rect x="0" y="0" width="600" height="70" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#b3401b">Layer 0</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">Hidden state h_0 still close to embeddings; output mostly noise.</text>
    <text x="430" y="34" font-size="12" font-weight="700" fill="#1a1a2e">Top token:</text>
    <text x="430" y="54" font-size="14" font-weight="700" fill="#b3401b">"the"</text>
    <text x="510" y="54" font-size="11" fill="#5a4a3a">(noisy)</text>

    <!-- Layer 4 -->
    <rect x="0" y="86" width="600" height="70" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="20" y="114" font-size="14" font-weight="700" fill="#7a5e1a">Layer 4</text>
    <text x="20" y="136" font-size="12" fill="#1a1a2e">Geographic concept emerging; right country, wrong granularity.</text>
    <text x="430" y="120" font-size="12" font-weight="700" fill="#1a1a2e">Top token:</text>
    <text x="430" y="140" font-size="14" font-weight="700" fill="#7a5e1a">"France"</text>
    <text x="510" y="140" font-size="11" fill="#5a4a3a">(weak)</text>

    <!-- Layer 8 -->
    <rect x="0" y="172" width="600" height="70" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="200" font-size="14" font-weight="700" fill="#1a4078">Layer 8</text>
    <text x="20" y="222" font-size="12" fill="#1a1a2e">Specific landmark binding; the city has been retrieved.</text>
    <text x="430" y="206" font-size="12" font-weight="700" fill="#1a1a2e">Top token:</text>
    <text x="430" y="226" font-size="14" font-weight="700" fill="#1a4078">"Paris"</text>
    <text x="510" y="226" font-size="11" fill="#5a4a3a">(strong)</text>

    <!-- Layer 11 -->
    <rect x="0" y="258" width="600" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="286" font-size="14" font-weight="700" fill="#1f7a3a">Layer 11 (final)</text>
    <text x="20" y="308" font-size="12" fill="#1a1a2e">Refined and confident; matches the model's actual output.</text>
    <text x="430" y="292" font-size="12" font-weight="700" fill="#1a1a2e">Top token:</text>
    <text x="430" y="312" font-size="14" font-weight="700" fill="#1f7a3a">"Paris"</text>
    <text x="510" y="312" font-size="11" fill="#5a4a3a">(final)</text>
  </g>

  <!-- Right side: lens projection arrows -->
  <g>
    <text x="780" y="260" font-size="12" font-weight="700" fill="#722f8a">apply W_U</text>
    <line x1="690" y1="275" x2="930" y2="170" stroke="#722f8a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrPurple)"/>
    <line x1="690" y1="361" x2="930" y2="170" stroke="#722f8a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrPurple)"/>
    <line x1="690" y1="447" x2="930" y2="170" stroke="#722f8a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrPurple)"/>
    <line x1="690" y1="533" x2="930" y2="170" stroke="#722f8a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrPurple)"/>
  </g>

  <!-- Diagnose callout -->
  <g transform="translate(940, 220)">
    <rect x="0" y="0" width="280" height="200" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="13" font-weight="700" fill="#7a5e1a">Diagnose</text>
    <text x="14" y="48" font-size="12" fill="#1a1a2e">Watch where the right answer</text>
    <text x="14" y="64" font-size="12" fill="#1a1a2e">first becomes the top token.</text>
    <text x="14" y="92" font-size="12" fill="#1a1a2e">Early appearance suggests the</text>
    <text x="14" y="108" font-size="12" fill="#1a1a2e">fact is stored shallowly; late</text>
    <text x="14" y="124" font-size="12" fill="#1a1a2e">appearance suggests heavy</text>
    <text x="14" y="140" font-size="12" fill="#1a1a2e">refinement in upper layers.</text>
    <text x="14" y="170" font-size="12" font-style="italic" fill="#5a4a3a">Caveat: hidden states are not</text>
    <text x="14" y="186" font-size="12" font-style="italic" fill="#5a4a3a">always lens-friendly mid-stack.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">The logit lens reuses the final unembedding at every depth, turning any layer's hidden state into a vocabulary distribution so you can trace when a prediction crystallises.</text>
  </g>
</svg>
