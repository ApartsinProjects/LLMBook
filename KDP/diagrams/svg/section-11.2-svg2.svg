<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Tree-of-Thoughts: Search Over Reasoning Paths</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Generate several candidate thoughts, score each one, expand the promising branches, and prune the weak ones.</text>

  <!-- Legend -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="1180" height="40" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1"/>
    <circle cx="30" cy="20" r="9" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="48" y="24" font-size="12" fill="#1a1a2e">Promising (expand)</text>
    <circle cx="240" cy="20" r="9" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="258" y="24" font-size="12" fill="#1a1a2e">Marginal (may expand)</text>
    <circle cx="460" cy="20" r="9" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="478" y="24" font-size="12" fill="#1a1a2e">Poor (pruned)</text>
    <line x1="640" y1="20" x2="690" y2="20" stroke="#1f7a3a" stroke-width="2"/>
    <text x="700" y="24" font-size="12" fill="#1a1a2e">selected path to solution</text>
    <line x1="900" y1="20" x2="950" y2="20" stroke="#b3401b" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="960" y="24" font-size="12" fill="#1a1a2e">backtrack / pruned edge</text>
  </g>

  <!-- Tree -->
  <!-- Root: Problem -->
  <g transform="translate(580, 170)">
    <rect x="0" y="0" width="140" height="55" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="70" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Problem</text>
    <text x="70" y="42" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">root prompt</text>
  </g>

  <!-- Level 1: 3 thoughts -->
  <line x1="650" y1="225" x2="280" y2="290" stroke="#1f7a3a" stroke-width="2"/>
  <line x1="650" y1="225" x2="650" y2="290" stroke="#7a5e1a" stroke-width="1.5"/>
  <line x1="650" y1="225" x2="1020" y2="290" stroke="#b3401b" stroke-width="2" stroke-dasharray="4 4"/>

  <g transform="translate(210, 290)">
    <rect x="0" y="0" width="140" height="62" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="70" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Thought A</text>
    <text x="70" y="42" font-size="12" text-anchor="middle" fill="#1a1a2e">Score 0.85</text>
    <text x="70" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">expand</text>
  </g>

  <g transform="translate(580, 290)">
    <rect x="0" y="0" width="140" height="62" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="70" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Thought B</text>
    <text x="70" y="42" font-size="12" text-anchor="middle" fill="#1a1a2e">Score 0.55</text>
    <text x="70" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">may expand</text>
  </g>

  <g transform="translate(950, 290)">
    <rect x="0" y="0" width="140" height="62" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="70" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">Thought C</text>
    <text x="70" y="42" font-size="12" text-anchor="middle" fill="#1a1a2e">Score 0.30</text>
    <text x="70" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">pruned</text>
  </g>

  <!-- Level 2: under A and B -->
  <line x1="280" y1="352" x2="160" y2="430" stroke="#1f7a3a" stroke-width="2"/>
  <line x1="280" y1="352" x2="400" y2="430" stroke="#7a5e1a" stroke-width="1.5"/>
  <line x1="650" y1="352" x2="640" y2="430" stroke="#b3401b" stroke-width="2" stroke-dasharray="4 4"/>

  <g transform="translate(90, 430)">
    <rect x="0" y="0" width="140" height="62" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="70" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Thought A1</text>
    <text x="70" y="42" font-size="12" text-anchor="middle" fill="#1a1a2e">Score 0.92</text>
    <text x="70" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">best branch</text>
  </g>

  <g transform="translate(330, 430)">
    <rect x="0" y="0" width="140" height="62" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="70" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Thought A2</text>
    <text x="70" y="42" font-size="12" text-anchor="middle" fill="#1a1a2e">Score 0.60</text>
    <text x="70" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">held in queue</text>
  </g>

  <g transform="translate(570, 430)">
    <rect x="0" y="0" width="140" height="62" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="70" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">Thought B1</text>
    <text x="70" y="42" font-size="12" text-anchor="middle" fill="#1a1a2e">Score 0.48</text>
    <text x="70" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">backtrack</text>
  </g>

  <!-- Solution under A1 -->
  <line x1="160" y1="492" x2="160" y2="540" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(80, 540)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#1f7a3a" stroke="#1f7a3a" stroke-width="2"/>
    <text x="80" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Solution found</text>
    <text x="80" y="42" font-size="11" font-style="italic" text-anchor="middle" fill="#ecf6ee">return path A -- A1</text>
  </g>

  <!-- Side annotation -->
  <g transform="translate(770, 425)">
    <rect x="0" y="0" width="450" height="120" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">How the search works</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">1. Sample k thoughts from the current node.</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">2. Score each one (LLM self-eval or external judge).</text>
    <text x="20" y="84" font-size="12" fill="#1a1a2e">3. Keep top-b branches, expand them recursively.</text>
    <text x="20" y="102" font-size="12" fill="#1a1a2e">4. Backtrack if the frontier stalls below threshold.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Tree-of-Thoughts trades extra LLM calls for the ability to backtrack. Use it when a single chain-of-thought commits too early to a wrong path (puzzles, planning, code search).</text>
  </g>
</svg>
