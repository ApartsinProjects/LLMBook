<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Encoder–Decoder Seq2Seq (RNN)</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">The encoder squeezes the source into a single context vector — the decoder unrolls it back into target tokens</text>

  <!-- Encoder lane -->
  <g>
    <rect x="60" y="120" width="500" height="240" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="310" y="150" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">Encoder</text>
    <text x="310" y="172" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">read the source sentence left → right</text>

    <!-- Tokens & cells -->
    <g>
      <rect x="100" y="200" width="120" height="50" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="160" y="232" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">"the"</text>
      <rect x="100" y="270" width="120" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="160" y="293" font-size="13" font-weight="600" text-anchor="middle" fill="#1a4078">LSTM</text>
      <text x="160" y="313" font-size="11" text-anchor="middle" fill="#5a4a3a">h₁</text>

      <rect x="240" y="200" width="120" height="50" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="300" y="232" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">"cat"</text>
      <rect x="240" y="270" width="120" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="300" y="293" font-size="13" font-weight="600" text-anchor="middle" fill="#1a4078">LSTM</text>
      <text x="300" y="313" font-size="11" text-anchor="middle" fill="#5a4a3a">h₂</text>

      <rect x="380" y="200" width="120" height="50" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="440" y="232" font-size="14" font-weight="600" text-anchor="middle" fill="#1a4078">"sat"</text>
      <rect x="380" y="270" width="120" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="440" y="293" font-size="13" font-weight="600" text-anchor="middle" fill="#1a4078">LSTM</text>
      <text x="440" y="313" font-size="11" text-anchor="middle" fill="#5a4a3a">h₃</text>

      <line x1="160" y1="250" x2="160" y2="270" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
      <line x1="300" y1="250" x2="300" y2="270" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
      <line x1="440" y1="250" x2="440" y2="270" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <line x1="220" y1="300" x2="240" y2="300" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
      <line x1="360" y1="300" x2="380" y2="300" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    </g>
  </g>

  <!-- Bottleneck context vector -->
  <g>
    <line x1="500" y1="300" x2="600" y2="300" stroke="#b3401b" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="600" y="240" width="160" height="120" rx="14" fill="#fdeee8" stroke="#b3401b" stroke-width="3"/>
    <text x="680" y="278" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">context</text>
    <text x="680" y="300" font-size="13" font-weight="600" text-anchor="middle" fill="#b3401b">vector c</text>
    <text x="680" y="332" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">single fixed-length</text>
    <text x="680" y="348" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">summary of source</text>
    <line x1="760" y1="300" x2="860" y2="300" stroke="#b3401b" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- Decoder lane -->
  <g>
    <rect x="860" y="120" width="380" height="240" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="1050" y="150" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Decoder</text>
    <text x="1050" y="172" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">generate target left → right, conditioned on c</text>

    <g>
      <rect x="900" y="270" width="100" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="950" y="293" font-size="13" font-weight="600" text-anchor="middle" fill="#1f7a3a">LSTM</text>
      <text x="950" y="313" font-size="11" text-anchor="middle" fill="#5a4a3a">s₁</text>
      <rect x="900" y="200" width="100" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="950" y="232" font-size="13" font-weight="600" text-anchor="middle" fill="#1f7a3a">"le"</text>
      <line x1="950" y1="270" x2="950" y2="250" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <rect x="1020" y="270" width="100" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="1070" y="293" font-size="13" font-weight="600" text-anchor="middle" fill="#1f7a3a">LSTM</text>
      <text x="1070" y="313" font-size="11" text-anchor="middle" fill="#5a4a3a">s₂</text>
      <rect x="1020" y="200" width="100" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="1070" y="232" font-size="13" font-weight="600" text-anchor="middle" fill="#1f7a3a">"chat"</text>
      <line x1="1070" y1="270" x2="1070" y2="250" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <rect x="1140" y="270" width="100" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="1190" y="293" font-size="13" font-weight="600" text-anchor="middle" fill="#1f7a3a">LSTM</text>
      <text x="1190" y="313" font-size="11" text-anchor="middle" fill="#5a4a3a">s₃</text>
      <rect x="1140" y="200" width="100" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="1190" y="232" font-size="13" font-weight="600" text-anchor="middle" fill="#1f7a3a">"assis"</text>
      <line x1="1190" y1="270" x2="1190" y2="250" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

      <line x1="1000" y1="300" x2="1020" y2="300" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
      <line x1="1120" y1="300" x2="1140" y2="300" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    </g>
  </g>

  <!-- Bottleneck callout -->
  <g transform="translate(450, 410)">
    <rect x="0" y="0" width="400" height="120" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="200" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">⚠ The bottleneck problem</text>
    <text x="20" y="56" font-size="12" fill="#1a1a2e">Compressing a long source sentence into a single</text>
    <text x="20" y="74" font-size="12" fill="#1a1a2e">vector loses information. Translation quality</text>
    <text x="20" y="92" font-size="12" fill="#1a1a2e">degrades sharply with sentence length.</text>
    <text x="20" y="112" font-size="12" font-weight="700" fill="#b3401b">→ attention fixes this</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Encoder–decoder seq2seq introduced the read-then-write paradigm. Its weakness — a fixed-size context — motivated attention, which lets the decoder peek back at every encoder hidden state directly.</text>
  </g>
</svg>
