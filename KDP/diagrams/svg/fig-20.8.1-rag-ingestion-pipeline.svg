<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">RAG Ingestion Pipeline</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Connect → parse → chunk → embed → index — repeated on a schedule for fresh data</text>

  <!-- Sources column -->
  <g>
    <rect x="60" y="120" width="180" height="380" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="150" y="148" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">1 · Sources</text>
    <line x1="80" y1="160" x2="220" y2="160" stroke="#722f8a" stroke-width="0.6"/>
    <g font-size="12" fill="#1a1a2e">
      <rect x="80" y="180" width="140" height="34" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
      <text x="150" y="201" text-anchor="middle">Confluence</text>
      <rect x="80" y="222" width="140" height="34" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
      <text x="150" y="243" text-anchor="middle">Google Drive</text>
      <rect x="80" y="264" width="140" height="34" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
      <text x="150" y="285" text-anchor="middle">Slack</text>
      <rect x="80" y="306" width="140" height="34" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
      <text x="150" y="327" text-anchor="middle">PostgreSQL</text>
      <rect x="80" y="348" width="140" height="34" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
      <text x="150" y="369" text-anchor="middle">SharePoint</text>
    </g>
    <text x="150" y="420" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">heterogeneous,</text>
    <text x="150" y="436" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">independently changing</text>
  </g>

  <line x1="240" y1="290" x2="280" y2="290" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Connectors -->
  <g>
    <rect x="280" y="180" width="200" height="220" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="380" y="210" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">2 · Connectors</text>
    <line x1="300" y1="222" x2="460" y2="222" stroke="#1a4078" stroke-width="0.6"/>
    <text x="300" y="252" font-size="12" fill="#1a1a2e">• OAuth / API keys</text>
    <text x="300" y="276" font-size="12" fill="#1a1a2e">• Change tracking</text>
    <text x="300" y="300" font-size="12" fill="#1a1a2e">• Rate limiting</text>
    <text x="300" y="324" font-size="12" fill="#1a1a2e">• ACL preservation</text>
    <text x="300" y="348" font-size="12" fill="#1a1a2e">• Retry / backoff</text>
    <text x="380" y="385" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">handles auth + sync</text>
  </g>

  <line x1="480" y1="290" x2="520" y2="290" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Parse -->
  <g>
    <rect x="520" y="180" width="180" height="220" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="610" y="210" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">3 · Parse</text>
    <line x1="540" y1="222" x2="680" y2="222" stroke="#1f7a3a" stroke-width="0.6"/>
    <text x="540" y="252" font-size="12" fill="#1a1a2e">• PDF (tables!)</text>
    <text x="540" y="276" font-size="12" fill="#1a1a2e">• HTML / markdown</text>
    <text x="540" y="300" font-size="12" fill="#1a1a2e">• Images (caption)</text>
    <text x="540" y="324" font-size="12" fill="#1a1a2e">• OCR scans</text>
    <text x="540" y="348" font-size="12" fill="#1a1a2e">• Code blocks</text>
    <text x="610" y="385" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">→ clean text</text>
  </g>

  <line x1="700" y1="290" x2="740" y2="290" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Chunk -->
  <g>
    <rect x="740" y="180" width="180" height="220" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="830" y="210" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">4 · Chunk</text>
    <line x1="760" y1="222" x2="900" y2="222" stroke="#7a5e1a" stroke-width="0.6"/>
    <text x="760" y="252" font-size="12" fill="#1a1a2e">• semantic split</text>
    <text x="760" y="276" font-size="12" fill="#1a1a2e">• recursive</text>
    <text x="760" y="300" font-size="12" fill="#1a1a2e">• doc-aware</text>
    <text x="760" y="324" font-size="12" fill="#1a1a2e">• overlap windows</text>
    <text x="760" y="348" font-size="12" fill="#1a1a2e">• 200-800 tokens</text>
    <text x="830" y="385" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">balance recall vs noise</text>
  </g>

  <line x1="920" y1="290" x2="960" y2="290" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Embed + Index -->
  <g>
    <rect x="960" y="180" width="280" height="220" rx="10" fill="#1a1a2e" stroke="#0f3460" stroke-width="2.5"/>
    <text x="1100" y="210" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">5 · Embed + Index</text>
    <line x1="980" y1="222" x2="1220" y2="222" stroke="#cfd8e3" stroke-width="0.6"/>

    <rect x="980" y="240" width="240" height="50" rx="6" fill="#2d2d4e" stroke="#444444" stroke-width="1"/>
    <text x="1100" y="262" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Embedding model</text>
    <text x="1100" y="280" font-size="11" text-anchor="middle" fill="#cfd8e3">text → vector(d)</text>

    <line x1="1100" y1="294" x2="1100" y2="318" stroke="#cfd8e3" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="980" y="322" width="240" height="60" rx="6" fill="#2d2d4e" stroke="#444444" stroke-width="1"/>
    <text x="1100" y="346" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Vector database</text>
    <text x="1100" y="365" font-size="11" text-anchor="middle" fill="#cfd8e3">store + metadata + ANN</text>
  </g>

  <!-- Orchestration row -->
  <g transform="translate(280, 460)">
    <rect x="0" y="0" width="960" height="80" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#b3401b">Orchestration</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Scheduled syncs (e.g. nightly batch + on-change webhooks)</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">Track which docs were updated → re-embed only those, not the entire corpus.</text>
  </g>
  <path d="M 380 460 C 380 430 380 410 380 400" fill="none" stroke="#b3401b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="395" y="430" font-size="11" font-style="italic" font-weight="600" fill="#b3401b">triggers</text>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 590)">
    <rect x="0" y="0" width="1180" height="90" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7a5e1a">Where teams underestimate effort</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Steps 2 (connectors) and 4 (chunking) are 70% of the engineering work — not the embedding model choice.</text>
    <text x="20" y="74" font-size="12" fill="#1a1a2e">Bad chunking = bad retrieval, regardless of vector DB or LLM. Test chunking on real questions before scaling out.</text>
  </g>
</svg>
