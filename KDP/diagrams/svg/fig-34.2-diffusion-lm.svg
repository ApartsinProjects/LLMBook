<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Diffusion Language Model (LLaDA)</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Train by random masking; generate by iterative unmasking from a fully masked sequence.</text>

  <!-- Stage 1: Pre-training -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="380" height="220" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="190" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">1. Pre-training</text>
    <text x="190" y="42" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Random masking, ratio ~ U(0,1)</text>

    <rect x="30" y="60" width="320" height="36" rx="4" fill="#ffffff" stroke="#1a4078"/>
    <text x="190" y="83" font-size="12" text-anchor="middle" fill="#1a1a2e">Input: "The cat sat on [M] [M]"</text>

    <rect x="30" y="110" width="320" height="36" rx="4" fill="#ffffff" stroke="#1a4078"/>
    <text x="190" y="127" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Random Mask</text>
    <text x="190" y="141" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Mask ratio ~ U(0,1)</text>

    <rect x="30" y="160" width="320" height="42" rx="4" fill="#ffffff" stroke="#1a4078"/>
    <text x="190" y="177" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Predict masked tokens</text>
    <text x="190" y="193" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">target: "the", "mat"</text>

    <line x1="190" y1="96" x2="190" y2="108" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="190" y1="146" x2="190" y2="158" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>

  <!-- Stage 2: SFT -->
  <g transform="translate(460, 90)">
    <rect x="0" y="0" width="380" height="220" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="190" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. Supervised Fine-Tuning</text>
    <text x="190" y="42" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Mask only the response, keep the prompt visible</text>

    <rect x="30" y="60" width="320" height="36" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
    <text x="190" y="77" font-size="12" text-anchor="middle" fill="#1a1a2e">Q: "What is 2+2?"</text>
    <text x="190" y="91" font-size="12" text-anchor="middle" fill="#1a1a2e">A: [M] [M] [M]</text>

    <rect x="30" y="110" width="320" height="36" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
    <text x="190" y="127" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Mask response only</text>
    <text x="190" y="141" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">prompt remains conditioning context</text>

    <rect x="30" y="160" width="320" height="42" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
    <text x="190" y="177" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Predict response</text>
    <text x="190" y="193" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">target: "The answer is 4"</text>

    <line x1="190" y1="96" x2="190" y2="108" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="190" y1="146" x2="190" y2="158" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>

  <!-- Stage 3: Sampling -->
  <g transform="translate(880, 90)">
    <rect x="0" y="0" width="380" height="450" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="190" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">3. Sampling (Inference)</text>
    <text x="190" y="42" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Iterative unmasking from t=1 down to t=0</text>

    <!-- step bars -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="340" height="50" rx="4" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#1a1a2e">t = 1.0</text>
      <text x="12" y="38" font-size="13" fill="#1a1a2e" font-family="Consolas, monospace">[M] [M] [M] [M] [M]</text>
    </g>
    <g transform="translate(20, 145)">
      <rect x="0" y="0" width="340" height="50" rx="4" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#1a1a2e">t = 0.7</text>
      <text x="12" y="38" font-size="13" fill="#1a1a2e" font-family="Consolas, monospace">The [M] [M] [M] [M]</text>
    </g>
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="340" height="50" rx="4" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#1a1a2e">t = 0.3</text>
      <text x="12" y="38" font-size="13" fill="#1a1a2e" font-family="Consolas, monospace">The cat [M] on [M]</text>
    </g>
    <g transform="translate(20, 295)">
      <rect x="0" y="0" width="340" height="50" rx="4" fill="#1a1a2e" stroke="#0f3460"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#ffffff">t = 0.0  (final)</text>
      <text x="12" y="38" font-size="13" fill="#ffffff" font-family="Consolas, monospace">The cat sat on mat</text>
    </g>

    <!-- arrows with labels -->
    <line x1="190" y1="120" x2="190" y2="143" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="200" y="135" font-size="11" fill="#5a4a3a">unmask high-confidence</text>
    <line x1="190" y1="195" x2="190" y2="218" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="200" y="210" font-size="11" fill="#5a4a3a">unmask</text>
    <line x1="190" y1="270" x2="190" y2="293" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="200" y="285" font-size="11" fill="#5a4a3a">unmask</text>

    <!-- Why callout -->
    <g transform="translate(20, 370)">
      <rect x="0" y="0" width="340" height="68" rx="6" fill="#fff5dc" stroke="#d4b96a"/>
      <text x="10" y="18" font-size="12" font-weight="700" fill="#7a5e1a">Why iterative?</text>
      <text x="10" y="36" font-size="11" fill="#1a1a2e">Each step keeps tokens the model is most</text>
      <text x="10" y="50" font-size="11" fill="#1a1a2e">confident about and re-predicts the rest,</text>
      <text x="10" y="64" font-size="11" fill="#1a1a2e">refining the sequence in parallel.</text>
    </g>
  </g>

  <!-- horizontal flow arrows between stages -->
  <line x1="425" y1="200" x2="455" y2="200" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="440" y="192" font-size="11" text-anchor="middle" fill="#5a4a3a">trains base</text>
  <line x1="845" y1="200" x2="875" y2="200" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="860" y="192" font-size="11" text-anchor="middle" fill="#5a4a3a">enables</text>

  <!-- Contrast strip: vs autoregressive -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="800" height="200" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="400" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Diffusion LM vs. autoregressive LM</text>
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="370" height="140" rx="6" fill="#ffffff" stroke="#722f8a"/>
      <text x="185" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Autoregressive (GPT-style)</text>
      <text x="14" y="46" font-size="12" fill="#1a1a2e">- Predicts one token at a time, left to right</text>
      <text x="14" y="66" font-size="12" fill="#1a1a2e">- Each step depends on all prior tokens</text>
      <text x="14" y="86" font-size="12" fill="#1a1a2e">- N tokens require N forward passes</text>
      <text x="14" y="106" font-size="12" fill="#1a1a2e">- Cannot revise an emitted token</text>
      <text x="14" y="126" font-size="12" fill="#1a1a2e">- Strong fluency; left-to-right bias</text>
    </g>
    <g transform="translate(410, 44)">
      <rect x="0" y="0" width="370" height="140" rx="6" fill="#ffffff" stroke="#722f8a"/>
      <text x="185" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Diffusion (LLaDA-style)</text>
      <text x="14" y="46" font-size="12" fill="#1a1a2e">- Predicts all masked tokens in parallel</text>
      <text x="14" y="66" font-size="12" fill="#1a1a2e">- Iteratively refines over T steps</text>
      <text x="14" y="86" font-size="12" fill="#1a1a2e">- T can be much smaller than N</text>
      <text x="14" y="106" font-size="12" fill="#1a1a2e">- Can revise low-confidence tokens</text>
      <text x="14" y="126" font-size="12" fill="#1a1a2e">- Bidirectional context at every step</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 620)">
    <rect x="0" y="0" width="1220" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Diffusion LMs replace next-token prediction with masked-token prediction. Inference begins fully masked and unmasks high-confidence positions over T iterations, enabling bidirectional context and parallel decoding.</text>
  </g>
</svg>
