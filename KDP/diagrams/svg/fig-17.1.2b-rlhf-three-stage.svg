<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrBig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a4078"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">RLHF: Three-Stage Training Pipeline</text>
  <text x="700" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">From a pretrained base model to an aligned, helpful assistant</text>

  <!-- Stages timeline marker -->
  <line x1="100" y1="120" x2="1300" y2="120" stroke="#5a4a3a" stroke-width="2"/>
  <circle cx="270" cy="120" r="6" fill="#1a4078"/>
  <circle cx="700" cy="120" r="6" fill="#1a4078"/>
  <circle cx="1130" cy="120" r="6" fill="#1a4078"/>
  <text x="270" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#1a4078">stage 1</text>
  <text x="700" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#1a4078">stage 2</text>
  <text x="1130" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#1a4078">stage 3</text>

  <!-- ============================================================ -->
  <!-- STAGE 1: SUPERVISED FINE-TUNING (SFT)                        -->
  <!-- ============================================================ -->
  <g transform="translate(80,150)">
    <rect x="0" y="0" width="380" height="500" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="190" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a4078">1.  Supervised Fine-Tuning</text>
    <text x="190" y="55" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">teach the model to follow instructions</text>

    <!-- Inputs -->
    <g filter="url(#sh)" transform="translate(20,85)">
      <rect x="0" y="0" width="160" height="80" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="80" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Pretrained Base LM</text>
      <text x="80" y="42" text-anchor="middle" font-size="11" fill="#5a4a3a">e.g. GPT-3, Llama-3</text>
      <text x="80" y="58" text-anchor="middle" font-size="11" fill="#5a4a3a">trained on web corpus</text>
      <text x="80" y="73" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">"fluent but unhelpful"</text>
    </g>

    <g filter="url(#sh)" transform="translate(195,85)">
      <rect x="0" y="0" width="160" height="80" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="80" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Demonstrations</text>
      <text x="80" y="42" text-anchor="middle" font-size="11" fill="#5a4a3a">~10K-100K curated</text>
      <text x="80" y="58" text-anchor="middle" font-size="11" fill="#5a4a3a">(prompt → ideal response)</text>
      <text x="80" y="73" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">written by humans</text>
    </g>

    <!-- Down arrow -->
    <line x1="190" y1="180" x2="190" y2="225" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="200" y="208" font-size="11" fill="#5a4a3a" font-style="italic">supervised loss</text>

    <!-- Process -->
    <g filter="url(#sh)" transform="translate(70,235)">
      <rect x="0" y="0" width="240" height="60" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.8"/>
      <text x="120" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Cross-Entropy Training</text>
      <text x="120" y="45" text-anchor="middle" font-size="11" fill="#5a4a3a">next-token prediction on demos</text>
    </g>

    <!-- Down arrow -->
    <line x1="190" y1="305" x2="190" y2="350" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Output -->
    <g filter="url(#sh)" transform="translate(70,360)">
      <rect x="0" y="0" width="240" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="120" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">SFT Model</text>
      <text x="120" y="48" text-anchor="middle" font-size="11" fill="#5a4a3a">follows instructions reasonably</text>
      <text x="120" y="62" text-anchor="middle" font-size="11" fill="#5a4a3a">but inconsistent quality</text>
      <text x="120" y="75" text-anchor="middle" font-size="11" fill="#1f7a3a" font-style="italic">→ used as init for stages 2 &amp; 3</text>
    </g>

    <!-- Cost note -->
    <text x="190" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#5a4a3a">Cost: ~10K labeled pairs</text>
    <text x="190" y="482" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">most expensive: human writing</text>
  </g>

  <!-- Arrow stage 1 → 2 -->
  <line x1="465" y1="400" x2="510" y2="400" stroke="#1a4078" stroke-width="3" marker-end="url(#arrBig)"/>

  <!-- ============================================================ -->
  <!-- STAGE 2: REWARD MODEL TRAINING                                -->
  <!-- ============================================================ -->
  <g transform="translate(515,150)">
    <rect x="0" y="0" width="380" height="500" rx="10" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <text x="190" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#7a5e1a">2.  Reward Model Training</text>
    <text x="190" y="55" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">learn what humans prefer</text>

    <!-- Inputs -->
    <g filter="url(#sh)" transform="translate(20,85)">
      <rect x="0" y="0" width="160" height="80" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="80" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">SFT Model</text>
      <text x="80" y="42" text-anchor="middle" font-size="11" fill="#5a4a3a">generates 2-7 candidate</text>
      <text x="80" y="58" text-anchor="middle" font-size="11" fill="#5a4a3a">responses per prompt</text>
    </g>

    <g filter="url(#sh)" transform="translate(195,85)">
      <rect x="0" y="0" width="160" height="80" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="80" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Human Labelers</text>
      <text x="80" y="42" text-anchor="middle" font-size="11" fill="#5a4a3a">rank responses</text>
      <text x="80" y="58" text-anchor="middle" font-size="11" fill="#5a4a3a">best to worst</text>
      <text x="80" y="73" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">~50K-200K comparisons</text>
    </g>

    <!-- Down arrow -->
    <line x1="190" y1="180" x2="190" y2="225" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="245" y="210" font-size="11" fill="#5a4a3a" font-style="italic">pairs (better, worse)</text>

    <!-- Process -->
    <g filter="url(#sh)" transform="translate(50,235)">
      <rect x="0" y="0" width="280" height="60" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.8"/>
      <text x="140" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Bradley-Terry Pairwise Loss</text>
      <text x="140" y="45" text-anchor="middle" font-size="11" fill="#5a4a3a">P(better | worse) = σ( r(better) − r(worse) )</text>
    </g>

    <!-- Down arrow -->
    <line x1="190" y1="305" x2="190" y2="350" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Output: reward model -->
    <g filter="url(#sh)" transform="translate(70,360)">
      <rect x="0" y="0" width="240" height="80" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/>
      <text x="120" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Reward Model  rφ</text>
      <text x="120" y="45" text-anchor="middle" font-size="11" fill="#5a4a3a">scalar score per response:</text>
      <text x="120" y="60" text-anchor="middle" font-size="11" fill="#1a1a2e" font-style="italic">"how good is this response?"</text>
      <text x="120" y="76" text-anchor="middle" font-size="11" fill="#7a5e1a" font-style="italic">→ used as the reward signal in stage 3</text>
    </g>

    <text x="190" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#5a4a3a">Cost: ~50K-200K rankings</text>
    <text x="190" y="482" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">cheaper than writing demos</text>
  </g>

  <!-- Arrow stage 2 → 3 -->
  <line x1="900" y1="400" x2="945" y2="400" stroke="#1a4078" stroke-width="3" marker-end="url(#arrBig)"/>

  <!-- ============================================================ -->
  <!-- STAGE 3: PPO REINFORCEMENT LEARNING                          -->
  <!-- ============================================================ -->
  <g transform="translate(950,150)">
    <rect x="0" y="0" width="380" height="500" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="190" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1f7a3a">3.  PPO Reinforcement Learning</text>
    <text x="190" y="55" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">optimize the policy against the reward</text>

    <!-- Inputs (3 frozen + 1 trainable) -->
    <g filter="url(#sh)" transform="translate(20,85)">
      <rect x="0" y="0" width="105" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="52" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Policy LM  πθ</text>
      <text x="52" y="40" text-anchor="middle" font-size="11" fill="#1f7a3a" font-weight="700">trainable</text>
      <text x="52" y="55" text-anchor="middle" font-size="11" fill="#5a4a3a">init from</text>
      <text x="52" y="68" text-anchor="middle" font-size="11" fill="#5a4a3a">SFT model</text>
    </g>
    <g filter="url(#sh)" transform="translate(135,85)">
      <rect x="0" y="0" width="105" height="80" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="52" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Reward rφ</text>
      <text x="52" y="40" text-anchor="middle" font-size="11" fill="#7a5e1a" font-weight="700">frozen</text>
      <text x="52" y="55" text-anchor="middle" font-size="11" fill="#5a4a3a">scores each</text>
      <text x="52" y="68" text-anchor="middle" font-size="11" fill="#5a4a3a">response</text>
    </g>
    <g filter="url(#sh)" transform="translate(250,85)">
      <rect x="0" y="0" width="105" height="80" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4,2"/>
      <text x="52" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Reference π_ref</text>
      <text x="52" y="40" text-anchor="middle" font-size="11" fill="#5a4a3a" font-weight="700">frozen</text>
      <text x="52" y="55" text-anchor="middle" font-size="11" fill="#5a4a3a">= original</text>
      <text x="52" y="68" text-anchor="middle" font-size="11" fill="#5a4a3a">SFT, KL anchor</text>
    </g>

    <!-- Down arrow -->
    <line x1="190" y1="180" x2="190" y2="225" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- PPO loop box -->
    <g filter="url(#sh)" transform="translate(30,235)">
      <rect x="0" y="0" width="320" height="135" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.8"/>
      <text x="160" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">PPO Loop  (per batch)</text>
      <text x="160" y="48" text-anchor="middle" font-size="11" fill="#5a4a3a">a) sample prompt → πθ generates response</text>
      <text x="160" y="66" text-anchor="middle" font-size="11" fill="#5a4a3a">b) reward model scores response</text>
      <text x="160" y="84" text-anchor="middle" font-size="11" fill="#5a4a3a">c) compute KL( πθ ‖ π_ref ) penalty</text>
      <text x="160" y="102" text-anchor="middle" font-size="11" fill="#5a4a3a">d) PPO clipped policy gradient → update πθ</text>
      <text x="160" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#1f7a3a" font-style="italic">↻ repeat for ~thousands of batches</text>
    </g>

    <!-- Down arrow -->
    <line x1="190" y1="378" x2="190" y2="420" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Output: aligned model -->
    <g filter="url(#sh)" transform="translate(70,425)">
      <rect x="0" y="0" width="240" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
      <text x="120" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Aligned Model</text>
      <text x="120" y="40" text-anchor="middle" font-size="11" fill="#1f7a3a" font-style="italic">helpful, harmless, honest (ChatGPT)</text>
    </g>

    <text x="190" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#5a4a3a">Cost: GPU hours, no new labels</text>
  </g>

  <!-- Bottom caption -->
  <g transform="translate(80,690)">
    <rect x="0" y="0" width="1240" height="50" rx="6" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#1a1a2e">Each stage adds a different kind of human signal:</text>
    <text x="20" y="40" font-size="12" fill="#5a4a3a"><tspan font-weight="700" fill="#1a4078">stage 1</tspan>: example demonstrations  •  <tspan font-weight="700" fill="#7a5e1a">stage 2</tspan>: pairwise preferences  •  <tspan font-weight="700" fill="#1f7a3a">stage 3</tspan>: no new labels — RL squeezes more from the reward model</text>
  </g>
</svg>
