<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Direct Prompting vs Chain-of-Thought</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">For multi-step arithmetic, asking the model to "think step by step" turns a wrong guess into a correct derivation.</text>

  <!-- LEFT lane: Direct prompting -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="580" height="470" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="290" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Direct Prompting</text>
    <text x="290" y="52" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Ask, expect a one-shot answer</text>

    <!-- Question -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="520" height="70" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#5a4a3a">USER</text>
      <text x="16" y="48" font-size="13" fill="#1a1a2e">"What is 17 x 23 + 45?"</text>
    </g>

    <!-- Arrow -->
    <line x1="290" y1="160" x2="290" y2="200" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Answer -->
    <g transform="translate(30, 210)">
      <rect x="0" y="0" width="520" height="80" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#5a4a3a">MODEL</text>
      <text x="16" y="56" font-size="22" font-weight="700" fill="#b3401b">"437"</text>
    </g>

    <!-- Verdict -->
    <g transform="translate(30, 320)">
      <rect x="0" y="0" width="520" height="120" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="20" y="30" font-size="20" font-weight="700" fill="#b3401b">INCORRECT</text>
      <text x="20" y="58" font-size="12" fill="#1a1a2e">Correct answer is 436. The model jumped straight to a token-likely</text>
      <text x="20" y="76" font-size="12" fill="#1a1a2e">number without showing the multiplication step.</text>
      <text x="20" y="100" font-size="11" font-style="italic" fill="#5a4a3a">Off by one is a typical "fast guess" failure on multi-step arithmetic.</text>
    </g>
  </g>

  <!-- divider -->
  <line x1="650" y1="120" x2="650" y2="570" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT lane: CoT -->
  <g transform="translate(660, 110)">
    <rect x="0" y="0" width="580" height="470" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="290" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Chain-of-Thought</text>
    <text x="290" y="52" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Add: "Let's think step by step."</text>

    <!-- Question -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="520" height="70" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#5a4a3a">USER</text>
      <text x="16" y="48" font-size="13" fill="#1a1a2e">"What is 17 x 23 + 45? Let's think step by step."</text>
    </g>

    <line x1="290" y1="160" x2="290" y2="190" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Step 1 -->
    <g transform="translate(30, 200)">
      <rect x="0" y="0" width="520" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="16" y="22" font-size="12" font-weight="700" fill="#1f7a3a">Step 1</text>
      <text x="100" y="32" font-size="13" fill="#1a1a2e">17 x 23 = 391</text>
    </g>
    <line x1="290" y1="250" x2="290" y2="265" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Step 2 -->
    <g transform="translate(30, 270)">
      <rect x="0" y="0" width="520" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="16" y="22" font-size="12" font-weight="700" fill="#1f7a3a">Step 2</text>
      <text x="100" y="32" font-size="13" fill="#1a1a2e">391 + 45 = 436</text>
    </g>
    <line x1="290" y1="320" x2="290" y2="335" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Answer -->
    <g transform="translate(30, 340)">
      <rect x="0" y="0" width="520" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="20" y="30" font-size="20" font-weight="700" fill="#1f7a3a">CORRECT: 436</text>
      <text x="20" y="58" font-size="12" fill="#1a1a2e">Decomposing into intermediate tokens lets each step be locally</text>
      <text x="20" y="76" font-size="12" fill="#1a1a2e">verifiable; the model never has to "guess" the whole answer.</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Chain-of-thought converts a single risky token-prediction into a sequence of easy ones. Cost: more output tokens. Benefit: large accuracy gains on math, logic, and multi-hop reasoning.</text>
  </g>
</svg>
