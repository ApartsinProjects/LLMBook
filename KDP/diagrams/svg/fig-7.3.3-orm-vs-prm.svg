<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">ORM vs. PRM: outcome-only signal vs. step-level signal</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Process Reward Models score every step, so a wrong step is caught immediately and the search can backtrack.</text>

  <!-- Lane labels (header strip) -->
  <g>
    <rect x="60" y="100" width="600" height="40" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="360" y="126" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Outcome Reward Model (ORM)</text>
  </g>
  <g>
    <rect x="680" y="100" width="560" height="40" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="960" y="126" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Process Reward Model (PRM)</text>
  </g>

  <!-- ORM lane: linear chain -->
  <g>
    <text x="80" y="170" font-size="12" font-style="italic" fill="#5a4a3a">Trajectory: only the final answer is judged.</text>

    <g>
      <rect x="80" y="190" width="180" height="70" rx="8" fill="#ffffff" stroke="#5a4a3a" stroke-width="1.5"/>
      <text x="170" y="218" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 1</text>
      <text x="170" y="240" font-size="13" text-anchor="middle" fill="#5a4a3a">no signal</text>
    </g>
    <line x1="260" y1="225" x2="290" y2="225" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <g>
      <rect x="290" y="190" width="180" height="70" rx="8" fill="#ffffff" stroke="#5a4a3a" stroke-width="1.5"/>
      <text x="380" y="218" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 2</text>
      <text x="380" y="240" font-size="13" text-anchor="middle" fill="#5a4a3a">no signal</text>
    </g>
    <line x1="470" y1="225" x2="500" y2="225" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <g>
      <rect x="500" y="190" width="180" height="70" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="590" y="218" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 3  (wrong)</text>
      <text x="590" y="240" font-size="13" text-anchor="middle" fill="#b3401b">still no signal</text>
    </g>

    <!-- collapse arrow to final -->
    <line x1="380" y1="260" x2="380" y2="320" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <g>
      <rect x="180" y="320" width="400" height="120" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="380" y="350" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">Final answer:  WRONG</text>
      <text x="380" y="375" font-size="13" text-anchor="middle" fill="#1a1a2e">Reward score = 0.0</text>
      <text x="380" y="400" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Where did it go wrong? Unknown.</text>
      <text x="380" y="420" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Credit assignment must be inferred.</text>
    </g>

    <!-- ORM problem callout -->
    <g transform="translate(80, 470)">
      <rect x="0" y="0" width="580" height="100" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Diagnose</text>
      <text x="14" y="44" font-size="12" fill="#1a1a2e">Sparse signal. Sample 100 trajectories, you learn which whole solutions</text>
      <text x="14" y="62" font-size="12" fill="#1a1a2e">work, but not which steps caused the failure. High variance for RL,</text>
      <text x="14" y="80" font-size="12" fill="#1a1a2e">and tree search has nothing to prune on.</text>
    </g>
  </g>

  <!-- PRM lane: per-step scores + branch -->
  <g>
    <text x="700" y="170" font-size="12" font-style="italic" fill="#5a4a3a">Trajectory: every reasoning step gets its own probability of correctness.</text>

    <g>
      <rect x="700" y="190" width="160" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="780" y="218" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 1</text>
      <text x="780" y="240" font-size="13" text-anchor="middle" fill="#1f7a3a">P(correct) = 0.95</text>
    </g>
    <line x1="860" y1="225" x2="890" y2="225" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <g>
      <rect x="890" y="190" width="160" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="970" y="218" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 2</text>
      <text x="970" y="240" font-size="13" text-anchor="middle" fill="#1f7a3a">P(correct) = 0.88</text>
    </g>
    <line x1="1050" y1="225" x2="1080" y2="225" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <g>
      <rect x="1080" y="190" width="160" height="70" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="1160" y="218" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 3</text>
      <text x="1160" y="240" font-size="13" text-anchor="middle" fill="#b3401b">P(correct) = 0.12</text>
    </g>

    <!-- arrow to action -->
    <line x1="1160" y1="260" x2="1160" y2="290" stroke="#b3401b" stroke-width="1.5" marker-end="url(#arr)"/>

    <g>
      <rect x="700" y="290" width="540" height="150" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="970" y="320" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Error caught at Step 3</text>
      <text x="970" y="345" font-size="12" text-anchor="middle" fill="#1a1a2e">Score collapsed from 0.88 to 0.12 between steps.</text>
      <text x="970" y="372" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Action: backtrack to Step 2 and re-sample Step 3.</text>
      <text x="970" y="395" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Tree search prunes the bad branch immediately.</text>
      <text x="970" y="418" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">RL gets dense per-step credit.</text>
    </g>

    <!-- PRM benefit callout -->
    <g transform="translate(680, 470)">
      <rect x="0" y="0" width="560" height="100" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Why it helps</text>
      <text x="14" y="44" font-size="12" fill="#1a1a2e">Dense credit assignment. Powers Best-of-N over partial trajectories,</text>
      <text x="14" y="62" font-size="12" fill="#1a1a2e">guides MCTS expansion (high-PRM nodes are visited more), and is the</text>
      <text x="14" y="80" font-size="12" fill="#1a1a2e">supervision signal behind systems like Math-Shepherd and OpenAI o1.</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="670" y1="100" x2="670" y2="580" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 605)">
    <rect x="0" y="0" width="1180" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">ORMs answer "did this trajectory succeed?" PRMs answer "is this step correct?" The denser PRM signal is more expensive to collect (per-step labels)</text>
    <text x="20" y="64" font-size="12" fill="#1a1a2e">but enables backtracking, search-guidance, and lower-variance RL — the foundation of test-time-compute reasoners.</text>
  </g>
</svg>
