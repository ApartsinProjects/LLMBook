<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Grokking: validation accuracy lags training accuracy by orders of magnitude</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">The model memorizes quickly, then sits on a long flat plateau before generalization snaps into place.</text>

  <!-- Chart frame -->
  <g transform="translate(110, 110)">
    <!-- Plot box -->
    <rect x="0" y="0" width="900" height="380" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>

    <!-- Y axis -->
    <line x1="0" y1="0" x2="0" y2="380" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="0" y1="380" x2="900" y2="380" stroke="#1a1a2e" stroke-width="1.5"/>

    <!-- Y ticks -->
    <g font-size="11" fill="#1a1a2e" text-anchor="end">
      <line x1="-5" y1="380" x2="0" y2="380" stroke="#1a1a2e"/><text x="-10" y="384">0%</text>
      <line x1="-5" y1="285" x2="0" y2="285" stroke="#1a1a2e"/><text x="-10" y="289">25%</text>
      <line x1="-5" y1="190" x2="0" y2="190" stroke="#1a1a2e"/><text x="-10" y="194">50%</text>
      <line x1="-5" y1="95" x2="0" y2="95" stroke="#1a1a2e"/><text x="-10" y="99">75%</text>
      <line x1="-5" y1="0" x2="0" y2="0" stroke="#1a1a2e"/><text x="-10" y="4">100%</text>
    </g>

    <!-- X ticks (log scale) -->
    <g font-size="11" fill="#1a1a2e" text-anchor="middle">
      <line x1="0" y1="380" x2="0" y2="385" stroke="#1a1a2e"/><text x="0" y="400">10^2</text>
      <line x1="225" y1="380" x2="225" y2="385" stroke="#1a1a2e"/><text x="225" y="400">10^3</text>
      <line x1="450" y1="380" x2="450" y2="385" stroke="#1a1a2e"/><text x="450" y="400">10^4</text>
      <line x1="675" y1="380" x2="675" y2="385" stroke="#1a1a2e"/><text x="675" y="400">10^5</text>
      <line x1="900" y1="380" x2="900" y2="385" stroke="#1a1a2e"/><text x="900" y="400">10^6</text>
    </g>
    <text x="450" y="425" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e">Training steps (log)</text>
    <text x="-65" y="190" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 -65 190)">Accuracy</text>

    <!-- Phase shading -->
    <rect x="0" y="0" width="170" height="380" fill="#fce8ec" opacity="0.45"/>
    <rect x="170" y="0" width="500" height="380" fill="#fff3e0" opacity="0.5"/>
    <rect x="670" y="0" width="230" height="380" fill="#e6f4ea" opacity="0.55"/>

    <!-- Phase labels -->
    <text x="85" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">Memorize</text>
    <text x="420" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">Long plateau</text>
    <text x="785" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Generalize</text>

    <!-- Train curve: rises fast to ~100%, stays at 100% -->
    <path d="M 0,360 L 30,250 L 60,140 L 100,40 L 170,8 L 670,8 L 900,8" fill="none" stroke="#1a4078" stroke-width="3"/>

    <!-- Validation curve: stays low/flat, then jumps near step 10^5 -->
    <path d="M 0,372 L 60,360 L 170,355 L 400,350 L 600,345 L 670,340 L 720,290 L 760,140 L 820,30 L 900,8" fill="none" stroke="#b3401b" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Annotations -->
    <g transform="translate(60, 60)">
      <rect x="0" y="0" width="110" height="44" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/>
      <text x="55" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">Train: 100%</text>
      <text x="55" y="34" font-size="11" text-anchor="middle" fill="#1a4078">(memorized)</text>
    </g>

    <g transform="translate(330, 300)">
      <rect x="0" y="0" width="180" height="44" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.2"/>
      <text x="90" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#7a5e1a">Val still ~0% for many epochs</text>
      <text x="90" y="34" font-size="11" text-anchor="middle" fill="#7a5e1a">(plateau, no apparent progress)</text>
    </g>

    <g transform="translate(740, 80)">
      <rect x="0" y="0" width="150" height="44" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="75" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">Sudden jump</text>
      <text x="75" y="34" font-size="11" text-anchor="middle" fill="#1f7a3a">Val climbs to 100%</text>
    </g>
    <line x1="780" y1="124" x2="780" y2="180" stroke="#1f7a3a" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Legend -->
    <g transform="translate(700, 330)">
      <rect x="0" y="0" width="190" height="46" rx="6" fill="#ffffff" stroke="#5a4a3a" stroke-width="1"/>
      <line x1="10" y1="16" x2="38" y2="16" stroke="#1a4078" stroke-width="3"/>
      <text x="44" y="20" font-size="12" fill="#1a1a2e">Train accuracy</text>
      <line x1="10" y1="36" x2="38" y2="36" stroke="#b3401b" stroke-width="3" stroke-dasharray="6 4"/>
      <text x="44" y="40" font-size="12" fill="#1a1a2e">Validation accuracy</text>
    </g>
  </g>

  <!-- Phase boxes below chart -->
  <g transform="translate(110, 540)">
    <rect x="0" y="0" width="290" height="80" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="145" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">1. Memorize</text>
    <text x="145" y="46" font-size="11" text-anchor="middle" fill="#1a1a2e">Train: 100%, Val: low</text>
    <text x="145" y="64" font-size="11" text-anchor="middle" fill="#5a4a3a">Model fits the training set as a lookup table.</text>
  </g>
  <g transform="translate(415, 540)">
    <rect x="0" y="0" width="290" height="80" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="145" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">2. Long plateau</text>
    <text x="145" y="46" font-size="11" text-anchor="middle" fill="#1a1a2e">Train: 100%, Val: still low</text>
    <text x="145" y="64" font-size="11" text-anchor="middle" fill="#5a4a3a">Weight decay slowly simplifies the circuit.</text>
  </g>
  <g transform="translate(720, 540)">
    <rect x="0" y="0" width="290" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="145" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. Generalize</text>
    <text x="145" y="46" font-size="11" text-anchor="middle" fill="#1a1a2e">Train: 100%, Val: 100%</text>
    <text x="145" y="64" font-size="11" text-anchor="middle" fill="#5a4a3a">A general algorithm replaces the memorized table.</text>
  </g>

  <!-- Side callout -->
  <g transform="translate(1030, 540)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Diagnose</text>
    <text x="14" y="42" font-size="11" fill="#1a1a2e">If train is perfect but val</text>
    <text x="14" y="58" font-size="11" fill="#1a1a2e">is flat, do not stop early;</text>
    <text x="14" y="74" font-size="11" fill="#1a1a2e">grokking can still arrive.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(110, 640)">
    <rect x="0" y="0" width="1100" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Generalization is not always continuous with training loss; with weight decay and enough steps, the model can transition from memorization to a clean algorithm long after training accuracy saturates.</text>
  </g>
</svg>
