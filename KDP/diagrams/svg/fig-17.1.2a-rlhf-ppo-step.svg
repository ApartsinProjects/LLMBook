<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">RLHF: Inside One PPO Update Step</text>
  <text x="600" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">How a prompt becomes a gradient: response → reward → KL penalty → policy update</text>

  <!-- Step 1: Prompt -->
  <g filter="url(#sh)" transform="translate(60,150)">
    <rect x="0" y="0" width="160" height="60" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="80" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Prompt  x</text>
    <text x="80" y="46" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">"Explain photosynthesis"</text>
  </g>
  <text x="140" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#5a4a3a">1. sample from prompt set</text>

  <line x1="225" y1="180" x2="280" y2="180" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: Policy LM (current) -->
  <g filter="url(#sh)" transform="translate(285,140)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Policy LM  πθ</text>
    <text x="100" y="44" text-anchor="middle" font-size="11" fill="#5a4a3a">trainable</text>
    <text x="100" y="60" text-anchor="middle" font-size="11" fill="#1f7a3a" font-style="italic">starts from SFT model;</text>
    <text x="100" y="73" text-anchor="middle" font-size="11" fill="#1f7a3a" font-style="italic">updated each step</text>
  </g>
  <text x="385" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#5a4a3a">2. generate response</text>

  <line x1="490" y1="180" x2="545" y2="180" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Response y -->
  <g filter="url(#sh)" transform="translate(550,150)">
    <rect x="0" y="0" width="180" height="60" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="90" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Response  y</text>
    <text x="90" y="46" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">"Plants convert sunlight..."</text>
  </g>

  <!-- Branch: y goes to reward model AND reference LM -->

  <!-- Down arrow to reward model -->
  <line x1="640" y1="215" x2="640" y2="285" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="650" y="255" font-size="11" font-weight="600" fill="#5a4a3a">3a. score</text>

  <!-- Reward model (frozen) -->
  <g filter="url(#sh)" transform="translate(540,285)">
    <rect x="0" y="0" width="200" height="90" rx="6" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Reward Model  rφ</text>
    <text x="100" y="42" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">trained on human preferences</text>
    <!-- Lock for frozen -->
    <g transform="translate(160,55)">
      <rect x="0" y="6" width="14" height="12" rx="2" fill="#5a4a3a"/>
      <path d="M 2 6 L 2 3 A 5 5 0 0 1 12 3 L 12 6" fill="none" stroke="#5a4a3a" stroke-width="2"/>
    </g>
    <text x="80" y="68" text-anchor="middle" font-size="11" fill="#5a4a3a" font-weight="700">frozen</text>
    <text x="100" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5e1a" font-style="italic">→  scalar reward  r</text>
  </g>

  <!-- Right branch: y goes to reference LM (frozen) -->
  <line x1="730" y1="180" x2="800" y2="180" stroke="#5a4a3a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="765" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#5a4a3a">3b. compare</text>

  <!-- Reference LM (frozen, the SFT checkpoint) -->
  <g filter="url(#sh)" transform="translate(805,140)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="100" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Reference LM  π_ref</text>
    <text x="100" y="44" text-anchor="middle" font-size="11" fill="#5a4a3a">= original SFT model</text>
    <g transform="translate(160,52)">
      <rect x="0" y="6" width="14" height="12" rx="2" fill="#5a4a3a"/>
      <path d="M 2 6 L 2 3 A 5 5 0 0 1 12 3 L 12 6" fill="none" stroke="#5a4a3a" stroke-width="2"/>
    </g>
    <text x="80" y="68" text-anchor="middle" font-size="11" fill="#5a4a3a" font-weight="700">frozen</text>
  </g>

  <!-- Output of reference LM: log-prob -->
  <text x="905" y="240" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">log π_ref(y | x)</text>
  <text x="905" y="255" text-anchor="middle" font-size="11" fill="#1f7a3a" font-style="italic">log πθ(y | x)</text>

  <!-- Output of reward: r -->
  <text x="640" y="395" text-anchor="middle" font-size="11" fill="#7a5e1a" font-style="italic">reward r</text>

  <!-- Combined into total objective -->
  <line x1="640" y1="375" x2="640" y2="440" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="900" y1="265" x2="900" y2="320" stroke="#5a4a3a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="900" y1="320" x2="730" y2="430" stroke="#5a4a3a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="800" y="380" font-size="11" fill="#5a4a3a" font-style="italic">KL divergence</text>

  <!-- Total objective box -->
  <g filter="url(#sh)" transform="translate(440,440)">
    <rect x="0" y="0" width="400" height="100" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="200" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Total Objective  J(θ)</text>
    <text x="200" y="55" text-anchor="middle" font-size="16" fill="#1a1a2e" font-style="italic">J = E[ r(x,y) ]   −   β · KL( πθ ‖ π_ref )</text>
    <text x="200" y="80" text-anchor="middle" font-size="11" fill="#5a4a3a">↑ maximize reward</text>
    <text x="200" y="92" text-anchor="middle" font-size="11" fill="#5a4a3a">↑ but stay close to the SFT baseline</text>
  </g>

  <!-- PPO update -->
  <line x1="640" y1="540" x2="640" y2="595" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="660" y="575" font-size="11" font-weight="600" fill="#5a4a3a">4. PPO update</text>

  <g filter="url(#sh)" transform="translate(490,595)">
    <rect x="0" y="0" width="300" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/>
    <text x="150" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">PPO Gradient Step  on  πθ</text>
    <text x="150" y="48" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">clipped policy ratio prevents catastrophic updates</text>
  </g>

  <!-- Loop back to policy -->
  <path d="M 490 625 Q 380 625, 380 230 L 380 180 L 290 180" fill="none" stroke="#1f7a3a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrGreen)"/>
  <text x="350" y="430" font-size="11" font-weight="700" fill="#1f7a3a" transform="rotate(-90 350 430)">5. update parameters and repeat</text>

  <!-- Side-note: why KL? -->
  <g transform="translate(870,440)">
    <rect x="0" y="0" width="270" height="180" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="135" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#b3401b">Why the KL penalty?</text>
    <text x="15" y="50" font-size="12" fill="#1a1a2e">Without it, the policy can</text>
    <text x="15" y="68" font-size="12" fill="#1a1a2e">"hack" the reward model —</text>
    <text x="15" y="86" font-size="12" fill="#1a1a2e">finding adversarial outputs</text>
    <text x="15" y="104" font-size="12" fill="#1a1a2e">that score high but are</text>
    <text x="15" y="122" font-size="12" fill="#1a1a2e">incoherent or repetitive.</text>
    <text x="15" y="148" font-size="12" fill="#1a1a2e">β controls the trade-off:</text>
    <text x="15" y="166" font-size="12" fill="#1a1a2e">small β = more reward focus,</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60,720)">
    <rect x="0" y="0" width="1080" height="50" rx="6" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#5a4a3a">Legend:</text>
    <rect x="100" y="12" width="14" height="14" fill="#ecf6ee" stroke="#1f7a3a"/>
    <text x="120" y="24" font-size="11" fill="#1a1a2e">trainable model</text>
    <rect x="240" y="12" width="14" height="14" fill="#fef3e0" stroke="#d4b96a"/>
    <text x="260" y="24" font-size="11" fill="#1a1a2e">frozen reward model (used to score)</text>
    <rect x="490" y="12" width="14" height="14" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3,2"/>
    <text x="510" y="24" font-size="11" fill="#1a1a2e">frozen reference (used for KL anchor)</text>
    <rect x="780" y="12" width="14" height="14" fill="#f4ecf7" stroke="#722f8a"/>
    <text x="800" y="24" font-size="11" fill="#1a1a2e">composite objective / orchestration</text>
    <text x="20" y="44" font-size="11" fill="#5a4a3a" font-style="italic">solid arrow = data flow.   dashed arrow = comparison or evaluation (no gradient).</text>
  </g>
</svg>
