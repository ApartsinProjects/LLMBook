<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Model chaining: cheap models do the easy stages</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Route each pipeline stage to the smallest model that can do it well; reserve the flagship for hard reasoning.</text>

  <!-- Pipeline section header -->
  <text x="80" y="110" font-size="14" font-weight="700" fill="#1a1a2e">Stage pipeline</text>
  <line x1="80" y1="118" x2="1220" y2="118" stroke="#cfcfcf" stroke-width="1"/>

  <!-- Stage 1: Extract (mini) -->
  <g transform="translate(80,140)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="130" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Stage 1: Extract</text>
    <text x="130" y="56" font-size="12" text-anchor="middle" fill="#1a1a2e">Parse raw input into</text>
    <text x="130" y="74" font-size="12" text-anchor="middle" fill="#1a1a2e">structured entities.</text>
    <rect x="40" y="92" width="180" height="42" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="130" y="110" font-size="11" text-anchor="middle" fill="#5a4a3a">Model:</text>
    <text x="130" y="126" font-size="12" text-anchor="middle" font-weight="700" fill="#1a4078">gpt-4o-mini</text>
  </g>
  <line x1="340" y1="215" x2="380" y2="215" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="360" y="207" font-size="11" text-anchor="middle" fill="#5a4a3a">entities (JSON)</text>

  <!-- Stage 2: Analyze (gpt-4o, the expensive one) -->
  <g transform="translate(380,140)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="130" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Stage 2: Analyze</text>
    <text x="130" y="56" font-size="12" text-anchor="middle" fill="#1a1a2e">Reason about entities</text>
    <text x="130" y="74" font-size="12" text-anchor="middle" fill="#1a1a2e">and relationships.</text>
    <rect x="40" y="92" width="180" height="42" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
    <text x="130" y="110" font-size="11" text-anchor="middle" fill="#5a4a3a">Model (flagship):</text>
    <text x="130" y="126" font-size="12" text-anchor="middle" font-weight="700" fill="#722f8a">gpt-4o</text>
  </g>
  <line x1="640" y1="215" x2="680" y2="215" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="660" y="207" font-size="11" text-anchor="middle" fill="#5a4a3a">analysis + flags</text>

  <!-- Stage 3: Validate -->
  <g transform="translate(680,140)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="130" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Stage 3: Validate</text>
    <text x="130" y="56" font-size="12" text-anchor="middle" fill="#1a1a2e">Check constraints</text>
    <text x="130" y="74" font-size="12" text-anchor="middle" fill="#1a1a2e">and consistency.</text>
    <rect x="40" y="92" width="180" height="42" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
    <text x="130" y="110" font-size="11" text-anchor="middle" fill="#5a4a3a">Model:</text>
    <text x="130" y="126" font-size="12" text-anchor="middle" font-weight="700" fill="#1f7a3a">gpt-4o-mini</text>
  </g>
  <line x1="940" y1="215" x2="980" y2="215" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="960" y="207" font-size="11" text-anchor="middle" fill="#5a4a3a">validated</text>

  <!-- Stage 4: Format -->
  <g transform="translate(980,140)">
    <rect x="0" y="0" width="240" height="150" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="120" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Stage 4: Format</text>
    <text x="120" y="56" font-size="12" text-anchor="middle" fill="#1a1a2e">Produce final structured</text>
    <text x="120" y="74" font-size="12" text-anchor="middle" fill="#1a1a2e">output to return to caller.</text>
    <rect x="30" y="92" width="180" height="42" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
    <text x="120" y="110" font-size="11" text-anchor="middle" fill="#5a4a3a">Model:</text>
    <text x="120" y="126" font-size="12" text-anchor="middle" font-weight="700" fill="#7a5e1a">gpt-4o-mini</text>
  </g>

  <!-- Annotation under flagship -->
  <text x="510" y="316" font-size="11" text-anchor="middle" fill="#722f8a" font-style="italic">only the hard reasoning step uses gpt-4o</text>

  <!-- Cost comparison header -->
  <text x="80" y="380" font-size="14" font-weight="700" fill="#1a1a2e">Cost comparison: same task, two architectures</text>
  <line x1="80" y1="388" x2="1220" y2="388" stroke="#cfcfcf" stroke-width="1"/>

  <!-- Monolithic cost card -->
  <g transform="translate(80,410)">
    <rect x="0" y="0" width="555" height="180" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#b3401b">Monolithic: 1 gpt-4o call does everything</text>
    <text x="20" y="58" font-size="12" fill="#1a1a2e">Single prompt asks the flagship to extract, analyze,</text>
    <text x="20" y="76" font-size="12" fill="#1a1a2e">validate, and format all at once.</text>
    <text x="20" y="106" font-size="12" fill="#5a4a3a">Tokens: ~2,000 in, ~800 out (all on gpt-4o)</text>
    <text x="20" y="138" font-size="20" font-weight="700" fill="#b3401b">$0.034 per request</text>
    <text x="20" y="162" font-size="11" font-style="italic" fill="#5a4a3a">Simpler to write, but pays flagship rates for trivial parsing.</text>
  </g>

  <!-- Chained cost card -->
  <g transform="translate(665,410)">
    <rect x="0" y="0" width="555" height="180" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#1f7a3a">Chained: 3 mini calls + 1 gpt-4o call</text>
    <text x="20" y="58" font-size="12" fill="#1a1a2e">Stages 1, 3, 4 use mini; only Stage 2 (analysis) uses</text>
    <text x="20" y="76" font-size="12" fill="#1a1a2e">the flagship.</text>
    <text x="20" y="106" font-size="12" fill="#5a4a3a">Tokens: split across 4 smaller, focused calls</text>
    <text x="20" y="138" font-size="20" font-weight="700" fill="#1f7a3a">$0.019 per request  (-44%)</text>
    <text x="20" y="162" font-size="11" font-style="italic" fill="#5a4a3a">Cheaper and more reliable: each stage is easier to test in isolation.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 670)">
    <rect x="0" y="0" width="1140" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Most pipeline stages (parsing, validating, formatting) do not need the flagship model. Routing them to a mini variant cut cost 44%</text>
    <text x="20" y="62" font-size="12" fill="#1a1a2e">in this example, with each stage easier to debug because the prompt does one thing.</text>
  </g>
</svg>
