<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">S4: Three Views of the Same State-Space Model</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">One ODE, three computational forms; choose the view that fits the workload.</text>

  <!-- VIEW 1 -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="380" height="430" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="50" rx="10" fill="#1a4078"/>
    <text x="190" y="32" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">1. Continuous-Time</text>

    <text x="20" y="80" font-size="12" font-weight="700" fill="#1a4078">State equation</text>
    <rect x="20" y="90" width="340" height="44" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="190" y="118" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e">dx/dt = A x + B u</text>

    <text x="20" y="160" font-size="12" font-weight="700" fill="#1a4078">Output equation</text>
    <rect x="20" y="170" width="340" height="44" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="190" y="198" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e">y = C x + D u</text>

    <text x="20" y="240" font-size="12" font-weight="700" fill="#1a4078">Components</text>
    <text x="20" y="260" font-size="12" fill="#1a1a2e">A, B, C, D are matrices</text>
    <text x="20" y="278" font-size="12" fill="#1a1a2e">A initialized via HiPPO theory</text>

    <text x="20" y="312" font-size="12" font-weight="700" fill="#1a4078">When to use</text>
    <text x="20" y="332" font-size="12" fill="#1a1a2e">Theory, derivations, choosing</text>
    <text x="20" y="348" font-size="12" fill="#1a1a2e">a stable parameterization for A</text>

    <g transform="translate(20, 372)">
      <rect x="0" y="0" width="340" height="42" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.4"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#7a5e1a">Mental model</text>
      <text x="10" y="32" font-size="11" fill="#1a1a2e">A continuous dynamical system, like a circuit.</text>
    </g>
  </g>

  <!-- arrow 1 -> 2 -->
  <g transform="translate(440, 320)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="20" y="-20" font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a2e">discretize</text>
    <text x="20" y="-6" font-size="11" text-anchor="middle" fill="#5a4a3a">step delta</text>
  </g>

  <!-- VIEW 2 -->
  <g transform="translate(490, 110)">
    <rect x="0" y="0" width="380" height="430" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="50" rx="10" fill="#1f7a3a"/>
    <text x="190" y="32" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">2. Recurrent</text>

    <text x="20" y="80" font-size="12" font-weight="700" fill="#1f7a3a">State update</text>
    <rect x="20" y="90" width="340" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
    <text x="190" y="118" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e">x_k = A_bar x_{k-1} + B_bar u_k</text>

    <text x="20" y="160" font-size="12" font-weight="700" fill="#1f7a3a">Output</text>
    <rect x="20" y="170" width="340" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
    <text x="190" y="198" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e">y_k = C x_k + D u_k</text>

    <text x="20" y="240" font-size="12" font-weight="700" fill="#1f7a3a">Cost per step</text>
    <text x="20" y="260" font-size="12" fill="#1a1a2e">O(1) compute, O(1) memory</text>
    <text x="20" y="278" font-size="12" fill="#1a1a2e">(constant, like an RNN)</text>

    <text x="20" y="312" font-size="12" font-weight="700" fill="#1f7a3a">When to use</text>
    <text x="20" y="332" font-size="12" fill="#1a1a2e">Inference, autoregressive</text>
    <text x="20" y="348" font-size="12" fill="#1a1a2e">decoding, streaming</text>

    <g transform="translate(20, 372)">
      <rect x="0" y="0" width="340" height="42" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.4"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#7a5e1a">Mental model</text>
      <text x="10" y="32" font-size="11" fill="#1a1a2e">An RNN with carefully chosen weights.</text>
    </g>
  </g>

  <!-- arrow 2 -> 3 -->
  <g transform="translate(880, 320)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="20" y="-20" font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a2e">unroll</text>
    <text x="20" y="-6" font-size="11" text-anchor="middle" fill="#5a4a3a">to convolution</text>
  </g>

  <!-- VIEW 3 -->
  <g transform="translate(930, 110)">
    <rect x="0" y="0" width="320" height="430" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="50" rx="10" fill="#722f8a"/>
    <text x="160" y="32" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">3. Convolutional</text>

    <text x="20" y="80" font-size="12" font-weight="700" fill="#722f8a">Kernel</text>
    <rect x="20" y="90" width="280" height="44" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
    <text x="160" y="118" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e">K = (CB, CAB, CA^2 B, ...)</text>

    <text x="20" y="160" font-size="12" font-weight="700" fill="#722f8a">Output</text>
    <rect x="20" y="170" width="280" height="44" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
    <text x="160" y="198" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e">y = K * u</text>

    <text x="20" y="240" font-size="12" font-weight="700" fill="#722f8a">Cost</text>
    <text x="20" y="260" font-size="12" fill="#1a1a2e">O(n log n) via FFT</text>
    <text x="20" y="278" font-size="12" fill="#1a1a2e">parallel over the full sequence</text>

    <text x="20" y="312" font-size="12" font-weight="700" fill="#722f8a">When to use</text>
    <text x="20" y="332" font-size="12" fill="#1a1a2e">Training: full sequence is</text>
    <text x="20" y="348" font-size="12" fill="#1a1a2e">known, parallelism wins on GPU</text>

    <g transform="translate(20, 372)">
      <rect x="0" y="0" width="280" height="42" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.4"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#7a5e1a">Mental model</text>
      <text x="10" y="32" font-size="11" fill="#1a1a2e">A long 1-D conv with a structured kernel.</text>
    </g>
  </g>

  <!-- workload row -->
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="1200" height="80" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.2"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#1a1a2e">Which view runs when?</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e"><tspan font-weight="700" fill="#1a4078">Continuous</tspan>: design + analysis</text>
    <text x="320" y="50" font-size="12" fill="#1a1a2e"><tspan font-weight="700" fill="#1f7a3a">Recurrent</tspan>: inference, one token at a time</text>
    <text x="720" y="50" font-size="12" fill="#1a1a2e"><tspan font-weight="700" fill="#722f8a">Convolutional</tspan>: training pass on the full sequence</text>
    <text x="20" y="70" font-size="11" fill="#5a4a3a">All three are mathematically equivalent; they differ only in compute cost and parallelism.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 680)">
    <rect x="0" y="0" width="1140" height="64" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">S4's superpower: train as a fast parallel convolution, then deploy as a constant-memory RNN, with one shared parameterization.</text>
  </g>
</svg>
