<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Performance vs Compute Under Three Scaling Strategies</text>
  <text x="600" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">On hard reasoning tasks, test-time scaling is more compute-efficient per FLOP than train-time alone</text>

  <!-- Plot area: x=120-1100, y=130-630 -->
  <rect x="120" y="130" width="980" height="500" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>

  <!-- Y-axis: accuracy (linear, 0-100%) -->
  <!-- y=130 = 100%, y=630 = 0%, so each 1% = 5 px -->
  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="120" y1="230" x2="1100" y2="230"/>
    <line x1="120" y1="330" x2="1100" y2="330"/>
    <line x1="120" y1="430" x2="1100" y2="430"/>
    <line x1="120" y1="530" x2="1100" y2="530"/>
  </g>
  <g font-size="12" fill="#5a4a3a" text-anchor="end">
    <text x="115" y="135">100%</text>
    <text x="115" y="234">80%</text>
    <text x="115" y="334">60%</text>
    <text x="115" y="434">40%</text>
    <text x="115" y="534">20%</text>
    <text x="115" y="634">0%</text>
  </g>
  <text x="50" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e" transform="rotate(-90 50 380)">accuracy on hard reasoning tasks</text>

  <!-- X-axis: total compute (log scale FLOPs, 10^18 to 10^25) -->
  <!-- x positions: 10^18=180, 10^19=320, 10^20=460, 10^21=600, 10^22=740, 10^23=880, 10^24=1020 -->
  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="320" y1="130" x2="320" y2="630"/>
    <line x1="460" y1="130" x2="460" y2="630"/>
    <line x1="600" y1="130" x2="600" y2="630"/>
    <line x1="740" y1="130" x2="740" y2="630"/>
    <line x1="880" y1="130" x2="880" y2="630"/>
    <line x1="1020" y1="130" x2="1020" y2="630"/>
  </g>
  <g font-size="11" fill="#5a4a3a" text-anchor="middle">
    <text x="180" y="650">10¹⁸</text>
    <text x="320" y="650">10¹⁹</text>
    <text x="460" y="650">10²⁰</text>
    <text x="600" y="650">10²¹</text>
    <text x="740" y="650">10²²</text>
    <text x="880" y="650">10²³</text>
    <text x="1020" y="650">10²⁴</text>
  </g>
  <text x="610" y="690" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">total compute (FLOPs, log scale)</text>

  <!-- ============================================================ -->
  <!-- Curve 1: TRAIN-TIME (blue) — slow, plateauing                -->
  <!-- ============================================================ -->
  <!-- Starts at (180, 580) ≈ 10%, gradual rise, plateaus around (1020, 280) ≈ 70% -->
  <path d="M 180,580 Q 320,520 460,460 T 740,360 T 1020,290" fill="none" stroke="#1a4078" stroke-width="3.5"/>
  <!-- Data points -->
  <g fill="#1a4078">
    <circle cx="180" cy="580" r="5"/>
    <circle cx="320" cy="510" r="5"/>
    <circle cx="460" cy="450" r="5"/>
    <circle cx="600" cy="400" r="5"/>
    <circle cx="740" cy="360" r="5"/>
    <circle cx="880" cy="320" r="5"/>
    <circle cx="1020" cy="290" r="5"/>
  </g>
  <!-- Label at curve end -->
  <text x="1035" y="295" font-size="13" font-weight="700" fill="#1a4078">Train-time scaling</text>
  <text x="1035" y="312" font-size="11" fill="#5a4a3a" font-style="italic">bigger model, single pass</text>
  <text x="1035" y="328" font-size="11" fill="#5a4a3a" font-style="italic">slope: ~0.05 / decade</text>

  <!-- ============================================================ -->
  <!-- Curve 2: TEST-TIME (green) — steeper, no plateau              -->
  <!-- ============================================================ -->
  <!-- Starts later (450, 580), much steeper -->
  <path d="M 460,580 Q 600,500 740,400 T 1020,200" fill="none" stroke="#1f7a3a" stroke-width="3.5"/>
  <g fill="#1f7a3a">
    <circle cx="460" cy="580" r="5"/>
    <circle cx="600" cy="500" r="5"/>
    <circle cx="740" cy="400" r="5"/>
    <circle cx="880" cy="295" r="5"/>
    <circle cx="1020" cy="200" r="5"/>
  </g>
  <text x="1035" y="205" font-size="13" font-weight="700" fill="#1f7a3a">Test-time scaling</text>
  <text x="1035" y="222" font-size="11" fill="#5a4a3a" font-style="italic">same model, more thinking</text>
  <text x="1035" y="238" font-size="11" fill="#5a4a3a" font-style="italic">slope: ~0.10 / decade</text>

  <!-- ============================================================ -->
  <!-- Curve 3: COMBINED (red dashed) — best frontier                -->
  <!-- ============================================================ -->
  <path d="M 460,520 Q 600,420 740,300 T 1020,150" fill="none" stroke="#b3401b" stroke-width="3.5" stroke-dasharray="8,5"/>
  <g fill="#b3401b">
    <circle cx="460" cy="520" r="5"/>
    <circle cx="600" cy="420" r="5"/>
    <circle cx="740" cy="300" r="5"/>
    <circle cx="880" cy="220" r="5"/>
    <circle cx="1020" cy="150" r="5"/>
  </g>
  <text x="1035" y="155" font-size="13" font-weight="700" fill="#b3401b">Combined</text>
  <text x="1035" y="172" font-size="11" fill="#5a4a3a" font-style="italic">larger model + more thinking</text>
  <text x="1035" y="188" font-size="11" fill="#5a4a3a" font-style="italic">pushes the frontier</text>

  <!-- ============================================================ -->
  <!-- ANNOTATIONS                                                   -->
  <!-- ============================================================ -->

  <!-- Crossover annotation: where test-time overtakes train-time -->
  <g>
    <circle cx="650" cy="450" r="14" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="3,2"/>
    <line x1="664" y1="445" x2="700" y2="420" stroke="#722f8a" stroke-width="1.2"/>
    <rect x="700" y="395" width="160" height="50" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="780" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#722f8a">Crossover</text>
    <text x="780" y="432" text-anchor="middle" font-size="11" fill="#5a4a3a">test-time wins past 10²¹ FLOPs</text>
  </g>

  <!-- Plateau annotation -->
  <g>
    <line x1="940" y1="305" x2="900" y2="380" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="900" y="395" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">train-time plateaus</text>
    <text x="900" y="410" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">around chinchilla-optimal</text>
  </g>

  <!-- Key insight callout -->
  <g transform="translate(140,150)">
    <rect x="0" y="0" width="280" height="100" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="140" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5e1a">Key takeaway</text>
    <text x="15" y="45" font-size="11" fill="#1a1a2e">For HARD reasoning tasks where</text>
    <text x="15" y="61" font-size="11" fill="#1a1a2e">deep thinking helps, spending compute</text>
    <text x="15" y="77" font-size="11" fill="#1a1a2e">at <tspan font-weight="700">inference</tspan> beats spending the same</text>
    <text x="15" y="93" font-size="11" fill="#1a1a2e">compute at <tspan font-weight="700">training</tspan>.</text>
  </g>

  <!-- Legend at bottom -->
  <g transform="translate(140,720)">
    <rect x="0" y="0" width="900" height="50" rx="6" fill="#ffffff" stroke="#5a4a3a" stroke-width="1"/>
    <line x1="20" y1="20" x2="50" y2="20" stroke="#1a4078" stroke-width="3.5"/>
    <text x="60" y="24" font-size="11" fill="#1a1a2e">Train-time: slow, plateaus near chinchilla-optimal</text>
    <line x1="350" y1="20" x2="380" y2="20" stroke="#1f7a3a" stroke-width="3.5"/>
    <text x="390" y="24" font-size="11" fill="#1a1a2e">Test-time: steeper, no plateau yet</text>
    <line x1="650" y1="20" x2="680" y2="20" stroke="#b3401b" stroke-width="3.5" stroke-dasharray="6,4"/>
    <text x="690" y="24" font-size="11" fill="#1a1a2e">Combined: extends the frontier</text>
    <text x="20" y="42" font-size="11" fill="#5a4a3a" font-style="italic">Schematic illustration. Exact slopes depend on task; figure summarizes the qualitative pattern reported in OpenAI o-series and DeepMind Pareto-frontier papers (2024).</text>
  </g>
</svg>
