<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Document chunking with overlap</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">A text splitter cuts a document into fixed-size chunks; consecutive chunks share a small overlap so context is not lost at boundaries.</text>

  <!-- Source document (top) -->
  <g transform="translate(450, 110)">
    <rect width="400" height="80" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="200" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">Document Text</text>
    <text x="200" y="58" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">long string, e.g. an article or PDF page</text>
  </g>

  <!-- Splitter step labels -->
  <line x1="650" y1="190" x2="650" y2="240" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="670" y="220" font-size="11" font-weight="700" fill="#5a4a3a">RecursiveCharacterTextSplitter</text>

  <!-- Chunks row -->
  <g transform="translate(80, 260)">
    <!-- Chunk 1 -->
    <rect x="0" y="0" width="260" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="130" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Chunk 1</text>
    <text x="130" y="50" font-size="11" text-anchor="middle" fill="#5a4a3a">tokens 0 to 500</text>
    <text x="130" y="74" font-size="11" text-anchor="middle" fill="#1a1a2e">"Vector databases store"</text>
    <text x="130" y="90" font-size="11" text-anchor="middle" fill="#1a1a2e">"high-dimensional"</text>
    <!-- overlap region marker -->
    <rect x="195" y="98" width="65" height="22" fill="#fff5dc" stroke="#d4b96a" stroke-width="1"/>
    <text x="227" y="114" font-size="11" text-anchor="middle" fill="#7a5e1a">overlap</text>

    <!-- Chunk 2 -->
    <rect x="280" y="0" width="260" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="410" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Chunk 2</text>
    <text x="410" y="50" font-size="11" text-anchor="middle" fill="#5a4a3a">tokens 450 to 950</text>
    <text x="410" y="74" font-size="11" text-anchor="middle" fill="#1a1a2e">"vectors and let you"</text>
    <text x="410" y="90" font-size="11" text-anchor="middle" fill="#1a1a2e">"query by similarity"</text>
    <rect x="278" y="98" width="65" height="22" fill="#fff5dc" stroke="#d4b96a" stroke-width="1"/>
    <text x="310" y="114" font-size="11" text-anchor="middle" fill="#7a5e1a">overlap</text>
    <rect x="475" y="98" width="65" height="22" fill="#fff5dc" stroke="#d4b96a" stroke-width="1"/>
    <text x="507" y="114" font-size="11" text-anchor="middle" fill="#7a5e1a">overlap</text>

    <!-- Chunk 3 -->
    <rect x="560" y="0" width="260" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="690" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Chunk 3</text>
    <text x="690" y="50" font-size="11" text-anchor="middle" fill="#5a4a3a">tokens 900 to 1400</text>
    <text x="690" y="74" font-size="11" text-anchor="middle" fill="#1a1a2e">"using cosine distance"</text>
    <text x="690" y="90" font-size="11" text-anchor="middle" fill="#1a1a2e">"or dot product."</text>
    <rect x="558" y="98" width="65" height="22" fill="#fff5dc" stroke="#d4b96a" stroke-width="1"/>
    <text x="590" y="114" font-size="11" text-anchor="middle" fill="#7a5e1a">overlap</text>
    <rect x="755" y="98" width="65" height="22" fill="#fff5dc" stroke="#d4b96a" stroke-width="1"/>
    <text x="787" y="114" font-size="11" text-anchor="middle" fill="#7a5e1a">overlap</text>

    <!-- Chunk 4 -->
    <rect x="840" y="0" width="260" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="970" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Chunk 4</text>
    <text x="970" y="50" font-size="11" text-anchor="middle" fill="#5a4a3a">tokens 1350 to 1850</text>
    <text x="970" y="74" font-size="11" text-anchor="middle" fill="#1a1a2e">"FAISS and Chroma are"</text>
    <text x="970" y="90" font-size="11" text-anchor="middle" fill="#1a1a2e">"common choices."</text>
    <rect x="838" y="98" width="65" height="22" fill="#fff5dc" stroke="#d4b96a" stroke-width="1"/>
    <text x="870" y="114" font-size="11" text-anchor="middle" fill="#7a5e1a">overlap</text>
  </g>

  <!-- Source-to-chunk arrows -->
  <line x1="500" y1="240" x2="210" y2="258" stroke="#1a4078" stroke-width="1.5" marker-end="url(#arr)" opacity="0.6"/>
  <line x1="600" y1="240" x2="490" y2="258" stroke="#1a4078" stroke-width="1.5" marker-end="url(#arr)" opacity="0.6"/>
  <line x1="700" y1="240" x2="770" y2="258" stroke="#1a4078" stroke-width="1.5" marker-end="url(#arr)" opacity="0.6"/>
  <line x1="800" y1="240" x2="1050" y2="258" stroke="#1a4078" stroke-width="1.5" marker-end="url(#arr)" opacity="0.6"/>

  <!-- Annotation panels -->
  <g transform="translate(80, 420)">
    <rect width="560" height="120" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why overlap?</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">Naive splits can cut a sentence (or an entity name) in half,</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">losing the meaning at the boundary. Overlap (typically 10-20%</text>
    <text x="20" y="86" font-size="12" fill="#1a1a2e">of chunk size) ensures the same key phrase appears in two</text>
    <text x="20" y="104" font-size="12" fill="#1a1a2e">adjacent chunks, so retrieval still finds it either way.</text>
  </g>

  <g transform="translate(680, 420)">
    <rect width="540" height="120" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#5a4a3a">Tuning chunk_size and chunk_overlap</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">- Bigger chunks: more context per match, fewer vectors,</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">  but coarser retrieval and risk of exceeding context window</text>
    <text x="20" y="90" font-size="12" fill="#1a1a2e">- Smaller chunks: precise hits, more vectors to store,</text>
    <text x="20" y="108" font-size="12" fill="#1a1a2e">  higher chance of fragmenting an answer across chunks</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 570)">
    <rect width="1140" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Splitters cut a document into fixed-size chunks with a small overlap; the overlap preserves cross-boundary context so</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">retrieval does not miss a phrase that happened to fall on a cut line.</text>
  </g>
</svg>
