<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 750" font-family="Helvetica, Arial, sans-serif">
  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Top-p (Nucleus) Sampling Adapts to Confidence</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Keep the smallest set of tokens whose probabilities sum to ≥ p — automatically narrows when the model is confident</text>

  <!-- LEFT: Confident -->
  <g>
    <rect x="60" y="100" width="580" height="500" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="350" y="132" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Confident: peaked distribution</text>
    <text x="350" y="156" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">"The capital of France is __" — model knows the answer</text>

    <!-- Bars -->
    <line x1="100" y1="430" x2="600" y2="430" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="350" y="465" font-size="12" text-anchor="middle" fill="#5a4a3a">candidate tokens →</text>
    <text x="78" y="320" font-size="11" text-anchor="middle" fill="#5a4a3a" transform="rotate(-90 78 320)">probability</text>

    <!-- Tokens IN nucleus -->
    <rect x="115" y="180" width="60" height="250" fill="#1f7a3a"/>
    <text x="145" y="170" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Paris</text>
    <text x="145" y="450" font-size="11" text-anchor="middle" fill="#1a1a2e">0.70</text>

    <rect x="195" y="350" width="60" height="80" fill="#1f7a3a"/>
    <text x="225" y="340" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Lyon</text>
    <text x="225" y="450" font-size="11" text-anchor="middle" fill="#1a1a2e">0.22</text>

    <!-- Cutoff line -->
    <line x1="270" y1="430" x2="270" y2="170" stroke="#1f7a3a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="282" y="190" font-size="12" font-weight="700" fill="#1f7a3a">cutoff at p=0.9</text>

    <!-- Tokens OUTSIDE nucleus (faded) -->
    <rect x="290" y="412" width="60" height="18" fill="#cfd8e3"/>
    <text x="320" y="402" font-size="11" text-anchor="middle" fill="#5a4a3a">Rome</text>
    <text x="320" y="450" font-size="11" text-anchor="middle" fill="#5a4a3a">0.05</text>

    <rect x="370" y="420" width="60" height="10" fill="#cfd8e3"/>
    <text x="400" y="410" font-size="11" text-anchor="middle" fill="#5a4a3a">Berlin</text>
    <text x="400" y="450" font-size="11" text-anchor="middle" fill="#5a4a3a">0.02</text>

    <rect x="450" y="424" width="60" height="6" fill="#cfd8e3"/>
    <text x="480" y="414" font-size="11" text-anchor="middle" fill="#5a4a3a">others</text>
    <text x="480" y="450" font-size="11" text-anchor="middle" fill="#5a4a3a">0.01</text>

    <!-- Result -->
    <rect x="100" y="500" width="500" height="80" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="2"/>
    <text x="350" y="525" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Nucleus contains 2 tokens</text>
    <text x="350" y="548" font-size="12" text-anchor="middle" fill="#1a1a2e">sample only from {Paris, Lyon}, renormalized</text>
    <text x="350" y="568" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">model picks Paris ~76% of the time, Lyon ~24%</text>
  </g>

  <!-- RIGHT: Uncertain -->
  <g>
    <rect x="660" y="100" width="580" height="500" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="950" y="132" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">Uncertain: flat distribution</text>
    <text x="950" y="156" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">"My favorite hobby is to __" — many valid completions</text>

    <line x1="700" y1="430" x2="1200" y2="430" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="950" y="465" font-size="12" text-anchor="middle" fill="#5a4a3a">candidate tokens →</text>
    <text x="678" y="320" font-size="11" text-anchor="middle" fill="#5a4a3a" transform="rotate(-90 678 320)">probability</text>

    <rect x="715" y="350" width="48" height="80" fill="#7a5e1a"/>
    <text x="739" y="340" font-size="11" font-weight="700" text-anchor="middle" fill="#7a5e1a">eat</text>
    <text x="739" y="450" font-size="11" text-anchor="middle" fill="#1a1a2e">0.24</text>

    <rect x="775" y="361" width="48" height="69" fill="#7a5e1a"/>
    <text x="799" y="351" font-size="11" font-weight="700" text-anchor="middle" fill="#7a5e1a">run</text>
    <text x="799" y="450" font-size="11" text-anchor="middle" fill="#1a1a2e">0.21</text>

    <rect x="835" y="370" width="48" height="60" fill="#7a5e1a"/>
    <text x="859" y="360" font-size="11" font-weight="700" text-anchor="middle" fill="#7a5e1a">play</text>
    <text x="859" y="450" font-size="11" text-anchor="middle" fill="#1a1a2e">0.19</text>

    <rect x="895" y="376" width="48" height="54" fill="#7a5e1a"/>
    <text x="919" y="366" font-size="11" font-weight="700" text-anchor="middle" fill="#7a5e1a">read</text>
    <text x="919" y="450" font-size="11" text-anchor="middle" fill="#1a1a2e">0.16</text>

    <rect x="955" y="387" width="48" height="43" fill="#7a5e1a"/>
    <text x="979" y="377" font-size="11" font-weight="700" text-anchor="middle" fill="#7a5e1a">swim</text>
    <text x="979" y="450" font-size="11" text-anchor="middle" fill="#1a1a2e">0.12</text>

    <line x1="1018" y1="430" x2="1018" y2="170" stroke="#7a5e1a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1030" y="190" font-size="12" font-weight="700" fill="#7a5e1a">cutoff at p=0.9</text>

    <!-- Outside (faded) -->
    <rect x="1035" y="396" width="48" height="34" fill="#cfd8e3"/>
    <text x="1059" y="386" font-size="11" text-anchor="middle" fill="#5a4a3a">cook</text>
    <text x="1059" y="450" font-size="11" text-anchor="middle" fill="#5a4a3a">0.08</text>

    <rect x="1095" y="411" width="48" height="19" fill="#cfd8e3"/>
    <text x="1119" y="401" font-size="11" text-anchor="middle" fill="#5a4a3a">code</text>
    <text x="1119" y="450" font-size="11" text-anchor="middle" fill="#5a4a3a">0.05</text>

    <rect x="1155" y="421" width="40" height="9" fill="#cfd8e3"/>
    <text x="1175" y="411" font-size="11" text-anchor="middle" fill="#5a4a3a">others</text>
    <text x="1175" y="450" font-size="11" text-anchor="middle" fill="#5a4a3a">0.02</text>

    <rect x="700" y="500" width="500" height="80" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="2"/>
    <text x="950" y="525" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Nucleus contains 5 tokens</text>
    <text x="950" y="548" font-size="12" text-anchor="middle" fill="#1a1a2e">sample from {eat, run, play, read, swim}, renormalized</text>
    <text x="950" y="568" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">diverse output, all reasonable</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1180" height="100" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7a5e1a">Why "nucleus" beats top-k</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Top-k always keeps exactly k tokens, regardless of the distribution shape — wasteful when peaked, restrictive when flat.</text>
    <text x="20" y="72" font-size="12" fill="#1a1a2e">Top-p (nucleus) keeps a variable count: a few when the model is confident, many when it's uncertain.</text>
    <text x="20" y="92" font-size="12" font-style="italic" fill="#5a4a3a">Typical settings: p = 0.9–0.95, often combined with temperature for further control.</text>
  </g>
</svg>
