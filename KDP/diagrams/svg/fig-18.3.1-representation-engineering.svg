<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Representation engineering: extract a direction, then steer with it</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Contrastive prompts reveal a direction in activation space; adding a scaled copy of that vector at inference time steers behavior.</text>

  <!-- STAGE 1: extraction -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="560" height="460" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="280" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">Stage 1: control vector extraction</text>

    <!-- Step E1: contrastive prompts -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="500" height="110" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a4078">E1. Run model on contrastive prompts</text>

      <rect x="14" y="36" width="220" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
      <text x="124" y="56" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">positive set</text>
      <text x="124" y="78" font-size="11" text-anchor="middle" fill="#1a1a2e">"Be honest..."</text>
      <text x="124" y="92" font-size="11" text-anchor="middle" fill="#1a1a2e">"Tell the truth..."</text>

      <rect x="266" y="36" width="220" height="60" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
      <text x="376" y="56" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">negative set</text>
      <text x="376" y="78" font-size="11" text-anchor="middle" fill="#1a1a2e">"Be deceptive..."</text>
      <text x="376" y="92" font-size="11" text-anchor="middle" fill="#1a1a2e">"Make up a story..."</text>
    </g>

    <line x1="310" y1="170" x2="310" y2="200" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- Step E2: extract direction -->
    <g transform="translate(30, 200)">
      <rect x="0" y="0" width="500" height="100" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1a4078">E2. Extract direction in activation space</text>
      <text x="14" y="44" font-size="12" fill="#1a1a2e">Mean of positive activations minus mean of negative activations</text>
      <text x="14" y="62" font-size="12" fill="#1a1a2e">(or first principal component of the difference set).</text>
      <text x="14" y="86" font-size="12" font-style="italic" fill="#5a4a3a">Result: a single d_model-dim "control vector" v.</text>
    </g>

    <line x1="310" y1="300" x2="310" y2="330" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- Output: vector -->
    <g transform="translate(140, 330)">
      <rect x="0" y="0" width="280" height="100" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="140" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">control_vector v</text>
      <text x="140" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">stored once, reused at inference</text>
      <!-- vector ticks visual -->
      <g transform="translate(20, 64)">
        <rect x="0" y="0" width="240" height="22" rx="3" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
        <line x1="20" y1="11" x2="220" y2="11" stroke="#722f8a" stroke-width="2"/>
        <circle cx="60" cy="11" r="3" fill="#722f8a"/>
        <circle cx="110" cy="11" r="3" fill="#722f8a"/>
        <circle cx="160" cy="11" r="3" fill="#722f8a"/>
        <circle cx="200" cy="11" r="3" fill="#722f8a"/>
      </g>
    </g>
  </g>

  <!-- Arrow between stages -->
  <line x1="625" y1="330" x2="685" y2="330" stroke="#1a1a2e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="655" y="320" font-size="11" text-anchor="middle" fill="#5a4a3a">apply</text>

  <!-- STAGE 2: steering -->
  <g transform="translate(690, 100)">
    <rect x="0" y="0" width="550" height="460" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="275" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Stage 2: steered generation</text>

    <!-- input x -->
    <g transform="translate(40, 90)">
      <rect x="0" y="0" width="120" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
      <text x="60" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">x</text>
      <text x="60" y="46" font-size="11" text-anchor="middle" fill="#5a4a3a">layer input</text>
    </g>

    <line x1="160" y1="120" x2="200" y2="120" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- transformer layer -->
    <g transform="translate(200, 90)">
      <rect x="0" y="0" width="180" height="60" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="2"/>
      <text x="90" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">transformer_layer</text>
      <text x="90" y="46" font-size="11" text-anchor="middle" fill="#5a4a3a">attn + MLP</text>
    </g>

    <line x1="380" y1="120" x2="420" y2="120" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- h -->
    <g transform="translate(420, 90)">
      <rect x="0" y="0" width="90" height="60" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="45" y="34" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">h</text>
      <text x="45" y="50" font-size="11" text-anchor="middle" fill="#5a4a3a">hidden state</text>
    </g>

    <!-- + alpha * v step -->
    <g transform="translate(80, 210)">
      <rect x="0" y="0" width="400" height="80" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="200" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">add control: + alpha * v</text>
      <text x="200" y="54" font-size="12" text-anchor="middle" fill="#1a1a2e">alpha tunes strength; sign tunes direction</text>
      <text x="200" y="70" font-size="11" text-anchor="middle" fill="#5a4a3a">(positive alpha pushes toward the positive trait)</text>
    </g>

    <line x1="465" y1="155" x2="350" y2="205" stroke="#1a1a2e" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arr)"/>

    <line x1="280" y1="290" x2="280" y2="320" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- h prime -->
    <g transform="translate(140, 320)">
      <rect x="0" y="0" width="280" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="140" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">h' = steered hidden state</text>
      <text x="140" y="54" font-size="12" text-anchor="middle" fill="#1a1a2e">passed to the next layer as usual</text>
      <text x="140" y="70" font-size="11" text-anchor="middle" fill="#5a4a3a">no weight changes required</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Representation engineering trades retraining for vector arithmetic: contrast captures a direction once, then alpha at inference dials behavior up or down.</text>
  </g>
</svg>
