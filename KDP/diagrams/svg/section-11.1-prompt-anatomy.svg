<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="650" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Anatomy of a Chat-Completion Prompt</text>
  <text x="650" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">Three message roles: system (sets the rules), few-shot (calibrates the format), user (asks the question)</text>

  <!-- ============================================================ -->
  <!-- ANNOTATED EXAMPLE (left side - the actual prompt)             -->
  <!-- ============================================================ -->
  <g filter="url(#sh)">
    <rect x="60" y="100" width="650" height="640" rx="10" fill="#fafbfc" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="385" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Real prompt (sent to the API)</text>
    <line x1="80" y1="140" x2="690" y2="140" stroke="#1a1a2e" stroke-width="0.8"/>
  </g>

  <!-- System message block -->
  <g filter="url(#sh)">
    <rect x="80" y="155" width="610" height="155" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="95" y="178" font-size="12" font-weight="700" fill="#1a4078">{ "role": "system", "content": </text>
    <text x="95" y="200" font-size="13" fill="#1a1a2e" font-family="Cambria Math, Cambria, Times, serif">    "You are a senior Python developer.</text>
    <text x="95" y="218" font-size="13" fill="#1a1a2e" font-family="Cambria Math, Cambria, Times, serif">     Classify the following code snippets by bug type.</text>
    <text x="95" y="236" font-size="13" fill="#1a1a2e" font-family="Cambria Math, Cambria, Times, serif">     Output JSON with keys: bug_type, severity, fix."</text>
    <text x="95" y="258" font-size="12" font-weight="700" fill="#1a4078">}</text>
    <line x1="95" y1="270" x2="675" y2="270" stroke="#1a4078" stroke-width="0.5" stroke-dasharray="3,2"/>
    <text x="95" y="288" font-size="11" fill="#5a4a3a" font-style="italic">→ Persists for the entire conversation. Sets persona, task, and output format.</text>
  </g>

  <!-- Few-shot examples block -->
  <g filter="url(#sh)">
    <rect x="80" y="325" width="610" height="195" rx="6" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <text x="95" y="348" font-size="12" font-weight="700" fill="#7a5e1a">{ "role": "user",  "content": "def divide(a, b): return a/b" },</text>
    <text x="95" y="370" font-size="12" font-weight="700" fill="#7a5e1a">{ "role": "assistant", "content": </text>
    <text x="95" y="388" font-size="13" fill="#1a1a2e" font-family="Cambria Math, Cambria, Times, serif">    "{ \"bug_type\": \"DivisionByZero\", \"severity\": \"high\", ..." },</text>
    <text x="95" y="410" font-size="12" font-weight="700" fill="#7a5e1a">{ "role": "user",  "content": "x = [1,2,3]; print(x[5])" },</text>
    <text x="95" y="432" font-size="12" font-weight="700" fill="#7a5e1a">{ "role": "assistant", "content": </text>
    <text x="95" y="450" font-size="13" fill="#1a1a2e" font-family="Cambria Math, Cambria, Times, serif">    "{ \"bug_type\": \"IndexError\", \"severity\": \"medium\", ..." },</text>
    <line x1="95" y1="465" x2="675" y2="465" stroke="#7a5e1a" stroke-width="0.5" stroke-dasharray="3,2"/>
    <text x="95" y="483" font-size="11" fill="#5a4a3a" font-style="italic">→ Optional. Few-shot examples calibrate the EXACT output format the model should produce.</text>
    <text x="95" y="502" font-size="11" fill="#5a4a3a" font-style="italic">   Without these, the model may output Markdown or prose instead of JSON.</text>
  </g>

  <!-- User message block -->
  <g filter="url(#sh)">
    <rect x="80" y="535" width="610" height="135" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="95" y="558" font-size="12" font-weight="700" fill="#1f7a3a">{ "role": "user", "content": </text>
    <text x="95" y="580" font-size="13" fill="#1a1a2e" font-family="Cambria Math, Cambria, Times, serif">    "def process(items):</text>
    <text x="95" y="598" font-size="13" fill="#1a1a2e" font-family="Cambria Math, Cambria, Times, serif">         total = 0</text>
    <text x="95" y="616" font-size="13" fill="#1a1a2e" font-family="Cambria Math, Cambria, Times, serif">         for i in items: total += i.value"</text>
    <text x="95" y="635" font-size="12" font-weight="700" fill="#1f7a3a">}</text>
    <line x1="95" y1="647" x2="675" y2="647" stroke="#1f7a3a" stroke-width="0.5" stroke-dasharray="3,2"/>
    <text x="95" y="664" font-size="11" fill="#5a4a3a" font-style="italic">→ The actual question. The model produces an assistant message in response.</text>
  </g>

  <text x="385" y="710" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Total prompt sent to API → model generates assistant reply</text>

  <!-- ============================================================ -->
  <!-- LABEL CALLOUTS (right side)                                   -->
  <!-- ============================================================ -->

  <!-- Callout for system message -->
  <g transform="translate(750, 175)">
    <rect x="0" y="0" width="490" height="115" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="20" y="22" font-size="14" font-weight="700" fill="#1a4078">1.  System Message  (role: system)</text>
    <text x="20" y="44" font-size="12" fill="#1a1a2e">Defines the model's identity, task, and constraints.</text>
    <text x="20" y="62" font-size="12" fill="#1a1a2e">Highest priority — overrides instructions in user messages.</text>
    <text x="20" y="84" font-size="11" fill="#5a4a3a" font-style="italic">Best for: persona ("you are a..."), output format ("JSON only..."),</text>
    <text x="20" y="100" font-size="11" fill="#5a4a3a" font-style="italic">refusal rules ("don't answer questions about X").</text>
  </g>
  <line x1="700" y1="232" x2="745" y2="232" stroke="#1a4078" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Callout for few-shot -->
  <g transform="translate(750, 350)">
    <rect x="0" y="0" width="490" height="135" rx="8" fill="#fef3e0" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="14" font-weight="700" fill="#7a5e1a">2.  Few-Shot Examples  (alternating user/assistant)</text>
    <text x="20" y="44" font-size="12" fill="#1a1a2e">2-5 input/output pairs showing the model what "right" looks like.</text>
    <text x="20" y="62" font-size="12" fill="#1a1a2e">Can be omitted (zero-shot) for simple tasks.</text>
    <text x="20" y="84" font-size="11" fill="#5a4a3a" font-style="italic">Best for: niche output formats, rare edge cases, calibrating</text>
    <text x="20" y="100" font-size="11" fill="#5a4a3a" font-style="italic">verbosity / tone / length. Usually skip for &gt;5 examples</text>
    <text x="20" y="116" font-size="11" fill="#5a4a3a" font-style="italic">— consider fine-tuning instead.</text>
  </g>
  <line x1="700" y1="423" x2="745" y2="423" stroke="#d4b96a" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Callout for user -->
  <g transform="translate(750, 545)">
    <rect x="0" y="0" width="490" height="115" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="14" font-weight="700" fill="#1f7a3a">3.  User Message  (role: user)</text>
    <text x="20" y="44" font-size="12" fill="#1a1a2e">The actual query / input data the user wants processed.</text>
    <text x="20" y="62" font-size="12" fill="#1a1a2e">Always the LAST message in the array.</text>
    <text x="20" y="84" font-size="11" fill="#5a4a3a" font-style="italic">Tip: include any context (retrieved chunks, conversation</text>
    <text x="20" y="100" font-size="11" fill="#5a4a3a" font-style="italic">history) HERE, not in the system message.</text>
  </g>
  <line x1="700" y1="603" x2="745" y2="603" stroke="#1f7a3a" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
