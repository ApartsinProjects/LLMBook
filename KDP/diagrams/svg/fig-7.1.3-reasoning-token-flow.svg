<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrMute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">Reasoning Token Flow in Test-Time Compute Models</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">The model thinks in private before it answers; you pay for both, but you only see one.</text>

  <!-- 4-stage pipeline horizontal -->
  <!-- positions: 60, 340, 660, 980 width 240 height 130 y=210 -->

  <g>
    <rect x="60" y="210" width="240" height="130" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="180" y="244" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a2e">1. Prompt</text>
    <text x="180" y="270" font-size="12" text-anchor="middle" fill="#5a4a3a">User input</text>
    <text x="180" y="296" font-size="12" text-anchor="middle" fill="#5a4a3a">e.g., "Solve this proof"</text>
    <text x="180" y="322" font-size="12" font-style="italic" text-anchor="middle" fill="#1a4078">~50 to 500 tokens</text>
  </g>

  <line x1="305" y1="275" x2="335" y2="275" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="340" y="210" width="320" height="130" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2.5"/>
    <text x="500" y="244" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a2e">2. Thinking tokens</text>
    <text x="500" y="270" font-size="12" text-anchor="middle" fill="#5a4a3a">Internal scratchpad: try, check, backtrack</text>
    <text x="500" y="294" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">5,000 to 50,000+ tokens</text>
    <text x="500" y="320" font-size="12" font-style="italic" text-anchor="middle" fill="#7a5e1a">billed, but usually hidden</text>
  </g>

  <line x1="665" y1="275" x2="695" y2="275" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="700" y="210" width="240" height="130" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="820" y="244" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a2e">3. Answer tokens</text>
    <text x="820" y="270" font-size="12" text-anchor="middle" fill="#5a4a3a">The visible reply</text>
    <text x="820" y="296" font-size="12" text-anchor="middle" fill="#5a4a3a">distilled conclusion</text>
    <text x="820" y="322" font-size="12" font-style="italic" text-anchor="middle" fill="#1f7a3a">~100 to 2,000 tokens</text>
  </g>

  <line x1="945" y1="275" x2="975" y2="275" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="980" y="210" width="240" height="130" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="1100" y="244" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a2e">4. API response</text>
    <text x="1100" y="270" font-size="12" text-anchor="middle" fill="#5a4a3a">JSON with usage:</text>
    <text x="1100" y="296" font-size="12" text-anchor="middle" fill="#5a4a3a">prompt + reasoning +</text>
    <text x="1100" y="318" font-size="12" text-anchor="middle" fill="#5a4a3a">completion tokens</text>
  </g>

  <!-- Vendor visibility branch off Thinking tokens -->
  <line x1="500" y1="340" x2="500" y2="395" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrMute)"/>

  <g transform="translate(220, 400)">
    <rect x="0" y="0" width="560" height="110" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#722f8a">Vendor policy: who sees the thinking?</text>
    <line x1="20" y1="38" x2="540" y2="38" stroke="#722f8a" stroke-width="0.5" opacity="0.4"/>
    <text x="20" y="62" font-size="12" font-weight="700" fill="#1a1a2e">OpenAI o-series:</text>
    <text x="160" y="62" font-size="12" fill="#1a1a2e">hidden from user, still billed by token count</text>
    <text x="20" y="84" font-size="12" font-weight="700" fill="#1a1a2e">DeepSeek R1:</text>
    <text x="160" y="84" font-size="12" fill="#1a1a2e">streamed back as visible reasoning_content field</text>
    <text x="20" y="104" font-size="12" font-weight="700" fill="#1a1a2e">Anthropic ext. thinking:</text>
    <text x="200" y="104" font-size="12" fill="#1a1a2e">opt-in visible thinking blocks, billed separately</text>
  </g>

  <!-- Cost callout right side -->
  <g transform="translate(820, 400)">
    <rect x="0" y="0" width="400" height="110" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Use when</text>
    <text x="16" y="50" font-size="12" fill="#1a1a2e">Hard reasoning: math proofs, multi-step</text>
    <text x="16" y="68" font-size="12" fill="#1a1a2e">planning, debugging, code refactor.</text>
    <text x="16" y="92" font-size="12" fill="#1a1a2e">Avoid for short factual lookups: the thinking</text>
    <text x="16" y="106" font-size="12" fill="#1a1a2e">budget dwarfs the answer cost.</text>
  </g>

  <!-- Token width visualization: a stacked horizontal bar showing relative volume -->
  <g transform="translate(60, 540)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#1a1a2e">Relative token volume in one request (illustrative)</text>
    <!-- bar: prompt 40, thinking 700, answer 120 (total 860 of 1160 px) -->
    <rect x="0" y="14" width="40" height="22" fill="#1a4078"/>
    <rect x="40" y="14" width="700" height="22" fill="#7a5e1a"/>
    <rect x="740" y="14" width="120" height="22" fill="#1f7a3a"/>
    <text x="20" y="56" font-size="11" text-anchor="middle" fill="#1a4078">prompt</text>
    <text x="390" y="56" font-size="11" text-anchor="middle" fill="#7a5e1a">thinking (largest, often 80%+ of bill)</text>
    <text x="800" y="56" font-size="11" text-anchor="middle" fill="#1f7a3a">answer</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Reasoning models trade latency and tokens for accuracy. The hidden thinking phase is where the work happens, and where the bill is hiding.</text>
  </g>
</svg>
