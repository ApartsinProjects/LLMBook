<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">Bolt-On vs Native Multimodality</text>
  <text x="650" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Two architectures for "the model that sees": glue an encoder onto a frozen LLM, or train every modality together from scratch.</text>

  <!-- LEFT LANE: BOLT-ON -->
  <g>
    <rect x="40" y="90" width="610" height="500" rx="12" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="345" y="118" font-size="17" font-weight="700" text-anchor="middle" fill="#b3401b">Bolt-On Multimodal (GPT-4V style)</text>
    <text x="345" y="138" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Modalities pre-trained separately, stitched at the boundary.</text>

    <!-- Vision Encoder -->
    <rect x="80" y="170" width="200" height="70" rx="8" fill="#ffffff" stroke="#b3401b" stroke-width="2"/>
    <text x="180" y="200" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Vision Encoder</text>
    <text x="180" y="220" font-size="12" text-anchor="middle" fill="#5a4a3a">ViT, image patches</text>

    <!-- Text Tokenizer -->
    <rect x="410" y="170" width="200" height="70" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <text x="510" y="200" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Text Tokenizer</text>
    <text x="510" y="220" font-size="12" text-anchor="middle" fill="#5a4a3a">BPE on raw bytes</text>

    <!-- Linear Adapter (the seam) -->
    <rect x="80" y="270" width="200" height="60" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="180" y="296" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">Linear Adapter</text>
    <text x="180" y="316" font-size="11" text-anchor="middle" fill="#b3401b">projects ViT &#8594; LLM space</text>

    <!-- Text Embeddings -->
    <rect x="410" y="270" width="200" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="510" y="296" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Text Embeddings</text>
    <text x="510" y="316" font-size="11" text-anchor="middle" fill="#5a4a3a">native to the LLM</text>

    <!-- Arrows in -->
    <line x1="180" y1="240" x2="180" y2="265" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="510" y1="240" x2="510" y2="265" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="180" y1="330" x2="180" y2="375" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="510" y1="330" x2="510" y2="375" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- LLM backbone (frozen) -->
    <rect x="80" y="380" width="530" height="80" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="345" y="412" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">LLM Backbone</text>
    <text x="345" y="434" font-size="12" text-anchor="middle" fill="#5a4a3a">pre-trained on text only, often frozen during alignment</text>
    <text x="345" y="452" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(snowflake = parameters not updated)</text>

    <!-- Gap callout -->
    <rect x="80" y="490" width="530" height="80" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="100" y="514" font-size="13" font-weight="700" fill="#b3401b">Representational gap</text>
    <text x="100" y="534" font-size="12" fill="#1a1a2e">Vision and text features live in different geometries.</text>
    <text x="100" y="552" font-size="12" fill="#1a1a2e">The adapter learns a translation; subtle visual cues</text>
    <text x="100" y="568" font-size="12" fill="#1a1a2e">(layout, fine OCR, charts) leak through the seam.</text>
  </g>

  <!-- RIGHT LANE: NATIVE -->
  <g>
    <rect x="660" y="90" width="610" height="500" rx="12" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="965" y="118" font-size="17" font-weight="700" text-anchor="middle" fill="#1f7a3a">Native Multimodal (Gemini, GPT-4o style)</text>
    <text x="965" y="138" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">All modalities tokenized into a shared space, jointly pre-trained.</text>

    <!-- Three input streams -->
    <rect x="690" y="170" width="170" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="775" y="198" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Image</text>
    <text x="775" y="220" font-size="12" text-anchor="middle" fill="#5a4a3a">patches</text>

    <rect x="880" y="170" width="170" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="965" y="198" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Audio</text>
    <text x="965" y="220" font-size="12" text-anchor="middle" fill="#5a4a3a">spectrogram frames</text>

    <rect x="1070" y="170" width="170" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="1155" y="198" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Text</text>
    <text x="1155" y="220" font-size="12" text-anchor="middle" fill="#5a4a3a">BPE tokens</text>

    <line x1="775" y1="240" x2="900" y2="285" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="965" y1="240" x2="965" y2="285" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="1155" y1="240" x2="1030" y2="285" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Unified embedding space -->
    <rect x="690" y="290" width="550" height="80" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="965" y="320" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Unified Token / Embedding Space</text>
    <text x="965" y="344" font-size="12" text-anchor="middle" fill="#5a4a3a">jointly optimized across all modalities from step 0</text>
    <text x="965" y="362" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">no adapter, no projection seam</text>

    <line x1="965" y1="370" x2="965" y2="395" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Single Transformer -->
    <rect x="690" y="400" width="550" height="80" rx="10" fill="#1a1a2e" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="965" y="430" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Single Transformer Stack</text>
    <text x="965" y="452" font-size="12" text-anchor="middle" fill="#ecf6ee">cross-modal attention, every token attends to every other token</text>
    <text x="965" y="470" font-size="11" font-style="italic" text-anchor="middle" fill="#ecf6ee">image patches and words flow through identical layers</text>

    <!-- Benefit callout -->
    <rect x="690" y="500" width="550" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="710" y="524" font-size="13" font-weight="700" fill="#1f7a3a">No adapter gap</text>
    <text x="710" y="544" font-size="12" fill="#1a1a2e">Joint training objective forces all modalities to share gradients.</text>
    <text x="710" y="562" font-size="12" fill="#1a1a2e">Enables emergent skills: voice with affect, image generation, audio reasoning.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Bolt-on is faster to ship and cheaper to retrofit; native is harder to train but unlocks tighter cross-modal grounding and end-to-end generation.</text>
  </g>
</svg>
