<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Four Positional Encoding Strategies</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">How transformers learn the difference between "dog bites man" and "man bites dog".</text>

  <!-- Column 1: Sinusoidal -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="285" height="430" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="285" height="44" rx="10" fill="#1a4078"/>
    <text x="142" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Sinusoidal</text>

    <!-- mini sine waves -->
    <g transform="translate(20, 60)">
      <path d="M 0 30 Q 20 5 40 30 T 80 30 T 120 30 T 160 30 T 200 30 T 240 30" fill="none" stroke="#1a4078" stroke-width="1.6"/>
      <path d="M 0 60 Q 30 35 60 60 T 120 60 T 180 60 T 240 60" fill="none" stroke="#3d6fa8" stroke-width="1.4" opacity="0.7"/>
      <path d="M 0 85 Q 40 60 80 85 T 160 85 T 240 85" fill="none" stroke="#6991c2" stroke-width="1.2" opacity="0.6"/>
    </g>

    <text x="142" y="180" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">fixed sin / cos waves of varied freq</text>

    <line x1="15" y1="200" x2="270" y2="200" stroke="#1a4078" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <text x="15" y="225" font-size="12" font-weight="700" fill="#1a4078">Type</text>
    <text x="15" y="243" font-size="12" fill="#1a1a2e">Absolute, additive at input</text>

    <text x="15" y="271" font-size="12" font-weight="700" fill="#1a4078">Params</text>
    <text x="15" y="289" font-size="12" fill="#1a1a2e">0 (closed-form)</text>

    <text x="15" y="317" font-size="12" font-weight="700" fill="#1a4078">Extrapolation</text>
    <text x="15" y="335" font-size="12" fill="#1a1a2e">Limited beyond train length</text>

    <text x="15" y="363" font-size="12" font-weight="700" fill="#1a4078">Used by</text>
    <text x="15" y="381" font-size="12" fill="#1a1a2e">Vaswani 2017 Transformer</text>
    <text x="15" y="397" font-size="12" fill="#1a1a2e">(the original)</text>
  </g>

  <!-- Column 2: Learned -->
  <g transform="translate(365, 110)">
    <rect x="0" y="0" width="285" height="430" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="285" height="44" rx="10" fill="#1f7a3a"/>
    <text x="142" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Learned</text>

    <!-- table of N x d slots -->
    <g transform="translate(40, 64)">
      <g stroke="#1f7a3a" stroke-width="1" fill="#cfe7d3">
        <rect x="0"   y="0"  width="40" height="22"/>
        <rect x="42"  y="0"  width="40" height="22"/>
        <rect x="84"  y="0"  width="40" height="22"/>
        <rect x="126" y="0"  width="40" height="22"/>
        <rect x="168" y="0"  width="40" height="22"/>
        <rect x="0"   y="24" width="40" height="22"/>
        <rect x="42"  y="24" width="40" height="22" fill="#a8d4b0"/>
        <rect x="84"  y="24" width="40" height="22"/>
        <rect x="126" y="24" width="40" height="22" fill="#a8d4b0"/>
        <rect x="168" y="24" width="40" height="22"/>
        <rect x="0"   y="48" width="40" height="22" fill="#a8d4b0"/>
        <rect x="42"  y="48" width="40" height="22"/>
        <rect x="84"  y="48" width="40" height="22" fill="#a8d4b0"/>
        <rect x="126" y="48" width="40" height="22"/>
        <rect x="168" y="48" width="40" height="22" fill="#a8d4b0"/>
        <rect x="0"   y="72" width="40" height="22"/>
        <rect x="42"  y="72" width="40" height="22" fill="#a8d4b0"/>
        <rect x="84"  y="72" width="40" height="22"/>
        <rect x="126" y="72" width="40" height="22"/>
        <rect x="168" y="72" width="40" height="22" fill="#a8d4b0"/>
      </g>
      <text x="105" y="116" font-size="11" text-anchor="middle" fill="#5a4a3a">N positions x d dims, all trainable</text>
    </g>

    <line x1="15" y1="200" x2="270" y2="200" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <text x="15" y="225" font-size="12" font-weight="700" fill="#1f7a3a">Type</text>
    <text x="15" y="243" font-size="12" fill="#1a1a2e">Absolute, additive at input</text>

    <text x="15" y="271" font-size="12" font-weight="700" fill="#1f7a3a">Params</text>
    <text x="15" y="289" font-size="12" fill="#1a1a2e">N x d (one vector / position)</text>

    <text x="15" y="317" font-size="12" font-weight="700" fill="#1f7a3a">Extrapolation</text>
    <text x="15" y="335" font-size="12" fill="#1a1a2e">None past trained N</text>

    <text x="15" y="363" font-size="12" font-weight="700" fill="#1f7a3a">Used by</text>
    <text x="15" y="381" font-size="12" fill="#1a1a2e">BERT, GPT-2, ViT</text>
  </g>

  <!-- Column 3: RoPE -->
  <g transform="translate(670, 110)">
    <rect x="0" y="0" width="285" height="430" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <rect x="0" y="0" width="285" height="44" rx="10" fill="#722f8a"/>
    <text x="142" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">RoPE</text>

    <!-- rotation pictogram -->
    <g transform="translate(142, 130)">
      <circle cx="0" cy="0" r="55" fill="none" stroke="#722f8a" stroke-width="1.4" stroke-dasharray="4,3"/>
      <line x1="0" y1="0" x2="50" y2="0" stroke="#722f8a" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="0" y1="0" x2="35" y2="-35" stroke="#9457b0" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="0" y1="0" x2="0" y2="-50" stroke="#b07ec6" stroke-width="2" marker-end="url(#arr)"/>
      <text x="0" y="80" font-size="11" text-anchor="middle" fill="#5a4a3a">Q, K rotated by angle theta_pos</text>
    </g>

    <line x1="15" y1="225" x2="270" y2="225" stroke="#722f8a" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <text x="15" y="247" font-size="12" font-weight="700" fill="#722f8a">Type</text>
    <text x="15" y="265" font-size="12" fill="#1a1a2e">Relative, applied in each layer</text>

    <text x="15" y="290" font-size="12" font-weight="700" fill="#722f8a">Params</text>
    <text x="15" y="308" font-size="12" fill="#1a1a2e">0 (rotation matrices)</text>

    <text x="15" y="333" font-size="12" font-weight="700" fill="#722f8a">Extrapolation</text>
    <text x="15" y="351" font-size="12" fill="#1a1a2e">Decent, great with NTK / YaRN</text>

    <text x="15" y="376" font-size="12" font-weight="700" fill="#722f8a">Used by</text>
    <text x="15" y="394" font-size="12" fill="#1a1a2e">Llama, Mistral, GPT-NeoX, Qwen</text>
  </g>

  <!-- Column 4: ALiBi -->
  <g transform="translate(975, 110)">
    <rect x="0" y="0" width="285" height="430" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <rect x="0" y="0" width="285" height="44" rx="10" fill="#7a5e1a"/>
    <text x="142" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">ALiBi</text>

    <!-- linear bias slope -->
    <g transform="translate(30, 60)">
      <line x1="0" y1="120" x2="225" y2="120" stroke="#5a4a3a" stroke-width="1"/>
      <line x1="0" y1="0"   x2="0"   y2="120" stroke="#5a4a3a" stroke-width="1"/>
      <line x1="0" y1="20"  x2="220" y2="115" stroke="#7a5e1a" stroke-width="2.2"/>
      <text x="115" y="140" font-size="11" text-anchor="middle" fill="#5a4a3a">bias = -m * |i - j|</text>
      <text x="-8" y="6" font-size="11" text-anchor="end" fill="#5a4a3a">0</text>
      <text x="180" y="115" font-size="11" fill="#5a4a3a">distance</text>
    </g>

    <line x1="15" y1="225" x2="270" y2="225" stroke="#7a5e1a" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <text x="15" y="247" font-size="12" font-weight="700" fill="#7a5e1a">Type</text>
    <text x="15" y="265" font-size="12" fill="#1a1a2e">Relative, added to scores</text>

    <text x="15" y="290" font-size="12" font-weight="700" fill="#7a5e1a">Params</text>
    <text x="15" y="308" font-size="12" fill="#1a1a2e">0 (per-head slope m)</text>

    <text x="15" y="333" font-size="12" font-weight="700" fill="#7a5e1a">Extrapolation</text>
    <text x="15" y="351" font-size="12" fill="#1a1a2e">Strong, length-generalizes</text>

    <text x="15" y="376" font-size="12" font-weight="700" fill="#7a5e1a">Used by</text>
    <text x="15" y="394" font-size="12" fill="#1a1a2e">BLOOM, MPT, Falcon</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="1140" height="84" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Sinusoidal and Learned encode absolute position once at the input; RoPE and ALiBi inject relative position inside attention.</text>
    <text x="20" y="64" font-size="12" fill="#1a1a2e">Modern long-context LLMs prefer the relative variants because they extend more gracefully past the training sequence length.</text>
  </g>
</svg>
