<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Contrastive decoding subtracts amateur from expert logits</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Tokens that both models love (filler) cancel out; tokens only the strong model loves (content) are amplified.</text>

  <!-- Expert model -->
  <g>
    <rect x="80" y="120" width="320" height="320" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="240" y="150" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Expert model  (7B)</text>
    <text x="240" y="170" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">log p_expert(token)</text>

    <g>
      <rect x="110" y="195" width="260" height="55" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="125" y="220" font-size="13" font-weight="700" fill="#1a1a2e">brilliant</text>
      <text x="355" y="220" font-size="13" text-anchor="end" fill="#1a1a2e">0.15</text>
      <rect x="125" y="232" width="156" height="8" fill="#1f7a3a" opacity="0.7"/>
    </g>
    <g>
      <rect x="110" y="265" width="260" height="55" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="125" y="290" font-size="13" font-weight="700" fill="#1a1a2e">the</text>
      <text x="355" y="290" font-size="13" text-anchor="end" fill="#1a1a2e">0.30</text>
      <rect x="125" y="302" width="234" height="8" fill="#1f7a3a" opacity="0.7"/>
    </g>
    <g>
      <rect x="110" y="335" width="260" height="55" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="125" y="360" font-size="13" font-weight="700" fill="#1a1a2e">insightful</text>
      <text x="355" y="360" font-size="13" text-anchor="end" fill="#1a1a2e">0.08</text>
      <rect x="125" y="372" width="83" height="8" fill="#1f7a3a" opacity="0.7"/>
    </g>
  </g>

  <!-- Minus operator -->
  <g>
    <circle cx="510" cy="280" r="40" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="510" y="290" font-size="32" font-weight="700" text-anchor="middle" fill="#722f8a">−</text>
    <text x="510" y="345" font-size="12" text-anchor="middle" fill="#5a4a3a">log-prob</text>
    <text x="510" y="360" font-size="12" text-anchor="middle" fill="#5a4a3a">subtraction</text>
  </g>

  <!-- Amateur model -->
  <g>
    <rect x="80" y="475" width="320" height="160" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="240" y="502" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Amateur model  (1B)</text>
    <text x="240" y="520" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">log p_amateur(token)</text>

    <g>
      <text x="110" y="548" font-size="12" fill="#1a1a2e">brilliant</text>
      <text x="375" y="548" font-size="12" text-anchor="end" fill="#1a1a2e">0.02</text>
      <rect x="170" y="540" width="20" height="8" fill="#b3401b" opacity="0.7"/>
    </g>
    <g>
      <text x="110" y="578" font-size="12" fill="#1a1a2e">the</text>
      <text x="375" y="578" font-size="12" text-anchor="end" fill="#1a1a2e">0.35</text>
      <rect x="170" y="570" width="200" height="8" fill="#b3401b" opacity="0.7"/>
    </g>
    <g>
      <text x="110" y="608" font-size="12" fill="#1a1a2e">insightful</text>
      <text x="375" y="608" font-size="12" text-anchor="end" fill="#1a1a2e">0.01</text>
      <rect x="170" y="600" width="10" height="8" fill="#b3401b" opacity="0.7"/>
    </g>
  </g>

  <!-- Arrows into minus -->
  <line x1="400" y1="280" x2="470" y2="280" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="555" x2="500" y2="320" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow into result -->
  <line x1="550" y1="280" x2="640" y2="280" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Result -->
  <g>
    <rect x="640" y="120" width="430" height="455" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="855" y="150" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4078">Contrastive distribution</text>
    <text x="855" y="170" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">log p_expert  −  alpha · log p_amateur</text>

    <g>
      <rect x="670" y="195" width="370" height="80" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="685" y="220" font-size="14" font-weight="700" fill="#1a1a2e">brilliant</text>
      <text x="1025" y="220" font-size="13" font-weight="700" text-anchor="end" fill="#1f7a3a">amplified</text>
      <text x="685" y="245" font-size="11" fill="#5a4a3a">expert likes it (0.15), amateur does not (0.02)</text>
      <text x="685" y="262" font-size="11" fill="#1f7a3a">→ likely a content-bearing word</text>
    </g>

    <g>
      <rect x="670" y="290" width="370" height="80" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="685" y="315" font-size="14" font-weight="700" fill="#1a1a2e">the</text>
      <text x="1025" y="315" font-size="13" font-weight="700" text-anchor="end" fill="#b3401b">suppressed</text>
      <text x="685" y="340" font-size="11" fill="#5a4a3a">both models love it (0.30 vs 0.35) — generic filler</text>
      <text x="685" y="357" font-size="11" fill="#b3401b">→ cancels out under subtraction</text>
    </g>

    <g>
      <rect x="670" y="385" width="370" height="80" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="685" y="410" font-size="14" font-weight="700" fill="#1a1a2e">insightful</text>
      <text x="1025" y="410" font-size="13" font-weight="700" text-anchor="end" fill="#1f7a3a">amplified</text>
      <text x="685" y="435" font-size="11" fill="#5a4a3a">expert: 0.08, amateur: 0.01 — distinctive expert pick</text>
      <text x="685" y="452" font-size="11" fill="#1f7a3a">→ rewarded for being expert-specific</text>
    </g>

    <text x="855" y="495" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Net effect: rich vocabulary survives, generic fillers fade.</text>
    <text x="855" y="520" font-size="12" text-anchor="middle" fill="#1a1a2e">Sample greedily or top-p from this contrastive distribution.</text>
  </g>

  <!-- Sidebar callout -->
  <g transform="translate(1090, 120)">
    <rect x="0" y="0" width="190" height="455" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="12" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Use when</text>
    <text x="12" y="42" font-size="11" fill="#1a1a2e">Open-ended generation</text>
    <text x="12" y="56" font-size="11" fill="#1a1a2e">where bland, repetitive</text>
    <text x="12" y="70" font-size="11" fill="#1a1a2e">output is the failure</text>
    <text x="12" y="84" font-size="11" fill="#1a1a2e">mode (story, dialogue,</text>
    <text x="12" y="98" font-size="11" fill="#1a1a2e">creative writing).</text>

    <text x="12" y="130" font-size="13" font-weight="700" fill="#7a5e1a">Cost</text>
    <text x="12" y="150" font-size="11" fill="#1a1a2e">2 forward passes per</text>
    <text x="12" y="164" font-size="11" fill="#1a1a2e">token (expert + amateur),</text>
    <text x="12" y="178" font-size="11" fill="#1a1a2e">but the amateur is small</text>
    <text x="12" y="192" font-size="11" fill="#1a1a2e">so total overhead is</text>
    <text x="12" y="206" font-size="11" fill="#1a1a2e">modest (~10-20%).</text>

    <text x="12" y="238" font-size="13" font-weight="700" fill="#7a5e1a">Knob</text>
    <text x="12" y="258" font-size="11" fill="#1a1a2e">alpha controls how</text>
    <text x="12" y="272" font-size="11" fill="#1a1a2e">aggressively to suppress</text>
    <text x="12" y="286" font-size="11" fill="#1a1a2e">amateur-favored tokens.</text>
    <text x="12" y="300" font-size="11" fill="#1a1a2e">Typical: 0.5 to 1.0.</text>

    <text x="12" y="332" font-size="13" font-weight="700" fill="#7a5e1a">Pitfall</text>
    <text x="12" y="352" font-size="11" fill="#1a1a2e">Amateur must be the</text>
    <text x="12" y="366" font-size="11" fill="#1a1a2e">SAME family / tokenizer</text>
    <text x="12" y="380" font-size="11" fill="#1a1a2e">as expert, otherwise the</text>
    <text x="12" y="394" font-size="11" fill="#1a1a2e">subtraction is noise.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 645)">
    <rect x="0" y="0" width="1180" height="45" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="20" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="38" font-size="12" fill="#1a1a2e">Subtracting a weak model's logits removes "things any LM would say" and keeps "things only the strong model knows" — cheap quality boost for free-form text.</text>
  </g>
</svg>
