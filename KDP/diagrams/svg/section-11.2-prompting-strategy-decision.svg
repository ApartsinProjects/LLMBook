<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1100" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="650" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Prompting Strategy Decision Tree</text>
  <text x="650" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">Walk top-down: each question splits the answer into a recommended technique</text>

  <!-- ============================================================ -->
  <!-- Q1: Reasoning needed?                                         -->
  <!-- ============================================================ -->
  <g filter="url(#sh)">
    <polygon points="650,100 880,180 650,260 420,180" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="650" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Does the task</text>
    <text x="650" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">require reasoning?</text>
  </g>

  <!-- Q1 → No (left, terminal) -->
  <line x1="450" y1="195" x2="280" y2="240" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="365" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a3a">No</text>

  <g filter="url(#sh)">
    <rect x="120" y="245" width="200" height="55" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="220" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Zero-Shot Prompting</text>
    <text x="220" y="288" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">just ask</text>
  </g>

  <!-- Q1 → Yes (down to Q2) -->
  <line x1="650" y1="265" x2="650" y2="320" stroke="#5a4a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="665" y="295" font-size="13" font-weight="700" fill="#722f8a">Yes</text>

  <!-- ============================================================ -->
  <!-- Q2: Domain knowledge bottleneck?                              -->
  <!-- ============================================================ -->
  <g filter="url(#sh)">
    <polygon points="650,325 880,400 650,475 420,400" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="650" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Is domain knowledge</text>
    <text x="650" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">the bottleneck?</text>
  </g>

  <!-- Q2 → Yes (left, terminal) -->
  <line x1="450" y1="415" x2="280" y2="450" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="365" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a3a">Yes</text>

  <g filter="url(#sh)">
    <rect x="120" y="455" width="200" height="55" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="220" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Step-Back Prompting</text>
    <text x="220" y="498" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">ask abstract first</text>
  </g>

  <!-- Q2 → No (down to Q3) -->
  <line x1="650" y1="480" x2="650" y2="535" stroke="#5a4a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="665" y="510" font-size="13" font-weight="700" fill="#722f8a">No</text>

  <!-- ============================================================ -->
  <!-- Q3: Need external tools / data?                               -->
  <!-- ============================================================ -->
  <g filter="url(#sh)">
    <polygon points="650,540 880,615 650,690 420,615" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="650" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Needs external tools</text>
    <text x="650" y="619" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">or live data?</text>
  </g>

  <!-- Q3 → Yes (left, terminal) -->
  <line x1="450" y1="630" x2="280" y2="665" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="365" y="640" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a3a">Yes</text>

  <g filter="url(#sh)">
    <rect x="120" y="670" width="200" height="55" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="220" y="695" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">ReAct Framework</text>
    <text x="220" y="713" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">interleave reason + act</text>
  </g>

  <!-- Q3 → No (down to Q4) -->
  <line x1="650" y1="695" x2="650" y2="750" stroke="#5a4a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="665" y="725" font-size="13" font-weight="700" fill="#722f8a">No</text>

  <!-- ============================================================ -->
  <!-- Q4: High reliability critical (3× cost OK)?                   -->
  <!-- ============================================================ -->
  <g filter="url(#sh)">
    <polygon points="650,755 880,830 650,905 420,830" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="650" y="815" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">High reliability critical?</text>
    <text x="650" y="834" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">(3× cost acceptable)</text>
  </g>

  <!-- Q4 → Yes (left, terminal) -->
  <line x1="450" y1="845" x2="280" y2="880" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="365" y="855" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a3a">Yes</text>

  <g filter="url(#sh)">
    <rect x="120" y="885" width="200" height="55" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="220" y="910" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Self-Consistency</text>
    <text x="220" y="928" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">vote across N samples</text>
  </g>

  <!-- Q4 → No (down to Q5) -->
  <line x1="650" y1="910" x2="650" y2="965" stroke="#5a4a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="665" y="940" font-size="13" font-weight="700" fill="#722f8a">No</text>

  <!-- ============================================================ -->
  <!-- Q5: Have good reasoning examples?                             -->
  <!-- ============================================================ -->
  <g filter="url(#sh)">
    <polygon points="650,970 850,1020 650,1070 450,1020" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="650" y="1015" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Have good reasoning</text>
    <text x="650" y="1033" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">examples on hand?</text>
  </g>

  <!-- Q5 → Yes (left, terminal) -->
  <line x1="475" y1="1030" x2="320" y2="1030" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="395" y="1020" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a3a">Yes</text>

  <g filter="url(#sh)">
    <rect x="120" y="1003" width="200" height="55" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="220" y="1028" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Few-Shot CoT</text>
    <text x="220" y="1046" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">show 2-5 step examples</text>
  </g>

  <!-- Q5 → No (right, terminal) -->
  <line x1="825" y1="1030" x2="980" y2="1030" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="905" y="1020" text-anchor="middle" font-size="13" font-weight="700" fill="#722f8a">No</text>

  <g filter="url(#sh)">
    <rect x="985" y="1003" width="200" height="55" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="1085" y="1028" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Zero-Shot CoT</text>
    <text x="1085" y="1046" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">"think step by step"</text>
  </g>

  <!-- ============================================================ -->
  <!-- SIDEBAR: Modern alternative                                   -->
  <!-- ============================================================ -->
  <g transform="translate(940,150)">
    <rect x="0" y="0" width="320" height="220" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.8"/>
    <text x="160" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5e1a">Tip: Reasoning models</text>
    <text x="160" y="46" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">a separate path entirely</text>
    <line x1="20" y1="60" x2="300" y2="60" stroke="#d4b96a" stroke-width="0.8"/>
    <text x="20" y="82" font-size="12" fill="#1a1a2e">Models like <tspan font-weight="700">o3</tspan>, <tspan font-weight="700">o4-mini</tspan>,</text>
    <text x="20" y="100" font-size="12" fill="#1a1a2e"><tspan font-weight="700">DeepSeek-R1</tspan>, <tspan font-weight="700">Gemini 2.5</tspan></text>
    <text x="20" y="118" font-size="12" fill="#1a1a2e">do chain-of-thought INSIDE</text>
    <text x="20" y="136" font-size="12" fill="#1a1a2e">the model.</text>
    <text x="20" y="162" font-size="12" font-weight="700" fill="#1f7a3a">→ explicit CoT prompting is</text>
    <text x="20" y="180" font-size="12" font-weight="700" fill="#1f7a3a">  unnecessary; just ask.</text>
    <text x="20" y="205" font-size="11" fill="#5a4a3a" font-style="italic">Trade-off: 3-10× higher latency</text>
  </g>

  <!-- Color legend -->
  <g transform="translate(940,400)">
    <rect x="0" y="0" width="320" height="80" rx="6" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>
    <text x="160" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#5a4a3a">Legend</text>
    <polygon points="20,40 60,55 20,70 -20,55" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5" transform="translate(40,0)"/>
    <text x="100" y="60" font-size="11" fill="#1a1a2e">decision (yes/no question)</text>
    <rect x="20" y="33" width="22" height="12" rx="3" fill="#ecf6ee" stroke="#1f7a3a" transform="translate(170,30)"/>
    <text x="225" y="78" font-size="11" fill="#1a1a2e">recommended technique (terminal)</text>
  </g>
</svg>
