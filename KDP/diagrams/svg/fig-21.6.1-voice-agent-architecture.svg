<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Voice agent architecture: simple pipeline vs agentic loop</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Linear STT, LLM, TTS gives one turn; an agent loop reasons, calls tools, and streams partial speech to mask latency</text>

  <!-- LANE 1: Simple pipeline -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="1180" height="130" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="26" font-size="15" font-weight="700" fill="#1a4078">1. Voice pipeline (simple, single-shot)</text>
    <text x="20" y="46" font-size="12" fill="#5a4a3a" font-style="italic">One user turn produces one model call; good for FAQ bots and dictation</text>

    <!-- STT -->
    <g transform="translate(80, 62)">
      <rect width="220" height="56" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="110" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">STT</text>
      <text x="110" y="42" font-size="11" text-anchor="middle" fill="#5a4a3a">Speech to text</text>
    </g>
    <line x1="300" y1="90" x2="460" y2="90" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- LLM -->
    <g transform="translate(460, 62)">
      <rect width="220" height="56" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="110" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">LLM</text>
      <text x="110" y="42" font-size="11" text-anchor="middle" fill="#5a4a3a">Single call, full reply</text>
    </g>
    <line x1="680" y1="90" x2="840" y2="90" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- TTS -->
    <g transform="translate(840, 62)">
      <rect width="220" height="56" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="110" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">TTS</text>
      <text x="110" y="42" font-size="11" text-anchor="middle" fill="#5a4a3a">Text to speech</text>
    </g>
  </g>

  <!-- LANE 2: Agent loop -->
  <g transform="translate(60, 250)">
    <rect x="0" y="0" width="850" height="280" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="26" font-size="15" font-weight="700" fill="#1f7a3a">2. Voice agent (agentic, multi-step)</text>
    <text x="20" y="46" font-size="12" fill="#5a4a3a" font-style="italic">STT and TTS bookend a reasoning loop that can call tools repeatedly before replying</text>

    <!-- STT -->
    <g transform="translate(20, 70)">
      <rect width="150" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="75" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">STT</text>
      <text x="75" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">Whisper,</text>
      <text x="75" y="62" font-size="11" text-anchor="middle" fill="#5a4a3a">Deepgram</text>
    </g>
    <line x1="170" y1="110" x2="210" y2="110" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- Loop subgraph -->
    <g transform="translate(210, 60)">
      <rect width="450" height="200" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.8" stroke-dasharray="4,3"/>
      <text x="225" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Agent loop</text>

      <g transform="translate(20, 38)">
        <rect width="130" height="60" rx="8" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
        <text x="65" y="26" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">LLM reasoning</text>
        <text x="65" y="44" font-size="11" text-anchor="middle" fill="#5a4a3a">plan next step</text>
      </g>
      <line x1="150" y1="68" x2="180" y2="68" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

      <g transform="translate(180, 38)">
        <rect width="130" height="60" rx="8" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
        <text x="65" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Tool calls</text>
        <text x="65" y="38" font-size="11" text-anchor="middle" fill="#5a4a3a">APIs, DBs,</text>
        <text x="65" y="52" font-size="11" text-anchor="middle" fill="#5a4a3a">booking systems</text>
      </g>
      <line x1="310" y1="68" x2="340" y2="68" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

      <g transform="translate(340, 38)">
        <rect width="100" height="60" rx="8" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
        <text x="50" y="26" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Compose</text>
        <text x="50" y="44" font-size="11" text-anchor="middle" fill="#5a4a3a">response</text>
      </g>

      <!-- feedback arrow back to LLM -->
      <path d="M 390 100 Q 390 160 85 160 Q 30 160 30 110" fill="none" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrDash)"/>
      <text x="225" y="178" font-size="11" text-anchor="middle" fill="#722f8a" font-style="italic">if more reasoning needed, loop again</text>
    </g>

    <line x1="660" y1="160" x2="700" y2="160" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- TTS -->
    <g transform="translate(700, 120)">
      <rect width="130" height="80" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="65" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">TTS</text>
      <text x="65" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">Streaming</text>
      <text x="65" y="62" font-size="11" text-anchor="middle" fill="#5a4a3a">output</text>
    </g>
  </g>

  <!-- LATENCY callout -->
  <g transform="translate(940, 250)">
    <rect width="300" height="280" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#7a5e1a">Latency management</text>
    <text x="20" y="46" font-size="11" fill="#5a4a3a" font-style="italic">Hide multi-second tool calls from the caller</text>

    <g transform="translate(20, 64)">
      <circle cx="10" cy="14" r="9" fill="#7a5e1a"/>
      <text x="10" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
      <text x="30" y="14" font-size="12" font-weight="700" fill="#1a1a2e">Progressive responses</text>
      <text x="30" y="30" font-size="11" fill="#5a4a3a">Speak first phrase before</text>
      <text x="30" y="44" font-size="11" fill="#5a4a3a">tool result returns</text>
    </g>

    <g transform="translate(20, 130)">
      <circle cx="10" cy="14" r="9" fill="#7a5e1a"/>
      <text x="10" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
      <text x="30" y="14" font-size="12" font-weight="700" fill="#1a1a2e">Filler speech</text>
      <text x="30" y="30" font-size="11" fill="#5a4a3a">"Let me check that"</text>
      <text x="30" y="44" font-size="11" fill="#5a4a3a">while reasoning runs</text>
    </g>

    <g transform="translate(20, 196)">
      <circle cx="10" cy="14" r="9" fill="#7a5e1a"/>
      <text x="10" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
      <text x="30" y="14" font-size="12" font-weight="700" fill="#1a1a2e">Parallel tool calls</text>
      <text x="30" y="30" font-size="11" fill="#5a4a3a">Fan out independent</text>
      <text x="30" y="44" font-size="11" fill="#5a4a3a">lookups simultaneously</text>
    </g>
  </g>

  <!-- dashed connection from agent to latency -->
  <path d="M 910 390 L 940 390" fill="none" stroke="#7a5e1a" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 660)">
    <rect width="1180" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">A simple STT, LLM, TTS chain answers in one shot. An agent wraps that with a reasoning loop plus tool calls, then masks the resulting latency by streaming filler audio while the loop spins.</text>
  </g>
</svg>
