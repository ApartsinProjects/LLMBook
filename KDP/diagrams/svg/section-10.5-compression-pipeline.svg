<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Model Compression Pipeline: 70 B → ~9 GB Production Model</text>
  <text x="700" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">Four sequential techniques compose into 8-16× total compression</text>

  <!-- ============================================================ -->
  <!-- TOP ROW: Pipeline boxes                                       -->
  <!-- ============================================================ -->
  <!-- Step 1: Dense -->
  <g filter="url(#sh)">
    <rect x="60" y="120" width="220" height="100" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="170" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Dense Model</text>
    <text x="170" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#b3401b">140 GB</text>
    <text x="170" y="190" text-anchor="middle" font-size="11" fill="#5a4a3a">70B params, FP16</text>
    <text x="170" y="208" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">starting point</text>
  </g>

  <line x1="285" y1="170" x2="335" y2="170" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="310" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#5a4a3a">Prune</text>

  <!-- Step 2: Sparse -->
  <g filter="url(#sh)">
    <rect x="340" y="120" width="220" height="100" rx="8" fill="#fef3e0" stroke="#d4b96a" stroke-width="2.5"/>
    <text x="450" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Sparse Model</text>
    <text x="450" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#d4b96a">~70 GB *</text>
    <text x="450" y="190" text-anchor="middle" font-size="11" fill="#5a4a3a">50% sparsity, FP16</text>
    <text x="450" y="208" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">2× reduction</text>
  </g>

  <line x1="565" y1="170" x2="615" y2="170" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="590" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#5a4a3a">Quantize</text>

  <!-- Step 3: Quantized + sparse -->
  <g filter="url(#sh)">
    <rect x="620" y="120" width="220" height="100" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="730" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Sparse + INT4</text>
    <text x="730" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#1a4078">~18 GB</text>
    <text x="730" y="190" text-anchor="middle" font-size="11" fill="#5a4a3a">4-bit weights</text>
    <text x="730" y="208" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">~8× from original</text>
  </g>

  <line x1="845" y1="170" x2="895" y2="170" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="870" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#5a4a3a">Distill</text>

  <!-- Step 4: Distilled production model -->
  <g filter="url(#sh)">
    <rect x="900" y="120" width="240" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="3"/>
    <text x="1020" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Production Model</text>
    <text x="1020" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a3a">~9 GB</text>
    <text x="1020" y="190" text-anchor="middle" font-size="11" fill="#5a4a3a">student model trained on</text>
    <text x="1020" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#1f7a3a">teacher's distribution; quality recovered</text>
  </g>

  <!-- ============================================================ -->
  <!-- MIDDLE: Bar chart showing size reduction at each stage        -->
  <!-- ============================================================ -->
  <text x="700" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Size at each stage (log scale, GB)</text>

  <!-- Plot area -->
  <rect x="120" y="300" width="1160" height="240" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>

  <!-- Y axis labels (log: 1 GB = 540, 10 GB = 460, 100 GB = 380, 200 GB = 340) -->
  <g font-size="11" fill="#5a4a3a" text-anchor="end">
    <text x="115" y="340">200 GB</text>
    <text x="115" y="380">100 GB</text>
    <text x="115" y="460">10 GB</text>
    <text x="115" y="540">1 GB</text>
  </g>
  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="120" y1="380" x2="1280" y2="380"/>
    <line x1="120" y1="460" x2="1280" y2="460"/>
  </g>

  <!-- Bar 1: 140 GB → y=363 (log scale midway between 100 and 200) -->
  <g filter="url(#sh)">
    <rect x="170" y="365" width="200" height="170" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="270" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#b3401b">140 GB</text>
    <text x="270" y="555" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">1. Dense</text>
  </g>
  <!-- Bar 2: 70 GB → y=400 -->
  <g filter="url(#sh)">
    <rect x="450" y="402" width="200" height="133" rx="4" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <text x="550" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5e1a">70 GB *</text>
    <text x="550" y="555" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">2. Sparse</text>
  </g>
  <!-- Bar 3: 18 GB → y=440 -->
  <g filter="url(#sh)">
    <rect x="730" y="438" width="200" height="97" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="830" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#1a4078">18 GB</text>
    <text x="830" y="555" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">3. Sparse + INT4</text>
  </g>
  <!-- Bar 4: 9 GB → y=465 -->
  <g filter="url(#sh)">
    <rect x="1010" y="465" width="200" height="70" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="1110" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#1f7a3a">9 GB</text>
    <text x="1110" y="555" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">4. Distilled (final)</text>
  </g>

  <!-- Reduction arrows annotated -->
  <text x="410" y="335" text-anchor="middle" font-size="11" font-weight="700" fill="#5a4a3a">2×</text>
  <text x="690" y="335" text-anchor="middle" font-size="11" font-weight="700" fill="#5a4a3a">~4×</text>
  <text x="970" y="335" text-anchor="middle" font-size="11" font-weight="700" fill="#5a4a3a">2×</text>

  <!-- ============================================================ -->
  <!-- BOTTOM: Caveats / footnote                                    -->
  <!-- ============================================================ -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="1280" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#7a5e1a">* Caveats — actual compression depends on hardware</text>
    <text x="20" y="44" font-size="12" fill="#1a1a2e"><tspan font-weight="700">Storage</tspan>: 50% sparsity halves storage IF a sparse format is used (CSR, BCSR); dense storage doesn't change.</text>
    <text x="20" y="62" font-size="12" fill="#1a1a2e"><tspan font-weight="700">Compute</tspan>: sparsity speeds up inference only on hardware with sparse-tensor cores (e.g. A100, H100 with 2:4 sparsity).</text>
  </g>
</svg>
