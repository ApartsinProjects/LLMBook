<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
    <marker id="arrowDotted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a4078"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- TOP: Token + Position Embedding (input)                      -->
  <!-- ============================================================ -->
  <g filter="url(#softShadow)">
    <rect x="160" y="30" width="280" height="48" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.8"/>
    <text x="300" y="60" text-anchor="middle" font-size="15" fill="#1a1a2e" font-weight="600">Token + Position Embedding</text>
  </g>
  <line x1="300" y1="78" x2="300" y2="105" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- TRANSFORMER BLOCK (x N) — three stacked outlines for ghosts  -->
  <!-- ============================================================ -->
  <g opacity="0.25">
    <rect x="76" y="121" width="448" height="372" rx="14" fill="none" stroke="#1a4078" stroke-width="1.5"/>
  </g>
  <g opacity="0.5">
    <rect x="83" y="115" width="448" height="372" rx="14" fill="none" stroke="#1a4078" stroke-width="1.5"/>
  </g>

  <!-- Front block (the active one) -->
  <g filter="url(#softShadow)">
    <rect x="90" y="108" width="448" height="372" rx="14" fill="#fafbfc" stroke="#1a4078" stroke-width="2.2" stroke-dasharray="6,3"/>
    <text x="514" y="128" text-anchor="end" font-size="13" fill="#1a4078" font-weight="700" font-style="italic">Transformer Block  &#221155; N</text>
  </g>

  <!-- Sublayer 1: LayerNorm -> Causal Self-Attention -> Add -->
  <g filter="url(#softShadow)">
    <rect x="200" y="148" width="200" height="38" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.6"/>
    <text x="300" y="172" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">LayerNorm</text>
  </g>
  <line x1="300" y1="186" x2="300" y2="208" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="180" y="210" width="240" height="48" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
    <text x="300" y="232" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">Causal Multi-Head</text>
    <text x="300" y="250" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">Self-Attention</text>
  </g>
  <line x1="300" y1="258" x2="300" y2="276" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Add (residual sum) -->
  <g filter="url(#softShadow)">
    <circle cx="300" cy="290" r="14" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <line x1="290" y1="290" x2="310" y2="290" stroke="#1a4078" stroke-width="2"/>
    <line x1="300" y1="280" x2="300" y2="300" stroke="#1a4078" stroke-width="2"/>
  </g>
  <text x="324" y="295" font-size="11" fill="#5a4a3a">add &amp; combine</text>

  <!-- Residual bypass: from before LayerNorm to the Add (dotted blue, curved) -->
  <path d="M 200 167 C 130 167, 130 290, 282 290" fill="none" stroke="#1a4078" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrowDotted)"/>
  <text x="100" y="232" font-size="11" fill="#1a4078" font-style="italic" transform="rotate(-90 100 232)">residual</text>

  <line x1="300" y1="304" x2="300" y2="326" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sublayer 2: LayerNorm -> Feed-Forward -> Add -->
  <g filter="url(#softShadow)">
    <rect x="200" y="328" width="200" height="38" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.6"/>
    <text x="300" y="352" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">LayerNorm</text>
  </g>
  <line x1="300" y1="366" x2="300" y2="388" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="180" y="390" width="240" height="48" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.6"/>
    <text x="300" y="412" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">Feed-Forward Network</text>
    <text x="300" y="430" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">(SwiGLU or GELU)</text>
  </g>
  <line x1="300" y1="438" x2="300" y2="455" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <circle cx="300" cy="468" r="14" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <line x1="290" y1="468" x2="310" y2="468" stroke="#1a4078" stroke-width="2"/>
    <line x1="300" y1="458" x2="300" y2="478" stroke="#1a4078" stroke-width="2"/>
  </g>

  <!-- Residual bypass for FFN block -->
  <path d="M 200 347 C 488 347, 488 468, 318 468" fill="none" stroke="#1a4078" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrowDotted)"/>
  <text x="510" y="408" font-size="11" fill="#1a4078" font-style="italic" transform="rotate(90 510 408)">residual</text>

  <!-- ============================================================ -->
  <!-- BOTTOM: Final LayerNorm -> Linear -> Softmax -> Output       -->
  <!-- ============================================================ -->
  <line x1="300" y1="482" x2="300" y2="510" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="200" y="513" width="200" height="38" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.6"/>
    <text x="300" y="537" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">Final LayerNorm</text>
  </g>
  <line x1="300" y1="551" x2="300" y2="572" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="180" y="575" width="240" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
    <text x="300" y="598" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">Linear Projection</text>
    <text x="300" y="616" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">(d_model &#8594; vocab_size)</text>
  </g>
  <line x1="300" y1="625" x2="300" y2="646" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="220" y="648" width="160" height="42" rx="6" fill="#fef3e0" stroke="#d4b96a" stroke-width="1.8"/>
    <text x="300" y="674" text-anchor="middle" font-size="14" fill="#1a1a2e" font-weight="700">Softmax</text>
  </g>
  <line x1="300" y1="690" x2="300" y2="712" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="120" y="714" width="360" height="50" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="300" y="738" text-anchor="middle" font-size="14" fill="#1a1a2e" font-weight="600">Next-token probabilities</text>
    <text x="300" y="754" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">P(token | context)  for every token in vocabulary</text>
  </g>

  <!-- Legend (top right) -->
  <g transform="translate(440, 32)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="26" y="4" font-size="11" fill="#5a4a3a">activations</text>
    <line x1="0" y1="14" x2="20" y2="14" stroke="#1a4078" stroke-width="1.6" stroke-dasharray="4,3"/>
    <text x="26" y="18" font-size="11" fill="#1a4078">residual</text>
  </g>
</svg>
