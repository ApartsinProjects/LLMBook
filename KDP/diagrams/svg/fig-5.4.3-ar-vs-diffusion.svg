          <rect x="84" y="0" width="80" height="32" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
          <text x="124" y="21" font-size="12" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">capital</text>
          <rect x="168" y="0" width="80" height="32" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
          <text x="208" y="21" font-size="12" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">of</text>
          <rect x="252" y="0" width="80" height="32" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
          <text x="292" y="21" font-size="12" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">France</text>
          <rect x="336" y="0" width="80" height="32" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
          <text x="376" y="21" font-size="12" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">is</text>
          <rect x="420" y="0" width="80" height="32" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
          <text x="460" y="21" font-size="12" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">Paris</text>
          <rect x="504" y="0" width="60" height="32" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
          <text x="534" y="21" font-size="12" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">,</text>
          <rect x="568" y="0" width="60" height="32" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
          <text x="598" y="21" font-size="12" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">a</text>
          <rect x="632" y="0" width="60" height="32" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
          <text x="662" y="21" font-size="12" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">city</text>
          <rect x="696" y="0" width="60" height="32" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
          <text x="726" y="21" font-size="12" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#722f8a">.</text>
        </g>
      </g>
    </g>

    <line x1="1130" y1="40" x2="1130" y2="190" stroke="#722f8a" stroke-width="2" marker-end="url(#arr)"/>
    <text x="1148" y="115" font-size="12" font-weight="700" fill="#722f8a">denoise</text>
    <text x="1242" y="50" font-size="11" font-style="italic" fill="#5a4a3a">every position</text>
    <text x="1242" y="65" font-size="11" font-style="italic" fill="#5a4a3a">updated each</text>
    <text x="1242" y="80" font-size="11" font-style="italic" fill="#5a4a3a">step in one</text>
    <text x="1242" y="95" font-size="11" font-style="italic" fill="#5a4a3a">forward pass</text>
  </g>

  <!-- Comparison row -->
  <g transform="translate(40, 674)">
    <rect x="0" y="0" width="1370" height="44" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="18" font-size="12" font-weight="700" fill="#7a5e1a">Cost &amp; latency comparison (5-token output, illustrative numbers)</text>
    <text x="14" y="36" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">AR:  5 fwd passes  =  ~250 ms  |  reasoning: strong, mature RLHF stack    Diffusion:  ~3 to 8 passes  =  ~120 ms  |  parallel, easy edits, weaker reasoning today</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 728)">
    <rect x="0" y="0" width="1370" height="44" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="14" y="20" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="14" y="36" font-size="12" fill="#1a1a2e">AR pays per token; diffusion pays per denoise step. Latency scales with output length for AR but with step count T for diffusion.</text>
  </g>
</svg>
