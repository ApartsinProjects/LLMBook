<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="725" y="40" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">Autoregressive vs. Diffusion Text Generation</text>
  <text x="725" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Same prompt, two sampling paradigms: token-by-token sequence vs. parallel denoising of all positions.</text>

  <!-- Shared prompt -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="1370" height="44" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="14" y="28" font-size="13" font-weight="700" fill="#1a4078">Prompt</text>
    <text x="80" y="28" font-size="13" font-family="Consolas, monospace" fill="#1a1a2e">"The capital of France is"   target length = 5 tokens</text>
  </g>

  <!-- Lane A: Autoregressive -->
  <g transform="translate(40, 154)">
    <rect x="0" y="0" width="1370" height="240" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="240" rx="10" fill="#1f7a3a"/>
    <text x="140" y="40" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Autoregressive</text>
    <text x="140" y="62" font-size="12" text-anchor="middle" fill="#ecf6ee">GPT, Llama, Mistral</text>
    <text x="140" y="92" font-size="12" text-anchor="middle" fill="#ffffff">5 sequential calls</text>
    <text x="140" y="110" font-size="12" text-anchor="middle" fill="#ffffff">one new token each</text>
    <text x="140" y="146" font-size="11" text-anchor="middle" fill="#ecf6ee">x_t ~ p(x_t | x_&lt;t)</text>
    <text x="140" y="186" font-size="12" text-anchor="middle" fill="#ffffff">Latency  =  5 x t_step</text>
    <text x="140" y="208" font-size="12" text-anchor="middle" fill="#ffffff">KV-cache amortizes</text>

    <!-- 5 step strips -->
    <g transform="translate(300, 16)">
      <!-- step 1 -->
      <g transform="translate(0, 0)">
        <text x="252" y="14" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">Step 1</text>
        <g transform="translate(0, 22)">
          <rect x="0" y="0" width="80" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="40" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">The</text>
          <rect x="84" y="0" width="80" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="124" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">capital</text>
          <rect x="168" y="0" width="80" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="208" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">of</text>
          <rect x="252" y="0" width="80" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="292" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">France</text>
          <rect x="336" y="0" width="80" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="376" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">is</text>
          <rect x="420" y="0" width="80" height="32" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
          <text x="460" y="21" font-size="12" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#1f7a3a">Paris</text>
          <rect x="504" y="0" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/>
          <text x="534" y="21" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">?</text>
          <rect x="568" y="0" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/>
          <text x="598" y="21" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">?</text>
          <rect x="632" y="0" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/>
          <text x="662" y="21" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">?</text>
          <rect x="696" y="0" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/>
          <text x="726" y="21" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">?</text>
        </g>
        <text x="780" y="40" font-size="11" fill="#5a4a3a">+1 token</text>
      </g>
      <!-- step 2 -->
      <g transform="translate(0, 60)">
        <text x="252" y="14" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">Step 2</text>
        <g transform="translate(0, 22)">
          <rect x="0" y="0" width="416" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="208" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">The capital of France is</text>
          <rect x="420" y="0" width="80" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="460" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">Paris</text>
          <rect x="504" y="0" width="60" height="32" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
          <text x="534" y="21" font-size="12" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#1f7a3a">,</text>
          <rect x="568" y="0" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/>
          <text x="598" y="21" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">?</text>
          <rect x="632" y="0" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/>
          <text x="662" y="21" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">?</text>
          <rect x="696" y="0" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/>
          <text x="726" y="21" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">?</text>
        </g>
      </g>
      <!-- step 5 -->
      <g transform="translate(0, 120)">
        <text x="252" y="14" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">Step 5  (final)</text>
        <g transform="translate(0, 22)">
          <rect x="0" y="0" width="500" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="250" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">The capital of France is Paris</text>
          <rect x="504" y="0" width="60" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="534" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">,</text>
          <rect x="568" y="0" width="60" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="598" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">a</text>
          <rect x="632" y="0" width="60" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="662" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">city</text>
          <rect x="696" y="0" width="60" height="32" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
          <text x="726" y="21" font-size="12" font-weight="700" font-family="Consolas, monospace" text-anchor="middle" fill="#1f7a3a">.</text>
        </g>
      </g>
    </g>

    <!-- vertical down arrow indicating sequential -->
    <line x1="1130" y1="40" x2="1130" y2="190" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>
    <text x="1148" y="115" font-size="12" font-weight="700" fill="#1f7a3a">time</text>
    <text x="1170" y="50" font-size="11" fill="#5a4a3a">step 1</text>
    <text x="1170" y="115" font-size="11" fill="#5a4a3a">step 2</text>
    <text x="1170" y="180" font-size="11" fill="#5a4a3a">step 5</text>
    <text x="1242" y="50" font-size="11" font-style="italic" fill="#5a4a3a">cannot start</text>
    <text x="1242" y="65" font-size="11" font-style="italic" fill="#5a4a3a">step 2 until</text>
    <text x="1242" y="80" font-size="11" font-style="italic" fill="#5a4a3a">step 1 emits</text>
    <text x="1242" y="95" font-size="11" font-style="italic" fill="#5a4a3a">a token</text>
  </g>

  <!-- Lane B: Diffusion -->
  <g transform="translate(40, 414)">
    <rect x="0" y="0" width="1370" height="240" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="240" rx="10" fill="#722f8a"/>
    <text x="140" y="40" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Diffusion</text>
    <text x="140" y="62" font-size="12" text-anchor="middle" fill="#f4ecf7">SEDD, Mercury</text>
    <text x="140" y="92" font-size="12" text-anchor="middle" fill="#ffffff">3 to 20 denoise steps</text>
    <text x="140" y="110" font-size="12" text-anchor="middle" fill="#ffffff">all positions in parallel</text>
    <text x="140" y="146" font-size="11" text-anchor="middle" fill="#f4ecf7">x_0 ~ p_theta(x | x_T)</text>
    <text x="140" y="186" font-size="12" text-anchor="middle" fill="#ffffff">Latency  =  T x t_step</text>
    <text x="140" y="208" font-size="12" text-anchor="middle" fill="#ffffff">but T can be tiny</text>

    <g transform="translate(300, 16)">
      <!-- T=10 (noise) -->
      <g transform="translate(0, 0)">
        <text x="252" y="14" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">T = 10  (pure noise)</text>
        <g transform="translate(0, 22)">
          <rect x="0" y="0" width="80" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="40" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MASK]</text>
          <rect x="84" y="0" width="80" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="124" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MASK]</text>
          <rect x="168" y="0" width="80" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="208" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MASK]</text>
          <rect x="252" y="0" width="80" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="292" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MASK]</text>
          <rect x="336" y="0" width="80" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="376" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MASK]</text>
          <rect x="420" y="0" width="80" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="460" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MASK]</text>
          <rect x="504" y="0" width="60" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="534" y="21" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MSK]</text>
          <rect x="568" y="0" width="60" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="598" y="21" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MSK]</text>
          <rect x="632" y="0" width="60" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="662" y="21" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MSK]</text>
          <rect x="696" y="0" width="60" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="726" y="21" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MSK]</text>
        </g>
      </g>
      <!-- T=5 partial -->
      <g transform="translate(0, 60)">
        <text x="252" y="14" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">T = 5  (partially denoised)</text>
        <g transform="translate(0, 22)">
          <rect x="0" y="0" width="80" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="40" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">The</text>
          <rect x="84" y="0" width="80" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="124" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MASK]</text>
          <rect x="168" y="0" width="80" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="208" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">of</text>
          <rect x="252" y="0" width="80" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="292" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MASK]</text>
          <rect x="336" y="0" width="80" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="376" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">is</text>
          <rect x="420" y="0" width="80" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="460" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">Paris</text>
          <rect x="504" y="0" width="60" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="534" y="21" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MSK]</text>
          <rect x="568" y="0" width="60" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="598" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">a</text>
          <rect x="632" y="0" width="60" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
          <text x="662" y="21" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#b3401b">[MSK]</text>
          <rect x="696" y="0" width="60" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
          <text x="726" y="21" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">.</text>
        </g>
      </g>
      <!-- T=0 -->
      <g transform="translate(0, 120)">
        <text x="252" y="14" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">T = 0  (final, all positions resolved together)</text>
        <g transform="translate(0, 22)">
          <rect x="0" y="0" width="80" height="32" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
