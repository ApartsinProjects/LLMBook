<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrStore" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a5e1a"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Adding memory: RunnableWithMessageHistory</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">A wrapper turns a stateless chain into a chatbot by reading and writing past turns from a session-keyed store.</text>

  <!-- User Input -->
  <g transform="translate(80, 270)">
    <rect width="180" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="90" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">User Input</text>
    <text x="90" y="64" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">{ "input": ..., </text>
    <text x="90" y="80" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">"session_id": "abc" }</text>
  </g>

  <!-- Wrapper containing chain -->
  <g transform="translate(330, 220)">
    <rect width="380" height="200" rx="14" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="190" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">RunnableWithMessageHistory</text>
    <text x="190" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">memory wrapper (orchestration)</text>

    <!-- Inner chain -->
    <g transform="translate(40, 80)">
      <rect width="300" height="100" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="150" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">LCEL Chain</text>
      <text x="150" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">prompt | model | parser</text>
      <text x="150" y="72" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">stateless: pure function</text>
      <text x="150" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">of (history, input)</text>
    </g>
  </g>

  <!-- Response -->
  <g transform="translate(770, 270)">
    <rect width="180" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="90" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Response</text>
    <text x="90" y="64" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">assistant reply</text>
    <text x="90" y="80" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">aware of context</text>
  </g>

  <!-- History Store -->
  <g transform="translate(1020, 240)">
    <ellipse cx="110" cy="20" rx="110" ry="18" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <rect x="0" y="20" width="220" height="120" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <ellipse cx="110" cy="140" rx="110" ry="18" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <line x1="0" y1="20" x2="0" y2="140" stroke="#fef3e0" stroke-width="3"/>
    <line x1="220" y1="20" x2="220" y2="140" stroke="#fef3e0" stroke-width="3"/>
    <text x="110" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">History Store</text>
    <text x="110" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">get_session_history(id)</text>
    <text x="110" y="76" font-size="11" text-anchor="middle" fill="#1a1a2e">"abc": [Human, AI,</text>
    <text x="110" y="92" font-size="11" text-anchor="middle" fill="#1a1a2e">Human, AI, ...]</text>
    <text x="110" y="116" font-size="11" text-anchor="middle" fill="#1a1a2e">"xyz": [Human, AI]</text>
    <text x="110" y="138" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">dict / Redis / Postgres</text>
  </g>

  <!-- Arrow user -> wrapper -->
  <line x1="260" y1="320" x2="328" y2="320" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="294" y="310" font-size="11" text-anchor="middle" fill="#5a4a3a">1. invoke</text>

  <!-- Arrow wrapper chain -> response -->
  <line x1="710" y1="320" x2="768" y2="320" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="739" y="310" font-size="11" text-anchor="middle" fill="#5a4a3a">4. return</text>

  <!-- Dashed: load history into wrapper from store -->
  <path d="M 1020 290 Q 870 200 710 270" fill="none" stroke="#7a5e1a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrStore)"/>
  <text x="860" y="200" font-size="11" font-weight="700" text-anchor="middle" fill="#7a5e1a">2. load history</text>

  <!-- Dashed: save back to store -->
  <path d="M 710 380 Q 870 460 1020 360" fill="none" stroke="#7a5e1a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrStore)"/>
  <text x="860" y="475" font-size="11" font-weight="700" text-anchor="middle" fill="#7a5e1a">3. save exchange</text>

  <!-- Bottom annotation panels -->
  <g transform="translate(80, 480)">
    <rect width="380" height="120" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">What the wrapper does</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">- Looks up prior turns by session_id</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">- Injects them into the prompt as context</text>
    <text x="20" y="90" font-size="12" fill="#1a1a2e">- Runs the chain on (history + input)</text>
    <text x="20" y="110" font-size="12" fill="#1a1a2e">- Appends new exchange to the store</text>
  </g>

  <g transform="translate(490, 480)">
    <rect width="380" height="120" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#5a4a3a">Why keep the chain stateless</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">- Easy to test (deterministic on inputs)</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">- Easy to swap storage backends</text>
    <text x="20" y="90" font-size="12" fill="#1a1a2e">- Multi-user isolation via session_id</text>
    <text x="20" y="110" font-size="12" fill="#1a1a2e">- Memory becomes a configurable concern</text>
  </g>

  <g transform="translate(900, 480)">
    <rect width="320" height="120" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1a4078">Storage options</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">- ChatMessageHistory (in-memory)</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">- RedisChatMessageHistory</text>
    <text x="20" y="90" font-size="12" fill="#1a1a2e">- SQLChatMessageHistory</text>
    <text x="20" y="110" font-size="12" fill="#1a1a2e">- DynamoDB, Postgres, custom</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Memory is a side effect handled by the wrapper, not the chain; this keeps invoke pure and lets you choose any session-keyed store.</text>
  </g>
</svg>
