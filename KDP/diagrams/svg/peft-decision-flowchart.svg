<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Choosing a PEFT Method</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">A 3-question decision tree from base-model size to recommended adapter family</text>

  <!-- Start pill -->
  <g>
    <rect x="540" y="90" width="220" height="44" rx="22" fill="#5a4a3a" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="650" y="118" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Start: choose PEFT method</text>
  </g>

  <!-- Q1 diamond -->
  <g>
    <polygon points="650,160 870,225 650,290 430,225" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="650" y="215" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Is your base model</text>
    <text x="650" y="235" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">10B+ parameters?</text>
  </g>
  <line x1="650" y1="134" x2="650" y2="160" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Q1 Yes -> PT -->
  <line x1="430" y1="225" x2="245" y2="225" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="338" y="218" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Yes</text>
  <g>
    <rect x="80" y="190" width="160" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="160" y="220" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Prompt Tuning</text>
    <text x="160" y="240" font-size="11" text-anchor="middle" fill="#5a4a3a">soft prompts only</text>
  </g>

  <!-- Q1 No -> Q2 -->
  <line x1="650" y1="290" x2="650" y2="320" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="668" y="310" font-size="12" font-weight="700" fill="#b3401b">No</text>

  <!-- Q2 diamond -->
  <g>
    <polygon points="650,320 870,385 650,450 430,385" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="650" y="375" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Generation task?</text>
    <text x="650" y="395" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">summarization, text-gen</text>
  </g>

  <!-- Q2 Yes -> Prefix -->
  <line x1="870" y1="385" x2="1055" y2="385" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="962" y="378" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Yes</text>
  <g>
    <rect x="1060" y="350" width="160" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="1140" y="380" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Prefix Tuning</text>
    <text x="1140" y="400" font-size="11" text-anchor="middle" fill="#5a4a3a">layer-wise prefixes</text>
  </g>

  <!-- Q2 No -> Q3 -->
  <line x1="650" y1="450" x2="650" y2="480" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="668" y="470" font-size="12" font-weight="700" fill="#b3401b">No</text>

  <!-- Q3 diamond -->
  <g>
    <polygon points="650,480 880,545 650,610 420,545" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="650" y="535" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">NLU task on a</text>
    <text x="650" y="552" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">small/medium model?</text>
    <text x="650" y="572" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">NER, classification</text>
  </g>

  <!-- Q3 Yes -> P-Tuning v2 -->
  <line x1="420" y1="545" x2="245" y2="545" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="332" y="538" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Yes</text>
  <g>
    <rect x="80" y="510" width="160" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="160" y="540" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">P-Tuning v2</text>
    <text x="160" y="560" font-size="11" text-anchor="middle" fill="#5a4a3a">deep prompt encoding</text>
  </g>

  <!-- Q3 No -> LoRA (highlighted) -->
  <line x1="880" y1="545" x2="1055" y2="545" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="962" y="538" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">No</text>
  <g>
    <rect x="1060" y="500" width="180" height="90" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="2.5"/>
    <text x="1150" y="528" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5e1a">LoRA / QLoRA</text>
    <text x="1150" y="548" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">dominant default</text>
    <text x="1150" y="568" font-size="11" text-anchor="middle" fill="#5a4a3a">low-rank weight deltas,</text>
    <text x="1150" y="582" font-size="11" text-anchor="middle" fill="#5a4a3a">4-bit base optional</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 660)">
    <rect x="0" y="0" width="1140" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Three filters narrow the choice: model scale, task type, and task family. LoRA / QLoRA is the default destination;</text>
    <text x="20" y="62" font-size="12" fill="#1a1a2e">specialized prompts (Prompt, Prefix, P-Tuning v2) win only in their narrow regimes.</text>
  </g>
</svg>
