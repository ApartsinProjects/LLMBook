<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Enterprise Auth Flow for LLM Applications</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">User identity flows through every hop, so backend systems enforce permissions, not the LLM.</text>

  <!-- Five vertical lifelines -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <g>
      <rect x="60" y="100" width="180" height="50" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="150" y="125" fill="#1a1a2e">Employee</text>
      <text x="150" y="142" font-size="11" font-weight="400" fill="#5a4a3a">Sales team member</text>
      <line x1="150" y1="150" x2="150" y2="640" stroke="#722f8a" stroke-width="1" stroke-dasharray="3,4"/>
    </g>
    <g>
      <rect x="290" y="100" width="180" height="50" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
      <text x="380" y="125" fill="#1a1a2e">Identity Provider</text>
      <text x="380" y="142" font-size="11" font-weight="400" fill="#5a4a3a">OIDC / SAML</text>
      <line x1="380" y1="150" x2="380" y2="640" stroke="#1a4078" stroke-width="1" stroke-dasharray="3,4"/>
    </g>
    <g>
      <rect x="520" y="100" width="220" height="50" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="630" y="125" fill="#1a1a2e">LLM Application</text>
      <text x="630" y="142" font-size="11" font-weight="400" fill="#5a4a3a">Validate, RBAC, prompt</text>
      <line x1="630" y1="150" x2="630" y2="640" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="3,4"/>
    </g>
    <g>
      <rect x="790" y="100" width="220" height="50" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
      <text x="900" y="125" fill="#1a1a2e">External Tools</text>
      <text x="900" y="142" font-size="11" font-weight="400" fill="#5a4a3a">CRM, database</text>
      <line x1="900" y1="150" x2="900" y2="640" stroke="#7a5e1a" stroke-width="1" stroke-dasharray="3,4"/>
    </g>
    <g>
      <rect x="1060" y="100" width="180" height="50" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="2"/>
      <text x="1150" y="125" fill="#1a1a2e">Audit Trail</text>
      <text x="1150" y="142" font-size="11" font-weight="400" fill="#5a4a3a">Compliance log</text>
      <line x1="1150" y1="150" x2="1150" y2="640" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,4"/>
    </g>
  </g>

  <!-- Sequence steps -->
  <!-- Step 1: User -> IdP -->
  <g>
    <line x1="150" y1="190" x2="377" y2="190" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="265" y="183" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">1. Sign in</text>
    <text x="265" y="205" font-size="11" text-anchor="middle" fill="#5a4a3a">SSO redirect</text>
  </g>

  <!-- Step 2: IdP -> LLMApp (token) -->
  <g>
    <line x1="380" y1="250" x2="627" y2="250" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="505" y="243" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">2. Issue access token</text>
    <text x="505" y="265" font-size="11" text-anchor="middle" fill="#5a4a3a">Claims: role, dept, tenant</text>
  </g>

  <!-- Step 3: LLMApp self-loop: validate + RBAC -->
  <g>
    <path d="M 630 300 C 730 300, 730 345, 633 345" stroke="#1a1a2e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="745" y="313" font-size="12" font-weight="700" fill="#1f7a3a">3. Validate token</text>
    <text x="745" y="332" font-size="11" fill="#5a4a3a">Signature, expiry, issuer</text>
    <text x="745" y="348" font-size="11" fill="#5a4a3a">RBAC: which tools allowed?</text>
  </g>

  <!-- Step 4: LLMApp -> Tools (token passthrough) -->
  <g>
    <line x1="630" y1="395" x2="897" y2="395" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="763" y="388" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">4. Call tool with user token</text>
    <text x="763" y="410" font-size="11" text-anchor="middle" fill="#5a4a3a">Token passthrough, not impersonation</text>
  </g>

  <!-- Step 5: Tools self-loop: RLS / OAuth scope -->
  <g>
    <path d="M 900 445 C 1000 445, 1000 490, 903 490" stroke="#1a1a2e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="1015" y="458" font-size="12" font-weight="700" fill="#7a5e1a">5. Backend enforces scope</text>
    <text x="1015" y="476" font-size="11" fill="#5a4a3a">CRM: only own accounts</text>
    <text x="1015" y="492" font-size="11" fill="#5a4a3a">DB: row-level security</text>
  </g>

  <!-- Step 6: Tools -> LLMApp (filtered data) -->
  <g>
    <line x1="897" y1="540" x2="633" y2="540" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="763" y="533" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">6. Return filtered data</text>
  </g>

  <!-- Step 7: LLMApp + Tools -> Audit -->
  <g>
    <line x1="630" y1="595" x2="1147" y2="595" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
    <text x="890" y="588" font-size="12" font-weight="700" text-anchor="middle" fill="#5a4a3a">7. Log who, what, when, which data</text>
  </g>

  <!-- Side callout -->
  <g transform="translate(60, 640)">
    <rect width="500" height="90" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Why pass user identity all the way down?</text>
    <text x="14" y="42" font-size="11" fill="#1a1a2e">If the LLM holds a privileged service account, prompt injection can</text>
    <text x="14" y="58" font-size="11" fill="#1a1a2e">read any record. With user-token passthrough, the database refuses</text>
    <text x="14" y="74" font-size="11" fill="#1a1a2e">requests outside the caller's row-level scope.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(580, 640)">
    <rect width="660" height="90" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="14" y="44" font-size="12" fill="#1a1a2e">The LLM never decides who can see what. Identity flows from user to</text>
    <text x="14" y="62" font-size="12" fill="#1a1a2e">IdP to app to tool, and the tool's own access control (OAuth scope,</text>
    <text x="14" y="80" font-size="12" fill="#1a1a2e">row-level security) makes the final call. Audit captures every hop.</text>
  </g>
</svg>
