<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Scaling Laws: Kaplan (2020) vs Chinchilla (2022)</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Same compute budget, two recipes for splitting it between model size and training tokens.</text>

  <!-- Two-lane comparison -->
  <!-- Left: Kaplan -->
  <g transform="translate(60, 95)">
    <rect width="580" height="280" rx="12" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="290" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#b3401b">Kaplan et al. (2020)</text>
    <text x="290" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">"Scale the model aggressively, data follows."</text>

    <!-- Allocation bar -->
    <g transform="translate(30, 80)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1a1a2e">Per 10x compute, scale:</text>
      <g transform="translate(0, 14)">
        <text x="0" y="22" font-size="12" fill="#5a4a3a">Model size</text>
        <rect x="100" y="8" width="320" height="18" rx="3" fill="#b3401b"/>
        <text x="430" y="22" font-size="12" font-weight="700" fill="#1a1a2e">~5x</text>
      </g>
      <g transform="translate(0, 46)">
        <text x="0" y="22" font-size="12" fill="#5a4a3a">Data tokens</text>
        <rect x="100" y="8" width="128" height="18" rx="3" fill="#7a5e1a"/>
        <text x="238" y="22" font-size="12" font-weight="700" fill="#1a1a2e">~2x</text>
      </g>
    </g>

    <!-- Anchor model -->
    <g transform="translate(30, 185)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1a1a2e">Anchor model: GPT-3</text>
      <text x="0" y="22" font-size="12" fill="#1a1a2e">175B parameters, 300B training tokens</text>
      <text x="0" y="44" font-size="12" font-weight="700" fill="#b3401b">Tokens per parameter: ~1.7</text>
      <text x="0" y="64" font-size="11" fill="#5a4a3a">Conclusion: bigger models, modest data growth.</text>
    </g>
  </g>

  <!-- Right: Chinchilla -->
  <g transform="translate(660, 95)">
    <rect width="580" height="280" rx="12" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="290" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Hoffmann et al. (2022) -- Chinchilla</text>
    <text x="290" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">"Model and data should scale together, equally."</text>

    <g transform="translate(30, 80)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1a1a2e">Per 10x compute, scale:</text>
      <g transform="translate(0, 14)">
        <text x="0" y="22" font-size="12" fill="#5a4a3a">Model size</text>
        <rect x="100" y="8" width="200" height="18" rx="3" fill="#1f7a3a"/>
        <text x="310" y="22" font-size="12" font-weight="700" fill="#1a1a2e">~3.2x</text>
      </g>
      <g transform="translate(0, 46)">
        <text x="0" y="22" font-size="12" fill="#5a4a3a">Data tokens</text>
        <rect x="100" y="8" width="200" height="18" rx="3" fill="#1a4078"/>
        <text x="310" y="22" font-size="12" font-weight="700" fill="#1a1a2e">~3.2x</text>
      </g>
    </g>

    <g transform="translate(30, 185)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1a1a2e">Anchor model: Chinchilla</text>
      <text x="0" y="22" font-size="12" fill="#1a1a2e">70B parameters, 1.4T training tokens</text>
      <text x="0" y="44" font-size="12" font-weight="700" fill="#1f7a3a">Tokens per parameter: ~20</text>
      <text x="0" y="64" font-size="11" fill="#5a4a3a">Result: matches GPT-3 quality with 2.5x fewer params.</text>
    </g>
  </g>

  <!-- Implications panel -->
  <g transform="translate(60, 400)">
    <rect width="1180" height="180" rx="12" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#722f8a">What changed in practice</text>

    <g font-size="12" fill="#1a1a2e">
      <!-- Column 1 -->
      <g transform="translate(20, 55)">
        <text x="0" y="0" font-size="13" font-weight="700" fill="#1a1a2e">Compute budget split</text>
        <text x="0" y="22">Kaplan favored parameters, leading to undertrained giants.</text>
        <text x="0" y="42">Chinchilla shows equal-exponent scaling is loss-optimal.</text>
        <text x="0" y="62">Models in 2022+ trend smaller with much more data.</text>
      </g>

      <!-- Column 2 -->
      <g transform="translate(420, 55)">
        <text x="0" y="0" font-size="13" font-weight="700" fill="#1a1a2e">Inference cost matters</text>
        <text x="0" y="22">Smaller, well-trained models are cheaper to serve.</text>
        <text x="0" y="42">LLaMA, Mistral, Gemma push the ratio even further</text>
        <text x="0" y="62">(often 100x+ tokens per parameter at deployment).</text>
      </g>

      <!-- Column 3 -->
      <g transform="translate(820, 55)">
        <text x="0" y="0" font-size="13" font-weight="700" fill="#1a1a2e">Data is now the constraint</text>
        <text x="0" y="22">Chinchilla-optimal training needs trillions of tokens.</text>
        <text x="0" y="42">Quality, deduplication, and domain mix dominate the</text>
        <text x="0" y="62">research agenda; raw web text is no longer enough.</text>
      </g>
    </g>
  </g>

  <!-- Callout: rule of thumb -->
  <g transform="translate(60, 600)">
    <rect width="1180" height="62" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#7a5e1a">Rule of thumb (Chinchilla)</text>
    <text x="20" y="44" font-size="12" fill="#1a1a2e">For a fixed compute budget C (in FLOPs), allocate model size N and tokens D so that N is proportional to C^0.5 and D is proportional to C^0.5,</text>
    <text x="20" y="60" font-size="12" fill="#1a1a2e">with the empirical sweet spot at roughly 20 training tokens per parameter.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 685)">
    <rect width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Kaplan said spend compute on parameters; Chinchilla showed you should split it evenly between parameters and tokens, which made smaller, data-rich models the new default.</text>
  </g>
</svg>
