<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
  </defs>

  <text x="750" y="46" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">Unigram language model tokenizer: train by pruning, decode by Viterbi</text>
  <text x="750" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Left: shrink an over-large vocabulary by removing tokens that hurt corpus likelihood least. Right: at inference, pick the highest-probability segmentation of one word.</text>

  <line x1="750" y1="110" x2="750" y2="780" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="6,6"/>

  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="690" height="40" rx="6" fill="#1a4078"/>
    <text x="20" y="27" font-size="17" font-weight="700" fill="#ffffff">LEFT --- Training: loss-based pruning</text>
    <text x="670" y="27" font-size="13" text-anchor="end" fill="#ffffff">offline, once</text>
  </g>

  <g transform="translate(40, 170)">
    <rect x="0" y="0" width="690" height="80" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <circle cx="32" cy="40" r="18" fill="#1a4078"/>
    <text x="32" y="46" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="62" y="32" font-size="15" font-weight="700" fill="#1a4078">Seed an over-large vocabulary</text>
    <text x="62" y="54" font-size="13" fill="#1a1a2e">All substrings (or all BPE merges) up to ~10x final size, e.g. 200k pieces.</text>
    <text x="62" y="72" font-size="12" font-style="italic" fill="#5a4a3a">Each piece p gets an initial probability p(w) from corpus counts.</text>
  </g>

  <g transform="translate(40, 270)">
    <rect x="0" y="0" width="690" height="100" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <circle cx="32" cy="40" r="18" fill="#1a4078"/>
    <text x="32" y="46" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="62" y="32" font-size="15" font-weight="700" fill="#1a4078">Score each token's loss contribution</text>
    <text x="62" y="54" font-size="13" fill="#1a1a2e">For each token p, compute &#991166;L(p) = how much corpus log-likelihood drops if p is removed.</text>
    <text x="62" y="74" font-size="13" font-family="Consolas, monospace" fill="#1a1a2e">L = &#993311; log P(best segmentation of word w)</text>
    <text x="62" y="92" font-size="12" font-style="italic" fill="#5a4a3a">Tokens used by no good segmentation have &#991166;L &#8776; 0; safe to drop.</text>
  </g>

  <g transform="translate(40, 390)">
    <rect x="0" y="0" width="690" height="100" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <circle cx="32" cy="40" r="18" fill="#1a4078"/>
    <text x="32" y="46" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="62" y="32" font-size="15" font-weight="700" fill="#1a4078">Prune lowest 10-20%, re-estimate, repeat</text>
    <text x="62" y="54" font-size="13" fill="#1a1a2e">Remove the bottom-loss tokens, run EM to update probabilities, score again.</text>
    <text x="62" y="74" font-size="13" fill="#1a1a2e">Loop until vocab reaches the target size (e.g. 32k).</text>
    <text x="62" y="92" font-size="12" font-style="italic" fill="#5a4a3a">Result: a probabilistic vocabulary, not a fixed merge list.</text>
  </g>

  <g transform="translate(40, 510)">
    <rect x="0" y="0" width="690" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#1f7a3a">Output: Vocabulary V with probabilities {p(w)}</text>
    <text x="20" y="52" font-size="13" fill="#1a1a2e">Saved alongside the model. Used at inference to score every possible split.</text>
    <text x="20" y="72" font-size="12" font-style="italic" fill="#5a4a3a">Used by SentencePiece (T5, ALBERT, XLNet, mT5, multilingual models).</text>
  </g>

  <g transform="translate(40, 610)">
    <rect x="0" y="0" width="690" height="80" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="24" font-size="13" font-weight="700" fill="#7a5e1a">Why this beats BPE merges</text>
    <text x="16" y="46" font-size="12" fill="#1a1a2e">BPE commits to a single greedy split. Unigram keeps probabilities for every piece, so</text>
    <text x="16" y="64" font-size="12" fill="#1a1a2e">at inference it can pick the segmentation that maximizes likelihood, not the first merge it hits.</text>
  </g>

  <g transform="translate(770, 110)">
    <rect x="0" y="0" width="690" height="40" rx="6" fill="#1f7a3a"/>
    <text x="20" y="27" font-size="17" font-weight="700" fill="#ffffff">RIGHT --- Inference: Viterbi best path on "unhappiness"</text>
    <text x="670" y="27" font-size="13" text-anchor="end" fill="#ffffff">per token, fast</text>
  </g>

  <g transform="translate(770, 170)">
    <rect x="0" y="0" width="690" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#1a4078">Input word</text>
    <text x="345" y="44" font-size="22" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">u  n  h  a  p  p  i  n  e  s  s</text>
  </g>

  <g transform="translate(770, 250)">
    <rect x="0" y="0" width="690" height="320" rx="8" fill="#ffffff" stroke="#5a4a3a" stroke-width="1"/>
    <text x="20" y="26" font-size="14" font-weight="700" fill="#1a1a2e">Token lattice (candidates from V with their log p)</text>

    <g font-size="12" fill="#5a4a3a">
      <text x="40"  y="58" text-anchor="middle">0</text>
      <text x="95"  y="58" text-anchor="middle">1</text>
      <text x="150" y="58" text-anchor="middle">2</text>
      <text x="205" y="58" text-anchor="middle">3</text>
      <text x="260" y="58" text-anchor="middle">4</text>
      <text x="315" y="58" text-anchor="middle">5</text>
      <text x="370" y="58" text-anchor="middle">6</text>
      <text x="425" y="58" text-anchor="middle">7</text>
      <text x="480" y="58" text-anchor="middle">8</text>
      <text x="535" y="58" text-anchor="middle">9</text>
      <text x="590" y="58" text-anchor="middle">10</text>
      <text x="645" y="58" text-anchor="middle">11</text>
    </g>
    <g fill="#ffffff" stroke="#1a1a2e" stroke-width="1.2">
      <circle cx="40"  cy="80" r="8"/>
      <circle cx="95"  cy="80" r="8"/>
      <circle cx="150" cy="80" r="8"/>
      <circle cx="205" cy="80" r="8"/>
      <circle cx="260" cy="80" r="8"/>
      <circle cx="315" cy="80" r="8"/>
      <circle cx="370" cy="80" r="8"/>
      <circle cx="425" cy="80" r="8"/>
      <circle cx="480" cy="80" r="8"/>
      <circle cx="535" cy="80" r="8"/>
      <circle cx="590" cy="80" r="8"/>
      <circle cx="645" cy="80" r="8"/>
    </g>

    <path d="M 40 80 Q 95 30 150 80" fill="none" stroke="#1f7a3a" stroke-width="3" marker-end="url(#arrG)"/>
    <rect x="78" y="100" width="40" height="22" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="98" y="115" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1f7a3a">"un"</text>
    <text x="98" y="135" font-size="11" text-anchor="middle" fill="#1f7a3a">-1.2</text>

    <path d="M 40 80 Q 67 130 95 80" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="60" y="170" font-size="11" fill="#5a4a3a">"u" -4.8</text>

    <path d="M 40 80 Q 122 20 205 80" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="160" y="20" font-size="11" fill="#5a4a3a">"unh" -5.1</text>

    <path d="M 150 80 Q 260 25 370 80" fill="none" stroke="#1f7a3a" stroke-width="3" marker-end="url(#arrG)"/>
    <rect x="240" y="100" width="56" height="22" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="268" y="115" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1f7a3a">"happi"</text>
    <text x="268" y="135" font-size="11" text-anchor="middle" fill="#1f7a3a">-2.4</text>

    <path d="M 150 80 Q 260 145 370 80" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="245" y="190" font-size="11" fill="#5a4a3a">"hap" + "pi" -4.0</text>

    <path d="M 425 80 Q 535 25 645 80" fill="none" stroke="#1f7a3a" stroke-width="3" marker-end="url(#arrG)"/>
    <rect x="510" y="100" width="50" height="22" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="535" y="115" font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1f7a3a">"ness"</text>
    <text x="535" y="135" font-size="11" text-anchor="middle" fill="#1f7a3a">-1.8</text>

    <path d="M 425 80 Q 535 155 645 80" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="525" y="200" font-size="11" fill="#5a4a3a">"n"+"ess" -5.5</text>

    <g transform="translate(20, 230)">
      <line x1="0" y1="6" x2="40" y2="6" stroke="#1f7a3a" stroke-width="3"/>
      <text x="48" y="10" font-size="12" fill="#1a1a2e">best Viterbi path (highest log-prob sum)</text>
      <line x1="0" y1="30" x2="40" y2="30" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="48" y="34" font-size="12" fill="#1a1a2e">alternative segmentations (rejected)</text>
    </g>

    <text x="20" y="295" font-size="13" font-weight="700" fill="#1a1a2e">Score: log p("un") + log p("happi") + log p("ness") = -1.2 + -2.4 + -1.8 = -5.4</text>
    <text x="20" y="312" font-size="12" font-style="italic" fill="#5a4a3a">All other splits score lower (more negative).</text>
  </g>

  <g transform="translate(770, 590)">
    <rect x="0" y="0" width="690" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#1f7a3a">Output tokens</text>
    <rect x="20"  y="42" width="80" height="30" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="60"  y="62" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"un"</text>
    <rect x="110" y="42" width="100" height="30" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="160" y="62" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"happi"</text>
    <rect x="220" y="42" width="90" height="30" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="265" y="62" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">"ness"</text>
    <text x="380" y="62" font-size="13" font-style="italic" fill="#5a4a3a">3 tokens, joint log-prob -5.4</text>
  </g>

  <g transform="translate(770, 690)">
    <rect x="0" y="0" width="690" height="80" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="24" font-size="13" font-weight="700" fill="#7a5e1a">Bonus: subword regularization</text>
    <text x="16" y="46" font-size="12" fill="#1a1a2e">During training of the downstream model, sample from the top-k paths instead of always picking</text>
    <text x="16" y="64" font-size="12" fill="#1a1a2e">argmax. The model sees varied tokenizations of the same word, a free regularizer.</text>
  </g>

  <g transform="translate(40, 800)">
    <rect x="0" y="0" width="1420" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="52" font-size="13" fill="#1a1a2e">Unigram is probabilistic where BPE is greedy: training prunes a huge vocabulary by likelihood loss, inference runs Viterbi over a token lattice to pick the most probable split. Same vocabulary, principled segmentation.</text>
  </g>
</svg>
