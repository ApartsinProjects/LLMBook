<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">LoRA: Low-Rank Adaptation of Weight Matrices</text>
  <text x="600" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">Freeze the original weights; learn a tiny rank-r update instead</text>

  <!-- ============================================================ -->
  <!-- LEFT PANEL: Frozen pretrained weight                         -->
  <!-- ============================================================ -->
  <g filter="url(#sh)">
    <rect x="80" y="120" width="290" height="290" rx="6" fill="#e8eef5" stroke="#1a4078" stroke-width="2"/>
  </g>
  <!-- Lock icon for "frozen" -->
  <g transform="translate(110,150)">
    <rect x="0" y="8" width="24" height="20" rx="3" fill="#5a4a3a"/>
    <path d="M 4 8 L 4 4 A 8 8 0 0 1 20 4 L 20 8" fill="none" stroke="#5a4a3a" stroke-width="3"/>
    <circle cx="12" cy="17" r="2.5" fill="#ffffff"/>
  </g>
  <text x="148" y="167" font-size="13" font-weight="700" fill="#5a4a3a">Frozen</text>
  <text x="225" y="285" text-anchor="middle" font-size="34" font-weight="700" fill="#1a4078" font-style="italic">W₀</text>
  <text x="225" y="320" text-anchor="middle" font-size="15" fill="#1a1a2e">Pretrained weight matrix</text>
  <text x="225" y="345" text-anchor="middle" font-size="13" fill="#5a4a3a">shape: d × k  (e.g. 4096 × 4096)</text>
  <text x="225" y="375" text-anchor="middle" font-size="12" fill="#5a4a3a" font-style="italic">~16 million parameters,</text>
  <text x="225" y="392" text-anchor="middle" font-size="12" fill="#5a4a3a" font-style="italic">never updated during fine-tuning</text>

  <!-- Plus sign -->
  <g transform="translate(390,255)">
    <circle cx="20" cy="20" r="22" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
    <line x1="8" y1="20" x2="32" y2="20" stroke="#1a1a2e" stroke-width="3"/>
    <line x1="20" y1="8" x2="20" y2="32" stroke="#1a1a2e" stroke-width="3"/>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL: Low-rank update B @ A                            -->
  <!-- ============================================================ -->
  <!-- Background panel grouping B and A -->
  <rect x="470" y="100" width="650" height="360" rx="10" fill="#fef3e0" stroke="#d4b96a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="795" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5e1a">Low-rank update  (ΔW = B · A)  — trainable</text>

  <!-- B: d x r (tall thin) -->
  <g filter="url(#sh)">
    <rect x="510" y="160" width="80" height="260" rx="4" fill="#e0f2e8" stroke="#1f7a3a" stroke-width="2"/>
  </g>
  <text x="550" y="295" text-anchor="middle" font-size="34" font-weight="700" fill="#1f7a3a" font-style="italic">B</text>
  <text x="550" y="445" text-anchor="middle" font-size="13" fill="#1a1a2e">d × r</text>
  <text x="550" y="463" text-anchor="middle" font-size="11" fill="#5a4a3a">(e.g. 4096 × 8)</text>
  <!-- d annotation -->
  <text x="492" y="295" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic" transform="rotate(-90 492 295)">d rows</text>
  <!-- r annotation -->
  <text x="550" y="150" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">r cols</text>

  <!-- @ symbol (matrix multiply) -->
  <g transform="translate(625,275)">
    <circle cx="20" cy="15" r="20" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
    <text x="20" y="22" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">×</text>
  </g>

  <!-- A: r x k (short wide) -->
  <g filter="url(#sh)">
    <rect x="700" y="265" width="380" height="60" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
  </g>
  <text x="890" y="305" text-anchor="middle" font-size="34" font-weight="700" fill="#722f8a" font-style="italic">A</text>
  <text x="890" y="345" text-anchor="middle" font-size="13" fill="#1a1a2e">r × k</text>
  <text x="890" y="362" text-anchor="middle" font-size="11" fill="#5a4a3a">(e.g. 8 × 4096)</text>
  <!-- r annotation -->
  <text x="685" y="298" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">r rows</text>
  <!-- k annotation -->
  <text x="890" y="255" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">k columns</text>

  <!-- Trainable label -->
  <text x="795" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#1f7a3a">Only B and A are updated by gradient descent</text>
  <text x="795" y="420" text-anchor="middle" font-size="12" fill="#5a4a3a" font-style="italic">parameters: 2 · d · r  ≈  65 K  (vs. 16 M for full fine-tune)</text>
  <text x="795" y="438" text-anchor="middle" font-size="12" fill="#1f7a3a" font-weight="600">~250× fewer trainable parameters</text>

  <!-- ============================================================ -->
  <!-- FORWARD PASS at bottom                                        -->
  <!-- ============================================================ -->
  <g transform="translate(0,495)">
    <rect x="80" y="20" width="1040" height="160" rx="10" fill="#fafbfc" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="600" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Forward pass (during inference and training)</text>

    <!-- Input x -->
    <rect x="120" y="80" width="100" height="50" rx="6" fill="#e8eef5" stroke="#1a4078" stroke-width="1.5"/>
    <text x="170" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e" font-style="italic">x</text>

    <!-- Arrow -->
    <line x1="225" y1="105" x2="280" y2="105" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- W0 . x  (frozen path) -->
    <rect x="285" y="65" width="200" height="40" rx="6" fill="#e8eef5" stroke="#1a4078" stroke-width="1.5"/>
    <text x="385" y="92" text-anchor="middle" font-size="16" fill="#1a1a2e" font-style="italic">W₀ · x  (frozen)</text>

    <!-- B(A x)  (trainable path) -->
    <rect x="285" y="115" width="200" height="40" rx="6" fill="#fef3e0" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="385" y="142" text-anchor="middle" font-size="16" fill="#1a1a2e" font-style="italic">B · (A · x)  (trainable)</text>

    <!-- Arrow to plus -->
    <line x1="490" y1="105" x2="540" y2="105" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Plus -->
    <circle cx="565" cy="105" r="20" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
    <line x1="553" y1="105" x2="577" y2="105" stroke="#1a1a2e" stroke-width="3"/>
    <line x1="565" y1="93" x2="565" y2="117" stroke="#1a1a2e" stroke-width="3"/>

    <!-- Arrow to output -->
    <line x1="590" y1="105" x2="650" y2="105" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Output h -->
    <rect x="655" y="80" width="120" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="715" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e" font-style="italic">h</text>

    <!-- Equation -->
    <text x="930" y="115" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e" font-style="italic">h = W₀ x + B A x</text>
    <text x="930" y="138" text-anchor="middle" font-size="12" fill="#5a4a3a">(rank r &lt;&lt; d, k)</text>
  </g>
</svg>
