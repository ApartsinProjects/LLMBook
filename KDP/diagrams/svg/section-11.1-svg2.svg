<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The Five-Part Prompt Skeleton</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Every reliable prompt orders these five sections; the model attends most strongly to the first and last.</text>

  <!-- Attention curve background -->
  <g transform="translate(80, 100)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#5a4a3a">Model attention (U-shape)</text>
    <path d="M 0 30 Q 600 110 1140 30" fill="none" stroke="#b3401b" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="20" y="22" font-size="11" fill="#b3401b">high</text>
    <text x="560" y="100" font-size="11" fill="#b3401b">middle gets lost</text>
    <text x="1080" y="22" font-size="11" fill="#b3401b">high</text>
  </g>

  <!-- Five sections -->
  <g transform="translate(80, 220)">
    <!-- 1 ROLE -->
    <g>
      <rect x="0" y="0" width="218" height="160" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
      <circle cx="32" cy="32" r="18" fill="#1a4078"/>
      <text x="32" y="37" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
      <text x="60" y="38" font-size="14" font-weight="700" fill="#1a4078">ROLE</text>
      <text x="16" y="74" font-size="12" fill="#1a1a2e">Persona,</text>
      <text x="16" y="92" font-size="12" fill="#1a1a2e">expertise level,</text>
      <text x="16" y="110" font-size="12" fill="#1a1a2e">domain.</text>
      <text x="16" y="138" font-size="11" font-style="italic" fill="#5a4a3a">"Senior auditor"</text>
    </g>

    <line x1="218" y1="80" x2="248" y2="80" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- 2 TASK -->
    <g transform="translate(248, 0)">
      <rect x="0" y="0" width="218" height="160" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <circle cx="32" cy="32" r="18" fill="#1f7a3a"/>
      <text x="32" y="37" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
      <text x="60" y="38" font-size="14" font-weight="700" fill="#1f7a3a">TASK</text>
      <text x="16" y="74" font-size="12" fill="#1a1a2e">What to do</text>
      <text x="16" y="92" font-size="12" fill="#1a1a2e">with the input.</text>
      <text x="16" y="110" font-size="12" fill="#1a1a2e">Verb-driven.</text>
      <text x="16" y="138" font-size="11" font-style="italic" fill="#5a4a3a">"Classify, then ..."</text>
    </g>

    <line x1="466" y1="80" x2="496" y2="80" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- 3 CONSTRAINTS -->
    <g transform="translate(496, 0)">
      <rect x="0" y="0" width="218" height="160" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <circle cx="32" cy="32" r="18" fill="#722f8a"/>
      <text x="32" y="37" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
      <text x="60" y="38" font-size="14" font-weight="700" fill="#722f8a">CONSTRAINTS</text>
      <text x="16" y="74" font-size="12" fill="#1a1a2e">Boundaries,</text>
      <text x="16" y="92" font-size="12" fill="#1a1a2e">prohibitions,</text>
      <text x="16" y="110" font-size="12" fill="#1a1a2e">safety rules.</text>
      <text x="16" y="138" font-size="11" font-style="italic" fill="#5a4a3a">"Never invent IDs"</text>
    </g>

    <line x1="714" y1="80" x2="744" y2="80" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- 4 OUTPUT -->
    <g transform="translate(744, 0)">
      <rect x="0" y="0" width="218" height="160" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
      <circle cx="32" cy="32" r="18" fill="#7a5e1a"/>
      <text x="32" y="37" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
      <text x="60" y="38" font-size="14" font-weight="700" fill="#7a5e1a">FORMAT</text>
      <text x="16" y="74" font-size="12" fill="#1a1a2e">JSON schema,</text>
      <text x="16" y="92" font-size="12" fill="#1a1a2e">structure,</text>
      <text x="16" y="110" font-size="12" fill="#1a1a2e">field names.</text>
      <text x="16" y="138" font-size="11" font-style="italic" fill="#5a4a3a">"keys: id, score"</text>
    </g>

    <line x1="962" y1="80" x2="992" y2="80" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- 5 EXAMPLES -->
    <g transform="translate(992, 0)">
      <rect x="0" y="0" width="218" height="160" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <circle cx="32" cy="32" r="18" fill="#b3401b"/>
      <text x="32" y="37" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
      <text x="60" y="38" font-size="14" font-weight="700" fill="#b3401b">EXAMPLES</text>
      <text x="16" y="74" font-size="12" fill="#1a1a2e">Few-shot</text>
      <text x="16" y="92" font-size="12" fill="#1a1a2e">demonstrations</text>
      <text x="16" y="110" font-size="12" fill="#1a1a2e">of behavior.</text>
      <text x="16" y="138" font-size="11" font-style="italic" fill="#5a4a3a">2-5 input/output pairs</text>
    </g>
  </g>

  <!-- Why edges-first callout -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="1140" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why position matters</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Long-context studies show a U-shaped attention curve: tokens at the very start and end are recalled more reliably than tokens in the middle.</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">Put the role first to anchor identity, examples last so the model sees the format right before generating its answer.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 540)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Always include all five sections in this order. Skip any one and you trade reliability for brevity; demonstrations at the end give the largest accuracy bump.</text>
  </g>
</svg>
