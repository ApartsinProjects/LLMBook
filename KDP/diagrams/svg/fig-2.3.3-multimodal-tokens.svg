<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Multimodal tokens: text and images share one transformer sequence</text>
  <text x="650" y="64" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Two front-ends, one back-end. Each modality is mapped into the same embedding space, then concatenated into a single token stream.</text>

  <!-- TEXT LANE -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="540" height="380" rx="10" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="36" rx="10" fill="#1a4078"/>
    <text x="20" y="24" font-size="15" font-weight="700" fill="#ffffff">Text lane</text>

    <!-- Raw text -->
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="460" height="56" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#1a4078">Raw text</text>
      <text x="14" y="44" font-size="14" fill="#1a1a2e" font-family="monospace">"A cat on a mat"</text>
    </g>

    <line x1="270" y1="120" x2="270" y2="148" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="285" y="138" font-size="11" fill="#5a4a3a">BPE tokenizer</text>

    <!-- Tokens -->
    <g transform="translate(40, 156)">
      <rect x="0" y="0" width="460" height="76" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="14" y="20" font-size="12" font-weight="700" fill="#1a4078">6 text tokens</text>
      <g transform="translate(14, 32)">
        <rect x="0"   y="0" width="55" height="32" rx="4" fill="#eef4fa" stroke="#1a4078"/><text x="27" y="20" font-size="12" text-anchor="middle" fill="#1a1a2e">A</text>
        <rect x="60"  y="0" width="65" height="32" rx="4" fill="#eef4fa" stroke="#1a4078"/><text x="92" y="20" font-size="12" text-anchor="middle" fill="#1a1a2e">cat</text>
        <rect x="130" y="0" width="55" height="32" rx="4" fill="#eef4fa" stroke="#1a4078"/><text x="157" y="20" font-size="12" text-anchor="middle" fill="#1a1a2e">on</text>
        <rect x="190" y="0" width="50" height="32" rx="4" fill="#eef4fa" stroke="#1a4078"/><text x="215" y="20" font-size="12" text-anchor="middle" fill="#1a1a2e">a</text>
        <rect x="245" y="0" width="65" height="32" rx="4" fill="#eef4fa" stroke="#1a4078"/><text x="277" y="20" font-size="12" text-anchor="middle" fill="#1a1a2e">mat</text>
        <rect x="315" y="0" width="65" height="32" rx="4" fill="#eef4fa" stroke="#1a4078"/><text x="347" y="20" font-size="11" text-anchor="middle" fill="#1a1a2e">&lt;eos&gt;</text>
      </g>
    </g>

    <line x1="270" y1="236" x2="270" y2="264" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="285" y="254" font-size="11" fill="#5a4a3a">Embedding lookup</text>

    <!-- Embeddings -->
    <g transform="translate(40, 272)">
      <rect x="0" y="0" width="460" height="86" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="14" y="20" font-size="12" font-weight="700" fill="#722f8a">Token embeddings (d = 4096)</text>
      <g transform="translate(14, 32)">
        <rect x="0"   y="0" width="55" height="42" rx="4" fill="#f4ecf7" stroke="#722f8a"/>
        <rect x="60"  y="0" width="55" height="42" rx="4" fill="#f4ecf7" stroke="#722f8a"/>
        <rect x="120" y="0" width="55" height="42" rx="4" fill="#f4ecf7" stroke="#722f8a"/>
        <rect x="180" y="0" width="55" height="42" rx="4" fill="#f4ecf7" stroke="#722f8a"/>
        <rect x="240" y="0" width="55" height="42" rx="4" fill="#f4ecf7" stroke="#722f8a"/>
        <rect x="300" y="0" width="55" height="42" rx="4" fill="#f4ecf7" stroke="#722f8a"/>
        <text x="178" y="62" font-size="11" text-anchor="middle" fill="#5a4a3a">6 vectors of length 4096</text>
      </g>
    </g>
  </g>

  <!-- IMAGE LANE -->
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="540" height="380" rx="10" fill="#ffffff" stroke="#7a5e1a" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="36" rx="10" fill="#7a5e1a"/>
    <text x="20" y="24" font-size="15" font-weight="700" fill="#ffffff">Image lane</text>

    <!-- Raw image: 224x224 -->
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="460" height="56" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Raw image</text>
      <text x="14" y="44" font-size="14" fill="#1a1a2e" font-family="monospace">224 x 224 pixels (RGB)</text>
    </g>

    <line x1="270" y1="120" x2="270" y2="148" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="285" y="138" font-size="11" fill="#5a4a3a">Patch + linear proj</text>

    <!-- 14x14 grid of patches (mini visual) -->
    <g transform="translate(40, 156)">
      <rect x="0" y="0" width="460" height="76" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1.5"/>
      <text x="14" y="20" font-size="12" font-weight="700" fill="#7a5e1a">196 image patches (14 x 14 grid of 16-px tiles)</text>
      <g transform="translate(180, 30)">
        <!-- a tiny 7x4 grid icon as visual hint -->
        <g fill="#fef3e0" stroke="#7a5e1a" stroke-width="0.8">
          <rect x="0"  y="0" width="14" height="14"/><rect x="15" y="0" width="14" height="14"/><rect x="30" y="0" width="14" height="14"/><rect x="45" y="0" width="14" height="14"/><rect x="60" y="0" width="14" height="14"/><rect x="75" y="0" width="14" height="14"/><rect x="90" y="0" width="14" height="14"/>
          <rect x="0" y="15" width="14" height="14"/><rect x="15" y="15" width="14" height="14"/><rect x="30" y="15" width="14" height="14"/><rect x="45" y="15" width="14" height="14"/><rect x="60" y="15" width="14" height="14"/><rect x="75" y="15" width="14" height="14"/><rect x="90" y="15" width="14" height="14"/>
          <rect x="0" y="30" width="14" height="14"/><rect x="15" y="30" width="14" height="14"/><rect x="30" y="30" width="14" height="14"/><rect x="45" y="30" width="14" height="14"/><rect x="60" y="30" width="14" height="14"/><rect x="75" y="30" width="14" height="14"/><rect x="90" y="30" width="14" height="14"/>
        </g>
        <text x="52" y="60" font-size="11" text-anchor="middle" fill="#5a4a3a">(14 x 14 = 196 tiles total)</text>
      </g>
    </g>

    <line x1="270" y1="236" x2="270" y2="264" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="285" y="254" font-size="11" fill="#5a4a3a">Vision encoder + projection</text>

    <!-- Embeddings -->
    <g transform="translate(40, 272)">
      <rect x="0" y="0" width="460" height="86" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="14" y="20" font-size="12" font-weight="700" fill="#722f8a">Image-token embeddings (d = 4096, same space as text)</text>
      <g transform="translate(14, 32)">
        <rect x="0"   y="0" width="32" height="42" rx="3" fill="#f4ecf7" stroke="#722f8a"/>
        <rect x="36"  y="0" width="32" height="42" rx="3" fill="#f4ecf7" stroke="#722f8a"/>
        <rect x="72"  y="0" width="32" height="42" rx="3" fill="#f4ecf7" stroke="#722f8a"/>
        <text x="116" y="26" font-size="14" fill="#5a4a3a">. . .</text>
        <rect x="160" y="0" width="32" height="42" rx="3" fill="#f4ecf7" stroke="#722f8a"/>
        <rect x="196" y="0" width="32" height="42" rx="3" fill="#f4ecf7" stroke="#722f8a"/>
        <text x="180" y="62" font-size="11" text-anchor="middle" fill="#5a4a3a">196 vectors of length 4096</text>
      </g>
    </g>
  </g>

  <!-- Joint sequence + transformer -->
  <g transform="translate(40, 506)">
    <rect x="0" y="0" width="1120" height="120" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="26" font-size="14" font-weight="700" fill="#1f7a3a">Concatenated sequence (202 tokens) into shared transformer</text>

    <!-- token strip -->
    <g transform="translate(20, 42)">
      <!-- 6 text tokens -->
      <rect x="0" y="0" width="170" height="34" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="85" y="22" font-size="11" text-anchor="middle" fill="#1a4078" font-weight="700">6 text tokens</text>
      <!-- 196 image tokens -->
      <rect x="178" y="0" width="700" height="34" rx="4" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
      <text x="528" y="22" font-size="11" text-anchor="middle" fill="#7a5e1a" font-weight="700">196 image tokens</text>
      <!-- transformer -->
      <rect x="900" y="-6" width="180" height="46" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="990" y="13" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Transformer</text>
      <text x="990" y="30" font-size="11" text-anchor="middle" fill="#1a1a2e">202 total tokens</text>
      <line x1="878" y1="17" x2="898" y2="17" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
    </g>

    <text x="20" y="104" font-size="11" fill="#5a4a3a" font-style="italic">Self-attention now mixes "cat" with the patches that depict the cat. Position embeddings can be 1-D for both, or 2-D for image tokens.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 656)">
    <rect x="0" y="0" width="1220" height="78" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">A "token" is just a vector in the model's embedding space. As long as text and images both project into that same space, the transformer treats them uniformly.</text>
    <text x="20" y="66" font-size="12" fill="#1a1a2e">The image lane replaces tokenizer + lookup with patching + a learned vision encoder, but the back-end is identical to a pure text transformer.</text>
  </g>
</svg>
