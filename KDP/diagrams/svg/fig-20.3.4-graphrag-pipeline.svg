<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">GraphRAG: Indexing + Query Pipeline</text>
  <text x="700" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">Build a knowledge graph offline; route queries to local entity search or global community summaries</text>

  <!-- ============================================================ -->
  <!-- PHASE A: INDEXING (offline)                                   -->
  <!-- ============================================================ -->
  <rect x="40" y="100" width="1320" height="280" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
  <g transform="translate(60,125)">
    <circle cx="20" cy="20" r="20" fill="#1a4078"/>
    <text x="20" y="27" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">A</text>
    <text x="55" y="20" font-size="18" font-weight="700" fill="#1a4078">Indexing  (offline, run once per corpus)</text>
    <text x="55" y="42" font-size="12" fill="#5a4a3a" font-style="italic">Build a knowledge graph and pre-compute community summaries</text>
  </g>

  <!-- Step 1: Documents -->
  <g filter="url(#sh)" transform="translate(80,200)">
    <ellipse cx="50" cy="20" rx="50" ry="12" fill="#e0e7ef" stroke="#1a4078" stroke-width="1.5"/>
    <rect x="0" y="20" width="100" height="80" fill="#e0e7ef" stroke="#1a4078" stroke-width="1.5"/>
    <ellipse cx="50" cy="100" rx="50" ry="12" fill="#cfd8e3" stroke="#1a4078" stroke-width="1.5"/>
    <ellipse cx="50" cy="20" rx="50" ry="12" fill="none" stroke="#1a4078" stroke-width="1.5"/>
    <text x="50" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Documents</text>
  </g>
  <text x="130" y="345" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">raw corpus</text>

  <line x1="190" y1="260" x2="240" y2="260" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: Entity & relation extraction (LLM) -->
  <g filter="url(#sh)" transform="translate(245,225)">
    <rect x="0" y="0" width="170" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.8"/>
    <text x="85" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">LLM Extraction</text>
    <text x="85" y="40" text-anchor="middle" font-size="11" fill="#5a4a3a">entities + relations</text>
    <text x="85" y="55" text-anchor="middle" font-size="11" fill="#5a4a3a">per document chunk</text>
    <text x="85" y="68" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">(named-entity + RE)</text>
  </g>
  <text x="330" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#5a4a3a">1</text>

  <line x1="420" y1="260" x2="465" y2="260" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Knowledge graph (custom: nodes + edges) -->
  <g filter="url(#sh)" transform="translate(470,200)">
    <rect x="0" y="0" width="180" height="120" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="90" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Knowledge Graph</text>
    <!-- Mini graph illustration -->
    <g transform="translate(20,30)">
      <circle cx="20" cy="25" r="9" fill="#1a4078"/>
      <circle cx="65" cy="15" r="9" fill="#1a4078"/>
      <circle cx="110" cy="30" r="9" fill="#1a4078"/>
      <circle cx="40" cy="65" r="9" fill="#1a4078"/>
      <circle cx="90" cy="70" r="9" fill="#1a4078"/>
      <circle cx="135" cy="60" r="9" fill="#1a4078"/>
      <line x1="20" y1="25" x2="65" y2="15" stroke="#5a4a3a" stroke-width="1.2"/>
      <line x1="65" y1="15" x2="110" y2="30" stroke="#5a4a3a" stroke-width="1.2"/>
      <line x1="20" y1="25" x2="40" y2="65" stroke="#5a4a3a" stroke-width="1.2"/>
      <line x1="40" y1="65" x2="90" y2="70" stroke="#5a4a3a" stroke-width="1.2"/>
      <line x1="90" y1="70" x2="110" y2="30" stroke="#5a4a3a" stroke-width="1.2"/>
      <line x1="90" y1="70" x2="135" y2="60" stroke="#5a4a3a" stroke-width="1.2"/>
    </g>
    <text x="90" y="115" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">entity nodes + typed edges</text>
  </g>
  <text x="555" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#5a4a3a">2</text>

  <line x1="655" y1="260" x2="700" y2="260" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: Leiden community detection -->
  <g filter="url(#sh)" transform="translate(705,200)">
    <rect x="0" y="0" width="180" height="120" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.8"/>
    <text x="90" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Leiden Communities</text>
    <!-- Two clusters of dots -->
    <g transform="translate(20,30)">
      <ellipse cx="35" cy="30" rx="35" ry="22" fill="#f4ecf7" stroke="#722f8a" stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="20" cy="25" r="5" fill="#722f8a"/>
      <circle cx="40" cy="25" r="5" fill="#722f8a"/>
      <circle cx="50" cy="40" r="5" fill="#722f8a"/>
      <circle cx="25" cy="40" r="5" fill="#722f8a"/>
      <ellipse cx="115" cy="40" rx="32" ry="20" fill="#fff5dc" stroke="#d4b96a" stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="100" cy="38" r="5" fill="#d4b96a"/>
      <circle cx="120" cy="32" r="5" fill="#d4b96a"/>
      <circle cx="130" cy="48" r="5" fill="#d4b96a"/>
      <circle cx="105" cy="50" r="5" fill="#d4b96a"/>
    </g>
    <text x="90" y="115" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">hierarchical clusters of entities</text>
  </g>
  <text x="790" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#5a4a3a">3</text>

  <line x1="890" y1="260" x2="935" y2="260" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5: LLM community summaries -->
  <g filter="url(#sh)" transform="translate(940,200)">
    <rect x="0" y="0" width="180" height="120" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.8"/>
    <text x="90" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">LLM Summarizes</text>
    <text x="90" y="38" text-anchor="middle" font-size="11" fill="#5a4a3a">each community</text>
    <text x="90" y="52" text-anchor="middle" font-size="11" fill="#5a4a3a">→ "what is this</text>
    <text x="90" y="66" text-anchor="middle" font-size="11" fill="#5a4a3a">cluster about?"</text>
    <text x="90" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#1f7a3a" font-style="italic">→ paragraph per cluster</text>
    <text x="90" y="108" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">stored alongside the graph</text>
  </g>
  <text x="1025" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#5a4a3a">4</text>

  <!-- Index store -->
  <line x1="1120" y1="260" x2="1170" y2="260" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <g filter="url(#sh)" transform="translate(1175,210)">
    <ellipse cx="55" cy="15" rx="55" ry="11" fill="#fef3e0" stroke="#d4b96a" stroke-width="1.5"/>
    <rect x="0" y="15" width="110" height="80" fill="#fef3e0" stroke="#d4b96a" stroke-width="1.5"/>
    <ellipse cx="55" cy="95" rx="55" ry="11" fill="#f0d9a8" stroke="#d4b96a" stroke-width="1.5"/>
    <ellipse cx="55" cy="15" rx="55" ry="11" fill="none" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="55" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Index</text>
    <text x="55" y="68" text-anchor="middle" font-size="11" fill="#5a4a3a">graph + summaries</text>
  </g>

  <!-- ============================================================ -->
  <!-- PHASE B: QUERY (online)                                       -->
  <!-- ============================================================ -->
  <rect x="40" y="410" width="1320" height="320" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/>
  <g transform="translate(60,435)">
    <circle cx="20" cy="20" r="20" fill="#d4b96a"/>
    <text x="20" y="27" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">B</text>
    <text x="55" y="20" font-size="18" font-weight="700" fill="#7a5e1a">Query time  (online, per request)</text>
    <text x="55" y="42" font-size="12" fill="#5a4a3a" font-style="italic">A router decides between local entity search and global community summary search</text>
  </g>

  <!-- User query -->
  <g filter="url(#sh)" transform="translate(80,540)">
    <rect x="0" y="0" width="160" height="60" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="80" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">User Query</text>
    <text x="80" y="44" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">"Who founded X?"</text>
  </g>

  <line x1="245" y1="570" x2="295" y2="570" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Router (decision diamond) -->
  <g filter="url(#sh)" transform="translate(300,510)">
    <polygon points="100,10 190,60 100,110 10,60" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="100" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Router</text>
    <text x="100" y="73" text-anchor="middle" font-size="11" fill="#5a4a3a">specific or broad?</text>
  </g>

  <!-- Path 1: Local search (top branch) -->
  <line x1="495" y1="538" x2="555" y2="490" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="500" font-size="11" font-weight="700" fill="#1a4078" font-style="italic">specific  →  Local</text>

  <g filter="url(#sh)" transform="translate(560,455)">
    <rect x="0" y="0" width="200" height="90" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.8"/>
    <text x="100" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Local Search</text>
    <text x="100" y="42" text-anchor="middle" font-size="11" fill="#5a4a3a">find entity by name</text>
    <text x="100" y="56" text-anchor="middle" font-size="11" fill="#5a4a3a">→ retrieve neighbors</text>
    <text x="100" y="72" text-anchor="middle" font-size="11" fill="#5a4a3a">in the graph</text>
    <text x="100" y="86" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">precise entity-level facts</text>
  </g>

  <!-- Path 2: Global search (bottom branch) -->
  <line x1="495" y1="600" x2="555" y2="650" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="640" font-size="11" font-weight="700" fill="#7a5e1a" font-style="italic">broad  →  Global</text>

  <g filter="url(#sh)" transform="translate(560,615)">
    <rect x="0" y="0" width="200" height="90" rx="6" fill="#fef3e0" stroke="#d4b96a" stroke-width="1.8"/>
    <text x="100" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Global Search</text>
    <text x="100" y="42" text-anchor="middle" font-size="11" fill="#5a4a3a">map-reduce across</text>
    <text x="100" y="56" text-anchor="middle" font-size="11" fill="#5a4a3a">community summaries</text>
    <text x="100" y="72" text-anchor="middle" font-size="11" fill="#5a4a3a">→ aggregate themes</text>
    <text x="100" y="86" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">corpus-wide synthesis</text>
  </g>

  <!-- Both paths converge to LLM -->
  <line x1="765" y1="500" x2="850" y2="555" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="765" y1="660" x2="850" y2="595" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#sh)" transform="translate(855,540)">
    <rect x="0" y="0" width="160" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="80" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">LLM</text>
    <text x="80" y="50" text-anchor="middle" font-size="11" fill="#5a4a3a">synthesize answer</text>
    <text x="80" y="64" text-anchor="middle" font-size="11" fill="#5a4a3a">from context</text>
  </g>

  <line x1="1020" y1="575" x2="1075" y2="575" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#sh)" transform="translate(1080,545)">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="100" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Grounded Answer</text>
    <text x="100" y="46" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">+ provenance from graph</text>
  </g>

  <!-- Index → both search paths (dashed) -->
  <path d="M 1230 320 Q 1230 380, 1100 380 Q 660 410, 660 455" fill="none" stroke="#d4b96a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <path d="M 1230 320 Q 1230 380, 1100 380 Q 660 410, 660 615" fill="none" stroke="#d4b96a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="900" y="395" font-size="11" font-style="italic" fill="#5a4a3a">precomputed index serves both search modes</text>

  <!-- Bottom comparison callout -->
  <g transform="translate(60,755)">
    <rect x="0" y="0" width="1280" height="38" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1"/>
    <text x="20" y="22" font-size="12" fill="#1a1a2e"><tspan font-weight="700" fill="#1a4078">Local search</tspan> answers entity-specific questions ("Who founded X?")  •  <tspan font-weight="700" fill="#7a5e1a">Global search</tspan> answers corpus-wide questions ("What are the main themes?")  •  Vanilla RAG cannot do the latter.</text>
  </g>
</svg>
