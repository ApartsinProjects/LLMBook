<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Graceful Degradation: Five Fallback Levels for LLM APIs</text>
  <text x="600" y="65" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">When the level above fails, drop to the next; user always gets SOME response</text>

  <!-- Y axis label: "User experience" arrow pointing down -->
  <text x="55" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e" transform="rotate(-90 55 380)">user experience  →</text>
  <line x1="80" y1="120" x2="80" y2="640" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="100" y="135" font-size="11" fill="#1f7a3a" font-weight="700">best</text>
  <text x="100" y="635" font-size="11" fill="#b3401b" font-weight="700">worst</text>

  <!-- Step 1: Level 1 - Full LLM Response (top, green = best) -->
  <g filter="url(#sh)">
    <rect x="180" y="120" width="760" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="200" y="148" font-size="13" font-weight="700" fill="#1f7a3a">Level 1</text>
    <text x="280" y="148" font-size="16" font-weight="700" fill="#1a1a2e">Full LLM Response</text>
    <text x="280" y="170" font-size="12" fill="#5a4a3a">primary path: real-time inference from production model (e.g. GPT-4o, Claude)</text>
    <text x="280" y="188" font-size="11" fill="#5a4a3a" font-style="italic">latency ~1-3 s · cost $$ · quality 100%</text>
    <text x="920" y="170" text-anchor="end" font-size="13" font-weight="700" fill="#1f7a3a">✓ ideal</text>
  </g>

  <!-- Down arrow indicating fallback when failed -->
  <line x1="220" y1="200" x2="220" y2="225" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr)"/>
  <text x="240" y="218" font-size="11" fill="#5a4a3a" font-style="italic">if fails →</text>

  <!-- Step 2: Level 2 - Cached Response (indent right) -->
  <g filter="url(#sh)">
    <rect x="240" y="225" width="700" height="80" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="260" y="253" font-size="13" font-weight="700" fill="#1a4078">Level 2</text>
    <text x="340" y="253" font-size="16" font-weight="700" fill="#1a1a2e">Cached Response</text>
    <text x="340" y="275" font-size="12" fill="#5a4a3a">return previously-generated answer for identical or semantically-similar query</text>
    <text x="340" y="293" font-size="11" fill="#5a4a3a" font-style="italic">latency ~50 ms · cost $ · quality 95% (slightly stale)</text>
    <text x="920" y="275" text-anchor="end" font-size="11" font-style="italic" fill="#1a4078">good</text>
  </g>

  <line x1="280" y1="305" x2="280" y2="330" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr)"/>
  <text x="300" y="323" font-size="11" fill="#5a4a3a" font-style="italic">if cache miss →</text>

  <!-- Step 3: Level 3 - Simpler Model -->
  <g filter="url(#sh)">
    <rect x="300" y="330" width="640" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/>
    <text x="320" y="358" font-size="13" font-weight="700" fill="#7a5e1a">Level 3</text>
    <text x="400" y="358" font-size="16" font-weight="700" fill="#1a1a2e">Simpler / Cheaper Model</text>
    <text x="400" y="380" font-size="12" fill="#5a4a3a">downgrade to smaller model (e.g. GPT-4o → GPT-3.5; Claude → Haiku)</text>
    <text x="400" y="398" font-size="11" fill="#5a4a3a" font-style="italic">latency ~500 ms · cost ¢ · quality 75%</text>
    <text x="920" y="380" text-anchor="end" font-size="11" font-style="italic" fill="#7a5e1a">acceptable</text>
  </g>

  <line x1="340" y1="410" x2="340" y2="435" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr)"/>
  <text x="360" y="428" font-size="11" fill="#5a4a3a" font-style="italic">if all models down →</text>

  <!-- Step 4: Level 4 - Static FAQ -->
  <g filter="url(#sh)">
    <rect x="360" y="435" width="580" height="80" rx="8" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <text x="380" y="463" font-size="13" font-weight="700" fill="#7a5e1a">Level 4</text>
    <text x="460" y="463" font-size="16" font-weight="700" fill="#1a1a2e">Static FAQ / Hardcoded Reply</text>
    <text x="460" y="485" font-size="12" fill="#5a4a3a">match query against curated FAQ; return canned answer for common questions</text>
    <text x="460" y="503" font-size="11" fill="#5a4a3a" font-style="italic">latency ~1 ms · cost ~0 · quality 50% (covers ~30% of queries)</text>
    <text x="920" y="485" text-anchor="end" font-size="11" font-style="italic" fill="#7a5e1a">limited</text>
  </g>

  <line x1="400" y1="515" x2="400" y2="540" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr)"/>
  <text x="420" y="533" font-size="11" fill="#5a4a3a" font-style="italic">if no match →</text>

  <!-- Step 5: Level 5 - Error message (bottom, red = worst) -->
  <g filter="url(#sh)">
    <rect x="420" y="540" width="520" height="80" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="440" y="568" font-size="13" font-weight="700" fill="#b3401b">Level 5</text>
    <text x="520" y="568" font-size="16" font-weight="700" fill="#1a1a2e">Graceful Error Message</text>
    <text x="520" y="590" font-size="12" fill="#5a4a3a">"We're having trouble. Please try again in a moment." + retry button</text>
    <text x="520" y="608" font-size="11" fill="#5a4a3a" font-style="italic">latency ~0 · cost 0 · quality 0% — but USER SEES ACKNOWLEDGEMENT</text>
    <text x="920" y="590" text-anchor="end" font-size="13" font-weight="700" fill="#b3401b">⚠ last resort</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 660)">
    <rect x="0" y="0" width="1100" height="70" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Why a staircase, not a single point of failure</text>
    <text x="20" y="44" font-size="12" fill="#1a1a2e">Each level has independent failure modes (LLM API outage, cache eviction, model deprecation, FAQ stale). Layering 5 fallbacks turns a hard failure</text>
    <text x="20" y="60" font-size="12" fill="#1a1a2e">into a SOFT one — the user always gets some response, even if degraded. Production systems implement levels 1+5 minimum; mature systems implement all 5.</text>
  </g>
</svg>
