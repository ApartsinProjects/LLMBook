<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">LlamaIndex data flow at a glance</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Four boxes describe the entire ingestion path from raw source to query-ready node</text>

  <!-- Vertical pipeline (top to bottom) -->
  <g>
    <!-- Box 1 -->
    <rect x="450" y="110" width="400" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="650" y="142" font-size="17" font-weight="700" text-anchor="middle" fill="#1a4078">Data Sources</text>
    <text x="650" y="166" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">files, APIs, DBs</text>
    <text x="650" y="190" font-size="12" text-anchor="middle" fill="#5a4a3a">whatever your knowledge already lives in</text>
  </g>

  <line x1="650" y1="212" x2="650" y2="252" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="670" y="237" font-size="11" fill="#5a4a3a">read</text>

  <g>
    <rect x="450" y="255" width="400" height="100" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="650" y="287" font-size="17" font-weight="700" text-anchor="middle" fill="#7a5e1a">Connectors</text>
    <text x="650" y="311" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">Readers / Loaders</text>
    <text x="650" y="335" font-size="12" text-anchor="middle" fill="#5a4a3a">turn each source into uniform Document objects</text>
  </g>

  <line x1="650" y1="357" x2="650" y2="397" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="670" y="382" font-size="11" fill="#5a4a3a">parse</text>

  <g>
    <rect x="450" y="400" width="400" height="100" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="650" y="432" font-size="17" font-weight="700" text-anchor="middle" fill="#1f7a3a">Documents</text>
    <text x="650" y="456" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">+ Transformations</text>
    <text x="650" y="480" font-size="12" text-anchor="middle" fill="#5a4a3a">apply chunking, metadata extraction, cleaning</text>
  </g>

  <line x1="650" y1="502" x2="650" y2="542" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="670" y="527" font-size="11" fill="#5a4a3a">chunk</text>

  <g>
    <rect x="450" y="545" width="400" height="60" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="650" y="572" font-size="17" font-weight="700" text-anchor="middle" fill="#722f8a">TextNodes</text>
    <text x="650" y="592" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">stored inside an Index, ready for retrieval</text>
  </g>

  <!-- Left annotations -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="340" height="100" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#1a4078">Layer responsibility</text>
    <text x="14" y="44" font-size="12" fill="#1a1a2e">Holds the raw bytes. LlamaIndex never</text>
    <text x="14" y="62" font-size="12" fill="#1a1a2e">modifies these; they remain the source</text>
    <text x="14" y="80" font-size="12" fill="#1a1a2e">of truth.</text>
  </g>

  <g transform="translate(60, 255)">
    <rect x="0" y="0" width="340" height="100" rx="8" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Plug-in surface</text>
    <text x="14" y="44" font-size="12" fill="#1a1a2e">100+ readers in LlamaHub. Each one</text>
    <text x="14" y="62" font-size="12" fill="#1a1a2e">knows how to talk to one source and</text>
    <text x="14" y="80" font-size="12" fill="#1a1a2e">emit Documents.</text>
  </g>

  <g transform="translate(60, 400)">
    <rect x="0" y="0" width="340" height="100" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#1f7a3a">Where you tune quality</text>
    <text x="14" y="44" font-size="12" fill="#1a1a2e">Chunk size, overlap, metadata schema</text>
    <text x="14" y="62" font-size="12" fill="#1a1a2e">all live here. Most retrieval wins come</text>
    <text x="14" y="80" font-size="12" fill="#1a1a2e">from this stage.</text>
  </g>

  <g transform="translate(60, 545)">
    <rect x="0" y="0" width="340" height="60" rx="8" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#722f8a">Final form</text>
    <text x="14" y="44" font-size="12" fill="#1a1a2e">Embedded, indexed, queryable.</text>
  </g>

  <!-- Right side: code example -->
  <g transform="translate(900, 110)">
    <rect x="0" y="0" width="340" height="495" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Three lines, all four stages</text>
    <text x="16" y="50" font-size="12" font-family="monospace" fill="#1a1a2e">from llama_index.core import (</text>
    <text x="16" y="68" font-size="12" font-family="monospace" fill="#1a1a2e">  SimpleDirectoryReader,</text>
    <text x="16" y="86" font-size="12" font-family="monospace" fill="#1a1a2e">  VectorStoreIndex)</text>

    <text x="16" y="118" font-size="12" font-family="monospace" fill="#1a4078"># Stage 1 + 2: source + reader</text>
    <text x="16" y="136" font-size="12" font-family="monospace" fill="#1a1a2e">docs = SimpleDirectoryReader(</text>
    <text x="16" y="154" font-size="12" font-family="monospace" fill="#1a1a2e">  "./data").load_data()</text>

    <text x="16" y="186" font-size="12" font-family="monospace" fill="#1f7a3a"># Stage 3 + 4: docs to nodes</text>
    <text x="16" y="204" font-size="12" font-family="monospace" fill="#1a1a2e">index = VectorStoreIndex.</text>
    <text x="16" y="222" font-size="12" font-family="monospace" fill="#1a1a2e">  from_documents(docs)</text>

    <text x="16" y="254" font-size="12" font-family="monospace" fill="#722f8a"># Now query it</text>
    <text x="16" y="272" font-size="12" font-family="monospace" fill="#1a1a2e">qe = index.as_query_engine()</text>
    <text x="16" y="290" font-size="12" font-family="monospace" fill="#1a1a2e">qe.query("What did the report</text>
    <text x="16" y="308" font-size="12" font-family="monospace" fill="#1a1a2e">  conclude about Q3?")</text>

    <line x1="16" y1="334" x2="324" y2="334" stroke="#7a5e1a" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="16" y="356" font-size="12" font-weight="700" fill="#7a5e1a">What just happened</text>
    <text x="16" y="378" font-size="12" fill="#1a1a2e">load_data() walked the directory</text>
    <text x="16" y="396" font-size="12" fill="#1a1a2e">(stage 1), invoked file-type readers</text>
    <text x="16" y="414" font-size="12" fill="#1a1a2e">(stage 2), produced Documents (3),</text>
    <text x="16" y="432" font-size="12" fill="#1a1a2e">and from_documents() chunked +</text>
    <text x="16" y="450" font-size="12" fill="#1a1a2e">embedded them into TextNodes (4).</text>
    <text x="16" y="476" font-size="12" font-style="italic" fill="#5a4a3a">All four stages, hidden behind two calls.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">LlamaIndex compresses the entire ingestion path into four named stages so you know exactly where to plug in custom logic.</text>
  </g>
</svg>
