<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">TF-IDF: down-weight common words, lift rare ones</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">IDF = log(N / df); the rarer a word across documents, the larger its weight.</text>

  <!-- IDF axis -->
  <g transform="translate(120, 120)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#1a1a2e">IDF spectrum (low to high)</text>
    <line x1="0" y1="30" x2="1060" y2="30" stroke="#5a4a3a" stroke-width="2" marker-end="url(#arr)"/>
    <text x="0" y="52" font-size="11" fill="#5a4a3a">common in corpus</text>
    <text x="1060" y="52" font-size="11" text-anchor="end" fill="#5a4a3a">rare in corpus</text>
  </g>

  <!-- Three bins -->
  <g transform="translate(120, 200)">
    <!-- Low IDF -->
    <g>
      <rect x="0" y="0" width="340" height="240" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="170" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Low IDF (common)</text>
      <text x="170" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">word appears in nearly every doc</text>

      <g transform="translate(20, 80)">
        <rect x="0" y="0" width="300" height="60" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1"/>
        <text x="15" y="26" font-size="13" font-weight="700" fill="#1a1a2e">"the"</text>
        <text x="15" y="46" font-size="12" fill="#5a4a3a">in all 3 docs, IDF = 0.00</text>

        <rect x="0" y="75" width="300" height="60" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1"/>
        <text x="15" y="101" font-size="13" font-weight="700" fill="#1a1a2e">"sat"</text>
        <text x="15" y="121" font-size="12" fill="#5a4a3a">absent here, weight = 0.00</text>
      </g>
      <text x="170" y="232" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">contributes little signal</text>
    </g>

    <!-- Medium IDF -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="340" height="240" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
      <text x="170" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">Medium IDF</text>
      <text x="170" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">in some docs, not others</text>

      <g transform="translate(20, 80)">
        <rect x="0" y="0" width="300" height="60" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
        <text x="15" y="26" font-size="13" font-weight="700" fill="#1a1a2e">"cat"</text>
        <text x="15" y="46" font-size="12" fill="#5a4a3a">in 2 of 3 docs, IDF = ln(3/2) ≈ 0.41</text>

        <rect x="0" y="75" width="300" height="60" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
        <text x="15" y="101" font-size="13" font-weight="700" fill="#1a1a2e">"dog"</text>
        <text x="15" y="121" font-size="12" fill="#5a4a3a">in 2 of 3 docs, IDF = ln(3/2) ≈ 0.41</text>
      </g>
      <text x="170" y="232" font-size="11" font-style="italic" text-anchor="middle" fill="#7a5e1a">moderately discriminative</text>
    </g>

    <!-- High IDF -->
    <g transform="translate(720, 0)">
      <rect x="0" y="0" width="340" height="240" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="170" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">High IDF (rare)</text>
      <text x="170" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">unique to one document</text>

      <g transform="translate(20, 80)">
        <rect x="0" y="0" width="300" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
        <text x="15" y="26" font-size="13" font-weight="700" fill="#1a1a2e">"chased"</text>
        <text x="15" y="46" font-size="12" fill="#5a4a3a">in 1 of 3 docs, IDF = ln(3/1) ≈ 1.10</text>

        <rect x="0" y="75" width="300" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="150" y="111" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">strongly identifies that doc</text>
      </g>
      <text x="170" y="232" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">most informative for retrieval</text>
    </g>
  </g>

  <!-- Formula callout -->
  <g transform="translate(120, 470)">
    <rect x="0" y="0" width="1060" height="64" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Formula</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">tfidf(t, d) = tf(t, d) × log(N / df(t)); with N = 3 docs and df("chased") = 1, IDF = log(3/1) ~ 1.10.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(120, 560)">
    <rect x="0" y="0" width="1060" height="100" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">TF-IDF rescales raw word counts by how distinctive each word is across the corpus.</text>
    <text x="20" y="72" font-size="12" fill="#1a1a2e">Stop-words like "the" collapse to zero weight; rare topical words like "chased" dominate the document signature,</text>
    <text x="20" y="90" font-size="12" fill="#1a1a2e">which is why TF-IDF was the workhorse of search and retrieval before dense embeddings.</text>
  </g>
</svg>
