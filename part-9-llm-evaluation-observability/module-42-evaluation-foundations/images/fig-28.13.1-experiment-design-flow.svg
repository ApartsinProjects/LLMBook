<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="Helvetica, Arial, sans-serif">
  <title>Experiment Design Flow: Hypothesis to Reproducible Report</title>
  <rect width="1100" height="400" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">Experiment design flow</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each phase emits an artifact the next consumes</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <!-- Phase 1: DESIGN -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="240" height="280" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="36" rx="10" fill="#1a4078"/>
    <text x="120" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1. DESIGN</text>

    <text x="20" y="64" font-size="12" font-weight="700" fill="#1a4078">Hypothesis</text>
    <text x="20" y="84" font-size="11" font-style="italic" fill="#1a1a2e">testable, quantified</text>

    <text x="20" y="112" font-size="12" font-weight="700" fill="#1a4078">Variables</text>
    <text x="20" y="132" font-size="11" font-style="italic" fill="#1a1a2e">IV, DV, controls</text>

    <text x="20" y="160" font-size="12" font-weight="700" fill="#1a4078">Power calc</text>
    <text x="20" y="180" font-size="11" font-style="italic" fill="#1a1a2e">n per arm at desired delta</text>

    <rect x="16" y="210" width="208" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="120" y="232" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">Artifact</text>
    <text x="120" y="250" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">design.yaml</text>
  </g>

  <line x1="282" y1="240" x2="312" y2="240" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Phase 2: EXECUTE -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="240" height="280" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="36" rx="10" fill="#1f7a3a"/>
    <text x="120" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2. EXECUTE</text>

    <text x="20" y="64" font-size="12" font-weight="700" fill="#1f7a3a">Fix seeds</text>
    <text x="20" y="84" font-size="11" font-style="italic" fill="#1a1a2e">deterministic everywhere</text>

    <text x="20" y="112" font-size="12" font-weight="700" fill="#1f7a3a">Replicate</text>
    <text x="20" y="132" font-size="11" font-style="italic" fill="#1a1a2e">multiple seeds per arm</text>

    <text x="20" y="160" font-size="12" font-weight="700" fill="#1f7a3a">Log everything</text>
    <text x="20" y="180" font-size="11" font-style="italic" fill="#1a1a2e">model SHA, prompt, cost</text>

    <rect x="16" y="210" width="208" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="120" y="232" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">Artifact</text>
    <text x="120" y="250" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">runs.parquet</text>
  </g>

  <line x1="562" y1="240" x2="592" y2="240" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Phase 3: ANALYZE -->
  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="240" height="280" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="36" rx="10" fill="#722f8a"/>
    <text x="120" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3. ANALYZE</text>

    <text x="20" y="64" font-size="12" font-weight="700" fill="#722f8a">Ablations</text>
    <text x="20" y="84" font-size="11" font-style="italic" fill="#1a1a2e">isolate each component</text>

    <text x="20" y="112" font-size="12" font-weight="700" fill="#722f8a">Stat tests</text>
    <text x="20" y="132" font-size="11" font-style="italic" fill="#1a1a2e">bootstrap CIs, p-values</text>

    <text x="20" y="160" font-size="12" font-weight="700" fill="#722f8a">Human eval</text>
    <text x="20" y="180" font-size="11" font-style="italic" fill="#1a1a2e">blinded raters, kappa</text>

    <rect x="16" y="210" width="208" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="120" y="232" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">Artifact</text>
    <text x="120" y="250" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">analysis.ipynb</text>
  </g>

  <line x1="842" y1="240" x2="872" y2="240" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Phase 4: SHIP -->
  <g transform="translate(880, 100)">
    <rect x="0" y="0" width="180" height="280" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="36" rx="10" fill="#b3401b"/>
    <text x="90" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4. SHIP</text>

    <text x="20" y="64" font-size="12" font-weight="700" fill="#b3401b">Error bars</text>
    <text x="20" y="84" font-size="11" font-style="italic" fill="#1a1a2e">mean +/- 95% CI</text>

    <text x="20" y="112" font-size="12" font-weight="700" fill="#b3401b">Negatives</text>
    <text x="20" y="132" font-size="11" font-style="italic" fill="#1a1a2e">limits, where it fails</text>

    <text x="20" y="160" font-size="12" font-weight="700" fill="#b3401b">Repro bundle</text>
    <text x="20" y="180" font-size="11" font-style="italic" fill="#1a1a2e">code, data, configs</text>

    <rect x="16" y="210" width="148" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="90" y="232" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">Artifact</text>
    <text x="90" y="250" font-size="11" font-family="Consolas, monospace" text-anchor="middle" fill="#1a1a2e">release.tar.gz</text>
  </g>

</svg>
