<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <title>Open-source realtime stack (2026)</title>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Open-source realtime stack (2026)</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each layer has multiple interchangeable choices</text>
  <defs><linearGradient id="g_38_4_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_38_4_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_38_4_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_38_4_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_38_4_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_38_4_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_38_4_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_38_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_38_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_38_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_38_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(60,110)"><rect x="0" y="0" width="240" height="56" rx="10" fill="url(#g_38_4_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="120" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Transport</text></g><g transform="translate(320,110)"><rect x="0" y="0" width="740" height="56" rx="10" fill="url(#g_38_4_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="370" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">WebRTC / WebSocket</text></g><g transform="translate(60,180)"><rect x="0" y="0" width="240" height="56" rx="10" fill="url(#g_38_4_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="120" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">VAD</text></g><g transform="translate(320,180)"><rect x="0" y="0" width="740" height="56" rx="10" fill="url(#g_38_4_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="370" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Silero / WebRTC VAD</text></g><g transform="translate(60,250)"><rect x="0" y="0" width="240" height="56" rx="10" fill="url(#g_38_4_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="120" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">ASR</text></g><g transform="translate(320,250)"><rect x="0" y="0" width="740" height="56" rx="10" fill="url(#g_38_4_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="370" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Whisper-Turbo / Distil-Whisper</text></g><g transform="translate(60,320)"><rect x="0" y="0" width="240" height="56" rx="10" fill="url(#g_38_4_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="120" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">LLM</text></g><g transform="translate(320,320)"><rect x="0" y="0" width="740" height="56" rx="10" fill="url(#g_38_4_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="370" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Llama-4 / Mistral-Large / Qwen-3</text></g><g transform="translate(60,390)"><rect x="0" y="0" width="240" height="56" rx="10" fill="url(#g_38_4_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="120" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">TTS</text></g><g transform="translate(320,390)"><rect x="0" y="0" width="740" height="56" rx="10" fill="url(#g_38_4_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="370" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Kokoro / Piper / Coqui XTTS</text></g><g transform="translate(60,460)"><rect x="0" y="0" width="240" height="56" rx="10" fill="url(#g_38_4_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="120" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Orchestrator</text></g><g transform="translate(320,460)"><rect x="0" y="0" width="740" height="56" rx="10" fill="url(#g_38_4_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="370" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">LiveKit / Pipecat</text></g><g transform="translate(40,500)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">No single OSS framework owns the stack</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">LiveKit (Python/Go) and Pipecat (Python) are the dominant orchestrators; everything below is plug-replace.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Self-hosting voice agents is now &lt; 1 week of integration work on a single A100.</text></g></svg>
