<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="720" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">A multi-stage RAG pipeline, one box per LangChain primitive</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Offline ingest at top, online query at bottom. Both lanes meet at the vector store.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="60" y="140" font-size="14" font-weight="700" fill="#5a4a3a">Offline ingest</text>
  <line x1="60" y1="150" x2="1340" y2="150" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="4,3"/>

  <g transform="translate(60, 170)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="90" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Document loader</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">PyPDFLoader, WebLoader,</text>
    <text x="90" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">SQLLoader, NotionLoader</text>
  </g>

  <line x1="240" y1="210" x2="290" y2="210" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(290, 170)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="90" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Text splitter</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">Recursive character,</text>
    <text x="90" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">~500 chars, 50 overlap</text>
  </g>

  <line x1="470" y1="210" x2="520" y2="210" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(520, 170)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="90" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Embedding model</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">OpenAI text-embedding-3,</text>
    <text x="90" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">BGE, jina, voyage-3</text>
  </g>

  <line x1="700" y1="210" x2="750" y2="210" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(750, 170)">
    <ellipse cx="100" cy="20" rx="100" ry="14" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <rect x="0" y="20" width="200" height="40" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <ellipse cx="100" cy="60" rx="100" ry="14" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <rect x="0" y="20" width="200" height="40" fill="#fef3e0" stroke="none"/>
    <text x="100" y="35" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Vector store</text>
    <text x="100" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">FAISS / Chroma / Pinecone</text>
    <text x="100" y="100" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">stores chunk + vector + metadata</text>
  </g>

  <text x="60" y="380" font-size="14" font-weight="700" fill="#5a4a3a">Online query</text>
  <line x1="60" y1="390" x2="1340" y2="390" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="4,3"/>

  <g transform="translate(60, 415)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="90" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">User query</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">"What is the company's</text>
    <text x="90" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">refund policy?"</text>
  </g>

  <line x1="240" y1="455" x2="290" y2="455" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(290, 415)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="90" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Embed query</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">same embedding model</text>
    <text x="90" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">as ingest</text>
  </g>

  <line x1="470" y1="455" x2="520" y2="455" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(520, 415)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <text x="90" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Retrieve top-k</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">vectorstore.as_retriever</text>
    <text x="90" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">(k=20)</text>
  </g>

  <line x1="700" y1="455" x2="750" y2="455" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(750, 415)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="90" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Rerank</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">cross-encoder or Cohere,</text>
    <text x="90" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">filter to top 5</text>
  </g>

  <line x1="930" y1="455" x2="980" y2="455" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(980, 415)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="90" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Compress / dedupe</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">LLMChainExtractor, or</text>
    <text x="90" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">prompt-format directly</text>
  </g>

  <line x1="1160" y1="455" x2="1210" y2="455" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(1210, 415)">
    <rect x="0" y="0" width="160" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="80" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Generate</text>
    <text x="80" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">ChatModel.invoke</text>
    <text x="80" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">(prompt | model | parser)</text>
  </g>

  <line x1="850" y1="280" x2="610" y2="408" stroke="#1a1a2e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="710" y="350" font-size="12" font-style="italic" fill="#5a4a3a">similarity lookup</text>

  <g transform="translate(60, 550)">
    <rect x="0" y="0" width="1300" height="60" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#b3401b">Common failure points</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">Chunk size wrong (poor retrieval), embedding drift (re-embed after model change), reranker over-filters (recall collapse), generator ignores context (prompt format).</text>
  </g>

  <g transform="translate(60, 630)">
    <rect x="0" y="0" width="1300" height="68" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#a67c1a">Build sequence</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">Start with steps 1 to 4 (load -&gt; split -&gt; embed -&gt; retrieve) and a naive generator; instrument retrieval recall first.</text>
    <text x="20" y="58" font-size="12" fill="#1a1a2e">Add reranker (5) only when recall is high but precision low. Add compressor (6) only when context windows are tight.</text>
  </g>
</svg>
