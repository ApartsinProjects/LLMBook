<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">GraphRAG Pipeline (Edge et al., 2024)</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Build a knowledge graph offline; route each query to local entity-neighborhood or global community-summary search.</text>

  <!-- INDEXING PHASE container -->
  <g>
    <rect x="40" y="95" width="1220" height="230" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
    <text x="60" y="118" font-size="14" font-weight="700" fill="#5a4a3a">INDEXING PHASE  (offline, run once per corpus)</text>

    <!-- Documents -->
    <rect x="65" y="155" width="135" height="115" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="132" y="185" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Documents</text>
    <text x="132" y="205" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">raw text corpus</text>
    <text x="132" y="230" font-size="11" text-anchor="middle" fill="#5a4a3a">chunked into</text>
    <text x="132" y="246" font-size="11" text-anchor="middle" fill="#5a4a3a">passages</text>

    <!-- Entity extraction -->
    <rect x="240" y="155" width="170" height="115" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="325" y="180" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">LLM Entity</text>
    <text x="325" y="197" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Extraction</text>
    <text x="325" y="222" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">entities + relations</text>
    <text x="325" y="238" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">from each chunk</text>
    <text x="325" y="258" font-size="11" text-anchor="middle" fill="#5a4a3a">→ triples</text>

    <!-- Knowledge graph (visual mini-graph) -->
    <rect x="450" y="155" width="200" height="115" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="550" y="178" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Knowledge Graph</text>
    <!-- mini graph -->
    <g transform="translate(470, 188)">
      <line x1="30" y1="20" x2="80" y2="10" stroke="#7a5e1a" stroke-width="1.2"/>
      <line x1="30" y1="20" x2="60" y2="50" stroke="#7a5e1a" stroke-width="1.2"/>
      <line x1="80" y1="10" x2="120" y2="30" stroke="#7a5e1a" stroke-width="1.2"/>
      <line x1="60" y1="50" x2="120" y2="30" stroke="#7a5e1a" stroke-width="1.2"/>
      <line x1="120" y1="30" x2="150" y2="60" stroke="#7a5e1a" stroke-width="1.2"/>
      <line x1="60" y1="50" x2="100" y2="65" stroke="#7a5e1a" stroke-width="1.2"/>
      <circle cx="30" cy="20" r="5" fill="#1f7a3a"/>
      <circle cx="80" cy="10" r="5" fill="#1f7a3a"/>
      <circle cx="60" cy="50" r="5" fill="#1f7a3a"/>
      <circle cx="120" cy="30" r="5" fill="#1f7a3a"/>
      <circle cx="150" cy="60" r="5" fill="#1f7a3a"/>
      <circle cx="100" cy="65" r="5" fill="#1f7a3a"/>
    </g>
    <text x="550" y="262" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">unified entity–relation network</text>

    <!-- Leiden -->
    <rect x="690" y="155" width="180" height="115" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="780" y="178" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Leiden Community</text>
    <text x="780" y="195" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Detection</text>
    <!-- two cluster blobs -->
    <g transform="translate(710, 208)">
      <ellipse cx="35" cy="22" rx="30" ry="18" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="3 2"/>
      <ellipse cx="105" cy="32" rx="32" ry="20" fill="#fdeee8" stroke="#b3401b" stroke-width="1" stroke-dasharray="3 2"/>
      <circle cx="25" cy="20" r="3" fill="#1f7a3a"/>
      <circle cx="42" cy="18" r="3" fill="#1f7a3a"/>
      <circle cx="35" cy="30" r="3" fill="#1f7a3a"/>
      <circle cx="95" cy="28" r="3" fill="#b3401b"/>
      <circle cx="115" cy="30" r="3" fill="#b3401b"/>
      <circle cx="105" cy="40" r="3" fill="#b3401b"/>
    </g>
    <text x="780" y="262" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">cluster densely connected entities</text>

    <!-- Summaries -->
    <rect x="910" y="155" width="190" height="115" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="1005" y="180" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Community</text>
    <text x="1005" y="197" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Summaries</text>
    <!-- summary doc icons -->
    <g transform="translate(940, 210)">
      <rect x="0" y="0" width="30" height="36" rx="2" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <line x1="5" y1="8" x2="25" y2="8" stroke="#7a5e1a" stroke-width="1"/>
      <line x1="5" y1="14" x2="25" y2="14" stroke="#7a5e1a" stroke-width="1"/>
      <line x1="5" y1="20" x2="20" y2="20" stroke="#7a5e1a" stroke-width="1"/>
      <rect x="45" y="0" width="30" height="36" rx="2" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <line x1="50" y1="8" x2="70" y2="8" stroke="#7a5e1a" stroke-width="1"/>
      <line x1="50" y1="14" x2="70" y2="14" stroke="#7a5e1a" stroke-width="1"/>
      <rect x="90" y="0" width="30" height="36" rx="2" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <line x1="95" y1="8" x2="115" y2="8" stroke="#7a5e1a" stroke-width="1"/>
      <line x1="95" y1="14" x2="115" y2="14" stroke="#7a5e1a" stroke-width="1"/>
    </g>
    <text x="1005" y="265" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">LLM summarises each cluster</text>

    <text x="1180" y="215" font-size="11" text-anchor="middle" fill="#5a4a3a">→ to</text>
    <text x="1180" y="231" font-size="11" text-anchor="middle" fill="#5a4a3a">query</text>
    <text x="1180" y="247" font-size="11" text-anchor="middle" fill="#5a4a3a">phase</text>

    <!-- arrows -->
    <line x1="200" y1="212" x2="238" y2="212" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="219" y="205" font-size="11" text-anchor="middle" fill="#5a4a3a">chunk</text>
    <line x1="410" y1="212" x2="448" y2="212" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="429" y="205" font-size="11" text-anchor="middle" fill="#5a4a3a">triples</text>
    <line x1="650" y1="212" x2="688" y2="212" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="669" y="205" font-size="11" text-anchor="middle" fill="#5a4a3a">graph</text>
    <line x1="870" y1="212" x2="908" y2="212" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="889" y="205" font-size="11" text-anchor="middle" fill="#5a4a3a">clusters</text>
  </g>

  <!-- QUERY PHASE container -->
  <g>
    <rect x="40" y="350" width="1220" height="270" rx="8" fill="#fff8f0" stroke="#bdbdbd" stroke-width="1"/>
    <text x="60" y="373" font-size="14" font-weight="700" fill="#5a4a3a">QUERY PHASE  (per user question)</text>

    <!-- User query -->
    <rect x="65" y="465" width="140" height="70" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="135" y="495" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">User Query</text>
    <text x="135" y="515" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">natural language</text>

    <!-- Router -->
    <polygon points="270,500 360,455 450,500 360,545" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="360" y="495" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Query Router</text>
    <text x="360" y="513" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">local or global?</text>

    <!-- Local search -->
    <rect x="540" y="395" width="240" height="100" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="660" y="420" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Local Search</text>
    <text x="660" y="440" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">entity neighbours + related text chunks</text>
    <text x="660" y="464" font-size="11" text-anchor="middle" fill="#1f7a3a">"Which papers cite Smith 2020?"</text>
    <text x="660" y="482" font-size="11" text-anchor="middle" fill="#5a4a3a">→ specific, entity-centric</text>

    <!-- Global search -->
    <rect x="540" y="510" width="240" height="100" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="660" y="535" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Global Search</text>
    <text x="660" y="555" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">map–reduce over community summaries</text>
    <text x="660" y="579" font-size="11" text-anchor="middle" fill="#722f8a">"What themes dominate the corpus?"</text>
    <text x="660" y="597" font-size="11" text-anchor="middle" fill="#5a4a3a">→ broad, thematic</text>

    <!-- Answer -->
    <rect x="1080" y="465" width="140" height="70" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="1150" y="495" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Answer</text>
    <text x="1150" y="515" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">grounded response</text>

    <!-- Arrows -->
    <line x1="205" y1="500" x2="268" y2="500" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="450" y1="478" x2="538" y2="445" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="475" y="448" font-size="11" fill="#5a4a3a">specific</text>
    <line x1="450" y1="522" x2="538" y2="560" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="475" y="558" font-size="11" fill="#5a4a3a">broad</text>
    <line x1="780" y1="445" x2="1078" y2="488" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="780" y1="560" x2="1078" y2="512" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Cross-phase dashed connectors (KG -> LOCAL, SUMMARIES -> GLOBAL) -->
  <path d="M 550 270 C 550 360 660 380 660 395" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrDash)"/>
  <text x="486" y="345" font-size="11" fill="#722f8a" font-style="italic">entities feed</text>
  <path d="M 1005 270 C 1005 360 760 470 770 510" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrDash)"/>
  <text x="900" y="345" font-size="11" fill="#722f8a" font-style="italic">summaries feed</text>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 645)">
    <rect x="0" y="0" width="1220" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">GraphRAG separates expensive offline graph construction from per-query routing; specific questions hit local neighbourhoods, broad questions aggregate over community summaries.</text>
  </g>
</svg>
