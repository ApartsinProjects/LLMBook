<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Helvetica, Arial, sans-serif">
  <title>Multimodal RAG pipeline</title>
  <rect width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Multimodal RAG pipeline</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Index spans modalities; retrieval mixes them at query time</text>
  <defs><linearGradient id="g_42_2_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_42_2_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_42_2_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_42_2_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_42_2_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_42_2_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_42_2_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_42_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_42_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_42_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_42_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,110)"><rect x="0" y="0" width="200" height="80" rx="10" fill="url(#g_42_2_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">User query</text><text x="100" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">text + image</text></g><g transform="translate(40,230)"><rect x="0" y="0" width="200" height="80" rx="10" fill="url(#g_42_2_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Encoder</text><text x="100" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">joint embedding</text></g><g transform="translate(40,350)"><rect x="0" y="0" width="200" height="80" rx="10" fill="url(#g_42_2_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">ANN retrieval</text><text x="100" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">top-k chunks</text></g><g transform="translate(310,130)"><rect x="0" y="0" width="220" height="80" rx="10" fill="url(#g_42_2_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Image index</text><text x="110" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">embeddings + captions</text></g><g transform="translate(310,230)"><rect x="0" y="0" width="220" height="80" rx="10" fill="url(#g_42_2_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Text index</text><text x="110" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">chunked docs</text></g><g transform="translate(310,330)"><rect x="0" y="0" width="220" height="80" rx="10" fill="url(#g_42_2_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Audio index</text><text x="110" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">ASR + embeds</text></g><g transform="translate(600,230)"><rect x="0" y="0" width="220" height="100" rx="10" fill="url(#g_42_2_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="110" y="42" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Reranker</text><text x="110" y="62" font-size="11" text-anchor="middle" fill="#1a1a2e">cross-encoder</text><text x="110" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">or VLM rerank</text></g><g transform="translate(870,230)"><rect x="0" y="0" width="190" height="100" rx="10" fill="url(#g_42_2_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="95" y="42" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">LLM answer</text><text x="95" y="62" font-size="11" text-anchor="middle" fill="#1a1a2e">with citations</text></g><line x1="241" y1="270" x2="39" y2="270" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_42_2_1)"/><line x1="140" y1="190" x2="140" y2="229" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_42_2_1)"/><line x1="140" y1="310" x2="140" y2="349" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_42_2_1)"/><line x1="241" y1="390" x2="309" y2="280" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_42_2_1)"/><line x1="531" y1="270" x2="599" y2="270" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_42_2_1)"/><line x1="820" y1="280" x2="869" y2="280" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_42_2_1)"/><g transform="translate(40,470)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">One index per modality is the practical default</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Retrieval merges across them; the LLM consumes a heterogeneous context bundle.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Joint indexes (one ANN over multimodal embeddings) are simpler but harder to debug.</text></g></svg>
