<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Four ways to make a Gaussian splat dynamic</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Four ways to make a Gaussian splat dynamic</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each variant chooses where to store time</text>
  <defs><linearGradient id="g_36_2_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_36_2_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_36_2_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_36_2_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_36_2_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_36_2_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_36_2_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_36_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_36_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_36_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_36_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,130)"><rect x="0" y="0" width="240" height="200" rx="10" fill="url(#g_36_2_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="120" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Per-frame splats</text><text x="120" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">store splats(t)</text><text x="120" y="130" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">highest fidelity</text></g><g transform="translate(300,130)"><rect x="0" y="0" width="240" height="200" rx="10" fill="url(#g_36_2_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="120" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Deformation field</text><text x="120" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">static rest pose + MLP(t)</text><text x="120" y="130" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">compact</text></g><g transform="translate(560,130)"><rect x="0" y="0" width="240" height="200" rx="10" fill="url(#g_36_2_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="120" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Time polynomials</text><text x="120" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">splat attrs = f(t)</text><text x="120" y="130" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">smooth + fast</text></g><g transform="translate(820,130)"><rect x="0" y="0" width="240" height="200" rx="10" fill="url(#g_36_2_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="120" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Neural codec</text><text x="120" y="112" font-size="11" text-anchor="middle" fill="#1a1a2e">compressed temporal latent</text><text x="120" y="130" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">decode on demand</text></g><g transform="translate(40,360)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Where you store time decides cost</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Per-frame is fastest to train but blows up memory; deformation fields are the practical default in 2026.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Time polynomials win for short loops; neural codecs win for streaming.</text></g></svg>
