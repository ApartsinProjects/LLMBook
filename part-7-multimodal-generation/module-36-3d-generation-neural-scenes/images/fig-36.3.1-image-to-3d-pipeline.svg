<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Canonical image-to-3D pipeline (2024-2026)</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Canonical image-to-3D pipeline (2024-2026)</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Single image -&gt; multi-view -&gt; 3D reconstruction</text>
  <defs><linearGradient id="g_36_3_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_36_3_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_36_3_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_36_3_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_36_3_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_36_3_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_36_3_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_36_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_36_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_36_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_36_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,150)"><rect x="0" y="0" width="170" height="110" rx="10" fill="url(#g_36_3_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="85" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Input image</text><text x="85" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">1 photo</text><text x="85" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">any object</text></g><g transform="translate(240,150)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_36_3_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Multi-view diff</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">Zero123, SyncDreamer</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">8-32 views</text></g><g transform="translate(470,150)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_36_3_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">View bundle</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">novel azimuths</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">consistent rays</text></g><g transform="translate(700,150)"><rect x="0" y="0" width="200" height="110" rx="10" fill="url(#g_36_3_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="100" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Recon (NeRF/3DGS)</text><text x="100" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">few-minute fit</text><text x="100" y="85" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">exports mesh</text></g><g transform="translate(930,150)"><rect x="0" y="0" width="130" height="110" rx="10" fill="url(#g_36_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="65" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">3D asset</text><text x="65" y="67" font-size="11" text-anchor="middle" fill="#1a1a2e">USD/glTF</text></g><line x1="211" y1="205" x2="239" y2="205" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_36_3_1)"/><line x1="441" y1="205" x2="469" y2="205" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_36_3_1)"/><line x1="671" y1="205" x2="699" y2="205" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_36_3_1)"/><line x1="901" y1="205" x2="929" y2="205" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_36_3_1)"/><g transform="translate(40,400)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Two-stage is the dominant default</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Generate views first (where diffusion shines), then reconstruct (where geometry methods shine).</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Direct-to-3D diffusion (next section) collapses both into one shot, at the cost of less fidelity.</text></g></svg>
