<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="920" fill="#ffffff"/>

  <text x="700" y="44" font-size="24" font-weight="700" text-anchor="middle" fill="#0f3460">The autonomous-science loop: predict, design, measure, update, repeat</text>
  <text x="700" y="72" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">A-Lab, ChemCrow, and FunSearch run the same architecture on different substrates: wet chemistry, tool-mediated chemistry knowledge, and pure math.</text>

  <defs>
    <marker id="arr8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
    <marker id="arr8dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <!-- Legend (top right) -->
  <g transform="translate(1100, 100)">
    <rect x="0" y="0" width="260" height="130" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="130" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Legend</text>
    <rect x="14" y="36" width="16" height="16" rx="4" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
    <text x="40" y="50" font-size="12" fill="#1a1a2e">computation / LLM</text>
    <rect x="14" y="60" width="16" height="16" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="40" y="74" font-size="12" fill="#1a1a2e">experiment / apparatus</text>
    <rect x="14" y="84" width="16" height="16" rx="4" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="40" y="98" font-size="12" fill="#1a1a2e">model state / history</text>
    <line x1="14" y1="116" x2="32" y2="116" stroke="#0f3460" stroke-width="2.5"/>
    <text x="40" y="120" font-size="12" fill="#1a1a2e">loop step</text>
  </g>

  <!-- CIRCULAR LOOP: 4 nodes in a square around a center "model state" -->
  <!-- 1. PREDICT (top left) -->
  <g transform="translate(180, 230)">
    <rect x="0" y="0" width="300" height="130" rx="10" fill="#eef4fa" stroke="#0f3460" stroke-width="2.5"/>
    <text x="150" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">1. PREDICT</text>
    <text x="150" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">LLM proposes the next candidate</text>
    <text x="150" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">"synthesize Li-Ni-Mn-Co oxide x"</text>
    <text x="150" y="96" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">"try this Python function for cap-sets"</text>
    <text x="150" y="118" font-size="11" font-family="Cambria, Cambria Math, serif" text-anchor="middle" fill="#0f3460">argmax_x  E[information_gain | history]</text>
  </g>

  <!-- 2. DESIGN (top right) -->
  <g transform="translate(800, 230)">
    <rect x="0" y="0" width="300" height="130" rx="10" fill="#eef4fa" stroke="#0f3460" stroke-width="2.5"/>
    <text x="150" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">2. DESIGN</text>
    <text x="150" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">turn proposal into a runnable protocol</text>
    <text x="150" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">synthesis recipe; tool-call chain;</text>
    <text x="150" y="92" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">executable Python program</text>
    <text x="150" y="114" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">safety + cost check before running</text>
  </g>

  <!-- 3. MEASURE / RUN (bottom right) -->
  <g transform="translate(800, 530)">
    <rect x="0" y="0" width="300" height="130" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="150" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. RUN + MEASURE</text>
    <text x="150" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">apparatus executes; sensors record</text>
    <text x="150" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">robot arm + furnace + XRD (A-Lab)</text>
    <text x="150" y="92" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">tool API call (ChemCrow)</text>
    <text x="150" y="110" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">automatic scorer (FunSearch)</text>
  </g>

  <!-- 4. UPDATE (bottom left) -->
  <g transform="translate(180, 530)">
    <rect x="0" y="0" width="300" height="130" rx="10" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="150" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">4. UPDATE</text>
    <text x="150" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">append (proposal, result) to history</text>
    <text x="150" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">refit model, update Bayesian posterior,</text>
    <text x="150" y="92" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">or evolve population (FunSearch)</text>
    <text x="150" y="114" font-size="11" font-family="Cambria, Cambria Math, serif" text-anchor="middle" fill="#a67c1a">state &lt;- update(state, proposal, result)</text>
  </g>

  <!-- CENTER: shared model / history store -->
  <g transform="translate(560, 380)">
    <rect x="0" y="0" width="240" height="130" rx="12" fill="#fff5dc" stroke="#a67c1a" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="120" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">model state +</text>
    <text x="120" y="50" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">history of (x, y)</text>
    <text x="120" y="76" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">read by step 1,</text>
    <text x="120" y="94" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">written by step 4</text>
    <text x="120" y="118" font-size="11" font-family="Cambria, Cambria Math, serif" text-anchor="middle" fill="#a67c1a">D = [(x_i, y_i)]</text>
  </g>

  <!-- Loop arrows (clockwise) -->
  <line x1="480" y1="295" x2="800" y2="295" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr8)"/>
  <line x1="950" y1="360" x2="950" y2="530" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr8)"/>
  <line x1="800" y1="595" x2="480" y2="595" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr8)"/>
  <line x1="330" y1="530" x2="330" y2="360" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr8)"/>

  <!-- Spokes to / from the center -->
  <line x1="480" y1="330" x2="560" y2="400" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr8dim)"/>
  <line x1="800" y1="400" x2="800" y2="330" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr8dim)"/>
  <line x1="480" y1="560" x2="560" y2="490" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr8dim)"/>
  <line x1="800" y1="490" x2="800" y2="560" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr8dim)"/>

  <text x="640" y="270" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">proposal x</text>
  <text x="970" y="450" font-size="11" font-style="italic" text-anchor="start" fill="#5a4a3a">protocol</text>
  <text x="640" y="620" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">measurement y</text>
  <text x="280" y="450" font-size="11" font-style="italic" text-anchor="end" fill="#5a4a3a">updated state</text>

  <!-- Three-substrate row at the bottom -->
  <g transform="translate(60, 720)">
    <text x="640" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">Same loop, three substrates</text>

    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="420" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="210" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">A-Lab (Berkeley 2023)</text>
      <text x="210" y="46" font-size="11" text-anchor="middle" fill="#1a1a2e">substrate: physical synthesis + XRD</text>
      <text x="210" y="66" font-size="11" text-anchor="middle" fill="#1a1a2e">loop length: hours per iteration</text>
      <text x="210" y="86" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">41 novel materials in 17 days</text>
    </g>

    <g transform="translate(430, 20)">
      <rect x="0" y="0" width="420" height="100" rx="8" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
      <text x="210" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">ChemCrow (EPFL 2023-24)</text>
      <text x="210" y="46" font-size="11" text-anchor="middle" fill="#1a1a2e">substrate: 17 chemistry tool APIs</text>
      <text x="210" y="66" font-size="11" text-anchor="middle" fill="#1a1a2e">loop length: seconds per tool call</text>
      <text x="210" y="86" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">novel synthesis plans for several molecules</text>
    </g>

    <g transform="translate(860, 20)">
      <rect x="0" y="0" width="420" height="100" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
      <text x="210" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">FunSearch (DeepMind 2024)</text>
      <text x="210" y="46" font-size="11" text-anchor="middle" fill="#1a1a2e">substrate: automatic Python scorer</text>
      <text x="210" y="66" font-size="11" text-anchor="middle" fill="#1a1a2e">loop length: milliseconds per program</text>
      <text x="210" y="86" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">new lower bounds + bin-packing algorithm</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 870)">
    <rect x="0" y="0" width="1280" height="32" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="640" y="21" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">The architecture is identical; the instrumentation question (how fast can the loop close, how reliable is the measurement) is what differs across substrates.</text>
  </g>
</svg>
