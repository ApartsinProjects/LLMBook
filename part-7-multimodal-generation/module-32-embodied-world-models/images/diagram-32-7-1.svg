<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="920" fill="#ffffff"/>

  <text x="700" y="44" font-size="24" font-weight="700" text-anchor="middle" fill="#0f3460">Cross-modal embedding alignment: one vector space, every modality</text>
  <text x="700" y="72" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Text, image, and audio encoders project into a shared d-dimensional space. Retrieval is k-NN. The downstream model conditions on what was retrieved.</text>

  <defs>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
    <marker id="arr7dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <!-- Legend (top right) -->
  <g transform="translate(1080, 100)">
    <rect x="0" y="0" width="280" height="120" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="140" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Legend</text>
    <circle cx="22" cy="44" r="7" fill="#0f3460"/>
    <text x="40" y="49" font-size="12" fill="#1a1a2e">text embedding</text>
    <rect x="15" y="60" width="14" height="14" fill="#1f7a3a"/>
    <text x="40" y="72" font-size="12" fill="#1a1a2e">image embedding</text>
    <polygon points="22,82 30,98 14,98" fill="#a67c1a"/>
    <text x="40" y="95" font-size="12" fill="#1a1a2e">audio embedding</text>
    <line x1="15" y1="110" x2="32" y2="110" stroke="#722f8a" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="40" y="114" font-size="12" fill="#1a1a2e">k-NN retrieval</text>
  </g>

  <!-- LEFT column: three modality queries -->
  <g transform="translate(60, 130)">
    <text x="170" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">QUERIES (any modality)</text>

    <!-- Text query -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="340" height="90" rx="8" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
      <text x="170" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Text query</text>
      <text x="170" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e" font-style="italic">"a brown dog on a beach"</text>
      <text x="170" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">tokens -&gt; transformer text encoder</text>
    </g>

    <!-- Image query -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="340" height="90" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="170" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Image query</text>
      <text x="170" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e" font-style="italic">photo of a sunset</text>
      <text x="170" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">patches -&gt; ViT image encoder</text>
    </g>

    <!-- Audio query -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="340" height="90" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
      <text x="170" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Audio query</text>
      <text x="170" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e" font-style="italic">clip of a dog barking</text>
      <text x="170" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">mel-spectrogram -&gt; audio encoder</text>
    </g>
  </g>

  <!-- MIDDLE: encoders bracket + shared space box -->
  <g transform="translate(440, 130)">
    <text x="220" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">SHARED EMBEDDING SPACE (R^d, d typically 512 or 768)</text>

    <rect x="0" y="20" width="440" height="430" rx="12" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5" stroke-dasharray="6,4"/>

    <!-- axis cross (suggesting 2D projection of d-D space) -->
    <line x1="60" y1="240" x2="380" y2="240" stroke="#5a4a3a" stroke-width="1"/>
    <line x1="220" y1="60" x2="220" y2="420" stroke="#5a4a3a" stroke-width="1"/>
    <text x="385" y="245" font-size="10" font-style="italic" fill="#5a4a3a">dim-1</text>
    <text x="225" y="60" font-size="10" font-style="italic" fill="#5a4a3a">dim-2</text>
    <text x="220" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#722f8a">(2D sketch of a ~512-D space)</text>

    <!-- DOG CLUSTER: text + image + audio for dog -->
    <circle cx="130" cy="170" r="9" fill="#0f3460"/>
    <text x="118" y="158" font-size="10" fill="#1a1a2e">"dog"</text>
    <rect x="143" y="178" width="16" height="16" fill="#1f7a3a"/>
    <text x="166" y="195" font-size="10" fill="#1a1a2e">dog photo</text>
    <polygon points="120,196 130,214 110,214" fill="#a67c1a"/>
    <text x="73" y="220" font-size="10" fill="#1a1a2e">bark.wav</text>
    <!-- cluster circle -->
    <circle cx="128" cy="190" r="55" fill="none" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="128" y="125" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">"dog" cluster</text>

    <!-- BEACH CLUSTER -->
    <circle cx="320" cy="130" r="9" fill="#0f3460"/>
    <text x="335" y="135" font-size="10" fill="#1a1a2e">"beach"</text>
    <rect x="307" y="145" width="16" height="16" fill="#1f7a3a"/>
    <text x="328" y="158" font-size="10" fill="#1a1a2e">beach photo</text>
    <circle cx="320" cy="148" r="42" fill="none" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="320" y="100" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">"beach"</text>

    <!-- SUNSET CLUSTER -->
    <rect x="305" y="320" width="16" height="16" fill="#1f7a3a"/>
    <text x="328" y="333" font-size="10" fill="#1a1a2e">sunset photo</text>
    <circle cx="312" cy="328" r="32" fill="none" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="312" y="368" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">"sunset"</text>

    <!-- CAR CLUSTER (negative example far away) -->
    <circle cx="105" cy="370" r="9" fill="#0f3460"/>
    <text x="80" y="392" font-size="10" fill="#1a1a2e">"a car"</text>
    <rect x="118" y="378" width="16" height="16" fill="#1f7a3a"/>
    <polygon points="92,395 102,412 82,412" fill="#a67c1a"/>
    <circle cx="105" cy="385" r="40" fill="none" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="105" y="345" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">"car"</text>

    <!-- training note -->
    <text x="220" y="445" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">trained: pull (text, image, audio) of same concept together; push others apart</text>
  </g>

  <!-- arrows from queries into the shared space -->
  <line x1="400" y1="175" x2="450" y2="220" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr7)"/>
  <line x1="400" y1="285" x2="450" y2="290" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arr7)"/>
  <line x1="400" y1="395" x2="450" y2="360" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arr7)"/>

  <!-- bracket / arrow from shared space to retrieved items -->
  <line x1="880" y1="350" x2="940" y2="350" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr7)"/>
  <text x="908" y="338" font-size="11" font-style="italic" text-anchor="middle" fill="#722f8a">k-NN</text>

  <!-- RIGHT column: top-k retrieved items -->
  <g transform="translate(950, 220)">
    <text x="200" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">TOP-k RETRIEVED ITEMS</text>
    <rect x="0" y="20" width="400" height="220" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="200" y="46" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">cosine similarity ranking</text>
    <text x="20" y="74" font-size="11" font-weight="700" fill="#0f3460">1. dog_on_beach.jpg</text>
    <text x="280" y="74" font-size="11" font-family="Cambria, Cambria Math, serif" fill="#1a1a2e">sim = 0.78</text>
    <text x="20" y="98" font-size="11" font-weight="700" fill="#0f3460">2. golden_retriever.jpg</text>
    <text x="280" y="98" font-size="11" font-family="Cambria, Cambria Math, serif" fill="#1a1a2e">sim = 0.72</text>
    <text x="20" y="122" font-size="11" font-weight="700" fill="#0f3460">3. dog_park.jpg</text>
    <text x="280" y="122" font-size="11" font-family="Cambria, Cambria Math, serif" fill="#1a1a2e">sim = 0.69</text>
    <text x="20" y="146" font-size="11" font-weight="700" fill="#0f3460">4. dog_bark.wav</text>
    <text x="280" y="146" font-size="11" font-family="Cambria, Cambria Math, serif" fill="#1a1a2e">sim = 0.64</text>
    <text x="20" y="170" font-size="11" font-weight="700" fill="#0f3460">5. "labrador" article</text>
    <text x="280" y="170" font-size="11" font-family="Cambria, Cambria Math, serif" fill="#1a1a2e">sim = 0.61</text>
    <line x1="20" y1="184" x2="380" y2="184" stroke="#5a4a3a" stroke-width="0.7"/>
    <text x="200" y="208" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">mixed modalities, ranked together</text>
    <text x="200" y="228" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">FAISS / pgvector / HNSW backend</text>
  </g>

  <!-- arrow to downstream model -->
  <path d="M 1150 460 Q 1150 540 700 540 Q 250 540 250 580" fill="none" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr7)"/>
  <text x="700" y="530" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">retrieved items become context</text>

  <!-- BOTTOM: downstream model -->
  <g transform="translate(110, 600)">
    <text x="590" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#a67c1a">DOWNSTREAM MODEL: conditions on retrieved items (multimodal RAG)</text>
    <rect x="0" y="20" width="1180" height="160" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="2.5"/>

    <g transform="translate(40, 50)">
      <rect x="0" y="0" width="320" height="110" rx="6" fill="#ffffff" stroke="#a67c1a" stroke-width="1.5"/>
      <text x="160" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">VLM answers a question</text>
      <text x="160" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">"how many dogs are visible?"</text>
      <text x="160" y="68" font-size="11" text-anchor="middle" fill="#1a1a2e">attend over k retrieved images</text>
      <text x="160" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">LLaVA, BLIP-3, GPT-4V</text>
    </g>

    <g transform="translate(430, 50)">
      <rect x="0" y="0" width="320" height="110" rx="6" fill="#ffffff" stroke="#a67c1a" stroke-width="1.5"/>
      <text x="160" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Classifier / re-ranker</text>
      <text x="160" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">zero-shot label by text-prototype</text>
      <text x="160" y="68" font-size="11" text-anchor="middle" fill="#1a1a2e">argmax cos(image, text_label)</text>
      <text x="160" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">CLIP, SigLIP-2 head</text>
    </g>

    <g transform="translate(820, 50)">
      <rect x="0" y="0" width="320" height="110" rx="6" fill="#ffffff" stroke="#a67c1a" stroke-width="1.5"/>
      <text x="160" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Agent / generator</text>
      <text x="160" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">RAG-style answer or image edit</text>
      <text x="160" y="68" font-size="11" text-anchor="middle" fill="#1a1a2e">retrieved items in the prompt</text>
      <text x="160" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">BGE-M3, ImageBind, SigLIP 2</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 815)">
    <rect x="0" y="0" width="1280" height="86" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="640" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">One alignment, many products</text>
    <text x="640" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">SigLIP 2 (Google, 2025) and BGE-M3 (BAAI, 2024) align text and images; ImageBind (Meta, 2023) adds audio, depth, thermal, IMU on top.</text>
    <text x="640" y="72" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Search, classification, moderation, recommendation, and multimodal RAG all read from this one substrate.</text>
  </g>
</svg>
