<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>Three world-model paradigms, 2025-26</title>
  <rect width="1100" height="560" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Three world-model paradigms</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">All predict the next chunk of world. They disagree on what counts.</text>

  <!-- Genie 3 -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#eef4fa" stroke="#0f3460" stroke-width="2.5"/>
    <text x="160" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">Genie 3</text>
    <text x="160" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">DeepMind, 2025</text>

    <rect x="20" y="80" width="280" height="50" rx="6" fill="#ffffff" stroke="#0f3460" stroke-width="1.5"/>
    <text x="160" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">Predicts</text>
    <text x="160" y="120" font-size="12" text-anchor="middle" fill="#1a1a2e">next pixel frame</text>

    <rect x="20" y="150" width="280" height="50" rx="6" fill="#ffffff" stroke="#0f3460" stroke-width="1.5"/>
    <text x="160" y="170" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">Property</text>
    <text x="160" y="190" font-size="12" text-anchor="middle" fill="#1a1a2e">real-time WASD</text>

    <rect x="20" y="220" width="280" height="30" rx="6" fill="#fafbfc" stroke="#0f3460" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="160" y="240" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">open exploration</text>
  </g>

  <!-- V-JEPA 2 -->
  <g transform="translate(390, 100)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="160" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">V-JEPA 2</text>
    <text x="160" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Meta, 2024</text>

    <rect x="20" y="80" width="280" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="160" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Predicts</text>
    <text x="160" y="120" font-size="12" text-anchor="middle" fill="#1a1a2e">next embedding</text>

    <rect x="20" y="150" width="280" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="160" y="170" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Property</text>
    <text x="160" y="190" font-size="12" text-anchor="middle" fill="#1a1a2e">no pixel decoder</text>

    <rect x="20" y="220" width="280" height="30" rx="6" fill="#fafbfc" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="160" y="240" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">representation transfer</text>
  </g>

  <!-- GAIA-2 -->
  <g transform="translate(740, 100)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="160" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">GAIA-2</text>
    <text x="160" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Wayve, 2025</text>

    <rect x="20" y="80" width="280" height="50" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="160" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Predicts</text>
    <text x="160" y="120" font-size="12" text-anchor="middle" fill="#1a1a2e">multi-cam scenes</text>

    <rect x="20" y="150" width="280" height="50" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="160" y="170" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Property</text>
    <text x="160" y="190" font-size="12" text-anchor="middle" fill="#1a1a2e">closed-loop policy</text>

    <rect x="20" y="220" width="280" height="30" rx="6" fill="#fafbfc" stroke="#722f8a" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="160" y="240" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">policy eval at scale</text>
  </g>

  <!-- Axis at bottom -->
  <g transform="translate(40, 400)">
    <line x1="0" y1="0" x2="1020" y2="0" stroke="#5a4a3a" stroke-width="1.5"/>
    <line x1="160" y1="-5" x2="160" y2="5" stroke="#5a4a3a" stroke-width="1.5"/>
    <line x1="510" y1="-5" x2="510" y2="5" stroke="#5a4a3a" stroke-width="1.5"/>
    <line x1="860" y1="-5" x2="860" y2="5" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="160" y="22" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">raw pixels</text>
    <text x="510" y="22" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">latent representation</text>
    <text x="860" y="22" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">action-conditioned pixels</text>
    <text x="510" y="-12" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a">Abstraction of the prediction target</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="1020" height="70" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Same goal, different prediction target</text>
    <text x="510" y="54" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Genie predicts pixels you can play. V-JEPA predicts what comes next, no rendering. GAIA predicts how the world responds to your policy.</text>
  </g>
</svg>
