<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="940" fill="#ffffff"/>

  <text x="700" y="44" font-size="24" font-weight="700" text-anchor="middle" fill="#0f3460">Three world-model paradigms, 2025-26</text>
  <text x="700" y="72" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">All three answer "given context, predict the next chunk of world". The disagreement is over what counts as the next chunk.</text>

  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <!-- Axis label -->
  <text x="50" y="124" font-size="13" font-weight="700" fill="#5a4a3a">Abstraction level of the prediction target:</text>
  <line x1="380" y1="120" x2="1340" y2="120" stroke="#5a4a3a" stroke-width="1.5"/>
  <line x1="380" y1="115" x2="380" y2="125" stroke="#5a4a3a" stroke-width="1.5"/>
  <line x1="860" y1="115" x2="860" y2="125" stroke="#5a4a3a" stroke-width="1.5"/>
  <line x1="1340" y1="115" x2="1340" y2="125" stroke="#5a4a3a" stroke-width="1.5"/>
  <text x="380" y="138" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">raw pixels</text>
  <text x="860" y="138" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">action-conditioned pixels</text>
  <text x="1340" y="138" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">latent representation</text>

  <!-- =========================== GENIE 3 =========================== -->
  <g transform="translate(60, 170)">
    <rect x="0" y="0" width="430" height="540" rx="12" fill="#eef4fa" stroke="#0f3460" stroke-width="2.5"/>
    <text x="215" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#0f3460">Genie 3 (DeepMind, Aug 2025)</text>
    <text x="215" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Autoregressive next-frame prediction</text>

    <!-- input prompt -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="390" height="60" rx="6" fill="#ffffff" stroke="#0f3460" stroke-width="1.5"/>
      <text x="195" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">Input</text>
      <text x="195" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">text prompt + WASD action a_t</text>
    </g>

    <line x1="215" y1="148" x2="215" y2="178" stroke="#0f3460" stroke-width="2" marker-end="url(#arr4)"/>

    <!-- model -->
    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="390" height="100" rx="6" fill="#fafbfc" stroke="#0f3460" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="195" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">Frame-causal latent transformer + memory</text>
      <text x="195" y="46" font-size="11" font-family="Cambria, Cambria Math, serif" text-anchor="middle" fill="#1a1a2e">f_theta(frame_1..t, action_t, prompt)</text>
      <text x="195" y="68" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">VQ-VAE latents, causal attention over frames</text>
      <text x="195" y="88" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">memory persists for minutes</text>
    </g>

    <line x1="215" y1="290" x2="215" y2="320" stroke="#0f3460" stroke-width="2" marker-end="url(#arr4)"/>

    <!-- target -->
    <g transform="translate(20, 326)">
      <rect x="0" y="0" width="390" height="80" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
      <text x="195" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Predicts: next frame x_{t+1}</text>
      <text x="195" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">pixel-level (decoded from latent codebook)</text>
      <text x="195" y="66" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">24 FPS, 720p resolution</text>
    </g>

    <!-- key property -->
    <g transform="translate(20, 426)">
      <rect x="0" y="0" width="390" height="100" rx="6" fill="#ffffff" stroke="#0f3460" stroke-width="1"/>
      <text x="195" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">Property: interactive (real-time WASD)</text>
      <text x="195" y="46" font-size="11" text-anchor="middle" fill="#1a1a2e">Loss: cross-entropy over VQ codebook</text>
      <text x="195" y="68" font-size="11" text-anchor="middle" fill="#1a1a2e">Data scale: ~10s of millions of video hours</text>
      <text x="195" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Use: agent training inside generated worlds</text>
    </g>
  </g>

  <!-- =========================== V-JEPA 2 =========================== -->
  <g transform="translate(540, 170)">
    <rect x="0" y="0" width="320" height="540" rx="12" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="160" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">V-JEPA 2 (Meta, 2024)</text>
    <text x="160" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Joint embedding prediction</text>

    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="280" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="140" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Input</text>
      <text x="140" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">past video frames x_1..t</text>
    </g>

    <line x1="160" y1="148" x2="160" y2="178" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr4)"/>

    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="280" height="100" rx="6" fill="#fafbfc" stroke="#1f7a3a" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="140" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Two ViT encoders + predictor</text>
      <text x="140" y="46" font-size="11" font-family="Cambria, Cambria Math, serif" text-anchor="middle" fill="#1a1a2e">enc_target(x_{t+1}) ~ predictor(enc_ctx(x_1..t))</text>
      <text x="140" y="70" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">target encoder EMA-frozen</text>
      <text x="140" y="88" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">no pixel decoder needed</text>
    </g>

    <line x1="160" y1="290" x2="160" y2="320" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr4)"/>

    <g transform="translate(20, 326)">
      <rect x="0" y="0" width="280" height="80" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
      <text x="140" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Predicts: representation z_{t+1}</text>
      <text x="140" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">latent embedding, not pixels</text>
      <text x="140" y="66" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">L2 loss in embedding space</text>
    </g>

    <g transform="translate(20, 426)">
      <rect x="0" y="0" width="280" height="100" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="140" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Property: not interactive</text>
      <text x="140" y="46" font-size="11" text-anchor="middle" fill="#1a1a2e">Loss: L2 (encoder space)</text>
      <text x="140" y="68" font-size="11" text-anchor="middle" fill="#1a1a2e">Data scale: ~1M video hours</text>
      <text x="140" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Use: video understanding, downstream control</text>
    </g>
  </g>

  <!-- =========================== GAIA-2 =========================== -->
  <g transform="translate(910, 170)">
    <rect x="0" y="0" width="430" height="540" rx="12" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="215" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#722f8a">GAIA-2 (Wayve, 2025)</text>
    <text x="215" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Action-conditioned driving simulator</text>

    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="390" height="60" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="195" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Input</text>
      <text x="195" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">past camera frames + steering/throttle + map</text>
    </g>

    <line x1="215" y1="148" x2="215" y2="178" stroke="#722f8a" stroke-width="2" marker-end="url(#arr4)"/>

    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="390" height="100" rx="6" fill="#fafbfc" stroke="#722f8a" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="195" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Multi-cam diffusion video model</text>
      <text x="195" y="46" font-size="11" font-family="Cambria, Cambria Math, serif" text-anchor="middle" fill="#1a1a2e">p_theta(scene_{t+1..H} | past, a_t..H, rules)</text>
      <text x="195" y="68" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">trained on 100k+ driving hours</text>
      <text x="195" y="88" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">traffic rules as control signals</text>
    </g>

    <line x1="215" y1="290" x2="215" y2="320" stroke="#722f8a" stroke-width="2" marker-end="url(#arr4)"/>

    <g transform="translate(20, 326)">
      <rect x="0" y="0" width="390" height="80" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
      <text x="195" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Predicts: multi-cam scene rollouts</text>
      <text x="195" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">pixel-level, surround view</text>
      <text x="195" y="66" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">other agents react to ego policy</text>
    </g>

    <g transform="translate(20, 426)">
      <rect x="0" y="0" width="390" height="100" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
      <text x="195" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Property: closed-loop with policy</text>
      <text x="195" y="46" font-size="11" text-anchor="middle" fill="#1a1a2e">Loss: diffusion + scene-graph consistency</text>
      <text x="195" y="68" font-size="11" text-anchor="middle" fill="#1a1a2e">Data scale: 100k+ driving hours</text>
      <text x="195" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Use: policy evaluation, millions of synth miles/day</text>
    </g>
  </g>

  <!-- Comparison strip -->
  <g transform="translate(60, 730)">
    <rect x="0" y="0" width="1280" height="190" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="640" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Side-by-side</text>

    <!-- Header row -->
    <text x="40" y="56" font-size="12" font-weight="700" fill="#1a1a2e">Dimension</text>
    <text x="320" y="56" font-size="12" font-weight="700" fill="#0f3460">Genie 3</text>
    <text x="640" y="56" font-size="12" font-weight="700" fill="#1f7a3a">V-JEPA 2</text>
    <text x="960" y="56" font-size="12" font-weight="700" fill="#722f8a">GAIA-2</text>

    <line x1="40" y1="64" x2="1240" y2="64" stroke="#5a4a3a" stroke-width="0.7"/>

    <text x="40" y="86" font-size="11" fill="#1a1a2e">Prediction target</text>
    <text x="320" y="86" font-size="11" fill="#1a1a2e">pixel frame (VQ latent)</text>
    <text x="640" y="86" font-size="11" fill="#1a1a2e">embedding of next frame</text>
    <text x="960" y="86" font-size="11" fill="#1a1a2e">multi-cam pixel scene</text>

    <text x="40" y="108" font-size="11" fill="#1a1a2e">Abstraction</text>
    <text x="320" y="108" font-size="11" fill="#1a1a2e">low (raw pixels)</text>
    <text x="640" y="108" font-size="11" fill="#1a1a2e">high (latent only)</text>
    <text x="960" y="108" font-size="11" fill="#1a1a2e">low + action-conditioned</text>

    <text x="40" y="130" font-size="11" fill="#1a1a2e">Interactivity</text>
    <text x="320" y="130" font-size="11" fill="#1a1a2e">real-time WASD</text>
    <text x="640" y="130" font-size="11" fill="#1a1a2e">predictor only</text>
    <text x="960" y="130" font-size="11" fill="#1a1a2e">closed-loop w/ driving policy</text>

    <text x="40" y="152" font-size="11" fill="#1a1a2e">Loss</text>
    <text x="320" y="152" font-size="11" fill="#1a1a2e">cross-entropy over codebook</text>
    <text x="640" y="152" font-size="11" fill="#1a1a2e">L2 in encoder space</text>
    <text x="960" y="152" font-size="11" fill="#1a1a2e">diffusion + consistency</text>

    <text x="40" y="174" font-size="11" font-style="italic" fill="#5a4a3a">Best for</text>
    <text x="320" y="174" font-size="11" font-style="italic" fill="#5a4a3a">open-ended exploration</text>
    <text x="640" y="174" font-size="11" font-style="italic" fill="#5a4a3a">representation transfer</text>
    <text x="960" y="174" font-size="11" font-style="italic" fill="#5a4a3a">policy eval at scale</text>
  </g>
</svg>
