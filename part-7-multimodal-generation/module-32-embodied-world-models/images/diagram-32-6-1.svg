<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="920" fill="#ffffff"/>

  <text x="700" y="44" font-size="24" font-weight="700" text-anchor="middle" fill="#0f3460">Multimodal edit taxonomy: pick the tool from the scope of the change</text>
  <text x="700" y="72" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">The scope determines the right machinery. Picking the wrong tool is the most common source of edits that "drift" off-prompt.</text>

  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <!-- Root question -->
  <g transform="translate(490, 110)">
    <rect x="0" y="0" width="420" height="100" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="210" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#a67c1a">Start: what is the SCOPE of the edit?</text>
    <text x="210" y="60" font-size="12" text-anchor="middle" fill="#1a1a2e">"how much of the input should remain identical?"</text>
    <text x="210" y="84" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">measure: pixel-region fraction, semantic distance from input</text>
  </g>

  <!-- Three branches -->
  <line x1="540" y1="210" x2="290" y2="262" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr6)"/>
  <line x1="700" y1="210" x2="700" y2="262" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr6)"/>
  <line x1="860" y1="210" x2="1110" y2="262" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr6)"/>

  <!-- LOCAL branch -->
  <g transform="translate(60, 270)">
    <rect x="0" y="0" width="420" height="140" rx="10" fill="#eef4fa" stroke="#0f3460" stroke-width="2.5"/>
    <text x="210" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">LOCAL</text>
    <text x="210" y="52" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">small masked region, rest is pixel-identical</text>
    <text x="210" y="78" font-size="11" text-anchor="middle" fill="#5a4a3a">"add a hat to the cat"</text>
    <text x="210" y="96" font-size="11" text-anchor="middle" fill="#5a4a3a">"remove the lamp post"</text>
    <text x="210" y="114" font-size="11" text-anchor="middle" fill="#5a4a3a">"change the eye color"</text>
    <text x="210" y="132" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">&lt;10% of pixels touched</text>
  </g>

  <!-- GLOBAL branch -->
  <g transform="translate(500, 270)">
    <rect x="0" y="0" width="400" height="140" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="200" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">GLOBAL</text>
    <text x="200" y="52" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">most pixels change; identity preserved</text>
    <text x="200" y="78" font-size="11" text-anchor="middle" fill="#5a4a3a">"make it golden hour"</text>
    <text x="200" y="96" font-size="11" text-anchor="middle" fill="#5a4a3a">"Pixar style"</text>
    <text x="200" y="114" font-size="11" text-anchor="middle" fill="#5a4a3a">"replace background with mountains"</text>
    <text x="200" y="132" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">&gt;50% of pixels touched</text>
  </g>

  <!-- STRUCTURAL branch -->
  <g transform="translate(920, 270)">
    <rect x="0" y="0" width="420" height="140" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="210" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">STRUCTURAL</text>
    <text x="210" y="52" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">scene composition itself changes</text>
    <text x="210" y="78" font-size="11" text-anchor="middle" fill="#5a4a3a">"add a second character"</text>
    <text x="210" y="96" font-size="11" text-anchor="middle" fill="#5a4a3a">"move the chair behind the desk"</text>
    <text x="210" y="114" font-size="11" text-anchor="middle" fill="#5a4a3a">"the dog should be chasing the ball"</text>
    <text x="210" y="132" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">layout / object relations change</text>
  </g>

  <!-- Arrows down to tool boxes -->
  <line x1="270" y1="410" x2="270" y2="462" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr6)"/>
  <line x1="700" y1="410" x2="700" y2="462" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr6)"/>
  <line x1="1130" y1="410" x2="1130" y2="462" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr6)"/>

  <!-- LOCAL: Inpainting -->
  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="420" height="200" rx="10" fill="#fafbfc" stroke="#0f3460" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="210" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Tool: instruction inpainting</text>
    <text x="210" y="56" font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">FLUX.1 Kontext / Generative Fill</text>
    <text x="210" y="84" font-size="11" text-anchor="middle" fill="#1a1a2e">mask = where to change</text>
    <text x="210" y="104" font-size="11" text-anchor="middle" fill="#1a1a2e">instruction = what to put there</text>
    <text x="210" y="124" font-size="11" text-anchor="middle" fill="#1a1a2e">noise only inside mask; unmasked latents fixed</text>
    <text x="210" y="148" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">cost: cheap (1 forward pass)</text>
    <text x="210" y="168" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">guarantee: untouched pixels are bit-identical</text>
    <text x="210" y="188" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">fails when: mask wrong, instruction ambiguous</text>
  </g>

  <!-- GLOBAL: full re-gen with IP-Adapter -->
  <g transform="translate(500, 470)">
    <rect x="0" y="0" width="400" height="200" rx="10" fill="#fafbfc" stroke="#722f8a" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="200" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Tool: full re-gen + IP-Adapter</text>
    <text x="200" y="56" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">GPT-4o image edit / Nano Banana</text>
    <text x="200" y="84" font-size="11" text-anchor="middle" fill="#1a1a2e">re-noise the entire image</text>
    <text x="200" y="104" font-size="11" text-anchor="middle" fill="#1a1a2e">condition on input embedding (IP-Adapter)</text>
    <text x="200" y="124" font-size="11" text-anchor="middle" fill="#1a1a2e">identity preserved via reference cross-attn</text>
    <text x="200" y="148" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">cost: medium (1 full denoise)</text>
    <text x="200" y="168" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">guarantee: identity, not pixel fidelity</text>
    <text x="200" y="188" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">fails when: drift across multiple edits</text>
  </g>

  <!-- STRUCTURAL: scene-graph manipulation -->
  <g transform="translate(920, 470)">
    <rect x="0" y="0" width="420" height="200" rx="10" fill="#fafbfc" stroke="#1f7a3a" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="210" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Tool: scene-graph / layout edit</text>
    <text x="210" y="56" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">3D Gaussian scene + diffusion re-render</text>
    <text x="210" y="84" font-size="11" text-anchor="middle" fill="#1a1a2e">parse to scene graph (objects + relations)</text>
    <text x="210" y="104" font-size="11" text-anchor="middle" fill="#1a1a2e">edit the graph (add/move/relate)</text>
    <text x="210" y="124" font-size="11" text-anchor="middle" fill="#1a1a2e">re-render with diffusion conditioned on graph</text>
    <text x="210" y="148" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">cost: expensive (multiple passes)</text>
    <text x="210" y="168" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">guarantee: composition is editable per-object</text>
    <text x="210" y="188" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">fails when: 3D parse is wrong</text>
  </g>

  <!-- Examples row -->
  <g transform="translate(60, 700)">
    <rect x="0" y="0" width="1280" height="120" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="640" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Library / model defaults by scope (mid-2026)</text>

    <text x="40" y="56" font-size="12" font-weight="700" fill="#0f3460">LOCAL</text>
    <text x="140" y="56" font-size="11" fill="#1a1a2e">FLUX.1 Kontext, Adobe Generative Fill (Firefly), Canva Magic Edit</text>
    <text x="40" y="80" font-size="12" font-weight="700" fill="#722f8a">GLOBAL</text>
    <text x="140" y="80" font-size="11" fill="#1a1a2e">GPT-4o image edit, Gemini Imagen 4 Edit, Nano Banana, InstructPix2Pix lineage</text>
    <text x="40" y="104" font-size="12" font-weight="700" fill="#1f7a3a">STRUCTURAL</text>
    <text x="140" y="104" font-size="11" fill="#1a1a2e">Trellis-3D scene + relight, NeRFstudio relighting plugins, Imagen 4 World + 3DGS edit</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 845)">
    <rect x="0" y="0" width="1280" height="60" rx="6" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="640" y="24" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Identity preservation degrades down the tree</text>
    <text x="640" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">LOCAL preserves bit-identity outside the mask. GLOBAL preserves identity embedding only. STRUCTURAL preserves graph membership.</text>
  </g>
</svg>
