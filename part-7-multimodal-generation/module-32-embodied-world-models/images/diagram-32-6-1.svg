<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>Multimodal edit taxonomy: pick the tool from the scope of the change</title>
  <rect width="1100" height="560" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Multimodal edit taxonomy</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Scope of change picks the tool</text>

  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <!-- Root -->
  <g transform="translate(390, 100)">
    <rect x="0" y="0" width="320" height="60" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="2"/>
    <text x="160" y="38" font-size="15" font-weight="700" text-anchor="middle" fill="#a67c1a">What is the scope?</text>
  </g>

  <!-- Branches -->
  <line x1="450" y1="160" x2="200" y2="210" stroke="#0f3460" stroke-width="2" marker-end="url(#arr6)"/>
  <line x1="550" y1="160" x2="550" y2="210" stroke="#0f3460" stroke-width="2" marker-end="url(#arr6)"/>
  <line x1="650" y1="160" x2="900" y2="210" stroke="#0f3460" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- LOCAL -->
  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="280" height="80" rx="8" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
    <text x="140" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">Local</text>
    <text x="140" y="58" font-size="12" text-anchor="middle" fill="#1a1a2e">small masked region</text>
  </g>
  <line x1="200" y1="300" x2="200" y2="340" stroke="#0f3460" stroke-width="2" marker-end="url(#arr6)"/>
  <g transform="translate(60, 350)">
    <rect x="0" y="0" width="280" height="70" rx="8" fill="#fafbfc" stroke="#0f3460" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="140" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">Inpainting</text>
    <text x="140" y="54" font-size="11" text-anchor="middle" fill="#5a4a3a">FLUX.1 Kontext, Generative Fill</text>
  </g>

  <!-- GLOBAL -->
  <g transform="translate(410, 220)">
    <rect x="0" y="0" width="280" height="80" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="140" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">Global</text>
    <text x="140" y="58" font-size="12" text-anchor="middle" fill="#1a1a2e">most pixels change</text>
  </g>
  <line x1="550" y1="300" x2="550" y2="340" stroke="#0f3460" stroke-width="2" marker-end="url(#arr6)"/>
  <g transform="translate(410, 350)">
    <rect x="0" y="0" width="280" height="70" rx="8" fill="#fafbfc" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="140" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Full re-gen</text>
    <text x="140" y="54" font-size="11" text-anchor="middle" fill="#5a4a3a">GPT-4o edit, Nano Banana</text>
  </g>

  <!-- STRUCTURAL -->
  <g transform="translate(760, 220)">
    <rect x="0" y="0" width="280" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="140" y="32" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Structural</text>
    <text x="140" y="58" font-size="12" text-anchor="middle" fill="#1a1a2e">composition changes</text>
  </g>
  <line x1="900" y1="300" x2="900" y2="340" stroke="#0f3460" stroke-width="2" marker-end="url(#arr6)"/>
  <g transform="translate(760, 350)">
    <rect x="0" y="0" width="280" height="70" rx="8" fill="#fafbfc" stroke="#1f7a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="140" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Scene-graph edit</text>
    <text x="140" y="54" font-size="11" text-anchor="middle" fill="#5a4a3a">3DGS scene + diffusion re-render</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="980" height="60" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="490" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Identity preservation degrades down the tree</text>
    <text x="490" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Local keeps bit-identity outside the mask. Global keeps identity embedding. Structural keeps graph membership.</text>
  </g>
</svg>
