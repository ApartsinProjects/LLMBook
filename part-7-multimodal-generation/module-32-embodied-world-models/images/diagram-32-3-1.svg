<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="880" fill="#ffffff"/>

  <text x="700" y="44" font-size="24" font-weight="700" text-anchor="middle" fill="#0f3460">3D Gaussian Splatting: photos in, differentiable point cloud out</text>
  <text x="700" y="72" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">The training pipeline. Each box is a real piece of software you can swap; the inner loop is gradient descent through a tile-based rasterizer.</text>

  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
    <marker id="arr3back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b94a4a"/>
    </marker>
  </defs>

  <!-- 1: Input images -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="220" height="140" rx="8" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
    <text x="110" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">1. Input images</text>
    <text x="110" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">50 to 300 photos / video frames</text>
    <text x="110" y="68" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">phone capture or DSLR sweep</text>
    <!-- mini stack of photos -->
    <rect x="30" y="82" width="60" height="42" fill="#ffffff" stroke="#0f3460" stroke-width="1.2"/>
    <rect x="40" y="88" width="60" height="42" fill="#ffffff" stroke="#0f3460" stroke-width="1.2"/>
    <rect x="50" y="94" width="60" height="42" fill="#ffffff" stroke="#0f3460" stroke-width="1.2"/>
    <text x="170" y="118" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">scene/images/*.jpg</text>
  </g>

  <line x1="280" y1="200" x2="316" y2="200" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- 2: COLMAP -->
  <g transform="translate(320, 130)">
    <rect x="0" y="0" width="220" height="140" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="110" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. COLMAP SfM</text>
    <text x="110" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">camera poses + sparse pts</text>
    <text x="110" y="72" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">feature match -&gt; bundle adjust</text>
    <text x="110" y="94" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">output: T_cam, K, point cloud</text>
    <text x="110" y="120" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">minutes on CPU</text>
  </g>

  <line x1="540" y1="200" x2="576" y2="200" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- 3: Init Gaussian set -->
  <g transform="translate(580, 130)">
    <rect x="0" y="0" width="220" height="140" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="110" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">3. Init Gaussians</text>
    <text x="110" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">one Gaussian per SfM point</text>
    <text x="110" y="72" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">params: mu, Sigma, opacity, SH</text>
    <text x="110" y="94" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">~100 k starting Gaussians</text>
    <text x="110" y="120" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">grows to 1-3 M during training</text>
  </g>

  <line x1="800" y1="200" x2="836" y2="200" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- 4: Differentiable rasterizer (rendering) -->
  <g transform="translate(840, 130)">
    <rect x="0" y="0" width="220" height="140" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="110" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">4. Differentiable rasterizer</text>
    <text x="110" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">project + tile-sort + alpha-blend</text>
    <text x="110" y="72" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">gsplat CUDA kernel</text>
    <text x="110" y="94" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">forward: render image I_hat</text>
    <text x="110" y="120" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">100-200 FPS at 1080p</text>
  </g>

  <line x1="1060" y1="200" x2="1096" y2="200" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- 5: Loss vs ground truth -->
  <g transform="translate(1100, 130)">
    <rect x="0" y="0" width="240" height="140" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="120" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">5. Photometric loss</text>
    <text x="120" y="52" font-size="13" font-family="Cambria, Cambria Math, serif" text-anchor="middle" fill="#1a1a2e">L = L1(I_hat, I_gt) + lambda L_DSSIM</text>
    <text x="120" y="76" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">compares against original photo</text>
    <text x="120" y="98" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">per-pixel</text>
    <text x="120" y="120" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">~30k iterations, 15-40 min on 4090</text>
  </g>

  <!-- Backprop arrow (curving back down to params) -->
  <path d="M 1220 270 Q 1220 400 950 400 Q 700 400 480 400 Q 250 400 250 380" fill="none" stroke="#b94a4a" stroke-width="2.5" marker-end="url(#arr3back)"/>
  <text x="720" y="392" font-size="13" font-style="italic" font-weight="700" text-anchor="middle" fill="#b94a4a">backprop: grad L w.r.t. (mu, Sigma, opacity, SH) updates every Gaussian</text>

  <!-- 6. Adaptive density control -->
  <g transform="translate(60, 460)">
    <rect x="0" y="0" width="1280" height="120" rx="10" fill="#fafbfc" stroke="#0f3460" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="640" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">6. Adaptive density control (every ~100 iterations)</text>

    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="290" height="56" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="145" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Clone</text>
      <text x="145" y="42" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">under-reconstructed: large grad, small Gaussian</text>
    </g>
    <g transform="translate(340, 50)">
      <rect x="0" y="0" width="290" height="56" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="145" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Split</text>
      <text x="145" y="42" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">over-reconstructed: large grad, large Gaussian</text>
    </g>
    <g transform="translate(650, 50)">
      <rect x="0" y="0" width="290" height="56" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/>
      <text x="145" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Prune</text>
      <text x="145" y="42" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">opacity below tau: delete Gaussian</text>
    </g>
    <g transform="translate(960, 50)">
      <rect x="0" y="0" width="290" height="56" rx="6" fill="#eef4fa" stroke="#0f3460" stroke-width="1.5"/>
      <text x="145" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">Reset opacity</text>
      <text x="145" y="42" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">every 3000 iters: escape bad local minima</text>
    </g>
  </g>

  <!-- 7. Output -->
  <g transform="translate(60, 620)">
    <rect x="0" y="0" width="600" height="120" rx="10" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
    <text x="300" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">7. Output: .ply with millions of Gaussians</text>
    <text x="300" y="54" font-size="12" text-anchor="middle" fill="#1a1a2e">per Gaussian: 3 (pos) + 3 (scale) + 4 (rot) + 1 (opacity) + 48 (SH RGB) = 59 floats</text>
    <text x="300" y="76" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">file size ~50 to 500 MB; renders at 60-200 FPS on consumer GPUs</text>
    <text x="300" y="98" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">portable to Unreal, Unity, three.js, gsplat WebGL viewer</text>
  </g>

  <!-- 8. Anatomy of one Gaussian -->
  <g transform="translate(700, 620)">
    <rect x="0" y="0" width="640" height="120" rx="10" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="320" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Anatomy of one 3D Gaussian</text>

    <!-- ellipse showing anisotropic gaussian -->
    <ellipse cx="80" cy="78" rx="46" ry="22" fill="#fff5dc" stroke="#a67c1a" stroke-width="2" transform="rotate(-25 80 78)"/>
    <circle cx="80" cy="78" r="3" fill="#0f3460"/>
    <text x="80" y="108" font-size="10" text-anchor="middle" fill="#5a4a3a">screen-space ellipse</text>

    <text x="180" y="60" font-size="11" font-weight="700" fill="#0f3460">mu</text>
    <text x="210" y="60" font-size="11" fill="#1a1a2e">3D position (x, y, z)</text>
    <text x="180" y="78" font-size="11" font-weight="700" fill="#722f8a">Sigma</text>
    <text x="210" y="78" font-size="11" fill="#1a1a2e">3x3 covariance = R S S^T R^T</text>
    <text x="180" y="96" font-size="11" font-weight="700" fill="#1f7a3a">alpha</text>
    <text x="210" y="96" font-size="11" fill="#1a1a2e">opacity, in [0, 1]</text>
    <text x="180" y="114" font-size="11" font-weight="700" fill="#a67c1a">SH</text>
    <text x="210" y="114" font-size="11" fill="#1a1a2e">view-dependent color (3rd-order spherical harmonics)</text>
  </g>

  <!-- bottom takeaway -->
  <g transform="translate(60, 770)">
    <rect x="0" y="0" width="1280" height="80" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="640" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Why splats are gradient-friendly</text>
    <text x="640" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">Steps 4-6 form a closed gradient loop. The rasterizer is differentiable, the per-Gaussian parameters are continuous, and density control is the discrete escape valve.</text>
    <text x="640" y="72" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Compare to NeRF: a 5-layer MLP evaluated 256x per pixel. Splats trade memory (millions of primitives) for compute (one rasterizer pass).</text>
  </g>
</svg>
