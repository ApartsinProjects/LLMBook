<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="880" fill="#ffffff"/>

  <text x="700" y="44" font-size="24" font-weight="700" text-anchor="middle" fill="#0f3460">Text-to-3D asset pipeline (Trellis / TripoSR / Meshy style)</text>
  <text x="700" y="72" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">A 2025-era generator produces all formats (NeRF, Gaussians, mesh) from one inference. The mesh path is what game engines actually ingest.</text>

  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <!-- Stage 1: prompt -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="220" height="140" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="110" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">1. Text prompt</text>
    <text x="110" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e" font-style="italic">"a wooden barrel,</text>
    <text x="110" y="70" font-size="12" text-anchor="middle" fill="#1a1a2e" font-style="italic">iron bands, weathered"</text>
    <text x="110" y="100" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">optional: reference image</text>
    <text x="110" y="120" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(image-to-3D variant)</text>
  </g>

  <line x1="280" y1="200" x2="316" y2="200" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr5)"/>

  <!-- Stage 2: text encoder + condition -->
  <g transform="translate(320, 130)">
    <rect x="0" y="0" width="220" height="140" rx="8" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
    <text x="110" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">2. Text encoder</text>
    <text x="110" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">CLIP / T5-XXL embeddings</text>
    <text x="110" y="76" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">condition vector c</text>
    <text x="110" y="106" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">drives cross-attention</text>
    <text x="110" y="124" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">in the next stage</text>
  </g>

  <line x1="540" y1="200" x2="576" y2="200" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr5)"/>

  <!-- Stage 3: 3D-native diffusion (triplane / sparse voxel) -->
  <g transform="translate(580, 130)">
    <rect x="0" y="0" width="280" height="140" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="140" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. 3D-native diffusion</text>
    <text x="140" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">denoise triplane or sparse</text>
    <text x="140" y="68" font-size="12" text-anchor="middle" fill="#1a1a2e">voxel latents (SLAT)</text>
    <text x="140" y="92" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">rectified flow transformer</text>
    <text x="140" y="110" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">~2B params, ~10s inference</text>
    <text x="140" y="128" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">trained on Objaverse-XL</text>
  </g>

  <line x1="860" y1="200" x2="896" y2="200" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr5)"/>

  <!-- Stage 4: three parallel decoders -->
  <g transform="translate(900, 90)">
    <text x="220" y="20" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">4. Decoders (three heads, shared latent)</text>
  </g>

  <g transform="translate(900, 120)">
    <!-- NeRF decoder -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="80" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
      <text x="70" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">NeRF</text>
      <text x="70" y="42" font-size="10" text-anchor="middle" fill="#1a1a2e">density + color field</text>
      <text x="70" y="60" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">for high-fidelity</text>
      <text x="70" y="74" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">render</text>
    </g>
    <!-- Gaussian decoder -->
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="140" height="80" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="2.5"/>
      <text x="70" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">3D Gaussians</text>
      <text x="70" y="42" font-size="10" text-anchor="middle" fill="#1a1a2e">.ply of splats</text>
      <text x="70" y="60" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">for real-time</text>
      <text x="70" y="74" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">rendering</text>
    </g>
    <!-- mesh decoder (highlighted, this is the production path) -->
    <g transform="translate(320, 0)">
      <rect x="0" y="0" width="140" height="80" rx="6" fill="#eef4fa" stroke="#0f3460" stroke-width="2.5"/>
      <text x="70" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">SDF</text>
      <text x="70" y="42" font-size="10" text-anchor="middle" fill="#1a1a2e">signed-distance field</text>
      <text x="70" y="60" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">for mesh extraction</text>
      <text x="70" y="74" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">(this path used below)</text>
    </g>
  </g>

  <!-- branching arrows -->
  <line x1="850" y1="270" x2="970" y2="120" stroke="#a67c1a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr5)"/>
  <line x1="850" y1="270" x2="1130" y2="120" stroke="#a67c1a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr5)"/>
  <line x1="850" y1="270" x2="1290" y2="120" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr5)"/>

  <!-- Stage 5: marching cubes -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="280" height="140" rx="8" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
    <text x="140" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">5. Marching cubes</text>
    <text x="140" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">SDF zero-level set -&gt; triangles</text>
    <text x="140" y="76" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">~100 k vertices, ~200 k faces</text>
    <text x="140" y="96" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">often with Marching Tets variant</text>
    <text x="140" y="118" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">+ remeshing (manifold)</text>
  </g>

  <line x1="340" y1="450" x2="376" y2="450" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr5)"/>

  <!-- Stage 6: texture / UV -->
  <g transform="translate(380, 380)">
    <rect x="0" y="0" width="280" height="140" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="140" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">6. Texture refinement</text>
    <text x="140" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">UV unwrap + multi-view bake</text>
    <text x="140" y="76" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">2D diffusion (Flux) on UV atlas</text>
    <text x="140" y="96" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">PBR maps: albedo, normal, rough</text>
    <text x="140" y="118" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">2k-4k texture resolution</text>
  </g>

  <line x1="660" y1="450" x2="696" y2="450" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr5)"/>

  <!-- Stage 7: validation -->
  <g transform="translate(700, 380)">
    <rect x="0" y="0" width="280" height="140" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="140" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">7. Mesh hygiene</text>
    <text x="140" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">manifold check, watertight</text>
    <text x="140" y="74" font-size="12" text-anchor="middle" fill="#1a1a2e">tri count, collision proxy</text>
    <text x="140" y="98" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Open3D / Trellis validator</text>
    <text x="140" y="118" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">reject if non-manifold</text>
  </g>

  <line x1="980" y1="450" x2="1016" y2="450" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr5)"/>

  <!-- Stage 8: export GLB/USD -->
  <g transform="translate(1020, 380)">
    <rect x="0" y="0" width="320" height="140" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="160" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">8. Export</text>
    <text x="160" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">GLB (web/Blender), USD (NVIDIA)</text>
    <text x="160" y="74" font-size="12" text-anchor="middle" fill="#1a1a2e">OBJ + MTL (legacy DCC)</text>
    <text x="160" y="98" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">drop into Unreal / Unity / Roblox</text>
    <text x="160" y="118" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">end-to-end ~30 s on A100</text>
  </g>

  <!-- Examples of references -->
  <g transform="translate(60, 580)">
    <rect x="0" y="0" width="1280" height="160" rx="10" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="640" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Where each stage is implemented in the major 2025 systems</text>

    <text x="40" y="56" font-size="12" font-weight="700" fill="#0f3460">TripoSR (Stability + Tripo, 2024)</text>
    <text x="320" y="56" font-size="11" fill="#1a1a2e">single image -&gt; triplane -&gt; NeRF -&gt; mesh; fast (~0.5 s) but lower fidelity</text>

    <text x="40" y="80" font-size="12" font-weight="700" fill="#722f8a">Trellis (Microsoft, 2024)</text>
    <text x="320" y="80" font-size="11" fill="#1a1a2e">structured latent (SLAT) + three decoders; 2B params; mesh + Gaussians + radiance in one pass</text>

    <text x="40" y="104" font-size="12" font-weight="700" fill="#1f7a3a">Meshy / Sloyd / Luma Genie</text>
    <text x="320" y="104" font-size="11" fill="#1a1a2e">commercial API stacks; multi-view diffusion + reconstruction + PBR texture in cloud</text>

    <text x="40" y="128" font-size="12" font-weight="700" fill="#a67c1a">DreamGen (NVIDIA, 2025)</text>
    <text x="320" y="128" font-size="11" fill="#1a1a2e">3D + trajectory video generation for synthetic robot training data</text>

    <text x="40" y="152" font-size="11" font-style="italic" fill="#5a4a3a">Common substrate: text/image encoder -&gt; 3D latent diffusion -&gt; per-format decoder -&gt; mesh + PBR -&gt; engine export.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 770)">
    <rect x="0" y="0" width="1280" height="80" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="640" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">The "produce all formats" pattern is the production answer</text>
    <text x="640" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">Format mismatches between game engines (meshes), real-time renderers (splats), and physics simulators (SDFs) were the integration pain point.</text>
    <text x="640" y="72" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">One latent, three decoders, one mesh-hygiene gate. OpenUSD is the convergent file standard; most 2025 generators ship USD exporters.</text>
  </g>
</svg>
