<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="900" fill="#ffffff"/>

  <text x="700" y="44" font-size="24" font-weight="700" text-anchor="middle" fill="#0f3460">VLA anatomy: pixels and text in, motor-command tokens out</text>
  <text x="700" y="72" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">OpenVLA-7B reference architecture. The action head shares the transformer's vocabulary with text tokens.</text>

  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <!-- INPUTS column (left) -->
  <g transform="translate(60, 120)">
    <text x="170" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">INPUTS</text>

    <!-- RGB images -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="340" height="120" rx="8" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
      <text x="170" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Wrist + head cameras</text>
      <text x="170" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">RGB frames, typically 224x224 each</text>
      <!-- mini camera icons -->
      <rect x="50" y="62" width="80" height="46" rx="4" fill="#ffffff" stroke="#0f3460" stroke-width="1.5"/>
      <text x="90" y="89" font-size="11" text-anchor="middle" fill="#5a4a3a">wrist cam</text>
      <rect x="210" y="62" width="80" height="46" rx="4" fill="#ffffff" stroke="#0f3460" stroke-width="1.5"/>
      <text x="250" y="89" font-size="11" text-anchor="middle" fill="#5a4a3a">head cam</text>
    </g>

    <!-- Instruction -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="340" height="100" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="170" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Natural-language instruction</text>
      <text x="170" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e" font-style="italic">"place the red block on the plate"</text>
      <text x="170" y="76" font-size="11" text-anchor="middle" fill="#5a4a3a">tokenized: [t_1, t_2, ..., t_L]</text>
    </g>
  </g>

  <!-- ENCODERS column -->
  <g transform="translate(440, 120)">
    <text x="150" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">ENCODERS</text>

    <!-- Vision encoder -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="300" height="120" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="150" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Vision encoder</text>
      <text x="150" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">SigLIP + DINOv2 (fused)</text>
      <text x="150" y="70" font-size="11" text-anchor="middle" fill="#5a4a3a">image -&gt; patch tokens (256 per cam)</text>
      <text x="150" y="92" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">output: [v_1, ..., v_K], shape (K, d)</text>
      <text x="150" y="112" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">~400 M parameters</text>
    </g>

    <!-- Text tokenizer -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="300" height="100" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="150" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Text tokenizer + embed</text>
      <text x="150" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">Llama-2 tokenizer, vocab=32k</text>
      <text x="150" y="70" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">output: (L, d) token embeddings</text>
    </g>
  </g>

  <!-- TRUNK (transformer) -->
  <g transform="translate(820, 120)">
    <text x="200" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">SHARED TRANSFORMER TRUNK</text>
    <rect x="0" y="20" width="400" height="280" rx="10" fill="#fafbfc" stroke="#0f3460" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="200" y="50" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Llama-2 7B backbone</text>
    <text x="200" y="74" font-size="12" text-anchor="middle" fill="#1a1a2e">32 transformer layers</text>

    <!-- Input sequence box -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="340" height="60" rx="6" fill="#eef4fa" stroke="#0f3460" stroke-width="1.5"/>
      <text x="170" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">Joint input sequence</text>
      <text x="170" y="44" font-size="11" font-family="Cambria, Cambria Math, serif" text-anchor="middle" fill="#1a1a2e">[v_1, ..., v_K, t_1, ..., t_L]</text>
    </g>

    <!-- Causal attention note -->
    <g transform="translate(30, 175)">
      <rect x="0" y="0" width="340" height="50" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="170" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Causal self-attention (RoPE, FlashAttn)</text>
      <text x="170" y="38" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">vision tokens attend left; text attends to all</text>
    </g>

    <!-- output hidden -->
    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="340" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="170" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Hidden states h_t, shape (K+L, 4096)</text>
      <text x="170" y="38" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">fed to the LM head below</text>
    </g>
  </g>

  <!-- Arrows in -->
  <line x1="400" y1="208" x2="436" y2="208" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr1)"/>
  <line x1="400" y1="350" x2="436" y2="350" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr1)"/>
  <!-- encoders to trunk -->
  <path d="M 740 208 Q 780 208 800 230 Q 815 250 820 260" fill="none" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr1)"/>
  <path d="M 740 350 Q 780 350 800 320 Q 815 290 820 280" fill="none" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr1)"/>

  <!-- LM HEAD with split vocabulary -->
  <g transform="translate(330, 480)">
    <text x="370" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#a67c1a">LM HEAD (shared softmax over an extended vocabulary)</text>

    <!-- Vocab box: text portion -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="420" height="120" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
      <text x="210" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Text vocabulary (ids 0 .. 31999)</text>
      <text x="210" y="54" font-size="12" text-anchor="middle" fill="#1a1a2e">"the", "block", "pick", "Paris", "."</text>
      <text x="210" y="78" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">used during VLM pretraining, generic chat</text>
      <text x="210" y="100" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">~32 k tokens</text>
    </g>

    <!-- Vocab box: motor portion -->
    <g transform="translate(440, 30)">
      <rect x="0" y="0" width="300" height="120" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="2.5"/>
      <text x="150" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Motor-command vocab (32000 .. 32767)</text>
      <text x="150" y="54" font-size="12" text-anchor="middle" fill="#1a1a2e">256 bins x 7 DOF reserved tokens</text>
      <text x="150" y="78" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">contiguous slice of LM vocab</text>
      <text x="150" y="100" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">~768 tokens, learned bin embeddings</text>
    </g>

    <text x="370" y="172" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">one softmax, two regimes: predict next text token OR predict next motor-command token</text>
  </g>

  <!-- Arrow from trunk to head -->
  <line x1="1020" y1="430" x2="800" y2="500" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr1)"/>

  <!-- ACTION DECODE step -->
  <g transform="translate(440, 730)">
    <text x="260" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">ACTION DECODE</text>
    <rect x="0" y="20" width="520" height="100" rx="8" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
    <text x="260" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">7 sampled tokens -&gt; 7D action vector</text>
    <text x="260" y="68" font-size="12" font-family="Cambria, Cambria Math, serif" text-anchor="middle" fill="#1a1a2e">a = [dx, dy, dz, d-roll, d-pitch, d-yaw, gripper]</text>
    <text x="260" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">each bin index maps to a continuous delta in joint or end-effector space</text>
    <text x="260" y="108" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">~6 Hz at A100, sent to a low-level controller</text>
  </g>

  <line x1="700" y1="660" x2="700" y2="746" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr1)"/>

  <!-- Loop back to robot/inputs -->
  <path d="M 960 800 Q 1300 800 1300 230 Q 1300 130 660 130 Q 240 130 240 150" fill="none" stroke="#5a4a3a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr1)"/>
  <text x="1170" y="120" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">robot executes action; next camera frame loops back</text>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 870)">
    <rect x="0" y="0" width="1280" height="22" rx="4" fill="#fff5dc" stroke="#a67c1a" stroke-width="1"/>
    <text x="640" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">"Predict next token" subsumes "predict next motor command": same architecture, same loss, larger vocabulary.</text>
  </g>
</svg>
