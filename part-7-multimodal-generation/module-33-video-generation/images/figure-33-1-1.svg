<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Helvetica, Arial, sans-serif">
  <title>Architectural shift: 3D U-Net -&gt; DiT for video</title>
  <rect width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Architectural shift: 3D U-Net -&gt; DiT for video</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Stable Video Diffusion / AnimateDiff used 3D U-Net; Sora and Veo use Diffusion Transformer</text>
  <defs><linearGradient id="g_33_1_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_33_1_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_33_1_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_33_1_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_33_1_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_33_1_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_33_1_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_33_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_33_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_33_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_33_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<text x="550" y="95" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">Legacy: 3D U-Net (~2023)</text><g transform="translate(40,115)"><rect x="0" y="0" width="160" height="70" rx="10" fill="url(#g_33_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="80" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Pixel video</text><text x="80" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">T x H x W frames</text></g><g transform="translate(220,115)"><rect x="0" y="0" width="170" height="70" rx="10" fill="url(#g_33_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="85" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">3D conv encoder</text><text x="85" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">spatio-temporal</text></g><g transform="translate(410,115)"><rect x="0" y="0" width="170" height="70" rx="10" fill="url(#g_33_1_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="85" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Bottleneck</text><text x="85" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">denoise latent</text></g><g transform="translate(600,115)"><rect x="0" y="0" width="180" height="70" rx="10" fill="url(#g_33_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="90" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">3D conv decoder</text><text x="90" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">skip connections</text></g><g transform="translate(800,115)"><rect x="0" y="0" width="160" height="70" rx="10" fill="url(#g_33_1_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="80" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Video out</text><text x="80" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">16-64 frames</text></g><line x1="201" y1="150" x2="219" y2="150" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_33_1_1)"/><line x1="391" y1="150" x2="409" y2="150" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_33_1_1)"/><line x1="581" y1="150" x2="599" y2="150" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_33_1_1)"/><line x1="781" y1="150" x2="799" y2="150" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_33_1_1)"/><text x="550" y="245" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Modern: DiT (Sora, Veo, Kling)</text><g transform="translate(40,265)"><rect x="0" y="0" width="160" height="70" rx="10" fill="url(#g_33_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="80" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Pixel video</text><text x="80" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">any aspect ratio</text></g><g transform="translate(220,265)"><rect x="0" y="0" width="170" height="70" rx="10" fill="url(#g_33_1_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="85" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">3D VAE patcher</text><text x="85" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">spacetime tokens</text></g><g transform="translate(410,265)"><rect x="0" y="0" width="170" height="70" rx="10" fill="url(#g_33_1_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="85" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">DiT blocks</text><text x="85" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">Nx full attention</text></g><g transform="translate(600,265)"><rect x="0" y="0" width="180" height="70" rx="10" fill="url(#g_33_1_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="90" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">VAE decoder</text><text x="90" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">tokens -&gt; pixels</text></g><g transform="translate(800,265)"><rect x="0" y="0" width="160" height="70" rx="10" fill="url(#g_33_1_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="80" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Video out</text><text x="80" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">minutes possible</text></g><line x1="201" y1="300" x2="219" y2="300" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_33_1_1)"/><line x1="391" y1="300" x2="409" y2="300" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_33_1_1)"/><line x1="581" y1="300" x2="599" y2="300" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_33_1_1)"/><line x1="781" y1="300" x2="799" y2="300" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_33_1_1)"/><g transform="translate(40,410)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Why the swap?</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Full self-attention over spacetime tokens scales with parameters; 3D conv stacks hit a ceiling.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">DiT also makes resolution and duration flexible: same model, more tokens, longer or wider video.</text></g></svg>
