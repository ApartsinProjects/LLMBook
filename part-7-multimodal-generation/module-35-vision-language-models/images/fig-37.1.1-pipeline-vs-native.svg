<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Helvetica, Arial, sans-serif">
  <title>Pipeline vs native multimodal models</title>
  <rect width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Pipeline vs native multimodal models</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Pipelines are inspectable; native models share representations end-to-end</text>
  <defs><linearGradient id="g_37_1_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_37_1_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_37_1_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_37_1_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_37_1_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_37_1_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_37_1_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_37_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_37_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_37_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_37_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<text x="280" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">Pipeline approach</text><g transform="translate(40,120)"><rect x="0" y="0" width="110" height="70" rx="10" fill="url(#g_37_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="55" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">ASR</text><text x="55" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">audio-&gt;text</text></g><g transform="translate(160,120)"><rect x="0" y="0" width="110" height="70" rx="10" fill="url(#g_37_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="55" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">LLM</text><text x="55" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">text</text></g><g transform="translate(280,120)"><rect x="0" y="0" width="110" height="70" rx="10" fill="url(#g_37_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="55" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">TTS</text><text x="55" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">text-&gt;audio</text></g><g transform="translate(400,120)"><rect x="0" y="0" width="110" height="70" rx="10" fill="url(#g_37_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="55" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Vision</text><text x="55" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">image-&gt;desc</text></g><line x1="151" y1="155" x2="159" y2="155" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_37_1_1)"/><line x1="271" y1="155" x2="279" y2="155" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_37_1_1)"/><line x1="391" y1="155" x2="399" y2="155" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_37_1_1)"/><text x="820" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Native multimodal</text><g transform="translate(620,120)"><rect x="0" y="0" width="410" height="70" rx="10" fill="url(#g_37_1_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="205" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">One transformer</text><text x="205" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">audio + image + text tokens share weights</text></g><text x="550" y="270" font-size="13" font-weight="400" text-anchor="middle" fill="#5a4a3a" font-style="italic">Audio, image, text are all just tokens</text><g transform="translate(360,290)"><rect x="0" y="0" width="380" height="90" rx="10" fill="url(#g_37_1_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="190" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Shared transformer core</text><text x="190" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">interleaved tokens</text><text x="190" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">GPT-4o, Gemini, Chameleon</text></g><g transform="translate(40,420)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Inspectability vs joint reasoning</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Pipelines give you per-stage logs and swap points; native models capture cross-modal correlations.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Production stacks in 2026 mix both: pipeline for compliance + native for the hard reasoning steps.</text></g></svg>
