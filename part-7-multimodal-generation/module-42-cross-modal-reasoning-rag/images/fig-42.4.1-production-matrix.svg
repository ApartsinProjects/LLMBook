<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Helvetica, Arial, sans-serif">
  <title>Multimodal RAG production Pareto</title>
  <rect width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Multimodal RAG production Pareto</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Cost, latency, and quality trade-offs across deployment patterns</text>
  <defs><linearGradient id="g_42_4_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_42_4_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_42_4_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_42_4_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_42_4_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_42_4_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_42_4_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_42_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_42_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_42_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_42_4_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<text x="550" y="110" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Cost  /  Latency (s)  /  Quality (1-10)</text><text x="80" y="150" font-size="12" font-weight="700" text-anchor="start" fill="#0f3460">Pattern</text><text x="540" y="150" font-size="12" font-weight="700" text-anchor="start" fill="#0f3460">Cost (1-10)</text><text x="720" y="150" font-size="12" font-weight="700" text-anchor="start" fill="#0f3460">Latency</text><text x="900" y="150" font-size="12" font-weight="700" text-anchor="start" fill="#0f3460">Quality</text><rect x="60" y="160" width="1000" height="50" rx="10" fill="url(#g_42_4_1_navy)" stroke="#0f3460" stroke-width="2"/><text x="80" y="190" font-size="14" font-weight="700" text-anchor="start" fill="#0f3460">CLIP + small LLM</text><text x="540" y="190" font-size="13" font-weight="400" text-anchor="start" fill="#1a1a2e">1</text><text x="720" y="190" font-size="13" font-weight="400" text-anchor="start" fill="#1a1a2e">1 s</text><text x="900" y="190" font-size="13" font-weight="400" text-anchor="start" fill="#1a1a2e">6</text><rect x="60" y="215" width="1000" height="50" rx="10" fill="url(#g_42_4_1_amber)" stroke="#a67c1a" stroke-width="2"/><text x="80" y="245" font-size="14" font-weight="700" text-anchor="start" fill="#a67c1a">CLIP + GPT-4o</text><text x="540" y="245" font-size="13" font-weight="400" text-anchor="start" fill="#1a1a2e">5</text><text x="720" y="245" font-size="13" font-weight="400" text-anchor="start" fill="#1a1a2e">4 s</text><text x="900" y="245" font-size="13" font-weight="400" text-anchor="start" fill="#1a1a2e">9</text><rect x="60" y="270" width="1000" height="50" rx="10" fill="url(#g_42_4_1_red)" stroke="#b3401b" stroke-width="2"/><text x="80" y="300" font-size="14" font-weight="700" text-anchor="start" fill="#b3401b">ColPali + reranker</text><text x="540" y="300" font-size="13" font-weight="400" text-anchor="start" fill="#1a1a2e">3</text><text x="720" y="300" font-size="13" font-weight="400" text-anchor="start" fill="#1a1a2e">5 s</text><text x="900" y="300" font-size="13" font-weight="400" text-anchor="start" fill="#1a1a2e">8</text><rect x="60" y="325" width="1000" height="50" rx="10" fill="url(#g_42_4_1_purple)" stroke="#722f8a" stroke-width="2"/><text x="80" y="355" font-size="14" font-weight="700" text-anchor="start" fill="#722f8a">Full VLM retrieval</text><text x="540" y="355" font-size="13" font-weight="400" text-anchor="start" fill="#1a1a2e">8</text><text x="720" y="355" font-size="13" font-weight="400" text-anchor="start" fill="#1a1a2e">6 s</text><text x="900" y="355" font-size="13" font-weight="400" text-anchor="start" fill="#1a1a2e">9</text><g transform="translate(40,460)"><rect x="0" y="0" width="1020" height="54" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">No free lunch: pick two of cost, latency, quality</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">CLIP + small LLM is the cheap default; full VLM retrieval is the quality ceiling at 10x cost.</text></g></svg>
