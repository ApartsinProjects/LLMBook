<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Helvetica, Arial, sans-serif">
  <title>Classical OCR cascade vs end-to-end document AI</title>
  <rect width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Classical OCR cascade vs end-to-end document AI</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Top: stage-by-stage. Bottom: one transformer reads image, emits structured output.</text>
  <defs><linearGradient id="g_34_1_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_34_1_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_34_1_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_34_1_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_34_1_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_34_1_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_34_1_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_34_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_34_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_34_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_34_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<text x="550" y="95" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">Classical cascade</text><g transform="translate(40,110)"><rect x="0" y="0" width="130" height="70" rx="10" fill="url(#g_34_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="65" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Page image</text><text x="65" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">raw scan</text></g><g transform="translate(190,110)"><rect x="0" y="0" width="130" height="70" rx="10" fill="url(#g_34_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="65" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Detector</text><text x="65" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">boxes</text></g><g transform="translate(340,110)"><rect x="0" y="0" width="130" height="70" rx="10" fill="url(#g_34_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="65" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Recognizer</text><text x="65" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">char strings</text></g><g transform="translate(490,110)"><rect x="0" y="0" width="130" height="70" rx="10" fill="url(#g_34_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="65" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Layout</text><text x="65" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">blocks + reading order</text></g><g transform="translate(640,110)"><rect x="0" y="0" width="130" height="70" rx="10" fill="url(#g_34_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="65" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Parser</text><text x="65" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">key-value extract</text></g><g transform="translate(790,110)"><rect x="0" y="0" width="170" height="70" rx="10" fill="url(#g_34_1_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="85" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Structured JSON</text><text x="85" y="47" font-size="11" text-anchor="middle" fill="#1a1a2e">downstream consumer</text></g><line x1="171" y1="145" x2="189" y2="145" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_34_1_1)"/><line x1="321" y1="145" x2="339" y2="145" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_34_1_1)"/><line x1="471" y1="145" x2="489" y2="145" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_34_1_1)"/><line x1="621" y1="145" x2="639" y2="145" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_34_1_1)"/><line x1="771" y1="145" x2="789" y2="145" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_34_1_1)"/><text x="550" y="250" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">End-to-end (Donut, Nougat, MLLMs)</text><g transform="translate(40,270)"><rect x="0" y="0" width="240" height="90" rx="10" fill="url(#g_34_1_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="120" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Page image</text><text x="120" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">raw scan</text><text x="120" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">no preprocessing</text></g><g transform="translate(330,270)"><rect x="0" y="0" width="320" height="90" rx="10" fill="url(#g_34_1_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="160" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Vision-LLM transformer</text><text x="160" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">single model</text><text x="160" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">image -&gt; JSON or markdown</text></g><g transform="translate(700,270)"><rect x="0" y="0" width="260" height="90" rx="10" fill="url(#g_34_1_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="130" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Structured JSON</text><text x="130" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">with confidence scores</text></g><line x1="281" y1="315" x2="329" y2="315" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_34_1_1)"/><line x1="651" y1="315" x2="699" y2="315" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_34_1_1)"/><g transform="translate(40,410)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Why end-to-end won the modern stack</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Cascade errors compound: each stage adds 1-3% loss; the parser cannot fix a missing token.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">End-to-end models read layout from raw pixels, eliminating the entire error chain at inference time.</text></g></svg>
