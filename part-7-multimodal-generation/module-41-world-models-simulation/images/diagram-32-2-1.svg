<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="920" fill="#ffffff"/>

  <text x="700" y="44" font-size="24" font-weight="700" text-anchor="middle" fill="#0f3460">SayCan: language plans grounded by robot affordances</text>
  <text x="700" y="72" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Score each candidate next-action by p(makes sense) x p(can do here). Execute the top, observe, replan.</text>

  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
    <marker id="arr2dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <!-- High-level task -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="320" height="100" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="160" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">1. High-level task (user)</text>
    <text x="160" y="54" font-size="12" text-anchor="middle" fill="#1a1a2e" font-style="italic">"I spilled my drink, can you help?"</text>
    <text x="160" y="78" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">free-form natural language</text>
  </g>

  <line x1="380" y1="170" x2="436" y2="170" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- LLM proposer -->
  <g transform="translate(440, 120)">
    <rect x="0" y="0" width="340" height="100" rx="8" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
    <text x="170" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">2. LLM proposes action verbs</text>
    <text x="170" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">over a fixed library of N skills</text>
    <text x="170" y="72" font-size="11" font-family="Cambria, Cambria Math, serif" text-anchor="middle" fill="#5a4a3a">p_LM(skill | task) for each skill</text>
    <text x="170" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">e.g. "fetch sponge", "find spill", "open drawer"</text>
  </g>

  <line x1="780" y1="170" x2="836" y2="170" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- Affordance filter -->
  <g transform="translate(840, 120)">
    <rect x="0" y="0" width="340" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="170" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. Affordance model scores</text>
    <text x="170" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">VLM reads the camera image</text>
    <text x="170" y="72" font-size="11" font-family="Cambria, Cambria Math, serif" text-anchor="middle" fill="#5a4a3a">p_aff(skill | scene) = "can I do it now?"</text>
    <text x="170" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">low if the sponge is not in view</text>
  </g>

  <!-- Combine box -->
  <g transform="translate(440, 280)">
    <rect x="0" y="0" width="740" height="120" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="370" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">4. Combine and rank</text>
    <text x="370" y="56" font-size="14" font-family="Cambria, Cambria Math, serif" text-anchor="middle" fill="#1a1a2e">score(skill) = p_LM(skill | task) * p_aff(skill | scene)</text>
    <text x="370" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">"what to do" and "can I do it" are independent computations multiplied at the end</text>
    <text x="370" y="104" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">pick argmax</text>
  </g>

  <!-- Arrow LLM -> combine -->
  <line x1="610" y1="220" x2="610" y2="276" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr2)"/>
  <line x1="1010" y1="220" x2="1010" y2="276" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- Score-table illustration -->
  <g transform="translate(60, 280)">
    <rect x="0" y="0" width="320" height="160" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="160" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Scored candidate skills</text>
    <text x="22" y="46" font-size="11" font-weight="700" fill="#0f3460">"fetch sponge"</text>
    <text x="180" y="46" font-size="11" font-family="Cambria, Cambria Math, serif" fill="#1a1a2e">0.62 * 0.85 = 0.53</text>
    <text x="22" y="68" font-size="11" font-weight="700" fill="#722f8a">"find spill"</text>
    <text x="180" y="68" font-size="11" font-family="Cambria, Cambria Math, serif" fill="#1a1a2e">0.30 * 0.40 = 0.12</text>
    <text x="22" y="90" font-size="11" font-weight="700" fill="#1f7a3a">"open drawer"</text>
    <text x="180" y="90" font-size="11" font-family="Cambria, Cambria Math, serif" fill="#1a1a2e">0.18 * 0.20 = 0.04</text>
    <text x="22" y="112" font-size="11" font-weight="700" fill="#a67c1a">"announce result"</text>
    <text x="180" y="112" font-size="11" font-family="Cambria, Cambria Math, serif" fill="#1a1a2e">0.04 * 0.95 = 0.04</text>
    <line x1="20" y1="124" x2="300" y2="124" stroke="#5a4a3a" stroke-width="0.7"/>
    <text x="22" y="142" font-size="11" font-weight="700" fill="#a67c1a">argmax = "fetch sponge"</text>
  </g>

  <!-- arrow combine -> controller -->
  <line x1="810" y1="404" x2="810" y2="476" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- Controller / robot execute -->
  <g transform="translate(440, 480)">
    <rect x="0" y="0" width="740" height="120" rx="8" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
    <text x="370" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">5. Controller executes the chosen skill</text>
    <text x="370" y="56" font-size="12" text-anchor="middle" fill="#1a1a2e">low-level policy or VLA runs the primitive end-to-end</text>
    <text x="370" y="80" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">"fetch sponge" -&gt; navigate to counter, grasp sponge, return</text>
    <text x="370" y="104" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">takes seconds to tens of seconds</text>
  </g>

  <!-- Sensor / observe -->
  <g transform="translate(440, 660)">
    <rect x="0" y="0" width="740" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="370" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">6. Observe outcome</text>
    <text x="370" y="54" font-size="12" text-anchor="middle" fill="#1a1a2e">cameras + proprioception: did the skill succeed? what is the new scene?</text>
    <text x="370" y="80" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">success flag becomes part of the next iteration's context</text>
  </g>

  <line x1="810" y1="604" x2="810" y2="656" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- feedback loop -->
  <path d="M 440 710 L 80 710 Q 40 710 40 670 L 40 170 Q 40 130 80 130" fill="none" stroke="#5a4a3a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr2dim)"/>
  <text x="50" y="450" font-size="12" font-style="italic" fill="#5a4a3a" transform="rotate(-90 50 450)">replan with the updated scene + remaining goal</text>

  <!-- Numbered legend at the bottom -->
  <g transform="translate(60, 800)">
    <rect x="0" y="0" width="1280" height="100" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="640" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">The factorization survives in 2026</text>
    <text x="640" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">The original SayCan affordance model was a small neural classifier; in 2026 it is typically a finetuned VLM scoring "is this scene one where I can do X?".</text>
    <text x="640" y="74" font-size="12" text-anchor="middle" fill="#1a1a2e">Code as Policies replaces the discrete top-1 with a generated Python program; VoxPoser replaces the score with a 3D cost field; the loop shape stays.</text>
    <text x="640" y="94" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Multi-robot dispatchers run the same loop once per fleet member, with a shared LLM acting as scheduler.</text>
  </g>
</svg>
