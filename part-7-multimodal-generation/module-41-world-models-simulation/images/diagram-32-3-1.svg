<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>3D Gaussian Splatting training pipeline</title>
  <rect width="1100" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrGS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
    <marker id="arrGSback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">3D Gaussian Splatting</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Photos in, differentiable point cloud out</text>

  <!-- Stage 1 -->
  <g transform="translate(40, 110)">
    <rect width="200" height="80" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Input images</text>
    <text x="100" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">50 to 300 photos</text>
  </g>
  <line x1="242" y1="150" x2="278" y2="150" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrGS)"/>

  <g transform="translate(280, 110)">
    <rect width="200" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">COLMAP SfM</text>
    <text x="100" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">camera poses + points</text>
  </g>
  <line x1="482" y1="150" x2="518" y2="150" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrGS)"/>

  <g transform="translate(520, 110)">
    <rect width="200" height="80" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Init Gaussians</text>
    <text x="100" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">one per SfM point</text>
  </g>
  <line x1="722" y1="150" x2="758" y2="150" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrGS)"/>

  <g transform="translate(760, 110)">
    <rect width="220" height="80" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Diff rasterizer</text>
    <text x="110" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">render I_hat</text>
  </g>

  <!-- Down arrow from rasterizer to loss -->
  <line x1="870" y1="195" x2="870" y2="230" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrGS)"/>

  <!-- Loss -->
  <g transform="translate(760, 230)">
    <rect width="220" height="80" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Photometric loss</text>
    <text x="110" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">L1 + DSSIM vs photo</text>
  </g>

  <!-- Backprop arrow -->
  <path d="M 760 270 Q 400 270 400 240 L 400 195" fill="none" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrGSback)"/>
  <text x="500" y="262" font-size="12" font-weight="700" font-style="italic" fill="#b3401b">backprop updates each Gaussian's params</text>

  <!-- Adaptive density control -->
  <g transform="translate(40, 340)">
    <rect width="1020" height="100" rx="10" fill="#fafbfc" stroke="#0f3460" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="510" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Adaptive density control (every ~100 iterations)</text>

    <rect x="30" y="44" width="220" height="40" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="140" y="69" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Clone (under-recon)</text>

    <rect x="270" y="44" width="220" height="40" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="380" y="69" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Split (over-recon)</text>

    <rect x="510" y="44" width="220" height="40" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="620" y="69" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Prune (low opacity)</text>

    <rect x="750" y="44" width="240" height="40" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="870" y="69" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">Reset opacity</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 470)">
    <rect width="1020" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Closed gradient loop with a discrete escape valve</text>
    <text x="510" y="54" font-size="12" text-anchor="middle" fill="#1a1a2e">Rasterizer is differentiable; per-Gaussian params are continuous; density control handles topology.</text>
  </g>
</svg>
