<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>Text-to-3D asset pipeline</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrTo3D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Text-to-3D asset pipeline</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">One latent, three decoders, one mesh-hygiene gate</text>

  <!-- Top row: 4 stages left to right -->
  <g transform="translate(40, 110)">
    <rect width="220" height="80" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Text prompt</text>
    <text x="110" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">optional reference image</text>
  </g>
  <line x1="262" y1="150" x2="298" y2="150" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrTo3D)"/>

  <g transform="translate(300, 110)">
    <rect width="220" height="80" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Text encoder</text>
    <text x="110" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">CLIP / T5-XXL conditioning</text>
  </g>
  <line x1="522" y1="150" x2="558" y2="150" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrTo3D)"/>

  <g transform="translate(560, 110)">
    <rect width="240" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="120" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">3D-native diffusion</text>
    <text x="120" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">triplane / SLAT latent</text>
  </g>
  <line x1="802" y1="150" x2="838" y2="150" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrTo3D)"/>

  <g transform="translate(840, 110)">
    <rect width="220" height="80" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="2"/>
    <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Three decoders</text>
    <text x="110" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">NeRF, Gaussians, SDF</text>
  </g>

  <!-- Down arrow from three decoders -->
  <line x1="950" y1="195" x2="950" y2="240" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrTo3D)"/>

  <!-- Bottom row: 4 stages right to left (continuing the flow) -->
  <g transform="translate(840, 240)">
    <rect width="220" height="80" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Marching cubes</text>
    <text x="110" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">SDF zero set to mesh</text>
  </g>
  <line x1="838" y1="280" x2="802" y2="280" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrTo3D)"/>

  <g transform="translate(560, 240)">
    <rect width="240" height="80" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="120" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Texture bake</text>
    <text x="120" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">UV unwrap + PBR maps</text>
  </g>
  <line x1="558" y1="280" x2="522" y2="280" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrTo3D)"/>

  <g transform="translate(300, 240)">
    <rect width="220" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Mesh hygiene</text>
    <text x="110" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">manifold, watertight</text>
  </g>
  <line x1="298" y1="280" x2="262" y2="280" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrTo3D)"/>

  <g transform="translate(40, 240)">
    <rect width="220" height="80" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="2"/>
    <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Export GLB / USD</text>
    <text x="110" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">Unreal, Unity, Roblox</text>
  </g>

  <!-- Systems table -->
  <g transform="translate(40, 370)">
    <rect width="1020" height="120" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="510" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Where this pipeline lives in 2025</text>

    <text x="20" y="54" font-size="12" font-weight="700" fill="#0f3460">TripoSR</text>
    <text x="200" y="54" font-size="11" fill="#1a1a2e">image to triplane to NeRF to mesh; ~0.5 s, lower fidelity</text>

    <text x="20" y="76" font-size="12" font-weight="700" fill="#722f8a">Trellis</text>
    <text x="200" y="76" font-size="11" fill="#1a1a2e">SLAT + three decoders; mesh, Gaussians, radiance in one pass</text>

    <text x="20" y="98" font-size="12" font-weight="700" fill="#1f7a3a">Meshy, Luma Genie</text>
    <text x="200" y="98" font-size="11" fill="#1a1a2e">commercial API; multi-view + PBR in cloud</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 510)">
    <rect width="1020" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">"Produce all formats" is the production answer</text>
    <text x="510" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">Engines want meshes, renderers want splats, sims want SDFs. One latent feeds all three.</text>
  </g>
</svg>
