<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <title>Autonomous-science loop</title>
  <rect width="1100" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arrAS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">The autonomous-science loop</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Predict, design, measure, update, repeat</text>

  <!-- 1. PREDICT (top left) -->
  <g transform="translate(140, 110)">
    <rect width="260" height="80" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="130" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">1. Predict</text>
    <text x="130" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">LLM proposes next candidate</text>
  </g>

  <!-- 2. DESIGN (top right) -->
  <g transform="translate(700, 110)">
    <rect width="260" height="80" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="130" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">2. Design</text>
    <text x="130" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">turn proposal into protocol</text>
  </g>

  <!-- 3. MEASURE (bottom right) -->
  <g transform="translate(700, 290)">
    <rect width="260" height="80" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="130" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. Run + measure</text>
    <text x="130" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">apparatus executes</text>
  </g>

  <!-- 4. UPDATE (bottom left) -->
  <g transform="translate(140, 290)">
    <rect width="260" height="80" rx="10" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="130" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">4. Update</text>
    <text x="130" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">append to history</text>
  </g>

  <!-- Center: state -->
  <g transform="translate(450, 200)">
    <rect width="200" height="80" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="100" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">model state</text>
    <text x="100" y="54" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">history of (x, y)</text>
  </g>

  <!-- Clockwise loop arrows -->
  <line x1="400" y1="150" x2="700" y2="150" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrAS)"/>
  <line x1="830" y1="190" x2="830" y2="290" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrAS)"/>
  <line x1="700" y1="330" x2="400" y2="330" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrAS)"/>
  <line x1="270" y1="290" x2="270" y2="190" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrAS)"/>

  <text x="550" y="140" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">proposal x</text>
  <text x="550" y="320" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">measurement y</text>

  <!-- Three substrates -->
  <g transform="translate(40, 410)">
    <text x="510" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Same loop, three substrates</text>

    <rect x="0" y="20" width="330" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="165" y="42" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">A-Lab</text>
    <text x="165" y="62" font-size="11" text-anchor="middle" fill="#1a1a2e">physical synthesis + XRD</text>
    <text x="165" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">41 materials in 17 days</text>

    <rect x="345" y="20" width="330" height="80" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="510" y="42" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">ChemCrow</text>
    <text x="510" y="62" font-size="11" text-anchor="middle" fill="#1a1a2e">17 chemistry tool APIs</text>
    <text x="510" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">novel synthesis plans</text>

    <rect x="690" y="20" width="330" height="80" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="855" y="42" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">FunSearch</text>
    <text x="855" y="62" font-size="11" text-anchor="middle" fill="#1a1a2e">automatic Python scorer</text>
    <text x="855" y="82" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">new bin-packing bounds</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 530)">
    <rect width="1020" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Architecture is identical; instrumentation differs</text>
    <text x="510" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">How fast can the loop close, and how reliable is the measurement?</text>
  </g>
</svg>
