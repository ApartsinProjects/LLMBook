<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>VLA anatomy: pixels and text in, motor tokens out</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrVLA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">VLA anatomy</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">OpenVLA-7B reference. Action head shares vocab with text tokens.</text>

  <!-- Inputs -->
  <g transform="translate(40, 100)">
    <rect width="200" height="80" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Camera frames</text>
    <text x="100" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">wrist + head, 224x224</text>
  </g>

  <g transform="translate(40, 200)">
    <rect width="200" height="80" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Instruction</text>
    <text x="100" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">"place red block"</text>
  </g>

  <!-- Arrows to encoders -->
  <line x1="242" y1="140" x2="278" y2="140" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrVLA)"/>
  <line x1="242" y1="240" x2="278" y2="240" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrVLA)"/>

  <!-- Encoders -->
  <g transform="translate(280, 100)">
    <rect width="200" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Vision encoder</text>
    <text x="100" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">SigLIP + DINOv2</text>
  </g>

  <g transform="translate(280, 200)">
    <rect width="200" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Text embed</text>
    <text x="100" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">Llama-2 tokenizer</text>
  </g>

  <!-- Arrows to trunk -->
  <path d="M 482 140 Q 510 140 520 170" fill="none" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrVLA)"/>
  <path d="M 482 240 Q 510 240 520 210" fill="none" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrVLA)"/>

  <!-- Trunk -->
  <g transform="translate(560, 150)">
    <rect width="240" height="80" rx="8" fill="#fafbfc" stroke="#0f3460" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="120" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Llama-2 7B trunk</text>
    <text x="120" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">joint [v, t] sequence</text>
  </g>

  <line x1="802" y1="190" x2="838" y2="190" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrVLA)"/>

  <!-- LM head -->
  <g transform="translate(840, 150)">
    <rect width="220" height="80" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">LM head</text>
    <text x="110" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">extended vocab softmax</text>
  </g>

  <!-- Extended vocab below -->
  <g transform="translate(280, 320)">
    <rect width="380" height="80" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="190" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Text vocab (ids 0 .. 31999)</text>
    <text x="190" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">"the", "block", "pick"</text>
  </g>

  <g transform="translate(700, 320)">
    <rect width="360" height="80" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="180" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Motor vocab (32000 .. 32767)</text>
    <text x="180" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">256 bins x 7 DOF tokens</text>
  </g>

  <!-- Action decode -->
  <g transform="translate(280, 430)">
    <rect width="780" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="390" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Action decode: 7 sampled tokens to 7D delta vector</text>
    <text x="390" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">[dx, dy, dz, droll, dpitch, dyaw, gripper] at ~6 Hz</text>
  </g>

  <!-- Connecting arrow head down to vocab/action -->
  <line x1="950" y1="232" x2="950" y2="318" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arrVLA)"/>
  <line x1="880" y1="402" x2="700" y2="430" stroke="#0f3460" stroke-width="2" marker-end="url(#arrVLA)"/>

  <!-- Takeaway -->
  <g transform="translate(40, 510)">
    <rect width="1020" height="70" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">"Predict next token" subsumes "predict next motor command"</text>
    <text x="510" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">Same architecture, same loss, larger vocabulary.</text>
  </g>
</svg>
