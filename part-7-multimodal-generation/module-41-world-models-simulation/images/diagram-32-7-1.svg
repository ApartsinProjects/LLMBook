<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>Cross-modal embedding alignment: one vector space, every modality</title>
  <rect width="1100" height="560" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Cross-modal embedding alignment</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">One shared space; retrieval is k-NN</text>

  <defs>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <!-- LEFT: three modality inputs -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#eef4fa" stroke="#0f3460" stroke-width="2"/>
    <text x="110" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Text</text>
  </g>
  <g transform="translate(40, 200)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="110" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Image</text>
  </g>
  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="110" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Audio</text>
  </g>

  <!-- Arrows into shared space -->
  <line x1="260" y1="140" x2="380" y2="220" stroke="#0f3460" stroke-width="2" marker-end="url(#arr7)"/>
  <line x1="260" y1="230" x2="380" y2="260" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr7)"/>
  <line x1="260" y1="320" x2="380" y2="290" stroke="#a67c1a" stroke-width="2" marker-end="url(#arr7)"/>

  <!-- CENTER: shared space -->
  <g transform="translate(390, 110)">
    <rect x="0" y="0" width="320" height="290" rx="12" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="160" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Shared embedding space</text>
    <text x="160" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">R^d (d ~ 512 - 768)</text>

    <!-- dog cluster -->
    <circle cx="100" cy="140" r="6" fill="#0f3460"/>
    <rect x="110" y="135" width="12" height="12" fill="#1f7a3a"/>
    <polygon points="90,156 100,170 80,170" fill="#a67c1a"/>
    <circle cx="100" cy="150" r="40" fill="none" stroke="#722f8a" stroke-width="1.4" stroke-dasharray="3,3"/>
    <text x="100" y="105" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">dog</text>

    <!-- beach cluster -->
    <circle cx="230" cy="180" r="6" fill="#0f3460"/>
    <rect x="240" y="175" width="12" height="12" fill="#1f7a3a"/>
    <circle cx="232" cy="186" r="32" fill="none" stroke="#722f8a" stroke-width="1.4" stroke-dasharray="3,3"/>
    <text x="232" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">beach</text>

    <text x="160" y="250" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">trained: pull same concept together,</text>
    <text x="160" y="266" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">push others apart</text>
  </g>

  <!-- arrow center -> right -->
  <line x1="710" y1="240" x2="800" y2="240" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr7)"/>
  <text x="755" y="232" font-size="11" font-style="italic" text-anchor="middle" fill="#722f8a">k-NN</text>

  <!-- RIGHT: results -->
  <g transform="translate(810, 150)">
    <rect x="0" y="0" width="250" height="200" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="125" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Top-k retrieved</text>
    <text x="20" y="58" font-size="11" fill="#1a1a2e">dog_on_beach.jpg</text>
    <text x="20" y="82" font-size="11" fill="#1a1a2e">golden_retriever.jpg</text>
    <text x="20" y="106" font-size="11" fill="#1a1a2e">bark.wav</text>
    <text x="20" y="130" font-size="11" fill="#1a1a2e">"labrador" article</text>
    <line x1="20" y1="145" x2="230" y2="145" stroke="#5a4a3a" stroke-width="0.7"/>
    <text x="125" y="170" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">mixed modalities,</text>
    <text x="125" y="186" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">ranked together</text>
  </g>

  <!-- BOTTOM takeaway -->
  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="1020" height="90" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">One alignment, many products</text>
    <text x="510" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">SigLIP 2 and BGE-M3 align text and images; ImageBind extends to audio, depth, thermal, IMU.</text>
    <text x="510" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Search, classification, moderation, recommendation, and multimodal RAG read this one substrate.</text>
  </g>
</svg>
