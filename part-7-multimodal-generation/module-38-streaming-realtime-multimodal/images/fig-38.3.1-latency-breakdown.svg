<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Latency breakdown for voice-to-voice</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Latency breakdown for voice-to-voice</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Where the milliseconds go in a 2026 realtime stack</text>
  <defs><linearGradient id="g_38_3_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_38_3_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_38_3_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_38_3_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_38_3_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_38_3_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_38_3_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_38_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_38_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_38_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_38_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<rect x="70" y="200" width="150" height="70" rx="6" fill="url(#g_38_3_1_purple)" stroke="#722f8a" stroke-width="2"/><text x="145" y="239" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">VAD wait</text><text x="145" y="257" font-size="11" font-weight="400" text-anchor="middle" fill="#722f8a">100 ms</text><rect x="220" y="200" width="120" height="70" rx="6" fill="url(#g_38_3_1_navy)" stroke="#0f3460" stroke-width="2"/><text x="280" y="239" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">ASR</text><text x="280" y="257" font-size="11" font-weight="400" text-anchor="middle" fill="#0f3460">80 ms</text><rect x="340" y="200" width="376" height="70" rx="6" fill="url(#g_38_3_1_red)" stroke="#b3401b" stroke-width="2"/><text x="528" y="239" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">LLM TTFT</text><text x="528" y="257" font-size="11" font-weight="400" text-anchor="middle" fill="#b3401b">250 ms</text><rect x="716" y="200" width="135" height="70" rx="6" fill="url(#g_38_3_1_amber)" stroke="#a67c1a" stroke-width="2"/><text x="783" y="239" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">TTS first chunk</text><text x="783" y="257" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a">90 ms</text><rect x="851" y="200" width="90" height="70" rx="6" fill="url(#g_38_3_1_neutral)" stroke="#5a4a3a" stroke-width="2"/><text x="896" y="239" font-size="12" font-weight="700" text-anchor="middle" fill="#5a4a3a">Network</text><text x="896" y="257" font-size="11" font-weight="400" text-anchor="middle" fill="#5a4a3a">60 ms</text><rect x="941" y="200" width="75" height="70" rx="6" fill="url(#g_38_3_1_neutral)" stroke="#5a4a3a" stroke-width="2"/><text x="978" y="239" font-size="12" font-weight="700" text-anchor="middle" fill="#5a4a3a">Jitter buffer</text><text x="978" y="257" font-size="11" font-weight="400" text-anchor="middle" fill="#5a4a3a">50 ms</text><text x="550" y="310" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Total: 630 ms voice-to-voice (typical 2026 GPT-4o realtime)</text><g transform="translate(40,380)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">LLM TTFT is the largest movable cost</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Speculative decoding, KV-cache reuse, and prefix caching cut TTFT by 30-50%.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">VAD threshold and jitter buffer are user-controllable but degrade quality if pushed too aggressive.</text></g></svg>
