<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Hierarchical text-to-music pipeline</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Hierarchical text-to-music pipeline</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Text/melody/reference -&gt; tokenizer -&gt; autoregressive core -&gt; neural codec decoder</text>
  <defs><linearGradient id="g_32_3_2_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_32_3_2_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_32_3_2_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_32_3_2_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_32_3_2_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_32_3_2_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_32_3_2_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_32_3_2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_32_3_2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_32_3_2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_32_3_2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,130)"><rect x="0" y="0" width="175" height="90" rx="10" fill="url(#g_32_3_2_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="87" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Text prompt</text><text x="87" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">lyrics + style</text><text x="87" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">natural language</text></g><g transform="translate(40,250)"><rect x="0" y="0" width="175" height="90" rx="10" fill="url(#g_32_3_2_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="87" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Melody / ref</text><text x="87" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">optional</text><text x="87" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">humming or stems</text></g><g transform="translate(245,190)"><rect x="0" y="0" width="180" height="90" rx="10" fill="url(#g_32_3_2_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="90" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Tokenizer</text><text x="90" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">RVQ codec</text><text x="90" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">16-32 codebooks</text></g><g transform="translate(455,190)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_32_3_2_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">AR transformer</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">next-token model</text><text x="100" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">few-billion parameters</text></g><g transform="translate(685,190)"><rect x="0" y="0" width="180" height="90" rx="10" fill="url(#g_32_3_2_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="90" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Codec decoder</text><text x="90" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">tokens -&gt; audio</text><text x="90" y="75" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">neural vocoder</text></g><g transform="translate(895,190)"><rect x="0" y="0" width="165" height="90" rx="10" fill="url(#g_32_3_2_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="82" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">44 kHz stereo</text><text x="82" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">minutes-long clip</text></g><line x1="216" y1="170" x2="244" y2="215" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_32_3_2)"/><line x1="216" y1="290" x2="244" y2="245" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_32_3_2)"/><line x1="425" y1="235" x2="454" y2="235" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_32_3_2)"/><line x1="655" y1="235" x2="684" y2="235" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_32_3_2)"/><line x1="865" y1="235" x2="894" y2="235" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_32_3_2)"/><g transform="translate(40,400)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Tokens are the universal interchange format</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">RVQ codecs compress 44 kHz audio to ~50 tokens/sec, putting music squarely in transformer territory.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Suno, MusicGen, Stable Audio 2 share this skeleton; they differ in tokenizer, AR core, and conditioning.</text></g></svg>
