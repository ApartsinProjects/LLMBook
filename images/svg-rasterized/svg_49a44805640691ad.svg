<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Model license openness spectrum from most open to most restricted: Apache 2.0 (fully permissive), Llama Community License (open weights with acceptable-use policy), CC-BY-NC (non-commercial only), and Proprietary API (no weights access)." role="img" style="font-family: sans-serif;" viewBox="0 -10 700 150" xmlns="http://www.w3.org/2000/svg">
<defs><filter height="116%" id="stdShadow3" width="108%" x="-4%" y="-4%"><fedropshadow dx="1" dy="2" flood-opacity="0.08" stddeviation="2"></fedropshadow></filter>
<lineargradient id="spectrum" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" style="stop-color:#27ae60;stop-opacity:1"></stop>
<stop offset="50%" style="stop-color:#f39c12;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#e94560;stop-opacity:1"></stop>
</lineargradient>
</defs>
<rect fill="url(#spectrum)" height="20" rx="10" width="600" x="50" y="45"></rect>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="80" y="90">Apache 2.0</text>
<text fill="#666" font-size="11" text-anchor="middle" x="80" y="105">Most open</text>
<line stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="80" x2="80" y1="65" y2="76"></line>
<text fill="#ff9800" font-size="11" font-weight="600" text-anchor="middle" x="250" y="90">Llama License</text>
<text fill="#666" font-size="11" text-anchor="middle" x="250" y="105">Open weights + AUP</text>
<line stroke="#ff9800" stroke-linecap="round" stroke-width="2" x1="250" x2="250" y1="65" y2="76"></line>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="450" y="90">CC-BY-NC</text>
<text fill="#666" font-size="11" text-anchor="middle" x="450" y="105">Non-commercial only</text>
<line stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="450" x2="450" y1="65" y2="76"></line>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="620" y="90">Proprietary API</text>
<text fill="#666" font-size="11" text-anchor="middle" x="620" y="105">No weights access</text>
<line stroke="#1a1a2e" stroke-linecap="round" stroke-width="2" x1="620" x2="620" y1="65" y2="76"></line>
</svg>