<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The document-term matrix X factorizes as U times Sigma times V transpose; truncating to the top r singular values yields a low-rank approximation X_r that compresses 50,000 sparse word dimensions into a few hundred dense topic dimensions." role="img" style="max-width:720px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
<text fill="#222" font-size="14" font-weight="700" text-anchor="middle" x="360" y="22">LSA: truncated SVD of the document-term matrix</text>
<g font-size="14" text-anchor="middle">
<rect fill="#e3f2fd" height="120" stroke="#1565c0" width="120" x="30" y="60"></rect>
<text fill="#0d47a1" font-weight="700" x="90" y="125">X</text>
<text fill="#444" font-size="10" x="90" y="145">N terms x K docs</text>
<text fill="#666" font-size="11" x="90" y="195">sparse word counts</text>
<text fill="#333" font-size="20" x="172" y="125">≈</text>
<rect fill="#fff3e0" height="120" stroke="#ef6c00" width="100" x="195" y="60"></rect>
<text fill="#e65100" font-weight="700" x="245" y="125">Uᴷ</text>
<text fill="#444" font-size="10" x="245" y="145">N x r</text>
<text fill="#666" font-size="11" x="245" y="195">term-topic</text>
<text fill="#333" font-size="20" x="313" y="125">·</text>
<rect fill="#ede7f6" height="56" stroke="#6a1b9a" width="56" x="325" y="92"></rect>
<text fill="#4527a0" font-weight="700" x="353" y="124">Σᴷ</text>
<text fill="#444" font-size="10" x="353" y="160">r x r diag</text>
<text fill="#666" font-size="11" x="353" y="195">strength</text>
<text fill="#333" font-size="20" x="400" y="125">·</text>
<rect fill="#e8f5e9" height="80" stroke="#2e7d32" width="180" x="413" y="80"></rect>
<text fill="#1b5e20" font-weight="700" x="503" y="125">Vᴷᵀ</text>
<text fill="#444" font-size="10" x="503" y="145">r x K</text>
<text fill="#666" font-size="11" x="503" y="195">doc-topic</text>
<text fill="#c62828" font-size="11" font-weight="700" x="660" y="100">r ≪ min(N, K)</text>
<text fill="#666" font-size="10" x="660" y="118">topics ≪ vocab</text>
<text fill="#2e7d32" font-size="11" x="660" y="148">dense doc</text>
<text fill="#2e7d32" font-size="11" x="660" y="164">embeddings</text>
</g>
</svg>