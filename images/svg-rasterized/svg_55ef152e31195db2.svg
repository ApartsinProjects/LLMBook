<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Turn-management state machine for task-oriented dialogue: Collecting (gather slots) transitions to Confirming (verify details) once all slots are filled, then to Executing (call API), and finally to Completed; user corrections loop back to Collecting." role="img" viewBox="0 -9 700 359" xmlns="http://www.w3.org/2000/svg">
<!-- States as circles -->
<circle cx="120" cy="120" fill="#e8f4fd" r="50" stroke="#3498db" stroke-linecap="round" stroke-width="2"></circle>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="120" y="115">Collecting</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="120" y="132">Gather slots</text>
<circle cx="350" cy="120" fill="#fef9e7" r="50" stroke="#f39c12" stroke-linecap="round" stroke-width="2"></circle>
<text fill="#e67e22" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="350" y="115">Confirming</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="132">Verify details</text>
<circle cx="580" cy="120" fill="#e8f5e9" r="50" stroke="#27ae60" stroke-linecap="round" stroke-width="2"></circle>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="580" y="115">Executing</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="580" y="132">Call API</text>
<circle cx="350" cy="280" fill="#fdedec" r="50" stroke="#e74c3c" stroke-linecap="round" stroke-width="2"></circle>
<text fill="#e74c3c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="350" y="275">Completed</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="292">Task done</text>
<!-- Arrows between states -->
<line marker-end="url(#arrowhead2)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="170" x2="295" y1="120" y2="120"></line>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="232" y="110">All slots filled</text>
<line marker-end="url(#arrowhead2)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="400" x2="525" y1="120" y2="120"></line>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="462" y="110">User confirms</text>
<line marker-end="url(#arrowhead2)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="580" x2="400" y1="170" y2="270"></line>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="510" y="230">Success</text>
<!-- Correction arrow back -->
<path d="M 330 170 Q 230 220 150 170" fill="none" marker-end="url(#arrowRed)" stroke="#e74c3c" stroke-dasharray="5" stroke-linecap="round" stroke-width="1.5"></path>
<text fill="#c0392b" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="230" y="210">User corrects</text>
<!-- Self-loop on collecting -->
<path d="M 85 80 Q 60 40 120 70" fill="none" marker-end="url(#arrowBlue)" stroke="#3498db" stroke-linecap="round" stroke-width="1.5"></path>
<text fill="#2980b9" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="65" y="55">More slots</text>
<defs><filter height="116%" id="stdShadow2" width="108%" x="-4%" y="-4%"><fedropshadow dx="1" dy="2" flood-opacity="0.08" stddeviation="2"></fedropshadow></filter><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<marker id="arrowhead2" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#333" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="arrowRed" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#e74c3c" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="arrowBlue" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#3498db" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
</svg>