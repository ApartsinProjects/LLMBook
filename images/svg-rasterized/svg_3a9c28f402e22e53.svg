<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Logits to probabilities via softmax" aria-labelledby="figA2title" role="img" style="max-width:730px;width:100%;height:auto;background:#fafafa;border-radius:8px;" viewBox="-10 -35 730 395" xmlns="http://www.w3.org/2000/svg">
<title id="figA2title">Logits to probabilities via softmax</title>
<text fill="#222" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" x="360" y="26">From raw logits to a probability distribution</text>
<g transform="translate(50,80)">
<text fill="#222" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" x="120" y="0">Logits (raw scores)</text>
<rect fill="#7ab8d6" height="80" stroke="#1f77b4" width="40" x="20" y="20"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="40" y="115">2.0</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="40" y="130">"the"</text>
<rect fill="#7ab8d6" height="40" stroke="#1f77b4" width="40" x="70" y="60"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="90" y="115">1.0</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="90" y="130">"a"</text>
<rect fill="#7ab8d6" height="20" stroke="#1f77b4" width="40" x="120" y="80"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="140" y="115">0.5</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="140" y="130">"my"</text>
<rect fill="#f4a87a" height="40" stroke="#d62728" width="40" x="170" y="100"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="190" y="155">−1.0</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="190" y="170">"of"</text>
<rect fill="#7ab8d6" height="4" stroke="#1f77b4" width="40" x="220" y="96"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="240" y="115">0.1</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="240" y="130">"to"</text>
<line stroke="#666" stroke-dasharray="2 2" stroke-width="1" x1="0" x2="270" y1="100" y2="100"></line>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="end" x="-5" y="103">0</text>
</g>
<g transform="translate(340,160)">
<text fill="#222" font-family="Georgia, serif" font-size="22" text-anchor="middle" x="0" y="-30">→</text>
<text fill="#222" font-family="Georgia, serif" font-size="12" text-anchor="middle" x="0" y="-10">softmax</text>
<text fill="#666" font-family="Georgia, serif" font-size="11" text-anchor="middle" x="0" y="6">exp(z)/Σexp(z)</text>
</g>
<g transform="translate(420,80)">
<text fill="#222" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" x="135" y="0">Probabilities (sum = 1.0)</text>
<rect fill="#a4d99a" height="160" stroke="#2ca02c" width="40" x="20" y="20"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="40" y="195">0.45</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="40" y="210">"the"</text>
<rect fill="#a4d99a" height="59" stroke="#2ca02c" width="40" x="70" y="121"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="90" y="195">0.16</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="90" y="210">"a"</text>
<rect fill="#a4d99a" height="36" stroke="#2ca02c" width="40" x="120" y="144"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="140" y="195">0.10</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="140" y="210">"my"</text>
<rect fill="#a4d99a" height="8" stroke="#2ca02c" width="40" x="170" y="172"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="190" y="195">0.02</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="190" y="210">"of"</text>
<rect fill="#a4d99a" height="24" stroke="#2ca02c" width="40" x="220" y="156"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="240" y="195">0.07</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="240" y="210">"to"</text>
<line stroke="#666" stroke-width="1" x1="0" x2="270" y1="180" y2="180"></line>
</g>
<text fill="#444" font-family="Georgia, serif" font-size="12" font-style="italic" text-anchor="middle" x="360" y="320">Exponentiation amplifies the gap, then normalization forces the column to sum to 1.</text>
</svg>