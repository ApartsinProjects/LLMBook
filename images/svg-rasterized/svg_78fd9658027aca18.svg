<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Task vectors in parameter space: from a single base model, a Code fine-tune and a Medical fine-tune extend along two directions (Task Vector A and Task Vector B); adding the two vectors yields a merged multi-skill model." font-family="Segoe UI, system-ui, sans-serif" role="img" viewbox="0 -10 700 310" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_c5ecae_f5f5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f5f5f5"></stop></lineargradient>
<filter height="115%" id="shadow_c5ecae" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrTV_A" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"></path></marker>
<marker id="arrTV_B" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"></path></marker>
<marker id="arrTV_M" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8e44ad"></path></marker>
</defs>
<!-- Base model point -->
<circle cx="350" cy="200" fill="#3949ab" r="8"></circle>
<text fill="#3949ab" font-size="12" font-weight="bold" text-anchor="middle" x="350" y="230">Base Model</text>
<!-- Code model -->
<circle cx="180" cy="90" fill="#2e7d32" r="8"></circle>
<text fill="#2e7d32" font-size="12" font-weight="bold" text-anchor="middle" x="180" y="75">Code FT</text>
<line marker-end="url(#arrTV_A)" stroke="#2e7d32" stroke-dasharray="6" stroke-linecap="round" stroke-width="2" x1="345" x2="190" y1="195" y2="98"></line>
<text fill="#2e7d32" font-size="11" transform="rotate(-35, 240, 160)" x="240" y="160">Task Vector A</text>
<!-- Medical model -->
<circle cx="520" cy="90" fill="#e65100" r="8"></circle>
<text fill="#e65100" font-size="12" font-weight="bold" text-anchor="middle" x="520" y="75">Medical FT</text>
<line marker-end="url(#arrTV_B)" stroke="#e65100" stroke-dasharray="6" stroke-linecap="round" stroke-width="2" x1="355" x2="510" y1="195" y2="98"></line>
<text fill="#e65100" font-size="11" transform="rotate(35, 460, 160)" x="460" y="160">Task Vector B</text>
<!-- Merged model -->
<circle cx="350" cy="80" fill="#8e44ad" r="10" stroke="#8e44ad" stroke-linecap="round" stroke-width="2"></circle>
<text fill="#8e44ad" font-size="12" font-weight="bold" text-anchor="middle" x="350" y="60">Merged Model</text>
<line marker-end="url(#arrTV_M)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" x1="350" x2="350" y1="192" y2="95"></line>
<text fill="#8e44ad" font-size="11" x="370" y="145">A + B combined</text>
<!-- Legend -->
<rect fill="url(#grad_c5ecae_f5f5f5)" filter="url(#shadow_c5ecae)" height="35" rx="4" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="600" x="50" y="255"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="350" y="278">Task vectors (weight deltas from base) can be added to create multi-skill models</text>
</svg>