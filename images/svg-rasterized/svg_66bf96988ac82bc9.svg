<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="AI safety reading map by latency and content depth" viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="460" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">AI safety venues by update latency and primary output</text>
<line x1="80" y1="400" x2="840" y2="400" stroke="#1a1a2e" stroke-width="1.5"/>
<line x1="80" y1="60" x2="80" y2="400" stroke="#1a1a2e" stroke-width="1.5"/>
<text x="440" y="430" font-size="12" text-anchor="middle" fill="#1a1a2e">Update latency &#x2192;</text>
<text x="195" y="418" font-size="10" text-anchor="middle" fill="#5a4a3a">Daily</text>
<text x="370" y="418" font-size="10" text-anchor="middle" fill="#5a4a3a">Monthly</text>
<text x="555" y="418" font-size="10" text-anchor="middle" fill="#5a4a3a">Quarterly</text>
<text x="745" y="418" font-size="10" text-anchor="middle" fill="#5a4a3a">Annual+</text>
<text x="30" y="220" font-size="12" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 30 220)">Content depth &#x2192;</text>
<line x1="80" y1="320" x2="840" y2="320" stroke="#c0c0c0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="80" y1="220" x2="840" y2="220" stroke="#c0c0c0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="80" y1="120" x2="840" y2="120" stroke="#c0c0c0" stroke-width="1" stroke-dasharray="3,3"/>
<text x="70" y="365" font-size="9" text-anchor="end" fill="#5a4a3a">Threads</text>
<text x="70" y="270" font-size="9" text-anchor="end" fill="#5a4a3a">Blog post</text>
<text x="70" y="170" font-size="9" text-anchor="end" fill="#5a4a3a">Paper / report</text>
<text x="70" y="95" font-size="9" text-anchor="end" fill="#5a4a3a">Regulation</text>
<!-- daily -->
<g transform="translate(195,360)"><circle r="22" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/><text y="3" font-size="9" font-weight="700" text-anchor="middle" fill="#a67c1a">Alignment</text><text y="14" font-size="9" font-weight="700" text-anchor="middle" fill="#a67c1a">Forum</text></g>
<!-- monthly -->
<g transform="translate(370,265)"><circle r="24" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/><text y="-2" font-size="9" font-weight="700" text-anchor="middle" fill="#1a4078">Anthropic</text><text y="10" font-size="9" font-weight="700" text-anchor="middle" fill="#1a4078">Research</text></g>
<g transform="translate(370,160)"><circle r="22" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/><text y="3" font-size="9" font-weight="700" text-anchor="middle" fill="#1a4078">UK AISI</text></g>
<!-- quarterly -->
<g transform="translate(555,170)"><rect x="-50" y="-18" width="100" height="36" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/><text y="-3" font-size="10" font-weight="700" text-anchor="middle" fill="#1f7a3a">NIST AI RMF</text><text y="10" font-size="8" text-anchor="middle" fill="#5a4a3a">+ GAI Profile</text></g>
<!-- annual -->
<g transform="translate(745,95)"><rect x="-55" y="-18" width="110" height="36" rx="4" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="2"/><text y="-3" font-size="10" font-weight="700" text-anchor="middle" fill="#7a2a2a">EU AI Act</text><text y="10" font-size="8" text-anchor="middle" fill="#5a4a3a">Reg 2024/1689</text></g>
<g transform="translate(195,265)"><circle r="18" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/><text y="3" font-size="9" font-weight="700" text-anchor="middle" fill="#a67c1a">LessWrong</text></g>
<g transform="translate(745,170)"><rect x="-48" y="-18" width="96" height="36" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/><text y="-2" font-size="9" font-weight="700" text-anchor="middle" fill="#1f7a3a">CAIS Center</text><text y="10" font-size="8" text-anchor="middle" fill="#5a4a3a">for AI Safety</text></g>
<!-- legend -->
<g transform="translate(560,55)">
<rect x="0" y="-12" width="270" height="36" rx="4" fill="#ffffff" stroke="#c0c0c0" stroke-width="1"/>
<circle cx="14" cy="0" r="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/><text x="24" y="3" font-size="9" fill="#1a1a2e">Discussion</text>
<circle cx="92" cy="0" r="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/><text x="102" y="3" font-size="9" fill="#1a1a2e">Lab research</text>
<rect x="172" y="-6" width="12" height="12" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/><text x="188" y="3" font-size="9" fill="#1a1a2e">Standards</text>
<rect x="14" y="10" width="12" height="12" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="1.5"/><text x="30" y="20" font-size="9" fill="#1a1a2e">Binding regulation</text>
</g>
</svg>