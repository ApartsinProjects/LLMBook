<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Adam vs AdamW: where the weight-decay term is applied" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="240" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="360" y="22">Adam vs AdamW: where the weight-decay term is applied</text>
<g transform="translate(30,46)">
<rect fill="#fff3e0" height="170" rx="8" stroke="#a67c1a" stroke-width="2" width="320"></rect>
<text fill="#a67c1a" font-size="12" font-weight="700" text-anchor="middle" x="160" y="22">Adam (coupled)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="52">g ← ∇L + λθ  (decay folded into grad)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="80">m, v updated from g</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="108">θ ← θ − η · m̂ / (√v̂ + ε)</text>
<text fill="#a67c1a" font-size="10" text-anchor="middle" x="160" y="142">Decay is scaled by 1/√v̂: large-grad params get less decay.</text>
</g>
<g transform="translate(370,46)">
<rect fill="#e8f5e9" height="170" rx="8" stroke="#2e7d32" stroke-width="2" width="320"></rect>
<text fill="#2e7d32" font-size="12" font-weight="700" text-anchor="middle" x="160" y="22">AdamW (decoupled)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="52">g ← ∇L  (no decay in grad)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="80">m, v updated from g</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="108">θ ← (1 − λη) θ − η · m̂ / (√v̂ + ε)</text>
<text fill="#2e7d32" font-size="10" text-anchor="middle" x="160" y="142">Every parameter gets the same multiplicative shrink per step.</text>
</g>
</svg>