<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Champion-challenger promotion flow with four validation gates" viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="420" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Champion-challenger alias promotion: four assertion gates</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">From Code Fragment 44.1.4; any AssertionError halts before the alias moves</text>
<g transform="translate(40,80)">
<!-- candidate version 12 box left -->
<g transform="translate(0,100)">
<rect y="8" width="120" height="100" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="60" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">candidate</text>
<text x="60" y="38" font-size="10" text-anchor="middle" fill="#1a1a2e">chatbot-lora</text>
<text x="60" y="52" font-size="10" text-anchor="middle" fill="#1a1a2e">version 12</text>
<text x="60" y="76" font-size="9" fill="#5a4a3a" text-anchor="middle">val_loss: 0.298</text>
<text x="60" y="90" font-size="9" fill="#5a4a3a" text-anchor="middle">just trained</text>
</g>
<!-- 4 gate diamonds -->
<g transform="translate(170,150)">
<polygon points="0,-32 50,0 0,32 -50,0" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text y="-4" font-size="10" font-weight="700" text-anchor="middle" fill="#3d4d8a">Gate 1</text>
<text y="10" font-size="9" text-anchor="middle" fill="#1a1a2e">accuracy &#x2265; 0.90</text>
<text y="50" font-size="9" font-weight="700" text-anchor="middle" fill="#1f7a3a">0.923 PASS</text>
</g>
<g transform="translate(310,150)">
<polygon points="0,-32 50,0 0,32 -50,0" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text y="-4" font-size="10" font-weight="700" text-anchor="middle" fill="#3d4d8a">Gate 2</text>
<text y="10" font-size="9" text-anchor="middle" fill="#1a1a2e">safety &#x2265; 0.95</text>
<text y="50" font-size="9" font-weight="700" text-anchor="middle" fill="#1f7a3a">0.971 PASS</text>
</g>
<g transform="translate(450,150)">
<polygon points="0,-32 50,0 0,32 -50,0" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text y="-4" font-size="10" font-weight="700" text-anchor="middle" fill="#3d4d8a">Gate 3</text>
<text y="10" font-size="9" text-anchor="middle" fill="#1a1a2e">p99 &#x2264; 500 ms</text>
<text y="50" font-size="9" font-weight="700" text-anchor="middle" fill="#1f7a3a">412 ms PASS</text>
</g>
<g transform="translate(590,150)">
<polygon points="0,-32 60,0 0,32 -60,0" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text y="-4" font-size="10" font-weight="700" text-anchor="middle" fill="#3d4d8a">Gate 4</text>
<text y="10" font-size="8" text-anchor="middle" fill="#1a1a2e">no regression</text>
<text y="20" font-size="8" text-anchor="middle" fill="#1a1a2e">vs champion</text>
<text y="50" font-size="9" font-weight="700" text-anchor="middle" fill="#1f7a3a">+0.005 PASS</text>
</g>
<!-- production after -->
<g transform="translate(680,100)">
<rect y="8" width="120" height="100" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
<text x="60" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">champion</text>
<text x="60" y="38" font-size="10" text-anchor="middle" fill="#1a1a2e">alias moved to</text>
<text x="60" y="52" font-size="10" text-anchor="middle" fill="#1a1a2e">version 12</text>
<text x="60" y="76" font-size="9" fill="#5a4a3a" text-anchor="middle">audit event:</text>
<text x="60" y="90" font-size="9" fill="#5a4a3a" text-anchor="middle">"promoted 14:32 UTC"</text>
</g>
<!-- arrows -->
<g stroke="#1a1a2e" stroke-width="1.8" fill="none">
<path d="M 122 150 L 118 150 L 120 150" marker-end="url(#arr662)"/>
<path d="M 220 150 L 260 150" marker-end="url(#arr662)"/>
<path d="M 360 150 L 400 150" marker-end="url(#arr662)"/>
<path d="M 500 150 L 540 150" marker-end="url(#arr662)"/>
<path d="M 650 150 L 678 150" marker-end="url(#arr662)"/>
</g>
<!-- previous champion (rollback target) -->
<g transform="translate(680,260)">
<rect y="8" width="120" height="80" rx="6" fill="#fafafa" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="60" y="20" font-size="10" font-weight="700" text-anchor="middle" fill="#5a4a3a">previous</text>
<text x="60" y="36" font-size="10" font-weight="700" text-anchor="middle" fill="#5a4a3a">champion</text>
<text x="60" y="52" font-size="9" text-anchor="middle" fill="#1a1a2e">version 11</text>
<text x="60" y="68" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">retained for rollback</text>
</g>
<path d="M 740 200 L 740 260" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="755" y="232" font-size="9" font-style="italic" fill="#5a4a3a">rollback path</text>
<!-- fail path -->
<rect x="320" y="280" width="180" height="60" rx="6" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="2"/>
<text x="410" y="300" font-size="11" font-weight="700" text-anchor="middle" fill="#7a2a2a">AssertionError &#x2192; HALT</text>
<text x="410" y="316" font-size="9" text-anchor="middle" fill="#1a1a2e">alias does NOT move</text>
<text x="410" y="330" font-size="9" text-anchor="middle" fill="#1a1a2e">notify team, candidate stays "candidate"</text>
<path d="M 170 185 Q 240 230 320 290" stroke="#7a2a2a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr662r)"/>
<defs>
<marker id="arr662" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#1a1a2e"/></marker>
<marker id="arr662r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#7a2a2a"/></marker>
</defs>
</g>
</svg>