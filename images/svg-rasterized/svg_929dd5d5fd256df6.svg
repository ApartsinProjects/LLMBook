<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Forward KL is mode-covering; reverse KL is mode-seeking" role="img" style="max-width:720px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<text fill="#222" font-size="14" font-weight="700" text-anchor="middle" x="360" y="22">Forward KL is mode-covering; reverse KL is mode-seeking</text>
<g transform="translate(40,50)">
<text fill="#0d47a1" font-size="12" font-weight="700" text-anchor="middle" x="160" y="-5">minimize  Dₖₗ(P || Q)  (forward)</text>
<line stroke="#444" stroke-width="1" x1="0" x2="320" y1="200" y2="200"></line>
<path d="M 0 200 Q 60 60 110 200 Q 160 60 210 200 Q 260 200 320 200" fill="none" stroke="#c62828" stroke-width="2"></path>
<text fill="#c62828" font-size="11" x="60" y="55">P (data)</text>
<path d="M 0 200 Q 160 90 320 200" fill="rgba(13,71,161,0.18)" stroke="#0d47a1" stroke-width="2"></path>
<text fill="#0d47a1" font-size="11" x="220" y="100">Q (model fit)</text>
<text fill="#444" font-size="10" text-anchor="middle" x="160" y="225">Q spreads to cover BOTH modes of P</text>
</g>
<g transform="translate(400,50)">
<text fill="#1b5e20" font-size="12" font-weight="700" text-anchor="middle" x="160" y="-5">minimize  Dₖₗ(Q || P)  (reverse)</text>
<line stroke="#444" stroke-width="1" x1="0" x2="320" y1="200" y2="200"></line>
<path d="M 0 200 Q 60 60 110 200 Q 160 60 210 200 Q 260 200 320 200" fill="none" stroke="#c62828" stroke-width="2"></path>
<path d="M 0 200 Q 60 40 110 200 Z" fill="rgba(46,125,50,0.18)" stroke="#1b5e20" stroke-width="2"></path>
<text fill="#c62828" font-size="11" x="60" y="55">P (data)</text>
<text fill="#1b5e20" font-size="11" x="180" y="120">Q collapses to one mode</text>
<text fill="#444" font-size="10" text-anchor="middle" x="160" y="225">Q ignores the other mode of P</text>
</g>
</svg>