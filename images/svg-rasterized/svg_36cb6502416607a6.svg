<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Memory consolidation pipeline: raw memories enter a consolidator that merges duplicates, resolves conflicts, decays old entries, and emits a clean canonical store" role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow-memory" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"></path>
</marker>
</defs>
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="360" y="22">Memory consolidation: raw log to canonical store</text>
<g transform="translate(20,55)">
<rect fill="#fee2e2" height="200" rx="8" stroke="#b91c1c" stroke-width="1.5" width="180"></rect>
<text fill="#b91c1c" font-size="12" font-weight="600" text-anchor="middle" x="90" y="22">Raw memories</text>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="90" y="38">over 6 months</text>
<g fill="#2d3748" font-size="9">
<text x="14" y="60">- "likes coffee" (Jan 2)</text>
<text x="14" y="76">- "loves coffee" (Jan 8)</text>
<text x="14" y="92">- "coffee fan" (Jan 15)</text>
<text x="14" y="116">- "uses PostgreSQL" (Jan)</text>
<text x="14" y="132">- "switched to Mongo" (Mar)</text>
<text x="14" y="156">- "test mention X" (Feb 3,</text>
<text x="14" y="168">  never referenced again)</text>
<text x="14" y="188">. . . 47 more entries</text>
</g>
</g>
<g transform="translate(260,55)">
<rect fill="#fef3c7" height="200" rx="8" stroke="#d97706" stroke-width="1.5" width="200"></rect>
<text fill="#d97706" font-size="12" font-weight="600" text-anchor="middle" x="100" y="22">Consolidator</text>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="100" y="38">runs periodically</text>
<rect fill="#fff" height="30" rx="4" stroke="#d97706" width="172" x="14" y="55"></rect>
<text fill="#d97706" font-size="10" font-weight="600" text-anchor="middle" x="100" y="68">Merge duplicates</text>
<text fill="#4a5568" font-size="8" text-anchor="middle" x="100" y="80">three coffee mentions to one</text>
<rect fill="#fff" height="30" rx="4" stroke="#d97706" width="172" x="14" y="93"></rect>
<text fill="#d97706" font-size="10" font-weight="600" text-anchor="middle" x="100" y="106">Resolve conflicts</text>
<text fill="#4a5568" font-size="8" text-anchor="middle" x="100" y="118">keep MongoDB, mark old</text>
<rect fill="#fff" height="30" rx="4" stroke="#d97706" width="172" x="14" y="131"></rect>
<text fill="#d97706" font-size="10" font-weight="600" text-anchor="middle" x="100" y="144">Importance score</text>
<text fill="#4a5568" font-size="8" text-anchor="middle" x="100" y="156">how often referenced?</text>
<rect fill="#fff" height="30" rx="4" stroke="#d97706" width="172" x="14" y="169"></rect>
<text fill="#d97706" font-size="10" font-weight="600" text-anchor="middle" x="100" y="182">Decay + archive</text>
<text fill="#4a5568" font-size="8" text-anchor="middle" x="100" y="194">Ebbinghaus-style forgetting</text>
</g>
<g transform="translate(520,55)">
<rect fill="#d1fae5" height="200" rx="8" stroke="#047857" stroke-width="1.5" width="180"></rect>
<text fill="#047857" font-size="12" font-weight="600" text-anchor="middle" x="90" y="22">Canonical store</text>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="90" y="38">small, current, useful</text>
<g fill="#2d3748" font-size="9">
<text x="14" y="60">- prefers coffee (high)</text>
<text x="14" y="76">- uses MongoDB (cur)</text>
<text x="14" y="92">- previously PostgreSQL</text>
<text x="14" y="104">  (archived note)</text>
<text x="14" y="128">- dietary: vegetarian</text>
<text x="14" y="144">- tz: Europe/Berlin</text>
<text x="14" y="180">~8 canonical facts,</text>
<text x="14" y="192">not 50 raw entries</text>
</g>
</g>
<path d="M200,150 L256,150" marker-end="url(#arrow-memory)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M460,150 L516,150" marker-end="url(#arrow-memory)" stroke="#4a5568" stroke-width="1.5"></path>
</svg>