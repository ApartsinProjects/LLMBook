<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Multi-stage Docker build: build stage and runtime stage" role="img" style="max-width:100%;height:auto;" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="u2arr" markerheight="9" markerwidth="9" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"></path>
</marker>
</defs>
<g fill="#1a1a2e" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<g>
<rect fill="#fdeee8" height="290" rx="6" stroke="#b3401b" stroke-width="2" width="290" x="20" y="30"></rect>
<text fill="#b3401b" font-size="15" font-weight="700" text-anchor="middle" x="165" y="58">Build Stage</text>
<text fill="#5a4a3a" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="165" y="82">nvidia/cuda:...-devel</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="165" y="100">(5.5 GB base)</text>
<text font-size="12" x="40" y="138">+ python3, pip, gcc</text>
<text font-size="12" x="40" y="160">+ compiled wheels</text>
<text font-size="12" x="40" y="182">+ header files</text>
<text font-size="12" x="40" y="204">+ build artifacts</text>
<rect fill="#ffffff" height="52" rx="5" stroke="#b3401b" stroke-width="1.5" width="240" x="36" y="252"></rect>
<text fill="#b3401b" font-size="12" font-weight="700" text-anchor="middle" x="156" y="274">Total: ~8 GB</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="156" y="294">(discarded)</text>
</g>
<g>
<line marker-end="url(#u2arr)" stroke="#1a1a2e" stroke-width="2.5" x1="316" x2="380" y1="172" y2="172"></line>
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="middle" x="348" y="160">COPY</text>
</g>
<g>
<rect fill="#ecf6ee" height="290" rx="6" stroke="#1f7a3a" stroke-width="2" width="290" x="390" y="30"></rect>
<text fill="#1f7a3a" font-size="15" font-weight="700" text-anchor="middle" x="535" y="58">Runtime Stage</text>
<text fill="#5a4a3a" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="535" y="82">nvidia/cuda:...-runtime</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="535" y="100">(3.5 GB base)</text>
<text font-size="12" x="410" y="138">+ python3, libgomp</text>
<text font-size="12" x="410" y="160">+ /opt/venv (from builder)</text>
<text font-size="12" x="410" y="182">+ application code</text>
<rect fill="#fff5dc" height="52" rx="5" stroke="#1f7a3a" stroke-width="1.5" width="258" x="406" y="252"></rect>
<text fill="#1f7a3a" font-size="12" font-weight="700" text-anchor="middle" x="535" y="274">Final: ~4.5 GB</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="535" y="294">(vs. ~8 GB single-stage)</text>
</g>
</g>
</svg>