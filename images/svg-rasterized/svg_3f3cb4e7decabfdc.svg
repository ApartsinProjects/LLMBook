<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="HuBERT iterative tokenization loop: MFCC features clustered with kmeans become targets for iteration 1 transformer; that transformer's 6th-layer features clustered with kmeans become targets for iteration 2 transformer" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="320" width="800"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="400" y="22">HuBERT iterative tokenization: each transformer round refines its own targets</text>
<defs>
<marker id="hbArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
</defs>
<g font-size="10">
<rect fill="#bbdefb" height="60" rx="6" stroke="#1976d2" stroke-width="1.5" width="110" x="20" y="80"></rect>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="75" y="105">Unlabeled audio</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="75" y="120">LibriSpeech 960h</text>
<line marker-end="url(#hbArr)" stroke="#666" stroke-width="2" x1="130" x2="158" y1="110" y2="110"></line>
<rect fill="#fff3e0" height="60" rx="6" stroke="#ef6c00" stroke-width="1.5" width="110" x="158" y="80"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="213" y="100">MFCC features</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="213" y="115">25 ms windows</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="213" y="128">39-dim per frame</text>
<line marker-end="url(#hbArr)" stroke="#666" stroke-width="2" x1="268" x2="296" y1="110" y2="110"></line>
<rect fill="#c8e6c9" height="60" rx="6" stroke="#2e7d32" stroke-width="1.5" width="110" x="296" y="80"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="351" y="100">k-means</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="351" y="115">K = 100 clusters</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="351" y="128">iter 1 targets</text>
<line marker-end="url(#hbArr)" stroke="#666" stroke-width="2" x1="406" x2="434" y1="110" y2="110"></line>
<rect fill="#e1bee7" height="60" rx="6" stroke="#6a1b9a" stroke-width="1.5" width="140" x="434" y="80"></rect>
<text fill="#4a148c" font-weight="700" text-anchor="middle" x="504" y="100">HuBERT iter 1</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="504" y="115">masked CE on K=100</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="504" y="128">12-layer transformer</text>
<line marker-end="url(#hbArr)" stroke="#666" stroke-width="2" x1="574" x2="602" y1="110" y2="110"></line>
<rect fill="#fff9c4" height="60" rx="6" stroke="#f57f17" stroke-width="1.5" width="160" x="602" y="80"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="682" y="100">Extract layer 6 features</text>
<text fill="#f57f17" font-size="9" text-anchor="middle" x="682" y="118">contextual, phonetic</text>
<text fill="#f57f17" font-size="9" text-anchor="middle" x="682" y="132">768-dim per frame</text>
<line stroke="#666" stroke-width="2" x1="682" x2="682" y1="140" y2="170"></line>
<line stroke="#666" stroke-width="2" x1="682" x2="350" y1="170" y2="170"></line>
<line marker-end="url(#hbArr)" stroke="#666" stroke-width="2" x1="350" x2="350" y1="170" y2="200"></line>
<rect fill="#c8e6c9" height="60" rx="6" stroke="#2e7d32" stroke-width="1.5" width="115" x="295" y="200"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="352" y="220">k-means again</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="352" y="235">K = 500 clusters</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="352" y="248">iter 2 targets</text>
<line marker-end="url(#hbArr)" stroke="#666" stroke-width="2" x1="410" x2="438" y1="230" y2="230"></line>
<rect fill="#e1bee7" height="60" rx="6" stroke="#6a1b9a" stroke-width="1.5" width="140" x="438" y="200"></rect>
<text fill="#4a148c" font-weight="700" text-anchor="middle" x="508" y="220">HuBERT iter 2</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="508" y="235">masked CE on K=500</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="508" y="248">fresh weights</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="400" y="295">Iteration 3 (K=1000) repeats the loop for the largest model variants</text>
</g>
</svg>