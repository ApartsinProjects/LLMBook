<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Ethical decision framework for companion AI: user interaction detected leads to a vulnerability-signals check; no proceeds to normal interaction, yes branches to suggest professional help and other protective actions." role="img" viewBox="0 -9 700 289" xmlns="http://www.w3.org/2000/svg">
<!-- Decision flow -->
<rect fill="url(#grad_e6317a_e8f4fd)" filter="url(#shadow_e6317a)" height="40" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="200" x="250" y="45"></rect>
<text fill="#2980b9" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="350" y="70">User Interaction Detected</text>
<line marker-end="url(#ethArrow)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="350" x2="350" y1="85" y2="110"></line>
<!-- Diamond: Vulnerability check -->
<polygon fill="#fef9e7" points="350,110 450,150 350,190 250,150" stroke="#f39c12" stroke-linecap="round" stroke-width="2"></polygon>
<text fill="#e67e22" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="350" y="148">Vulnerability</text>
<text fill="#e67e22" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="350" y="162">Signals?</text>
<!-- No path -->
<line marker-end="url(#ethArrow)" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" x1="450" x2="560" y1="150" y2="150"></line>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="505" y="142">No</text>
<rect fill="#e8f5e9" height="40" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" width="120" x="560" y="130"></rect>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="620" y="155">Normal Interaction</text>
<!-- Yes path -->
<line marker-end="url(#ethArrow)" stroke="#e74c3c" stroke-linecap="round" stroke-width="1.5" x1="350" x2="350" y1="190" y2="220"></line>
<text fill="#e74c3c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="362" y="208">Yes</text>
<!-- Actions -->
<rect fill="url(#grad_e6317a_fdedec)" height="40" rx="8" stroke="#e74c3c" stroke-linecap="round" stroke-width="1.5" width="150" x="100" y="225"></rect>
<text fill="#c0392b" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="175" y="250">Suggest Professional Help</text>
<rect fill="url(#grad_e6317a_fdedec)" height="40" rx="8" stroke="#e74c3c" stroke-linecap="round" stroke-width="1.5" width="150" x="275" y="225"></rect>
<text fill="#c0392b" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="350" y="250">Reinforce AI Boundaries</text>
<rect fill="url(#grad_e6317a_fdedec)" height="40" rx="8" stroke="#e74c3c" stroke-linecap="round" stroke-width="1.5" width="150" x="450" y="225"></rect>
<text fill="#c0392b" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="525" y="250">Log for Review</text>
<line marker-end="url(#ethArrowRed)" stroke="#e74c3c" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="350" x2="178" y1="220" y2="223"></line>
<line marker-end="url(#ethArrowRed)" stroke="#e74c3c" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="350" x2="350" y1="220" y2="223"></line>
<line marker-end="url(#ethArrowRed)" stroke="#e74c3c" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="350" x2="522" y1="220" y2="223"></line>
<defs>
<lineargradient id="grad_e6317a_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<lineargradient id="grad_e6317a_fdedec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffcfb"></stop><stop offset="100%" stop-color="#fdedec"></stop></lineargradient>
<filter height="115%" id="shadow_e6317a" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="ethArrow" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#333" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="ethArrowRed" markerHeight="6" markerWidth="8" orient="auto" refX="10" refY="3"><polygon fill="#e74c3c" points="0 0, 8 3, 0 6"></polygon></marker>
</defs>
</svg>