<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Classification head: the CLS-token hidden state from BERT (size 768) feeds a single dense layer that outputs logits over the label set, and softmax converts the logits to a probability that picks the predicted class." role="img" viewbox="0 -9 700 347" xmlns="http://www.w3.org/2000/svg">
<!-- Input tokens -->
<rect fill="url(#grad_c4b94a_f0f0f0)" filter="url(#shadow_c4b94a)" height="35" rx="5" stroke="#ccc" stroke-linecap="round" width="500" x="100" y="270"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="350" y="293">[CLS] This movie was absolutely fantastic [SEP]</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="318">Input tokens</text>
<!-- Transformer encoder -->
<rect fill="url(#grad_c4b94a_e3f2fd)" height="70" rx="8" stroke="#1976D2" stroke-linecap="round" stroke-width="2" width="400" x="150" y="175"></rect>
<text fill="#1565C0" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="350" y="205">Pretrained Transformer Encoder</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="225">12 layers, 768 hidden dim (BERT-base)</text>
<!-- Arrow up -->
<line marker-end="url(#a6)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="350" x2="350" y1="270" y2="250"></line>
<!-- CLS representation -->
<rect fill="url(#grad_c4b94a_bbdefb)" height="30" rx="5" stroke="#1976D2" stroke-linecap="round" width="160" x="270" y="130"></rect>
<text fill="#0D47A1" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="350" y="150">[CLS] hidden state (768d)</text>
<line marker-end="url(#a6)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="350" x2="350" y1="175" y2="165"></line>
<!-- Dropout -->
<rect fill="url(#grad_c4b94a_fff3e0)" height="25" rx="4" stroke="#FF9800" stroke-linecap="round" width="120" x="290" y="95"></rect>
<text fill="#E65100" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="112">Dropout (0.1)</text>
<line marker-end="url(#a6)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="350" x2="350" y1="130" y2="123"></line>
<!-- Classification head -->
<rect fill="url(#grad_c4b94a_c8e6c9)" height="30" rx="5" stroke="#4CAF50" stroke-linecap="round" stroke-width="2" width="150" x="275" y="55"></rect>
<text fill="#2E7D32" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="350" y="75">Linear (768 -&gt; num_labels)</text>
<line marker-end="url(#a6)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="350" x2="350" y1="95" y2="88"></line>
<!-- Output -->
<text fill="#e94560" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="350" y="48">Logits: [2.1, -0.8, 0.3] -&gt; "Positive"</text>
<defs>
<lineargradient id="grad_c4b94a_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#E3F2FD"></stop></lineargradient>
<lineargradient id="grad_c4b94a_bbdefb" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#caedff"></stop><stop offset="100%" stop-color="#BBDEFB"></stop></lineargradient>
<lineargradient id="grad_c4b94a_c8e6c9" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d7f5d8"></stop><stop offset="100%" stop-color="#C8E6C9"></stop></lineargradient>
<lineargradient id="grad_c4b94a_f0f0f0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f0f0f0"></stop></lineargradient>
<lineargradient id="grad_c4b94a_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#FFF3E0"></stop></lineargradient>
<filter height="115%" id="shadow_c4b94a" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="a6" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><polygon fill="#888" points="0 0, 8 3, 0 6"></polygon></marker></defs>
</svg>