<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Hardening an agent sandbox with SBOM, scan, sign, and attest" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig494title" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;">
<title id="fig494title">Hardening an agent sandbox with SBOM, scan, sign, and attest</title>
<defs>
<marker id="arr494" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 z" fill="#444"/>
</marker>
</defs>
<text x="380" y="24" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Agent sandbox supply chain: from `pip install` to attestation</text>
<g font-family="Georgia, serif" font-size="11">
<rect x="20" y="52" width="160" height="100" rx="6" fill="#fde9e9" stroke="#d62728"/>
<text x="100" y="82" text-anchor="middle" font-weight="bold" fill="#d62728">Agent decides at runtime</text>
<text x="100" y="102" text-anchor="middle" fill="#444">pip install matplotlib</text>
<text x="100" y="118" text-anchor="middle" fill="#444">pip install some-pkg</text>
<text x="100" y="134" text-anchor="middle" fill="#444">docker pull base:latest</text>
<text x="100" y="152" text-anchor="middle" fill="#666" font-style="italic">dynamic, per-task</text>
<line x1="180" y1="110" x2="210" y2="110" stroke="#444" stroke-width="2" marker-end="url(#arr494)"/>
<rect x="220" y="60" width="160" height="100" rx="6" fill="#fff5d9" stroke="#cc8400"/>
<text x="300" y="82" text-anchor="middle" font-weight="bold" fill="#cc8400">1. SBOM (Syft)</text>
<text x="300" y="102" text-anchor="middle" fill="#444">CycloneDX JSON</text>
<text x="300" y="118" text-anchor="middle" fill="#444">pip + apt + go</text>
<text x="300" y="134" text-anchor="middle" fill="#444">versions, sources</text>
<text x="300" y="152" text-anchor="middle" fill="#666" font-style="italic">"what is inside"</text>
<line x1="380" y1="110" x2="410" y2="110" stroke="#444" stroke-width="2" marker-end="url(#arr494)"/>
<rect x="420" y="60" width="160" height="100" rx="6" fill="#e8f1fb" stroke="#1f77b4"/>
<text x="500" y="82" text-anchor="middle" font-weight="bold" fill="#1f77b4">2. Scan (Trivy/Grype)</text>
<text x="500" y="102" text-anchor="middle" fill="#444">SBOM → CVE list</text>
<text x="500" y="118" text-anchor="middle" fill="#444">severity threshold</text>
<text x="500" y="134" text-anchor="middle" fill="#444">block on CRITICAL</text>
<text x="500" y="152" text-anchor="middle" fill="#666" font-style="italic">"is it patched"</text>
<line x1="580" y1="110" x2="610" y2="110" stroke="#444" stroke-width="2" marker-end="url(#arr494)"/>
<rect x="620" y="60" width="120" height="100" rx="6" fill="#e9f7e9" stroke="#2ca02c"/>
<text x="680" y="82" text-anchor="middle" font-weight="bold" fill="#2ca02c">3. Sign (cosign)</text>
<text x="680" y="102" text-anchor="middle" fill="#444">Sigstore identity</text>
<text x="680" y="118" text-anchor="middle" fill="#444">+ keyless OIDC</text>
<text x="680" y="134" text-anchor="middle" fill="#444">image digest signed</text>
<text x="680" y="152" text-anchor="middle" fill="#666" font-style="italic">"who built it"</text>
<line x1="380" y1="200" x2="380" y2="220" stroke="#444" stroke-width="2" marker-end="url(#arr494)"/>
<rect x="20" y="220" width="720" height="120" rx="6" fill="#fff" stroke="#444"/>
<text x="380" y="246" text-anchor="middle" font-weight="bold" fill="#222" font-size="13">4. Runtime admission: only signed, scanned, attested artifacts can execute</text>
<rect x="40" y="260" width="220" height="70" rx="4" fill="#e8f1fb" stroke="#1f77b4"/>
<text x="150" y="278" text-anchor="middle" font-weight="bold" fill="#1f77b4">Dependency confusion blocked</text>
<text x="150" y="296" text-anchor="middle" fill="#444">private name pinned via</text>
<text x="150" y="310" text-anchor="middle" fill="#444">--index-url + hash</text>
<text x="150" y="324" text-anchor="middle" fill="#666" font-style="italic">Birsan-style attack</text>
<rect x="270" y="260" width="220" height="70" rx="4" fill="#e9f7e9" stroke="#2ca02c"/>
<text x="380" y="278" text-anchor="middle" font-weight="bold" fill="#2ca02c">CVE auto-block</text>
<text x="380" y="296" text-anchor="middle" fill="#444">Trivy severity ≥ HIGH →</text>
<text x="380" y="310" text-anchor="middle" fill="#444">refuse to start container</text>
<text x="380" y="324" text-anchor="middle" fill="#666" font-style="italic">known-CVE bypass blocked</text>
<rect x="500" y="260" width="220" height="70" rx="4" fill="#fff5d9" stroke="#cc8400"/>
<text x="610" y="278" text-anchor="middle" font-weight="bold" fill="#cc8400">Provenance attestation</text>
<text x="610" y="296" text-anchor="middle" fill="#444">SLSA + in-toto chain</text>
<text x="610" y="310" text-anchor="middle" fill="#444">links source → build → image</text>
<text x="610" y="324" text-anchor="middle" fill="#666" font-style="italic">CI compromise traceable</text>
</g>
</svg>