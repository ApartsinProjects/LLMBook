<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="A three-tier reading diet. Stable foundations (Goodfellow, Karpathy, CS336) you read once and return to; monthly currents (Raschka, Lilian Weng) keep you aligned with what shipped this quarter; community forums catch what nobody bothered to write up..." viewBox="0 0 807 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig55title" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;">
<title id="fig55title">A learning roadmap for Part I and beyond</title>
<text x="403" y="28" font-family="sans-serif" font-size="1.05em" font-weight="bold" text-anchor="middle" fill="#222">An LLM reading diet: foundations, currents, communities</text>
<g font-family="sans-serif" font-size="0.72em">
<rect x="20" y="55" width="250" height="195" rx="8" fill="#e8f1fb" stroke="#1f77b4"/>
<text x="145" y="80" text-anchor="middle" font-weight="bold" fill="#1f77b4" font-size="0.88em">Foundations (stable)</text>
<text x="34" y="106" fill="#444">- Goodfellow, Bengio, Courville (2016)</text>
<text x="34" y="126" fill="#444">- Karpathy "Zero to Hero" series</text>
<text x="34" y="146" fill="#444">- Stanford CS336 (LMs from Scratch)</text>
<text x="34" y="166" fill="#444">- d2l.ai textbook</text>
<text x="34" y="186" fill="#444">- fast.ai practical course</text>
<text x="145" y="232" text-anchor="middle" fill="#666" font-style="italic">read once, slowly</text>
<rect x="280" y="55" width="247" height="195" rx="8" fill="#e9f7e9" stroke="#2ca02c"/>
<text x="403" y="80" text-anchor="middle" font-weight="bold" fill="#2ca02c" font-size="0.88em">Currents (monthly)</text>
<text x="294" y="106" fill="#444">- Ahead of AI (Sebastian Raschka)</text>
<text x="294" y="126" fill="#444">- Lil'Log (Lilian Weng)</text>
<text x="294" y="146" fill="#444">- Cameron R. Wolfe</text>
<text x="294" y="166" fill="#444">- Transformer Circuits (Anthropic)</text>
<text x="294" y="186" fill="#444">- Horace He on "going brrrr"</text>
<text x="403" y="232" text-anchor="middle" fill="#666" font-style="italic">skim weekly, study one</text>
<rect x="537" y="55" width="250" height="195" rx="8" fill="#fff5d9" stroke="#cc8400"/>
<text x="662" y="80" text-anchor="middle" font-weight="bold" fill="#cc8400" font-size="0.88em">Communities (daily)</text>
<text x="551" y="106" fill="#444">- PyTorch / Hugging Face forums</text>
<text x="551" y="126" fill="#444">- r/MachineLearning [D] flair</text>
<text x="551" y="146" fill="#444">- r/LocalLLaMA</text>
<text x="551" y="166" fill="#444">- Bluesky (academic ML)</text>
<text x="551" y="186" fill="#444">- Twitter/X (lab announcements)</text>
<text x="662" y="232" text-anchor="middle" fill="#666" font-style="italic">read fewer than 50 accounts</text>
<rect x="20" y="275" width="767" height="155" rx="8" fill="#fde9e9" stroke="#d62728"/>
<text x="403" y="300" text-anchor="middle" font-weight="bold" fill="#d62728" font-size="0.88em">The four-paper canon, in order</text>
<text x="40" y="328" fill="#444"><tspan font-weight="bold">1.</tspan> Attention Is All You Need (Vaswani 2017)</text>
<text x="40" y="352" fill="#444"><tspan font-weight="bold">2.</tspan> BERT (Devlin 2018)</text>
<text x="40" y="376" fill="#444"><tspan font-weight="bold">3.</tspan> GPT-2 (Radford 2019)</text>
<text x="40" y="400" fill="#444"><tspan font-weight="bold">4.</tspan> InstructGPT (Ouyang 2022)</text>
<text x="403" y="422" text-anchor="middle" fill="#666" font-style="italic">architecture, then pretraining, then scaling, then alignment</text>
<rect x="20" y="450" width="767" height="55" rx="8" fill="#fff" stroke="#444"/>
<text x="40" y="473" font-weight="bold" fill="#222">Reading discipline:</text>
<text x="180" y="473" fill="#444">one paper a week, fully understood, rebuilt on paper</text>
<text x="40" y="494" fill="#444" font-style="italic">Skim ten, remember nothing. Read one, talk to the author by month three.</text>
</g>
</svg>