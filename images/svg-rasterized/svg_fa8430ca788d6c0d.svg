<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: Choosing a Reasoning Technique: Decision Flowchart" font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 760 535" xmlns="http://www.w3.org/2000/svg">
<!-- Start -->
<rect fill="url(#grad_ad21be_e8f4fd)" filter="url(#shadow_ad21be)" height="40" rx="20" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="200" x="280" y="40"></rect>
<text fill="#3498db" font-size="11" font-weight="600" text-anchor="middle" x="380" y="65">Does the task require reasoning?</text>
<!-- No branch: zero-shot -->
<line stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="280" x2="100" y1="60" y2="60"></line>
<line marker-end="url(#arrF)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="100" x2="100" y1="60" y2="85"></line>
<text fill="#888" font-size="11" text-anchor="middle" x="190" y="53">No</text>
<rect fill="#e8f5e9" height="35" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="160" x="20" y="85"></rect>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="100" y="107">Zero-Shot Prompting</text>
<!-- Yes branch -->
<line marker-end="url(#arrF)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="380" x2="380" y1="80" y2="115"></line>
<text fill="#888" font-size="11" x="395" y="100">Yes</text>
<!-- Need domain knowledge? -->
<rect fill="url(#grad_ad21be_fef9e7)" height="40" rx="20" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="250" x="255" y="115"></rect>
<text fill="#f39c12" font-size="11" font-weight="600" text-anchor="middle" x="380" y="140">Is domain knowledge the bottleneck?</text>
<!-- Yes: step-back -->
<line stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="505" x2="620" y1="135" y2="135"></line>
<line marker-end="url(#arrF)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="620" x2="620" y1="135" y2="155"></line>
<text fill="#888" font-size="11" x="560" y="128">Yes</text>
<rect fill="#e8f5e9" height="35" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="160" x="540" y="155"></rect>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="620" y="177">Step-Back Prompting</text>
<!-- No -->
<line marker-end="url(#arrF)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="380" x2="380" y1="155" y2="195"></line>
<text fill="#888" font-size="11" x="395" y="178">No</text>
<!-- Need external info? -->
<rect fill="url(#grad_ad21be_fef9e7)" height="40" rx="20" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="250" x="255" y="195"></rect>
<text fill="#f39c12" font-size="11" font-weight="600" text-anchor="middle" x="380" y="220">Needs external tools or data?</text>
<!-- Yes: ReAct -->
<line stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="505" x2="620" y1="215" y2="215"></line>
<line marker-end="url(#arrF)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="620" x2="620" y1="215" y2="235"></line>
<text fill="#888" font-size="11" x="560" y="208">Yes</text>
<rect fill="#e8f5e9" height="35" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="160" x="540" y="235"></rect>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="620" y="257">ReAct Framework</text>
<!-- No -->
<line marker-end="url(#arrF)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="380" x2="380" y1="235" y2="275"></line>
<text fill="#888" font-size="11" x="395" y="258">No</text>
<!-- Is high reliability critical? -->
<rect fill="url(#grad_ad21be_fef9e7)" height="40" rx="20" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="280" x="240" y="275"></rect>
<text fill="#f39c12" font-size="11" font-weight="600" text-anchor="middle" x="380" y="300">Is high reliability critical (accept 3x+ cost)?</text>
<!-- Yes: Self-Consistency -->
<line stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="520" x2="620" y1="295" y2="295"></line>
<line marker-end="url(#arrF)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="620" x2="620" y1="295" y2="315"></line>
<text fill="#888" font-size="11" x="570" y="288">Yes</text>
<rect fill="#e8f5e9" height="35" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="160" x="540" y="315"></rect>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="620" y="337">Self-Consistency</text>
<!-- No: CoT -->
<line marker-end="url(#arrF)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="380" x2="380" y1="315" y2="355"></line>
<text fill="#888" font-size="11" x="395" y="338">No</text>
<!-- Have good examples? -->
<rect fill="url(#grad_ad21be_fef9e7)" height="40" rx="20" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="250" x="255" y="355"></rect>
<text fill="#f39c12" font-size="11" font-weight="600" text-anchor="middle" x="380" y="380">Have good reasoning examples?</text>
<!-- Yes: Few-shot CoT -->
<line stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="505" x2="620" y1="375" y2="375"></line>
<line marker-end="url(#arrF)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="620" x2="620" y1="375" y2="395"></line>
<text fill="#888" font-size="11" x="560" y="368">Yes</text>
<rect fill="#e8f5e9" height="35" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="160" x="540" y="395"></rect>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="620" y="417">Few-Shot CoT</text>
<!-- No: Zero-shot CoT -->
<line marker-end="url(#arrF)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="380" x2="380" y1="395" y2="435"></line>
<text fill="#888" font-size="11" x="395" y="418">No</text>
<rect fill="#e8f5e9" height="35" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="160" x="300" y="435"></rect>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="380" y="457">Zero-Shot CoT</text>
<!-- Tip -->
<text fill="#888" font-size="11" font-style="italic" text-anchor="middle" x="380" y="500">Tip: Consider reasoning models (o3, o4-mini, DeepSeek R1) as alternatives to CoT prompting.</text>
<text fill="#888" font-size="11" font-style="italic" text-anchor="middle" x="380" y="515">These models perform chain-of-thought internally, so explicit CoT prompting may be unnecessary.</text>
<defs>
<lineargradient id="grad_ad21be_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<lineargradient id="grad_ad21be_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<filter height="115%" id="shadow_ad21be" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrF" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><polygon fill="#888" points="0 0, 8 3, 0 6"></polygon></marker></defs>
</svg>