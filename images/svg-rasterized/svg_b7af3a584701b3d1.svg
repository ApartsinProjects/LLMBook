<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Graceful degradation ladder for LLM APIs from best to worst UX: Level 1 full LLM response, Level 2 cached response, Level 3 simpler model, Level 4 static FAQ, Level 5 error message; each level fires when the previous is unavailable." font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
<!-- Step boxes -->
<rect fill="#e8f5e9" filter="url(#shadow_247738)" height="55" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="120" x="20" y="50"></rect>
<text fill="#27ae60" font-size="11" font-weight="700" text-anchor="middle" x="80" y="72">Level 1</text>
<text fill="#555" font-size="11" text-anchor="middle" x="80" y="90">Full LLM Response</text>
<rect fill="url(#grad_247738_e8f4fd)" height="55" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="120" x="160" y="70"></rect>
<text fill="#3498db" font-size="11" font-weight="700" text-anchor="middle" x="220" y="92">Level 2</text>
<text fill="#555" font-size="11" text-anchor="middle" x="220" y="110">Cached Response</text>
<rect fill="url(#grad_247738_f0e6ff)" height="55" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="120" x="300" y="90"></rect>
<text fill="#8e44ad" font-size="11" font-weight="700" text-anchor="middle" x="360" y="112">Level 3</text>
<text fill="#555" font-size="11" text-anchor="middle" x="360" y="130">Simpler Model</text>
<rect fill="url(#grad_247738_fef9e7)" height="55" rx="8" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="120" x="440" y="110"></rect>
<text fill="#f39c12" font-size="11" font-weight="700" text-anchor="middle" x="500" y="132">Level 4</text>
<text fill="#555" font-size="11" text-anchor="middle" x="500" y="150">Static FAQ</text>
<rect fill="url(#grad_247738_fdedec)" height="55" rx="8" stroke="#e74c3c" stroke-linecap="round" stroke-width="2" width="120" x="580" y="130"></rect>
<text fill="#e74c3c" font-size="11" font-weight="700" text-anchor="middle" x="640" y="152">Level 5</text>
<text fill="#555" font-size="11" text-anchor="middle" x="640" y="170">Error Message</text>
<!-- Connecting lines -->
<line stroke="#aaa" stroke-dasharray="4" stroke-linecap="round" stroke-width="1.5" x1="140" x2="160" y1="85" y2="95"></line>
<line stroke="#aaa" stroke-dasharray="4" stroke-linecap="round" stroke-width="1.5" x1="280" x2="300" y1="105" y2="115"></line>
<line stroke="#aaa" stroke-dasharray="4" stroke-linecap="round" stroke-width="1.5" x1="420" x2="440" y1="125" y2="135"></line>
<line stroke="#aaa" stroke-dasharray="4" stroke-linecap="round" stroke-width="1.5" x1="560" x2="580" y1="145" y2="155"></line>
<!-- Quality axis -->
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="80" y="210">Best UX</text>
<line marker-end="url(#arrowDeg)" stroke="#aaa" stroke-linecap="round" stroke-width="1" x1="140" x2="580" y1="205" y2="205"></line>
<defs>
<lineargradient id="grad_247738_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_247738_fdedec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffcfb"></stop><stop offset="100%" stop-color="#fdedec"></stop></lineargradient>
<lineargradient id="grad_247738_f0e6ff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff5ff"></stop><stop offset="100%" stop-color="#f0e6ff"></stop></lineargradient>
<lineargradient id="grad_247738_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_247738" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowDeg" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><polygon fill="#aaa" points="0 0, 8 3, 0 6"></polygon></marker></defs>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="640.0" x2="640.0" y1="197.0" y2="187.0"></line>
<text fill="#e74c3c" font-size="11" font-weight="600" text-anchor="middle" x="640" y="210">Worst UX</text>
<text fill="#555" font-size="11" text-anchor="middle" x="360" y="240">Each level is a fallback when the level above is unavailable</text>
</svg>