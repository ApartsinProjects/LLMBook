<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: a sparse item record on the left (title, category, three attributes) and its LLM-enriched version on the right (a rich 60-word description). An arrow labelled 'LLM enrichment' connects the two. Below each version, an embedding-vector bar shows the same encoder producing a thin sparse-record vector versus a richer enriched-record vector." role="img" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrenrich" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="4" viewBox="0 0 8 8"><path d="M0,0 L8,4 L0,8 z" fill="#8e44ad"></path></marker>
<filter height="115%" id="dsenrich" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>

<!-- Sparse item -->
<rect fill="#fdebd0" filter="url(#dsenrich)" height="170" rx="8" stroke="#e67e22" stroke-width="2" width="280" x="20" y="40"></rect>
<text fill="#7d6608" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="160" y="65">Sparse record</text>
<text fill="#444" font-family="monospace" font-size="11" x="35" y="92">title: "Anker Soundcore Q35"</text>
<text fill="#444" font-family="monospace" font-size="11" x="35" y="112">category: "Electronics/Headphones"</text>
<text fill="#444" font-family="monospace" font-size="11" x="35" y="132">brand: "Anker"</text>
<text fill="#444" font-family="monospace" font-size="11" x="35" y="152">connectivity: "Bluetooth 5.0"</text>
<text fill="#444" font-family="monospace" font-size="11" x="35" y="172">color: "black"</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle" x="160" y="200">~12 informative tokens</text>

<!-- Enrichment arrow -->
<path d="M 310 130 Q 380 130 460 130" fill="none" marker-end="url(#arrenrich)" stroke="#8e44ad" stroke-width="3"></path>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="385" y="120">LLM enrichment</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle" x="385" y="148">prompt + few-shot</text>

<!-- Enriched item -->
<rect fill="#e8f5e9" filter="url(#dsenrich)" height="170" rx="8" stroke="#27ae60" stroke-width="2" width="290" x="480" y="40"></rect>
<text fill="#1e8449" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="625" y="65">Enriched record</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" x="495" y="88">Over-ear Bluetooth headphones with</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" x="495" y="103">hybrid active noise cancellation. Often</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" x="495" y="118">recommended as a budget alternative to</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" x="495" y="133">Sony WH-1000XM and Bose QC. Around</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" x="495" y="148">40-hour battery; suited for plane travel,</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" x="495" y="163">commute, and remote-work calls. Multi-</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" x="495" y="178">point pairing supported. Foldable.</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle" x="625" y="200">~75 informative tokens</text>

<!-- Encoder labels -->
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="160" y="240">embed</text>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="625" y="240">embed</text>

<!-- Sparse embedding bar -->
<g transform="translate(20,260)">
<rect fill="#cce0f0" height="22" stroke="#7f8c8d" stroke-width="1" width="20"></rect>
<rect fill="#cce0f0" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="20"></rect>
<rect fill="#7fb3d5" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="40"></rect>
<rect fill="#cce0f0" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="60"></rect>
<rect fill="#cce0f0" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="80"></rect>
<rect fill="#cce0f0" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="100"></rect>
<rect fill="#7fb3d5" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="120"></rect>
<rect fill="#cce0f0" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="140"></rect>
<rect fill="#cce0f0" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="160"></rect>
<rect fill="#cce0f0" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="180"></rect>
<rect fill="#7fb3d5" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="200"></rect>
<rect fill="#cce0f0" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="220"></rect>
<rect fill="#cce0f0" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="240"></rect>
<rect fill="#cce0f0" height="22" stroke="#7f8c8d" stroke-width="1" width="20" x="260"></rect>
</g>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle" x="160" y="310">thin neighborhood</text>

<!-- Enriched embedding bar -->
<g transform="translate(480,260)">
<rect fill="#a9dfbf" height="22" stroke="#1e8449" stroke-width="1" width="20"></rect>
<rect fill="#52be80" height="22" stroke="#1e8449" stroke-width="1" width="20" x="20"></rect>
<rect fill="#27ae60" height="22" stroke="#1e8449" stroke-width="1" width="20" x="40"></rect>
<rect fill="#a9dfbf" height="22" stroke="#1e8449" stroke-width="1" width="20" x="60"></rect>
<rect fill="#52be80" height="22" stroke="#1e8449" stroke-width="1" width="20" x="80"></rect>
<rect fill="#27ae60" height="22" stroke="#1e8449" stroke-width="1" width="20" x="100"></rect>
<rect fill="#52be80" height="22" stroke="#1e8449" stroke-width="1" width="20" x="120"></rect>
<rect fill="#a9dfbf" height="22" stroke="#1e8449" stroke-width="1" width="20" x="140"></rect>
<rect fill="#27ae60" height="22" stroke="#1e8449" stroke-width="1" width="20" x="160"></rect>
<rect fill="#52be80" height="22" stroke="#1e8449" stroke-width="1" width="20" x="180"></rect>
<rect fill="#27ae60" height="22" stroke="#1e8449" stroke-width="1" width="20" x="200"></rect>
<rect fill="#a9dfbf" height="22" stroke="#1e8449" stroke-width="1" width="20" x="220"></rect>
<rect fill="#52be80" height="22" stroke="#1e8449" stroke-width="1" width="20" x="240"></rect>
<rect fill="#27ae60" height="22" stroke="#1e8449" stroke-width="1" width="20" x="260"></rect>
</g>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle" x="625" y="310">rich semantic neighborhood</text>
</svg>