<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Deepfake detection accuracy 2026 split by modality and condition." viewBox="0 0 760 385" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig544title" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;">
<title id="fig544title">Deepfake detection accuracy by modality and conditions</title>
<text x="380" y="24" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Detection accuracy 2026: from clean lab to in-the-wild</text>
<g font-family="Georgia, serif" font-size="11">
<line x1="120" y1="320" x2="720" y2="320" stroke="#222" stroke-width="1.5"/>
<line x1="120" y1="60" x2="120" y2="320" stroke="#222" stroke-width="1.5"/>
<text x="110" y="64" text-anchor="end" fill="#444">100%</text>
<text x="110" y="124" text-anchor="end" fill="#444">90%</text>
<text x="110" y="184" text-anchor="end" fill="#444">80%</text>
<text x="110" y="244" text-anchor="end" fill="#444">70%</text>
<text x="110" y="304" text-anchor="end" fill="#444">60%</text>
<text x="95" y="190" text-anchor="middle" transform="rotate(-90, 95, 190)" font-weight="bold" fill="#222">accuracy</text>
<text x="200" y="340" text-anchor="middle" font-weight="bold" fill="#222">GAN images</text>
<rect x="160" y="68" width="80" height="252" fill="#a4d99a" stroke="#2ca02c"/>
<text x="200" y="86" text-anchor="middle" fill="#fff" font-weight="bold">~98%</text>
<text x="200" y="100" text-anchor="middle" fill="#fff" font-size="9">CNNDetect</text>
<text x="350" y="340" text-anchor="middle" font-weight="bold" fill="#222">Diffusion images</text>
<rect x="310" y="100" width="80" height="220" fill="#7ab8d6" stroke="#1f77b4"/>
<text x="350" y="118" text-anchor="middle" fill="#fff" font-weight="bold">~90%</text>
<text x="350" y="132" text-anchor="middle" fill="#fff" font-size="9">ensemble</text>
<text x="500" y="340" text-anchor="middle" font-weight="bold" fill="#222">Voice clones</text>
<rect x="460" y="92" width="80" height="228" fill="#f4a87a" stroke="#cc8400"/>
<text x="500" y="110" text-anchor="middle" fill="#fff" font-weight="bold">~92%</text>
<text x="500" y="124" text-anchor="middle" fill="#fff" font-size="9">RawNet2</text>
<text x="650" y="340" text-anchor="middle" font-weight="bold" fill="#222">In-the-wild video</text>
<rect x="610" y="260" width="80" height="60" fill="#e8a4b8" stroke="#d62728"/>
<text x="650" y="278" text-anchor="middle" fill="#fff" font-weight="bold">~65%</text>
<text x="650" y="292" text-anchor="middle" fill="#fff" font-size="9">DFDC winner</text>
<line x1="120" y1="124" x2="720" y2="124" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
<text x="600" y="118" fill="#888" font-size="10">90% reference</text>
<rect x="120" y="60" width="600" height="2" fill="none" stroke="none"/>
<text x="420" y="380" text-anchor="middle" fill="#666" font-style="italic">Each modality has a generation it cannot catch. That generation is always next quarter's model.</text>
</g>
</svg>