<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The 2024-2026 conversational-discovery pattern across Pinterest Lens (cross-modal photo search), Spotify AI DJ and Daylist (LLM-generated DJ commentary and playlist titles on top of audio embeddings), YouTube SGE / TikTok feed-nav (LLM interprets..." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" style="max-width:880px;background:#fafafa;border:1px solid #ddd;font-family:sans-serif;">
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle">Conversational discovery: four named vendors, one shared pattern</text>
<rect x="40" y="60" width="200" height="120" fill="#fff" stroke="#3498db" stroke-width="2"/>
<text x="140" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#2874a6">Pinterest Lens</text>
<text x="50" y="106" font-size="10">photo -&gt; CLIP encoder</text>
<text x="50" y="120" font-size="10">5B images, FAISS NN</text>
<text x="50" y="138" font-size="11" font-weight="700">LLM role:</text>
<text x="50" y="152" font-size="10">refine results in NL</text>
<text x="50" y="166" font-size="10">"darker color", "kitchen instead"</text>
<rect x="250" y="60" width="200" height="120" fill="#fff" stroke="#3498db" stroke-width="2"/>
<text x="350" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#2874a6">Spotify AI DJ + Daylist</text>
<text x="260" y="106" font-size="10">listening-history embeddings</text>
<text x="260" y="120" font-size="10">+ time-of-day, mood</text>
<text x="260" y="138" font-size="11" font-weight="700">LLM role:</text>
<text x="260" y="152" font-size="10">DJ commentary, playlist titles</text>
<text x="260" y="166" font-size="10">"groovy disco morning Wednesday"</text>
<rect x="460" y="60" width="200" height="120" fill="#fff" stroke="#3498db" stroke-width="2"/>
<text x="560" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#2874a6">YouTube SGE + TikTok</text>
<text x="470" y="106" font-size="10">NL query / feed-nav signal</text>
<text x="470" y="120" font-size="10">existing recommender = ranker</text>
<text x="470" y="138" font-size="11" font-weight="700">LLM role:</text>
<text x="470" y="152" font-size="10">interpret + synthesize</text>
<text x="470" y="166" font-size="10">"show more like this but funnier"</text>
<rect x="670" y="60" width="170" height="120" fill="#fff" stroke="#3498db" stroke-width="2"/>
<text x="755" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#2874a6">Amazon Rufus</text>
<text x="680" y="106" font-size="10">catalog + reviews</text>
<text x="680" y="120" font-size="10">structured attributes</text>
<text x="680" y="138" font-size="11" font-weight="700">LLM role:</text>
<text x="680" y="152" font-size="10">interpret + cite</text>
<text x="680" y="166" font-size="10">never invents products</text>
<rect x="40" y="200" width="800" height="100" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
<text x="440" y="224" font-size="13" font-weight="700" fill="#117a65" text-anchor="middle">Shared pattern: LLM is interpreter + synthesizer, existing recommender is the system of record</text>
<text x="60" y="248" font-size="11">- LLM never scores trillions of items per day (cost &gt; budget)</text>
<text x="60" y="266" font-size="11">- LLM never invents items, songs, pins, or products (Instacart 2023 lesson)</text>
<text x="60" y="284" font-size="11">- EU DSA "why am I seeing this?" affordance becomes the standard explanation UX (full applicability 2026)</text>
</svg>