<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="PyTorch debugging toolkit: hooks, gradient stats, and the profiler" aria-labelledby="fig03btitle" role="img" style="max-width:720px;width:100%;height:auto;background:#fafafa;border-radius:8px;" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
<title id="fig03btitle">PyTorch debugging toolkit: hooks, gradient stats, and the profiler</title>
