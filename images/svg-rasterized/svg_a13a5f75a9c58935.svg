<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Confusion matrix showing true positives, false positives, false negatives, and true negatives, with formulas for precision, recall, and F1 to the right" role="img" style="max-width:100%;height:auto;display:block;margin:1rem auto;font-family:sans-serif;" viewBox="0 0 620 240" xmlns="http://www.w3.org/2000/svg">
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="310" y="22">Confusion matrix &amp; derived metrics</text>
<text fill="#4a5568" font-size="11" font-weight="600" text-anchor="middle" x="155" y="48">Predicted</text>
<text fill="#4a5568" font-size="11" font-weight="600" text-anchor="middle" transform="rotate(-90 50 115)" x="50" y="115">Actual</text>
<rect fill="#f3f4f6" height="30" stroke="#d1d5db" stroke-width="1" width="60" x="90" y="60"></rect>
<text fill="#1f2937" font-size="10" text-anchor="middle" x="120" y="79">Positive</text>
<rect fill="#f3f4f6" height="30" stroke="#d1d5db" stroke-width="1" width="60" x="150" y="60"></rect>
<text fill="#1f2937" font-size="10" text-anchor="middle" x="180" y="79">Negative</text>
<rect fill="#f3f4f6" height="60" stroke="#d1d5db" stroke-width="1" width="20" x="70" y="90"></rect>
<text fill="#1f2937" font-size="10" text-anchor="middle" transform="rotate(-90 80 124)" x="80" y="124">Pos</text>
<rect fill="#f3f4f6" height="60" stroke="#d1d5db" stroke-width="1" width="20" x="70" y="150"></rect>
<text fill="#1f2937" font-size="10" text-anchor="middle" transform="rotate(-90 80 184)" x="80" y="184">Neg</text>
<rect fill="#bbf7d0" height="60" stroke="#047857" stroke-width="1.5" width="60" x="90" y="90"></rect>
<text fill="#047857" font-size="14" font-weight="700" text-anchor="middle" x="120" y="118">TP</text>
<text fill="#065f46" font-size="9" text-anchor="middle" x="120" y="135">correctly</text>
<text fill="#065f46" font-size="9" text-anchor="middle" x="120" y="145">positive</text>
<rect fill="#fecaca" height="60" stroke="#b91c1c" stroke-width="1.5" width="60" x="150" y="90"></rect>
<text fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" x="180" y="118">FN</text>
<text fill="#7f1d1d" font-size="9" text-anchor="middle" x="180" y="135">missed</text>
<text fill="#7f1d1d" font-size="9" text-anchor="middle" x="180" y="145">positive</text>
<rect fill="#fed7aa" height="60" stroke="#d97706" stroke-width="1.5" width="60" x="90" y="150"></rect>
<text fill="#d97706" font-size="14" font-weight="700" text-anchor="middle" x="120" y="178">FP</text>
<text fill="#92400e" font-size="9" text-anchor="middle" x="120" y="195">false</text>
<text fill="#92400e" font-size="9" text-anchor="middle" x="120" y="205">alarm</text>
<rect fill="#dbeafe" height="60" stroke="#3a73a8" stroke-width="1.5" width="60" x="150" y="150"></rect>
<text fill="#3a73a8" font-size="14" font-weight="700" text-anchor="middle" x="180" y="178">TN</text>
<text fill="#1e3a8a" font-size="9" text-anchor="middle" x="180" y="195">correctly</text>
<text fill="#1e3a8a" font-size="9" text-anchor="middle" x="180" y="205">negative</text>
<line stroke="#d1d5db" stroke-width="1" x1="260" x2="260" y1="80" y2="220"></line>
<text fill="#3a73a8" font-size="12" font-weight="600" x="290" y="80">Precision</text>
<text fill="#4a5568" font-size="11" x="290" y="98">= TP / (TP + FP)</text>
<text fill="#6b7280" font-size="9" x="290" y="115">"of predicted positives, how many right?"</text>
<text fill="#047857" font-size="12" font-weight="600" x="290" y="142">Recall</text>
<text fill="#4a5568" font-size="11" x="290" y="160">= TP / (TP + FN)</text>
<text fill="#6b7280" font-size="9" x="290" y="177">"of actual positives, how many found?"</text>
<text fill="#7c3aed" font-size="12" font-weight="600" x="290" y="204">F1</text>
<text fill="#4a5568" font-size="11" x="290" y="222">= 2 P R / (P + R)</text>
</svg>