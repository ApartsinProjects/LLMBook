<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Agent state machine: PLANNING transitions to EXECUTING then REFLECTING then COMPLETE; reflection can loop back to PLANNING (replan), and EXECUTING can drop into ERROR on failure." role="img" viewbox="0 -9 700 229" xmlns="http://www.w3.org/2000/svg">
<defs><filter height="116%" id="stdShadow2" width="108%" x="-4%" y="-4%"><fedropshadow dx="1" dy="2" flood-opacity="0.08" stddeviation="2"></fedropshadow></filter><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<marker id="arrow2" markerheight="7" markerwidth="10" orient="auto" refx="9" refy="3.5">
<polygon fill="#555" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<!-- States -->
<rect fill="#e8f4fd" height="50" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="110" x="20" y="80"></rect>
<text font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="75" y="110">PLANNING</text>
<rect fill="#e8f5e9" height="50" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="110" x="180" y="80"></rect>
<text font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="235" y="110">EXECUTING</text>
<rect fill="#f0e6ff" height="50" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="110" x="340" y="80"></rect>
<text font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="395" y="110">REFLECTING</text>
<rect fill="#d5f5e3" height="50" rx="8" stroke="#1e8449" stroke-linecap="round" stroke-width="2" width="110" x="500" y="80"></rect>
<text font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="555" y="110">COMPLETE</text>
<rect fill="#fef9e7" height="45" rx="8" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="110" x="260" y="170"></rect>
<text font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="315" y="197">ERROR</text>
<!-- Transitions -->
<line marker-end="url(#arrow2)" stroke="#555" stroke-linecap="round" stroke-width="1.5" x1="130" x2="175" y1="105" y2="105"></line>
<line marker-end="url(#arrow2)" stroke="#555" stroke-linecap="round" stroke-width="1.5" x1="290" x2="335" y1="105" y2="105"></line>
<line marker-end="url(#arrow2)" stroke="#555" stroke-linecap="round" stroke-width="1.5" x1="450" x2="495" y1="105" y2="105"></line>
<!-- Reflect back to planning -->
<path d="M 370 80 Q 370 30 75 30 Q 20 30 20 80" fill="none" marker-end="url(#arrow2)" stroke="#8e44ad" stroke-dasharray="5,3" stroke-linecap="round" stroke-width="1.5"></path>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="200" y="22">replan</text>
<!-- Error from executing -->
<line marker-end="url(#arrow2)" stroke="#f39c12" stroke-linecap="round" stroke-width="1.5" x1="250" x2="290" y1="130" y2="170"></line>
</svg>