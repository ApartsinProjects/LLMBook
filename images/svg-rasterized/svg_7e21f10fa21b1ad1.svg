<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Roofline model: arithmetic intensity vs throughput on NVIDIA A100" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 880 400" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="400" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">The roofline model on NVIDIA A100: memory-bound vs compute-bound</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="440" y="40">peak compute 312 TFLOPS (FP16), HBM bandwidth 2 TB/s, ridge point ~156 FLOPs/byte</text>
<!-- Axes -->
<line stroke="#1a1a2e" stroke-width="1.5" x1="100" x2="820" y1="340" y2="340"></line>
<line stroke="#1a1a2e" stroke-width="1.5" x1="100" x2="100" y1="80" y2="340"></line>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="440" y="375">arithmetic intensity (FLOPs per byte, log scale)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" transform="rotate(-90,55,210)" x="55" y="210">achieved throughput (TFLOPS)</text>
<!-- x tick labels -->
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="100" y="355">0.1</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="220" y="355">1</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="340" y="355">10</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="460" y="355">156 (ridge)</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="580" y="355">1000</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="700" y="355">10000</text>
<!-- y tick labels -->
<text fill="#5a4a3a" font-size="9" text-anchor="end" x="92" y="100">312</text>
<text fill="#5a4a3a" font-size="9" text-anchor="end" x="92" y="200">100</text>
<text fill="#5a4a3a" font-size="9" text-anchor="end" x="92" y="270">10</text>
<text fill="#5a4a3a" font-size="9" text-anchor="end" x="92" y="320">1</text>
<!-- Bandwidth roof (sloped) -->
<line stroke="#7a2a4a" stroke-width="2.5" x1="100" x2="460" y1="340" y2="100"></line>
<text fill="#7a2a4a" font-size="10" font-weight="700" transform="rotate(-32,280,200)" x="280" y="200">HBM bw ceiling: 2 TB/s</text>
<!-- Compute roof (flat) -->
<line stroke="#3d4d8a" stroke-width="2.5" x1="460" x2="820" y1="100" y2="100"></line>
<text fill="#3d4d8a" font-size="10" font-weight="700" text-anchor="middle" x="640" y="92">compute ceiling: 312 TFLOPS</text>
<!-- Ridge point -->
<circle cx="460" cy="100" fill="#1a1a2e" r="6"></circle>
<line stroke="#1a1a2e" stroke-dasharray="3,2" stroke-width="1" x1="460" x2="460" y1="100" y2="340"></line>
<!-- Memory-bound region -->
<g font-size="10">
<circle cx="200" cy="285" fill="#fef3e0" r="6" stroke="#a67c1a" stroke-width="2"></circle>
<text fill="#a67c1a" text-anchor="middle" x="200" y="305">GELU (2.5 fp/B)</text>
<circle cx="225" cy="270" fill="#fef3e0" r="6" stroke="#a67c1a" stroke-width="2"></circle>
<text fill="#a67c1a" text-anchor="middle" x="225" y="252">LayerNorm</text>
<circle cx="260" cy="250" fill="#fef3e0" r="6" stroke="#a67c1a" stroke-width="2"></circle>
<text fill="#a67c1a" text-anchor="middle" x="280" y="240">Softmax</text>
<circle cx="320" cy="220" fill="#fef3e0" r="6" stroke="#a67c1a" stroke-width="2"></circle>
<text fill="#a67c1a" text-anchor="middle" x="380" y="218">attention (naive)</text>
<!-- Compute-bound region -->
<circle cx="500" cy="105" fill="#ecf6ee" r="7" stroke="#1f7a3a" stroke-width="2"></circle>
<text fill="#1f7a3a" text-anchor="middle" x="500" y="130">large GEMM</text>
<circle cx="600" cy="105" fill="#ecf6ee" r="7" stroke="#1f7a3a" stroke-width="2"></circle>
<text fill="#1f7a3a" text-anchor="middle" x="600" y="130">cuBLAS matmul</text>
<!-- FlashAttention placement -->
<circle cx="420" cy="115" fill="#e3e8f5" r="8" stroke="#3d4d8a" stroke-width="2.5"></circle>
<text fill="#3d4d8a" text-anchor="middle" x="420" y="140">FlashAttention</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="420" y="153">(kernel fusion + tiling)</text>
</g>
<!-- Region labels -->
<text fill="#a67c1a" font-size="11" font-weight="700" x="200" y="160">memory-bound region</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" x="200" y="175">fuse kernels to reduce HBM traffic</text>
<text fill="#1f7a3a" font-size="11" font-weight="700" x="640" y="180">compute-bound region</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" x="640" y="195">optimize arithmetic, use tensor cores</text>
</svg>