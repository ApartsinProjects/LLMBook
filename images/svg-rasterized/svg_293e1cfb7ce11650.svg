<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Vector database architecture: client SDK calls the REST or gRPC API layer, which routes to the query engine (vector search plus filtering), index manager (HNSW, IVF, PQ), and write path (WAL plus batch indexing), all backed by a shared storage layer." role="img" viewbox="0 0 720 340" xmlns="http://www.w3.org/2000/svg">
