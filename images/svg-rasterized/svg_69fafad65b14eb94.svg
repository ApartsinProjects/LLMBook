<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Five-layer trust boundary architecture for security-sensitive LLMs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="fig-76-4-1-title fig-76-4-1-desc">
<title id="fig-76-4-1-title">Five-layer trust boundary architecture for security-sensitive LLMs</title>
<desc id="fig-76-4-1-desc">Pipeline from analyst query through five trust boundaries to action. L1 input classification (trusted system / untrusted user / untrusted retrieval / tool output). L2 output filtering (independent Llama-3 70B classifier, not main LLM). L3 tool-call sandbox (no exec, allow-list HTTP). L4 authorization at tool layer (analyst-scoped permissions). L5 audit log (Splunk 18-mo retention). Bottom: 55% time reduction at Fortune 500 SOC, $350-500K/yr TCO on $5-6M baseline.</desc>
<rect x="0" y="0" width="760" height="380" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">SOC-LLM trust-boundary architecture (MS Security Copilot, CrowdStrike Charlotte default)</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- input -->
<rect x="20" y="180" width="80" height="60" fill="#eaf1ff" stroke="#2c5fa0" rx="4"/>
<text x="60" y="205" text-anchor="middle" font-weight="700" fill="#2c5fa0">Analyst</text>
<text x="60" y="221" text-anchor="middle" font-size="10">query + alert</text>

<line x1="100" y1="210" x2="118" y2="210" stroke="#5a6573" stroke-width="2" marker-end="url(#arr13)"/>

<!-- L1 -->
<rect x="118" y="172" width="115" height="60" fill="#dfeaf5" stroke="#2c5fa0" rx="4"/>
<text x="175" y="200" text-anchor="middle" font-weight="700" fill="#2c5fa0">L1 Input class.</text>
<text x="175" y="216" text-anchor="middle" font-size="10">trusted system /</text>
<text x="175" y="230" text-anchor="middle" font-size="10">untrusted external</text>

<line x1="233" y1="210" x2="252" y2="210" stroke="#5a6573" stroke-width="2" marker-end="url(#arr13)"/>

<!-- LLM core -->
<rect x="252" y="170" width="115" height="80" fill="#fff5d6" stroke="#b8860b" rx="4"/>
<text x="309" y="190" text-anchor="middle" font-weight="700" fill="#7a5a08">LLM (Copilot)</text>
<text x="309" y="208" text-anchor="middle" font-size="10">untreated as policy</text>
<text x="309" y="222" text-anchor="middle" font-size="10">recommends action</text>
<text x="309" y="238" text-anchor="middle" font-size="10">+ confidence</text>

<line x1="367" y1="210" x2="385" y2="210" stroke="#5a6573" stroke-width="2" marker-end="url(#arr13)"/>

<!-- L2 -->
<rect x="385" y="180" width="115" height="60" fill="#ede4f7" stroke="#5a3d99" rx="4"/>
<text x="442" y="200" text-anchor="middle" font-weight="700" fill="#5a3d99">L2 Output filter</text>
<text x="442" y="216" text-anchor="middle" font-size="10">Llama-3 70B</text>
<text x="442" y="230" text-anchor="middle" font-size="10">independent classifier</text>

<line x1="500" y1="210" x2="518" y2="210" stroke="#5a6573" stroke-width="2" marker-end="url(#arr13)"/>

<!-- L3 -->
<rect x="518" y="180" width="115" height="60" fill="#eef5ec" stroke="#1f6f3a" rx="4"/>
<text x="575" y="200" text-anchor="middle" font-weight="700" fill="#1f6f3a">L3 Sandbox</text>
<text x="575" y="216" text-anchor="middle" font-size="10">no exec, no rm -rf,</text>
<text x="575" y="230" text-anchor="middle" font-size="10">HTTP allow-list only</text>

<line x1="633" y1="210" x2="652" y2="210" stroke="#5a6573" stroke-width="2" marker-end="url(#arr13)"/>

<!-- L4 -->
<rect x="652" y="180" width="90" height="60" fill="#f1d6d0" stroke="#b2351e" rx="4"/>
<text x="697" y="200" text-anchor="middle" font-weight="700" fill="#b2351e">L4 Authz</text>
<text x="697" y="216" text-anchor="middle" font-size="10">per-analyst</text>
<text x="697" y="230" text-anchor="middle" font-size="10">tool-layer</text>

<!-- L5 - audit log below the pipeline -->
<rect x="118" y="280" width="624" height="50" fill="#fafafe" stroke="#a8b9d4" rx="4"/>
<text x="430" y="298" text-anchor="middle" font-weight="700">L5 Audit log: every prompt + retrieval + tool call + output → Splunk 18mo</text>
<text x="430" y="316" text-anchor="middle" font-size="10">hot 30d ($1500/GB-yr) · warm 90d ($500) · cold to 7yr ($50 S3 Glacier)</text>

<!-- arrows from each layer down to audit log -->
<line x1="175" y1="240" x2="175" y2="280" stroke="#a8b9d4" stroke-dasharray="3 2"/>
<line x1="309" y1="250" x2="309" y2="280" stroke="#a8b9d4" stroke-dasharray="3 2"/>
<line x1="442" y1="240" x2="442" y2="280" stroke="#a8b9d4" stroke-dasharray="3 2"/>
<line x1="575" y1="240" x2="575" y2="280" stroke="#a8b9d4" stroke-dasharray="3 2"/>
<line x1="697" y1="240" x2="697" y2="280" stroke="#a8b9d4" stroke-dasharray="3 2"/>

<!-- TCO banner -->
<rect x="20" y="345" width="720" height="28" fill="#fff5d6" stroke="#b8860b" rx="4"/>
<text x="380" y="364" text-anchor="middle" font-size="11">Fortune 500 SOC (40 analysts): 55% time reduction, $350-500K/yr TCO on $5-6M baseline payroll</text>

<!-- top callout -->
<text x="380" y="80" text-anchor="middle" font-weight="700" fill="#b2351e">"Auto-execute after 5-min timeout" retired industry-wide after 6,000-account-lockout postmortem</text>
<text x="380" y="98" text-anchor="middle" font-style="italic" fill="#5a6573">Every action now requires explicit analyst confirmation; LLM never enforces its own policy</text>

<defs><marker id="arr13" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a6573"/></marker></defs>
</g>
</svg>