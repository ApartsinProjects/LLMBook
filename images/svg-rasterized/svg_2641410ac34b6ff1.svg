<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Cluster interconnect hierarchy" role="img" style="font-family: sans-serif; max-width: 100%; height: auto;" viewbox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="400" width="900"></rect>
<!-- Tier 1: NVLink within node -->
<g transform="translate(40, 54)">
<rect fill="#eef4fa" height="160" rx="6" stroke="#1a4078" stroke-width="2" width="380" x="0" y="16"></rect>
<text fill="#1a4078" font-size="14" font-weight="700" text-anchor="middle" x="190" y="22">Tier 1: Intra-node (NVLink / NVSwitch)</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="190" y="40">8 GPUs in one chassis</text>
<g transform="translate(20, 60)">
<rect fill="#ffffff" height="40" rx="3" stroke="#1a4078" width="50" x="0" y="0"></rect><text font-size="10" text-anchor="middle" x="25" y="24">G0</text>
<rect fill="#ffffff" height="40" rx="3" stroke="#1a4078" width="50" x="60" y="0"></rect><text font-size="10" text-anchor="middle" x="85" y="24">G1</text>
<rect fill="#ffffff" height="40" rx="3" stroke="#1a4078" width="50" x="120" y="0"></rect><text font-size="10" text-anchor="middle" x="145" y="24">G2</text>
<rect fill="#ffffff" height="40" rx="3" stroke="#1a4078" width="50" x="180" y="0"></rect><text font-size="10" text-anchor="middle" x="205" y="24">G3</text>
<rect fill="#ffffff" height="40" rx="3" stroke="#1a4078" width="50" x="240" y="0"></rect><text font-size="10" text-anchor="middle" x="265" y="24">G4</text>
<rect fill="#ffffff" height="40" rx="3" stroke="#1a4078" width="50" x="300" y="0"></rect><text font-size="10" text-anchor="middle" x="325" y="24">G5</text>
</g>
<text fill="#1a4078" font-size="12" font-weight="600" text-anchor="middle" x="190" y="138">900 GB/s per direction (H100 NVLink 4)</text>
</g>
<!-- Tier 2: InfiniBand across rack -->
<g transform="translate(480, 54)">
<rect fill="#ecf6ee" height="160" rx="6" stroke="#1f7a3a" stroke-width="2" width="380" x="0" y="16"></rect>
<text fill="#1f7a3a" font-size="14" font-weight="700" text-anchor="middle" x="190" y="22">Tier 2: Inter-node (InfiniBand / RoCE)</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="190" y="40">Across racks in a pod</text>
<g transform="translate(40, 60)">
<rect fill="#ffffff" height="50" rx="4" stroke="#1f7a3a" width="80" x="0" y="0"></rect>
<text font-size="11" font-weight="600" text-anchor="middle" x="40" y="22">Node 0</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="40" y="40">8 GPUs</text>
<rect fill="#ffffff" height="50" rx="4" stroke="#1f7a3a" width="80" x="100" y="0"></rect>
<text font-size="11" font-weight="600" text-anchor="middle" x="140" y="22">Node 1</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="140" y="40">8 GPUs</text>
<rect fill="#ffffff" height="50" rx="4" stroke="#1f7a3a" width="80" x="200" y="0"></rect>
<text font-size="11" font-weight="600" text-anchor="middle" x="240" y="22">Node 2</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="240" y="40">8 GPUs</text>
</g>
<text fill="#1f7a3a" font-size="12" font-weight="600" text-anchor="middle" x="190" y="138">400 Gb/s per port (NDR IB)</text>
</g>
<!-- Tier 3: spine fabric -->
<g transform="translate(40, 218)">
<rect fill="#fef3e0" height="120" rx="6" stroke="#a67c1a" stroke-width="2" width="820" x="0" y="32"></rect>
<text fill="#a67c1a" font-size="14" font-weight="700" text-anchor="middle" x="410" y="22">Tier 3: Spine fabric across pods (oversubscribed)</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="410" y="42">Whole-cluster all-reduce passes through here</text>
<g transform="translate(40, 60)">
<rect fill="#ffffff" height="40" rx="4" stroke="#a67c1a" width="120" x="0" y="0"></rect><text font-size="11" font-weight="600" text-anchor="middle" x="60" y="24">Pod A</text>
<rect fill="#ffffff" height="40" rx="4" stroke="#a67c1a" width="120" x="180" y="0"></rect><text font-size="11" font-weight="600" text-anchor="middle" x="240" y="24">Pod B</text>
<rect fill="#ffffff" height="40" rx="4" stroke="#a67c1a" width="120" x="360" y="0"></rect><text font-size="11" font-weight="600" text-anchor="middle" x="420" y="24">Pod C</text>
<rect fill="#ffffff" height="40" rx="4" stroke="#a67c1a" width="120" x="540" y="0"></rect><text font-size="11" font-weight="600" text-anchor="middle" x="600" y="24">Pod D</text>
</g>
<line stroke="#a67c1a" stroke-dasharray="6,3" stroke-width="2" x1="100" x2="660" y1="80" y2="80"></line>
</g>
</svg>