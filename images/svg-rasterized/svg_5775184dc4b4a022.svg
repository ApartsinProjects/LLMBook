<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Five frontier silicon families on training vs inference and latency vs throughput axes" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewBox="-20 0 900 460" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="460" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">Where each 2026 silicon family sits on the training-vs-inference, latency-vs-throughput surface</text>
<g transform="translate(110,60)">
<line stroke="#1a1a2e" stroke-width="1.5" x1="0" x2="700" y1="350" y2="350"></line>
<line stroke="#1a1a2e" stroke-width="1.5" x1="0" x2="0" y1="0" y2="350"></line>
<line stroke="#c0c0c0" stroke-dasharray="3,3" stroke-width="0.8" x1="0" x2="700" y1="175" y2="175"></line>
<line stroke="#c0c0c0" stroke-dasharray="3,3" stroke-width="0.8" x1="350" x2="350" y1="0" y2="350"></line>
<text fill="#1a1a2e" font-size="11" font-style="italic" text-anchor="middle" x="350" y="370">Training optimized ←—————————————————→ Inference optimized</text>
<text fill="#1a1a2e" font-size="11" font-style="italic" text-anchor="middle" transform="rotate(-90 -15 175)" x="-15" y="175">Throughput ←———————→ Low-latency batch-1</text>
<!-- quadrant labels -->
<text fill="#5a4a3a" font-size="10" font-weight="700" opacity="0.6" text-anchor="middle" x="175" y="20">Training, batch-1 niche</text>
<text fill="#5a4a3a" font-size="10" font-weight="700" opacity="0.6" text-anchor="middle" x="525" y="20">Inference, batch-1 / latency</text>
<text fill="#5a4a3a" font-size="10" font-weight="700" opacity="0.6" text-anchor="middle" x="175" y="345">Training, big-batch throughput</text>
<text fill="#5a4a3a" font-size="10" font-weight="700" opacity="0.6" text-anchor="middle" x="525" y="345">Inference, big-batch throughput</text>
<!-- chips as bubbles sized by approx memory bandwidth class -->
<g>
<!-- NVIDIA Blackwell B200: training-leaning, high throughput. Mem 8 TB/s, large bubble -->
<circle cx="170" cy="265" fill="#eef4fa" r="38" stroke="#1a4078" stroke-width="2.5"></circle>
<text fill="#1a4078" font-size="11" font-weight="700" text-anchor="middle" x="170" y="262">NVIDIA</text>
<text fill="#1a4078" font-size="11" font-weight="700" text-anchor="middle" x="170" y="276">B200 / B300</text>
<text fill="#5a4a3a" font-size="8" text-anchor="middle" x="170" y="289">192 GB HBM3e</text>
<!-- AMD MI355X: training-capable, inference-heavy, largest memory -->
<circle cx="260" cy="245" fill="#f8e3e3" r="34" stroke="#7a2a2a" stroke-width="2.5"></circle>
<text fill="#7a2a2a" font-size="10" font-weight="700" text-anchor="middle" x="260" y="246">AMD MI355X</text>
<text fill="#5a4a3a" font-size="8" text-anchor="middle" x="260" y="259">288 GB HBM3e</text>
<!-- AWS Trainium 2/4: cloud-locked training -->
<circle cx="120" cy="180" fill="#fef3e0" r="26" stroke="#a67c1a" stroke-width="2.5"></circle>
<text fill="#a67c1a" font-size="10" font-weight="700" text-anchor="middle" x="120" y="178">AWS</text>
<text fill="#a67c1a" font-size="10" font-weight="700" text-anchor="middle" x="120" y="190">Trainium 2 / 4</text>
<!-- Tenstorrent Blackhole: research, RISC-V -->
<circle cx="220" cy="80" fill="#ecf6ee" r="22" stroke="#1f7a3a" stroke-width="2.5"></circle>
<text fill="#1f7a3a" font-size="10" font-weight="700" text-anchor="middle" x="220" y="78">Tenstorrent</text>
<text fill="#1f7a3a" font-size="10" font-weight="700" text-anchor="middle" x="220" y="90">Blackhole</text>
<!-- Cerebras CS-3: inference, big throughput, wafer-scale (huge bubble) -->
<circle cx="490" cy="280" fill="#cfe0ee" r="46" stroke="#1a4078" stroke-width="2.5"></circle>
<text fill="#1a4078" font-size="11" font-weight="700" text-anchor="middle" x="490" y="278">Cerebras CS-3</text>
<text fill="#5a4a3a" font-size="8" text-anchor="middle" x="490" y="291">21 PB/s on-wafer</text>
<text fill="#5a4a3a" font-size="8" font-style="italic" text-anchor="middle" x="490" y="304">OpenAI $10B+ deal</text>
<!-- Groq LPU / NVIDIA LPX: lowest-latency inference -->
<circle cx="610" cy="90" fill="#f0e3f8" r="32" stroke="#6a3d8a" stroke-width="2.5"></circle>
<text fill="#6a3d8a" font-size="10" font-weight="700" text-anchor="middle" x="610" y="84">Groq LPU</text>
<text fill="#6a3d8a" font-size="10" font-weight="700" text-anchor="middle" x="610" y="96">/ NVIDIA LPX</text>
<text fill="#5a4a3a" font-size="8" text-anchor="middle" x="610" y="108">$20B acquisition Dec 2025</text>
</g>
<!-- arrows showing co-location pull -->
<path d="M 215 265 Q 350 200 470 280" fill="none" marker-end="url(#arr581b)" stroke="#1a1a2e" stroke-dasharray="2,2" stroke-width="1"></path>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="350" y="160">"train on Blackwell, serve on Cerebras"</text>
<defs><marker id="arr581b" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="4"><polygon fill="#1a1a2e" points="0 0, 8 4, 0 8"></polygon></marker></defs>
</g>
</svg>