<text fill="#c62828" font-family="Segoe UI, system-ui, sans-serif" font-size="10" x="555" y="160">push</text>
<rect fill="#fff" height="60" rx="6" stroke="#888" width="110" x="635" y="110"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="690" y="135">Symmetric</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="690" y="151">InfoNCE</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="690" y="165">temperature τ</text>
<g fill="none" stroke="#555" stroke-width="1.5">
