<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="CLAP dual-tower architecture: audio waveform passes through HTSAT into an audio encoder, text caption passes through a text encoder, both project into a shared 512-dim embedding space where InfoNCE contrastive loss pulls matched pairs together and pushes mismatched pairs apart." role="img" viewbox="0 0 760 280" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="270" rx="10" stroke="#ddd" width="750" x="5" y="5"></rect>
<rect fill="#fff3e0" height="50" rx="6" stroke="#e65100" width="160" x="25" y="40"></rect>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="105" y="62">Audio waveform</text>
<text fill="#e65100" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="105" y="80">a_i  (10 s clip)</text>
<rect fill="#ffe0b2" height="50" rx="6" stroke="#e65100" width="160" x="215" y="40"></rect>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="295" y="62">HTSAT spectrogram</text>
<text fill="#e65100" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="295" y="80">audio encoder f</text>
<rect fill="#e3f2fd" height="50" rx="6" stroke="#1565c0" width="160" x="25" y="180"></rect>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="105" y="202">Text caption</text>
<text fill="#1565c0" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="105" y="220">"a dog barking"</text>
<rect fill="#bbdefb" height="50" rx="6" stroke="#1565c0" width="160" x="215" y="180"></rect>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="295" y="202">RoBERTa</text>
<text fill="#1565c0" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="295" y="220">text encoder g</text>
<rect fill="#f3e5f5" height="180" rx="8" stroke="#7b1fa2" stroke-width="1.5" width="180" x="430" y="50"></rect>
<text fill="#4a148c" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="520" y="78">Shared 512-d space</text>
<circle cx="475" cy="115" fill="#ff8a65" r="6"></circle>
<text fill="#bf360c" font-family="Consolas, monospace" font-size="11" x="485" y="119">f(a_i)</text>
<circle cx="478" cy="123" fill="#64b5f6" r="6"></circle>
<text fill="#0d47a1" font-family="Consolas, monospace" font-size="11" x="495" y="148">g(t_i)</text>
<circle cx="565" cy="180" fill="#ff8a65" r="6"></circle>
<text fill="#bf360c" font-family="Consolas, monospace" font-size="11" x="520" y="200">f(a_j)</text>
<circle cx="555" cy="195" fill="#64b5f6" r="6"></circle>
<text fill="#0d47a1" font-family="Consolas, monospace" font-size="11" x="520" y="215">g(t_k)</text>
<line stroke="#2e7d32" stroke-dasharray="3,2" stroke-width="1.5" x1="475" x2="478" y1="115" y2="123"></line>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="10" x="450" y="100">pull</text>
