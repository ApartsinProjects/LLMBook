<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Five regulatory tracks for finance LLMs and the deployment artifacts they demand" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="fig-73-3-1-title fig-73-3-1-desc">
<title id="fig-73-3-1-title">Five regulatory tracks for finance LLMs and the deployment artifacts they demand</title>
<desc id="fig-73-3-1-desc">Radial-style figure with five labelled tracks around an LLM deployment center. Each spoke points to a regulator-acronym (SR 11-7 / EU AI Act / FINRA 24-09 + SEC 34-97990 / DORA 2022/2554 + OCC 3rd-party / CFPB ECOA + CA SB 942) and the artifact it requires (model card / conformity assessment / prompt+output recordkeeping / exit plan / consumer disclosure).</desc>
<rect x="0" y="0" width="760" height="380" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">Five regulatory tracks every finance LLM deployment touches</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- center -->
<circle cx="380" cy="195" r="65" fill="#eaf1ff" stroke="#2c5fa0" stroke-width="2"/>
<text x="380" y="190" text-anchor="middle" font-weight="700" fill="#2c5fa0">Production</text>
<text x="380" y="208" text-anchor="middle" font-weight="700" fill="#2c5fa0">finance LLM</text>

<!-- 5 spokes -->
<line x1="380" y1="130" x2="380" y2="80" stroke="#5a6573" stroke-width="2"/>
<line x1="430" y1="160" x2="640" y2="100" stroke="#5a6573" stroke-width="2"/>
<line x1="430" y1="240" x2="650" y2="280" stroke="#5a6573" stroke-width="2"/>
<line x1="330" y1="240" x2="120" y2="290" stroke="#5a6573" stroke-width="2"/>
<line x1="330" y1="160" x2="110" y2="110" stroke="#5a6573" stroke-width="2"/>

<!-- track 1: SR 11-7 (top) -->
<rect x="290" y="40" width="180" height="50" fill="#eef5ec" stroke="#1f6f3a" rx="4"/>
<text x="380" y="58" text-anchor="middle" font-weight="700" fill="#1f6f3a">1. SR 11-7 (2011)</text>
<text x="380" y="76" text-anchor="middle" font-size="10">model card + indep. validation</text>

<!-- track 2: EU AI Act (upper-right) -->
<rect x="540" y="60" width="190" height="60" fill="#dfeaf5" stroke="#2c5fa0" rx="4"/>
<text x="635" y="78" text-anchor="middle" font-weight="700" fill="#2c5fa0">2. EU AI Act 2024/1689</text>
<text x="635" y="94" text-anchor="middle" font-size="10">Annex III high-risk</text>
<text x="635" y="108" text-anchor="middle" font-size="10">conformity assessment 9-18mo</text>

<!-- track 3: FINRA/SEC (lower-right) -->
<rect x="540" y="270" width="190" height="60" fill="#fff5d6" stroke="#b8860b" rx="4"/>
<text x="635" y="288" text-anchor="middle" font-weight="700" fill="#7a5a08">3. FINRA Notice 24-09</text>
<text x="635" y="302" text-anchor="middle" font-size="10">+ SEC 34-97990</text>
<text x="635" y="318" text-anchor="middle" font-size="10">prompt + output books &amp; records</text>

<!-- track 4: DORA (lower-left) -->
<rect x="20" y="270" width="190" height="60" fill="#ede4f7" stroke="#5a3d99" rx="4"/>
<text x="115" y="288" text-anchor="middle" font-weight="700" fill="#5a3d99">4. DORA + OCC 2023</text>
<text x="115" y="302" text-anchor="middle" font-size="10">EU Reg 2022/2554, Jan 2025</text>
<text x="115" y="318" text-anchor="middle" font-size="10">documented exit plan</text>

<!-- track 5: CFPB / state (upper-left) -->
<rect x="20" y="80" width="190" height="60" fill="#f1d6d0" stroke="#b2351e" rx="4"/>
<text x="115" y="98" text-anchor="middle" font-weight="700" fill="#b2351e">5. CFPB + CA SB 942</text>
<text x="115" y="112" text-anchor="middle" font-size="10">+ EU AI Act Art. 50</text>
<text x="115" y="128" text-anchor="middle" font-size="10">consumer-readable disclosure</text>

<!-- bottom note -->
<rect x="60" y="345" width="640" height="28" fill="#fafafe" stroke="#a8b9d4" rx="4"/>
<text x="380" y="363" text-anchor="middle" font-size="10" font-style="italic">"AI-specific rules, when they arrive, almost always codify existing practice rather than overturn it."</text>
</g>
</svg>