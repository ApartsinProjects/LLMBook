<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="WavLM utterance mixing: clean utterance A on top, noise overlay of utterance B starting at 1.0 second, mixed waveform on bottom, training target stays the clean cluster IDs of utterance A only." role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 760 280" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="280" width="760"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="380" y="22">WavLM utterance mixing: clean signal + interference, but predict clean targets only</text>
<defs>
<marker id="wlArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
</defs>
<g font-size="10">
<text fill="#0d47a1" font-size="11" font-weight="700" x="40" y="60">A (clean)</text>
<rect fill="#e3f2fd" height="32" rx="4" stroke="#1976d2" stroke-width="1.2" width="600" x="100" y="42"></rect>
<path d="M110,58 Q140,46 170,58 Q200,72 230,58 Q260,46 290,58 Q320,72 350,58 Q380,46 410,58 Q440,72 470,58 Q500,46 530,58 Q560,72 590,58 Q620,46 650,58 Q680,72 690,58" fill="none" stroke="#1976d2" stroke-width="1.4"></path>
<text fill="#b71c1c" font-size="11" font-weight="700" x="40" y="120">B (gain 0.7)</text>
<rect fill="#ffebee" height="32" rx="4" stroke="#c62828" stroke-width="1.2" width="400" x="300" y="102"></rect>
<path d="M310,118 Q330,108 350,118 Q370,128 390,118 Q410,108 430,118 Q450,128 470,118 Q490,108 510,118 Q530,128 550,118 Q570,108 590,118 Q610,128 630,118 Q650,108 670,118 Q685,128 690,118" fill="none" stroke="#c62828" stroke-width="1.2"></path>
<line stroke="#c62828" stroke-dasharray="3,3" stroke-width="0.8" x1="300" x2="300" y1="80" y2="135"></line>
<text fill="#c62828" font-size="9" text-anchor="middle" x="300" y="92">t = 1.0 s</text>
<text fill="#1b5e20" font-size="11" font-weight="700" x="40" y="180">x_mix</text>
<rect fill="#e8f5e9" height="36" rx="4" stroke="#2e7d32" stroke-width="1.2" width="600" x="100" y="162"></rect>
<path d="M110,180 Q140,170 170,180 Q200,190 230,180 Q260,170 290,180 Q310,164 330,184 Q350,196 370,180 Q390,166 410,184 Q430,196 450,180 Q470,166 490,184 Q510,196 530,180 Q550,166 570,184 Q590,196 610,180 Q630,166 650,184 Q670,196 690,180" fill="none" stroke="#2e7d32" stroke-width="1.4"></path>
<rect fill="#fff3e0" height="40" rx="6" stroke="#ef6c00" stroke-width="1.2" width="600" x="100" y="220"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="400" y="237">Masked-prediction target: k-means cluster IDs of clean A</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="400" y="252">(B's cluster IDs are never used; the model must learn implicit source separation)</text>
<line marker-end="url(#wlArr)" stroke="#666" stroke-width="2" x1="400" x2="400" y1="200" y2="218"></line>
</g>
</svg>