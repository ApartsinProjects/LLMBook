<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="DPR bi-encoder architecture: a question BERT encoder produces a query vector, a passage BERT encoder produces passage vectors, and the InfoNCE loss pulls matching pairs together while pushing in-batch negatives apart." role="img" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="dpr_grad_q" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3e0"></stop><stop offset="100%" stop-color="#ffe0b2"></stop></lineargradient>
<lineargradient id="dpr_grad_p" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e3f2fd"></stop><stop offset="100%" stop-color="#bbdefb"></stop></lineargradient>
</defs>
<rect fill="#fafafa" height="310" rx="10" stroke="#ddd" width="710" x="5" y="5"></rect>
<!-- Question side -->
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" x="40" y="35">Question</text>
<rect fill="#fff" height="35" rx="4" stroke="#999" width="220" x="30" y="45"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="140" y="68">"Who founded the Linux kernel?"</text>
<rect fill="url(#dpr_grad_q)" height="55" rx="6" stroke="#ef6c00" stroke-width="1.5" width="220" x="30" y="100"></rect>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="140" y="125">BERT_Q (question encoder)</text>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="140" y="143">CLS pooling, 768-d</text>
<rect fill="#fff" height="30" rx="4" stroke="#ef6c00" width="180" x="50" y="175"></rect>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="140" y="195">q ∈ R^768</text>
<!-- Passage side -->
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" x="470" y="35">Passage</text>
<rect fill="#fff" height="35" rx="4" stroke="#999" width="220" x="460" y="45"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="570" y="68">"Linus Torvalds wrote Linux ..."</text>
<rect fill="url(#dpr_grad_p)" height="55" rx="6" stroke="#1565c0" stroke-width="1.5" width="220" x="460" y="100"></rect>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="570" y="125">BERT_P (passage encoder)</text>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="570" y="143">CLS pooling, 768-d</text>
<rect fill="#fff" height="30" rx="4" stroke="#1565c0" width="180" x="480" y="175"></rect>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="570" y="195">p ∈ R^768</text>
<!-- Similarity -->
<rect fill="#f1f8e9" height="50" rx="8" stroke="#558b2f" stroke-width="1.5" width="240" x="240" y="235"></rect>
<text fill="#33691e" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="360" y="258">sim(q, p) = q · p</text>
<text fill="#33691e" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="360" y="275">InfoNCE: positive vs. in-batch negatives</text>
<line stroke="#999" stroke-dasharray="4,3" stroke-width="1.5" x1="140" x2="280" y1="210" y2="240"></line>
<line stroke="#999" stroke-dasharray="4,3" stroke-width="1.5" x1="570" x2="440" y1="210" y2="240"></line>
</svg>