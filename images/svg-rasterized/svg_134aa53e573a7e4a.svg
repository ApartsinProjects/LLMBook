<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Pretraining corpora and evaluation benchmarks: two halves of an LLM's empirical identity" viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="380" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Two halves of an LLM's empirical identity: corpora and benchmarks</text>
<g font-size="10">
<g transform="translate(30,55)">
<rect width="410" height="305" rx="8" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="205" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#3d4d8a">Pretraining corpora (petabyte scale)</text>
<text x="205" y="40" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">canonical open releases of 2024-26</text>
<g font-size="9">
<rect x="20" y="55" width="370" height="30" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="35" y="74" fill="#1a1a2e"><tspan font-weight="700">FineWeb</tspan> (HF) - 15T deduped Common Crawl</text>
<rect x="20" y="90" width="370" height="30" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="35" y="109" fill="#1a1a2e"><tspan font-weight="700">FineWeb-Edu</tspan> - 1.3T educational filter</text>
<rect x="20" y="125" width="370" height="30" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="35" y="144" fill="#1a1a2e"><tspan font-weight="700">Dolma</tspan> (AllenAI) - 3T, OLMo's corpus</text>
<rect x="20" y="160" width="370" height="30" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="35" y="179" fill="#1a1a2e"><tspan font-weight="700">RedPajama-V2</tspan> - 30T deduped web</text>
<rect x="20" y="195" width="370" height="30" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="35" y="214" fill="#1a1a2e"><tspan font-weight="700">The Stack v2</tspan> (BigCode) - 67 TB code</text>
<rect x="20" y="230" width="370" height="30" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="35" y="249" fill="#1a1a2e"><tspan font-weight="700">Nemotron-CC</tspan> (NVIDIA) - 6.3T filtered CC</text>
<rect x="20" y="265" width="370" height="30" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="35" y="284" fill="#1a1a2e"><tspan font-weight="700">SmolLM3 corpus / FineWeb 2</tspan> (multilingual)</text>
</g>
</g>
<g transform="translate(450,55)">
<rect width="400" height="305" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="200" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Evaluation benchmarks (megabyte scale)</text>
<text x="200" y="40" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">what gates every release</text>
<g font-size="9">
<rect x="20" y="55" width="360" height="30" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="35" y="74" fill="#1a1a2e"><tspan font-weight="700">MMLU</tspan> - 57-subj MCQ, saturated 2024</text>
<rect x="20" y="90" width="360" height="30" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="35" y="109" fill="#1a1a2e"><tspan font-weight="700">GPQA</tspan> - 448 graduate science Q's</text>
<rect x="20" y="125" width="360" height="30" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="35" y="144" fill="#1a1a2e"><tspan font-weight="700">Arena-Hard</tspan> - 500 prompts, LLM-judge</text>
<rect x="20" y="160" width="360" height="30" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="35" y="179" fill="#1a1a2e"><tspan font-weight="700">LM Arena</tspan> - blind pairwise human Elo</text>
<rect x="20" y="195" width="360" height="30" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="35" y="214" fill="#1a1a2e"><tspan font-weight="700">LiveCodeBench</tspan> - monthly-refreshed code</text>
<rect x="20" y="230" width="360" height="30" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="35" y="249" fill="#1a1a2e"><tspan font-weight="700">AIME / MATH-500 / GPQA-D</tspan> - reasoning</text>
<rect x="20" y="265" width="360" height="30" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="35" y="284" fill="#1a1a2e"><tspan font-weight="700">HLE / SimpleQA</tspan> - frontier &amp; hallucination</text>
</g>
</g>
</g>
</svg>