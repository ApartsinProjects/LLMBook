<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="OpenAI Preparedness Framework: risk-by-level grid with release-gating thresholds" viewBox="-17 -13 897 453" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="440" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">OpenAI Preparedness Framework: 4 axes &#x00D7; 4 levels, with release gates</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each cell = a system-card disclosure obligation, populated for o1 (Sep 2024) and successors</text>
<g transform="translate(120,80)">
<!-- column headers (levels) -->
<g font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">
<text x="100" y="-8">Low</text>
<text x="240" y="-8">Medium</text>
<text x="380" y="-8">High</text>
<text x="520" y="-8">Critical</text>
</g>
<!-- row labels (risks) -->
<g font-size="11" font-weight="700" fill="#1a1a2e" text-anchor="end">
<text x="-12" y="38">Cybersecurity</text>
<text x="-12" y="98">CBRN</text>
<text x="-12" y="158">Persuasion</text>
<text x="-12" y="218">Model autonomy</text>
</g>
<!-- 4x4 grid -->
<g>
<!-- Cyber row -->
<rect x="30" y="14" width="140" height="50" fill="#e9f4ec" stroke="#1f7a3a" stroke-width="1.5"/><text x="100" y="32" font-size="9" text-anchor="middle" fill="#1a1a2e">no novel uplift</text><text x="100" y="46" font-size="9" text-anchor="middle" fill="#1f7a3a" font-weight="700">deploy freely</text>
<rect x="170" y="14" width="140" height="50" fill="#e9f4ec" stroke="#1f7a3a" stroke-width="1.5"/><text x="240" y="32" font-size="9" text-anchor="middle" fill="#1a1a2e">CTF assist</text><text x="240" y="46" font-size="9" text-anchor="middle" fill="#1f7a3a" font-weight="700">deploy w/ guards</text>
<rect x="310" y="14" width="140" height="50" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/><text x="380" y="32" font-size="9" text-anchor="middle" fill="#1a1a2e">zero-day discovery</text><text x="380" y="46" font-size="9" text-anchor="middle" fill="#a67c1a" font-weight="700">extra mitigations</text>
<rect x="450" y="14" width="140" height="50" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="1.5"/><text x="520" y="32" font-size="9" text-anchor="middle" fill="#1a1a2e">autonomous exploitation</text><text x="520" y="46" font-size="9" text-anchor="middle" fill="#7a2a2a" font-weight="700">do not deploy</text>
<!-- CBRN row -->
<rect x="30" y="74" width="140" height="50" fill="#e9f4ec" stroke="#1f7a3a" stroke-width="1.5"/><text x="100" y="92" font-size="9" text-anchor="middle" fill="#1a1a2e">no novel uplift</text><text x="100" y="106" font-size="9" text-anchor="middle" fill="#1f7a3a" font-weight="700">deploy freely</text>
<rect x="170" y="74" width="140" height="50" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/><text x="240" y="92" font-size="9" text-anchor="middle" fill="#1a1a2e">expert uplift</text><text x="240" y="106" font-size="9" text-anchor="middle" fill="#a67c1a" font-weight="700">red-team + RSP-3</text>
<rect x="310" y="74" width="140" height="50" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="1.5"/><text x="380" y="92" font-size="9" text-anchor="middle" fill="#1a1a2e">novice uplift</text><text x="380" y="106" font-size="9" text-anchor="middle" fill="#7a2a2a" font-weight="700">restricted release</text>
<rect x="450" y="74" width="140" height="50" fill="#3a0f0f"/><text x="520" y="92" font-size="9" text-anchor="middle" fill="#ffffff">end-to-end weapon synthesis</text><text x="520" y="106" font-size="9" text-anchor="middle" fill="#ffffff" font-weight="700">do not deploy</text>
<!-- Persuasion -->
<rect x="30" y="134" width="140" height="50" fill="#e9f4ec" stroke="#1f7a3a" stroke-width="1.5"/><text x="100" y="152" font-size="9" text-anchor="middle" fill="#1a1a2e">no edge over baseline</text><text x="100" y="166" font-size="9" text-anchor="middle" fill="#1f7a3a" font-weight="700">deploy freely</text>
<rect x="170" y="134" width="140" height="50" fill="#e9f4ec" stroke="#1f7a3a" stroke-width="1.5"/><text x="240" y="152" font-size="9" text-anchor="middle" fill="#1a1a2e">copywriting parity</text><text x="240" y="166" font-size="9" text-anchor="middle" fill="#1f7a3a" font-weight="700">deploy w/ guards</text>
<rect x="310" y="134" width="140" height="50" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/><text x="380" y="152" font-size="9" text-anchor="middle" fill="#1a1a2e">A/B beats expert</text><text x="380" y="166" font-size="9" text-anchor="middle" fill="#a67c1a" font-weight="700">extra mitigations</text>
<rect x="450" y="134" width="140" height="50" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="1.5"/><text x="520" y="152" font-size="9" text-anchor="middle" fill="#1a1a2e">election-scale manipulation</text><text x="520" y="166" font-size="9" text-anchor="middle" fill="#7a2a2a" font-weight="700">do not deploy</text>
<!-- Autonomy -->
<rect x="30" y="194" width="140" height="50" fill="#e9f4ec" stroke="#1f7a3a" stroke-width="1.5"/><text x="100" y="212" font-size="9" text-anchor="middle" fill="#1a1a2e">single-step tools</text><text x="100" y="226" font-size="9" text-anchor="middle" fill="#1f7a3a" font-weight="700">deploy freely</text>
<rect x="170" y="194" width="140" height="50" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/><text x="240" y="212" font-size="9" text-anchor="middle" fill="#1a1a2e">SWE-Bench task chain</text><text x="240" y="226" font-size="9" text-anchor="middle" fill="#a67c1a" font-weight="700">METR / Apollo eval</text>
<rect x="310" y="194" width="140" height="50" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="1.5"/><text x="380" y="212" font-size="9" text-anchor="middle" fill="#1a1a2e">self-improvement loops</text><text x="380" y="226" font-size="9" text-anchor="middle" fill="#7a2a2a" font-weight="700">restricted release</text>
<rect x="450" y="194" width="140" height="50" fill="#3a0f0f"/><text x="520" y="212" font-size="9" text-anchor="middle" fill="#ffffff">self-exfiltration capable</text><text x="520" y="226" font-size="9" text-anchor="middle" fill="#ffffff" font-weight="700">do not deploy</text>
</g>
<!-- o1 marker -->
<g transform="translate(170,74)">
<rect x="0" y="0" width="140" height="50" fill="none" stroke="#1a4078" stroke-width="3" stroke-dasharray="6,3"/>
</g>
<text x="240" y="68" font-size="10" font-weight="700" text-anchor="middle" fill="#1a4078">o1 CBRN: "Medium"</text>
<!-- legend -->
<g transform="translate(0,280)" font-size="10" fill="#1a1a2e">
<rect x="0" y="0" width="14" height="14" fill="#e9f4ec" stroke="#1f7a3a"/><text x="20" y="11">Low / Medium: card discloses, deploy possible</text>
<rect x="290" y="0" width="14" height="14" fill="#fef3e0" stroke="#a67c1a"/><text x="310" y="11">High: card + safeguards required</text>
<rect x="0" y="22" width="14" height="14" fill="#f8e3e3" stroke="#7a2a2a"/><text x="20" y="33">Critical: card admits non-deployment</text>
<rect x="290" y="22" width="14" height="14" fill="none" stroke="#1a4078" stroke-width="2.5" stroke-dasharray="3,2"/><text x="310" y="33">o1 system card classification (Sep 2024)</text>
</g>
</g>
</svg>