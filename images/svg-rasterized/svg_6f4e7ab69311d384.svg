<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: Real-Time Voice AI Pipelines" role="img" viewBox="0 -9 760 359" xmlns="http://www.w3.org/2000/svg">
<!-- User -->
<circle cx="60" cy="100" fill="#3498db" r="30" stroke="none"></circle>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="18" text-anchor="middle" x="60" y="96">🎤</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="60" y="150">User Speaks</text>
<!-- Arrow -->
<line marker-end="url(#voiceArrow)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="90" x2="140" y1="100" y2="100"></line>
<!-- STT -->
<rect fill="url(#grad_1e0cfd_e8f4fd)" filter="url(#shadow_1e0cfd)" height="60" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="120" x="145" y="70"></rect>
<text fill="#2980b9" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="205" y="95">STT</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="205" y="112">Deepgram / Whisper</text>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="205.0" x2="205.0" y1="147.0" y2="132.0"></line>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="205" y="160">~200ms</text>
<!-- Arrow -->
<line marker-end="url(#voiceArrow)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="265" x2="315" y1="100" y2="100"></line>
<text fill="#666" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="290" y="90">text</text>
<!-- LLM -->
<rect fill="#f5eef8" height="60" rx="10" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="120" x="320" y="70"></rect>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="380" y="95">LLM</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="380" y="112">GPT-4o / Claude</text>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="380.0" x2="380.0" y1="147.0" y2="132.0"></line>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="380" y="160">~300ms (TTFT)</text>
<!-- Arrow -->
<line marker-end="url(#voiceArrow)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="440" x2="490" y1="100" y2="100"></line>
<text fill="#666" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="465" y="90">text stream</text>
<!-- TTS -->
<rect fill="#e8f5e9" height="60" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="120" x="495" y="70"></rect>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="555" y="95">TTS</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="555" y="112">Cartesia / ElevenLabs</text>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="555.0" x2="555.0" y1="147.0" y2="132.0"></line>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="555" y="160">~100ms (TTFB)</text>
<!-- Arrow -->
<line marker-end="url(#voiceArrow)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="615" x2="665" y1="100" y2="100"></line>
<text fill="#666" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="640" y="90">audio</text>
<!-- Speaker -->
<circle cx="700" cy="100" fill="#e74c3c" r="30" stroke="none"></circle>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="18" text-anchor="middle" x="700" y="96">🔊</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="700" y="150">Audio Plays</text>
<!-- Total latency bar -->
<rect fill="url(#grad_1e0cfd_fef9e7)" height="30" rx="6" stroke="#f39c12" stroke-linecap="round" stroke-width="1.5" width="570" x="145" y="185"></rect>
<text fill="#e67e22" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="430" y="205">Total Round-Trip: ~600ms (streaming) to ~2s (batch)</text>
<!-- Orchestration layer -->
<rect fill="#1a1a2e" height="50" rx="10" stroke="none" width="570" x="145" y="235"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="430" y="255">Orchestration Layer</text>
<text fill="#aaa" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="430" y="275">LiveKit Agents / Pipecat / Vapi / Custom WebSocket</text>
<!-- Features below -->
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="200" y="310">VAD (Voice Activity</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="200" y="322">Detection)</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="310">Turn-Taking</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="322">Management</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="500" y="310">Interruption</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="500" y="322">Handling</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="650" y="310">WebRTC</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="650" y="322">Transport</text>
<defs>
<lineargradient id="grad_1e0cfd_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_1e0cfd_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_1e0cfd" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="voiceArrow" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#333" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
</svg>