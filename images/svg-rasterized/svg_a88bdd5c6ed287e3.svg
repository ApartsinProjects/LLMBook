<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three chunking strategies compared side by side: fixed-window splits at uniform intervals across structure, semantic chunking uses embedding similarity to detect topic boundaries, and structure-aware splitting respects section headers and treats tables atomically" role="img" style="max-width:100%;height:auto;" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter height="108%" id="ch354shadow" width="108%" x="-4%" y="-4%">
<fedropshadow dx="1" dy="2" flood-opacity="0.18" stddeviation="1.5"></fedropshadow>
</filter>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="380" y="22">Three chunking strategies on the same document</text>
<text fill="#4a5568" font-size="11" text-anchor="middle" x="380" y="40">Yellow boxes mark chunk boundaries; gray rows are section headers; T marks a table.</text>
<g transform="translate(20, 60)">
<rect fill="#fff8e1" filter="url(#ch354shadow)" height="270" rx="6" stroke="#d97706" stroke-width="1.5" width="220" x="0" y="0"></rect>
<rect fill="#d97706" height="22" rx="6" width="220" x="0" y="0"></rect>
<text fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" x="110" y="16">Fixed-window</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="110" y="38">512-token windows, 64 overlap</text>
<rect fill="#e2e8f0" height="22" rx="3" stroke="#94a3b8" width="192" x="14" y="50"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="66">Section A heading</text>
<rect fill="#fff" height="36" rx="3" stroke="#d97706" stroke-dasharray="4,2" width="192" x="14" y="76"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="98">Chunk 1 (512 tokens)</text>
<rect fill="#fff" height="36" rx="3" stroke="#d97706" stroke-dasharray="4,2" width="192" x="14" y="116"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="138">Chunk 2 (boundary mid-table)</text>
<rect fill="#fee2e2" height="14" stroke="#b91c1c" width="20" x="50" y="142"></rect>
<text fill="#b91c1c" font-size="9" font-weight="700" text-anchor="middle" x="60" y="153">T</text>
<rect fill="#fff" height="36" rx="3" stroke="#d97706" stroke-dasharray="4,2" width="192" x="14" y="156"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="178">Chunk 3 (cross-section)</text>
<rect fill="#e2e8f0" height="22" rx="3" stroke="#94a3b8" width="192" x="14" y="196"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="212">Section B heading</text>
<rect fill="#fff" height="36" rx="3" stroke="#d97706" stroke-dasharray="4,2" width="192" x="14" y="222"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="244">Chunk 4 (split paragraph)</text>
</g>
<g transform="translate(270, 60)">
<rect fill="#e8f5e9" filter="url(#ch354shadow)" height="270" rx="6" stroke="#047857" stroke-width="1.5" width="220" x="0" y="0"></rect>
<rect fill="#047857" height="22" rx="6" width="220" x="0" y="0"></rect>
<text fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" x="110" y="16">Semantic</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="110" y="38">Cuts where cosine similarity drops</text>
<rect fill="#e2e8f0" height="22" rx="3" stroke="#94a3b8" width="192" x="14" y="50"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="66">Section A heading</text>
<rect fill="#fff" height="50" rx="3" stroke="#047857" stroke-dasharray="4,2" width="192" x="14" y="76"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="105">Chunk 1 (topic: setup)</text>
<rect fill="#fff" height="44" rx="3" stroke="#047857" stroke-dasharray="4,2" width="192" x="14" y="130"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="156">Chunk 2 (topic: results)</text>
<rect fill="#fee2e2" height="14" stroke="#b91c1c" width="20" x="50" y="160"></rect>
<text fill="#b91c1c" font-size="9" font-weight="700" text-anchor="middle" x="60" y="171">T</text>
<rect fill="#e2e8f0" height="20" rx="3" stroke="#94a3b8" width="192" x="14" y="178"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="192">Section B heading</text>
<rect fill="#fff" height="56" rx="3" stroke="#047857" stroke-dasharray="4,2" width="192" x="14" y="202"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="235">Chunk 3 (variable length)</text>
</g>
<g transform="translate(520, 60)">
<rect fill="#e3f2fd" filter="url(#ch354shadow)" height="270" rx="6" stroke="#3a73a8" stroke-width="1.5" width="220" x="0" y="0"></rect>
<rect fill="#3a73a8" height="22" rx="6" width="220" x="0" y="0"></rect>
<text fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" x="110" y="16">Structure-aware</text>
<text fill="#1a4078" font-size="10" text-anchor="middle" x="110" y="38">Section headers, tables atomic</text>
<rect fill="#e2e8f0" height="22" rx="3" stroke="#94a3b8" width="192" x="14" y="50"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="66">Section A heading</text>
<rect fill="#fff" height="44" rx="3" stroke="#3a73a8" stroke-dasharray="4,2" width="192" x="14" y="76"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="102">Chunk 1 (entire Section A)</text>
<rect fill="#fff" height="32" rx="3" stroke="#b91c1c" stroke-width="2" width="192" x="14" y="124"></rect>
<text fill="#b91c1c" font-size="10" font-weight="700" text-anchor="middle" x="110" y="138">Chunk 2: Table T (atomic)</text>
<rect fill="#fee2e2" height="10" stroke="#b91c1c" width="36" x="92" y="142"></rect>
<rect fill="#e2e8f0" height="22" rx="3" stroke="#94a3b8" width="192" x="14" y="160"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="176">Section B heading</text>
<rect fill="#fff" height="32" rx="3" stroke="#3a73a8" stroke-dasharray="4,2" width="192" x="14" y="186"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="206">Chunk 3 (Section B part 1)</text>
<rect fill="#fff" height="32" rx="3" stroke="#3a73a8" stroke-dasharray="4,2" width="192" x="14" y="222"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="110" y="242">Chunk 4 (Section B part 2)</text>
</g>
</g>
</svg>