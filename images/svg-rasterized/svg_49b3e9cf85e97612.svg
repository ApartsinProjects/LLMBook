<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Three-tier 2026 LLM API platform map with named vendors" viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="380" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">2026 LLM API platform shelf: three tiers, three decisive dimensions</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Always route through an abstraction layer (LiteLLM, OpenRouter)</text>
<g font-size="10">
<g transform="translate(30,60)">
<rect width="270" height="290" rx="8" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="135" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#3d4d8a">Tier 1: First-party providers</text>
<text x="135" y="40" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">model quality + feature freshness</text>
<g font-size="9">
<rect x="20" y="55" width="230" height="46" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="135" y="73" text-anchor="middle" font-weight="700" fill="#1a1a2e">OpenAI</text>
<text x="135" y="88" font-size="9" text-anchor="middle" fill="#5a4a3a">GPT-5, o3 / o4-mini, Assistants</text>
<rect x="20" y="106" width="230" height="46" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="135" y="124" text-anchor="middle" font-weight="700" fill="#1a1a2e">Anthropic</text>
<text x="135" y="139" font-size="9" text-anchor="middle" fill="#5a4a3a">Claude 4.5 family, 1M ctx, 90% cache</text>
<rect x="20" y="157" width="230" height="46" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="135" y="175" text-anchor="middle" font-weight="700" fill="#1a1a2e">Google AI Studio / Vertex</text>
<text x="135" y="190" font-size="9" text-anchor="middle" fill="#5a4a3a">Gemini 2.5 Pro, 2M ctx, multimodal</text>
<rect x="20" y="208" width="230" height="40" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="135" y="225" text-anchor="middle" font-weight="700" fill="#1a1a2e">xAI</text>
<text x="135" y="240" font-size="9" text-anchor="middle" fill="#5a4a3a">Grok 4, real-time web</text>
</g>
<text x="135" y="270" font-size="10" font-weight="700" text-anchor="middle" fill="#3d4d8a">Latency P50: 400-1000 ms</text>
</g>
<g transform="translate(310,60)">
<rect width="270" height="290" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="135" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Tier 2: Hyperscaler resellers</text>
<text x="135" y="40" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">compliance + integration</text>
<g font-size="9">
<rect x="20" y="55" width="230" height="58" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="135" y="73" text-anchor="middle" font-weight="700" fill="#1a1a2e">AWS Bedrock</text>
<text x="135" y="88" font-size="9" text-anchor="middle" fill="#5a4a3a">multi-vendor marketplace</text>
<text x="135" y="102" font-size="9" text-anchor="middle" fill="#5a4a3a">VPC, IAM, FedRAMP, 10-20% markup</text>
<rect x="20" y="118" width="230" height="58" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="135" y="136" text-anchor="middle" font-weight="700" fill="#1a1a2e">Azure OpenAI</text>
<text x="135" y="151" font-size="9" text-anchor="middle" fill="#5a4a3a">OpenAI catalog in Azure</text>
<text x="135" y="165" font-size="9" text-anchor="middle" fill="#5a4a3a">PTU pricing, private endpoints</text>
</g>
<text x="135" y="200" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">+50-150 ms vs direct provider</text>
<text x="135" y="240" font-size="10" font-weight="700" text-anchor="middle" fill="#a67c1a">Pick when:</text>
<text x="135" y="256" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">SOC2 / HIPAA / FedRAMP</text>
<text x="135" y="270" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">non-negotiable</text>
</g>
<g transform="translate(590,60)">
<rect width="260" height="290" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="130" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Tier 3: Open-weights hosts</text>
<text x="130" y="40" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">open access + unit cost</text>
<g font-size="9">
<rect x="15" y="55" width="230" height="46" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="130" y="73" text-anchor="middle" font-weight="700" fill="#1a1a2e">Together AI</text>
<text x="130" y="88" font-size="9" text-anchor="middle" fill="#5a4a3a">100s of open weights, $0.20-$1.20/M</text>
<rect x="15" y="106" width="230" height="46" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="130" y="124" text-anchor="middle" font-weight="700" fill="#1a1a2e">Fireworks AI</text>
<text x="130" y="139" font-size="9" text-anchor="middle" fill="#5a4a3a">P50 150-300 ms (industry-leading)</text>
<rect x="15" y="157" width="230" height="46" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="130" y="175" text-anchor="middle" font-weight="700" fill="#1a1a2e">Replicate</text>
<text x="130" y="190" font-size="9" text-anchor="middle" fill="#5a4a3a">LLM + image + audio + video</text>
<rect x="15" y="208" width="230" height="40" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="130" y="225" text-anchor="middle" font-weight="700" fill="#1a1a2e">Local: LM Studio / Ollama</text>
<text x="130" y="240" font-size="9" text-anchor="middle" fill="#5a4a3a">dev fallback path</text>
</g>
<text x="130" y="270" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">Cheapest path for high volume</text>
</g>
</g>
</svg>