<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Guardrail pipeline: user input passes input rails (injection, PII, topic control) before reaching the LLM; LLM output passes output rails (toxicity, facts, hallucination) before the safe response; each rail can block, refuse, redact, or retry." role="img" style="font-family: sans-serif;" viewBox="0 0 750 200" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<marker id="arrow" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#888" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<filter height="115%" id="shadow2" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<rect fill="#e8f4fd" filter="url(#shadow2)" height="50" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="100" x="10" y="70"></rect>
<text fill="#333" font-size="12" font-weight="600" text-anchor="middle" x="60" y="100">User Input</text>
<line marker-end="url(#arrow)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="110" x2="145" y1="95" y2="95"></line>
<rect fill="#fce4ec" filter="url(#shadow2)" height="70" rx="8" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="120" x="145" y="60"></rect>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="205" y="88">Input Rails</text>
<text fill="#666" font-size="11" text-anchor="middle" x="205" y="108">Injection, PII,</text>
<text fill="#666" font-size="11" text-anchor="middle" x="205" y="120">topic control</text>
<line marker-end="url(#arrow)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="265" x2="300" y1="95" y2="95"></line>
<rect fill="#f0e6ff" filter="url(#shadow2)" height="70" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="120" x="300" y="60"></rect>
<text fill="#8e44ad" font-size="11" font-weight="600" text-anchor="middle" x="360" y="88">LLM</text>
<text fill="#666" font-size="11" text-anchor="middle" x="360" y="108">Generation</text>
<line marker-end="url(#arrow)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="420" x2="455" y1="95" y2="95"></line>
<rect fill="#fce4ec" filter="url(#shadow2)" height="70" rx="8" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="120" x="455" y="60"></rect>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="515" y="88">Output Rails</text>
<text fill="#666" font-size="11" text-anchor="middle" x="515" y="108">Toxicity, facts,</text>
<text fill="#666" font-size="11" text-anchor="middle" x="515" y="120">hallucination</text>
<line marker-end="url(#arrow)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="575" x2="610" y1="95" y2="95"></line>
<rect fill="#e8f5e9" filter="url(#shadow2)" height="50" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="120" x="610" y="70"></rect>
<text fill="#333" font-size="12" font-weight="600" text-anchor="middle" x="670" y="100">Safe Response</text>
<!-- Blocked paths -->
<line stroke="#e94560" stroke-dasharray="4" stroke-linecap="round" stroke-width="2" x1="205" x2="205" y1="130" y2="165"></line>
<text fill="#e94560" font-size="11" text-anchor="middle" x="205" y="180">Block / Refusal</text>
<line stroke="#e94560" stroke-dasharray="4" stroke-linecap="round" stroke-width="2" x1="515" x2="515" y1="130" y2="165"></line>
<text fill="#e94560" font-size="11" text-anchor="middle" x="515" y="180">Redact / Retry</text>
</svg>