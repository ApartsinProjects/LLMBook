<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: 1.3 Step-Back Prompting" font-family="Segoe UI, system-ui, sans-serif" role="img" viewbox="0 -10 760 350" xmlns="http://www.w3.org/2000/svg">
<!-- Original Query -->
<rect fill="url(#grad_24b225_e3f2fd)" filter="url(#shadow_24b225)" height="40" rx="8" stroke="#1565c0" stroke-linecap="round" stroke-width="2" width="220" x="270" y="45"></rect>
<text fill="#0d47a1" font-size="12" font-weight="bold" text-anchor="middle" x="380" y="70">Original Query</text>
<!-- Arrows -->
<line marker-end="url(#aqt)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="320" x2="130" y1="85" y2="125"></line>
<line marker-end="url(#aqt)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="380" x2="380" y1="85" y2="125"></line>
<line marker-end="url(#aqt)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="440" x2="630" y1="85" y2="125"></line>
<!-- HyDE -->
<rect fill="url(#grad_24b225_fff3e0)" height="90" rx="8" stroke="#e65100" stroke-linecap="round" stroke-width="1.5" width="200" x="30" y="125"></rect>
<text fill="#e65100" font-size="12" font-weight="bold" text-anchor="middle" x="130" y="148">HyDE</text>
<text fill="#555" font-size="11" text-anchor="middle" x="130" y="168">LLM generates a</text>
<text fill="#555" font-size="11" text-anchor="middle" x="130" y="183">hypothetical answer;</text>
<text fill="#555" font-size="11" text-anchor="middle" x="130" y="198">embed that instead</text>
<!-- Multi-Query -->
<rect fill="#e8f5e9" height="90" rx="8" stroke="#2e7d32" stroke-linecap="round" stroke-width="1.5" width="200" x="280" y="125"></rect>
<text fill="#2e7d32" font-size="12" font-weight="bold" text-anchor="middle" x="380" y="148">Multi-Query</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="168">Generate N rephrasings;</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="183">retrieve for each;</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="198">merge result sets</text>
<!-- Step-Back -->
<rect fill="url(#grad_24b225_f3e5f5)" height="90" rx="8" stroke="#7b1fa2" stroke-linecap="round" stroke-width="1.5" width="200" x="530" y="125"></rect>
<text fill="#7b1fa2" font-size="12" font-weight="bold" text-anchor="middle" x="630" y="148">Step-Back</text>
<text fill="#555" font-size="11" text-anchor="middle" x="630" y="168">Abstract to a broader</text>
<text fill="#555" font-size="11" text-anchor="middle" x="630" y="183">question; retrieve</text>
<text fill="#555" font-size="11" text-anchor="middle" x="630" y="198">background context</text>
<!-- Converge arrows -->
<line marker-end="url(#aqt)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="130" x2="320" y1="215" y2="265"></line>
<line marker-end="url(#aqt)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="380" x2="380" y1="215" y2="265"></line>
<line marker-end="url(#aqt)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="630" x2="440" y1="215" y2="265"></line>
<!-- Better Retrieval -->
<rect fill="url(#grad_24b225_e8eaf6)" height="45" rx="8" stroke="#283593" stroke-linecap="round" stroke-width="2" width="220" x="270" y="265"></rect>
<text fill="#283593" font-size="12" font-weight="bold" text-anchor="middle" x="380" y="285">Improved Retrieval</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="300">Higher recall and precision</text>
<defs>
<lineargradient id="grad_24b225_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#e3f2fd"></stop></lineargradient>
<lineargradient id="grad_24b225_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#f3e5f5"></stop></lineargradient>
<lineargradient id="grad_24b225_e8eaf6" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7f9ff"></stop><stop offset="100%" stop-color="#e8eaf6"></stop></lineargradient>
<lineargradient id="grad_24b225_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<filter height="115%" id="shadow_24b225" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="aqt" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10">
