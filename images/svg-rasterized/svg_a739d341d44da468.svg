<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The EU AI Act classifies AI systems into four risk tiers with escalating compliance requirements." role="img" style="font-family: sans-serif;" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad3" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow1" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<!-- Pyramid layers -->
<polygon fill="#1a1a2e" filter="url(#shadow1)" points="300,20 180,100 420,100" stroke="#1a1a2e" stroke-linecap="round"></polygon>
<text fill="white" font-size="13" font-weight="700" text-anchor="middle" x="300" y="62">Prohibited</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="300" y="80">Social scoring, manipulation</text>
<polygon fill="#e94560" filter="url(#shadow1)" points="180,105 120,185 480,185 420,105" stroke="#e94560" stroke-linecap="round"></polygon>
<text fill="white" font-size="13" font-weight="700" text-anchor="middle" x="300" y="138">High Risk</text>
<text fill="#fff" font-size="11" text-anchor="middle" x="300" y="158">Employment, credit, education, law enforcement</text>
<text fill="#fff" font-size="11" text-anchor="middle" x="300" y="175">Conformity assessment, logging, human oversight</text>
<polygon fill="#ff9800" filter="url(#shadow1)" points="120,190 60,270 540,270 480,190" stroke="#ff9800" stroke-linecap="round"></polygon>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="300.0" x2="300.0" y1="224.0" y2="276.0"></line>
<text fill="white" font-size="13" font-weight="700" text-anchor="middle" x="300" y="222">Limited Risk</text>
<text fill="#fff" font-size="11" text-anchor="middle" x="300" y="242">Chatbots, deepfakes, emotion recognition</text>
<text fill="#fff" font-size="11" text-anchor="middle" x="300" y="258">Transparency obligations only</text>
<rect fill="#e8f5e9" height="35" rx="6" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="540" x="30" y="278"></rect>
<text fill="#27ae60" font-size="13" font-weight="700" text-anchor="middle" x="300" y="300">Minimal Risk (no specific obligations)</text>
</svg>