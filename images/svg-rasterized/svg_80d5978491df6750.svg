<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="A 2x2 quadrant placing vector platforms by deployment model (managed vs self-hosted) and search style (vector-only vs hybrid lexical-plus-vector)" role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewbox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="340" y="24">The 2026 vector platform landscape</text>
<line stroke="#4a5568" stroke-width="1.5" x1="340" x2="340" y1="60" y2="410"></line>
<line stroke="#4a5568" stroke-width="1.5" x1="60" x2="620" y1="235" y2="235"></line>
<text fill="#4a5568" font-size="11" font-weight="600" text-anchor="middle" x="340" y="430">Deployment</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="170" y="448">Managed / serverless</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="500" y="448">Self-hosted</text>
<text fill="#4a5568" font-size="11" font-weight="600" text-anchor="middle" transform="rotate(-90 20 235)" x="20" y="235">Search style</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" transform="rotate(-90 48 148)" x="48" y="148">Hybrid (lex + vec)</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" transform="rotate(-90 48 320)" x="48" y="320">Vector-first</text>
<g transform="translate(75,75)">
<rect fill="#dbeafe" height="150" opacity="0.3" rx="6" width="260"></rect>
<text fill="#3a73a8" font-size="11" font-weight="600" text-anchor="middle" x="130" y="22">Managed hybrid</text>
<g fill="#2d3748" font-size="10">
<text x="20" y="45">Weaviate Cloud</text>
<text x="20" y="62">Elasticsearch / OpenSearch</text>
<text x="20" y="79">Azure AI Search</text>
<text x="20" y="96">Vespa Cloud</text>
<text x="20" y="113">MongoDB Atlas Vector</text>
</g>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="130" y="138">when BM25 + vectors matter</text>
</g>
<g transform="translate(345,75)">
<rect fill="#d1fae5" height="150" opacity="0.3" rx="6" width="260"></rect>
<text fill="#047857" font-size="11" font-weight="600" text-anchor="middle" x="130" y="22">Self-hosted hybrid</text>
<g fill="#2d3748" font-size="10">
<text x="20" y="45">Weaviate OSS</text>
<text x="20" y="62">Elasticsearch OSS</text>
<text x="20" y="79">Vespa</text>
<text x="20" y="96">Marqo</text>
</g>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="130" y="138">control + hybrid, ops effort</text>
</g>
<g transform="translate(75,245)">
<rect fill="#fef3c7" height="160" opacity="0.3" rx="6" width="260"></rect>
<text fill="#d97706" font-size="11" font-weight="600" text-anchor="middle" x="130" y="22">Managed vector-first</text>
<g fill="#2d3748" font-size="10">
<text x="20" y="45">Pinecone Serverless</text>
<text x="20" y="62">Turbopuffer</text>
<text x="20" y="79">Qdrant Cloud</text>
<text x="20" y="96">Zilliz Cloud</text>
</g>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="130" y="148">fast time-to-ship, vendor lock-in</text>
</g>
<g transform="translate(345,245)">
<rect fill="#fce7f3" height="160" opacity="0.3" rx="6" width="260"></rect>
<text fill="#be185d" font-size="11" font-weight="600" text-anchor="middle" x="130" y="22">Self-hosted vector-first</text>
<g fill="#2d3748" font-size="10">
<text x="20" y="45">Milvus</text>
<text x="20" y="62">Qdrant OSS</text>
<text x="20" y="79">pgvector (Postgres)</text>
<text x="20" y="96">Chroma / LanceDB</text>
<text x="20" y="113">FAISS (library)</text>
<text x="20" y="130">Vald</text>
</g>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="130" y="148">control, residency, scale</text>
</g>
</svg>