<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="RRF fuses two ranked lists: a dense retriever returns docs A, B, C, D, E in that order and a sparse retriever returns C, F, A, G, B. Each document receives a score equal to the sum of 1/(k+rank) across lists, and the union list is re-sorted by fused score." role="img" viewbox="0 0 760 280" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="270" rx="10" stroke="#ddd" width="750" x="5" y="5"></rect>
<!-- Dense retriever -->
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" x="40" y="35">Dense (BM25 dense)</text>
<g fill="#e3f2fd" stroke="#1565c0">
<rect height="28" rx="4" width="120" x="40" y="50"></rect>
<rect height="28" rx="4" width="120" x="40" y="82"></rect>
<rect height="28" rx="4" width="120" x="40" y="114"></rect>
<rect height="28" rx="4" width="120" x="40" y="146"></rect>
<rect height="28" rx="4" width="120" x="40" y="178"></rect>
</g>
<g fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle">
<text x="100" y="69">1. doc A</text>
<text x="100" y="101">2. doc B</text>
<text x="100" y="133">3. doc C</text>
<text x="100" y="165">4. doc D</text>
<text x="100" y="197">5. doc E</text>
</g>
<!-- Sparse retriever -->
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" x="200" y="35">Sparse (BM25)</text>
<g fill="#fff3e0" stroke="#ef6c00">
<rect height="28" rx="4" width="120" x="200" y="50"></rect>
<rect height="28" rx="4" width="120" x="200" y="82"></rect>
<rect height="28" rx="4" width="120" x="200" y="114"></rect>
<rect height="28" rx="4" width="120" x="200" y="146"></rect>
<rect height="28" rx="4" width="120" x="200" y="178"></rect>
</g>
<g fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle">
<text x="260" y="69">1. doc C</text>
<text x="260" y="101">2. doc F</text>
<text x="260" y="133">3. doc A</text>
<text x="260" y="165">4. doc G</text>
<text x="260" y="197">5. doc B</text>
</g>
<!-- RRF arrow -->
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" x="345" y="125">RRF</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="335" y="145">k = 60</text>
<line marker-end="url(#rrf_arrow)" stroke="#555" stroke-width="2" x1="400" x2="445" y1="125" y2="125"></line>
<defs>
<marker id="rrf_arrow" markerheight="7" markerwidth="10" orient="auto" refx="9" refy="3.5">
<polygon fill="#555" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<!-- Fused -->
<text fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" x="450" y="35">Fused ranking</text>
<g fill="#e8f5e9" stroke="#2e7d32">
<rect height="28" rx="4" width="280" x="450" y="50"></rect>
<rect height="28" rx="4" width="280" x="450" y="82"></rect>
<rect height="28" rx="4" width="280" x="450" y="114"></rect>
<rect height="28" rx="4" width="280" x="450" y="146"></rect>
<rect height="28" rx="4" width="280" x="450" y="178"></rect>
</g>
<g fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle">
<text x="590" y="69">doc A: 1/61 + 1/63 ≈ 0.0323</text>
<text x="590" y="101">doc C: 1/63 + 1/61 ≈ 0.0323</text>
<text x="590" y="133">doc B: 1/62 + 1/65 ≈ 0.0316</text>
<text x="590" y="165">doc F: 1/62 ≈ 0.0161</text>
<text x="590" y="197">doc D: 1/64 ≈ 0.0156</text>
</g>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="380" y="240">Score is rank-based, so dense (cosine) and sparse (BM25) score scales do not need normalization.</text>
</svg>