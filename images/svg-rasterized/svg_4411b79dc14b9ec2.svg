<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Shallow versus deep safety alignment: shallow alignment adds a thin removable safety layer on top of unchanged core knowledge and capabilities; deep alignment (the research goal) interleaves safety throughout the model and is robust to fine-tuning attacks." font-family="Segoe UI, system-ui, sans-serif" role="img" viewbox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_6d64a4_e0e0e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#efefef"></stop><stop offset="100%" stop-color="#e0e0e0"></stop></lineargradient>
<lineargradient id="grad_6d64a4_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_6d64a4_ffccbc" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffdbcb"></stop><stop offset="100%" stop-color="#ffccbc"></stop></lineargradient>
<lineargradient id="grad_6d64a4_c8e6c9" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d7f5d8"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
<filter height="115%" id="shadow_6d64a4" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<!-- Shallow -->
<rect fill="url(#grad_6d64a4_fef9e7)" filter="url(#shadow_6d64a4)" height="180" rx="10" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="300" x="30" y="20"></rect>
<text fill="#e65100" font-size="14" font-weight="bold" text-anchor="middle" x="180" y="45">Shallow Alignment</text>
<rect fill="url(#grad_6d64a4_ffccbc)" height="30" rx="4" stroke="#e64a19" stroke-linecap="round" stroke-width="1" width="250" x="55" y="60"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="180" y="80">Safety layer (thin, removable)</text>
<rect fill="url(#grad_6d64a4_e0e0e0)" height="80" rx="4" stroke="#666" stroke-linecap="round" stroke-width="1" width="250" x="55" y="95"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="180" y="130">Core knowledge + capabilities</text>
<text fill="#666" font-size="11" text-anchor="middle" x="180" y="150">(unchanged by alignment)</text>
<!-- Deep -->
<rect fill="#e8f5e9" height="180" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="300" x="380" y="20"></rect>
<rect fill="url(#grad_6d64a4_c8e6c9)" height="110" rx="4" stroke="#27ae60" stroke-linecap="round" stroke-width="1" width="250" x="405" y="60"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="530" y="100">Safety integrated throughout</text>
<text fill="#333" font-size="11" text-anchor="middle" x="530" y="120">knowledge + capabilities</text>
<text fill="#666" font-size="11" text-anchor="middle" x="530" y="140">(robust to fine-tuning attacks)</text>
</svg>