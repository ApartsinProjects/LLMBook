<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 340" role="img" aria-label="Four multi-agent topology patterns side by side: hierarchical, peer debate, pipeline, and competitive best-of-N" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<defs>
<marker id="arrow-topo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
</marker>
</defs>
<text x="360" y="22" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">Four multi-agent topologies in production</text>

<g transform="translate(20,55)">
<rect width="160" height="240" rx="8" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="80" y="22" font-size="12" font-weight="600" fill="#3a73a8" text-anchor="middle">1. Hierarchical</text>
<rect x="55" y="40" width="50" height="26" rx="4" fill="#bee3f8" stroke="#3a73a8"/>
<text x="80" y="56" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">Manager</text>
<rect x="15" y="95" width="40" height="22" rx="3" fill="#fff" stroke="#3a73a8"/>
<text x="35" y="109" font-size="9" fill="#2d3748" text-anchor="middle">W1</text>
<rect x="60" y="95" width="40" height="22" rx="3" fill="#fff" stroke="#3a73a8"/>
<text x="80" y="109" font-size="9" fill="#2d3748" text-anchor="middle">W2</text>
<rect x="105" y="95" width="40" height="22" rx="3" fill="#fff" stroke="#3a73a8"/>
<text x="125" y="109" font-size="9" fill="#2d3748" text-anchor="middle">W3</text>
<path d="M80,66 L35,93" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow-topo)"/>
<path d="M80,66 L80,93" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow-topo)"/>
<path d="M80,66 L125,93" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow-topo)"/>
<text x="80" y="155" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">CrewAI</text>
<text x="80" y="180" font-size="9" fill="#4a5568" text-anchor="middle">Use: content pipelines,</text>
<text x="80" y="193" font-size="9" fill="#4a5568" text-anchor="middle">research + write + check</text>
<text x="80" y="215" font-size="9" font-weight="600" fill="#b91c1c" text-anchor="middle">Risk: manager hallucinates plan</text>
</g>

<g transform="translate(195,55)">
<rect width="160" height="240" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="80" y="22" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">2. Peer / debate</text>
<circle cx="40" cy="80" r="18" fill="#fed7aa" stroke="#d97706"/>
<text x="40" y="84" font-size="9" font-weight="600" fill="#2d3748" text-anchor="middle">A1</text>
<circle cx="120" cy="80" r="18" fill="#fed7aa" stroke="#d97706"/>
<text x="120" y="84" font-size="9" font-weight="600" fill="#2d3748" text-anchor="middle">A2</text>
<circle cx="80" cy="125" r="18" fill="#fed7aa" stroke="#d97706"/>
<text x="80" y="129" font-size="9" font-weight="600" fill="#2d3748" text-anchor="middle">A3</text>
<line x1="58" y1="80" x2="102" y2="80" stroke="#4a5568" stroke-width="1"/>
<line x1="50" y1="98" x2="72" y2="113" stroke="#4a5568" stroke-width="1"/>
<line x1="110" y1="98" x2="88" y2="113" stroke="#4a5568" stroke-width="1"/>
<text x="80" y="155" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">AutoGen, debate</text>
<text x="80" y="180" font-size="9" fill="#4a5568" text-anchor="middle">Use: reasoning, fact-check,</text>
<text x="80" y="193" font-size="9" fill="#4a5568" text-anchor="middle">socratic dialog</text>
<text x="80" y="215" font-size="9" font-weight="600" fill="#b91c1c" text-anchor="middle">Risk: agents converge to wrong</text>
</g>

<g transform="translate(370,55)">
<rect width="160" height="240" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="80" y="22" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">3. Pipeline</text>
<rect x="15" y="75" width="38" height="22" rx="3" fill="#fff" stroke="#047857"/>
<text x="34" y="89" font-size="9" fill="#2d3748" text-anchor="middle">S1</text>
<rect x="62" y="75" width="38" height="22" rx="3" fill="#fff" stroke="#047857"/>
<text x="81" y="89" font-size="9" fill="#2d3748" text-anchor="middle">S2</text>
<rect x="109" y="75" width="38" height="22" rx="3" fill="#fff" stroke="#047857"/>
<text x="128" y="89" font-size="9" fill="#2d3748" text-anchor="middle">S3</text>
<path d="M53,86 L60,86" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-topo)"/>
<path d="M100,86 L107,86" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-topo)"/>
<text x="80" y="120" font-size="9" fill="#4a5568" text-anchor="middle">strict handoff order</text>
<text x="80" y="155" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">LangGraph</text>
<text x="80" y="180" font-size="9" fill="#4a5568" text-anchor="middle">Use: ETL-like flows,</text>
<text x="80" y="193" font-size="9" fill="#4a5568" text-anchor="middle">structured outputs</text>
<text x="80" y="215" font-size="9" font-weight="600" fill="#b91c1c" text-anchor="middle">Risk: brittle to schema drift</text>
</g>

<g transform="translate(545,55)">
<rect width="160" height="240" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
<text x="80" y="22" font-size="12" font-weight="600" fill="#be185d" text-anchor="middle">4. Competitive</text>
<rect x="55" y="40" width="50" height="22" rx="3" fill="#fff" stroke="#be185d"/>
<text x="80" y="54" font-size="9" fill="#2d3748" text-anchor="middle">prompt</text>
<rect x="10" y="80" width="40" height="22" rx="3" fill="#fff" stroke="#be185d"/>
<text x="30" y="94" font-size="9" fill="#2d3748" text-anchor="middle">A1</text>
<rect x="60" y="80" width="40" height="22" rx="3" fill="#fff" stroke="#be185d"/>
<text x="80" y="94" font-size="9" fill="#2d3748" text-anchor="middle">A2</text>
<rect x="110" y="80" width="40" height="22" rx="3" fill="#fff" stroke="#be185d"/>
<text x="130" y="94" font-size="9" fill="#2d3748" text-anchor="middle">A3</text>
<rect x="40" y="118" width="80" height="22" rx="3" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
<text x="80" y="132" font-size="9" font-weight="600" fill="#be185d" text-anchor="middle">judge picks 1</text>
<path d="M80,62 L30,78" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow-topo)"/>
<path d="M80,62 L80,78" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow-topo)"/>
<path d="M80,62 L130,78" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow-topo)"/>
<text x="80" y="160" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">best-of-N + judge</text>
<text x="80" y="180" font-size="9" fill="#4a5568" text-anchor="middle">Use: coding,</text>
<text x="80" y="193" font-size="9" fill="#4a5568" text-anchor="middle">creative writing</text>
<text x="80" y="215" font-size="9" font-weight="600" fill="#b91c1c" text-anchor="middle">Risk: N x cost</text>
</g>

<text x="360" y="320" font-size="10" font-style="italic" fill="#718096" text-anchor="middle">Each topology maps to a problem class with a documented failure mode.</text>
</svg>