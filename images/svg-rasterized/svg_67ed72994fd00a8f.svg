<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 620 360" role="img" aria-label="Scatter plot showing the Pareto frontier of agent accuracy versus dollar cost per task, with frontier points and dominated points labeled" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<text x="310" y="22" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">Accuracy alone misleads: the cost-quality Pareto frontier</text>
<line x1="80" y1="60" x2="80" y2="300" stroke="#4a5568" stroke-width="1.5"/>
<line x1="80" y1="300" x2="580" y2="300" stroke="#4a5568" stroke-width="1.5"/>
<text x="40" y="180" font-size="11" fill="#4a5568" text-anchor="middle" transform="rotate(-90 40 180)">Accuracy (%)</text>
<text x="330" y="335" font-size="11" fill="#4a5568" text-anchor="middle">Cost per task ($)</text>

<text x="75" y="305" font-size="9" fill="#718096" text-anchor="end">40</text>
<text x="75" y="245" font-size="9" fill="#718096" text-anchor="end">60</text>
<text x="75" y="185" font-size="9" fill="#718096" text-anchor="end">80</text>
<text x="75" y="125" font-size="9" fill="#718096" text-anchor="end">95</text>
<text x="85" y="315" font-size="9" fill="#718096">0.01</text>
<text x="200" y="315" font-size="9" fill="#718096" text-anchor="middle">0.10</text>
<text x="350" y="315" font-size="9" fill="#718096" text-anchor="middle">0.50</text>
<text x="500" y="315" font-size="9" fill="#718096" text-anchor="middle">2.00</text>

<line x1="80" y1="245" x2="580" y2="245" stroke="#e2e8f0" stroke-dasharray="2,3"/>
<line x1="80" y1="185" x2="580" y2="185" stroke="#e2e8f0" stroke-dasharray="2,3"/>
<line x1="80" y1="125" x2="580" y2="125" stroke="#e2e8f0" stroke-dasharray="2,3"/>

<path d="M120,265 Q200,210 320,165 Q450,135 555,118" stroke="#047857" stroke-width="2" fill="none" stroke-dasharray="5,4"/>
<text x="500" y="105" font-size="10" font-weight="600" fill="#047857">Pareto frontier</text>

<circle cx="120" cy="265" r="6" fill="#047857" stroke="#fff" stroke-width="1.5"/>
<text x="130" y="262" font-size="10" fill="#2d3748">Cheap agent (52%, $0.03)</text>

<circle cx="220" cy="220" r="6" fill="#047857" stroke="#fff" stroke-width="1.5"/>
<text x="230" y="217" font-size="10" fill="#2d3748">Balanced (68%, $0.12)</text>

<circle cx="350" cy="160" r="6" fill="#047857" stroke="#fff" stroke-width="1.5"/>
<text x="360" y="157" font-size="10" fill="#2d3748">Premium (84%, $0.55)</text>

<circle cx="525" cy="125" r="6" fill="#047857" stroke="#fff" stroke-width="1.5"/>
<text x="495" y="148" font-size="10" fill="#2d3748">Frontier (93%, $1.80)</text>

<circle cx="380" cy="240" r="5" fill="#d97706" stroke="#fff" stroke-width="1.5"/>
<text x="390" y="237" font-size="9" fill="#92400e">Dominated</text>
<text x="390" y="249" font-size="9" fill="#92400e">(62%, $0.75)</text>

<circle cx="470" cy="215" r="5" fill="#d97706" stroke="#fff" stroke-width="1.5"/>
<text x="370" y="207" font-size="9" fill="#92400e">Pays more for less than Premium</text>
</svg>