<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;" aria-label="VLA action tokenization: 7 continuous DOFs → 7 discrete token IDs per timestep">
<rect width="720" height="240" fill="#ffffff"/>
<text x="360" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">VLA action tokenization: 7 continuous DOFs &#8594; 7 discrete token IDs per timestep</text>
<g transform="translate(20,46)">
<rect width="200" height="170" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
<text x="100" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#0d47a1">action vector a &#8712; &#8477;&#8311;</text>
<g font-size="10" font-family="monospace" fill="#0d47a1">
<text x="20" y="46">dx     =  0.013 m</text>
<text x="20" y="62">dy     = -0.007 m</text>
<text x="20" y="78">dz     =  0.022 m</text>
<text x="20" y="94">droll  =  0.05 rad</text>
<text x="20" y="110">dpitch = -0.12 rad</text>
<text x="20" y="126">dyaw   =  0.18 rad</text>
<text x="20" y="142">gripper=  1.0 (open)</text>
</g>
</g>
<line x1="220" y1="130" x2="280" y2="130" stroke="#444" stroke-width="2" marker-end="url(#bpeArr)"/>
<defs><marker id="bpeArr" markerwidth="8" markerheight="8" refx="7" refy="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#444"/></marker></defs>
<g transform="translate(280,46)">
<rect width="180" height="170" rx="8" fill="#fff3e0" stroke="#a67c1a"/>
<text x="90" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">quantize each DOF</text>
<text x="90" y="40" font-size="10" text-anchor="middle" fill="#a67c1a">K = 256 bins</text>
<g font-size="10" font-family="monospace" fill="#a67c1a">
<text x="20" y="60">bin&#8320; = 142</text>
<text x="20" y="76">bin&#8321; =  84</text>
<text x="20" y="92">bin&#8322; = 199</text>
<text x="20" y="108">bin&#8323; = 144</text>
<text x="20" y="124">bin&#8324; =  90</text>
<text x="20" y="140">bin&#8325; = 173</text>
<text x="20" y="156">bin&#8326; = 255</text>
</g>
</g>
<line x1="460" y1="130" x2="520" y2="130" stroke="#444" stroke-width="2" marker-end="url(#bpeArr)"/>
<g transform="translate(520,46)">
<rect width="180" height="170" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="90" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#1b5e20">vocab tokens</text>
<text x="90" y="40" font-size="10" text-anchor="middle" fill="#1b5e20">V_base + d&#183;K + bin</text>
<g font-size="10" font-family="monospace" fill="#1b5e20">
<text x="20" y="60">31886</text>
<text x="20" y="76">32084</text>
<text x="20" y="92">32455</text>
<text x="20" y="108">32688</text>
<text x="20" y="124">32890</text>
<text x="20" y="140">33197</text>
<text x="20" y="156">33535</text>
</g>
</g>
</svg>