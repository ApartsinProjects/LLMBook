<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="GRPO advantage: group-relative normalization replaces the learned value baseline" style="font-family:sans-serif;max-width:100%;height:auto;" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="240" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="360" y="22">GRPO advantage: group-relative normalization replaces the learned value baseline</text>
<g transform="translate(20,46)">
<rect fill="#e3f2fd" height="170" rx="8" stroke="#1565c0" width="200"></rect>
<text fill="#0d47a1" font-size="11" font-weight="700" text-anchor="middle" x="100" y="22">prompt x → sample G=8</text>
<text fill="#0d47a1" font-size="11" font-weight="700" text-anchor="middle" x="100" y="40">responses y₁, …, y₈</text>
<g fill="#0d47a1" font-family="monospace" font-size="10">
<text text-anchor="middle" x="100" y="68">r₁ = 1.0   r₅ = 0.0</text>
<text text-anchor="middle" x="100" y="84">r₂ = 1.0   r₆ = 1.0</text>
<text text-anchor="middle" x="100" y="100">r₃ = 0.0   r₇ = 0.0</text>
<text text-anchor="middle" x="100" y="116">r₄ = 1.0   r₈ = 1.0</text>
</g>
<text fill="#0d47a1" font-size="10" font-style="italic" text-anchor="middle" x="100" y="142">verifiable reward fn</text>
<text fill="#0d47a1" font-size="10" font-style="italic" text-anchor="middle" x="100" y="156">(unit tests, math grader)</text>
</g>
<g transform="translate(240,46)">
<rect fill="#fff3e0" height="170" rx="8" stroke="#a67c1a" width="220"></rect>
<text fill="#a67c1a" font-size="11" font-weight="700" text-anchor="middle" x="110" y="22">group statistics</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="110" y="46">mean(r) = 5/8 = 0.625</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="110" y="64">std(r) ≈ 0.48</text>
<text fill="#a67c1a" font-size="11" font-weight="700" text-anchor="middle" x="110" y="92">advantage per response:</text>
<g fill="#1a1a2e" font-family="monospace" font-size="10">
<text text-anchor="middle" x="110" y="112">A₁ = (1 − 0.625)/0.48 = +0.78</text>
<text text-anchor="middle" x="110" y="128">A₃ = (0 − 0.625)/0.48 = −1.30</text>
</g>
<text fill="#a67c1a" font-size="10" font-style="italic" text-anchor="middle" x="110" y="156">no value network involved</text>
</g>
<g transform="translate(480,46)">
<rect fill="#e8f5e9" height="170" rx="8" stroke="#2e7d32" width="220"></rect>
<text fill="#1b5e20" font-size="11" font-weight="700" text-anchor="middle" x="110" y="22">clipped policy update</text>
<text fill="#1b5e20" font-size="10" text-anchor="middle" x="110" y="48">L = min(rᵢ(θ) Aᵢ,</text>
<text fill="#1b5e20" font-size="10" text-anchor="middle" x="110" y="64">      clip(rᵢ(θ), 1±ε) Aᵢ)</text>
<text fill="#1b5e20" font-size="10" text-anchor="middle" x="110" y="84">    − β · KL(π || π_ref)</text>
<text fill="#2e7d32" font-size="10" font-style="italic" text-anchor="middle" x="110" y="116">same surrogate as PPO,</text>
<text fill="#2e7d32" font-size="10" font-style="italic" text-anchor="middle" x="110" y="130">different advantage source</text>
<text fill="#666" font-size="10" text-anchor="middle" x="110" y="156">DeepSeek-R1: G=64 per prompt</text>
</g>
</svg>