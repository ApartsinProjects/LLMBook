<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="SimCSE: same sentence, two dropout masks, one positive pair" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="240" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="bold" text-anchor="middle" x="360" y="22">SimCSE: same sentence, two dropout masks, one positive pair</text>
<rect fill="#fff3e0" height="50" rx="6" stroke="#e67e22" stroke-width="1.5" width="140" x="20" y="50"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="90" y="72">Sentence x</text>
<text fill="#555" font-size="10" text-anchor="middle" x="90" y="90">"A cat sits on the mat"</text>
<rect fill="#e3f2fd" height="60" rx="6" stroke="#1976d2" stroke-width="1.5" width="160" x="220" y="20"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="300" y="42">Encoder + dropout mask 1</text>
<text fill="#555" font-size="10" text-anchor="middle" x="300" y="60">forward pass A</text>
<rect fill="#e3f2fd" height="60" rx="6" stroke="#1976d2" stroke-width="1.5" width="160" x="220" y="120"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="300" y="142">Encoder + dropout mask 2</text>
<text fill="#555" font-size="10" text-anchor="middle" x="300" y="160">forward pass B</text>
<rect fill="#e8f5e9" height="60" rx="6" stroke="#2e7d32" stroke-width="1.5" width="100" x="430" y="20"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="480" y="50">h_i</text>
<text fill="#555" font-size="10" text-anchor="middle" x="480" y="68">view 1</text>
<rect fill="#e8f5e9" height="60" rx="6" stroke="#2e7d32" stroke-width="1.5" width="100" x="430" y="120"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="480" y="150">h_i+</text>
<text fill="#555" font-size="10" text-anchor="middle" x="480" y="168">view 2</text>
<rect fill="#fce4ec" height="60" rx="6" stroke="#c2185b" stroke-width="1.5" width="130" x="570" y="70"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="635" y="92">InfoNCE loss</text>
<text fill="#555" font-size="10" text-anchor="middle" x="635" y="110">pull pair, push others</text>
<line marker-end="url(#arrow-simcse)" stroke="#444" stroke-width="1.5" x1="160" x2="220" y1="65" y2="50"></line>
<line marker-end="url(#arrow-simcse)" stroke="#444" stroke-width="1.5" x1="160" x2="220" y1="85" y2="150"></line>
<line marker-end="url(#arrow-simcse)" stroke="#444" stroke-width="1.5" x1="380" x2="430" y1="50" y2="50"></line>
<line marker-end="url(#arrow-simcse)" stroke="#444" stroke-width="1.5" x1="380" x2="430" y1="150" y2="150"></line>
<line marker-end="url(#arrow-simcse)" stroke="#444" stroke-width="1.5" x1="530" x2="570" y1="50" y2="90"></line>
<line marker-end="url(#arrow-simcse)" stroke="#444" stroke-width="1.5" x1="530" x2="570" y1="150" y2="110"></line>
<text fill="#555" font-size="11" text-anchor="middle" x="360" y="220">Other sentences in the same batch supply the in-batch negatives.</text>
<defs><marker id="arrow-simcse" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="4"><path d="M0,0 L8,4 L0,8 z" fill="#444"></path></marker></defs>
</svg>