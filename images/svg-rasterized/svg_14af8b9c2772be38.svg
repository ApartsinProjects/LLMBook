<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Gorilla retrieval-augmented tool selection: user query embedded, top-k API specs retrieved, fine-tuned Gorilla LM writes the call" role="img" viewbox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="grArrow" markerheight="10" markerwidth="10" orient="auto" refx="8" refy="3">
<path d="M0,0 L0,6 L8,3 z" fill="#3a4a7a"></path>
</marker>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="360" y="22">Gorilla: RAG over a 1600+ API registry</text>
<rect fill="#e3f2fd" height="80" rx="8" stroke="#3a73a8" stroke-width="2" width="140" x="20" y="70"></rect>
<text font-size="11" font-weight="700" text-anchor="middle" x="90" y="92">User query</text>
<text fill="#2a3a5a" font-size="10" text-anchor="middle" x="90" y="112">"list my GCP</text>
<text fill="#2a3a5a" font-size="10" text-anchor="middle" x="90" y="126">instances"</text>
<rect fill="#fff8e1" height="80" rx="8" stroke="#d97706" stroke-width="2" width="160" x="190" y="70"></rect>
<text font-size="11" font-weight="700" text-anchor="middle" x="270" y="92">API spec retriever</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="270" y="112">embed query;</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="270" y="126">top-k specs from index</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="270" y="140">(BM25 or dense)</text>
<rect fill="#e8f5e9" height="80" rx="8" stroke="#047857" stroke-width="2" width="160" x="380" y="70"></rect>
<text font-size="11" font-weight="700" text-anchor="middle" x="460" y="92">Gorilla LM (SFT)</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="460" y="112">prompt = specs + query;</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="460" y="126">writes call against specs</text>
<rect fill="#fce4ec" height="80" rx="8" stroke="#b03060" stroke-width="2" width="140" x="570" y="70"></rect>
<text font-size="11" font-weight="700" text-anchor="middle" x="640" y="92">Execute</text>
<text fill="#5a2a3a" font-size="10" text-anchor="middle" x="640" y="112">gcloud compute</text>
<text fill="#5a2a3a" font-size="10" text-anchor="middle" x="640" y="126">instances list</text>
<line marker-end="url(#grArrow)" stroke="#3a4a7a" stroke-width="2" x1="160" x2="190" y1="110" y2="110"></line>
<line marker-end="url(#grArrow)" stroke="#3a4a7a" stroke-width="2" x1="350" x2="380" y1="110" y2="110"></line>
<line marker-end="url(#grArrow)" stroke="#3a4a7a" stroke-width="2" x1="540" x2="570" y1="110" y2="110"></line>
<text fill="#444" font-size="11" font-style="italic" text-anchor="middle" x="360" y="190">Adding a new API = indexing one more spec; no retraining of the Gorilla LM required.</text>
</g>
</svg>