<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Residual vector quantization chain: input z enters codebook 1 producing entry e1; the residual r1 = z - e1 enters codebook 2 producing e2; the residual r2 enters codebook 3 producing e3; the final reconstruction is the sum e1 + e2 + e3." role="img" style="max-width:100%;height:auto;font-family:system-ui, sans-serif;" viewbox="0 0 720 140" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="rvqMiniArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
</defs>
<rect fill="#fafafa" height="140" rx="6" width="720"></rect>
<g font-size="11">
<rect fill="#bbdefb" height="40" rx="6" stroke="#1976d2" stroke-width="1.4" width="60" x="14" y="50"></rect>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="44" y="75">z (r₀)</text>
<line marker-end="url(#rvqMiniArr)" stroke="#666" stroke-width="2" x1="74" x2="100" y1="70" y2="70"></line>
<rect fill="#c8e6c9" height="40" rx="6" stroke="#2e7d32" stroke-width="1.4" width="70" x="100" y="50"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="135" y="75">CB1 → e₁</text>
<line marker-end="url(#rvqMiniArr)" stroke="#666" stroke-width="2" x1="170" x2="196" y1="70" y2="70"></line>
<rect fill="#fff3e0" height="40" rx="6" stroke="#ef6c00" stroke-width="1.4" width="70" x="196" y="50"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="231" y="75">r₁ = z − e₁</text>
<line marker-end="url(#rvqMiniArr)" stroke="#666" stroke-width="2" x1="266" x2="292" y1="70" y2="70"></line>
<rect fill="#c8e6c9" height="40" rx="6" stroke="#2e7d32" stroke-width="1.4" width="70" x="292" y="50"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="327" y="75">CB2 → e₂</text>
<line marker-end="url(#rvqMiniArr)" stroke="#666" stroke-width="2" x1="362" x2="388" y1="70" y2="70"></line>
<rect fill="#fff3e0" height="40" rx="6" stroke="#ef6c00" stroke-width="1.4" width="70" x="388" y="50"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="423" y="75">r₂ = r₁ − e₂</text>
<line marker-end="url(#rvqMiniArr)" stroke="#666" stroke-width="2" x1="458" x2="484" y1="70" y2="70"></line>
<rect fill="#c8e6c9" height="40" rx="6" stroke="#2e7d32" stroke-width="1.4" width="70" x="484" y="50"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="519" y="75">CB3 → e₃</text>
<line marker-end="url(#rvqMiniArr)" stroke="#666" stroke-width="2" x1="554" x2="580" y1="70" y2="70"></line>
<rect fill="#e1bee7" height="60" rx="6" stroke="#6a1b9a" stroke-width="1.4" width="124" x="580" y="40"></rect>
<text fill="#4a148c" font-weight="700" text-anchor="middle" x="642" y="65">ẑ = e₁ + e₂ + e₃</text>
<text fill="#6a1b9a" font-size="9.5" text-anchor="middle" x="642" y="84">final reconstruction</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="360" y="120">Each stage quantizes only what the previous stages could not capture; the running residual shrinks toward zero.</text>
</g>
</svg>