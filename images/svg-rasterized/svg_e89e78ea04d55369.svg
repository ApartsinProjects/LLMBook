<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="STFT construction: overlapping windowed FFTs build a time-frequency matrix" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 820 320" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="320" width="820"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="410" y="22">Short-Time Fourier Transform: slide a Hann window, FFT each frame</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="410" y="40">25 ms frame, 10 ms hop @ 16 kHz = 100 frames/sec</text>
<g transform="translate(40,60)">
<text fill="#333" font-size="10" font-weight="700" x="0" y="10">Waveform x[n]</text>
<path d="M0,40 Q20,15 40,40 T80,40 T120,40 T160,40 T200,40 T240,40 T280,40 T320,40 T360,40 T400,40 T440,40 T480,40 T520,40 T560,40 T600,40 T640,40 T680,40 T720,40" fill="none" stroke="#3d4d8a" stroke-width="1.4"></path>
<rect fill="#fef3e0" height="40" opacity="0.7" stroke="#a67c1a" stroke-width="1.5" width="120" x="60" y="20"></rect>
<rect fill="#e3e8f5" height="40" opacity="0.7" stroke="#3d4d8a" stroke-width="1.5" width="120" x="150" y="20"></rect>
<rect fill="#fef3e0" height="40" opacity="0.7" stroke="#a67c1a" stroke-width="1.5" width="120" x="240" y="20"></rect>
<rect fill="#e3e8f5" height="40" opacity="0.7" stroke="#3d4d8a" stroke-width="1.5" width="120" x="330" y="20"></rect>
<text fill="#a67c1a" font-size="9" text-anchor="middle" x="120" y="78">frame 1</text>
<text fill="#3d4d8a" font-size="9" text-anchor="middle" x="210" y="78">frame 2</text>
<text fill="#a67c1a" font-size="9" text-anchor="middle" x="300" y="78">frame 3</text>
<text fill="#3d4d8a" font-size="9" text-anchor="middle" x="390" y="78">frame 4</text>
<text fill="#888" font-size="10" x="500" y="42">25 ms each, 10 ms hop</text>
<line marker-end="url(#stftArr)" stroke="#666" stroke-width="1.5" x1="240" x2="240" y1="92" y2="125"></line>
</g>
<defs>
<marker id="stftArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
</defs>
<g transform="translate(40,200)">
<text fill="#333" font-size="10" font-weight="700" x="0" y="10">|FFT| of each windowed frame → spectrogram column</text>
<rect fill="#ffffff" height="80" stroke="#999" stroke-width="1" width="720" x="0" y="20"></rect>
<g>
<rect fill="#bbdefb" height="80" width="40" x="0" y="20"></rect>
<rect fill="#90caf9" height="80" width="40" x="40" y="20"></rect>
<rect fill="#42a5f5" height="80" width="40" x="80" y="20"></rect>
<rect fill="#1976d2" height="80" width="40" x="120" y="20"></rect>
<rect fill="#42a5f5" height="80" width="40" x="160" y="20"></rect>
<rect fill="#90caf9" height="80" width="40" x="200" y="20"></rect>
<rect fill="#bbdefb" height="80" width="40" x="240" y="20"></rect>
<rect fill="#e3f2fd" height="80" width="40" x="280" y="20"></rect>
<rect fill="#bbdefb" height="80" width="40" x="320" y="20"></rect>
<rect fill="#90caf9" height="80" width="40" x="360" y="20"></rect>
<rect fill="#42a5f5" height="80" width="40" x="400" y="20"></rect>
<rect fill="#1976d2" height="80" width="40" x="440" y="20"></rect>
<rect fill="#0d47a1" height="80" width="40" x="480" y="20"></rect>
<rect fill="#1976d2" height="80" width="40" x="520" y="20"></rect>
<rect fill="#42a5f5" height="80" width="40" x="560" y="20"></rect>
<rect fill="#90caf9" height="80" width="40" x="600" y="20"></rect>
<rect fill="#bbdefb" height="80" width="40" x="640" y="20"></rect>
<rect fill="#e3f2fd" height="80" width="40" x="680" y="20"></rect>
</g>
<text fill="#666" font-size="9" text-anchor="end" x="-5" y="40">high f</text>
<text fill="#666" font-size="9" text-anchor="end" x="-5" y="95">low f</text>
<text fill="#666" font-size="9" x="725" y="60">time →</text>
</g>
</svg>