<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Mamba selective scan mechanism. Each input token x_t is fed to small linear projections that produce a per-token discretization step delta_t and per-token matrices B_t and C_t. Delta_t combines with the fixed matrix A and with B_t to produce the input-dependent discretized matrices A-bar_t and B-bar_t. The state recurrence updates the hidden state as h_t equals A-bar_t times h_{t-1} plus B-bar_t times x_t, and the output y_t equals C_t times h_t. A contrast box notes that S4 uses the same fixed A-bar and B-bar at every timestep, so it cannot select what to keep, whereas Mamba's matrices change with the input." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="mmIn" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bbdefb"></stop><stop offset="100%" stop-color="#1e88e5"></stop></lineargradient>
<lineargradient id="mmProj" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e1bee7"></stop><stop offset="100%" stop-color="#8e24aa"></stop></lineargradient>
<lineargradient id="mmDisc" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffe0b2"></stop><stop offset="100%" stop-color="#fb8c00"></stop></lineargradient>
<lineargradient id="mmState" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"></stop><stop offset="100%" stop-color="#43a047"></stop></lineargradient>
<lineargradient id="mmOut" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3e0"></stop><stop offset="100%" stop-color="#ffb74d"></stop></lineargradient>
<filter height="116%" id="mmShadow" width="116%" x="-8%" y="-8%"><fedropshadow dx="1" dy="2" flood-opacity="0.18" stddeviation="2"></fedropshadow></filter>
<marker id="mmArrow" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"></path></marker>
<marker id="mmArrowG" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#43a047"></path></marker>
</defs>
<rect fill="#fafafa" height="380" rx="8" width="800" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="400" y="26">Mamba selective scan: the input picks its own Āᵗ and B̄ᵗ</text>
<!-- input token -->
<rect fill="url(#mmIn)" filter="url(#mmShadow)" height="52" rx="9" width="84" x="24" y="150"></rect>
<text fill="#fff" font-size="13" font-weight="700" text-anchor="middle" x="66" y="174">token xᵗ</text>
<text fill="#e3f2fd" font-size="10" text-anchor="middle" x="66" y="192">at step t</text>
<!-- projections producing delta, B, C -->
<g fill="#fff" font-size="11" font-weight="600" text-anchor="middle">
<rect fill="url(#mmProj)" filter="url(#mmShadow)" height="34" rx="7" width="92" x="146" y="74"></rect><text x="192" y="96">Δᵗ = sΔ(xᵗ)</text>
<rect fill="url(#mmProj)" filter="url(#mmShadow)" height="34" rx="7" width="92" x="146" y="160"></rect><text x="192" y="182">Bᵗ = sᴷ(xᵗ)</text>
<rect fill="url(#mmProj)" filter="url(#mmShadow)" height="34" rx="7" width="92" x="146" y="246"></rect><text x="192" y="268">Cᵗ = sᴼ(xᵗ)</text>
</g>
<text fill="#888" font-size="9.5" text-anchor="middle" x="192" y="300">input-dependent (this is the selection)</text>
<!-- arrows token -> projections -->
<g fill="none" stroke="#777" stroke-width="1.6">
<path d="M108,164 C124,150 128,100 146,92" marker-end="url(#mmArrow)"></path>
<path d="M108,176 L146,177" marker-end="url(#mmArrow)"></path>
<path d="M108,188 C124,202 128,256 146,263" marker-end="url(#mmArrow)"></path>
</g>
<!-- fixed A -->
<rect fill="#eceff1" height="30" rx="7" stroke="#b0bec5" stroke-width="1.2" width="48" x="146" y="118"></rect>
<text fill="#546e7a" font-size="12" font-weight="700" text-anchor="middle" x="170" y="138">A</text>
<text fill="#90a4ae" font-size="8.5" text-anchor="middle" x="170" y="116">fixed (learned)</text>
<!-- discretization block -->
<rect fill="url(#mmDisc)" filter="url(#mmShadow)" height="92" rx="10" width="128" x="270" y="96"></rect>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="334" y="120">discretize (ZOH)</text>
<text fill="#fff3e0" font-size="11" text-anchor="middle" x="334" y="142">Āᵗ = exp(Δᵗ A)</text>
<text fill="#fff3e0" font-size="11" text-anchor="middle" x="334" y="162">B̄ᵗ = Δᵗ Bᵗ</text>
<text fill="#fff8e1" font-size="9.5" text-anchor="middle" x="334" y="180">per-token matrices</text>
<g fill="none" stroke="#777" stroke-width="1.6">
<path d="M238,91 C252,100 256,120 270,124" marker-end="url(#mmArrow)"></path>
<path d="M194,133 L270,140" marker-end="url(#mmArrow)"></path>
<path d="M238,177 C252,170 256,158 270,154" marker-end="url(#mmArrow)"></path>
</g>
<!-- state recurrence -->
<rect fill="url(#mmState)" filter="url(#mmShadow)" height="92" rx="10" width="170" x="430" y="104"></rect>
<text fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle" x="515" y="128">state recurrence</text>
<text fill="#e8f5e9" font-size="12" text-anchor="middle" x="515" y="152">hᵗ = Āᵗ hᵗ₋₁ + B̄ᵗ xᵗ</text>
<text fill="#e8f5e9" font-size="11" text-anchor="middle" x="515" y="174">fixed-size state, O(1)/step</text>
<line marker-end="url(#mmArrow)" stroke="#fb8c00" stroke-width="2.2" x1="398" x2="430" y1="142" y2="148"></line>
<!-- recurrent self loop -->
<path d="M470,104 C460,74 570,74 560,104" fill="none" marker-end="url(#mmArrowG)" stroke="#43a047" stroke-width="2"></path>
<text fill="#2e7d32" font-size="9.5" text-anchor="middle" x="515" y="80">carry hᵗ₋₁</text>
<!-- output -->
<line marker-end="url(#mmArrow)" stroke="#777" stroke-width="2" x1="600" x2="634" y1="150" y2="150"></line>
<rect fill="url(#mmOut)" filter="url(#mmShadow)" height="52" rx="9" width="120" x="634" y="124"></rect>
<text fill="#5d4037" font-size="12" font-weight="700" text-anchor="middle" x="694" y="148">yᵗ = Cᵗ hᵗ</text>
<text fill="#6d4c41" font-size="9.5" text-anchor="middle" x="694" y="166">read out the state</text>
<!-- C_t to output -->
<path d="M238,263 C420,263 660,230 690,180" fill="none" marker-end="url(#mmArrow)" stroke="#8e24aa" stroke-dasharray="5,3" stroke-width="1.6"></path>
<!-- contrast box -->
<rect fill="#e3f2fd" height="46" rx="9" stroke="#90caf9" stroke-width="1" width="560" x="120" y="318"></rect>
<text fill="#1565c0" font-size="11.5" font-weight="600" text-anchor="middle" x="400" y="338">S4: same fixed Ā, B̄ at every step (a convolution) → cannot choose what to keep.</text>
<text fill="#1976d2" font-size="11" text-anchor="middle" x="400" y="356">Mamba: Āᵗ, B̄ᵗ change with xᵗ → the state gates information content-wise.</text>
</svg>