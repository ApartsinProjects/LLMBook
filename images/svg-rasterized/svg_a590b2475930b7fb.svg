<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Compound AI pipeline with five swappable stages (query rewriter, retriever, reranker, generator, verifier) feeding an output, with a router branching beneath the main flow" role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow-compound" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"></path>
</marker>
</defs>
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="380" y="22">Compound AI: a pipeline of swappable components</text>
<rect fill="#dbeafe" height="60" rx="8" stroke="#3a73a8" stroke-width="1.5" width="110" x="20" y="100"></rect>
<text fill="#2d3748" font-size="11" font-weight="600" text-anchor="middle" x="75" y="125">Query rewriter</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="75" y="142">expansion / HyDE</text>
<rect fill="#dbeafe" height="60" rx="8" stroke="#3a73a8" stroke-width="1.5" width="110" x="150" y="100"></rect>
<text fill="#2d3748" font-size="11" font-weight="600" text-anchor="middle" x="205" y="125">Retriever</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="205" y="142">dense / BM25 / hybrid</text>
<rect fill="#dbeafe" height="60" rx="8" stroke="#3a73a8" stroke-width="1.5" width="110" x="280" y="100"></rect>
<text fill="#2d3748" font-size="11" font-weight="600" text-anchor="middle" x="335" y="125">Reranker</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="335" y="142">cross-encoder</text>
<rect fill="#fef3c7" height="60" rx="8" stroke="#d97706" stroke-width="1.5" width="110" x="410" y="100"></rect>
<text fill="#2d3748" font-size="11" font-weight="600" text-anchor="middle" x="465" y="125">Generator</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="465" y="142">LLM, any size</text>
<rect fill="#d1fae5" height="60" rx="8" stroke="#047857" stroke-width="1.5" width="110" x="540" y="100"></rect>
<text fill="#2d3748" font-size="11" font-weight="600" text-anchor="middle" x="595" y="125">Verifier</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="595" y="142">faithfulness check</text>
<rect fill="#fce7f3" height="60" rx="8" stroke="#be185d" stroke-width="1.5" width="80" x="670" y="100"></rect>
<text fill="#2d3748" font-size="11" font-weight="600" text-anchor="middle" x="710" y="125">Output</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="710" y="142">to user</text>
<path d="M130,130 L146,130" marker-end="url(#arrow-compound)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M260,130 L276,130" marker-end="url(#arrow-compound)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M390,130 L406,130" marker-end="url(#arrow-compound)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M520,130 L536,130" marker-end="url(#arrow-compound)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M650,130 L666,130" marker-end="url(#arrow-compound)" stroke="#4a5568" stroke-width="1.5"></path>
<rect fill="#f3e8ff" height="36" rx="6" stroke="#7c3aed" stroke-width="1.5" width="110" x="280" y="200"></rect>
<text fill="#2d3748" font-size="10" font-weight="600" text-anchor="middle" x="335" y="217">Router</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="335" y="230">query-type dispatch</text>
<path d="M75,160 Q205,200 280,218" fill="none" marker-end="url(#arrow-compound)" stroke="#4a5568" stroke-dasharray="3,3" stroke-width="1"></path>
<path d="M390,218 Q450,200 465,160" fill="none" marker-end="url(#arrow-compound)" stroke="#4a5568" stroke-dasharray="3,3" stroke-width="1"></path>
<text fill="#718096" font-size="10" font-style="italic" text-anchor="middle" x="380" y="80">Each box independently swappable, independently measurable.</text>
</svg>