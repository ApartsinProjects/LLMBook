<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: RQ-VAE encoding an item embedding into a four-token semantic ID. The continuous embedding enters on the left. At level 1, the nearest codebook vector is selected and its index recorded; the residual (original minus selected) flows to level 2. At level 2, the same process is repeated with a new codebook. By level 4, the residual is small and the item has been mapped to a 4-tuple of integer codebook indices: its semantic ID." role="img" viewbox="0 0 820 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arr385" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="3.5" viewbox="0 0 7 7"><path d="M0,0 L7,3.5 L0,7 z" fill="#444"></path></marker>
<filter height="115%" id="ds385" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<!-- Input embedding -->
<rect fill="#ecf0f1" filter="url(#ds385)" height="60" rx="6" stroke="#2c3e50" stroke-width="2" width="120" x="20" y="130"></rect>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="80" y="155">item embed</text>
<text fill="#666" font-family="monospace" font-size="10" text-anchor="middle" x="80" y="172">x in R^d</text>
<!-- Level 1 -->
<g transform="translate(170,40)">
<rect fill="#eaf5ff" filter="url(#ds385)" height="240" rx="8" stroke="#2980b9" stroke-width="2" width="130"></rect>
<text fill="#1f618d" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="65" y="25">Level 1</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="65" y="45">codebook C1</text>
<text fill="#444" font-family="monospace" font-size="10" text-anchor="middle" x="65" y="75">argmin |x - c|</text>
<text fill="#1f618d" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="65" y="115">id1 = 47</text>
<text fill="#444" font-family="monospace" font-size="10" text-anchor="middle" x="65" y="160">residual:</text>
<text fill="#444" font-family="monospace" font-size="10" text-anchor="middle" x="65" y="175">r1 = x - c[47]</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="65" y="215">(coarse class)</text>
</g>
<!-- Level 2 -->
<g transform="translate(320,40)">
<rect fill="#fef5e7" filter="url(#ds385)" height="240" rx="8" stroke="#e67e22" stroke-width="2" width="130"></rect>
<text fill="#a05a16" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="65" y="25">Level 2</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="65" y="45">codebook C2</text>
<text fill="#444" font-family="monospace" font-size="10" text-anchor="middle" x="65" y="75">argmin |r1 - c|</text>
<text fill="#a05a16" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="65" y="115">id2 = 132</text>
<text fill="#444" font-family="monospace" font-size="10" text-anchor="middle" x="65" y="160">r2 = r1 - c[132]</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="65" y="215">(sub-class)</text>
</g>
<!-- Level 3 -->
<g transform="translate(470,40)">
<rect fill="#e8f5e9" filter="url(#ds385)" height="240" rx="8" stroke="#27ae60" stroke-width="2" width="130"></rect>
<text fill="#1e8449" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="65" y="25">Level 3</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="65" y="45">codebook C3</text>
<text fill="#1e8449" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="65" y="115">id3 = 9</text>
<text fill="#444" font-family="monospace" font-size="10" text-anchor="middle" x="65" y="160">r3 = r2 - c[9]</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="65" y="215">(fine-grain)</text>
</g>
<!-- Level 4 -->
<g transform="translate(620,40)">
<rect fill="#f5eef8" filter="url(#ds385)" height="240" rx="8" stroke="#8e44ad" stroke-width="2" width="130"></rect>
<text fill="#6c3483" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="65" y="25">Level 4</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="65" y="45">codebook C4</text>
<text fill="#6c3483" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="65" y="115">id4 = 201</text>
<text fill="#444" font-family="monospace" font-size="10" text-anchor="middle" x="65" y="160">r4 small</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="65" y="215">(unique tag)</text>
</g>
<!-- Arrows -->
<line marker-end="url(#arr385)" stroke="#444" stroke-width="2" x1="142" x2="168" y1="160" y2="160"></line>
<line marker-end="url(#arr385)" stroke="#444" stroke-width="2" x1="302" x2="318" y1="160" y2="160"></line>
<line marker-end="url(#arr385)" stroke="#444" stroke-width="2" x1="452" x2="468" y1="160" y2="160"></line>
<line marker-end="url(#arr385)" stroke="#444" stroke-width="2" x1="602" x2="618" y1="160" y2="160"></line>
<!-- Semantic ID output -->
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="410" y="305">Semantic ID = (47, 132, 9, 201)</text>
</svg>