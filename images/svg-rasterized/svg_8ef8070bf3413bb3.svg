<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: a modern two-stage recsys pipeline with four LLM entry points labeled A through D. (A) Query and intent understanding sits at the user request. (B) Item enrichment sits at the catalog. (C) Conversational interaction wraps the whole flow. (D) Generative recsys replaces the candidate generator with a sequence model over semantic IDs." role="img" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arr382" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="3.5" viewBox="0 0 7 7"><path d="M0,0 L7,3.5 L0,7 z" fill="#444"></path></marker>
<filter height="115%" id="ds382" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>

<!-- User request -->
<circle cx="60" cy="180" fill="#2c3e50" r="22"></circle>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="60" y="184">User</text>

<!-- Query understanding box (A) -->
<rect fill="#fef5e7" filter="url(#ds382)" height="80" rx="8" stroke="#e67e22" stroke-width="2" width="130" x="120" y="140"></rect>
<text fill="#e67e22" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="185" y="162">Query / Intent</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="185" y="180">expansion, slot fill,</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="185" y="194">intent classification</text>
<text fill="#c0392b" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="185" y="215">(A)</text>

<!-- Candidate generation -->
<polygon fill="#aed6f1" filter="url(#ds382)" points="280,140 410,140 380,220 310,220" stroke="#2980b9" stroke-width="2"></polygon>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="345" y="175">Candidate</text>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="345" y="190">Generator</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="9" text-anchor="middle" x="345" y="208">millions to thousands</text>

<!-- Ranker -->
<polygon fill="#a9dfbf" filter="url(#ds382)" points="450,150 540,150 520,210 470,210" stroke="#27ae60" stroke-width="2"></polygon>
<text fill="#1e8449" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="495" y="180">Ranker</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="9" text-anchor="middle" x="495" y="198">thousands to top-k</text>

<!-- Result -->
<rect fill="#fadbd8" height="60" rx="6" stroke="#c0392b" stroke-width="2" width="110" x="580" y="150"></rect>
<text fill="#c0392b" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="635" y="172">Top-k items</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="9" text-anchor="middle" x="635" y="190">+ optional</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="9" text-anchor="middle" x="635" y="202">justifications</text>

<!-- Catalog at top with item enrichment (B) -->
<rect fill="#f5eef8" filter="url(#ds382)" height="60" rx="8" stroke="#8e44ad" stroke-width="2" width="170" x="280" y="40"></rect>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="365" y="62">Item Enrichment</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="365" y="80">LLM-generated descriptions,</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="365" y="93">multi-modal embeddings</text>
<text fill="#c0392b" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="465" y="62">(B)</text>

<!-- Generative recsys (D) at candidate gen -->
<rect fill="#fdebd0" filter="url(#ds382)" height="40" rx="6" stroke="#d68910" stroke-width="1.5" width="160" x="280" y="240"></rect>
<text fill="#7d6608" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="360" y="258">Generative recsys</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="360" y="273">decode semantic IDs</text>
<text fill="#c0392b" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="455" y="258">(D)</text>

<!-- Conversational wrap (C) -->
<rect fill="none" height="280" rx="14" stroke="#3498db" stroke-dasharray="6,4" stroke-width="2.5" width="700" x="40" y="100"></rect>
<text fill="#2874a6" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" x="55" y="120">Conversational wrapper (C): preference elicitation, clarification, justification</text>

<!-- Arrows -->
<line marker-end="url(#arr382)" stroke="#444" stroke-width="2" x1="82" x2="118" y1="180" y2="180"></line>
<line marker-end="url(#arr382)" stroke="#444" stroke-width="2" x1="252" x2="280" y1="180" y2="180"></line>
<line marker-end="url(#arr382)" stroke="#444" stroke-width="2" x1="412" x2="450" y1="180" y2="180"></line>
<line marker-end="url(#arr382)" stroke="#444" stroke-width="2" x1="542" x2="578" y1="180" y2="180"></line>
<line marker-end="url(#arr382)" stroke="#8e44ad" stroke-dasharray="3,3" stroke-width="1.5" x1="365" x2="345" y1="100" y2="138"></line>
</svg>