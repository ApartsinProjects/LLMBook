<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Information extraction pipeline comparison: classical (spaCy or CRF) chains raw text, tokenizer, NER model, and post-processing to typed entities at sub-millisecond latency with 95%+ F1; LLM-based pipeline (GPT-4o, Claude) follows below for contrast." font-family="Segoe UI, system-ui, sans-serif" role="img" viewbox="0 0 760 420" xmlns="http://www.w3.org/2000/svg">
<!-- Classical Pipeline (top) -->
<text fill="#27ae60" font-size="12" font-weight="600" text-anchor="middle" x="380" y="55">Classical Pipeline (spaCy / CRF)</text>
<rect fill="#e8f5e9" filter="url(#shadow_e474ea)" height="50" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="120" x="30" y="70"></rect>
<text fill="#2d3436" font-size="11" font-weight="600" text-anchor="middle" x="90" y="92">Raw Text</text>
<text fill="#555" font-size="11" text-anchor="middle" x="90" y="107">documents</text>
<line marker-end="url(#arrow-green)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="150" x2="180" y1="95" y2="95"></line>
<rect fill="#e8f5e9" height="50" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="120" x="180" y="70"></rect>
<text fill="#2d3436" font-size="11" font-weight="600" text-anchor="middle" x="240" y="92">Tokenizer</text>
<text fill="#555" font-size="11" text-anchor="middle" x="240" y="107">rule-based</text>
<line marker-end="url(#arrow-green)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="300" x2="330" y1="95" y2="95"></line>
<rect fill="#e8f5e9" height="50" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="120" x="330" y="70"></rect>
<text fill="#2d3436" font-size="11" font-weight="600" text-anchor="middle" x="390" y="92">NER Model</text>
<text fill="#555" font-size="11" text-anchor="middle" x="390" y="107">CRF / BiLSTM</text>
<line marker-end="url(#arrow-green)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="450" x2="480" y1="95" y2="95"></line>
<rect fill="#e8f5e9" height="50" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="130" x="480" y="70"></rect>
<text fill="#2d3436" font-size="11" font-weight="600" text-anchor="middle" x="545" y="92">Post-Processing</text>
<text fill="#555" font-size="11" text-anchor="middle" x="545" y="107">rules, linking</text>
<line marker-end="url(#arrow-green)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="610" x2="640" y1="95" y2="95"></line>
<rect fill="#27ae60" height="50" rx="8" stroke="#1e8449" stroke-linecap="round" stroke-width="2" width="100" x="640" y="70"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="690" y="92">Entities</text>
<text fill="#e8f5e9" font-size="11" text-anchor="middle" x="690" y="107">typed spans</text>
<!-- Performance labels for classical -->
<text fill="#27ae60" font-size="11" text-anchor="middle" x="90" y="140">⚡ &lt;1ms</text>
<text fill="#27ae60" font-size="11" text-anchor="middle" x="390" y="140">✓ 95%+ F1</text>
<text fill="#27ae60" font-size="11" text-anchor="middle" x="690" y="140">★ Deterministic</text>
<!-- Divider -->
<line stroke="#ddd" stroke-dasharray="6,4" stroke-linecap="round" stroke-width="1" x1="30" x2="740" y1="165" y2="165"></line>
<text fill="#888" font-size="11" font-style="italic" text-anchor="middle" x="380" y="160">vs.</text>
<!-- LLM Pipeline (bottom) -->
<text fill="#8e44ad" font-size="12" font-weight="600" text-anchor="middle" x="380" y="195">LLM-Based Pipeline (GPT-4o / Claude)</text>
<rect fill="url(#grad_e474ea_f0e6ff)" height="50" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="120" x="30" y="210"></rect>
<text fill="#2d3436" font-size="11" font-weight="600" text-anchor="middle" x="90" y="232">Raw Text</text>
<text fill="#555" font-size="11" text-anchor="middle" x="90" y="247">documents</text>
<line marker-end="url(#arrow-purple)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" x1="150" x2="180" y1="235" y2="235"></line>
<rect fill="url(#grad_e474ea_f0e6ff)" height="50" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="140" x="180" y="210"></rect>
<text fill="#2d3436" font-size="11" font-weight="600" text-anchor="middle" x="250" y="232">Prompt Builder</text>
<text fill="#555" font-size="11" text-anchor="middle" x="250" y="247">schema + examples</text>
<line marker-end="url(#arrow-purple)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" x1="320" x2="350" y1="235" y2="235"></line>
<rect fill="url(#grad_e474ea_f0e6ff)" height="50" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="120" x="350" y="210"></rect>
<text fill="#2d3436" font-size="11" font-weight="600" text-anchor="middle" x="410" y="232">LLM Call</text>
<text fill="#555" font-size="11" text-anchor="middle" x="410" y="247">structured output</text>
<line marker-end="url(#arrow-purple)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" x1="470" x2="500" y1="235" y2="235"></line>
<rect fill="url(#grad_e474ea_f0e6ff)" height="50" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="120" x="500" y="210"></rect>
<text fill="#2d3436" font-size="11" font-weight="600" text-anchor="middle" x="560" y="232">Validation</text>
<text fill="#555" font-size="11" text-anchor="middle" x="560" y="247">Pydantic / BAML</text>
<line marker-end="url(#arrow-purple)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" x1="620" x2="640" y1="235" y2="235"></line>
<rect fill="#8e44ad" height="50" rx="8" stroke="#6c3483" stroke-linecap="round" stroke-width="2" width="100" x="640" y="210"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="690" y="232">Entities</text>
<text fill="#e8d5ff" font-size="11" text-anchor="middle" x="690" y="247">validated JSON</text>
<!-- Performance labels for LLM -->
<text fill="#8e44ad" font-size="11" text-anchor="middle" x="90" y="280">⚡ 200ms-2s</text>
<text fill="#8e44ad" font-size="11" text-anchor="middle" x="410" y="280">✓ 85-92% F1</text>
<text fill="#8e44ad" font-size="11" text-anchor="middle" x="690" y="280">★ Flexible schema</text>
<!-- Key tradeoffs -->
<rect fill="#f8f8ff" height="90" rx="10" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="600" x="80" y="310"></rect>
<text fill="#1a1a2e" font-size="12" font-weight="700" text-anchor="middle" x="380" y="335">Key Tradeoffs</text>
<text fill="#27ae60" font-size="11" text-anchor="middle" x="200" y="358">Classical: Fast, cheap, precise</text>
<text fill="#27ae60" font-size="11" text-anchor="middle" x="200" y="375">but rigid entity types</text>
<text fill="#8e44ad" font-size="11" text-anchor="middle" x="560" y="358">LLM: Flexible, zero-shot capable</text>
<text fill="#8e44ad" font-size="11" text-anchor="middle" x="560" y="375">but slower and costlier</text>
<!-- Arrow markers -->
<defs>
<lineargradient id="grad_e474ea_f0e6ff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff5ff"></stop><stop offset="100%" stop-color="#f0e6ff"></stop></lineargradient>
<filter height="115%" id="shadow_e474ea" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrow-green" markerheight="6" markerwidth="8" orient="auto" refx="10" refy="3" viewbox="0 0 10 6">
<path d="M0,0 L10,3 L0,6 Z" fill="#27ae60"></path>
</marker>
<marker id="arrow-purple" markerheight="6" markerwidth="8" orient="auto" refx="10" refy="3" viewbox="0 0 10 6">
<path d="M0,0 L10,3 L0,6 Z" fill="#8e44ad"></path>
</marker>
</defs>
</svg>