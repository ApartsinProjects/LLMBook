<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Five legal-LLM compliance rules and how four jurisdictions diverge" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="fig-72-3-1-title fig-72-3-1-desc">
<title id="fig-72-3-1-title">Five legal-LLM compliance rules and how four jurisdictions diverge</title>
<desc id="fig-72-3-1-desc">Grid: rows are five rules (Competence ABA Model Rule 1.1, Supervision ABA Rule 5.3, Disclosure to court, Confidentiality DC Op 388, Billing). Columns are jurisdictions (California 2023, Florida 2024 Op 24-1, Texas 2024, EU AI Act 2024/1689). Cells mark strictness with stars or boxes.</desc>
<rect x="0" y="0" width="760" height="380" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">Five legal-LLM rules x four jurisdictions, mid-2026</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- column headers -->
<rect x="270" y="50" width="115" height="34" fill="#dfeaf5" stroke="#2c5fa0"/>
<text x="327" y="68" text-anchor="middle" font-weight="700" fill="#2c5fa0">California</text>
<text x="327" y="80" text-anchor="middle" font-size="10" fill="#2c5fa0">2023 Guidance</text>

<rect x="390" y="50" width="115" height="34" fill="#dfeaf5" stroke="#2c5fa0"/>
<text x="447" y="68" text-anchor="middle" font-weight="700" fill="#2c5fa0">Florida</text>
<text x="447" y="80" text-anchor="middle" font-size="10" fill="#2c5fa0">2024 Op 24-1</text>

<rect x="510" y="50" width="115" height="34" fill="#dfeaf5" stroke="#2c5fa0"/>
<text x="567" y="68" text-anchor="middle" font-weight="700" fill="#2c5fa0">Texas</text>
<text x="567" y="80" text-anchor="middle" font-size="10" fill="#2c5fa0">2024 guidance</text>

<rect x="630" y="50" width="115" height="34" fill="#dfeaf5" stroke="#2c5fa0"/>
<text x="687" y="68" text-anchor="middle" font-weight="700" fill="#2c5fa0">EU AI Act</text>
<text x="687" y="80" text-anchor="middle" font-size="10" fill="#2c5fa0">2024/1689 high-risk</text>

<!-- row 1: Competence -->
<rect x="20" y="90" width="245" height="50" fill="#fafafe" stroke="#a8b9d4"/>
<text x="30" y="110" font-weight="700" font-size="11">1. Competence</text>
<text x="30" y="126" font-size="10">ABA Model Rule 1.1, Comment 8</text>
<rect x="270" y="90" width="115" height="50" fill="#fff5d6" stroke="#b8860b"/>
<text x="327" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a08">Cautiously permissive</text>
<rect x="390" y="90" width="115" height="50" fill="#f1d6d0" stroke="#b2351e"/>
<text x="447" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#b2351e">Strict</text>
<text x="447" y="128" text-anchor="middle" font-size="10" fill="#b2351e">+ client consent</text>
<rect x="510" y="90" width="115" height="50" fill="#eef5ec" stroke="#1f6f3a"/>
<text x="567" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#1f6f3a">Existing rules suffice</text>
<rect x="630" y="90" width="115" height="50" fill="#f1d6d0" stroke="#b2351e"/>
<text x="687" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#b2351e">High-risk</text>
<text x="687" y="128" text-anchor="middle" font-size="10" fill="#b2351e">CE marking + QMS</text>

<!-- row 2: Supervision -->
<rect x="20" y="145" width="245" height="50" fill="#fafafe" stroke="#a8b9d4"/>
<text x="30" y="165" font-weight="700" font-size="11">2. Supervision</text>
<text x="30" y="181" font-size="10">ABA Rule 5.3 by analogy</text>
<rect x="270" y="145" width="475" height="50" fill="#fff5d6" stroke="#b8860b"/>
<text x="507" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a08">Universal — attorney owns LLM output as if drafted themselves</text>

<!-- row 3: Disclosure -->
<rect x="20" y="200" width="245" height="50" fill="#fafafe" stroke="#a8b9d4"/>
<text x="30" y="220" font-weight="700" font-size="11">3. Court disclosure</text>
<text x="30" y="236" font-size="10">~12 federal judges with std orders</text>
<rect x="270" y="200" width="115" height="50" fill="#fff5d6" stroke="#b8860b"/>
<text x="327" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a08">Per-judge</text>
<rect x="390" y="200" width="115" height="50" fill="#fff5d6" stroke="#b8860b"/>
<text x="447" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a08">Per-judge</text>
<rect x="510" y="200" width="115" height="50" fill="#fff5d6" stroke="#b8860b"/>
<text x="567" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a08">Per-judge</text>
<rect x="630" y="200" width="115" height="50" fill="#f1d6d0" stroke="#b2351e"/>
<text x="687" y="223" text-anchor="middle" font-size="11" font-weight="700" fill="#b2351e">Annex III</text>
<text x="687" y="238" text-anchor="middle" font-size="10" fill="#b2351e">post-market mon.</text>

<!-- row 4: Confidentiality -->
<rect x="20" y="255" width="245" height="50" fill="#fafafe" stroke="#a8b9d4"/>
<text x="30" y="275" font-weight="700" font-size="11">4. Confidentiality</text>
<text x="30" y="291" font-size="10">DC Bar Op 388 (2024)</text>
<rect x="270" y="255" width="475" height="50" fill="#f1d6d0" stroke="#b2351e"/>
<text x="507" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#b2351e">Enterprise SKU only — no-retention, no-training contractual terms required</text>

<!-- row 5: Billing -->
<rect x="20" y="310" width="245" height="50" fill="#fafafe" stroke="#a8b9d4"/>
<text x="30" y="330" font-weight="700" font-size="11">5. Billing for AI-saved time</text>
<text x="30" y="346" font-size="10">Several bars signal discomfort</text>
<rect x="270" y="310" width="475" height="50" fill="#fff5d6" stroke="#b8860b"/>
<text x="507" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a08">Unsettled — varies by jurisdiction and engagement letter</text>
</g>
</svg>