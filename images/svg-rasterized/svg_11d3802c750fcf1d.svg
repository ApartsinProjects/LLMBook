<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three columns showing the three observability pillars adapted to LLMs: metrics, traces, and logs, each with classical-vs-LLM rows" role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="360" y="22">Three pillars, LLM edition: what each one carries</text>
<g transform="translate(20,50)">
<rect fill="#dbeafe" height="210" rx="8" stroke="#3a73a8" stroke-width="1.5" width="220"></rect>
<text fill="#3a73a8" font-size="13" font-weight="600" text-anchor="middle" x="110" y="22">Metrics</text>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="110" y="38">cheap numerical aggregates</text>
<line stroke="#3a73a8" stroke-width="0.8" x1="20" x2="200" y1="50" y2="50"></line>
<text fill="#4a5568" font-size="10" font-weight="600" x="20" y="68">Classical:</text>
<text fill="#2d3748" font-size="9" x="20" y="83">req/s, latency, error rate</text>
<text fill="#4a5568" font-size="10" font-weight="600" x="20" y="105">LLM additions:</text>
<text fill="#2d3748" font-size="9" x="20" y="120">input / output tokens</text>
<text fill="#2d3748" font-size="9" x="20" y="135">cache-hit ratio</text>
<text fill="#2d3748" font-size="9" x="20" y="150">USD per request</text>
<text fill="#2d3748" font-size="9" x="20" y="165">TTFT, inter-token latency</text>
<text fill="#b91c1c" font-size="9" font-weight="600" x="20" y="180">p99/p50 ratio: 10-50x</text>
<text fill="#2d3748" font-size="9" x="20" y="198">(not the 2-3x of REST)</text>
</g>
<g transform="translate(250,50)">
<rect fill="#fef3c7" height="210" rx="8" stroke="#d97706" stroke-width="1.5" width="220"></rect>
<text fill="#d97706" font-size="13" font-weight="600" text-anchor="middle" x="110" y="22">Traces</text>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="110" y="38">per-request causal chains</text>
<line stroke="#d97706" stroke-width="0.8" x1="20" x2="200" y1="50" y2="50"></line>
<text fill="#4a5568" font-size="10" font-weight="600" x="20" y="68">Classical:</text>
<text fill="#2d3748" font-size="9" x="20" y="83">service-to-service hops</text>
<text fill="#4a5568" font-size="10" font-weight="600" x="20" y="105">LLM additions:</text>
<text fill="#2d3748" font-size="9" x="20" y="120">prompt + rendered template</text>
<text fill="#2d3748" font-size="9" x="20" y="135">retrieved chunks</text>
<text fill="#2d3748" font-size="9" x="20" y="150">every tool call + response</text>
<text fill="#2d3748" font-size="9" x="20" y="165">model and version pin</text>
<text fill="#b91c1c" font-size="9" font-weight="600" x="20" y="180">30+ spans per agent turn</text>
<text fill="#2d3748" font-size="9" x="20" y="198">vs 3-5 for a REST call</text>
</g>
<g transform="translate(480,50)">
<rect fill="#d1fae5" height="210" rx="8" stroke="#047857" stroke-width="1.5" width="220"></rect>
<text fill="#047857" font-size="13" font-weight="600" text-anchor="middle" x="110" y="22">Logs</text>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="110" y="38">high-cardinality events</text>
<line stroke="#047857" stroke-width="0.8" x1="20" x2="200" y1="50" y2="50"></line>
<text fill="#4a5568" font-size="10" font-weight="600" x="20" y="68">Classical:</text>
<text fill="#2d3748" font-size="9" x="20" y="83">error stacks, request IDs</text>
<text fill="#4a5568" font-size="10" font-weight="600" x="20" y="105">LLM additions:</text>
<text fill="#2d3748" font-size="9" x="20" y="120">full prompt body</text>
<text fill="#2d3748" font-size="9" x="20" y="135">full completion body</text>
<text fill="#2d3748" font-size="9" x="20" y="150">PII redaction at SDK level</text>
<text fill="#2d3748" font-size="9" x="20" y="165">multi-MB structured fields</text>
<text fill="#b91c1c" font-size="9" font-weight="600" x="20" y="180">line limits matter</text>
<text fill="#2d3748" font-size="9" x="20" y="198">(default loggers will truncate)</text>
</g>
</svg>