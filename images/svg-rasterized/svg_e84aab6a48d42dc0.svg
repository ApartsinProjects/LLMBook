<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="CoT distillation: teach the steps, not just the answer" style="font-family:sans-serif;max-width:100%;height:auto;" viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="220" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="360" y="22">CoT distillation: teach the steps, not just the answer</text>
<g transform="translate(20,46)">
<rect fill="#fff3e0" height="150" rx="8" stroke="#a67c1a" stroke-width="2" width="320"></rect>
<text fill="#a67c1a" font-size="12" font-weight="700" text-anchor="middle" x="160" y="22">Answer-only distillation</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="44">teacher: "What is 17 × 24?"</text>
<text fill="#1a1a2e" font-family="monospace" font-size="11" text-anchor="middle" x="160" y="62">target = "408"</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="86">student loss: −log p_S(408 | q)</text>
<text fill="#a67c1a" font-size="10" font-style="italic" text-anchor="middle" x="160" y="110">Student memorizes mappings;</text>
<text fill="#a67c1a" font-size="10" font-style="italic" text-anchor="middle" x="160" y="124">fails on novel problems.</text>
</g>
<g transform="translate(360,46)">
<rect fill="#e8f5e9" height="150" rx="8" stroke="#2e7d32" stroke-width="2" width="340"></rect>
<text fill="#2e7d32" font-size="12" font-weight="700" text-anchor="middle" x="170" y="22">Chain-of-Thought distillation</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="170" y="44">teacher: "What is 17 × 24?"</text>
<text fill="#1a1a2e" font-family="monospace" font-size="11" text-anchor="middle" x="170" y="62">target = "17×20=340, 17×4=68,</text>
<text fill="#1a1a2e" font-family="monospace" font-size="11" text-anchor="middle" x="170" y="76">340+68=408. Answer: 408"</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="170" y="100">student loss: −log p_S(r, a | q)</text>
<text fill="#2e7d32" font-size="10" font-style="italic" text-anchor="middle" x="170" y="124">Student learns the procedure;</text>
<text fill="#2e7d32" font-size="10" font-style="italic" text-anchor="middle" x="170" y="138">generalizes to unseen problems.</text>
</g>
</svg>