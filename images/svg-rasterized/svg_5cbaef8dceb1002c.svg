<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Stacked horizontal bars comparing the naive sequential voice pipeline that takes 900 milliseconds total against a streaming pipeline that overlaps STT, LLM, and TTS to deliver first audio in 280 milliseconds with total around 600 milliseconds" role="img" style="max-width:100%;height:auto;" viewbox="0 0 760 290" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter height="108%" id="vc401shadow" width="108%" x="-4%" y="-4%">
<fedropshadow dx="1" dy="1" flood-opacity="0.16" stddeviation="1.2"></fedropshadow>
</filter>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="380" y="22">Voice-agent latency budget: sequential vs streaming</text>
<text fill="#4a5568" font-size="11" text-anchor="middle" x="380" y="40">Width in milliseconds; the dashed line marks the 500 ms target for first audio.</text>
<line stroke="#4a5568" stroke-width="0.6" x1="160" x2="160" y1="58" y2="240"></line>
<g fill="#4a5568" font-size="9">
<text text-anchor="middle" x="160" y="252">0</text>
<text text-anchor="middle" x="280" y="252">200</text>
<text text-anchor="middle" x="400" y="252">400</text>
<text text-anchor="middle" x="520" y="252">600</text>
<text text-anchor="middle" x="640" y="252">800</text>
<text text-anchor="middle" x="730" y="252">ms</text>
</g>
<line stroke="#b91c1c" stroke-dasharray="6,3" stroke-width="1" x1="460" x2="460" y1="58" y2="240"></line>
<text fill="#b91c1c" font-size="9" font-weight="700" text-anchor="middle" x="460" y="56">500 ms target</text>
<g transform="translate(0, 80)">
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="end" x="155" y="14">Sequential</text>
<text fill="#4a5568" font-size="9" text-anchor="end" x="155" y="28">total = 900 ms</text>
<rect fill="#3a73a8" filter="url(#vc401shadow)" height="28" rx="3" stroke="#1a4078" stroke-width="0.5" width="120" x="160" y="0"></rect>
<text fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" x="220" y="18">STT 200</text>
<rect fill="#d97706" filter="url(#vc401shadow)" height="28" rx="3" stroke="#9c4f00" stroke-width="0.5" width="300" x="280" y="0"></rect>
<text fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" x="430" y="18">LLM (decode full response) 500</text>
<rect fill="#047857" filter="url(#vc401shadow)" height="28" rx="3" stroke="#024c34" stroke-width="0.5" width="120" x="580" y="0"></rect>
<text fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" x="640" y="18">TTS 200</text>
</g>
<g transform="translate(0, 140)">
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="end" x="155" y="14">Streaming</text>
<text fill="#4a5568" font-size="9" text-anchor="end" x="155" y="28">first audio = 280 ms</text>
<rect fill="#3a73a8" filter="url(#vc401shadow)" height="28" rx="3" stroke="#1a4078" stroke-width="0.5" width="120" x="160" y="0"></rect>
<text fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" x="220" y="18">Streaming STT 200</text>
<rect fill="#d97706" height="20" opacity="0.75" rx="2" width="200" x="220" y="34"></rect>
<text fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" x="320" y="48">LLM tokens (streamed)</text>
<rect fill="#047857" height="20" opacity="0.85" rx="2" width="280" x="280" y="58"></rect>
<text fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" x="420" y="72">TTS overlaps decoding</text>
<circle cx="280" cy="68" fill="#fff" r="5" stroke="#b91c1c" stroke-width="2"></circle>
<text fill="#b91c1c" font-size="9" font-weight="700" text-anchor="middle" x="280" y="92">first audio</text>
</g>
<g fill="#4a5568" font-size="10" transform="translate(0, 230)">
<text x="40" y="0">Key wins: STT and LLM overlap; TTS speaks sentence 1 while LLM decodes sentence 2.</text>
</g>
</g>
</svg>