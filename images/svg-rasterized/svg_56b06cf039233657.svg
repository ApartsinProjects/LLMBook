<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Bootstrap procedure for confidence intervals: original scores are resampled with replacement 10,000 times; metrics computed on each sample form a distribution; 2.5th and 97.5th percentiles bracket the 95% CI." role="img" style="font-family: sans-serif;" viewBox="0 0 750 300" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad3" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow2" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<!-- Original data -->
<rect fill="#1a1a2e" filter="url(#shadow2)" height="50" rx="10" width="140" x="20" y="30"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="90" y="50">Original Scores</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="90" y="68">n = 40 examples</text>
<!-- Arrow -->
<line marker-end="url(#arrowhead2)" stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="160" x2="200" y1="55" y2="55"></line>
<defs><marker id="arrowhead2" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><path d="M0,0 L8,3 L0,6 Z" fill="#999"></path></marker></defs>
<!-- Resample box -->
<rect fill="#8e44ad" filter="url(#shadow2)" height="80" rx="10" width="160" x="200" y="15"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="280" y="38">Resample with</text>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="280" y="55">Replacement</text>
<text fill="#ddd" font-size="11" text-anchor="middle" x="280" y="78">B = 10,000 times</text>
<!-- Arrow -->
<line marker-end="url(#arrowhead2)" stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="360" x2="400" y1="55" y2="55"></line>
<!-- Compute metric -->
<rect fill="#2980b9" filter="url(#shadow2)" height="80" rx="10" width="150" x="400" y="15"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="475" y="38">Compute Metric</text>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="475" y="55">on Each Sample</text>
<text fill="#ddd" font-size="11" text-anchor="middle" x="475" y="78">10,000 estimates</text>
<!-- Arrow -->
<line marker-end="url(#arrowhead2)" stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="550" x2="590" y1="55" y2="55"></line>
<!-- CI result -->
<rect fill="#27ae60" filter="url(#shadow2)" height="80" rx="10" width="145" x="590" y="15"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="662" y="38">Sort &amp; Take</text>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="662" y="55">Percentiles</text>
<text fill="#ddd" font-size="11" text-anchor="middle" x="662" y="78">2.5th, 97.5th</text>
<!-- Histogram illustration -->
<rect fill="white" height="150" rx="8" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="350" x="200" y="130"></rect>
<text fill="#333" font-size="11" font-weight="600" text-anchor="middle" x="375" y="152">Bootstrap Distribution of Accuracy</text>
<!-- Histogram bars -->
<rect fill="#c0d4f5" height="15" width="18" x="245" y="230"></rect>
<rect fill="#c0d4f5" height="27" width="18" x="265" y="218"></rect>
<rect fill="#c0d4f5" height="45" width="18" x="285" y="200"></rect>
<rect fill="#c0d4f5" height="60" width="18" x="305" y="185"></rect>
<rect fill="#8eb8f0" height="73" width="18" x="325" y="172"></rect>
<rect fill="#5b9de8" height="80" width="18" x="345" y="165"></rect>
<rect fill="#2980b9" height="83" width="18" x="365" y="162"></rect>
<rect fill="#5b9de8" height="80" width="18" x="385" y="165"></rect>
<rect fill="#8eb8f0" height="70" width="18" x="405" y="175"></rect>
<rect fill="#c0d4f5" height="53" width="18" x="425" y="192"></rect>
<rect fill="#c0d4f5" height="35" width="18" x="445" y="210"></rect>
<rect fill="#c0d4f5" height="20" width="18" x="465" y="225"></rect>
<rect fill="#c0d4f5" height="10" width="18" x="485" y="235"></rect>
<!-- CI markers -->
<line stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="287" x2="287" y1="250" y2="260"></line>
<line stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="467" x2="467" y1="250" y2="260"></line>
<line stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="287" x2="467" y1="258" y2="258"></line>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="287" y="275">2.5%</text>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="467" y="275">97.5%</text>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="377" y="275">95% CI</text>
</svg>