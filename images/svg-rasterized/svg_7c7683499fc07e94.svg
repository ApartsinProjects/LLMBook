<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="AST architecture: log-mel spectrogram split into overlapping patches, linearly projected, position-embedded, prepended with CLS token, and processed by ViT transformer encoder" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="300" width="800"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="400" y="22">AST: ViT on log-mel spectrogram patches</text>
<defs>
<marker id="astArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
</defs>
<g font-size="10">
<rect fill="#bbdefb" height="80" rx="6" stroke="#1976d2" stroke-width="1.5" width="110" x="20" y="80"></rect>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="75" y="100">Log-mel</text>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="75" y="115">spectrogram</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="75" y="135">128 mels x T</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="75" y="150">10 ms hop</text>
<line marker-end="url(#astArr)" stroke="#666" stroke-width="2" x1="130" x2="158" y1="120" y2="120"></line>
<rect fill="#fff3e0" height="80" rx="6" stroke="#ef6c00" stroke-width="1.5" width="130" x="158" y="80"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="223" y="100">16x16 patches</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="223" y="118">stride 10 in time</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="223" y="132">stride 10 in mel</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="223" y="148">overlap 6 pixels</text>
<line marker-end="url(#astArr)" stroke="#666" stroke-width="2" x1="288" x2="316" y1="120" y2="120"></line>
<rect fill="#c8e6c9" height="80" rx="6" stroke="#2e7d32" stroke-width="1.5" width="140" x="316" y="80"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="386" y="98">Linear projection</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="386" y="116">to 768-dim</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="386" y="132">+ 2D pos embed</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="386" y="148">+ [CLS] token</text>
<line marker-end="url(#astArr)" stroke="#666" stroke-width="2" x1="456" x2="484" y1="120" y2="120"></line>
<rect fill="#e1bee7" height="80" rx="6" stroke="#6a1b9a" stroke-width="1.5" width="140" x="484" y="80"></rect>
<text fill="#4a148c" font-weight="700" text-anchor="middle" x="554" y="100">ViT encoder</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="554" y="118">12 layers</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="554" y="132">12 heads</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="554" y="148">768 hidden</text>
<line marker-end="url(#astArr)" stroke="#666" stroke-width="2" x1="624" x2="652" y1="120" y2="120"></line>
<rect fill="#ffcdd2" height="80" rx="6" stroke="#c62828" stroke-width="1.5" width="130" x="652" y="80"></rect>
<text fill="#b71c1c" font-weight="700" text-anchor="middle" x="717" y="100">Linear head</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="717" y="118">on [CLS]</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="717" y="132">527 logits</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="717" y="148">AudioSet classes</text>
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="middle" x="400" y="200">Architecturally identical to ViT-Base; only the input pipeline differs</text>
<text fill="#5a4a3a" font-size="9.5" text-anchor="middle" x="400" y="220">Pretrained from ImageNet ViT-B/16 weights (DeiT initialization), then fine-tuned on AudioSet</text>
<text fill="#5a4a3a" font-size="9.5" text-anchor="middle" x="400" y="240">A 10s clip at 100 Hz becomes a 128x1000 spectrogram, then ~12x101 = 1212 patches plus [CLS]</text>
</g>
</svg>