<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Nous Psyche timeline: 1B run to 7B run with key milestones" viewBox="-39 0 919 360" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="360" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Decentralized training: from Folding@home (2000) to GPT-4 parity (2027?)</text>
<g transform="translate(60,80)">
<line x1="0" y1="160" x2="760" y2="160" stroke="#1a1a2e" stroke-width="2"/>
<!-- ticks -->
<g font-size="9" fill="#5a4a3a" text-anchor="middle">
<text x="0" y="180">2000</text><line x1="0" y1="155" x2="0" y2="165" stroke="#1a1a2e"/>
<text x="120" y="180">2017</text><line x1="120" y1="155" x2="120" y2="165" stroke="#1a1a2e"/>
<text x="240" y="180">2023</text><line x1="240" y1="155" x2="240" y2="165" stroke="#1a1a2e"/>
<text x="380" y="180">Jan 2025</text><line x1="380" y1="155" x2="380" y2="165" stroke="#1a1a2e"/>
<text x="500" y="180">Nov 2024</text><line x1="500" y1="155" x2="500" y2="165" stroke="#1a1a2e"/>
<text x="620" y="180">Q4 2025</text><line x1="620" y1="155" x2="620" y2="165" stroke="#1a1a2e"/>
<text x="760" y="180">2027 ?</text><line x1="760" y1="155" x2="760" y2="165" stroke="#1a1a2e"/>
</g>
<!-- milestones above and below -->
<g>
<g transform="translate(0,140)">
<rect x="-40" y="-66" width="80" height="60" rx="3" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/>
<text y="-50" font-size="9" font-weight="700" text-anchor="middle" fill="#a67c1a">Folding@home</text>
<text y="-38" font-size="8" text-anchor="middle" fill="#1a1a2e">protein-fold</text>
<text y="-26" font-size="8" text-anchor="middle" fill="#1a1a2e">screensaver</text>
<text y="-14" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">cultural ancestor</text>
</g>
<g transform="translate(120,140)">
<rect x="-46" y="-66" width="92" height="60" rx="3" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/>
<text y="-50" font-size="9" font-weight="700" text-anchor="middle" fill="#a67c1a">Lin et al.</text>
<text y="-38" font-size="8" text-anchor="middle" fill="#1a1a2e">Deep Gradient</text>
<text y="-26" font-size="8" text-anchor="middle" fill="#1a1a2e">Compression</text>
<text y="-14" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">top-k mobile</text>
</g>
<g transform="translate(240,140)">
<rect x="-46" y="-66" width="92" height="60" rx="3" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
<text y="-50" font-size="9" font-weight="700" text-anchor="middle" fill="#1f7a3a">DiLoCo</text>
<text y="-38" font-size="8" text-anchor="middle" fill="#1a1a2e">DeepMind</text>
<text y="-26" font-size="8" text-anchor="middle" fill="#1a1a2e">low-comm</text>
<text y="-14" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">14 GB/step</text>
</g>
<g transform="translate(500,140)">
<rect x="-48" y="-72" width="96" height="66" rx="3" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
<text y="-56" font-size="9" font-weight="700" text-anchor="middle" fill="#1a4078">DeMo v1</text>
<text y="-44" font-size="8" text-anchor="middle" fill="#1a1a2e">Peng &amp; Kingma</text>
<text y="-32" font-size="8" text-anchor="middle" fill="#1a1a2e">arXiv 2411.19870</text>
<text y="-20" font-size="8" font-weight="700" text-anchor="middle" fill="#1a4078">140 MB/step</text>
<text y="-8" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">500-1000&#x00D7;</text>
</g>
</g>
<!-- below -->
<g>
<g transform="translate(380,178)">
<rect x="-48" y="0" width="96" height="60" rx="3" fill="#f0e3f8" stroke="#6a3d8a" stroke-width="2"/>
<text y="16" font-size="9" font-weight="700" text-anchor="middle" fill="#6a3d8a">Psyche launch</text>
<text y="28" font-size="8" text-anchor="middle" fill="#1a1a2e">1B model</text>
<text y="40" font-size="8" text-anchor="middle" fill="#1a1a2e">~300 nodes</text>
<text y="52" font-size="8" font-weight="700" text-anchor="middle" fill="#6a3d8a">-1.5 ppl gap</text>
</g>
<g transform="translate(620,178)">
<rect x="-48" y="0" width="96" height="60" rx="3" fill="#f0e3f8" stroke="#6a3d8a" stroke-width="2"/>
<text y="16" font-size="9" font-weight="700" text-anchor="middle" fill="#6a3d8a">Psyche 7B run</text>
<text y="28" font-size="8" text-anchor="middle" fill="#1a1a2e">DeMo v2</text>
<text y="40" font-size="8" text-anchor="middle" fill="#1a1a2e">SNARK attestation?</text>
<text y="52" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">in flight</text>
</g>
<g transform="translate(760,178)">
<rect x="-72" y="0" width="76" height="60" rx="3" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="2" stroke-dasharray="4,3"/>
<text x="-34" y="16" font-size="9" font-weight="700" text-anchor="middle" fill="#7a2a2a">GPT-4 parity?</text>
<text x="-34" y="28" font-size="8" text-anchor="middle" fill="#1a1a2e">100B+ at &lt;1ppl</text>
<text x="-34" y="40" font-size="8" text-anchor="middle" fill="#1a1a2e">RLHF over net</text>
<text x="-34" y="52" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">open question</text>
</g>
</g>
<!-- compression numbers as labels in time -->
<text x="120" y="118" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">top-k idea</text>
<text x="500" y="118" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">scaled to LLMs</text>
</g>
</svg>