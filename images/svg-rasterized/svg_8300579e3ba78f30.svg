<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Paper-tracking stack: selection rigor vs recency tradeoff across venues" viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="440" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Paper-tracking stack: trade selection rigor against recency</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Match the venue to the question: scan, trust, or decide what to build</text>
<!-- Axes -->
<line x1="80" y1="380" x2="820" y2="380" stroke="#1a1a2e" stroke-width="1.5"/>
<line x1="80" y1="80" x2="80" y2="380" stroke="#1a1a2e" stroke-width="1.5"/>
<text x="440" y="408" font-size="11" text-anchor="middle" fill="#1a1a2e">recency (publication lag)</text>
<text x="35" y="230" font-size="11" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90,35,230)">selection rigor</text>
<!-- x-axis labels -->
<text x="160" y="395" font-size="9" text-anchor="middle" fill="#5a4a3a">same day</text>
<text x="280" y="395" font-size="9" text-anchor="middle" fill="#5a4a3a">24-hour</text>
<text x="400" y="395" font-size="9" text-anchor="middle" fill="#5a4a3a">weeks</text>
<text x="520" y="395" font-size="9" text-anchor="middle" fill="#5a4a3a">6 months</text>
<text x="660" y="395" font-size="9" text-anchor="middle" fill="#5a4a3a">12-18 months</text>
<!-- y-axis labels -->
<text x="68" y="370" font-size="9" text-anchor="end" fill="#5a4a3a">zero</text>
<text x="68" y="260" font-size="9" text-anchor="end" fill="#5a4a3a">curated</text>
<text x="68" y="160" font-size="9" text-anchor="end" fill="#5a4a3a">peer-reviewed</text>
<text x="68" y="95" font-size="9" text-anchor="end" fill="#5a4a3a">proceedings</text>
<!-- Bubbles -->
<g font-size="10">
<circle cx="160" cy="360" r="32" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="160" y="358" font-weight="700" text-anchor="middle" fill="#3d4d8a">arXiv</text>
<text x="160" y="372" font-size="8" text-anchor="middle" fill="#1a1a2e">since 1991</text>
<circle cx="200" cy="320" r="24" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="1.5"/>
<text x="200" y="320" font-size="9" font-weight="700" text-anchor="middle" fill="#3d4d8a">alphaXiv</text>
<text x="200" y="332" font-size="8" text-anchor="middle" fill="#1a1a2e">'24</text>
<circle cx="280" cy="270" r="36" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="280" y="265" font-weight="700" text-anchor="middle" fill="#a67c1a">HF</text>
<text x="280" y="278" font-weight="700" text-anchor="middle" fill="#a67c1a">Papers</text>
<text x="280" y="290" font-size="8" text-anchor="middle" fill="#1a1a2e">~20/day</text>
<circle cx="380" cy="240" r="36" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="380" y="235" font-weight="700" text-anchor="middle" fill="#a67c1a">Papers</text>
<text x="380" y="248" font-weight="700" text-anchor="middle" fill="#a67c1a">with Code</text>
<text x="380" y="260" font-size="8" text-anchor="middle" fill="#1a1a2e">SOTA-by-task</text>
<circle cx="280" cy="150" r="32" fill="#f8e3e3" stroke="#7a2a4a" stroke-width="2"/>
<text x="280" y="146" font-weight="700" text-anchor="middle" fill="#7a2a4a">Lab blogs</text>
<text x="280" y="158" font-size="8" text-anchor="middle" fill="#1a1a2e">Anthropic,</text>
<text x="280" y="170" font-size="8" text-anchor="middle" fill="#1a1a2e">OAI, DM</text>
<circle cx="540" cy="170" r="34" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="540" y="167" font-weight="700" text-anchor="middle" fill="#1f7a3a">OpenReview</text>
<text x="540" y="180" font-size="8" text-anchor="middle" fill="#1a1a2e">ICLR/NeurIPS</text>
<circle cx="700" cy="100" r="40" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
<text x="700" y="95" font-weight="700" text-anchor="middle" fill="#1f7a3a">Proceedings</text>
<text x="700" y="108" font-size="8" text-anchor="middle" fill="#1a1a2e">NeurIPS, ICML,</text>
<text x="700" y="120" font-size="8" text-anchor="middle" fill="#1a1a2e">ICLR</text>
<circle cx="430" cy="350" r="26" fill="#f5e3e8" stroke="#7a2a4a" stroke-width="1.5"/>
<text x="430" y="348" font-size="9" font-weight="700" text-anchor="middle" fill="#7a2a4a">LMArena</text>
<text x="430" y="360" font-size="8" text-anchor="middle" fill="#1a1a2e">human Elo</text>
</g>
<!-- Decision arrows -->
<text x="160" y="60" font-size="10" font-style="italic" fill="#5a4a3a">scan: arXiv</text>
<text x="380" y="60" font-size="10" font-style="italic" fill="#5a4a3a">build: lab posts + replication</text>
<text x="700" y="60" font-size="10" font-style="italic" fill="#5a4a3a">trust: proceedings</text>
</svg>