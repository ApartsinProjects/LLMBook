<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Five co-writing interaction patterns: Continue (AI extends draft for momentum), Brainstorm (AI offers 3-5 options for exploration), Critique (AI identifies strengths and gaps for revision), Style Match (AI adopts user voice), and a fifth pattern in the bottom row." role="img" viewBox="0 -9 720 309" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_9906ac_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_9906ac_fdedec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffcfb"></stop><stop offset="100%" stop-color="#fdedec"></stop></lineargradient>
<lineargradient id="grad_9906ac_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_9906ac" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<!-- Pattern 1: Continue -->
<rect fill="url(#grad_9906ac_e8f4fd)" filter="url(#shadow_9906ac)" height="110" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="200" x="30" y="50"></rect>
<text fill="#2980b9" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="130" y="75">Continue</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="45" y="100">User writes draft</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="45" y="118">AI extends in same voice</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="45" y="136">User edits or accepts</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" x="45" y="150">Best for: momentum</text>
<!-- Pattern 2: Brainstorm -->
<rect fill="#f5eef8" height="110" rx="10" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="200" x="260" y="50"></rect>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="360" y="75">Brainstorm</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="275" y="100">User describes direction</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="275" y="118">AI offers 3-5 options</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="275" y="136">User picks and refines</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" x="275" y="150">Best for: exploration</text>
<!-- Pattern 3: Critique -->
<rect fill="url(#grad_9906ac_fef9e7)" height="110" rx="10" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="200" x="490" y="50"></rect>
<text fill="#e67e22" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="590" y="75">Critique</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="505" y="100">User shares passage</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="505" y="118">AI identifies strengths/gaps</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="505" y="136">User revises with insight</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" x="505" y="150">Best for: revision</text>
<!-- Bottom row -->
<rect fill="#e8f5e9" height="100" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="200" x="145" y="190"></rect>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="245" y="215">Style Match</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="160" y="240">User provides style sample</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="160" y="258">AI analyzes and adopts voice</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="160" y="276">AI writes in user's style</text>
<rect fill="url(#grad_9906ac_fdedec)" height="100" rx="10" stroke="#e74c3c" stroke-linecap="round" stroke-width="2" width="200" x="375" y="190"></rect>
<text fill="#e74c3c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="475" y="215">Transform</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="390" y="240">User provides content</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="390" y="258">AI rewrites in target style</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="390" y="276">Preserves meaning, shifts voice</text>
</svg>