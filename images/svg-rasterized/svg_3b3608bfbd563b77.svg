<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 290" role="img" aria-label="Citation pipeline: generate, then verify" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<defs>
<marker id="arrow-cite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
</marker>
</defs>
<text x="360" y="22" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">Citation pipeline: generate, then verify</text>

<g transform="translate(20,60)">
<rect x="0" y="0" width="160" height="180" rx="8" fill="#f0f9ff" stroke="#0891b2" stroke-width="1.5"/>
<text x="80" y="20" font-size="12" font-weight="600" fill="#0891b2" text-anchor="middle">Retrieved sources</text>
<rect x="12" y="34" width="136" height="34" rx="4" fill="#fff" stroke="#0891b2" stroke-width="1"/>
<text x="20" y="48" font-size="10" fill="#2d3748">[1] Returns: 30 days</text>
<text x="20" y="62" font-size="9" fill="#718096">/docs/returns</text>
<rect x="12" y="76" width="136" height="34" rx="4" fill="#fff" stroke="#0891b2" stroke-width="1"/>
<text x="20" y="90" font-size="10" fill="#2d3748">[2] Warranty: 2 years</text>
<text x="20" y="104" font-size="9" fill="#718096">/docs/warranty</text>
<rect x="12" y="118" width="136" height="34" rx="4" fill="#fff" stroke="#0891b2" stroke-width="1"/>
<text x="20" y="132" font-size="10" fill="#2d3748">[3] Shipping policy</text>
<text x="20" y="146" font-size="9" fill="#718096">/docs/shipping</text>
</g>

<g transform="translate(220,60)">
<rect x="0" y="0" width="200" height="180" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="100" y="20" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">Generation w/ inline cites</text>
<rect x="12" y="34" width="176" height="55" rx="4" fill="#fff" stroke="#d97706" stroke-width="1"/>
<text x="20" y="49" font-size="9" fill="#2d3748">Returns within 30 days [1].</text>
<text x="20" y="63" font-size="9" fill="#2d3748">Electronics carry 2-year</text>
<text x="20" y="77" font-size="9" fill="#2d3748">warranty [2].</text>
<rect x="12" y="98" width="176" height="55" rx="4" fill="#fff" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="20" y="113" font-size="9" fill="#b91c1c">Returns within 90 days</text>
<text x="20" y="127" font-size="9" fill="#b91c1c">[1][2].  Real cites,</text>
<text x="20" y="141" font-size="9" fill="#b91c1c">unsupported claim.</text>
</g>

<g transform="translate(460,60)">
<rect x="0" y="0" width="240" height="180" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
<text x="120" y="20" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">Verifier (NLI / quote match)</text>
<rect x="12" y="34" width="216" height="55" rx="4" fill="#fff" stroke="#047857" stroke-width="1"/>
<text x="20" y="50" font-size="10" font-weight="600" fill="#047857">PASS</text>
<text x="20" y="64" font-size="9" fill="#2d3748">[1] entails "30 days" (NLI=0.94)</text>
<text x="20" y="78" font-size="9" fill="#2d3748">[2] entails "2-year" (NLI=0.91)</text>
<rect x="12" y="98" width="216" height="55" rx="4" fill="#fff" stroke="#b91c1c" stroke-width="1"/>
<text x="20" y="114" font-size="10" font-weight="600" fill="#b91c1c">FAIL</text>
<text x="20" y="128" font-size="9" fill="#2d3748">No chunk contains "90 days"</text>
<text x="20" y="142" font-size="9" fill="#2d3748">action: strip claim or refuse</text>
</g>

<path d="M180,150 L216,150" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-cite)"/>
<path d="M420,150 L456,150" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-cite)"/>

<text x="360" y="270" font-size="10" font-style="italic" fill="#718096" text-anchor="middle">Without the verifier, the bottom row passes a sniff test: real URLs, plausible answer.</text>
</svg>