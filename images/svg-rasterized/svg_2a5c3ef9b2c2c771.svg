<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The tool-economy control loop: meta-planner emits subgoals, router scores tools against a registry while consulting a budget tracker and result cache, then the executor fans out the cheapest viable plan." role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewbox="0 0 820 320" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow-tools" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"></path></marker></defs>
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="410" y="24">A tool-economy control loop: plan, route, budget, dispatch</text>
<rect fill="#e0e7ff" height="50" rx="8" stroke="#4338ca" stroke-width="1.5" width="100" x="20" y="130"></rect><text fill="#2d3748" font-size="11" text-anchor="middle" x="70" y="156">User</text><text fill="#2d3748" font-size="11" text-anchor="middle" x="70" y="170">request</text>
<rect fill="#dbeafe" height="50" rx="8" stroke="#3a73a8" stroke-width="1.5" width="120" x="160" y="130"></rect><text fill="#2d3748" font-size="11" font-weight="600" text-anchor="middle" x="220" y="153">Meta-planner</text>
<rect fill="#fef3c7" height="50" rx="8" stroke="#d97706" stroke-width="1.5" width="120" x="320" y="130"></rect><text fill="#2d3748" font-size="11" font-weight="600" text-anchor="middle" x="380" y="153">Tool router</text><text fill="#4a5568" font-size="9" text-anchor="middle" x="380" y="167">score: cost, latency, P(success)</text>
<rect fill="#f3e8ff" height="45" rx="8" stroke="#7c3aed" stroke-width="1.5" width="120" x="320" y="50"></rect><text fill="#2d3748" font-size="10" font-weight="600" text-anchor="middle" x="380" y="70">Tool registry</text>
<rect fill="#fee2e2" height="45" rx="6" stroke="#b91c1c" stroke-width="1.5" width="58" x="320" y="220"></rect><text fill="#2d3748" font-size="9" font-weight="600" text-anchor="middle" x="349" y="240">Budget</text>
<rect fill="#d1fae5" height="45" rx="6" stroke="#047857" stroke-width="1.5" width="58" x="384" y="220"></rect><text fill="#2d3748" font-size="9" font-weight="600" text-anchor="middle" x="413" y="240">Cache</text>
<rect fill="#cffafe" height="50" rx="8" stroke="#0891b2" stroke-width="1.5" width="120" x="490" y="130"></rect><text fill="#2d3748" font-size="11" font-weight="600" text-anchor="middle" x="550" y="153">Executor</text>
<rect fill="#fce7f3" height="50" rx="8" stroke="#be185d" stroke-width="1.5" width="120" x="490" y="220"></rect><text fill="#2d3748" font-size="11" font-weight="600" text-anchor="middle" x="550" y="243">Synthesizer</text>
<path d="M120,155 L156,155" marker-end="url(#arrow-tools)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M280,155 L316,155" marker-end="url(#arrow-tools)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M440,155 L486,155" marker-end="url(#arrow-tools)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M380,95 L380,126" marker-end="url(#arrow-tools)" stroke="#4a5568" stroke-dasharray="3,3" stroke-width="1.5"></path>
<path d="M550,180 L550,216" marker-end="url(#arrow-tools)" stroke="#4a5568" stroke-width="1.5"></path>
</svg>