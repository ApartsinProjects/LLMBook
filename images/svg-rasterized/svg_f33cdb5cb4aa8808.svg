<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: Encoder-Only vs. Decoder-Only for Embeddings" role="img" viewbox="0 -9 750 309" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_fc26c7_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#E3F2FD"></stop></lineargradient>
<lineargradient id="grad_fc26c7_bbdefb" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#caedff"></stop><stop offset="100%" stop-color="#BBDEFB"></stop></lineargradient>
<lineargradient id="grad_fc26c7_c8e6c9" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d7f5d8"></stop><stop offset="100%" stop-color="#C8E6C9"></stop></lineargradient>
<filter height="115%" id="shadow_fc26c7" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<!-- Encoder side -->
<rect fill="#E8F5E9" filter="url(#shadow_fc26c7)" height="230" rx="10" stroke="#4CAF50" stroke-linecap="round" stroke-width="2" width="320" x="30" y="50"></rect>
<text fill="#2E7D32" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="190" y="78">Encoder-Only (BERT, BGE)</text>
<!-- Bidirectional arrows -->
<rect fill="url(#grad_fc26c7_c8e6c9)" height="35" rx="5" width="260" x="60" y="95"></rect>
<text fill="#1B5E20" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="190" y="118">[CLS] The patient has fever [SEP]</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="190" y="148">Bidirectional attention (all tokens</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="190" y="164">attend to all other tokens)</text>
<!-- CLS pooling -->
<rect fill="#4CAF50" height="30" rx="5" width="140" x="120" y="180"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="190" y="200">[CLS] token = embedding</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="190" y="235">Native fit for embeddings</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="190" y="255">Models: 100M to 400M params</text>
<!-- Decoder side -->
<rect fill="url(#grad_fc26c7_e3f2fd)" height="230" rx="10" stroke="#1976D2" stroke-linecap="round" stroke-width="2" width="320" x="400" y="50"></rect>
<text fill="#1565C0" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="560" y="78">Decoder-Only (Llama, Mistral)</text>
<rect fill="url(#grad_fc26c7_bbdefb)" height="35" rx="5" width="260" x="430" y="95"></rect>
<text fill="#0D47A1" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="560" y="118">The patient has fever &lt;eos&gt;</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="560" y="148">Causal attention (each token</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="560" y="164">attends only to previous tokens)</text>
<!-- Last token pooling -->
<rect fill="#1976D2" height="30" rx="5" width="140" x="490" y="180"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="560" y="200">Last token = embedding</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="560" y="235">Requires adaptation for embeddings</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="560" y="255">Models: 1B to 70B params</text>
</svg>