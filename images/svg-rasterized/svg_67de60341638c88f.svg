<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The six government LLM use cases that shipped reliably by mid-2026, plotted by volume / staff-time savings (horizontal) against due-process / rights-impact risk (vertical)." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="100%" style="max-width:880px;background:#fafafa;border:1px solid #ddd;font-family:sans-serif;">
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle">Six government LLM use cases that ship: scope vs. due-process risk</text>
<line x1="80" y1="320" x2="840" y2="320" stroke="#333" stroke-width="1.5"/>
<line x1="80" y1="60" x2="80" y2="320" stroke="#333" stroke-width="1.5"/>
<text x="460" y="350" font-size="12" text-anchor="middle">Volume / staff-time savings -&gt;</text>
<text x="30" y="190" font-size="12" text-anchor="middle" transform="rotate(-90 30 190)">Due-process / rights-impact risk -&gt;</text>
<text x="72" y="320" font-size="10" text-anchor="end">low</text>
<text x="72" y="60" font-size="10" text-anchor="end">high</text>
<circle cx="180" cy="270" r="40" fill="#27ae60" opacity="0.85"/>
<text x="180" y="266" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Internal</text>
<text x="180" y="280" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">knowledge search</text>
<text x="180" y="294" font-size="9" fill="#fff" text-anchor="middle">VA, NIH, state DMVs</text>
<circle cx="320" cy="250" r="42" fill="#27ae60" opacity="0.85"/>
<text x="320" y="244" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Constituent FAQ</text>
<text x="320" y="258" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">+ triage</text>
<text x="320" y="274" font-size="9" fill="#fff" text-anchor="middle">USA.gov, GOV.UK</text>
<circle cx="460" cy="200" r="42" fill="#f39c12" opacity="0.85"/>
<text x="460" y="194" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Regulatory</text>
<text x="460" y="208" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">drafting</text>
<text x="460" y="224" font-size="9" fill="#fff" text-anchor="middle">Federal Register</text>
<circle cx="600" cy="180" r="44" fill="#f39c12" opacity="0.85"/>
<text x="600" y="174" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">FOIA triage</text>
<text x="600" y="188" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">+ redaction</text>
<text x="600" y="204" font-size="9" fill="#fff" text-anchor="middle">3-5x productivity</text>
<circle cx="540" cy="120" r="42" fill="#c0392b" opacity="0.85"/>
<text x="540" y="114" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Benefits</text>
<text x="540" y="128" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">pre-screening</text>
<text x="540" y="144" font-size="9" fill="#fff" text-anchor="middle">never determinations</text>
<circle cx="700" cy="100" r="40" fill="#c0392b" opacity="0.85"/>
<text x="700" y="94" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Fraud + anomaly</text>
<text x="700" y="108" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">detection</text>
<text x="700" y="124" font-size="9" fill="#fff" text-anchor="middle">Treasury, state UI</text>
<g transform="translate(120,60)" font-size="10">
<rect x="0" y="0" width="12" height="12" fill="#27ae60"/><text x="18" y="10">non-rights-impacting (ships fast)</text>
<rect x="0" y="16" width="12" height="12" fill="#f39c12"/><text x="18" y="26">borderline; impact assessment</text>
<rect x="0" y="32" width="12" height="12" fill="#c0392b"/><text x="18" y="42">rights-impacting; firm human-in-loop</text>
</g>
</svg>