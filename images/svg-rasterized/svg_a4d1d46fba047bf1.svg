<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="DeepSpeed ZeRO and PyTorch FSDP are the same algorithm; differ in surface area" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="240" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="360" y="22">DeepSpeed ZeRO and PyTorch FSDP are the same algorithm; differ in surface area</text>
<g transform="translate(30,50)">
<rect fill="#fff3e0" height="170" rx="8" stroke="#a67c1a" stroke-width="2" width="320"></rect>
<text fill="#a67c1a" font-size="12" font-weight="700" text-anchor="middle" x="160" y="22">DeepSpeed ZeRO (2019)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="46">Entry point: ds_config.json + HF Trainer</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="64">Native: pipeline parallel, MoE (Tutel)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="82">torch.compile: limited (eager hooks)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="100">Knob style: declarative JSON</text>
<text fill="#a67c1a" font-size="10" font-style="italic" text-anchor="middle" x="160" y="130">Best for: HF Trainer recipes, drop-in</text>
<text fill="#a67c1a" font-size="10" font-style="italic" text-anchor="middle" x="160" y="146">use ZeRO when starting from a recipe</text>
</g>
<g transform="translate(370,50)">
<rect fill="#e8f5e9" height="170" rx="8" stroke="#2e7d32" stroke-width="2" width="320"></rect>
<text fill="#2e7d32" font-size="12" font-weight="700" text-anchor="middle" x="160" y="22">PyTorch FSDP / FSDP2 (2022, 2024)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="46">Entry point: accelerate launch --use_fsdp</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="64">Native: DTensor, tensor parallel hybrid</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="82">torch.compile: first-class</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="100">Knob style: Python kwargs</text>
<text fill="#2e7d32" font-size="10" font-style="italic" text-anchor="middle" x="160" y="130">Best for: custom training loops,</text>
<text fill="#2e7d32" font-size="10" font-style="italic" text-anchor="middle" x="160" y="146">deep PyTorch integration, compile</text>
</g>
</svg>