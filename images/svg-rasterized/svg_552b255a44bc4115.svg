<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Bifurcated education LLM market: institution tier vs consumer tier" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="fig-75-5-1-title fig-75-5-1-desc">
<title id="fig-75-5-1-title">Bifurcated education LLM market: institution tier vs consumer tier</title>
<desc id="fig-75-5-1-desc">Two-column layout. Left: Institution tier (FERPA/COPPA). K-12: Khanmigo (500K active), Magic School AI (4M educators, $45M raised). Higher Ed: ChatGPT Edu (ASU, UT, Wharton), Anthropic for Education (Northeastern, LSE, Champlain), MS Education Copilot, Google Workspace for Education. Right: Consumer tier (engagement-focused). Duolingo Max ($540M ARR, 1.5M subscribers @$30/mo), ChatGPT Plus / Gemini Advanced student subs. Bottom: addressable market $7-8B US (K-12 $800B + higher-ed $700B x 0.5%), currently at 20-25% penetration.</desc>
<rect x="0" y="0" width="760" height="380" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">Education LLM market bifurcation, mid-2026</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- left column institution -->
<rect x="20" y="58" width="430" height="280" fill="#dfeaf5" stroke="#2c5fa0" rx="6"/>
<text x="235" y="72" text-anchor="middle" font-weight="700" fill="#2c5fa0">Institution tier (FERPA / COPPA)</text>
<text x="235" y="86" text-anchor="middle" font-size="10" fill="#2c5fa0">~$1.5-2.5B ARR · admin controls + SSO + audit</text>

<!-- K-12 box -->
<rect x="40" y="100" width="195" height="100" fill="#fff" stroke="#2c5fa0"/>
<text x="137" y="118" text-anchor="middle" font-weight="700">K-12</text>
<text x="137" y="134" text-anchor="middle" font-size="10">Magic School AI</text>
<text x="137" y="148" text-anchor="middle" font-size="10">4M educators, $45M raised</text>
<text x="137" y="166" text-anchor="middle" font-size="10">Khanmigo (501c3)</text>
<text x="137" y="180" text-anchor="middle" font-size="10">500K active, $80M rev</text>
<text x="137" y="194" text-anchor="middle" font-size="10">+ Microsoft Ed Copilot</text>

<!-- Higher Ed box -->
<rect x="245" y="100" width="195" height="100" fill="#fff" stroke="#2c5fa0"/>
<text x="342" y="118" text-anchor="middle" font-weight="700">Higher Ed</text>
<text x="342" y="134" text-anchor="middle" font-size="10">ChatGPT Edu — ASU, UT, Wharton</text>
<text x="342" y="148" text-anchor="middle" font-size="10">Anthropic for Education —</text>
<text x="342" y="162" text-anchor="middle" font-size="10">Northeastern (28K), LSE, Champlain</text>
<text x="342" y="178" text-anchor="middle" font-size="10">Google Workspace for Ed</text>
<text x="342" y="192" text-anchor="middle" font-size="10">Pearson, McGraw-Hill, Cengage</text>

<!-- GTM motion note -->
<rect x="40" y="210" width="400" height="40" fill="#eaf1ff" stroke="#2c5fa0"/>
<text x="240" y="228" text-anchor="middle" font-weight="700" fill="#2c5fa0">GTM: institutional procurement</text>
<text x="240" y="244" text-anchor="middle" font-size="10" fill="#2c5fa0">$5-15/student (K-12) · $15-30/student (higher-ed) · 6-12mo sales cycle</text>

<!-- right column consumer -->
<rect x="470" y="50" width="270" height="280" fill="#eef5ec" stroke="#1f6f3a" rx="6"/>
<text x="605" y="72" text-anchor="middle" font-weight="700" fill="#1f6f3a">Consumer tier</text>
<text x="605" y="86" text-anchor="middle" font-size="10" fill="#1f6f3a">engagement + conversion</text>

<rect x="490" y="100" width="230" height="100" fill="#fff" stroke="#1f6f3a"/>
<text x="605" y="120" text-anchor="middle" font-weight="700">Duolingo Max</text>
<text x="605" y="138" text-anchor="middle" font-size="10">1.5M+ subscribers @ $30/mo</text>
<text x="605" y="154" text-anchor="middle" font-size="10" fill="#1f6f3a" font-weight="700">~$540M ARR</text>
<text x="605" y="172" text-anchor="middle" font-size="10">GPT-4 powered, 40+ languages</text>
<text x="605" y="186" text-anchor="middle" font-size="10">role-play + explainer</text>

<rect x="490" y="210" width="230" height="40" fill="#eef5ec" stroke="#1f6f3a"/>
<text x="605" y="226" text-anchor="middle" font-weight="700" fill="#1f6f3a">+ ChatGPT Plus, Gemini Advanced</text>
<text x="605" y="244" text-anchor="middle" font-size="10" fill="#1f6f3a">student subscriptions, no FERPA</text>

<!-- bottom market sizing -->
<rect x="20" y="295" width="720" height="60" fill="#fff5d6" stroke="#b8860b" rx="4"/>
<text x="380" y="316" text-anchor="middle" font-weight="700" fill="#7a5a08">U.S. addressable market: $7-8B (0.5% of $800B K-12 + $700B higher-ed spend)</text>
<text x="380" y="333" text-anchor="middle" font-size="11">2026 penetration: ~20-25% · YoY growth: 80-120%</text>
<text x="380" y="350" text-anchor="middle" font-size="10" font-style="italic">Vendors that try to serve both tiers build two distinct products (different GTM motions)</text>
</g>
</svg>