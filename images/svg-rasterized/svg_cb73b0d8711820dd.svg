<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Qwen-VL architecture: native-resolution ViT with 2D RoPE feeds a cross-attention adapter and a Qwen LLM that can emit bounding box tokens as part of text output" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 820 280" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="280" width="820"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="410" y="22">Qwen2.5-VL: native-resolution ViT + cross-attention adapter + grounding-aware Qwen LLM</text>
<defs>
<marker id="qvArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
</defs>
<g font-size="10">
<rect fill="#bbdefb" height="70" rx="8" stroke="#1976d2" stroke-width="1.5" width="120" x="20" y="80"></rect>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="80" y="100">Image</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="80" y="115">arbitrary resolution</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="80" y="130">no resize/tiling</text>
<line marker-end="url(#qvArr)" stroke="#666" stroke-width="2" x1="140" x2="168" y1="115" y2="115"></line>
<rect fill="#fff3e0" height="70" rx="8" stroke="#ef6c00" stroke-width="1.5" width="140" x="168" y="80"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="238" y="100">Native ViT</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="238" y="115">2D-RoPE positions</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="238" y="130">window attention</text>
<line marker-end="url(#qvArr)" stroke="#666" stroke-width="2" x1="308" x2="336" y1="115" y2="115"></line>
<rect fill="#c8e6c9" height="70" rx="8" stroke="#2e7d32" stroke-width="1.5" width="140" x="336" y="80"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="406" y="98">Cross-attention</text>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="406" y="115">adapter</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="406" y="132">256 learned queries</text>
<line marker-end="url(#qvArr)" stroke="#666" stroke-width="2" x1="476" x2="504" y1="115" y2="115"></line>
<rect fill="#e1bee7" height="70" rx="8" stroke="#6a1b9a" stroke-width="1.5" width="140" x="504" y="80"></rect>
<text fill="#4a148c" font-weight="700" text-anchor="middle" x="574" y="98">Qwen LLM</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="574" y="115">1.5B / 7B / 72B</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="574" y="132">29 languages</text>
<line marker-end="url(#qvArr)" stroke="#666" stroke-width="2" x1="644" x2="672" y1="115" y2="115"></line>
<rect fill="#ffcdd2" height="70" rx="8" stroke="#c62828" stroke-width="1.5" width="130" x="672" y="80"></rect>
<text fill="#b71c1c" font-weight="700" text-anchor="middle" x="737" y="98">Text + boxes</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="737" y="118">&lt;box&gt;x1,y1,x2,y2&lt;/box&gt;</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="737" y="132">inline grounding</text>
<text fill="#1a1a2e" font-size="10.5" font-weight="700" text-anchor="middle" x="410" y="200">Native-resolution ViT replaces LLaVA-NeXT tiling; 2D-RoPE generalizes to any aspect ratio</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="410" y="220">Cross-attention adapter compresses variable patch count to a fixed 256 visual tokens for the LLM</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="410" y="240">Grounding head is just text: LLM emits coordinate tokens during normal autoregression</text>
</g>
</svg>