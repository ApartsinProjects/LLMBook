<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;" aria-label="Linear RoPE scaling (s=2): squeeze new positions into the training range">
<rect width="720" height="240" fill="#ffffff"/>
<text x="360" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Linear RoPE scaling (s=2): squeeze new positions into the training range</text>
<g transform="translate(40,60)">
<text x="0" y="0" font-size="11" font-weight="700" fill="#1565c0">Training range (pretrained, 4K positions)</text>
<line x1="0" y1="20" x2="540" y2="20" stroke="#1976d2" stroke-width="3"/>
<g font-size="9" text-anchor="middle">
<text x="0" y="40" fill="#1565c0">m=0</text>
<text x="180" y="40" fill="#1565c0">m=1365</text>
<text x="360" y="40" fill="#1565c0">m=2730</text>
<text x="540" y="40" fill="#1565c0">m=4095</text>
</g>
</g>
<g transform="translate(40,130)">
<text x="0" y="0" font-size="11" font-weight="700" fill="#a67c1a">Inference range (extended 8K positions, scaled by m/s)</text>
<line x1="0" y1="20" x2="540" y2="20" stroke="#a67c1a" stroke-width="3" stroke-dasharray="6,3"/>
<g font-size="9" text-anchor="middle">
<text x="0" y="40" fill="#a67c1a">m=0</text>
<text x="135" y="40" fill="#a67c1a">m=2048</text>
<text x="270" y="40" fill="#a67c1a">m=4096</text>
<text x="405" y="40" fill="#a67c1a">m=6144</text>
<text x="540" y="40" fill="#a67c1a">m=8191</text>
</g>
<text x="270" y="68" font-size="10" text-anchor="middle" font-style="italic" fill="#666">effective rotation angle is m / s &#183; &#969;&#7522;, so position 8191 maps to training-angle 4095.5</text>
</g>
</svg>