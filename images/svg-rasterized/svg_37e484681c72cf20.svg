<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The four scripting patterns every LLM project uses" aria-labelledby="fig52btitle" role="img" style="max-width:939px;width:100%;height:auto;background:#fafafa;border-radius:8px;" viewBox="0 0 939 360" xmlns="http://www.w3.org/2000/svg">
<title id="fig52btitle">The four scripting patterns every LLM project uses</title>
<defs>
<marker id="arr52b" markerheight="10" markerunits="strokeWidth" markerwidth="10" orient="auto" refx="9" refy="5">
<path d="M0,0 L10,5 L0,10 z" fill="#444"></path>
</marker>
</defs>
<text fill="#222" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" x="380" y="24">Four patterns that show up in every Part I script</text>
<g font-family="Georgia, serif" font-size="11">
<rect fill="#e8f1fb" height="120" rx="8" stroke="#1f77b4" width="170" x="20" y="60"></rect>
<text fill="#1f77b4" font-size="12" font-weight="bold" text-anchor="middle" x="105" y="84">1. Load with device map</text>
<text fill="#444" text-anchor="middle" x="105" y="106">AutoModelForCausalLM</text>
<text fill="#444" text-anchor="middle" x="105" y="122">.from_pretrained(...)</text>
<text fill="#444" text-anchor="middle" x="105" y="144">device_map="auto"</text>
<text fill="#444" text-anchor="middle" x="105" y="160">load_in_4bit=True</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="105" y="176">7B in ~4 GB VRAM</text>
<rect fill="#e9f7e9" height="120" rx="8" stroke="#2ca02c" width="170" x="200" y="60"></rect>
<text fill="#2ca02c" font-size="12" font-weight="bold" text-anchor="middle" x="285" y="84">2. Chat template</text>
<text fill="#444" text-anchor="middle" x="285" y="106">apply_chat_template(</text>
<text fill="#444" text-anchor="middle" x="285" y="122">[{role, content}, ...])</text>
<text fill="#444" text-anchor="middle" x="285" y="144">model.generate(</text>
<text fill="#444" text-anchor="middle" x="285" y="160">temperature=0.7)</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="285" y="176">multi-turn dialog</text>
<rect fill="#fff5d9" height="120" rx="8" stroke="#cc8400" width="170" x="380" y="60"></rect>
<text fill="#cc8400" font-size="12" font-weight="bold" text-anchor="middle" x="465" y="84">3. Batch via DataLoader</text>
<text fill="#444" text-anchor="middle" x="465" y="106">dataset.map(tokenize,</text>
<text fill="#444" text-anchor="middle" x="465" y="122">batched=True)</text>
<text fill="#444" text-anchor="middle" x="465" y="144">DataLoader(...,</text>
<text fill="#444" text-anchor="middle" x="465" y="160">batch_size=16)</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="465" y="176">throughput &gt; latency</text>
<rect fill="#fde9e9" height="120" rx="8" stroke="#d62728" width="180" x="560" y="60"></rect>
<text fill="#d62728" font-size="12" font-weight="bold" text-anchor="middle" x="650" y="84">4. API call with retries</text>
<text fill="#444" text-anchor="middle" x="650" y="106">tenacity.retry on</text>
<text fill="#444" text-anchor="middle" x="650" y="122">429 / 5xx / timeout</text>
<text fill="#444" text-anchor="middle" x="650" y="144">exponential backoff</text>
<text fill="#444" text-anchor="middle" x="650" y="160">+ jitter</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="650" y="176">production reality</text>
<line marker-end="url(#arr52b)" stroke="#444" stroke-width="2" x1="190" x2="200" y1="120" y2="120"></line>
<line marker-end="url(#arr52b)" stroke="#444" stroke-width="2" x1="370" x2="380" y1="120" y2="120"></line>
<line marker-end="url(#arr52b)" stroke="#444" stroke-width="2" x1="550" x2="560" y1="120" y2="120"></line>
<rect fill="#fff" height="110" rx="8" stroke="#444" width="720" x="20" y="220"></rect>
<text fill="#222" font-weight="bold" x="40" y="245">Verifying the stack is healthy:</text>
<text fill="#444" font-family="Consolas, monospace" font-size="11" x="40" y="266">torch.__version__ → 2.6+   ·   torch.cuda.is_available() → True   ·   torch.cuda.get_device_name() → "NVIDIA RTX 2060"</text>
<text fill="#444" font-family="Consolas, monospace" font-size="11" x="40" y="285">transformers.__version__ → 4.50+   ·   nvidia-smi shows expected VRAM   ·   a dummy 1-step forward runs without OOM</text>
<text fill="#444" font-style="italic" x="40" y="308">If any of these prints the wrong thing, your CUDA toolkit and PyTorch wheel are mismatched.</text>
<text fill="#444" font-style="italic" x="40" y="324">Re-pin the PyTorch wheel index URL to match the CUDA version reported by `nvidia-smi` and reinstall.</text>
</g>
</svg>