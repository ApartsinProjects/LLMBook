<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: The LLM Reproducibility Stack" role="img" style="font-family: sans-serif;" viewBox="0 -9 780 309" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow7" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<!-- Stack layers (bottom to top) -->
<rect fill="#34495e" filter="url(#shadow7)" height="45" rx="8" width="500" x="100" y="240"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="350" y="260">Infrastructure</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="350" y="276">Docker, GPU type, API region</text>
<rect fill="#2c3e50" filter="url(#shadow7)" height="45" rx="8" width="500" x="100" y="190"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="350" y="210">Code + Dependencies</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="350" y="226">Git SHA, requirements.txt, library versions</text>
<rect fill="#2980b9" filter="url(#shadow7)" height="45" rx="8" width="500" x="100" y="140"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="350" y="160">Data + Embeddings</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="350" y="176">DVC hash, embedding model version, index snapshot</text>
<rect fill="#8e44ad" filter="url(#shadow7)" height="45" rx="8" width="500" x="100" y="90"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="350" y="110">Model Configuration</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="350" y="126">Provider, model version, temperature, seed, system_fingerprint</text>
<rect fill="#e74c3c" filter="url(#shadow7)" height="45" rx="8" width="500" x="100" y="40"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="350" y="60">Prompts + Few-Shot Examples</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="350" y="76">Template version, variable bindings, tool schemas</text>
<!-- Control annotations -->
<text fill="#e74c3c" font-size="11" font-weight="600" x="650" y="65">Full control</text>
<text fill="#8e44ad" font-size="11" font-weight="600" x="650" y="115">Partial control</text>
<text fill="#2980b9" font-size="11" font-weight="600" x="650" y="165">Full control</text>
<text fill="#2c3e50" font-size="11" font-weight="600" x="650" y="215">Full control</text>
<text fill="#34495e" font-size="11" font-weight="600" x="650" y="265">Full control</text>
</svg>