<!-- Common principles -->
<rect fill="url(#grad_067e90_f5f5f5)" height="120" rx="6" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="620" x="40" y="125"></rect>
<text fill="#333" font-size="13" font-weight="bold" text-anchor="middle" x="350" y="150">Common Design Principles</text>
<text fill="#555" font-size="11" x="70" y="175">1. Chain-of-Thought: train on reasoning traces, not just final answers</text>
<text fill="#555" font-size="11" x="70" y="195">2. Data quality: curated, diverse, challenging prompts yield better students</text>
<text fill="#555" font-size="11" x="70" y="215">3. Scale of data: hundreds of thousands to millions of teacher examples</text>
<text fill="#555" font-size="11" x="70" y="235">4. System prompts: instruct teacher to explain, reason, and show work</text>
</svg>