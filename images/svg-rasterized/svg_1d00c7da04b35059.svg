<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Four-axis decision framework for picking a chat model: quality (arena Elo), latency and modality, cost and deployment options, and safety and policy controls, with concrete vendor and benchmark examples in each quadrant" role="img" style="display:block;margin:1.2em auto;max-width:760px;width:100%;height:auto;" viewbox="0 0 875 340" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="340" rx="6" width="720" x="0" y="0"></rect>
<text font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="360" y="26">Picking a chat model: four axes</text>
<g font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle">
<rect fill="#3498db" height="76" rx="6" width="280" x="40" y="56"></rect>
<text fill="#fff" font-weight="700" x="180" y="80">Axis 1: Quality</text>
<text fill="#fff" x="180" y="98">Arena Elo in your language;</text>
<text fill="#fff" x="180" y="114">MT-Bench / AlpacaEval as proxy.</text>
<rect fill="#27ae60" height="76" rx="6" width="280" x="400" y="56"></rect>
<text fill="#fff" font-weight="700" x="540" y="80">Axis 2: Latency &amp; modality</text>
<text fill="#fff" x="540" y="98">Voice-aware? Streaming?</text>
<text fill="#fff" x="540" y="114">Time-to-first-token budget.</text>
<rect fill="#6a1b9a" height="76" rx="6" width="280" x="40" y="152"></rect>
<text fill="#fff" font-weight="700" x="180" y="176">Axis 3: Openness</text>
<text fill="#fff" x="180" y="194">Open weights vs API;</text>
<text fill="#fff" x="180" y="210">data residency, fine-tuning.</text>
<rect fill="#a67c1a" height="76" rx="6" width="280" x="400" y="152"></rect>
<text fill="#fff" font-weight="700" x="540" y="176">Axis 4: Persona vs assistant</text>
<text fill="#fff" x="540" y="194">Companion / character tuning</text>
<text fill="#fff" x="540" y="210">vs helpful-assistant tuning.</text>
<rect fill="none" height="80" rx="6" stroke="#3498db" stroke-dasharray="4,3" stroke-width="1.5" width="640" x="40" y="240"></rect>
<text fill="#3498db" font-weight="700" text-anchor="middle" x="360" y="266">Production rule of thumb: pick the cheapest model on the next tier up,</text>
<text fill="#3498db" text-anchor="middle" x="360" y="284">test it on your own evals, swap up or down by axis as needed.</text>
<text fill="#666" font-size="10" text-anchor="middle" x="360" y="308">Most "we should use Opus" defaults are wrong; most "we'll just use Llama-3-8B" defaults are also wrong.</text>
</g>
</svg>