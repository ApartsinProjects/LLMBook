<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="LLM testing pyramid: fast deterministic unit tests with mocked LLM at the wide base, real-API integration tests on a curated set in the middle, slow adversarial and red-team tests at the narrow top." role="img" style="font-family: sans-serif;" viewBox="0 -9 700 329" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad3" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow4" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<!-- Adversarial (top) -->
<polygon fill="#e74c3c" filter="url(#shadow4)" points="350,50 430,120 270,120"></polygon>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="350" y="100">Adversarial</text>
<!-- Integration (middle) -->
<polygon fill="#f39c12" filter="url(#shadow4)" points="270,125 430,125 480,195 220,195"></polygon>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="350" y="165">Integration Tests</text>
<!-- Unit (base) -->
<polygon fill="#27ae60" filter="url(#shadow4)" points="220,200 480,200 540,270 160,270"></polygon>
<text fill="white" font-size="13" font-weight="600" text-anchor="middle" x="350" y="240">Unit Tests (Mocked LLM)</text>
<!-- Labels on right -->
<text fill="#e74c3c" font-size="11" font-weight="600" x="500" y="95">Slow, expensive</text>
<text fill="#e74c3c" font-size="11" x="500" y="110">Red team, prompt injection</text>
<text fill="#f39c12" font-size="11" font-weight="600" x="500" y="160">Moderate speed</text>
<text fill="#f39c12" font-size="11" x="500" y="175">Real API calls, curated set</text>
<text fill="#27ae60" font-size="11" font-weight="600" x="500" y="235">Fast, deterministic</text>
<text fill="#27ae60" font-size="11" x="500" y="250">Mocked responses, many cases</text>
<!-- Speed arrow -->
<line marker-end="url(#arrowhead4)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="140" x2="140" y1="70" y2="260"></line>
<defs><marker id="arrowhead4" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><path d="M0,0 L8,3 L0,6 Z" fill="#888"></path></marker></defs>
<text fill="#888" font-size="11" text-anchor="end" transform="rotate(-90 130 165)" x="130" y="165">Speed &amp; Volume →</text>
</svg>