<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="RAG-Fusion pipeline: the user question is expanded into n paraphrases by an LLM, each paraphrase runs an independent vector search to produce its own ranked list of chunks, and reciprocal rank fusion combines the n lists into a single ranking that promotes chunks appearing in multiple lists." role="img" viewbox="0 0 780 320" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="310" rx="10" stroke="#ddd" width="770" x="5" y="5"></rect>
<rect fill="#e3f2fd" height="50" rx="6" stroke="#1565c0" width="170" x="25" y="135"></rect>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="110" y="158">User question</text>
<text fill="#1565c0" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="110" y="175">"rollback failed deploy?"</text>
<rect fill="#fff3e0" height="50" rx="6" stroke="#e65100" width="160" x="225" y="135"></rect>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="305" y="158">LLM expander</text>
<text fill="#e65100" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="305" y="175">n paraphrases</text>
<rect fill="#f3e5f5" height="36" rx="4" stroke="#7b1fa2" width="170" x="415" y="60"></rect>
<text fill="#4a148c" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="500" y="80">q1: "undo a bad release"</text>
<rect fill="#f3e5f5" height="36" rx="4" stroke="#7b1fa2" width="170" x="415" y="105"></rect>
<text fill="#4a148c" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="500" y="125">q2: "revert canary push"</text>
<rect fill="#f3e5f5" height="36" rx="4" stroke="#7b1fa2" width="170" x="415" y="150"></rect>
<text fill="#4a148c" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="500" y="170">q3: "rollback k8s deploy"</text>
<rect fill="#f3e5f5" height="36" rx="4" stroke="#7b1fa2" width="170" x="415" y="195"></rect>
<text fill="#4a148c" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="500" y="215">qn: "feature-flag kill"</text>
<rect fill="#e8f5e9" height="36" rx="4" stroke="#2e7d32" width="80" x="605" y="60"></rect>
<text fill="#1b5e20" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="645" y="82">L1: A,C,F</text>
<rect fill="#e8f5e9" height="36" rx="4" stroke="#2e7d32" width="80" x="605" y="105"></rect>
<text fill="#1b5e20" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="645" y="127">L2: B,A,D</text>
<rect fill="#e8f5e9" height="36" rx="4" stroke="#2e7d32" width="80" x="605" y="150"></rect>
<text fill="#1b5e20" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="645" y="172">L3: A,B,E</text>
<rect fill="#e8f5e9" height="36" rx="4" stroke="#2e7d32" width="80" x="605" y="195"></rect>
<text fill="#1b5e20" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="645" y="217">Ln: D,A,G</text>
<rect fill="#fce4ec" height="60" rx="8" stroke="#c62828" stroke-width="1.5" width="200" x="290" y="240"></rect>
<text fill="#b71c1c" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="390" y="263">Reciprocal Rank Fusion</text>
<text fill="#c62828" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="390" y="282">score(d) = sum_i 1/(60 + rank_i(d))</text>
<rect fill="#fff" height="60" rx="6" stroke="#888" width="200" x="525" y="240"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="625" y="265">Fused top-k</text>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="625" y="285">A &gt; B &gt; D &gt; ...</text>
<g fill="none" stroke="#555" stroke-width="1.5">
<line x1="195" x2="223" y1="160" y2="160"></line>
<polygon fill="#555" points="223 160, 217 157, 217 163"></polygon>
<line x1="385" x2="413" y1="148" y2="78"></line>
<line x1="385" x2="413" y1="155" y2="123"></line>
<line x1="385" x2="413" y1="162" y2="168"></line>
<line x1="385" x2="413" y1="170" y2="213"></line>
<line x1="585" x2="603" y1="78" y2="78"></line>
<line x1="585" x2="603" y1="123" y2="123"></line>
<line x1="585" x2="603" y1="168" y2="168"></line>
<line x1="585" x2="603" y1="213" y2="213"></line>
<line x1="645" x2="380" y1="231" y2="240"></line>
<line x1="490" x2="523" y1="270" y2="270"></line>
<polygon fill="#555" points="523 270, 517 267, 517 273"></polygon>
</g>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="25" y="40">n vector searches in parallel; consensus chunks rise to the top</text>
</svg>