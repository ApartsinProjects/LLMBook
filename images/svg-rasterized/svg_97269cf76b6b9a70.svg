<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Conversational AI evaluation pyramid" role="img" style="display:block;margin:1.2em auto;max-width:760px;width:100%;height:auto;" viewbox="0 0 762 360" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="360" rx="6" width="720" x="0" y="0"></rect>
<text font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="360" y="26">A 2026 conversational AI evaluation pyramid</text>
<g font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle">
<polygon fill="#3498db" points="240,60 480,60 460,100 260,100"></polygon>
<text fill="#fff" font-weight="700" x="360" y="78">Public benchmarks</text>
<text fill="#fff" x="360" y="92">MT-Bench, Arena, AlpacaEval</text>
<polygon fill="#27ae60" points="220,110 500,110 480,160 240,160"></polygon>
<text fill="#fff" font-weight="700" x="360" y="130">Vendor / community evals</text>
<text fill="#fff" x="360" y="146">OpenAI evals, Anthropic evals, HELM</text>
<polygon fill="#6a1b9a" points="200,170 520,170 500,220 220,220"></polygon>
<text fill="#fff" font-weight="700" x="360" y="190">Domain-specific evals</text>
<text fill="#fff" x="360" y="206">MultiWOZ for TOD, RAGAS for retrieval</text>
<polygon fill="#a67c1a" points="180,230 540,230 520,280 200,280"></polygon>
<text fill="#fff" font-weight="700" x="360" y="250">Your internal eval (held-out)</text>
<text fill="#fff" x="360" y="266">200-500 hand-graded conversations</text>
<polygon fill="#bf360c" points="160,290 560,290 540,340 180,340"></polygon>
<text fill="#fff" font-weight="700" x="360" y="310">Production observation</text>
<text fill="#fff" x="360" y="326">Live user feedback, thumbs-up/down, escalations</text>
</g>
</svg>