<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="CrewAI versus AutoGen role-based architectures with task pipeline and group-chat topologies" role="img" viewbox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="raArrow" markerheight="10" markerwidth="10" orient="auto" refx="8" refy="3">
<path d="M0,0 L0,6 L8,3 z" fill="#3a4a7a"></path>
</marker>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="360" y="22">Two role-based topologies: CrewAI tasks vs. AutoGen group chat</text>
<g>
<text fill="#3a73a8" font-size="12" font-weight="700" text-anchor="middle" x="180" y="50">CrewAI (sequential / hierarchical tasks)</text>
<rect fill="#e3f2fd" height="46" rx="6" stroke="#3a73a8" stroke-width="2" width="120" x="40" y="70"></rect>
<text font-size="11" font-weight="700" text-anchor="middle" x="100" y="90">Researcher</text>
<text fill="#2a3a5a" font-size="9" text-anchor="middle" x="100" y="106">role+goal+tools</text>
<rect fill="#e3f2fd" height="46" rx="6" stroke="#3a73a8" stroke-width="2" width="120" x="200" y="70"></rect>
<text font-size="11" font-weight="700" text-anchor="middle" x="260" y="90">Writer</text>
<text fill="#2a3a5a" font-size="9" text-anchor="middle" x="260" y="106">role+goal</text>
<line marker-end="url(#raArrow)" stroke="#3a4a7a" stroke-width="2" x1="160" x2="200" y1="93" y2="93"></line>
<rect fill="#fff8e1" height="34" rx="6" stroke="#d97706" stroke-width="1.5" width="280" x="40" y="140"></rect>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="180" y="161">Tasks: research_task -&gt; writing_task (declarative)</text>
<rect fill="#e8f5e9" height="34" rx="6" stroke="#047857" stroke-width="1.5" width="280" x="40" y="190"></rect>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="180" y="211">Crew.kickoff() orchestrates the pipeline</text>
</g>
<g>
<text fill="#b03060" font-size="12" font-weight="700" text-anchor="middle" x="540" y="50">AutoGen (group chat / nested chats)</text>
<rect fill="#fce4ec" height="34" rx="6" stroke="#b03060" stroke-width="2" width="100" x="460" y="70"></rect>
<text font-size="11" font-weight="700" text-anchor="middle" x="510" y="92">UserProxy</text>
<rect fill="#fce4ec" height="34" rx="6" stroke="#b03060" stroke-width="2" width="100" x="580" y="70"></rect>
<text font-size="11" font-weight="700" text-anchor="middle" x="630" y="92">Assistant</text>
<rect fill="#fce4ec" height="34" rx="6" stroke="#b03060" stroke-width="2" width="100" x="460" y="120"></rect>
<text font-size="11" font-weight="700" text-anchor="middle" x="510" y="142">Coder</text>
<rect fill="#fce4ec" height="34" rx="6" stroke="#b03060" stroke-width="2" width="100" x="580" y="120"></rect>
<text font-size="11" font-weight="700" text-anchor="middle" x="630" y="142">Critic</text>
<circle cx="570" cy="195" fill="#fff" r="22" stroke="#b03060" stroke-width="2"></circle>
<text fill="#5a2a3a" font-size="10" font-weight="700" text-anchor="middle" x="570" y="199">Manager</text>
<line stroke="#b03060" stroke-width="1.2" x1="510" x2="560" y1="104" y2="178"></line>
<line stroke="#b03060" stroke-width="1.2" x1="630" x2="585" y1="104" y2="178"></line>
<line stroke="#b03060" stroke-width="1.2" x1="510" x2="560" y1="154" y2="180"></line>
<line stroke="#b03060" stroke-width="1.2" x1="630" x2="585" y1="154" y2="180"></line>
<text fill="#5a2a3a" font-size="10" text-anchor="middle" x="570" y="240">GroupChatManager routes turns</text>
</g>
<line stroke="#bbb" stroke-dasharray="4 4" x1="370" x2="370" y1="60" y2="250"></line>
</g>
</svg>