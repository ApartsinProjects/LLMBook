<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three retrieval-model architectures" role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewbox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow-embed" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"></path>
</marker>
</defs>
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="360" y="22">Three retrieval-model architectures</text>
<g transform="translate(20,55)">
<rect fill="#dbeafe" height="270" rx="8" stroke="#3a73a8" stroke-width="1.5" width="220"></rect>
<text fill="#3a73a8" font-size="12" font-weight="600" text-anchor="middle" x="110" y="22">Bi-encoder</text>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="110" y="38">DPR, BGE, E5, Gemini, OpenAI</text>
<rect fill="#fff" height="22" rx="3" stroke="#3a73a8" width="80" x="20" y="55"></rect>
<text fill="#2d3748" font-size="9" text-anchor="middle" x="60" y="69">query</text>
<rect fill="#fff" height="22" rx="3" stroke="#3a73a8" width="80" x="120" y="55"></rect>
<text fill="#2d3748" font-size="9" text-anchor="middle" x="160" y="69">doc</text>
<rect fill="#bee3f8" height="22" rx="3" stroke="#3a73a8" width="80" x="20" y="90"></rect>
<text fill="#2d3748" font-size="9" text-anchor="middle" x="60" y="104">encoder</text>
<rect fill="#bee3f8" height="22" rx="3" stroke="#3a73a8" width="80" x="120" y="90"></rect>
<text fill="#2d3748" font-size="9" text-anchor="middle" x="160" y="104">encoder</text>
<path d="M60,77 L60,87" marker-end="url(#arrow-embed)" stroke="#4a5568" stroke-width="1"></path>
<path d="M160,77 L160,87" marker-end="url(#arrow-embed)" stroke="#4a5568" stroke-width="1"></path>
<circle cx="60" cy="135" fill="#3a73a8" r="10"></circle>
<text fill="#fff" font-size="9" text-anchor="middle" x="60" y="139">v_q</text>
<circle cx="160" cy="135" fill="#3a73a8" r="10"></circle>
<text fill="#fff" font-size="9" text-anchor="middle" x="160" y="139">v_d</text>
<path d="M60,112 L60,124" marker-end="url(#arrow-embed)" stroke="#4a5568" stroke-width="1"></path>
<path d="M160,112 L160,124" marker-end="url(#arrow-embed)" stroke="#4a5568" stroke-width="1"></path>
<text fill="#3a73a8" font-size="11" font-weight="600" text-anchor="middle" x="110" y="170">score = v_q . v_d</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="110" y="195">+ Pre-compute doc vectors</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="110" y="210">+ ANN-friendly (HNSW etc.)</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="110" y="225">+ Fastest at scale</text>
<text fill="#b91c1c" font-size="9" text-anchor="middle" x="110" y="250">- Single vector compresses doc</text>
</g>
<g transform="translate(250,55)">
<rect fill="#fef3c7" height="270" rx="8" stroke="#d97706" stroke-width="1.5" width="220"></rect>
<text fill="#d97706" font-size="12" font-weight="600" text-anchor="middle" x="110" y="22">Cross-encoder</text>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="110" y="38">MS MARCO MiniLM, BGE-reranker</text>
<rect fill="#fff" height="22" rx="3" stroke="#d97706" width="140" x="40" y="55"></rect>
<text fill="#2d3748" font-size="9" text-anchor="middle" x="110" y="69">[query SEP doc]</text>
<rect fill="#fed7aa" height="22" rx="3" stroke="#d97706" width="140" x="40" y="90"></rect>
<text fill="#2d3748" font-size="9" text-anchor="middle" x="110" y="104">joint encoder</text>
<path d="M110,77 L110,87" marker-end="url(#arrow-embed)" stroke="#4a5568" stroke-width="1"></path>
<rect fill="#d97706" height="22" rx="3" width="100" x="60" y="125"></rect>
<text fill="#fff" font-size="9" font-weight="600" text-anchor="middle" x="110" y="139">scalar score</text>
<path d="M110,112 L110,122" marker-end="url(#arrow-embed)" stroke="#4a5568" stroke-width="1"></path>
<text fill="#d97706" font-size="11" font-weight="600" text-anchor="middle" x="110" y="170">attention over (q,d) tokens</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="110" y="195">+ Highest recall</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="110" y="210">+ Models q-d interaction fully</text>
<text fill="#b91c1c" font-size="9" text-anchor="middle" x="110" y="235">- Cannot pre-compute</text>
<text fill="#b91c1c" font-size="9" text-anchor="middle" x="110" y="250">- N x slow vs bi-encoder</text>
<text fill="#b91c1c" font-size="9" font-style="italic" text-anchor="middle" x="110" y="260">use as second-stage reranker</text>
</g>
<g transform="translate(480,55)">
<rect fill="#d1fae5" height="270" rx="8" stroke="#047857" stroke-width="1.5" width="220"></rect>
<text fill="#047857" font-size="12" font-weight="600" text-anchor="middle" x="110" y="22">Late interaction (ColBERT)</text>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="110" y="38">ColBERTv2, ColPali</text>
<g transform="translate(20,55)">
<circle cx="10" cy="0" fill="#047857" r="4"></circle>
<circle cx="25" cy="0" fill="#047857" r="4"></circle>
<circle cx="40" cy="0" fill="#047857" r="4"></circle>
<circle cx="55" cy="0" fill="#047857" r="4"></circle>
<text fill="#4a5568" font-size="8" text-anchor="middle" x="32" y="14">q tokens</text>
<circle cx="120" cy="0" fill="#047857" r="4"></circle>
<circle cx="135" cy="0" fill="#047857" r="4"></circle>
<circle cx="150" cy="0" fill="#047857" r="4"></circle>
<circle cx="165" cy="0" fill="#047857" r="4"></circle>
<circle cx="180" cy="0" fill="#047857" r="4"></circle>
<text fill="#4a5568" font-size="8" text-anchor="middle" x="150" y="14">d tokens</text>
<line stroke="#047857" stroke-width="0.5" x1="10" x2="120" y1="0" y2="30"></line>
<line stroke="#047857" stroke-width="0.5" x1="25" x2="135" y1="0" y2="30"></line>
<line stroke="#047857" stroke-width="0.5" x1="40" x2="150" y1="0" y2="30"></line>
<line stroke="#047857" stroke-width="0.5" x1="55" x2="165" y1="0" y2="30"></line>
<line stroke="#047857" stroke-width="0.5" x1="55" x2="180" y1="0" y2="30"></line>
</g>
<text fill="#047857" font-size="11" font-weight="600" text-anchor="middle" x="110" y="125">MaxSim per q-token</text>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="110" y="142">score = sum_i max_j q_i . d_j</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="110" y="180">+ Token-level grounding</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="110" y="195">+ Better recall than bi-encoder</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="110" y="210">+ Pre-compute doc tokens</text>
<text fill="#b91c1c" font-size="9" text-anchor="middle" x="110" y="235">- N_tokens x storage</text>
<text fill="#b91c1c" font-size="9" text-anchor="middle" x="110" y="250">- Newer ANN libraries needed</text>
</g>
</svg>