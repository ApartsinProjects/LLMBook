<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="State diagram of the conversational recsys loop with four states: Elicit (gather preferences), Retrieve (call the recsys with the current preference profile), Recommend (present top-k with justifications), and Refine (handle user feedback). Arrows go Elicit to Retrieve to Recommend to Refine, and Refine loops back to Elicit when the user changes their mind, or back to Retrieve when the user only narrows the existing constraints." role="img" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arr384" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="3.5" viewBox="0 0 7 7"><path d="M0,0 L7,3.5 L0,7 z" fill="#444"></path></marker>
<marker id="arrRed384" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="3.5" viewBox="0 0 7 7"><path d="M0,0 L7,3.5 L0,7 z" fill="#c0392b"></path></marker>
</defs>
<circle cx="120" cy="100" fill="#fef5e7" r="55" stroke="#e67e22" stroke-width="2"></circle>
<text fill="#a05a16" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="120" y="98">Elicit</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="120" y="115">ask clarifying Qs</text>
<circle cx="380" cy="100" fill="#eaf5ff" r="55" stroke="#2980b9" stroke-width="2"></circle>
<text fill="#1f618d" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="380" y="98">Retrieve</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="380" y="115">call recsys / RAG</text>
<circle cx="640" cy="100" fill="#e8f5e9" r="55" stroke="#27ae60" stroke-width="2"></circle>
<text fill="#1e8449" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="640" y="98">Recommend</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="640" y="115">top-k + justify</text>
<circle cx="380" cy="260" fill="#fdedec" r="55" stroke="#c0392b" stroke-width="2"></circle>
<text fill="#922b21" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="380" y="258">Refine</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="380" y="275">read feedback</text>

<line marker-end="url(#arr384)" stroke="#333" stroke-width="2" x1="175" x2="325" y1="100" y2="100"></line>
<line marker-end="url(#arr384)" stroke="#333" stroke-width="2" x1="435" x2="585" y1="100" y2="100"></line>
<line marker-end="url(#arr384)" stroke="#333" stroke-width="2" x1="600" x2="425" y1="150" y2="240"></line>
<path d="M 325 250 Q 220 200 165 145" fill="none" marker-end="url(#arrRed384)" stroke="#c0392b" stroke-dasharray="5" stroke-width="2"></path>
<text fill="#c0392b" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle" x="220" y="195">change of mind</text>
<path d="M 380 205 Q 410 180 380 155" fill="none" marker-end="url(#arr384)" stroke="#444" stroke-width="2"></path>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="430" y="185">narrow constraints</text>
</svg>