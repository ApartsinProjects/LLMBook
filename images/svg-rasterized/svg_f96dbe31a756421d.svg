<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Dialogue pipeline: user input flows through intent detection and entity extraction, state tracker, and dialogue policy; the policy fans out to request-slot, confirm, call-API, or escalate actions before the response generator LLM produces the system reply." role="img" viewBox="0 -9 780 409" xmlns="http://www.w3.org/2000/svg">
<!-- Title -->
<!-- User input -->
<rect fill="#3498db" filter="url(#shadow_0c512b)" height="50" rx="25" stroke="none" width="130" x="30" y="55"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="95" y="85">User Input</text>
<!-- Arrow -->
<line marker-end="url(#arrowhead)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="160" x2="195" y1="80" y2="80"></line>
<!-- NLU / Intent -->
<rect fill="url(#grad_0c512b_ecf0f1)" height="50" rx="8" stroke="#2c3e50" stroke-linecap="round" stroke-width="2" width="140" x="200" y="55"></rect>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="270" y="75">Intent Detection</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="270" y="92">+ Entity Extraction</text>
<!-- Arrow -->
<line marker-end="url(#arrowhead)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="340" x2="375" y1="80" y2="80"></line>
<!-- State Tracker -->
<rect fill="#f5eef8" height="50" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="140" x="380" y="55"></rect>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="450" y="75">State Tracker</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="450" y="92">Update dialogue state</text>
<!-- Arrow -->
<line marker-end="url(#arrowhead)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="520" x2="555" y1="80" y2="80"></line>
<!-- Policy / Router -->
<rect fill="url(#grad_0c512b_fef9e7)" height="50" rx="8" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="140" x="560" y="55"></rect>
<text fill="#e67e22" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="630" y="75">Dialogue Policy</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="630" y="92">Choose next action</text>
<!-- Middle row: actions -->
<line marker-end="url(#arrowhead)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="630" x2="630" y1="105" y2="145"></line>
<!-- Action boxes row -->
<rect fill="#e8f5e9" height="45" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" width="130" x="80" y="150"></rect>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="145" y="178">Request Slot</text>
<rect fill="#e8f5e9" height="45" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" width="130" x="240" y="150"></rect>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="305" y="178">Confirm Action</text>
<rect fill="#e8f5e9" height="45" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" width="130" x="400" y="150"></rect>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="465" y="178">Call API / Tool</text>
<rect fill="#e8f5e9" height="45" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" width="130" x="560" y="150"></rect>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="625" y="178">Escalate</text>
<!-- Lines from policy to actions -->
<line marker-end="url(#arrowhead)" stroke="#aaa" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="630" x2="148" y1="145" y2="150"></line>
<line marker-end="url(#arrowhead)" stroke="#aaa" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="630" x2="308" y1="145" y2="150"></line>
<line marker-end="url(#arrowhead)" stroke="#aaa" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="630" x2="468" y1="145" y2="150"></line>
<line marker-end="url(#arrowhead)" stroke="#aaa" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="630" x2="628" y1="145" y2="150"></line>
<!-- Response generation -->
<line marker-end="url(#arrowhead)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="390" x2="390" y1="195" y2="240"></line>
<rect fill="#eef" height="50" rx="8" stroke="#0f3460" stroke-linecap="round" stroke-width="2" width="260" x="260" y="245"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="390" y="265"><tspan>Response Generator (LLM)</tspan></text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="390" y="282"><tspan>System prompt + state + action</tspan></text>
<!-- Arrow to output -->
<line marker-end="url(#arrowhead)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="390" x2="390" y1="295" y2="330"></line>
<!-- System response -->
<rect fill="#e74c3c" height="50" rx="25" stroke="none" width="130" x="325" y="335"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="390" y="365">System Response</text>
<!-- Arrowhead marker -->
<defs>
<lineargradient id="grad_0c512b_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_0c512b_ecf0f1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fbffff"></stop><stop offset="100%" stop-color="#ecf0f1"></stop></lineargradient>
<filter height="115%" id="shadow_0c512b" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowhead" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#333" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
</svg>