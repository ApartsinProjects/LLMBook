<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Causal self-attention data flow. Input token embeddings are projected into queries, keys, and values. The scaled dot-product of queries and keys forms an attention score matrix. A lower-triangular causal mask sets every entry above the diagonal to negative infinity, so after softmax each token attends only to itself and earlier tokens. The masked weights multiply the values to produce the output." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 800 430" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="csaIn" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bbdefb"></stop><stop offset="100%" stop-color="#1e88e5"></stop></lineargradient>
<lineargradient id="csaQ" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"></stop><stop offset="100%" stop-color="#43a047"></stop></lineargradient>
<lineargradient id="csaK" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffe0b2"></stop><stop offset="100%" stop-color="#fb8c00"></stop></lineargradient>
<lineargradient id="csaV" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e1bee7"></stop><stop offset="100%" stop-color="#8e24aa"></stop></lineargradient>
<lineargradient id="csaOut" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#b3e5fc"></stop><stop offset="100%" stop-color="#0288d1"></stop></lineargradient>
<filter height="112%" id="csaShadow" width="112%" x="-6%" y="-6%"><fedropshadow dx="1" dy="2" flood-opacity="0.18" stddeviation="2"></fedropshadow></filter>
<marker id="csaArrow" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"></path></marker>
</defs>
<rect fill="#fafafa" height="430" rx="8" width="800" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="400" y="26">Causal self-attention: one projection, masked scores, weighted values</text>
<!-- input -->
<rect fill="url(#csaIn)" filter="url(#csaShadow)" height="120" rx="9" width="96" x="24" y="150"></rect>
<text fill="#fff" font-size="13" font-weight="600" text-anchor="middle" x="72" y="200">input x</text>
<text fill="#e3f2fd" font-size="11" text-anchor="middle" x="72" y="220">(T × d)</text>
<text fill="#e3f2fd" font-size="11" text-anchor="middle" x="72" y="238">T tokens</text>
<!-- qkv projection -->
<line marker-end="url(#csaArrow)" stroke="#777" stroke-width="2" x1="120" x2="156" y1="210" y2="210"></line>
<text fill="#888" font-size="10" text-anchor="middle" x="138" y="200">Wᶉₖᵥ</text>
<rect fill="url(#csaQ)" filter="url(#csaShadow)" height="44" rx="8" width="92" x="156" y="120"></rect><text fill="#fff" font-size="13" font-weight="600" text-anchor="middle" x="202" y="147">Q query</text>
<rect fill="url(#csaK)" filter="url(#csaShadow)" height="44" rx="8" width="92" x="156" y="188"></rect><text fill="#fff" font-size="13" font-weight="600" text-anchor="middle" x="202" y="215">K key</text>
<rect fill="url(#csaV)" filter="url(#csaShadow)" height="44" rx="8" width="92" x="156" y="256"></rect><text fill="#fff" font-size="13" font-weight="600" text-anchor="middle" x="202" y="283">V value</text>
<!-- scores QK^T -->
<line marker-end="url(#csaArrow)" stroke="#43a047" stroke-width="2" x1="248" x2="284" y1="142" y2="180"></line>
<line marker-end="url(#csaArrow)" stroke="#fb8c00" stroke-width="2" x1="248" x2="284" y1="210" y2="210"></line>
<text fill="#555" font-size="11" text-anchor="middle" x="332" y="120">scores = QKᵀ / √dₖ</text>
<!-- score+mask grid 4x4 -->
<g fill="#fff" font-size="10" font-weight="600">
<!-- row 1 -->
<rect fill="#43a047" height="26" rx="3" width="26" x="290" y="130"></rect><text text-anchor="middle" x="303" y="147">.7</text>
<rect fill="#eceff1" height="26" rx="3" stroke="#cfd8dc" width="26" x="318" y="130"></rect><text fill="#b0bec5" text-anchor="middle" x="331" y="147">−∞</text>
<rect fill="#eceff1" height="26" rx="3" stroke="#cfd8dc" width="26" x="346" y="130"></rect><text fill="#b0bec5" text-anchor="middle" x="359" y="147">−∞</text>
<rect fill="#eceff1" height="26" rx="3" stroke="#cfd8dc" width="26" x="374" y="130"></rect><text fill="#b0bec5" text-anchor="middle" x="387" y="147">−∞</text>
<!-- row 2 -->
<rect fill="#66bb6a" height="26" rx="3" width="26" x="290" y="158"></rect><text text-anchor="middle" x="303" y="175">.4</text>
<rect fill="#43a047" height="26" rx="3" width="26" x="318" y="158"></rect><text text-anchor="middle" x="331" y="175">.6</text>
<rect fill="#eceff1" height="26" rx="3" stroke="#cfd8dc" width="26" x="346" y="158"></rect><text fill="#b0bec5" text-anchor="middle" x="359" y="175">−∞</text>
<rect fill="#eceff1" height="26" rx="3" stroke="#cfd8dc" width="26" x="374" y="158"></rect><text fill="#b0bec5" text-anchor="middle" x="387" y="175">−∞</text>
<!-- row 3 -->
<rect fill="#81c784" height="26" rx="3" width="26" x="290" y="186"></rect><text text-anchor="middle" x="303" y="203">.3</text>
<rect fill="#66bb6a" height="26" rx="3" width="26" x="318" y="186"></rect><text text-anchor="middle" x="331" y="203">.3</text>
<rect fill="#43a047" height="26" rx="3" width="26" x="346" y="186"></rect><text text-anchor="middle" x="359" y="203">.5</text>
<rect fill="#eceff1" height="26" rx="3" stroke="#cfd8dc" width="26" x="374" y="186"></rect><text fill="#b0bec5" text-anchor="middle" x="387" y="203">−∞</text>
<!-- row 4 -->
<rect fill="#a5d6a7" height="26" rx="3" width="26" x="290" y="214"></rect><text text-anchor="middle" x="303" y="231">.2</text>
<rect fill="#81c784" height="26" rx="3" width="26" x="318" y="214"></rect><text text-anchor="middle" x="331" y="231">.2</text>
<rect fill="#66bb6a" height="26" rx="3" width="26" x="346" y="214"></rect><text text-anchor="middle" x="359" y="231">.3</text>
<rect fill="#43a047" height="26" rx="3" width="26" x="374" y="214"></rect><text text-anchor="middle" x="387" y="231">.4</text>
</g>
<text fill="#888" font-size="10" text-anchor="middle" x="345" y="258">rows = query position, cols = key position</text>
<text fill="#fb8c00" font-size="10" font-weight="600" text-anchor="middle" x="345" y="272">grey upper triangle = future, masked to −∞</text>
<!-- softmax -->
<line marker-end="url(#csaArrow)" stroke="#777" stroke-width="2" x1="400" x2="436" y1="185" y2="185"></line>
<text fill="#888" font-size="10" text-anchor="middle" x="418" y="176">softmax</text>
<rect fill="#e8f5e9" height="70" rx="9" stroke="#43a047" stroke-width="1.5" width="86" x="436" y="150"></rect>
<text fill="#2e7d32" font-size="11" font-weight="600" text-anchor="middle" x="479" y="178">row-wise</text>
<text fill="#2e7d32" font-size="11" font-weight="600" text-anchor="middle" x="479" y="195">weights</text>
<text fill="#555" font-size="10" text-anchor="middle" x="479" y="211">sum to 1</text>
<!-- weighted sum with V -->
<line marker-end="url(#csaArrow)" stroke="#777" stroke-width="2" x1="522" x2="558" y1="185" y2="185"></line>
<path d="M248 278 C 420 360, 470 320, 540 235 L 558 200" fill="none" marker-end="url(#csaArrow)" stroke="#8e24aa" stroke-dasharray="5,3" stroke-width="2"></path>
<text fill="#8e24aa" font-size="10" text-anchor="middle" x="430" y="350">weights × V</text>
<circle cx="586" cy="185" fill="#ede7f6" r="26" stroke="#8e24aa" stroke-width="1.5"></circle>
<text fill="#6a1b9a" font-size="18" font-weight="700" text-anchor="middle" x="586" y="190">Σ</text>
<!-- output -->
<line marker-end="url(#csaArrow)" stroke="#777" stroke-width="2" x1="612" x2="648" y1="185" y2="185"></line>
<rect fill="url(#csaOut)" filter="url(#csaShadow)" height="70" rx="9" width="128" x="648" y="150"></rect>
<text fill="#fff" font-size="13" font-weight="600" text-anchor="middle" x="712" y="180">output</text>
<text fill="#e1f5fe" font-size="11" text-anchor="middle" x="712" y="200">context per token</text>
<text fill="#888" font-size="11" text-anchor="middle" x="400" y="404">Each token's output blends only itself and the tokens before it: this is what makes generation left-to-right.</text>
</svg>