<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="LLM-powered search architecture. A user query is processed, expanded into sub-queries, and used to retrieve from multiple sources (web, knowledge base, academic papers). A reader extracts and ranks relevant passages, then an LLM synthesizes a cited answer." font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 -8 820 438" xmlns="http://www.w3.org/2000/svg">
<defs><filter height="116%" id="stdShadow4" width="108%" x="-4%" y="-4%"><fedropshadow dx="1" dy="2" flood-opacity="0.08" stddeviation="2"></fedropshadow></filter><lineargradient id="stdGrad3" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<marker id="arrSrc" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3">
<polygon fill="#1a1a2e" points="0 0, 8 3, 0 6"></polygon>
</marker>
<marker id="arrSrcR" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3">
<polygon fill="#e94560" points="0 0, 8 3, 0 6"></polygon>
</marker>
</defs>
<!-- User Query -->
<rect fill="#e3f2fd" height="80" rx="8" stroke="#1565c0" stroke-linecap="round" stroke-width="2" width="120" x="30" y="100"></rect>
<text fill="#1565c0" font-size="12" font-weight="700" text-anchor="middle" x="90" y="128">User Query</text>
<text fill="#555" font-size="11" text-anchor="middle" x="90" y="150">"How does</text>
<text fill="#555" font-size="11" text-anchor="middle" x="90" y="165">RLHF work?"</text>
<line marker-end="url(#arrSrc)" stroke="#1a1a2e" stroke-linecap="round" stroke-width="2" x1="155" x2="185" y1="140" y2="140"></line>
<!-- Query Understanding -->
<rect fill="#f3e5f5" height="120" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="140" x="190" y="80"></rect>
<text fill="#8e44ad" font-size="12" font-weight="700" text-anchor="middle" x="260" y="108">Query Processing</text>
<rect fill="white" height="22" rx="3" stroke="#ce93d8" stroke-linecap="round" stroke-width="1" width="120" x="200" y="118"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="260" y="133">Intent classification</text>
<rect fill="white" height="22" rx="3" stroke="#ce93d8" stroke-linecap="round" stroke-width="1" width="120" x="200" y="146"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="260" y="161">Query rewriting</text>
<rect fill="white" height="22" rx="3" stroke="#ce93d8" stroke-linecap="round" stroke-width="1" width="120" x="200" y="174"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="260" y="189">Sub-query expansion</text>
<!-- Retrieval Sources (branching) -->
<line marker-end="url(#arrSrc)" stroke="#1a1a2e" stroke-linecap="round" stroke-width="1.5" x1="335" x2="375" y1="120" y2="80"></line>
<line marker-end="url(#arrSrc)" stroke="#1a1a2e" stroke-linecap="round" stroke-width="1.5" x1="335" x2="375" y1="140" y2="165"></line>
<line marker-end="url(#arrSrc)" stroke="#1a1a2e" stroke-linecap="round" stroke-width="1.5" x1="335" x2="375" y1="180" y2="255"></line>
<rect fill="#fff3e0" height="70" rx="6" stroke="#e65100" stroke-linecap="round" stroke-width="2" width="130" x="380" y="50"></rect>
<text fill="#e65100" font-size="11" font-weight="600" text-anchor="middle" x="445" y="75">Web Search</text>
<text fill="#555" font-size="11" text-anchor="middle" x="445" y="95">Bing / Google APIs</text>
<text fill="#888" font-size="11" text-anchor="middle" x="445" y="110">top-K pages</text>
<rect fill="#e8f5e9" height="70" rx="6" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="130" x="380" y="135"></rect>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="445" y="160">Knowledge Base</text>
<text fill="#555" font-size="11" text-anchor="middle" x="445" y="178">Vector store (RAG)</text>
<text fill="#888" font-size="11" text-anchor="middle" x="445" y="193">semantic retrieval</text>
<rect fill="#e3f2fd" height="70" rx="6" stroke="#1565c0" stroke-linecap="round" stroke-width="2" width="130" x="380" y="220"></rect>
<text fill="#1565c0" font-size="11" font-weight="600" text-anchor="middle" x="445" y="245">Academic Papers</text>
<text fill="#555" font-size="11" text-anchor="middle" x="445" y="263">Semantic Scholar</text>
<text fill="#888" font-size="11" text-anchor="middle" x="445" y="278">citation graph</text>
<!-- Reader/Ranker -->
<line marker-end="url(#arrSrc)" stroke="#1a1a2e" stroke-linecap="round" stroke-width="1.5" x1="515" x2="555" y1="85" y2="130"></line>
<line marker-end="url(#arrSrc)" stroke="#1a1a2e" stroke-linecap="round" stroke-width="1.5" x1="515" x2="555" y1="170" y2="160"></line>
<line marker-end="url(#arrSrc)" stroke="#1a1a2e" stroke-linecap="round" stroke-width="1.5" x1="515" x2="555" y1="255" y2="190"></line>
<rect fill="#fce4ec" height="120" rx="8" stroke="#c62828" stroke-linecap="round" stroke-width="2" width="130" x="560" y="100"></rect>
<text fill="#c62828" font-size="12" font-weight="700" text-anchor="middle" x="625" y="128">Reader + Ranker</text>
<rect fill="white" height="20" rx="3" stroke="#ef9a9a" stroke-linecap="round" stroke-width="1" width="110" x="570" y="140"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="625" y="154">Extract key passages</text>
<rect fill="white" height="20" rx="3" stroke="#ef9a9a" stroke-linecap="round" stroke-width="1" width="110" x="570" y="166"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="625" y="180">Rank by relevance</text>
<rect fill="white" height="20" rx="3" stroke="#ef9a9a" stroke-linecap="round" stroke-width="1" width="110" x="570" y="192"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="625" y="206">Deduplicate facts</text>
<!-- Synthesizer -->
<line marker-end="url(#arrSrcR)" stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="695" x2="715" y1="160" y2="160"></line>
<rect fill="#f8f9fa" height="170" rx="8" stroke="#1a1a2e" stroke-linecap="round" stroke-width="2" width="85" x="720" y="80"></rect>
<text fill="#1a1a2e" font-size="12" font-weight="700" text-anchor="middle" x="762" y="115">Answer</text>
<rect fill="#e3f2fd" height="18" rx="3" width="70" x="728" y="128"></rect>
<text fill="#1565c0" font-size="11" text-anchor="middle" x="763" y="140">Synthesis</text>
<rect fill="#e8f5e9" height="18" rx="3" width="70" x="728" y="152"></rect>
<text fill="#27ae60" font-size="11" text-anchor="middle" x="763" y="164">Citations [1]</text>
<rect fill="#fff3e0" height="18" rx="3" width="70" x="728" y="176"></rect>
<text fill="#e65100" font-size="11" text-anchor="middle" x="763" y="188">Follow-ups</text>
<rect fill="#f3e5f5" height="18" rx="3" width="70" x="728" y="200"></rect>
<text fill="#8e44ad" font-size="11" text-anchor="middle" x="763" y="212">Confidence</text>
<!-- Comparison table at bottom -->
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="410" y="315">Traditional Search vs. LLM-Powered Search</text>
<rect fill="#fef9e7" height="85" rx="6" stroke="#f39c12" stroke-linecap="round" stroke-width="1" width="330" x="60" y="330"></rect>
<text fill="#e67e22" font-size="11" font-weight="600" text-anchor="middle" x="225" y="352">Traditional: "10 Blue Links"</text>
<text fill="#555" font-size="11" text-anchor="middle" x="225" y="372">Keyword matching, BM25 ranking</text>
<text fill="#555" font-size="11" text-anchor="middle" x="225" y="388">User reads and synthesizes across pages</text>
<text fill="#555" font-size="11" text-anchor="middle" x="225" y="404">High recall, low precision for complex queries</text>
<rect fill="#e8f5e9" height="85" rx="6" stroke="#27ae60" stroke-linecap="round" stroke-width="1" width="330" x="430" y="330"></rect>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="595" y="352">LLM-Powered: Direct Answer</text>
<text fill="#555" font-size="11" text-anchor="middle" x="595" y="372">Semantic understanding, multi-source synthesis</text>
<text fill="#555" font-size="11" text-anchor="middle" x="595" y="388">AI reads and synthesizes; user gets answer</text>
<text fill="#555" font-size="11" text-anchor="middle" x="595" y="404">Cited sources, follow-up suggestions</text>
</svg>