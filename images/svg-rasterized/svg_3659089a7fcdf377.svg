<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Reproducibility workflow chain: Hydra config (parameters) feeds Git plus DVC (code and data), then Docker build (environment), then deterministic experiment run, then MLflow or W and B (results tracking)." role="img" style="font-family: sans-serif;" viewBox="0 -13 750 213" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow7b" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
<marker id="arr7" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><path d="M0,0 L8,3 L0,6 Z" fill="#999"></path></marker>
</defs>
<rect fill="#e74c3c" filter="url(#shadow7b)" height="55" rx="8" width="110" x="15" y="45"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="70" y="67">Hydra Config</text>
<text fill="#ddd" font-size="11" text-anchor="middle" x="70" y="85">Versioned YAML</text>
<line marker-end="url(#arr7)" stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="125" x2="155" y1="72" y2="72"></line>
<rect fill="#8e44ad" filter="url(#shadow7b)" height="55" rx="8" width="110" x="155" y="45"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="210" y="67">Git + DVC</text>
<text fill="#ddd" font-size="11" text-anchor="middle" x="210" y="85">Code + data</text>
<line marker-end="url(#arr7)" stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="265" x2="295" y1="72" y2="72"></line>
<rect fill="#2980b9" filter="url(#shadow7b)" height="55" rx="8" width="110" x="295" y="45"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="350" y="67">Docker Build</text>
<text fill="#ddd" font-size="11" text-anchor="middle" x="350" y="85">Pinned deps</text>
<line marker-end="url(#arr7)" stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="405" x2="435" y1="72" y2="72"></line>
<rect fill="#27ae60" filter="url(#shadow7b)" height="55" rx="8" width="110" x="435" y="45"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="490" y="67">Run Experiment</text>
<text fill="#ddd" font-size="11" text-anchor="middle" x="490" y="85">Deterministic</text>
<line marker-end="url(#arr7)" stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="545" x2="575" y1="72" y2="72"></line>
<rect fill="#f39c12" filter="url(#shadow7b)" height="55" rx="8" width="125" x="575" y="45"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="637" y="67">MLflow / W&amp;B</text>
<text fill="#ddd" font-size="11" text-anchor="middle" x="637" y="85">Track results</text>
<!-- Bottom: what each step versions -->
<rect fill="#f8f8ff" height="50" rx="8" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="685" x="15" y="130"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="375" y="150">Each step captures a reproducibility dimension:</text>
<text fill="#555" font-size="11" text-anchor="middle" x="375" y="170">Hydra = parameters | Git = code | DVC = data | Docker = environment | MLflow = results</text>
</svg>