<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 410" role="img" aria-label="The prove-check loop for LLM-assisted theorem proving. The current proof goal and its hypotheses are the state. An LLM, acting as the intuition engine, proposes a single tactic; optionally relevant lemmas are retrieved from a library and added to the prompt. The proof assistant, acting as the verification engine, applies the tactic. If the tactic is rejected or produces an error, the prover backtracks and the LLM proposes a different tactic. If the tactic is accepted, the goal is transformed into one or more sub-goals; if no goals remain, the proof is complete and verified. The loop repeats until the proof compiles or the search budget is exhausted." style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="pcGoal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bbdefb"/><stop offset="100%" stop-color="#1e88e5"/></linearGradient>
<linearGradient id="pcLLM" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e1bee7"/><stop offset="100%" stop-color="#8e24aa"/></linearGradient>
<linearGradient id="pcCheck" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe0b2"/><stop offset="100%" stop-color="#fb8c00"/></linearGradient>
<linearGradient id="pcDone" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"/><stop offset="100%" stop-color="#43a047"/></linearGradient>
<linearGradient id="pcRetr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b2ebf2"/><stop offset="100%" stop-color="#00acc1"/></linearGradient>
<filter id="pcShadow" x="-6%" y="-6%" width="112%" height="112%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.18"/></filter>
<marker id="pcArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"/></marker>
<marker id="pcArrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e53935"/></marker>
<marker id="pcArrowG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#43a047"/></marker>
</defs>
<rect x="0" y="0" width="800" height="410" fill="#fafafa" rx="8"/>
<text x="400" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#333">The prove-check loop: LLM proposes, the proof assistant decides</text>
<!-- goal state -->
<rect x="40" y="150" width="140" height="84" rx="10" fill="url(#pcGoal)" filter="url(#pcShadow)"/>
<text x="110" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">proof goal</text>
<text x="110" y="200" text-anchor="middle" font-size="10" fill="#e3f2fd">state: goal +</text>
<text x="110" y="214" text-anchor="middle" font-size="10" fill="#e3f2fd">hypotheses</text>
<!-- retrieval (optional) -->
<rect x="40" y="280" width="140" height="64" rx="10" fill="url(#pcRetr)" filter="url(#pcShadow)"/>
<text x="110" y="306" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">premise retrieval</text>
<text x="110" y="324" text-anchor="middle" font-size="10" fill="#e0f7fa">relevant lemmas</text>
<text x="110" y="337" text-anchor="middle" font-size="9" fill="#e0f7fa">(ReProver, optional)</text>
<line x1="110" y1="280" x2="110" y2="248" stroke="#00acc1" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#pcArrow)"/>
<!-- LLM proposes tactic -->
<line x1="180" y1="192" x2="246" y2="192" stroke="#777" stroke-width="2" marker-end="url(#pcArrow)"/>
<text x="213" y="182" text-anchor="middle" font-size="10" fill="#888">prompt</text>
<rect x="246" y="150" width="150" height="84" rx="10" fill="url(#pcLLM)" filter="url(#pcShadow)"/>
<text x="321" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">LLM</text>
<text x="321" y="196" text-anchor="middle" font-size="10" fill="#f3e5f5">intuition engine:</text>
<text x="321" y="210" text-anchor="middle" font-size="10" fill="#f3e5f5">propose one tactic</text>
<!-- checker -->
<line x1="396" y1="192" x2="462" y2="192" stroke="#777" stroke-width="2" marker-end="url(#pcArrow)"/>
<text x="429" y="182" text-anchor="middle" font-size="10" fill="#888">tactic</text>
<rect x="462" y="150" width="156" height="84" rx="10" fill="url(#pcCheck)" filter="url(#pcShadow)"/>
<text x="540" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">proof assistant</text>
<text x="540" y="196" text-anchor="middle" font-size="10" fill="#fff3e0">verification engine:</text>
<text x="540" y="210" text-anchor="middle" font-size="10" fill="#fff3e0">apply &amp; type-check</text>
<!-- reject loop back -->
<path d="M540 234 L 540 286 L 321 286 L 321 234" fill="none" stroke="#e53935" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#pcArrowR)"/>
<rect x="372" y="272" width="138" height="26" rx="7" fill="#ffebee" stroke="#e53935"/>
<text x="441" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#c62828">rejected: backtrack</text>
<!-- accepted path -->
<line x1="618" y1="178" x2="664" y2="158" stroke="#43a047" stroke-width="2.2" marker-end="url(#pcArrowG)"/>
<text x="648" y="150" text-anchor="middle" font-size="10" fill="#43a047" font-weight="600">accepted</text>
<rect x="640" y="156" width="138" height="50" rx="9" fill="#e8f5e9" stroke="#43a047" stroke-width="1.4"/>
<text x="709" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#2e7d32">goal advances</text>
<text x="709" y="194" text-anchor="middle" font-size="10" fill="#555">new sub-goals?</text>
<!-- back to goal if goals remain -->
<path d="M640 181 C 540 110, 220 96, 110 150" fill="none" stroke="#43a047" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#pcArrowG)"/>
<text x="380" y="92" text-anchor="middle" font-size="10" fill="#2e7d32">goals remain: repeat on next sub-goal</text>
<!-- QED -->
<line x1="709" y1="206" x2="709" y2="244" stroke="#43a047" stroke-width="2.2" marker-end="url(#pcArrowG)"/>
<text x="745" y="228" text-anchor="middle" font-size="10" fill="#2e7d32">no goals left</text>
<rect x="638" y="244" width="142" height="56" rx="10" fill="url(#pcDone)" filter="url(#pcShadow)"/>
<text x="709" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">QED</text>
<text x="709" y="288" text-anchor="middle" font-size="10" fill="#e8f5e9">proof compiles, verified</text>
<text x="400" y="372" text-anchor="middle" font-size="11" fill="#888">The checker gives a binary, unhackable signal: a completed proof is correct by construction, not by a learned reward model.</text>
</svg>