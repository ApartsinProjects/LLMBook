<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Siamese Bi-Encoder (tied weights)" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="240" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="bold" text-anchor="middle" x="360" y="20">Siamese Bi-Encoder (tied weights)</text>
