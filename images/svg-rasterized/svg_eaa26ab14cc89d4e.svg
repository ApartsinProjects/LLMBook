<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="90" y="65">Sentence A</text>
<rect fill="#fff3e0" height="40" rx="6" stroke="#e67e22" stroke-width="1.5" width="140" x="20" y="160"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="90" y="185">Sentence B</text>
<rect fill="#e3f2fd" height="40" rx="6" stroke="#1976d2" stroke-width="1.5" width="140" x="200" y="40"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="270" y="58">BERT tower</text>
<text fill="#555" font-size="10" text-anchor="middle" x="270" y="73">(shared weights)</text>
<rect fill="#e3f2fd" height="40" rx="6" stroke="#1976d2" stroke-width="1.5" width="140" x="200" y="160"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="270" y="178">BERT tower</text>
<text fill="#555" font-size="10" text-anchor="middle" x="270" y="193">(shared weights)</text>
<rect fill="#e8f5e9" height="40" rx="6" stroke="#2e7d32" stroke-width="1.5" width="100" x="380" y="40"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="430" y="58">mean pool</text>
<text fill="#555" font-size="11" text-anchor="middle" x="430" y="73">u</text>
<rect fill="#e8f5e9" height="40" rx="6" stroke="#2e7d32" stroke-width="1.5" width="100" x="380" y="160"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="430" y="178">mean pool</text>
<text fill="#555" font-size="11" text-anchor="middle" x="430" y="193">v</text>
<rect fill="#fce4ec" height="60" rx="6" stroke="#c2185b" stroke-width="1.5" width="170" x="520" y="90"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="605" y="115">Softmax head</text>
<text fill="#555" font-size="11" text-anchor="middle" x="605" y="132">[u; v; |u-v|] -&gt; NLI label</text>
<line marker-end="url(#arrow-sbert)" stroke="#444" stroke-width="1.5" x1="160" x2="200" y1="60" y2="60"></line>
<line marker-end="url(#arrow-sbert)" stroke="#444" stroke-width="1.5" x1="340" x2="380" y1="60" y2="60"></line>
<line marker-end="url(#arrow-sbert)" stroke="#444" stroke-width="1.5" x1="160" x2="200" y1="180" y2="180"></line>
<line marker-end="url(#arrow-sbert)" stroke="#444" stroke-width="1.5" x1="340" x2="380" y1="180" y2="180"></line>
<line marker-end="url(#arrow-sbert)" stroke="#444" stroke-width="1.5" x1="480" x2="520" y1="60" y2="105"></line>
<line marker-end="url(#arrow-sbert)" stroke="#444" stroke-width="1.5" x1="480" x2="520" y1="180" y2="135"></line>
<text fill="#555" font-size="11" text-anchor="middle" x="360" y="225">At inference the head is discarded; cosine(u, v) ranks retrieval candidates.</text>
<defs><marker id="arrow-sbert" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="4"><path d="M0,0 L8,4 L0,8 z" fill="#444"></path></marker></defs>
