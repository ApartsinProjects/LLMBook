<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="ZeRO progressively shards the per-rank state. Dashed boxes are sharded (only $1/N$ stored per rank); solid boxes are fully replicated. Communication per step grows with each stage: Stage 0 needs 1 all-reduce; Stage 1 needs 1 all-reduce on the gradients; Stage 2 replaces that with 1 reduce-scatter; Stage 3 adds 1 all-gather (forward) and 1 all-gather (backward) per layer on top. The memory savings come at the cost of these additional collectives, but the wire-time per step grows only modestly." role="img" style="font-family: sans-serif; max-width: 100%; height: auto;" viewbox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="400" width="900"></rect>
<!-- Header row -->
<text fill="#1a4078" font-size="13" font-weight="700" text-anchor="middle" x="170" y="76">Stage 0 (DDP)</text>
<text fill="#1a4078" font-size="13" font-weight="700" text-anchor="middle" x="350" y="76">Stage 1: Opt state</text>
<text fill="#1f7a3a" font-size="13" font-weight="700" text-anchor="middle" x="530" y="76">Stage 2: + Gradients</text>
<text fill="#a67c1a" font-size="13" font-weight="700" text-anchor="middle" x="730" y="76">Stage 3: + Params</text>
<!-- Per-stage stacks: from bottom to top: params (2B), grads (2B), master (4B), m (4B), v (4B) -->
<!-- Stage 0 (full = 16) -->
<g transform="translate(110, 84)">
<rect fill="#1a4078" height="40" width="120" x="0" y="256"></rect>
<text fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" x="60" y="282">Params (2B)</text>
<rect fill="#2e5fa0" height="40" width="120" x="0" y="216"></rect>
<text fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" x="60" y="242">Grads (2B)</text>
<rect fill="#4a7fc0" height="80" width="120" x="0" y="136"></rect>
<text fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" x="60" y="182">Master (4B)</text>
<rect fill="#6a99d8" height="60" width="120" x="0" y="76"></rect>
<text fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" x="60" y="112">m (4B)</text>
<rect fill="#8ab2e6" height="60" width="120" x="0" y="16"></rect>
<text fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" x="60" y="52">v (4B)</text>
<text fill="#1a4078" font-size="11" font-weight="700" text-anchor="middle" x="60" y="326">16 P/N bytes</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="60" y="342">N=1, baseline</text>
</g>
<!-- Stage 1: shard opt state (m, v, master) -->
<g transform="translate(290, 100)">
<rect fill="#1a4078" height="40" width="120" x="0" y="240"></rect>
<text fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" x="60" y="266">Params (2B)</text>
<rect fill="#2e5fa0" height="40" width="120" x="0" y="200"></rect>
<text fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" x="60" y="226">Grads (2B)</text>
<rect fill="#4a7fc0" height="40" stroke="#dddddd" stroke-dasharray="2,2" width="120" x="0" y="160"></rect>
<text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="60" y="184">Master/N</text>
<rect fill="#6a99d8" height="40" stroke="#dddddd" stroke-dasharray="2,2" width="120" x="0" y="120"></rect>
<text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="60" y="144">m/N</text>
<rect fill="#8ab2e6" height="40" stroke="#dddddd" stroke-dasharray="2,2" width="120" x="0" y="80"></rect>
<text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="60" y="104">v/N</text>
<text fill="#1a4078" font-size="11" font-weight="700" text-anchor="middle" x="60" y="310">4 + 12/N bytes</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="60" y="326">~4 B/p at N=64</text>
</g>
<!-- Stage 2: + shard grads -->
<g transform="translate(470, 100)">
<rect fill="#1a4078" height="40" width="120" x="0" y="240"></rect>
<text fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" x="60" y="266">Params (2B)</text>
<rect fill="#2e5fa0" height="40" stroke="#dddddd" stroke-dasharray="2,2" width="120" x="0" y="200"></rect>
<text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="60" y="226">Grads/N</text>
<rect fill="#4a7fc0" height="40" stroke="#dddddd" stroke-dasharray="2,2" width="120" x="0" y="160"></rect>
<text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="60" y="184">Master/N</text>
<rect fill="#6a99d8" height="40" stroke="#dddddd" stroke-dasharray="2,2" width="120" x="0" y="120"></rect>
<text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="60" y="144">m/N</text>
<rect fill="#8ab2e6" height="40" stroke="#dddddd" stroke-dasharray="2,2" width="120" x="0" y="80"></rect>
<text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="60" y="104">v/N</text>
<text fill="#1f7a3a" font-size="11" font-weight="700" text-anchor="middle" x="60" y="310">2 + 14/N bytes</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="60" y="326">~2.2 B/p at N=64</text>
</g>
<!-- Stage 3: + shard params -->
<g transform="translate(670, 100)">
<rect fill="#1a4078" height="40" stroke="#dddddd" stroke-dasharray="2,2" width="120" x="0" y="240"></rect>
<text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="60" y="266">Params/N</text>
<rect fill="#2e5fa0" height="40" stroke="#dddddd" stroke-dasharray="2,2" width="120" x="0" y="200"></rect>
<text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="60" y="226">Grads/N</text>
<rect fill="#4a7fc0" height="40" stroke="#dddddd" stroke-dasharray="2,2" width="120" x="0" y="160"></rect>
<text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="60" y="184">Master/N</text>
<rect fill="#6a99d8" height="40" stroke="#dddddd" stroke-dasharray="2,2" width="120" x="0" y="120"></rect>
<text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="60" y="144">m/N</text>
<rect fill="#8ab2e6" height="40" stroke="#dddddd" stroke-dasharray="2,2" width="120" x="0" y="80"></rect>
<text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="60" y="104">v/N</text>
<text fill="#a67c1a" font-size="11" font-weight="700" text-anchor="middle" x="60" y="310">16/N bytes</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="60" y="326">~0.25 B/p at N=64</text>
</g>
</svg>