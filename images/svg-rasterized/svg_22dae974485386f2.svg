<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Layered memory architecture for conversational AI: the LLM context window draws from short-term memory (sliding-window message buffer) and long-term memory (summaries plus vector store); both persist to a session store and a user profile." role="img" viewBox="0 -9 760 409" xmlns="http://www.w3.org/2000/svg">
<!-- Context Window box -->
<rect fill="#0d3b66" filter="url(#shadow_06b2f7)" height="60" rx="10" stroke="none" width="360" x="200" y="45"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="380" y="72">LLM Context Window</text>
<text fill="#aaa" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="380" y="92">System prompt + memory context + recent turns + user message</text>
<!-- Arrows going down -->
<line marker-end="url(#memArrow)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="280" x2="280" y1="105" y2="140"></line>
<line marker-end="url(#memArrow)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="480" x2="480" y1="105" y2="140"></line>
<!-- Short-term memory -->
<rect fill="url(#grad_06b2f7_e8f4fd)" height="100" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="300" x="60" y="145"></rect>
<text fill="#2980b9" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="210" y="170">Short-Term Memory</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="75" y="195">• Full conversation buffer (last N turns)</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="75" y="212">• Sliding window with overlap</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="75" y="229">• Token-counted message queue</text>
<!-- Long-term memory -->
<rect fill="#f5eef8" height="100" rx="10" stroke="#6a1b9a" stroke-linecap="round" stroke-width="2" width="300" x="400" y="145"></rect>
<text fill="#6a1b9a" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="550" y="170">Long-Term Memory</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="415" y="195">• Conversation summaries</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="415" y="212">• Vector store (semantic search)</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="415" y="229">• Entity/fact extraction</text>
<!-- Lower tier: Persistent storage -->
<rect fill="url(#grad_06b2f7_fef9e7)" height="90" rx="10" stroke="#a67c1a" stroke-linecap="round" stroke-width="2" width="220" x="130" y="280"></rect>
<text fill="#e67e22" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="240" y="305">Session Store</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="145" y="325">• Per-session history</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="145" y="342">• Session metadata</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="145" y="359">• Resume/restore capability</text>
<rect fill="#e8f5e9" height="90" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="220" x="400" y="280"></rect>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="510" y="305">User Profile</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="415" y="325">• Preferences &amp; settings</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="415" y="342">• Biographical facts</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="415" y="359">• Interaction patterns</text>
<!-- Connecting lines -->
<line marker-end="url(#memArrow)" stroke="#aaa" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="210" x2="240" y1="245" y2="278"></line>
<line marker-end="url(#memArrow)" stroke="#aaa" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="550" x2="510" y1="245" y2="278"></line>
<defs>
<lineargradient id="grad_06b2f7_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_06b2f7_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_06b2f7" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="memArrow" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#333" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
</svg>