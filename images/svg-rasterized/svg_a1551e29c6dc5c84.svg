<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Anatomy of an LLM trace: a 1180ms RAG root span contains child spans for embed_query (85ms), vector_search (120ms), rerank (65ms), llm_generate (870ms, gpt-4o, 1420 tokens), and post-processing, with per-span metadata." role="img" style="font-family: sans-serif;" viewBox="0 -9 750 309" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow5" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<!-- Time axis -->
<line stroke="#ccc" stroke-linecap="round" stroke-width="1" x1="50" x2="720" y1="50" y2="50"></line>
<text fill="#888" font-size="11" x="50" y="45">0ms</text>
<text fill="#888" font-size="11" text-anchor="end" x="720" y="45">1200ms</text>
<!-- Root span -->
<rect fill="#1a1a2e" filter="url(#shadow5)" height="28" opacity="0.9" rx="4" width="670" x="50" y="60"></rect>
<text fill="white" font-size="11" font-weight="600" x="60" y="79">RAG Request (total: 1180ms)</text>
<!-- Embed query span -->
<rect fill="#8e44ad" filter="url(#shadow5)" height="28" rx="4" width="100" x="60" y="100"></rect>
<text fill="white" font-size="11" x="70" y="119">embed_query (85ms)</text>
<!-- Vector search span -->
<rect fill="#2980b9" filter="url(#shadow5)" height="28" rx="4" width="130" x="170" y="100"></rect>
<text fill="white" font-size="11" x="180" y="119">vector_search (120ms)</text>
<!-- Rerank span -->
<rect fill="#16a085" filter="url(#shadow5)" height="28" rx="4" width="80" x="310" y="100"></rect>
<text fill="white" font-size="11" x="320" y="119">rerank (65ms)</text>
<!-- LLM call span (largest) -->
<rect fill="#e74c3c" filter="url(#shadow5)" height="28" rx="4" width="280" x="400" y="100"></rect>
<text fill="white" font-size="11" x="410" y="119">llm_generate (870ms) [gpt-4o, 1420 tokens]</text>
<!-- Post-process span -->
<rect fill="#27ae60" filter="url(#shadow5)" height="28" rx="4" width="25" x="690" y="100"></rect>
<text fill="white" font-size="11" x="693" y="119">pp</text>
<!-- Metadata annotations -->
<rect fill="white" height="130" rx="8" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="300" x="60" y="150"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" x="75" y="172">Span Metadata (llm_generate)</text>
<text fill="#333" font-size="11" x="75" y="195">model: gpt-4o</text>
<text fill="#333" font-size="11" x="75" y="212">prompt_tokens: 580</text>
<text fill="#333" font-size="11" x="75" y="229">completion_tokens: 840</text>
<text fill="#333" font-size="11" x="75" y="246">temperature: 0.0</text>
<text fill="#333" font-size="11" x="75" y="263">cost: <span>&#36;</span>0.0142</text>
<rect fill="white" height="130" rx="8" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="300" x="400" y="150"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" x="415" y="172">Span Metadata (vector_search)</text>
<text fill="#333" font-size="11" x="415" y="195">collection: docs_v2</text>
<text fill="#333" font-size="11" x="415" y="212">top_k: 5</text>
<text fill="#333" font-size="11" x="415" y="229">results_returned: 5</text>
<text fill="#333" font-size="11" x="415" y="246">similarity_min: 0.72</text>
<text fill="#333" font-size="11" x="415" y="263">similarity_max: 0.91</text>
</svg>