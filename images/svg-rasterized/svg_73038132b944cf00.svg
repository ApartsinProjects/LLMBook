<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Multi-Query Attention: eight query heads each project the input into their own Q vector, but all eight heads share a single K and V projection; per-token KV cache shrinks by the number of query heads." role="img" style="max-width:720px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
