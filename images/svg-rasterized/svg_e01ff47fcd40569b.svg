<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: The Reasoning Data Pipeline" role="img" viewBox="0 0 750 320" xmlns="http://www.w3.org/2000/svg">
<rect fill="url(#grad_734898_f8f9fa)" filter="url(#shadow_734898)" height="310" rx="10" stroke="#ddd" stroke-linecap="round" width="740" x="5" y="5"></rect>
<!-- Stage 1: Seed Problems -->
<rect fill="url(#grad_734898_e3f2fd)" height="60" rx="8" stroke="#1976d2" stroke-linecap="round" stroke-width="1.5" width="140" x="30" y="55"></rect>
<text fill="#1565c0" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="100" y="78">Seed Problems</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="100" y="95">Curated question bank</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="100" y="107">with known answers</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="18" x="185" y="88">→</text>
<!-- Stage 2: Generate N traces -->
<rect fill="url(#grad_734898_f3e5f5)" height="60" rx="8" stroke="#7b1fa2" stroke-linecap="round" stroke-width="1.5" width="140" x="210" y="55"></rect>
<text fill="#6a1b9a" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="280" y="78">Generate N Traces</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="280" y="95">Sample K completions</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="280" y="107">per problem (temp=0.7)</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="18" x="365" y="88">→</text>
<!-- Stage 3: Verify -->
<rect fill="#e8f5e9" height="60" rx="8" stroke="#388e3c" stroke-linecap="round" stroke-width="1.5" width="140" x="390" y="55"></rect>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="460" y="78">Verify Answers</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="460" y="95">Check final answer vs</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="460" y="107">ground truth or tests</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="18" x="545" y="88">→</text>
<!-- Stage 4: Filter -->
<rect fill="url(#grad_734898_fff3e0)" height="60" rx="8" stroke="#e65100" stroke-linecap="round" stroke-width="1.5" width="140" x="570" y="55"></rect>
<text fill="#e65100" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="640" y="78">Filter &amp; Select</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="640" y="95">Keep correct traces,</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="640" y="107">discard incorrect ones</text>
<!-- Second row -->
<path d="M640 120 L640 155 L460 155" fill="none" marker-end="url(#pipeArrow)" stroke="#999" stroke-linecap="round" stroke-width="1.5"></path>
<!-- Stage 5: Format -->
<rect fill="url(#grad_734898_fce4ec)" height="60" rx="8" stroke="#c62828" stroke-linecap="round" stroke-width="1.5" width="160" x="300" y="160"></rect>
<text fill="#c62828" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="380" y="183">Format for Training</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="380" y="200">Structure as SFT examples</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="380" y="212">or preference pairs</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="18" x="282" y="193">←</text>
<!-- Stage 6: Train -->
<rect fill="url(#grad_734898_e0f2f1)" height="60" rx="8" stroke="#00897b" stroke-linecap="round" stroke-width="1.5" width="160" x="90" y="160"></rect>
<text fill="#00796b" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="170" y="183">Train Student Model</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="170" y="200">SFT on verified traces</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="170" y="212">or GRPO with rewards</text>
<!-- Labels -->
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="375" y="260">Key: rejection sampling keeps only traces with verified-correct final answers</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="375" y="280">Typical ratio: generate 64 traces per problem, keep 5-15 correct ones</text>
<defs>
<lineargradient id="grad_734898_e0f2f1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#efffff"></stop><stop offset="100%" stop-color="#e0f2f1"></stop></lineargradient>
<lineargradient id="grad_734898_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#e3f2fd"></stop></lineargradient>
<lineargradient id="grad_734898_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#f3e5f5"></stop></lineargradient>
<lineargradient id="grad_734898_f8f9fa" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f8f9fa"></stop></lineargradient>
<lineargradient id="grad_734898_fce4ec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3fb"></stop><stop offset="100%" stop-color="#fce4ec"></stop></lineargradient>
<lineargradient id="grad_734898_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<filter height="115%" id="shadow_734898" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="pipeArrow" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#999"></path>
</marker>
</defs>
</svg>