<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The two recipes for a vertical-domain LLM, evaluated by their 2024-2026 track record." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" style="max-width:880px;background:#fafafa;border:1px solid #ddd;font-family:sans-serif;">
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle">From-scratch vertical model vs. continued-pretrain on frontier base</text>
<rect x="40" y="60" width="380" height="240" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="230" y="84" font-size="13" font-weight="700" fill="#922b21" text-anchor="middle">From-scratch domain model</text>
<text x="50" y="106" font-size="11" font-weight="700">Examples:</text>
<text x="50" y="120" font-size="10">BloombergGPT (50B finance, 2023)</text>
<text x="50" y="134" font-size="10">Galactica (Meta science, 2022)</text>
<text x="50" y="148" font-size="10">BiomedBERT (Microsoft)</text>
<text x="50" y="170" font-size="11" font-weight="700">Recipe:</text>
<text x="50" y="184" font-size="10">train transformer on domain corpus only</text>
<text x="50" y="198" font-size="10">~50B-175B params, custom tokenizer</text>
<text x="50" y="220" font-size="11" font-weight="700">2024-26 outcome:</text>
<text x="50" y="234" font-size="10">- frontier general models (Claude, GPT)</text>
<text x="50" y="248" font-size="10">  caught up on the same benchmark</text>
<text x="50" y="262" font-size="10">  within ~12 months</text>
<text x="50" y="282" font-size="10" fill="#922b21">- doesn't inherit frontier reasoning</text>
<text x="50" y="296" font-size="10" fill="#922b21">- expensive to keep current</text>
<rect x="440" y="60" width="400" height="240" fill="#fff" stroke="#27ae60" stroke-width="2"/>
<text x="640" y="84" font-size="13" font-weight="700" fill="#117a65" text-anchor="middle">Continued pretrain + general post-train</text>
<text x="450" y="106" font-size="11" font-weight="700">Examples:</text>
<text x="450" y="120" font-size="10">Med-PaLM 2 (Google, continued PaLM 2)</text>
<text x="450" y="134" font-size="10">Llama-3-OpenBioLLM (continued Llama-3)</text>
<text x="450" y="148" font-size="10">Qwen3-Coder (continued Qwen3)</text>
<text x="450" y="170" font-size="11" font-weight="700">Recipe:</text>
<text x="450" y="184" font-size="10">strong general base (Llama-3, Qwen3, PaLM 2)</text>
<text x="450" y="198" font-size="10">+ continued pretrain on domain corpus</text>
<text x="450" y="212" font-size="10">+ standard SFT + DPO post-train</text>
<text x="450" y="234" font-size="11" font-weight="700">2024-26 outcome:</text>
<text x="450" y="248" font-size="10">- inherits frontier reasoning and tool use</text>
<text x="450" y="262" font-size="10">- competitive on domain benchmarks</text>
<text x="450" y="276" font-size="10">  AND on cross-domain tasks</text>
<text x="450" y="296" font-size="11" font-weight="700" fill="#117a65">- the dominant 2024-26 recipe</text>
</svg>