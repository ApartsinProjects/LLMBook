<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The four-stage Monte Carlo Tree Search loop drawn as four small trees left to right. Stage one, selection, descends from the root by repeatedly choosing the child with the highest UCB1 score until reaching a leaf. Stage two, expansion, adds a new child node to the selected leaf by prompting the language model. Stage three, simulation, estimates the value of the new node with a language-model value head instead of a random rollout. Stage four, backpropagation, walks the value back up the visited path, updating each ancestor's mean value Q and visit count N. A curved arrow returns from stage four to stage one to show the loop repeats." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 820 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialgradient cx="40%" cy="35%" id="mctsRoot"><stop offset="0%" stop-color="#e1bee7"></stop><stop offset="100%" stop-color="#8e24aa"></stop></radialgradient>
<radialgradient cx="40%" cy="35%" id="mctsNode"><stop offset="0%" stop-color="#cfd8dc"></stop><stop offset="100%" stop-color="#90a4ae"></stop></radialgradient>
<radialgradient cx="40%" cy="35%" id="mctsSel"><stop offset="0%" stop-color="#bbdefb"></stop><stop offset="100%" stop-color="#1e88e5"></stop></radialgradient>
<radialgradient cx="40%" cy="35%" id="mctsNew"><stop offset="0%" stop-color="#c8e6c9"></stop><stop offset="100%" stop-color="#43a047"></stop></radialgradient>
<radialgradient cx="40%" cy="35%" id="mctsVal"><stop offset="0%" stop-color="#ffe0b2"></stop><stop offset="100%" stop-color="#fb8c00"></stop></radialgradient>
<filter height="160%" id="mctsShadow" width="160%" x="-30%" y="-30%"><fedropshadow dx="0.5" dy="1.5" flood-opacity="0.22" stddeviation="1.5"></fedropshadow></filter>
<marker id="mctsArrow" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"></path></marker>
<marker id="mctsArrowUp" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#fb8c00"></path></marker>
</defs>
<rect fill="#fafafa" height="360" rx="8" width="820" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="410" y="26">One MCTS iteration: four stages around the search tree</text>
<!-- panel template: each tree centered at x; root y=70, mids y=130, leaves y=190 -->
<!-- ===== Stage 1: Selection ===== -->
<text fill="#1565c0" font-size="13" font-weight="700" text-anchor="middle" x="105" y="56">1. Selection</text>
<g stroke="#bbb" stroke-width="1.4">
<line x1="105" x2="70" y1="78" y2="128"></line><line x1="105" x2="140" y1="78" y2="128"></line>
<line x1="140" x2="118" y1="138" y2="188"></line><line x1="140" x2="162" y1="138" y2="188"></line>
</g>
<!-- highlight selected path -->
<g stroke="#1e88e5" stroke-width="2.6">
<line x1="105" x2="140" y1="78" y2="128"></line><line x1="140" x2="162" y1="138" y2="188"></line>
</g>
<circle cx="105" cy="70" fill="url(#mctsRoot)" filter="url(#mctsShadow)" r="13"></circle>
<circle cx="70" cy="130" fill="url(#mctsNode)" filter="url(#mctsShadow)" r="11"></circle>
<circle cx="140" cy="130" fill="url(#mctsSel)" filter="url(#mctsShadow)" r="11"></circle>
<circle cx="118" cy="190" fill="url(#mctsNode)" filter="url(#mctsShadow)" r="10"></circle>
<circle cx="162" cy="190" fill="url(#mctsSel)" filter="url(#mctsShadow)" r="10"></circle>
<text fill="#555" font-size="10.5" text-anchor="middle" x="105" y="232">descend by max UCB1</text>
<text fill="#888" font-size="10" text-anchor="middle" x="105" y="247">to a leaf</text>
<!-- arrow to next -->
<line marker-end="url(#mctsArrow)" stroke="#777" stroke-width="2" x1="196" x2="222" y1="150" y2="150"></line>
<!-- ===== Stage 2: Expansion ===== -->
<text fill="#2e7d32" font-size="13" font-weight="700" text-anchor="middle" x="310" y="56">2. Expansion</text>
<g stroke="#bbb" stroke-width="1.4">
<line x1="310" x2="275" y1="78" y2="128"></line><line x1="310" x2="345" y1="78" y2="128"></line>
<line x1="345" x2="323" y1="138" y2="188"></line><line x1="345" x2="367" y1="138" y2="188"></line>
</g>
<line stroke="#43a047" stroke-dasharray="4,2" stroke-width="2.2" x1="367" x2="385" y1="198" y2="238"></line>
<circle cx="310" cy="70" fill="url(#mctsRoot)" filter="url(#mctsShadow)" r="13"></circle>
<circle cx="275" cy="130" fill="url(#mctsNode)" filter="url(#mctsShadow)" r="11"></circle>
<circle cx="345" cy="130" fill="url(#mctsNode)" filter="url(#mctsShadow)" r="11"></circle>
<circle cx="323" cy="190" fill="url(#mctsNode)" filter="url(#mctsShadow)" r="10"></circle>
<circle cx="367" cy="190" fill="url(#mctsNode)" filter="url(#mctsShadow)" r="10"></circle>
<circle cx="389" cy="244" fill="url(#mctsNew)" filter="url(#mctsShadow)" r="10"></circle>
<text fill="#555" font-size="10.5" text-anchor="middle" x="310" y="280">LLM proposes a new</text>
<text fill="#888" font-size="10" text-anchor="middle" x="310" y="295">child action (temp 0.7)</text>
<line marker-end="url(#mctsArrow)" stroke="#777" stroke-width="2" x1="406" x2="432" y1="150" y2="150"></line>
<!-- ===== Stage 3: Simulation ===== -->
<text fill="#e65100" font-size="13" font-weight="700" text-anchor="middle" x="520" y="56">3. Simulation</text>
<g stroke="#bbb" stroke-width="1.4">
<line x1="520" x2="485" y1="78" y2="128"></line><line x1="520" x2="555" y1="78" y2="128"></line>
<line x1="555" x2="533" y1="138" y2="188"></line><line x1="555" x2="577" y1="138" y2="188"></line>
<line x1="577" x2="595" y1="198" y2="238"></line>
</g>
<circle cx="520" cy="70" fill="url(#mctsRoot)" filter="url(#mctsShadow)" r="13"></circle>
<circle cx="485" cy="130" fill="url(#mctsNode)" filter="url(#mctsShadow)" r="11"></circle>
<circle cx="555" cy="130" fill="url(#mctsNode)" filter="url(#mctsShadow)" r="11"></circle>
<circle cx="533" cy="190" fill="url(#mctsNode)" filter="url(#mctsShadow)" r="10"></circle>
<circle cx="577" cy="190" fill="url(#mctsNode)" filter="url(#mctsShadow)" r="10"></circle>
<circle cx="599" cy="244" fill="url(#mctsNew)" filter="url(#mctsShadow)" r="10"></circle>
<rect fill="url(#mctsVal)" filter="url(#mctsShadow)" height="32" rx="7" width="56" x="624" y="228"></rect>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="652" y="248">v=7/10</text>
<line stroke="#fb8c00" stroke-width="2" x1="609" x2="622" y1="244" y2="244"></line>
<text fill="#555" font-size="10.5" text-anchor="middle" x="540" y="295">LLM value head scores</text>
<text fill="#888" font-size="10" text-anchor="middle" x="540" y="310">the new state</text>
<line marker-end="url(#mctsArrow)" stroke="#777" stroke-width="2" x1="612" x2="638" y1="150" y2="150"></line>
<!-- ===== Stage 4: Backpropagation ===== -->
<text fill="#e65100" font-size="13" font-weight="700" text-anchor="middle" x="735" y="56">4. Backprop</text>
<g stroke="#bbb" stroke-width="1.4">
<line x1="735" x2="700" y1="78" y2="128"></line><line x1="735" x2="770" y1="78" y2="128"></line>
<line x1="770" x2="792" y1="138" y2="188"></line>
</g>
<!-- upward update path -->
<g fill="none" stroke="#fb8c00" stroke-width="2.6">
<line marker-end="url(#mctsArrowUp)" x1="792" x2="772" y1="186" y2="140"></line>
<line marker-end="url(#mctsArrowUp)" x1="768" x2="738" y1="126" y2="82"></line>
</g>
<circle cx="735" cy="70" fill="url(#mctsRoot)" filter="url(#mctsShadow)" r="13"></circle>
<circle cx="700" cy="130" fill="url(#mctsNode)" filter="url(#mctsShadow)" r="11"></circle>
<circle cx="770" cy="130" fill="url(#mctsSel)" filter="url(#mctsShadow)" r="11"></circle>
<circle cx="794" cy="190" fill="url(#mctsNew)" filter="url(#mctsShadow)" r="10"></circle>
<text fill="#555" font-size="10.5" text-anchor="middle" x="735" y="232">update Q, N up the</text>
<text fill="#888" font-size="10" text-anchor="middle" x="735" y="247">visited path (EMA)</text>
<!-- loop-back arrow stage4 -> stage1 -->
<path d="M735,318 C735,344 105,344 105,272" fill="none" marker-end="url(#mctsArrow)" stroke="#8e24aa" stroke-dasharray="6,4" stroke-width="2"></path>
<text fill="#8e24aa" font-size="10.5" font-weight="600" text-anchor="middle" x="410" y="340">repeat until compute budget is spent</text>
<!-- UCB1 annotation box -->
<rect fill="#e3f2fd" height="56" rx="8" stroke="#90caf9" stroke-width="1" width="172" x="232" y="70"></rect>
<text fill="#1565c0" font-size="11" font-weight="600" text-anchor="middle" x="318" y="90">UCB1 selection rule</text>
<text fill="#1976d2" font-size="11" text-anchor="middle" x="318" y="108">Q(s,a) + c√( ln N(s) / N(s,a) )</text>
<text fill="#5c6bc0" font-size="9.5" text-anchor="middle" x="318" y="121">exploit + explore, c ≈ 0.5–2.0</text>
</svg>