<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 380" role="img" aria-label="The 2026 agent platform stack. Each layer is open-standard or open-source, and most modern frameworks pick one piece per layer (e.g., LangGraph + MCP + E2B + LangSmith). Knowing which layer a tool lives in prevents the classic mistake of comparing an observability SaaS to an agent runtime." xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<text x="360" y="22" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">The 2026 agent platform stack</text>

<rect x="80" y="50" width="560" height="46" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
<text x="100" y="74" font-size="12" font-weight="600" fill="#be185d">UI / Streaming</text>
<text x="100" y="89" font-size="9" fill="#4a5568">AG-UI: events to frontend (text deltas, tool calls, generative UI)</text>
<text x="620" y="80" font-size="10" font-weight="600" fill="#be185d" text-anchor="end">CopilotKit</text>

<rect x="80" y="104" width="560" height="46" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="100" y="128" font-size="12" font-weight="600" fill="#7c3aed">Agent-to-Agent</text>
<text x="100" y="143" font-size="9" fill="#4a5568">A2A: capability cards + structured messages, cross-vendor delegation</text>
<text x="620" y="134" font-size="10" font-weight="600" fill="#7c3aed" text-anchor="end">Google + 50 partners</text>

<rect x="80" y="158" width="560" height="46" rx="6" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="100" y="182" font-size="12" font-weight="600" fill="#3a73a8">Agent runtime</text>
<text x="100" y="197" font-size="9" fill="#4a5568">LangGraph, OpenAI Agents SDK, PydanticAI, AutoGen, CrewAI</text>
<text x="620" y="188" font-size="10" font-weight="600" fill="#3a73a8" text-anchor="end">orchestration</text>

<rect x="80" y="212" width="560" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="100" y="236" font-size="12" font-weight="600" fill="#d97706">Tool protocol</text>
<text x="100" y="251" font-size="9" fill="#4a5568">MCP: JSON-RPC tools, resources, prompts. Universal client</text>
<text x="620" y="242" font-size="10" font-weight="600" fill="#d97706" text-anchor="end">Anthropic / open</text>

<rect x="80" y="266" width="560" height="46" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="100" y="290" font-size="12" font-weight="600" fill="#047857">Sandboxed execution</text>
<text x="100" y="305" font-size="9" fill="#4a5568">E2B, Modal, Daytona, Cloudflare Containers, Browserbase</text>
<text x="620" y="296" font-size="10" font-weight="600" fill="#047857" text-anchor="end">VMs / browsers</text>

<rect x="80" y="320" width="560" height="46" rx="6" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
<text x="100" y="344" font-size="12" font-weight="600" fill="#0891b2">Observability</text>
<text x="100" y="359" font-size="9" fill="#4a5568">LangSmith, Langfuse, Helicone, AgentOps, Phoenix (OTel)</text>
<text x="620" y="350" font-size="10" font-weight="600" fill="#0891b2" text-anchor="end">traces + evals</text>
</svg>