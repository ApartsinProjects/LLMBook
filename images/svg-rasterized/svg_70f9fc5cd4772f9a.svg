<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The three named pre-LLM automated-decision failures whose lessons now structure every public-sector AI policy framework." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="100%" style="max-width:880px;background:#fafafa;border:1px solid #ddd;font-family:sans-serif;">
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle">Three named automated-decision failures the public-sector field internalized</text>
<rect x="40" y="60" width="260" height="280" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
<text x="170" y="84" font-size="13" font-weight="700" fill="#922b21" text-anchor="middle">Australia Robodebt</text>
<text x="170" y="100" font-size="10" fill="#922b21" text-anchor="middle">Centrelink, 2016-2020</text>
<text x="50" y="124" font-size="11" font-weight="700">Scale:</text>
<text x="50" y="138" font-size="10">~470,000 wrong debts</text>
<text x="50" y="152" font-size="10">~AUD 1.8B claimed</text>
<text x="50" y="174" font-size="11" font-weight="700">Method:</text>
<text x="50" y="188" font-size="10">income-averaging algorithm</text>
<text x="50" y="202" font-size="10">no human-in-the-loop</text>
<text x="50" y="224" font-size="11" font-weight="700">Outcome:</text>
<text x="50" y="238" font-size="10">several deaths by suicide</text>
<text x="50" y="252" font-size="10">government brought down</text>
<text x="50" y="266" font-size="10">AUD 1.2B settlement</text>
<text x="50" y="280" font-size="10">2023 Royal Commission</text>
<text x="50" y="306" font-size="11" font-weight="700" fill="#922b21">Lesson:</text>
<text x="50" y="320" font-size="10" fill="#922b21">human signs adverse benefits</text>
<text x="50" y="334" font-size="10" fill="#922b21">decisions; appeals path mandatory</text>
<rect x="310" y="60" width="260" height="280" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
<text x="440" y="84" font-size="13" font-weight="700" fill="#922b21" text-anchor="middle">Michigan MiDAS</text>
<text x="440" y="100" font-size="10" fill="#922b21" text-anchor="middle">UI fraud detection, 2013-2017</text>
<text x="320" y="124" font-size="11" font-weight="700">Scale:</text>
<text x="320" y="138" font-size="10">40,000+ wrong accusations</text>
<text x="320" y="152" font-size="10">93% error rate at peak</text>
<text x="320" y="174" font-size="11" font-weight="700">Method:</text>
<text x="320" y="188" font-size="10">opaque rule-based system</text>
<text x="320" y="202" font-size="10">automated wage-garnishment</text>
<text x="320" y="224" font-size="11" font-weight="700">Outcome:</text>
<text x="320" y="238" font-size="10">~$20M class-action settlement</text>
<text x="320" y="252" font-size="10">state-level reform legislation</text>
<text x="320" y="266" font-size="10">years of livelihood harm</text>
<text x="320" y="306" font-size="11" font-weight="700" fill="#922b21">Lesson:</text>
<text x="320" y="320" font-size="10" fill="#922b21">opacity + automated accusation</text>
<text x="320" y="334" font-size="10" fill="#922b21">= mass harm in benefits systems</text>
<rect x="580" y="60" width="260" height="280" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
<text x="710" y="84" font-size="13" font-weight="700" fill="#922b21" text-anchor="middle">Netherlands SyRI / toeslagen</text>
<text x="710" y="100" font-size="10" fill="#922b21" text-anchor="middle">2014-2020 + childcare scandal</text>
<text x="590" y="124" font-size="11" font-weight="700">Scale:</text>
<text x="590" y="138" font-size="10">tens of thousands of families</text>
<text x="590" y="152" font-size="10">disproportionately immigrants</text>
<text x="590" y="174" font-size="11" font-weight="700">Method:</text>
<text x="590" y="188" font-size="10">welfare-fraud detection</text>
<text x="590" y="202" font-size="10">ethnic-origin features</text>
<text x="590" y="224" font-size="11" font-weight="700">Outcome:</text>
<text x="590" y="238" font-size="10">Dutch courts ruled SyRI illegal</text>
<text x="590" y="252" font-size="10">(2020, ECHR Art. 8)</text>
<text x="590" y="266" font-size="10">Rutte cabinet fell (Jan 2021)</text>
<text x="590" y="306" font-size="11" font-weight="700" fill="#922b21">Lesson:</text>
<text x="590" y="320" font-size="10" fill="#922b21">disparate-impact testing is</text>
<text x="590" y="334" font-size="10" fill="#922b21">a first-class requirement</text>
</svg>