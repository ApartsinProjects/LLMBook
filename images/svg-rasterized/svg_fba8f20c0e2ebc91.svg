<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="RAFT training-example construction: a gold chunk is bundled with several distractor chunks, an LLM rewrites the gold answer into a chain-of-thought that quotes the supporting span inside begin_quote markers, and a fraction p of examples drop the gold chunk to teach abstention." role="img" viewbox="0 0 780 300" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="290" rx="10" stroke="#ddd" width="770" x="5" y="5"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" x="25" y="32">Distractor-aware RAFT training example</text>
<rect fill="#e8f5e9" height="40" rx="4" stroke="#2e7d32" width="180" x="25" y="55"></rect>
<text fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="115" y="73">Gold chunk d*</text>
<text fill="#2e7d32" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="115" y="89">"...Smith proposed it in 1998..."</text>
<rect fill="#ffebee" height="40" rx="4" stroke="#c62828" width="180" x="25" y="105"></rect>
<text fill="#b71c1c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="115" y="123">Distractor d1</text>
<text fill="#c62828" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="115" y="139">unrelated paragraph</text>
<rect fill="#ffebee" height="40" rx="4" stroke="#c62828" width="180" x="25" y="155"></rect>
<text fill="#b71c1c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="115" y="173">Distractor d2</text>
<text fill="#c62828" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="115" y="189">unrelated paragraph</text>
<rect fill="#ffebee" height="40" rx="4" stroke="#c62828" width="180" x="25" y="205"></rect>
<text fill="#b71c1c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="115" y="223">Distractor d3</text>
<text fill="#c62828" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="115" y="239">unrelated paragraph</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" x="25" y="270">20% of examples: drop d* -&gt; teach abstention</text>
<rect fill="#fff3e0" height="170" rx="6" stroke="#e65100" width="180" x="240" y="60"></rect>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="330" y="82">Question q</text>
<text fill="#e65100" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="330" y="100">"Who proposed the algorithm?"</text>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="330" y="130">Chain-of-thought answer y</text>
<text fill="#e65100" font-family="Consolas, monospace" font-size="10" x="252" y="150">##begin_quote##</text>
<text fill="#e65100" font-family="Consolas, monospace" font-size="10" x="252" y="166">"Smith proposed it in 1998"</text>
<text fill="#e65100" font-family="Consolas, monospace" font-size="10" x="252" y="182">##end_quote##</text>
<text fill="#e65100" font-family="Consolas, monospace" font-size="10" x="252" y="202">Therefore the answer is</text>
<text fill="#e65100" font-family="Consolas, monospace" font-size="10" font-weight="700" x="252" y="218">Smith.</text>
<rect fill="#f3e5f5" height="170" rx="6" stroke="#7b1fa2" stroke-width="1.5" width="285" x="455" y="60"></rect>
<text fill="#4a148c" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="597" y="83">Training loss</text>
<text fill="#7b1fa2" font-family="Consolas, monospace" font-size="11" x="465" y="108">L_RAFT = - sum_t log P(y_t | q,</text>
<text fill="#7b1fa2" font-family="Consolas, monospace" font-size="11" x="465" y="124">         d* + distractors, y_&lt;t)</text>
<text fill="#7b1fa2" font-family="Consolas, monospace" font-size="11" x="465" y="148">y_t includes both the quoted</text>
<text fill="#7b1fa2" font-family="Consolas, monospace" font-size="11" x="465" y="164">span and the derived answer</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="465" y="195">Three priors:</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="465" y="211">1. QA-from-docs  2. Distractors</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="465" y="227">3. Quoted chain-of-thought</text>
<g fill="none" stroke="#555" stroke-width="1.5">
<line x1="207" x2="238" y1="140" y2="140"></line>
<polygon fill="#555" points="238 140, 232 137, 232 143"></polygon>
<line x1="422" x2="453" y1="140" y2="140"></line>
<polygon fill="#555" points="453 140, 447 137, 447 143"></polygon>
</g>
</svg>