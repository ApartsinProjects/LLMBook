<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Five-level agency ladder with example systems and safety thresholds" viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="460" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">The agency spectrum: from stateless completion to self-modification</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Vertical bar = autonomy x goal-directedness; horizontal = time scope of action</text>
<!-- Axis -->
<line x1="60" y1="400" x2="820" y2="400" stroke="#1a1a2e" stroke-width="1.5"/>
<text x="440" y="425" font-size="10" text-anchor="middle" fill="#1a1a2e">time horizon of unsupervised action</text>
<!-- 5 levels -->
<g font-size="10">
<!-- L0 -->
<g transform="translate(80,260)">
<rect width="120" height="140" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
<text x="60" y="20" font-weight="700" text-anchor="middle" fill="#1f7a3a">L0 Completion</text>
<text x="60" y="40" font-size="9" text-anchor="middle" fill="#1a1a2e">stateless</text>
<text x="60" y="56" font-size="9" text-anchor="middle" fill="#1a1a2e">one prompt -&gt;</text>
<text x="60" y="70" font-size="9" text-anchor="middle" fill="#1a1a2e">one output</text>
<text x="60" y="100" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">e.g. raw GPT-4</text>
<text x="60" y="114" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">API call</text>
<text x="60" y="132" font-size="8" text-anchor="middle" fill="#5a4a3a">~1 sec</text>
</g>
<!-- L1 -->
<g transform="translate(220,225)">
<rect width="120" height="175" rx="6" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="1.5"/>
<text x="60" y="20" font-weight="700" text-anchor="middle" fill="#3d4d8a">L1 Tool-Aug</text>
<text x="60" y="40" font-size="9" text-anchor="middle" fill="#1a1a2e">function calling</text>
<text x="60" y="56" font-size="9" text-anchor="middle" fill="#1a1a2e">human in loop</text>
<text x="60" y="84" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">e.g. ChatGPT</text>
<text x="60" y="100" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">+ web search</text>
<text x="60" y="114" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">RAG bots</text>
<text x="60" y="148" font-size="8" text-anchor="middle" fill="#5a4a3a">~minutes</text>
</g>
<!-- L2 -->
<g transform="translate(360,180)">
<rect width="120" height="220" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/>
<text x="60" y="20" font-weight="700" text-anchor="middle" fill="#a67c1a">L2 Task agent</text>
<text x="60" y="40" font-size="9" text-anchor="middle" fill="#1a1a2e">ReAct loop</text>
<text x="60" y="56" font-size="9" text-anchor="middle" fill="#1a1a2e">plan + execute</text>
<text x="60" y="70" font-size="9" text-anchor="middle" fill="#1a1a2e">multi-step</text>
<text x="60" y="100" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">Claude Code,</text>
<text x="60" y="116" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">Cursor agent,</text>
<text x="60" y="130" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">Devin (per task)</text>
<text x="60" y="170" font-size="8" text-anchor="middle" fill="#5a4a3a">hours/task</text>
<text x="60" y="195" font-size="9" font-weight="700" text-anchor="middle" fill="#7a2a4a">safety inflection</text>
</g>
<!-- L3 -->
<g transform="translate(500,120)">
<rect width="120" height="280" rx="6" fill="#f5e3e8" stroke="#7a2a4a" stroke-width="1.5"/>
<text x="60" y="20" font-weight="700" text-anchor="middle" fill="#7a2a4a">L3 Persistent</text>
<text x="60" y="40" font-size="9" text-anchor="middle" fill="#1a1a2e">continuous,</text>
<text x="60" y="56" font-size="9" text-anchor="middle" fill="#1a1a2e">multi-session</text>
<text x="60" y="70" font-size="9" text-anchor="middle" fill="#1a1a2e">memory</text>
<text x="60" y="100" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">autonomous</text>
<text x="60" y="116" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">CSR / SRE</text>
<text x="60" y="130" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">agents</text>
<text x="60" y="170" font-size="8" text-anchor="middle" fill="#5a4a3a">days/weeks</text>
<text x="60" y="200" font-size="9" font-weight="700" text-anchor="middle" fill="#7a2a4a">SLO + monitoring</text>
<text x="60" y="214" font-size="9" font-weight="700" text-anchor="middle" fill="#7a2a4a">required</text>
<text x="60" y="250" font-size="9" text-anchor="middle" fill="#1a1a2e">62.1 infra</text>
</g>
<!-- L4 -->
<g transform="translate(640,80)">
<rect width="120" height="320" rx="6" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="2"/>
<text x="60" y="20" font-weight="700" text-anchor="middle" fill="#7a2a2a">L4 Self-modify</text>
<text x="60" y="40" font-size="9" text-anchor="middle" fill="#1a1a2e">rewrites own</text>
<text x="60" y="56" font-size="9" text-anchor="middle" fill="#1a1a2e">prompts, tools,</text>
<text x="60" y="70" font-size="9" text-anchor="middle" fill="#1a1a2e">or weights</text>
<text x="60" y="100" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">Voyager,</text>
<text x="60" y="116" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">SPRING</text>
<text x="60" y="130" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">(research only)</text>
<text x="60" y="170" font-size="8" text-anchor="middle" fill="#5a4a3a">open-ended</text>
<text x="60" y="200" font-size="9" font-weight="700" text-anchor="middle" fill="#7a2a4a">NO production</text>
<text x="60" y="214" font-size="9" font-weight="700" text-anchor="middle" fill="#7a2a4a">system in 2026</text>
<text x="60" y="270" font-size="9" text-anchor="middle" fill="#1a1a2e">scalable</text>
<text x="60" y="284" font-size="9" text-anchor="middle" fill="#1a1a2e">oversight = open</text>
</g>
</g>
<!-- Safety inflection annotation -->
<path d="M 480 195 Q 510 145 540 130" stroke="#7a2a4a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr814)"/>
<defs>
<marker id="arr814" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7a2a4a"/></marker>
</defs>
<text x="500" y="68" font-size="10" font-weight="700" text-anchor="middle" fill="#7a2a4a">L2 -&gt; L3 boundary:</text>
<text x="500" y="82" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">"capable" -&gt; "reliably safe"</text>
</svg>