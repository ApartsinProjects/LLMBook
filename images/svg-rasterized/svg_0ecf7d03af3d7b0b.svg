<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="2026 model zoo: three layers from closed API to open frontier to small open" viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="360" fill="#ffffff"/>
