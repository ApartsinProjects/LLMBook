<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="FlashAttention: tile Q, K, V into SRAM and never materialize the T × T matrix in HBM" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="260" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="360" y="22">FlashAttention: tile Q, K, V into SRAM and never materialize the T × T matrix in HBM</text>
<g transform="translate(20,50)">
<rect fill="#fff3e0" height="180" rx="8" stroke="#a67c1a" stroke-width="2" width="320"></rect>
<text fill="#a67c1a" font-size="12" font-weight="700" text-anchor="middle" x="160" y="22">Standard attention (memory-bound)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="50">1. Compute S = QKᵀ in HBM ➞ T×T write</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="70">2. Read S, compute softmax, write P</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="160" y="90">3. Read P, multiply by V, write O</text>
<text fill="#a67c1a" font-size="10" text-anchor="middle" x="160" y="120">HBM traffic: 3 · T² reads + 2 · T² writes</text>
<text fill="#a67c1a" font-size="10" text-anchor="middle" x="160" y="140">FLOPs/byte ratio: poor → GPU starved</text>
<text fill="#666" font-size="10" font-style="italic" text-anchor="middle" x="160" y="162">T=8K: ~256 MB just for the score matrix.</text>
</g>
<g transform="translate(360,50)">
<rect fill="#e8f5e9" height="180" rx="8" stroke="#2e7d32" stroke-width="2" width="340"></rect>
<text fill="#2e7d32" font-size="12" font-weight="700" text-anchor="middle" x="170" y="22">FlashAttention (tiled + fused kernel)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="170" y="50">1. Tile Q into B_r blocks, K,V into B_c blocks</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="170" y="70">2. Load tiles into SRAM (on-chip, fast)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="170" y="90">3. Compute QKᵀ, softmax, PV in one pass</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="170" y="110">4. Use online softmax to combine tile outputs</text>
<text fill="#2e7d32" font-size="10" text-anchor="middle" x="170" y="138">HBM traffic: O(T) instead of O(T²)</text>
<text fill="#2e7d32" font-size="10" text-anchor="middle" x="170" y="158">Same exact result, 2-4× wall-clock speedup</text>
</g>
</svg>