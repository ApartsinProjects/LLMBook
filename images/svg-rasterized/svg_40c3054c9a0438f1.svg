<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Constrained decoding: logit masking against an FSM" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig484title" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;">
<title id="fig484title">Constrained decoding: logit masking against an FSM</title>
<defs>
<marker id="arr484" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 z" fill="#444"/>
</marker>
</defs>
<text x="380" y="24" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Constrained decoding: the validator participates in generation</text>
<g font-family="Georgia, serif" font-size="11">
<rect x="20" y="60" width="180" height="100" rx="6" fill="#e8f1fb" stroke="#1f77b4"/>
<text x="110" y="82" text-anchor="middle" font-weight="bold" fill="#1f77b4">Pydantic schema</text>
<text x="110" y="104" text-anchor="middle" fill="#444" font-family="Consolas, monospace" font-size="10">class SafetyDecision:</text>
<text x="110" y="118" text-anchor="middle" fill="#444" font-family="Consolas, monospace" font-size="10">  verdict: Literal[</text>
<text x="110" y="132" text-anchor="middle" fill="#444" font-family="Consolas, monospace" font-size="10">    "safe","unsafe","review"]</text>
<text x="110" y="150" text-anchor="middle" fill="#666" font-style="italic">type → grammar</text>
<line x1="200" y1="110" x2="230" y2="110" stroke="#444" stroke-width="2" marker-end="url(#arr484)"/>
<rect x="240" y="60" width="180" height="100" rx="6" fill="#fff5d9" stroke="#cc8400"/>
<text x="330" y="82" text-anchor="middle" font-weight="bold" fill="#cc8400">FSM compilation</text>
<text x="330" y="104" text-anchor="middle" fill="#444">Outlines / Guidance</text>
<text x="330" y="120" text-anchor="middle" fill="#444">walks vocab once</text>
<text x="330" y="136" text-anchor="middle" fill="#444">per schema (cached)</text>
<text x="330" y="152" text-anchor="middle" fill="#666" font-style="italic">FSM over 128k tokens</text>
<line x1="420" y1="110" x2="450" y2="110" stroke="#444" stroke-width="2" marker-end="url(#arr484)"/>
<rect x="460" y="52" width="290" height="100" rx="6" fill="#e9f7e9" stroke="#2ca02c"/>
<text x="605" y="82" text-anchor="middle" font-weight="bold" fill="#2ca02c">Token-level mask at each step</text>
<text x="605" y="104" text-anchor="middle" fill="#444" font-family="Consolas, monospace" font-size="10">allowed = fsm.next_tokens(state)</text>
<text x="605" y="118" text-anchor="middle" fill="#444" font-family="Consolas, monospace" font-size="10">logits[~allowed] = -inf</text>
<text x="605" y="132" text-anchor="middle" fill="#444" font-family="Consolas, monospace" font-size="10">sample(softmax(logits))</text>
<text x="605" y="152" text-anchor="middle" fill="#666" font-style="italic">invalid tokens are unreachable</text>
<text x="380" y="195" text-anchor="middle" font-weight="bold" fill="#222" font-size="13">Why this is safety, not just formatting:</text>
<rect x="40" y="210" width="220" height="100" rx="6" fill="#fff" stroke="#1f77b4"/>
<text x="150" y="232" text-anchor="middle" font-weight="bold" fill="#1f77b4">Output cannot violate schema</text>
<text x="150" y="252" text-anchor="middle" fill="#444">no malformed JSON</text>
<text x="150" y="268" text-anchor="middle" fill="#444">no missing fields</text>
<text x="150" y="284" text-anchor="middle" fill="#444">no out-of-enum verdict</text>
<text x="150" y="302" text-anchor="middle" fill="#2ca02c" font-style="italic">structural failures: 0</text>
<rect x="270" y="210" width="220" height="100" rx="6" fill="#fff" stroke="#cc8400"/>
<text x="380" y="232" text-anchor="middle" font-weight="bold" fill="#cc8400">Channels you closed</text>
<text x="380" y="252" text-anchor="middle" fill="#444">no PII field → no PII leak</text>
<text x="380" y="268" text-anchor="middle" fill="#444">finite verdict set</text>
<text x="380" y="284" text-anchor="middle" fill="#444">max_length bound</text>
<text x="380" y="302" text-anchor="middle" fill="#cc8400" font-style="italic">attack surface shrinks</text>
<rect x="500" y="210" width="240" height="100" rx="6" fill="#fff" stroke="#d62728"/>
<text x="620" y="232" text-anchor="middle" font-weight="bold" fill="#d62728">What it does NOT solve</text>
<text x="620" y="252" text-anchor="middle" fill="#444">model can still hallucinate</text>
<text x="620" y="268" text-anchor="middle" fill="#444">inside a valid schema</text>
<text x="620" y="284" text-anchor="middle" fill="#444">verdict can be wrong</text>
<text x="620" y="302" text-anchor="middle" fill="#d62728" font-style="italic">still needs detection layer</text>
</g>
</svg>