<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 380" role="img" aria-label="Six-cell grid of agent benchmark families: software engineering, browser/web, tool-use mechanics, customer service, general assistants, and computer use" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
