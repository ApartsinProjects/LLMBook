<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="FlashAttention: tile Q, K, V into SRAM and never materialize the score matrix" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="320" width="760"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="380" y="22">FlashAttention: tile Q, K, V into SRAM and never materialize the score matrix</text>
<g transform="translate(20,50)">
<rect fill="#fff3e0" height="240" rx="8" stroke="#a67c1a" stroke-width="2" width="340"></rect>
<text fill="#a67c1a" font-size="12" font-weight="700" text-anchor="middle" x="170" y="22">Naive attention (PyTorch)</text>
<g font-size="10" text-anchor="middle">
<rect fill="#fff" height="40" rx="4" stroke="#a67c1a" width="80" x="20" y="40"></rect><text fill="#1a1a2e" x="60" y="64">Q (HBM)</text>
<rect fill="#fff" height="40" rx="4" stroke="#a67c1a" width="80" x="120" y="40"></rect><text fill="#1a1a2e" x="160" y="64">K (HBM)</text>
<rect fill="#fff" height="40" rx="4" stroke="#a67c1a" width="80" x="220" y="40"></rect><text fill="#1a1a2e" x="260" y="64">V (HBM)</text>
<text fill="#5a4a3a" x="170" y="100">↓ Q·Kₜ (one HBM round-trip)</text>
<rect fill="#ffe0b2" height="34" rx="4" stroke="#a67c1a" width="200" x="60" y="108"></rect>
<text fill="#1a1a2e" x="160" y="130">S = N×N scores in HBM (128 MB!)</text>
<text fill="#5a4a3a" x="170" y="160">↓ softmax (second round-trip)</text>
<rect fill="#ffe0b2" height="34" rx="4" stroke="#a67c1a" width="200" x="60" y="168"></rect>
<text fill="#1a1a2e" x="160" y="190">P = softmax(S) in HBM (128 MB)</text>
<text fill="#5a4a3a" x="170" y="218">↓ P·V (third round-trip)</text>
<rect fill="#fff" height="14" rx="3" stroke="#a67c1a" width="120" x="100" y="220"></rect>
<text fill="#1a1a2e" x="160" y="231">O (HBM)</text>
</g>
<text fill="#a67c1a" font-size="9" font-style="italic" text-anchor="middle" x="170" y="252">4 HBM round-trips, O(N²) memory</text>
</g>
<g transform="translate(400,50)">
<rect fill="#e3e8f5" height="240" rx="8" stroke="#3d4d8a" stroke-width="2" width="340"></rect>
<text fill="#3d4d8a" font-size="12" font-weight="700" text-anchor="middle" x="170" y="22">FlashAttention (tiled SRAM)</text>
<g font-size="10" text-anchor="middle">
<rect fill="#fff" height="40" rx="4" stroke="#3d4d8a" width="80" x="20" y="40"></rect><text fill="#1a1a2e" x="60" y="64">Q (HBM)</text>
<rect fill="#fff" height="40" rx="4" stroke="#3d4d8a" width="80" x="120" y="40"></rect><text fill="#1a1a2e" x="160" y="64">K (HBM)</text>
<rect fill="#fff" height="40" rx="4" stroke="#3d4d8a" width="80" x="220" y="40"></rect><text fill="#1a1a2e" x="260" y="64">V (HBM)</text>
<text fill="#5a4a3a" x="170" y="100">↓ load BLOCK_M x d into SRAM</text>
<rect fill="#bbdefb" height="80" rx="6" stroke="#3d4d8a" stroke-width="2" width="240" x="40" y="108"></rect>
<text fill="#0d47a1" font-weight="700" x="160" y="128">on-chip SRAM (~20 MB)</text>
<text fill="#1a1a2e" font-size="9" x="160" y="148">for each K/V tile:</text>
<text fill="#1a1a2e" font-size="9" x="160" y="163">  Sₐ = Q·Kₜₐ, then online softmax</text>
<text fill="#1a1a2e" font-size="9" x="160" y="178">  acc += softmax(Sₐ)·Vₐ</text>
<text fill="#5a4a3a" x="170" y="208">↓ single write</text>
<rect fill="#fff" height="14" rx="3" stroke="#3d4d8a" width="120" x="100" y="216"></rect>
<text fill="#1a1a2e" x="160" y="227">O (HBM)</text>
</g>
<text fill="#3d4d8a" font-size="9" font-style="italic" text-anchor="middle" x="170" y="252">2 HBM round-trips, O(N) memory</text>
</g>
</svg>