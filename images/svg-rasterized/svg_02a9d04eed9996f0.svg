<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Decision framework for ML versus LLM versus hybrid: a central Evaluate Task Requirements diamond branches to Classical ML (structured data, high volume; TF-IDF, XGBoost, spaCy), LLM (unstructured text, complex reasoning; GPT-4, Claude), and Hybrid (mixed complexity; classifier triage plus LLM escalation)." font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 750 420" xmlns="http://www.w3.org/2000/svg">
<!-- Title -->
<!-- Central decision diamond -->
<polygon fill="#f0e6ff" points="375,60 520,150 375,240 230,150" stroke="#8e44ad" stroke-linecap="round" stroke-width="2"></polygon>
<text fill="#1a1a2e" font-size="13" font-weight="600" text-anchor="middle" x="375" y="140">Evaluate Task</text>
<text fill="#1a1a2e" font-size="13" font-weight="600" text-anchor="middle" x="375" y="158">Requirements</text>
<!-- Left branch: Classical ML -->
<line marker-end="url(#arrowGreen)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="230" x2="80" y1="150" y2="150"></line>
<rect fill="#e8f5e9" filter="url(#shadow_9c41aa)" height="70" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="140" x="10" y="115"></rect>
<text fill="#27ae60" font-size="13" font-weight="700" text-anchor="middle" x="80" y="145">Classical ML</text>
<text fill="#555" font-size="11" text-anchor="middle" x="80" y="165">Low cost, low latency</text>
<!-- Right branch: LLM -->
<line marker-end="url(#arrowRed)" stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="520" x2="670" y1="150" y2="150"></line>
<rect fill="#fde8ec" height="70" rx="10" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="140" x="600" y="115"></rect>
<text fill="#e94560" font-size="13" font-weight="700" text-anchor="middle" x="670" y="145">LLM</text>
<text fill="#555" font-size="11" text-anchor="middle" x="670" y="165">High flexibility</text>
<!-- Bottom branch: Hybrid -->
<line marker-end="url(#arrowBlue)" stroke="#3498db" stroke-linecap="round" stroke-width="2" x1="375" x2="375" y1="240" y2="310"></line>
<rect fill="url(#grad_9c41aa_e8f4fd)" height="70" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="160" x="295" y="310"></rect>
<text fill="#3498db" font-size="13" font-weight="700" text-anchor="middle" x="375" y="340">Hybrid</text>
<text fill="#555" font-size="11" text-anchor="middle" x="375" y="360">Best of both worlds</text>
<!-- Decision criteria labels -->
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="155" y="130">Structured data</text>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="155" y="143">High volume</text>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="600" y="130">Unstructured text</text>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="600" y="143">Complex reasoning</text>
<text fill="#3498db" font-size="11" font-weight="600" text-anchor="middle" x="310" y="285">Mixed complexity</text>
<!-- Bottom examples -->
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="80.0" x2="80.0" y1="197.0" y2="187.0"></line>
<text fill="#555" font-size="11" text-anchor="middle" x="80" y="210">TF-IDF, XGBoost, LR</text>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="80.0" x2="80.0" y1="210.0" y2="187.0"></line>
<text fill="#555" font-size="11" text-anchor="middle" x="80" y="223">spaCy, regex, CRF</text>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="670.0" x2="670.0" y1="197.0" y2="187.0"></line>
<text fill="#555" font-size="11" text-anchor="middle" x="670" y="210">GPT-4, Claude, Llama</text>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="670.0" x2="670.0" y1="210.0" y2="187.0"></line>
<text fill="#555" font-size="11" text-anchor="middle" x="670" y="223">Few-shot, CoT</text>
<text fill="#555" font-size="11" text-anchor="middle" x="375" y="400">Classifier triage + LLM escalation</text>
<!-- Arrow markers -->
<defs>
<lineargradient id="grad_9c41aa_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_9c41aa" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowGreen" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#27ae60" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="arrowRed" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#e94560" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="arrowBlue" markerheight="7" markerwidth="10" orient="auto" refx="3.5" refy="10">
<polygon fill="#3498db" points="0 0, 3.5 10, 7 0"></polygon>
</marker>
</defs>
</svg>