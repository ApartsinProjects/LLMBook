<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 740 280" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;" aria-label="GPTQ vs AWQ: two recipes, same 4-bit serving target">
<rect width="740" height="280" fill="#ffffff"/>
<text x="370" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">GPTQ vs AWQ: two recipes, same 4-bit serving target</text>
<g transform="translate(20,45)">
<rect width="340" height="220" rx="8" fill="#fff3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="170" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">GPTQ: per-column Hessian compensation</text>
<g font-size="10">
<text x="20" y="48" fill="#1a1a2e">1. compute H = X&#7488;X on calibration acts</text>
<text x="20" y="68" fill="#1a1a2e">2. for each column j of W:</text>
<text x="36" y="84" fill="#5a4a3a">round w&#11388; to nearest INT4 level</text>
<text x="36" y="100" fill="#5a4a3a">push error &#948;&#11388; into columns &gt; j via H&#8315;&#185;</text>
<text x="20" y="124" fill="#1a1a2e">3. repeat for all layers (sequential)</text>
<text x="20" y="156" font-style="italic" fill="#5a4a3a">Strength: provably near-optimal MSE</text>
<text x="20" y="172" font-style="italic" fill="#5a4a3a">Cost: ~4 hours for 70B on one GPU</text>
<text x="20" y="188" font-style="italic" fill="#5a4a3a">Needs: 128-sample C4 calibration</text>
<text x="20" y="206" font-weight="700" fill="#a67c1a">Best when: max quality on 1 model</text>
</g>
</g>
<g transform="translate(380,45)">
<rect width="340" height="220" rx="8" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="170" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#3d4d8a">AWQ: per-channel activation-aware scaling</text>
<g font-size="10">
<text x="20" y="48" fill="#1a1a2e">1. measure |x&#11388;| from calibration acts</text>
<text x="20" y="68" fill="#1a1a2e">2. learn per-channel scale s&#11388; that protects</text>
<text x="36" y="84" fill="#5a4a3a">salient (high-magnitude) channels</text>
<text x="20" y="108" fill="#1a1a2e">3. quantize: W&#770; = Q(W &#183; diag(s)) &#183; diag(s)&#8315;&#185;</text>
<text x="20" y="124" fill="#1a1a2e">4. all layers in parallel</text>
<text x="20" y="156" font-style="italic" fill="#5a4a3a">Strength: ~4x faster than GPTQ</text>
<text x="20" y="172" font-style="italic" fill="#5a4a3a">Cost: 30-60 min for 70B</text>
<text x="20" y="188" font-style="italic" fill="#5a4a3a">Needs: small calibration set</text>
<text x="20" y="206" font-weight="700" fill="#3d4d8a">Best when: many models, fast turnaround</text>
</g>
</g>
</svg>