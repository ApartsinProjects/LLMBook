<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The five-layer verified-RAG architecture for legal LLMs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="fig-72-4-1-title fig-72-4-1-desc">
<title id="fig-72-4-1-title">The five-layer verified-RAG architecture for legal LLMs</title>
<desc id="fig-72-4-1-desc">Pipeline diagram showing five horizontally-arrayed layers with arrows: Source acquisition (Westlaw / Lexis / PACER / Federal Register), Verified extraction (caption/court/date/citation), Retrieval (jurisdiction + matter-level ACL), Generation (grounded RAG, refuses if no chunk), Citation verification (CourtListener / Westlaw KeyCite, strips unresolved). Layer 5 highlighted in red as legal-specific and non-optional.</desc>
<rect x="0" y="0" width="760" height="380" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">Verified-RAG architecture (Harvey, Hebbia, Casetext, Spellbook, Robin AI all converged here)</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- top label for layers 1-4 -->
<rect x="20" y="48" width="600" height="20" fill="#dfeaf5" stroke="#2c5fa0"/>
<text x="320" y="62" text-anchor="middle" font-weight="700" fill="#2c5fa0">Layers 1-4: general-purpose RAG (Chapter 32 pattern)</text>

<!-- top label for layer 5 -->
<rect x="630" y="48" width="110" height="20" fill="#f1d6d0" stroke="#b2351e"/>
<text x="685" y="62" text-anchor="middle" font-weight="700" fill="#b2351e">Legal-specific</text>

<!-- layer 1 -->
<rect x="20" y="88" width="140" height="190" fill="#dfeaf5" stroke="#2c5fa0" rx="4"/>
<text x="90" y="100" text-anchor="middle" font-weight="700" fill="#2c5fa0">1. Source acquisition</text>
<text x="90" y="124" text-anchor="middle" font-size="10">Westlaw API</text>
<text x="90" y="140" text-anchor="middle" font-size="10">Lexis</text>
<text x="90" y="156" text-anchor="middle" font-size="10">PACER feeds</text>
<text x="90" y="172" text-anchor="middle" font-size="10">Federal Register</text>
<text x="90" y="188" text-anchor="middle" font-size="10">State primary law</text>
<text x="90" y="220" text-anchor="middle" font-size="10" font-style="italic" fill="#b2351e">No web scraping</text>
<text x="90" y="240" text-anchor="middle" font-size="10" font-style="italic" fill="#b2351e">(blog hallucination</text>
<text x="90" y="252" text-anchor="middle" font-size="10" font-style="italic" fill="#b2351e">risk)</text>

<line x1="160" y1="170" x2="180" y2="170" stroke="#5a6573" stroke-width="2" marker-end="url(#arr5)"/>

<!-- layer 2 -->
<rect x="180" y="80" width="140" height="190" fill="#eef5ec" stroke="#1f6f3a" rx="4"/>
<text x="250" y="100" text-anchor="middle" font-weight="700" fill="#1f6f3a">2. Verified extraction</text>
<text x="250" y="124" text-anchor="middle" font-size="10">caption</text>
<text x="250" y="140" text-anchor="middle" font-size="10">court</text>
<text x="250" y="156" text-anchor="middle" font-size="10">date</text>
<text x="250" y="172" text-anchor="middle" font-size="10">citation</text>
<text x="250" y="188" text-anchor="middle" font-size="10">system ID</text>
<text x="250" y="220" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6573">LLM parses,</text>
<text x="250" y="234" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6573">deterministic</text>
<text x="250" y="248" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6573">schema validates</text>

<line x1="320" y1="170" x2="340" y2="170" stroke="#5a6573" stroke-width="2" marker-end="url(#arr5)"/>

<!-- layer 3 -->
<rect x="340" y="80" width="140" height="190" fill="#fff5d6" stroke="#b8860b" rx="4"/>
<text x="410" y="100" text-anchor="middle" font-weight="700" fill="#7a5a08">3. Retrieval index</text>
<text x="410" y="124" text-anchor="middle" font-size="10">by jurisdiction</text>
<text x="410" y="140" text-anchor="middle" font-size="10">by practice area</text>
<text x="410" y="156" text-anchor="middle" font-size="10">by doc type</text>
<text x="410" y="172" text-anchor="middle" font-size="10">+ matter-level</text>
<text x="410" y="186" text-anchor="middle" font-size="10">access control</text>
<text x="410" y="220" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6573">ACL at the</text>
<text x="410" y="234" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6573">retrieval layer,</text>
<text x="410" y="248" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6573">not the model</text>

<line x1="480" y1="170" x2="500" y2="170" stroke="#5a6573" stroke-width="2" marker-end="url(#arr5)"/>

<!-- layer 4 -->
<rect x="500" y="80" width="120" height="190" fill="#ede4f7" stroke="#5a3d99" rx="4"/>
<text x="560" y="100" text-anchor="middle" font-weight="700" fill="#5a3d99">4. Generation</text>
<text x="560" y="124" text-anchor="middle" font-size="10">grounded RAG</text>
<text x="560" y="140" text-anchor="middle" font-size="10">low temperature</text>
<text x="560" y="156" text-anchor="middle" font-size="10">inline citations</text>
<text x="560" y="172" text-anchor="middle" font-size="10">refuse if no</text>
<text x="560" y="186" text-anchor="middle" font-size="10">chunks retrieved</text>

<line x1="620" y1="170" x2="640" y2="170" stroke="#b2351e" stroke-width="3" marker-end="url(#arr6)"/>

<!-- layer 5 -->
<rect x="640" y="80" width="100" height="190" fill="#f1d6d0" stroke="#b2351e" stroke-width="2" rx="4"/>
<text x="690" y="100" text-anchor="middle" font-weight="700" fill="#b2351e">5. Citation</text>
<text x="690" y="116" text-anchor="middle" font-weight="700" fill="#b2351e">verification</text>
<text x="690" y="140" text-anchor="middle" font-size="10">CourtListener</text>
<text x="690" y="154" text-anchor="middle" font-size="10">Westlaw KeyCite</text>
<text x="690" y="168" text-anchor="middle" font-size="10">U.S. Code XML</text>
<text x="690" y="186" text-anchor="middle" font-size="10">strip unresolved</text>
<text x="690" y="220" text-anchor="middle" font-size="10" font-style="italic" fill="#b2351e">non-optional</text>
<text x="690" y="234" text-anchor="middle" font-size="10" font-style="italic" fill="#b2351e">under ABA</text>
<text x="690" y="248" text-anchor="middle" font-size="10" font-style="italic" fill="#b2351e">Op 512</text>

<defs>
<marker id="arr5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a6573"/></marker>
<marker id="arr6" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b2351e"/></marker>
</defs>

<!-- audit log row -->
<rect x="20" y="300" width="720" height="40" fill="#fafafe" stroke="#a8b9d4" rx="4"/>
<text x="380" y="324" text-anchor="middle" font-weight="700">Audit log: query · retrieved chunks · model output · verified citations · delivered output</text>
</g>
<text x="380" y="364" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#5a6573">Magesh et al. 2024 "Hallucination-Free?" measured residual hallucination at this fifth layer; the legal industry rebuilt around it.</text>
</svg>