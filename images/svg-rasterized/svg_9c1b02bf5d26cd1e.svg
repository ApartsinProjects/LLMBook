<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Two equivalent views of the multi-head attention output projection. On the left, the per-head outputs H1 through H4 are concatenated into one wide matrix and multiplied by a single output matrix W_O. On the right, the same W_O is block-decomposed into four horizontal slabs, each head output is multiplied by its own slab, and the four results are summed. Both paths produce the same MHA output." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="mhaH1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bbdefb"></stop><stop offset="100%" stop-color="#1e88e5"></stop></lineargradient>
<lineargradient id="mhaH2" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"></stop><stop offset="100%" stop-color="#43a047"></stop></lineargradient>
<lineargradient id="mhaH3" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffe0b2"></stop><stop offset="100%" stop-color="#fb8c00"></stop></lineargradient>
<lineargradient id="mhaH4" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e1bee7"></stop><stop offset="100%" stop-color="#8e24aa"></stop></lineargradient>
<lineargradient id="mhaWo" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#eceff1"></stop><stop offset="100%" stop-color="#b0bec5"></stop></lineargradient>
<lineargradient id="mhaOut" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3e0"></stop><stop offset="100%" stop-color="#ffb74d"></stop></lineargradient>
<filter height="116%" id="mhaShadow" width="116%" x="-8%" y="-8%"><fedropshadow dx="1" dy="2" flood-opacity="0.2" stddeviation="2"></fedropshadow></filter>
<marker id="mhaArrow" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"></path></marker>
</defs>
<rect fill="#fafafa" height="420" rx="8" width="800" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="400" y="28">Two equal views of the head-merge: concat-then-project = sum of per-head slabs</text>
<!-- divider -->
<line stroke="#e0e0e0" stroke-dasharray="3,3" stroke-width="1.5" x1="400" x2="400" y1="50" y2="392"></line>
<text fill="#555" font-size="13" font-weight="600" text-anchor="middle" x="200" y="62">View A: concatenate, then one Wₒ</text>
<text fill="#555" font-size="13" font-weight="600" text-anchor="middle" x="600" y="62">View B: per-head slabs, then sum</text>
<!-- LEFT: concat block -->
<g fill="#fff" font-size="12" font-weight="600" text-anchor="middle">
<rect fill="url(#mhaH1)" filter="url(#mhaShadow)" height="120" rx="6" width="42" x="60" y="82"></rect><text x="81" y="148">H₁</text>
<rect fill="url(#mhaH2)" filter="url(#mhaShadow)" height="120" rx="6" width="42" x="104" y="82"></rect><text x="125" y="148">H₂</text>
<rect fill="url(#mhaH3)" filter="url(#mhaShadow)" height="120" rx="6" width="42" x="148" y="82"></rect><text x="169" y="148">H₃</text>
<rect fill="url(#mhaH4)" filter="url(#mhaShadow)" height="120" rx="6" width="42" x="192" y="82"></rect><text x="213" y="148">H₄</text>
</g>
<text fill="#888" font-size="11" text-anchor="middle" x="147" y="222">[ H₁ H₂ H₃ H₄ ]  ∈ ℝⁿˣᵈᵒᵈᵉ</text>
<text fill="#555" font-size="20" font-weight="700" text-anchor="middle" x="250" y="148">×</text>
<rect fill="url(#mhaWo)" filter="url(#mhaShadow)" height="120" rx="6" width="58" x="266" y="82"></rect>
<text fill="#37474f" font-size="13" font-weight="700" text-anchor="middle" x="295" y="138">Wₒ</text>
<text fill="#546e7a" font-size="10" text-anchor="middle" x="295" y="156">dₘₕ×dₘₕ</text>
<line marker-end="url(#mhaArrow)" stroke="#777" stroke-width="2" x1="324" x2="356" y1="142" y2="142"></line>
<rect fill="url(#mhaOut)" filter="url(#mhaShadow)" height="60" rx="6" width="28" x="356" y="112"></rect>
<text fill="#5d4037" font-size="12" font-weight="700" text-anchor="middle" x="370" y="147">y</text>
<!-- RIGHT: per-head slabs summed -->
<g fill="#fff" font-size="11" font-weight="600" text-anchor="middle">
<rect fill="url(#mhaH1)" filter="url(#mhaShadow)" height="34" rx="5" width="34" x="436" y="78"></rect><text x="453" y="100">H₁</text>
<rect fill="url(#mhaH2)" filter="url(#mhaShadow)" height="34" rx="5" width="34" x="436" y="148"></rect><text x="453" y="170">H₂</text>
<rect fill="url(#mhaH3)" filter="url(#mhaShadow)" height="34" rx="5" width="34" x="436" y="218"></rect><text x="453" y="240">H₃</text>
<rect fill="url(#mhaH4)" filter="url(#mhaShadow)" height="34" rx="5" width="34" x="436" y="288"></rect><text x="453" y="310">H₄</text>
</g>
<g fill="#555" font-size="16" font-weight="700" text-anchor="middle">
<text x="486" y="101">×</text><text x="486" y="171">×</text><text x="486" y="241">×</text><text x="486" y="311">×</text>
</g>
<!-- W_O sliced into 4 horizontal slabs -->
<g text-anchor="middle">
<rect fill="url(#mhaH1)" filter="url(#mhaShadow)" height="34" opacity="0.55" rx="5" width="62" x="502" y="78"></rect><text fill="#0d47a1" font-size="11" font-weight="700" x="533" y="100">Wₒ¹</text>
<rect fill="url(#mhaH2)" filter="url(#mhaShadow)" height="34" opacity="0.55" rx="5" width="62" x="502" y="148"></rect><text fill="#1b5e20" font-size="11" font-weight="700" x="533" y="170">Wₒ²</text>
<rect fill="url(#mhaH3)" filter="url(#mhaShadow)" height="34" opacity="0.55" rx="5" width="62" x="502" y="218"></rect><text fill="#e65100" font-size="11" font-weight="700" x="533" y="240">Wₒ³</text>
<rect fill="url(#mhaH4)" filter="url(#mhaShadow)" height="34" opacity="0.55" rx="5" width="62" x="502" y="288"></rect><text fill="#4a148c" font-size="11" font-weight="700" x="533" y="310">Wₒ⁴</text>
</g>
<text fill="#888" font-size="10" text-anchor="middle" x="533" y="345">slabs of Wₒ, each dₕ×dₘₕ</text>
<!-- sum arrows -->
<g fill="none" stroke="#777" stroke-width="1.6">
<path d="M564,95 C600,95 612,160 636,196" marker-end="url(#mhaArrow)"></path>
<path d="M564,165 C596,165 612,180 636,200" marker-end="url(#mhaArrow)"></path>
<path d="M564,235 C596,235 612,220 636,206" marker-end="url(#mhaArrow)"></path>
<path d="M564,305 C600,305 612,250 636,210" marker-end="url(#mhaArrow)"></path>
</g>
<circle cx="660" cy="203" fill="url(#mhaOut)" filter="url(#mhaShadow)" r="24"></circle>
<text fill="#5d4037" font-size="18" font-weight="700" text-anchor="middle" x="660" y="210">Σ</text>
<line marker-end="url(#mhaArrow)" stroke="#777" stroke-width="2" x1="684" x2="712" y1="203" y2="203"></line>
<rect fill="url(#mhaOut)" filter="url(#mhaShadow)" height="60" rx="6" width="28" x="712" y="173"></rect>
<text fill="#5d4037" font-size="12" font-weight="700" text-anchor="middle" x="726" y="208">y</text>
<!-- equality banner -->
<rect fill="#e3f2fd" height="34" rx="8" stroke="#90caf9" stroke-width="1" width="460" x="170" y="372"></rect>
<text fill="#1565c0" font-size="13" font-weight="600" text-anchor="middle" x="400" y="394">[ H₁ ⋯ H₄ ] Wₒ  =  Σᵢ Hᵢ Wₒᵢ   (identical output, two factorings)</text>
</svg>