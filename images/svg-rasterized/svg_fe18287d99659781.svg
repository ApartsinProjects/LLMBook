<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three privacy attacks and three layered defenses" aria-labelledby="fig501title" role="img" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;" viewbox="0 0 760 400" xmlns="http://www.w3.org/2000/svg">
<title id="fig501title">Three privacy attacks and three layered defenses</title>
<text fill="#222" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" x="380" y="24">Privacy attack surface: extraction, membership inference, attribute inference</text>
<g font-family="Georgia, serif" font-size="11">
<rect fill="#fde9e9" height="140" rx="6" stroke="#d62728" width="220" x="20" y="60"></rect>
<text fill="#d62728" font-size="13" font-weight="bold" text-anchor="middle" x="130" y="82">Extraction attack</text>
<text fill="#666" text-anchor="middle" x="130" y="100">Carlini et al. 2021</text>
<text fill="#444" text-anchor="middle" x="130" y="124">prompt GPT-2 with first words</text>
<text fill="#444" text-anchor="middle" x="130" y="140">→ model emits verbatim name,</text>
<text fill="#444" text-anchor="middle" x="130" y="156">email, phone, address</text>
<text fill="#d62728" font-style="italic" font-weight="bold" text-anchor="middle" x="130" y="180">eidetic memorization</text>
<rect fill="#fde9e9" height="140" rx="6" stroke="#d62728" width="220" x="260" y="60"></rect>
<text fill="#d62728" font-size="13" font-weight="bold" text-anchor="middle" x="370" y="82">Membership inference</text>
<text fill="#666" text-anchor="middle" x="370" y="100">Shokri et al. 2017</text>
<text fill="#444" text-anchor="middle" x="370" y="124">"was record X in training?"</text>
<text fill="#444" text-anchor="middle" x="370" y="140">low perplexity → likely yes</text>
<text fill="#444" text-anchor="middle" x="370" y="156">privacy leak even without text</text>
<text fill="#d62728" font-style="italic" font-weight="bold" text-anchor="middle" x="370" y="180">binary leak</text>
<rect fill="#fde9e9" height="140" rx="6" stroke="#d62728" width="240" x="500" y="60"></rect>
<text fill="#d62728" font-size="13" font-weight="bold" text-anchor="middle" x="620" y="82">Attribute inference</text>
<text fill="#666" text-anchor="middle" x="620" y="100">model-as-database</text>
<text fill="#444" text-anchor="middle" x="620" y="124">"What is Alice Doe's diagnosis?"</text>
<text fill="#444" text-anchor="middle" x="620" y="140">model interpolates from training,</text>
<text fill="#444" text-anchor="middle" x="620" y="156">infers sensitive attribute</text>
<text fill="#d62728" font-style="italic" font-weight="bold" text-anchor="middle" x="620" y="180">linkage leak</text>
<text fill="#2ca02c" font-size="13" font-weight="bold" text-anchor="middle" x="380" y="232">↓ defenses (layered) ↓</text>
<rect fill="#e9f7e9" height="130" rx="6" stroke="#2ca02c" width="220" x="20" y="250"></rect>
<text fill="#2ca02c" font-weight="bold" text-anchor="middle" x="130" y="272">DP-SGD (Opacus)</text>
<text fill="#444" text-anchor="middle" x="130" y="292">per-sample grad clipping</text>
<text fill="#444" text-anchor="middle" x="130" y="308">+ calibrated Gaussian noise</text>
<text fill="#444" text-anchor="middle" x="130" y="324">budget (ε, δ) bounded</text>
<text fill="#444" text-anchor="middle" x="130" y="344">typical fine-tune: ε ≈ 8</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="130" y="364">formal guarantee</text>
<rect fill="#e9f7e9" height="130" rx="6" stroke="#2ca02c" width="220" x="260" y="250"></rect>
<text fill="#2ca02c" font-weight="bold" text-anchor="middle" x="370" y="272">Data minimization</text>
<text fill="#444" text-anchor="middle" x="370" y="292">PII detection (Presidio)</text>
<text fill="#444" text-anchor="middle" x="370" y="308">redact / pseudonymize</text>
<text fill="#444" text-anchor="middle" x="370" y="324">deduplicate corpus</text>
<text fill="#444" text-anchor="middle" x="370" y="344">→ less to memorize</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="370" y="364">defense in depth</text>
<rect fill="#e9f7e9" height="130" rx="6" stroke="#2ca02c" width="240" x="500" y="250"></rect>
<text fill="#2ca02c" font-weight="bold" text-anchor="middle" x="620" y="272">Output-side guardrails</text>
<text fill="#444" text-anchor="middle" x="620" y="292">PII filter on responses</text>
<text fill="#444" text-anchor="middle" x="620" y="308">canary string detection</text>
<text fill="#444" text-anchor="middle" x="620" y="324">memorization probes in eval</text>
<text fill="#444" text-anchor="middle" x="620" y="344">GDPR right-to-be-forgotten</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="620" y="364">last-mile catch</text>
</g>
</svg>