<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Scalable oversight techniques arranged by what they replace in human evaluation" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 880 380" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="380" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">Scalable oversight: what to do when the evaluator cannot keep up</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="440" y="40">Five approaches; none has fully solved the problem</text>
<g font-size="10">
<g transform="translate(20,70)">
<rect fill="#e3e8f5" height="290" rx="8" stroke="#3d4d8a" stroke-width="2" width="170"></rect>
<text fill="#3d4d8a" font-weight="700" text-anchor="middle" x="85" y="22">Constitutional AI</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="85" y="40">Bai et al. 2022 (Anthropic)</text>
<text fill="#1a1a2e" text-anchor="middle" x="85" y="64">model critiques itself</text>
<text fill="#1a1a2e" text-anchor="middle" x="85" y="80">against principles</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="85" y="104">replaces: some HF</text>
<text fill="#1a1a2e" text-anchor="middle" x="85" y="140">Strength:</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="85" y="155">"is this harmful?" is</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="85" y="168">easier than generating</text>
<text fill="#7a2a4a" text-anchor="middle" x="85" y="200">Limit:</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="85" y="215">cannot scale beyond</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="85" y="228">model's own capabilities</text>
<text fill="#27ae60" font-size="9" font-weight="700" text-anchor="middle" x="85" y="260">SHIPPING (Claude)</text>
</g>
<g transform="translate(200,70)">
<rect fill="#fef3e0" height="290" rx="8" stroke="#a67c1a" stroke-width="2" width="170"></rect>
<text fill="#a67c1a" font-weight="700" text-anchor="middle" x="85" y="22">Debate</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="85" y="40">Irving et al. 2018, Khan 2024</text>
<text fill="#1a1a2e" text-anchor="middle" x="85" y="64">two AIs argue opposing</text>
<text fill="#1a1a2e" text-anchor="middle" x="85" y="80">sides; human judges</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="85" y="104">replaces: solve-then-eval</text>
<text fill="#1a1a2e" text-anchor="middle" x="85" y="140">Strength:</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="85" y="155">judging easier than</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="85" y="168">solving (Nash equilib)</text>
<text fill="#7a2a4a" text-anchor="middle" x="85" y="200">Limit:</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="85" y="215">empirically modest gains</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="85" y="228">requires verifiable claims</text>
<text fill="#a67c1a" font-size="9" font-weight="700" text-anchor="middle" x="85" y="260">RESEARCH</text>
</g>
<g transform="translate(380,70)">
<rect fill="#e8f5e9" height="290" rx="8" stroke="#27ae60" stroke-width="2" width="170"></rect>
<text fill="#27ae60" font-weight="700" text-anchor="middle" x="85" y="22">Weak-to-strong</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="85" y="40">Burns et al. 2023 (OpenAI)</text>
<text fill="#1a1a2e" text-anchor="middle" x="85" y="64">weak supervisor trains</text>
<text fill="#1a1a2e" text-anchor="middle" x="85" y="80">strong student</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="85" y="104">replaces: human ceiling</text>
<text fill="#1a1a2e" text-anchor="middle" x="85" y="140">Strength:</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="85" y="155">closes 20-30% of gap</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="85" y="168">at equal tiers</text>
<text fill="#7a2a4a" text-anchor="middle" x="85" y="200">Limit:</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="85" y="215">untested at frontier scale</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="85" y="228">when student &gt;&gt; teacher</text>
<text fill="#a67c1a" font-size="9" font-weight="700" text-anchor="middle" x="85" y="260">ACTIVE RESEARCH</text>
</g>
<g transform="translate(560,70)">
<rect fill="#f5e3e8" height="290" rx="8" stroke="#7a2a4a" stroke-width="2" width="160"></rect>
<text fill="#7a2a4a" font-weight="700" text-anchor="middle" x="80" y="22">Process supervision</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="80" y="40">Lightman 2023 (PRM800K)</text>
<text fill="#1a1a2e" text-anchor="middle" x="80" y="64">score each reasoning</text>
<text fill="#1a1a2e" text-anchor="middle" x="80" y="80">step, not just outcome</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="80" y="104">replaces: outcome-only</text>
<text fill="#1a1a2e" text-anchor="middle" x="80" y="140">Strength:</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="80" y="155">"worst step" catches</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="80" y="168">right-for-wrong-reasons</text>
<text fill="#7a2a4a" text-anchor="middle" x="80" y="200">Limit:</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="80" y="215">800K human step labels</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="80" y="228">expensive to scale</text>
<text fill="#27ae60" font-size="9" font-weight="700" text-anchor="middle" x="80" y="260">SHIPPING (o1, R1)</text>
</g>
<g transform="translate(730,70)">
<rect fill="#fce8d4" height="290" rx="8" stroke="#a67c1a" stroke-width="2" width="130"></rect>
<text fill="#a67c1a" font-weight="700" text-anchor="middle" x="65" y="22">Interp-based</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="65" y="40">SAE, attribution graphs</text>
<text fill="#1a1a2e" text-anchor="middle" x="65" y="64">read internals,</text>
<text fill="#1a1a2e" text-anchor="middle" x="65" y="80">not outputs</text>
<text fill="#1a1a2e" text-anchor="middle" x="65" y="140">Strength:</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="65" y="155">does not need</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="65" y="168">capable human</text>
<text fill="#7a2a4a" text-anchor="middle" x="65" y="200">Limit:</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="65" y="215">faithfulness debated</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="65" y="228">(Karvonen 2025)</text>
<text fill="#a67c1a" font-size="9" font-weight="700" text-anchor="middle" x="65" y="260">EARLY</text>
</g>
</g>
</svg>