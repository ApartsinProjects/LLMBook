<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="A layered input guardrail runs three checks in parallel before any tokens reach the model." aria-labelledby="fig482title" role="img" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg">
<title id="fig482title">Input guardrail pipeline: three parallel checks</title>
<defs>
<marker id="arr482" markerheight="10" markerunits="strokeWidth" markerwidth="10" orient="auto" refx="9" refy="5">
<path d="M0,0 L10,5 L0,10 z" fill="#444"></path>
</marker>
</defs>
<text fill="#222" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" x="380" y="24">Input guardrail pipeline: three parallel checks before the model sees a token</text>
<g font-family="Georgia, serif" font-size="11">
<rect fill="#e8f1fb" height="60" rx="6" stroke="#1f77b4" width="120" x="20" y="170"></rect>
<text fill="#1f77b4" font-weight="bold" text-anchor="middle" x="80" y="195">user prompt</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="80" y="213">"Ignore previous..."</text>
<line marker-end="url(#arr482)" stroke="#444" stroke-width="2" x1="140" x2="170" y1="200" y2="200"></line>
<rect fill="#fde9e9" height="80" rx="6" stroke="#d62728" width="180" x="180" y="80"></rect>
<text fill="#d62728" font-weight="bold" text-anchor="middle" x="270" y="102">1. Injection detection</text>
<text fill="#444" text-anchor="middle" x="270" y="120">Prompt Guard 2 (86M)</text>
<text fill="#444" text-anchor="middle" x="270" y="136">benign · injection · jailbreak</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="270" y="152">~20 ms, 97% accuracy</text>
<rect fill="#fff5d9" height="80" rx="6" stroke="#cc8400" width="180" x="180" y="178"></rect>
<text fill="#cc8400" font-weight="bold" text-anchor="middle" x="270" y="192">2. PII redaction</text>
<text fill="#444" text-anchor="middle" x="270" y="210">Microsoft Presidio</text>
<text fill="#444" text-anchor="middle" x="270" y="226">SSN, email, names, dates</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="270" y="242">50+ regex + NER</text>
<rect fill="#e9f7e9" height="80" rx="6" stroke="#2ca02c" width="180" x="180" y="260"></rect>
<text fill="#2ca02c" font-weight="bold" text-anchor="middle" x="270" y="282">3. Topic classification</text>
<text fill="#444" text-anchor="middle" x="270" y="300">fine-tuned classifier</text>
<text fill="#444" text-anchor="middle" x="270" y="316">or LLM-as-judge</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="270" y="332">off-topic? regulated?</text>
<line marker-end="url(#arr482)" stroke="#444" stroke-width="2" x1="360" x2="430" y1="120" y2="180"></line>
<line marker-end="url(#arr482)" stroke="#444" stroke-width="2" x1="360" x2="430" y1="210" y2="210"></line>
<line marker-end="url(#arr482)" stroke="#444" stroke-width="2" x1="360" x2="430" y1="300" y2="240"></line>
<rect fill="#fff" height="80" rx="6" stroke="#444" width="160" x="440" y="170"></rect>
<text fill="#222" font-weight="bold" text-anchor="middle" x="520" y="192">Aggregate verdict</text>
<text fill="#444" text-anchor="middle" x="520" y="210">if any check fails →</text>
<text fill="#d62728" font-weight="bold" text-anchor="middle" x="520" y="226">BLOCK / REDACT</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="520" y="242">else → forward</text>
<line marker-end="url(#arr482)" stroke="#444" stroke-width="2" x1="600" x2="640" y1="200" y2="200"></line>
<rect fill="#e8f1fb" height="60" rx="6" stroke="#1f77b4" width="100" x="640" y="170"></rect>
<text fill="#1f77b4" font-weight="bold" text-anchor="middle" x="690" y="195">LLM</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="690" y="213">model.generate(...)</text>
<text fill="#444" font-weight="bold" text-anchor="middle" x="380" y="65">parallel checks</text>
</g>
</svg>