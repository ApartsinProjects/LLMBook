<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="AI-detection error rates vs the legal evidence standards they fail to meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="fig-75-2-1-title fig-75-2-1-desc">
<title id="fig-75-2-1-title">AI-detection error rates vs the legal evidence standards they fail to meet</title>
<desc id="fig-75-2-1-desc">Horizontal bars showing FP rate (4-9% native, 8-18% non-native English writers), FN rate (50% paraphrased), and the two legal standards (preponderance ~51%, clear and convincing ~75-85%). Below: comparison of false-positive cost ($5-15K per contested case at U.S. universities) vs assignment-redesign effort.</desc>
<rect x="0" y="0" width="760" height="360" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">Why MIT, Stanford, Harvard, and the UC system retired AI-detection (2023-2025)</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- x-axis at 280px wide, 100-500% percentages mapped -->
<line x1="200" y1="180" x2="700" y2="180" stroke="#5a6573"/>
<text x="200" y="200" text-anchor="middle" font-size="10">0%</text>
<text x="300" y="200" text-anchor="middle" font-size="10">20%</text>
<text x="400" y="200" text-anchor="middle" font-size="10">40%</text>
<text x="500" y="200" text-anchor="middle" font-size="10">60%</text>
<text x="600" y="200" text-anchor="middle" font-size="10">80%</text>
<text x="700" y="200" text-anchor="middle" font-size="10">100%</text>

<!-- FP bar native -->
<rect x="200" y="55" width="45" height="22" fill="#79c08f" stroke="#1f6f3a"/>
<text x="195" y="71" text-anchor="end" font-size="10">FP rate (native English)</text>
<text x="250" y="71" font-size="10">4-9%</text>

<!-- FP bar non-native -->
<rect x="200" y="85" width="90" height="22" fill="#e98572" stroke="#b2351e"/>
<text x="195" y="101" text-anchor="end" font-size="10">FP rate (non-native English)</text>
<text x="295" y="101" font-size="10" fill="#b2351e">8-18% (2-3x bias)</text>

<!-- FN bar paraphrased -->
<rect x="200" y="115" width="250" height="22" fill="#e98572" stroke="#b2351e"/>
<text x="195" y="131" text-anchor="end" font-size="10">FN rate (Quillbot-paraphrased)</text>
<text x="455" y="131" font-size="10" fill="#b2351e">&gt; 50%</text>

<!-- standards -->
<line x1="455" y1="50" x2="455" y2="155" stroke="#b8860b" stroke-width="2" stroke-dasharray="4 3"/>
<text x="455" y="45" text-anchor="middle" font-weight="700" fill="#b8860b" font-size="10">preponderance 51%</text>
<line x1="575" y1="50" x2="575" y2="155" stroke="#5a3d99" stroke-width="2" stroke-dasharray="4 3"/>
<text x="575" y="45" text-anchor="middle" font-weight="700" fill="#5a3d99" font-size="10">clear and convincing 75-85%</text>

<text x="395" y="150" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6573">No detector meets even the lower civil standard</text>

<!-- cost banner at bottom -->
<rect x="30" y="225" width="350" height="115" fill="#f1d6d0" stroke="#b2351e" rx="4"/>
<text x="205" y="245" text-anchor="middle" font-weight="700" fill="#b2351e">Cost of detection</text>
<text x="205" y="265" text-anchor="middle" font-size="11">$5-15K admin + legal per contested case</text>
<text x="205" y="282" text-anchor="middle" font-size="11">5,000-student program, 4% FP, 1 essay/sem:</text>
<text x="205" y="299" text-anchor="middle" font-size="11" font-weight="700">200 false flags = $1-3M/program-year</text>
<text x="205" y="320" text-anchor="middle" font-size="10" font-style="italic">+ trust loss to wrongly accused students</text>

<rect x="395" y="225" width="335" height="115" fill="#eef5ec" stroke="#1f6f3a" rx="4"/>
<text x="562" y="245" text-anchor="middle" font-weight="700" fill="#1f6f3a">Cost of assignment redesign</text>
<text x="562" y="265" text-anchor="middle" font-size="11">drafts, in-class oral defense,</text>
<text x="562" y="282" text-anchor="middle" font-size="11">collaborative revision, peer review</text>
<text x="562" y="299" text-anchor="middle" font-size="11" font-weight="700">disciplinary cases down 60% by 2025</text>
<text x="562" y="320" text-anchor="middle" font-size="10" font-style="italic">+ pedagogically more valuable</text>
</g>
</svg>