<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="BM25 term-frequency saturation curve compared to raw TF: raw TF grows linearly with the number of occurrences, while BM25's saturated TF rises quickly at first and then flattens, approaching the asymptote k1 + 1 (about 2.2 for k1 = 1.2). The chart explains why seeing diabetes twenty times in a document is not twenty times more relevant than seeing it once." role="img" style="max-width:700px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
<text fill="#222" font-size="14" font-weight="700" text-anchor="middle" x="350" y="22">BM25 saturates term frequency: more is good, but only up to a point</text>
<g transform="translate(70,50)">
<line stroke="#333" stroke-width="1" x1="0" x2="560" y1="220" y2="220"></line>
<line stroke="#333" stroke-width="1" x1="0" x2="0" y1="0" y2="220"></line>
<text fill="#444" font-size="11" text-anchor="end" x="560" y="240">term frequency f(qᵢ, d)</text>
<text fill="#444" font-size="11" text-anchor="end" x="-10" y="0">score</text>
<g fill="#666" font-size="10">
<text text-anchor="middle" x="0" y="238">0</text>
<text text-anchor="middle" x="93" y="238">5</text>
<text text-anchor="middle" x="187" y="238">10</text>
<text text-anchor="middle" x="280" y="238">15</text>
<text text-anchor="middle" x="373" y="238">20</text>
<text text-anchor="middle" x="467" y="238">25</text>
<text text-anchor="end" x="-5" y="223">0</text>
<text text-anchor="end" x="-5" y="180">1</text>
<text text-anchor="end" x="-5" y="137">2</text>
<text text-anchor="end" x="-5" y="93">3</text>
<text text-anchor="end" x="-5" y="50">4</text>
</g>
<line stroke="#c62828" stroke-width="2" x1="0" x2="468" y1="220" y2="20"></line>
<text fill="#c62828" font-size="11" x="475" y="35">raw TF (no saturation)</text>
<path d="M 0 220 Q 60 80 200 56 T 560 38" fill="none" stroke="#1565c0" stroke-width="2.4"></path>
<line stroke="#1565c0" stroke-dasharray="4 3" stroke-width="0.8" x1="0" x2="560" y1="33" y2="33"></line>
<text fill="#1565c0" font-size="11" x="475" y="25">BM25 asymptote = k₁ + 1 = 2.2</text>
<text fill="#0d47a1" font-size="11" x="240" y="100">BM25 saturated TF (k₁ = 1.2)</text>
</g>
</svg>