<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Conversational AI platform map" role="img" style="display:block;margin:1.2em auto;max-width:760px;width:100%;height:auto;" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="320" rx="6" width="720" x="0" y="0"></rect>
<text font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="360" y="26">Conversational AI platform landscape (2026)</text>
<g font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle">
<rect fill="#3498db" height="56" rx="6" width="160" x="40" y="58"></rect>
<text fill="#fff" font-weight="700" x="120" y="80">Managed cloud</text>
<text fill="#fff" x="120" y="96">Dialogflow CX,</text>
<text fill="#fff" x="120" y="110">Lex, Copilot Studio</text>
<rect fill="#27ae60" height="56" rx="6" width="160" x="220" y="58"></rect>
<text fill="#fff" font-weight="700" x="300" y="80">Self-hosted OSS</text>
<text fill="#fff" x="300" y="96">Rasa, Botpress OSS,</text>
<text fill="#fff" x="300" y="110">Bot Framework SDK</text>
<rect fill="#6a1b9a" height="56" rx="6" width="160" x="400" y="58"></rect>
<text fill="#fff" font-weight="700" x="480" y="80">Voice-first</text>
<text fill="#fff" x="480" y="96">LiveKit, Pipecat,</text>
<text fill="#fff" x="480" y="110">Vocode, Retell</text>
<rect fill="#a67c1a" height="56" rx="6" width="160" x="40" y="138"></rect>
<text fill="#fff" font-weight="700" x="120" y="160">Character / persona</text>
<text fill="#fff" x="120" y="176">Character.AI,</text>
<text fill="#fff" x="120" y="190">Inworld, Convai</text>
<rect fill="#bf360c" height="56" rx="6" width="160" x="220" y="138"></rect>
<text fill="#fff" font-weight="700" x="300" y="160">Enterprise CCaaS</text>
<text fill="#fff" x="300" y="176">Sprinklr, Cresta,</text>
<text fill="#fff" x="300" y="190">Genesys, Kore.ai</text>
<rect fill="#3498db" height="56" rx="6" width="160" x="400" y="138"></rect>
<text fill="#fff" font-weight="700" x="480" y="160">Persona stores</text>
<text fill="#fff" x="480" y="176">Custom GPTs,</text>
<text fill="#fff" x="480" y="190">Anthropic Projects</text>
<rect fill="none" height="80" rx="6" stroke="#3498db" stroke-dasharray="4,3" stroke-width="1.5" width="640" x="40" y="220"></rect>
<text fill="#3498db" font-weight="700" text-anchor="middle" x="360" y="244">Cross-axis: managed vs self-hosted, voice-first vs text-first,</text>
<text fill="#3498db" text-anchor="middle" x="360" y="262">assistant vs character, code-first vs designer-first</text>
<text fill="#666" font-size="10" text-anchor="middle" x="360" y="290">Pick by your team's center of gravity, channel, and policy strictness.</text>
</g>
</svg>