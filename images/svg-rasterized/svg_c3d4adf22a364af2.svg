<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Responsible-AI benchmark families positioned by stage and risk category" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="-17 0 897 460" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="460" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">Benchmark families mapped to evaluation stage and target risk</text>
<g transform="translate(60,60)">
<!-- 6 columns: stages -->
<g fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle">
<text x="65" y="14">Pretrain data</text>
<text x="195" y="14">Base-model</text>
<text x="325" y="14">Post-finetune</text>
<text x="455" y="14">Pre-launch</text>
<text x="585" y="14">Production</text>
<text x="715" y="14">Incident</text>
<text fill="#5a4a3a" font-size="8" font-weight="400" x="65" y="28">audit</text>
<text fill="#5a4a3a" font-size="8" font-weight="400" x="195" y="28">inherited bias</text>
<text fill="#5a4a3a" font-size="8" font-weight="400" x="325" y="28">release gate</text>
<text fill="#5a4a3a" font-size="8" font-weight="400" x="455" y="28">red-team</text>
<text fill="#5a4a3a" font-size="8" font-weight="400" x="585" y="28">drift watch</text>
<text fill="#5a4a3a" font-size="8" font-weight="400" x="715" y="28">regression</text>
</g>
<line stroke="#1a1a2e" stroke-width="1.5" x1="0" x2="780" y1="36" y2="36"></line>
<!-- 6 rows: families -->
<g fill="#1a1a2e" font-size="10" font-weight="700">
<text text-anchor="end" x="-12" y="80">LLM bias</text>
<text text-anchor="end" x="-12" y="148">Tabular fairness</text>
<text text-anchor="end" x="-12" y="216">Toxicity / hate</text>
<text text-anchor="end" x="-12" y="284">Truthfulness</text>
<text text-anchor="end" x="-12" y="352">Privacy attacks</text>
<text text-anchor="end" x="-12" y="404">Dangerous capability</text>
</g>
<!-- horizontal divider lines -->
<line stroke="#c0c0c0" stroke-width="0.5" x1="0" x2="780" y1="98" y2="98"></line>
<line stroke="#c0c0c0" stroke-width="0.5" x1="0" x2="780" y1="166" y2="166"></line>
<line stroke="#c0c0c0" stroke-width="0.5" x1="0" x2="780" y1="234" y2="234"></line>
<line stroke="#c0c0c0" stroke-width="0.5" x1="0" x2="780" y1="302" y2="302"></line>
<line stroke="#c0c0c0" stroke-width="0.5" x1="0" x2="780" y1="370" y2="370"></line>
<!-- cells: column x is centered at 65 + i*130 -->
<!-- Row 1: LLM bias -->
<g transform="translate(195,52)"><rect fill="#eef4fa" height="40" rx="3" stroke="#1a4078" stroke-width="1.5" width="100" x="-50" y="0"></rect><text fill="#1a4078" font-size="9" font-weight="700" text-anchor="middle" y="16">StereoSet</text><text fill="#1a4078" font-size="9" text-anchor="middle" y="30">CrowS-Pairs</text></g>
<g transform="translate(325,52)"><rect fill="#eef4fa" height="40" rx="3" stroke="#1a4078" stroke-width="1.5" width="100" x="-50" y="0"></rect><text fill="#1a4078" font-size="9" font-weight="700" text-anchor="middle" y="16">BBQ + BOLD</text><text fill="#1a4078" font-size="9" text-anchor="middle" y="30">HolisticBias</text></g>
<!-- Row 2: Tabular fairness -->
<g transform="translate(325,120)"><rect fill="#ecf6ee" height="40" rx="3" stroke="#1f7a3a" stroke-width="1.5" width="100" x="-50" y="0"></rect><text fill="#1f7a3a" font-size="9" font-weight="700" text-anchor="middle" y="16">Folktables</text><text fill="#1f7a3a" font-size="9" text-anchor="middle" y="30">Adult / COMPAS</text></g>
<!-- Row 3: Toxicity -->
<g transform="translate(325,188)"><rect fill="#fef3e0" height="40" rx="3" stroke="#a67c1a" stroke-width="1.5" width="100" x="-50" y="0"></rect><text fill="#a67c1a" font-size="9" font-weight="700" text-anchor="middle" y="16">RealToxicity</text><text fill="#a67c1a" font-size="9" text-anchor="middle" y="30">Civil Comments</text></g>
<g transform="translate(455,188)"><rect fill="#fef3e0" height="40" rx="3" stroke="#a67c1a" stroke-width="1.5" width="100" x="-50" y="0"></rect><text fill="#a67c1a" font-size="9" font-weight="700" text-anchor="middle" y="16">HateCheck</text><text fill="#a67c1a" font-size="9" text-anchor="middle" y="30">ToxiGen</text></g>
<g transform="translate(585,188)"><rect fill="#fef3e0" height="40" rx="3" stroke="#a67c1a" stroke-width="1.5" width="100" x="-50" y="0"></rect><text fill="#a67c1a" font-size="9" font-weight="700" text-anchor="middle" y="16">Detoxify</text><text fill="#a67c1a" font-size="9" text-anchor="middle" y="30">offline scans</text></g>
<!-- Row 4: Truthfulness -->
<g transform="translate(325,256)"><rect fill="#e3e8f5" height="40" rx="3" stroke="#3d4d8a" stroke-width="1.5" width="100" x="-50" y="0"></rect><text fill="#3d4d8a" font-size="9" font-weight="700" text-anchor="middle" y="16">TruthfulQA</text><text fill="#3d4d8a" font-size="9" text-anchor="middle" y="30">FActScore</text></g>
<g transform="translate(585,256)"><rect fill="#e3e8f5" height="40" rx="3" stroke="#3d4d8a" stroke-width="1.5" width="100" x="-50" y="0"></rect><text fill="#3d4d8a" font-size="9" font-weight="700" text-anchor="middle" y="16">FreshQA</text><text fill="#3d4d8a" font-size="9" text-anchor="middle" y="30">SimpleQA</text></g>
<!-- Row 5: Privacy -->
<g transform="translate(65,324)"><rect fill="#f0e3f8" height="40" rx="3" stroke="#6a3d8a" stroke-width="1.5" width="100" x="-50" y="0"></rect><text fill="#6a3d8a" font-size="9" font-weight="700" text-anchor="middle" y="16">WIMBD</text><text fill="#6a3d8a" font-size="9" text-anchor="middle" y="30">PII scan</text></g>
<g transform="translate(455,324)"><rect fill="#f0e3f8" height="40" rx="3" stroke="#6a3d8a" stroke-width="1.5" width="100" x="-50" y="0"></rect><text fill="#6a3d8a" font-size="9" font-weight="700" text-anchor="middle" y="16">LM Extraction</text><text fill="#6a3d8a" font-size="9" text-anchor="middle" y="30">ML Privacy Meter</text></g>
<!-- Row 6: Dangerous capability -->
<g transform="translate(455,378)"><rect fill="#f8e3e3" height="40" rx="3" stroke="#7a2a2a" stroke-width="1.5" width="100" x="-50" y="0"></rect><text fill="#7a2a2a" font-size="9" font-weight="700" text-anchor="middle" y="16">WMDP</text><text fill="#7a2a2a" font-size="9" text-anchor="middle" y="30">HarmBench</text></g>
<g transform="translate(715,378)"><rect fill="#f8e3e3" height="40" rx="3" stroke="#7a2a2a" stroke-width="1.5" width="100" x="-50" y="0"></rect><text fill="#7a2a2a" font-size="9" font-weight="700" text-anchor="middle" y="16">internal red-team</text><text fill="#7a2a2a" font-size="9" text-anchor="middle" y="30">on incident log</text></g>
<!-- 'lm-eval-harness' tag across the top -->
<g transform="translate(0,388)">
<rect fill="#1a1a2e" height="20" rx="4" width="580" x="100" y="0"></rect>
<text fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" x="390" y="14">lm-evaluation-harness orchestrates rows 1, 3, 4, 6 in one CI run</text>
</g>
</g>
</svg>