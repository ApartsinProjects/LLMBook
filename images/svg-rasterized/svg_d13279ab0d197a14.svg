<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: 7.1 Architecture Overview" font-family="Segoe UI, system-ui, sans-serif" role="img" viewbox="0 -10 700 330" xmlns="http://www.w3.org/2000/svg">
<!-- Base model -->
<rect fill="url(#grad_2ebc11_e8eaf6)" filter="url(#shadow_2ebc11)" height="60" rx="8" stroke="#3949ab" stroke-linecap="round" stroke-width="2" width="200" x="250" y="50"></rect>
<text fill="#3949ab" font-size="14" font-weight="bold" text-anchor="middle" x="350" y="75">Base Model (GPU)</text>
<text fill="#555" font-size="11" text-anchor="middle" x="350" y="95">Single copy in VRAM</text>
<!-- Adapter pool -->
<rect fill="url(#grad_2ebc11_c8e6c9)" height="40" rx="4" stroke="#2e7d32" stroke-linecap="round" stroke-width="1.5" width="120" x="50" y="150"></rect>
<text fill="#2e7d32" font-size="11" text-anchor="middle" x="110" y="175">Medical LoRA</text>
<rect fill="url(#grad_2ebc11_fff3e0)" height="40" rx="4" stroke="#e65100" stroke-linecap="round" stroke-width="1.5" width="120" x="190" y="150"></rect>
<text fill="#e65100" font-size="11" text-anchor="middle" x="250" y="175">Legal LoRA</text>
<rect fill="url(#grad_2ebc11_f3e5f5)" height="40" rx="4" stroke="#7b1fa2" stroke-linecap="round" stroke-width="1.5" width="120" x="330" y="150"></rect>
<text fill="#7b1fa2" font-size="11" text-anchor="middle" x="390" y="175">Finance LoRA</text>
<rect fill="url(#grad_2ebc11_fce4ec)" height="40" rx="4" stroke="#c62828" stroke-linecap="round" stroke-width="1.5" width="120" x="470" y="150"></rect>
<text fill="#c62828" font-size="11" text-anchor="middle" x="530" y="175">Code LoRA</text>
<!-- Arrows from base to adapters -->
<line marker-end="url(#arrowhead)" stroke="#888" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="300" x2="113" y1="110" y2="148"></line>
<line marker-end="url(#arrowhead)" stroke="#888" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="330" x2="253" y1="110" y2="148"></line>
<line marker-end="url(#arrowhead)" stroke="#888" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="370" x2="390" y1="110" y2="148"></line>
<line marker-end="url(#arrowhead)" stroke="#888" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="400" x2="527" y1="110" y2="148"></line>
<!-- Request routing -->
<rect fill="url(#grad_2ebc11_f5f5f5)" height="70" rx="6" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="500" x="100" y="230"></rect>
<text fill="#333" font-size="13" font-weight="bold" text-anchor="middle" x="350" y="255">Request Router</text>
<text fill="#555" font-size="11" text-anchor="middle" x="350" y="278">Routes each request to the correct adapter based on tenant ID or task type</text>
<text fill="#555" font-size="11" text-anchor="middle" x="350" y="293">Batches requests across adapters for GPU utilization</text>
<!-- Arrow from adapters to router -->
<line marker-end="url(#arrowhead)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="350" x2="350" y1="192" y2="228"></line>
<defs>
<lineargradient id="grad_2ebc11_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#f3e5f5"></stop></lineargradient>
<lineargradient id="grad_2ebc11_e8eaf6" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7f9ff"></stop><stop offset="100%" stop-color="#e8eaf6"></stop></lineargradient>
<lineargradient id="grad_2ebc11_fce4ec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3fb"></stop><stop offset="100%" stop-color="#fce4ec"></stop></lineargradient>
<lineargradient id="grad_2ebc11_f5f5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f5f5f5"></stop></lineargradient>
<lineargradient id="grad_2ebc11_c8e6c9" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d7f5d8"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
<lineargradient id="grad_2ebc11_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<filter height="115%" id="shadow_2ebc11" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowhead" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5"><polygon fill="#333" points="0 0, 10 3.5, 0 7"></polygon></marker></defs>
</svg>