<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three healthcare-specific failure modes and their layered mitigations" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="fig-74-2-1-title fig-74-2-1-desc">
<title id="fig-74-2-1-title">Three healthcare-specific failure modes and their layered mitigations</title>
<desc id="fig-74-2-1-desc">Three vertical stacks. Stack 1 "Confident wrong answer" lists Mitigation layers: advisory framing only, PubMed/guideline citation verifier, structured audit log, hard-coded escalation (lesson from MI postmortem). Stack 2 "Demographic bias" lists: stratified pre-deploy eval, rolling production monitor, oversample under-represented sources, fair-lending-style disparate-impact test. Stack 3 "PHI leakage" lists: HIPAA Safe Harbor de-id, per-tenant model instances, differential privacy, memorization red-team. Below: HIPAA breach $10.93M vs $200-500K BAA architecture cost.</desc>
<rect x="0" y="0" width="760" height="360" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">Three healthcare LLM failures and their layered mitigations</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- col 1: confident wrong answer -->
<rect x="20" y="50" width="235" height="240" fill="#f1d6d0" stroke="#b2351e" rx="4"/>
<text x="137" y="70" text-anchor="middle" font-weight="700" fill="#b2351e">1. Confident wrong answer</text>
<text x="137" y="86" text-anchor="middle" font-size="10" fill="#b2351e">(symptom-checker MI postmortem)</text>
<rect x="35" y="98" width="205" height="34" fill="#fff" stroke="#b2351e"/>
<text x="137" y="118" text-anchor="middle" font-size="11">Advisory framing, never final</text>
<rect x="35" y="138" width="205" height="34" fill="#fff" stroke="#b2351e"/>
<text x="137" y="158" text-anchor="middle" font-size="11">PubMed/guideline citation verifier</text>
<rect x="35" y="178" width="205" height="34" fill="#fff" stroke="#b2351e"/>
<text x="137" y="198" text-anchor="middle" font-size="11">Structured audit log</text>
<rect x="35" y="218" width="205" height="34" fill="#fff" stroke="#b2351e"/>
<text x="137" y="234" text-anchor="middle" font-size="10" font-weight="700">Hard-coded ED escalation</text>
<text x="137" y="248" text-anchor="middle" font-size="10">on chest pressure + 50+</text>
<text x="137" y="276" text-anchor="middle" font-size="10" fill="#b2351e" font-style="italic">cost: malpractice + harm</text>

<!-- col 2: demographic bias -->
<rect x="265" y="50" width="235" height="240" fill="#fff5d6" stroke="#b8860b" rx="4"/>
<text x="382" y="70" text-anchor="middle" font-weight="700" fill="#7a5a08">2. Demographic bias</text>
<text x="382" y="86" text-anchor="middle" font-size="10" fill="#7a5a08">(Beth Israel + Stanford 2024 study)</text>
<rect x="280" y="98" width="205" height="34" fill="#fff" stroke="#b8860b"/>
<text x="382" y="118" text-anchor="middle" font-size="11">Stratified pre-deploy eval</text>
<rect x="280" y="138" width="205" height="34" fill="#fff" stroke="#b8860b"/>
<text x="382" y="158" text-anchor="middle" font-size="11">Rolling production monitor</text>
<rect x="280" y="178" width="205" height="34" fill="#fff" stroke="#b8860b"/>
<text x="382" y="198" text-anchor="middle" font-size="11">Oversample marginalised lit.</text>
<rect x="280" y="218" width="205" height="34" fill="#fff" stroke="#b8860b"/>
<text x="382" y="234" text-anchor="middle" font-size="10" font-weight="700">Disparate-impact test</text>
<text x="382" y="248" text-anchor="middle" font-size="10">(fair-lending-style, 73.2)</text>
<text x="382" y="276" text-anchor="middle" font-size="10" fill="#7a5a08" font-style="italic">cost: missed dx in women/Black pts</text>

<!-- col 3: PHI leakage -->
<rect x="510" y="50" width="235" height="240" fill="#dfeaf5" stroke="#2c5fa0" rx="4"/>
<text x="627" y="70" text-anchor="middle" font-weight="700" fill="#2c5fa0">3. PHI leakage</text>
<text x="627" y="86" text-anchor="middle" font-size="10" fill="#2c5fa0">(fine-tune memorisation risk)</text>
<rect x="525" y="98" width="205" height="34" fill="#fff" stroke="#2c5fa0"/>
<text x="627" y="118" text-anchor="middle" font-size="11">HIPAA Safe Harbor de-id</text>
<rect x="525" y="138" width="205" height="34" fill="#fff" stroke="#2c5fa0"/>
<text x="627" y="158" text-anchor="middle" font-size="11">Per-tenant model instances</text>
<rect x="525" y="178" width="205" height="34" fill="#fff" stroke="#2c5fa0"/>
<text x="627" y="198" text-anchor="middle" font-size="11">Differential privacy training</text>
<rect x="525" y="218" width="205" height="34" fill="#fff" stroke="#2c5fa0"/>
<text x="627" y="234" text-anchor="middle" font-size="10" font-weight="700">Ongoing memorisation</text>
<text x="627" y="248" text-anchor="middle" font-size="10">red-team</text>
<text x="627" y="276" text-anchor="middle" font-size="10" fill="#2c5fa0" font-style="italic">cost: $10.93M avg breach</text>

<!-- bottom comparison bar -->
<rect x="20" y="310" width="725" height="36" fill="#fafafe" stroke="#a8b9d4" rx="4"/>
<text x="380" y="332" text-anchor="middle" font-weight="700">$200-500K BAA-covered architecture vs $10.93M average healthcare breach (IBM 2024)</text>
</g>
</svg>