<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Three-layer LLM inference stack: hub plus hardware plus runtime" viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="380" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Three-layer inference stack: Hub + Hardware + Runtime</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">where do I run a 70B model and still pay rent</text>
<!-- Layer 1: Hubs -->
<g transform="translate(40,70)">
<rect width="800" height="75" rx="8" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="20" y="22" font-size="12" font-weight="700" fill="#3d4d8a">Layer 1: Model hub (where the weights live)</text>
<g font-size="9">
<rect x="220" y="38" width="120" height="26" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="280" y="55" text-anchor="middle" fill="#1a1a2e">Hugging Face Hub</text>
<rect x="350" y="38" width="100" height="26" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="400" y="55" text-anchor="middle" fill="#1a1a2e">ModelScope</text>
<rect x="460" y="38" width="100" height="26" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="510" y="55" text-anchor="middle" fill="#1a1a2e">GGUF (HF)</text>
<rect x="570" y="38" width="120" height="26" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="630" y="55" text-anchor="middle" fill="#1a1a2e">Meta Llama portal</text>
</g>
</g>
<!-- Layer 2: Hardware tiers -->
<g transform="translate(40,160)">
<rect width="800" height="120" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="20" y="22" font-size="12" font-weight="700" fill="#a67c1a">Layer 2: Hardware tier (where inference runs)</text>
<g font-size="9">
<rect x="20" y="40" width="120" height="68" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="80" y="56" text-anchor="middle" font-weight="700" fill="#a67c1a">Laptop CPU</text>
<text x="80" y="72" text-anchor="middle" fill="#1a1a2e">4-bit ~13B</text>
<text x="80" y="86" text-anchor="middle" fill="#5a4a3a">bitnet.cpp / llama.cpp</text>
<text x="80" y="100" text-anchor="middle" fill="#5a4a3a">$0/hr</text>
<rect x="150" y="40" width="130" height="68" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="215" y="56" text-anchor="middle" font-weight="700" fill="#a67c1a">Apple Silicon</text>
<text x="215" y="72" text-anchor="middle" fill="#1a1a2e">~32B (64 GB M-series)</text>
<text x="215" y="86" text-anchor="middle" fill="#5a4a3a">MLX-LM, Ollama</text>
<text x="215" y="100" text-anchor="middle" fill="#5a4a3a">Qwen3-32B viable</text>
<rect x="290" y="40" width="130" height="68" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="355" y="56" text-anchor="middle" font-weight="700" fill="#a67c1a">Consumer GPU 24GB</text>
<text x="355" y="72" text-anchor="middle" fill="#1a1a2e">4-bit 70B</text>
<text x="355" y="86" text-anchor="middle" fill="#5a4a3a">RTX 3090/4090/5090</text>
<text x="355" y="100" text-anchor="middle" fill="#5a4a3a">Llama-3.3 70B</text>
<rect x="430" y="40" width="130" height="68" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="495" y="56" text-anchor="middle" font-weight="700" fill="#a67c1a">A100/H100 80GB</text>
<text x="495" y="72" text-anchor="middle" fill="#1a1a2e">fp16 70B</text>
<text x="495" y="86" text-anchor="middle" fill="#5a4a3a">vast.ai ~$1.99/hr</text>
<text x="495" y="100" text-anchor="middle" fill="#5a4a3a">1M ctx prefill</text>
<rect x="570" y="40" width="210" height="68" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="675" y="56" text-anchor="middle" font-weight="700" fill="#a67c1a">Multi-GPU cluster</text>
<text x="675" y="72" text-anchor="middle" fill="#1a1a2e">&gt; 70B / MoE / 4x consumer 24GB</text>
<text x="675" y="86" text-anchor="middle" fill="#5a4a3a">DeepSeek-V3, expert-parallel</text>
<text x="675" y="100" text-anchor="middle" fill="#5a4a3a">Lambda, AWS p5</text>
</g>
</g>
<!-- Layer 3: Runtime -->
<g transform="translate(40,295)">
<rect width="800" height="65" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="20" y="22" font-size="12" font-weight="700" fill="#1f7a3a">Layer 3: Runtime (bridges weights and silicon)</text>
<g font-size="9">
<rect x="200" y="32" width="90" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="245" y="46" text-anchor="middle" fill="#1a1a2e">vLLM</text>
<rect x="300" y="32" width="90" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="345" y="46" text-anchor="middle" fill="#1a1a2e">SGLang</text>
<rect x="400" y="32" width="90" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="445" y="46" text-anchor="middle" fill="#1a1a2e">TensorRT-LLM</text>
<rect x="500" y="32" width="90" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="545" y="46" text-anchor="middle" fill="#1a1a2e">TGI</text>
<rect x="600" y="32" width="90" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="645" y="46" text-anchor="middle" fill="#1a1a2e">llama.cpp</text>
</g>
</g>
</svg>