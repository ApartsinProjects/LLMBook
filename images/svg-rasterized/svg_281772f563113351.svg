<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The Constitutional AI pipeline. Phase 1 uses self-critique and revision to generate SFT data. Phase 2 uses AI-generated preference judgments (RLAIF) to train the reward model or run DPO." font-family="Segoe UI, system-ui, sans-serif" role="img" viewbox="0 0 780 380" xmlns="http://www.w3.org/2000/svg">
