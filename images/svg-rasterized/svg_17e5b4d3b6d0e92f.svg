<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three-dimensional parallelism layout showing how 1024 GPUs are partitioned: tensor parallel within an NVLink node, pipeline parallel across nodes in a pod over InfiniBand, and data parallel across pods over the spine fabric" role="img" style="font-family: sans-serif; max-width: 100%; height: auto;" viewbox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="380" width="900" x="0" y="0"></rect>
<text fill="#5a4a3a" font-size="12" font-style="italic" text-anchor="middle" x="450" y="30">Example: 1024 GPUs = TP(8) × PP(8) × DP(16)</text>
<!-- TP within node -->
<g transform="translate(60, 82)">
<rect fill="#fef3e0" height="160" rx="6" stroke="#a67c1a" stroke-width="2" width="240" x="0" y="8"></rect>
<text fill="#a67c1a" font-size="14" font-weight="700" text-anchor="middle" x="120" y="22">TP within node</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="120" y="40">NVLink only</text>
<g transform="translate(20, 60)">
<rect fill="#ffffff" height="24" rx="2" stroke="#a67c1a" width="24" x="0" y="0"></rect>
<rect fill="#ffffff" height="24" rx="2" stroke="#a67c1a" width="24" x="28" y="0"></rect>
<rect fill="#ffffff" height="24" rx="2" stroke="#a67c1a" width="24" x="56" y="0"></rect>
<rect fill="#ffffff" height="24" rx="2" stroke="#a67c1a" width="24" x="84" y="0"></rect>
<rect fill="#ffffff" height="24" rx="2" stroke="#a67c1a" width="24" x="112" y="0"></rect>
<rect fill="#ffffff" height="24" rx="2" stroke="#a67c1a" width="24" x="140" y="0"></rect>
<rect fill="#ffffff" height="24" rx="2" stroke="#a67c1a" width="24" x="168" y="0"></rect>
<rect fill="#ffffff" height="24" rx="2" stroke="#a67c1a" width="24" x="196" y="0"></rect>
</g>
<text fill="#a67c1a" font-size="11" font-weight="600" text-anchor="middle" x="120" y="115">8 GPUs share one layer</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="120" y="135">All-reduce per layer = cheap</text>
</g>
<!-- PP across nodes in pod -->
<g transform="translate(330, 82)">
<rect fill="#ecf6ee" height="160" rx="6" stroke="#1f7a3a" stroke-width="2" width="240" x="0" y="8"></rect>
<text fill="#1f7a3a" font-size="14" font-weight="700" text-anchor="middle" x="120" y="22">PP across pod</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="120" y="40">IB within pod</text>
<g transform="translate(50, 60)">
<rect fill="#ffffff" height="14" stroke="#1f7a3a" width="38" x="0" y="0"></rect>
<rect fill="#ffffff" height="14" stroke="#1f7a3a" width="38" x="0" y="14"></rect>
<rect fill="#ffffff" height="14" stroke="#1f7a3a" width="38" x="0" y="28"></rect>
<rect fill="#ffffff" height="14" stroke="#1f7a3a" width="38" x="0" y="42"></rect>
<rect fill="#ffffff" height="14" stroke="#1f7a3a" width="38" x="42" y="0"></rect>
<rect fill="#ffffff" height="14" stroke="#1f7a3a" width="38" x="42" y="14"></rect>
<rect fill="#ffffff" height="14" stroke="#1f7a3a" width="38" x="42" y="28"></rect>
<rect fill="#ffffff" height="14" stroke="#1f7a3a" width="38" x="42" y="42"></rect>
<text font-size="9" text-anchor="middle" x="40" y="74">Stage 0</text>
<text font-size="9" text-anchor="middle" x="40" y="86">Stage 1</text>
</g>
<text fill="#1f7a3a" font-size="11" font-weight="600" text-anchor="middle" x="120" y="115">8 stages of layer groups</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="120" y="135">Only activations cross IB</text>
</g>
<!-- DP across pods -->
<g transform="translate(600, 82)">
<rect fill="#eef4fa" height="160" rx="6" stroke="#1a4078" stroke-width="2" width="240" x="0" y="8"></rect>
<text fill="#1a4078" font-size="14" font-weight="700" text-anchor="middle" x="120" y="22">DP across pods</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="120" y="40">Spine fabric (oversubscribed)</text>
<g transform="translate(30, 60)">
<rect fill="#ffffff" height="40" rx="3" stroke="#1a4078" width="40" x="0" y="0"></rect><text font-size="10" text-anchor="middle" x="20" y="24">Pod 0</text>
<rect fill="#ffffff" height="40" rx="3" stroke="#1a4078" width="40" x="44" y="0"></rect><text font-size="10" text-anchor="middle" x="64" y="24">Pod 1</text>
<rect fill="#ffffff" height="40" rx="3" stroke="#1a4078" width="40" x="88" y="0"></rect><text font-size="10" text-anchor="middle" x="108" y="24">...</text>
<rect fill="#ffffff" height="40" rx="3" stroke="#1a4078" width="48" x="132" y="0"></rect><text font-size="10" text-anchor="middle" x="156" y="24">Pod 15</text>
</g>
<text fill="#1a4078" font-size="11" font-weight="600" text-anchor="middle" x="120" y="115">16 replicas of full model</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="120" y="135">All-reduce gradients once/step</text>
</g>
</svg>