<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Product Quantization splits each vector into sub-vectors and replaces each with a codebook index, achieving high compression ratios." role="img" viewbox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_fc55f1_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#e3f2fd"></stop></lineargradient>
<lineargradient id="grad_fc55f1_f8f9fa" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f8f9fa"></stop></lineargradient>
<lineargradient id="grad_fc55f1_ffcdd2" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffdce1"></stop><stop offset="100%" stop-color="#ffcdd2"></stop></lineargradient>
<lineargradient id="grad_fc55f1_c8e6c9" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d7f5d8"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
<lineargradient id="grad_fc55f1_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<filter height="115%" id="shadow_fc55f1" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<rect fill="url(#grad_fc55f1_f8f9fa)" filter="url(#shadow_fc55f1)" height="270" rx="10" stroke="#ddd" stroke-linecap="round" width="710" x="5" y="5"></rect>
<!-- Original vector -->
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="30" y="60">Original (768d, 3072 bytes)</text>
<rect fill="url(#grad_fc55f1_e3f2fd)" height="30" rx="4" stroke="#1976d2" stroke-linecap="round" width="660" x="30" y="68"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="360" y="88">[0.12, -0.45, 0.78, 0.33, ..., -0.21, 0.56, 0.09, -0.67]</text>
<!-- Split into sub-vectors -->
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="30" y="125">Split into m=96 sub-vectors (8 dims each)</text>
<rect fill="url(#grad_fc55f1_c8e6c9)" height="28" rx="4" stroke="#388e3c" stroke-linecap="round" width="80" x="30" y="133"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="70" y="152">sub_1</text>
<rect fill="url(#grad_fc55f1_c8e6c9)" height="28" rx="4" stroke="#388e3c" stroke-linecap="round" width="80" x="115" y="133"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="155" y="152">sub_2</text>
<rect fill="url(#grad_fc55f1_c8e6c9)" height="28" rx="4" stroke="#388e3c" stroke-linecap="round" width="80" x="200" y="133"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="240" y="152">sub_3</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="16" x="310" y="152">...</text>
<rect fill="url(#grad_fc55f1_c8e6c9)" height="28" rx="4" stroke="#388e3c" stroke-linecap="round" width="80" x="350" y="133"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="390" y="152">sub_95</text>
<rect fill="url(#grad_fc55f1_c8e6c9)" height="28" rx="4" stroke="#388e3c" stroke-linecap="round" width="80" x="435" y="133"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="475" y="152">sub_96</text>
<!-- Arrows down -->
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="250" y="185">Quantize each sub-vector to nearest codebook entry</text>
<!-- Compressed codes -->
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="30" y="210">Compressed (96 bytes)</text>
<rect fill="url(#grad_fc55f1_ffcdd2)" height="28" rx="4" stroke="#c62828" stroke-linecap="round" width="40" x="30" y="218"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="50" y="237">42</text>
<rect fill="url(#grad_fc55f1_ffcdd2)" height="28" rx="4" stroke="#c62828" stroke-linecap="round" width="40" x="75" y="218"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="95" y="237">187</text>
<rect fill="url(#grad_fc55f1_ffcdd2)" height="28" rx="4" stroke="#c62828" stroke-linecap="round" width="40" x="120" y="218"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="140" y="237">5</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="16" x="185" y="237">...</text>
<rect fill="url(#grad_fc55f1_ffcdd2)" height="28" rx="4" stroke="#c62828" stroke-linecap="round" width="40" x="210" y="218"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="230" y="237">201</text>
<rect fill="url(#grad_fc55f1_ffcdd2)" height="28" rx="4" stroke="#c62828" stroke-linecap="round" width="40" x="255" y="218"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="275" y="237">93</text>
<!-- Compression ratio -->
<rect fill="url(#grad_fc55f1_fff3e0)" height="35" rx="8" stroke="#e65100" stroke-linecap="round" width="270" x="420" y="215"></rect>
<text fill="#e65100" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="555" y="237">32x compression: 3072 bytes → 96 bytes</text>
</svg>