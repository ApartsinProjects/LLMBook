<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Tool orchestration patterns: tier-based routing sends easy queries to cheap tools and expensive queries to heavier specialists." role="img" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
<rect x="40" y="80" width="120" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="6"/><text x="100" y="105" font-size="13" font-weight="bold" text-anchor="middle">User query</text><text x="100" y="125" font-size="11" text-anchor="middle">(planner)</text><rect x="220" y="20" width="140" height="40" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="6"/><text x="290" y="45" font-size="12" font-weight="bold" text-anchor="middle">Tier 1: cheap tools</text><rect x="220" y="100" width="140" height="40" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="6"/><text x="290" y="125" font-size="12" font-weight="bold" text-anchor="middle">Tier 2: API calls</text><rect x="220" y="180" width="140" height="40" fill="#fce4ec" stroke="#ad1457" stroke-width="2" rx="6"/><text x="290" y="205" font-size="12" font-weight="bold" text-anchor="middle">Tier 3: heavy LLM</text><rect x="420" y="100" width="120" height="40" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" rx="6"/><text x="480" y="125" font-size="12" font-weight="bold" text-anchor="middle">Answer</text><path d="M 160 110 L 220 40" stroke="#555" stroke-width="2"/><path d="M 160 110 L 220 120" stroke="#555" stroke-width="2"/><path d="M 160 110 L 220 200" stroke="#555" stroke-width="2"/><path d="M 360 40 L 420 115" stroke="#555" stroke-width="2"/><path d="M 360 120 L 420 120" stroke="#555" stroke-width="2"/><path d="M 360 200 L 420 125" stroke="#555" stroke-width="2"/>
</svg>