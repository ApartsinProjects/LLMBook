<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Interpretability tool stack mapped to workflow stage" viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
