<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Bias enters at every stage: data collection, training, alignment, and deployment context." role="img" style="font-family: sans-serif;" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad3" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
