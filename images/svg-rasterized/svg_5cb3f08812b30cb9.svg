<text fill="#666" font-size="11" text-anchor="middle" x="240" y="122">Frequency bias</text>
<line marker-end="url(#arrow)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="305" x2="340" y1="97" y2="97"></line>
