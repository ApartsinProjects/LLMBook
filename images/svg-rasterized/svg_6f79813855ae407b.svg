<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Weight-space view of unlearning: gradient ascent maximizes loss on the forget set, moving the model in the opposite direction from the forget gradient; a retain-loss term pulls the weights back to preserve general ability." role="img" style="font-family: sans-serif;" viewBox="0 -8 850 458" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow-g3" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
<marker id="arr-g3" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#555" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="arr-g3-red" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#e94560" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="arr-g3-blue" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#3498db" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="arr-g3-green" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#27ae60" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<!-- Title -->
<!-- Left panel: Gradient Ascent -->
<rect fill="#f8f9fa" filter="url(#shadow-g3)" height="380" rx="12" stroke="#0f3460" stroke-linecap="round" stroke-width="1.5" width="390" x="20" y="50"></rect>
<text fill="#0f3460" font-size="14" font-weight="700" text-anchor="middle" x="215" y="78">Gradient Ascent Unlearning</text>
<!-- Weight space with axes -->
<line stroke="#ccc" stroke-linecap="round" stroke-width="1.5" x1="60" x2="60" y1="360" y2="110"></line>
<line stroke="#ccc" stroke-linecap="round" stroke-width="1.5" x1="60" x2="370" y1="360" y2="360"></line>
<text fill="#888" font-size="11" text-anchor="end" x="55" y="105">w2</text>
<text fill="#888" font-size="11" x="375" y="373">w1</text>
<!-- Original model point -->
<circle cx="250" cy="180" fill="#0f3460" filter="url(#shadow-g3)" r="8"></circle>
<text fill="#0f3460" font-size="11" font-weight="600" x="268" y="178">Original Model</text>
<!-- Forget data gradient direction (going up-right) -->
<line marker-end="url(#arr-g3-blue)" stroke="#3498db" stroke-linecap="round" stroke-width="2" x1="250" x2="200" y1="180" y2="230"></line>
<text fill="#3498db" font-size="11" text-anchor="middle" x="195" y="256">Gradient Descent</text>
<text fill="#3498db" font-size="11" text-anchor="middle" x="195" y="270">(normal training)</text>
<!-- Gradient ascent direction (opposite) -->
<line marker-end="url(#arr-g3-red)" stroke="#e94560" stroke-linecap="round" stroke-width="3" x1="250" x2="300" y1="180" y2="130"></line>
<text fill="#e94560" font-size="11" font-weight="600" x="320" y="122">Gradient ASCENT</text>
<text fill="#e94560" font-size="11" x="320" y="136">(maximize loss on</text>
<text fill="#e94560" font-size="11" x="320" y="150">forget set)</text>
<!-- Retain regularization -->
<line marker-end="url(#arr-g3-green)" stroke="#27ae60" stroke-dasharray="4,3" stroke-linecap="round" stroke-width="2" x1="300" x2="280" y1="130" y2="155"></line>
<text fill="#27ae60" font-size="11" text-anchor="start" x="285" y="210">Retain loss pulls back</text>
<text fill="#27ae60" font-size="11" text-anchor="start" x="285" y="224">(preserve general ability)</text>
<!-- Unlearned model -->
<circle cx="280" cy="155" fill="#27ae60" filter="url(#shadow-g3)" r="8"></circle>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="180" y="305">Unlearned Model</text>
<!-- Loss landscape contours -->
<ellipse cx="200" cy="230" fill="none" opacity="0.3" rx="70" ry="50" stroke="#3498db" stroke-linecap="round" stroke-width="1"></ellipse>
<ellipse cx="200" cy="230" fill="none" opacity="0.2" rx="100" ry="70" stroke="#3498db" stroke-linecap="round" stroke-width="1"></ellipse>
<text fill="#3498db" font-size="11" opacity="0.6" x="120" y="310">Forget set loss contours</text>
<!-- Right panel: Task Vector -->
<rect fill="#f8f9fa" filter="url(#shadow-g3)" height="380" rx="12" stroke="#0f3460" stroke-linecap="round" stroke-width="1.5" width="390" x="440" y="50"></rect>
<text fill="#0f3460" font-size="14" font-weight="700" text-anchor="middle" x="635" y="78">Task Vector Unlearning</text>
<!-- Weight space with axes -->
<line stroke="#ccc" stroke-linecap="round" stroke-width="1.5" x1="480" x2="480" y1="360" y2="110"></line>
<line stroke="#ccc" stroke-linecap="round" stroke-width="1.5" x1="480" x2="790" y1="360" y2="360"></line>
<text fill="#888" font-size="11" text-anchor="end" x="475" y="105">w2</text>
<text fill="#888" font-size="11" x="795" y="373">w1</text>
<!-- Base model point -->
<circle cx="580" cy="280" fill="#0f3460" filter="url(#shadow-g3)" r="8"></circle>
<text fill="#0f3460" font-size="11" font-weight="600" x="595" y="297">Base Model</text>
<!-- Fine-tuned model point -->
<circle cx="700" cy="170" fill="#8e44ad" filter="url(#shadow-g3)" r="8"></circle>
<text fill="#8e44ad" font-size="11" font-weight="600" x="715" y="165">Fine-tuned</text>
<text fill="#8e44ad" font-size="11" x="715" y="179">(has target skill)</text>
<!-- Task vector: base -> finetuned -->
<line marker-end="url(#arr-g3)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" x1="585" x2="693" y1="275" y2="175"></line>
<text fill="#8e44ad" font-size="11" font-weight="600" text-anchor="middle" x="660" y="240">Task Vector</text>
<text fill="#8e44ad" font-size="11" text-anchor="middle" x="660" y="254">(fine-tuned - base)</text>
<!-- Negated task vector: base -> unlearned -->
<line marker-end="url(#arr-g3-red)" stroke="#e94560" stroke-dasharray="6,3" stroke-linecap="round" stroke-width="3" x1="575" x2="475" y1="285" y2="380"></line>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="505" y="355">Negated Vector</text>
<text fill="#e94560" font-size="11" text-anchor="middle" x="505" y="369">(base - scale * TV)</text>
<!-- Unlearned model -->
<circle cx="490" cy="370" fill="#27ae60" filter="url(#shadow-g3)" r="8"></circle>
<text fill="#27ae60" font-size="11" font-weight="600" x="510" y="400">Unlearned Model</text>
<!-- Scale annotation -->
<rect fill="white" height="55" rx="6" stroke="#888" stroke-linecap="round" stroke-width="1" width="180" x="620" y="320"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="710" y="340">Scale factor controls how</text>
<text fill="#555" font-size="11" text-anchor="middle" x="710" y="354">far to negate. Too high</text>
<text fill="#555" font-size="11" text-anchor="middle" x="710" y="368">degrades general ability.</text>
</svg>