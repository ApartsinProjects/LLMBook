<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Test-time compute scaling: more thinking tokens trade latency for accuracy on hard problems" viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="400" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Test-time compute scaling: spending tokens to think harder</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">OpenAI o1 (Dec 2024) and DeepSeek-R1 (Jan 2025) demonstrated the paradigm</text>
<!-- Left: standard LLM -->
<g transform="translate(40,70)">
<rect width="380" height="290" rx="8" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="190" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#3d4d8a">Standard LLM (e.g. GPT-4o)</text>
<text x="190" y="40" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">fixed compute per query</text>
<rect x="20" y="60" width="340" height="40" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="190" y="78" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">prompt: "Prove infinitely many primes"</text>
<text x="190" y="93" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">same path for easy and hard queries</text>
<g stroke="#3d4d8a" stroke-width="1.5" fill="none"><line x1="190" y1="100" x2="190" y2="120" marker-end="url(#arr96)"/></g>
<rect x="20" y="125" width="340" height="60" rx="4" fill="#e3e8f5" stroke="#3d4d8a"/>
<text x="190" y="148" font-size="10" font-weight="700" text-anchor="middle" fill="#3d4d8a">~200 token answer</text>
<text x="190" y="166" font-size="9" text-anchor="middle" fill="#1a1a2e">1-5 sec latency, ~$0.005</text>
<text x="190" y="180" font-size="9" text-anchor="middle" fill="#1a1a2e">accuracy on AIME 2024: ~13%</text>
<rect x="20" y="200" width="340" height="60" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="190" y="220" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">cheap, fast, often wrong on hard problems</text>
<text x="190" y="240" font-size="11" font-weight="700" text-anchor="middle" fill="#7a2a4a">overconfident reflexive answer</text>
</g>
<!-- Right: reasoning model -->
<g transform="translate(460,70)">
<rect width="380" height="290" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="190" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Reasoning model (o1/o3/R1/Claude ext)</text>
<text x="190" y="40" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">adaptive compute per query</text>
<rect x="20" y="60" width="340" height="40" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="190" y="78" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">prompt: "Prove infinitely many primes"</text>
<text x="190" y="93" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">same query, different path</text>
<g stroke="#a67c1a" stroke-width="1.5" fill="none"><line x1="190" y1="100" x2="190" y2="120" marker-end="url(#arr96)"/></g>
<rect x="20" y="125" width="340" height="100" rx="4" fill="#fef3e0" stroke="#a67c1a" stroke-dasharray="3,2"/>
<text x="190" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#a67c1a">&lt;think&gt; ... 5,000 thinking tokens ... &lt;/think&gt;</text>
<text x="35" y="160" font-size="9" fill="#1a1a2e">"Suppose finite list p1..pn. Form N = p1...pn + 1."</text>
<text x="35" y="174" font-size="9" fill="#1a1a2e">"N is not divisible by any pi (remainder 1)..."</text>
<text x="35" y="188" font-size="9" fill="#1a1a2e">"So N has a prime factor not in our list. Contradiction."</text>
<text x="35" y="202" font-size="9" font-style="italic" fill="#5a4a3a">self-check, backtrack, verify (Euclid's argument)</text>
<text x="190" y="218" font-size="9" font-weight="700" text-anchor="middle" fill="#1f7a3a">accuracy on AIME 2024: ~83%</text>
<rect x="20" y="232" width="340" height="36" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="190" y="248" font-size="10" font-weight="700" text-anchor="middle" fill="#1f7a3a">final answer (after thinking)</text>
<text x="190" y="262" font-size="9" text-anchor="middle" fill="#1a1a2e">30-120 sec, ~$0.50, much higher quality</text>
</g>
<defs>
<marker id="arr96" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1a1a2e"/></marker>
</defs>
<text x="440" y="385" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Adaptive compute: spend tokens proportional to problem difficulty.</text>
</svg>