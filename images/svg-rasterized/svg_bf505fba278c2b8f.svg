<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="MusicGen delay-pattern interleaving: four EnCodec codebooks staggered by 0, 1, 2, 3 time steps so each decoding step predicts one fresh token per codebook in parallel" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 760 280" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="280" width="760"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="380" y="22">MusicGen delay-pattern interleaving (K = 4 EnCodec codebooks, T = 8 frames)</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="380" y="40">Each column is one decoder step; colored cells are predicted tokens, grey cells are pad</text>
<g font-size="9">
<!-- column headers -->
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="100" y="68">cb</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="155" y="68">1</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="195" y="68">2</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="235" y="68">3</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="275" y="68">4</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="315" y="68">5</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="355" y="68">6</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="395" y="68">7</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="435" y="68">8</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="475" y="68">9</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="515" y="68">10</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="555" y="68">11</text>
<text fill="#1a1a2e" font-size="10" font-weight="700" x="40" y="60">step</text>
<!-- row 1: cb1 colored 1..8, then pad pad pad -->
<text fill="#0d47a1" font-weight="700" x="65" y="100">cb1</text>
<g fill="#bbdefb" stroke="#1976d2"><rect height="22" rx="3" width="40" x="135" y="85"></rect><rect height="22" rx="3" width="40" x="175" y="85"></rect><rect height="22" rx="3" width="40" x="215" y="85"></rect><rect height="22" rx="3" width="40" x="255" y="85"></rect><rect height="22" rx="3" width="40" x="295" y="85"></rect><rect height="22" rx="3" width="40" x="335" y="85"></rect><rect height="22" rx="3" width="40" x="375" y="85"></rect><rect height="22" rx="3" width="40" x="415" y="85"></rect></g>
<g fill="#eeeeee" stroke="#bdbdbd"><rect height="22" rx="3" width="40" x="455" y="85"></rect><rect height="22" rx="3" width="40" x="495" y="85"></rect><rect height="22" rx="3" width="40" x="535" y="85"></rect></g>
<g fill="#0d47a1" font-size="8" text-anchor="middle"><text x="155" y="100">t1</text><text x="195" y="100">t2</text><text x="235" y="100">t3</text><text x="275" y="100">t4</text><text x="315" y="100">t5</text><text x="355" y="100">t6</text><text x="395" y="100">t7</text><text x="435" y="100">t8</text></g>
<!-- row 2: cb2 pad, then 1..8, then pad pad -->
<text fill="#1b5e20" font-weight="700" x="65" y="132">cb2</text>
<g fill="#eeeeee" stroke="#bdbdbd"><rect height="22" rx="3" width="40" x="135" y="117"></rect></g>
<g fill="#c8e6c9" stroke="#2e7d32"><rect height="22" rx="3" width="40" x="175" y="117"></rect><rect height="22" rx="3" width="40" x="215" y="117"></rect><rect height="22" rx="3" width="40" x="255" y="117"></rect><rect height="22" rx="3" width="40" x="295" y="117"></rect><rect height="22" rx="3" width="40" x="335" y="117"></rect><rect height="22" rx="3" width="40" x="375" y="117"></rect><rect height="22" rx="3" width="40" x="415" y="117"></rect><rect height="22" rx="3" width="40" x="455" y="117"></rect></g>
<g fill="#eeeeee" stroke="#bdbdbd"><rect height="22" rx="3" width="40" x="495" y="117"></rect><rect height="22" rx="3" width="40" x="535" y="117"></rect></g>
<g fill="#1b5e20" font-size="8" text-anchor="middle"><text x="195" y="132">t1</text><text x="235" y="132">t2</text><text x="275" y="132">t3</text><text x="315" y="132">t4</text><text x="355" y="132">t5</text><text x="395" y="132">t6</text><text x="435" y="132">t7</text><text x="475" y="132">t8</text></g>
<!-- row 3: cb3 pad pad, then 1..8, then pad -->
<text fill="#e65100" font-weight="700" x="65" y="164">cb3</text>
<g fill="#eeeeee" stroke="#bdbdbd"><rect height="22" rx="3" width="40" x="135" y="149"></rect><rect height="22" rx="3" width="40" x="175" y="149"></rect></g>
<g fill="#ffe0b2" stroke="#ef6c00"><rect height="22" rx="3" width="40" x="215" y="149"></rect><rect height="22" rx="3" width="40" x="255" y="149"></rect><rect height="22" rx="3" width="40" x="295" y="149"></rect><rect height="22" rx="3" width="40" x="335" y="149"></rect><rect height="22" rx="3" width="40" x="375" y="149"></rect><rect height="22" rx="3" width="40" x="415" y="149"></rect><rect height="22" rx="3" width="40" x="455" y="149"></rect><rect height="22" rx="3" width="40" x="495" y="149"></rect></g>
<g fill="#eeeeee" stroke="#bdbdbd"><rect height="22" rx="3" width="40" x="535" y="149"></rect></g>
<g fill="#e65100" font-size="8" text-anchor="middle"><text x="235" y="164">t1</text><text x="275" y="164">t2</text><text x="315" y="164">t3</text><text x="355" y="164">t4</text><text x="395" y="164">t5</text><text x="435" y="164">t6</text><text x="475" y="164">t7</text><text x="515" y="164">t8</text></g>
<!-- row 4: cb4 pad pad pad then 1..8 -->
<text fill="#4a148c" font-weight="700" x="65" y="196">cb4</text>
<g fill="#eeeeee" stroke="#bdbdbd"><rect height="22" rx="3" width="40" x="135" y="181"></rect><rect height="22" rx="3" width="40" x="175" y="181"></rect><rect height="22" rx="3" width="40" x="215" y="181"></rect></g>
<g fill="#e1bee7" stroke="#6a1b9a"><rect height="22" rx="3" width="40" x="255" y="181"></rect><rect height="22" rx="3" width="40" x="295" y="181"></rect><rect height="22" rx="3" width="40" x="335" y="181"></rect><rect height="22" rx="3" width="40" x="375" y="181"></rect><rect height="22" rx="3" width="40" x="415" y="181"></rect><rect height="22" rx="3" width="40" x="455" y="181"></rect><rect height="22" rx="3" width="40" x="495" y="181"></rect><rect height="22" rx="3" width="40" x="535" y="181"></rect></g>
<g fill="#4a148c" font-size="8" text-anchor="middle"><text x="275" y="196">t1</text><text x="315" y="196">t2</text><text x="355" y="196">t3</text><text x="395" y="196">t4</text><text x="435" y="196">t5</text><text x="475" y="196">t6</text><text x="515" y="196">t7</text><text x="555" y="196">t8</text></g>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="380" y="232">Step 4 is the first column where all four codebooks predict in parallel (no padding remains)</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="380" y="250">Sequence length T + K - 1 = 11 for T = 8 frames; per step the head emits 4 x 1024 logits, not 1024^4</text>
</g>
</svg>