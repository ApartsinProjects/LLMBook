<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Datasheet completeness audit: median scores per section across recent corpora" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="-11 0 891 460" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="460" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">Datasheet completeness by Gebru section (median % of questions answered)</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="440" y="40">Boyd 2024 + Sloane et al. 2024 audit of 220 widely used datasets</text>
<g transform="translate(80,80)">
<line stroke="#1a1a2e" stroke-width="1.5" x1="0" x2="0" y1="0" y2="330"></line>
<line stroke="#1a1a2e" stroke-width="1.5" x1="0" x2="720" y1="330" y2="330"></line>
<!-- y ticks -->
<g fill="#5a4a3a" font-size="9" text-anchor="end">
<text x="-6" y="334">0%</text><line stroke="#1a1a2e" x1="0" x2="-3" y1="330" y2="330"></line>
<text x="-6" y="252">25%</text><line stroke="#1a1a2e" x1="0" x2="-3" y1="247.5" y2="247.5"></line>
<text x="-6" y="170">50%</text><line stroke="#1a1a2e" x1="0" x2="-3" y1="165" y2="165"></line>
<text x="-6" y="88">75%</text><line stroke="#1a1a2e" x1="0" x2="-3" y1="82.5" y2="82.5"></line>
<text x="-6" y="6">100%</text><line stroke="#1a1a2e" x1="0" x2="-3" y1="0" y2="0"></line>
</g>
<!-- 60% threshold line -->
<line stroke="#a67c1a" stroke-dasharray="4,3" stroke-width="1" x1="0" x2="720" y1="132" y2="132"></line>
<text fill="#a67c1a" font-size="9" x="725" y="135">"usable" floor (60%)</text>
<!-- 90% threshold line -->
<line stroke="#1f7a3a" stroke-dasharray="4,3" stroke-width="1" x1="0" x2="720" y1="33" y2="33"></line>
<text fill="#1f7a3a" font-size="9" x="725" y="36">"good" floor (90%)</text>
<!-- bars -->
<g>
<!-- 1. Motivation 85% -> height 280.5 -->
<rect fill="#1f7a3a" height="280.5" stroke="#0f3a1c" stroke-width="1" width="80" x="20" y="49.5"></rect>
<text fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle" x="60" y="345">1. Motivation</text>
<text fill="#1f7a3a" font-size="10" font-weight="700" text-anchor="middle" x="60" y="42">85%</text>
<!-- 2. Composition 80% -->
<rect fill="#1f7a3a" height="264" stroke="#0f3a1c" stroke-width="1" width="80" x="120" y="66"></rect>
<text fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle" x="160" y="345">2. Composition</text>
<text fill="#1f7a3a" font-size="10" font-weight="700" text-anchor="middle" x="160" y="59">80%</text>
<!-- 3. Collection 60% -->
<rect fill="#a67c1a" height="198" stroke="#5a4a3a" stroke-width="1" width="80" x="220" y="132"></rect>
<text fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle" x="260" y="345">3. Collection</text>
<text fill="#a67c1a" font-size="10" font-weight="700" text-anchor="middle" x="260" y="125">60%</text>
<!-- 4. Preprocessing 55% (the C4 Bad Words case) -->
<rect fill="#a67c1a" height="181.5" stroke="#5a4a3a" stroke-width="1" width="80" x="320" y="148.5"></rect>
<text fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle" x="360" y="345">4. Preprocessing</text>
<text fill="#a67c1a" font-size="10" font-weight="700" text-anchor="middle" x="360" y="141">55%</text>
<!-- 5. Uses 70% -->
<rect fill="#a67c1a" height="231" stroke="#5a4a3a" stroke-width="1" width="80" x="420" y="99"></rect>
<text fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle" x="460" y="345">5. Uses</text>
<text fill="#a67c1a" font-size="10" font-weight="700" text-anchor="middle" x="460" y="92">70%</text>
<!-- 6. Distribution 50% -->
<rect fill="#a67c1a" height="165" stroke="#5a4a3a" stroke-width="1" width="80" x="520" y="165"></rect>
<text fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle" x="560" y="345">6. Distribution</text>
<text fill="#a67c1a" font-size="10" font-weight="700" text-anchor="middle" x="560" y="158">50%</text>
<!-- 7. Maintenance 28% -->
<rect fill="#7a2a2a" height="93" stroke="#3a0f0f" stroke-width="1" width="80" x="620" y="237"></rect>
<text fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle" x="660" y="345">7. Maintenance</text>
<text fill="#7a2a2a" font-size="10" font-weight="700" text-anchor="middle" x="660" y="230">28%</text>
</g>
<!-- Callout: C4 dirty-words case -->
<g transform="translate(330,200)">
<rect fill="#fff7e0" height="60" rx="4" stroke="#a67c1a" stroke-width="1.5" width="220" x="0" y="8"></rect>
<text fill="#a67c1a" font-size="9" font-weight="700" text-anchor="middle" x="110" y="16">The 40.8% LGBTQ+ URL filter</text>
<text fill="#1a1a2e" font-size="9" text-anchor="middle" x="110" y="30">(C4, Dodge et al. EMNLP 2021)</text>
<text fill="#1a1a2e" font-size="9" text-anchor="middle" x="110" y="44">hid inside this 55% gap</text>
</g>
</g>
</svg>