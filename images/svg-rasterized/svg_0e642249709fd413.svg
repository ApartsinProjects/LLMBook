<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Logarithmic bar chart comparing NER throughput. spaCy en_core_web_trf at about a thousand docs per second, REBEL fine-tuned at 100 docs per second, and LLM API at 1 doc per second. The visual shows a 1000x gap between spaCy and LLM endpoints on a log scale." role="img" style="max-width:100%;height:auto;" viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="tp342shadow" x="-4%" y="-4%" width="108%" height="108%">
<feDropShadow dx="1" dy="1" stdDeviation="1.2" flood-opacity="0.16"/>
</filter>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">NER throughput on a log scale</text>
<text x="380" y="40" text-anchor="middle" font-size="11" fill="#4a5568">Each gridline is 10&#215; the previous; bar lengths show 1 vs 100 vs 1000 docs/sec.</text>
<line x1="180" y1="60" x2="180" y2="200" stroke="#4a5568" stroke-width="0.6"/>
<g font-size="9" fill="#4a5568">
<text x="180" y="216" text-anchor="middle">1</text>
<text x="320" y="216" text-anchor="middle">10</text>
<text x="460" y="216" text-anchor="middle">100</text>
<text x="600" y="216" text-anchor="middle">1k</text>
<text x="740" y="216" text-anchor="middle">10k</text>
<text x="460" y="232" text-anchor="middle" font-style="italic">documents per second (log scale)</text>
<line x1="320" y1="60" x2="320" y2="200" stroke="#cbd5e0" stroke-width="0.4"/>
<line x1="460" y1="60" x2="460" y2="200" stroke="#cbd5e0" stroke-width="0.4"/>
<line x1="600" y1="60" x2="600" y2="200" stroke="#cbd5e0" stroke-width="0.4"/>
<line x1="740" y1="60" x2="740" y2="200" stroke="#cbd5e0" stroke-width="0.4"/>
</g>
<g transform="translate(0, 75)">
<text x="175" y="14" text-anchor="end" font-size="11" font-weight="700" fill="#1a1a2e">spaCy trf</text>
<text x="175" y="26" text-anchor="end" font-size="9" fill="#4a5568">classical, ~free</text>
<rect x="180" y="0" width="420" height="28" rx="3" fill="#3a73a8" stroke="#1a4078" stroke-width="0.5" filter="url(#tp342shadow)"/>
<text x="595" y="18" text-anchor="end" font-size="11" font-weight="700" fill="#ffffff">~1,000 docs/sec</text>
</g>
<g transform="translate(0, 115)">
<text x="175" y="14" text-anchor="end" font-size="11" font-weight="700" fill="#1a1a2e">REBEL fine-tuned</text>
<text x="175" y="26" text-anchor="end" font-size="9" fill="#4a5568">BART-base, GPU batched</text>
<rect x="180" y="0" width="280" height="28" rx="3" fill="#d97706" stroke="#9c4f00" stroke-width="0.5" filter="url(#tp342shadow)"/>
<text x="450" y="18" text-anchor="end" font-size="11" font-weight="700" fill="#ffffff">100 docs/sec</text>
</g>
<g transform="translate(0, 155)">
<text x="175" y="14" text-anchor="end" font-size="11" font-weight="700" fill="#1a1a2e">LLM API</text>
<text x="175" y="26" text-anchor="end" font-size="9" fill="#4a5568">GPT-4o, $/doc</text>
<rect x="180" y="0" width="0.001" height="28" rx="3" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.5" filter="url(#tp342shadow)"/>
<rect x="180" y="0" width="2" height="28" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.5" filter="url(#tp342shadow)"/>
<text x="186" y="18" font-size="11" font-weight="700" fill="#b91c1c">1 doc/sec</text>
<text x="220" y="18" font-size="11" fill="#5a2828">(but understands novel schemas)</text>
</g>
</g>
</svg>