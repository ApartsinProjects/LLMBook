<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="P5 unified text-to-text framing: five different recsys tasks (rating prediction, sequential next-item, explanation generation, review summarization, top-k recommendation) each shown as a prompt template feeding into a single shared T5 encoder-decoder, which emits a free-form text answer in the format the corresponding task expects." role="img" viewbox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrP5" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="3.5" viewbox="0 0 7 7"><path d="M0,0 L7,3.5 L0,7 z" fill="#444"></path></marker>
<filter height="115%" id="dsP5" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<g font-family="monospace" font-size="10" text-anchor="start">
<rect fill="#eaf5ff" filter="url(#dsP5)" height="40" rx="6" stroke="#2980b9" stroke-width="1.5" width="280" x="20" y="20"></rect>
<text fill="#1f618d" font-size="10" font-weight="700" x="30" y="38">RATING:</text>
<text fill="#333" x="30" y="52">User_42 saw Movie_8137. Predict rating.</text>
<rect fill="#fef5e7" filter="url(#dsP5)" height="40" rx="6" stroke="#e67e22" stroke-width="1.5" width="280" x="20" y="75"></rect>
<text fill="#a05a16" font-size="10" font-weight="700" x="30" y="93">NEXT:</text>
<text fill="#333" x="30" y="107">User_42 history: M1, M2, M3. Next?</text>
<rect fill="#e8f5e9" filter="url(#dsP5)" height="40" rx="6" stroke="#27ae60" stroke-width="1.5" width="280" x="20" y="130"></rect>
<text fill="#1e8449" font-size="10" font-weight="700" x="30" y="148">EXPLAIN:</text>
<text fill="#333" x="30" y="162">Why might User_42 like Movie_8137?</text>
<rect fill="#f5eef8" filter="url(#dsP5)" height="40" rx="6" stroke="#8e44ad" stroke-width="1.5" width="280" x="20" y="185"></rect>
<text fill="#6c3483" font-size="10" font-weight="700" x="30" y="203">SUMM:</text>
<text fill="#333" x="30" y="217">Summarize this review: "..."</text>
<rect fill="#fdebd0" filter="url(#dsP5)" height="40" rx="6" stroke="#d35400" stroke-width="1.5" width="280" x="20" y="240"></rect>
<text fill="#a04000" font-size="10" font-weight="700" x="30" y="258">TOP-K:</text>
<text fill="#333" x="30" y="272">Recommend 5 movies for User_42.</text>
</g>
<rect fill="#1a1a2e" filter="url(#dsP5)" height="180" rx="10" width="160" x="360" y="80"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="440" y="115">Shared T5</text>
<text fill="#ccc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="440" y="135">encoder-decoder</text>
<text fill="#ccc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="440" y="155">one parameter set</text>
<text fill="#ccc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="440" y="175">trained jointly</text>
<text fill="#ccc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="440" y="205">on all 5 tasks</text>
<g font-family="monospace" font-size="10" text-anchor="start">
<rect fill="#fff" filter="url(#dsP5)" height="40" rx="6" stroke="#2980b9" stroke-width="1.5" width="220" x="560" y="20"></rect>
<text fill="#1f618d" font-size="10" font-weight="700" x="570" y="38">"4"</text>
<rect fill="#fff" filter="url(#dsP5)" height="40" rx="6" stroke="#e67e22" stroke-width="1.5" width="220" x="560" y="75"></rect>
<text fill="#a05a16" font-size="10" font-weight="700" x="570" y="93">"Movie_8137"</text>
<rect fill="#fff" filter="url(#dsP5)" height="40" rx="6" stroke="#27ae60" stroke-width="1.5" width="220" x="560" y="130"></rect>
<text fill="#1e8449" font-size="10" font-weight="700" x="570" y="148">"Because the user enjoyed..."</text>
<rect fill="#fff" filter="url(#dsP5)" height="40" rx="6" stroke="#8e44ad" stroke-width="1.5" width="220" x="560" y="185"></rect>
<text fill="#6c3483" font-size="10" font-weight="700" x="570" y="203">"A thoughtful sci-fi thriller..."</text>
<rect fill="#fff" filter="url(#dsP5)" height="40" rx="6" stroke="#d35400" stroke-width="1.5" width="220" x="560" y="240"></rect>
<text fill="#a04000" font-size="10" font-weight="700" x="570" y="258">"M1, M2, M3, M4, M5"</text>
</g>
