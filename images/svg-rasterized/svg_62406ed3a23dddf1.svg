<line marker-end="url(#arrP5)" stroke="#444" stroke-width="1.5" x1="300" x2="358" y1="260" y2="200"></line>
<line marker-end="url(#arrP5)" stroke="#444" stroke-width="1.5" x1="520" x2="558" y1="120" y2="40"></line>
<line marker-end="url(#arrP5)" stroke="#444" stroke-width="1.5" x1="520" x2="558" y1="140" y2="95"></line>
<line marker-end="url(#arrP5)" stroke="#444" stroke-width="1.5" x1="520" x2="558" y1="160" y2="150"></line>
<line marker-end="url(#arrP5)" stroke="#444" stroke-width="1.5" x1="520" x2="558" y1="180" y2="205"></line>
<line marker-end="url(#arrP5)" stroke="#444" stroke-width="1.5" x1="520" x2="558" y1="200" y2="260"></line>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle" x="400" y="320">Five tasks, one model, one cross-entropy loss.</text>
</svg>