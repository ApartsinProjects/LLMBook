<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="T5's text-to-text framework. Each input gets a task-identifying prefix (translate, cola, summarize, question); a single shared encoder-decoder reads the input and emits the answer as a text string. Labels, class names, regression scores, and extracted spans are all encoded as plain text tokens, eliminating per-task output heads." in="" out="" style="font-family:sans-serif;max-width:100%;height:auto;" text="" viewbox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="260" width="700"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="350" y="22">T5: every task is "text in, text out"</text>
<g font-size="10" text-anchor="middle">
<rect fill="#e3e8f5" height="28" rx="4" stroke="#3d4d8a" width="220" x="20" y="50"></rect>
<text fill="#1a1a2e" x="130" y="68">"translate English to German: Hello"</text>
<rect fill="#e3e8f5" height="28" rx="4" stroke="#3d4d8a" width="220" x="20" y="86"></rect>
<text fill="#1a1a2e" x="130" y="104">"cola sentence: The movie is bad"</text>
<rect fill="#e3e8f5" height="28" rx="4" stroke="#3d4d8a" width="220" x="20" y="122"></rect>
<text fill="#1a1a2e" x="130" y="140">"summarize: state of the union ..."</text>
<rect fill="#e3e8f5" height="28" rx="4" stroke="#3d4d8a" width="220" x="20" y="158"></rect>
<text fill="#1a1a2e" x="130" y="176">"question: ... context: ..."</text>
</g>
<g font-size="10">
<line stroke="#888" stroke-width="1" x1="244" x2="280" y1="64" y2="120"></line>
<line stroke="#888" stroke-width="1" x1="244" x2="280" y1="100" y2="120"></line>
<line stroke="#888" stroke-width="1" x1="244" x2="280" y1="136" y2="120"></line>
<line stroke="#888" stroke-width="1" x1="244" x2="280" y1="172" y2="120"></line>
</g>
<g transform="translate(280,60)">
<rect fill="#ecf6ee" height="120" rx="8" stroke="#1f7a3a" stroke-width="2" width="140"></rect>
<text fill="#1f7a3a" font-size="11" font-weight="700" text-anchor="middle" x="70" y="20">Encoder-Decoder</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="70" y="36">(shared params)</text>
<rect fill="#ffffff" height="22" rx="4" stroke="#1f7a3a" width="112" x="14" y="46"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="70" y="62">encoder stack</text>
<rect fill="#ffffff" height="22" rx="4" stroke="#1f7a3a" width="112" x="14" y="72"></rect>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="70" y="88">decoder stack</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="70" y="110">one cross-entropy loss</text>
</g>
<g font-size="10" text-anchor="middle">
<line stroke="#888" stroke-width="1" x1="420" x2="450" y1="120" y2="64"></line>
<line stroke="#888" stroke-width="1" x1="420" x2="450" y1="120" y2="100"></line>
<line stroke="#888" stroke-width="1" x1="420" x2="450" y1="120" y2="136"></line>
<line stroke="#888" stroke-width="1" x1="420" x2="450" y1="120" y2="172"></line>
<rect fill="#fef3e0" height="28" rx="4" stroke="#a67c1a" width="230" x="450" y="50"></rect>
<text fill="#1a1a2e" x="565" y="68">"Hallo"</text>
<rect fill="#fef3e0" height="28" rx="4" stroke="#a67c1a" width="230" x="450" y="86"></rect>
<text fill="#1a1a2e" x="565" y="104">"unacceptable"</text>
<rect fill="#fef3e0" height="28" rx="4" stroke="#a67c1a" width="230" x="450" y="122"></rect>
<text fill="#1a1a2e" x="565" y="140">"the president addressed ..."</text>
<rect fill="#fef3e0" height="28" rx="4" stroke="#a67c1a" width="230" x="450" y="158"></rect>
<text fill="#1a1a2e" x="565" y="176">"Paris"</text>
</g>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="350" y="220">Task prefix selects the behavior; the model uses the same weights, vocabulary, and loss across all tasks.</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="350" y="240">No per-task heads, no per-task hyperparameters, no per-task data preprocessing.</text>
</svg>