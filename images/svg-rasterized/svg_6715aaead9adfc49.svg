<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Regulatory stack for K-12 vs higher-ed LLM deployments" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="fig-75-3-1-title fig-75-3-1-desc">
<title id="fig-75-3-1-title">Regulatory stack for K-12 vs higher-ed LLM deployments</title>
<desc id="fig-75-3-1-desc">Two parallel stacks. Left column "K-12" shows FERPA + COPPA 2025 update ($53,088/violation) + state laws (TN first, CA NY IL WA followed) + accreditation guidance. Right column "Higher ed" shows FERPA only + EU AI Act Annex III pt 3 (high-risk for grading/admissions) + state laws + Middle States/NECHE/SACS accreditation. Bottom: institution-tier procurement is the load-bearing layer ($5-15/student K-12, $15-30/student higher-ed).</desc>
<rect x="0" y="0" width="760" height="360" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">Education LLM regulatory stack: K-12 vs Higher Ed</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- K-12 column -->
<rect x="30" y="50" width="340" height="240" fill="#dfeaf5" stroke="#2c5fa0" rx="6"/>
<text x="200" y="72" text-anchor="middle" font-weight="700" fill="#2c5fa0">K-12 (under-13 + minor students)</text>

<rect x="50" y="86" width="300" height="40" fill="#fff" stroke="#2c5fa0"/>
<text x="200" y="103" text-anchor="middle" font-weight="700">FERPA (1974, ED Dept guidance)</text>
<text x="200" y="118" text-anchor="middle" font-size="10">"school official" framework, audit log</text>

<rect x="50" y="134" width="300" height="40" fill="#fff" stroke="#2c5fa0"/>
<text x="200" y="151" text-anchor="middle" font-weight="700" fill="#b2351e">COPPA + FTC 2025 update</text>
<text x="200" y="166" text-anchor="middle" font-size="10" fill="#b2351e">$53,088 per violation</text>

<rect x="50" y="182" width="300" height="40" fill="#fff" stroke="#2c5fa0"/>
<text x="200" y="199" text-anchor="middle" font-weight="700">State AI-in-K-12 laws</text>
<text x="200" y="214" text-anchor="middle" font-size="10">TN first (2024) · CA, NY, IL, WA followed</text>

<rect x="50" y="230" width="300" height="50" fill="#fff" stroke="#2c5fa0"/>
<text x="200" y="248" text-anchor="middle" font-weight="700">District-level procurement only</text>
<text x="200" y="262" text-anchor="middle" font-size="10">Khanmigo, Magic School AI pattern</text>
<text x="200" y="276" text-anchor="middle" font-size="10">district signs on behalf of students</text>

<!-- Higher ed column -->
<rect x="390" y="50" width="340" height="240" fill="#eef5ec" stroke="#1f6f3a" rx="6"/>
<text x="560" y="72" text-anchor="middle" font-weight="700" fill="#1f6f3a">Higher Ed (18+ students)</text>

<rect x="410" y="86" width="300" height="40" fill="#fff" stroke="#1f6f3a"/>
<text x="560" y="103" text-anchor="middle" font-weight="700">FERPA (no COPPA layer)</text>
<text x="560" y="118" text-anchor="middle" font-size="10">data-handling agreement + admin controls</text>

<rect x="410" y="134" width="300" height="40" fill="#fff" stroke="#1f6f3a"/>
<text x="560" y="151" text-anchor="middle" font-weight="700" fill="#2c5fa0">EU AI Act Annex III, pt 3</text>
<text x="560" y="166" text-anchor="middle" font-size="10" fill="#2c5fa0">high-risk: grading + admissions only</text>

<rect x="410" y="182" width="300" height="40" fill="#fff" stroke="#1f6f3a"/>
<text x="560" y="199" text-anchor="middle" font-weight="700">Academic-integrity policy</text>
<text x="560" y="214" text-anchor="middle" font-size="10">MIT/Stanford/UC: disclose, redesign assignments</text>

<rect x="410" y="230" width="300" height="50" fill="#fff" stroke="#1f6f3a"/>
<text x="560" y="248" text-anchor="middle" font-weight="700">Accreditation guidance</text>
<text x="560" y="262" text-anchor="middle" font-size="10">Middle States · NECHE · SACS</text>
<text x="560" y="276" text-anchor="middle" font-size="10">"document the approach, demonstrate it works"</text>

<!-- bottom comparison -->
<rect x="30" y="305" width="700" height="44" fill="#fff5d6" stroke="#b8860b" rx="4"/>
<text x="380" y="324" text-anchor="middle" font-weight="700" fill="#7a5a08">Institution-tier procurement: the load-bearing layer</text>
<text x="380" y="340" text-anchor="middle" font-size="11">K-12: $5-15/student/yr · Higher Ed: $15-30/student/yr (ASU ChatGPT Edu, UT system, Wharton, Caltech 2024-25)</text>
</g>
</svg>