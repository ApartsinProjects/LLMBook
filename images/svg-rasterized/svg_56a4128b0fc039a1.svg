<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: The Synthetic Data Lifecycle" role="img" viewBox="0 0 700 190" xmlns="http://www.w3.org/2000/svg">
<rect fill="url(#grad_cd245a_e8f4fd)" filter="url(#shadow_cd245a)" height="55" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="110" x="10" y="60"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="65" y="83">1. Seed Data</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="65" y="100">Topics, examples,</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="65" y="112">domain constraints</text>
<text fill="#e94560" font-family="Segoe UI, system-ui, sans-serif" font-size="16" x="138" y="88">→</text>
<rect fill="url(#grad_cd245a_f0e6ff)" height="55" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="110" x="150" y="60"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="205" y="83">2. Generate</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="205" y="100">LLM pipelines,</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="205" y="112">personas, Evol-Instruct</text>
<text fill="#e94560" font-family="Segoe UI, system-ui, sans-serif" font-size="16" x="278" y="88">→</text>
<rect fill="url(#grad_cd245a_fef9e7)" height="55" rx="8" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="110" x="290" y="60"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="345" y="83">3. Filter</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="345" y="100">Quality scoring,</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="345" y="112">dedup, toxicity check</text>
<text fill="#e94560" font-family="Segoe UI, system-ui, sans-serif" font-size="16" x="418" y="88">→</text>
<rect fill="#e8f5e9" height="55" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="110" x="430" y="60"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="485" y="83">4. Curate</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="485" y="100">Mix with real data,</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="485" y="112">balance distribution</text>
<text fill="#e94560" font-family="Segoe UI, system-ui, sans-serif" font-size="16" x="558" y="88">→</text>
<rect fill="#1a1a2e" height="55" rx="8" width="110" x="570" y="60"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="625" y="83">5. Train</text>
<text fill="#ddd" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="625" y="100">Fine-tune or</text>
<text fill="#ddd" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="625" y="112">evaluate model</text>
<!-- Feedback arrow -->
<path d="M 625 120 L 625 155 L 65 155 L 65 120" fill="none" marker-end="url(#arrowGray)" stroke="#999" stroke-dasharray="5,3" stroke-linecap="round" stroke-width="1.5"></path>
<defs>
<lineargradient id="grad_cd245a_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_cd245a_f0e6ff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff5ff"></stop><stop offset="100%" stop-color="#f0e6ff"></stop></lineargradient>
<lineargradient id="grad_cd245a_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_cd245a" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowGray" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><path d="M0,0 L8,3 L0,6" fill="#999"></path></marker></defs>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="345" y="170">Feedback loop: evaluate, identify gaps, regenerate</text>
</svg>