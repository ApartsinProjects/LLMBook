<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Two families of safety models." viewBox="0 0 849 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig514title" style="max-width:849px;width:100%;height:auto;background:#fafafa;border-radius:8px;">
<title id="fig514title">Safety models: classifiers vs reward models</title>
<text x="380" y="24" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Open-weights safety models in 2026</text>
<g font-family="Georgia, serif" font-size="11">
<rect x="20" y="60" width="350" height="280" rx="8" fill="#e8f1fb" stroke="#1f77b4"/>
<text x="195" y="84" text-anchor="middle" font-weight="bold" fill="#1f77b4" font-size="13">Classifiers (categorical verdict)</text>
<rect x="40" y="100" width="310" height="50" fill="#fff" stroke="#1f77b4" rx="4"/>
<text x="55" y="118" font-weight="bold" fill="#222">Llama Guard 3 (Meta, 8B / 1B)</text>
<text x="55" y="134" fill="#444">MLCommons 13 categories · default open self-host</text>
<rect x="40" y="160" width="310" height="50" fill="#fff" stroke="#1f77b4" rx="4"/>
<text x="55" y="178" font-weight="bold" fill="#222">Prompt Guard (Meta, 86M)</text>
<text x="55" y="194" fill="#444">benign / injection / jailbreak · ~5 ms CPU · pre-filter</text>
<rect x="40" y="220" width="310" height="50" fill="#fff" stroke="#1f77b4" rx="4"/>
<text x="55" y="238" font-weight="bold" fill="#222">ShieldGemma (Google, 2B / 9B / 27B)</text>
<text x="55" y="254" fill="#444">harassment, hate, sexual, dangerous · size-tiered</text>
<rect x="40" y="280" width="310" height="50" fill="#fff" stroke="#1f77b4" rx="4"/>
<text x="55" y="298" font-weight="bold" fill="#222">OpenAI Moderation (hosted)</text>
<text x="55" y="314" fill="#444">13 categories · free hosted · zero setup</text>
<rect x="390" y="60" width="350" height="280" rx="8" fill="#fff5d9" stroke="#cc8400"/>
<text x="565" y="84" text-anchor="middle" font-weight="bold" fill="#cc8400" font-size="13">Reward / constitutional (scalar)</text>
<rect x="410" y="100" width="310" height="80" fill="#fff" stroke="#cc8400" rx="4"/>
<text x="425" y="120" font-weight="bold" fill="#222">Skywork-Reward (Skywork AI, 8B)</text>
<text x="425" y="138" fill="#444">scalar quality/safety score for (prompt, response)</text>
<text x="425" y="154" fill="#444">best-of-N reranking · 1000+ scores/min</text>
<text x="425" y="170" fill="#666" font-style="italic">filter generation pools at scale</text>
<rect x="410" y="190" width="310" height="80" fill="#fff" stroke="#cc8400" rx="4"/>
<text x="425" y="210" font-weight="bold" fill="#222">Constitutional AI (Anthropic, methodology)</text>
<text x="425" y="228" fill="#444">model critiques + revises against constitution</text>
<text x="425" y="244" fill="#444">RL on self-corrections · integrated in Claude</text>
<text x="425" y="260" fill="#666" font-style="italic">adopt the recipe, not a checkpoint</text>
<rect x="410" y="280" width="310" height="50" fill="#fff" stroke="#444" stroke-dasharray="4 2" rx="4"/>
<text x="565" y="298" text-anchor="middle" font-weight="bold" fill="#222">Stack pattern (2026)</text>
<text x="565" y="314" text-anchor="middle" fill="#444">Prompt Guard (in) → LLM → Llama Guard (out) → Skywork rerank</text>
</g>
</svg>