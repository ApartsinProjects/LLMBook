<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Knowledge distillation teacher-student setup: a 70B teacher and a 7B student process the same training input; the student is trained on a combined loss of soft-target KL divergence (temperature T1) and hard-label cross-entropy." font-family="Segoe UI, system-ui, sans-serif" role="img" viewbox="0 -10 700 360" xmlns="http://www.w3.org/2000/svg">
<!-- Teacher model -->
<rect fill="url(#grad_8f6027_e8eaf6)" filter="url(#shadow_8f6027)" height="70" rx="8" stroke="#3949ab" stroke-linecap="round" stroke-width="2" width="180" x="40" y="50"></rect>
<text fill="#3949ab" font-size="14" font-weight="bold" text-anchor="middle" x="130" y="80">Teacher (70B)</text>
<text fill="#555" font-size="11" text-anchor="middle" x="130" y="100">Large, expensive, accurate</text>
<!-- Student model -->
<rect fill="url(#grad_8f6027_c8e6c9)" height="70" rx="8" stroke="#2e7d32" stroke-linecap="round" stroke-width="2" width="180" x="480" y="50"></rect>
<text fill="#2e7d32" font-size="14" font-weight="bold" text-anchor="middle" x="570" y="80">Student (7B)</text>
<text fill="#555" font-size="11" text-anchor="middle" x="570" y="100">Small, fast, efficient</text>
<!-- Soft targets arrow -->
<line marker-end="url(#arrow2)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" x1="220" x2="478" y1="85" y2="85"></line>
<text fill="#8e44ad" font-size="12" font-weight="bold" text-anchor="middle" x="350" y="75">Soft Targets (T &gt; 1)</text>
<defs>
<lineargradient id="grad_8f6027_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<lineargradient id="grad_8f6027_f5f5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f5f5f5"></stop></lineargradient>
<lineargradient id="grad_8f6027_e8eaf6" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7f9ff"></stop><stop offset="100%" stop-color="#e8eaf6"></stop></lineargradient>
<lineargradient id="grad_8f6027_c8e6c9" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d7f5d8"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
<filter height="115%" id="shadow_8f6027" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrow2" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5"><polygon fill="#8e44ad" points="0 0, 10 3.5, 0 7"></polygon></marker></defs>
<!-- Input -->
<rect fill="url(#grad_8f6027_fff3e0)" height="40" rx="4" stroke="#e65100" stroke-linecap="round" stroke-width="1.5" width="180" x="260" y="155"></rect>
<text fill="#e65100" font-size="12" text-anchor="middle" x="350" y="180">Training Input</text>
<!-- Arrows to both models -->
<line marker-end="url(#arrow3)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="310" x2="130" y1="155" y2="122"></line>
<line marker-end="url(#arrow3)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="390" x2="570" y1="155" y2="122"></line>
<defs><marker id="arrow3" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><polygon fill="#888" points="0 0, 8 3, 0 6"></polygon></marker></defs>
<!-- Loss components -->
<rect fill="url(#grad_8f6027_f5f5f5)" height="100" rx="6" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="600" x="50" y="225"></rect>
<text fill="#333" font-size="13" font-weight="bold" text-anchor="middle" x="350" y="250">Distillation Loss</text>
<text fill="#555" font-size="12" text-anchor="middle" x="350" y="275">L = α · KL(teacher_soft || student_soft) + (1 - α) · CE(labels, student_hard)</text>
<text fill="#8e44ad" font-size="11" text-anchor="middle" x="200" y="305">Soft target loss (T² scaled)</text>
<text fill="#2e7d32" font-size="11" text-anchor="middle" x="500" y="305">Hard label loss (standard CE)</text>
</svg>