<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="REINFORCE gradient tape: a rollout produces a chain of states and actions; the policy emits log-probabilities at each step; discounted returns weight every log-probability; the negative sum is the loss whose backward pass updates the policy parameters." role="img" style="max-width:700px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 700 240" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="rfArr" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"></path></marker></defs>
<text fill="#222" font-size="14" font-weight="700" text-anchor="middle" x="350" y="22">REINFORCE: the gradient tape of one episode</text>
<g font-size="11">
<rect fill="#e3f2fd" height="40" rx="5" stroke="#1565c0" width="80" x="20" y="60"></rect><text fill="#0d47a1" text-anchor="middle" x="60" y="84">s_1, a_1</text>
<rect fill="#e3f2fd" height="40" rx="5" stroke="#1565c0" width="80" x="120" y="60"></rect><text fill="#0d47a1" text-anchor="middle" x="160" y="84">s_2, a_2</text>
<text fill="#333" font-size="14" text-anchor="middle" x="225" y="84">...</text>
<rect fill="#e3f2fd" height="40" rx="5" stroke="#1565c0" width="80" x="250" y="60"></rect><text fill="#0d47a1" text-anchor="middle" x="290" y="84">s_T, a_T</text>
<text fill="#888" text-anchor="middle" x="365" y="84">trajectory</text>
<rect fill="#fff3e0" height="38" rx="5" stroke="#ef6c00" width="80" x="20" y="120"></rect><text fill="#e65100" text-anchor="middle" x="60" y="144">log pi_1</text>
<rect fill="#fff3e0" height="38" rx="5" stroke="#ef6c00" width="80" x="120" y="120"></rect><text fill="#e65100" text-anchor="middle" x="160" y="144">log pi_2</text>
<rect fill="#fff3e0" height="38" rx="5" stroke="#ef6c00" width="80" x="250" y="120"></rect><text fill="#e65100" text-anchor="middle" x="290" y="144">log pi_T</text>
<text fill="#888" text-anchor="middle" x="365" y="142">stored on tape</text>
<rect fill="#e8f5e9" height="38" rx="5" stroke="#2e7d32" width="80" x="20" y="178"></rect><text fill="#1b5e20" text-anchor="middle" x="60" y="202">G_1</text>
<rect fill="#e8f5e9" height="38" rx="5" stroke="#2e7d32" width="80" x="120" y="178"></rect><text fill="#1b5e20" text-anchor="middle" x="160" y="202">G_2</text>
<rect fill="#e8f5e9" height="38" rx="5" stroke="#2e7d32" width="80" x="250" y="178"></rect><text fill="#1b5e20" text-anchor="middle" x="290" y="202">G_T</text>
<text fill="#888" text-anchor="middle" x="365" y="200">discounted returns</text>
<line marker-end="url(#rfArr)" stroke="#555" stroke-width="1.2" x1="60" x2="60" y1="100" y2="118"></line>
<line marker-end="url(#rfArr)" stroke="#555" stroke-width="1.2" x1="160" x2="160" y1="100" y2="118"></line>
<line marker-end="url(#rfArr)" stroke="#555" stroke-width="1.2" x1="290" x2="290" y1="100" y2="118"></line>
<rect fill="#ede7f6" height="80" rx="6" stroke="#6a1b9a" width="200" x="470" y="100"></rect>
<text fill="#4527a0" font-size="13" font-weight="700" text-anchor="middle" x="570" y="128">loss = - sum(log pi_t * G_t)</text>
<text fill="#555" font-size="11" text-anchor="middle" x="570" y="148">loss.backward()</text>
<text fill="#555" font-size="11" text-anchor="middle" x="570" y="166">optimizer.step()</text>
<line marker-end="url(#rfArr)" stroke="#555" stroke-width="1.4" x1="340" x2="468" y1="140" y2="140"></line>
</g>
</svg>