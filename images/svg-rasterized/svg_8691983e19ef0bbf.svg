<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 400" role="img" aria-label="Constructing DPO preference pairs from production signals. Four production signal sources feed a preference-pair builder: explicit thumbs up over thumbs down feedback, response regeneration where the redo is preferred over the original, A/B test win rates, and heuristic quality scores. The builder converts each signal into a preference triplet of prompt, chosen response, and rejected response, each tagged with a confidence margin reflecting how strong the signal is. Explicit feedback gives the highest margin and quality-score heuristics the lowest. The output triplets train a model with Direct Preference Optimization." style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="prefFb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"/><stop offset="100%" stop-color="#43a047"/></linearGradient>
<linearGradient id="prefRg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bbdefb"/><stop offset="100%" stop-color="#1e88e5"/></linearGradient>
<linearGradient id="prefAb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe0b2"/><stop offset="100%" stop-color="#fb8c00"/></linearGradient>
<linearGradient id="prefQs" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e1bee7"/><stop offset="100%" stop-color="#8e24aa"/></linearGradient>
<linearGradient id="prefBuild" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#cfd8dc"/><stop offset="100%" stop-color="#607d8b"/></linearGradient>
<linearGradient id="prefOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b2dfdb"/><stop offset="100%" stop-color="#00897b"/></linearGradient>
<filter id="prefShadow" x="-6%" y="-6%" width="112%" height="112%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.18"/></filter>
<marker id="prefArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"/></marker>
</defs>
<rect x="0" y="0" width="800" height="400" fill="#fafafa" rx="8"/>
<text x="400" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#333">From noisy production signals to clean DPO preference pairs</text>
<!-- left: four signal sources -->
<text x="118" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#555">production signals</text>
<g font-size="11" font-weight="600" fill="#fff">
<rect x="24" y="74" width="188" height="46" rx="9" fill="url(#prefFb)" filter="url(#prefShadow)"/><text x="118" y="95" text-anchor="middle">thumbs up vs. thumbs down</text><text x="118" y="111" text-anchor="middle" font-size="10" fill="#e8f5e9">strongest signal (margin 1.0)</text>
<rect x="24" y="130" width="188" height="46" rx="9" fill="url(#prefRg)" filter="url(#prefShadow)"/><text x="118" y="151" text-anchor="middle">regeneration: redo &gt; original</text><text x="118" y="167" text-anchor="middle" font-size="10" fill="#e3f2fd">implicit signal (margin 0.7)</text>
<rect x="24" y="186" width="188" height="46" rx="9" fill="url(#prefAb)" filter="url(#prefShadow)"/><text x="118" y="207" text-anchor="middle">A/B test win rate</text><text x="118" y="223" text-anchor="middle" font-size="10" fill="#fff3e0">aggregate signal</text>
<rect x="24" y="242" width="188" height="46" rx="9" fill="url(#prefQs)" filter="url(#prefShadow)"/><text x="118" y="263" text-anchor="middle">heuristic quality score</text><text x="118" y="279" text-anchor="middle" font-size="10" fill="#f3e5f5">fallback (lowest margin)</text>
</g>
<!-- arrows to builder -->
<line x1="212" y1="97" x2="286" y2="170" stroke="#43a047" stroke-width="1.8" marker-end="url(#prefArrow)"/>
<line x1="212" y1="153" x2="286" y2="180" stroke="#1e88e5" stroke-width="1.8" marker-end="url(#prefArrow)"/>
<line x1="212" y1="209" x2="286" y2="196" stroke="#fb8c00" stroke-width="1.8" marker-end="url(#prefArrow)"/>
<line x1="212" y1="265" x2="286" y2="206" stroke="#8e24aa" stroke-width="1.8" marker-end="url(#prefArrow)"/>
<!-- builder -->
<rect x="288" y="148" width="120" height="84" rx="11" fill="url(#prefBuild)" filter="url(#prefShadow)"/>
<text x="348" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">preference</text>
<text x="348" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">pair builder</text>
<text x="348" y="214" text-anchor="middle" font-size="9.5" fill="#eceff1">match + dedup + redact</text>
<!-- arrow to triplet -->
<line x1="408" y1="190" x2="448" y2="190" stroke="#777" stroke-width="2" marker-end="url(#prefArrow)"/>
<!-- output triplet card -->
<rect x="450" y="120" width="326" height="148" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="1.6"/>
<text x="613" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#00695c">DPO preference triplet</text>
<g font-size="11">
<rect x="466" y="156" width="294" height="26" rx="6" fill="#fff"/><text x="478" y="174" fill="#37474f"><tspan font-weight="700" fill="#455a64">prompt:</tspan> the shared user request</text>
<rect x="466" y="188" width="294" height="26" rx="6" fill="#e8f5e9" stroke="#43a047"/><text x="478" y="206" fill="#2e7d32"><tspan font-weight="700">chosen:</tspan> preferred reply (&#43;)</text>
<rect x="466" y="220" width="294" height="26" rx="6" fill="#ffebee" stroke="#e53935"/><text x="478" y="238" fill="#c62828"><tspan font-weight="700">rejected:</tspan> dispreferred reply (&#8722;)</text>
</g>
<text x="613" y="260" text-anchor="middle" font-size="10" fill="#00695c">+ margin = confidence in the ordering</text>
<!-- bottom warning strip -->
<rect x="450" y="286" width="326" height="58" rx="9" fill="#fff8e1" stroke="#ffb300"/>
<text x="613" y="306" text-anchor="middle" font-size="11" font-weight="600" fill="#e65100">watch the biases</text>
<text x="613" y="323" text-anchor="middle" font-size="10" fill="#6d4c41">position, length, and temporal drift can</text>
<text x="613" y="337" text-anchor="middle" font-size="10" fill="#6d4c41">leak into pairs and teach the wrong lesson</text>
<text x="240" y="324" text-anchor="middle" font-size="11" fill="#888">Many weak, noisy signals; one</text>
<text x="240" y="340" text-anchor="middle" font-size="11" fill="#888">clean, uniform training format.</text>
</svg>