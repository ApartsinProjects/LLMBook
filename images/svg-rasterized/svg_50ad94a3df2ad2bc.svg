<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The four HIPAA-compliant deployment patterns on a 2x2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="fig-74-4-1-title fig-74-4-1-desc">
<title id="fig-74-4-1-title">The four HIPAA-compliant deployment patterns on a 2x2</title>
<desc id="fig-74-4-1-desc">2x2 matrix. X-axis: data sensitivity (de-identifiable on left, full PHI required on right). Y-axis: residency requirement (vendor cloud OK at top, must stay in institutional tenancy at bottom). Four quadrants: De-identified-then-cloud (top-left), BAA-covered cloud (top-right), VPC-isolated (bottom-right), On-prem open-weight (bottom-left). Each cell lists representative use case and capability lag.</desc>
<rect x="0" y="0" width="760" height="380" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">HIPAA-compliant deployment: 2x2 by data sensitivity and residency</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- axis labels -->
<text x="380" y="350" text-anchor="middle" font-weight="700">Data sensitivity</text>
<text x="200" y="365" text-anchor="middle" font-size="10">de-identifiable</text>
<text x="560" y="365" text-anchor="middle" font-size="10">full PHI required</text>
<text x="45" y="190" text-anchor="middle" font-weight="700" transform="rotate(-90 45 190)">Residency requirement</text>
<text x="80" y="80" text-anchor="end" font-size="10">vendor cloud OK</text>
<text x="80" y="290" text-anchor="end" font-size="10">single-tenant</text>

<!-- top-left: de-id-then-cloud -->
<rect x="90" y="50" width="280" height="140" fill="#dfeaf5" stroke="#2c5fa0" stroke-width="2" rx="4"/>
<text x="230" y="72" text-anchor="middle" font-weight="700" fill="#2c5fa0">De-identified-then-cloud</text>
<text x="230" y="92" text-anchor="middle" font-size="10">Safe Harbor or Expert Determination</text>
<text x="230" y="106" text-anchor="middle" font-size="10">before any external send</text>
<line x1="120" y1="118" x2="340" y2="118" stroke="#2c5fa0"/>
<text x="230" y="138" text-anchor="middle" font-size="10">Use: literature synthesis,</text>
<text x="230" y="152" text-anchor="middle" font-size="10">internal Q&amp;A, research summarisation</text>
<text x="230" y="174" text-anchor="middle" font-size="10" font-style="italic">cheapest at scale, re-id risk on outliers</text>

<!-- top-right: BAA-covered cloud -->
<rect x="390" y="50" width="280" height="140" fill="#eef5ec" stroke="#1f6f3a" stroke-width="2" rx="4"/>
<text x="530" y="72" text-anchor="middle" font-weight="700" fill="#1f6f3a">BAA-covered cloud  ★ default</text>
<text x="530" y="92" text-anchor="middle" font-size="10">Azure OpenAI Service for Healthcare,</text>
<text x="530" y="106" text-anchor="middle" font-size="10">AWS Bedrock HIPAA-eligible</text>
<line x1="420" y1="118" x2="640" y2="118" stroke="#1f6f3a"/>
<text x="530" y="138" text-anchor="middle" font-size="10">Use: ambient scribing,</text>
<text x="530" y="152" text-anchor="middle" font-size="10">EHR copilots, patient chat (w/ review)</text>
<text x="530" y="174" text-anchor="middle" font-size="10" font-style="italic">fastest to deploy, frontier capability</text>

<!-- bottom-left: on-prem open-weight -->
<rect x="90" y="200" width="280" height="140" fill="#f1d6d0" stroke="#b2351e" stroke-width="2" rx="4"/>
<text x="230" y="222" text-anchor="middle" font-weight="700" fill="#b2351e">On-prem open-weight</text>
<text x="230" y="242" text-anchor="middle" font-size="10">self-hosted Llama / Mistral / Qwen</text>
<text x="230" y="256" text-anchor="middle" font-size="10">on hospital infrastructure</text>
<line x1="120" y1="268" x2="340" y2="268" stroke="#b2351e"/>
<text x="230" y="288" text-anchor="middle" font-size="10">Use: imaging-report drafting,</text>
<text x="230" y="302" text-anchor="middle" font-size="10">tumor-board summary, VA/DoD</text>
<text x="230" y="324" text-anchor="middle" font-size="10" font-style="italic">air-gappable, 6-18mo capability lag</text>

<!-- bottom-right: VPC-isolated -->
<rect x="390" y="200" width="280" height="140" fill="#fff5d6" stroke="#b8860b" stroke-width="2" rx="4"/>
<text x="530" y="222" text-anchor="middle" font-weight="700" fill="#7a5a08">VPC-isolated cloud</text>
<text x="530" y="242" text-anchor="middle" font-size="10">Bedrock provisioned,</text>
<text x="530" y="256" text-anchor="middle" font-size="10">Vertex private endpoint</text>
<line x1="420" y1="268" x2="640" y2="268" stroke="#b8860b"/>
<text x="530" y="288" text-anchor="middle" font-size="10">Use: enterprise CDS,</text>
<text x="530" y="302" text-anchor="middle" font-size="10">revenue-cycle, FedRAMP-adjacent</text>
<text x="530" y="324" text-anchor="middle" font-size="10" font-style="italic">tightest audit story, higher cost</text>
</g>
</svg>