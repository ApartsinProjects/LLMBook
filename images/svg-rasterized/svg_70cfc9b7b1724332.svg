<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Lost in the middle: U-shaped retrieval accuracy curve across long context positions" viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="380" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">"Lost in the middle": retrieval accuracy across a 128K-token context</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Liu et al. 2023 needle-in-haystack methodology, reproduced on Llama, GPT-4, Claude</text>
<!-- Axes -->
<line x1="100" y1="330" x2="820" y2="330" stroke="#1a1a2e" stroke-width="1.5"/>
<line x1="100" y1="80" x2="100" y2="330" stroke="#1a1a2e" stroke-width="1.5"/>
<text x="460" y="360" font-size="11" text-anchor="middle" fill="#1a1a2e">position of "needle" fact within context window (0 to 128K tokens)</text>
<text x="50" y="200" font-size="11" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90,50,200)">retrieval accuracy</text>
<!-- x ticks -->
<text x="100" y="345" font-size="9" text-anchor="middle" fill="#5a4a3a">0%</text>
<text x="280" y="345" font-size="9" text-anchor="middle" fill="#5a4a3a">25%</text>
<text x="460" y="345" font-size="9" text-anchor="middle" fill="#5a4a3a">50%</text>
<text x="640" y="345" font-size="9" text-anchor="middle" fill="#5a4a3a">75%</text>
<text x="820" y="345" font-size="9" text-anchor="middle" fill="#5a4a3a">100%</text>
<!-- y ticks -->
<text x="92" y="90" font-size="9" text-anchor="end" fill="#5a4a3a">100%</text>
<text x="92" y="155" font-size="9" text-anchor="end" fill="#5a4a3a">75%</text>
<text x="92" y="220" font-size="9" text-anchor="end" fill="#5a4a3a">50%</text>
<text x="92" y="285" font-size="9" text-anchor="end" fill="#5a4a3a">25%</text>
<!-- U-curve -->
<path d="M 100 95 Q 200 110 280 180 T 460 260 T 640 180 T 820 95" stroke="#7a2a4a" stroke-width="2" fill="none"/>
<!-- Markers -->
<circle cx="100" cy="95" r="5" fill="#7a2a4a"/>
<text x="100" y="78" font-size="9" text-anchor="middle" fill="#7a2a4a">98%</text>
<circle cx="460" cy="260" r="5" fill="#7a2a4a"/>
<text x="460" y="280" font-size="9" text-anchor="middle" fill="#7a2a4a">~45%</text>
<circle cx="820" cy="95" r="5" fill="#7a2a4a"/>
<text x="820" y="78" font-size="9" text-anchor="middle" fill="#7a2a4a">95%</text>
<!-- Annotations -->
<rect x="120" y="100" width="140" height="60" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
<text x="190" y="120" font-size="10" font-weight="700" text-anchor="middle" fill="#27ae60">primacy zone</text>
<text x="190" y="135" font-size="9" text-anchor="middle" fill="#1a1a2e">first ~10% of ctx</text>
<text x="190" y="148" font-size="9" text-anchor="middle" fill="#1a1a2e">high recall</text>
<rect x="660" y="100" width="140" height="60" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
<text x="730" y="120" font-size="10" font-weight="700" text-anchor="middle" fill="#27ae60">recency zone</text>
<text x="730" y="135" font-size="9" text-anchor="middle" fill="#1a1a2e">last ~10% of ctx</text>
<text x="730" y="148" font-size="9" text-anchor="middle" fill="#1a1a2e">high recall</text>
<rect x="380" y="200" width="160" height="60" rx="6" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="1.5"/>
<text x="460" y="220" font-size="10" font-weight="700" text-anchor="middle" fill="#7a2a2a">"lost in the middle"</text>
<text x="460" y="235" font-size="9" text-anchor="middle" fill="#1a1a2e">25-75% positions</text>
<text x="460" y="248" font-size="9" text-anchor="middle" fill="#1a1a2e">accuracy halves</text>
</svg>