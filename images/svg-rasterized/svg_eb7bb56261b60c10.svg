<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: 5.2 OPRO: Optimization by Prompting" font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<!-- Iteration History -->
<rect fill="#f8f8ff" filter="url(#shadow_10b197)" height="240" rx="10" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="200" x="30" y="50"></rect>
<text fill="#8e44ad" font-size="12" font-weight="700" text-anchor="middle" x="130" y="75">Optimization History</text>
<line stroke="#ddd" stroke-linecap="round" stroke-width="1" x1="50" x2="210" y1="85" y2="85"></line>
<text fill="#555" font-size="11" x="55" y="105">Prompt v1: "Classify the text"</text>
<text fill="#e94560" font-size="11" font-weight="600" x="55" y="118">Score: 62%</text>
<text fill="#555" font-size="11" x="55" y="140">Prompt v2: "You are an expert..."</text>
<text fill="#f39c12" font-size="11" font-weight="600" x="55" y="153">Score: 74%</text>
<text fill="#555" font-size="11" x="55" y="175">Prompt v3: "Analyze sentiment..."</text>
<text fill="#f39c12" font-size="11" font-weight="600" x="55" y="188">Score: 79%</text>
<text fill="#555" font-size="11" x="55" y="210">Prompt v4: "Rate the emotional..."</text>
<text fill="#27ae60" font-size="11" font-weight="600" x="55" y="223">Score: 85%</text>
<text fill="#8e44ad" font-size="11" text-anchor="middle" x="130" y="260">Scores trend upward over iterations</text>
<!-- Arrow to optimizer -->
<line marker-end="url(#arrowOp)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="230" x2="290" y1="170" y2="170"></line>
<!-- Optimizer LLM -->
<rect fill="url(#grad_10b197_e8f4fd)" height="100" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="170" x="295" y="120"></rect>
<text fill="#3498db" font-size="12" font-weight="700" text-anchor="middle" x="380" y="150">Optimizer LLM</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="170">"Given these past prompts</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="183">and scores, generate a</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="196">better prompt"</text>
<!-- Arrow to evaluator -->
<line marker-end="url(#arrowOp)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="465" x2="520" y1="170" y2="170"></line>
<!-- Evaluate -->
<rect fill="#e8f5e9" height="130" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="170" x="525" y="105"></rect>
<text fill="#27ae60" font-size="12" font-weight="700" text-anchor="middle" x="610" y="130">Evaluate</text>
<text fill="#555" font-size="11" text-anchor="middle" x="610" y="152">Run candidate prompt</text>
<text fill="#555" font-size="11" text-anchor="middle" x="610" y="165">on validation set</text>
<rect fill="url(#grad_10b197_fff)" height="30" rx="6" stroke="#27ae60" stroke-linecap="round" stroke-width="1" width="110" x="555" y="180"></rect>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="610" y="200">Score: 88%</text>
<!-- Loop arrow back to history -->
<path d="M 610 235 Q 610 280 370 290 Q 130 300 130 290" fill="none" marker-end="url(#arrowOp2)" stroke="#8e44ad" stroke-dasharray="6" stroke-linecap="round" stroke-width="2"></path>
<text fill="#8e44ad" font-size="11" font-weight="600" text-anchor="middle" x="370" y="280">add to history, repeat</text>
<defs>
<lineargradient id="grad_10b197_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<lineargradient id="grad_10b197_fff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#fff"></stop></lineargradient>
<filter height="115%" id="shadow_10b197" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowOp" markerheight="6" markerwidth="6" orient="auto" refx="5" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888"></path></marker>
<marker id="arrowOp2" markerheight="6" markerwidth="6" orient="auto" refx="5" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8e44ad"></path></marker>
</defs>
</svg>