<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three debiasing axes for LLM-as-judge: position swap, length truncation, and rubric anchoring, with a noisy signal becoming cleaner" role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewbox="0 0 720 290" xmlns="http://www.w3.org/2000/svg">
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="360" y="22">Three debiasing axes for an LLM judge</text>
<g transform="translate(30,55)">
<rect fill="#dbeafe" height="200" rx="8" stroke="#3a73a8" stroke-width="1.5" width="200"></rect>
<text fill="#3a73a8" font-size="12" font-weight="600" text-anchor="middle" x="100" y="22">1. Position swap</text>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="100" y="38">cancels left-vs-right bias</text>
<g transform="translate(20,55)">
<rect fill="#fff" height="22" rx="3" stroke="#3a73a8" width="50" x="0" y="0"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="25" y="15">A</text>
<text fill="#2d3748" font-size="11" text-anchor="middle" x="80" y="15">vs</text>
<rect fill="#fff" height="22" rx="3" stroke="#3a73a8" width="50" x="110" y="0"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="135" y="15">B</text>
</g>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="100" y="105">then swap order:</text>
<g transform="translate(20,115)">
<rect fill="#fff" height="22" rx="3" stroke="#3a73a8" width="50" x="0" y="0"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="25" y="15">B</text>
<text fill="#2d3748" font-size="11" text-anchor="middle" x="80" y="15">vs</text>
<rect fill="#fff" height="22" rx="3" stroke="#3a73a8" width="50" x="110" y="0"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="135" y="15">A</text>
</g>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="100" y="170">require agreement,</text>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="100" y="184">or average verdicts</text>
</g>
<g transform="translate(260,55)">
<rect fill="#fef3c7" height="200" rx="8" stroke="#d97706" stroke-width="1.5" width="200"></rect>
<text fill="#d97706" font-size="12" font-weight="600" text-anchor="middle" x="100" y="22">2. Length control</text>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="100" y="38">long answers win by default</text>
<rect fill="#fff" height="14" stroke="#d97706" width="160" x="20" y="60"></rect>
<rect fill="#fed7aa" height="14" width="60" x="20" y="60"></rect>
<text fill="#2d3748" font-size="9" text-anchor="middle" x="100" y="71">A: 200 tok</text>
<rect fill="#fff" height="14" stroke="#d97706" width="160" x="20" y="84"></rect>
<rect fill="#d97706" height="14" width="150" x="20" y="84"></rect>
<text fill="#fff" font-size="9" text-anchor="middle" x="100" y="95">B: 500 tok ("more thorough")</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="100" y="125">Fix: truncate to common budget</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="100" y="140">or regress out log(L_A / L_B)</text>
<rect fill="#fff" height="14" stroke="#d97706" width="160" x="20" y="150"></rect>
<rect fill="#d97706" height="14" width="60" x="20" y="150"></rect>
<text fill="#fff" font-size="9" text-anchor="middle" x="100" y="161">A: 200 tok</text>
<rect fill="#fff" height="14" stroke="#d97706" width="160" x="20" y="174"></rect>
<rect fill="#d97706" height="14" width="60" x="20" y="174"></rect>
<text fill="#fff" font-size="9" text-anchor="middle" x="100" y="185">B: 200 tok (truncated)</text>
</g>
<g transform="translate(490,55)">
<rect fill="#d1fae5" height="200" rx="8" stroke="#047857" stroke-width="1.5" width="200"></rect>
<text fill="#047857" font-size="12" font-weight="600" text-anchor="middle" x="100" y="22">3. Rubric anchoring</text>
<text fill="#718096" font-size="9" font-style="italic" text-anchor="middle" x="100" y="38">structured beats gestalt</text>
<rect fill="#fff" height="125" rx="4" stroke="#047857" width="170" x="15" y="55"></rect>
<text fill="#047857" font-size="10" font-weight="600" text-anchor="middle" x="100" y="72">Score on 4 axes:</text>
<text fill="#2d3748" font-size="9" x="25" y="90">- Factuality (1-5)</text>
<text fill="#2d3748" font-size="9" x="25" y="106">- Faithfulness (1-5)</text>
<text fill="#2d3748" font-size="9" x="25" y="122">- Coverage (1-5)</text>
<text fill="#2d3748" font-size="9" x="25" y="138">- Fluency (1-5)</text>
<text fill="#b91c1c" font-size="9" x="25" y="160">avoid: "which is better?"</text>
<text fill="#b91c1c" font-size="9" x="25" y="173">(gestalt = formatting bias)</text>
</g>
</svg>