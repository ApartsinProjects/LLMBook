<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: classical recommender system families. Collaborative filtering routes items between users with similar interaction patterns. Content-based filtering routes items to users via item-similarity using item features. Hybrid systems blend both signals." role="img" viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter height="115%" id="dropShadow38_1" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.12" stddeviation="3"></fedropshadow></filter>
</defs>
<!-- Collaborative filtering box -->
<rect fill="#eaf5ff" filter="url(#dropShadow38_1)" height="280" rx="10" stroke="#2980b9" stroke-width="2" width="240" x="20" y="40"></rect>
<text fill="#2980b9" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="140" y="65">Collaborative Filtering</text>
<circle cx="70" cy="120" fill="#8e44ad" r="18"></circle>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="70" y="124">U1</text>
<circle cx="210" cy="120" fill="#2980b9" r="18"></circle>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="210" y="124">U2</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="140" y="100">similar users</text>
<line stroke="#666" stroke-dasharray="4" stroke-width="1.5" x1="88" x2="192" y1="120" y2="120"></line>
<rect fill="#27ae60" height="24" rx="3" width="20" x="60" y="180"></rect>
<rect fill="#e74c3c" height="24" rx="3" width="20" x="100" y="180"></rect>
<rect fill="#f39c12" height="24" rx="3" width="20" x="160" y="180"></rect>
<rect fill="#e74c3c" height="24" rx="3" width="20" x="200" y="180"></rect>
<line marker-end="url(#arr381)" stroke="#666" stroke-width="1.5" x1="70" x2="70" y1="140" y2="178"></line>
<line marker-end="url(#arr381)" stroke="#666" stroke-width="1.5" x1="70" x2="105" y1="140" y2="178"></line>
<line marker-end="url(#arr381)" stroke="#666" stroke-width="1.5" x1="210" x2="170" y1="140" y2="178"></line>
<line marker-end="url(#arr381)" stroke="#666" stroke-width="1.5" x1="210" x2="210" y1="140" y2="178"></line>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="140" y="235">U1 and U2 share items.</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="140" y="252">Recommend U1's items to U2.</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle" x="140" y="285">Signal: user-item interactions only.</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle" x="140" y="300">No item features required.</text>

<!-- Content-based box -->
<rect fill="#fff5e6" filter="url(#dropShadow38_1)" height="280" rx="10" stroke="#e67e22" stroke-width="2" width="240" x="280" y="40"></rect>
<text fill="#e67e22" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="400" y="65">Content-Based</text>
<circle cx="400" cy="115" fill="#2980b9" r="18"></circle>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="400" y="119">U</text>
<rect fill="#27ae60" height="24" rx="3" width="20" x="330" y="170"></rect>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="340" y="208">liked</text>
<rect fill="#27ae60" height="24" rx="3" width="20" x="450" y="170"></rect>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="460" y="208">similar item</text>
<line marker-end="url(#arr381)" stroke="#666" stroke-width="1.5" x1="400" x2="345" y1="135" y2="168"></line>
<line stroke="#666" stroke-dasharray="4" stroke-width="1.5" x1="350" x2="450" y1="182" y2="182"></line>
<line marker-end="url(#arr381)" stroke="#666" stroke-width="1.5" x1="460" x2="408" y1="170" y2="135"></line>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="400" y="245">Find items whose features</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="400" y="262">resemble items U already liked.</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle" x="400" y="290">Signal: item attributes / text.</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle" x="400" y="305">Works for a brand-new user.</text>

<!-- Hybrid box -->
<rect fill="#f0e8ff" filter="url(#dropShadow38_1)" height="280" rx="10" stroke="#8e44ad" stroke-width="2" width="240" x="540" y="40"></rect>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="660" y="65">Hybrid</text>
<rect fill="white" height="60" rx="5" stroke="#2980b9" stroke-width="1.5" width="180" x="570" y="100"></rect>
<text fill="#2980b9" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="660" y="120">CF score</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="660" y="140">matrix factorization,</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="660" y="153">neural CF, two-tower</text>
<rect fill="white" height="60" rx="5" stroke="#e67e22" stroke-width="1.5" width="180" x="570" y="180"></rect>
<text fill="#e67e22" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="660" y="200">Content score</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="660" y="220">item text / image</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="660" y="233">similarity</text>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="660" y="275">Blended ranker</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle" x="660" y="300">Weighted sum, learned gate, reranker</text>

<defs><marker id="arr381" markerheight="6" markerwidth="6" orient="auto" refx="5" refy="3" viewBox="0 0 6 6"><path d="M0,0 L6,3 L0,6 z" fill="#666"></path></marker></defs>
</svg>