<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Compute provider tiers for LLM training in 2026" viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="380" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">2026 training-compute provider tiers: pick by scale and interconnect</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Mistral Mixtral 8x22B (141B MoE) trained on Crusoe, not AWS</text>
<g font-size="10">
<g transform="translate(20,60)">
<rect width="200" height="300" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
<text x="100" y="22" font-weight="700" text-anchor="middle" fill="#27ae60">Tier 1: Bare-metal spot</text>
<text x="100" y="40" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">cheapest, no managed</text>
<text x="20" y="68" fill="#1a1a2e">- Lambda</text>
<text x="20" y="86" fill="#1a1a2e">- RunPod</text>
<text x="20" y="104" fill="#1a1a2e">- Vast.ai</text>
<text x="20" y="122" fill="#1a1a2e">- Hyperbolic Labs</text>
<text x="20" y="140" fill="#1a1a2e">- Salad (4090s)</text>
<text x="20" y="170" fill="#1a1a2e">2024-25 entrants:</text>
<text x="20" y="188" fill="#1a1a2e">- SF Compute (auction)</text>
<text x="20" y="206" fill="#1a1a2e">- Prime Intellect (decentralized)</text>
<text x="100" y="245" font-size="10" font-weight="700" text-anchor="middle" fill="#27ae60">~$1.80-3 / H100-hr</text>
<text x="100" y="270" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">use case: fine-tune,</text>
<text x="100" y="284" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">single-node training</text>
</g>
<g transform="translate(230,60)">
<rect width="200" height="300" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="100" y="22" font-weight="700" text-anchor="middle" fill="#a67c1a">Tier 2: Specialist clusters</text>
<text x="100" y="40" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">NVLink + InfiniBand</text>
<text x="20" y="68" fill="#1a1a2e">- CoreWeave</text>
<text x="20" y="86" fill="#1a1a2e">- Crusoe</text>
<text x="20" y="104" fill="#1a1a2e">- Nebius</text>
<text x="20" y="122" fill="#1a1a2e">- NVIDIA DGX Cloud</text>
<text x="35" y="136" font-size="9" fill="#5a4a3a">(post-Lepton acq)</text>
<text x="20" y="170" fill="#1a1a2e">Serverless wrappers:</text>
<text x="20" y="188" fill="#1a1a2e">- Modal</text>
<text x="20" y="206" fill="#1a1a2e">- Together AI</text>
<text x="100" y="245" font-size="10" font-weight="700" text-anchor="middle" fill="#a67c1a">multi-node fine-tune</text>
<text x="100" y="262" font-size="10" font-weight="700" text-anchor="middle" fill="#a67c1a">+ mid-scale pretrain</text>
<text x="100" y="290" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">Mistral Mixtral 8x22B</text>
</g>
<g transform="translate(440,60)">
<rect width="200" height="300" rx="8" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="100" y="22" font-weight="700" text-anchor="middle" fill="#3d4d8a">Tier 3: Hyperscalers + TPU</text>
<text x="100" y="40" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">raw scale, full pretrain</text>
<text x="20" y="68" fill="#1a1a2e">- AWS Trainium2 (2024)</text>
<text x="20" y="86" fill="#1a1a2e">- Google Trillium TPU (v6e)</text>
<text x="20" y="104" fill="#1a1a2e">- GCP A3 Ultra (H100/H200)</text>
<text x="20" y="122" fill="#1a1a2e">- Azure NDv5</text>
<text x="100" y="170" font-size="10" font-weight="700" text-anchor="middle" fill="#3d4d8a">use case:</text>
<text x="100" y="186" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">100B+ pretraining</text>
<text x="100" y="200" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">Anthropic / Google labs</text>
<text x="100" y="230" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">enterprise compliance</text>
<text x="100" y="270" font-size="9" font-weight="700" text-anchor="middle" fill="#7a2a4a">~$5-8 / H100-hr</text>
</g>
<g transform="translate(650,60)">
<rect width="210" height="300" rx="8" fill="#f5e3e8" stroke="#7a2a4a" stroke-width="2"/>
<text x="105" y="22" font-weight="700" text-anchor="middle" fill="#7a2a4a">Cross-cutting 2025 patterns</text>
<text x="20" y="50" font-weight="700" fill="#1a1a2e">Spot checkpointing:</text>
<text x="20" y="66" font-size="9" fill="#5a4a3a">fsspec + s5cmd to S3</text>
<text x="20" y="80" font-size="9" fill="#5a4a3a">every N steps</text>
<text x="20" y="110" font-weight="700" fill="#1a1a2e">Decentralized training:</text>
<text x="20" y="126" font-size="9" fill="#5a4a3a">OpenDiLoCo (DiLoCo open</text>
<text x="20" y="140" font-size="9" fill="#5a4a3a">impl, geo-separated GPUs)</text>
<text x="20" y="170" font-weight="700" fill="#1a1a2e">Multi-provider routing:</text>
<text x="20" y="186" font-size="9" fill="#5a4a3a">SkyPilot, Kuberay over</text>
<text x="20" y="200" font-size="9" fill="#5a4a3a">SF Compute + Lambda</text>
<text x="20" y="230" font-weight="700" fill="#1a1a2e">Tracking layer:</text>
<text x="20" y="246" font-size="9" fill="#5a4a3a">W&amp;B (default), MLflow</text>
<text x="20" y="260" font-size="9" fill="#5a4a3a">(self-host), Neptune (research)</text>
<text x="105" y="290" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">"needing AWS" is overrated</text>
</g>
</g>
</svg>