<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The Snorkel paradigm: labeling functions produce a sparse label matrix, and a label model aggregates votes into probabilistic labels." role="img" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_78160d_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_78160d_f0e6ff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff5ff"></stop><stop offset="100%" stop-color="#f0e6ff"></stop></lineargradient>
<lineargradient id="grad_78160d_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_78160d" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowW" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><path d="M0,0 L8,3 L0,6" fill="#0f3460"></path></marker>
</defs>
<!-- Unlabeled Data -->
<rect fill="url(#grad_78160d_e8f4fd)" filter="url(#shadow_78160d)" height="60" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="120" x="20" y="110"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="80" y="135">Unlabeled Data</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="80" y="155">N examples</text>
<!-- Labeling Functions -->
<line marker-end="url(#arrowW)" stroke="#0f3460" stroke-linecap="round" stroke-width="1.5" x1="140" x2="180" y1="140" y2="140"></line>
<rect fill="url(#grad_78160d_f0e6ff)" height="240" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="160" x="180" y="20"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="260" y="48">Labeling Functions</text>
<line stroke="#8e44ad" stroke-linecap="round" stroke-width="1" x1="195" x2="325" y1="58" y2="58"></line>
<rect fill="white" height="28" rx="4" stroke="#8e44ad" stroke-linecap="round" stroke-width="1" width="130" x="195" y="68"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="260" y="87">LF1: keyword match</text>
<rect fill="white" height="28" rx="4" stroke="#8e44ad" stroke-linecap="round" stroke-width="1" width="130" x="195" y="104"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="260" y="123">LF2: regex pattern</text>
<rect fill="white" height="28" rx="4" stroke="#8e44ad" stroke-linecap="round" stroke-width="1" width="130" x="195" y="140"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="260" y="159">LF3: heuristic rule</text>
<rect fill="white" height="28" rx="4" stroke="#8e44ad" stroke-linecap="round" stroke-width="1" width="130" x="195" y="176"></rect>
<text fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="260" y="195">LF4: external KB</text>
<rect fill="#e8f5e9" height="28" rx="4" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" width="130" x="195" y="212"></rect>
<text fill="#27ae60" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="260" y="231">LF5: LLM classifier</text>
<!-- Label Matrix -->
<line marker-end="url(#arrowW)" stroke="#0f3460" stroke-linecap="round" stroke-width="1.5" x1="340" x2="390" y1="140" y2="140"></line>
<rect fill="url(#grad_78160d_fef9e7)" height="110" rx="8" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="120" x="390" y="85"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="450" y="110">Label Matrix</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="450" y="132">N x M matrix</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="450" y="150">of votes from</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="450" y="168">M labeling funcs</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="450" y="186">(sparse: many abstains)</text>
<!-- Label Model -->
<line marker-end="url(#arrowW)" stroke="#0f3460" stroke-linecap="round" stroke-width="1.5" x1="510" x2="550" y1="140" y2="140"></line>
<rect fill="#1a1a2e" height="90" rx="8" width="130" x="550" y="95"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="615" y="122">Label Model</text>
<text fill="#ccc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="615" y="142">Learns accuracy +</text>
<text fill="#ccc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="615" y="158">correlations of LFs</text>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="615" y="174">Outputs: P(y|LFs)</text>
</svg>