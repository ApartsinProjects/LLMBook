<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="LLM-as-feature-extractor pipeline: raw text into an embedding model (text-embedding-3-small or sentence-transformers) produces a 1536-d feature vector that, optionally combined with structured features (price, category, date), feeds a classical model (XGBoost, LR, neural net) to a prediction." font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 790 280" xmlns="http://www.w3.org/2000/svg">
<!-- Step 1: Raw Text -->
<rect fill="url(#grad_991445_e8f4fd)" filter="url(#shadow_991445)" height="70" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="130" x="20" y="60"></rect>
<text fill="#3498db" font-size="12" font-weight="700" text-anchor="middle" x="85" y="88">Raw Text</text>
<text fill="#555" font-size="11" text-anchor="middle" x="85" y="108">"Customer is upset</text>
<text fill="#555" font-size="11" text-anchor="middle" x="85" y="120">about late delivery"</text>
<!-- Arrow -->
<line marker-end="url(#arrowGray)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="150" x2="185" y1="95" y2="95"></line>
<!-- Step 2: Embedding Model -->
<rect fill="url(#grad_991445_f0e6ff)" height="80" rx="10" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="150" x="185" y="55"></rect>
<text fill="#8e44ad" font-size="12" font-weight="700" text-anchor="middle" x="260" y="80">Embedding Model</text>
<text fill="#555" font-size="11" text-anchor="middle" x="260" y="98">text-embedding-3-small</text>
<text fill="#555" font-size="11" text-anchor="middle" x="260" y="115">or sentence-transformers</text>
<!-- Arrow -->
<line marker-end="url(#arrowGray)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="335" x2="370" y1="95" y2="95"></line>
<!-- Step 3: Feature Vector -->
<rect fill="url(#grad_991445_fef9e7)" height="70" rx="10" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="140" x="370" y="60"></rect>
<text fill="#f39c12" font-size="12" font-weight="700" text-anchor="middle" x="440" y="85">Feature Vector</text>
<text fill="#555" font-size="11" text-anchor="middle" x="440" y="103">[0.12, -0.45, 0.78,</text>
<text fill="#555" font-size="11" text-anchor="middle" x="440" y="115"> ..., 0.33] (1536-d)</text>
<!-- Arrow -->
<line marker-end="url(#arrowGray)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="510" x2="545" y1="95" y2="95"></line>
<!-- Step 4: Classical Model -->
<rect fill="#e8f5e9" height="80" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="140" x="545" y="55"></rect>
<text fill="#27ae60" font-size="12" font-weight="700" text-anchor="middle" x="615" y="80">Classical Model</text>
<text fill="#555" font-size="11" text-anchor="middle" x="615" y="98">XGBoost, LR,</text>
<text fill="#555" font-size="11" text-anchor="middle" x="615" y="115">Neural Network</text>
<!-- Bottom: Optional structured features -->
<rect fill="url(#grad_991445_fff3e0)" height="60" rx="10" stroke="#e67e22" stroke-dasharray="5,3" stroke-linecap="round" stroke-width="1.5" width="140" x="370" y="170"></rect>
<text fill="#e67e22" font-size="11" font-weight="600" text-anchor="middle" x="440" y="195">+ Structured Features</text>
<text fill="#555" font-size="11" text-anchor="middle" x="440" y="212">price, category, date</text>
<!-- Arrow from structured to classical model -->
<line marker-end="url(#arrowOrange)" stroke="#e67e22" stroke-dasharray="4,3" stroke-linecap="round" stroke-width="1.5" x1="510" x2="580" y1="200" y2="135"></line>
<!-- Output -->
<text fill="#27ae60" font-size="12" font-weight="700" x="700" y="92">Prediction</text>
<line stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="685" x2="700" y1="95" y2="95"></line>
<!-- Performance box -->
<rect fill="#e8f5e9" height="60" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="1" width="280" x="20" y="200"></rect>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="160" y="222">Inference: embedding cached, model &lt;1ms</text>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="160" y="242">Cost: embedding once (<span>&#36;</span>0.0001) + model (~free)</text>
<defs>
<lineargradient id="grad_991445_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_991445_f0e6ff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff5ff"></stop><stop offset="100%" stop-color="#f0e6ff"></stop></lineargradient>
<lineargradient id="grad_991445_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<lineargradient id="grad_991445_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<filter height="115%" id="shadow_991445" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowGray" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#888" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="arrowOrange" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#e67e22" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
</svg>