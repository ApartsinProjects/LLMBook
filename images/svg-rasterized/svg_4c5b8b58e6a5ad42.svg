<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Side-by-side comparison: PRM grades each of four steps individually; ORM grades only the final answer" role="img" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
<rect x="20" y="30" width="260" height="170" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="6"/><text x="150" y="55" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">PRM (Process)</text><text x="40" y="85" font-size="11">Step 1</text><circle cx="200" cy="82" r="6" fill="#2e7d32"/><text x="220" y="86" font-size="11">+1</text><text x="40" y="115" font-size="11">Step 2</text><circle cx="200" cy="112" r="6" fill="#2e7d32"/><text x="220" y="116" font-size="11">+1</text><text x="40" y="145" font-size="11">Step 3</text><circle cx="200" cy="142" r="6" fill="#c62828"/><text x="220" y="146" font-size="11">-1</text><text x="40" y="175" font-size="11">Answer</text><circle cx="200" cy="172" r="6" fill="#c62828"/><text x="220" y="176" font-size="11">-1</text><rect x="320" y="30" width="260" height="170" fill="#fff3e0" stroke="#e65100" stroke-width="2" rx="6"/><text x="450" y="55" font-size="13" font-weight="bold" text-anchor="middle" fill="#bf360c">ORM (Outcome)</text><text x="340" y="85" font-size="11">Step 1</text><text x="500" y="86" font-size="11" fill="#999">(unscored)</text><text x="340" y="115" font-size="11">Step 2</text><text x="500" y="116" font-size="11" fill="#999">(unscored)</text><text x="340" y="145" font-size="11">Step 3</text><text x="500" y="146" font-size="11" fill="#999">(unscored)</text><text x="340" y="175" font-size="11">Answer</text><circle cx="500" cy="172" r="6" fill="#c62828"/><text x="520" y="176" font-size="11">-1</text>
</svg>