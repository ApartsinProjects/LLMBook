<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 380" role="img" aria-label="Dashboard grid showing four metric categories: quality, safety, operational, and behavioral, each with example sub-metrics" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<text x="360" y="24" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">An LLM dashboard tracks four metric families at once</text>

<g transform="translate(30,55)">
<rect width="320" height="140" rx="8" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="160" y="22" font-size="12" font-weight="600" fill="#3a73a8" text-anchor="middle">Quality</text>
<g font-size="10" fill="#2d3748">
<text x="20" y="45">BLEU / ROUGE / BERTScore</text>
<text x="20" y="63">Judge-model score (1-5)</text>
<text x="20" y="81">Reference match rate</text>
<text x="20" y="99">Semantic similarity vs gold</text>
</g>
<g transform="translate(180,40)">
<line x1="0" y1="60" x2="120" y2="60" stroke="#3a73a8" stroke-width="1"/>
<polyline points="0,55 20,52 40,48 60,42 80,40 100,38 120,35" fill="none" stroke="#3a73a8" stroke-width="2"/>
<text x="60" y="80" font-size="8" fill="#718096" text-anchor="middle">trend over deploys</text>
</g>
</g>

<g transform="translate(370,55)">
<rect width="320" height="140" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="160" y="22" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Safety</text>
<g font-size="10" fill="#2d3748">
<text x="20" y="45">Toxicity rate</text>
<text x="20" y="63">Refusal accuracy</text>
<text x="20" y="81">Policy-violation counts</text>
<text x="20" y="99">Jailbreak resistance</text>
</g>
<g transform="translate(190,40)">
<circle cx="40" cy="55" r="32" fill="none" stroke="#fecaca" stroke-width="8"/>
<path d="M40,23 A32,32 0 0,1 70,52" fill="none" stroke="#b91c1c" stroke-width="8"/>
<text x="40" y="58" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">0.4%</text>
<text x="40" y="100" font-size="8" fill="#718096" text-anchor="middle">violation rate</text>
</g>
</g>

<g transform="translate(30,210)">
<rect width="320" height="140" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="160" y="22" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">Operational</text>
<g font-size="10" fill="#2d3748">
<text x="20" y="45">Latency P50 / P95 / P99</text>
<text x="20" y="63">Throughput (tok/s)</text>
<text x="20" y="81">Cost per 1K requests</text>
<text x="20" y="99">Error rate</text>
</g>
<g transform="translate(180,40)" font-size="9">
<rect x="0" y="60" width="22" height="20" fill="#d97706"/>
<rect x="26" y="50" width="22" height="30" fill="#d97706"/>
<rect x="52" y="35" width="22" height="45" fill="#d97706"/>
<rect x="78" y="20" width="22" height="60" fill="#d97706"/>
<text x="11" y="93" fill="#718096" text-anchor="middle">P50</text>
<text x="37" y="93" fill="#718096" text-anchor="middle">P90</text>
<text x="63" y="93" fill="#718096" text-anchor="middle">P95</text>
<text x="89" y="93" fill="#718096" text-anchor="middle">P99</text>
</g>
</g>

<g transform="translate(370,210)">
<rect width="320" height="140" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="160" y="22" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">Behavioral</text>
<g font-size="10" fill="#2d3748">
<text x="20" y="45">Hallucination rate</text>
<text x="20" y="63">Instruction-following acc.</text>
<text x="20" y="81">Format compliance</text>
<text x="20" y="99">Citation faithfulness</text>
</g>
<g transform="translate(195,38)" font-size="9">
<rect x="0" y="0" width="100" height="14" rx="2" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
<rect x="0" y="0" width="92" height="14" rx="2" fill="#047857"/>
<text x="50" y="10" fill="#fff" text-anchor="middle">format: 92%</text>
<rect x="0" y="20" width="100" height="14" rx="2" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
<rect x="0" y="20" width="78" height="14" rx="2" fill="#047857"/>
<text x="50" y="30" fill="#fff" text-anchor="middle">instr-follow: 78%</text>
<rect x="0" y="40" width="100" height="14" rx="2" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
<rect x="0" y="40" width="65" height="14" rx="2" fill="#047857"/>
<text x="50" y="50" fill="#fff" text-anchor="middle">citation: 65%</text>
</g>
</g>
</svg>