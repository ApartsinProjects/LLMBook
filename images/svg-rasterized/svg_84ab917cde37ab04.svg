<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="RLHF versus DPO pipelines: RLHF chains SFT model, reward-model training, and PPO training (four models in GPU) to produce an aligned model; DPO uses an SFT model plus frozen reference and a single DPO training step, saving roughly 50% GPU memory and reward-model infrastructure." font-family="Segoe UI, system-ui, sans-serif" role="img" viewbox="0 -10 780 350" xmlns="http://www.w3.org/2000/svg">
<!-- RLHF Pipeline -->
<rect fill="url(#grad_dcb41e_c8e6c9)" filter="url(#shadow_dcb41e)" height="50" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="130" x="20" y="40"></rect>
<text fill="#333" font-size="12" text-anchor="middle" x="85" y="70">SFT Model</text>
<line marker-end="url(#arr)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="150" x2="180" y1="65" y2="65"></line>
<rect fill="url(#grad_dcb41e_bbdefb)" height="50" rx="8" stroke="#1565c0" stroke-linecap="round" stroke-width="2" width="130" x="180" y="40"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="245" y="63">Reward Model</text>
<text fill="#666" font-size="11" text-anchor="middle" x="245" y="78">Training</text>
<line marker-end="url(#arr)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="310" x2="340" y1="65" y2="65"></line>
<rect fill="url(#grad_dcb41e_e1bee7)" height="50" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="130" x="340" y="40"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="405" y="63">PPO Training</text>
<text fill="#666" font-size="11" text-anchor="middle" x="405" y="78">(4 models in GPU)</text>
<line marker-end="url(#arr)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="470" x2="500" y1="65" y2="65"></line>
<rect fill="#fff9c4" height="50" rx="8" stroke="#f9a825" stroke-linecap="round" stroke-width="2" width="130" x="500" y="40"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="565" y="63">Aligned Model</text>
<text fill="#666" font-size="11" text-anchor="middle" x="565" y="78">weeks of iteration</text>
<!-- Separator -->
<line stroke="#ddd" stroke-dasharray="8,4" stroke-linecap="round" stroke-width="1" x1="20" x2="760" y1="120" y2="120"></line>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="390.0" x2="400.0" y1="147.0" y2="193.0"></line>
<text fill="#666" font-size="13" text-anchor="middle" x="390" y="145">vs.</text>
<!-- DPO Pipeline -->
<text fill="#1a1a2e" font-size="15" font-weight="bold" text-anchor="middle" x="390" y="175">DPO Pipeline (2 models)</text>
<rect fill="url(#grad_dcb41e_c8e6c9)" height="50" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="170" x="100" y="195"></rect>
<text fill="#333" font-size="12" text-anchor="middle" x="185" y="218">SFT Model (policy)</text>
<text fill="#666" font-size="11" text-anchor="middle" x="185" y="233">+ frozen reference</text>
<line marker-end="url(#arr)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="270" x2="320" y1="220" y2="220"></line>
<rect fill="#e8f5e9" height="50" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="170" x="320" y="195"></rect>
<text fill="#333" font-size="12" text-anchor="middle" x="405" y="218">DPO Training</text>
<text fill="#666" font-size="11" text-anchor="middle" x="405" y="233">(SFT-like simplicity)</text>
<line marker-end="url(#arr)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="490" x2="540" y1="220" y2="220"></line>
<rect fill="#fff9c4" height="50" rx="8" stroke="#f9a825" stroke-linecap="round" stroke-width="2" width="140" x="540" y="195"></rect>
<text fill="#333" font-size="12" text-anchor="middle" x="610" y="218">Aligned Model</text>
<text fill="#666" font-size="11" text-anchor="middle" x="610" y="233">same quality</text>
<!-- Benefits -->
<rect fill="url(#grad_dcb41e_f5f5f5)" height="55" rx="8" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="600" x="100" y="270"></rect>
<text fill="#27ae60" font-size="12" font-weight="bold" text-anchor="middle" x="400" y="292">DPO Advantages:</text>
<text fill="#555" font-size="11" text-anchor="middle" x="400" y="312">No reward model training | No RL instability | 50% less GPU memory | Simpler hyperparameter tuning</text>
<defs>
<lineargradient id="grad_dcb41e_f5f5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f5f5f5"></stop></lineargradient>
<lineargradient id="grad_dcb41e_e1bee7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f0cdf6"></stop><stop offset="100%" stop-color="#e1bee7"></stop></lineargradient>
<lineargradient id="grad_dcb41e_bbdefb" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#caedff"></stop><stop offset="100%" stop-color="#bbdefb"></stop></lineargradient>
<lineargradient id="grad_dcb41e_c8e6c9" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d7f5d8"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
<filter height="115%" id="shadow_dcb41e" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arr" markerheight="8" markerwidth="8" orient="auto" refx="8" refy="4"><path d="M0,0 L8,4 L0,8 Z" fill="#666"></path></marker>
</defs>
</svg>