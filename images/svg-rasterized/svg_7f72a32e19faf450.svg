<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Cohen's d effect size interpretation guide for LLM evaluation comparisons." role="img" style="font-family: sans-serif;" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
<!-- Scale bar -->
<line stroke="#ccc" stroke-linecap="round" stroke-width="2" x1="50" x2="650" y1="100" y2="100"></line>
<!-- Markers -->
<line stroke="#888" stroke-linecap="round" stroke-width="2" x1="50" x2="50" y1="85" y2="115"></line>
<text fill="#333" font-size="12" font-weight="600" text-anchor="middle" x="50" y="135">0</text>
<text fill="#888" font-size="11" text-anchor="middle" x="50" y="155">No effect</text>
<line stroke="#f39c12" stroke-linecap="round" stroke-width="2" x1="200" x2="200" y1="85" y2="115"></line>
<text fill="#f39c12" font-size="12" font-weight="600" text-anchor="middle" x="200" y="135">0.2</text>
<text fill="#f39c12" font-size="11" text-anchor="middle" x="200" y="155">Small</text>
<line stroke="#e67e22" stroke-linecap="round" stroke-width="2" x1="350" x2="350" y1="85" y2="115"></line>
<text fill="#e67e22" font-size="12" font-weight="600" text-anchor="middle" x="350" y="135">0.5</text>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="350.0" x2="350.0" y1="142.0" y2="114.0"></line>
<text fill="#e67e22" font-size="11" text-anchor="middle" x="350" y="155">Medium</text>
<line stroke="#e74c3c" stroke-linecap="round" stroke-width="2" x1="500" x2="500" y1="85" y2="115"></line>
<text fill="#e74c3c" font-size="12" font-weight="600" text-anchor="middle" x="500" y="135">0.8</text>
<text fill="#e74c3c" font-size="11" text-anchor="middle" x="500" y="155">Large</text>
<line stroke="#c0392b" stroke-linecap="round" stroke-width="2" x1="650" x2="650" y1="85" y2="115"></line>
<text fill="#c0392b" font-size="12" font-weight="600" text-anchor="middle" x="650" y="135">1.2+</text>
<text fill="#c0392b" font-size="11" text-anchor="middle" x="650" y="155">Very large</text>
<!-- Gradient fill -->
<defs><filter height="116%" id="stdShadow2" width="108%" x="-4%" y="-4%"><fedropshadow dx="1" dy="2" flood-opacity="0.08" stddeviation="2"></fedropshadow></filter>
<lineargradient id="effectGrad" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" style="stop-color:#27ae60;stop-opacity:0.3"></stop>
<stop offset="30%" style="stop-color:#f39c12;stop-opacity:0.3"></stop>
<stop offset="60%" style="stop-color:#e67e22;stop-opacity:0.3"></stop>
<stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.3"></stop>
</lineargradient>
</defs>
<rect fill="url(#effectGrad)" height="24" rx="4" width="600" x="50" y="88"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="350" y="60">Difference in standard deviation units</text>
</svg>