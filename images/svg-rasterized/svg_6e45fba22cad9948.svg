<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three families of machine unlearning compared: Exact (retrain from scratch on filtered data, complete guarantee, prohibitive cost), Approximate (gradient ascent on the forget set, partial guarantee, moderate cost), Weight Editing (task vectors, LOKA, representation surgery, targeted guarantee, low cost)." role="img" style="font-family: sans-serif;" viewBox="0 -11 720 291" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad3" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow1" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<!-- Exact -->
<rect fill="#e8f5e9" filter="url(#shadow1)" height="210" rx="12" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="210" x="20" y="50"></rect>
<text fill="#27ae60" font-size="14" font-weight="700" text-anchor="middle" x="125" y="78">Exact Unlearning</text>
<text fill="#333" font-size="12" text-anchor="middle" x="125" y="105">Retrain from scratch</text>
<text fill="#333" font-size="12" text-anchor="middle" x="125" y="125">on filtered dataset</text>
<text fill="#666" font-size="11" text-anchor="middle" x="125" y="155">Guarantee: complete</text>
<text fill="#666" font-size="11" text-anchor="middle" x="125" y="175">Cost: prohibitive</text>
<text fill="#666" font-size="11" text-anchor="middle" x="125" y="195">for large LLMs</text>
<rect fill="#27ae60" height="25" rx="5" width="160" x="45" y="215"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="125" y="232">Gold standard</text>
<!-- Approximate -->
<rect fill="#e8f4fd" filter="url(#shadow1)" height="210" rx="12" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="210" x="255" y="50"></rect>
<text fill="#3498db" font-size="14" font-weight="700" text-anchor="middle" x="360" y="78">Approximate</text>
<text fill="#333" font-size="12" text-anchor="middle" x="360" y="105">Gradient ascent</text>
<text fill="#333" font-size="12" text-anchor="middle" x="360" y="125">on forget set</text>
<text fill="#666" font-size="11" text-anchor="middle" x="360" y="155">Guarantee: partial</text>
<text fill="#666" font-size="11" text-anchor="middle" x="360" y="175">Cost: moderate</text>
<text fill="#666" font-size="11" text-anchor="middle" x="360" y="195">(few epochs)</text>
<rect fill="#3498db" height="25" rx="5" width="160" x="280" y="215"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="360" y="232">Most practical</text>
<!-- Weight editing -->
<rect fill="#f0e6ff" filter="url(#shadow1)" height="210" rx="12" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="210" x="490" y="50"></rect>
<text fill="#8e44ad" font-size="14" font-weight="700" text-anchor="middle" x="595" y="78">Weight Editing</text>
<text fill="#333" font-size="12" text-anchor="middle" x="595" y="105">Task vectors, LOKA,</text>
<text fill="#333" font-size="12" text-anchor="middle" x="595" y="125">representation surgery</text>
<text fill="#666" font-size="11" text-anchor="middle" x="595" y="155">Guarantee: targeted</text>
<text fill="#666" font-size="11" text-anchor="middle" x="595" y="175">Cost: low</text>
<text fill="#666" font-size="11" text-anchor="middle" x="595" y="195">(no training)</text>
<rect fill="#8e44ad" height="25" rx="5" width="160" x="515" y="215"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="595" y="232">Emerging research</text>
</svg>