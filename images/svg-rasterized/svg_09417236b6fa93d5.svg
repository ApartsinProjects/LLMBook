<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Entropy: confident versus uncertain distributions" aria-labelledby="figA4title" role="img" style="max-width:720px;width:100%;height:auto;background:#fafafa;border-radius:8px;" viewbox="0 -5 720 345" xmlns="http://www.w3.org/2000/svg">
<title id="figA4title">Entropy: confident versus uncertain distributions</title>
<text fill="#222" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" x="360" y="24">Shannon entropy quantifies surprise</text>
<g transform="translate(60,80)">
<text fill="#222" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" x="120" y="0">Confident model</text>
<text fill="#666" font-family="Georgia, serif" font-size="11" text-anchor="middle" x="120" y="18">"The cat sat on the ___"</text>
<rect fill="#a4d99a" height="160" stroke="#2ca02c" width="40" x="20" y="40"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="40" y="215">0.90</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="40" y="230">"mat"</text>
<rect fill="#a4d99a" height="10" stroke="#2ca02c" width="40" x="70" y="190"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="90" y="215">0.05</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="90" y="230">"rug"</text>
<rect fill="#a4d99a" height="6" stroke="#2ca02c" width="40" x="120" y="194"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="140" y="215">0.03</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="140" y="230">"chair"</text>
<rect fill="#a4d99a" height="4" stroke="#2ca02c" width="40" x="170" y="196"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="190" y="215">0.02</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="190" y="230">"floor"</text>
<line stroke="#666" stroke-width="1" x1="0" x2="220" y1="200" y2="200"></line>
<text fill="#2ca02c" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" x="120" y="255">H ≈ 0.57 bits</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" font-style="italic" text-anchor="middle" x="120" y="270">low surprise</text>
</g>
<g transform="translate(420,80)">
<text fill="#222" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" x="120" y="0">Uncertain model</text>
<text fill="#666" font-family="Georgia, serif" font-size="11" text-anchor="middle" x="120" y="18">"I went to the ___"</text>
<rect fill="#f4a87a" height="80" stroke="#d62728" width="40" x="20" y="120"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="40" y="215">0.25</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="40" y="230">"store"</text>
<rect fill="#f4a87a" height="80" stroke="#d62728" width="40" x="70" y="120"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="90" y="215">0.25</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="90" y="230">"park"</text>
<rect fill="#f4a87a" height="80" stroke="#d62728" width="40" x="120" y="120"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="140" y="215">0.25</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="140" y="230">"gym"</text>
<rect fill="#f4a87a" height="80" stroke="#d62728" width="40" x="170" y="120"></rect>
<text font-family="Georgia, serif" font-size="11" text-anchor="middle" x="190" y="215">0.25</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" text-anchor="middle" x="190" y="230">"office"</text>
<line stroke="#666" stroke-width="1" x1="0" x2="220" y1="200" y2="200"></line>
<text fill="#d62728" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" x="120" y="255">H = 2.00 bits</text>
<text fill="#666" font-family="Georgia, serif" font-size="10" font-style="italic" text-anchor="middle" x="120" y="270">maximum surprise (uniform)</text>
</g>
<text fill="#444" font-family="Georgia, serif" font-size="11" font-style="italic" text-anchor="middle" x="360" y="320">H(P) = −Σ P(x) log P(x). Perplexity = 2<tspan baseline-shift="super" font-size="9">H</tspan>: 1.5 vs 4 effective choices.</text>
</svg>