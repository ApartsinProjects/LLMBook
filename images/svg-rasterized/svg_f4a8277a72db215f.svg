<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Co-located versus disaggregated LLM inference. In the co-located design, a single GPU pool runs both prefill, which is compute-bound, and decode, which is memory-bandwidth-bound; the two phases interfere, so neither reaches good utilization. In the disaggregated design, prefill runs on a compute-optimized prompt-machine pool and decode runs on a bandwidth-optimized token-machine pool. After prefill, only the KV cache is transferred between pools over a high-bandwidth network such as RDMA or InfiniBand. Each pool can be sized and scaled independently for its workload." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="diPre" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffe0b2"></stop><stop offset="100%" stop-color="#fb8c00"></stop></lineargradient>
<lineargradient id="diDec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bbdefb"></stop><stop offset="100%" stop-color="#1e88e5"></stop></lineargradient>
<lineargradient id="diMix" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#ffcc80"></stop><stop offset="50%" stop-color="#ce93d8"></stop><stop offset="100%" stop-color="#90caf9"></stop></lineargradient>
<filter height="112%" id="diShadow" width="112%" x="-6%" y="-6%"><fedropshadow dx="1" dy="2" flood-opacity="0.18" stddeviation="2"></fedropshadow></filter>
<marker id="diArrow" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"></path></marker>
<marker id="diArrowK" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#43a047"></path></marker>
</defs>
<rect fill="#fafafa" height="400" rx="8" width="800" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="400" y="26">Co-located vs. disaggregated prefill and decode</text>
<line stroke="#e0e0e0" stroke-width="1.5" x1="400" x2="400" y1="44" y2="356"></line>
<!-- ===== LEFT: co-located ===== -->
<text fill="#8e24aa" font-size="13" font-weight="600" text-anchor="middle" x="200" y="64">Co-located: one pool does both</text>
<rect fill="url(#diMix)" filter="url(#diShadow)" height="120" rx="12" width="280" x="60" y="120"></rect>
<text fill="#fff" font-size="13" font-weight="700" text-anchor="middle" x="200" y="150">shared GPU pool</text>
<rect fill="#fff" height="54" opacity="0.9" rx="8" width="110" x="84" y="166"></rect><text fill="#e65100" font-size="11" font-weight="600" text-anchor="middle" x="139" y="190">prefill</text><text fill="#bf360c" font-size="9.5" text-anchor="middle" x="139" y="206">compute-bound</text>
<rect fill="#fff" height="54" opacity="0.9" rx="8" width="110" x="206" y="166"></rect><text fill="#1565c0" font-size="11" font-weight="600" text-anchor="middle" x="261" y="190">decode</text><text fill="#0d47a1" font-size="9.5" text-anchor="middle" x="261" y="206">bandwidth-bound</text>
<text fill="#e53935" font-size="11" font-weight="600" text-anchor="middle" x="200" y="268">phases interfere on one device</text>
<text fill="#888" font-size="10" text-anchor="middle" x="200" y="288">prefill inflates decode latency 2 to 5×;</text>
<text fill="#888" font-size="10" text-anchor="middle" x="200" y="302">decode wastes idle compute</text>
<!-- ===== RIGHT: disaggregated ===== -->
<text fill="#43a047" font-size="13" font-weight="600" text-anchor="middle" x="600" y="64">Disaggregated: two right-sized pools</text>
<!-- prefill pool -->
<rect fill="url(#diPre)" filter="url(#diShadow)" height="86" rx="11" width="150" x="438" y="96"></rect>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="513" y="124">prompt machines</text>
<text fill="#fff3e0" font-size="11" text-anchor="middle" x="513" y="143">prefill only</text>
<text fill="#fff3e0" font-size="10" text-anchor="middle" x="513" y="160">compute-optimized</text>
<text fill="#fff3e0" font-size="9.5" text-anchor="middle" x="513" y="174">max Tensor Core use</text>
<!-- decode pool -->
<rect fill="url(#diDec)" filter="url(#diShadow)" height="86" rx="11" width="150" x="438" y="232"></rect>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="513" y="260">token machines</text>
<text fill="#e3f2fd" font-size="11" text-anchor="middle" x="513" y="279">decode only</text>
<text fill="#e3f2fd" font-size="10" text-anchor="middle" x="513" y="296">bandwidth-optimized</text>
<text fill="#e3f2fd" font-size="9.5" text-anchor="middle" x="513" y="310">right-sized fleet</text>
<!-- KV transfer arrow -->
<path d="M588 150 C 660 150, 660 268, 588 268" fill="none" marker-end="url(#diArrowK)" stroke="#43a047" stroke-width="2.6"></path>
<rect fill="#e8f5e9" height="46" rx="9" stroke="#43a047" stroke-width="1.4" width="156" x="612" y="186"></rect>
<text fill="#2e7d32" font-size="11" font-weight="600" text-anchor="middle" x="690" y="206">transfer KV cache</text>
<text fill="#555" font-size="10" text-anchor="middle" x="690" y="222">RDMA / InfiniBand</text>
<text fill="#2e7d32" font-size="10" font-weight="600" text-anchor="middle" x="600" y="346">scale each pool independently for its workload</text>
<text fill="#888" font-size="11" text-anchor="middle" x="400" y="384">Disaggregation pays off above roughly 50 to 100 GPUs; below that, chunked prefill captures most of the win.</text>
</svg>