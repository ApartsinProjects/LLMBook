<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: Hybrid Structured/Unstructured Retrieval" font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 -12 700 292" xmlns="http://www.w3.org/2000/svg">
<!-- Question -->
<rect fill="url(#grad_a585b4_e3f2fd)" filter="url(#shadow_a585b4)" height="40" rx="8" stroke="#1565c0" stroke-linecap="round" stroke-width="2" width="200" x="250" y="45"></rect>
<text fill="#0d47a1" font-size="11" font-weight="bold" text-anchor="middle" x="350" y="70">"Why did Q3 revenue decline?"</text>
<!-- Two paths -->
<line marker-end="url(#ahyb)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="300" x2="150" y1="85" y2="120"></line>
<line marker-end="url(#ahyb)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="400" x2="550" y1="85" y2="120"></line>
<!-- Structured Path -->
<rect fill="url(#grad_a585b4_fff3e0)" height="65" rx="8" stroke="#e65100" stroke-linecap="round" stroke-width="1.5" width="200" x="50" y="120"></rect>
<text fill="#e65100" font-size="11" font-weight="bold" text-anchor="middle" x="150" y="142">Structured Retrieval</text>
<text fill="#555" font-size="11" text-anchor="middle" x="150" y="158">Text-to-SQL: revenue by segment</text>
<text fill="#555" font-size="11" text-anchor="middle" x="150" y="172">Q3 vs Q2 comparison, trends</text>
<!-- Unstructured Path -->
<rect fill="#e8f5e9" height="65" rx="8" stroke="#2e7d32" stroke-linecap="round" stroke-width="1.5" width="200" x="450" y="120"></rect>
<text fill="#2e7d32" font-size="11" font-weight="bold" text-anchor="middle" x="550" y="142">Unstructured Retrieval</text>
<text fill="#555" font-size="11" text-anchor="middle" x="550" y="158">Vector search: quarterly reports,</text>
<text fill="#555" font-size="11" text-anchor="middle" x="550" y="172">meeting notes, market analysis</text>
<!-- Converge -->
<line marker-end="url(#ahyb)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="150" x2="300" y1="185" y2="220"></line>
<line marker-end="url(#ahyb)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="550" x2="400" y1="185" y2="220"></line>
<!-- Combined -->
<rect fill="url(#grad_a585b4_f3e5f5)" height="50" rx="8" stroke="#7b1fa2" stroke-linecap="round" stroke-width="2" width="200" x="250" y="215"></rect>
<text fill="#7b1fa2" font-size="11" font-weight="bold" text-anchor="middle" x="350" y="237">LLM Synthesis</text>
<text fill="#555" font-size="11" text-anchor="middle" x="350" y="253">Numbers + context = full answer</text>
<defs>
<lineargradient id="grad_a585b4_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#e3f2fd"></stop></lineargradient>
<lineargradient id="grad_a585b4_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#f3e5f5"></stop></lineargradient>
<lineargradient id="grad_a585b4_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<filter height="115%" id="shadow_a585b4" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="ahyb" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333"></path>
</marker>
</defs>
</svg>