<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: Mental Model: The Recipe Binder" role="img" style="font-family: sans-serif;" viewBox="0 -9 820 489" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad3" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadowOps" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
<marker id="arrowOps" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#555" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="arrowPurple" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#8e44ad" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<text fill="#555" font-size="12" text-anchor="middle" x="410" y="48">From prompt development through production monitoring to continuous improvement</text>
<!-- Phase 1: Develop -->
<rect fill="#e8f4fd" filter="url(#shadowOps)" height="175" rx="12" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="170" x="20" y="75"></rect>
<text fill="#1565c0" font-size="14" font-weight="700" text-anchor="middle" x="105" y="100">1. Develop</text>
<rect fill="white" height="26" rx="5" stroke="#3498db" stroke-linecap="round" width="140" x="35" y="112"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="105" y="130">Write prompt template</text>
<rect fill="white" height="26" rx="5" stroke="#3498db" stroke-linecap="round" width="140" x="35" y="145"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="105" y="163">Version with hash</text>
<rect fill="white" height="26" rx="5" stroke="#3498db" stroke-linecap="round" width="140" x="35" y="178"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="105" y="196">Offline eval (test set)</text>
<rect fill="white" height="26" rx="5" stroke="#3498db" stroke-linecap="round" width="140" x="35" y="211"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="105" y="229">Choose model + params</text>
<!-- Arrow -->
<line marker-end="url(#arrowOps)" stroke="#555" stroke-linecap="round" stroke-width="2" x1="190" x2="225" y1="162" y2="162"></line>
<!-- Phase 2: Test -->
<rect fill="#f0e6ff" filter="url(#shadowOps)" height="175" rx="12" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="170" x="230" y="75"></rect>
<text fill="#6a1b9a" font-size="14" font-weight="700" text-anchor="middle" x="315" y="100">2. A/B Test</text>
<rect fill="white" height="26" rx="5" stroke="#8e44ad" stroke-linecap="round" width="140" x="245" y="112"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="315" y="130">Hash-based splitting</text>
<rect fill="white" height="26" rx="5" stroke="#8e44ad" stroke-linecap="round" width="140" x="245" y="145"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="315" y="163">Run both variants</text>
<rect fill="white" height="26" rx="5" stroke="#8e44ad" stroke-linecap="round" width="140" x="245" y="178"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="315" y="196">Collect online metrics</text>
<rect fill="white" height="26" rx="5" stroke="#8e44ad" stroke-linecap="round" width="140" x="245" y="211"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="315" y="229">Statistical evaluation</text>
<!-- Arrow -->
<line marker-end="url(#arrowOps)" stroke="#555" stroke-linecap="round" stroke-width="2" x1="400" x2="435" y1="162" y2="162"></line>
<!-- Phase 3: Deploy -->
<rect fill="#e8f5e9" filter="url(#shadowOps)" height="175" rx="12" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="170" x="440" y="75"></rect>
<text fill="#2e7d32" font-size="14" font-weight="700" text-anchor="middle" x="525" y="100">3. Deploy</text>
<rect fill="white" height="26" rx="5" stroke="#27ae60" stroke-linecap="round" width="140" x="455" y="112"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="525" y="130">Promote winner</text>
<rect fill="white" height="26" rx="5" stroke="#27ae60" stroke-linecap="round" width="140" x="455" y="145"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="525" y="163">Model registry update</text>
<rect fill="white" height="26" rx="5" stroke="#27ae60" stroke-linecap="round" width="140" x="455" y="178"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="525" y="196">Gradual rollout</text>
<rect fill="white" height="26" rx="5" stroke="#27ae60" stroke-linecap="round" width="140" x="455" y="211"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="525" y="229">Rollback ready</text>
<!-- Arrow -->
<line marker-end="url(#arrowOps)" stroke="#555" stroke-linecap="round" stroke-width="2" x1="610" x2="645" y1="162" y2="162"></line>
<!-- Phase 4: Monitor -->
<rect fill="#fff3e0" filter="url(#shadowOps)" height="175" rx="12" stroke="#ff9800" stroke-linecap="round" stroke-width="2" width="150" x="650" y="75"></rect>
<text fill="#e65100" font-size="14" font-weight="700" text-anchor="middle" x="725" y="100">4. Monitor</text>
<rect fill="white" height="26" rx="5" stroke="#ff9800" stroke-linecap="round" width="124" x="663" y="112"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="725" y="130">Latency tracking</text>
<rect fill="white" height="26" rx="5" stroke="#ff9800" stroke-linecap="round" width="124" x="663" y="145"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="725" y="163">Quality scores</text>
<rect fill="white" height="26" rx="5" stroke="#ff9800" stroke-linecap="round" width="124" x="663" y="178"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="725" y="196">Cost per request</text>
<rect fill="white" height="26" rx="5" stroke="#ff9800" stroke-linecap="round" width="124" x="663" y="211"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="725" y="229">Drift detection</text>
<!-- Feedback Loop: large curved arrow from Monitor back to Develop -->
<path d="M 725 250 Q 725 340 580 360 Q 420 380 260 360 Q 105 340 105 260" fill="none" marker-end="url(#arrowPurple)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2.5"></path>
<text fill="#8e44ad" font-size="13" font-weight="700" text-anchor="middle" x="410" y="380">Feedback Loop (Data Flywheel)</text>
<!-- Feedback data items along the loop -->
<rect fill="#fce4ec" height="30" rx="6" stroke="#e94560" stroke-linecap="round" stroke-width="1.5" width="135" x="170" y="310"></rect>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="238" y="330">User corrections</text>
<rect fill="#fce4ec" height="30" rx="6" stroke="#e94560" stroke-linecap="round" stroke-width="1.5" width="135" x="340" y="330"></rect>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="408" y="350">Thumbs up/down</text>
<rect fill="#fce4ec" height="30" rx="6" stroke="#e94560" stroke-linecap="round" stroke-width="1.5" width="135" x="510" y="310"></rect>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="578" y="330">Failure patterns</text>
<!-- Registry in the center -->
<rect fill="#f8f9fa" filter="url(#shadowOps)" height="45" rx="10" stroke="#1a1a2e" stroke-linecap="round" stroke-width="2" width="260" x="280" y="420"></rect>
<text fill="#1a1a2e" font-size="12" font-weight="700" text-anchor="middle" x="410" y="442">Model + Prompt Registry</text>
<text fill="#555" font-size="11" text-anchor="middle" x="410" y="458">MLflow / W&amp;B / Hugging Face Hub</text>
<!-- Dashed lines from registry to phases -->
<line stroke="#bbb" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="310" x2="105" y1="420" y2="250"></line>
<line stroke="#bbb" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="370" x2="315" y1="420" y2="250"></line>
<line stroke="#bbb" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="450" x2="525" y1="420" y2="250"></line>
<line stroke="#bbb" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="510" x2="725" y1="420" y2="250"></line>
</svg>