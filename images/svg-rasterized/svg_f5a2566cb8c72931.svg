<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The dialogue system spectrum from task-oriented to open-domain, with hybrid systems in between." role="img" viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg">
<!-- Background -->
<defs>
<filter height="115%" id="shadow_d6139b" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<lineargradient id="spectrumGrad" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" style="stop-color:#2c3e50;stop-opacity:0.9"></stop>
<stop offset="50%" style="stop-color:#8e44ad;stop-opacity:0.9"></stop>
<stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.9"></stop>
</lineargradient>
</defs>
<!-- Spectrum bar -->
<rect fill="url(#spectrumGrad)" filter="url(#shadow_d6139b)" height="35" rx="17" width="660" x="60" y="40"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="160" y="63">Task-Oriented</text>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="390" y="63">Hybrid</text>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="620" y="63">Open-Domain</text>
<!-- Task-oriented box -->
<rect fill="#ecf0f1" height="200" rx="10" stroke="#2c3e50" stroke-linecap="round" stroke-width="2" width="200" x="40" y="100"></rect>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="140" y="125">Task-Oriented</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="55" y="150">• Slot filling</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="55" y="170">• State tracking</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="55" y="190">• API integration</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="55" y="210">• Clear success criteria</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" x="55" y="235">Examples: booking, support,</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" x="55" y="250">ordering, scheduling</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="55" y="280">Structure: High</text>
<!-- Hybrid box -->
<rect fill="#f5eef8" height="200" rx="10" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="200" x="290" y="100"></rect>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="390" y="125">Hybrid</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="305" y="150"><tspan>• Task + chitchat</tspan></text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="305" y="170">• Mode detection</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="305" y="190">• Flexible routing</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="305" y="210">• Graceful fallbacks</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" x="305" y="235">Examples: customer service,</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" x="305" y="250"><tspan>virtual assistants, retail</tspan></text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="305" y="280"><tspan>Structure: Medium</tspan></text>
<!-- Open-domain box -->
<rect fill="#fdedec" height="200" rx="10" stroke="#e74c3c" stroke-linecap="round" stroke-width="2" width="200" x="540" y="100"></rect>
<text fill="#e74c3c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="640" y="125">Open-Domain</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="555" y="150"><tspan>• Freeform topics</tspan></text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="555" y="170">• Persona consistency</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="555" y="190">• Engagement focus</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="555" y="210">• Soft success criteria</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" x="555" y="235">Examples: companions,</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" x="555" y="250">creative partners, tutors</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="555" y="280">Structure: Low</text>
</svg>