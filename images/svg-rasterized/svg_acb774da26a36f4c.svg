<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: End-to-End Example: Financial Event Extraction" font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
