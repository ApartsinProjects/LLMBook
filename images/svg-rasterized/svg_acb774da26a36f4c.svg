<text fill="#555" font-size="11" text-anchor="middle" x="395" y="104">grounding check</text>
<line marker-end="url(#arr-b)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="460" x2="485" y1="85" y2="85"></line>
