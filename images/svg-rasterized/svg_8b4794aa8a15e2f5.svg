<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Q-Former stage-1 training. Frozen image features on the left feed cross-attention from a block of 32 learnable query tokens. The queries and the caption text pass through a shared transformer that branches into three loss heads. The image-text contrastive head keeps queries and text in separate streams. The image-text matching head joins queries and text with full bidirectional self-attention for a binary match classifier. The image-grounded text generation head lets text tokens attend causally while queries stay bidirectional, producing the caption. The three losses sum into one objective and share one parameter set." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 840 440" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="qfImg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#b3e5fc"></stop><stop offset="100%" stop-color="#039be5"></stop></lineargradient>
<lineargradient id="qfQ" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e1bee7"></stop><stop offset="100%" stop-color="#8e24aa"></stop></lineargradient>
<lineargradient id="qfShared" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3e0"></stop><stop offset="100%" stop-color="#fb8c00"></stop></lineargradient>
<lineargradient id="qfITC" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"></stop><stop offset="100%" stop-color="#43a047"></stop></lineargradient>
<lineargradient id="qfITM" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bbdefb"></stop><stop offset="100%" stop-color="#1e88e5"></stop></lineargradient>
<lineargradient id="qfITG" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffcdd2"></stop><stop offset="100%" stop-color="#e53935"></stop></lineargradient>
<filter height="112%" id="qfShadow" width="112%" x="-6%" y="-6%"><fedropshadow dx="1" dy="2" flood-opacity="0.18" stddeviation="2"></fedropshadow></filter>
<marker id="qfArrow" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"></path></marker>
</defs>
<rect fill="#fafafa" height="440" rx="8" width="840" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="420" y="26">Q-Former stage 1: one network, three losses, three attention masks</text>
<!-- frozen image features -->
<rect fill="url(#qfImg)" filter="url(#qfShadow)" height="120" rx="9" width="96" x="22" y="150"></rect>
<text fill="#fff" font-size="12" font-weight="600" text-anchor="middle" x="70" y="200">frozen</text>
<text fill="#fff" font-size="12" font-weight="600" text-anchor="middle" x="70" y="217">image</text>
<text fill="#fff" font-size="12" font-weight="600" text-anchor="middle" x="70" y="234">features</text>
<text fill="#888" font-size="10" text-anchor="middle" x="70" y="288">ViT, no grad</text>
<!-- learnable queries -->
<rect fill="url(#qfQ)" filter="url(#qfShadow)" height="70" rx="9" width="104" x="150" y="120"></rect>
<text fill="#fff" font-size="12" font-weight="600" text-anchor="middle" x="202" y="150">32 learnable</text>
<text fill="#fff" font-size="12" font-weight="600" text-anchor="middle" x="202" y="167">queries Q</text>
<text fill="#f3e5f5" font-size="10" text-anchor="middle" x="202" y="183">∈ ℝ³²ᵖᵈ</text>
<!-- text input -->
<rect fill="#eceff1" height="56" rx="9" stroke="#b0bec5" stroke-width="1.2" width="104" x="150" y="232"></rect>
<text fill="#455a64" font-size="12" font-weight="600" text-anchor="middle" x="202" y="256">caption text</text>
<text fill="#78909c" font-size="11" text-anchor="middle" x="202" y="273">T</text>
<!-- cross-attention arrow image -> queries -->
<line marker-end="url(#qfArrow)" stroke="#039be5" stroke-width="2.2" x1="118" x2="150" y1="180" y2="160"></line>
<text fill="#0277bd" font-size="9" text-anchor="middle" x="134" y="135">cross-attn</text>
<!-- shared transformer -->
<rect fill="url(#qfShared)" filter="url(#qfShadow)" height="168" rx="10" width="96" x="288" y="120"></rect>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="336" y="196">shared</text>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="336" y="213">Q-Former</text>
<text fill="#fff3e0" font-size="10" text-anchor="middle" x="336" y="230">188M params</text>
<line marker-end="url(#qfArrow)" stroke="#777" stroke-width="2" x1="254" x2="288" y1="155" y2="170"></line>
<line marker-end="url(#qfArrow)" stroke="#777" stroke-width="2" x1="254" x2="288" y1="260" y2="235"></line>
<!-- three heads -->
<g>
<!-- ITC -->
<rect fill="url(#qfITC)" filter="url(#qfShadow)" height="92" rx="9" width="330" x="440" y="64"></rect>
<text fill="#fff" font-size="13" font-weight="700" x="455" y="92">ITC contrastive</text>
<text fill="#e8f5e9" font-size="11" x="455" y="112">mask: Q ∥ T separate streams (no peeking)</text>
<text fill="#e8f5e9" font-size="11" x="455" y="130">InfoNCE pulls matched pairs, pushes others</text>
<text fill="#c8e6c9" font-size="10.5" x="455" y="148">global alignment signal → ℒᵒᵗᴼ</text>
<!-- ITM -->
<rect fill="url(#qfITM)" filter="url(#qfShadow)" height="92" rx="9" width="330" x="440" y="166"></rect>
<text fill="#fff" font-size="13" font-weight="700" x="455" y="194">ITM matching</text>
<text fill="#e3f2fd" font-size="11" x="455" y="214">mask: Q + T fully bidirectional (joined)</text>
<text fill="#e3f2fd" font-size="11" x="455" y="232">binary classifier + hard-negative mining</text>
<text fill="#bbdefb" font-size="10.5" x="455" y="250">match vs. mismatch → ℒᵒᵗᵐ</text>
<!-- ITG -->
<rect fill="url(#qfITG)" filter="url(#qfShadow)" height="92" rx="9" width="330" x="440" y="268"></rect>
<text fill="#fff" font-size="13" font-weight="700" x="455" y="296">ITG generation</text>
<text fill="#ffebee" font-size="11" x="455" y="316">mask: Q bidirectional, T causal (attends Q)</text>
<text fill="#ffebee" font-size="11" x="455" y="334">left-to-right LM loss on the caption</text>
<text fill="#ffcdd2" font-size="10.5" x="455" y="352">generate caption → ℒᵒᵗᴼₙ</text>
</g>
<!-- arrows from shared to heads -->
<g fill="none" stroke="#777" stroke-width="1.8">
<path d="M384,160 C410,160 414,110 440,110" marker-end="url(#qfArrow)"></path>
<path d="M384,204 L440,210" marker-end="url(#qfArrow)"></path>
<path d="M384,248 C410,248 414,310 440,314" marker-end="url(#qfArrow)"></path>
</g>
<!-- combined objective -->
<rect fill="#ede7f6" height="34" rx="8" stroke="#b39ddb" stroke-width="1" width="304" x="248" y="392"></rect>
<text fill="#5e35b1" font-size="13" font-weight="600" text-anchor="middle" x="400" y="414">ℒᵒ-ᵔᵒᴸᵖᵉᴸ = ℒᵒᵗᴼ + ℒᵒᵗᵐ + ℒᵒᵗᴼₙ   (equal weights)</text>
</svg>