<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Four architectures attacking the same Pareto frontier" aria-labelledby="fig36title" role="img" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;" viewbox="0 0 760 420" xmlns="http://www.w3.org/2000/svg">
<title id="fig36title">Four architectures attacking the same Pareto frontier</title>
<text fill="#222" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" x="380" y="24">Beyond dense attention: four post-Transformer strategies</text>
<g font-family="Georgia, serif" font-size="11">
<rect fill="#e8f1fb" height="170" rx="8" stroke="#1f77b4" stroke-width="2" width="170" x="20" y="60"></rect>
<text fill="#1f77b4" font-size="13" font-weight="bold" text-anchor="middle" x="105" y="84">Mamba / S4</text>
<text fill="#666" text-anchor="middle" x="105" y="100">State Space Models</text>
<text fill="#444" text-anchor="middle" x="105" y="124">h<tspan baseline-shift="sub" font-size="9">t</tspan> = Āh<tspan baseline-shift="sub" font-size="9">t−1</tspan> + B̄u<tspan baseline-shift="sub" font-size="9">t</tspan></text>
<text fill="#2ca02c" font-weight="bold" text-anchor="middle" x="105" y="148">O(T) compute</text>
<text fill="#2ca02c" text-anchor="middle" x="105" y="164">O(1) memory</text>
<text fill="#444" font-style="italic" text-anchor="middle" x="105" y="188">linear recurrence</text>
<text fill="#444" font-style="italic" text-anchor="middle" x="105" y="204">HiPPO init</text>
<text fill="#444" font-style="italic" text-anchor="middle" x="105" y="220">parallel scan</text>
<rect fill="#e9f7e9" height="170" rx="8" stroke="#2ca02c" stroke-width="2" width="170" x="210" y="60"></rect>
<text fill="#2ca02c" font-size="13" font-weight="bold" text-anchor="middle" x="295" y="84">RWKV</text>
<text fill="#666" text-anchor="middle" x="295" y="100">RNN ↔ Transformer</text>
<text fill="#444" text-anchor="middle" x="295" y="124">parallel train,</text>
<text fill="#444" text-anchor="middle" x="295" y="140">recurrent inference</text>
<text fill="#2ca02c" font-weight="bold" text-anchor="middle" x="295" y="164">O(T) compute</text>
<text fill="#2ca02c" text-anchor="middle" x="295" y="180">O(1) memory</text>
<text fill="#444" font-style="italic" text-anchor="middle" x="295" y="204">no KV cache</text>
<text fill="#444" font-style="italic" text-anchor="middle" x="295" y="220">time-mixing + WKV</text>
<rect fill="#fff5d9" height="170" rx="8" stroke="#cc8400" stroke-width="2" width="170" x="400" y="60"></rect>
<text fill="#cc8400" font-size="13" font-weight="bold" text-anchor="middle" x="485" y="84">Mixture-of-Experts</text>
<text fill="#666" text-anchor="middle" x="485" y="100">Mixtral, DeepSeek-MoE</text>
<text fill="#444" text-anchor="middle" x="485" y="124">router → top-k</text>
<text fill="#444" text-anchor="middle" x="485" y="140">FFN experts</text>
<text fill="#cc8400" font-weight="bold" text-anchor="middle" x="485" y="164">O(T²) attention</text>
<text fill="#cc8400" text-anchor="middle" x="485" y="180">sparse FFN: 13B/47B</text>
<text fill="#444" font-style="italic" text-anchor="middle" x="485" y="204">8 experts, top-2</text>
<text fill="#444" font-style="italic" text-anchor="middle" x="485" y="220">load-balancing loss</text>
<rect fill="#fde9e9" height="170" rx="8" stroke="#d62728" stroke-width="2" width="160" x="590" y="60"></rect>
<text fill="#d62728" font-size="13" font-weight="bold" text-anchor="middle" x="670" y="84">MLA</text>
<text fill="#666" text-anchor="middle" x="670" y="100">DeepSeek-V3</text>
<text fill="#444" text-anchor="middle" x="670" y="124">compress KV to</text>
<text fill="#444" text-anchor="middle" x="670" y="140">low-rank latent</text>
<text fill="#d62728" font-weight="bold" text-anchor="middle" x="670" y="164">O(T²) compute</text>
<text fill="#d62728" text-anchor="middle" x="670" y="180">~5x smaller cache</text>
<text fill="#444" font-style="italic" text-anchor="middle" x="670" y="204">keeps attention</text>
<text fill="#444" font-style="italic" text-anchor="middle" x="670" y="220">shrinks memory</text>
<text fill="#222" font-family="Georgia, serif" font-size="13" font-weight="bold" x="20" y="270">Strategy:</text>
<text fill="#1f77b4" font-family="Georgia, serif" font-size="12" x="20" y="290"><tspan font-weight="bold">Mamba / RWKV:</tspan> replace softmax attention with a linear recurrence</text>
<text fill="#cc8400" font-family="Georgia, serif" font-size="12" x="20" y="312"><tspan font-weight="bold">MoE:</tspan> keep attention, sparsify the FFN — activate only 2 of N experts</text>
<text fill="#d62728" font-family="Georgia, serif" font-size="12" x="20" y="334"><tspan font-weight="bold">MLA:</tspan> keep attention, compress the KV cache to a small latent</text>
<text fill="#444" font-family="Georgia, serif" font-size="12" x="20" y="368"><tspan font-weight="bold">Pareto axes:</tspan> training compute · inference latency · KV memory · quality at 1T tokens</text>
<text fill="#666" font-family="Georgia, serif" font-size="11" font-style="italic" x="20" y="392">All four win along a different axis; production stacks now mix them (DeepSeek = MoE + MLA, Jamba = SSM + attention).</text>
</g>
</svg>