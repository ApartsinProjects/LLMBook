<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Direct prompting versus chain-of-thought: direct returns 437 (incorrect) in a single step; CoT decomposes 17 x 23 + 45 into Step 1 (17 x 23 = 391) and Step 2 (391 + 45 = 436) before answering correctly." font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 740 320" xmlns="http://www.w3.org/2000/svg">
<!-- Direct path -->
<text fill="#e94560" font-size="13" font-weight="700" text-anchor="middle" x="180" y="55">Direct Prompting</text>
<rect fill="#fde8e8" filter="url(#shadow_9958ec)" height="45" rx="8" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="260" x="50" y="65"></rect>
<text fill="#333" font-size="12" text-anchor="middle" x="180" y="93">Question: "What is 17 x 23 + 45?"</text>
<line marker-end="url(#arrowR)" stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="180" x2="180" y1="110" y2="140"></line>
<rect fill="#fde8e8" height="45" rx="8" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="260" x="50" y="140"></rect>
<text fill="#333" font-size="12" text-anchor="middle" x="180" y="163">Answer: "437"</text>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="180" y="178">INCORRECT (correct answer is 436)</text>
<!-- CoT path -->
<text fill="#27ae60" font-size="13" font-weight="700" text-anchor="middle" x="550" y="55">Chain-of-Thought</text>
<rect fill="#e8f5e9" height="45" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="280" x="410" y="65"></rect>
<text fill="#333" font-size="12" text-anchor="middle" x="550" y="93">Question: "What is 17 x 23 + 45?"</text>
<line marker-end="url(#arrowG)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="550" x2="550" y1="110" y2="130"></line>
<rect fill="#e8f5e9" height="35" rx="6" stroke="#27ae60" stroke-dasharray="4" stroke-linecap="round" stroke-width="1.5" width="280" x="410" y="130"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="550" y="152">Step 1: 17 x 23 = 391</text>
<line marker-end="url(#arrowG)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="550" x2="550" y1="165" y2="180"></line>
<rect fill="#e8f5e9" height="35" rx="6" stroke="#27ae60" stroke-dasharray="4" stroke-linecap="round" stroke-width="1.5" width="280" x="410" y="180"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="550" y="202">Step 2: 391 + 45 = 436</text>
<line marker-end="url(#arrowG)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="550" x2="550" y1="215" y2="235"></line>
<rect fill="#e8f5e9" height="45" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="280" x="410" y="235"></rect>
<text fill="#333" font-size="12" text-anchor="middle" x="550" y="258">Answer: 436</text>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="550" y="273">CORRECT</text>
<defs><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow_9958ec" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowR" markerheight="6" markerwidth="6" orient="auto" refx="5" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"></path></marker>
<marker id="arrowG" markerheight="6" markerwidth="6" orient="auto" refx="5" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"></path></marker>
</defs>
</svg>