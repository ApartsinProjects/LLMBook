<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three reasoning agent architecture patterns side by side: Think-then-Act uses one reasoning call to plan and execute, Planner plus Executor uses a reasoning model for planning and a fast model for execution, and Adaptive Depth escalates from shallow to deep reasoning only when initial attempts fail" role="img" style="max-width:100%;height:auto;" viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="rp263shadow" x="-4%" y="-4%" width="108%" height="108%">
<feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.18"/>
</filter>
<marker id="rp263arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#4a5568"/>
</marker>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Three reasoning-agent architecture patterns</text>
<g transform="translate(20, 50)">
<rect x="0" y="0" width="220" height="200" rx="8" fill="#fff8e1" stroke="#d97706" stroke-width="1.5" filter="url(#rp263shadow)"/>
<rect x="0" y="0" width="220" height="24" rx="8" fill="#d97706"/>
<text x="110" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Think-then-Act</text>
<text x="110" y="42" text-anchor="middle" font-size="10" fill="#5a4a3a">One call, two outputs</text>
<rect x="40" y="58" width="140" height="48" rx="6" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
<text x="110" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Reasoning Model</text>
<text x="110" y="96" text-anchor="middle" font-size="9" fill="#5a4a3a">plan + first action</text>
<line x1="110" y1="108" x2="110" y2="128" stroke="#4a5568" stroke-width="1.5" marker-end="url(#rp263arrow)"/>
<rect x="40" y="132" width="140" height="48" rx="6" fill="#e8f5e9" stroke="#047857" stroke-width="1.2"/>
<text x="110" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Action / Tool</text>
<text x="110" y="170" text-anchor="middle" font-size="9" fill="#3d4f3d">execute now</text>
<text x="110" y="194" text-anchor="middle" font-size="9" font-style="italic" fill="#5a4a3a">Best for: 1-step tasks</text>
</g>
<g transform="translate(270, 50)">
<rect x="0" y="0" width="220" height="200" rx="8" fill="#e3f2fd" stroke="#3a73a8" stroke-width="1.5" filter="url(#rp263shadow)"/>
<rect x="0" y="0" width="220" height="24" rx="8" fill="#3a73a8"/>
<text x="110" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Planner + Executor</text>
<text x="110" y="42" text-anchor="middle" font-size="10" fill="#1a4078">Slow plans, fast actions</text>
<rect x="40" y="58" width="140" height="36" rx="6" fill="#fff" stroke="#3a73a8" stroke-width="1.5"/>
<text x="110" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Reasoning Planner</text>
<text x="110" y="88" text-anchor="middle" font-size="9" fill="#1a4078">o3 / extended thinking</text>
<line x1="110" y1="96" x2="110" y2="114" stroke="#4a5568" stroke-width="1.5" marker-end="url(#rp263arrow)"/>
<rect x="40" y="118" width="140" height="36" rx="6" fill="#fff" stroke="#3a73a8" stroke-width="1.5"/>
<text x="110" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Fast Executor</text>
<text x="110" y="148" text-anchor="middle" font-size="9" fill="#1a4078">Haiku / 4o-mini, loop</text>
<line x1="110" y1="156" x2="110" y2="174" stroke="#4a5568" stroke-width="1.5" marker-end="url(#rp263arrow)"/>
<rect x="40" y="178" width="140" height="14" rx="3" fill="#e8f5e9" stroke="#047857"/>
<text x="110" y="189" text-anchor="middle" font-size="9" fill="#1a1a2e">Tool execution</text>
</g>
<g transform="translate(520, 50)">
<rect x="0" y="0" width="220" height="200" rx="8" fill="#fce4ec" stroke="#b91c1c" stroke-width="1.5" filter="url(#rp263shadow)"/>
<rect x="0" y="0" width="220" height="24" rx="8" fill="#b91c1c"/>
<text x="110" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Adaptive Depth</text>
<text x="110" y="42" text-anchor="middle" font-size="10" fill="#5a2828">Escalate on failure</text>
<rect x="40" y="56" width="140" height="28" rx="4" fill="#fff" stroke="#b91c1c"/>
<text x="110" y="74" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a2e">Shallow attempt</text>
<line x1="110" y1="86" x2="110" y2="100" stroke="#4a5568" stroke-width="1.2" marker-end="url(#rp263arrow)"/>
<polygon points="60,102 160,102 110,128" fill="#fff3e0" stroke="#d97706" stroke-width="1.2"/>
<text x="110" y="118" text-anchor="middle" font-size="9" fill="#1a1a2e">Confident?</text>
<text x="40" y="146" font-size="9" fill="#047857" font-weight="700">YES</text>
<text x="170" y="146" font-size="9" fill="#b91c1c" font-weight="700" text-anchor="end">NO</text>
<line x1="80" y1="128" x2="50" y2="146" stroke="#047857" stroke-width="1.2"/>
<line x1="140" y1="128" x2="170" y2="146" stroke="#b91c1c" stroke-width="1.2"/>
<rect x="10" y="150" width="80" height="38" rx="4" fill="#e8f5e9" stroke="#047857"/>
<text x="50" y="167" text-anchor="middle" font-size="9" fill="#1a1a2e">Return</text>
<text x="50" y="180" text-anchor="middle" font-size="9" fill="#1a1a2e">answer</text>
<rect x="130" y="150" width="80" height="38" rx="4" fill="#fff" stroke="#b91c1c"/>
<text x="170" y="167" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a2e">Re-run with</text>
<text x="170" y="180" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">deep reasoning</text>
<text x="110" y="195" text-anchor="middle" font-size="9" font-style="italic" fill="#5a2828">Best for: variable difficulty</text>
</g>
</g>
</svg>