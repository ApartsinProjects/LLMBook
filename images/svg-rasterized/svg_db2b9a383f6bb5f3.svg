<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Risk-routed approval flowchart: agent action enters a classify-risk node that branches into three paths. Low-risk actions auto-execute. Medium-risk actions execute but emit an audit log. High-risk actions pause, send a notification to a human reviewer through Slack, and resume only on approve, otherwise reject" role="img" style="max-width:100%;height:auto;" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="ra283shadow" x="-4%" y="-4%" width="108%" height="108%">
<feDropShadow dx="1" dy="2" stdDeviation="1.4" flood-opacity="0.16"/>
</filter>
<marker id="ra283arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#4a5568"/>
</marker>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Risk-routed approval flow</text>
<rect x="320" y="46" width="120" height="40" rx="8" fill="#e3f2fd" stroke="#3a73a8" stroke-width="1.5" filter="url(#ra283shadow)"/>
<text x="380" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Agent action</text>
<text x="380" y="78" text-anchor="middle" font-size="9" fill="#1a4078">proposed by LLM</text>
<line x1="380" y1="88" x2="380" y2="106" stroke="#4a5568" stroke-width="1.4" marker-end="url(#ra283arrow)"/>
<polygon points="320,110 440,110 440,150 380,170 320,150" fill="#fff8e1" stroke="#d97706" stroke-width="1.6" filter="url(#ra283shadow)"/>
<text x="380" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Classify risk</text>
<text x="380" y="142" text-anchor="middle" font-size="9" fill="#5a4a3a">low / medium / high</text>
<line x1="320" y1="138" x2="160" y2="200" stroke="#047857" stroke-width="1.4" marker-end="url(#ra283arrow)"/>
<text x="220" y="170" font-size="11" font-weight="700" fill="#047857">low</text>
<line x1="380" y1="172" x2="380" y2="200" stroke="#d97706" stroke-width="1.4" marker-end="url(#ra283arrow)"/>
<text x="395" y="190" font-size="11" font-weight="700" fill="#d97706">medium</text>
<line x1="440" y1="138" x2="600" y2="200" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#ra283arrow)"/>
<text x="540" y="170" font-size="11" font-weight="700" fill="#b91c1c">high</text>
<rect x="80" y="204" width="160" height="60" rx="8" fill="#e8f5e9" stroke="#047857" stroke-width="1.6" filter="url(#ra283shadow)"/>
<text x="160" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">auto_execute</text>
<text x="160" y="238" text-anchor="middle" font-size="9" fill="#3d4f3d">no human in loop</text>
<text x="160" y="252" text-anchor="middle" font-size="9" fill="#3d4f3d">e.g. read-only queries</text>
<rect x="300" y="204" width="160" height="60" rx="8" fill="#fff8e1" stroke="#d97706" stroke-width="1.6" filter="url(#ra283shadow)"/>
<text x="380" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">execute_and_log</text>
<text x="380" y="238" text-anchor="middle" font-size="9" fill="#5a4a3a">runs + emits audit log</text>
<text x="380" y="252" text-anchor="middle" font-size="9" fill="#5a4a3a">e.g. small refunds</text>
<rect x="520" y="204" width="160" height="60" rx="8" fill="#fce4ec" stroke="#b91c1c" stroke-width="1.6" filter="url(#ra283shadow)"/>
<text x="600" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">request_approval</text>
<text x="600" y="238" text-anchor="middle" font-size="9" fill="#5a2828">pauses; pings Slack</text>
<text x="600" y="252" text-anchor="middle" font-size="9" fill="#5a2828">e.g. account closures</text>
<line x1="600" y1="266" x2="600" y2="288" stroke="#4a5568" stroke-width="1.2" marker-end="url(#ra283arrow)"/>
<g transform="translate(530, 290)">
<rect x="0" y="0" width="65" height="22" rx="4" fill="#e8f5e9" stroke="#047857"/>
<text x="32" y="14" text-anchor="middle" font-size="10" fill="#047857" font-weight="700">approve</text>
<rect x="75" y="0" width="65" height="22" rx="4" fill="#fce4ec" stroke="#b91c1c"/>
<text x="108" y="14" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="700">reject</text>
</g>
</g>
</svg>