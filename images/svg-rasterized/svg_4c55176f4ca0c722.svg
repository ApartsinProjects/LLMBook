<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="TGI continuous batching timeline (3 concurrent requests)" style="font-family: sans-serif; max-width: 100%; height: auto;" viewbox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="220" width="720"></rect>
<text fill="#1a4078" font-size="13" font-weight="700" x="20" y="25">TGI continuous batching timeline (3 concurrent requests)</text>
<!-- legend -->
<rect fill="#1f7a3a" height="14" width="14" x="20" y="35"></rect><text font-size="11" x="40" y="47">prefill</text>
<rect fill="#4a7fc0" height="14" width="14" x="100" y="35"></rect><text font-size="11" x="120" y="47">decode step</text>
<rect fill="#dddddd" height="14" width="14" x="200" y="35"></rect><text font-size="11" x="220" y="47">idle</text>
<!-- request rows -->
<g font-size="11">
<text fill="#444" x="20" y="80">Req A</text>
<rect fill="#1f7a3a" height="18" width="60" x="70" y="68"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="130" y="68"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="150" y="68"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="170" y="68"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="190" y="68"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="210" y="68"></rect>
<text fill="#444" x="20" y="115">Req B</text>
<rect fill="#1f7a3a" height="18" width="40" x="130" y="103"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="170" y="103"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="190" y="103"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="210" y="103"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="230" y="103"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="250" y="103"></rect>
<text fill="#444" x="20" y="150">Req C</text>
<rect fill="#1f7a3a" height="18" width="80" x="190" y="138"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="270" y="138"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="290" y="138"></rect>
<rect fill="#4a7fc0" height="18" width="20" x="310" y="138"></rect>
</g>
<text fill="#444" font-size="11" x="20" y="190">Each blue tick is one batched decode step that advances every in-flight sequence by one token.</text>
<text fill="#444" font-size="11" x="20" y="205">New requests join the running batch at the next decode boundary instead of waiting for a fresh round.</text>
</svg>