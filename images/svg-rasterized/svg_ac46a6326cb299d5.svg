<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="VQ-VAE encoder maps input to a continuous latent z, the nearest codebook entry is chosen by argmin distance, the decoder reconstructs from the chosen codebook entry, and the straight-through estimator copies gradients from decoder back into the encoder" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 820 280" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="280" width="820"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="410" y="22">VQ-VAE: encoder + codebook lookup (argmin) + decoder, with straight-through gradients</text>
<defs>
<marker id="vqArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
<marker id="vqDash" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#c62828"></path></marker>
</defs>
<g font-size="10">
<rect fill="#bbdefb" height="60" rx="6" stroke="#1976d2" stroke-width="1.5" width="100" x="20" y="100"></rect>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="70" y="125">Input x</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="70" y="140">waveform / image</text>
<line marker-end="url(#vqArr)" stroke="#666" stroke-width="2" x1="120" x2="148" y1="130" y2="130"></line>
<rect fill="#c8e6c9" height="60" rx="6" stroke="#2e7d32" stroke-width="1.5" width="110" x="148" y="100"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="203" y="125">Encoder</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="203" y="140">conv stack</text>
<line marker-end="url(#vqArr)" stroke="#666" stroke-width="2" x1="258" x2="286" y1="130" y2="130"></line>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="272" y="120">z (continuous, R^d)</text>
<rect fill="#fff3e0" height="60" rx="6" stroke="#ef6c00" stroke-width="1.5" width="130" x="286" y="100"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="351" y="118">Codebook lookup</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="351" y="134">k* = argmin || z - c_k ||</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="351" y="148">e = c[k*]</text>
<line marker-end="url(#vqArr)" stroke="#666" stroke-width="2" x1="416" x2="444" y1="130" y2="130"></line>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="430" y="120">e (discrete)</text>
<rect fill="#e1bee7" height="60" rx="6" stroke="#6a1b9a" stroke-width="1.5" width="110" x="444" y="100"></rect>
<text fill="#4a148c" font-weight="700" text-anchor="middle" x="499" y="125">Decoder</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="499" y="140">transposed conv</text>
<line marker-end="url(#vqArr)" stroke="#666" stroke-width="2" x1="554" x2="582" y1="130" y2="130"></line>
<rect fill="#ffcdd2" height="60" rx="6" stroke="#c62828" stroke-width="1.5" width="100" x="582" y="100"></rect>
<text fill="#b71c1c" font-weight="700" text-anchor="middle" x="632" y="125">x_hat</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="632" y="140">L2 reconstruction</text>
<rect fill="#fff9c4" height="60" rx="6" stroke="#f57f17" stroke-width="1.5" width="100" x="704" y="100"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="754" y="118">Codebook</text>
<text fill="#f57f17" font-size="9" text-anchor="middle" x="754" y="134">K entries in R^d</text>
<text fill="#f57f17" font-size="9" text-anchor="middle" x="754" y="148">EMA update</text>
<line stroke="#f57f17" stroke-dasharray="3,3" stroke-width="0.8" x1="704" x2="416" y1="130" y2="130"></line>
<text fill="#c62828" font-size="10" font-style="italic" text-anchor="middle" x="560" y="80">straight-through estimator: gradient skips the argmin</text>
<line marker-end="url(#vqDash)" stroke="#c62828" stroke-dasharray="6,3" stroke-width="1.5" x1="632" x2="203" y1="200" y2="200"></line>
<text fill="#c62828" font-size="10" text-anchor="middle" x="410" y="220">grad(x_hat / x) flows back through decoder, jumps over codebook, lands on encoder</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="410" y="240">Commitment loss: || sg(e) - z ||^2 + beta || e - sg(z) ||^2 keeps z and codebook in sync</text>
</g>
</svg>