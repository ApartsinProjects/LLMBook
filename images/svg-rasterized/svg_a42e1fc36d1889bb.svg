<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Decision tree for picking a RAG framework: pipeline complexity branches to build-from-scratch (simple) or to a needs question (complex); primary need then routes to LangChain (rapid prototyping), LlamaIndex (data-centric retrieval), or Haystack (production stability)." role="img" viewBox="0 -7 830 427" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_f8c660_fafafa" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#fafafa"></stop></lineargradient>
<filter height="115%" id="shadow_f8c660" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrDT_green" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"></path></marker>
<marker id="arrDT_red" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"></path></marker>
<marker id="arrDT_blue" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3498db"></path></marker>
<marker id="arrDT_purple" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8e44ad"></path></marker>
<marker id="arrDT_amber" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f39c12"></path></marker>
</defs>
<rect fill="url(#grad_f8c660_fafafa)" filter="url(#shadow_f8c660)" height="420" rx="10" width="760" x="0" y="0"></rect>
<!-- Start node -->
<rect fill="#1a1a2e" height="40" rx="20" width="200" x="280" y="45"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="380" y="70">How complex is your pipeline?</text>
<!-- Branch: Simple -->
<line marker-end="url(#arrDT_green)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="330" x2="165" y1="85" y2="118"></line>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" x="220" y="100">Simple</text>
<rect fill="#27ae60" height="35" rx="8" width="200" x="60" y="120"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="160" y="142">Build from scratch</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="160" y="172">Embed + Retrieve + Generate</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="160" y="186">Direct API calls, minimal deps</text>
<!-- Branch: Complex -->
<line marker-end="url(#arrDT_red)" stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="430" x2="578" y1="85" y2="118"></line>
<text fill="#e94560" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" x="520" y="100">Complex</text>
<rect fill="#e94560" height="35" rx="8" width="220" x="480" y="120"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="590" y="142">What is your primary need?</text>
<!-- Sub-branches -->
<line marker-end="url(#arrDT_blue)" stroke="#3498db" stroke-linecap="round" stroke-width="1.5" x1="530" x2="135" y1="155" y2="220"></line>
<text fill="#3498db" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="300" y="188">Rapid prototyping</text>
<line marker-end="url(#arrDT_purple)" stroke="#8e44ad" stroke-linecap="round" stroke-width="1.5" x1="590" x2="402" y1="155" y2="220"></line>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="510" y="188">Data-centric retrieval</text>
<line marker-end="url(#arrDT_amber)" stroke="#f39c12" stroke-linecap="round" stroke-width="1.5" x1="650" x2="650" y1="155" y2="220"></line>
<text fill="#f39c12" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="680" y="195">Production stability</text>
<!-- Recommendation boxes -->
<rect fill="#3498db" height="70" opacity="0.9" rx="8" width="180" x="40" y="225"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="130" y="250">LangChain</text>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="130" y="268">Most integrations</text>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="130" y="283">Fastest to prototype</text>
<rect fill="#8e44ad" height="70" opacity="0.9" rx="8" width="180" x="300" y="225"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="390" y="250">LlamaIndex</text>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="390" y="268">Best index variety</text>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="390" y="283">Smart query routing</text>
<rect fill="#f39c12" height="70" opacity="0.9" rx="8" width="180" x="560" y="225"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="650" y="250">Haystack</text>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="650" y="268">Type-safe pipelines</text>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="650" y="283">Serializable, auditable</text>
<!-- Bottom note -->
<rect fill="#f8f8f8" height="70" rx="8" stroke="#ddd" stroke-linecap="round" width="560" x="100" y="330"></rect>
<text fill="#1a1a2e" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="380" y="355">Pro Tip: Start with a framework, then extract</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="380" y="375">Use a framework to prototype and evaluate. Once your pipeline is stable,</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="380" y="391">replace framework wiring with direct API calls if latency or control matters.</text>
</svg>