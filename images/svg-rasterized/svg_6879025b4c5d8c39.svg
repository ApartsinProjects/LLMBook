<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Data flow from LLM app to OTel collector, fanning out to Grafana metrics, Tempo traces, and PagerDuty alerts" role="img" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
