<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="LLM-as-Judge evaluation pipeline: test question and model answer feed into a judge prompt with criteria and rubric; the judge LLM produces a structured evaluation with score, reasoning, and strengths or gaps." role="img" style="font-family: sans-serif;" viewbox="0 0 750 260" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad3" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow2" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
<marker id="arrowhead1" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#666" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<!-- Input boxes -->
<rect fill="#e8f4fd" filter="url(#shadow2)" height="65" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="1.5" width="130" x="20" y="30"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="85" y="55">Test Question</text>
<text fill="#555" font-size="11" text-anchor="middle" x="85" y="75">+ Context</text>
<rect fill="#f0e6ff" filter="url(#shadow2)" height="65" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="1.5" width="130" x="20" y="120"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="85" y="145">Model Answer</text>
<text fill="#555" font-size="11" text-anchor="middle" x="85" y="165">+ Reference (opt.)</text>
<line marker-end="url(#arrowhead1)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="150" x2="210" y1="62" y2="110"></line>
<line marker-end="url(#arrowhead1)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="150" x2="210" y1="152" y2="130"></line>
<!-- Judge prompt assembly -->
<rect fill="#fef9e7" filter="url(#shadow2)" height="55" rx="8" stroke="#f39c12" stroke-linecap="round" stroke-width="1.5" width="150" x="210" y="85"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="285" y="108">Judge Prompt</text>
<text fill="#555" font-size="11" text-anchor="middle" x="285" y="125">Criteria + Rubric</text>
<line marker-end="url(#arrowhead1)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="360" x2="420" y1="112" y2="112"></line>
<!-- Judge model -->
<rect fill="#1a1a2e" filter="url(#shadow2)" height="65" rx="10" width="140" x="420" y="80"></rect>
<text fill="white" font-size="12" font-weight="700" text-anchor="middle" x="490" y="105">Judge LLM</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="490" y="125">(GPT-4o, Claude)</text>
<line marker-end="url(#arrowhead1)" stroke="#666" stroke-linecap="round" stroke-width="1.5" x1="560" x2="620" y1="112" y2="112"></line>
<!-- Output -->
<rect fill="#e8f5e9" filter="url(#shadow2)" height="85" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" width="115" x="620" y="70"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="677" y="95">Evaluation</text>
<text fill="#555" font-size="11" text-anchor="middle" x="677" y="115">Score: 4/5</text>
<text fill="#555" font-size="11" text-anchor="middle" x="677" y="132">Reasoning</text>
<text fill="#555" font-size="11" text-anchor="middle" x="677" y="147">Strengths/Gaps</text>
<!-- Labels -->
<text fill="#888" font-size="11" font-style="italic" text-anchor="middle" x="375" y="225">Structured output enables automated scoring at scale</text>
</svg>