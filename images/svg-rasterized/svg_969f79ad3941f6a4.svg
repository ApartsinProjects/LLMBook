<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="KV cache: store every past K, V so each new token costs O(1) per layer, not O(t)" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 760 280" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="280" width="760"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="380" y="22">KV cache: store every past K, V so each new token costs O(1) per layer, not O(t)</text>
<g transform="translate(20,50)">
<rect fill="#fff3e0" height="80" rx="8" stroke="#a67c1a" stroke-width="2" width="720"></rect>
<text fill="#a67c1a" font-size="11" font-weight="700" text-anchor="middle" x="360" y="22">Without KV cache: O(t²) recomputation</text>
<g font-size="10" text-anchor="middle">
<rect fill="#ffe0b2" height="28" rx="4" stroke="#a67c1a" width="80" x="20" y="36"></rect><text fill="#1a1a2e" x="60" y="54">step 1: K,V for t=1</text>
<rect fill="#ffe0b2" height="28" rx="4" stroke="#a67c1a" width="120" x="110" y="36"></rect><text fill="#1a1a2e" x="170" y="54">step 2: K,V for t=1..2</text>
<rect fill="#ffe0b2" height="28" rx="4" stroke="#a67c1a" width="160" x="240" y="36"></rect><text fill="#1a1a2e" x="320" y="54">step 3: K,V for t=1..3</text>
<rect fill="#ffe0b2" height="28" rx="4" stroke="#a67c1a" width="200" x="410" y="36"></rect><text fill="#1a1a2e" x="510" y="54">step 4: K,V for t=1..4</text>
<text fill="#a67c1a" font-size="9" x="660" y="54">… quadratic growth</text>
</g>
</g>
<g transform="translate(20,150)">
<rect fill="#e3e8f5" height="110" rx="8" stroke="#3d4d8a" stroke-width="2" width="720"></rect>
<text fill="#3d4d8a" font-size="11" font-weight="700" text-anchor="middle" x="360" y="22">With KV cache: prefill once (O(n)), then O(1) per generated token</text>
<g font-size="10" text-anchor="middle">
<text fill="#3d4d8a" font-weight="700" x="60" y="44">PREFILL</text>
<rect fill="#bbdefb" height="28" rx="4" stroke="#3d4d8a" width="200" x="20" y="50"></rect>
<text fill="#1a1a2e" x="120" y="68">compute K, V for prompt (n tokens)</text>
<text fill="#5a4a3a" font-size="9" x="120" y="92">one big GEMM, parallel over n</text>
<text fill="#3d4d8a" font-weight="700" x="380" y="44">DECODE (loop)</text>
<rect fill="#fff" height="28" rx="4" stroke="#3d4d8a" width="120" x="250" y="50"></rect><text fill="#1a1a2e" x="310" y="68">read cache</text>
<text fill="#555" x="385" y="68">→</text>
<rect fill="#fff" height="28" rx="4" stroke="#3d4d8a" width="160" x="400" y="50"></rect><text fill="#1a1a2e" x="480" y="68">attend with new Q only</text>
<text fill="#555" x="575" y="68">→</text>
<rect fill="#fff" height="28" rx="4" stroke="#3d4d8a" width="120" x="585" y="50"></rect><text fill="#1a1a2e" x="645" y="68">append new K,V</text>
<text fill="#5a4a3a" font-size="9" x="480" y="92">each step: 1 token in, 1 token out; cache grows by 1</text>
</g>
</g>
</svg>