<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Model card schema evolution from Mitchell 2019 to EU AI Act Annex IV" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="460" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">Model card schema growth: 2019 → 2024 → 2026</text>
<!-- column 1: Mitchell 2019 -->
<g transform="translate(40,60)">
<rect fill="#eef4fa" height="360" rx="6" stroke="#1a4078" stroke-width="2" width="240" y="8"></rect>
<text fill="#1a4078" font-size="13" font-weight="700" text-anchor="middle" x="120" y="22">Mitchell et al. 2019</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="120" y="38">FAccT 2019 / arXiv:1810.03993</text>
<g fill="#1a1a2e" font-size="10">
<text x="14" y="62">1. Model Details</text>
<text x="14" y="82">2. Intended Use</text>
<text x="14" y="102">3. Training Data</text>
<text x="14" y="122">4. Training Procedure</text>
<text x="14" y="142">5. Factors</text>
<text x="14" y="162">6. Metrics</text>
<text x="14" y="182">7. Evaluation Data</text>
<text x="14" y="202">8. Quantitative Analyses</text>
<text x="14" y="222">9. Ethical Considerations</text>
<text x="14" y="242">10. Caveats &amp; Recommendations</text>
<text x="14" y="262">11. Citation</text>
</g>
<text fill="#1a4078" font-size="11" font-weight="700" text-anchor="middle" x="120" y="310">11 sections</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="120" y="328">Research artifact</text>
</g>
<!-- column 2: NIST 2024 add -->
<g transform="translate(320,60)">
<rect fill="#ecf6ee" height="360" rx="6" stroke="#1f7a3a" stroke-width="2" width="240" y="8"></rect>
<text fill="#1f7a3a" font-size="13" font-weight="700" text-anchor="middle" x="120" y="22">+ NIST AI 600-1 (2024)</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="120" y="38">GenAI Profile additions</text>
<g fill="#1a1a2e" font-size="10">
<text x="14" y="64">all 11 above</text>
<text fill="#1f7a3a" font-weight="700" x="14" y="82">+ 12. Intended vs Out-of-Scope</text>
<text fill="#5a4a3a" font-size="9" x="14" y="100">    explicit do-not-deploy list</text>
<text fill="#1f7a3a" font-weight="700" x="14" y="124">+ 13. Environmental Impact</text>
<text fill="#5a4a3a" font-size="9" x="14" y="142">    tCO₂e per training run</text>
</g>
<text fill="#1f7a3a" font-size="11" font-weight="700" text-anchor="middle" x="120" y="310">13 sections</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="120" y="328">US compliance baseline</text>
</g>
<!-- column 3: EU AI Act Annex IV -->
<g transform="translate(600,60)">
<rect fill="#f8e3e3" height="360" rx="6" stroke="#7a2a2a" stroke-width="2" width="240" y="8"></rect>
<text fill="#7a2a2a" font-size="13" font-weight="700" text-anchor="middle" x="120" y="22">+ EU AI Act Annex IV (2026)</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="120" y="38">For GPAI w/ systemic risk</text>
<g fill="#1a1a2e" font-size="10">
<text x="14" y="64">all 13 above</text>
<text fill="#7a2a2a" font-weight="700" x="14" y="82">+ 14. Safety Mitigations</text>
<text fill="#5a4a3a" font-size="9" x="14" y="100">    red-team, CBRN, JailbreakBench</text>
<text fill="#7a2a2a" font-weight="700" x="14" y="124">+ 15. Conformity Assessment</text>
<text fill="#5a4a3a" font-size="9" x="14" y="142">    Art. 11 audit sign-off</text>
<text fill="#7a2a2a" font-weight="700" x="14" y="166">+ 16. Post-Market Monitoring</text>
<text fill="#5a4a3a" font-size="9" x="14" y="184">    15-day incident reporting (Art. 72)</text>
</g>
<text fill="#7a2a2a" font-size="11" font-weight="700" text-anchor="middle" x="120" y="310">16 sections</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="120" y="328">EU procurement gate</text>
</g>
<!-- arrows -->
<path d="M 282 240 L 318 240" marker-end="url(#arr541)" stroke="#1a1a2e" stroke-width="2.5"></path>
<path d="M 562 240 L 598 240" marker-end="url(#arr541)" stroke="#1a1a2e" stroke-width="2.5"></path>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="300" y="232">+2</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="580" y="232">+3</text>
<defs><marker id="arr541" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="4"><polygon fill="#1a1a2e" points="0 0, 8 4, 0 8"></polygon></marker></defs>
</svg>