<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Reference architecture for a production agent system. User input flows through the Permissions Gate, Cost Controller, Memory Manager, Planner, Tool Router, Execution Sandbox, Evaluator, and Recovery Handler before a response is returned. Dashed arrows indicate evaluator-driven fallbacks (replan or retry tool)." role="img" style="max-width: 100%; height: auto; font-family: sans-serif;" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrNavy" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#3498db"></path>
</marker>
<marker id="arrGold" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#f39c12"></path>
</marker>
</defs>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="360" y="42">Forward flow (solid); evaluator fallbacks (dashed)</text>
<g><rect fill="#fdeee8" height="56" rx="6" stroke="#c0392b" stroke-width="2" width="120" x="20" y="70"></rect><text fill="#c0392b" font-size="11" font-weight="700" text-anchor="middle" x="80" y="92">1. Permissions</text><text fill="#c0392b" font-size="11" font-weight="700" text-anchor="middle" x="80" y="106">Gate</text></g>
<g><rect fill="#e8f4fd" height="56" rx="6" stroke="#3498db" stroke-width="2" width="120" x="160" y="70"></rect><text fill="#3498db" font-size="11" font-weight="700" text-anchor="middle" x="220" y="92">2. Cost</text><text fill="#3498db" font-size="11" font-weight="700" text-anchor="middle" x="220" y="106">Controller</text></g>
<g><rect fill="#e8f4fd" height="56" rx="6" stroke="#3498db" stroke-width="2" width="120" x="300" y="70"></rect><text fill="#3498db" font-size="11" font-weight="700" text-anchor="middle" x="360" y="92">3. Memory</text><text fill="#3498db" font-size="11" font-weight="700" text-anchor="middle" x="360" y="106">Manager</text></g>
<g><rect fill="#e8f4fd" height="56" rx="6" stroke="#3498db" stroke-width="2" width="120" x="440" y="70"></rect><text fill="#3498db" font-size="11" font-weight="700" text-anchor="middle" x="500" y="92">4. Planner</text></g>
<g><rect fill="#e8f4fd" height="56" rx="6" stroke="#3498db" stroke-width="2" width="120" x="580" y="70"></rect><text fill="#3498db" font-size="11" font-weight="700" text-anchor="middle" x="640" y="92">5. Tool</text><text fill="#3498db" font-size="11" font-weight="700" text-anchor="middle" x="640" y="106">Router</text></g>
<line marker-end="url(#arrNavy)" stroke="#3498db" stroke-width="2" x1="140" x2="158" y1="98" y2="98"></line>
<line marker-end="url(#arrNavy)" stroke="#3498db" stroke-width="2" x1="280" x2="298" y1="98" y2="98"></line>
<line marker-end="url(#arrNavy)" stroke="#3498db" stroke-width="2" x1="420" x2="438" y1="98" y2="98"></line>
<line marker-end="url(#arrNavy)" stroke="#3498db" stroke-width="2" x1="560" x2="578" y1="98" y2="98"></line>
<path d="M 700 126 L 700 170 L 640 170 L 640 218" fill="none" marker-end="url(#arrNavy)" stroke="#3498db" stroke-width="2"></path>
<g><rect fill="#e8f4fd" height="56" rx="6" stroke="#3498db" stroke-width="2" width="120" x="580" y="220"></rect><text fill="#3498db" font-size="11" font-weight="700" text-anchor="middle" x="640" y="242">6. Execution</text><text fill="#3498db" font-size="11" font-weight="700" text-anchor="middle" x="640" y="256">Sandbox</text></g>
<g><rect fill="#fff5dc" height="56" rx="6" stroke="#f39c12" stroke-width="2" width="120" x="440" y="220"></rect><text fill="#a67c1a" font-size="11" font-weight="700" text-anchor="middle" x="500" y="242">7. Evaluator</text></g>
<g><rect fill="#fdeee8" height="56" rx="6" stroke="#c0392b" stroke-width="2" width="120" x="300" y="220"></rect><text fill="#c0392b" font-size="11" font-weight="700" text-anchor="middle" x="360" y="242">8. Recovery</text><text fill="#c0392b" font-size="11" font-weight="700" text-anchor="middle" x="360" y="256">Handler</text></g>
<g><rect fill="#e8f5e9" height="56" rx="6" stroke="#27ae60" stroke-width="2" width="120" x="160" y="220"></rect><text fill="#27ae60" font-size="11" font-weight="700" text-anchor="middle" x="220" y="242">9. Response</text></g>
<line marker-end="url(#arrNavy)" stroke="#3498db" stroke-width="2" x1="578" x2="560" y1="248" y2="248"></line>
<line marker-end="url(#arrNavy)" stroke="#3498db" stroke-width="2" x1="438" x2="420" y1="248" y2="248"></line>
<line marker-end="url(#arrNavy)" stroke="#3498db" stroke-width="2" x1="298" x2="280" y1="248" y2="248"></line>
<path d="M 480 220 C 480 180, 470 150, 480 126" fill="none" marker-end="url(#arrGold)" stroke="#f39c12" stroke-dasharray="6 4" stroke-width="1.5"></path>
<path d="M 520 220 C 560 200, 620 180, 640 130" fill="none" marker-end="url(#arrGold)" stroke="#f39c12" stroke-dasharray="6 4" stroke-width="1.5"></path>
<text fill="#a67c1a" font-size="9" font-style="italic" x="412" y="178">replan</text>
<text fill="#a67c1a" font-size="9" font-style="italic" x="568" y="178">retry tool</text>
</svg>