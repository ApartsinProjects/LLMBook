<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram showing a three-stage quality gate pipeline" role="img" style="font-family: sans-serif;" viewBox="0 -9 750 229" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter height="115%" id="shadow6qg" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<!-- Stage 1: Unit Eval -->
<rect fill="white" height="130" rx="10" stroke="#27ae60" stroke-width="2" width="160" x="20" y="40"></rect>
<rect fill="#27ae60" height="32" rx="10" width="160" x="20" y="40"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="100" y="61">Gate 1: Unit Eval</text>
<text fill="#333" font-size="11" x="35" y="92">Golden test cases</text>
<text fill="#333" font-size="11" x="35" y="112">Format compliance</text>
<text fill="#333" font-size="11" x="35" y="132">Safety checks</text>
<text fill="#27ae60" font-size="11" font-weight="600" x="35" y="155">Threshold: 95% pass</text>
<!-- Arrow 1 -->
<line marker-end="url(#arrowhead-qg)" stroke="#999" stroke-width="1.5" x1="185" x2="235" y1="105" y2="105"></line>
<defs><marker id="arrowhead-qg" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><polygon fill="#999" points="0 0, 8 3, 0 6"></polygon></marker></defs>
<!-- Stage 2: Regression Eval -->
<rect fill="white" height="130" rx="10" stroke="#f39c12" stroke-width="2" width="180" x="240" y="40"></rect>
<rect fill="#f39c12" height="32" rx="10" width="180" x="240" y="40"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="330" y="61">Gate 2: Regression Eval</text>
<text fill="#333" font-size="11" x="255" y="92">Compare vs. baseline</text>
<text fill="#333" font-size="11" x="255" y="112">Statistical significance</text>
<text fill="#333" font-size="11" x="255" y="132">No category regression</text>
<text fill="#f39c12" font-size="11" font-weight="600" x="255" y="155">Threshold: p &lt; 0.05</text>
<!-- Arrow 2 -->
<line marker-end="url(#arrowhead-qg)" stroke="#999" stroke-width="1.5" x1="425" x2="475" y1="105" y2="105"></line>
<!-- Stage 3: Canary Eval -->
<rect fill="white" height="130" rx="10" stroke="#8e44ad" stroke-width="2" width="180" x="480" y="40"></rect>
<rect fill="#8e44ad" height="32" rx="10" width="180" x="480" y="40"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="570" y="61">Gate 3: Canary Eval</text>
<text fill="#333" font-size="11" x="495" y="92">5% production traffic</text>
<text fill="#333" font-size="11" x="495" y="112">Live user metrics</text>
<text fill="#333" font-size="11" x="495" y="132">Latency and cost check</text>
<text fill="#8e44ad" font-size="11" font-weight="600" x="495" y="155">Threshold: no drop &gt; 3%</text>
<!-- Labels -->
<text fill="#888" font-size="11" text-anchor="middle" x="100" y="195">Pre-commit</text>
<text fill="#888" font-size="11" text-anchor="middle" x="330" y="195">Pre-deploy</text>
<text fill="#888" font-size="11" text-anchor="middle" x="570" y="195">Post-deploy</text>
</svg>