<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Multimodal conversational pipeline: voice, text, and image inputs converge into an input merger that feeds a multimodal LLM (GPT-4o or Claude Sonnet 4); outputs route to TTS or text display. A conversation history layer below stores text and image references for context." role="img" viewBox="0 -9 720 289" xmlns="http://www.w3.org/2000/svg">
<!-- Input modalities -->
<rect fill="#3498db" filter="url(#shadow_c906c3)" height="40" rx="8" stroke="none" width="130" x="30" y="55"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="95" y="80">Voice Input</text>
<rect fill="#8e44ad" height="40" rx="8" stroke="none" width="130" x="30" y="105"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="95" y="130">Text Input</text>
<rect fill="#27ae60" height="40" rx="8" stroke="none" width="130" x="30" y="155"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="95" y="180">Image / Camera</text>
<!-- Arrows to processing -->
<line marker-end="url(#mmArrow)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="160" x2="230" y1="75" y2="115"></line>
<line marker-end="url(#mmArrow)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="160" x2="230" y1="125" y2="125"></line>
<line marker-end="url(#mmArrow)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="160" x2="230" y1="175" y2="135"></line>
<!-- Processing -->
<rect fill="url(#grad_c906c3_e8f4fd)" height="40" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="1.5" width="130" x="235" y="65"></rect>
<text fill="#2980b9" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="300" y="90">STT (if voice)</text>
<rect fill="#f5eef8" height="40" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="1.5" width="130" x="235" y="115"></rect>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="300" y="140">Input Merger</text>
<!-- Arrow to LLM -->
<line marker-end="url(#mmArrow)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="365" x2="420" y1="135" y2="135"></line>
<!-- Multimodal LLM -->
<rect fill="#1a1a2e" height="90" rx="12" stroke="none" width="140" x="425" y="90"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="495" y="120">Multimodal LLM</text>
<text fill="#aaa" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="495" y="140">GPT-4o / Claude Sonnet 4</text>
<text fill="#aaa" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="495" y="158">Text + Image reasoning</text>
<!-- Output arrows -->
<line marker-end="url(#mmArrow)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="565" x2="620" y1="115" y2="85"></line>
<line marker-end="url(#mmArrow)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="565" x2="620" y1="155" y2="175"></line>
<!-- Output modalities -->
<rect fill="#e74c3c" height="50" rx="8" stroke="none" width="80" x="625" y="60"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="665" y="82">TTS</text>
<text fill="#fcc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="665" y="98">Voice out</text>
<rect fill="#f39c12" height="50" rx="8" stroke="none" width="80" x="625" y="150"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="665" y="172">Text</text>
<text fill="#fec" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="665" y="188">Display</text>
<!-- Context note -->
<rect fill="url(#grad_c906c3_fef9e7)" height="45" rx="8" stroke="#f39c12" stroke-linecap="round" stroke-width="1" width="360" x="235" y="220"></rect>
<text fill="#e67e22" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="415" y="240">Conversation History (text + image references)</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="415" y="255">Memory, context management, and session persistence</text>
<defs>
<lineargradient id="grad_c906c3_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_c906c3_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_c906c3" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="mmArrow" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#333" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
</svg>