<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: 1.1 The Self-Instruct Pipeline" role="img" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_4742fd_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_4742fd_fce4ec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3fb"></stop><stop offset="100%" stop-color="#fce4ec"></stop></lineargradient>
<lineargradient id="grad_4742fd_f0e6ff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff5ff"></stop><stop offset="100%" stop-color="#f0e6ff"></stop></lineargradient>
<lineargradient id="grad_4742fd_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_4742fd" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrow1" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><path d="M0,0 L8,3 L0,6" fill="#e94560"></path></marker>
</defs>
<!-- Step 1: Seed Pool -->
<rect fill="url(#grad_4742fd_e8f4fd)" filter="url(#shadow_4742fd)" height="70" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="130" x="10" y="30"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="75" y="55">Seed Pool</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="75" y="75">175 human-written</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="75" y="88">task instructions</text>
<line marker-end="url(#arrow1)" stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="140" x2="170" y1="65" y2="65"></line>
<!-- Step 2: Sample + Generate -->
<rect fill="url(#grad_4742fd_f0e6ff)" height="70" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="140" x="170" y="30"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="240" y="55">Generate New</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="240" y="75">Sample 8 from pool,</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="240" y="88">LLM writes new task</text>
<line marker-end="url(#arrow1)" stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="310" x2="340" y1="65" y2="65"></line>
<!-- Step 3: Classify -->
<rect fill="url(#grad_4742fd_fef9e7)" height="70" rx="8" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="130" x="340" y="30"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="405" y="55">Classify Task</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="405" y="75">Classification or</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="405" y="88">generation task?</text>
<line marker-end="url(#arrow1)" stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="470" x2="500" y1="65" y2="65"></line>
<!-- Step 4: Generate Response -->
<rect fill="#e8f5e9" height="70" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="130" x="500" y="30"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="565" y="55">Get Response</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="565" y="75">LLM generates</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="565" y="88">ideal response</text>
<!-- Step 5: Filter -->
<rect fill="url(#grad_4742fd_fce4ec)" height="70" rx="8" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="130" x="500" y="140"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="565" y="165">Filter</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="565" y="185">Remove duplicates,</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="565" y="198">low quality, too similar</text>
<line marker-end="url(#arrow1)" stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="565" x2="565" y1="100" y2="140"></line>
<!-- Back to pool -->
<line stroke="#999" stroke-dasharray="5,3" stroke-linecap="round" stroke-width="1.5" x1="500" x2="75" y1="175" y2="175"></line>
<line marker-end="url(#arrow1)" stroke="#999" stroke-dasharray="5,3" stroke-linecap="round" stroke-width="1.5" x1="75" x2="75" y1="175" y2="100"></line>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="280" y="195">Add surviving examples back to pool; repeat</text>
<!-- Output -->
<rect fill="#1a1a2e" height="50" rx="8" width="160" x="300" y="140"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="380" y="165">Final Dataset</text>
<text fill="#ddd" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="380" y="182">52K+ instruction pairs</text>
<line marker-end="url(#arrow1)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="500" x2="460" y1="170" y2="165"></line>
</svg>