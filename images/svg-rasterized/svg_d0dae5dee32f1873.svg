<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 320" role="img" aria-label="Eval-as-CI is a one-shot pass/fail gate; eval-as-product is a continuous experiment-score-compare-iterate loop. The two compose: CI still gates merges, while eval-as-product platforms (Braintrust, Latitude, Laminar) let PMs sweep prompt and model variants in a UI and replay historical traffic against each candidate." xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<defs>
<marker id="arrow-evalp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
</marker>
</defs>
<text x="360" y="22" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">Eval-as-CI vs eval-as-product</text>

<g transform="translate(20,55)">
<rect width="320" height="240" rx="8" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="160" y="22" font-size="12" font-weight="600" fill="#3a73a8" text-anchor="middle">Eval-as-CI (still needed)</text>
<rect x="20" y="40" width="80" height="36" rx="4" fill="#fff" stroke="#3a73a8"/>
<text x="60" y="56" font-size="10" fill="#2d3748" text-anchor="middle">PR opened</text>
<text x="60" y="68" font-size="9" fill="#718096" text-anchor="middle">prompt change</text>
<rect x="120" y="40" width="80" height="36" rx="4" fill="#fff" stroke="#3a73a8"/>
<text x="160" y="56" font-size="10" fill="#2d3748" text-anchor="middle">Run golden</text>
<text x="160" y="68" font-size="9" fill="#718096" text-anchor="middle">set in CI</text>
<rect x="220" y="40" width="80" height="36" rx="4" fill="#fff" stroke="#3a73a8"/>
<text x="260" y="56" font-size="10" fill="#2d3748" text-anchor="middle">Pass / fail</text>
<text x="260" y="68" font-size="9" fill="#718096" text-anchor="middle">gate merge</text>
<path d="M100,58 L116,58" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-evalp)"/>
<path d="M200,58 L216,58" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-evalp)"/>
<text x="160" y="110" font-size="10" font-weight="600" fill="#3a73a8" text-anchor="middle">Strengths:</text>
<text x="160" y="125" font-size="9" fill="#2d3748" text-anchor="middle">regression prevention</text>
<text x="160" y="138" font-size="9" fill="#2d3748" text-anchor="middle">cheap, automated, repeatable</text>
<text x="160" y="170" font-size="10" font-weight="600" fill="#b91c1c" text-anchor="middle">Gaps:</text>
<text x="160" y="185" font-size="9" fill="#2d3748" text-anchor="middle">- static golden set ages out</text>
<text x="160" y="198" font-size="9" fill="#2d3748" text-anchor="middle">- no live-traffic scoring</text>
<text x="160" y="211" font-size="9" fill="#2d3748" text-anchor="middle">- no UI for PM / domain expert</text>
<text x="160" y="224" font-size="9" fill="#2d3748" text-anchor="middle">- no replay against history</text>
</g>

<g transform="translate(380,55)">
<rect width="320" height="240" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="160" y="22" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">Eval-as-product (adds)</text>
<circle cx="80" cy="100" r="32" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
<text x="80" y="100" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">Experiment</text>
<text x="80" y="112" font-size="9" fill="#718096" text-anchor="middle">hypothesis</text>
<circle cx="240" cy="100" r="32" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
<text x="240" y="100" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">Score</text>
<text x="240" y="112" font-size="9" fill="#718096" text-anchor="middle">scorers</text>
<circle cx="240" cy="190" r="32" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
<text x="240" y="190" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">Compare</text>
<text x="240" y="202" font-size="9" fill="#718096" text-anchor="middle">vs baseline</text>
<circle cx="80" cy="190" r="32" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
<text x="80" y="190" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">Iterate</text>
<text x="80" y="202" font-size="9" fill="#718096" text-anchor="middle">refine</text>
<path d="M112,100 L208,100" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-evalp)"/>
<path d="M240,132 L240,158" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-evalp)"/>
<path d="M208,190 L112,190" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-evalp)"/>
<path d="M80,158 L80,132" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-evalp)"/>
<text x="160" y="235" font-size="10" fill="#2d3748" text-anchor="middle">+ replay against historical traffic</text>
</g>
</svg>