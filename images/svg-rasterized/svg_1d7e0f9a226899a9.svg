<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Four-stage quality filtering pipeline for LLM training data" viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="320" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Four-stage quality filter for production-log datasets</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Order matters: dedupe first (volume), tox second (safety), difficulty third, length last</text>
<g font-size="10">
<g transform="translate(20,70)">
<rect width="140" height="210" rx="8" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="70" y="24" font-weight="700" text-anchor="middle" fill="#3d4d8a">1. Deduplicate</text>
<text x="70" y="50" text-anchor="middle" fill="#1a1a2e">sha256 hash of</text>
<text x="70" y="64" text-anchor="middle" fill="#1a1a2e">normalized text</text>
<text x="70" y="80" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">retry-loop bloat</text>
<text x="70" y="110" text-anchor="middle" fill="#1a1a2e">100K raw -&gt; 73K</text>
<text x="70" y="170" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">"reduce volume</text>
<text x="70" y="184" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">before next stages"</text>
</g>
<g transform="translate(180,70)">
<rect width="160" height="210" rx="8" fill="#f5e3e8" stroke="#7a2a4a" stroke-width="2"/>
<text x="80" y="24" font-weight="700" text-anchor="middle" fill="#7a2a4a">2. Toxicity filter</text>
<text x="80" y="50" text-anchor="middle" fill="#1a1a2e">Perspective API</text>
<text x="80" y="64" text-anchor="middle" fill="#1a1a2e">or fine-tuned model</text>
<text x="80" y="80" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">threshold 0.7</text>
<text x="80" y="110" text-anchor="middle" fill="#1a1a2e">drops jailbreaks,</text>
<text x="80" y="124" text-anchor="middle" fill="#1a1a2e">adversarial prompts</text>
<text x="80" y="148" text-anchor="middle" fill="#1a1a2e">73K -&gt; 69K</text>
<text x="80" y="178" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">"never let toxic</text>
<text x="80" y="192" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">items be 'hard'"</text>
</g>
<g transform="translate(360,70)">
<rect width="180" height="210" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="90" y="24" font-weight="700" text-anchor="middle" fill="#a67c1a">3. Difficulty calibration</text>
<text x="90" y="50" text-anchor="middle" fill="#1a1a2e">base-model logprob</text>
<text x="90" y="64" text-anchor="middle" fill="#1a1a2e">on each example</text>
<text x="90" y="80" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">low prob = harder</text>
<text x="90" y="110" text-anchor="middle" fill="#1a1a2e">drop trivial (high prob)</text>
<text x="90" y="124" text-anchor="middle" fill="#1a1a2e">drop chaos (very low)</text>
<text x="90" y="148" text-anchor="middle" fill="#1a1a2e">69K -&gt; 41K</text>
<text x="90" y="178" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">"only items the model</text>
<text x="90" y="192" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">can actually learn from"</text>
</g>
<g transform="translate(560,70)">
<rect width="160" height="210" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="80" y="24" font-weight="700" text-anchor="middle" fill="#1f7a3a">4. Length balance</text>
<text x="80" y="50" text-anchor="middle" fill="#1a1a2e">trim long-tail</text>
<text x="80" y="64" text-anchor="middle" fill="#1a1a2e">subsample by quartile</text>
<text x="80" y="80" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">avoid length bias</text>
<text x="80" y="110" text-anchor="middle" fill="#1a1a2e">41K -&gt; 35K</text>
<text x="80" y="170" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">"don't let earlier filters</text>
<text x="80" y="184" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">distort token mix"</text>
</g>
<g transform="translate(740,70)">
<rect width="120" height="210" rx="8" fill="#fce8d4" stroke="#a67c1a" stroke-width="2"/>
<text x="60" y="24" font-weight="700" text-anchor="middle" fill="#a67c1a">Output</text>
<text x="60" y="56" text-anchor="middle" fill="#1f7a3a" font-weight="700">35K examples</text>
<text x="60" y="76" font-size="9" text-anchor="middle" fill="#5a4a3a">(35% of raw)</text>
<text x="60" y="110" text-anchor="middle" fill="#1a1a2e">ready for</text>
<text x="60" y="124" text-anchor="middle" fill="#1a1a2e">SFT or DPO</text>
<text x="60" y="158" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">"quality over volume"</text>
</g>
<g stroke="#1a1a2e" stroke-width="1.5" fill="none">
<line x1="160" y1="175" x2="180" y2="175" marker-end="url(#arr135b)"/>
<line x1="340" y1="175" x2="360" y2="175" marker-end="url(#arr135b)"/>
<line x1="540" y1="175" x2="560" y2="175" marker-end="url(#arr135b)"/>
<line x1="720" y1="175" x2="740" y2="175" marker-end="url(#arr135b)"/>
</g>
<defs>
<marker id="arr135b" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1a1a2e"/></marker>
</defs>
</g>
</svg>