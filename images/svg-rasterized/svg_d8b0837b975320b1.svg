<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="LLM adaptation spectrum from lightweight to heavyweight: prompt engineering (no training, minutes to iterate), RAG (retrieval infrastructure, days, dynamic knowledge), and fine-tuning (weight updates, most expensive and longest-lasting)." role="img" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter height="115%" id="shadow_c36de1" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<lineargradient id="spectrumGrad" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1"></stop>
<stop offset="50%" style="stop-color:#FF9800;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#e94560;stop-opacity:1"></stop>
</lineargradient>
</defs>
<rect fill="url(#spectrumGrad)" filter="url(#shadow_c36de1)" height="16" opacity="0.3" rx="8" width="700" x="50" y="40"></rect>
<rect fill="none" height="16" rx="8" stroke="#888" stroke-linecap="round" stroke-width="1" width="700" x="50" y="40"></rect>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="50" y="30">Lightweight</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="end" x="700" y="30">Heavyweight</text>
<!-- Prompting -->
<circle cx="130" cy="48" fill="#4CAF50" r="8"></circle>
<rect fill="#E8F5E9" height="110" rx="8" stroke="#4CAF50" stroke-linecap="round" stroke-width="2" width="180" x="60" y="75"></rect>
<text fill="#2E7D32" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="150" y="98">Prompt Engineering</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="150" y="118">No training needed</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="150" y="135">Minutes to iterate</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="150" y="152">Limited by context window</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="150" y="169">Higher inference cost</text>
<!-- RAG -->
<circle cx="400" cy="48" fill="#FF9800" r="8"></circle>
<rect fill="#FFF3E0" height="110" rx="8" stroke="#FF9800" stroke-linecap="round" stroke-width="2" width="180" x="310" y="75"></rect>
<text fill="#E65100" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="400" y="98">RAG</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="400" y="118">Retrieval infrastructure</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="400" y="135">Days to build pipeline</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="400" y="152">Dynamic knowledge</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="400" y="169">Retrieval latency added</text>
<!-- Fine-tuning -->
<circle cx="670" cy="48" fill="#e94560" r="8"></circle>
<rect fill="#FCE4EC" height="110" rx="8" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="180" x="560" y="75"></rect>
<text fill="#C62828" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="650" y="98">Fine-Tuning</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="650" y="118">Training data + GPUs</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="650" y="135">Days to weeks</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="650" y="152">Baked-in knowledge</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="650" y="169">Lower inference cost</text>
<!-- Arrows -->
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="400" y="220">Increasing: setup cost, training time, control over behavior</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="400" y="240">Decreasing: iteration speed, flexibility to change</text>
<line marker-end="url(#arrowhead)" stroke="#888" stroke-linecap="round" stroke-width="1" x1="100" x2="700" y1="255" y2="255"></line>
<defs><marker id="arrowhead" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5"><polygon fill="#888" points="0 0, 10 3.5, 0 7"></polygon></marker></defs>
</svg>