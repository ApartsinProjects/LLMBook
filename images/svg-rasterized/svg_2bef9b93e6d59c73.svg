<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="MMR selection loop: a candidate pool of 10 chunks is scored against the query, then on each iteration the chunk with the highest mixed score (lambda * query similarity minus (1 - lambda) * max similarity to already-selected) is moved into the output list, until the top-k slots are filled." role="img" viewbox="0 0 760 280" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="270" rx="10" stroke="#ddd" width="750" x="5" y="5"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" x="25" y="32">MMR iterative re-ranking (lambda = 0.5)</text>
<rect fill="#e3f2fd" height="200" rx="6" stroke="#1565c0" width="170" x="25" y="55"></rect>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="110" y="75">Candidate pool C</text>
<text fill="#1565c0" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="110" y="92">(10 chunks, sorted)</text>
<g fill="#fff" font-family="Consolas, monospace" font-size="11" stroke="#1565c0">
<rect height="18" rx="3" width="150" x="35" y="100"></rect>
<rect height="18" rx="3" width="150" x="35" y="121"></rect>
<rect height="18" rx="3" width="150" x="35" y="142"></rect>
<rect height="18" rx="3" width="150" x="35" y="163"></rect>
<rect height="18" rx="3" width="150" x="35" y="184"></rect>
<rect height="18" rx="3" width="150" x="35" y="205"></rect>
<rect height="18" rx="3" width="150" x="35" y="226"></rect>
</g>
<g fill="#333" font-family="Consolas, monospace" font-size="11" text-anchor="middle">
<text x="110" y="114">d1  sim(q)=0.92</text>
<text x="110" y="135">d2  sim(q)=0.89</text>
<text x="110" y="156">d3  sim(q)=0.88</text>
<text x="110" y="177">d4  sim(q)=0.84</text>
<text x="110" y="198">d5  sim(q)=0.81</text>
<text x="110" y="219">d6  sim(q)=0.77</text>
<text x="110" y="240">...</text>
</g>
<rect fill="#fff3e0" height="200" rx="6" stroke="#e65100" stroke-width="1.5" width="280" x="240" y="55"></rect>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="380" y="75">MMR scorer</text>
<text fill="#e65100" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="380" y="92">argmax over C \ S</text>
<text fill="#333" font-family="Consolas, monospace" font-size="11" x="255" y="118">score(d) = lambda * sim(d, q)</text>
<text fill="#333" font-family="Consolas, monospace" font-size="11" x="255" y="136">         - (1 - lambda) * max sim(d, d')</text>
<text fill="#333" font-family="Consolas, monospace" font-size="11" x="255" y="152">                           d' in S</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="255" y="180">Iter 1: S empty -&gt; pick d1 (top sim)</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="255" y="196">Iter 2: penalise sim to d1 -&gt; pick d4</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="255" y="212">Iter 3: penalise sim to d1, d4 -&gt; pick d6</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="255" y="228">...</text>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" x="255" y="248">stop when |S| = k</text>
<rect fill="#e8f5e9" height="200" rx="6" stroke="#2e7d32" width="190" x="545" y="55"></rect>
<text fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="640" y="75">Selected set S</text>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="640" y="92">(top-k = 5)</text>
<g fill="#fff" font-family="Consolas, monospace" font-size="11" stroke="#2e7d32">
<rect height="22" rx="3" width="170" x="555" y="105"></rect>
<rect height="22" rx="3" width="170" x="555" y="132"></rect>
<rect height="22" rx="3" width="170" x="555" y="159"></rect>
<rect height="22" rx="3" width="170" x="555" y="186"></rect>
<rect height="22" rx="3" width="170" x="555" y="213"></rect>
</g>
<g fill="#1b5e20" font-family="Consolas, monospace" font-size="11" text-anchor="middle">
<text x="640" y="121">d1   (most relevant)</text>
<text x="640" y="148">d4   (diverse)</text>
<text x="640" y="175">d6   (diverse)</text>
<text x="640" y="202">d9   (diverse)</text>
<text x="640" y="229">d2   (relevant + new)</text>
</g>
<g fill="none" stroke="#555" stroke-width="1.5">
<line x1="195" x2="238" y1="155" y2="155"></line>
<polygon fill="#555" points="238 155, 232 152, 232 158"></polygon>
<line x1="520" x2="543" y1="155" y2="155"></line>
<polygon fill="#555" points="543 155, 537 152, 537 158"></polygon>
</g>
</svg>