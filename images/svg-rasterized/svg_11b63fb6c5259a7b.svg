<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The four tracks of responsible AI literature and how they reference each other" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 880 460" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="460" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">Four tracks of responsible-AI literature and how they cross-reference</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="440" y="40">Reading any one track in isolation misses the critiques the others raise</text>
<!-- 4 quadrant track cards -->
<g transform="translate(60,80)">
<!-- Research (top left) -->
<rect fill="#eef4fa" height="160" rx="8" stroke="#1a4078" stroke-width="2" width="340" y="8"></rect>
<text fill="#1a4078" font-size="13" font-weight="700" text-anchor="middle" x="170" y="22">RESEARCH</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="170" y="38">Refines metrics; semester cadence</text>
<g fill="#1a1a2e" font-size="10">
<text x="14" y="60">ACM FAccT, AAAI/ACM AIES</text>
<text x="14" y="76">NeurIPS / ICML / ICLR safety workshops</text>
<text x="14" y="92">Buolamwini &amp; Gebru 2018 (Gender Shades)</text>
<text x="14" y="108">Hardt, Price, Srebro 2016 (Equal Opp.)</text>
<text x="14" y="124">Bai et al. 2022 (Constitutional AI)</text>
<text x="14" y="140">Barocas/Hardt/Narayanan textbook</text>
</g>
</g>
<g transform="translate(480,80)">
<!-- Policy (top right) -->
<rect fill="#f8e3e3" height="160" rx="8" stroke="#7a2a2a" stroke-width="2" width="340" y="8"></rect>
<text fill="#7a2a2a" font-size="13" font-weight="700" text-anchor="middle" x="170" y="22">POLICY &amp; STANDARDS</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="170" y="38">Turns research into law; multi-year</text>
<g fill="#1a1a2e" font-size="10">
<text x="14" y="60">EU AI Act 2024/1689 (in force 2025-2027)</text>
<text x="14" y="76">NIST AI RMF + AI 600-1 GenAI Profile</text>
<text x="14" y="92">ISO/IEC 42001:2023 (AIMS)</text>
<text x="14" y="108">Council of Europe AI Convention</text>
<text x="14" y="124">NYC LL 144; Colorado SB 205</text>
<text x="14" y="140">MLCommons AILuminate taxonomy</text>
</g>
</g>
<g transform="translate(60,260)">
<!-- Critical (bottom left) -->
<rect fill="#fef3e0" height="160" rx="8" stroke="#a67c1a" stroke-width="2" width="340" y="8"></rect>
<text fill="#a67c1a" font-size="13" font-weight="700" text-anchor="middle" x="170" y="22">CRITICAL / CIVIL SOCIETY</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="170" y="38">Audits the claim-vs-reality gap</text>
<g fill="#1a1a2e" font-size="10">
<text x="14" y="60">DAIR (Gebru et al., 2021+)</text>
<text x="14" y="76">AI Now Institute</text>
<text x="14" y="92">AI Forensics (Brussels)</text>
<text x="14" y="108">Algorithm Watch; Ada Lovelace Institute</text>
<text x="14" y="124">"Stochastic Parrots" (Bender et al. 2021)</text>
<text x="14" y="140">Obermeyer et al. 2019 (proxy-bias audit)</text>
</g>
</g>
<g transform="translate(480,260)">
<!-- Industry/practitioner (bottom right) -->
<rect fill="#ecf6ee" height="160" rx="8" stroke="#1f7a3a" stroke-width="2" width="340" y="8"></rect>
<text fill="#1f7a3a" font-size="13" font-weight="700" text-anchor="middle" x="170" y="22">INDUSTRY &amp; PRACTITIONER</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="170" y="38">Daily; ships the decisions</text>
<g fill="#1a1a2e" font-size="10">
<text x="14" y="60">Import AI (J. Clark), AI Snake Oil</text>
<text x="14" y="76">Anthropic Research, Transformer Circuits</text>
<text x="14" y="92">OpenAI Safety, DeepMind blog</text>
<text x="14" y="108">Interconnects (Lambert), Don't Worry...</text>
<text x="14" y="124">UK AISI, US AISI, METR, Apollo Research</text>
<text x="14" y="140">FAccT mailing list, MLCommons WGs</text>
</g>
</g>
<!-- Reference arrows -->
<g fill="none" stroke="#1a1a2e" stroke-width="1.5">
<path d="M 400 130 L 480 130" marker-end="url(#arr565)"></path>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="440" y="124">codifies</text>
<path d="M 480 195 L 400 195" marker-end="url(#arr565)"></path>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="440" y="208">demands evidence</text>
<path d="M 400 310 L 480 310" marker-end="url(#arr565)"></path>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="440" y="304">audits</text>
<path d="M 230 240 L 230 260" marker-end="url(#arr565)"></path>
<text fill="#5a4a3a" font-size="9" x="240" y="252">cites</text>
<path d="M 660 240 L 660 260" marker-end="url(#arr565)"></path>
<text fill="#5a4a3a" font-size="9" x="670" y="252">operationalizes</text>
</g>
<defs><marker id="arr565" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="4"><polygon fill="#1a1a2e" points="0 0, 8 4, 0 8"></polygon></marker></defs>
</svg>