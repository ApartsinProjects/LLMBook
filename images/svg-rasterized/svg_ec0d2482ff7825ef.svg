<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Conformer block: macaron feed-forward, multi-head self-attention, convolution module, second feed-forward, layer norm" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="240" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="360" y="20">Conformer block: macaron feed-forward sandwich with attention and convolution in the middle</text>
<defs>
<marker id="cfArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
</defs>
<g font-size="10">
<rect fill="#ffe0b2" height="60" rx="8" stroke="#ef6c00" stroke-width="1.5" width="100" x="20" y="90"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="70" y="115">FFN 1</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="70" y="130">half-step weight</text>
<line marker-end="url(#cfArr)" stroke="#666" stroke-width="2" x1="120" x2="148" y1="120" y2="120"></line>
<rect fill="#e1bee7" height="60" rx="8" stroke="#6a1b9a" stroke-width="1.5" width="120" x="148" y="90"></rect>
<text fill="#4a148c" font-weight="700" text-anchor="middle" x="208" y="112">MHSA</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="208" y="128">relative position</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="208" y="140">long-range context</text>
<line marker-end="url(#cfArr)" stroke="#666" stroke-width="2" x1="268" x2="296" y1="120" y2="120"></line>
<rect fill="#c8e6c9" height="60" rx="8" stroke="#2e7d32" stroke-width="1.5" width="160" x="296" y="90"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="376" y="108">Convolution module</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="376" y="123">pw-conv + GLU + dw-conv(k=31)</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="376" y="137">+ BatchNorm + swish + pw-conv</text>
<line marker-end="url(#cfArr)" stroke="#666" stroke-width="2" x1="456" x2="484" y1="120" y2="120"></line>
<rect fill="#ffe0b2" height="60" rx="8" stroke="#ef6c00" stroke-width="1.5" width="100" x="484" y="90"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="534" y="115">FFN 2</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="534" y="130">half-step weight</text>
<line marker-end="url(#cfArr)" stroke="#666" stroke-width="2" x1="584" x2="612" y1="120" y2="120"></line>
<rect fill="#bbdefb" height="60" rx="8" stroke="#1976d2" stroke-width="1.5" width="80" x="612" y="90"></rect>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="652" y="115">LayerNorm</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="652" y="130">+ residual</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="360" y="190">Attention captures global phonetic context; convolution captures local formant trajectories</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="360" y="208">The depthwise kernel of length 31 spans roughly one phoneme at 50 Hz</text>
</g>
</svg>