<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Unstructured versus structured pruning of the same weight matrix. On the left, unstructured pruning zeros out individual weights scattered across the matrix; the matrix keeps its original dimensions but is now sparse, and standard dense hardware still does the same work, so a sparse kernel is required for any speedup. On the right, structured pruning removes entire rows and columns, producing a smaller dense matrix that runs faster on ordinary hardware with no special support, at the cost of coarser granularity." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="prKeep" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bbdefb"></stop><stop offset="100%" stop-color="#1e88e5"></stop></lineargradient>
<lineargradient id="prStruct" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"></stop><stop offset="100%" stop-color="#43a047"></stop></lineargradient>
<filter height="116%" id="prShadow" width="116%" x="-8%" y="-8%"><fedropshadow dx="1" dy="2" flood-opacity="0.16" stddeviation="2"></fedropshadow></filter>
<marker id="prArrow" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"></path></marker>
</defs>
<rect fill="#fafafa" height="380" rx="8" width="800" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="400" y="26">Unstructured vs. structured pruning of one weight matrix</text>
<!-- divider -->
<line stroke="#e0e0e0" stroke-width="1.5" x1="400" x2="400" y1="48" y2="332"></line>
<!-- ============ LEFT: UNSTRUCTURED ============ -->
<text fill="#1e88e5" font-size="13" font-weight="600" text-anchor="middle" x="200" y="66">Unstructured: zero scattered weights</text>
<!-- 5x6 grid, some zeroed -->
<g>
<!-- helper grid cells; zeroed = grey -->
<!-- row1 --><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="100" y="80"></rect><rect fill="#eceff1" height="30" rx="4" width="30" x="132" y="80"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="164" y="80"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="196" y="80"></rect><rect fill="#eceff1" height="30" rx="4" width="30" x="228" y="80"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="260" y="80"></rect>
<!-- row2 --><rect fill="#eceff1" height="30" rx="4" width="30" x="100" y="112"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="132" y="112"></rect><rect fill="#eceff1" height="30" rx="4" width="30" x="164" y="112"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="196" y="112"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="228" y="112"></rect><rect fill="#eceff1" height="30" rx="4" width="30" x="260" y="112"></rect>
<!-- row3 --><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="100" y="144"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="132" y="144"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="164" y="144"></rect><rect fill="#eceff1" height="30" rx="4" width="30" x="196" y="144"></rect><rect fill="#eceff1" height="30" rx="4" width="30" x="228" y="144"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="260" y="144"></rect>
<!-- row4 --><rect fill="#eceff1" height="30" rx="4" width="30" x="100" y="176"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="132" y="176"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="164" y="176"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="196" y="176"></rect><rect fill="#eceff1" height="30" rx="4" width="30" x="228" y="176"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="260" y="176"></rect>
<!-- row5 --><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="100" y="208"></rect><rect fill="#eceff1" height="30" rx="4" width="30" x="132" y="208"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="164" y="208"></rect><rect fill="#eceff1" height="30" rx="4" width="30" x="196" y="208"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="228" y="208"></rect><rect fill="url(#prKeep)" height="30" rx="4" width="30" x="260" y="208"></rect>
</g>
<text fill="#555" font-size="11" text-anchor="middle" x="195" y="262">same shape, now sparse (grey = 0)</text>
<text fill="#e53935" font-size="11" font-weight="600" text-anchor="middle" x="195" y="292">stock GPU still does full work</text>
<text fill="#888" font-size="10" text-anchor="middle" x="195" y="310">needs a sparse kernel for real speedup</text>
<!-- ============ RIGHT: STRUCTURED ============ -->
<text fill="#43a047" font-size="13" font-weight="600" text-anchor="middle" x="600" y="66">Structured: drop whole rows/columns</text>
<!-- full grid faint, removed row/col marked, then smaller dense result -->
<g>
<!-- show original 5x6 with one row + one col removed (struck) -->
<!-- row1 kept --><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="470" y="80"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="498" y="80"></rect><rect fill="#ffcdd2" height="26" rx="4" width="26" x="526" y="80"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="554" y="80"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="582" y="80"></rect>
<!-- row2 removed --><rect fill="#ffcdd2" height="26" rx="4" width="26" x="470" y="108"></rect><rect fill="#ffcdd2" height="26" rx="4" width="26" x="498" y="108"></rect><rect fill="#ef9a9a" height="26" rx="4" width="26" x="526" y="108"></rect><rect fill="#ffcdd2" height="26" rx="4" width="26" x="554" y="108"></rect><rect fill="#ffcdd2" height="26" rx="4" width="26" x="582" y="108"></rect>
<!-- row3 kept --><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="470" y="136"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="498" y="136"></rect><rect fill="#ffcdd2" height="26" rx="4" width="26" x="526" y="136"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="554" y="136"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="582" y="136"></rect>
<!-- row4 kept --><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="470" y="164"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="498" y="164"></rect><rect fill="#ffcdd2" height="26" rx="4" width="26" x="526" y="164"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="554" y="164"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="582" y="164"></rect>
</g>
<text fill="#c62828" font-size="10" text-anchor="middle" x="540" y="210">red = removed row &amp; column</text>
<!-- arrow -->
<line marker-end="url(#prArrow)" stroke="#777" stroke-width="2" x1="616" x2="648" y1="135" y2="135"></line>
<!-- smaller dense result 3x4 -->
<g>
<rect fill="url(#prStruct)" height="26" rx="4" width="26" x="660" y="92"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="688" y="92"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="716" y="92"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="744" y="92"></rect>
<rect fill="url(#prStruct)" height="26" rx="4" width="26" x="660" y="120"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="688" y="120"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="716" y="120"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="744" y="120"></rect>
<rect fill="url(#prStruct)" height="26" rx="4" width="26" x="660" y="148"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="688" y="148"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="716" y="148"></rect><rect fill="url(#prStruct)" height="26" rx="4" width="26" x="744" y="148"></rect>
</g>
<text fill="#2e7d32" font-size="10" font-weight="600" text-anchor="middle" x="715" y="194">smaller dense matrix</text>
<text fill="#555" font-size="11" text-anchor="middle" x="600" y="262">genuinely fewer rows and columns</text>
<text fill="#2e7d32" font-size="11" font-weight="600" text-anchor="middle" x="600" y="292">faster on any GPU, no special support</text>
<text fill="#888" font-size="10" text-anchor="middle" x="600" y="310">coarser: less compression at equal quality</text>
<text fill="#888" font-size="11" text-anchor="middle" x="400" y="352">Same fraction of weights removed; only structured pruning shrinks the actual tensor the hardware multiplies.</text>
</svg>