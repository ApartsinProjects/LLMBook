<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="LLaRA architecture: a SASRec collaborative-filtering tower produces a CF vector per item; a small MLP projector maps that vector into the LLM's token-embedding space, where it is concatenated with the item's text tokens; the LLM consumes the interleaved sequence of CF tokens and text tokens for the user's history and emits the next item." role="img" viewbox="0 0 780 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrLR" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="3.5" viewbox="0 0 7 7"><path d="M0,0 L7,3.5 L0,7 z" fill="#444"></path></marker>
<filter height="115%" id="dsLR" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<rect fill="#eaf5ff" filter="url(#dsLR)" height="80" rx="8" stroke="#2980b9" stroke-width="2" width="160" x="20" y="40"></rect>
<text fill="#1f618d" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="100" y="65">SASRec / MF</text>
<text fill="#1f618d" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="100" y="85">(frozen)</text>
<text fill="#666" font-family="monospace" font-size="10" text-anchor="middle" x="100" y="105">e_item in R^d_cf</text>
<rect fill="#fef5e7" filter="url(#dsLR)" height="80" rx="8" stroke="#e67e22" stroke-width="2" width="160" x="220" y="40"></rect>
<text fill="#a05a16" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="300" y="65">Projector MLP</text>
<text fill="#a05a16" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="300" y="85">(trainable)</text>
<text fill="#666" font-family="monospace" font-size="10" text-anchor="middle" x="300" y="105">W2 . GELU(W1 e)</text>
<rect fill="#e8f5e9" filter="url(#dsLR)" height="80" rx="8" stroke="#27ae60" stroke-width="2" width="160" x="420" y="40"></rect>
<text fill="#1e8449" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="500" y="65">CF token</text>
<text fill="#666" font-family="monospace" font-size="10" text-anchor="middle" x="500" y="85">z = P(e_item)</text>
<text fill="#666" font-family="monospace" font-size="10" text-anchor="middle" x="500" y="102">in R^d_llm</text>
<rect fill="#fff" filter="url(#dsLR)" height="80" rx="8" stroke="#34495e" stroke-width="2" width="160" x="20" y="160"></rect>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="100" y="185">Item title + desc</text>
<text fill="#666" font-family="monospace" font-size="10" text-anchor="middle" x="100" y="205">"Inception (2010)"</text>
<rect fill="#fff" filter="url(#dsLR)" height="80" rx="8" stroke="#34495e" stroke-width="2" width="160" x="220" y="160"></rect>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="300" y="185">LLM Tokenizer</text>
<text fill="#666" font-family="monospace" font-size="10" text-anchor="middle" x="300" y="205">[t1, t2, ...]</text>
<rect fill="#e8f5e9" filter="url(#dsLR)" height="80" rx="8" stroke="#27ae60" stroke-width="2" width="160" x="420" y="160"></rect>
<text fill="#1e8449" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="500" y="185">Text tokens</text>
<text fill="#666" font-family="monospace" font-size="10" text-anchor="middle" x="500" y="205">embeds in R^d_llm</text>
<rect fill="#f5eef8" filter="url(#dsLR)" height="80" rx="8" stroke="#8e44ad" stroke-width="2" width="160" x="600" y="100"></rect>
<text fill="#6c3483" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="680" y="125">Frozen LLM</text>
<text fill="#6c3483" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="680" y="145">(LoRA fine-tuned)</text>
<text fill="#666" font-family="monospace" font-size="10" text-anchor="middle" x="680" y="165">[z1, t1, t2, z2, ...]</text>
<line marker-end="url(#arrLR)" stroke="#444" stroke-width="2" x1="182" x2="218" y1="80" y2="80"></line>
<line marker-end="url(#arrLR)" stroke="#444" stroke-width="2" x1="382" x2="418" y1="80" y2="80"></line>
<line marker-end="url(#arrLR)" stroke="#444" stroke-width="2" x1="182" x2="218" y1="200" y2="200"></line>
<line marker-end="url(#arrLR)" stroke="#444" stroke-width="2" x1="382" x2="418" y1="200" y2="200"></line>
<line marker-end="url(#arrLR)" stroke="#444" stroke-width="2" x1="582" x2="598" y1="100" y2="130"></line>
<line marker-end="url(#arrLR)" stroke="#444" stroke-width="2" x1="582" x2="598" y1="180" y2="155"></line>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="390" y="290">Next item = LLM([z_a, text_a, z_b, text_b, z_c, text_c, "&gt; "])</text>
</svg>