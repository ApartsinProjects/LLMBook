<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="One end-to-end query through the 2026 plant-floor maintenance copilot." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" style="max-width:880px;background:#fafafa;border:1px solid #ddd;font-family:sans-serif;">
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle">Plant-floor maintenance copilot: dataflow from voice query to CMMS work order</text>
<rect x="40" y="60" width="120" height="60" fill="#d6eaf8" stroke="#3498db" stroke-width="2"/>
<text x="100" y="84" font-size="11" font-weight="700" text-anchor="middle">Technician</text>
<text x="100" y="100" font-size="10" text-anchor="middle">gloved, on floor</text>
<text x="100" y="114" font-size="10" text-anchor="middle">voice or image</text>
<line x1="160" y1="90" x2="200" y2="90" stroke="#333" stroke-width="2" marker-end="url(#ah4)"/>
<defs><marker id="ah4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker></defs>
<rect x="200" y="60" width="140" height="60" fill="#fcf3cf" stroke="#f1c40f" stroke-width="2"/>
<text x="270" y="84" font-size="11" font-weight="700" text-anchor="middle">Whisper STT</text>
<text x="270" y="100" font-size="10" text-anchor="middle">on-prem</text>
<text x="270" y="114" font-size="10" text-anchor="middle">vision encoder</text>
<line x1="340" y1="90" x2="380" y2="90" stroke="#333" stroke-width="2" marker-end="url(#ah4)"/>
<rect x="380" y="52" width="180" height="60" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
<text x="470" y="80" font-size="11" font-weight="700" text-anchor="middle">vLLM serving Llama-3 70B</text>
<text x="470" y="96" font-size="10" text-anchor="middle">on plant GPU cluster</text>
<text x="470" y="110" font-size="10" text-anchor="middle">air-gapped from corporate net</text>
<line x1="560" y1="90" x2="600" y2="90" stroke="#333" stroke-width="2" marker-end="url(#ah4)"/>
<rect x="600" y="60" width="120" height="60" fill="#e8daef" stroke="#8e44ad" stroke-width="2"/>
<text x="660" y="80" font-size="11" font-weight="700" text-anchor="middle">RAG retrieval</text>
<text x="660" y="96" font-size="10" text-anchor="middle">pgvector, BGE-M3</text>
<text x="660" y="110" font-size="10" text-anchor="middle">per-site corpus</text>
<line x1="720" y1="90" x2="760" y2="90" stroke="#333" stroke-width="2" marker-end="url(#ah4)"/>
<rect x="760" y="60" width="80" height="60" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
<text x="800" y="80" font-size="10" font-weight="700" text-anchor="middle">Manuals,</text>
<text x="800" y="94" font-size="10" font-weight="700" text-anchor="middle">SOPs,</text>
<text x="800" y="108" font-size="10" font-weight="700" text-anchor="middle">work orders</text>
<line x1="470" y1="130" x2="470" y2="180" stroke="#333" stroke-width="2" marker-end="url(#ah4)"/>
<rect x="350" y="180" width="240" height="60" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
<text x="470" y="200" font-size="11" font-weight="700" text-anchor="middle">Answer with mandatory citation</text>
<text x="470" y="216" font-size="10" text-anchor="middle">"verify with printed manual" prompt</text>
<text x="470" y="230" font-size="10" text-anchor="middle">refuse-when-outside-corpus</text>
<line x1="470" y1="240" x2="470" y2="290" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#ah4-red)"/>
<defs><marker id="ah4-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/></marker></defs>
<text x="490" y="270" font-size="10" fill="#c0392b">human approval (DMZ gate)</text>
<rect x="280" y="290" width="380" height="60" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
<text x="470" y="312" font-size="11" font-weight="700" text-anchor="middle">Structured-output write to MES / CMMS</text>
<text x="470" y="328" font-size="10" text-anchor="middle">SAP, Oracle, Infor, Siemens Opcenter, IBM Maximo</text>
<text x="470" y="344" font-size="10" text-anchor="middle">signed payload, idempotent REST / AS2, IEC 62443 conduit</text>
<rect x="40" y="200" width="240" height="40" fill="#fff" stroke="#bdc3c7"/>
<text x="160" y="220" font-size="10" text-anchor="middle">Continuous eval against per-equipment</text>
<text x="160" y="232" font-size="10" text-anchor="middle">eval set (quarterly refresh)</text>
<line x1="280" y1="220" x2="350" y2="220" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2,2"/>
<rect x="650" y="200" width="200" height="40" fill="#fff" stroke="#bdc3c7"/>
<text x="750" y="220" font-size="10" text-anchor="middle">Latency budget: &lt; 2 s p95</text>
<text x="750" y="232" font-size="10" text-anchor="middle">refuses if retrieval is empty</text>
<line x1="590" y1="220" x2="650" y2="220" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2,2"/>
</svg>