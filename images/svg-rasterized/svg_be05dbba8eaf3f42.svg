<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="BERT vs RoBERTa: same architecture, different recipe" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 640 220" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="220" width="640"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="320" y="22">BERT vs RoBERTa: same architecture, different recipe</text>
<g font-size="11">
<rect fill="#fef3e0" height="150" rx="8" stroke="#a67c1a" stroke-width="1.5" width="270" x="30" y="50"></rect>
<text fill="#1a1a2e" font-size="12" font-weight="700" text-anchor="middle" x="165" y="72">BERT (2018)</text>
<text fill="#1a1a2e" x="50" y="96">objective: MLM + NSP</text>
<text fill="#1a1a2e" x="50" y="116">data: 16 GB (BookCorpus + Wiki)</text>
<text fill="#1a1a2e" x="50" y="136">batch: 256 sequences</text>
<text fill="#1a1a2e" x="50" y="156">steps: 1M</text>
<text fill="#1a1a2e" x="50" y="176">masking: static (precomputed once)</text>
<rect fill="#e3f5e8" height="150" rx="8" stroke="#1f7a3a" stroke-width="1.5" width="270" x="340" y="50"></rect>
<text fill="#1a1a2e" font-size="12" font-weight="700" text-anchor="middle" x="475" y="72">RoBERTa (2019)</text>
<text fill="#1a1a2e" x="360" y="96">objective: MLM only (NSP dropped)</text>
<text fill="#1a1a2e" x="360" y="116">data: 160 GB (+ CC-News, Stories)</text>
<text fill="#1a1a2e" x="360" y="136">batch: 8K sequences</text>
<text fill="#1a1a2e" x="360" y="156">steps: 500K (longer wall time)</text>
<text fill="#1a1a2e" x="360" y="176">masking: dynamic (per epoch)</text>
</g>
</svg>