<text fill="#ef6c00" font-size="9" text-anchor="middle" x="230" y="112">&lt;|en|&gt; &lt;|fr|&gt; ...</text>
<rect fill="#fff3e0" height="42" rx="6" stroke="#ef6c00" stroke-width="1.4" width="120" x="170" y="140"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="230" y="158">Lang tag</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="230" y="172">(translate path)</text>
<rect fill="#ffcdd2" height="42" rx="6" stroke="#c62828" stroke-width="1.4" width="120" x="170" y="230"></rect>
<text fill="#b71c1c" font-weight="700" text-anchor="middle" x="230" y="248">no-speech</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="230" y="262">VAD branch</text>
<line marker-end="url(#whArr)" stroke="#666" stroke-width="1.5" x1="290" x2="320" y1="100" y2="100"></line>
<line marker-end="url(#whArr)" stroke="#666" stroke-width="1.5" x1="290" x2="320" y1="161" y2="161"></line>
