<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="540" y="72">&lt;|t_begin|&gt; ... &lt;|t_end|&gt;</text>
<rect fill="#e1bee7" height="42" rx="6" stroke="#6a1b9a" stroke-width="1.4" width="140" x="470" y="100"></rect>
