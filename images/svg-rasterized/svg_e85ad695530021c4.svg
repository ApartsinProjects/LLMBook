<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Whisper multitask training format as a directed graph of control tokens" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 860 360" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="360" width="860"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="430" y="22">Whisper multitask training format (directed graph of special tokens)</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="430" y="40">One vocabulary, multiple tasks, controlled by which tokens the decoder is fed</text>
<defs>
<marker id="whArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
</defs>
<g font-size="10">
<rect fill="#bbdefb" height="42" rx="6" stroke="#1976d2" stroke-width="1.4" width="120" x="20" y="140"></rect>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="80" y="158">SOT</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="80" y="172">startoftranscript</text>
<line marker-end="url(#whArr)" stroke="#666" stroke-width="1.5" x1="140" x2="170" y1="161" y2="100"></line>
<line marker-end="url(#whArr)" stroke="#666" stroke-width="1.5" x1="140" x2="170" y1="161" y2="161"></line>
<line marker-end="url(#whArr)" stroke="#666" stroke-width="1.5" x1="140" x2="170" y1="161" y2="245"></line>
