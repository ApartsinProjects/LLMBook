<line marker-end="url(#whArr)" stroke="#666" stroke-width="1.5" x1="610" x2="640" y1="161" y2="161"></line>
<rect fill="#fff9c4" height="42" rx="6" stroke="#f57f17" stroke-width="1.4" width="180" x="640" y="40"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="730" y="58">Text + timestamps</text>
<text fill="#f57f17" font-size="9" text-anchor="middle" x="730" y="72">spans aligned to audio</text>
<rect fill="#fff9c4" height="42" rx="6" stroke="#f57f17" stroke-width="1.4" width="180" x="640" y="100"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="730" y="118">Text only</text>
<text fill="#f57f17" font-size="9" text-anchor="middle" x="730" y="132">no time annotations</text>
<rect fill="#fff9c4" height="42" rx="6" stroke="#f57f17" stroke-width="1.4" width="180" x="640" y="140"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="730" y="158">English text</text>
<text fill="#f57f17" font-size="9" text-anchor="middle" x="730" y="172">translation output</text>
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="middle" x="430" y="310">All paths terminate with &lt;|endoftext|&gt;</text>
<text fill="#5a4a3a" font-size="9.5" text-anchor="middle" x="430" y="328">A single 32k vocabulary covers text, control tokens, and timestamp tokens (1500 of them, one per 20 ms frame).</text>
</g>
</svg>