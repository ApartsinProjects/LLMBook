<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: Model Selection by Task Complexity" font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg">
<!-- Input -->
<rect fill="url(#grad_bfbc61_e8f4fd)" filter="url(#shadow_bfbc61)" height="50" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="180" x="290" y="45"></rect>
<text fill="#3498db" font-size="12" font-weight="600" text-anchor="middle" x="380" y="68">Incoming Query</text>
<text fill="#888" font-size="11" text-anchor="middle" x="380" y="83">+ complexity features</text>
<!-- Arrow to router -->
<line marker-end="url(#arrD)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="380" x2="380" y1="95" y2="130"></line>
<!-- Router box -->
<rect fill="url(#grad_bfbc61_fef9e7)" height="50" rx="10" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="200" x="280" y="130"></rect>
<text fill="#f39c12" font-size="12" font-weight="700" text-anchor="middle" x="380" y="152">Complexity Router</text>
<text fill="#888" font-size="11" text-anchor="middle" x="380" y="168">DistilBERT classifier, ~5ms</text>
<!-- Three output branches -->
<!-- Simple (left) -->
<line marker-end="url(#arrG)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="310" x2="130" y1="180" y2="240"></line>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="190" y="205">Simple (60%)</text>
<rect fill="#e8f5e9" height="70" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="180" x="40" y="240"></rect>
<text fill="#27ae60" font-size="12" font-weight="700" text-anchor="middle" x="130" y="265">GPT-4o-mini</text>
<text fill="#555" font-size="11" text-anchor="middle" x="130" y="282"><span>&#36;</span>0.60 / 1M tokens</text>
<text fill="#555" font-size="11" text-anchor="middle" x="130" y="298">~200ms latency</text>
<!-- Medium (center) -->
<line marker-end="url(#arrB)" stroke="#3498db" stroke-linecap="round" stroke-width="2" x1="380" x2="380" y1="180" y2="240"></line>
<text fill="#3498db" font-size="11" font-weight="600" text-anchor="middle" x="440" y="215">Medium (30%)</text>
<rect fill="url(#grad__bfbc_61_e8f4fd)" height="70" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="180" x="290" y="240"></rect>
<text fill="#3498db" font-size="12" font-weight="700" text-anchor="middle" x="380" y="265">GPT-4o</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="282"><span>&#36;</span>2.50 / 1M tokens</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="298">~500ms latency</text>
<!-- Complex (right) -->
<line marker-end="url(#arrR)" stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="450" x2="630" y1="180" y2="240"></line>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="570" y="205">Complex (10%)</text>
<rect fill="#fde8ec" height="70" rx="10" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="180" x="540" y="240"></rect>
<text fill="#e94560" font-size="12" font-weight="700" text-anchor="middle" x="630" y="265">Claude Opus</text>
<text fill="#555" font-size="11" text-anchor="middle" x="630" y="282"><span>&#36;</span>15.00 / 1M tokens</text>
<text fill="#555" font-size="11" text-anchor="middle" x="630" y="298">~800ms latency</text>
<!-- Cost summary -->
<rect fill="#f8f8ff" height="55" rx="10" stroke="#0f3460" stroke-linecap="round" stroke-width="1.5" width="520" x="120" y="350"></rect>
<text fill="#0f3460" font-size="12" font-weight="700" text-anchor="middle" x="380" y="372">Blended Cost Calculation (per 1K tokens)</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="393">0.60 x <span>&#36;</span>0.60 + 0.30 x <span>&#36;</span>2.50 + 0.10 x <span>&#36;</span>15.00 = <span>&#36;</span>2.61 (vs. <span>&#36;</span>15.00 all-Opus: 83% savings)</text>
<defs>
<lineargradient id="grad_bfbc61_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_bfbc61_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_bfbc61" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrD" markerheight="7" markerwidth="10" orient="auto" refx="5" refy="7"><polygon fill="#888" points="0 0, 5 7, 10 0"></polygon></marker>
<marker id="arrG" markerheight="7" markerwidth="10" orient="auto" refx="5" refy="3.5"><polygon fill="#27ae60" points="0 0, 10 3.5, 0 7"></polygon></marker>
<marker id="arrB" markerheight="7" markerwidth="10" orient="auto" refx="5" refy="7"><polygon fill="#3498db" points="0 0, 5 7, 10 0"></polygon></marker>
<marker id="arrR" markerheight="7" markerwidth="10" orient="auto" refx="5" refy="3.5"><polygon fill="#e94560" points="0 0, 10 3.5, 0 7"></polygon></marker>
</defs>
</svg>