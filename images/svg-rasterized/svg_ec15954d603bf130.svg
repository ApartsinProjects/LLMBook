<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Actor-critic architecture: a shared trunk feeds an actor head that outputs the action distribution and a critic head that outputs the scalar state value; the advantage A equals the return G minus the critic's prediction V and weights the actor's policy gradient." role="img" style="max-width:640px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="acArr" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"></path></marker></defs>
<text fill="#222" font-size="14" font-weight="700" text-anchor="middle" x="320" y="22">Actor-Critic with the advantage baseline</text>
<rect fill="#e3f2fd" height="60" rx="6" stroke="#1565c0" width="110" x="30" y="100"></rect>
<text fill="#0d47a1" font-size="13" text-anchor="middle" x="85" y="135">state s</text>
<rect fill="#fff3e0" height="60" rx="6" stroke="#ef6c00" width="120" x="180" y="100"></rect>
<text fill="#e65100" font-size="13" font-weight="700" text-anchor="middle" x="240" y="128">shared</text>
<text fill="#666" font-size="11" text-anchor="middle" x="240" y="146">trunk (MLP)</text>
<rect fill="#e8f5e9" height="50" rx="6" stroke="#2e7d32" width="160" x="350" y="50"></rect>
<text fill="#1b5e20" font-size="13" font-weight="700" text-anchor="middle" x="430" y="72">actor</text>
<text fill="#555" font-size="11" text-anchor="middle" x="430" y="90">pi_theta(a | s)</text>
<rect fill="#ede7f6" height="50" rx="6" stroke="#6a1b9a" width="160" x="350" y="160"></rect>
<text fill="#4527a0" font-size="13" font-weight="700" text-anchor="middle" x="430" y="182">critic</text>
<text fill="#555" font-size="11" text-anchor="middle" x="430" y="200">V_phi(s)</text>
<line marker-end="url(#acArr)" stroke="#555" stroke-width="1.4" x1="140" x2="178" y1="130" y2="130"></line>
<line marker-end="url(#acArr)" stroke="#555" stroke-width="1.4" x1="300" x2="348" y1="120" y2="80"></line>
<line marker-end="url(#acArr)" stroke="#555" stroke-width="1.4" x1="300" x2="348" y1="140" y2="180"></line>
<rect fill="#ffebee" height="50" rx="6" stroke="#c62828" width="90" x="540" y="105"></rect>
<text fill="#b71c1c" font-size="13" font-weight="700" text-anchor="middle" x="585" y="128">A = G - V</text>
<text fill="#555" font-size="10" text-anchor="middle" x="585" y="145">advantage</text>
<line marker-end="url(#acArr)" stroke="#2e7d32" stroke-width="1.4" x1="510" x2="558" y1="75" y2="105"></line>
<line marker-end="url(#acArr)" stroke="#6a1b9a" stroke-width="1.4" x1="510" x2="558" y1="185" y2="155"></line>
<text fill="#888" font-size="10" text-anchor="middle" x="585" y="180">scales actor loss</text>
<text fill="#888" font-size="10" text-anchor="middle" x="585" y="195">trains critic via MSE</text>
</svg>