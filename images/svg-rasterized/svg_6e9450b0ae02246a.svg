<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Bar chart comparing pass@1, pass@10, and pass@100 for two hypothetical code models, showing the gap that scaling test-time sampling can close" role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewbox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="350" y="22">pass@k: the gap between first-try and best-of-k matters</text>
<line stroke="#4a5568" stroke-width="1.5" x1="80" x2="660" y1="250" y2="250"></line>
<line stroke="#4a5568" stroke-width="1.5" x1="80" x2="80" y1="60" y2="250"></line>
<g fill="#718096" font-size="9">
<text text-anchor="end" x="75" y="253">0%</text>
<text text-anchor="end" x="75" y="216">20%</text>
<text text-anchor="end" x="75" y="178">40%</text>
<text text-anchor="end" x="75" y="140">60%</text>
<text text-anchor="end" x="75" y="102">80%</text>
<text text-anchor="end" x="75" y="65">100%</text>
</g>
<line stroke="#e2e8f0" stroke-dasharray="2,3" x1="80" x2="660" y1="216" y2="216"></line>
<line stroke="#e2e8f0" stroke-dasharray="2,3" x1="80" x2="660" y1="178" y2="178"></line>
<line stroke="#e2e8f0" stroke-dasharray="2,3" x1="80" x2="660" y1="140" y2="140"></line>
<line stroke="#e2e8f0" stroke-dasharray="2,3" x1="80" x2="660" y1="102" y2="102"></line>
<line stroke="#e2e8f0" stroke-dasharray="2,3" x1="80" x2="660" y1="65" y2="65"></line>
<g transform="translate(110,60)">
<rect fill="#3a73a8" height="55" width="55" x="0" y="135"></rect>
<rect fill="#3a73a8" height="130" width="55" x="70" y="60"></rect>
<rect fill="#3a73a8" height="170" width="55" x="140" y="20"></rect>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="27" y="205">pass@1</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="97" y="205">pass@10</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="167" y="205">pass@100</text>
<text fill="#2d3748" font-size="10" font-weight="600" text-anchor="middle" x="27" y="130">29%</text>
<text fill="#2d3748" font-size="10" font-weight="600" text-anchor="middle" x="97" y="55">59%</text>
<text fill="#2d3748" font-size="10" font-weight="600" text-anchor="middle" x="167" y="15">72%</text>
<text fill="#3a73a8" font-size="11" font-weight="600" text-anchor="middle" x="100" y="220">Model A: large gap</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="100" y="235">reward verifier-guided search</text>
</g>
<g transform="translate(420,60)">
<rect fill="#047857" height="168" width="55" x="0" y="22"></rect>
<rect fill="#047857" height="177" width="55" x="70" y="13"></rect>
<rect fill="#047857" height="181" width="55" x="140" y="9"></rect>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="27" y="205">pass@1</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="97" y="205">pass@10</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="167" y="205">pass@100</text>
<text fill="#2d3748" font-size="10" font-weight="600" text-anchor="middle" x="27" y="17">90%</text>
<text fill="#2d3748" font-size="10" font-weight="600" text-anchor="middle" x="97" y="8">94%</text>
<text fill="#2d3748" font-size="10" font-weight="600" text-anchor="middle" x="167" y="4">96%</text>
<text fill="#047857" font-size="11" font-weight="600" text-anchor="middle" x="100" y="220">Model B: tight</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="100" y="235">sampling wastes compute</text>
</g>
<text fill="#718096" font-size="10" font-style="italic" text-anchor="middle" x="350" y="295">A 30-point pass@1 to pass@100 gap is your hint to invest in test-time verifiers,</text>
<text fill="#718096" font-size="10" font-style="italic" text-anchor="middle" x="350" y="310">not a bigger model. A 4-point gap means a stronger model is the only win.</text>
</svg>