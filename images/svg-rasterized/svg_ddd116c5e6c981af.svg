<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Text-to-SQL pipeline: schema linking maps natural language to database elements, the LLM generates SQL, execution returns results, and errors trigger regeneration." font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 -12 760 292" xmlns="http://www.w3.org/2000/svg">
<text fill="#1a1a2e" font-size="14" font-weight="bold" text-anchor="middle" x="380" y="22">Text-to-SQL Pipeline</text>
<!-- Natural Language -->
<rect fill="url(#grad_279252_e3f2fd)" filter="url(#shadow_279252)" height="55" rx="8" stroke="#1565c0" stroke-linecap="round" stroke-width="2" width="140" x="20" y="60"></rect>
<text fill="#0d47a1" font-size="11" font-weight="bold" text-anchor="middle" x="90" y="82">NL Question</text>
<text fill="#555" font-size="11" text-anchor="middle" x="90" y="100">"Top 5 customers</text>
<text fill="#555" font-size="11" text-anchor="middle" x="90" y="110">by revenue"</text>
<line marker-end="url(#asql)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="160" x2="190" y1="87" y2="87"></line>
<!-- Schema Linking -->
<rect fill="url(#grad_279252_fff3e0)" height="75" rx="8" stroke="#e65100" stroke-linecap="round" stroke-width="1.5" width="130" x="195" y="50"></rect>
<text fill="#e65100" font-size="11" font-weight="bold" text-anchor="middle" x="260" y="72">Schema Link</text>
<text fill="#555" font-size="11" text-anchor="middle" x="260" y="90">Map NL terms to</text>
<text fill="#555" font-size="11" text-anchor="middle" x="260" y="103">tables + columns</text>
<text fill="#555" font-size="11" text-anchor="middle" x="260" y="116">+ relationships</text>
<line marker-end="url(#asql)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="325" x2="355" y1="87" y2="87"></line>
<!-- SQL Generation -->
<rect fill="#e8f5e9" height="75" rx="8" stroke="#2e7d32" stroke-linecap="round" stroke-width="2" width="130" x="360" y="50"></rect>
<text fill="#2e7d32" font-size="11" font-weight="bold" text-anchor="middle" x="425" y="72">LLM Generate</text>
<text fill="#555" font-size="11" text-anchor="middle" x="425" y="90">Prompt with schema</text>
<text fill="#555" font-size="11" text-anchor="middle" x="425" y="103">+ examples</text>
<text fill="#555" font-size="11" text-anchor="middle" x="425" y="116">produces SQL</text>
<line marker-end="url(#asql)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="490" x2="520" y1="87" y2="87"></line>
<!-- Execute -->
<rect fill="url(#grad_279252_f3e5f5)" height="65" rx="8" stroke="#7b1fa2" stroke-linecap="round" stroke-width="1.5" width="100" x="525" y="55"></rect>
<text fill="#7b1fa2" font-size="11" font-weight="bold" text-anchor="middle" x="575" y="77">Execute</text>
<text fill="#555" font-size="11" text-anchor="middle" x="575" y="95">Run against</text>
<text fill="#555" font-size="11" text-anchor="middle" x="575" y="108">database</text>
<line marker-end="url(#asql)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="625" x2="655" y1="87" y2="87"></line>
<!-- Answer -->
<rect fill="url(#grad_279252_e8eaf6)" height="55" rx="8" stroke="#283593" stroke-linecap="round" stroke-width="2" width="80" x="660" y="60"></rect>
<text fill="#283593" font-size="11" font-weight="bold" text-anchor="middle" x="700" y="82">Answer</text>
<text fill="#555" font-size="11" text-anchor="middle" x="700" y="100">Results +</text>
<text fill="#555" font-size="11" text-anchor="middle" x="700" y="110">NL summary</text>
<!-- Error correction loop -->
<path d="M 575 120 C 575 175 425 175 425 125" fill="none" marker-end="url(#asql)" stroke="#c62828" stroke-dasharray="5,3" stroke-linecap="round" stroke-width="1.5"></path>
<text fill="#c62828" font-size="11" font-weight="bold" text-anchor="middle" x="500" y="160">Error? Regenerate</text>
<!-- Database icon -->
<rect fill="url(#grad_279252_fce4ec)" height="45" rx="6" stroke="#c62828" stroke-linecap="round" stroke-width="1" width="100" x="525" y="190"></rect>
<text fill="#c62828" font-size="11" font-weight="bold" text-anchor="middle" x="575" y="210">Database</text>
<text fill="#555" font-size="11" text-anchor="middle" x="575" y="225">PostgreSQL, MySQL</text>
<line marker-end="url(#asqlRed)" stroke="#c62828" stroke-dasharray="3,3" stroke-linecap="round" stroke-width="1" x1="575" x2="575" y1="190" y2="122"></line>
<!-- Schema info -->
<rect fill="url(#grad_279252_fff8e1)" height="45" rx="6" stroke="#f9a825" stroke-linecap="round" stroke-width="1" width="130" x="195" y="190"></rect>
<text fill="#f57f17" font-size="11" font-weight="bold" text-anchor="middle" x="260" y="210">Schema Info</text>
<text fill="#555" font-size="11" text-anchor="middle" x="260" y="225">Tables, columns, types</text>
<line marker-end="url(#asqlAmber)" stroke="#f9a825" stroke-dasharray="3,3" stroke-linecap="round" stroke-width="1" x1="260" x2="260" y1="190" y2="127"></line>
<defs>
<lineargradient id="grad_279252_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#e3f2fd"></stop></lineargradient>
<lineargradient id="grad_279252_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#f3e5f5"></stop></lineargradient>
<lineargradient id="grad_279252_e8eaf6" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7f9ff"></stop><stop offset="100%" stop-color="#e8eaf6"></stop></lineargradient>
<lineargradient id="grad_279252_fce4ec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3fb"></stop><stop offset="100%" stop-color="#fce4ec"></stop></lineargradient>
<lineargradient id="grad_279252_fff8e1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff0"></stop><stop offset="100%" stop-color="#fff8e1"></stop></lineargradient>
<lineargradient id="grad_279252_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<filter height="115%" id="shadow_279252" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="asql" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333"></path>
</marker>
<marker id="asqlRed" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"></path></marker>
<marker id="asqlAmber" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f9a825"></path></marker>
</defs>
</svg>