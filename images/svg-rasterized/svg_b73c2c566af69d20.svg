<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="ViT-Base/16 inference: image → 14×14 patches → 197-token transformer input" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="240" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="360" y="22">ViT-Base/16 inference: image → 14×14 patches → 197-token transformer input</text>
<g transform="translate(30,50)">
<rect fill="#e3f2fd" height="120" rx="6" stroke="#1565c0" width="120"></rect>
<text fill="#0d47a1" font-size="11" font-weight="700" text-anchor="middle" x="60" y="22">224×224 image</text>
<g fill="none" stroke="#1565c0" stroke-width="0.5">
<line x1="20" x2="100" y1="40" y2="40"></line><line x1="20" x2="100" y1="60" y2="60"></line>
<line x1="20" x2="100" y1="80" y2="80"></line><line x1="20" x2="100" y1="100" y2="100"></line>
<line x1="40" x2="40" y1="30" y2="110"></line><line x1="60" x2="60" y1="30" y2="110"></line>
<line x1="80" x2="80" y1="30" y2="110"></line>
<rect fill="none" height="80" stroke="#1565c0" stroke-width="1.5" width="80" x="20" y="30"></rect>
</g>
</g>
<line marker-end="url(#vitArr)" stroke="#444" stroke-width="2" x1="160" x2="210" y1="100" y2="100"></line>
<defs><marker id="vitArr" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="4"><path d="M0,0 L8,4 L0,8 Z" fill="#444"></path></marker></defs>
<g transform="translate(210,50)">
<rect fill="#fff3e0" height="120" rx="6" stroke="#a67c1a" width="180"></rect>
<text fill="#a67c1a" font-size="11" font-weight="700" text-anchor="middle" x="90" y="22">linear projection E</text>
<text fill="#a67c1a" font-size="10" text-anchor="middle" x="90" y="42">each 16×16×3 patch → 768-D</text>
<text fill="#a67c1a" font-size="10" text-anchor="middle" x="90" y="64">+ learned position embedding</text>
<text fill="#a67c1a" font-size="10" text-anchor="middle" x="90" y="86">+ [CLS] token</text>
<text fill="#a67c1a" font-size="10" font-weight="700" text-anchor="middle" x="90" y="108">→ 197×768 tokens</text>
</g>
<line marker-end="url(#vitArr)" stroke="#444" stroke-width="2" x1="400" x2="450" y1="100" y2="100"></line>
<g transform="translate(450,50)">
<rect fill="#e8f5e9" height="120" rx="6" stroke="#2e7d32" width="240"></rect>
<text fill="#1b5e20" font-size="11" font-weight="700" text-anchor="middle" x="120" y="22">12-layer Transformer encoder</text>
<text fill="#1b5e20" font-size="10" text-anchor="middle" x="120" y="44">last_hidden_state: 1×197×768</text>
<text fill="#1b5e20" font-size="10" text-anchor="middle" x="120" y="62">pooler_output: 1×768 (CLS)</text>
<text fill="#2e7d32" font-size="10" font-style="italic" text-anchor="middle" x="120" y="86">classifier head reads CLS</text>
<text fill="#2e7d32" font-size="10" font-style="italic" text-anchor="middle" x="120" y="100">downstream models read patches</text>
</g>
</svg>