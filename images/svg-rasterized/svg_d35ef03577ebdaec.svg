<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 360" role="img" aria-label="Grid of multimodal platforms organized by modality (image, video, audio) and access pattern (closed API frontier vs open weights), with latency and billing notes" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<text x="360" y="22" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">The 2026 multimodal platform shelf</text>

<text x="170" y="55" font-size="12" font-weight="600" fill="#3a73a8" text-anchor="middle">Closed API frontier</text>
<text x="170" y="68" font-size="9" font-style="italic" fill="#718096" text-anchor="middle">SOTA quality, less control</text>
<text x="520" y="55" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">Open weights</text>
<text x="520" y="68" font-size="9" font-style="italic" fill="#718096" text-anchor="middle">self-host, fine-tune</text>

<g transform="translate(40,85)">
<rect width="260" height="80" rx="8" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="14" y="20" font-size="11" font-weight="600" fill="#3a73a8">Image</text>
<text x="14" y="38" font-size="9" fill="#2d3748">Midjourney v7, OpenAI Images,</text>
<text x="14" y="51" font-size="9" fill="#2d3748">Imagen 4, NanoBanana, Ideogram</text>
<text x="14" y="69" font-size="9" font-style="italic" fill="#b91c1c">cost: ~$0.04 / image, ~5 sec</text>
</g>

<g transform="translate(380,85)">
<rect width="260" height="80" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="14" y="20" font-size="11" font-weight="600" fill="#047857">Image</text>
<text x="14" y="38" font-size="9" fill="#2d3748">FLUX.1, SD3.5, HiDream-I1,</text>
<text x="14" y="51" font-size="9" fill="#2d3748">SDXL, Playground v3</text>
<text x="14" y="69" font-size="9" font-style="italic" fill="#047857">cost: GPU-hour, free model</text>
</g>

<g transform="translate(40,180)">
<rect width="260" height="80" rx="8" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="14" y="20" font-size="11" font-weight="600" fill="#3a73a8">Video</text>
<text x="14" y="38" font-size="9" fill="#2d3748">Sora, Veo, Runway Gen-3, Kling,</text>
<text x="14" y="51" font-size="9" fill="#2d3748">Luma Dream Machine</text>
<text x="14" y="69" font-size="9" font-style="italic" fill="#b91c1c">cost: $0.5-2 / 5s clip, minutes</text>
</g>

<g transform="translate(380,180)">
<rect width="260" height="80" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="14" y="20" font-size="11" font-weight="600" fill="#047857">Video</text>
<text x="14" y="38" font-size="9" fill="#2d3748">HunyuanVideo, Mochi 1, LTX-V,</text>
<text x="14" y="51" font-size="9" fill="#2d3748">CogVideoX, Open-Sora</text>
<text x="14" y="69" font-size="9" font-style="italic" fill="#047857">cost: A100 minutes, free model</text>
</g>

<g transform="translate(40,275)">
<rect width="260" height="65" rx="8" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="14" y="20" font-size="11" font-weight="600" fill="#3a73a8">Audio + Voice</text>
<text x="14" y="38" font-size="9" fill="#2d3748">ElevenLabs, Cartesia, Suno,</text>
<text x="14" y="51" font-size="9" fill="#2d3748">Udio, OpenAI TTS, Sesame</text>
</g>

<g transform="translate(380,275)">
<rect width="260" height="65" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="14" y="20" font-size="11" font-weight="600" fill="#047857">Audio + Voice</text>
<text x="14" y="38" font-size="9" fill="#2d3748">XTTS, F5-TTS, OpenVoice, MusicGen,</text>
<text x="14" y="51" font-size="9" fill="#2d3748">Stable Audio, Whisper (STT)</text>
</g>
</svg>