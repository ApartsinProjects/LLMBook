<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Chat orchestration framework selection" role="img" style="display:block;margin:1.2em auto;max-width:760px;width:100%;height:auto;" viewBox="0 0 779 320" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="320" rx="6" width="720" x="0" y="0"></rect>
<text font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="360" y="26">When to pick which orchestration framework</text>
<g font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle">
<rect fill="#3498db" height="68" rx="6" width="200" x="40" y="56"></rect>
<text fill="#fff" font-weight="700" x="140" y="80">LangGraph</text>
<text fill="#fff" x="140" y="98">Multi-step, branching</text>
<text fill="#fff" x="140" y="112">conversation policies</text>
<rect fill="#27ae60" height="68" rx="6" width="200" x="260" y="56"></rect>
<text fill="#fff" font-weight="700" x="360" y="80">LlamaIndex chat</text>
<text fill="#fff" x="360" y="98">Chat over documents,</text>
<text fill="#fff" x="360" y="112">RAG-first applications</text>
<rect fill="#6a1b9a" height="68" rx="6" width="200" x="480" y="56"></rect>
<text fill="#fff" font-weight="700" x="580" y="80">OpenAI Assistants</text>
<text fill="#fff" x="580" y="98">Thin-client architecture,</text>
<text fill="#fff" x="580" y="112">OpenAI-only stack</text>
<rect fill="#a67c1a" height="68" rx="6" width="200" x="40" y="146"></rect>
<text fill="#fff" font-weight="700" x="140" y="170">Direct SDK + Zep</text>
<text fill="#fff" x="140" y="188">Code-first teams,</text>
<text fill="#fff" x="140" y="202">control over history</text>
<rect fill="#bf360c" height="68" rx="6" width="200" x="260" y="146"></rect>
<text fill="#fff" font-weight="700" x="360" y="170">Semantic Kernel</text>
<text fill="#fff" x="360" y="188">.NET shops,</text>
<text fill="#fff" x="360" y="202">Microsoft 365 integration</text>
<rect fill="#3498db" height="68" rx="6" width="200" x="480" y="146"></rect>
<text fill="#fff" font-weight="700" x="580" y="170">DSPy</text>
<text fill="#fff" x="580" y="188">Metric-driven prompts,</text>
<text fill="#fff" x="580" y="202">compile-not-author</text>
<rect fill="none" height="60" rx="6" stroke="#3498db" stroke-dasharray="4,3" stroke-width="1.5" width="640" x="40" y="240"></rect>
<text fill="#3498db" font-weight="700" text-anchor="middle" x="360" y="266">Most teams start with the framework matching their primary problem,</text>
<text fill="#3498db" text-anchor="middle" x="360" y="284">then add memory (Zep/Mem0), UI (Vercel AI SDK), and observability (Langfuse) on top.</text>
</g>
</svg>