<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Taxonomy of LLM evaluation metrics organized into three branches: intrinsic (perplexity, BPB, cross-entropy), reference-based (BLEU, ROUGE, BERTScore, exact match), and judge-based methods." role="img" style="font-family: sans-serif;" viewbox="0 0 750 380" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad4" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow1" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<rect fill="#1a1a2e" filter="url(#shadow1)" height="44" rx="22" width="250" x="250" y="10"></rect>
<text fill="white" font-size="14" font-weight="700" text-anchor="middle" x="375" y="37">LLM Evaluation Metrics</text>
<line stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="375" x2="375" y1="54" y2="80"></line>
<line stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="130" x2="620" y1="80" y2="80"></line>
<line stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="130" x2="130" y1="80" y2="100"></line>
<line stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="375" x2="375" y1="80" y2="100"></line>
<line stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="620" x2="620" y1="80" y2="100"></line>
<rect fill="#8e44ad" filter="url(#shadow1)" height="36" rx="8" width="180" x="40" y="100"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="130" y="123">Intrinsic</text>
<rect fill="#2980b9" filter="url(#shadow1)" height="36" rx="8" width="180" x="285" y="100"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="375" y="123">Reference-Based</text>
<rect fill="#27ae60" filter="url(#shadow1)" height="36" rx="8" width="180" x="530" y="100"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="620" y="123">Judge-Based</text>
<!-- Intrinsic items -->
<rect fill="#f0e6ff" height="30" rx="6" width="180" x="40" y="155"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="130" y="175">Perplexity</text>
<rect fill="#f0e6ff" height="30" rx="6" width="180" x="40" y="195"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="130" y="215">Bits-per-Byte (BPB)</text>
<rect fill="#f0e6ff" height="30" rx="6" width="180" x="40" y="235"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="130" y="255">Cross-Entropy Loss</text>
<!-- Reference items -->
<rect fill="#e8f4fd" height="30" rx="6" width="180" x="285" y="155"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="375" y="175">BLEU / ROUGE</text>
<rect fill="#e8f4fd" height="30" rx="6" width="180" x="285" y="195"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="375" y="215">BERTScore</text>
<rect fill="#e8f4fd" height="30" rx="6" width="180" x="285" y="235"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="375" y="255">METEOR / ChrF</text>
<rect fill="#e8f4fd" height="30" rx="6" width="180" x="285" y="275"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="375" y="295">Exact Match / F1</text>
<!-- Judge items -->
<rect fill="#e8f5e9" height="30" rx="6" width="180" x="530" y="155"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="620" y="175">LLM-as-Judge</text>
<rect fill="#e8f5e9" height="30" rx="6" width="180" x="530" y="195"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="620" y="215">Human Evaluation</text>
<rect fill="#e8f5e9" height="30" rx="6" width="180" x="530" y="235"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="620" y="255">Pairwise Comparison</text>
<rect fill="#e8f5e9" height="30" rx="6" width="180" x="530" y="275"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="620" y="295">Elo / Arena Rating</text>
<!-- Cost vs Quality axis -->
<line stroke="#ccc" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" x1="40" x2="710" y1="340" y2="340"></line>
<text fill="#888" font-size="11" x="40" y="365">Low cost, low validity</text>
<text fill="#888" font-size="11" text-anchor="end" x="710" y="365">High cost, high validity</text>
<text fill="#888" font-size="11" font-weight="600" text-anchor="middle" x="375" y="365">Cost vs. Validity Tradeoff →</text>
</svg>