<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="MCP four-primitive request / response sequence" role="img" viewbox="0 0 760 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="mcpSeqArrow" markerheight="10" markerwidth="10" orient="auto" refx="8" refy="3">
<path d="M0,0 L0,6 L8,3 z" fill="#3a4a7a"></path>
</marker>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="380" y="20">MCP four-primitive request / response sequence</text>
<g fill="#fff" font-size="11" font-weight="700">
<rect fill="#3a73a8" height="24" rx="4" width="130" x="30" y="34"></rect><text text-anchor="middle" x="95" y="51">Host (LLM)</text>
<rect fill="#d97706" height="24" rx="4" width="130" x="200" y="34"></rect><text text-anchor="middle" x="265" y="51">MCP Client</text>
<rect fill="#047857" height="24" rx="4" width="130" x="370" y="34"></rect><text text-anchor="middle" x="435" y="51">MCP Server</text>
<rect fill="#5e3b97" height="24" rx="4" width="190" x="540" y="34"></rect><text text-anchor="middle" x="635" y="51">Backing system / user</text>
</g>
<g stroke="#999" stroke-dasharray="3 3">
<line x1="95" x2="95" y1="58" y2="340"></line>
<line x1="265" x2="265" y1="58" y2="340"></line>
<line x1="435" x2="435" y1="58" y2="340"></line>
<line x1="635" x2="635" y1="58" y2="340"></line>
</g>
<g fill="#1a1a2e" font-size="10">
<text font-weight="700" x="20" y="80">Tools</text>
<line marker-end="url(#mcpSeqArrow)" stroke="#3a4a7a" stroke-width="1.5" x1="95" x2="430" y1="90" y2="90"></line>
<text text-anchor="middle" x="262" y="86">tools/call { name, arguments }</text>
<line marker-end="url(#mcpSeqArrow)" stroke="#047857" stroke-width="1.5" x1="435" x2="635" y1="105" y2="105"></line>
<text text-anchor="middle" x="535" y="101">execute(args)</text>
<line marker-end="url(#mcpSeqArrow)" stroke="#3a4a7a" stroke-width="1.5" x1="430" x2="95" y1="120" y2="120"></line>
<text text-anchor="middle" x="262" y="116">content: [TextContent | ImageContent]</text>
<text font-weight="700" x="20" y="148">Resources</text>
<rect fill="#3a4a7a" height="6" opacity="0.0" width="10" x="430" y="155"></rect>
<rect fill="#3a4a7a" height="6" opacity="0.0" width="10" x="90" y="170"></rect>
<rect fill="#3a4a7a" height="6" opacity="0.0" width="10" x="90" y="222"></rect>
<line marker-end="url(#mcpSeqArrow)" stroke="#3a4a7a" stroke-width="1.5" x1="95" x2="430" y1="158" y2="158"></line>
<text text-anchor="middle" x="262" y="154">resources/read { uri }</text>
<line marker-end="url(#mcpSeqArrow)" stroke="#3a4a7a" stroke-width="1.5" x1="430" x2="95" y1="173" y2="173"></line>
<text text-anchor="middle" x="262" y="169">contents: [{ uri, mimeType, text }]</text>
<text font-weight="700" x="20" y="200">Prompts</text>
<line marker-end="url(#mcpSeqArrow)" stroke="#5e3b97" stroke-width="1.5" x1="635" x2="100" y1="210" y2="210"></line>
<text text-anchor="middle" x="362" y="206">user picks slash command, host issues prompts/get { name, args }</text>
<line marker-end="url(#mcpSeqArrow)" stroke="#3a4a7a" stroke-width="1.5" x1="430" x2="95" y1="225" y2="225"></line>
<text text-anchor="middle" x="262" y="221">messages: [{ role, content }]</text>
<text font-weight="700" x="20" y="252">Sampling</text>
<line marker-end="url(#mcpSeqArrow)" stroke="#b03060" stroke-width="1.5" x1="430" x2="95" y1="262" y2="262"></line>
<text text-anchor="middle" x="262" y="258">sampling/createMessage (server-initiated)</text>
<line marker-end="url(#mcpSeqArrow)" stroke="#3a4a7a" stroke-width="1.5" x1="95" x2="430" y1="277" y2="277"></line>
<text text-anchor="middle" x="262" y="273">host approves, runs LLM, returns completion</text>
</g>
<text fill="#444" font-size="11" font-style="italic" text-anchor="middle" x="380" y="320">All four primitives use the same JSON-RPC 2.0 envelope; only the controller (who fires the request) differs.</text>
</g>
</svg>