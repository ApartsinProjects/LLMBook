<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Throughput-latency curve from AIPerf at six concurrency levels on Llama-3.1-70B" viewBox="-55 -11 935 451" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="440" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Throughput-latency curve: Llama-3.1-70B on H100 via AIPerf</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">From Code Fragment 57.4.2; six concurrency levels 1 to 64</text>
<g transform="translate(80,70)">
<line x1="0" y1="300" x2="720" y2="300" stroke="#1a1a2e" stroke-width="1.5"/>
<line x1="0" y1="0" x2="0" y2="300" stroke="#1a1a2e" stroke-width="1.5"/>
<line x1="720" y1="0" x2="720" y2="300" stroke="#1a1a2e" stroke-width="1.5"/>
<!-- y axis left: throughput -->
<g font-size="9" fill="#1f7a3a" text-anchor="end">
<text x="-6" y="304">0</text>
<text x="-6" y="237">1k</text><line x1="0" y1="234" x2="-3" y2="234" stroke="#1f7a3a"/>
<text x="-6" y="171">2k</text><line x1="0" y1="168" x2="-3" y2="168" stroke="#1f7a3a"/>
<text x="-6" y="105">3k</text><line x1="0" y1="102" x2="-3" y2="102" stroke="#1f7a3a"/>
<text x="-6" y="38">4k</text><line x1="0" y1="36" x2="-3" y2="36" stroke="#1f7a3a"/>
</g>
<text x="-50" y="150" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a" transform="rotate(-90 -50 150)">Throughput (tokens/s)</text>
<!-- y axis right: latency -->
<g font-size="9" fill="#7a2a2a" text-anchor="start">
<text x="726" y="304">0</text>
<text x="726" y="240">500</text><line x1="720" y1="237" x2="723" y2="237" stroke="#7a2a2a"/>
<text x="726" y="172">1000</text><line x1="720" y1="168" x2="723" y2="168" stroke="#7a2a2a"/>
<text x="726" y="105">1500</text><line x1="720" y1="102" x2="723" y2="102" stroke="#7a2a2a"/>
<text x="726" y="38">2100</text><line x1="720" y1="36" x2="723" y2="36" stroke="#7a2a2a"/>
</g>
<text x="770" y="150" font-size="11" font-weight="700" text-anchor="middle" fill="#7a2a2a" transform="rotate(90 770 150)">TTFT p99 (ms)</text>
<!-- x axis labels (concurrency) -->
<g font-size="9" fill="#5a4a3a" text-anchor="middle">
<text x="0" y="318">1</text>
<text x="144" y="318">4</text>
<text x="288" y="318">8</text>
<text x="432" y="318">16</text>
<text x="576" y="318">32</text>
<text x="720" y="318">64</text>
</g>
<text x="360" y="338" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">Concurrent requests</text>
<!-- throughput line -->
<!-- 245/3250 fraction of 4250 max; map by 245->283, 920->239, 1680->188, 2580/3100/3250 -->
<!-- map tokens/sec t to y = 300 - (t / 4250)*264 -->
<polyline points="0,284.8 144,242.8 288,196.6 432,139.7 576,107.4 720,98.0" fill="none" stroke="#1f7a3a" stroke-width="3"/>
<g fill="#1f7a3a">
<circle cx="0" cy="284.8" r="5"/><text x="0" y="276" font-size="9" font-weight="700" text-anchor="middle">245</text>
<circle cx="144" cy="242.8" r="5"/><text x="144" y="234" font-size="9" font-weight="700" text-anchor="middle">920</text>
<circle cx="288" cy="196.6" r="5"/><text x="288" y="188" font-size="9" font-weight="700" text-anchor="middle">1680</text>
<circle cx="432" cy="139.7" r="5"/><text x="432" y="131" font-size="9" font-weight="700" text-anchor="middle">2580</text>
<circle cx="576" cy="107.4" r="5"/><text x="576" y="99" font-size="9" font-weight="700" text-anchor="middle">3100</text>
<circle cx="720" cy="98.0" r="5"/><text x="720" y="89" font-size="9" font-weight="700" text-anchor="middle">3250</text>
</g>
<!-- latency line (dashed) -->
<!-- map ms l to y = 300 - (l/2100)*264 -->
<polyline points="0,293.5 144,288.1 288,277.4 432,247.2 576,176.8 720,35.9" fill="none" stroke="#7a2a2a" stroke-width="3" stroke-dasharray="6,3"/>
<g fill="#7a2a2a">
<circle cx="432" cy="247.2" r="5"/>
<circle cx="576" cy="176.8" r="5"/>
<circle cx="720" cy="35.9" r="5"/><text x="700" y="36" font-size="9" font-weight="700" text-anchor="end">2100ms</text>
</g>
<!-- 1-second SLA -->
<line x1="0" y1="174" x2="720" y2="174" stroke="#a67c1a" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="10" y="170" font-size="9" font-weight="700" fill="#a67c1a">1-second p99 SLA</text>
<!-- saturation marker -->
<line x1="576" y1="0" x2="576" y2="300" stroke="#1a1a2e" stroke-width="1" stroke-dasharray="2,2"/>
<text x="576" y="-6" font-size="9" font-weight="700" text-anchor="middle" fill="#1a1a2e">throughput plateau</text>
<text x="576" y="6" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">optimal operating point</text>
</g>
<g transform="translate(80,418)" font-size="10" fill="#1a1a2e">
<line x1="0" y1="0" x2="20" y2="0" stroke="#1f7a3a" stroke-width="3"/><text x="26" y="3">Throughput (left axis)</text>
<line x1="200" y1="0" x2="220" y2="0" stroke="#7a2a2a" stroke-width="3" stroke-dasharray="6,3"/><text x="226" y="3">TTFT p99 (right axis)</text>
</g>
</svg>