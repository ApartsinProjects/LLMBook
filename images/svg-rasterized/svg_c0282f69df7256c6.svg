<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="LlamaIndex query-engine architecture: a user question feeds a Retriever that pulls top-k nodes from a VectorStoreIndex, which then feed a Response Synthesizer (compact, refine, or tree_summarize) that produces the final answer." role="img" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
<rect fill="#f8f9fa" height="250" rx="10" stroke="#ddd" width="710" x="5" y="5"></rect>
<rect fill="#fff3e0" height="50" rx="6" stroke="#e65100" stroke-width="1.2" width="120" x="25" y="105"></rect>
<text fill="#e65100" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="85" y="135">User Query</text>
<line marker-end="url(#arr_li)" stroke="#666" stroke-width="1.5" x1="145" x2="190" y1="130" y2="130"></line>
<rect fill="#e3f2fd" height="50" rx="6" stroke="#1976d2" stroke-width="1.2" width="130" x="190" y="105"></rect>
<text fill="#1565c0" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="255" y="128">Retriever</text>
<text fill="#1565c0" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="255" y="145">similarity_top_k</text>
<line marker-end="url(#arr_li)" stroke="#666" stroke-width="1.5" x1="320" x2="365" y1="130" y2="130"></line>
<rect fill="#f3e5f5" height="80" rx="6" stroke="#7b1fa2" stroke-dasharray="3,2" stroke-width="1.2" width="150" x="365" y="90"></rect>
<text fill="#7b1fa2" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="440" y="108">VectorStoreIndex</text>
<text fill="#7b1fa2" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="440" y="125">SummaryIndex</text>
<text fill="#7b1fa2" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="440" y="140">TreeIndex</text>
<text fill="#7b1fa2" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="440" y="155">KeywordTableIndex</text>
<line marker-end="url(#arr_li)" stroke="#666" stroke-width="1.5" x1="515" x2="555" y1="130" y2="130"></line>
<rect fill="#e8f5e9" height="100" rx="6" stroke="#2e7d32" stroke-width="1.2" width="140" x="555" y="80"></rect>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="625" y="100">Response</text>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="625" y="115">Synthesizer</text>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="625" y="135">compact</text>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="625" y="150">refine</text>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="625" y="165">tree_summarize</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle" x="360" y="215">Query Engine = Retriever + Response Synthesizer (over an Index)</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="360" y="232">LlamaIndex routes nodes through the synthesizer to produce a grounded answer.</text>
<defs>
<marker id="arr_li" markerheight="6" markerwidth="6" orient="auto" refx="5" refy="3">
<path d="M0,0 L0,6 L6,3 z" fill="#666"></path>
</marker>
</defs>
</svg>