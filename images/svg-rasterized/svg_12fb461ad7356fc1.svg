<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Two boxes labeled Word2Vec and BERT, with example token-to-vector mappings showing static versus contextual representations, connected by an arrow" role="img" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
<rect x="20" y="40" width="240" height="140" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="6"/><text x="140" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">Word2Vec (Static)</text><text x="140" y="100" font-size="12" text-anchor="middle">bank -> [0.21, -0.07, ...]</text><text x="140" y="125" font-size="12" text-anchor="middle">(same vector everywhere)</text><text x="140" y="160" font-size="11" text-anchor="middle" fill="#555">one row per word</text><rect x="340" y="40" width="240" height="140" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="6"/><text x="460" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#bf360c">BERT (Contextual)</text><text x="460" y="100" font-size="12" text-anchor="middle">river bank -> [0.31, ...]</text><text x="460" y="125" font-size="12" text-anchor="middle">investment bank -> [0.42, ...]</text><text x="460" y="160" font-size="11" text-anchor="middle" fill="#555">one row per (word, context)</text><path d="M 270 110 L 330 110" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
</svg>