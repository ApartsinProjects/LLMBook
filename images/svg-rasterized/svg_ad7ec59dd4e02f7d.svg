<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Horizontal kappa scale from -0.2 to 1.0 with six color-coded bands labeled None, Slight, Fair, Moderate, Substantial, Almost Perfect. A red dot marks the publication-quality threshold at 0.6 above which substantial agreement is typically required for human evaluation results to be considered trustworthy" role="img" style="max-width:100%;height:auto;" viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter height="108%" id="kp4210shadow" width="108%" x="-4%" y="-4%">
<fedropshadow dx="1" dy="2" flood-opacity="0.18" stddeviation="1.4"></fedropshadow>
</filter>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif"><text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="380" y="22">Cohen's kappa: Landis and Koch interpretation bands</text>
<text fill="#4a5568" font-size="11" text-anchor="middle" x="380" y="40">Position your raters before trusting their labels for any conclusion.</text>
<g transform="translate(60, 70)">
<rect fill="#b91c1c" filter="url(#kp4210shadow)" height="40" rx="3" stroke="#7f1d1d" width="100" x="0" y="0"></rect>
<rect fill="#d97706" filter="url(#kp4210shadow)" height="40" rx="0" stroke="#9c4f00" width="100" x="100" y="0"></rect>
<rect fill="#eab308" filter="url(#kp4210shadow)" height="40" rx="0" stroke="#854d0e" width="100" x="200" y="0"></rect>
<rect fill="#0ea5e9" filter="url(#kp4210shadow)" height="40" rx="0" stroke="#0369a1" width="100" x="300" y="0"></rect>
<rect fill="#047857" filter="url(#kp4210shadow)" height="40" rx="0" stroke="#024c34" width="100" x="400" y="0"></rect>
<rect fill="#15803d" filter="url(#kp4210shadow)" height="40" rx="3" stroke="#14532d" width="100" x="500" y="0"></rect>
<g fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">
<text x="50" y="25">None</text>
<text x="150" y="25">Slight</text>
<text x="250" y="25">Fair</text>
<text x="350" y="25">Moderate</text>
<text x="450" y="25">Substantial</text>
<text x="550" y="25">Almost perfect</text>
</g>
<g fill="#1a1a2e" font-size="10" text-anchor="middle">
<text x="0" y="56">&lt; 0</text>
<text x="100" y="56">0.20</text>
<text x="200" y="56">0.40</text>
<text x="300" y="56">0.60</text>
<text x="400" y="56">0.80</text>
<text x="500" y="56">0.90</text>
<text x="600" y="56">1.00</text>
</g>
<g>
<circle cx="400" cy="20" fill="#fff" r="9" stroke="#b91c1c" stroke-width="2.5"></circle>
<line stroke="#b91c1c" stroke-dasharray="3,2" stroke-width="1.5" x1="400" x2="400" y1="-12" y2="9"></line>
<text fill="#b91c1c" font-size="11" font-weight="700" text-anchor="middle" x="400" y="-16">publication floor (kappa ≥ 0.6)</text>
</g>
<g fill="#4a5568" font-size="9" font-style="italic">
<text text-anchor="middle" x="50" y="86">raters disagree systematically</text>
<text text-anchor="middle" x="150" y="86">barely better than chance</text>
<text text-anchor="middle" x="250" y="86">unreliable headlines</text>
<text text-anchor="middle" x="350" y="86">cautious conclusions only</text>
<text text-anchor="middle" x="450" y="86">trustworthy aggregate scores</text>
<text text-anchor="middle" x="550" y="86">near-deterministic task</text>
</g>
</g>
</g>
</svg>