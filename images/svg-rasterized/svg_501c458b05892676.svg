<rect fill="url(#grad_1bbc3d_fff8e1)" height="25" rx="5" stroke="#f9a825" stroke-linecap="round" width="320" x="200" y="140"></rect>
<text fill="#f57f17" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="360" y="157">Metadata enrichment: source, page, section, date, permissions</text>
</svg>