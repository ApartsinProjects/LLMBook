<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Document ingestion pipeline for RAG: Load (PDF, DOCX) into Parse (extract text) into Clean (normalize) into Chunk (split text) into Embed (vectorize) into Index (store in vector DB)." role="img" viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_1bbc3d_e0f2f1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#efffff"></stop><stop offset="100%" stop-color="#e0f2f1"></stop></lineargradient>
<lineargradient id="grad_1bbc3d_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#e3f2fd"></stop></lineargradient>
<lineargradient id="grad_1bbc3d_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#f3e5f5"></stop></lineargradient>
<lineargradient id="grad_1bbc3d_f8f9fa" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f8f9fa"></stop></lineargradient>
<lineargradient id="grad_1bbc3d_fce4ec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3fb"></stop><stop offset="100%" stop-color="#fce4ec"></stop></lineargradient>
<lineargradient id="grad_1bbc3d_fff8e1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff0"></stop><stop offset="100%" stop-color="#fff8e1"></stop></lineargradient>
<lineargradient id="grad_1bbc3d_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<filter height="115%" id="shadow_1bbc3d" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<rect fill="url(#grad_1bbc3d_f8f9fa)" filter="url(#shadow_1bbc3d)" height="170" rx="10" stroke="#ddd" stroke-linecap="round" width="710" x="5" y="5"></rect>
<!-- Stage boxes -->
<rect fill="url(#grad_1bbc3d_e3f2fd)" height="50" rx="6" stroke="#1976d2" stroke-linecap="round" width="85" x="15" y="50"></rect>
<text fill="#1565c0" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="57" y="72">Load</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="57" y="88">PDF, DOCX</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="16" text-anchor="middle" x="110" y="80">→</text>
<rect fill="url(#grad_1bbc3d_fce4ec)" height="50" rx="6" stroke="#c62828" stroke-linecap="round" width="85" x="120" y="50"></rect>
<text fill="#c62828" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="162" y="72">Parse</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="162" y="88">Extract text</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="16" text-anchor="middle" x="215" y="80">→</text>
<rect fill="url(#grad_1bbc3d_fff3e0)" height="50" rx="6" stroke="#e65100" stroke-linecap="round" width="85" x="225" y="50"></rect>
<text fill="#e65100" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="267" y="72">Clean</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="267" y="88">Normalize</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="16" text-anchor="middle" x="320" y="80">→</text>
<rect fill="#e8f5e9" height="50" rx="6" stroke="#388e3c" stroke-linecap="round" width="85" x="330" y="50"></rect>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="372" y="72">Chunk</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="372" y="88">Split text</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="16" text-anchor="middle" x="425" y="80">→</text>
<rect fill="url(#grad_1bbc3d_f3e5f5)" height="50" rx="6" stroke="#7b1fa2" stroke-linecap="round" width="85" x="435" y="50"></rect>
<text fill="#7b1fa2" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="477" y="72">Embed</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="477" y="88">Vectorize</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="16" text-anchor="middle" x="530" y="80">→</text>
<rect fill="url(#grad_1bbc3d_e0f2f1)" height="50" rx="6" stroke="#00695c" stroke-linecap="round" width="85" x="540" y="50"></rect>
<text fill="#00695c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="582" y="72">Index</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="582" y="88">Store in DB</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="16" text-anchor="middle" x="635" y="80">→</text>
<rect fill="#1a1a2e" height="50" rx="6" width="60" x="645" y="50"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="675" y="72">Vector</text>
<text fill="#ccc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="675" y="88">DB</text>
<!-- Bottom annotation -->
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="360" y="130">Each stage introduces potential failure modes that compound downstream</text>
