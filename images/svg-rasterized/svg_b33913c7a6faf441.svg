<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three hallucination detection methods side by side: Self-Consistency (sample N high-temperature responses, low agreement signals hallucination); Citation Verification (verify each claim against source docs, unsupported claims are extrinsic hallucinations); NLI-Based (entailment between source as premise and output as hypothesis, contradiction is intrinsic hallucination)." role="img" style="font-family: sans-serif;" viewBox="0 -11 720 291" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad3" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow1" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<rect fill="#e8f5e9" filter="url(#shadow1)" height="210" rx="12" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="210" x="20" y="50"></rect>
<text fill="#27ae60" font-size="14" font-weight="700" text-anchor="middle" x="125" y="78">Self-Consistency</text>
<text fill="#333" font-size="12" text-anchor="middle" x="125" y="105">Sample N responses</text>
<text fill="#333" font-size="12" text-anchor="middle" x="125" y="125">at high temperature</text>
<text fill="#333" font-size="12" text-anchor="middle" x="125" y="155">Check agreement</text>
<text fill="#333" font-size="12" text-anchor="middle" x="125" y="175">across samples</text>
<text fill="#666" font-size="11" text-anchor="middle" x="125" y="210">Low agreement =</text>
<text fill="#666" font-size="11" text-anchor="middle" x="125" y="228">likely hallucination</text>
<rect fill="#e8f4fd" filter="url(#shadow1)" height="210" rx="12" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="210" x="255" y="50"></rect>
<text fill="#3498db" font-size="14" font-weight="700" text-anchor="middle" x="360" y="78">Citation Verification</text>
<text fill="#333" font-size="12" text-anchor="middle" x="360" y="105">Extract cited claims</text>
<text fill="#333" font-size="12" text-anchor="middle" x="360" y="125">from LLM output</text>
<text fill="#333" font-size="12" text-anchor="middle" x="360" y="155">Verify each claim</text>
<text fill="#333" font-size="12" text-anchor="middle" x="360" y="175">against source docs</text>
<text fill="#666" font-size="11" text-anchor="middle" x="360" y="210">Unsupported claims =</text>
<text fill="#666" font-size="11" text-anchor="middle" x="360" y="228">extrinsic hallucination</text>
<rect fill="#f0e6ff" filter="url(#shadow1)" height="210" rx="12" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="210" x="490" y="50"></rect>
<text fill="#8e44ad" font-size="14" font-weight="700" text-anchor="middle" x="595" y="78">NLI-Based</text>
<text fill="#333" font-size="12" text-anchor="middle" x="595" y="105">Use NLI model to</text>
<text fill="#333" font-size="12" text-anchor="middle" x="595" y="125">check entailment</text>
<text fill="#333" font-size="12" text-anchor="middle" x="595" y="155">Source = premise;</text>
<text fill="#333" font-size="12" text-anchor="middle" x="595" y="175">Output = hypothesis</text>
<text fill="#666" font-size="11" text-anchor="middle" x="595" y="210">Contradiction =</text>
<text fill="#666" font-size="11" text-anchor="middle" x="595" y="228">intrinsic hallucination</text>
</svg>