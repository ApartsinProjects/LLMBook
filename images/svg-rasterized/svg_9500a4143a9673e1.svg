<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="LoRA decomposes the weight update into two low-rank matrices: instead of training a full d-by-k matrix Delta-W with d times k parameters, LoRA trains B (d by r) and A (r by k) with r much smaller than d and k, giving only r times d plus k parameters." role="img" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="loraArr" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"></path></marker></defs>
<text fill="#222" font-size="14" font-weight="700" text-anchor="middle" x="380" y="22">LoRA: low-rank weight update W' = W + B A, with r &lt;&lt; min(d, k)</text>
<g font-size="11" text-anchor="middle">
<rect fill="#e0e0e0" height="160" stroke="#616161" stroke-width="1.4" width="160" x="40" y="60"></rect>
<text fill="#333" font-weight="700" x="120" y="50">W  (frozen)</text>
<text fill="#333" x="120" y="145">d × k</text>
<text fill="#777" x="120" y="240">(no gradient)</text>
<text fill="#222" font-size="22" font-weight="700" x="240" y="145">+</text>
<rect fill="#ffe0b2" height="160" stroke="#e65100" stroke-dasharray="6 4" stroke-width="1.4" width="160" x="280" y="60"></rect>
<text fill="#e65100" font-weight="700" x="360" y="50">ΔW</text>
<text fill="#e65100" x="360" y="145">d × k  (NOT stored)</text>
<text fill="#999" x="360" y="240">would need d·k params</text>
<text fill="#222" font-size="22" font-weight="700" x="480" y="145">=</text>
<rect fill="#c8e6c9" height="120" stroke="#2e7d32" stroke-width="1.4" width="60" x="520" y="80"></rect>
<text fill="#1b5e20" font-weight="700" x="550" y="70">B</text>
<text fill="#1b5e20" x="550" y="145">d × r</text>
<text fill="#222" font-size="18" font-weight="700" x="600" y="145">×</text>
<rect fill="#bbdefb" height="30" stroke="#0d47a1" stroke-width="1.4" width="120" x="625" y="125"></rect>
<text fill="#0d47a1" font-weight="700" x="685" y="115">A</text>
<text fill="#0d47a1" x="685" y="145">r × k</text>
<text fill="#1565c0" x="685" y="240">trainable: r(d + k) params</text>
<text fill="#666" font-size="11" x="380" y="255">Example: d = k = 4096, r = 16  →  full ΔW has 16.7M params; LoRA stores only 131,072.</text>
</g>
</svg>