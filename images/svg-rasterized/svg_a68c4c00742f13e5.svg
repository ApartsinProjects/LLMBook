<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="MTEB: 8 task families, 58 datasets, 112 languages" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="220" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="bold" text-anchor="middle" x="360" y="22">MTEB: 8 task families, 58 datasets, 112 languages</text>
<g font-size="11" text-anchor="middle">
<rect fill="#fff3e0" height="55" rx="6" stroke="#e67e22" width="150" x="20" y="50"></rect><text fill="#1a1a2e" x="95" y="72">Retrieval</text><text fill="#555" x="95" y="90">NDCG@10</text>
<rect fill="#e3f2fd" height="55" rx="6" stroke="#1976d2" width="150" x="190" y="50"></rect><text fill="#1a1a2e" x="265" y="72">Reranking</text><text fill="#555" x="265" y="90">MAP</text>
<rect fill="#e8f5e9" height="55" rx="6" stroke="#2e7d32" width="150" x="360" y="50"></rect><text fill="#1a1a2e" x="435" y="72">Clustering</text><text fill="#555" x="435" y="90">V-measure</text>
<rect fill="#fce4ec" height="55" rx="6" stroke="#c2185b" width="170" x="530" y="50"></rect><text fill="#1a1a2e" x="615" y="72">Classification</text><text fill="#555" x="615" y="90">Accuracy</text>
<rect fill="#f3e5f5" height="55" rx="6" stroke="#7b1fa2" width="150" x="20" y="115"></rect><text fill="#1a1a2e" x="95" y="137">Pair classification</text><text fill="#555" x="95" y="155">AP</text>
<rect fill="#fffde7" height="55" rx="6" stroke="#f9a825" width="150" x="190" y="115"></rect><text fill="#1a1a2e" x="265" y="137">STS (incl. STSB)</text><text fill="#555" x="265" y="155">Spearman</text>
<rect fill="#e0f7fa" height="55" rx="6" stroke="#00838f" width="150" x="360" y="115"></rect><text fill="#1a1a2e" x="435" y="137">Summarization</text><text fill="#555" x="435" y="155">Spearman</text>
<rect fill="#ede7f6" height="55" rx="6" stroke="#4527a0" width="170" x="530" y="115"></rect><text fill="#1a1a2e" x="615" y="137">Bitext mining</text><text fill="#555" x="615" y="155">F1</text>
</g>
<text fill="#555" font-size="11" text-anchor="middle" x="360" y="200">Top-line MTEB = mean of the 8 family-level means (equal weight).</text>
</svg>