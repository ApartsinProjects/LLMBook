<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="The 12x cost spread for the same 10M-document Llama-3-70B classification job" viewBox="-5 0 885 420" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="420" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Same 20 billion tokens, three workload categories, 12x cost spread</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">10M &#x00D7; 2000-token docs through Llama-3-70B</text>
<g transform="translate(80,80)">
<line x1="0" y1="270" x2="700" y2="270" stroke="#1a1a2e" stroke-width="1.5"/>
<g font-size="9" fill="#5a4a3a" text-anchor="middle">
<text x="0" y="290">$0</text><line x1="0" y1="266" x2="0" y2="270" stroke="#1a1a2e"/>
<text x="116" y="290">$1k</text><line x1="116" y1="266" x2="116" y2="270" stroke="#1a1a2e"/>
<text x="232" y="290">$2k</text><line x1="232" y1="266" x2="232" y2="270" stroke="#1a1a2e"/>
<text x="348" y="290">$3k</text><line x1="348" y1="266" x2="348" y2="270" stroke="#1a1a2e"/>
<text x="464" y="290">$4k</text><line x1="464" y1="266" x2="464" y2="270" stroke="#1a1a2e"/>
<text x="580" y="290">$5k</text><line x1="580" y1="266" x2="580" y2="270" stroke="#1a1a2e"/>
<text x="667" y="290">$5.8k</text><line x1="667" y1="266" x2="667" y2="270" stroke="#1a1a2e"/>
</g>
<text x="350" y="310" font-size="10" font-style="italic" text-anchor="middle" fill="#1a1a2e">Total job cost</text>
<!-- Bar 1: Online Together AI -->
<rect x="0" y="50" width="556" height="48" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="2"/>
<text x="278" y="68" font-size="11" font-weight="700" text-anchor="middle" fill="#7a2a2a">ONLINE inference (Together AI, on-demand H100)</text>
<text x="278" y="84" font-size="9" text-anchor="middle" fill="#1a1a2e">$0.88 / 1M tokens, sub-100 ms target, 9-hour wallclock</text>
<text x="568" y="80" font-size="13" font-weight="700" fill="#7a2a2a">$4,800</text>
<text x="568" y="94" font-size="9" font-style="italic" fill="#7a2a2a">12.0&#x00D7;</text>
<!-- Bar 2: Anthropic Batch -->
<rect x="0" y="120" width="278" height="48" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="139" y="138" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">BATCH (Anthropic Message Batches API)</text>
<text x="139" y="154" font-size="9" text-anchor="middle" fill="#1a1a2e">50% discount, 24-hour SLA</text>
<text x="290" y="150" font-size="13" font-weight="700" fill="#a67c1a">$2,400</text>
<text x="290" y="164" font-size="9" font-style="italic" fill="#a67c1a">6.0&#x00D7;</text>
<!-- Bar 3: Owned cluster -->
<rect x="0" y="190" width="46" height="48" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="100" y="208" font-size="11" font-weight="700" text-anchor="start" fill="#1f7a3a">SCHEDULED (owned H100 cluster, off-peak)</text>
<text x="100" y="224" font-size="9" text-anchor="start" fill="#1a1a2e">amortized 6-month capex; incremental GPU-hours only</text>
<text x="58" y="220" font-size="13" font-weight="700" fill="#1f7a3a">$400</text>
<text x="58" y="234" font-size="9" font-style="italic" fill="#1f7a3a">1.0&#x00D7;</text>
<!-- Annotation -->
<g transform="translate(580,170)">
<rect x="0" y="8" width="120" height="80" rx="4" fill="#1a1a2e"/>
<text x="60" y="20" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">The category</text>
<text x="60" y="36" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">often matters</text>
<text x="60" y="52" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">more than the</text>
<text x="60" y="68" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">model.</text>
</g>
</g>
</svg>