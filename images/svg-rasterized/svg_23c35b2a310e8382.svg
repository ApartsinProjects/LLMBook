<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-labelledby="fig621-title fig621-desc" role="img" style="max-width:100%; height:auto; font-family:system-ui, sans-serif;" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" aria-label="Two pretraining objectives at the token level. Causal language modeling (left) predicts the next token from prior tokens only, the natural setup for autoregressive generation. Masked language modeling (right) hides random tokens and predicts them using bidirectional context, the natural setup for representation learning. Both objectives use the same Transformer backbone; only the attention mask and the loss differ.">
<title id="fig621-title">CLM versus MLM training objectives</title>
<desc id="fig621-desc">Two side-by-side token-sequence diagrams. The left panel shows causal language modeling (CLM): the model sees only the previous tokens and predicts the next one, with a question mark on the rightmost position. The right panel shows masked language modeling (MLM): some middle tokens are replaced by [MASK], and the model uses bidirectional context (both left and right neighbors) to predict the masked tokens.</desc>
<defs>
<marker id="f621-arrow" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M0,0 L10,5 L0,10 z" fill="#555"></path>
</marker>
</defs>
<!-- ================== LEFT PANEL: CLM ================== -->
<g transform="translate(20, 0)">
<text fill="#1565c0" font-size="16" font-weight="700" text-anchor="middle" x="200" y="28">
      Causal LM (GPT-style)
    </text>
<text fill="#555" font-size="12" font-style="italic" text-anchor="middle" x="200" y="50">
      predict the next token from prior tokens only
    </text>
<!-- Token boxes: "The", "cat", "sat", "on", "the", "?" -->
<g font-size="14" text-anchor="middle">
<rect fill="#e3f2fd" height="44" rx="6" stroke="#1565c0" stroke-width="2" width="60" x="20" y="80"></rect>
<text fill="#0d47a1" x="50" y="108">The</text>
<rect fill="#e3f2fd" height="44" rx="6" stroke="#1565c0" stroke-width="2" width="60" x="90" y="80"></rect>
<text fill="#0d47a1" x="120" y="108">cat</text>
<rect fill="#e3f2fd" height="44" rx="6" stroke="#1565c0" stroke-width="2" width="60" x="160" y="80"></rect>
<text fill="#0d47a1" x="190" y="108">sat</text>
<rect fill="#e3f2fd" height="44" rx="6" stroke="#1565c0" stroke-width="2" width="60" x="230" y="80"></rect>
<text fill="#0d47a1" x="260" y="108">on</text>
<rect fill="#e3f2fd" height="44" rx="6" stroke="#1565c0" stroke-width="2" width="60" x="300" y="80"></rect>
<text fill="#0d47a1" x="330" y="108">the</text>
<!-- Predicted slot -->
<rect fill="#fff3e0" height="44" rx="6" stroke="#e65100" stroke-dasharray="4 3" stroke-width="2.5" width="60" x="370" y="80"></rect>
<text fill="#bf360c" font-size="18" font-weight="700" x="400" y="110">?</text>
</g>
<!-- Arrows from prior tokens to the "?" slot -->
<g fill="none" stroke="#1565c0" stroke-width="1.5">
<path d="M 50 80 C 50 60, 400 60, 400 80" marker-end="url(#f621-arrow)"></path>
<path d="M 120 80 C 120 64, 400 64, 400 80" marker-end="url(#f621-arrow)"></path>
<path d="M 190 80 C 190 68, 400 68, 400 80" marker-end="url(#f621-arrow)"></path>
<path d="M 260 80 C 260 72, 400 72, 400 80" marker-end="url(#f621-arrow)"></path>
<path d="M 330 78 L 370 80" marker-end="url(#f621-arrow)"></path>
</g>
<!-- Loss label -->
<text fill="#333" font-size="13" text-anchor="middle" x="200" y="170">
<tspan font-style="italic">Loss:</tspan> minimize -log P(mat | The, cat, sat, on, the)
    </text>
<text fill="#666" font-size="11" text-anchor="middle" x="200" y="195">
      Each position predicts ONE next token from the left.
    </text>
</g>
<!-- Vertical divider -->
<line stroke="#ccc" stroke-dasharray="4 4" stroke-width="1.5" x1="455" x2="455" y1="60" y2="260"></line>
<!-- ================== RIGHT PANEL: MLM ================== -->
<g transform="translate(470, 0)">
<text fill="#6a1b9a" font-size="16" font-weight="700" text-anchor="middle" x="200" y="28">
      Masked LM (BERT-style)
    </text>
<text fill="#555" font-size="12" font-style="italic" text-anchor="middle" x="200" y="50">
      predict masked tokens from full bidirectional context
    </text>
<!-- Token boxes: "The", "[MASK]", "sat", "[MASK]", "the", "mat" -->
<g font-size="14" text-anchor="middle">
<rect fill="#f3e5f5" height="44" rx="6" stroke="#6a1b9a" stroke-width="2" width="60" x="20" y="80"></rect>
<text fill="#4a148c" x="50" y="108">The</text>
<rect fill="#fff3e0" height="44" rx="6" stroke="#e65100" stroke-dasharray="4 3" stroke-width="2.5" width="80" x="90" y="80"></rect>
<text fill="#bf360c" font-size="12" font-weight="700" x="130" y="108">[MASK]</text>
<rect fill="#f3e5f5" height="44" rx="6" stroke="#6a1b9a" stroke-width="2" width="60" x="180" y="80"></rect>
<text fill="#4a148c" x="210" y="108">sat</text>
<rect fill="#fff3e0" height="44" rx="6" stroke="#e65100" stroke-dasharray="4 3" stroke-width="2.5" width="80" x="250" y="80"></rect>
<text fill="#bf360c" font-size="12" font-weight="700" x="290" y="108">[MASK]</text>
<rect fill="#f3e5f5" height="44" rx="6" stroke="#6a1b9a" stroke-width="2" width="60" x="340" y="80"></rect>
<text fill="#4a148c" x="370" y="108">mat</text>
</g>
<!-- Bidirectional context arrows: both left and right inform each mask -->
<g fill="none" stroke="#6a1b9a" stroke-width="1.5">
<!-- Into first [MASK] at x=130 -->
<path d="M 50 80 C 50 62, 130 62, 130 80" marker-end="url(#f621-arrow)"></path>
<path d="M 210 80 C 210 62, 130 62, 130 80" marker-end="url(#f621-arrow)"></path>
<!-- Into second [MASK] at x=290 -->
<path d="M 210 80 C 210 64, 290 64, 290 80" marker-end="url(#f621-arrow)"></path>
<path d="M 370 80 C 370 64, 290 64, 290 80" marker-end="url(#f621-arrow)"></path>
</g>
<!-- Loss label -->
<text fill="#333" font-size="13" text-anchor="middle" x="200" y="170">
<tspan font-style="italic">Loss:</tspan> minimize -log P(cat | context) - log P(on | context)
    </text>
<text fill="#666" font-size="11" text-anchor="middle" x="200" y="195">
      Only masked positions contribute; context flows both ways.
    </text>
</g>
<!-- Bottom-of-figure summary line spanning both panels -->
<line stroke="#ddd" stroke-width="1" x1="20" x2="880" y1="240" y2="240"></line>
<text fill="#444" font-size="12" text-anchor="middle" x="450" y="265">
<tspan font-weight="700">Same architecture, different mask:</tspan>
    CLM uses a triangular mask (no future tokens);
    MLM uses no causal mask and predicts only the [MASK]ed positions.
  </text>
<text fill="#666" font-size="11" font-style="italic" text-anchor="middle" x="450" y="288">
    GPT, Llama, Claude family = CLM. BERT, RoBERTa, DeBERTa family = MLM.
  </text>
</svg>