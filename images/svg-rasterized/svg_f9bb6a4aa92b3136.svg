<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="LLM CI/CD pipeline: git push triggers progressive stages from fast mocked unit tests (5s) to promptfoo eval with real APIs (2min) to red-team safety tests (5min); each stage gates the next before deploy." role="img" style="font-family: sans-serif;" viewBox="0 -9 750 229" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow4c" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
<marker id="arr4c" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><path d="M0,0 L8,3 L0,6 Z" fill="#999"></path></marker>
</defs>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="375.0" x2="362.8" y1="26.0" y2="48.0"></line>
<rect fill="#1a1a2e" filter="url(#shadow4c)" height="60" rx="8" width="110" x="10" y="50"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="65" y="74">Git Push</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="65" y="92">Prompt change</text>
<line marker-end="url(#arr4c)" stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="120" x2="145" y1="80" y2="80"></line>
<rect fill="#27ae60" filter="url(#shadow4c)" height="60" rx="8" width="120" x="145" y="50"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="205" y="74">Unit Tests</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="205" y="92">Mocked (5 sec)</text>
<line marker-end="url(#arr4c)" stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="265" x2="290" y1="80" y2="80"></line>
<rect fill="#f39c12" filter="url(#shadow4c)" height="60" rx="8" width="120" x="290" y="50"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="350" y="74">promptfoo Eval</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="350" y="92">Real API (2 min)</text>
<line marker-end="url(#arr4c)" stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="410" x2="435" y1="80" y2="80"></line>
<rect fill="#e74c3c" filter="url(#shadow4c)" height="60" rx="8" width="120" x="435" y="50"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="495" y="74">Safety Tests</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="495" y="92">Red team (5 min)</text>
<line marker-end="url(#arr4c)" stroke="#999" stroke-linecap="round" stroke-width="1.5" x1="555" x2="580" y1="80" y2="80"></line>
<rect fill="#2980b9" filter="url(#shadow4c)" height="60" rx="8" width="110" x="580" y="50"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="635" y="74">Deploy</text>
<text fill="#ccc" font-size="11" text-anchor="middle" x="635" y="92">If all pass</text>
<text fill="#666" font-size="11" text-anchor="middle" x="65" y="132">Trigger</text>
<text fill="#27ae60" font-size="11" text-anchor="middle" x="205" y="132">Fast</text>
<text fill="#f39c12" font-size="11" text-anchor="middle" x="350" y="132">Medium</text>
<text fill="#e74c3c" font-size="11" text-anchor="middle" x="495" y="132">Slow</text>
<text fill="#2980b9" font-size="11" text-anchor="middle" x="635" y="132">Release</text>
<text fill="#888" font-size="11" text-anchor="middle" x="375" y="170">Each stage gates the next. Failures block deployment and notify the team.</text>
</svg>