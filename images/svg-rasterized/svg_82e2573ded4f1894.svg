<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Residual stream as a horizontal blue highway; attention and FFN sub-layers branch down, compute, and merge back additively via plus nodes" aria-labelledby="fig416-title fig416-desc" role="img" style="max-width:100%; height:auto;" viewBox="0 0 920 380" xmlns="http://www.w3.org/2000/svg">
<title id="fig416-title">The residual stream as a communication highway</title>
<desc id="fig416-desc">A horizontal residual stream runs across the top. Two sub-layers (Attention, FFN) each branch downward from the stream, perform their computation, and merge their output back into the stream via a plus node. This shows that each sub-layer reads from and writes additively to a shared vector, rather than transforming a single hidden state in series.</desc>
<defs>
<marker id="fig416-arrow" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M0,0 L10,5 L0,10 z" fill="#444"></path>
</marker>
<marker id="fig416-arrow-blue" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M0,0 L10,5 L0,10 z" fill="#1565c0"></path>
</marker>
</defs>
<!-- THE RESIDUAL STREAM (horizontal highway) -->
<line stroke="#1565c0" stroke-linecap="round" stroke-width="6" x1="20" x2="900" y1="80" y2="80"></line>
<text fill="#1565c0" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="460" y="40">Residual stream (shared vector x)</text>
<text fill="#555" font-family="sans-serif" font-size="13" font-style="italic" text-anchor="middle" x="460" y="62">each sub-layer reads from and writes additively into this stream</text>
<!-- INPUT (left edge) -->
<rect fill="#e3f2fd" height="44" rx="6" stroke="#1565c0" stroke-width="2" width="100" x="20" y="100"></rect>
<text fill="#0d47a1" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="70" y="127">x_embed</text>
<line marker-end="url(#fig416-arrow-blue)" stroke="#1565c0" stroke-width="2" x1="70" x2="70" y1="100" y2="83"></line>
<!-- BLOCK 1: ATTENTION -->
<!-- Branch down -->
<line marker-end="url(#fig416-arrow)" stroke="#6a1b9a" stroke-width="2" x1="240" x2="240" y1="83" y2="170"></line>
<text fill="#6a1b9a" font-family="sans-serif" font-size="11" text-anchor="end" x="222" y="110">read x</text>
<!-- Sub-layer box -->
<rect fill="#f3e5f5" height="56" rx="6" stroke="#6a1b9a" stroke-width="2" width="140" x="180" y="170"></rect>
<text fill="#4a148c" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="250" y="194">Attention</text>
<text fill="#6a1b9a" font-family="sans-serif" font-size="11" text-anchor="middle" x="250" y="214">Attn(x)</text>
<!-- Merge back up to + -->
<line stroke="none" x1="250" x2="250" y1="170" y2="170"></line>
<path d="M 250 226 L 250 250 L 320 250 L 320 100" fill="none" marker-end="url(#fig416-arrow)" stroke="#6a1b9a" stroke-width="2"></path>
<text fill="#6a1b9a" font-family="sans-serif" font-size="11" text-anchor="start" x="335" y="180">write Attn(x)</text>
<!-- + node on the stream -->
<circle cx="320" cy="80" fill="#fff" r="14" stroke="#6a1b9a" stroke-width="2.5"></circle>
<text fill="#6a1b9a" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="320" y="86">+</text>
<text fill="#6a1b9a" font-family="sans-serif" font-size="11" text-anchor="middle" x="320" y="20">x ← x + Attn(x)</text>
<!-- BLOCK 2: FFN -->
<line marker-end="url(#fig416-arrow)" stroke="#e65100" stroke-width="2" x1="500" x2="500" y1="83" y2="170"></line>
<text fill="#e65100" font-family="sans-serif" font-size="11" text-anchor="end" x="482" y="110">read x</text>
<rect fill="#fff3e0" height="56" rx="6" stroke="#e65100" stroke-width="2" width="140" x="440" y="170"></rect>
<text fill="#bf360c" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="510" y="194">FFN</text>
<text fill="#e65100" font-family="sans-serif" font-size="11" text-anchor="middle" x="510" y="214">FFN(x)</text>
<path d="M 510 226 L 510 250 L 580 250 L 580 100" fill="none" marker-end="url(#fig416-arrow)" stroke="#e65100" stroke-width="2"></path>
<text fill="#e65100" font-family="sans-serif" font-size="11" text-anchor="start" x="595" y="180">write FFN(x)</text>
<circle cx="580" cy="80" fill="#fff" r="14" stroke="#e65100" stroke-width="2.5"></circle>
<text fill="#e65100" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="580" y="86">+</text>
<text fill="#e65100" font-family="sans-serif" font-size="11" text-anchor="middle" x="580" y="20">x ← x + FFN(x)</text>
<!-- Ellipsis showing more layers -->
<text fill="#777" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="710" y="86">. . .</text>
<text fill="#777" font-family="sans-serif" font-size="11" font-style="italic" text-anchor="middle" x="710" y="115">N more blocks</text>
<!-- OUTPUT (right edge) -->
<rect fill="#e8f5e9" height="44" rx="6" stroke="#2e7d32" stroke-width="2" width="100" x="800" y="100"></rect>
<text fill="#1b5e20" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="850" y="127">Output</text>
<line marker-end="url(#fig416-arrow)" stroke="#2e7d32" stroke-width="2" x1="850" x2="850" y1="83" y2="100"></line>
<!-- LEGEND -->
<text fill="#333" font-family="sans-serif" font-size="13" font-weight="bold" x="20" y="290">Reading the diagram:</text>
<text fill="#444" font-family="sans-serif" font-size="12" x="20" y="310">• The blue highway is the residual stream, a single shared vector x that flows from input to output.</text>
<text fill="#444" font-family="sans-serif" font-size="12" x="20" y="328">• Each sub-layer (Attention, FFN) <tspan font-style="italic">branches down</tspan>, computes its function on x, then <tspan font-style="italic">merges back up</tspan>: the new x is x + sub-layer(x).</text>
<text fill="#444" font-family="sans-serif" font-size="12" x="20" y="346">• The stream itself is never replaced, sub-layers only ever <tspan font-weight="bold">add</tspan> to it.</text>
<text fill="#444" font-family="sans-serif" font-size="12" x="20" y="362">   This is what makes the residual stream a "communication channel" between distant layers.</text>
</svg>