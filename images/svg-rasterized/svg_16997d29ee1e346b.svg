<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="TinyGPT pretraining pipeline end-to-end on a laptop GPU" viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="360" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">TinyGPT pretraining pipeline: ~10M params on WikiText-103, ~90 min on one GPU</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">The same flow that drives nanoGPT (Karpathy) and the figures in Chapter 6</text>
<g font-size="10">
<g transform="translate(20,75)">
<rect width="140" height="220" rx="8" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="70" y="22" font-weight="700" text-anchor="middle" fill="#3d4d8a">1. Data</text>
<text x="70" y="48" text-anchor="middle" fill="#1a1a2e">WikiText-103</text>
<text x="70" y="64" text-anchor="middle" fill="#1a1a2e">slice (~100MB)</text>
<text x="70" y="88" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">stream from disk</text>
<text x="70" y="118" text-anchor="middle" fill="#1a1a2e">Tokenizer:</text>
<text x="70" y="134" text-anchor="middle" fill="#1a1a2e">HF BPE, 8k vocab</text>
<text x="70" y="158" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">trained on corpus</text>
<text x="70" y="188" text-anchor="middle" fill="#1a1a2e">DataLoader:</text>
<text x="70" y="204" text-anchor="middle" fill="#1a1a2e">batch 32, ctx 256</text>
</g>
<g transform="translate(180,75)">
<rect width="160" height="220" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="80" y="22" font-weight="700" text-anchor="middle" fill="#a67c1a">2. Model</text>
<text x="80" y="48" text-anchor="middle" fill="#1a1a2e">TinyGPT (~10M)</text>
<text x="80" y="68" font-size="9" text-anchor="middle" fill="#5a4a3a">6 layers, 6 heads</text>
<text x="80" y="82" font-size="9" text-anchor="middle" fill="#5a4a3a">d_model=192</text>
<text x="80" y="106" text-anchor="middle" fill="#1a1a2e">Embedding</text>
<text x="80" y="122" text-anchor="middle" fill="#1a1a2e">+ pos enc</text>
<text x="80" y="146" text-anchor="middle" fill="#1a1a2e">Transformer x 6</text>
<text x="80" y="162" font-size="9" text-anchor="middle" fill="#5a4a3a">attn + FFN</text>
<text x="80" y="186" text-anchor="middle" fill="#1a1a2e">LM head</text>
<text x="80" y="202" font-size="9" text-anchor="middle" fill="#5a4a3a">vocab logits</text>
</g>
<g transform="translate(360,75)">
<rect width="180" height="220" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="90" y="22" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. Train loop</text>
<text x="90" y="48" text-anchor="middle" fill="#1a1a2e">AdamW, lr=3e-4</text>
<text x="90" y="66" text-anchor="middle" fill="#1a1a2e">cosine schedule</text>
<text x="90" y="90" text-anchor="middle" fill="#1a1a2e">CE loss on shifted</text>
<text x="90" y="106" text-anchor="middle" fill="#1a1a2e">next-token target</text>
<text x="90" y="130" text-anchor="middle" fill="#1a1a2e">grad clip 1.0</text>
<text x="90" y="154" text-anchor="middle" fill="#1a1a2e">mixed precision fp16</text>
<text x="90" y="178" text-anchor="middle" fill="#1a1a2e">~3000 steps total</text>
<text x="90" y="202" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">loss curve: 10.4 -&gt; 3.8</text>
</g>
<g transform="translate(560,75)">
<rect width="140" height="220" rx="8" fill="#f5e3e8" stroke="#7a2a4a" stroke-width="2"/>
<text x="70" y="22" font-weight="700" text-anchor="middle" fill="#7a2a4a">4. Eval</text>
<text x="70" y="48" text-anchor="middle" fill="#1a1a2e">val PPL every</text>
<text x="70" y="64" text-anchor="middle" fill="#1a1a2e">200 steps</text>
<text x="70" y="88" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">log to W&amp;B</text>
<text x="70" y="118" text-anchor="middle" fill="#1a1a2e">Sample gen:</text>
<text x="70" y="134" text-anchor="middle" fill="#1a1a2e">"The cat sat..."</text>
<text x="70" y="158" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">readable by step 1000</text>
<text x="70" y="190" text-anchor="middle" fill="#1a1a2e">save ckpts</text>
</g>
<g transform="translate(720,75)">
<rect width="140" height="220" rx="8" fill="#fce8d4" stroke="#a67c1a" stroke-width="2"/>
<text x="70" y="22" font-weight="700" text-anchor="middle" fill="#a67c1a">5. Compare</text>
<text x="70" y="48" text-anchor="middle" fill="#1a1a2e">Same training</text>
<text x="70" y="64" text-anchor="middle" fill="#1a1a2e">in 15 lines:</text>
<text x="70" y="88" font-weight="700" text-anchor="middle" fill="#1f7a3a">HF Trainer API</text>
<text x="70" y="118" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">same loss curve,</text>
<text x="70" y="132" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">no manual loop</text>
<text x="70" y="158" text-anchor="middle" fill="#1a1a2e">Now you know</text>
<text x="70" y="174" text-anchor="middle" fill="#1a1a2e">what it abstracts</text>
</g>
<!-- Arrows -->
<g stroke="#1a1a2e" stroke-width="1.5" fill="none">
<line x1="160" y1="185" x2="180" y2="185" marker-end="url(#arr69)"/>
<line x1="340" y1="185" x2="360" y2="185" marker-end="url(#arr69)"/>
<line x1="540" y1="185" x2="560" y2="185" marker-end="url(#arr69)"/>
<line x1="700" y1="185" x2="720" y2="185" marker-end="url(#arr69)"/>
</g>
<defs>
<marker id="arr69" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1a1a2e"/></marker>
</defs>
</g>
<text x="440" y="335" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Loss drops from 10.4 (random) to ~3.8; samples readable by step 1000.</text>
</svg>