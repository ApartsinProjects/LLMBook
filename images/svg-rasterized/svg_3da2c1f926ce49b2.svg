<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three-layer RAG evaluation diagram" role="img" style="font-family: sans-serif;" viewbox="0 0 760 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter height="115%" id="shadow-rag" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<rect fill="#8e44ad" filter="url(#shadow-rag)" height="64" rx="10" width="700" x="30" y="80"></rect>
<text fill="white" font-size="13" font-weight="700" x="50" y="105">Layer 1 , Retrieval</text>
<text fill="white" font-size="11" x="50" y="125">Recall@k · MRR · nDCG@k · Precision@k</text>
<text fill="white" font-size="11" x="50" y="140">Question: did we find the right chunks?</text>
<rect fill="#2980b9" filter="url(#shadow-rag)" height="64" rx="10" width="700" x="30" y="160"></rect>
<text fill="white" font-size="13" font-weight="700" x="50" y="185">Layer 2 , Generation</text>
<text fill="white" font-size="11" x="50" y="205">Faithfulness · Groundedness · Answer Relevance · Context Precision/Recall</text>
<text fill="white" font-size="11" x="50" y="220">Question: did the LLM use the chunks correctly?</text>
<rect fill="#27ae60" filter="url(#shadow-rag)" height="64" rx="10" width="700" x="30" y="240"></rect>
<text fill="white" font-size="13" font-weight="700" x="50" y="265">Layer 3 , End-to-End</text>
<text fill="white" font-size="11" x="50" y="285">Answer Correctness · Refusal Calibration · Semantic Similarity</text>
<text fill="white" font-size="11" x="50" y="300">Question: did the user get a right answer (or a right refusal)?</text>
<text fill="#888" font-size="11" font-style="italic" text-anchor="middle" x="380" y="335">Each layer isolates a failure mode. End-to-end alone tells you something is broken; only layered eval tells you what.</text>
</svg>