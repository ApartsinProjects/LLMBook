<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="SAM architecture: heavy ViT image encoder runs once per image; lightweight prompt encoder turns clicks, boxes, masks into prompt tokens; mask decoder cross-attends prompts to image embedding and emits three candidate masks with confidence scores" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 760 240" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="240" width="760"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="380" y="22">SAM: heavy image encoder, light prompt encoder, fast mask decoder</text>
<defs>
<marker id="samArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
</defs>
<g font-size="10">
<rect fill="#bbdefb" height="60" rx="6" stroke="#1976d2" stroke-width="1.5" width="120" x="20" y="60"></rect>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="80" y="85">Image (1024 x 1024)</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="80" y="102">runs once per image</text>
<line marker-end="url(#samArr)" stroke="#666" stroke-width="2" x1="140" x2="168" y1="90" y2="90"></line>
<rect fill="#e1bee7" height="60" rx="6" stroke="#6a1b9a" stroke-width="1.5" width="140" x="168" y="60"></rect>
<text fill="#4a148c" font-weight="700" text-anchor="middle" x="238" y="82">ViT-H image encoder</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="238" y="100">~600 ms on A100, amortized</text>
<line marker-end="url(#samArr)" stroke="#666" stroke-width="2" x1="308" x2="336" y1="90" y2="90"></line>
<rect fill="#fff9c4" height="60" rx="6" stroke="#f57f17" stroke-width="1.5" width="130" x="336" y="60"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="401" y="82">Image embedding</text>
<text fill="#f57f17" font-size="9" text-anchor="middle" x="401" y="100">64 x 64 x 256</text>
<rect fill="#c8e6c9" height="60" rx="6" stroke="#2e7d32" stroke-width="1.5" width="120" x="20" y="150"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="80" y="172">Prompt</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="80" y="190">click / box / mask</text>
<line marker-end="url(#samArr)" stroke="#666" stroke-width="2" x1="140" x2="168" y1="180" y2="180"></line>
<rect fill="#fff3e0" height="60" rx="6" stroke="#ef6c00" stroke-width="1.5" width="140" x="168" y="150"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="238" y="172">Prompt encoder</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="238" y="190">few-param, &lt; 1 ms</text>
<line marker-end="url(#samArr)" stroke="#666" stroke-width="2" x1="308" x2="336" y1="180" y2="180"></line>
<rect fill="#fff9c4" height="60" rx="6" stroke="#f57f17" stroke-width="1.5" width="130" x="336" y="150"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="401" y="172">Prompt tokens</text>
<text fill="#f57f17" font-size="9" text-anchor="middle" x="401" y="190">N x 256</text>
<line marker-end="url(#samArr)" stroke="#666" stroke-width="2" x1="466" x2="494" y1="120" y2="120"></line>
<line marker-end="url(#samArr)" stroke="#666" stroke-width="2" x1="466" x2="494" y1="180" y2="150"></line>
<rect fill="#ffcdd2" height="80" rx="6" stroke="#c62828" stroke-width="1.5" width="140" x="494" y="100"></rect>
<text fill="#b71c1c" font-weight="700" text-anchor="middle" x="564" y="125">Mask decoder</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="564" y="143">2-layer transformer</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="564" y="158">~ 4 ms per prompt</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="564" y="173">cross-attn both ways</text>
<line marker-end="url(#samArr)" stroke="#666" stroke-width="2" x1="634" x2="662" y1="140" y2="140"></line>
<rect fill="#c8e6c9" height="70" rx="6" stroke="#2e7d32" stroke-width="1.5" width="80" x="662" y="105"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="702" y="125">3 masks</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="702" y="143">+ IoU score</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="702" y="158">whole / part / sub</text>
</g>
</svg>