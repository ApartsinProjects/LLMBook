<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Cross-encoder vs. bi-encoder architecture. The bi-encoder enables precomputation and fast similarity search." role="img" viewbox="0 0 750 340" xmlns="http://www.w3.org/2000/svg">
<!-- Cross-Encoder side -->
<rect fill="#f8f0ff" filter="url(#shadow_2608b2)" height="320" rx="12" stroke="#8e44ad" stroke-linecap="round" stroke-width="1.5" width="340" x="10" y="10"></rect>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="180" y="40">Cross-Encoder</text>
<rect fill="#e8d5f5" height="36" rx="6" stroke="#8e44ad" stroke-linecap="round" width="120" x="40" y="60"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="100" y="83">Sentence A</text>
<rect fill="#e8d5f5" height="36" rx="6" stroke="#8e44ad" stroke-linecap="round" width="120" x="200" y="60"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="260" y="83">Sentence B</text>
<line marker-end="url(#arrow1)" stroke="#8e44ad" stroke-linecap="round" stroke-width="1.5" x1="100" x2="180" y1="96" y2="130"></line>
<line marker-end="url(#arrow1)" stroke="#8e44ad" stroke-linecap="round" stroke-width="1.5" x1="260" x2="180" y1="96" y2="130"></line>
<rect fill="#8e44ad" height="50" rx="8" width="140" x="110" y="130"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="180" y="152">Transformer</text>
<text fill="#ddd" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="180" y="170">[CLS] A [SEP] B</text>
<line marker-end="url(#arrow1)" stroke="#8e44ad" stroke-linecap="round" stroke-width="1.5" x1="180" x2="180" y1="180" y2="210"></line>
<rect fill="url(#grad_2608b2_f0e6ff)" height="36" rx="6" stroke="#8e44ad" stroke-linecap="round" width="100" x="130" y="210"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="180" y="233">Score: 0.87</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="180" y="280">O(n) per query pair</text>
<text fill="#c0392b" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="180" y="300">Cannot precompute</text>
<!-- Bi-Encoder side -->
<rect fill="#e8f5e9" height="320" rx="12" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" width="340" x="400" y="10"></rect>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="570" y="40">Bi-Encoder</text>
<rect fill="url(#grad_2608b2_c8e6c9)" height="36" rx="6" stroke="#27ae60" stroke-linecap="round" width="120" x="420" y="60"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="480" y="83">Sentence A</text>
<rect fill="url(#grad_2608b2_c8e6c9)" height="36" rx="6" stroke="#27ae60" stroke-linecap="round" width="120" x="600" y="60"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="660" y="83">Sentence B</text>
<line marker-end="url(#arrow2)" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" x1="480" x2="480" y1="96" y2="130"></line>
<line marker-end="url(#arrow2)" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" x1="660" x2="660" y1="96" y2="130"></line>
<rect fill="#27ae60" height="50" rx="8" width="120" x="420" y="130"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="480" y="160">Encoder</text>
<rect fill="#27ae60" height="50" rx="8" width="120" x="600" y="130"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="660" y="160">Encoder</text>
<line marker-end="url(#arrow2)" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" x1="480" x2="480" y1="180" y2="210"></line>
<line marker-end="url(#arrow2)" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" x1="660" x2="660" y1="180" y2="210"></line>
<rect fill="#e8f5e9" height="30" rx="6" stroke="#27ae60" stroke-linecap="round" width="80" x="440" y="210"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="480" y="230">Vec A</text>
<rect fill="#e8f5e9" height="30" rx="6" stroke="#27ae60" stroke-linecap="round" width="80" x="620" y="210"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="660" y="230">Vec B</text>
<line stroke="#27ae60" stroke-dasharray="5,3" stroke-linecap="round" stroke-width="1.5" x1="520" x2="620" y1="225" y2="225"></line>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="570" y="260">cos(A, B) = 0.87</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="570" y="290">Vectors precomputed offline</text>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle" x="570" y="310">O(1) similarity at query time</text>
<defs>
<lineargradient id="grad_2608b2_f0e6ff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff5ff"></stop><stop offset="100%" stop-color="#f0e6ff"></stop></lineargradient>
<lineargradient id="grad_2608b2_c8e6c9" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d7f5d8"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
<filter height="115%" id="shadow_2608b2" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrow1" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8e44ad"></path></marker>
<marker id="arrow2" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"></path></marker>
</defs>
</svg>