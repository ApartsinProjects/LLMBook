<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: 6.1 Multi-Stage Domain Adaptation Pipeline" font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 -10 700 210" xmlns="http://www.w3.org/2000/svg">
<!-- Stage 1 -->
<rect fill="url(#grad_f75c10_e8eaf6)" filter="url(#shadow_f75c10)" height="65" rx="6" stroke="#3949ab" stroke-linecap="round" stroke-width="1.5" width="140" x="20" y="55"></rect>
<text fill="#3949ab" font-size="11" font-weight="bold" text-anchor="middle" x="90" y="78">Stage 1: CPT</text>
<text fill="#555" font-size="11" text-anchor="middle" x="90" y="95">Domain corpus</text>
<text fill="#555" font-size="11" text-anchor="middle" x="90" y="110">+ 20% replay</text>
<line marker-end="url(#arrowP)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="162" x2="185" y1="87" y2="87"></line>
<defs>
<lineargradient id="grad_f75c10_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#f3e5f5"></stop></lineargradient>
<lineargradient id="grad_f75c10_e8eaf6" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7f9ff"></stop><stop offset="100%" stop-color="#e8eaf6"></stop></lineargradient>
<lineargradient id="grad_f75c10_f5f5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f5f5f5"></stop></lineargradient>
<lineargradient id="grad_f75c10_c8e6c9" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d7f5d8"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
<lineargradient id="grad_f75c10_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<filter height="115%" id="shadow_f75c10" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowP" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><polygon fill="#333" points="0 0, 8 3, 0 6"></polygon></marker></defs>
<!-- Stage 2 -->
<rect fill="url(#grad_f75c10_c8e6c9)" height="65" rx="6" stroke="#2e7d32" stroke-linecap="round" stroke-width="1.5" width="140" x="190" y="55"></rect>
<text fill="#2e7d32" font-size="11" font-weight="bold" text-anchor="middle" x="260" y="78">Stage 2: SFT</text>
<text fill="#555" font-size="11" text-anchor="middle" x="260" y="95">Domain instructions</text>
<text fill="#555" font-size="11" text-anchor="middle" x="260" y="110">+ general instructions</text>
<line marker-end="url(#arrowP)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="332" x2="355" y1="87" y2="87"></line>
<!-- Stage 3 -->
<rect fill="url(#grad_f75c10_fff3e0)" height="65" rx="6" stroke="#e65100" stroke-linecap="round" stroke-width="1.5" width="140" x="360" y="55"></rect>
<text fill="#e65100" font-size="11" font-weight="bold" text-anchor="middle" x="430" y="78">Stage 3: Align</text>
<text fill="#555" font-size="11" text-anchor="middle" x="430" y="95">Domain DPO/RLHF</text>
<text fill="#555" font-size="11" text-anchor="middle" x="430" y="110">+ safety alignment</text>
<line marker-end="url(#arrowP)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="502" x2="525" y1="87" y2="87"></line>
<!-- Stage 4 -->
<rect fill="url(#grad_f75c10_f3e5f5)" height="65" rx="6" stroke="#7b1fa2" stroke-linecap="round" stroke-width="1.5" width="140" x="530" y="55"></rect>
<text fill="#7b1fa2" font-size="11" font-weight="bold" text-anchor="middle" x="600" y="78">Stage 4: Eval</text>
<text fill="#555" font-size="11" text-anchor="middle" x="600" y="95">Domain benchmarks</text>
<text fill="#555" font-size="11" text-anchor="middle" x="600" y="110">+ general benchmarks</text>
<!-- Annotations -->
<rect fill="url(#grad_f75c10_f5f5f5)" height="40" rx="4" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="650" x="20" y="145"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="350" y="170">Each stage uses LoRA adapters that can be merged sequentially or kept separate for modularity</text>
</svg>