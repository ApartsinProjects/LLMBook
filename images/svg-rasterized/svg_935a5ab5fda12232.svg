<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Three logging tiers and retention by regulatory regime on a log scale" viewBox="-17 0 897 420" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="420" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">LLM logging tiers and regulatory retention floors</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Three nested layers; each regulation pins a minimum for the audit tier</text>
<g transform="translate(120,75)">
<line x1="0" y1="280" x2="700" y2="280" stroke="#1a1a2e" stroke-width="1.5"/>
<g font-size="9" fill="#5a4a3a" text-anchor="middle">
<text x="0" y="298">1 day</text><line x1="0" y1="278" x2="0" y2="282" stroke="#1a1a2e"/>
<text x="117" y="298">30 days</text><line x1="117" y1="278" x2="117" y2="282" stroke="#1a1a2e"/>
<text x="233" y="298">1 year</text><line x1="233" y1="278" x2="233" y2="282" stroke="#1a1a2e"/>
<text x="350" y="298">3 years</text><line x1="350" y1="278" x2="350" y2="282" stroke="#1a1a2e"/>
<text x="467" y="298">6 years</text><line x1="467" y1="278" x2="467" y2="282" stroke="#1a1a2e"/>
<text x="583" y="298">10 years</text><line x1="583" y1="278" x2="583" y2="282" stroke="#1a1a2e"/>
<text x="700" y="298">20 years</text><line x1="700" y1="278" x2="700" y2="282" stroke="#1a1a2e"/>
</g>
<text x="350" y="320" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Retention duration (log scale)</text>
<rect x="0" y="18" width="120" height="32" rx="4" fill="#cfe0ee" stroke="#1a4078" stroke-width="2"/>
<text x="60" y="32" font-size="10" font-weight="700" text-anchor="middle" fill="#1a4078">Observability</text>
<text x="60" y="44" font-size="9" text-anchor="middle" fill="#1a1a2e">OTel + Datadog, 7-30d</text>
<text x="-12" y="38" font-size="11" font-weight="700" text-anchor="end" fill="#1a4078">Tier 1</text>
<rect x="0" y="68" width="583" height="32" rx="4" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="291" y="82" font-size="10" font-weight="700" text-anchor="middle" fill="#a67c1a">Audit (signed, write-once)</text>
<text x="291" y="94" font-size="9" text-anchor="middle" fill="#1a1a2e">EU AI Act Art. 19 floor: 6 months; HIPAA: 6 years; SR 11-7: 7 years</text>
<text x="-12" y="88" font-size="11" font-weight="700" text-anchor="end" fill="#a67c1a">Tier 2</text>
<rect x="0" y="118" width="700" height="32" rx="4" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="2"/>
<text x="350" y="132" font-size="10" font-weight="700" text-anchor="middle" fill="#7a2a2a">Forensic (hash-chained + external anchor)</text>
<text x="350" y="144" font-size="9" text-anchor="middle" fill="#1a1a2e">SEC 17a-4 WORM; EU MDR class IIa: 15y; SOX: 7y; statute of limitations</text>
<text x="-12" y="138" font-size="11" font-weight="700" text-anchor="end" fill="#7a2a2a">Tier 3</text>
<g>
<line x1="52" y1="170" x2="52" y2="276" stroke="#1a4078" stroke-width="1" stroke-dasharray="3,2"/>
<text x="52" y="180" font-size="9" font-weight="700" text-anchor="middle" fill="#1a4078">EU AI Act Art. 19</text>
<text x="52" y="193" font-size="8" text-anchor="middle" fill="#5a4a3a">6-month floor</text>
<line x1="117" y1="200" x2="117" y2="276" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="3,2"/>
<text x="117" y="210" font-size="9" font-weight="700" text-anchor="middle" fill="#1f7a3a">GDPR Art. 30</text>
<text x="117" y="223" font-size="8" text-anchor="middle" fill="#5a4a3a">minimize after purpose</text>
<line x1="233" y1="230" x2="233" y2="276" stroke="#1a1a2e" stroke-width="1" stroke-dasharray="3,2"/>
<text x="233" y="240" font-size="9" font-weight="700" text-anchor="middle" fill="#1a1a2e">SEC Rule 17a-4</text>
<text x="233" y="253" font-size="8" text-anchor="middle" fill="#5a4a3a">3-6 yrs WORM</text>
<line x1="467" y1="170" x2="467" y2="276" stroke="#7a2a2a" stroke-width="1" stroke-dasharray="3,2"/>
<text x="467" y="180" font-size="9" font-weight="700" text-anchor="middle" fill="#7a2a2a">HIPAA</text>
<text x="467" y="193" font-size="8" text-anchor="middle" fill="#5a4a3a">6 yrs from last use</text>
<line x1="525" y1="200" x2="525" y2="276" stroke="#a67c1a" stroke-width="1" stroke-dasharray="3,2"/>
<text x="525" y="210" font-size="9" font-weight="700" text-anchor="middle" fill="#a67c1a">SR 11-7 + SOX</text>
<text x="525" y="223" font-size="8" text-anchor="middle" fill="#5a4a3a">7 yrs financial</text>
<line x1="650" y1="230" x2="650" y2="276" stroke="#7a2a2a" stroke-width="1" stroke-dasharray="3,2"/>
<text x="650" y="240" font-size="9" font-weight="700" text-anchor="middle" fill="#7a2a2a">EU MDR class IIa</text>
<text x="650" y="253" font-size="8" text-anchor="middle" fill="#5a4a3a">15 yrs medical</text>
</g>
</g>
</svg>