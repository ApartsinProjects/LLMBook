<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Three-layer frontier-research library stack with named tools" viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="380" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">The frontier-research library stack: three layers that survive each quarterly rewrite</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Churn happens within layers; the layers themselves are stable</text>
<!-- Layer 1: Paper-tracking -->
<g transform="translate(40,75)">
<rect width="800" height="80" rx="8" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="20" y="22" font-size="12" font-weight="700" fill="#3d4d8a">Layer 1: Paper-tracking</text>
<text x="20" y="40" font-size="9" font-style="italic" fill="#5a4a3a">"find the right paper this week"</text>
<g font-size="9" fill="#1a1a2e">
<rect x="180" y="48" width="80" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="220" y="62" text-anchor="middle">arxiv.py</text>
<rect x="270" y="48" width="100" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="320" y="62" text-anchor="middle">arxiv-sanity</text>
<rect x="380" y="48" width="100" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="430" y="62" text-anchor="middle">ResearchRabbit</text>
<rect x="490" y="48" width="60" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="520" y="62" text-anchor="middle">Elicit</text>
<rect x="560" y="48" width="60" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="590" y="62" text-anchor="middle">Zotero</text>
<rect x="630" y="48" width="80" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="670" y="62" text-anchor="middle">paper-qa</text>
</g>
</g>
<!-- Layer 2: Reproducibility -->
<g transform="translate(40,175)">
<rect width="800" height="80" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="20" y="22" font-size="12" font-weight="700" fill="#a67c1a">Layer 2: Reproducibility</text>
<text x="20" y="40" font-size="9" font-style="italic" fill="#5a4a3a">"what hyperparameters did we use last week?"</text>
<g font-size="9" fill="#1a1a2e">
<rect x="240" y="48" width="80" height="22" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="280" y="62" text-anchor="middle">Hydra (Meta)</text>
<rect x="330" y="48" width="80" height="22" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="370" y="62" text-anchor="middle">DVC</text>
<rect x="420" y="48" width="100" height="22" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="470" y="62" text-anchor="middle">W&amp;B</text>
<rect x="530" y="48" width="100" height="22" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="580" y="62" text-anchor="middle">Metaflow (NFLX)</text>
</g>
</g>
<!-- Layer 3: Reference impls -->
<g transform="translate(40,275)">
<rect width="800" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="20" y="22" font-size="12" font-weight="700" fill="#1f7a3a">Layer 3: Reference implementations</text>
<text x="20" y="40" font-size="9" font-style="italic" fill="#5a4a3a">pedagogy &#8594; production ladder</text>
<g font-size="9" fill="#1a1a2e">
<rect x="240" y="48" width="80" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="280" y="62" text-anchor="middle">nanoGPT</text>
<rect x="330" y="48" width="60" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="360" y="62" text-anchor="middle">llm.c</text>
<rect x="400" y="48" width="60" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="430" y="62" text-anchor="middle">litgpt</text>
<rect x="470" y="48" width="90" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="515" y="62" text-anchor="middle">torchtitan</text>
<rect x="570" y="48" width="80" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="610" y="62" text-anchor="middle">maxtext</text>
<rect x="660" y="48" width="80" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="700" y="62" text-anchor="middle">gpt-neox</text>
</g>
</g>
<!-- Pedagogy/prod arrow -->
<path d="M 240 360 L 760 360" stroke="#1f7a3a" stroke-width="1.5" marker-end="url(#arr832)"/>
<text x="280" y="375" font-size="9" fill="#5a4a3a">pedagogy</text>
<text x="720" y="375" font-size="9" fill="#5a4a3a">production</text>
<defs>
<marker id="arr832" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1f7a3a"/></marker>
</defs>
</svg>