<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: Hybrid IE Architectures" font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 760 532" xmlns="http://www.w3.org/2000/svg">
<!-- Input -->
<rect fill="url(#grad_2835df_f0f0f0)" filter="url(#shadow_2835df)" height="45" rx="8" stroke="#333" stroke-linecap="round" stroke-width="2" width="200" x="280" y="45"></rect>
<text fill="#333" font-size="12" font-weight="600" text-anchor="middle" x="380" y="72">Input Document</text>
<!-- Arrow down -->
<line marker-end="url(#arrow-black)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="380" x2="380" y1="90" y2="115"></line>
<!-- Layer 1: Classical NER -->
<rect fill="#e8f5e9" height="80" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="640" x="60" y="115"></rect>
<text fill="#1e8449" font-size="13" font-weight="700" text-anchor="middle" x="380" y="137">Layer 1: Classical NER (spaCy)</text>
<text fill="#555" font-size="11" text-anchor="middle" x="160" y="158">PERSON</text>
<text fill="#555" font-size="11" text-anchor="middle" x="280" y="158">ORG</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="158">DATE</text>
<text fill="#555" font-size="11" text-anchor="middle" x="480" y="158">GPE</text>
<text fill="#555" font-size="11" text-anchor="middle" x="580" y="158">MONEY</text>
<text fill="#27ae60" font-size="11" font-style="italic" text-anchor="middle" x="380" y="180">&lt;1ms per document, 95%+ F1, zero marginal cost</text>
<!-- Arrow down -->
<line marker-end="url(#arrow-black)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="380" x2="380" y1="195" y2="220"></line>
<!-- Complexity Router -->
<rect fill="url(#grad_2835df_fef9e7)" height="50" rx="25" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="320" x="220" y="220"></rect>
<text fill="#e67e22" font-size="12" font-weight="700" text-anchor="middle" x="380" y="248">Complexity Router</text>
<text fill="#888" font-size="11" text-anchor="middle" x="380" y="262">needs domain extraction?</text>
<!-- Two branches -->
<line marker-end="url(#arrow-green2)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="310" x2="180" y1="270" y2="310"></line>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="215" y="295">No (70%)</text>
<line marker-end="url(#arrow-purple2)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" x1="450" x2="560" y1="270" y2="310"></line>
<text fill="#8e44ad" font-size="11" font-weight="600" text-anchor="middle" x="530" y="295">Yes (30%)</text>
<!-- Simple path -->
<rect fill="#e8f5e9" height="55" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="200" x="80" y="310"></rect>
<text fill="#2d3436" font-size="11" font-weight="600" text-anchor="middle" x="180" y="335">Return Classical</text>
<text fill="#2d3436" font-size="11" font-weight="600" text-anchor="middle" x="180" y="352">Entities Only</text>
<!-- Complex path: LLM extraction -->
<rect fill="url(#grad_2835df_f0e6ff)" height="55" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="220" x="460" y="310"></rect>
<text fill="#2d3436" font-size="11" font-weight="600" text-anchor="middle" x="570" y="332">Layer 2: LLM Extraction</text>
<text fill="#555" font-size="11" text-anchor="middle" x="570" y="350">relations, events, domain types</text>
<!-- Both merge -->
<line stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" x1="180" x2="180" y1="365" y2="400"></line>
<line marker-end="url(#arrow-green2)" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" x1="180" x2="338" y1="400" y2="428"></line>
<line stroke="#8e44ad" stroke-linecap="round" stroke-width="1.5" x1="570" x2="570" y1="365" y2="400"></line>
<line marker-end="url(#arrow-purple2)" stroke="#8e44ad" stroke-linecap="round" stroke-width="1.5" x1="570" x2="422" y1="400" y2="428"></line>
<!-- Merge + Validate -->
<rect fill="url(#grad_2835df_e8f4fd)" height="50" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="220" x="270" y="430"></rect>
<text fill="#2d3436" font-size="11" font-weight="600" text-anchor="middle" x="380" y="452">Merge + Validate</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="468">dedup, grounding check, Pydantic</text>
<!-- Output -->
<line marker-end="url(#arrow-black)" stroke="#333" stroke-linecap="round" stroke-width="2" x1="380" x2="380" y1="480" y2="500"></line>
<rect fill="#1a1a2e" height="15" rx="4" width="200" x="280" y="500"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="380" y="512">Structured Output (JSON)</text>
<defs>
<lineargradient id="grad_2835df_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_2835df_f0f0f0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f0f0f0"></stop></lineargradient>
<lineargradient id="grad_2835df_f0e6ff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff5ff"></stop><stop offset="100%" stop-color="#f0e6ff"></stop></lineargradient>
<lineargradient id="grad_2835df_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_2835df" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrow-black" markerheight="6" markerwidth="8" orient="auto" refx="10" refy="3" viewBox="0 0 10 6">
<path d="M0,0 L10,3 L0,6 Z" fill="#333"></path>
</marker>
<marker id="arrow-green2" markerheight="6" markerwidth="8" orient="auto" refx="10" refy="3" viewBox="0 0 10 6">
<path d="M0,0 L10,3 L0,6 Z" fill="#27ae60"></path>
</marker>
<marker id="arrow-purple2" markerheight="6" markerwidth="8" orient="auto" refx="10" refy="3" viewBox="0 0 10 6">
<path d="M0,0 L10,3 L0,6 Z" fill="#8e44ad"></path>
</marker>
</defs>
</svg>