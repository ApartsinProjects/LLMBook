<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: The Perception-Reasoning-Action Loop" role="img" viewbox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
<defs><filter height="116%" id="stdShadow6" width="108%" x="-4%" y="-4%"><fedropshadow dx="1" dy="2" flood-opacity="0.08" stddeviation="2"></fedropshadow></filter><lineargradient id="stdGrad5" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<marker id="arrow1" markerheight="7" markerwidth="10" orient="auto" refx="9" refy="3.5">
<polygon fill="#e94560" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<rect fill="#e8f4fd" height="80" rx="12" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="160" x="40" y="110"></rect>
<text fill="#2d3436" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="120" y="145">PERCEIVE</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="120" y="168">Gather observations,</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="120" y="183">tool outputs, user input</text>
<rect fill="#f0e6ff" height="80" rx="12" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="160" x="270" y="30"></rect>
<text fill="#2d3436" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="350" y="65">REASON</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="88">LLM decides next step</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="103">(think, plan, reflect)</text>
<rect fill="#e8f5e9" height="80" rx="12" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="160" x="500" y="110"></rect>
<text fill="#2d3436" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="580" y="145">ACT</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="580" y="168">Call tool, respond,</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="580" y="183">or request info</text>
<rect fill="#fef9e7" height="70" rx="12" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="160" x="270" y="210"></rect>
<text fill="#2d3436" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="350" y="245">OBSERVE</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="268">Collect action results</text>
