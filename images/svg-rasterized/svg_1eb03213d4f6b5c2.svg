<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 380" role="img" aria-label="Four-tier funnel showing structured-output failure modes from cheap-to-detect (syntactic) at the top to hardest-to-detect (behavioral) at the bottom, with example failure modes" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<text x="360" y="22" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">Four tiers of structured-output validity</text>

<rect x="160" y="50" width="400" height="60" rx="6" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="180" y="74" font-size="12" font-weight="600" fill="#3a73a8">1. Syntactic</text>
<text x="180" y="92" font-size="9" fill="#2d3748">Does it parse?  json.loads() succeeds.</text>
<text x="180" y="104" font-size="9" fill="#718096">Catches: trailing commas, unterminated strings, mismatched braces.</text>
<text x="555" y="84" font-size="10" font-weight="600" fill="#047857" text-anchor="end">cheap</text>

<rect x="160" y="120" width="400" height="60" rx="6" fill="#bee3f8" stroke="#3a73a8" stroke-width="1.5"/>
<text x="180" y="144" font-size="12" font-weight="600" fill="#3a73a8">2. Schema-compliant</text>
<text x="180" y="162" font-size="9" fill="#2d3748">Does it match the declared JSON Schema?</text>
<text x="180" y="174" font-size="9" fill="#718096">Catches: missing required fields, wrong types, enum violations, typos.</text>

<rect x="160" y="190" width="400" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="180" y="214" font-size="12" font-weight="600" fill="#d97706">3. Semantic</text>
<text x="180" y="232" font-size="9" fill="#2d3748">Are the field VALUES correct in context?</text>
<text x="180" y="244" font-size="9" fill="#718096">Catches: city=country, date="yesterday", hallucinated user_id.</text>

<rect x="160" y="260" width="400" height="60" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<text x="180" y="284" font-size="12" font-weight="600" fill="#b91c1c">4. Behavioral</text>
<text x="180" y="302" font-size="9" fill="#2d3748">Was this the right tool to call?  In the right order?</text>
<text x="180" y="314" font-size="9" fill="#718096">Catches: wrong tool, unnecessary call, mis-ordered chain.</text>
<text x="555" y="294" font-size="10" font-weight="600" fill="#b91c1c" text-anchor="end">expensive</text>

<text x="80" y="85" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">parse</text>
<text x="80" y="98" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">rate</text>
<text x="80" y="155" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">schema</text>
<text x="80" y="168" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">rate</text>
<text x="80" y="225" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">semantic</text>
<text x="80" y="238" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">rate</text>
<text x="80" y="295" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">behavioral</text>
<text x="80" y="308" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">rate</text>

<text x="610" y="160" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">JSON</text>
<text x="610" y="173" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">Schema</text>
<text x="610" y="225" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">LLM-judge</text>
<text x="610" y="238" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">or oracle</text>
<text x="610" y="295" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">trace</text>
<text x="610" y="308" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">replay</text>

<text x="360" y="355" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">A model can hit 100% / 95% / 70% / 50% across the four tiers.</text>
<text x="360" y="370" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">Reporting only "parse rate" hides the bottom three.</text>
</svg>