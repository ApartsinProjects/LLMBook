<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Layered system prompt architecture in five stacked sections: 1. Role (persona, expertise), 2. Task (what to do), 3. Constraints (boundaries, safety), 4. Output Format (JSON schema), 5. Examples (few-shot); model attention is highest at the edges." font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_4fb090_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_4fb090_f0e6ff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff5ff"></stop><stop offset="100%" stop-color="#f0e6ff"></stop></lineargradient>
<lineargradient id="grad_4fb090_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_4fb090" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<!-- Layer 1: Role -->
<rect fill="url(#grad_4fb090_f0e6ff)" filter="url(#shadow_4fb090)" height="50" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="540" x="80" y="45"></rect>
<text fill="#8e44ad" font-size="13" font-weight="700" x="100" y="68">1. ROLE</text>
<text fill="#555" font-size="11" x="100" y="85">Persona, expertise level, domain</text>
<text fill="#8e44ad" font-size="22" text-anchor="middle" x="640" y="75">▼</text>
<!-- Layer 2: Task -->
<rect fill="url(#grad_4fb090_e8f4fd)" height="50" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="540" x="80" y="105"></rect>
<text fill="#3498db" font-size="13" font-weight="700" x="100" y="128">2. TASK</text>
<text fill="#555" font-size="11" x="100" y="145">What the model should do with the input</text>
<text fill="#3498db" font-size="22" text-anchor="middle" x="640" y="135">▼</text>
<!-- Layer 3: Constraints -->
<rect fill="url(#grad_4fb090_fef9e7)" height="50" rx="8" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="540" x="80" y="165"></rect>
<text fill="#e67e22" font-size="13" font-weight="700" x="100" y="188">3. CONSTRAINTS</text>
<text fill="#555" font-size="11" x="100" y="205">Boundaries, prohibitions, safety rules</text>
<text fill="#f39c12" font-size="22" text-anchor="middle" x="640" y="195">▼</text>
<!-- Layer 4: Output Format -->
<rect fill="#e8f5e9" height="50" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="540" x="80" y="225"></rect>
<text fill="#27ae60" font-size="13" font-weight="700" x="100" y="248">4. OUTPUT FORMAT</text>
<text fill="#555" font-size="11" x="100" y="265">JSON schema, structure, field definitions</text>
<text fill="#27ae60" font-size="22" text-anchor="middle" x="640" y="255">▼</text>
<!-- Layer 5: Examples -->
<rect fill="#fde8e8" height="50" rx="8" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="540" x="80" y="285"></rect>
<text fill="#e94560" font-size="13" font-weight="700" x="100" y="308">5. EXAMPLES</text>
<text fill="#555" font-size="11" x="100" y="325">Few-shot demonstrations of desired behavior</text>
<!-- Attention gradient arrow -->
<rect fill="none" height="290" rx="6" stroke="#888" stroke-dasharray="4" stroke-linecap="round" stroke-width="1" width="45" x="18" y="45"></rect>
<text fill="#888" font-size="11" text-anchor="middle" transform="rotate(-90,40,140)" x="40" y="140">Model Attention (high at edges)</text>
</svg>