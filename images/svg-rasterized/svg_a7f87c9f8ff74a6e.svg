<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Three production serving runtimes compared on throughput, structured output, and ops" viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="360" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Three serving runtimes: vLLM, TGI, SGLang</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Same throughput on the benchmark; the on-call engineer decides which one survives 3 AM</text>
<g font-size="10">
<g transform="translate(30,60)">
<rect width="270" height="280" rx="8" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="135" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#3d4d8a">vLLM (Berkeley, 2023+)</text>
<text x="135" y="40" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">PagedAttention + continuous batch</text>
<text x="20" y="62" fill="#1a1a2e">Strengths:</text>
<text x="30" y="78" fill="#1a1a2e">- 2x-24x naive HF throughput</text>
<text x="30" y="94" fill="#1a1a2e">- OpenAI-compatible API</text>
<text x="30" y="110" fill="#1a1a2e">- speculative decoding</text>
<text x="30" y="126" fill="#1a1a2e">- prefix caching built in</text>
<text x="30" y="142" fill="#1a1a2e">- huge community</text>
<text x="20" y="166" fill="#7a2a4a">Weaknesses:</text>
<text x="30" y="182" fill="#5a4a3a">- CUDA only</text>
<text x="30" y="198" fill="#5a4a3a">- newer model support lags</text>
<text x="30" y="214" fill="#5a4a3a">- structured output adequate</text>
<text x="135" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#3d4d8a">Default choice</text>
<text x="135" y="262" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">when latency &amp; throughput matter</text>
</g>
<g transform="translate(310,60)">
<rect width="270" height="280" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="135" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">TGI (Hugging Face, 2022+)</text>
<text x="135" y="40" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Text Generation Inference</text>
<text x="20" y="62" fill="#1a1a2e">Strengths:</text>
<text x="30" y="78" fill="#1a1a2e">- closest to HF transformers</text>
<text x="30" y="94" fill="#1a1a2e">- fastest new-model support</text>
<text x="30" y="110" fill="#1a1a2e">- tensor parallelism native</text>
<text x="30" y="126" fill="#1a1a2e">- Rust core, Python wrapper</text>
<text x="30" y="142" fill="#1a1a2e">- HF Inference Endpoints uses it</text>
<text x="20" y="166" fill="#7a2a4a">Weaknesses:</text>
<text x="30" y="182" fill="#5a4a3a">- throughput trails vLLM</text>
<text x="30" y="198" fill="#5a4a3a">- API quirks vs OpenAI</text>
<text x="135" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">Pick when</text>
<text x="135" y="262" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">you live in the HF Hub ecosystem</text>
</g>
<g transform="translate(590,60)">
<rect width="260" height="280" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="130" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">SGLang (2024)</text>
<text x="130" y="40" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">RadixAttention prefix cache</text>
<text x="20" y="62" fill="#1a1a2e">Strengths:</text>
<text x="30" y="78" fill="#1a1a2e">- beats vLLM on JSON / regex</text>
<text x="30" y="94" fill="#1a1a2e">- shared prefix across requests</text>
<text x="30" y="110" fill="#1a1a2e">- frontend DSL for chains</text>
<text x="30" y="126" fill="#1a1a2e">- fast new-paper adoption</text>
<text x="20" y="150" fill="#7a2a4a">Weaknesses:</text>
<text x="30" y="166" fill="#5a4a3a">- younger ecosystem</text>
<text x="30" y="182" fill="#5a4a3a">- fewer model coverage</text>
<text x="30" y="198" fill="#5a4a3a">- docs still maturing</text>
<text x="130" y="240" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">Pick when</text>
<text x="130" y="254" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">structured output dominates</text>
<text x="130" y="268" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">workload (constrained decoding)</text>
</g>
</g>
</svg>