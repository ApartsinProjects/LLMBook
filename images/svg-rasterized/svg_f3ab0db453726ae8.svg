<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Superposition: more features than dimensions packed via near-orthogonal directions" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 880 420" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="420" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">Superposition: tens of thousands of features in a 4096-d residual stream</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="440" y="40">Elhage et al. (Anthropic 2022); confirmed in Claude-3 Sonnet by Templeton et al. (2024)</text>
<!-- Left: dense neuron view -->
<g transform="translate(40,80)">
<rect fill="#f5e3e8" height="290" rx="8" stroke="#7a2a4a" stroke-width="2" width="240"></rect>
<text fill="#7a2a4a" font-size="12" font-weight="700" text-anchor="middle" x="120" y="22">One neuron, many concepts</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="120" y="40">polysemanticity</text>
<circle cx="120" cy="140" fill="#fef3e0" r="40" stroke="#a67c1a" stroke-width="2.5"></circle>
<text fill="#a67c1a" font-size="10" font-weight="700" text-anchor="middle" x="120" y="138">neuron</text>
<text fill="#a67c1a" font-size="10" font-weight="700" text-anchor="middle" x="120" y="152">#1147</text>
<text fill="#1a1a2e" font-size="9" x="30" y="218">academic citations</text>
<text fill="#1a1a2e" font-size="9" x="30" y="234">legal precedents</text>
<text fill="#1a1a2e" font-size="9" x="30" y="250">bible verses</text>
<text fill="#1a1a2e" font-size="9" x="30" y="266">scientific paper refs</text>
<line stroke="#a67c1a" stroke-width="1" x1="100" x2="50" y1="180" y2="215"></line>
<line stroke="#a67c1a" stroke-width="1" x1="115" x2="55" y1="182" y2="232"></line>
<line stroke="#a67c1a" stroke-width="1" x1="125" x2="65" y1="182" y2="248"></line>
<line stroke="#a67c1a" stroke-width="1" x1="140" x2="80" y1="180" y2="263"></line>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="120" y="285">no "grandmother cell"</text>
</g>
<!-- Middle: vector geometry -->
<g transform="translate(305,80)">
<rect fill="#e3e8f5" height="290" rx="8" stroke="#3d4d8a" stroke-width="2" width="270"></rect>
<text fill="#3d4d8a" font-size="12" font-weight="700" text-anchor="middle" x="135" y="22">Features as directions</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="135" y="40">10s of thousands packed into 4096-d</text>
<g transform="translate(135,170)">
<circle cx="0" cy="0" fill="none" r="90" stroke="#3d4d8a" stroke-dasharray="3,3" stroke-width="1.5"></circle>
<line stroke="#7a2a4a" stroke-width="1.6" x1="0" x2="78" y1="0" y2="-45"></line>
<line stroke="#7a2a4a" stroke-width="1.6" x1="0" x2="-78" y1="0" y2="-45"></line>
<line stroke="#7a2a4a" stroke-width="1.6" x1="0" x2="0" y1="0" y2="-90"></line>
<line stroke="#7a2a4a" stroke-width="1.6" x1="0" x2="78" y1="0" y2="45"></line>
<line stroke="#7a2a4a" stroke-width="1.6" x1="0" x2="-78" y1="0" y2="45"></line>
<line stroke="#7a2a4a" stroke-width="1.6" x1="0" x2="0" y1="0" y2="90"></line>
<line stroke="#1f7a3a" stroke-width="1.4" x1="0" x2="55" y1="0" y2="-72"></line>
<line stroke="#1f7a3a" stroke-width="1.4" x1="0" x2="-55" y1="0" y2="-72"></line>
<line stroke="#1f7a3a" stroke-width="1.4" x1="0" x2="72" y1="0" y2="-55"></line>
<line stroke="#1f7a3a" stroke-width="1.4" x1="0" x2="-72" y1="0" y2="-55"></line>
<line stroke="#1f7a3a" stroke-width="1.4" x1="0" x2="55" y1="0" y2="72"></line>
<line stroke="#1f7a3a" stroke-width="1.4" x1="0" x2="-55" y1="0" y2="72"></line>
<line stroke="#1f7a3a" stroke-width="1.4" x1="0" x2="72" y1="0" y2="55"></line>
<line stroke="#1f7a3a" stroke-width="1.4" x1="0" x2="-72" y1="0" y2="55"></line>
<circle cx="0" cy="0" fill="#1a1a2e" r="4"></circle>
<text fill="#7a2a4a" font-size="9" x="85" y="-50">f1: citation</text>
<text fill="#7a2a4a" font-size="9" x="-110" y="-50">f2: legal</text>
<text fill="#7a2a4a" font-size="9" x="-32" y="-95">f3: bible</text>
<text fill="#1f7a3a" font-size="9" x="60" y="-78">f4..</text>
</g>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="135" y="275">near-orthogonal in high-d:</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="135" y="287">exp(d) approx-orthogonal directions exist</text>
</g>
<!-- Right: SAE recovery -->
<g transform="translate(600,80)">
<rect fill="#ecf6ee" height="290" rx="8" stroke="#1f7a3a" stroke-width="2" width="240"></rect>
<text fill="#1f7a3a" font-size="12" font-weight="700" text-anchor="middle" x="120" y="22">SAE recovers one-per-feature</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="120" y="40">m = 8x to 64x larger than d</text>
<rect fill="#ffffff" height="36" rx="4" stroke="#3d4d8a" stroke-width="1.2" width="200" x="20" y="60"></rect>
<text fill="#3d4d8a" font-size="10" font-weight="700" text-anchor="middle" x="120" y="82">activation x (4096-d)</text>
<g fill="none" stroke="#1a1a2e" stroke-width="1.4">
<line marker-end="url(#arr813)" x1="120" x2="120" y1="100" y2="120"></line>
</g>
<rect fill="#fef3e0" height="50" rx="4" stroke="#a67c1a" stroke-width="1.5" width="200" x="20" y="125"></rect>
<text fill="#a67c1a" font-size="10" font-weight="700" text-anchor="middle" x="120" y="143">SAE encoder</text>
<text fill="#1a1a2e" font-size="9" text-anchor="middle" x="120" y="160">ReLU(W_enc x + b)</text>
<g fill="none" stroke="#1a1a2e" stroke-width="1.4">
<line marker-end="url(#arr813)" x1="120" x2="120" y1="180" y2="200"></line>
</g>
<rect fill="#f5e3e8" height="50" rx="4" stroke="#7a2a4a" stroke-width="1.5" width="200" x="20" y="205"></rect>
<text fill="#7a2a4a" font-size="10" font-weight="700" text-anchor="middle" x="120" y="225">f (65,536-d, sparse)</text>
<text fill="#1a1a2e" font-size="9" text-anchor="middle" x="120" y="244">~50 active features / token</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="120" y="278">"Golden Gate Bridge" feature</text>
</g>
<defs>
<marker id="arr813" markerheight="10" markerwidth="10" orient="auto" refx="9" refy="3.5"><polygon fill="#1a1a2e" points="0 0, 10 3.5, 0 7"></polygon></marker>
</defs>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="440" y="400">Templeton et al. 2024 extracted 34M features from Claude 3 Sonnet using this pipeline.</text>
</svg>