<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="2026 vertical-AI platform landscape across the three largest enterprise segments (legal, finance, healthcare)." style="max-width:880px;background:#fafafa;border:1px solid #ddd;font-family:sans-serif;" viewBox="0 0 880 360" width="100%" xmlns="http://www.w3.org/2000/svg">
<text font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">2026 vertical-AI platform landscape: who is buying what</text>
<rect fill="#fff" height="280" stroke="#3498db" stroke-width="2" width="260" x="40" y="60"></rect>
<text fill="#1f618d" font-size="13" font-weight="700" text-anchor="middle" x="170" y="84">Legal</text>
<text font-size="10" font-weight="700" x="50" y="106">BigLaw / AmLaw 100:</text>
<text font-size="10" x="50" y="120">Harvey (OpenAI partnership)</text>
<text font-size="10" font-weight="700" x="50" y="140">Mid-market firms:</text>
<text font-size="10" x="50" y="154">Even.ai, Legora</text>
<text font-size="10" font-weight="700" x="50" y="174">Research databases + AI:</text>
<text font-size="10" x="50" y="188">CoCounsel (Thomson Reuters)</text>
<text font-size="10" x="50" y="202">Lexis+ AI (LexisNexis)</text>
<text font-size="10" font-weight="700" x="50" y="222">Diligence + corpus QA:</text>
<text font-size="10" x="50" y="236">Hebbia (also finance)</text>
<text font-size="10" font-weight="700" x="50" y="256">Contract lifecycle:</text>
<text font-size="10" x="50" y="270">Ironclad</text>
<text fill="#1f618d" font-size="10" x="50" y="296">Moat: data + integration +</text>
<text fill="#1f618d" font-size="10" x="50" y="310">compliance, not the model</text>
<rect fill="#fff" height="280" stroke="#27ae60" stroke-width="2" width="260" x="310" y="60"></rect>
<text fill="#117a65" font-size="13" font-weight="700" text-anchor="middle" x="440" y="84">Finance</text>
<text font-size="10" font-weight="700" x="320" y="106">Vertical reference (closed):</text>
<text font-size="10" x="320" y="120">BloombergGPT (50B, in-house)</text>
<text font-size="10" font-weight="700" x="320" y="140">Multi-doc research:</text>
<text font-size="10" x="320" y="154">Hebbia, AlphaSense</text>
<text font-size="10" font-weight="700" x="320" y="174">S&amp;P stack:</text>
<text font-size="10" x="320" y="188">Kensho</text>
<text font-size="10" font-weight="700" x="320" y="208">IB analyst workbenches (2025):</text>
<text font-size="10" x="320" y="222">Rogo, Linq Alpha</text>
<text font-size="10" font-weight="700" x="320" y="248">Data sources:</text>
<text font-size="10" x="320" y="262">SEC EDGAR (free, public)</text>
<text font-size="10" x="320" y="276">polygon, databento (commercial)</text>
<text fill="#117a65" font-size="10" x="320" y="298">Moat: proprietary data,</text>
<text fill="#117a65" font-size="10" x="320" y="312">PitchBook / FactSet / CapIQ integration</text>
<rect fill="#fff" height="280" stroke="#c0392b" stroke-width="2" width="260" x="580" y="60"></rect>
<text fill="#922b21" font-size="13" font-weight="700" text-anchor="middle" x="710" y="84">Healthcare</text>
<text font-size="10" font-weight="700" x="590" y="106">Research model:</text>
<text font-size="10" x="590" y="120">Med-PaLM 2 (Google, 2023)</text>
<text font-size="10" font-weight="700" x="590" y="140">Enterprise EHR scribe:</text>
<text font-size="10" x="590" y="154">Nuance DAX (MS)</text>
<text font-size="10" font-weight="700" x="590" y="174">Independent scribe:</text>
<text font-size="10" x="590" y="188">Abridge (Epic / Oracle / Athena)</text>
<text font-size="10" font-weight="700" x="590" y="208">Voice patient agents:</text>
<text font-size="10" x="590" y="222">Hippocratic AI</text>
<text font-size="10" font-weight="700" x="590" y="242">DAX competitors (2024-25):</text>
<text font-size="10" x="590" y="256">Ambience, Suki</text>
<text fill="#922b21" font-size="10" x="590" y="282">Gating: HIPAA BAA</text>
<text fill="#922b21" font-size="10" x="590" y="296">(AWS Bedrock, Azure OpenAI,</text>
<text fill="#922b21" font-size="10" x="590" y="310">GCP Healthcare path supported)</text>
</svg>