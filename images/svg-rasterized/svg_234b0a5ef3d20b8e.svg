<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The GRPO training loop. A single problem is sampled G times by the current policy, producing a group of candidate solutions. An automatic verifier scores each solution as correct or incorrect. The group mean reward is subtracted from each score and the result is divided by the group standard deviation to produce a relative advantage per solution. Solutions above the group mean get positive advantage and are reinforced; those below get negative advantage and are suppressed. A KL penalty keeps the updated policy close to the reference policy. The loop repeats, and the group mean replaces the separate critic model that PPO requires." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 800 440" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grpoProb" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bbdefb"></stop><stop offset="100%" stop-color="#1e88e5"></stop></lineargradient>
<lineargradient id="grpoPol" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e1bee7"></stop><stop offset="100%" stop-color="#8e24aa"></stop></lineargradient>
<lineargradient id="grpoVer" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffe0b2"></stop><stop offset="100%" stop-color="#fb8c00"></stop></lineargradient>
<lineargradient id="grpoGood" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"></stop><stop offset="100%" stop-color="#43a047"></stop></lineargradient>
<lineargradient id="grpoBad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffcdd2"></stop><stop offset="100%" stop-color="#e53935"></stop></lineargradient>
<filter height="112%" id="grpoShadow" width="112%" x="-6%" y="-6%"><fedropshadow dx="1" dy="2" flood-opacity="0.18" stddeviation="2"></fedropshadow></filter>
<marker id="grpoArrow" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"></path></marker>
<marker id="grpoArrowP" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#8e24aa"></path></marker>
</defs>
<rect fill="#fafafa" height="440" rx="8" width="800" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="400" y="26">GRPO: group-relative advantage replaces the critic</text>
<!-- problem -->
<rect fill="url(#grpoProb)" filter="url(#grpoShadow)" height="64" rx="9" width="92" x="22" y="180"></rect>
<text fill="#fff" font-size="13" font-weight="600" text-anchor="middle" x="68" y="208">problem p</text>
<text fill="#e3f2fd" font-size="10" text-anchor="middle" x="68" y="226">+ ground truth</text>
<!-- policy samples G -->
<line marker-end="url(#grpoArrow)" stroke="#777" stroke-width="2" x1="114" x2="150" y1="212" y2="212"></line>
<text fill="#888" font-size="10" text-anchor="middle" x="132" y="202">sample G×</text>
<rect fill="url(#grpoPol)" filter="url(#grpoShadow)" height="124" rx="9" width="88" x="150" y="150"></rect>
<text fill="#fff" font-size="12" font-weight="600" text-anchor="middle" x="194" y="200">policy π</text>
<text fill="#f3e5f5" font-size="10" text-anchor="middle" x="194" y="218">(being</text>
<text fill="#f3e5f5" font-size="10" text-anchor="middle" x="194" y="231">trained)</text>
<!-- G solutions -->
<g fill="#333" font-size="11" font-weight="600">
<rect fill="#fff" height="30" rx="6" stroke="#90a4ae" width="120" x="270" y="78"></rect><text fill="#555" x="282" y="98">solution s₁</text>
<rect fill="#fff" height="30" rx="6" stroke="#90a4ae" width="120" x="270" y="116"></rect><text fill="#555" x="282" y="136">solution s₂</text>
<rect fill="#fff" height="30" rx="6" stroke="#90a4ae" width="120" x="270" y="154"></rect><text fill="#555" x="282" y="174">solution s₃</text>
<rect fill="#fff" height="30" rx="6" stroke="#90a4ae" width="120" x="270" y="192"></rect><text fill="#bbb" x="282" y="212">⋮</text>
<rect fill="#fff" height="30" rx="6" stroke="#90a4ae" width="120" x="270" y="230"></rect><text fill="#555" x="282" y="250">solution s_G</text>
</g>
<line stroke="#bbb" stroke-width="1.4" x1="238" x2="266" y1="180" y2="120"></line>
<line stroke="#bbb" stroke-width="1.4" x1="238" x2="266" y1="200" y2="169"></line>
<line stroke="#bbb" stroke-width="1.4" x1="238" x2="266" y1="224" y2="245"></line>
<!-- verifier -->
<line marker-end="url(#grpoArrow)" stroke="#fb8c00" stroke-width="1.6" x1="390" x2="416" y1="93" y2="120"></line>
<line marker-end="url(#grpoArrow)" stroke="#fb8c00" stroke-width="1.6" x1="390" x2="416" y1="131" y2="140"></line>
<line marker-end="url(#grpoArrow)" stroke="#fb8c00" stroke-width="1.6" x1="390" x2="416" y1="169" y2="162"></line>
<line marker-end="url(#grpoArrow)" stroke="#fb8c00" stroke-width="1.6" x1="390" x2="416" y1="245" y2="200"></line>
<rect fill="url(#grpoVer)" filter="url(#grpoShadow)" height="86" rx="9" width="96" x="416" y="120"></rect>
<text fill="#fff" font-size="12" font-weight="600" text-anchor="middle" x="464" y="150">verifier V</text>
<text fill="#fff3e0" font-size="10" text-anchor="middle" x="464" y="168">unit tests,</text>
<text fill="#fff3e0" font-size="10" text-anchor="middle" x="464" y="181">math grader,</text>
<text fill="#fff3e0" font-size="10" text-anchor="middle" x="464" y="194">Lean check</text>
<!-- rewards -->
<line marker-end="url(#grpoArrow)" stroke="#777" stroke-width="2" x1="512" x2="540" y1="163" y2="163"></line>
<g fill="#fff" font-size="10" font-weight="600" text-anchor="middle">
<rect fill="#43a047" height="22" rx="4" width="34" x="540" y="92"></rect><text x="557" y="107">1</text>
<rect fill="#e53935" height="22" rx="4" width="34" x="540" y="120"></rect><text x="557" y="135">0</text>
<rect fill="#43a047" height="22" rx="4" width="34" x="540" y="148"></rect><text x="557" y="163">1</text>
<rect fill="#e53935" height="22" rx="4" width="34" x="540" y="176"></rect><text x="557" y="191">0</text>
<rect fill="#e53935" height="22" rx="4" width="34" x="540" y="204"></rect><text x="557" y="219">0</text>
</g>
<text fill="#888" font-size="10" text-anchor="middle" x="557" y="248">rewards rᵢ</text>
<!-- group normalization -->
<line marker-end="url(#grpoArrow)" stroke="#777" stroke-width="2" x1="574" x2="600" y1="159" y2="159"></line>
<rect fill="#e8eaf6" height="112" rx="10" stroke="#5c6bc0" stroke-width="1.5" width="178" x="600" y="104"></rect>
<text fill="#3949ab" font-size="12" font-weight="600" text-anchor="middle" x="689" y="126">group normalization</text>
<text fill="#333" font-size="12" text-anchor="middle" x="689" y="150">Aᵢ = (rᵢ − mean) / std</text>
<text fill="#2e7d32" font-size="10" text-anchor="middle" x="689" y="174">above mean → reinforce (+)</text>
<text fill="#c62828" font-size="10" text-anchor="middle" x="689" y="190">below mean → suppress (−)</text>
<text fill="#5c6bc0" font-size="10" text-anchor="middle" x="689" y="207">no critic needed</text>
<!-- update arrow back to policy -->
<path d="M689 216 L 689 300 L 194 300 L 194 274" fill="none" marker-end="url(#grpoArrowP)" stroke="#8e24aa" stroke-width="2.2"></path>
<rect fill="#f3e5f5" height="28" rx="8" stroke="#8e24aa" width="200" x="360" y="286"></rect>
<text fill="#6a1b9a" font-size="11" font-weight="600" text-anchor="middle" x="460" y="305">policy gradient update (+ KL to π_ref)</text>
<text fill="#888" font-size="11" text-anchor="middle" x="400" y="360">Grading on a curve: the group mean is the baseline, so the model only needs to beat its own average attempt.</text>
<text fill="#e53935" font-size="10" text-anchor="middle" x="400" y="382">Failure mode: if all G rewards are equal, std collapses, every advantage is 0, and the gradient vanishes.</text>
</svg>