<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three scaling axes with diminishing-returns curves and example data points" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 880 460" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="460" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">Three scaling axes: cost structure and frontier examples</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="440" y="40">GPT-4 (13T tokens) vs Llama-3 405B (15T tokens) vs o3 (test-time CoT)</text>
<!-- Axis 1: Pretraining -->
<g transform="translate(40,80)">
<rect fill="#e3e8f5" height="340" rx="8" stroke="#3d4d8a" stroke-width="2" width="250"></rect>
<text fill="#3d4d8a" font-size="12" font-weight="700" text-anchor="middle" x="125" y="22">Axis 1: Pretraining compute</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="125" y="40">one-time, amortized</text>
<!-- curve -->
<path d="M 30 280 Q 80 200 140 160 T 230 130" fill="none" stroke="#3d4d8a" stroke-width="2.5"></path>
<line stroke="#1a1a2e" stroke-width="1.2" x1="30" x2="230" y1="280" y2="280"></line>
<line stroke="#1a1a2e" stroke-width="1.2" x1="30" x2="30" y1="280" y2="80"></line>
<text fill="#1a1a2e" font-size="9" text-anchor="middle" x="130" y="305">log compute (FLOPs)</text>
<text fill="#1a1a2e" font-size="9" text-anchor="middle" transform="rotate(-90,15,180)" x="15" y="180">capability</text>
<!-- dots -->
<circle cx="80" cy="220" fill="#a67c1a" r="4"></circle>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="80" y="240">GPT-3.5</text>
<circle cx="140" cy="160" fill="#a67c1a" r="4"></circle>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="140" y="148">GPT-4 (~$100M)</text>
<circle cx="200" cy="135" fill="#a67c1a" r="4"></circle>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="200" y="123">GPT-5 (~$1B?)</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="125" y="335">diminishing returns</text>
</g>
<!-- Axis 2: Data quality -->
<g transform="translate(315,80)">
<rect fill="#ecf6ee" height="340" rx="8" stroke="#1f7a3a" stroke-width="2" width="250"></rect>
<text fill="#1f7a3a" font-size="12" font-weight="700" text-anchor="middle" x="125" y="22">Axis 2: Data quality / curation</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="125" y="40">one-time investment</text>
<path d="M 30 280 Q 100 220 160 180 T 230 165" fill="none" stroke="#1f7a3a" stroke-width="2.5"></path>
<line stroke="#1a1a2e" stroke-width="1.2" x1="30" x2="230" y1="280" y2="280"></line>
<line stroke="#1a1a2e" stroke-width="1.2" x1="30" x2="30" y1="280" y2="80"></line>
<text fill="#1a1a2e" font-size="9" text-anchor="middle" x="130" y="305">filter aggressiveness</text>
<text fill="#1a1a2e" font-size="9" text-anchor="middle" transform="rotate(-90,15,180)" x="15" y="180">capability per param</text>
<circle cx="70" cy="240" fill="#a67c1a" r="4"></circle>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="70" y="260">CommonCrawl raw</text>
<circle cx="140" cy="195" fill="#a67c1a" r="4"></circle>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="140" y="215">FineWeb 15T</text>
<circle cx="200" cy="170" fill="#a67c1a" r="4"></circle>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="200" y="158">Llama-3 (15T curated)</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="125" y="335">low diminishing returns</text>
</g>
<!-- Axis 3: Test-time -->
<g transform="translate(590,80)">
<rect fill="#fef3e0" height="340" rx="8" stroke="#a67c1a" stroke-width="2" width="250"></rect>
<text fill="#a67c1a" font-size="12" font-weight="700" text-anchor="middle" x="125" y="22">Axis 3: Test-time compute</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="125" y="40">per-query, variable</text>
<path d="M 30 280 Q 60 230 120 175 T 230 110" fill="none" stroke="#a67c1a" stroke-width="2.5"></path>
<line stroke="#1a1a2e" stroke-width="1.2" x1="30" x2="230" y1="280" y2="280"></line>
<line stroke="#1a1a2e" stroke-width="1.2" x1="30" x2="30" y1="280" y2="80"></line>
<text fill="#1a1a2e" font-size="9" text-anchor="middle" x="130" y="305">CoT tokens per query</text>
<text fill="#1a1a2e" font-size="9" text-anchor="middle" transform="rotate(-90,15,180)" x="15" y="180">accuracy on hard task</text>
<circle cx="60" cy="245" fill="#3d4d8a" r="4"></circle>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="60" y="265">direct answer</text>
<circle cx="130" cy="170" fill="#3d4d8a" r="4"></circle>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="130" y="158">o1 / DeepSeek-R1</text>
<circle cx="200" cy="115" fill="#3d4d8a" r="4"></circle>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="200" y="103">o3 (high-effort)</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="125" y="335">task-dependent</text>
</g>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="440" y="445">Axes 1 and 2 are sunk costs; axis 3 is paid per query, making it best for hard, high-value tasks.</text>
</svg>