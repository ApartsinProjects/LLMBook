<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="IVF Voronoi partition: the 2D vector space is split into 9 cells around 9 centroids, a query vector sits inside one cell, and the search scans the nprobe nearest cells (highlighted) rather than every vector in the corpus." role="img" viewbox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="310" rx="10" stroke="#ddd" width="470" x="5" y="5"></rect>
<!-- Voronoi-ish cell boundaries -->
<g stroke="#bbb" stroke-dasharray="3,3" stroke-width="1">
<line x1="160" x2="160" y1="20" y2="300"></line>
<line x1="320" x2="320" y1="20" y2="300"></line>
<line x1="20" x2="460" y1="115" y2="115"></line>
<line x1="20" x2="460" y1="210" y2="210"></line>
</g>
<!-- nprobe highlighted cells -->
<rect fill="#fff3e0" height="95" opacity="0.6" width="140" x="160" y="115"></rect>
<rect fill="#fff3e0" height="95" opacity="0.6" width="140" x="160" y="20"></rect>
<rect fill="#fff3e0" height="95" opacity="0.6" width="140" x="320" y="115"></rect>
<!-- Data points -->
<g fill="#90caf9" stroke="#1565c0">
<circle cx="60" cy="60" r="3"></circle>
<circle cx="90" cy="80" r="3"></circle>
<circle cx="40" cy="90" r="3"></circle>
<circle cx="200" cy="60" r="3"></circle>
<circle cx="240" cy="50" r="3"></circle>
<circle cx="270" cy="80" r="3"></circle>
<circle cx="380" cy="50" r="3"></circle>
<circle cx="420" cy="70" r="3"></circle>
<circle cx="40" cy="160" r="3"></circle>
<circle cx="100" cy="170" r="3"></circle>
<circle cx="200" cy="160" r="3"></circle>
<circle cx="250" cy="180" r="3"></circle>
<circle cx="280" cy="150" r="3"></circle>
<circle cx="370" cy="170" r="3"></circle>
<circle cx="400" cy="160" r="3"></circle>
<circle cx="70" cy="260" r="3"></circle>
<circle cx="120" cy="240" r="3"></circle>
<circle cx="200" cy="260" r="3"></circle>
<circle cx="270" cy="280" r="3"></circle>
<circle cx="380" cy="260" r="3"></circle>
</g>
<!-- Centroids -->
<g fill="#c62828" stroke="#b71c1c">
<circle cx="80" cy="65" r="6"></circle>
<circle cx="240" cy="60" r="6"></circle>
<circle cx="400" cy="60" r="6"></circle>
<circle cx="80" cy="160" r="6"></circle>
<circle cx="240" cy="160" r="6"></circle>
<circle cx="400" cy="160" r="6"></circle>
<circle cx="80" cy="260" r="6"></circle>
<circle cx="240" cy="260" r="6"></circle>
<circle cx="400" cy="260" r="6"></circle>
</g>
<!-- Query -->
<g fill="#2e7d32" stroke="#1b5e20" stroke-width="2">
<polygon points="240,150 248,170 232,170"></polygon>
</g>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" x="252" y="170">query q</text>
<text fill="#c62828" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="375" y="48">centroids</text>
<text fill="#ef6c00" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" x="20" y="305">orange cells = nprobe = 3</text>
</svg>