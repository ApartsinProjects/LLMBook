<!-- Bi-Encoder Side -->
<rect fill="url(#grad_e498e6_f8f9fa)" filter="url(#shadow_e498e6)" height="220" rx="10" stroke="#dee2e6" stroke-linecap="round" stroke-width="1" width="340" x="20" y="40"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="bold" text-anchor="middle" x="190" y="62">Bi-Encoder (Retrieval)</text>
<rect fill="url(#grad_e498e6_e3f2fd)" height="35" rx="5" stroke="#1565c0" stroke-linecap="round" stroke-width="1" width="120" x="50" y="80"></rect>
<text fill="#0d47a1" font-size="11" text-anchor="middle" x="110" y="102">Query Encoder</text>
<rect fill="url(#grad_e498e6_fff3e0)" height="35" rx="5" stroke="#e65100" stroke-linecap="round" stroke-width="1" width="120" x="200" y="80"></rect>
<text fill="#e65100" font-size="11" text-anchor="middle" x="260" y="102">Doc Encoder</text>
<line marker-end="url(#arrBE_q)" stroke="#1565c0" stroke-linecap="round" stroke-width="1.5" x1="110" x2="110" y1="115" y2="143"></line>
<line marker-end="url(#arrBE_d)" stroke="#e65100" stroke-linecap="round" stroke-width="1.5" x1="260" x2="260" y1="115" y2="143"></line>
<rect fill="url(#grad_e498e6_bbdefb)" height="25" rx="4" stroke="#1565c0" stroke-linecap="round" stroke-width="1" width="80" x="70" y="145"></rect>
<text fill="#0d47a1" font-size="11" text-anchor="middle" x="110" y="162">q vector</text>
<rect fill="url(#grad_e498e6_ffe0b2)" height="25" rx="4" stroke="#e65100" stroke-linecap="round" stroke-width="1" width="80" x="220" y="145"></rect>
<text fill="#e65100" font-size="11" text-anchor="middle" x="260" y="162">d vector</text>
<line stroke="#333" stroke-dasharray="4,3" stroke-linecap="round" stroke-width="1" x1="150" x2="220" y1="157" y2="157"></line>
<text fill="#333" font-size="11" text-anchor="middle" x="185" y="152">cosine</text>
<text fill="#2e7d32" font-size="11" text-anchor="middle" x="190" y="205">Fast: pre-compute doc vectors</text>
<text fill="#c62828" font-size="11" text-anchor="middle" x="190" y="220">Limited: no token interaction</text>
<text fill="#555" font-size="11" text-anchor="middle" x="190" y="240">Use for: initial retrieval (millions)</text>
<!-- Cross-Encoder Side -->
<rect fill="url(#grad_e498e6_f8f9fa)" height="220" rx="10" stroke="#dee2e6" stroke-linecap="round" stroke-width="1" width="340" x="400" y="40"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="bold" text-anchor="middle" x="570" y="62">Cross-Encoder (Re-ranking)</text>
<rect fill="#e8f5e9" height="35" rx="5" stroke="#2e7d32" stroke-linecap="round" stroke-width="1" width="260" x="440" y="80"></rect>
<text fill="#2e7d32" font-size="11" text-anchor="middle" x="570" y="102">[CLS] Query [SEP] Document [SEP]</text>
<line marker-end="url(#arrCE)" stroke="#2e7d32" stroke-linecap="round" stroke-width="1.5" x1="570" x2="570" y1="115" y2="143"></line>
<rect fill="url(#grad_e498e6_c8e6c9)" height="25" rx="4" stroke="#2e7d32" stroke-linecap="round" stroke-width="1" width="140" x="500" y="145"></rect>
<text fill="#2e7d32" font-size="11" text-anchor="middle" x="570" y="162">Relevance Score (0 to 1)</text>
<text fill="#c62828" font-size="11" text-anchor="middle" x="570" y="205">Slow: per-pair inference</text>
<text fill="#2e7d32" font-size="11" text-anchor="middle" x="570" y="220">Accurate: full cross-attention</text>
<text fill="#555" font-size="11" text-anchor="middle" x="570" y="240">Use for: re-ranking top 20 to 100</text>
</svg>