<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Compute tiers for Part I learning" aria-labelledby="fig51title" role="img" style="max-width:1140px;width:100%;height:auto;background:#fafafa;border-radius:8px;" viewBox="0 0 1140 380" xmlns="http://www.w3.org/2000/svg">
<title id="fig51title">Compute tiers for Part I learning</title>
<text fill="#222" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" x="380" y="24">Five compute tiers for Part I (all reachable on a free plan)</text>
<g font-family="Georgia, serif" font-size="11">
<rect fill="#e8f1fb" height="200" rx="8" stroke="#1f77b4" width="140" x="30" y="60"></rect>
<text fill="#1f77b4" font-size="13" font-weight="bold" text-anchor="middle" x="100" y="84">CPU laptop</text>
<text fill="#666" text-anchor="middle" x="100" y="104">16 GB RAM</text>
<text fill="#444" text-anchor="middle" x="100" y="130">NumPy, SciPy,</text>
<text fill="#444" text-anchor="middle" x="100" y="146">sklearn, small PyTorch</text>
<text fill="#2ca02c" font-weight="bold" text-anchor="middle" x="100" y="180">$0</text>
<text fill="#444" text-anchor="middle" x="100" y="196">tokenizers, BPE,</text>
<text fill="#444" text-anchor="middle" x="100" y="212">embedding viz</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="100" y="240">first-half of Part I</text>
<rect fill="#e9f7e9" height="200" rx="8" stroke="#2ca02c" width="140" x="180" y="60"></rect>
<text fill="#2ca02c" font-size="13" font-weight="bold" text-anchor="middle" x="250" y="84">Consumer GPU</text>
<text fill="#666" text-anchor="middle" x="250" y="104">RTX 2060 → 4090</text>
<text fill="#444" text-anchor="middle" x="250" y="130">6 – 24 GB VRAM</text>
<text fill="#444" text-anchor="middle" x="250" y="146">all Part I models</text>
<text fill="#2ca02c" font-weight="bold" text-anchor="middle" x="250" y="180">owned</text>
<text fill="#444" text-anchor="middle" x="250" y="196">from-scratch GPT,</text>
<text fill="#444" text-anchor="middle" x="250" y="212">8-bit BERT-base</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="250" y="240">debugging is fastest here</text>
<rect fill="#fff5d9" height="200" rx="8" stroke="#cc8400" width="140" x="330" y="60"></rect>
<text fill="#cc8400" font-size="13" font-weight="bold" text-anchor="middle" x="400" y="84">Colab free</text>
<text fill="#666" text-anchor="middle" x="400" y="104">T4 16 GB VRAM</text>
<text fill="#444" text-anchor="middle" x="400" y="130">first-pass reading</text>
<text fill="#444" text-anchor="middle" x="400" y="146">notebooks</text>
<text fill="#2ca02c" font-weight="bold" text-anchor="middle" x="400" y="180">$0</text>
<text fill="#444" text-anchor="middle" x="400" y="196">Drive mount,</text>
<text fill="#444" text-anchor="middle" x="400" y="212">GPU by lottery</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="400" y="240">12h idle timeout</text>
<rect fill="#f0e0fa" height="200" rx="8" stroke="#7754a3" width="140" x="480" y="60"></rect>
<text fill="#7754a3" font-size="13" font-weight="bold" text-anchor="middle" x="550" y="84">Kaggle free</text>
<text fill="#666" text-anchor="middle" x="550" y="104">2× T4 = 32 GB</text>
<text fill="#444" text-anchor="middle" x="550" y="130">tasks needing</text>
<text fill="#444" text-anchor="middle" x="550" y="146">two GPUs at once</text>
<text fill="#2ca02c" font-weight="bold" text-anchor="middle" x="550" y="180">$0</text>
<text fill="#444" text-anchor="middle" x="550" y="196">competitions,</text>
<text fill="#444" text-anchor="middle" x="550" y="212">datasets persist</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="550" y="240">30 h/week quota</text>
<rect fill="#fde9e9" height="200" rx="8" stroke="#d62728" width="120" x="630" y="60"></rect>
<text fill="#d62728" font-size="13" font-weight="bold" text-anchor="middle" x="690" y="84">Apple Silicon</text>
<text fill="#666" text-anchor="middle" x="690" y="104">M1 – M4 + MLX</text>
<text fill="#444" text-anchor="middle" x="690" y="130">unified memory</text>
<text fill="#444" text-anchor="middle" x="690" y="146">24 GB on M3</text>
<text fill="#2ca02c" font-weight="bold" text-anchor="middle" x="690" y="180">owned</text>
<text fill="#444" text-anchor="middle" x="690" y="196">Qwen3-7B 4-bit</text>
<text fill="#444" text-anchor="middle" x="690" y="212">no CUDA needed</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="690" y="240">MLX ecosystem</text>
<rect fill="#fff" height="70" rx="8" stroke="#444" width="720" x="30" y="290"></rect>
<text fill="#222" font-weight="bold" x="50" y="312">Recommended default for Part I:</text>
<text fill="#444" x="50" y="333">Colab for first-read of a chapter → local GPU for second-read where you change things and break them → Kaggle when you need 2× GPUs.</text>
<text fill="#444" x="50" y="352">Skip AWS / GCP until Part IV; the foundational exercises do not need an A100 and a forgotten instance is expensive.</text>
</g>
</svg>