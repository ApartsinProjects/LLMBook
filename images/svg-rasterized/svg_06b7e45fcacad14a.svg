<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Four GPUs each hold an identical model replica and a unique data shard; after the backward pass, an all-reduce averages gradients across all GPUs so every replica updates with the same gradient." role="img" style="max-width:720px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ddpArr" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"></path></marker>
</defs>
<text fill="#222" font-size="14" font-weight="700" text-anchor="middle" x="360" y="22">DDP: per-replica forward/backward, then all-reduce average</text>
<g font-size="11">
<text fill="#1565c0" font-weight="700" x="40" y="48">Data shard</text>
<text fill="#ef6c00" font-weight="700" x="40" y="92">Model replica</text>
<text fill="#2e7d32" font-weight="700" x="40" y="148">Local gradient</text>
<text fill="#6a1b9a" font-weight="700" x="40" y="200">All-reduce average</text>
<text fill="#c62828" font-weight="700" x="40" y="250">Optimizer step</text>
</g>
<g font-size="11" text-anchor="middle">
<g>
<rect fill="#e3f2fd" height="22" rx="4" stroke="#1565c0" width="100" x="160" y="38"></rect><text x="210" y="54">batch[0:8]</text>
<rect fill="#fff3e0" height="22" rx="4" stroke="#ef6c00" width="100" x="160" y="78"></rect><text x="210" y="94">GPU 0: w</text>
<rect fill="#e8f5e9" height="22" rx="4" stroke="#2e7d32" width="100" x="160" y="134"></rect><text x="210" y="150">g₀</text>
</g>
<g>
<rect fill="#e3f2fd" height="22" rx="4" stroke="#1565c0" width="100" x="290" y="38"></rect><text x="340" y="54">batch[8:16]</text>
<rect fill="#fff3e0" height="22" rx="4" stroke="#ef6c00" width="100" x="290" y="78"></rect><text x="340" y="94">GPU 1: w</text>
<rect fill="#e8f5e9" height="22" rx="4" stroke="#2e7d32" width="100" x="290" y="134"></rect><text x="340" y="150">g₁</text>
</g>
<g>
<rect fill="#e3f2fd" height="22" rx="4" stroke="#1565c0" width="100" x="420" y="38"></rect><text x="470" y="54">batch[16:24]</text>
<rect fill="#fff3e0" height="22" rx="4" stroke="#ef6c00" width="100" x="420" y="78"></rect><text x="470" y="94">GPU 2: w</text>
<rect fill="#e8f5e9" height="22" rx="4" stroke="#2e7d32" width="100" x="420" y="134"></rect><text x="470" y="150">g₂</text>
</g>
<g>
<rect fill="#e3f2fd" height="22" rx="4" stroke="#1565c0" width="100" x="550" y="38"></rect><text x="600" y="54">batch[24:32]</text>
<rect fill="#fff3e0" height="22" rx="4" stroke="#ef6c00" width="100" x="550" y="78"></rect><text x="600" y="94">GPU 3: w</text>
<rect fill="#e8f5e9" height="22" rx="4" stroke="#2e7d32" width="100" x="550" y="134"></rect><text x="600" y="150">g₃</text>
</g>
<line marker-end="url(#ddpArr)" stroke="#555" stroke-width="1.4" x1="210" x2="210" y1="100" y2="132"></line>
<line marker-end="url(#ddpArr)" stroke="#555" stroke-width="1.4" x1="340" x2="340" y1="100" y2="132"></line>
<line marker-end="url(#ddpArr)" stroke="#555" stroke-width="1.4" x1="470" x2="470" y1="100" y2="132"></line>
<line marker-end="url(#ddpArr)" stroke="#555" stroke-width="1.4" x1="600" x2="600" y1="100" y2="132"></line>
<rect fill="#ede7f6" height="26" rx="6" stroke="#6a1b9a" width="490" x="160" y="186"></rect>
<text fill="#4527a0" font-weight="700" x="405" y="204">all-reduce: ĝ = (g₀ + g₁ + g₂ + g₃) / 4</text>
<line marker-end="url(#ddpArr)" stroke="#6a1b9a" stroke-width="1.4" x1="210" x2="210" y1="156" y2="184"></line>
<line marker-end="url(#ddpArr)" stroke="#6a1b9a" stroke-width="1.4" x1="340" x2="340" y1="156" y2="184"></line>
<line marker-end="url(#ddpArr)" stroke="#6a1b9a" stroke-width="1.4" x1="470" x2="470" y1="156" y2="184"></line>
<line marker-end="url(#ddpArr)" stroke="#6a1b9a" stroke-width="1.4" x1="600" x2="600" y1="156" y2="184"></line>
<rect fill="#ffebee" height="26" rx="6" stroke="#c62828" width="490" x="160" y="232"></rect>
<text fill="#b71c1c" font-weight="700" x="405" y="250">every replica: w ← w - η ĝ  (identical update, weights stay in sync)</text>
<line marker-end="url(#ddpArr)" stroke="#c62828" stroke-width="1.4" x1="405" x2="405" y1="214" y2="230"></line>
</g>
</svg>