<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Three converging theses of the book: alignment, evals, agents-as-decoders" viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="460" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">The book's three theses converge on one frame</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Treat LLMs as token-emitting interfaces; invest in the wrapper</text>
<!-- Three thesis circles -->
<g transform="translate(180,200)">
<circle cx="0" cy="0" r="100" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2.5" fill-opacity="0.5"/>
<text x="0" y="-15" font-size="12" font-weight="700" text-anchor="middle" fill="#3d4d8a">Alignment</text>
<text x="0" y="0" font-size="11" font-weight="700" text-anchor="middle" fill="#3d4d8a">thesis</text>
<text x="0" y="25" font-size="9" text-anchor="middle" fill="#1a1a2e">central problem =</text>
<text x="0" y="39" font-size="9" text-anchor="middle" fill="#1a1a2e">capability vs intent</text>
<text x="0" y="55" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">RLHF, CAI, eval gates</text>
</g>
<g transform="translate(700,200)">
<circle cx="0" cy="0" r="100" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5" fill-opacity="0.5"/>
<text x="0" y="-15" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Eval-is-the</text>
<text x="0" y="0" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">-product thesis</text>
<text x="0" y="25" font-size="9" text-anchor="middle" fill="#1a1a2e">what you measure =</text>
<text x="0" y="39" font-size="9" text-anchor="middle" fill="#1a1a2e">what you can ship</text>
<text x="0" y="55" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">35.9% workers use AI</text>
</g>
<g transform="translate(440,360)">
<circle cx="0" cy="0" r="100" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5" fill-opacity="0.5"/>
<text x="0" y="-15" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Agents-are-just</text>
<text x="0" y="0" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">-decoders</text>
<text x="0" y="25" font-size="9" text-anchor="middle" fill="#1a1a2e">tools = tokens</text>
<text x="0" y="39" font-size="9" text-anchor="middle" fill="#1a1a2e">env = observations</text>
<text x="0" y="55" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">planning = decoding</text>
</g>
<!-- Center convergence -->
<g transform="translate(440,250)">
<rect x="-130" y="-30" width="260" height="60" rx="10" fill="#f5e3e8" stroke="#7a2a4a" stroke-width="2.5"/>
<text x="0" y="-8" font-size="11" font-weight="700" text-anchor="middle" fill="#7a2a4a">"the token loop is the model"</text>
<text x="0" y="8" font-size="9" text-anchor="middle" fill="#1a1a2e">all the engineering lives in the wrapper:</text>
<text x="0" y="22" font-size="9" text-anchor="middle" fill="#1a1a2e">prompts, evals, tools, guardrails, observability</text>
</g>
<!-- Arrows converging -->
<g stroke="#1a1a2e" stroke-width="1.5" fill="none">
<path d="M 280 220 L 310 240" marker-end="url(#arr825)"/>
<path d="M 600 220 L 570 240" marker-end="url(#arr825)"/>
<path d="M 440 280 L 440 310" marker-end="url(#arr825)"/>
</g>
<defs>
<marker id="arr825" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1a1a2e"/></marker>
</defs>
<text x="440" y="440" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">From Chapter 4 (next-token math) to Chapter 77, the architectural skeleton stayed the same.</text>
</svg>