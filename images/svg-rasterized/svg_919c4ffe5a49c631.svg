<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="ColBERT: per-token embeddings, MaxSim per query token, then sum" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="280" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="360" y="22">ColBERT: per-token embeddings, MaxSim per query token, then sum</text>
<g transform="translate(20,50)">
<text fill="#1565c0" font-size="12" font-weight="600" x="0" y="0">query tokens</text>
<rect fill="#e3f2fd" height="28" stroke="#1565c0" width="60" x="0" y="10"></rect><text font-size="11" text-anchor="middle" x="30" y="29">q1</text>
<rect fill="#e3f2fd" height="28" stroke="#1565c0" width="60" x="0" y="44"></rect><text font-size="11" text-anchor="middle" x="30" y="63">q2</text>
<rect fill="#e3f2fd" height="28" stroke="#1565c0" width="60" x="0" y="78"></rect><text font-size="11" text-anchor="middle" x="30" y="97">q3</text>
</g>
<g transform="translate(140,50)">
<text fill="#a67c1a" font-size="12" font-weight="600" text-anchor="middle" x="80" y="0">similarity matrix (3x6)</text>
<g font-size="10" text-anchor="middle">
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="0" y="10"></rect><text x="16" y="29">.21</text>
<rect fill="#ffd180" height="28" stroke="#a67c1a" width="32" x="32" y="10"></rect><text font-weight="700" x="48" y="29">.84</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="64" y="10"></rect><text x="80" y="29">.30</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="96" y="10"></rect><text x="112" y="29">.41</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="128" y="10"></rect><text x="144" y="29">.12</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="160" y="10"></rect><text x="176" y="29">.05</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="0" y="44"></rect><text x="16" y="63">.18</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="32" y="44"></rect><text x="48" y="63">.22</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="64" y="44"></rect><text x="80" y="63">.51</text>
<rect fill="#ffd180" height="28" stroke="#a67c1a" width="32" x="96" y="44"></rect><text font-weight="700" x="112" y="63">.76</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="128" y="44"></rect><text x="144" y="63">.34</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="160" y="44"></rect><text x="176" y="63">.20</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="0" y="78"></rect><text x="16" y="97">.40</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="32" y="78"></rect><text x="48" y="97">.55</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="64" y="78"></rect><text x="80" y="97">.48</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="96" y="78"></rect><text x="112" y="97">.61</text>
<rect fill="#ffd180" height="28" stroke="#a67c1a" width="32" x="128" y="78"></rect><text font-weight="700" x="144" y="97">.79</text>
<rect fill="#fff3e0" height="28" stroke="#a67c1a" width="32" x="160" y="78"></rect><text x="176" y="97">.27</text>
</g>
</g>
<g transform="translate(370,50)">
<text fill="#2e7d32" font-size="12" font-weight="600" text-anchor="middle" x="60" y="0">row-max (MaxSim)</text>
<rect fill="#e8f5e9" height="28" stroke="#2e7d32" width="120" x="0" y="10"></rect><text font-size="11" text-anchor="middle" x="60" y="29">max row 1 = 0.84</text>
<rect fill="#e8f5e9" height="28" stroke="#2e7d32" width="120" x="0" y="44"></rect><text font-size="11" text-anchor="middle" x="60" y="63">max row 2 = 0.76</text>
<rect fill="#e8f5e9" height="28" stroke="#2e7d32" width="120" x="0" y="78"></rect><text font-size="11" text-anchor="middle" x="60" y="97">max row 3 = 0.79</text>
</g>
<g transform="translate(540,80)">
<rect fill="#f3e5f5" height="70" rx="10" stroke="#6a1b9a" stroke-width="2" width="150" x="0" y="0"></rect>
<text fill="#4a148c" font-size="12" font-weight="700" text-anchor="middle" x="75" y="22">sum of MaxSims</text>
<text fill="#4a148c" font-size="20" font-weight="700" text-anchor="middle" x="75" y="50">2.39</text>
</g>
<text fill="#666" font-size="11" text-anchor="middle" x="360" y="220">d1   d2   d3   d4   d5   d6   (document tokens, normalised)</text>
<text fill="#666" font-size="11" text-anchor="middle" x="360" y="245">Per query token, find best matching doc token; sum to get final score.</text>
</svg>