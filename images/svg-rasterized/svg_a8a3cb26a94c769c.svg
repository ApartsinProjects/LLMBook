<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="BERT-base and GPT-2 small are nearly identical in scale (12 layers, 12 heads, 768 hidden dim) but use opposite attention masks." viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig54title" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;">
<title id="fig54title">BERT-base versus GPT-2 small: the two reference architectures</title>
<text x="380" y="24" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">BERT-base vs GPT-2 small: same scale, different attention</text>
<g font-family="Georgia, serif" font-size="11">
<g transform="translate(60,60)">
<rect x="0" y="0" width="280" height="290" rx="8" fill="#e8f1fb" stroke="#1f77b4" stroke-width="2"/>
<text x="140" y="22" text-anchor="middle" font-weight="bold" fill="#1f77b4" font-size="14">BERT-base</text>
<text x="140" y="38" text-anchor="middle" fill="#666">encoder · 110M params · 2018</text>
<text x="60" y="60" font-weight="bold" fill="#222">Attention:</text>
<rect x="60" y="68" width="160" height="50" fill="#fff" stroke="#1f77b4" rx="4"/>
<text x="140" y="86" text-anchor="middle" fill="#444">bidirectional</text>
<text x="140" y="102" text-anchor="middle" fill="#444">every token sees every other</text>
<text x="60" y="140" font-weight="bold" fill="#222">Objective:</text>
<rect x="60" y="148" width="160" height="50" fill="#fff" stroke="#1f77b4" rx="4"/>
<text x="140" y="166" text-anchor="middle" fill="#444">masked LM (MLM)</text>
<text x="140" y="182" text-anchor="middle" fill="#444">+ next-sentence prediction</text>
<text x="60" y="220" font-weight="bold" fill="#222">Shape:</text>
<text x="60" y="240" fill="#444">12 layers · 12 heads · d=768</text>
<text x="60" y="256" fill="#444">vocab = 30k WordPiece · seq=512</text>
<text x="60" y="276" font-weight="bold" fill="#1f77b4">Best for: classification, QA span</text>
</g>
<g transform="translate(420,60)">
<rect x="0" y="0" width="280" height="290" rx="8" fill="#fde9e9" stroke="#d62728" stroke-width="2"/>
<text x="140" y="22" text-anchor="middle" font-weight="bold" fill="#d62728" font-size="14">GPT-2 small</text>
<text x="140" y="38" text-anchor="middle" fill="#666">decoder · 124M params · 2019</text>
<text x="60" y="60" font-weight="bold" fill="#222">Attention:</text>
<rect x="60" y="68" width="160" height="50" fill="#fff" stroke="#d62728" rx="4"/>
<text x="140" y="86" text-anchor="middle" fill="#444">causal (lower-triangular)</text>
<text x="140" y="102" text-anchor="middle" fill="#444">token t sees tokens 1...t only</text>
<text x="60" y="140" font-weight="bold" fill="#222">Objective:</text>
<rect x="60" y="148" width="160" height="50" fill="#fff" stroke="#d62728" rx="4"/>
<text x="140" y="166" text-anchor="middle" fill="#444">causal LM</text>
<text x="140" y="182" text-anchor="middle" fill="#444">predict next token</text>
<text x="60" y="220" font-weight="bold" fill="#222">Shape:</text>
<text x="60" y="240" fill="#444">12 layers · 12 heads · d=768</text>
<text x="60" y="256" fill="#444">vocab = 50k BPE · seq=1024</text>
<text x="60" y="276" font-weight="bold" fill="#d62728">Best for: generation, sampling</text>
</g>
</g>
<text x="380" y="370" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">Both fit in 6 GB VRAM. The difference is the attention mask, not the layer count.</text>
</svg>