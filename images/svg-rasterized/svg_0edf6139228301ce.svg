<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: 5.1 Iterative Refinement Workflow" role="img" viewBox="0 -11 700 211" xmlns="http://www.w3.org/2000/svg">
<!-- Step boxes -->
<rect fill="#E8F5E9" filter="url(#shadow_e379f1)" height="60" rx="8" stroke="#4CAF50" stroke-linecap="round" stroke-width="2" width="120" x="20" y="50"></rect>
<text fill="#2E7D32" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="80" y="75">1. Start Small</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="80" y="95">100 to 500 examples</text>
<path d="M 145 80 L 170 80" marker-end="url(#a4)" stroke="#888" stroke-linecap="round" stroke-width="1.5"></path>
<rect fill="url(#grad_e379f1_e3f2fd)" height="60" rx="8" stroke="#1976D2" stroke-linecap="round" stroke-width="2" width="120" x="175" y="50"></rect>
<text fill="#1565C0" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="235" y="75">2. Train &amp; Eval</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="235" y="95">1 to 2 epochs first</text>
<path d="M 300 80 L 325 80" marker-end="url(#a4)" stroke="#888" stroke-linecap="round" stroke-width="1.5"></path>
<rect fill="url(#grad_e379f1_fff3e0)" height="60" rx="8" stroke="#FF9800" stroke-linecap="round" stroke-width="2" width="120" x="330" y="50"></rect>
<text fill="#E65100" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="390" y="75">3. Error Analysis</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="390" y="95">Review failures</text>
<path d="M 455 80 L 480 80" marker-end="url(#a4)" stroke="#888" stroke-linecap="round" stroke-width="1.5"></path>
<rect fill="url(#grad_e379f1_f3e5f5)" height="60" rx="8" stroke="#7B1FA2" stroke-linecap="round" stroke-width="2" width="120" x="485" y="50"></rect>
<text fill="#6A1B9A" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="545" y="75">4. Improve Data</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="545" y="95">Fix + add examples</text>
<!-- Loop back arrow -->
<path d="M 545 115 L 545 155 L 235 155 L 235 115" fill="none" marker-end="url(#a4)" stroke="#888" stroke-dasharray="6,3" stroke-linecap="round" stroke-width="1.5"></path>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="390" y="172">Repeat until quality target met</text>
<defs>
<lineargradient id="grad_e379f1_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#F3E5F5"></stop></lineargradient>
<lineargradient id="grad_e379f1_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#E3F2FD"></stop></lineargradient>
<lineargradient id="grad_e379f1_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#FFF3E0"></stop></lineargradient>
<filter height="115%" id="shadow_e379f1" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="a4" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5"><polygon fill="#888" points="0 0, 10 3.5, 0 7"></polygon></marker></defs>
</svg>