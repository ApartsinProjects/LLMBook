<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Synthetic-data curation pipeline: generate, score, dedup, filter" viewBox="0 0 880 340" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="340" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Synthetic-data curation: 1M raw to ~600K shippable in four stages</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">80/20 rule: top 60% by quality outperforms full unfiltered set</text>
<g font-size="10">
<g transform="translate(20,70)">
<rect width="160" height="230" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="80" y="22" font-weight="700" text-anchor="middle" fill="#a67c1a">1. Generate</text>
<text x="80" y="48" text-anchor="middle" fill="#1a1a2e">prompts x model</text>
<text x="80" y="64" text-anchor="middle" fill="#1a1a2e">(GPT-4o, Claude...)</text>
<text x="80" y="86" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">Evol-Instruct, persona</text>
<text x="80" y="116" font-weight="700" text-anchor="middle" fill="#1a1a2e">1,000,000 raw</text>
<text x="80" y="148" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">20-40% low quality,</text>
<text x="80" y="162" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">duplicate, or unsafe</text>
<text x="80" y="196" font-size="9" text-anchor="middle" fill="#5a4a3a">cap synthetic share at</text>
<text x="80" y="210" font-size="9" text-anchor="middle" fill="#5a4a3a">1-2% per domain</text>
</g>
<g transform="translate(200,70)">
<rect width="170" height="230" rx="8" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="85" y="22" font-weight="700" text-anchor="middle" fill="#3d4d8a">2. LLM-as-judge score</text>
<text x="85" y="46" text-anchor="middle" fill="#1a1a2e">multi-dim rubric:</text>
<text x="85" y="62" font-size="9" text-anchor="middle" fill="#1a1a2e">- instruction clarity (1-5)</text>
<text x="85" y="76" font-size="9" text-anchor="middle" fill="#1a1a2e">- response quality (1-5)</text>
<text x="85" y="90" font-size="9" text-anchor="middle" fill="#1a1a2e">- alignment (1-5)</text>
<text x="85" y="104" font-size="9" text-anchor="middle" fill="#1a1a2e">- complexity (1-5)</text>
<text x="85" y="118" font-size="9" text-anchor="middle" fill="#1a1a2e">- safety (pass/fail)</text>
<text x="85" y="148" font-size="9" font-weight="700" text-anchor="middle" fill="#7a2a4a">use diff judge model</text>
<text x="85" y="162" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">(generate w/ GPT, judge w/ Claude)</text>
<text x="85" y="195" text-anchor="middle" fill="#1a1a2e">~750K pass &gt;= 4</text>
<text x="85" y="215" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">rho ~0.7-0.85 vs human</text>
</g>
<g transform="translate(390,70)">
<rect width="170" height="230" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
<text x="85" y="22" font-weight="700" text-anchor="middle" fill="#27ae60">3. Dedupe</text>
<text x="85" y="46" text-anchor="middle" fill="#1a1a2e">- exact hash</text>
<text x="85" y="62" text-anchor="middle" fill="#1a1a2e">- MinHash near-dup</text>
<text x="85" y="78" text-anchor="middle" fill="#1a1a2e">- semantic embedding</text>
<text x="85" y="100" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">threshold ~0.92 cosine</text>
<text x="85" y="148" text-anchor="middle" fill="#1a1a2e">~680K unique</text>
<text x="85" y="180" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">"5% stylistic tic</text>
<text x="85" y="194" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">can poison the pretrain"</text>
</g>
<g transform="translate(580,70)">
<rect width="170" height="230" rx="8" fill="#f5e3e8" stroke="#7a2a4a" stroke-width="2"/>
<text x="85" y="22" font-weight="700" text-anchor="middle" fill="#7a2a4a">4. Constraint filter</text>
<text x="85" y="46" text-anchor="middle" fill="#1a1a2e">- length bounds</text>
<text x="85" y="62" text-anchor="middle" fill="#1a1a2e">- language (fastText)</text>
<text x="85" y="78" text-anchor="middle" fill="#1a1a2e">- toxicity</text>
<text x="85" y="94" text-anchor="middle" fill="#1a1a2e">- topical relevance</text>
<text x="85" y="148" text-anchor="middle" fill="#1a1a2e">~600K final</text>
<text x="85" y="180" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">10-25% downstream</text>
<text x="85" y="194" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">model perf gain</text>
</g>
<g transform="translate(770,70)">
<rect width="90" height="230" rx="8" fill="#fce8d4" stroke="#a67c1a" stroke-width="2"/>
<text x="45" y="24" font-weight="700" text-anchor="middle" fill="#a67c1a">Train</text>
<text x="45" y="60" text-anchor="middle" fill="#27ae60" font-weight="700">SFT / DPO</text>
<text x="45" y="100" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">60% of raw</text>
<text x="45" y="114" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">is shippable</text>
</g>
<g stroke="#1a1a2e" stroke-width="1.5" fill="none">
<line x1="180" y1="185" x2="200" y2="185" marker-end="url(#arr153)"/>
<line x1="370" y1="185" x2="390" y2="185" marker-end="url(#arr153)"/>
<line x1="560" y1="185" x2="580" y2="185" marker-end="url(#arr153)"/>
<line x1="750" y1="185" x2="770" y2="185" marker-end="url(#arr153)"/>
</g>
<defs>
<marker id="arr153" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1a1a2e"/></marker>
</defs>
</g>
</svg>