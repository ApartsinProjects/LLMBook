<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Swin shifted window attention: regular window partition on the left and shifted window partition on the right with arrows showing cross-window information flow" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 760 280" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="280" width="760"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="380" y="22">Swin: alternating W-MSA and SW-MSA layers route information across windows</text>
<g font-size="10">
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="160" y="48">Layer L (W-MSA): regular windows</text>
<g fill="#bbdefb" stroke="#1976d2" stroke-width="1.2">
<rect height="80" width="80" x="40" y="60"></rect><rect height="80" width="80" x="120" y="60"></rect><rect height="80" width="80" x="200" y="60"></rect>
<rect height="80" width="80" x="40" y="140"></rect><rect height="80" width="80" x="120" y="140"></rect><rect height="80" width="80" x="200" y="140"></rect>
</g>
<text fill="#0d47a1" font-size="9" text-anchor="middle" x="80" y="105">W1</text>
<text fill="#0d47a1" font-size="9" text-anchor="middle" x="160" y="105">W2</text>
<text fill="#0d47a1" font-size="9" text-anchor="middle" x="240" y="105">W3</text>
<text fill="#0d47a1" font-size="9" text-anchor="middle" x="80" y="185">W4</text>
<text fill="#0d47a1" font-size="9" text-anchor="middle" x="160" y="185">W5</text>
<text fill="#0d47a1" font-size="9" text-anchor="middle" x="240" y="185">W6</text>
<text fill="#b71c1c" font-weight="700" text-anchor="middle" x="600" y="48">Layer L+1 (SW-MSA): shifted by M/2</text>
<g fill="#ffcdd2" stroke="#c62828" stroke-width="1.2">
<rect height="40" width="40" x="480" y="60"></rect><rect height="40" width="80" x="520" y="60"></rect><rect height="40" width="80" x="600" y="60"></rect><rect height="40" width="40" x="680" y="60"></rect>
<rect height="80" width="40" x="480" y="100"></rect><rect height="80" width="80" x="520" y="100"></rect><rect height="80" width="80" x="600" y="100"></rect><rect height="80" width="40" x="680" y="100"></rect>
<rect height="40" width="40" x="480" y="180"></rect><rect height="40" width="80" x="520" y="180"></rect><rect height="40" width="80" x="600" y="180"></rect><rect height="40" width="40" x="680" y="180"></rect>
</g>
<text fill="#b71c1c" font-size="9" text-anchor="middle" x="560" y="145">W'2</text>
<text fill="#b71c1c" font-size="9" text-anchor="middle" x="640" y="145">W'3</text>
<line marker-end="url(#swArr)" stroke="#2e7d32" stroke-width="2" x1="290" x2="470" y1="140" y2="140"></line>
<defs>
<marker id="swArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e7d32"></path></marker>
</defs>
<text fill="#2e7d32" font-size="10" text-anchor="middle" x="380" y="135">shift M/2</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="380" y="250">Patches at window seams (e.g., between W1 and W2) end up inside W'2 at the next layer,</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="380" y="265">so information flows across windows in just two layers with O(N M^2) cost per layer.</text>
</g>
</svg>