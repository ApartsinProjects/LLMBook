<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="SDAE pipeline. A corrupted sentence is encoded to a single embedding z, and a decoder must reconstruct the original tokens from z alone, forcing the encoder to compress all semantic content into the bottleneck representation." style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="200" width="720"></rect>
<rect fill="#fff3e0" height="60" rx="6" stroke="#e67e22" stroke-width="1.5" width="150" x="10" y="70"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="85" y="95">Corrupt input</text>
<text fill="#555" font-size="11" text-anchor="middle" x="85" y="115">delete / swap / mask</text>
<rect fill="#e3f2fd" height="60" rx="6" stroke="#1976d2" stroke-width="1.5" width="120" x="200" y="70"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="260" y="95">Encoder</text>
<text fill="#555" font-size="11" text-anchor="middle" x="260" y="115">enc(noised x)</text>
<rect fill="#e8f5e9" height="40" rx="6" stroke="#2e7d32" stroke-width="1.5" width="80" x="360" y="80"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="400" y="105">embedding z</text>
<rect fill="#fce4ec" height="60" rx="6" stroke="#c2185b" stroke-width="1.5" width="120" x="480" y="70"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="540" y="95">Decoder</text>
<text fill="#555" font-size="11" text-anchor="middle" x="540" y="115">reconstruct x</text>
<rect fill="#f3e5f5" height="60" rx="6" stroke="#7b1fa2" stroke-width="1.5" width="90" x="620" y="70"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="665" y="95">Clean target</text>
<text fill="#555" font-size="11" text-anchor="middle" x="665" y="115">cross-entropy</text>
<line marker-end="url(#arrow-sdae)" stroke="#444" stroke-width="1.5" x1="160" x2="200" y1="100" y2="100"></line>
<line marker-end="url(#arrow-sdae)" stroke="#444" stroke-width="1.5" x1="320" x2="360" y1="100" y2="100"></line>
<line marker-end="url(#arrow-sdae)" stroke="#444" stroke-width="1.5" x1="440" x2="480" y1="100" y2="100"></line>
<line marker-end="url(#arrow-sdae)" stroke="#444" stroke-width="1.5" x1="600" x2="620" y1="100" y2="100"></line>
<text fill="#555" font-size="11" text-anchor="middle" x="400" y="160">Bottleneck: only z carries semantics across the decoder</text>
<defs><marker id="arrow-sdae" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="4"><path d="M0,0 L8,4 L0,8 z" fill="#444"></path></marker></defs>
</svg>