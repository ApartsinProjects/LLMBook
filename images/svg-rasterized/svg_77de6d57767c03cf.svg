<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 620 340" role="img" aria-label="Pyramid showing four testing layers from bottom to top: unit, integration, scenario, chaos, with cost increasing and test count decreasing toward the top" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<text x="310" y="24" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">Four-layer agent testing pyramid</text>

<polygon points="200,290 420,290 380,235 240,235" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="310" y="263" font-size="12" font-weight="600" fill="#2d3748" text-anchor="middle">Unit tests</text>
<text x="310" y="278" font-size="9" fill="#4a5568" text-anchor="middle">tools, validators, state machines, deterministic</text>

<polygon points="240,235 380,235 350,185 270,185" fill="#bee3f8" stroke="#3a73a8" stroke-width="1.5"/>
<text x="310" y="211" font-size="12" font-weight="600" fill="#2d3748" text-anchor="middle">Integration tests</text>
<text x="310" y="225" font-size="9" fill="#4a5568" text-anchor="middle">agent + tool wiring, schemas, transitions</text>

<polygon points="270,185 350,185 330,140 290,140" fill="#fed7aa" stroke="#d97706" stroke-width="1.5"/>
<text x="310" y="162" font-size="11" font-weight="600" fill="#2d3748" text-anchor="middle">Scenario tests</text>
<text x="310" y="175" font-size="8" fill="#4a5568" text-anchor="middle">full agent, outcome-based</text>

<polygon points="290,140 330,140 320,100 300,100" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<text x="310" y="123" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">Chaos</text>

<text x="100" y="120" font-size="10" font-weight="600" fill="#4a5568">Per test:</text>
<text x="100" y="135" font-size="9" fill="#b91c1c">high cost, slow, real LLM calls</text>
<text x="100" y="195" font-size="9" fill="#d97706">$$ medium, end-to-end runs</text>
<text x="100" y="240" font-size="9" fill="#3a73a8">$ cheap, mocked services</text>
<text x="100" y="285" font-size="9" fill="#3a73a8">fast, pure functions</text>

<text x="510" y="120" font-size="10" font-weight="600" fill="#4a5568">Count:</text>
<text x="510" y="135" font-size="9" fill="#4a5568">~5 to 20</text>
<text x="510" y="195" font-size="9" fill="#4a5568">~50 to 200</text>
<text x="510" y="240" font-size="9" fill="#4a5568">~hundreds</text>
<text x="510" y="285" font-size="9" fill="#4a5568">~thousands</text>

<text x="310" y="320" font-size="9" font-style="italic" fill="#718096" text-anchor="middle">More tests at the base, fewer (more expensive) at the top.</text>
</svg>