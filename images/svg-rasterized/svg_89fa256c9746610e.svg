<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Megatron MLP tensor parallelism" role="img" style="font-family: sans-serif; max-width: 100%; height: auto;" viewbox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="420" width="900"></rect>
<text fill="#5a4a3a" font-size="12" font-style="italic" text-anchor="middle" x="450" y="30">Up-projection column-parallel, down-projection row-parallel</text>
<!-- Input X -->
<g transform="translate(40, 88)">
<rect fill="#eef4fa" height="80" rx="6" stroke="#1a4078" stroke-width="2" width="100" x="0" y="32"></rect>
<text fill="#1a4078" font-size="13" font-weight="700" text-anchor="middle" x="50" y="67">X</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="50" y="86">(B, d)</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="50" y="104">replicated</text>
</g>
<!-- f: forward identity, backward all-reduce -->
<g transform="translate(140, 120)">
<text fill="#5a4a3a" font-size="12" font-weight="700" x="20" y="34">f</text>
<text fill="#5a4a3a" font-size="9" x="20" y="50">(id / AR)</text>
<path d="M 0 40 L 50 40" marker-end="url(#a3-1)" stroke="#1a4078" stroke-width="2"></path>
</g>
<!-- Up-proj column-parallel: W1 split -->
<g transform="translate(220, 64)">
<rect fill="#fef3e0" height="180" rx="6" stroke="#a67c1a" stroke-width="2" width="140" x="0" y="16"></rect>
<text fill="#a67c1a" font-size="12" font-weight="700" text-anchor="middle" x="70" y="38">W1: column-parallel</text>
<rect fill="#ffffff" height="120" stroke="#a67c1a" stroke-width="1" width="28" x="14" y="56"></rect>
<text fill="#a67c1a" font-size="9" font-weight="600" text-anchor="middle" x="28" y="122">W1(1)</text>
<rect fill="#ffffff" height="120" stroke="#a67c1a" stroke-width="1" width="28" x="46" y="56"></rect>
<text fill="#a67c1a" font-size="9" font-weight="600" text-anchor="middle" x="60" y="122">W1(2)</text>
<rect fill="#ffffff" height="120" stroke="#a67c1a" stroke-width="1" width="28" x="78" y="56"></rect>
<text fill="#a67c1a" font-size="9" font-weight="600" text-anchor="middle" x="92" y="122">W1(3)</text>
<rect fill="#ffffff" height="120" stroke="#a67c1a" stroke-width="1" width="28" x="110" y="56"></rect>
<text fill="#a67c1a" font-size="9" font-weight="600" text-anchor="middle" x="124" y="122">W1(4)</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="70" y="191">d × (4d/T)</text>
</g>
<!-- GELU sharded -->
<g transform="translate(370, 130)">
<rect fill="#f5e8d8" height="40" rx="4" stroke="#a67c1a" width="80" x="0" y="0"></rect>
<text fill="#a67c1a" font-size="11" font-weight="600" text-anchor="middle" x="40" y="20">GELU</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="40" y="33">elementwise</text>
</g>
<!-- arrow -->
<path d="M 450 150 L 490 150" marker-end="url(#a3-2)" stroke="#a67c1a" stroke-width="2"></path>
<!-- Down-proj row-parallel: W2 -->
<g transform="translate(490, 64)">
<rect fill="#ecf6ee" height="180" rx="6" stroke="#1f7a3a" stroke-width="2" width="140" x="0" y="16"></rect>
<text fill="#1f7a3a" font-size="12" font-weight="700" text-anchor="middle" x="70" y="38">W2: row-parallel</text>
<rect fill="#ffffff" height="28" stroke="#1f7a3a" stroke-width="1" width="112" x="14" y="56"></rect>
<text fill="#1f7a3a" font-size="9" font-weight="600" text-anchor="middle" x="70" y="74">W2(1)</text>
<rect fill="#ffffff" height="28" stroke="#1f7a3a" stroke-width="1" width="112" x="14" y="86"></rect>
<text fill="#1f7a3a" font-size="9" font-weight="600" text-anchor="middle" x="70" y="104">W2(2)</text>
<rect fill="#ffffff" height="28" stroke="#1f7a3a" stroke-width="1" width="112" x="14" y="116"></rect>
<text fill="#1f7a3a" font-size="9" font-weight="600" text-anchor="middle" x="70" y="134">W2(3)</text>
<rect fill="#ffffff" height="28" stroke="#1f7a3a" stroke-width="1" width="112" x="14" y="146"></rect>
<text fill="#1f7a3a" font-size="9" font-weight="600" text-anchor="middle" x="70" y="164">W2(4)</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="70" y="191">(4d/T) × d</text>
</g>
<!-- g: forward all-reduce, backward identity -->
<g transform="translate(640, 120)">
<text fill="#5a4a3a" font-size="12" font-weight="700" x="20" y="34">g</text>
<text fill="#5a4a3a" font-size="9" x="20" y="50">(AR / id)</text>
<path d="M 0 40 L 50 40" marker-end="url(#a3-3)" stroke="#1f7a3a" stroke-width="2"></path>
</g>
<!-- Output Y -->
<g transform="translate(720, 88)">
<rect fill="#eef4fa" height="80" rx="6" stroke="#1a4078" stroke-width="2" width="100" x="0" y="32"></rect>
<text fill="#1a4078" font-size="13" font-weight="700" text-anchor="middle" x="50" y="67">Y</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="50" y="86">(B, d)</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="50" y="104">replicated</text>
</g>
<defs>
<marker id="a3-1" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="4"><polygon fill="#1a4078" points="0 0, 8 4, 0 8"></polygon></marker>
<marker id="a3-2" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="4"><polygon fill="#a67c1a" points="0 0, 8 4, 0 8"></polygon></marker>
<marker id="a3-3" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="4"><polygon fill="#1f7a3a" points="0 0, 8 4, 0 8"></polygon></marker>
</defs>
</svg>