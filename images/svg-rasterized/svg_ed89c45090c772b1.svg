<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Adam vs AdamW update flow: Adam folds weight decay into the gradient before the adaptive scaling; AdamW applies it directly to the parameters after the adaptive step." role="img" style="max-width:720px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="awArr" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"></path></marker>
</defs>
<text fill="#222" font-size="14" font-weight="700" text-anchor="middle" x="360" y="22">Adam vs AdamW: where does weight decay enter?</text>
<g font-size="12">
<text fill="#c62828" font-weight="700" x="40" y="56">Adam (coupled)</text>
<rect fill="#ffebee" height="36" rx="5" stroke="#c62828" width="140" x="40" y="66"></rect>
<text text-anchor="middle" x="110" y="89">g + λw</text>
<text fill="#666" font-size="10" text-anchor="middle" x="110" y="118">decay folded into grad</text>
<rect fill="#fff3e0" height="36" rx="5" stroke="#ef6c00" width="160" x="210" y="66"></rect>
<text text-anchor="middle" x="290" y="89">m, v ← momentum, RMSprop</text>
<rect fill="#e3f2fd" height="36" rx="5" stroke="#1565c0" width="140" x="400" y="66"></rect>
<text text-anchor="middle" x="470" y="89">step: -η m̂ / (√v̂ + ε)</text>
<rect fill="#e8f5e9" height="36" rx="5" stroke="#2e7d32" width="120" x="570" y="66"></rect>
<text text-anchor="middle" x="630" y="89">w ← w + step</text>
<line marker-end="url(#awArr)" stroke="#555" stroke-width="1.5" x1="180" x2="210" y1="84" y2="84"></line>
<line marker-end="url(#awArr)" stroke="#555" stroke-width="1.5" x1="370" x2="400" y1="84" y2="84"></line>
<line marker-end="url(#awArr)" stroke="#555" stroke-width="1.5" x1="540" x2="570" y1="84" y2="84"></line>
<text fill="#2e7d32" font-weight="700" x="40" y="166">AdamW (decoupled)</text>
<rect fill="#e8f5e9" height="36" rx="5" stroke="#2e7d32" width="140" x="40" y="176"></rect>
<text text-anchor="middle" x="110" y="199">g  (no decay term)</text>
<rect fill="#fff3e0" height="36" rx="5" stroke="#ef6c00" width="160" x="210" y="176"></rect>
<text text-anchor="middle" x="290" y="199">m, v ← momentum, RMSprop</text>
<rect fill="#e3f2fd" height="36" rx="5" stroke="#1565c0" width="140" x="400" y="176"></rect>
<text text-anchor="middle" x="470" y="199">step: -η m̂ / (√v̂ + ε)</text>
<rect fill="#e8f5e9" height="36" rx="5" stroke="#2e7d32" width="120" x="570" y="176"></rect>
<text text-anchor="middle" x="630" y="199">w ← w + step - ηλw</text>
<text fill="#2e7d32" font-size="10" text-anchor="middle" x="630" y="228">decay applied to w directly</text>
<line marker-end="url(#awArr)" stroke="#555" stroke-width="1.5" x1="180" x2="210" y1="194" y2="194"></line>
<line marker-end="url(#awArr)" stroke="#555" stroke-width="1.5" x1="370" x2="400" y1="194" y2="194"></line>
<line marker-end="url(#awArr)" stroke="#555" stroke-width="1.5" x1="540" x2="570" y1="194" y2="194"></line>
</g>
</svg>