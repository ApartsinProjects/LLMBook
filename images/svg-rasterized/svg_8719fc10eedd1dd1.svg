<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="MCP architecture: host, clients, servers" role="img" style="max-width:100%;height:auto;" viewbox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter height="108%" id="mcp272shadow" width="108%" x="-4%" y="-4%">
<fedropshadow dx="1" dy="2" flood-opacity="0.18" stddeviation="1.5"></fedropshadow>
</filter>
<marker id="mcp272arrow" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="3">
<path d="M0,0 L0,6 L8,3 z" fill="#4a5568"></path>
</marker>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="380" y="22">MCP architecture: host, clients, servers</text>
<g transform="translate(40, 50)">
