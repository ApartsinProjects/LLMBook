<rect fill="#3a73a8" height="26" rx="8" width="220" x="0" y="0"></rect>
<text fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" x="110" y="18">MCP Host</text>
<text fill="#1a4078" font-size="10" text-anchor="middle" x="110" y="44">Claude Desktop, Cursor, your agent</text>
<rect fill="#fff" height="48" rx="6" stroke="#3a73a8" stroke-width="1.5" width="180" x="20" y="56"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="middle" x="110" y="76">LLM Model</text>
<text fill="#1a4078" font-size="9" text-anchor="middle" x="110" y="92">selects which tool to call</text>
<rect fill="#fff8e1" height="36" rx="6" stroke="#d97706" stroke-width="1.5" width="180" x="20" y="116"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="middle" x="110" y="132">MCP Client A</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="110" y="146">protocol handler</text>
<rect fill="#fff8e1" height="36" rx="6" stroke="#d97706" stroke-width="1.5" width="180" x="20" y="158"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="middle" x="110" y="174">MCP Client B</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="110" y="188">one per server connection</text>
<rect fill="#fff8e1" height="32" rx="6" stroke="#d97706" stroke-width="1.5" width="180" x="20" y="200"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="middle" x="110" y="216">MCP Client C</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="110" y="228">multiplexed access</text>
