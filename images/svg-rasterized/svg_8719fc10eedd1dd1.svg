<line marker-end="url(#mcp272arrow)" stroke="#4a5568" stroke-width="1.2" x1="80" x2="-10" y1="58" y2="58"></line>
<line marker-end="url(#mcp272arrow)" stroke="#4a5568" stroke-width="1.2" x1="-10" x2="80" y1="100" y2="100"></line>
