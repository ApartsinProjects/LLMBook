<g transform="translate(490, 50)">
<rect fill="#e8f5e9" filter="url(#mcp272shadow)" height="64" rx="8" stroke="#047857" stroke-width="1.8" width="240" x="0" y="0"></rect>
<rect fill="#047857" height="22" rx="8" width="240" x="0" y="0"></rect>
<text fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" x="120" y="16">MCP Server: PostgreSQL</text>
<text fill="#3d4f3d" font-size="9" text-anchor="middle" x="120" y="38">Tools: query, Resources: schema</text>
<text fill="#3d4f3d" font-size="9" text-anchor="middle" x="120" y="54">Prompts: analytics-template</text>
<rect fill="#e8f5e9" filter="url(#mcp272shadow)" height="64" rx="8" stroke="#047857" stroke-width="1.8" width="240" x="0" y="86"></rect>
<rect fill="#047857" height="22" rx="8" width="240" x="0" y="86"></rect>
<text fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" x="120" y="102">MCP Server: Filesystem</text>
<text fill="#3d4f3d" font-size="9" text-anchor="middle" x="120" y="124">Tools: read, write, list, search</text>
<text fill="#3d4f3d" font-size="9" text-anchor="middle" x="120" y="140">Resources: file://*</text>
<rect fill="#e8f5e9" filter="url(#mcp272shadow)" height="64" rx="8" stroke="#047857" stroke-width="1.8" width="240" x="0" y="172"></rect>
<rect fill="#047857" height="22" rx="8" width="240" x="0" y="172"></rect>
<text fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" x="120" y="188">MCP Server: GitHub</text>
<text fill="#3d4f3d" font-size="9" text-anchor="middle" x="120" y="210">Tools: create-issue, search-prs</text>
<text fill="#3d4f3d" font-size="9" text-anchor="middle" x="120" y="226">Resources: repo://owner/name</text>
<text fill="#3d4f3d" font-size="10" font-style="italic" text-anchor="middle" x="120" y="262">One server per integration; same protocol everywhere.</text>
</g>
</g>
</svg>