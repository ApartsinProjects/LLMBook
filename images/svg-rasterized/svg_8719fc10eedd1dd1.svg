<g font-size="10" transform="translate(280, 80)">
<text fill="#4a5568" font-style="italic" x="0" y="0">JSON-RPC 2.0</text>
<text fill="#4a5568" font-style="italic" x="0" y="14">over STDIO or Streamable HTTP</text>
