<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Five-level fallback strategy hierarchy from least to most disruptive: L1 clarification question, L2 rephrasing request, L3 capability redirect, L4 graceful acknowledgment, L5 human handoff." role="img" viewBox="0 -9 730 369" xmlns="http://www.w3.org/2000/svg">
<!-- Level 1 -->
<rect fill="#e8f5e9" filter="url(#shadow_6ca48f)" height="42" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="340" x="180" y="45"></rect>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" x="200" y="66">L1</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" x="225" y="66">Clarification Question</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="225" y="80">"Did you mean X or Y?"</text>
<line marker-end="url(#fbArrow)" stroke="#aaa" stroke-linecap="round" stroke-width="1.5" x1="350" x2="350" y1="87" y2="103"></line>
<!-- Level 2 -->
<rect fill="url(#grad_6ca48f_e8f4fd)" height="42" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="340" x="180" y="105"></rect>
<text fill="#3498db" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" x="200" y="126">L2</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" x="225" y="126">Rephrasing Request</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="225" y="140">"Could you rephrase that? I want to help but I am not sure what you need."</text>
<line marker-end="url(#fbArrow)" stroke="#aaa" stroke-linecap="round" stroke-width="1.5" x1="350" x2="350" y1="147" y2="163"></line>
<!-- Level 3 -->
<rect fill="#f5eef8" height="42" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="340" x="180" y="165"></rect>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" x="200" y="186">L3</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" x="225" y="186">Capability Redirect</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="225" y="200">"I can help with A, B, or C. Which is closest to what you need?"</text>
<line marker-end="url(#fbArrow)" stroke="#aaa" stroke-linecap="round" stroke-width="1.5" x1="350" x2="350" y1="207" y2="223"></line>
<!-- Level 4 -->
<rect fill="url(#grad_6ca48f_fef9e7)" height="42" rx="8" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="340" x="180" y="225"></rect>
<text fill="#f39c12" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" x="200" y="246">L4</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" x="225" y="246">Graceful Acknowledgment</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="225" y="260">"I do not have that information, but here is what I can tell you..."</text>
<line marker-end="url(#fbArrow)" stroke="#aaa" stroke-linecap="round" stroke-width="1.5" x1="350" x2="350" y1="267" y2="283"></line>
<!-- Level 5 -->
<rect fill="url(#grad_6ca48f_fdedec)" height="42" rx="8" stroke="#e74c3c" stroke-linecap="round" stroke-width="2" width="340" x="180" y="285"></rect>
<text fill="#e74c3c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" x="200" y="306">L5</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" x="225" y="306">Human Handoff</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="225" y="320">"Let me connect you with a human agent who can assist."</text>
<!-- Side labels -->
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="end" x="160" y="170">Least</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="end" x="160" y="182">disruptive</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="540" y="170">Most</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="540" y="182">disruptive</text>
<!-- Arrow along side -->
<line marker-end="url(#fbArrow)" stroke="#ddd" stroke-linecap="round" stroke-width="1.5" x1="155" x2="155" y1="60" y2="310"></line>
<line marker-end="url(#fbArrow)" stroke="#ddd" stroke-linecap="round" stroke-width="1.5" x1="545" x2="545" y1="60" y2="310"></line>
<defs>
<lineargradient id="grad_6ca48f_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_6ca48f_fdedec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffcfb"></stop><stop offset="100%" stop-color="#fdedec"></stop></lineargradient>
<lineargradient id="grad_6ca48f_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_6ca48f" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="fbArrow" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3">
<polygon fill="#aaa" points="0 0, 8 3, 0 6"></polygon>
</marker>
</defs>
</svg>