<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Speech-to-speech joint vocabulary pipeline. A waveform is downsampled by a strided convolutional encoder to about twelve and a half hertz, then a stack of K residual vector quantizers produces K discrete codes per frame from K codebooks. These audio codes join the standard text tokens in one shared vocabulary. A single autoregressive transformer emits an interleaved stream of text tokens and audio frames. For each frame, a small depth transformer takes the main model's frame hidden state and predicts the K codebook codes in parallel, which avoids multiplying the sequence length by K. The codes are decoded back to a waveform." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 810 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="s2sWave" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#b3e5fc"></stop><stop offset="100%" stop-color="#039be5"></stop></lineargradient>
<lineargradient id="s2sCodec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"></stop><stop offset="100%" stop-color="#43a047"></stop></lineargradient>
<lineargradient id="s2sMain" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3e0"></stop><stop offset="100%" stop-color="#fb8c00"></stop></lineargradient>
<lineargradient id="s2sDepth" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e1bee7"></stop><stop offset="100%" stop-color="#8e24aa"></stop></lineargradient>
<lineargradient id="s2sText" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bbdefb"></stop><stop offset="100%" stop-color="#1e88e5"></stop></lineargradient>
<filter height="116%" id="s2sShadow" width="116%" x="-8%" y="-8%"><fedropshadow dx="1" dy="1.5" flood-opacity="0.18" stddeviation="1.5"></fedropshadow></filter>
<marker id="s2sArrow" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"></path></marker>
</defs>
<rect fill="#fafafa" height="400" rx="8" width="810" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="405" y="26">Speech-to-speech: RVQ codec → one shared vocabulary → depth transformer</text>
<!-- waveform -->
<rect fill="url(#s2sWave)" filter="url(#s2sShadow)" height="60" rx="9" width="92" x="22" y="78"></rect>
<path d="M34,108 q8,-18 16,0 t16,0 t16,0 t16,0" fill="none" stroke="#fff" stroke-width="2"></path>
<text fill="#e1f5fe" font-size="11" text-anchor="middle" x="68" y="130">16–24 kHz</text>
<line marker-end="url(#s2sArrow)" stroke="#777" stroke-width="2" x1="114" x2="146" y1="108" y2="108"></line>
<!-- codec / RVQ -->
<rect fill="url(#s2sCodec)" filter="url(#s2sShadow)" height="118" rx="10" width="150" x="146" y="64"></rect>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="221" y="86">neural codec</text>
<text fill="#e8f5e9" font-size="10" text-anchor="middle" x="221" y="102">strided conv → ~12.5 Hz</text>
<!-- K codebook chips -->
<g fill="#fff" font-size="9.5" font-weight="600" text-anchor="middle">
<rect fill="#2e7d32" height="18" rx="4" width="56" x="160" y="112"></rect><text x="188" y="125">Q₁ code</text>
<rect fill="#388e3c" height="18" rx="4" width="56" x="160" y="134"></rect><text x="188" y="147">Q₂ code</text>
<rect fill="#43a047" height="18" rx="4" width="56" x="160" y="156"></rect><text x="188" y="169">Q₃ code</text>
<rect fill="#4caf50" height="18" rx="4" width="56" x="226" y="112"></rect><text x="254" y="125">⋯</text>
<rect fill="#4caf50" height="18" rx="4" width="56" x="226" y="134"></rect><text x="254" y="147">⋯</text>
<rect fill="#66bb6a" height="18" rx="4" width="56" x="226" y="156"></rect><text x="254" y="169">Qᵖ code</text>
</g>
<text fill="#888" font-size="9.5" text-anchor="middle" x="221" y="196">K residual codes per frame</text>
<!-- residual eqn -->
<text fill="#2e7d32" font-size="10.5" text-anchor="middle" x="221" y="50">eᵖ = Qᵖ( x − Σⱼ₃ᵖ Qⱼ(·) )</text>
<line marker-end="url(#s2sArrow)" stroke="#777" stroke-width="2" x1="296" x2="332" y1="123" y2="123"></line>
<!-- shared vocab -->
<rect fill="#eceff1" height="74" rx="9" stroke="#b0bec5" stroke-width="1.3" width="116" x="332" y="86"></rect>
<text fill="#455a64" font-size="11" font-weight="700" text-anchor="middle" x="390" y="106">shared vocab</text>
<rect fill="url(#s2sText)" height="16" rx="4" width="44" x="344" y="116"></rect><text fill="#fff" font-size="9" text-anchor="middle" x="366" y="128">128K text</text>
<rect fill="url(#s2sCodec)" height="16" rx="4" width="48" x="392" y="116"></rect><text fill="#fff" font-size="9" text-anchor="middle" x="416" y="128">8×2K audio</text>
<text fill="#888" font-size="9.5" text-anchor="middle" x="390" y="150">disjoint union ≈ 144K</text>
<line marker-end="url(#s2sArrow)" stroke="#777" stroke-width="2" x1="448" x2="484" y1="123" y2="123"></line>
<!-- main transformer -->
<rect fill="url(#s2sMain)" filter="url(#s2sShadow)" height="90" rx="10" width="118" x="484" y="78"></rect>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="543" y="116">shared AR</text>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="543" y="133">transformer</text>
<text fill="#fff3e0" font-size="9.5" text-anchor="middle" x="543" y="152">one frame hidden state hᵗ</text>
<!-- depth transformer -->
<line marker-end="url(#s2sArrow)" stroke="#777" stroke-width="2" x1="602" x2="638" y1="123" y2="123"></line>
<rect fill="url(#s2sDepth)" filter="url(#s2sShadow)" height="90" rx="10" width="150" x="638" y="78"></rect>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="713" y="104">depth transformer</text>
<text fill="#f3e5f5" font-size="10" text-anchor="middle" x="713" y="122">expands hᵗ → K codes</text>
<text fill="#f3e5f5" font-size="10" text-anchor="middle" x="713" y="138">in parallel (no L×K blow-up)</text>
<text fill="#e1bee7" font-size="9.5" text-anchor="middle" x="713" y="158">Moshi-style head</text>
<!-- interleaved stream row -->
<text fill="#555" font-size="12" font-weight="600" text-anchor="middle" x="405" y="222">Interleaved output stream (one autoregressive loop):</text>
<g font-size="10.5" font-weight="600" text-anchor="middle">
<rect fill="url(#s2sText)" filter="url(#s2sShadow)" height="30" rx="6" width="70" x="120" y="238"></rect><text fill="#fff" x="155" y="257">text tᵗ</text>
<rect fill="url(#s2sCodec)" filter="url(#s2sShadow)" height="30" rx="6" width="46" x="196" y="238"></rect><text fill="#fff" x="219" y="257">aᵗ¹</text>
<rect fill="url(#s2sCodec)" filter="url(#s2sShadow)" height="30" rx="6" width="46" x="246" y="238"></rect><text fill="#fff" x="269" y="257">aᵗ²</text>
<rect fill="url(#s2sCodec)" filter="url(#s2sShadow)" height="30" rx="6" width="46" x="296" y="238"></rect><text fill="#fff" x="319" y="257">⋯</text>
<rect fill="url(#s2sCodec)" filter="url(#s2sShadow)" height="30" rx="6" width="46" x="346" y="238"></rect><text fill="#fff" x="369" y="257">aᵗᵖ</text>
<rect fill="url(#s2sText)" filter="url(#s2sShadow)" height="30" rx="6" width="70" x="404" y="238"></rect><text fill="#fff" x="439" y="257">text tᵗ₊₁</text>
<rect fill="url(#s2sCodec)" filter="url(#s2sShadow)" height="30" rx="6" width="46" x="480" y="238"></rect><text fill="#fff" x="503" y="257">a¹</text>
<rect fill="url(#s2sCodec)" filter="url(#s2sShadow)" height="30" rx="6" width="46" x="530" y="238"></rect><text fill="#fff" x="553" y="257">a²</text>
<rect fill="url(#s2sCodec)" filter="url(#s2sShadow)" height="30" rx="6" width="46" x="580" y="238"></rect><text fill="#fff" x="603" y="257">⋯</text>
</g>
<text fill="#888" font-size="9.5" text-anchor="middle" x="269" y="288">frame t: K audio codes</text>
<text fill="#888" font-size="9.5" text-anchor="middle" x="503" y="288">frame t+1</text>
<!-- decode back -->
<line marker-end="url(#s2sArrow)" stroke="#777" stroke-width="2" x1="640" x2="676" y1="253" y2="253"></line>
<rect fill="url(#s2sWave)" filter="url(#s2sShadow)" height="30" rx="6" width="110" x="676" y="238"></rect>
<text fill="#fff" font-size="10.5" font-weight="600" text-anchor="middle" x="731" y="257">decode → waveform</text>
<!-- bottom note -->
<rect fill="#e3f2fd" height="60" rx="9" stroke="#90caf9" stroke-width="1" width="570" x="120" y="318"></rect>
<text fill="#1565c0" font-size="11.5" font-weight="600" text-anchor="middle" x="405" y="340">Text stream carries semantics; audio stream carries prosody, timbre, disfluencies.</text>
<text fill="#1976d2" font-size="10.5" text-anchor="middle" x="405" y="360">Because both live in one vocabulary, the model can react to a laugh or whisper with no explicit text label for it.</text>
</svg>