<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Mid-2026 LLM model landscape grouped by serving footprint into frontier proprietary, frontier open-weight, mid-size open-weight, multimodal, and reasoning specialist categories with representative releases per group" role="img" style="display:block;margin:1.2em auto;max-width:780px;width:100%;height:auto;" viewbox="0 0 910 360" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="360" rx="6" width="760" x="0" y="0"></rect>
<text font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="380" y="26">LLM model landscape (mid-2026)</text>
<g font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle">
<rect fill="#1a4078" height="60" rx="6" width="220" x="40" y="50"></rect>
<text fill="#fff" font-weight="700" x="150" y="72">Frontier proprietary</text>
<text fill="#fff" x="150" y="88">Claude Opus 4.5,</text>
<text fill="#fff" x="150" y="102">GPT-5, Gemini 2.5 Pro</text>
<rect fill="#1f7a3a" height="60" rx="6" width="220" x="280" y="50"></rect>
<text fill="#fff" font-weight="700" x="390" y="72">Open MoE frontier</text>
<text fill="#fff" x="390" y="88">DeepSeek-V3 / R1,</text>
<text fill="#fff" x="390" y="102">Llama-4 Maverick, Mixtral 8x22B</text>
<rect fill="#6a1b9a" height="60" rx="6" width="220" x="520" y="50"></rect>
<text fill="#fff" font-weight="700" x="630" y="72">Long-context</text>
<text fill="#fff" x="630" y="88">Gemini 2.5 Pro, Claude 4.5,</text>
<text fill="#fff" x="630" y="102">Llama-4 Scout (10M), Yi-1.5 200K</text>
<rect fill="#a67c1a" height="60" rx="6" width="220" x="40" y="130"></rect>
<text fill="#fff" font-weight="700" x="150" y="152">Dense large open</text>
<text fill="#fff" x="150" y="168">Llama-3.1 405B / 70B,</text>
<text fill="#fff" x="150" y="182">Mistral Large 2, Qwen2.5 72B</text>
<rect fill="#bf360c" height="60" rx="6" width="220" x="280" y="130"></rect>
<text fill="#fff" font-weight="700" x="390" y="152">Mid-tier open</text>
<text fill="#fff" x="390" y="168">Mistral Small 3, Yi-1.5 34B,</text>
<text fill="#fff" x="390" y="182">Llama-3.1 8B, Qwen2.5 14B</text>
<rect fill="#666" height="60" rx="6" width="220" x="520" y="130"></rect>
<text fill="#fff" font-weight="700" x="630" y="152">Small / distillation targets</text>
<text fill="#fff" x="630" y="168">Llama-3.2 1B/3B, Phi-3.5,</text>
<text fill="#fff" x="630" y="182">Gemma-2 2B, SmolLM2</text>
<rect fill="none" height="100" rx="6" stroke="#1a4078" stroke-dasharray="4,3" stroke-width="1.5" width="680" x="40" y="210"></rect>
<text fill="#1a4078" font-weight="700" x="380" y="234">Selection axes</text>
<text fill="#1a4078" text-anchor="middle" x="380" y="252">Capability ceiling. License terms. Active vs total parameters. Context length.</text>
<text fill="#1a4078" text-anchor="middle" x="380" y="270">Ecosystem support (inference / training frameworks). Multilingual coverage.</text>
<text fill="#666" font-size="10" x="380" y="298">2026 trend: MoE for cost-frontier, dense for predictability, distillation for edge.</text>
</g>
