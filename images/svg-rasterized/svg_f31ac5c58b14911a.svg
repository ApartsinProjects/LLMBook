<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="GloVe co-occurrence matrix: a square matrix X with words on both axes; cell X_ij stores how often word i appears within a context window of word j; the matrix factorizes into two low-dimensional embedding matrices whose dot products approximate log X_ij." role="img" style="max-width:660px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 660 280" xmlns="http://www.w3.org/2000/svg">
<text fill="#222" font-size="14" font-weight="700" text-anchor="middle" x="330" y="22">GloVe: log-bilinear factorization of the co-occurrence matrix</text>
<g font-size="11" text-anchor="middle">
<text fill="#555" x="30" y="60">word i \ j</text>
<text fill="#0d47a1" font-weight="700" x="100" y="60">ice</text>
<text fill="#0d47a1" font-weight="700" x="160" y="60">steam</text>
<text fill="#0d47a1" font-weight="700" x="220" y="60">water</text>
<text fill="#0d47a1" font-weight="700" x="280" y="60">solid</text>
<text fill="#0d47a1" font-weight="700" x="30" y="90">ice</text>
<text fill="#0d47a1" font-weight="700" x="30" y="115">steam</text>
<text fill="#0d47a1" font-weight="700" x="30" y="140">water</text>
<text fill="#0d47a1" font-weight="700" x="30" y="165">solid</text>
<rect fill="#e3f2fd" height="100" stroke="#1565c0" width="60" x="70" y="75"></rect>
<rect fill="#e3f2fd" height="100" stroke="#1565c0" width="60" x="130" y="75"></rect>
<rect fill="#e3f2fd" height="100" stroke="#1565c0" width="60" x="190" y="75"></rect>
<rect fill="#e3f2fd" height="100" stroke="#1565c0" width="60" x="250" y="75"></rect>
<text fill="#0d47a1" x="100" y="92">--</text><text fill="#0d47a1" x="160" y="92">22</text><text fill="#0d47a1" x="220" y="92">198</text><text fill="#0d47a1" x="280" y="92">189</text>
<text fill="#0d47a1" x="100" y="117">22</text><text fill="#0d47a1" x="160" y="117">--</text><text fill="#0d47a1" x="220" y="117">220</text><text fill="#0d47a1" x="280" y="117">7</text>
<text fill="#0d47a1" x="100" y="142">198</text><text fill="#0d47a1" x="160" y="142">220</text><text fill="#0d47a1" x="220" y="142">--</text><text fill="#0d47a1" x="280" y="142">10</text>
<text fill="#0d47a1" x="100" y="167">189</text><text fill="#0d47a1" x="160" y="167">7</text><text fill="#0d47a1" x="220" y="167">10</text><text fill="#0d47a1" x="280" y="167">--</text>
<text fill="#888" font-size="11" x="180" y="200">co-occurrence counts X_ij</text>
<text fill="#333" font-size="20" x="345" y="125">=&gt;</text>
<rect fill="#fff3e0" height="100" stroke="#ef6c00" width="100" x="390" y="75"></rect>
<text fill="#e65100" font-weight="700" x="440" y="125">W</text>
<text fill="#555" font-size="10" x="440" y="145">V x d</text>
<text fill="#333" font-size="18" x="500" y="125">x</text>
<rect fill="#e8f5e9" height="100" stroke="#2e7d32" width="100" x="515" y="75"></rect>
<text fill="#1b5e20" font-weight="700" x="565" y="125">W~ᵀ</text>
<text fill="#555" font-size="10" x="565" y="145">d x V</text>
<text fill="#888" font-size="11" x="500" y="200">low-rank embeddings</text>
<text fill="#444" font-size="12" x="330" y="230">objective: w_i · w~_j + b_i + b~_j ≈ log X_ij    (weighted by f(X_ij))</text>
<text fill="#888" font-size="11" x="330" y="250">ratios of rows of X encode meaning: log X_ik / X_jk separates "ice" from "steam"</text>
</g>
</svg>