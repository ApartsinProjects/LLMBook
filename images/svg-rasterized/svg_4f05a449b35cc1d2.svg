<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Backpressure pipeline for LLM serving: incoming requests pass through a rate limiter (token bucket, per-user quotas, burst capacity) emitting 429 when exceeded, then a bounded queue with priority ordering before reaching the model workers." role="img" style="font-family: sans-serif;" viewBox="0 -9 820 449" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadowBP" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
<marker id="arrowBP" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#555" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="arrowRed" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#e94560" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="arrowGreen" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#27ae60" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<!-- Incoming traffic -->
<rect fill="#e8f4fd" filter="url(#shadowBP)" height="55" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="110" x="20" y="100"></rect>
<text fill="#1565c0" font-size="12" font-weight="600" text-anchor="middle" x="75" y="124">Incoming</text>
<text fill="#1565c0" font-size="12" font-weight="600" text-anchor="middle" x="75" y="142">Requests</text>
<!-- Arrow to Rate Limiter -->
<line marker-end="url(#arrowBP)" stroke="#555" stroke-linecap="round" stroke-width="2" x1="130" x2="175" y1="128" y2="128"></line>
<!-- Rate Limiter -->
<rect fill="#fce4ec" filter="url(#shadowBP)" height="85" rx="10" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="120" x="180" y="85"></rect>
<text fill="#e94560" font-size="12" font-weight="700" text-anchor="middle" x="240" y="110">Rate Limiter</text>
<text fill="#555" font-size="11" text-anchor="middle" x="240" y="128">Token bucket</text>
<text fill="#555" font-size="11" text-anchor="middle" x="240" y="144">Per-user quotas</text>
<text fill="#555" font-size="11" text-anchor="middle" x="240" y="160">Burst capacity</text>
<!-- Rejected path down -->
<line marker-end="url(#arrowRed)" stroke="#e94560" stroke-dasharray="5" stroke-linecap="round" stroke-width="2" x1="240" x2="240" y1="170" y2="210"></line>
<rect fill="#fce4ec" height="35" rx="6" stroke="#e94560" stroke-linecap="round" stroke-width="1.5" width="120" x="180" y="215"></rect>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="240" y="237">429 Too Many</text>
<!-- Arrow to Queue -->
<line marker-end="url(#arrowBP)" stroke="#555" stroke-linecap="round" stroke-width="2" x1="300" x2="345" y1="128" y2="128"></line>
<!-- Backpressure Queue -->
<rect fill="#fff3e0" filter="url(#shadowBP)" height="105" rx="10" stroke="#ff9800" stroke-linecap="round" stroke-width="2" width="140" x="350" y="75"></rect>
<text fill="#e65100" font-size="12" font-weight="700" text-anchor="middle" x="420" y="100">Bounded Queue</text>
<text fill="#555" font-size="11" text-anchor="middle" x="420" y="118">Backpressure signals</text>
<text fill="#555" font-size="11" text-anchor="middle" x="420" y="134">Priority ordering</text>
<text fill="#555" font-size="11" text-anchor="middle" x="420" y="150">Health: utilization %</text>
<!-- Queue utilization bar -->
<rect fill="#eee" height="10" rx="3" stroke="#ccc" stroke-linecap="round" width="100" x="370" y="158"></rect>
<rect fill="#ff9800" height="10" rx="3" width="65" x="370" y="158"></rect>
<text fill="#e65100" font-size="11" x="480" y="167">65%</text>
<!-- Queue overflow -->
<line marker-end="url(#arrowRed)" stroke="#e94560" stroke-dasharray="5" stroke-linecap="round" stroke-width="2" x1="420" x2="420" y1="180" y2="210"></line>
<rect fill="#fce4ec" height="35" rx="6" stroke="#e94560" stroke-linecap="round" stroke-width="1.5" width="120" x="360" y="215"></rect>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="420" y="237">503 Overloaded</text>
<!-- Arrow to GPU Workers -->
<line marker-end="url(#arrowBP)" stroke="#555" stroke-linecap="round" stroke-width="2" x1="490" x2="545" y1="128" y2="128"></line>
<!-- GPU Worker Pool -->
<rect fill="#e8f5e9" filter="url(#shadowBP)" height="230" rx="12" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="250" x="550" y="55"></rect>
<text fill="#2e7d32" font-size="13" font-weight="700" text-anchor="middle" x="675" y="80">GPU Worker Pool</text>
<text fill="#555" font-size="11" text-anchor="middle" x="675" y="98">Auto-scales based on queue depth</text>
<!-- Worker boxes -->
<rect fill="white" height="40" rx="6" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" width="100" x="570" y="110"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="620" y="126">Worker 1</text>
<text fill="#27ae60" font-size="11" text-anchor="middle" x="620" y="142">GPU 0 (active)</text>
<rect fill="white" height="40" rx="6" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" width="100" x="685" y="110"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="735" y="126">Worker 2</text>
<text fill="#27ae60" font-size="11" text-anchor="middle" x="735" y="142">GPU 1 (active)</text>
<rect fill="white" height="40" rx="6" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" width="100" x="570" y="160"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="620" y="176">Worker 3</text>
<text fill="#27ae60" font-size="11" text-anchor="middle" x="620" y="192">GPU 2 (active)</text>
<rect fill="white" height="40" rx="6" stroke="#27ae60" stroke-dasharray="5" stroke-linecap="round" stroke-width="1.5" width="100" x="685" y="160"></rect>
<text fill="#999" font-size="11" text-anchor="middle" x="735" y="176">Worker N</text>
<text fill="#999" font-size="11" text-anchor="middle" x="735" y="192">auto-scaled</text>
<!-- Scale-up signal -->
<rect fill="#f1f8e9" height="55" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" width="210" x="575" y="215"></rect>
<text fill="#2e7d32" font-size="11" font-weight="600" text-anchor="middle" x="680" y="235">Auto-Scaler Rules</text>
<text fill="#555" font-size="11" text-anchor="middle" x="680" y="252">Queue &gt; 80%: add replicas</text>
<text fill="#555" font-size="11" text-anchor="middle" x="680" y="266">Queue &lt; 20%: remove replicas</text>
<!-- Feedback arrow from scaler back to queue -->
<path d="M 575 260 Q 510 310 460 185" fill="none" marker-end="url(#arrowGreen)" stroke="#27ae60" stroke-dasharray="4" stroke-linecap="round" stroke-width="1.5"></path>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="498" y="295">scale signal</text>
<!-- Bottom: Metrics collection -->
<rect fill="#f8f9fa" height="95" rx="10" stroke="#bbb" stroke-dasharray="6" stroke-linecap="round" stroke-width="1.5" width="620" x="100" y="320"></rect>
<text fill="#555" font-size="13" font-weight="700" text-anchor="middle" x="410" y="345">Metrics and Observability</text>
<rect fill="white" height="28" rx="5" stroke="#3498db" stroke-linecap="round" stroke-width="1" width="130" x="120" y="358"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="185" y="377">Request rate (RPS)</text>
<rect fill="white" height="28" rx="5" stroke="#ff9800" stroke-linecap="round" stroke-width="1" width="130" x="265" y="358"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="330" y="377">Queue depth</text>
<rect fill="white" height="28" rx="5" stroke="#e94560" stroke-linecap="round" stroke-width="1" width="130" x="410" y="358"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="475" y="377">Rejection rate</text>
<rect fill="white" height="28" rx="5" stroke="#27ae60" stroke-linecap="round" stroke-width="1" width="145" x="555" y="358"></rect>
<text fill="#333" font-size="11" text-anchor="middle" x="628" y="377">GPU utilization (%)</text>
<text fill="#888" font-size="11" text-anchor="middle" x="410" y="407">Prometheus / Grafana / Datadog</text>
<!-- Dashed lines from components to metrics -->
<line stroke="#bbb" stroke-dasharray="3" stroke-linecap="round" stroke-width="1" x1="240" x2="185" y1="170" y2="320"></line>
<line stroke="#bbb" stroke-dasharray="3" stroke-linecap="round" stroke-width="1" x1="420" x2="330" y1="180" y2="320"></line>
<line stroke="#bbb" stroke-dasharray="3" stroke-linecap="round" stroke-width="1" x1="675" x2="628" y1="285" y2="320"></line>
</svg>