<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Provider API fine-tuning vs. self-hosted: each approach has distinct advantages and limitations" role="img" viewBox="0 -9 750 329" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_5c62ad_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#E3F2FD"></stop></lineargradient>
<lineargradient id="grad_5c62ad_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#F3E5F5"></stop></lineargradient>
<filter height="115%" id="shadow_5c62ad" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<!-- API side -->
<rect fill="url(#grad_5c62ad_e3f2fd)" filter="url(#shadow_5c62ad)" height="250" rx="12" stroke="#1976D2" stroke-linecap="round" stroke-width="2" width="320" x="30" y="50"></rect>
<text fill="#1565C0" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="190" y="78">Provider API Fine-Tuning</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="50" y="108">✔ No GPU infrastructure needed</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="50" y="130">✔ Minutes to start training</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="50" y="152">✔ Automatic scaling and serving</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="50" y="174">✔ Built-in monitoring dashboard</text>
<text fill="#C62828" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="50" y="204">✘ Limited hyperparameter control</text>
<text fill="#C62828" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="50" y="226">✘ Data sent to third party</text>
<text fill="#C62828" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="50" y="248">✘ Vendor lock-in risk</text>
<text fill="#C62828" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="50" y="270">✘ Higher per-token inference cost</text>
<!-- Self-hosted side -->
<rect fill="url(#grad_5c62ad_f3e5f5)" height="250" rx="12" stroke="#7B1FA2" stroke-linecap="round" stroke-width="2" width="320" x="400" y="50"></rect>
<text fill="#6A1B9A" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="560" y="78">Self-Hosted Fine-Tuning</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="420" y="108">✔ Full hyperparameter control</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="420" y="130">✔ Data stays on your infrastructure</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="420" y="152">✔ Any model (open-weight)</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="420" y="174">✔ Lower cost at scale</text>
<text fill="#C62828" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="420" y="204">✘ GPU procurement and management</text>
<text fill="#C62828" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="420" y="226">✘ ML engineering expertise required</text>
<text fill="#C62828" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="420" y="248">✘ Serving infrastructure needed</text>
<text fill="#C62828" font-family="Segoe UI, system-ui, sans-serif" font-size="12" x="420" y="270">✘ Days to weeks for setup</text>
</svg>