<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="DistilBERT: three losses on one masked input" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="280" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="bold" text-anchor="middle" x="360" y="20">DistilBERT: three losses on one masked input</text>
<rect fill="#fff3e0" height="40" rx="6" stroke="#e67e22" stroke-width="1.5" width="140" x="20" y="50"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="90" y="75">Masked input x</text>
<rect fill="#e3f2fd" height="60" rx="6" stroke="#1976d2" stroke-width="1.5" width="160" x="200" y="20"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="280" y="42">Teacher (BERT, 12L)</text>
<text fill="#555" font-size="11" text-anchor="middle" x="280" y="60">frozen, 110M params</text>
<text fill="#555" font-size="11" text-anchor="middle" x="280" y="75">logits, hidden</text>
<rect fill="#e8f5e9" height="60" rx="6" stroke="#2e7d32" stroke-width="1.5" width="160" x="200" y="100"></rect>
<text fill="#1a1a2e" font-size="12" text-anchor="middle" x="280" y="122">Student (DistilBERT, 6L)</text>
<text fill="#555" font-size="11" text-anchor="middle" x="280" y="140">trainable, 66M params</text>
<text fill="#555" font-size="11" text-anchor="middle" x="280" y="155">logits, hidden</text>
<rect fill="#fce4ec" height="40" rx="6" stroke="#c2185b" stroke-width="1.5" width="150" x="420" y="20"></rect>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="495" y="38">KL @ T=2</text>
<text fill="#555" font-size="10" text-anchor="middle" x="495" y="53">soft logit matching</text>
<rect fill="#f3e5f5" height="40" rx="6" stroke="#7b1fa2" stroke-width="1.5" width="150" x="420" y="80"></rect>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="495" y="98">Cosine align</text>
<text fill="#555" font-size="10" text-anchor="middle" x="495" y="113">last-layer hidden</text>
<rect fill="#fffde7" height="40" rx="6" stroke="#f9a825" stroke-width="1.5" width="150" x="420" y="140"></rect>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="495" y="158">MLM CE</text>
<text fill="#555" font-size="10" text-anchor="middle" x="495" y="173">true masked tokens</text>
<rect fill="#e0f7fa" height="50" rx="6" stroke="#00838f" stroke-width="1.5" width="100" x="600" y="80"></rect>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="650" y="100">Total loss</text>
<text fill="#555" font-size="10" text-anchor="middle" x="650" y="115">α MLM + β KL</text>
<text fill="#555" font-size="10" text-anchor="middle" x="650" y="127">+ γ cos</text>
<line marker-end="url(#arrow-dbert)" stroke="#444" stroke-width="1.5" x1="160" x2="200" y1="60" y2="50"></line>
<line marker-end="url(#arrow-dbert)" stroke="#444" stroke-width="1.5" x1="160" x2="200" y1="80" y2="130"></line>
<line marker-end="url(#arrow-dbert)" stroke="#444" stroke-width="1.5" x1="360" x2="420" y1="40" y2="40"></line>
<line marker-end="url(#arrow-dbert)" stroke="#c2185b" stroke-dasharray="4" stroke-width="1" x1="360" x2="420" y1="120" y2="40"></line>
<line marker-end="url(#arrow-dbert)" stroke="#7b1fa2" stroke-dasharray="4" stroke-width="1" x1="360" x2="420" y1="60" y2="100"></line>
<line marker-end="url(#arrow-dbert)" stroke="#7b1fa2" stroke-dasharray="4" stroke-width="1" x1="360" x2="420" y1="140" y2="100"></line>
<line marker-end="url(#arrow-dbert)" stroke="#444" stroke-width="1.5" x1="360" x2="420" y1="140" y2="160"></line>
<line marker-end="url(#arrow-dbert)" stroke="#444" stroke-width="1.5" x1="570" x2="615" y1="40" y2="90"></line>
<line marker-end="url(#arrow-dbert)" stroke="#444" stroke-width="1.5" x1="570" x2="610" y1="100" y2="105"></line>
<line marker-end="url(#arrow-dbert)" stroke="#444" stroke-width="1.5" x1="570" x2="615" y1="160" y2="120"></line>
<text fill="#555" font-size="11" text-anchor="middle" x="360" y="220">Student initialized from alternating teacher layers (0, 2, 4, 6, 8, 10), then trained with α=1, β=5, γ=1.</text>
<text fill="#555" font-size="11" text-anchor="middle" x="360" y="238">Result: 40% smaller, 60% faster, 97% of GLUE retained.</text>
<defs><marker id="arrow-dbert" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="4"><path d="M0,0 L8,4 L0,8 z" fill="#444"></path></marker></defs>
</svg>