<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Comparison of argmax integer scoring versus probability-weighted G-Eval continuous scoring on a 5-point judge distribution" role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="360" y="22">G-Eval: argmax throws away the judge's uncertainty</text>
<g transform="translate(30,55)">
<text fill="#3a73a8" font-size="12" font-weight="600" text-anchor="middle" x="160" y="0">Argmax scoring (integer)</text>
<line stroke="#4a5568" x1="0" x2="320" y1="160" y2="160"></line>
<line stroke="#4a5568" x1="0" x2="0" y1="40" y2="160"></line>
<g fill="#4a5568" font-size="10">
<text text-anchor="end" x="-8" y="160">0</text>
<text text-anchor="end" x="-8" y="100">0.5</text>
<text text-anchor="end" x="-8" y="45">1.0</text>
</g>
<rect fill="#94a3b8" height="20" width="40" x="30" y="140"></rect>
<rect fill="#3a73a8" height="60" width="40" x="90" y="100"></rect>
<rect fill="#3a73a8" height="105" width="40" x="150" y="55"></rect>
<rect fill="#94a3b8" height="95" width="40" x="210" y="65"></rect>
<rect fill="#94a3b8" height="25" width="40" x="270" y="135"></rect>
<g fill="#2d3748" font-size="10" text-anchor="middle">
<text x="50" y="175">1</text>
<text x="110" y="175">2</text>
<text x="170" y="175">3</text>
<text x="230" y="175">4</text>
<text x="290" y="175">5</text>
</g>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="160" y="195">judge token probability</text>
<rect fill="#3a73a8" height="14" width="10" x="155" y="220"></rect>
<text fill="#2d3748" font-size="11" x="170" y="232">argmax token = "3"</text>
<text fill="#3a73a8" font-size="20" font-weight="600" text-anchor="middle" x="160" y="260">score = 3</text>
<text fill="#b91c1c" font-size="10" font-style="italic" text-anchor="middle" x="160" y="280">discards p(4) = 0.32</text>
</g>
<g transform="translate(390,55)">
<text fill="#047857" font-size="12" font-weight="600" text-anchor="middle" x="160" y="0">G-Eval (probability-weighted)</text>
<line stroke="#4a5568" x1="0" x2="320" y1="160" y2="160"></line>
<line stroke="#4a5568" x1="0" x2="0" y1="40" y2="160"></line>
<g fill="#4a5568" font-size="10">
<text text-anchor="end" x="-8" y="160">0</text>
<text text-anchor="end" x="-8" y="100">0.5</text>
<text text-anchor="end" x="-8" y="45">1.0</text>
</g>
<rect fill="#a7f3d0" height="20" width="40" x="30" y="140"></rect>
<rect fill="#047857" height="60" width="40" x="90" y="100"></rect>
<rect fill="#047857" height="105" width="40" x="150" y="55"></rect>
<rect fill="#047857" height="95" width="40" x="210" y="65"></rect>
<rect fill="#a7f3d0" height="25" width="40" x="270" y="135"></rect>
<g fill="#2d3748" font-size="10" text-anchor="middle">
<text x="50" y="175">1</text>
<text x="110" y="175">2</text>
<text x="170" y="175">3</text>
<text x="230" y="175">4</text>
<text x="290" y="175">5</text>
</g>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="160" y="195">all digit mass used</text>
<text fill="#2d3748" font-size="9" text-anchor="middle" x="160" y="230">1(0.05)+2(0.20)+3(0.35)+4(0.32)+5(0.08)</text>
<text fill="#047857" font-size="20" font-weight="600" text-anchor="middle" x="160" y="260">score = 3.18</text>
<text fill="#047857" font-size="10" font-style="italic" text-anchor="middle" x="160" y="280">preserves the uncertainty</text>
</g>
</svg>