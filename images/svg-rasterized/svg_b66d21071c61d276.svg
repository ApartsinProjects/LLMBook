<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Fusion-in-Decoder: each retrieved passage is concatenated with the question and encoded independently, then the decoder cross-attends over the concatenation of all encoder outputs and emits the answer." role="img" viewbox="0 0 780 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="fid_enc" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e3f2fd"></stop><stop offset="100%" stop-color="#bbdefb"></stop></lineargradient>
<lineargradient id="fid_dec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3e0"></stop><stop offset="100%" stop-color="#ffe0b2"></stop></lineargradient>
<marker id="fid_arrow" markerheight="7" markerwidth="10" orient="auto" refx="9" refy="3.5">
<polygon fill="#555" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<rect fill="#fafafa" height="250" rx="10" stroke="#ddd" width="770" x="5" y="5"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" x="25" y="30">N independent encoder passes</text>
<g fill="#fff" font-family="Segoe UI, system-ui, sans-serif" font-size="11" stroke="#666">
<rect height="30" rx="4" width="170" x="25" y="45"></rect>
<rect height="30" rx="4" width="170" x="25" y="85"></rect>
<rect height="30" rx="4" width="170" x="25" y="125"></rect>
<rect height="30" rx="4" width="170" x="25" y="165"></rect>
</g>
<g fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle">
<text x="110" y="64">[Q] + passage_1</text>
<text x="110" y="104">[Q] + passage_2</text>
<text x="110" y="144">[Q] + passage_3</text>
<text x="110" y="184">[Q] + passage_N</text>
</g>
<g fill="url(#fid_enc)" stroke="#1565c0" stroke-width="1.5">
<rect height="30" rx="6" width="100" x="215" y="45"></rect>
<rect height="30" rx="6" width="100" x="215" y="85"></rect>
<rect height="30" rx="6" width="100" x="215" y="125"></rect>
<rect height="30" rx="6" width="100" x="215" y="165"></rect>
</g>
<g fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
<text x="265" y="64">Encoder</text>
<text x="265" y="104">Encoder</text>
<text x="265" y="144">Encoder</text>
<text x="265" y="184">Encoder</text>
</g>
<g marker-end="url(#fid_arrow)" stroke="#555" stroke-width="1.5">
<line x1="195" x2="213" y1="60" y2="60"></line>
<line x1="195" x2="213" y1="100" y2="100"></line>
<line x1="195" x2="213" y1="140" y2="140"></line>
<line x1="195" x2="213" y1="180" y2="180"></line>
</g>
<!-- Concat -->
<rect fill="#fff" height="170" rx="6" stroke="#888" stroke-dasharray="4,3" width="120" x="350" y="45"></rect>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="410" y="120">concat</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="410" y="140">encoded</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="410" y="158">token streams</text>
<g marker-end="url(#fid_arrow)" stroke="#555" stroke-width="1.5">
<line x1="315" x2="348" y1="60" y2="120"></line>
<line x1="315" x2="348" y1="100" y2="125"></line>
<line x1="315" x2="348" y1="140" y2="130"></line>
<line x1="315" x2="348" y1="180" y2="135"></line>
</g>
<!-- Decoder -->
<rect fill="url(#fid_dec)" height="100" rx="6" stroke="#ef6c00" stroke-width="1.5" width="140" x="505" y="80"></rect>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="575" y="115">Decoder</text>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="575" y="135">cross-attention over</text>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="575" y="151">all N streams</text>
<line marker-end="url(#fid_arrow)" stroke="#555" stroke-width="1.5" x1="470" x2="503" y1="130" y2="130"></line>
<rect fill="#fff" height="40" rx="6" stroke="#888" width="100" x="660" y="110"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="710" y="135">Answer</text>
<line marker-end="url(#fid_arrow)" stroke="#555" stroke-width="1.5" x1="645" x2="658" y1="130" y2="130"></line>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="380" y="230">Encoder cost is linear in N; attention is still quadratic only inside each passage.</text>
</svg>