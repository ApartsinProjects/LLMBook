<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 320" role="img" aria-label="Four-ingredient model rotation strategy: abstraction layer, portable eval suite, second-source contract, and switch-over runbook, drawn as concentric protective layers around the production app" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<text x="360" y="22" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">Four-ingredient model-rotation strategy</text>

<g transform="translate(240,55)">
<rect x="0" y="0" width="240" height="240" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
<text x="120" y="22" font-size="12" font-weight="600" fill="#be185d" text-anchor="middle">4. Switch-over runbook</text>
<rect x="20" y="35" width="200" height="190" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="120" y="55" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">3. Second-source contract</text>
<rect x="40" y="70" width="160" height="140" rx="8" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="120" y="90" font-size="12" font-weight="600" fill="#3a73a8" text-anchor="middle">2. Portable eval suite</text>
<rect x="60" y="105" width="120" height="90" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="120" y="125" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">1. Abstraction</text>
<text x="120" y="139" font-size="10" fill="#4a5568" text-anchor="middle">layer</text>
<rect x="80" y="150" width="80" height="40" rx="4" fill="#fff" stroke="#4a5568" stroke-width="1.2"/>
<text x="120" y="168" font-size="11" font-weight="600" fill="#2d3748" text-anchor="middle">Your app</text>
<text x="120" y="182" font-size="9" fill="#718096" text-anchor="middle">(provider-agnostic)</text>
</g>

<g transform="translate(20,80)">
<text x="0" y="0" font-size="10" font-weight="600" fill="#047857">Innermost layer</text>
<text x="0" y="14" font-size="9" fill="#4a5568">LiteLLM / LangChain</text>
<text x="0" y="26" font-size="9" fill="#4a5568">chat-model adapter,</text>
<text x="0" y="38" font-size="9" fill="#4a5568">one swap point for</text>
<text x="0" y="50" font-size="9" fill="#4a5568">all model calls.</text>
<text x="0" y="80" font-size="10" font-weight="600" fill="#3a73a8">Eval suite</text>
<text x="0" y="94" font-size="9" fill="#4a5568">Re-run vs any model in</text>
<text x="0" y="106" font-size="9" fill="#4a5568">an afternoon. 400+ cases.</text>
</g>

<g transform="translate(500,80)">
<text x="0" y="0" font-size="10" font-weight="600" fill="#d97706">Second source</text>
<text x="0" y="14" font-size="9" fill="#4a5568">5-10% shadow traffic</text>
<text x="0" y="26" font-size="9" fill="#4a5568">on a backup provider.</text>
<text x="0" y="38" font-size="9" fill="#4a5568">Tested fallback path.</text>
<text x="0" y="80" font-size="10" font-weight="600" fill="#be185d">Runbook</text>
<text x="0" y="94" font-size="9" fill="#4a5568">Drain, validate, roll back,</text>
<text x="0" y="106" font-size="9" fill="#4a5568">communicate. Rehearsed.</text>
</g>
</svg>