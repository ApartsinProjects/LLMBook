<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three attention-mask layouts side by side. Filled cells indicate non-zero attention. Dense (left) is the standard transformer baseline. Longformer (middle) keeps a diagonal sliding window plus a small set of global tokens. BigBird (right) adds a few random off-diagonal entries to preserve theoretical universality." style="font-family: sans-serif; max-width: 100%; height: auto;" viewbox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="220" width="720"></rect>
<!-- Dense -->
<text fill="#1a4078" font-size="13" font-weight="700" text-anchor="middle" x="100" y="22">Dense (O(n^2))</text>
<g transform="translate(30,32)">
<rect fill="#1a4078" height="140" opacity="0.85" width="140"></rect>
</g>
<text fill="#444" font-size="11" text-anchor="middle" x="100" y="195">every query sees every key</text>
<!-- Longformer -->
<text fill="#1f7a3a" font-size="13" font-weight="700" text-anchor="middle" x="310" y="22">Longformer (window + global)</text>
<g transform="translate(240,32)">
<rect fill="#eeeeee" height="140" width="140"></rect>
<!-- diagonal band -->
<g fill="#1f7a3a">
<rect height="20" width="20" x="0" y="0"></rect>
<rect height="20" width="20" x="20" y="0"></rect>
<rect height="20" width="20" x="0" y="20"></rect>
<rect height="20" width="20" x="20" y="20"></rect>
<rect height="20" width="20" x="40" y="20"></rect>
<rect height="20" width="20" x="20" y="40"></rect>
<rect height="20" width="20" x="40" y="40"></rect>
<rect height="20" width="20" x="60" y="40"></rect>
<rect height="20" width="20" x="40" y="60"></rect>
<rect height="20" width="20" x="60" y="60"></rect>
<rect height="20" width="20" x="80" y="60"></rect>
<rect height="20" width="20" x="60" y="80"></rect>
<rect height="20" width="20" x="80" y="80"></rect>
<rect height="20" width="20" x="100" y="80"></rect>
<rect height="20" width="20" x="80" y="100"></rect>
<rect height="20" width="20" x="100" y="100"></rect>
<rect height="20" width="20" x="120" y="100"></rect>
<rect height="20" width="20" x="100" y="120"></rect>
<rect height="20" width="20" x="120" y="120"></rect>
</g>
<!-- global row + col -->
<g fill="#a67c1a">
<rect height="20" opacity="0.8" width="140" x="0" y="0"></rect>
<rect height="140" opacity="0.8" width="20" x="0" y="0"></rect>
</g>
</g>
<text fill="#444" font-size="11" text-anchor="middle" x="310" y="195">diagonal window + global tokens (CLS)</text>
<!-- BigBird -->
<text fill="#a67c1a" font-size="13" font-weight="700" text-anchor="middle" x="540" y="22">BigBird (+ random)</text>
<g transform="translate(470,32)">
<rect fill="#eeeeee" height="140" width="140"></rect>
<g fill="#1f7a3a">
<rect height="20" width="20" x="0" y="0"></rect>
<rect height="20" width="20" x="20" y="0"></rect>
<rect height="20" width="20" x="0" y="20"></rect>
<rect height="20" width="20" x="20" y="20"></rect>
<rect height="20" width="20" x="40" y="20"></rect>
<rect height="20" width="20" x="20" y="40"></rect>
<rect height="20" width="20" x="40" y="40"></rect>
<rect height="20" width="20" x="60" y="40"></rect>
<rect height="20" width="20" x="40" y="60"></rect>
<rect height="20" width="20" x="60" y="60"></rect>
<rect height="20" width="20" x="80" y="60"></rect>
<rect height="20" width="20" x="60" y="80"></rect>
<rect height="20" width="20" x="80" y="80"></rect>
<rect height="20" width="20" x="100" y="80"></rect>
<rect height="20" width="20" x="80" y="100"></rect>
<rect height="20" width="20" x="100" y="100"></rect>
<rect height="20" width="20" x="120" y="100"></rect>
<rect height="20" width="20" x="100" y="120"></rect>
<rect height="20" width="20" x="120" y="120"></rect>
</g>
<g fill="#a67c1a">
<rect height="20" opacity="0.8" width="140" x="0" y="0"></rect>
<rect height="140" opacity="0.8" width="20" x="0" y="0"></rect>
</g>
<g fill="#cc3333">
<rect height="20" width="20" x="100" y="40"></rect>
<rect height="20" width="20" x="40" y="100"></rect>
<rect height="20" width="20" x="120" y="60"></rect>
<rect height="20" width="20" x="60" y="120"></rect>
</g>
</g>
<text fill="#444" font-size="11" text-anchor="middle" x="540" y="195">window + global + random (red)</text>
</svg>