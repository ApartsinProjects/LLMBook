<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three library families: model-loading, tokenizer trio, mech-interp tier" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="360" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">Part II library stack: three families that build every notebook in Chapters 7-11</text>
<g font-size="10">
<!-- Model-loading -->
<g transform="translate(30,55)">
<rect fill="#e3e8f5" height="280" rx="8" stroke="#3d4d8a" stroke-width="2" width="270"></rect>
<text fill="#3d4d8a" font-size="12" font-weight="700" text-anchor="middle" x="135" y="22">Model-loading stack</text>
<rect fill="#ffffff" height="32" rx="4" stroke="#3d4d8a" width="230" x="20" y="40"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="135" y="56">transformers v5</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="135" y="68">Q1 2025; AutoModel/AutoTokenizer</text>
<rect fill="#ffffff" height="32" rx="4" stroke="#3d4d8a" width="230" x="20" y="80"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="135" y="96">accelerate</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="135" y="108">multi-GPU / multi-node</text>
<rect fill="#ffffff" height="32" rx="4" stroke="#3d4d8a" width="230" x="20" y="120"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="135" y="136">bitsandbytes</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="135" y="148">8-bit / 4-bit NF4 -&gt; 70B on 24 GB</text>
<rect fill="#ffffff" height="32" rx="4" stroke="#3d4d8a" width="230" x="20" y="160"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="135" y="176">FlashAttention 2/3</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="135" y="188">million-token context</text>
<rect fill="#ffffff" height="32" rx="4" stroke="#3d4d8a" width="230" x="20" y="200"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="135" y="216">vLLM</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="135" y="228">PagedAttention serving</text>
<rect fill="#ffffff" height="32" rx="4" stroke="#3d4d8a" width="230" x="20" y="240"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="135" y="256">outlines (.txt)</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="135" y="268">constrained / JSON output</text>
</g>
<!-- Tokenizer trio -->
<g transform="translate(310,55)">
<rect fill="#fef3e0" height="280" rx="8" stroke="#a67c1a" stroke-width="2" width="270"></rect>
<text fill="#a67c1a" font-size="12" font-weight="700" text-anchor="middle" x="135" y="22">Tokenizer trio</text>
<rect fill="#ffffff" height="56" rx="4" stroke="#a67c1a" width="230" x="20" y="40"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="135" y="58">tiktoken (OpenAI)</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="135" y="72">Rust BPE, GPT family</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="135" y="86">fastest for fixed vocab; no training</text>
<rect fill="#ffffff" height="56" rx="4" stroke="#a67c1a" width="230" x="20" y="104"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="135" y="122">SentencePiece (Google)</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="135" y="136">T5, mT5, Llama family</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="135" y="150">multilingual BPE + Unigram</text>
<rect fill="#ffffff" height="56" rx="4" stroke="#a67c1a" width="230" x="20" y="168"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="135" y="186">HF tokenizers (Rust)</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="135" y="200">BPE + WordPiece + Unigram</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="135" y="214">most flexible, train from scratch</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="135" y="248">"Mechanistic..."</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="135" y="262">tiktoken ~7, Llama ~8, Qwen ~8</text>
</g>
<!-- Mech-interp -->
<g transform="translate(590,55)">
<rect fill="#ecf6ee" height="280" rx="8" stroke="#1f7a3a" stroke-width="2" width="260"></rect>
<text fill="#1f7a3a" font-size="12" font-weight="700" text-anchor="middle" x="130" y="22">Mech-interp tier</text>
<rect fill="#ffffff" height="32" rx="4" stroke="#1f7a3a" width="230" x="15" y="40"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="130" y="56">TransformerLens</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="130" y="68">Neel Nanda; hook every layer</text>
<rect fill="#ffffff" height="32" rx="4" stroke="#1f7a3a" width="230" x="15" y="80"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="130" y="96">nnsight 0.4+</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="130" y="108">remote-exec on Llama-405B (NDIF)</text>
<rect fill="#ffffff" height="32" rx="4" stroke="#1f7a3a" width="230" x="15" y="120"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="130" y="136">SAELens</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="130" y="148">SAE training; Gemma Scope</text>
<rect fill="#ffffff" height="32" rx="4" stroke="#1f7a3a" width="230" x="15" y="160"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="130" y="176">circuit-tracer</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="130" y="188">Anthropic 2025; cross-layer</text>
<rect fill="#ffffff" height="32" rx="4" stroke="#1f7a3a" width="230" x="15" y="200"></rect>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="130" y="216">garak + EasyJailbreak</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="130" y="228">safety probing</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="130" y="262">substrate of every Ch. 10 paper</text>
</g>
</g>
</svg>