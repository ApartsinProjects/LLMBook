<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="wav2vec 2.0 architecture: waveform to CNN feature encoder to Gumbel-Softmax quantizer and masked transformer with contrastive loss" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 880 340" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="340" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">wav2vec 2.0: CNN feature encoder + Gumbel quantizer + masked transformer</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="440" y="40">Contrastive InfoNCE matches transformer context against the quantized target it should have produced</text>
<defs>
<marker id="w2vArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
</defs>
<g font-size="10">
<rect fill="#bbdefb" height="60" rx="8" stroke="#1976d2" stroke-width="1.5" width="110" x="20" y="120"></rect>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="75" y="145">Raw waveform</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="75" y="160">16 kHz, normalized</text>
<line marker-end="url(#w2vArr)" stroke="#666" stroke-width="2" x1="130" x2="158" y1="150" y2="150"></line>
<rect fill="#c8e6c9" height="60" rx="8" stroke="#2e7d32" stroke-width="1.5" width="120" x="158" y="120"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="218" y="142">CNN feature</text>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="218" y="155">encoder</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="218" y="170">7 conv blocks, 320x</text>
<line marker-end="url(#w2vArr)" stroke="#666" stroke-width="2" x1="278" x2="306" y1="150" y2="150"></line>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="292" y="142">z (50 Hz)</text>
<rect fill="#ffe0b2" height="50" rx="8" stroke="#ef6c00" stroke-width="1.5" width="140" x="306" y="80"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="376" y="100">Mask span</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="376" y="115">replace with [MASK] vector</text>
<rect fill="#ffe0b2" height="50" rx="8" stroke="#ef6c00" stroke-width="1.5" width="140" x="306" y="170"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="376" y="190">Gumbel-Softmax</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="376" y="205">quantizer: G=2, K=320</text>
<line marker-end="url(#w2vArr)" stroke="#666" stroke-width="1.5" x1="306" x2="306" y1="150" y2="105"></line>
<line marker-end="url(#w2vArr)" stroke="#666" stroke-width="1.5" x1="306" x2="306" y1="150" y2="195"></line>
<line marker-end="url(#w2vArr)" stroke="#666" stroke-width="2" x1="446" x2="474" y1="105" y2="105"></line>
<rect fill="#e1bee7" height="50" rx="8" stroke="#6a1b9a" stroke-width="1.5" width="140" x="474" y="80"></rect>
<text fill="#4a148c" font-weight="700" text-anchor="middle" x="544" y="100">Transformer</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="544" y="115">12 layers (base) / 24 (large)</text>
<line marker-end="url(#w2vArr)" stroke="#666" stroke-width="2" x1="614" x2="640" y1="105" y2="105"></line>
<rect fill="#fff9c4" height="50" rx="8" stroke="#f57f17" stroke-width="1.5" width="100" x="640" y="80"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="690" y="100">Context c</text>
<text fill="#f57f17" font-size="9" text-anchor="middle" x="690" y="115">at masked t</text>
<line marker-end="url(#w2vArr)" stroke="#666" stroke-width="2" x1="446" x2="474" y1="195" y2="195"></line>
<rect fill="#fff3e0" height="50" rx="8" stroke="#ef6c00" stroke-width="1.5" width="140" x="474" y="170"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="544" y="190">Target q</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="544" y="205">+ 100 distractors</text>
<line stroke="#666" stroke-width="1.5" x1="690" x2="690" y1="130" y2="240"></line>
<line stroke="#666" stroke-width="1.5" x1="544" x2="544" y1="220" y2="240"></line>
<line stroke="#666" stroke-width="1.5" x1="544" x2="690" y1="240" y2="240"></line>
<rect fill="#ffcdd2" height="50" rx="8" stroke="#c62828" stroke-width="1.5" width="260" x="560" y="240"></rect>
<text fill="#b71c1c" font-weight="700" text-anchor="middle" x="690" y="260">InfoNCE contrastive loss</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="690" y="275">match c to true q, push away distractors</text>
<text fill="#5a4a3a" font-size="9.5" text-anchor="start" x="200" y="240">Fine-tune for ASR: drop quantizer, add</text>
<text fill="#5a4a3a" font-size="9.5" text-anchor="start" x="200" y="254">a linear CTC head on top of the context c.</text>
</g>
</svg>