<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 280" role="img" aria-label="OpenTelemetry architecture for LLM applications: app SDK auto-instrumentors emit spans to a collector that fans out to multiple backends" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<defs>
<marker id="arrow-otel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
</marker>
</defs>
<text x="360" y="22" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">OpenTelemetry as the LLM observability backbone</text>

<g transform="translate(20,55)">
<rect width="190" height="170" rx="8" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="95" y="22" font-size="12" font-weight="600" fill="#3a73a8" text-anchor="middle">Application</text>
<rect x="15" y="38" width="160" height="22" rx="4" fill="#fff" stroke="#3a73a8" stroke-width="1"/>
<text x="22" y="53" font-size="10" fill="#2d3748">OpenAI call</text>
<rect x="15" y="64" width="160" height="22" rx="4" fill="#fff" stroke="#3a73a8" stroke-width="1"/>
<text x="22" y="79" font-size="10" fill="#2d3748">Anthropic call</text>
<rect x="15" y="90" width="160" height="22" rx="4" fill="#fff" stroke="#3a73a8" stroke-width="1"/>
<text x="22" y="105" font-size="10" fill="#2d3748">Vector DB query</text>
<rect x="15" y="116" width="160" height="22" rx="4" fill="#fff" stroke="#3a73a8" stroke-width="1"/>
<text x="22" y="131" font-size="10" fill="#2d3748">Tool invocation</text>
<text x="95" y="160" font-size="9" font-style="italic" fill="#718096" text-anchor="middle">auto-instrumented</text>
</g>

<g transform="translate(260,55)">
<rect width="190" height="170" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="95" y="22" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">OTel Collector</text>
<text x="95" y="38" font-size="9" font-style="italic" fill="#718096" text-anchor="middle">sidecar or gateway</text>
<rect x="15" y="55" width="160" height="18" rx="3" fill="#fff" stroke="#d97706" stroke-width="1"/>
<text x="22" y="68" font-size="9" fill="#2d3748">gen_ai.system</text>
<rect x="15" y="76" width="160" height="18" rx="3" fill="#fff" stroke="#d97706" stroke-width="1"/>
<text x="22" y="89" font-size="9" fill="#2d3748">gen_ai.request.model</text>
<rect x="15" y="97" width="160" height="18" rx="3" fill="#fff" stroke="#d97706" stroke-width="1"/>
<text x="22" y="110" font-size="9" fill="#2d3748">gen_ai.usage.tokens</text>
<rect x="15" y="118" width="160" height="18" rx="3" fill="#fff" stroke="#d97706" stroke-width="1"/>
<text x="22" y="131" font-size="9" fill="#2d3748">gen_ai.response.finish</text>
<text x="95" y="158" font-size="9" font-style="italic" fill="#718096" text-anchor="middle">GenAI semantic conventions</text>
</g>

<g transform="translate(500,55)">
<rect width="200" height="170" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="100" y="22" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">Backends (any)</text>
<rect x="15" y="38" width="170" height="20" rx="3" fill="#fff" stroke="#047857" stroke-width="1"/>
<text x="22" y="52" font-size="9" fill="#2d3748">Arize Phoenix</text>
<rect x="15" y="62" width="170" height="20" rx="3" fill="#fff" stroke="#047857" stroke-width="1"/>
<text x="22" y="76" font-size="9" fill="#2d3748">Grafana Tempo / Loki</text>
<rect x="15" y="86" width="170" height="20" rx="3" fill="#fff" stroke="#047857" stroke-width="1"/>
<text x="22" y="100" font-size="9" fill="#2d3748">Datadog / Honeycomb</text>
<rect x="15" y="110" width="170" height="20" rx="3" fill="#fff" stroke="#047857" stroke-width="1"/>
<text x="22" y="124" font-size="9" fill="#2d3748">Langfuse / LangSmith</text>
<rect x="15" y="134" width="170" height="20" rx="3" fill="#fff" stroke="#047857" stroke-width="1"/>
<text x="22" y="148" font-size="9" fill="#2d3748">Custom S3 archive</text>
</g>

<path d="M210,140 L256,140" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-otel)"/>
<path d="M450,90 L496,55" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrow-otel)"/>
<path d="M450,140 L496,140" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-otel)"/>
<path d="M450,190 L496,225" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrow-otel)"/>

<text x="360" y="260" font-size="10" font-style="italic" fill="#718096" text-anchor="middle">Instrument once with OTel. Swap backends without touching app code.</text>
</svg>