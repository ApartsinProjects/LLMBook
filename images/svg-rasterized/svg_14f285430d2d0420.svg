<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Four output guardrail platforms, four design stances" aria-labelledby="fig483title" role="img" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;" viewbox="0 0 760 380" xmlns="http://www.w3.org/2000/svg">
<title id="fig483title">Four output guardrail platforms, four design stances</title>
<text fill="#222" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" x="380" y="24">Four output guardrail platforms compared (2026)</text>
<g font-family="Georgia, serif" font-size="11">
<rect fill="#e8f1fb" height="280" rx="8" stroke="#1f77b4" stroke-width="2" width="170" x="20" y="60"></rect>
<text fill="#1f77b4" font-size="13" font-weight="bold" text-anchor="middle" x="105" y="82">Llama Guard 3</text>
<text fill="#666" text-anchor="middle" x="105" y="98">Meta · 8B / 1B</text>
<text fill="#222" font-weight="bold" text-anchor="middle" x="105" y="122">Stance:</text>
<text fill="#444" text-anchor="middle" x="105" y="138">fine-tuned LLM</text>
<text fill="#444" text-anchor="middle" x="105" y="154">classifier</text>
<text fill="#222" font-weight="bold" text-anchor="middle" x="105" y="178">Taxonomy:</text>
<text fill="#444" text-anchor="middle" x="105" y="194">MLCommons S1-S14</text>
<text fill="#444" text-anchor="middle" x="105" y="210">policy zoning</text>
<text fill="#222" font-weight="bold" text-anchor="middle" x="105" y="234">Best for:</text>
<text fill="#444" text-anchor="middle" x="105" y="250">harm categories</text>
<text fill="#444" text-anchor="middle" x="105" y="266">multilingual</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="105" y="296">~120 ms on A100</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="105" y="318">verdict + category</text>
<rect fill="#e9f7e9" height="280" rx="8" stroke="#2ca02c" stroke-width="2" width="170" x="200" y="60"></rect>
<text fill="#2ca02c" font-size="13" font-weight="bold" text-anchor="middle" x="285" y="82">NeMo Guardrails</text>
<text fill="#666" text-anchor="middle" x="285" y="98">NVIDIA</text>
<text fill="#222" font-weight="bold" text-anchor="middle" x="285" y="122">Stance:</text>
<text fill="#444" text-anchor="middle" x="285" y="138">programmable DSL</text>
<text fill="#444" text-anchor="middle" x="285" y="154">(Colang)</text>
<text fill="#222" font-weight="bold" text-anchor="middle" x="285" y="178">Mechanism:</text>
<text fill="#444" text-anchor="middle" x="285" y="194">conversational rails,</text>
<text fill="#444" text-anchor="middle" x="285" y="210">fact-checking flows</text>
<text fill="#222" font-weight="bold" text-anchor="middle" x="285" y="234">Best for:</text>
<text fill="#444" text-anchor="middle" x="285" y="250">multi-turn dialog</text>
<text fill="#444" text-anchor="middle" x="285" y="266">structured flows</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="285" y="296">composable rails</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="285" y="318">orchestrator role</text>
<rect fill="#fff5d9" height="280" rx="8" stroke="#cc8400" stroke-width="2" width="170" x="380" y="60"></rect>
<text fill="#cc8400" font-size="13" font-weight="bold" text-anchor="middle" x="465" y="82">ShieldGemma</text>
<text fill="#666" text-anchor="middle" x="465" y="98">Google · 2B/9B/27B</text>
<text fill="#222" font-weight="bold" text-anchor="middle" x="465" y="122">Stance:</text>
<text fill="#444" text-anchor="middle" x="465" y="138">size-tiered classifier</text>
<text fill="#444" text-anchor="middle" x="465" y="154">family</text>
<text fill="#222" font-weight="bold" text-anchor="middle" x="465" y="178">Taxonomy:</text>
<text fill="#444" text-anchor="middle" x="465" y="194">harassment, hate,</text>
<text fill="#444" text-anchor="middle" x="465" y="210">dangerous, sexual</text>
<text fill="#222" font-weight="bold" text-anchor="middle" x="465" y="234">Best for:</text>
<text fill="#444" text-anchor="middle" x="465" y="250">latency / accuracy</text>
<text fill="#444" text-anchor="middle" x="465" y="266">trade-off knob</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="465" y="296">2B for edge,</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="465" y="318">27B for high stakes</text>
<rect fill="#fde9e9" height="280" rx="8" stroke="#d62728" stroke-width="2" width="180" x="560" y="60"></rect>
<text fill="#d62728" font-size="13" font-weight="bold" text-anchor="middle" x="650" y="82">Guardrails AI</text>
<text fill="#666" text-anchor="middle" x="650" y="98">Python validator</text>
<text fill="#222" font-weight="bold" text-anchor="middle" x="650" y="122">Stance:</text>
<text fill="#444" text-anchor="middle" x="650" y="138">validator framework</text>
<text fill="#444" text-anchor="middle" x="650" y="154">(RAIL spec)</text>
<text fill="#222" font-weight="bold" text-anchor="middle" x="650" y="178">Mechanism:</text>
<text fill="#444" text-anchor="middle" x="650" y="194">composable validators</text>
<text fill="#444" text-anchor="middle" x="650" y="210">JSON schema, PII, ...</text>
<text fill="#222" font-weight="bold" text-anchor="middle" x="650" y="234">Best for:</text>
<text fill="#444" text-anchor="middle" x="650" y="250">structural checks</text>
<text fill="#444" text-anchor="middle" x="650" y="266">retry/fix loops</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="650" y="296">drop-in Python,</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="650" y="318">not a model</text>
</g>
</svg>