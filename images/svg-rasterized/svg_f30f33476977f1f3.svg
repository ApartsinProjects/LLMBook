<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="GPU requirements and training cost by model size and PEFT method" font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 -10 700 270" xmlns="http://www.w3.org/2000/svg">
<rect fill="#c8e6c9" height="80" rx="8" stroke="#2e7d32" stroke-width="1.5" width="180" x="40" y="50"></rect>
<text fill="#2e7d32" font-size="13" font-weight="bold" text-anchor="middle" x="130" y="72">7B Models</text>
<text fill="#555" font-size="11" text-anchor="middle" x="130" y="92">QLoRA: T4 16GB</text>
<text fill="#555" font-size="11" text-anchor="middle" x="130" y="108">LoRA: A100 40GB</text>
<text fill="#555" font-size="11" text-anchor="middle" x="130" y="124">Full FT: 2x A100</text>
<rect fill="#fff3e0" height="80" rx="8" stroke="#e65100" stroke-width="1.5" width="180" x="250" y="50"></rect>
<text fill="#e65100" font-size="13" font-weight="bold" text-anchor="middle" x="340" y="72">13B Models</text>
<text fill="#555" font-size="11" text-anchor="middle" x="340" y="92">QLoRA: A10G 24GB</text>
<text fill="#555" font-size="11" text-anchor="middle" x="340" y="108">LoRA: A100 40GB</text>
<text fill="#555" font-size="11" text-anchor="middle" x="340" y="124">Full FT: 4x A100</text>
<rect fill="#f3e5f5" height="80" rx="8" stroke="#7b1fa2" stroke-width="1.5" width="200" x="460" y="50"></rect>
<text fill="#7b1fa2" font-size="13" font-weight="bold" text-anchor="middle" x="560" y="72">70B Models</text>
<text fill="#555" font-size="11" text-anchor="middle" x="560" y="92">QLoRA: A100 80GB</text>
<text fill="#555" font-size="11" text-anchor="middle" x="560" y="108">LoRA: 2x A100 80GB</text>
<text fill="#555" font-size="11" text-anchor="middle" x="560" y="124">Full FT: 8x H100</text>
<rect fill="#f5f5f5" height="80" rx="6" stroke="#ddd" stroke-width="1" width="620" x="40" y="160"></rect>
<text fill="#333" font-size="13" font-weight="bold" text-anchor="middle" x="350" y="185">Typical Training Cost Estimates (3 epochs, 50K samples)</text>
<text fill="#2e7d32" font-size="11" text-anchor="middle" x="130" y="210">7B QLoRA: &#36;2-5</text>
<text fill="#e65100" font-size="11" text-anchor="middle" x="340" y="210">13B QLoRA: &#36;5-15</text>
<text fill="#7b1fa2" font-size="11" text-anchor="middle" x="560" y="210">70B QLoRA: &#36;30-80</text>
<text fill="#888" font-size="11" text-anchor="middle" x="350" y="232">(Based on spot/community GPU pricing; reserved instances cost 2-5x more)</text>
</svg>