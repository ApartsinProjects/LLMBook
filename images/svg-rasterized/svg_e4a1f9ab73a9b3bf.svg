<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Legal LLM vendor map by workflow and customer segment" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="fig-72-5-1-title fig-72-5-1-desc">
<title id="fig-72-5-1-title">Legal LLM vendor map by workflow and customer segment</title>
<desc id="fig-72-5-1-desc">2D vendor map. X-axis: workflow specialization (research and drafting on the left, diligence and search in the middle, transactional drafting on the right). Y-axis: customer segment (AmLaw 50 at top, mid-market at bottom). Five vendors placed: Harvey upper-left (AmLaw 50, drafting), Casetext / CoCounsel upper-middle-left, Hebbia upper-middle, Spellbook lower-right, Robin AI middle-right.</desc>
<rect x="0" y="0" width="760" height="360" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">Mid-2026 legal-LLM vendor map: workflow × customer segment</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- axes -->
<line x1="100" y1="290" x2="700" y2="290" stroke="#5a6573" stroke-width="1.5"/>
<line x1="100" y1="60" x2="100" y2="290" stroke="#5a6573" stroke-width="1.5"/>
<text x="400" y="320" text-anchor="middle" font-weight="700">Workflow specialization</text>
<text x="200" y="338" text-anchor="middle" font-size="10">research / drafting</text>
<text x="400" y="338" text-anchor="middle" font-size="10">diligence / search</text>
<text x="600" y="338" text-anchor="middle" font-size="10">transactional drafting</text>
<text x="55" y="175" text-anchor="middle" font-weight="700" transform="rotate(-90 55 175)">Customer segment</text>
<text x="80" y="80" text-anchor="end" font-size="10">AmLaw 50</text>
<text x="80" y="280" text-anchor="end" font-size="10">mid-market</text>

<!-- gridlines -->
<line x1="100" y1="175" x2="700" y2="175" stroke="#e0e3eb" stroke-dasharray="3 3"/>

<!-- Harvey: upper-left -->
<circle cx="200" cy="105" r="40" fill="#dfeaf5" stroke="#2c5fa0" stroke-width="2"/>
<text x="200" y="100" text-anchor="middle" font-weight="700" fill="#2c5fa0">Harvey</text>
<text x="200" y="116" text-anchor="middle" font-size="9">$300M raised</text>
<text x="200" y="158" text-anchor="middle" font-size="9" fill="#5a6573">A&amp;O Shearman, PwC, DOJ pilot</text>

<!-- Casetext/CoCounsel: upper-left-mid (Westlaw-backed) -->
<circle cx="320" cy="125" r="40" fill="#eef5ec" stroke="#1f6f3a" stroke-width="2"/>
<text x="320" y="120" text-anchor="middle" font-weight="700" fill="#1f6f3a">Casetext</text>
<text x="320" y="134" text-anchor="middle" font-size="9">/ CoCounsel</text>
<text x="320" y="180" text-anchor="middle" font-size="9" fill="#5a6573">Thomson Reuters,</text>
<text x="320" y="192" text-anchor="middle" font-size="9" fill="#5a6573">$650M (2023)</text>

<!-- Hebbia: upper-mid -->
<circle cx="450" cy="115" r="35" fill="#fff5d6" stroke="#b8860b" stroke-width="2"/>
<text x="450" y="118" text-anchor="middle" font-weight="700" fill="#7a5a08">Hebbia</text>
<text x="450" y="160" text-anchor="middle" font-size="9" fill="#5a6573">$130M raised,</text>
<text x="450" y="172" text-anchor="middle" font-size="9" fill="#5a6573">diligence binders</text>

<!-- Robin AI: middle-right -->
<circle cx="595" cy="185" r="36" fill="#ede4f7" stroke="#5a3d99" stroke-width="2"/>
<text x="595" y="188" text-anchor="middle" font-weight="700" fill="#5a3d99">Robin AI</text>
<text x="595" y="230" text-anchor="middle" font-size="9" fill="#5a6573">bilingual EN+ES/FR/DE</text>
<text x="595" y="242" text-anchor="middle" font-size="9" fill="#5a6573">+ Asian pairs</text>

<!-- Spellbook: lower-right -->
<circle cx="620" cy="250" r="32" fill="#f1d6d0" stroke="#b2351e" stroke-width="2"/>
<text x="620" y="253" text-anchor="middle" font-weight="700" fill="#b2351e">Spellbook</text>
<text x="620" y="288" text-anchor="middle" font-size="9" fill="#5a6573">Word add-in,</text>
<text x="620" y="300" text-anchor="middle" font-size="9" fill="#5a6573">price-competitive</text>

<!-- annotation -->
<text x="200" y="62" text-anchor="middle" font-style="italic" fill="#2c5fa0" font-size="10">"big-firm research"</text>
<text x="450" y="62" text-anchor="middle" font-style="italic" fill="#7a5a08" font-size="10">"diligence-binder triage"</text>
<text x="620" y="215" text-anchor="middle" font-style="italic" fill="#b2351e" font-size="10">"contract-redline"</text>
</g>
</svg>