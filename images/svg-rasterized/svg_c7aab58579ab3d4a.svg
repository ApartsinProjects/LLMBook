<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="SetFit: contrastive pre-tune, then classifier head" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 760 240" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="240" width="760"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="bold" text-anchor="middle" x="380" y="22">SetFit: contrastive pre-tune, then classifier head</text>
<rect fill="#fafafa" height="160" rx="8" stroke="#1976d2" stroke-width="1.5" width="350" x="20" y="50"></rect>
<text fill="#1565c0" font-size="12" font-weight="bold" text-anchor="middle" x="195" y="72">Stage 1: Contrastive pre-tune</text>
<rect fill="#e3f2fd" height="40" rx="5" stroke="#1976d2" width="120" x="40" y="90"></rect>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="100" y="108">8 examples</text>
<text fill="#555" font-size="10" text-anchor="middle" x="100" y="122">per class</text>
<rect fill="#e3f2fd" height="40" rx="5" stroke="#1976d2" width="170" x="180" y="90"></rect>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="265" y="108">On-the-fly pairs</text>
<text fill="#555" font-size="10" text-anchor="middle" x="265" y="122">same-class +, cross-class -</text>
<rect fill="#e8f5e9" height="50" rx="5" stroke="#2e7d32" width="310" x="40" y="145"></rect>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="195" y="165">Sentence transformer (all-MiniLM-L6-v2)</text>
<text fill="#555" font-size="10" text-anchor="middle" x="195" y="183">contrastive loss warps embedding space</text>
<line marker-end="url(#arrow-setfit)" stroke="#444" stroke-width="1.5" x1="160" x2="180" y1="110" y2="110"></line>
<line marker-end="url(#arrow-setfit)" stroke="#444" stroke-width="1.5" x1="195" x2="195" y1="130" y2="145"></line>
<rect fill="#fafafa" height="160" rx="8" stroke="#c2185b" stroke-width="1.5" width="340" x="400" y="50"></rect>
<text fill="#c2185b" font-size="12" font-weight="bold" text-anchor="middle" x="570" y="72">Stage 2: Classifier head</text>
<rect fill="#fce4ec" height="40" rx="5" stroke="#c2185b" width="140" x="420" y="90"></rect>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="490" y="108">Frozen encoder</text>
<text fill="#555" font-size="10" text-anchor="middle" x="490" y="122">embed labeled set</text>
<rect fill="#fff3e0" height="40" rx="5" stroke="#e67e22" width="140" x="580" y="90"></rect>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="650" y="108">Logistic regression</text>
<text fill="#555" font-size="10" text-anchor="middle" x="650" y="122">fits in seconds</text>
<rect fill="#f3e5f5" height="50" rx="5" stroke="#7b1fa2" width="300" x="420" y="145"></rect>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="570" y="165">Prediction = head(encode(text))</text>
<text fill="#555" font-size="10" text-anchor="middle" x="570" y="183">CPU-ready, no LLM calls</text>
<line marker-end="url(#arrow-setfit)" stroke="#444" stroke-width="1.5" x1="560" x2="580" y1="110" y2="110"></line>
<line marker-end="url(#arrow-setfit)" stroke="#444" stroke-width="1.5" x1="570" x2="570" y1="130" y2="145"></line>
<line marker-end="url(#arrow-setfit)" stroke="#444" stroke-width="2" x1="370" x2="400" y1="130" y2="130"></line>
<defs><marker id="arrow-setfit" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="4"><path d="M0,0 L8,4 L0,8 z" fill="#444"></path></marker></defs>
</svg>