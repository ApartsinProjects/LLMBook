<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="ToolkenGPT extends the LM vocabulary with one toolken per tool; the frozen LM head and a trainable toolken head jointly score the next token" role="img" viewbox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="tkArrow" markerheight="10" markerwidth="10" orient="auto" refx="8" refy="3">
<path d="M0,0 L0,6 L8,3 z" fill="#3a4a7a"></path>
</marker>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="360" y="22">ToolkenGPT: frozen LM head + trainable toolken head</text>
<rect fill="#e3f2fd" height="80" rx="8" stroke="#3a73a8" stroke-width="2" width="160" x="30" y="60"></rect>
<text fill="#1a1a2e" font-size="12" font-weight="700" text-anchor="middle" x="110" y="82">Hidden state h</text>
<text fill="#2a3a5a" font-size="10" text-anchor="middle" x="110" y="102">last layer of</text>
<text fill="#2a3a5a" font-size="10" text-anchor="middle" x="110" y="118">frozen LM</text>
<rect fill="#fff" height="70" rx="8" stroke="#3a73a8" stroke-width="2" width="200" x="240" y="35"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="middle" x="340" y="55">Frozen LM head W_LM</text>
<text fill="#2a3a5a" font-size="10" text-anchor="middle" x="340" y="74">|V_word| logits</text>
<text fill="#2a3a5a" font-size="10" font-style="italic" text-anchor="middle" x="340" y="92">"the", "Paris", "."...</text>
<rect fill="#fce4ec" height="80" rx="8" stroke="#b03060" stroke-width="2" width="200" x="240" y="125"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="middle" x="340" y="145">Trainable toolken head W_T</text>
<text fill="#5a2a3a" font-size="10" text-anchor="middle" x="340" y="163">|T| logits, one per tool</text>
<text fill="#5a2a3a" font-size="10" font-style="italic" text-anchor="middle" x="340" y="181">&lt;tool:calc&gt;, &lt;tool:search&gt;</text>
<text fill="#5a2a3a" font-size="10" text-anchor="middle" x="340" y="197">only this matrix is trained</text>
<rect fill="#e8f5e9" height="100" rx="8" stroke="#047857" stroke-width="2" width="200" x="490" y="80"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="middle" x="590" y="100">argmax over [V_word; T]</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="590" y="120">if a toolken wins:</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="590" y="136">switch to "tool mode",</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="590" y="152">ICL-complete args,</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="590" y="168">execute, splice result</text>
<line marker-end="url(#tkArrow)" stroke="#3a4a7a" stroke-width="2" x1="190" x2="240" y1="80" y2="70"></line>
<line marker-end="url(#tkArrow)" stroke="#3a4a7a" stroke-width="2" x1="190" x2="240" y1="120" y2="160"></line>
<line marker-end="url(#tkArrow)" stroke="#3a4a7a" stroke-width="2" x1="440" x2="490" y1="70" y2="110"></line>
<line marker-end="url(#tkArrow)" stroke="#3a4a7a" stroke-width="2" x1="440" x2="490" y1="160" y2="140"></line>
<text fill="#444" font-size="11" font-style="italic" text-anchor="middle" x="360" y="240">Adding a new tool = one new row in W_T; the entire LM stays frozen.</text>
</g>
</svg>