<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Annoy random projection tree: at each internal node two random points define a hyperplane; vectors on one side go to the left child, the other side to the right child. The leaves contain small candidate clusters. The figure shows one tree of the forest; Annoy unions candidates from many such trees to recover high recall." role="img" style="max-width:720px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<text fill="#222" font-size="14" font-weight="700" text-anchor="middle" x="360" y="22">Annoy: one random-projection tree from a forest of trees</text>
<g font-size="11" text-anchor="middle">
<rect fill="#f5f5f5" height="220" stroke="#bdbdbd" width="200" x="40" y="60"></rect>
<text fill="#444" font-weight="700" x="140" y="78">embedding space</text>
<line stroke="#c62828" stroke-dasharray="5 3" stroke-width="1.6" x1="60" x2="220" y1="180" y2="120"></line>
<text fill="#c62828" font-size="10" text-anchor="start" x="225" y="120">hyperplane H₁</text>
<circle cx="80" cy="120" fill="#1565c0" r="3"></circle>
<circle cx="100" cy="105" fill="#1565c0" r="3"></circle>
<circle cx="120" cy="100" fill="#1565c0" r="3"></circle>
<circle cx="160" cy="80" fill="#1565c0" r="3"></circle>
<circle cx="90" cy="220" fill="#2e7d32" r="3"></circle>
<circle cx="120" cy="240" fill="#2e7d32" r="3"></circle>
<circle cx="170" cy="225" fill="#2e7d32" r="3"></circle>
<circle cx="200" cy="200" fill="#2e7d32" r="3"></circle>
<circle cx="140" cy="170" fill="#888" r="3"></circle>
<rect fill="#fff3e0" height="34" rx="6" stroke="#e65100" width="120" x="320" y="50"></rect>
<text fill="#e65100" font-weight="700" x="380" y="72">root: pick 2 random pts</text>
<line stroke="#444" stroke-width="1" x1="380" x2="340" y1="84" y2="118"></line>
<line stroke="#444" stroke-width="1" x1="380" x2="420" y1="84" y2="118"></line>
<rect fill="#e3f2fd" height="34" rx="6" stroke="#1565c0" width="120" x="280" y="118"></rect>
<text fill="#0d47a1" x="340" y="140">left subtree</text>
<rect fill="#e8f5e9" height="34" rx="6" stroke="#2e7d32" width="120" x="400" y="118"></rect>
<text fill="#1b5e20" x="460" y="140">right subtree</text>
<line stroke="#444" stroke-width="1" x1="340" x2="310" y1="152" y2="186"></line>
<line stroke="#444" stroke-width="1" x1="340" x2="370" y1="152" y2="186"></line>
<line stroke="#444" stroke-width="1" x1="460" x2="430" y1="152" y2="186"></line>
<line stroke="#444" stroke-width="1" x1="460" x2="490" y1="152" y2="186"></line>
<rect fill="#bbdefb" height="30" rx="4" width="80" x="270" y="186"></rect>
<text fill="#0d47a1" x="310" y="206">leaf</text>
<rect fill="#bbdefb" height="30" rx="4" width="80" x="350" y="186"></rect>
<text fill="#0d47a1" x="390" y="206">leaf</text>
<rect fill="#c8e6c9" height="30" rx="4" width="80" x="430" y="186"></rect>
<text fill="#1b5e20" x="470" y="206">leaf</text>
<rect fill="#c8e6c9" height="30" rx="4" width="80" x="510" y="186"></rect>
<text fill="#1b5e20" x="550" y="206">leaf</text>
<text fill="#444" font-size="11" x="380" y="245">query descends each tree; union of leaf candidates is re-ranked exactly</text>
<rect fill="#fafafa" height="160" stroke="#999" stroke-dasharray="3 3" width="100" x="600" y="60"></rect>
<text fill="#666" font-size="10" font-style="italic" x="650" y="80">x trees</text>
<text fill="#666" font-size="10" font-style="italic" x="650" y="100">in the forest</text>
<text fill="#999" font-size="14" x="650" y="135">…</text>
</g>
</svg>