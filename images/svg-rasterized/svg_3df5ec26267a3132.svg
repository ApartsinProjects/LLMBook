<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Four-stage Toolformer pipeline: insertion point proposal, candidate sampling, execution, and loss-reduction filter" role="img" viewbox="0 0 720 230" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="tfArrow" markerheight="10" markerwidth="10" orient="auto" refx="8" refy="3">
<path d="M0,0 L0,6 L8,3 z" fill="#3a4a7a"></path>
</marker>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="360" y="22">Toolformer self-supervised data pipeline</text>
<rect fill="#e3f2fd" height="110" rx="8" stroke="#3a73a8" stroke-width="2" width="150" x="20" y="60"></rect>
<text fill="#1a1a2e" font-size="12" font-weight="700" text-anchor="middle" x="95" y="82">1. Propose</text>
<text fill="#2a3a5a" font-size="10" text-anchor="middle" x="95" y="100">few-shot prompt</text>
<text fill="#2a3a5a" font-size="10" text-anchor="middle" x="95" y="116">picks insertion</text>
<text fill="#2a3a5a" font-size="10" text-anchor="middle" x="95" y="132">points in passage</text>
<text fill="#2a3a5a" font-size="10" font-style="italic" text-anchor="middle" x="95" y="156">"Paris has [?]"</text>
<rect fill="#fff8e1" height="110" rx="8" stroke="#d97706" stroke-width="2" width="150" x="195" y="60"></rect>
<text fill="#1a1a2e" font-size="12" font-weight="700" text-anchor="middle" x="270" y="82">2. Sample</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="270" y="100">LLM drafts</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="270" y="116">k candidate calls</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="270" y="132">per insertion point</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="270" y="156">[QA('capital of FR?')]</text>
<rect fill="#e8f5e9" height="110" rx="8" stroke="#047857" stroke-width="2" width="150" x="370" y="60"></rect>
<text fill="#1a1a2e" font-size="12" font-weight="700" text-anchor="middle" x="445" y="82">3. Execute</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="445" y="100">run the real tool</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="445" y="116">splice result back</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="445" y="132">into the passage</text>
<text fill="#3d4f3d" font-size="10" font-style="italic" text-anchor="middle" x="445" y="156">"=&gt;Paris" inlined</text>
<rect fill="#fce4ec" height="110" rx="8" stroke="#b03060" stroke-width="2" width="155" x="545" y="60"></rect>
<text fill="#1a1a2e" font-size="12" font-weight="700" text-anchor="middle" x="622" y="82">4. Filter</text>
<text fill="#5a2a3a" font-size="10" text-anchor="middle" x="622" y="100">keep iff loss on</text>
<text fill="#5a2a3a" font-size="10" text-anchor="middle" x="622" y="116">remaining tokens</text>
<text fill="#5a2a3a" font-size="10" text-anchor="middle" x="622" y="132">drops by tau</text>
<text fill="#5a2a3a" font-size="10" font-style="italic" text-anchor="middle" x="622" y="156">L_call &lt; L_no_call - tau</text>
<line marker-end="url(#tfArrow)" stroke="#3a4a7a" stroke-width="2" x1="170" x2="195" y1="115" y2="115"></line>
<line marker-end="url(#tfArrow)" stroke="#3a4a7a" stroke-width="2" x1="345" x2="370" y1="115" y2="115"></line>
<line marker-end="url(#tfArrow)" stroke="#3a4a7a" stroke-width="2" x1="520" x2="545" y1="115" y2="115"></line>
<text fill="#444" font-size="11" font-style="italic" text-anchor="middle" x="360" y="200">Surviving (input, call, result) triples become the masked-SFT training set.</text>
</g>
</svg>