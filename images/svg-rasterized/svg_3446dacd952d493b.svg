<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Offensive LLM use cases vs defender mitigations" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="fig-76-2-1-title fig-76-2-1-desc">
<title id="fig-76-2-1-title">Offensive LLM use cases vs defender mitigations</title>
<desc id="fig-76-2-1-desc">Four offensive categories with attacker-cost reduction and defender response. Phishing: 100-400x cost reduction ($0.05-0.20 to $0.0005 per email), defender response is passkeys/FIDO2/conditional access. Vuln research: ~2x speedup for experienced researchers, CyberSecEval shows 30-50% CTF solve on intermediate vs 80-95% for human teams. Malware adaptation: signature evasion, defender shifts to behavior-based EDR. Persona/influence: 100+ disrupted ops in OpenAI/Anthropic/Google reports.</desc>
<rect x="0" y="0" width="760" height="380" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">LLM offensive capability classes and the defender response, mid-2026</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- 4 rows -->
<!-- row 1: phishing -->
<rect x="20" y="50" width="240" height="70" fill="#f1d6d0" stroke="#b2351e" rx="4"/>
<text x="140" y="68" text-anchor="middle" font-weight="700" fill="#b2351e">Phishing content</text>
<text x="140" y="88" text-anchor="middle" font-size="10">$0.05-0.20/email → $0.0005</text>
<text x="140" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#b2351e">100-400x cost reduction</text>

<rect x="290" y="58" width="450" height="70" fill="#eef5ec" stroke="#1f6f3a" rx="4"/>
<text x="515" y="68" text-anchor="middle" font-weight="700" fill="#1f6f3a">Defender response: technical, not training-based</text>
<text x="515" y="88" text-anchor="middle" font-size="10">passkeys + FIDO2 hardware-bound · conditional access detecting impossible travel</text>
<text x="515" y="104" text-anchor="middle" font-size="10">email security scoring intent, not keywords</text>

<!-- row 2: vuln research -->
<rect x="20" y="135" width="240" height="70" fill="#f1d6d0" stroke="#b2351e" rx="4"/>
<text x="140" y="153" text-anchor="middle" font-weight="700" fill="#b2351e">Vuln research</text>
<text x="140" y="173" text-anchor="middle" font-size="10">~2x speedup for experienced</text>
<text x="140" y="189" text-anchor="middle" font-size="10" font-weight="700" fill="#b2351e">no novice amplification</text>

<rect x="290" y="143" width="450" height="70" fill="#eef5ec" stroke="#1f6f3a" rx="4"/>
<text x="515" y="153" text-anchor="middle" font-weight="700" fill="#1f6f3a">CyberSecEval (Meta) / CYBER-bench cap</text>
<text x="515" y="173" text-anchor="middle" font-size="10">frontier LLMs: 30-50% intermediate CTF · skilled human teams: 80-95%</text>
<text x="515" y="189" text-anchor="middle" font-size="10">frontier APIs disclose; open-weight has no equivalent posture</text>

<!-- row 3: malware -->
<rect x="20" y="220" width="240" height="70" fill="#f1d6d0" stroke="#b2351e" rx="4"/>
<text x="140" y="238" text-anchor="middle" font-weight="700" fill="#b2351e">Malware adaptation</text>
<text x="140" y="258" text-anchor="middle" font-size="10">rewrite to evade signatures</text>
<text x="140" y="274" text-anchor="middle" font-size="10" font-weight="700" fill="#b2351e">AV-signature decay</text>

<rect x="290" y="220" width="450" height="70" fill="#eef5ec" stroke="#1f6f3a" rx="4"/>
<text x="515" y="238" text-anchor="middle" font-weight="700" fill="#1f6f3a">Behaviour-based EDR (process tree, syscalls, network)</text>
<text x="515" y="258" text-anchor="middle" font-size="10">CrowdStrike, SentinelOne, Microsoft Defender XDR</text>
<text x="515" y="274" text-anchor="middle" font-size="10">AV signatures become baseline, not the full defence</text>

<!-- row 4: persona / influence ops -->
<rect x="20" y="305" width="240" height="70" fill="#f1d6d0" stroke="#b2351e" rx="4"/>
<text x="140" y="323" text-anchor="middle" font-weight="700" fill="#b2351e">Persona / influence ops</text>
<text x="140" y="343" text-anchor="middle" font-size="10">fake reviews, fabricated</text>
<text x="140" y="359" text-anchor="middle" font-size="10">social-media content</text>

<rect x="290" y="305" width="450" height="70" fill="#eef5ec" stroke="#1f6f3a" rx="4"/>
<text x="515" y="323" text-anchor="middle" font-weight="700" fill="#1f6f3a">Threat-disruption reports (May 2024 OpenAI + MS Threat Intel)</text>
<text x="515" y="343" text-anchor="middle" font-size="10">Sandstorm, Forest Blizzard, Crimson Sandstorm named</text>
<text x="515" y="359" text-anchor="middle" font-size="10">100+ disrupted ops aggregated across OpenAI / Anthropic / Google</text>
</g>
</svg>