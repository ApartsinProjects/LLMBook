<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="English dominates web content (about 60 percent) but is spoken natively by only about 12 percent of humans." aria-labelledby="fig523title" role="img" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg">
<title id="fig523title">Web language share vs human speaker share</title>
<text fill="#222" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" x="380" y="24">The training-data mismatch behind cultural bias</text>
<g font-family="Georgia, serif" font-size="11">
<text fill="#222" font-size="13" font-weight="bold" text-anchor="middle" x="200" y="60">Web content share</text>
<text fill="#222" font-size="13" font-weight="bold" text-anchor="middle" x="560" y="60">World speaker share</text>
<rect fill="#1f77b4" height="40" width="280" x="60" y="80"></rect>
<text fill="#fff" font-weight="bold" text-anchor="middle" x="200" y="105">English ~60%</text>
<rect fill="#1f77b4" height="40" width="60" x="420" y="80"></rect>
<text fill="#fff" font-weight="bold" text-anchor="middle" x="450" y="105">~12%</text>
<text fill="#444" x="490" y="105">English</text>
<rect fill="#cc8400" height="40" width="9" x="60" y="130"></rect>
<text fill="#444" x="80" y="155">Mandarin &lt; 2%</text>
<rect fill="#cc8400" height="40" width="63" x="420" y="130"></rect>
<text fill="#444" x="485" y="155">~13% Mandarin</text>
<rect fill="#d62728" height="40" width="0.5" x="60" y="180"></rect>
<text fill="#444" x="80" y="205">Hindi &lt; 0.1%</text>
<rect fill="#d62728" height="40" width="40" x="420" y="180"></rect>
<text fill="#444" x="465" y="205">~8% Hindi</text>
<rect fill="#2ca02c" height="40" width="0.5" x="60" y="230"></rect>
<text fill="#444" x="80" y="255">Bengali &lt; 0.1%</text>
<rect fill="#2ca02c" height="40" width="20" x="420" y="230"></rect>
<text fill="#444" x="445" y="255">~4% Bengali</text>
<rect fill="#7754a3" height="40" width="0.5" x="60" y="280"></rect>
<text fill="#444" x="80" y="305">Swahili &lt; 0.05%</text>
<rect fill="#7754a3" height="40" width="10" x="420" y="280"></rect>
<text fill="#444" x="435" y="305">~2% Swahili</text>
<line stroke="#444" stroke-dasharray="4 3" stroke-width="1" x1="380" x2="380" y1="60" y2="330"></line>
<text fill="#444" font-style="italic" text-anchor="middle" x="380" y="345">scale: each bar represents the same number of dimensions in either share</text>
<text fill="#666" font-size="9" x="20" y="346">Sources: W3Techs (2024); Ethnologue (2024). Bar widths approximate.</text>
</g></svg>