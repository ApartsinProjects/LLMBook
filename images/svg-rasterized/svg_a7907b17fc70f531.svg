<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Top-K mixture-of-experts routing. A token x enters a gating network that produces affinity scores over six experts. The top two scoring experts (Expert 2 and Expert 5) are selected and their softmax weights w2 and w5 multiply their outputs, which are summed into y. The other four experts are skipped, saving compute." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 780 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="moeTok" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bbdefb"></stop><stop offset="100%" stop-color="#1e88e5"></stop></lineargradient>
<lineargradient id="moeGate" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e1bee7"></stop><stop offset="100%" stop-color="#8e24aa"></stop></lineargradient>
<lineargradient id="moeOn" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"></stop><stop offset="100%" stop-color="#43a047"></stop></lineargradient>
<lineargradient id="moeOff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f0f0f0"></stop><stop offset="100%" stop-color="#cfcfcf"></stop></lineargradient>
<lineargradient id="moeSum" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffe0b2"></stop><stop offset="100%" stop-color="#fb8c00"></stop></lineargradient>
<filter height="112%" id="moeShadow" width="112%" x="-6%" y="-6%"><fedropshadow dx="1" dy="2" flood-opacity="0.18" stddeviation="2"></fedropshadow></filter>
<marker id="moeArrow" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"></path></marker>
<marker id="moeArrowOn" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#43a047"></path></marker>
</defs>
<rect fill="#fafafa" height="380" rx="8" width="780" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="390" y="26">Top-K routing: one token, k=2 of E=6 experts active</text>
<!-- token -->
<rect fill="url(#moeTok)" filter="url(#moeShadow)" height="50" rx="9" width="92" x="24" y="165"></rect>
<text fill="#fff" font-size="13" font-weight="600" text-anchor="middle" x="70" y="188">token</text>
<text fill="#e3f2fd" font-size="12" text-anchor="middle" x="70" y="205">x ∈ ℝᵈ</text>
<!-- gate -->
<line marker-end="url(#moeArrow)" stroke="#777" stroke-width="2" x1="116" x2="156" y1="190" y2="190"></line>
<rect fill="url(#moeGate)" filter="url(#moeShadow)" height="80" rx="9" width="120" x="156" y="150"></rect>
<text fill="#fff" font-size="13" font-weight="600" text-anchor="middle" x="216" y="180">gating g(x)</text>
<text fill="#f3e5f5" font-size="11" text-anchor="middle" x="216" y="199">= Wᵣ x</text>
<text fill="#f3e5f5" font-size="11" text-anchor="middle" x="216" y="216">softmax top-k</text>
<!-- experts -->
<g font-size="12" font-weight="600">
<!-- expert rows: y centers 50,95,140,185,230,275 offset -->
<rect fill="url(#moeOff)" height="38" rx="8" width="150" x="330" y="40"></rect><text fill="#777" text-anchor="middle" x="405" y="64">Expert 1  (skip)</text>
<rect fill="url(#moeOn)" filter="url(#moeShadow)" height="38" rx="8" width="150" x="330" y="92"></rect><text fill="#fff" text-anchor="middle" x="405" y="116">Expert 2  w₂=0.62</text>
<rect fill="url(#moeOff)" height="38" rx="8" width="150" x="330" y="144"></rect><text fill="#777" text-anchor="middle" x="405" y="168">Expert 3  (skip)</text>
<rect fill="url(#moeOff)" height="38" rx="8" width="150" x="330" y="196"></rect><text fill="#777" text-anchor="middle" x="405" y="220">Expert 4  (skip)</text>
<rect fill="url(#moeOn)" filter="url(#moeShadow)" height="38" rx="8" width="150" x="330" y="248"></rect><text fill="#fff" text-anchor="middle" x="405" y="272">Expert 5  w₅=0.38</text>
<rect fill="url(#moeOff)" height="38" rx="8" width="150" x="330" y="300"></rect><text fill="#777" text-anchor="middle" x="405" y="324">Expert 6  (skip)</text>
</g>
<!-- gate to experts: dashed for skipped, solid green for chosen -->
<line stroke="#bbb" stroke-dasharray="4,3" stroke-width="1.2" x1="276" x2="330" y1="190" y2="59"></line>
<line marker-end="url(#moeArrowOn)" stroke="#43a047" stroke-width="2.4" x1="276" x2="330" y1="190" y2="111"></line>
<line stroke="#bbb" stroke-dasharray="4,3" stroke-width="1.2" x1="276" x2="330" y1="190" y2="163"></line>
<line stroke="#bbb" stroke-dasharray="4,3" stroke-width="1.2" x1="276" x2="330" y1="190" y2="215"></line>
<line marker-end="url(#moeArrowOn)" stroke="#43a047" stroke-width="2.4" x1="276" x2="330" y1="190" y2="267"></line>
<line stroke="#bbb" stroke-dasharray="4,3" stroke-width="1.2" x1="276" x2="330" y1="190" y2="319"></line>
<!-- sum node -->
<line marker-end="url(#moeArrowOn)" stroke="#43a047" stroke-width="2.4" x1="480" x2="600" y1="111" y2="180"></line>
<line marker-end="url(#moeArrowOn)" stroke="#43a047" stroke-width="2.4" x1="480" x2="600" y1="267" y2="200"></line>
<circle cx="624" cy="190" fill="url(#moeSum)" filter="url(#moeShadow)" r="30"></circle>
<text fill="#fff" font-size="20" font-weight="700" text-anchor="middle" x="624" y="197">Σ</text>
<!-- output -->
<line marker-end="url(#moeArrow)" stroke="#777" stroke-width="2" x1="654" x2="694" y1="190" y2="190"></line>
<rect fill="url(#moeTok)" filter="url(#moeShadow)" height="50" rx="9" width="62" x="694" y="165"></rect>
<text fill="#fff" font-size="14" font-weight="700" text-anchor="middle" x="725" y="195">y</text>
<text fill="#888" font-size="11" text-anchor="middle" x="405" y="358">4 of 6 experts skipped: capacity scales with total experts, cost scales with k</text>
</svg>