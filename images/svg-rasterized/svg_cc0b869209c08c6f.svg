<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Three-tier 2026 frontier model shelf: reasoning-first, long-context multimodal, open-weights" viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="400" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">The 2026 frontier model shelf: three tiers, three deployment theses</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Stargate ($500B) vs DeepSeek-R1 (~$5.6M base) brackets the cost spectrum</text>
<g font-size="10">
<!-- Tier 1: Reasoning-first -->
<g transform="translate(40,70)">
<rect width="260" height="300" rx="8" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="130" y="25" font-size="12" font-weight="700" text-anchor="middle" fill="#3d4d8a">Reasoning-first tier</text>
<text x="130" y="42" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">test-time compute scaling</text>
<text x="130" y="56" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">hybrid think-mode toggle</text>
<g font-size="9">
<rect x="20" y="75" width="220" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="130" y="89" text-anchor="middle">OpenAI o3 / o4-mini</text>
<rect x="20" y="100" width="220" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="130" y="114" text-anchor="middle">GPT-5 (Aug 2025) adaptive</text>
<rect x="20" y="125" width="220" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="130" y="139" text-anchor="middle">Claude Opus 4.5 ext-thinking</text>
<rect x="20" y="150" width="220" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="130" y="164" text-anchor="middle">Gemini 2.5 Pro Deep Think</text>
<rect x="20" y="175" width="220" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="130" y="189" text-anchor="middle">DeepSeek-R1 / R1-0528 (open)</text>
<rect x="20" y="200" width="220" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="130" y="214" text-anchor="middle">Qwen3 enable_thinking=True</text>
<rect x="20" y="225" width="220" height="22" rx="4" fill="#ffffff" stroke="#3d4d8a"/>
<text x="130" y="239" text-anchor="middle">Grok 4 (xAI, Jul 2025)</text>
</g>
<text x="130" y="275" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">use for: hard math, code,</text>
<text x="130" y="287" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">multi-step planning</text>
</g>
<!-- Tier 2: Long-context multimodal -->
<g transform="translate(310,70)">
<rect width="260" height="300" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="130" y="25" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Long-context multimodal</text>
<text x="130" y="42" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">1M-2M token windows</text>
<text x="130" y="56" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">text + image + audio + video</text>
<g font-size="9">
<rect x="20" y="75" width="220" height="36" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="130" y="92" text-anchor="middle" font-weight="700">Gemini 2.5 Pro</text>
<text x="130" y="105" font-size="8" text-anchor="middle" fill="#5a4a3a">2M ctx</text>
<rect x="20" y="115" width="220" height="36" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="130" y="132" text-anchor="middle" font-weight="700">Claude Opus 4.5</text>
<text x="130" y="145" font-size="8" text-anchor="middle" fill="#5a4a3a">1M ctx + extended thinking</text>
<rect x="20" y="155" width="220" height="36" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="130" y="172" text-anchor="middle" font-weight="700">GPT-5 / GPT-4o multimodal</text>
<text x="130" y="185" font-size="8" text-anchor="middle" fill="#5a4a3a">native multimodal IO</text>
</g>
<text x="130" y="225" font-size="10" font-weight="700" text-anchor="middle" fill="#a67c1a">World models (video+robotics)</text>
<g font-size="9">
<rect x="20" y="232" width="220" height="20" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="130" y="245" text-anchor="middle">Genie 2 (DeepMind)</text>
<rect x="20" y="254" width="220" height="20" rx="4" fill="#ffffff" stroke="#a67c1a"/>
<text x="130" y="267" text-anchor="middle">V-JEPA 2 (Meta), Cosmos (NV)</text>
</g>
<text x="130" y="295" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">use for: docs, video, agents</text>
</g>
<!-- Tier 3: Open-weights -->
<g transform="translate(580,70)">
<rect width="260" height="300" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="130" y="25" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Open-weights tier</text>
<text x="130" y="42" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">self-host: vLLM, llama.cpp, MLX</text>
<text x="130" y="56" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">~$5.6M training (DeepSeek-V3)</text>
<g font-size="9">
<rect x="20" y="75" width="220" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="130" y="89" text-anchor="middle">Llama-3.3 70B / Llama 4</text>
<rect x="20" y="100" width="220" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="130" y="114" text-anchor="middle">Qwen3 (April 2025)</text>
<rect x="20" y="125" width="220" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="130" y="139" text-anchor="middle">DeepSeek-V3.1 / R1</text>
<rect x="20" y="150" width="220" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="130" y="164" text-anchor="middle">Kimi K2 (1T-MoE, Moonshot)</text>
<rect x="20" y="175" width="220" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="130" y="189" text-anchor="middle">GLM-4.5 / 4.6 (Zhipu)</text>
<rect x="20" y="200" width="220" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="130" y="214" text-anchor="middle">GPT-OSS (OpenAI, 2025)</text>
<rect x="20" y="225" width="220" height="22" rx="4" fill="#ffffff" stroke="#1f7a3a"/>
<text x="130" y="239" text-anchor="middle">Nemotron-Reasoning (NV)</text>
</g>
<text x="130" y="275" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">use for: cost, privacy,</text>
<text x="130" y="287" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">on-prem fine-tuning</text>
</g>
</g>
</svg>