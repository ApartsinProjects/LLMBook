<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Multi-agent orchestration: a coordinator agent dispatches subtasks to specialist agents (planner, retriever, executor) and merges their results." role="img" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
<rect x="220" y="30" width="160" height="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="6"/><text x="300" y="60" font-size="14" font-weight="bold" text-anchor="middle">Coordinator</text><rect x="40" y="140" width="140" height="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="6"/><text x="110" y="170" font-size="13" font-weight="bold" text-anchor="middle">Planner</text><rect x="230" y="140" width="140" height="50" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="6"/><text x="300" y="170" font-size="13" font-weight="bold" text-anchor="middle">Retriever</text><rect x="420" y="140" width="140" height="50" fill="#fce4ec" stroke="#ad1457" stroke-width="2" rx="6"/><text x="490" y="170" font-size="13" font-weight="bold" text-anchor="middle">Executor</text><path d="M 280 80 L 130 140" stroke="#555" stroke-width="2"/><path d="M 300 80 L 300 140" stroke="#555" stroke-width="2"/><path d="M 320 80 L 470 140" stroke="#555" stroke-width="2"/>
</svg>