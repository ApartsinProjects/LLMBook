<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Image and video provenance ships in two complementary layers." aria-labelledby="fig543title" role="img" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg">
<title id="fig543title">C2PA manifest plus SynthID-Image: two complementary layers</title>
<text fill="#222" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" x="380" y="24">C2PA + SynthID-Image: belt and suspenders</text>
<g font-family="Georgia, serif" font-size="11">
<rect fill="#e8f1fb" height="280" rx="8" stroke="#1f77b4" width="350" x="20" y="60"></rect>
<text fill="#1f77b4" font-size="13" font-weight="bold" text-anchor="middle" x="195" y="84">C2PA manifest (metadata)</text>
<rect fill="#fff" height="60" rx="4" stroke="#1f77b4" width="310" x="40" y="100"></rect>
<text fill="#222" font-weight="bold" x="55" y="120">Embedded in PNG / JPEG / MP4 / PDF</text>
<text fill="#444" x="55" y="138">claim-generator: "Adobe Firefly v3"</text>
<text fill="#444" x="55" y="154">actions: [created, parameters, edited_by]</text>
<rect fill="#fff" height="60" rx="4" stroke="#1f77b4" width="310" x="40" y="170"></rect>
<text fill="#222" font-weight="bold" x="55" y="190">Signature chain (X.509 / Ed25519)</text>
<text fill="#444" x="55" y="208">claim → signed by generator key</text>
<text fill="#444" x="55" y="224">→ countersigned by camera/Adobe CA</text>
<rect fill="#fff" height="60" rx="4" stroke="#1f77b4" width="310" x="40" y="240"></rect>
<text fill="#222" font-weight="bold" x="55" y="260">Shippers (2026):</text>
<text fill="#444" x="55" y="278">Adobe, Microsoft, AP, BBC, Sony,</text>
<text fill="#444" x="55" y="294">Nikon Z9, Leica M11-P, Sony α1 II</text>
<text fill="#d62728" font-style="italic" text-anchor="middle" x="195" y="324">⚠ stripped by screenshot or recompression</text>
<rect fill="#e9f7e9" height="280" rx="8" stroke="#2ca02c" width="350" x="390" y="60"></rect>
<text fill="#2ca02c" font-size="13" font-weight="bold" text-anchor="middle" x="565" y="84">SynthID-Image (pixels)</text>
<rect fill="#fff" height="60" rx="4" stroke="#2ca02c" width="310" x="410" y="100"></rect>
<text fill="#222" font-weight="bold" x="425" y="120">Pixel-domain statistical mark</text>
<text fill="#444" x="425" y="138">spatial-frequency perturbation</text>
<text fill="#444" x="425" y="154">invisible to humans</text>
<rect fill="#fff" height="60" rx="4" stroke="#2ca02c" width="310" x="410" y="170"></rect>
<text fill="#222" font-weight="bold" x="425" y="190">Survives common transforms</text>
<text fill="#444" x="425" y="208">JPEG re-encode (Q ≥ 50)</text>
<text fill="#444" x="425" y="224">crop, resize, modest filter</text>
<rect fill="#fff" height="60" rx="4" stroke="#2ca02c" width="310" x="410" y="240"></rect>
<text fill="#222" font-weight="bold" x="425" y="260">Shippers (2026):</text>
<text fill="#444" x="425" y="278">Imagen 3, Veo 2 (Google)</text>
<text fill="#444" x="425" y="294">other DeepMind generators</text>
<text fill="#d62728" font-style="italic" text-anchor="middle" x="565" y="324">⚠ paraphrase / inversion attack can remove</text>
</g>
</svg>