<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Data flywheel cycle: user interactions generate feedback and logs that become curated eval data, which trains an improved model, which feeds back into user interactions, creating a self-improving production loop." role="img" style="font-family: sans-serif;" viewBox="0 -11 600 311" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<marker id="arrow2" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#8e44ad" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<filter height="115%" id="shadow2" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<text fill="#1a1a2e" font-size="16" font-weight="700" text-anchor="middle" x="300" y="25">Data Flywheel</text>
<!-- Circular flow -->
<rect fill="#e8f5e9" filter="url(#shadow2)" height="45" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="180" x="210" y="50"></rect>
<text fill="#333" font-size="13" font-weight="600" text-anchor="middle" x="300" y="78">User Interactions</text>
<rect fill="#e8f4fd" filter="url(#shadow2)" height="45" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="170" x="400" y="130"></rect>
<text fill="#333" font-size="13" font-weight="600" text-anchor="middle" x="485" y="158">Feedback + Logs</text>
<rect fill="#f0e6ff" filter="url(#shadow2)" height="45" rx="10" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="180" x="210" y="210"></rect>
<text fill="#333" font-size="13" font-weight="600" text-anchor="middle" x="300" y="238">Curated Eval Data</text>
<rect fill="#fff3e0" filter="url(#shadow2)" height="45" rx="10" stroke="#ff9800" stroke-linecap="round" stroke-width="2" width="170" x="30" y="130"></rect>
<text fill="#333" font-size="13" font-weight="600" text-anchor="middle" x="115" y="158">Improved Model</text>
<!-- Arrows connecting the cycle -->
<path d="M 390 75 Q 440 75 440 130" fill="none" marker-end="url(#arrow2)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2.5"></path>
<path d="M 440 175 Q 440 232 390 232" fill="none" marker-end="url(#arrow2)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2.5"></path>
<path d="M 210 232 Q 160 232 160 175" fill="none" marker-end="url(#arrow2)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2.5"></path>
<path d="M 160 130 Q 160 75 210 75" fill="none" marker-end="url(#arrow2)" stroke="#8e44ad" stroke-linecap="round" stroke-width="2.5"></path>
</svg>