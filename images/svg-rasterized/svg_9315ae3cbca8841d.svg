<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The seven regulatory tracks a 2026 manufacturing LLM deployment must satisfy." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" style="max-width:880px;background:#fafafa;border:1px solid #ddd;font-family:sans-serif;">
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle">Seven regulatory tracks layered over one manufacturing LLM deployment</text>
<rect x="60" y="60" width="760" height="44" fill="#fef9e7" stroke="#f1c40f"/>
<text x="80" y="80" font-size="11" font-weight="700">1. ISO/IEC 42001 (Dec 2023)</text>
<text x="80" y="96" font-size="10">AI management system. Roles, risk-mgmt, change control, supplier mgmt. Procurement RFPs require it.</text>
<rect x="60" y="110" width="760" height="44" fill="#eaf2f8" stroke="#2980b9"/>
<text x="80" y="130" font-size="11" font-weight="700">2. ISA/IEC 62443 series</text>
<text x="80" y="146" font-size="10">Industrial cybersecurity. Zone-and-conduit; SL1-SL4. Architectural backbone of IT/OT separation.</text>
<rect x="60" y="160" width="760" height="44" fill="#eaf2f8" stroke="#2980b9"/>
<text x="80" y="180" font-size="11" font-weight="700">3. NIST AI RMF + SP 800-82 Rev 3</text>
<text x="80" y="196" font-size="10">US federal OT cyber + AI risk. Govern/Map/Measure/Manage. Required by many DIB contracts.</text>
<rect x="60" y="210" width="760" height="44" fill="#fadbd8" stroke="#c0392b"/>
<text x="80" y="230" font-size="11" font-weight="700">4. EU Machinery Regulation 2023/1230 (effective Jan 2027)</text>
<text x="80" y="246" font-size="10">Replaces Machinery Directive. AI-specific safety reqs for machinery on EU market.</text>
<rect x="60" y="260" width="760" height="44" fill="#fadbd8" stroke="#c0392b"/>
<text x="80" y="280" font-size="11" font-weight="700">5. EU AI Act (2024/1689)</text>
<text x="80" y="296" font-size="10">Annex III S.4 employment / Annex I product safety lift AI to high-risk. Dual conformity with #4.</text>
<rect x="60" y="310" width="370" height="44" fill="#d5f5e3" stroke="#27ae60"/>
<text x="80" y="330" font-size="11" font-weight="700">6. ITAR / EAR export controls</text>
<text x="80" y="346" font-size="10">Defense data. AWS GovCloud or air-gap. On-prem open weights.</text>
<rect x="450" y="310" width="370" height="44" fill="#d5f5e3" stroke="#27ae60"/>
<text x="470" y="330" font-size="11" font-weight="700">7. Sector GxP / GMP (FDA, EMA, PMDA)</text>
<text x="470" y="346" font-size="10">Pharma 21 CFR 211, MDR/IVDR, GAMP 5. Versioned snapshots, no drift.</text>
</svg>