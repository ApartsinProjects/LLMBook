<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The provenance chain that broke when generation got cheap" viewBox="0 0 793 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig541title" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;">
<title id="fig541title">The provenance chain that broke when generation got cheap</title>
<defs>
<marker id="arr541" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 z" fill="#444"/>
</marker>
</defs>
<text x="380" y="24" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Provenance: the chain from origin to viewer</text>
<g font-family="Georgia, serif" font-size="11">
<rect x="20" y="60" width="120" height="80" rx="6" fill="#e9f7e9" stroke="#2ca02c"/>
<text x="80" y="84" text-anchor="middle" font-weight="bold" fill="#2ca02c">Pre-2022 world</text>
<text x="80" y="104" text-anchor="middle" fill="#444">camera → file</text>
<text x="80" y="120" text-anchor="middle" fill="#444">writer → text</text>
<text x="80" y="136" text-anchor="middle" fill="#444">witness → recording</text>
<line x1="140" y1="100" x2="170" y2="100" stroke="#444" stroke-width="2" marker-end="url(#arr541)"/>
<rect x="180" y="60" width="120" height="80" rx="6" fill="#e9f7e9" stroke="#2ca02c"/>
<text x="240" y="84" text-anchor="middle" font-weight="bold" fill="#2ca02c">Distribution</text>
<text x="240" y="104" text-anchor="middle" fill="#444">newspaper, TV,</text>
<text x="240" y="120" text-anchor="middle" fill="#444">social feed</text>
<text x="240" y="136" text-anchor="middle" fill="#666" font-style="italic">trust intact</text>
<line x1="300" y1="100" x2="330" y2="100" stroke="#444" stroke-width="2" marker-end="url(#arr541)"/>
<rect x="340" y="60" width="120" height="80" rx="6" fill="#e9f7e9" stroke="#2ca02c"/>
<text x="400" y="84" text-anchor="middle" font-weight="bold" fill="#2ca02c">Viewer</text>
<text x="400" y="104" text-anchor="middle" fill="#444">"a photo implies</text>
<text x="400" y="120" text-anchor="middle" fill="#444">a camera was there"</text>
<text x="400" y="136" text-anchor="middle" fill="#666" font-style="italic">trust holds</text>
<text x="380" y="170" text-anchor="middle" font-weight="bold" fill="#d62728" font-size="13">↓ what generative AI broke ↓</text>
<rect x="20" y="200" width="120" height="80" rx="6" fill="#fde9e9" stroke="#d62728"/>
<text x="80" y="224" text-anchor="middle" font-weight="bold" fill="#d62728">Post-2022</text>
<text x="80" y="244" text-anchor="middle" fill="#444">Midjourney → photo</text>
<text x="80" y="260" text-anchor="middle" fill="#444">GPT-4 → article</text>
<text x="80" y="276" text-anchor="middle" fill="#444">ElevenLabs → voice</text>
<line x1="140" y1="240" x2="170" y2="240" stroke="#444" stroke-width="2" marker-end="url(#arr541)"/>
<rect x="180" y="200" width="120" height="80" rx="6" fill="#fde9e9" stroke="#d62728"/>
<text x="240" y="224" text-anchor="middle" font-weight="bold" fill="#d62728">Same channels</text>
<text x="240" y="244" text-anchor="middle" fill="#444">indistinguishable</text>
<text x="240" y="260" text-anchor="middle" fill="#444">from human content</text>
<text x="240" y="276" text-anchor="middle" fill="#666" font-style="italic">channel is colorblind</text>
<line x1="300" y1="240" x2="330" y2="240" stroke="#444" stroke-width="2" marker-end="url(#arr541)"/>
<rect x="340" y="200" width="120" height="80" rx="6" fill="#fde9e9" stroke="#d62728"/>
<text x="400" y="224" text-anchor="middle" font-weight="bold" fill="#d62728">Viewer (broken)</text>
<text x="400" y="244" text-anchor="middle" fill="#444">cannot tell</text>
<text x="400" y="260" text-anchor="middle" fill="#444">photo from prompt</text>
<text x="400" y="276" text-anchor="middle" fill="#666" font-style="italic">every screenshot a guess</text>
<rect x="490" y="52" width="250" height="220" rx="8" fill="#e8f1fb" stroke="#1f77b4"/>
<text x="615" y="84" text-anchor="middle" font-weight="bold" fill="#1f77b4" font-size="13">Provenance stack response</text>
<text x="505" y="108" font-weight="bold" fill="#222">1. Watermark (54.2-54.4)</text>
<text x="505" y="124" fill="#444">signal embedded at generation</text>
<text x="505" y="144" font-weight="bold" fill="#222">2. C2PA manifest (54.5)</text>
<text x="505" y="160" fill="#444">signed metadata travels with file</text>
<text x="505" y="180" font-weight="bold" fill="#222">3. Disclosure / labeling</text>
<text x="505" y="196" fill="#444">platform-level "AI generated" tag</text>
<text x="505" y="216" font-weight="bold" fill="#222">4. Policy (EU AI Act Art. 50)</text>
<text x="505" y="232" fill="#444">legal disclosure requirement</text>
<text x="615" y="260" text-anchor="middle" fill="#666" font-style="italic">complementary, not interchangeable</text>
</g>
</svg>