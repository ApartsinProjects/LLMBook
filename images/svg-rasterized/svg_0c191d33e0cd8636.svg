<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The FDA SaMD scope decision and its $500K-$2M consequence" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="fig-74-3-1-title fig-74-3-1-desc">
<title id="fig-74-3-1-title">The FDA SaMD scope decision and its $500K-$2M consequence</title>
<desc id="fig-74-3-1-desc">Decision tree. Question: "Does the LLM output go to the patient directly, or to a clinician who must independently review?" Patient-facing branch (right): inside SaMD scope, 510(k) clearance 6-12 months, $500K-$2M, PCCP framework needed. Clinician-reviewed branch (left): outside SaMD, no clearance, HIPAA + state-patchwork + EU AI Act overlays only. Below: the four jurisdictions stack.</desc>
<rect x="0" y="0" width="760" height="380" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">FDA SaMD scope: the architectural decision worth $500K-$2M</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- decision diamond -->
<polygon points="380,40 540,100 380,160 220,100" fill="#fff5d6" stroke="#b8860b" stroke-width="2"/>
<text x="380" y="85" text-anchor="middle" font-weight="700" fill="#7a5a08">Where does the LLM output go?</text>
<text x="380" y="103" text-anchor="middle" font-size="10">Patient-facing? Clinician-reviewed?</text>
<text x="380" y="120" text-anchor="middle" font-size="10" font-style="italic">(intended-use determines scope)</text>

<!-- left branch: outside SaMD -->
<line x1="290" y1="120" x2="180" y2="180" stroke="#1f6f3a" stroke-width="2" marker-end="url(#arr10)"/>
<text x="220" y="155" font-size="11" font-weight="700" fill="#1f6f3a">Clinician reviews + signs</text>

<rect x="40" y="180" width="280" height="170" fill="#eef5ec" stroke="#1f6f3a" stroke-width="2" rx="4"/>
<text x="180" y="200" text-anchor="middle" font-weight="700" fill="#1f6f3a">Outside SaMD scope</text>
<text x="180" y="220" text-anchor="middle" font-size="10">no 510(k), no clinical validation</text>
<text x="180" y="234" text-anchor="middle" font-size="10">no change-control bureaucracy</text>
<line x1="60" y1="244" x2="300" y2="244" stroke="#1f6f3a"/>
<text x="180" y="262" text-anchor="middle" font-weight="700">Still required:</text>
<text x="180" y="278" text-anchor="middle" font-size="10">• HIPAA BAA + audit log</text>
<text x="180" y="294" text-anchor="middle" font-size="10">• EU AI Act Annex III high-risk</text>
<text x="180" y="310" text-anchor="middle" font-size="10">• State-patchwork (CA AB 3030, IL)</text>
<text x="180" y="326" text-anchor="middle" font-size="10">• CHAI assurance docs</text>
<text x="180" y="342" text-anchor="middle" font-size="10" fill="#1f6f3a" font-weight="700">~50-70% compliance savings</text>

<!-- right branch: inside SaMD -->
<line x1="470" y1="120" x2="580" y2="180" stroke="#b2351e" stroke-width="2" marker-end="url(#arr11)"/>
<text x="540" y="155" font-size="11" font-weight="700" fill="#b2351e">Patient-facing dx</text>

<rect x="440" y="180" width="290" height="170" fill="#f1d6d0" stroke="#b2351e" stroke-width="2" rx="4"/>
<text x="585" y="200" text-anchor="middle" font-weight="700" fill="#b2351e">Inside SaMD scope (Class II)</text>
<text x="585" y="220" text-anchor="middle" font-size="10">510(k) clearance 6-12 months</text>
<text x="585" y="234" text-anchor="middle" font-size="10">$500K-$2M initial cost</text>
<line x1="460" y1="244" x2="710" y2="244" stroke="#b2351e"/>
<text x="585" y="262" text-anchor="middle" font-weight="700">Required PCCP (Jan 2025 final):</text>
<text x="585" y="278" text-anchor="middle" font-size="10">• Pre-specified update categories</text>
<text x="585" y="294" text-anchor="middle" font-size="10">• Per-update validation protocol</text>
<text x="585" y="310" text-anchor="middle" font-size="10">• Held-out demographics eval</text>
<text x="585" y="326" text-anchor="middle" font-size="10">• Rollback path for regressions</text>
<text x="585" y="342" text-anchor="middle" font-size="10" fill="#b2351e" font-weight="700">4-6 wk updates (vs 6-9 mo pre-PCCP)</text>

<defs>
<marker id="arr10" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6f3a"/></marker>
<marker id="arr11" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b2351e"/></marker>
</defs>
</g>
</svg>