<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="H100 SXM5 hourly prices across the four procurement tiers" viewBox="-55 -60 935 520" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="460" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">H100 SXM5 price per hour across procurement tiers, mid-2026</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Same silicon. The structural price gap is what funds the multi-vendor portfolio.</text>
<g transform="translate(80,80)">
<line x1="0" y1="300" x2="700" y2="300" stroke="#1a1a2e" stroke-width="1.5"/>
<line x1="0" y1="0" x2="0" y2="300" stroke="#1a1a2e" stroke-width="1.5"/>
<!-- y ticks -->
<g font-size="9" fill="#5a4a3a" text-anchor="end">
<text x="-6" y="304">$0</text><line x1="0" y1="300" x2="-3" y2="300" stroke="#1a1a2e"/>
<text x="-6" y="254">$2</text><line x1="0" y1="250" x2="-3" y2="250" stroke="#1a1a2e"/>
<text x="-6" y="204">$4</text><line x1="0" y1="200" x2="-3" y2="200" stroke="#1a1a2e"/>
<text x="-6" y="154">$6</text><line x1="0" y1="150" x2="-3" y2="150" stroke="#1a1a2e"/>
<text x="-6" y="104">$8</text><line x1="0" y1="100" x2="-3" y2="100" stroke="#1a1a2e"/>
<text x="-6" y="54">$10</text><line x1="0" y1="50" x2="-3" y2="50" stroke="#1a1a2e"/>
<text x="-6" y="4">$12</text><line x1="0" y1="0" x2="-3" y2="0" stroke="#1a1a2e"/>
</g>
<text x="-50" y="150" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 -50 150)">USD / hour (H100)</text>
<!-- Tier 1: Hyperscaler on-demand $8-12 -->
<rect x="20" y="8" width="80" height="200" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="2"/>
<line x1="20" y1="100" x2="100" y2="100" stroke="#7a2a2a" stroke-width="1" stroke-dasharray="2,2"/>
<text x="60" y="316" font-size="10" font-weight="700" text-anchor="middle" fill="#7a2a2a">Hyperscaler</text>
<text x="60" y="328" font-size="9" text-anchor="middle" fill="#1a1a2e">on-demand</text>
<text x="60" y="340" font-size="8" text-anchor="middle" fill="#5a4a3a">AWS p5.48xlarge</text>
<text x="60" y="-10" font-size="10" font-weight="700" text-anchor="middle" fill="#7a2a2a">$8-$12</text>
<!-- Tier 2: Hyperscaler reserved $4-5 -->
<rect x="170" y="150" width="80" height="150" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<line x1="170" y1="200" x2="250" y2="200" stroke="#a67c1a" stroke-width="1" stroke-dasharray="2,2"/>
<text x="210" y="316" font-size="10" font-weight="700" text-anchor="middle" fill="#a67c1a">Hyperscaler</text>
<text x="210" y="328" font-size="9" text-anchor="middle" fill="#1a1a2e">1-yr reserved</text>
<text x="210" y="340" font-size="8" text-anchor="middle" fill="#5a4a3a">AWS p5 RI</text>
<text x="210" y="140" font-size="10" font-weight="700" text-anchor="middle" fill="#a67c1a">$4-$5</text>
<!-- Tier 3: Specialist on-demand $2.49-$4 -->
<rect x="320" y="200" width="80" height="100" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<line x1="320" y1="237" x2="400" y2="237" stroke="#1f7a3a" stroke-width="1" stroke-dasharray="2,2"/>
<text x="360" y="316" font-size="10" font-weight="700" text-anchor="middle" fill="#1f7a3a">Specialist</text>
<text x="360" y="328" font-size="9" text-anchor="middle" fill="#1a1a2e">on-demand</text>
<text x="360" y="340" font-size="8" text-anchor="middle" fill="#5a4a3a">Lambda, CoreWeave</text>
<text x="360" y="190" font-size="10" font-weight="700" text-anchor="middle" fill="#1f7a3a">$2.49-$4</text>
<!-- Tier 4a: Specialist reserved $1.85-2.80 -->
<rect x="470" y="230" width="80" height="70" fill="#cfe0ee" stroke="#1a4078" stroke-width="2"/>
<line x1="470" y1="248" x2="550" y2="248" stroke="#1a4078" stroke-width="1" stroke-dasharray="2,2"/>
<text x="510" y="316" font-size="10" font-weight="700" text-anchor="middle" fill="#1a4078">Specialist</text>
<text x="510" y="328" font-size="9" text-anchor="middle" fill="#1a1a2e">30-90d reserved</text>
<text x="510" y="340" font-size="8" text-anchor="middle" fill="#5a4a3a">Lambda 3mo</text>
<text x="510" y="220" font-size="10" font-weight="700" text-anchor="middle" fill="#1a4078">$1.85-$2.80</text>
<!-- Tier 5: Spot $1.20-1.80 -->
<rect x="620" y="255" width="80" height="45" fill="#f0e3f8" stroke="#6a3d8a" stroke-width="2"/>
<line x1="620" y1="265" x2="700" y2="265" stroke="#6a3d8a" stroke-width="1" stroke-dasharray="2,2"/>
<text x="660" y="316" font-size="10" font-weight="700" text-anchor="middle" fill="#6a3d8a">Spot</text>
<text x="660" y="328" font-size="9" text-anchor="middle" fill="#1a1a2e">preemptible</text>
<text x="660" y="340" font-size="8" text-anchor="middle" fill="#5a4a3a">RunPod, vast.ai</text>
<text x="660" y="245" font-size="10" font-weight="700" text-anchor="middle" fill="#6a3d8a">$1.20-$1.80</text>
<!-- arrow showing 7x compression -->
<path d="M 60 -25 Q 360 -50 660 -25" stroke="#1a1a2e" stroke-width="1.5" fill="none" marker-end="url(#arr573)" stroke-dasharray="4,3"/>
<text x="360" y="-55" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">~7&#x00D7; price compression, same H100 silicon</text>
<defs><marker id="arr573" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#1a1a2e"/></marker></defs>
</g>
<!-- legend: portfolio shares -->
<g transform="translate(80,400)" font-size="10" fill="#1a1a2e">
<text x="0" y="0" font-weight="700">Recommended portfolio share:</text>
<text x="220" y="0">60-80% reserved &#x2022; 15-25% on-demand &#x2022; 5-10% spot</text>
</g>
</svg>