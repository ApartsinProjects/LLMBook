<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="FAISS index factory: a comma-separated string maps to a three-stage pipeline of optional preprocessing, a coarse quantizer (IVF or HNSW), and an encoder (Flat, PQ, or SQ)." role="img" viewbox="0 0 760 240" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="230" rx="10" stroke="#ddd" width="750" x="5" y="5"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" x="25" y="32">faiss.index_factory(d, "OPQ16,IVF4096,PQ16x8")</text>
<rect fill="#e3f2fd" height="55" rx="6" stroke="#1565c0" width="170" x="25" y="65"></rect>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="110" y="88">1. Preprocess</text>
<text fill="#1565c0" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="110" y="106">OPQ16, PCAR256, L2norm</text>
<rect fill="#fff3e0" height="55" rx="6" stroke="#e65100" width="170" x="225" y="65"></rect>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="310" y="88">2. Coarse quantizer</text>
<text fill="#e65100" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="310" y="106">IVF4096, HNSW32, Flat</text>
<rect fill="#e8f5e9" height="55" rx="6" stroke="#2e7d32" width="170" x="425" y="65"></rect>
<text fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="510" y="88">3. Encoder</text>
<text fill="#2e7d32" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="510" y="106">Flat, PQ16x8, SQ8</text>
<rect fill="#f3e5f5" height="55" rx="6" stroke="#7b1fa2" width="125" x="615" y="65"></rect>
<text fill="#4a148c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="677" y="88">Composite</text>
<text fill="#7b1fa2" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="677" y="106">faiss.Index</text>
<g stroke="#555" stroke-width="1.5">
<line x1="197" x2="223" y1="92" y2="92"></line>
<polygon fill="#555" points="223 92, 217 89, 217 95"></polygon>
<line x1="397" x2="423" y1="92" y2="92"></line>
<polygon fill="#555" points="423 92, 417 89, 417 95"></polygon>
<line x1="597" x2="613" y1="92" y2="92"></line>
<polygon fill="#555" points="613 92, 607 89, 607 95"></polygon>
</g>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="25" y="155">Examples:</text>
<text fill="#333" font-family="Consolas, monospace" font-size="11" x="25" y="175">"Flat"                     -&gt; brute force, exact</text>
<text fill="#333" font-family="Consolas, monospace" font-size="11" x="25" y="192">"HNSW32"                   -&gt; graph index, in-memory</text>
<text fill="#333" font-family="Consolas, monospace" font-size="11" x="25" y="209">"IVF100,Flat"              -&gt; partition then exact within cells</text>
<text fill="#333" font-family="Consolas, monospace" font-size="11" x="395" y="175">"IVF1024,PQ96"             -&gt; partition + compress</text>
<text fill="#333" font-family="Consolas, monospace" font-size="11" x="395" y="192">"OPQ16,IVF4096,PQ16x8"     -&gt; rotate + partition + PQ</text>
<text fill="#333" font-family="Consolas, monospace" font-size="11" x="395" y="209">"IVF65536_HNSW32,PQ64"     -&gt; HNSW coarse quant + PQ</text>
</svg>