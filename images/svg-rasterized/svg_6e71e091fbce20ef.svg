<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Production hallucination response pipeline. LLM output flows into a detection bank (self-consistency, NLI entailment, citation verification) that produces a confidence score; a risk-tier router then branches into three outcomes: emit the answer (low-risk tier, high confidence), abstain (low confidence), or escalate to a human reviewer (high-stakes tier)." role="img" style="font-family: sans-serif;" viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter height="115%" id="shadow2_d1" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
<marker id="arrow_d1" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#555" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<!-- LLM output box -->
<rect fill="#1a4078" filter="url(#shadow2_d1)" height="70" rx="10" width="130" x="15" y="100"></rect>
<text fill="white" font-size="13" font-weight="700" text-anchor="middle" x="80" y="128">LLM output</text>
<text fill="#cbd6e8" font-size="11" text-anchor="middle" x="80" y="146">candidate answer +</text>
<text fill="#cbd6e8" font-size="11" text-anchor="middle" x="80" y="160">source attributions</text>
<line marker-end="url(#arrow_d1)" stroke="#555" stroke-width="2" x1="145" x2="190" y1="135" y2="135"></line>
<!-- Detection bank -->
<rect fill="#e8f5e9" filter="url(#shadow2_d1)" height="170" rx="10" stroke="#1f7a3a" stroke-width="2" width="210" x="195" y="50"></rect>
<text fill="#1f7a3a" font-size="13" font-weight="700" text-anchor="middle" x="300" y="75">Detection checks</text>
<rect fill="white" height="32" rx="6" stroke="#1f7a3a" stroke-width="1" width="190" x="205" y="86"></rect>
<text fill="#1f7a3a" font-size="11" font-weight="600" x="215" y="100">Self-consistency</text>
<text fill="#555" font-size="11" x="215" y="113">N samples agree?</text>
<rect fill="white" height="32" rx="6" stroke="#1f7a3a" stroke-width="1" width="190" x="205" y="124"></rect>
<text fill="#1f7a3a" font-size="11" font-weight="600" x="215" y="138">NLI entailment</text>
<text fill="#555" font-size="11" x="215" y="151">claim supported by source?</text>
<rect fill="white" height="32" rx="6" stroke="#1f7a3a" stroke-width="1" width="190" x="205" y="162"></rect>
<text fill="#1f7a3a" font-size="11" font-weight="600" x="215" y="176">Citation verification</text>
<text fill="#555" font-size="11" x="215" y="189">references resolvable?</text>
<text fill="#888" font-size="10" text-anchor="middle" x="300" y="214">produce confidence c</text>
<line marker-end="url(#arrow_d1)" stroke="#555" stroke-width="2" x1="405" x2="450" y1="135" y2="135"></line>
<!-- Risk-tiered router (diamond) -->
<polygon fill="#fff3e0" filter="url(#shadow2_d1)" points="510,80 575,135 510,190 445,135" stroke="#a67c1a" stroke-width="2"></polygon>
<text fill="#a67c1a" font-size="12" font-weight="700" text-anchor="middle" x="510" y="130">Risk-tier router</text>
<text fill="#555" font-size="11" text-anchor="middle" x="510" y="148">threshold(c, tier)</text>
<!-- Three outcomes -->
<line marker-end="url(#arrow_d1)" stroke="#1f7a3a" stroke-width="2" x1="575" x2="625" y1="105" y2="55"></line>
<line marker-end="url(#arrow_d1)" stroke="#a67c1a" stroke-width="2" x1="575" x2="625" y1="135" y2="135"></line>
<line marker-end="url(#arrow_d1)" stroke="#6a1b9a" stroke-width="2" x1="575" x2="625" y1="165" y2="215"></line>
<rect fill="#e8f5e9" height="50" rx="8" stroke="#1f7a3a" stroke-width="1.5" width="140" x="630" y="25"></rect>
<text fill="#1f7a3a" font-size="12" font-weight="700" text-anchor="middle" x="700" y="45">Emit answer</text>
<text fill="#555" font-size="11" text-anchor="middle" x="700" y="62">c high, low-risk tier</text>
<rect fill="#fff3e0" height="50" rx="8" stroke="#a67c1a" stroke-width="1.5" width="140" x="630" y="110"></rect>
<text fill="#a67c1a" font-size="12" font-weight="700" text-anchor="middle" x="700" y="130">Abstain</text>
<text fill="#555" font-size="11" text-anchor="middle" x="700" y="147">"insufficient evidence"</text>
<rect fill="#f0e6ff" height="50" rx="8" stroke="#6a1b9a" stroke-width="1.5" width="140" x="630" y="195"></rect>
<text fill="#6a1b9a" font-size="12" font-weight="700" text-anchor="middle" x="700" y="215">Escalate</text>
<text fill="#555" font-size="11" text-anchor="middle" x="700" y="232">human-in-the-loop</text>
<!-- Note bar -->
<text fill="#666" font-size="11" font-style="italic" text-anchor="middle" x="390" y="262">Low-risk tiers favour emit; medical, legal, and financial tiers default to abstain or escalate when c is below threshold.</text>
</svg>