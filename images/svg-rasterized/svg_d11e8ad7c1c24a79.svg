<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Structured-extraction-then-LLM: the pattern that mitigates the mid-cap-Q3 incident" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="fig-73-2-1-title fig-73-2-1-desc">
<title id="fig-73-2-1-title">Structured-extraction-then-LLM: the pattern that mitigates the mid-cap-Q3 incident</title>
<desc id="fig-73-2-1-desc">Two-track pipeline. Top track (deterministic): SEC 10-Q press release feeds an XBRL extractor producing structured numbers ($1.234B revenue, +12.3% YoY, etc.). Bottom track (LLM): same press release feeds an LLM that produces narrative, MUST cite by reference. The two tracks converge into a post-generation regex check; mismatches fail before delivery.</desc>
<rect x="0" y="0" width="760" height="320" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">Structured-extraction-then-LLM (the mid-cap Q3 incident's architectural fix)</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- input -->
<rect x="30" y="120" width="120" height="60" fill="#eaf1ff" stroke="#2c5fa0" rx="4"/>
<text x="90" y="142" text-anchor="middle" font-weight="700" fill="#2c5fa0">10-Q press release</text>
<text x="90" y="160" text-anchor="middle" font-size="10">XBRL filing + prose</text>

<!-- top track deterministic -->
<line x1="150" y1="135" x2="190" y2="80" stroke="#1f6f3a" stroke-width="2" marker-end="url(#arr7)"/>
<rect x="190" y="50" width="200" height="80" fill="#eef5ec" stroke="#1f6f3a" rx="4"/>
<text x="290" y="70" text-anchor="middle" font-weight="700" fill="#1f6f3a">Deterministic XBRL parser</text>
<text x="290" y="88" text-anchor="middle" font-size="10">revenue: $1.234B</text>
<text x="290" y="102" text-anchor="middle" font-size="10">constant-currency growth: +12.3%</text>
<text x="290" y="116" text-anchor="middle" font-size="10">EPS: $0.45 vs $0.41 cons.</text>

<!-- bottom track LLM -->
<line x1="150" y1="165" x2="190" y2="220" stroke="#5a3d99" stroke-width="2" marker-end="url(#arr7)"/>
<rect x="190" y="200" width="200" height="80" fill="#ede4f7" stroke="#5a3d99" rx="4"/>
<text x="290" y="220" text-anchor="middle" font-weight="700" fill="#5a3d99">LLM (narrative only)</text>
<text x="290" y="238" text-anchor="middle" font-size="10">"Revenue grew {ref:revenue}</text>
<text x="290" y="252" text-anchor="middle" font-size="10">at constant currency {ref:cc_growth}"</text>
<text x="290" y="270" text-anchor="middle" font-size="10" font-style="italic" fill="#b2351e">forbidden: free-form numbers</text>

<!-- converge to check -->
<line x1="390" y1="90" x2="450" y2="140" stroke="#5a6573" stroke-width="2" marker-end="url(#arr7)"/>
<line x1="390" y1="240" x2="450" y2="180" stroke="#5a6573" stroke-width="2" marker-end="url(#arr7)"/>

<rect x="450" y="130" width="180" height="60" fill="#fff5d6" stroke="#b8860b" stroke-width="2" rx="4"/>
<text x="540" y="150" text-anchor="middle" font-weight="700" fill="#7a5a08">Regex number check</text>
<text x="540" y="168" text-anchor="middle" font-size="10">extract numbers from LLM,</text>
<text x="540" y="182" text-anchor="middle" font-size="10">set-compare with XBRL</text>

<!-- two outputs from check -->
<line x1="630" y1="145" x2="680" y2="115" stroke="#1f6f3a" stroke-width="2" marker-end="url(#arr8)"/>
<line x1="630" y1="175" x2="680" y2="205" stroke="#b2351e" stroke-width="2" marker-end="url(#arr9)"/>

<rect x="680" y="80" width="70" height="60" fill="#79c08f" stroke="#1f6f3a" rx="4"/>
<text x="715" y="100" text-anchor="middle" font-weight="700" fill="#fff">match</text>
<text x="715" y="118" text-anchor="middle" font-size="10" fill="#fff">deliver</text>

<rect x="680" y="180" width="70" height="60" fill="#e98572" stroke="#b2351e" rx="4"/>
<text x="715" y="200" text-anchor="middle" font-weight="700" fill="#fff">mismatch</text>
<text x="715" y="218" text-anchor="middle" font-size="10" fill="#fff">block + alert</text>

<defs>
<marker id="arr7" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a6573"/></marker>
<marker id="arr8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f6f3a"/></marker>
<marker id="arr9" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b2351e"/></marker>
</defs>
</g>
</svg>