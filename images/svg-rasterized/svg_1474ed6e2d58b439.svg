<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 300" role="img" aria-label="Three-panel summary of what agents need from a model: tool-call reliability (with reasoning depth), long-trace coherence (with context window and code specialty), and how agent workloads differ from chat" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<text x="360" y="22" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">What agents need from a model (and why it differs from chat)</text>

<g transform="translate(40,55)">
<rect width="200" height="220" rx="8" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="100" y="22" font-size="11" font-weight="600" fill="#3a73a8" text-anchor="middle">Tool-call reliability</text>
<text x="100" y="38" font-size="9" font-style="italic" fill="#718096" text-anchor="middle">errors compound: 99%^10 = 90%</text>
<rect x="20" y="55" width="160" height="14" rx="2" fill="#fff" stroke="#3a73a8"/>
<rect x="20" y="55" width="152" height="14" rx="2" fill="#3a73a8"/>
<text x="100" y="65" font-size="9" fill="#fff" text-anchor="middle">Claude 4.5</text>
<rect x="20" y="74" width="160" height="14" rx="2" fill="#fff" stroke="#3a73a8"/>
<rect x="20" y="74" width="140" height="14" rx="2" fill="#3a73a8"/>
<text x="100" y="84" font-size="9" fill="#fff" text-anchor="middle">GPT-5</text>
<rect x="20" y="93" width="160" height="14" rx="2" fill="#fff" stroke="#3a73a8"/>
<rect x="20" y="93" width="128" height="14" rx="2" fill="#3a73a8"/>
<text x="100" y="103" font-size="9" fill="#fff" text-anchor="middle">Gemini 2.5 Pro</text>
<rect x="20" y="112" width="160" height="14" rx="2" fill="#fff" stroke="#3a73a8"/>
<rect x="20" y="112" width="110" height="14" rx="2" fill="#3a73a8"/>
<text x="80" y="122" font-size="9" fill="#fff" text-anchor="middle">Llama-4 70B</text>
<text x="100" y="160" font-size="11" font-weight="600" fill="#3a73a8" text-anchor="middle">Reasoning depth</text>
<text x="100" y="178" font-size="10" fill="#2d3748" text-anchor="middle">GPT-5 / o-series</text>
<text x="100" y="195" font-size="10" fill="#2d3748" text-anchor="middle">+ Claude (thinking)</text>
</g>

<g transform="translate(260,55)">
<rect width="200" height="220" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="100" y="22" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">Long-trace coherence</text>
<text x="100" y="38" font-size="9" font-style="italic" fill="#718096" text-anchor="middle">stays on plan over 50+ steps</text>
<text x="100" y="65" font-size="10" font-weight="600" fill="#d97706" text-anchor="middle">Best: Claude Opus 4.5</text>
<text x="100" y="82" font-size="9" fill="#4a5568" text-anchor="middle">heavy RL on agentic traces</text>
<text x="100" y="115" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">Context window</text>
<text x="100" y="132" font-size="10" font-weight="600" fill="#d97706" text-anchor="middle">Best: Gemini 2.5 Pro</text>
<text x="100" y="149" font-size="9" fill="#4a5568" text-anchor="middle">2M tokens, hold whole repo</text>
<text x="100" y="180" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">Code specialty</text>
<text x="100" y="197" font-size="10" font-weight="600" fill="#d97706" text-anchor="middle">Best: Qwen3-Coder</text>
<text x="100" y="210" font-size="9" fill="#4a5568" text-anchor="middle">open-weights, self-host</text>
</g>

<g transform="translate(480,55)">
<rect width="200" height="220" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="100" y="22" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Why agents differ from chat</text>
<text x="20" y="50" font-size="10" fill="#2d3748">- Multi-step: error compounding</text>
<text x="20" y="68" font-size="10" fill="#2d3748">- Tools: structured outputs</text>
<text x="20" y="86" font-size="10" fill="#2d3748">- Recovery: retry on tool failure</text>
<text x="20" y="104" font-size="10" fill="#2d3748">- Memory: long context use</text>
<text x="20" y="122" font-size="10" fill="#2d3748">- Multimodal: screenshots</text>
<text x="20" y="140" font-size="10" fill="#2d3748">- Safety: bounded autonomy</text>
<text x="20" y="170" font-size="10" font-weight="600" fill="#b91c1c">A chat-leaderboard winner</text>
<text x="20" y="184" font-size="10" font-weight="600" fill="#b91c1c">may flunk SWE-bench</text>
<text x="20" y="198" font-size="9" fill="#4a5568">because none of the above</text>
<text x="20" y="210" font-size="9" fill="#4a5568">show up in MMLU.</text>
</g>
</svg>