<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-20 -240 740 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figA3title" style="max-width:740px;width:100%;height:auto;background:#fafafa;border-radius:8px;" aria-label="η (learning rate) controls step size:">
<title id="figA3title">Gradient descent walking down a loss surface</title>
<text x="360" y="24" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Gradient descent: w<tspan baseline-shift="sub" font-size="11">new</tspan> = w<tspan baseline-shift="sub" font-size="11">old</tspan> − η · ∇L</text>
<g transform="translate(40,300)">
<line x1="0" y1="0" x2="640" y2="0" stroke="#aaa" stroke-width="1"/>
<line x1="0" y1="0" x2="0" y2="-240" stroke="#aaa" stroke-width="1"/>
<text x="-15" y="-235" font-family="Georgia, serif" font-size="12" fill="#666">Loss L(w)</text>
<text x="630" y="20" font-family="Georgia, serif" font-size="12" fill="#666">weight w</text>
<path d="M 20 -20 Q 100 -260 220 -180 T 380 -50 T 600 -90" stroke="#1f77b4" stroke-width="3" fill="none"/>
<circle cx="60" cy="-180" r="7" fill="#d62728" stroke="#222" stroke-width="1.5"/>
<text x="60" y="-200" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#222">step 1</text>
<line x1="60" y1="-180" x2="115" y2="-220" stroke="#222" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="40" y="-220" font-family="Georgia, serif" font-size="10" fill="#555" font-style="italic">slope = ∇L</text>
<circle cx="135" cy="-220" r="6" fill="#ff7f0e" stroke="#222" stroke-width="1.2"/>
<circle cx="215" cy="-187" r="6" fill="#ff7f0e" stroke="#222" stroke-width="1.2"/>
<circle cx="290" cy="-126" r="6" fill="#ff7f0e" stroke="#222" stroke-width="1.2"/>
<circle cx="345" cy="-78" r="6" fill="#ff7f0e" stroke="#222" stroke-width="1.2"/>
<circle cx="380" cy="-50" r="8" fill="#2ca02c" stroke="#222" stroke-width="1.5"/>
<text x="380" y="-25" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#2ca02c" font-weight="bold">minimum</text>
<path d="M 60 -180 Q 95 -215 135 -220" stroke="#222" stroke-width="1.2" fill="none" stroke-dasharray="4 2"/>
<path d="M 135 -220 Q 175 -208 215 -187" stroke="#222" stroke-width="1.2" fill="none" stroke-dasharray="4 2"/>
<path d="M 215 -187 Q 250 -160 290 -126" stroke="#222" stroke-width="1.2" fill="none" stroke-dasharray="4 2"/>
<path d="M 290 -126 Q 315 -100 345 -78" stroke="#222" stroke-width="1.2" fill="none" stroke-dasharray="4 2"/>
<path d="M 345 -78 Q 360 -62 380 -50" stroke="#222" stroke-width="1.2" fill="none" stroke-dasharray="4 2"/>
</g>
<g transform="translate(490,80)">
<text x="0" y="0" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#222">η (learning rate) controls step size:</text>
<text x="0" y="20" font-family="Georgia, serif" font-size="11" fill="#444">• η too small → slow convergence</text>
<text x="0" y="36" font-family="Georgia, serif" font-size="11" fill="#444">• η too large → divergence</text>
<text x="0" y="52" font-family="Georgia, serif" font-size="11" fill="#444">• typical Adam η = 3e-4</text>
</g>
</svg>