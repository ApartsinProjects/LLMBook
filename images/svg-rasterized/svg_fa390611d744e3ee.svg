<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Reflection loop for self-refinement: GENERATE produces an initial draft, CRITIQUE identifies specific flaws, REVISE fixes them; the loop repeats until a quality threshold is met before emitting the final output." font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
<!-- Generate -->
<rect fill="url(#grad_57e87c_e8f4fd)" filter="url(#shadow_57e87c)" height="55" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="170" x="30" y="60"></rect>
<text fill="#3498db" font-size="12" font-weight="700" text-anchor="middle" x="115" y="83">GENERATE</text>
<text fill="#555" font-size="11" text-anchor="middle" x="115" y="100">Produce initial draft</text>
<!-- Arrow 1 -->
<line marker-end="url(#arrowRef)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="200" x2="265" y1="87" y2="87"></line>
<text fill="#888" font-size="11" text-anchor="middle" x="233" y="80">draft</text>
<!-- Critique -->
<rect fill="url(#grad_57e87c_fef9e7)" height="55" rx="10" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="170" x="270" y="60"></rect>
<text fill="#f39c12" font-size="12" font-weight="700" text-anchor="middle" x="355" y="83">CRITIQUE</text>
<text fill="#555" font-size="11" text-anchor="middle" x="355" y="100">Identify specific flaws</text>
<!-- Arrow 2 -->
<line marker-end="url(#arrowRef)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="440" x2="505" y1="87" y2="87"></line>
<text fill="#888" font-size="11" text-anchor="middle" x="473" y="80">feedback</text>
<!-- Revise -->
<rect fill="#e8f5e9" height="55" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="170" x="510" y="60"></rect>
<text fill="#27ae60" font-size="12" font-weight="700" text-anchor="middle" x="595" y="83">REVISE</text>
<text fill="#555" font-size="11" text-anchor="middle" x="595" y="100">Fix all flagged issues</text>
<!-- Loop-back arrow -->
<path d="M 595 115 Q 595 175 355 175 Q 115 175 115 130" fill="none" marker-end="url(#arrowP)" stroke="#8e44ad" stroke-dasharray="6" stroke-linecap="round" stroke-width="2"></path>
<text fill="#8e44ad" font-size="11" font-weight="600" text-anchor="middle" x="355" y="168">repeat until quality threshold met</text>
<!-- Output arrow -->
<line marker-end="url(#arrowGr)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="595" x2="595" y1="115" y2="215"></line>
<rect fill="#27ae60" height="32" rx="8" width="150" x="520" y="215"></rect>
<text fill="white" font-size="11" font-weight="700" text-anchor="middle" x="595" y="236">Final Output</text>
<defs>
<lineargradient id="grad_57e87c_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<lineargradient id="grad_57e87c_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<filter height="115%" id="shadow_57e87c" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowRef" markerheight="6" markerwidth="6" orient="auto" refx="5" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888"></path></marker>
<marker id="arrowP" markerheight="6" markerwidth="6" orient="auto" refx="5" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8e44ad"></path></marker>
<marker id="arrowGr" markerheight="6" markerwidth="6" orient="auto" refx="5" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"></path></marker>
</defs>
</svg>