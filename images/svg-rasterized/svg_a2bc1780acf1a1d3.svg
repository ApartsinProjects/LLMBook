<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Frontier benchmark saturation timeline 2024 to 2028" viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="380" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Frontier benchmarks: discrimination shelf life by domain (2024 to 2028)</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Once a benchmark saturates at frontier expert level, it stops discriminating new models</text>
<!-- Axes -->
<line x1="100" y1="320" x2="820" y2="320" stroke="#1a1a2e" stroke-width="1.5"/>
<line x1="100" y1="80" x2="100" y2="320" stroke="#1a1a2e" stroke-width="1.5"/>
<text x="440" y="345" font-size="11" text-anchor="middle" fill="#1a1a2e">expected saturation year (top frontier model crosses 90%)</text>
<text x="55" y="200" font-size="11" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90,55,200)">current frontier score (2026)</text>
<!-- x ticks -->
<text x="180" y="335" font-size="9" text-anchor="middle" fill="#5a4a3a">2024</text>
<text x="320" y="335" font-size="9" text-anchor="middle" fill="#5a4a3a">2025</text>
<text x="460" y="335" font-size="9" text-anchor="middle" fill="#5a4a3a">2026</text>
<text x="600" y="335" font-size="9" text-anchor="middle" fill="#5a4a3a">2027</text>
<text x="740" y="335" font-size="9" text-anchor="middle" fill="#5a4a3a">2028+</text>
<!-- y ticks -->
<text x="88" y="100" font-size="9" text-anchor="end" fill="#5a4a3a">100%</text>
<text x="88" y="160" font-size="9" text-anchor="end" fill="#5a4a3a">75%</text>
<text x="88" y="220" font-size="9" text-anchor="end" fill="#5a4a3a">50%</text>
<text x="88" y="280" font-size="9" text-anchor="end" fill="#5a4a3a">25%</text>
<!-- 90% line -->
<line x1="100" y1="124" x2="820" y2="124" stroke="#7a2a4a" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="820" y="120" font-size="9" text-anchor="end" fill="#7a2a4a">saturation = 90%</text>
<!-- Bubbles for benchmarks -->
<g font-size="10">
<circle cx="240" cy="115" r="28" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="240" y="113" font-weight="700" text-anchor="middle" fill="#1f7a3a">MMLU</text>
<text x="240" y="125" font-size="8" text-anchor="middle" fill="#5a4a3a">~92%</text>
<text x="240" y="148" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">saturated 2024</text>
<circle cx="320" cy="125" r="28" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="320" y="123" font-weight="700" text-anchor="middle" fill="#1f7a3a">GSM8K</text>
<text x="320" y="135" font-size="8" text-anchor="middle" fill="#5a4a3a">~95%</text>
<text x="320" y="158" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">saturated</text>
<circle cx="460" cy="155" r="30" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="460" y="153" font-weight="700" text-anchor="middle" fill="#a67c1a">AIME '24</text>
<text x="460" y="165" font-size="8" text-anchor="middle" fill="#5a4a3a">~85%</text>
<circle cx="490" cy="170" r="32" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="490" y="168" font-weight="700" text-anchor="middle" fill="#a67c1a">GPQA-D</text>
<text x="490" y="180" font-size="8" text-anchor="middle" fill="#5a4a3a">~75%</text>
<circle cx="550" cy="190" r="36" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="550" y="188" font-weight="700" text-anchor="middle" fill="#3d4d8a">SWE-bench</text>
<text x="550" y="200" font-size="8" text-anchor="middle" fill="#5a4a3a">~70%</text>
<circle cx="600" cy="225" r="34" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="600" y="223" font-weight="700" text-anchor="middle" fill="#3d4d8a">ARC-AGI-2</text>
<text x="600" y="235" font-size="8" text-anchor="middle" fill="#5a4a3a">~60%</text>
<circle cx="640" cy="240" r="32" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="640" y="238" font-weight="700" text-anchor="middle" fill="#3d4d8a">HLE</text>
<text x="640" y="250" font-size="8" text-anchor="middle" fill="#5a4a3a">~45%</text>
<circle cx="750" cy="290" r="38" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="2"/>
<text x="750" y="288" font-weight="700" text-anchor="middle" fill="#7a2a2a">FrontierMath</text>
<text x="750" y="300" font-size="8" text-anchor="middle" fill="#5a4a3a">~29%</text>
<text x="750" y="320" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">5+ year shelf</text>
</g>
</svg>