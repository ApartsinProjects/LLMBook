<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The dot product as projection." viewBox="-35 -185 755 505" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figA1title" style="max-width:755px;width:100%;height:auto;background:#fafafa;border-radius:8px;">
<title id="figA1title">Dot product as projection: the operation behind attention</title>
<defs>
<marker id="arrA1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 z" fill="#222"/>
</marker>
<marker id="arrA1blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/>
</marker>
<marker id="arrA1red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 z" fill="#d62728"/>
</marker>
</defs>
<text x="360" y="24" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Dot product: similarity via projection</text>
<g transform="translate(40,260)">
<line x1="0" y1="0" x2="280" y2="0" stroke="#aaa" stroke-width="1"/>
<line x1="0" y1="0" x2="0" y2="-220" stroke="#aaa" stroke-width="1"/>
<line x1="0" y1="0" x2="240" y2="-60" stroke="#1f77b4" stroke-width="3" marker-end="url(#arrA1blue)"/>
<text x="245" y="-55" font-family="Georgia, serif" font-size="14" fill="#1f77b4" font-weight="bold">q (query)</text>
<line x1="0" y1="0" x2="180" y2="-170" stroke="#d62728" stroke-width="3" marker-end="url(#arrA1red)"/>
<text x="180" y="-180" font-family="Georgia, serif" font-size="14" fill="#d62728" font-weight="bold">k (key)</text>
<line x1="180" y1="-170" x2="220" y2="-55" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
<text x="195" y="-100" font-family="Georgia, serif" font-size="12" fill="#666" font-style="italic">θ</text>
<path d="M 35 0 A 35 35 0 0 0 32 -14" stroke="#666" stroke-width="1" fill="none"/>
<text x="40" y="-20" font-family="Georgia, serif" font-size="11" fill="#666">θ</text>
<text x="-30" y="20" font-family="Georgia, serif" font-size="12" fill="#666">origin</text>
</g>
<g transform="translate(420,80)">
<text x="0" y="0" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#222">q · k = ||q|| ||k|| cos θ</text>
<text x="0" y="36" font-family="Georgia, serif" font-size="12" fill="#444">Small θ → large dot product</text>
<text x="0" y="56" font-family="Georgia, serif" font-size="12" fill="#444">→ q "attends to" k</text>
<text x="0" y="92" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#222">Attention score:</text>
<text x="0" y="112" font-family="Georgia, serif" font-size="12" fill="#444">score(Q, K) = Q · K<tspan baseline-shift="super" font-size="9">T</tspan> / √d<tspan baseline-shift="sub" font-size="9">k</tspan></text>
<text x="0" y="148" font-family="Georgia, serif" font-size="12" fill="#666" font-style="italic">A 768-dim embedding lives</text>
<text x="0" y="164" font-family="Georgia, serif" font-size="12" fill="#666" font-style="italic">in this same geometry, just</text>
<text x="0" y="180" font-family="Georgia, serif" font-size="12" fill="#666" font-style="italic">with 768 axes instead of 2.</text>
</g>
</svg>