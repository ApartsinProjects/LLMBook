<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Rate-limit tier comparison: a grouped bar chart with four providers (OpenAI, Anthropic, Google, xAI) along the x-axis and bars showing tokens-per-minute (in millions) and requests-per-minute (scaled) for the standard paid tier. OpenAI Tier 4 leads on TPM at around 5 million; Anthropic and Google trail near 2 million; xAI sits between." role="img" viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg">
<style>.bar{stroke:#333;stroke-width:1}.tpm{fill:#2980b9}.rpm{fill:#27ae60}.label{font-family:Segoe UI,system-ui,sans-serif;font-size:0.6875rem;fill:#222}.title{font-family:Segoe UI,system-ui,sans-serif;font-size:0.8125rem;font-weight:bold;fill:#111}.axis{stroke:#666;stroke-width:1}</style>
<text class="title" text-anchor="middle" x="300" y="22">Frontier provider rate-limit tiers (paid, mid-2026)</text>
<line class="axis" x1="60" x2="60" y1="50" y2="230"></line>
<line class="axis" x1="60" x2="560" y1="230" y2="230"></line>
<text class="label" text-anchor="end" x="55" y="60">5M</text>
<text class="label" text-anchor="end" x="55" y="105">3M</text>
<text class="label" text-anchor="end" x="55" y="150">2M</text>
<text class="label" text-anchor="end" x="55" y="195">1M</text>
<text class="label" text-anchor="end" x="55" y="232">0</text>
<text class="label" text-anchor="end" x="55" y="42">TPM</text>
<rect class="bar tpm" height="180" width="35" x="100" y="50"></rect>
<rect class="bar rpm" height="45" width="35" x="135" y="185"></rect>
<text class="label" text-anchor="middle" x="135" y="248">OpenAI</text>
<rect class="bar tpm" height="135" width="35" x="220" y="95"></rect>
<rect class="bar rpm" height="60" width="35" x="255" y="170"></rect>
<text class="label" text-anchor="middle" x="255" y="248">Anthropic</text>
<rect class="bar tpm" height="120" width="35" x="340" y="110"></rect>
<rect class="bar rpm" height="105" width="35" x="375" y="125"></rect>
<text class="label" text-anchor="middle" x="375" y="248">Google</text>
<rect class="bar tpm" height="105" width="35" x="460" y="125"></rect>
<rect class="bar rpm" height="38" width="35" x="495" y="192"></rect>
<text class="label" text-anchor="middle" x="495" y="248">xAI</text>
<rect class="tpm" height="10" width="14" x="430" y="42"></rect>
<text class="label" x="448" y="51">TPM (millions)</text>
<rect class="rpm" height="10" width="14" x="430" y="56"></rect>
<text class="label" x="448" y="65">RPM (hundreds)</text>
</svg>