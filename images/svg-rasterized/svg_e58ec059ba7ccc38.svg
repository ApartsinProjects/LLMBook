<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="EnCodec: convolutional encoder + RVQ + decoder + discriminator" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 880 320" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="320" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">EnCodec: convolutional encoder + RVQ + decoder + discriminator</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="440" y="40">Multi-loss training pulls every part of the pipeline at once</text>
<g font-size="10">
<rect fill="#bbdefb" height="60" rx="8" stroke="#1976d2" stroke-width="1.5" width="100" x="20" y="100"></rect>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="70" y="125">Waveform x</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="70" y="142">24 kHz, 1s</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="70" y="156">16,000 samples</text>
<line marker-end="url(#encArr)" stroke="#666" stroke-width="2" x1="120" x2="148" y1="130" y2="130"></line>
<rect fill="#c8e6c9" height="60" rx="8" stroke="#2e7d32" stroke-width="1.5" width="110" x="148" y="100"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="203" y="122">Conv encoder</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="203" y="138">320x downsample</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="203" y="152">+ LSTM bottleneck</text>
<line marker-end="url(#encArr)" stroke="#666" stroke-width="2" x1="258" x2="286" y1="130" y2="130"></line>
<rect fill="#ffe0b2" height="60" rx="8" stroke="#ef6c00" stroke-width="1.5" width="110" x="286" y="100"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="341" y="122">RVQ stack</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="341" y="138">K=8 codebooks</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="341" y="152">1024 entries each</text>
<line marker-end="url(#encArr)" stroke="#666" stroke-width="2" x1="396" x2="424" y1="130" y2="130"></line>
<rect fill="#c8e6c9" height="60" rx="8" stroke="#2e7d32" stroke-width="1.5" width="110" x="424" y="100"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="479" y="122">Conv decoder</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="479" y="138">transposed conv</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="479" y="152">320x upsample</text>
<line marker-end="url(#encArr)" stroke="#666" stroke-width="2" x1="534" x2="562" y1="130" y2="130"></line>
<rect fill="#bbdefb" height="60" rx="8" stroke="#1976d2" stroke-width="1.5" width="100" x="562" y="100"></rect>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="612" y="122">Waveform x̂</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="612" y="140">reconstruction</text>
<rect fill="#ffccbc" height="40" rx="8" stroke="#d84315" stroke-width="1.5" width="160" x="700" y="80"></rect>
<text fill="#bf360c" font-weight="700" text-anchor="middle" x="780" y="105">Multi-scale</text>
<text fill="#d84315" font-size="9" text-anchor="middle" x="780" y="116">+ multi-period discriminator</text>
<rect fill="#fff3e0" height="36" rx="6" stroke="#bf360c" stroke-width="1.2" width="600" x="40" y="200"></rect>
<line marker-end="url(#encArr)" stroke="#666" stroke-width="1.5" x1="612" x2="612" y1="160" y2="200"></line>
<line marker-end="url(#encArr)" stroke="#666" stroke-width="1.5" x1="70" x2="70" y1="160" y2="200"></line>
<text fill="#666" font-size="10" text-anchor="middle" x="340" y="215">compare x vs x̂</text>
<text fill="#bf360c" font-size="9.5" text-anchor="middle" x="340" y="235">l_w (time L1) + l_t (multi-scale STFT) + l_g (adversarial) + l_feat (feature matching)</text>
<text fill="#bf360c" font-size="9.5" text-anchor="middle" x="340" y="250">+ l_commit (RVQ codebook loss, EMA-updated entries)</text>
</g>
<defs>
<marker id="encArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
</defs>
</svg>