<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: How ColPali Processes a Page" role="img" viewBox="0 0 750 380" xmlns="http://www.w3.org/2000/svg">
<rect fill="url(#grad_36a3e8_f8f9fa)" filter="url(#shadow_36a3e8)" height="370" rx="10" stroke="#ddd" stroke-linecap="round" width="740" x="5" y="5"></rect>
<!-- Document Image side -->
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="160.0" x2="160.0" y1="57.0" y2="86.0"></line>
<text fill="#1565c0" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="160" y="55">Document Page (Image)</text>
<rect fill="url(#grad_36a3e8_fff)" height="120" rx="4" stroke="#1976d2" stroke-linecap="round" stroke-width="1.5" width="160" x="80" y="65"></rect>
<!-- Simulate page content -->
<rect fill="#ccc" height="8" rx="2" width="60" x="90" y="75"></rect>
<rect fill="#ddd" height="5" rx="1" width="140" x="90" y="88"></rect>
<rect fill="#ddd" height="5" rx="1" width="130" x="90" y="97"></rect>
<rect fill="#ddd" height="5" rx="1" width="140" x="90" y="106"></rect>
<rect fill="url(#grad_36a3e8_e3f2fd)" height="50" rx="3" stroke="#90caf9" stroke-linecap="round" width="60" x="90" y="120"></rect>
<text fill="#1976d2" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="120" y="148">Chart</text>
<rect fill="url(#grad_36a3e8_f5f5f5)" height="50" rx="3" stroke="#bbb" stroke-linecap="round" width="70" x="160" y="120"></rect>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="195" y="148">Table</text>
<!-- Arrow to ViT -->
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="14" text-anchor="middle" x="160" y="200">↓</text>
<!-- ViT box -->
<rect fill="url(#grad_36a3e8_e3f2fd)" height="40" rx="6" stroke="#1976d2" stroke-linecap="round" width="140" x="90" y="210"></rect>
<text fill="#1565c0" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="160" y="235">Vision Transformer</text>
<!-- Arrow to patch embeddings -->
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="14" text-anchor="middle" x="160" y="265">↓</text>
<!-- Patch embeddings -->
<rect fill="#e8f5e9" height="35" rx="4" stroke="#388e3c" stroke-linecap="round" width="200" x="60" y="275"></rect>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="160" y="297">1,024 Patch Embeddings (128-d each)</text>
<!-- Query side -->
<text fill="#c62828" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="560" y="55">Text Query</text>
<rect fill="url(#grad_36a3e8_fff)" height="35" rx="6" stroke="#c62828" stroke-linecap="round" stroke-width="1.5" width="180" x="470" y="65"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="560" y="87">"Q3 revenue by region"</text>
<!-- Arrow to tokenizer -->
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="14" text-anchor="middle" x="560" y="115">↓</text>
<!-- Tokenizer -->
<rect fill="url(#grad_36a3e8_fce4ec)" height="40" rx="6" stroke="#c62828" stroke-linecap="round" width="140" x="490" y="125"></rect>
<text fill="#c62828" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="560" y="150">Tokenize + Project</text>
<!-- Arrow to query embeddings -->
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="14" text-anchor="middle" x="560" y="180">↓</text>
<!-- Query embeddings -->
<rect fill="url(#grad_36a3e8_fff3e0)" height="35" rx="4" stroke="#e65100" stroke-linecap="round" width="170" x="475" y="190"></rect>
<text fill="#e65100" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="560" y="212">5 Token Embeddings (128-d each)</text>
<!-- MaxSim box in center -->
<rect fill="url(#grad_36a3e8_f3e5f5)" height="50" rx="8" stroke="#7b1fa2" stroke-linecap="round" stroke-width="2" width="160" x="290" y="270"></rect>
<text fill="#6a1b9a" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="370" y="293">MaxSim Scoring</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="370" y="310">For each query token, find</text>
<!-- Arrows into MaxSim -->
<path d="M260 292 L290 295" fill="none" marker-end="url(#colArrow)" stroke="#388e3c" stroke-linecap="round" stroke-width="1.5"></path>
<path d="M560 225 L560 280 L450 290" fill="none" marker-end="url(#colArrow)" stroke="#e65100" stroke-linecap="round" stroke-width="1.5"></path>
<!-- Result -->
<text fill="#7b1fa2" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="370" y="345">Score = sum of max similarities</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="370" y="360">Each query token matches its best patch</text>
<defs>
<lineargradient id="grad_36a3e8_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#e3f2fd"></stop></lineargradient>
<lineargradient id="grad_36a3e8_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#f3e5f5"></stop></lineargradient>
<lineargradient id="grad_36a3e8_f8f9fa" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f8f9fa"></stop></lineargradient>
<lineargradient id="grad_36a3e8_fff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#fff"></stop></lineargradient>
<lineargradient id="grad_36a3e8_f5f5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f5f5f5"></stop></lineargradient>
<lineargradient id="grad_36a3e8_fce4ec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3fb"></stop><stop offset="100%" stop-color="#fce4ec"></stop></lineargradient>
<lineargradient id="grad_36a3e8_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<filter height="115%" id="shadow_36a3e8" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="colArrow" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#999"></path>
</marker>
</defs>
</svg>