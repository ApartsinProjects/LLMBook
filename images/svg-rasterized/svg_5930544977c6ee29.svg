<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Bipartite audio task taxonomy with understand and generate columns" viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="360" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Audio AI splits into two halves: understand and generate</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Same transformer backbones, different heads at the output</text>
<g font-size="11">
<g transform="translate(30,60)">
<rect width="400" height="280" rx="10" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="200" y="26" font-weight="700" text-anchor="middle" fill="#3d4d8a">UNDERSTAND</text>
<text x="200" y="42" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">audio in, label or text out</text>
<text x="20" y="72" font-weight="700" fill="#1a1a2e">Audio classification</text>
<text x="30" y="88" fill="#333">content (music vs speech vs noise)</text>
<text x="30" y="104" fill="#333">events (alarm, dog bark, glass)</text>
<text x="30" y="120" fill="#333">speech intent (pay_bill, transfer)</text>
<text x="30" y="136" fill="#333">keyword spotting ("OK Google")</text>
<text x="20" y="162" font-weight="700" fill="#1a1a2e">Speech recognition</text>
<text x="30" y="178" fill="#333">ASR (waveform &#8594; transcript)</text>
<text x="30" y="194" fill="#333">speaker identification</text>
<text x="30" y="210" fill="#333">language identification</text>
<text x="20" y="234" font-weight="700" fill="#27ae60">Backbones: AST, wav2vec 2.0,</text>
<text x="20" y="250" font-weight="700" fill="#27ae60">HuBERT, WavLM, BEATs, CLAP</text>
<text x="20" y="266" font-weight="700" fill="#27ae60">Whisper encoder</text>
</g>
<g transform="translate(450,60)">
<rect width="400" height="280" rx="10" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="200" y="26" font-weight="700" text-anchor="middle" fill="#a67c1a">GENERATE</text>
<text x="200" y="42" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">text or audio in, waveform out</text>
<text x="20" y="72" font-weight="700" fill="#1a1a2e">Speech generation</text>
<text x="30" y="88" fill="#333">text-to-speech (VITS, Bark, F5)</text>
<text x="30" y="104" fill="#333">zero-shot voice cloning</text>
<text x="30" y="120" fill="#333">voice conversion</text>
<text x="20" y="146" font-weight="700" fill="#1a1a2e">Music generation</text>
<text x="30" y="162" fill="#333">text-to-music (MusicGen, MusicLM)</text>
<text x="30" y="178" fill="#333">consumer products (Suno, Udio)</text>
<text x="30" y="194" fill="#333">songs from lyrics (Bark)</text>
<text x="20" y="218" font-weight="700" fill="#1a1a2e">Sound and event generation</text>
<text x="30" y="234" fill="#333">text-to-audio (AudioLDM, TANGO)</text>
<text x="30" y="250" fill="#333">Foley, soundscapes</text>
<text x="20" y="278" font-weight="700" fill="#27ae60">Tokenizers: EnCodec, SoundStream, Mimi, DAC</text>
</g>
</g>
</svg>