<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The 2026 cybersecurity-LLM market sized at ~$2.5-4B ARR across four sub-segments, with Microsoft Security Copilot and CrowdStrike Charlotte dominating the SIEM/XDR copilot tier." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" style="max-width:880px;background:#fafafa;border:1px solid #ddd;font-family:sans-serif;">
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle">2026 security-LLM vendor landscape and market sizing (~$2.5-4B ARR)</text>
<rect x="40" y="60" width="380" height="120" fill="#fff" stroke="#2980b9" stroke-width="2"/>
<text x="230" y="80" font-size="12" font-weight="700" fill="#1f618d" text-anchor="middle">SIEM / XDR copilots ($1-1.5B ARR)</text>
<text x="50" y="100" font-size="10">Microsoft Security Copilot (Defender XDR + Sentinel)</text>
<text x="50" y="116" font-size="10">CrowdStrike Charlotte AI (Falcon EDR)</text>
<text x="50" y="132" font-size="10">Palo Alto XSIAM-AI</text>
<text x="50" y="148" font-size="10">SentinelOne Purple AI</text>
<text x="50" y="168" font-size="10" fill="#7f8c8d">$4-8/SCU at MS tier, $50K-$500K/yr at SaaS vendors</text>
<rect x="440" y="60" width="400" height="120" fill="#fff" stroke="#27ae60" stroke-width="2"/>
<text x="640" y="80" font-size="12" font-weight="700" fill="#117a65" text-anchor="middle">SOAR with LLM ($400-700M ARR)</text>
<text x="450" y="100" font-size="10">Tines (workflow-language ergonomics)</text>
<text x="450" y="116" font-size="10">Torq, Tracecat, Hunters</text>
<text x="450" y="132" font-size="10">Palo Alto Cortex XSOAR, Splunk SOAR</text>
<text x="450" y="148" font-size="10">LLM-augmented detection authoring + case mgmt</text>
<rect x="40" y="200" width="260" height="160" fill="#fff" stroke="#f39c12" stroke-width="2"/>
<text x="170" y="220" font-size="12" font-weight="700" fill="#9a6816" text-anchor="middle">Vulnerability mgmt ($200-400M ARR)</text>
<text x="50" y="240" font-size="10">Wiz (cloud security, $0 -&gt; $100M in 18mo)</text>
<text x="50" y="256" font-size="10">Snyk (DeepCode AI, code SAST)</text>
<text x="50" y="272" font-size="10">Tenable</text>
<text x="50" y="288" font-size="10">Qualys</text>
<text x="50" y="304" font-size="10">Rapid7</text>
<text x="50" y="328" font-size="10" fill="#9a6816">LLM-augmented prioritization,</text>
<text x="50" y="344" font-size="10" fill="#9a6816">CVE-to-asset mapping</text>
