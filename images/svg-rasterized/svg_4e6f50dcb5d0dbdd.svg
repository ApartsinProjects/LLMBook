<text x="450" y="220" font-size="12" font-weight="700" fill="#6c3483" text-anchor="middle">Threat intel + email ($300-500M ARR)</text>
<text x="330" y="240" font-size="10">Recorded Future AI</text>
<text x="330" y="256" font-size="10">Mandiant Intelligence Console</text>
<text x="330" y="272" font-size="10">Anomali ThreatStream</text>
<text x="330" y="288" font-size="10" font-style="italic">Email security:</text>
<text x="330" y="304" font-size="10">Abnormal Security, Proofpoint, Mimecast</text>
<text x="330" y="328" font-size="10" fill="#6c3483">BEC detection,</text>
<text x="330" y="344" font-size="10" fill="#6c3483">intent classification</text>
<rect x="600" y="200" width="240" height="160" fill="#d4efdf" stroke="#1e8449" stroke-width="2"/>
<text x="720" y="222" font-size="12" font-weight="700" fill="#0e6655" text-anchor="middle">Economic backdrop</text>
<text x="610" y="246" font-size="10">Total market: $2.5-4B ARR (2025)</text>
<text x="610" y="262" font-size="10">YoY growth: 75-110%</text>
<text x="610" y="282" font-size="10" font-weight="700">ISC2 2024 workforce gap:</text>
<text x="610" y="298" font-size="10">4M unfilled cyber roles globally</text>
<text x="610" y="320" font-size="10">30-40% productivity gain on</text>
<text x="610" y="334" font-size="10">6M-strong workforce ~=</text>
<text x="610" y="350" font-size="10" font-weight="700" fill="#0e6655">~2M FTE-equivalent recovered</text>
