<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="RAG ingestion pipeline: raw docs (PDF, HTML, DOCX, CSV) into Parse (extract text plus metadata) into Chunk (split into segments) into Embed (dense vector per chunk) into a vector database (Chroma, Pinecone, Weaviate, Qdrant); metadata preserved at every stage." font-family="Segoe UI, system-ui, sans-serif" role="img" viewbox="0 -12 760 212" xmlns="http://www.w3.org/2000/svg">
<!-- Documents -->
<rect fill="url(#grad_0c3d62_e3f2fd)" filter="url(#shadow_0c3d62)" height="70" rx="8" stroke="#1565c0" stroke-linecap="round" stroke-width="1.5" width="100" x="20" y="60"></rect>
<text fill="#0d47a1" font-size="11" font-weight="bold" text-anchor="middle" x="70" y="85">Raw Docs</text>
<text fill="#555" font-size="11" text-anchor="middle" x="70" y="102">PDF, HTML,</text>
<text fill="#555" font-size="11" text-anchor="middle" x="70" y="114">DOCX, CSV</text>
<line marker-end="url(#arrowS)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="120" x2="155" y1="95" y2="95"></line>
<!-- Parser -->
<rect fill="url(#grad_0c3d62_fff8e1)" height="70" rx="8" stroke="#f9a825" stroke-linecap="round" stroke-width="1.5" width="100" x="160" y="60"></rect>
<text fill="#f57f17" font-size="11" font-weight="bold" text-anchor="middle" x="210" y="85">Parse</text>
<text fill="#555" font-size="11" text-anchor="middle" x="210" y="102">Extract text</text>
<text fill="#555" font-size="11" text-anchor="middle" x="210" y="114">+ metadata</text>
<line marker-end="url(#arrowS)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="260" x2="295" y1="95" y2="95"></line>
<!-- Chunker -->
<rect fill="#e8f5e9" height="70" rx="8" stroke="#2e7d32" stroke-linecap="round" stroke-width="1.5" width="100" x="300" y="60"></rect>
<text fill="#2e7d32" font-size="11" font-weight="bold" text-anchor="middle" x="350" y="85">Chunk</text>
<text fill="#555" font-size="11" text-anchor="middle" x="350" y="102">Split into</text>
<text fill="#555" font-size="11" text-anchor="middle" x="350" y="114">segments</text>
<line marker-end="url(#arrowS)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="400" x2="435" y1="95" y2="95"></line>
<!-- Embedder -->
<rect fill="url(#grad_0c3d62_fce4ec)" height="70" rx="8" stroke="#c62828" stroke-linecap="round" stroke-width="1.5" width="100" x="440" y="60"></rect>
<text fill="#c62828" font-size="11" font-weight="bold" text-anchor="middle" x="490" y="85">Embed</text>
<text fill="#555" font-size="11" text-anchor="middle" x="490" y="102">Dense vector</text>
<text fill="#555" font-size="11" text-anchor="middle" x="490" y="114">per chunk</text>
<line marker-end="url(#arrowS)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="540" x2="575" y1="95" y2="95"></line>
<!-- Vector Store -->
<rect fill="url(#grad_0c3d62_f3e5f5)" height="90" rx="10" stroke="#7b1fa2" stroke-linecap="round" stroke-width="2" width="140" x="580" y="50"></rect>
<text fill="#7b1fa2" font-size="12" font-weight="bold" text-anchor="middle" x="650" y="80">Vector</text>
<text fill="#7b1fa2" font-size="12" font-weight="bold" text-anchor="middle" x="650" y="96">Database</text>
<text fill="#555" font-size="11" text-anchor="middle" x="650" y="118">Chroma, Pinecone,</text>
<text fill="#555" font-size="11" text-anchor="middle" x="650" y="130">Weaviate, Qdrant</text>
<!-- Metadata flow -->
<text fill="#888" font-size="11" text-anchor="middle" x="380" y="165">Metadata (source, date, author) preserved at every stage</text>
<defs>
<lineargradient id="grad_0c3d62_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#e3f2fd"></stop></lineargradient>
<lineargradient id="grad_0c3d62_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#f3e5f5"></stop></lineargradient>
<lineargradient id="grad_0c3d62_fce4ec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3fb"></stop><stop offset="100%" stop-color="#fce4ec"></stop></lineargradient>
<lineargradient id="grad_0c3d62_fff8e1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff0"></stop><stop offset="100%" stop-color="#fff8e1"></stop></lineargradient>
<filter height="115%" id="shadow_0c3d62" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowS" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333"></path>
</marker>
</defs>
</svg>