<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;" aria-label="MoE inference: top-k router selects a small subset of experts per token">
<rect width="720" height="280" fill="#ffffff"/>
<text x="360" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">MoE inference: top-k router selects a small subset of experts per token</text>
<g transform="translate(40,46)">
<rect width="120" height="44" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
<text x="60" y="28" font-size="11" font-weight="600" text-anchor="middle" fill="#1565c0">token x</text>
</g>
<g transform="translate(200,46)">
<rect width="120" height="44" rx="6" fill="#fff3e0" stroke="#a67c1a"/>
<text x="60" y="22" font-size="11" font-weight="600" text-anchor="middle" fill="#a67c1a">router</text>
<text x="60" y="36" font-size="10" text-anchor="middle" fill="#a67c1a">softmax(W&#183;x), top-k</text>
</g>
<line x1="160" y1="68" x2="200" y2="68" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<defs><marker id="arr" markerwidth="8" markerheight="8" refx="7" refy="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#444"/></marker></defs>
<line x1="320" y1="68" x2="360" y2="68" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<g font-size="10" text-anchor="middle">
<rect x="360" y="20" width="80" height="32" rx="4" fill="#e8f5e9" stroke="#2e7d32"/><text x="400" y="40" fill="#1a1a2e">expert 1 (active)</text>
<rect x="360" y="60" width="80" height="32" rx="4" fill="#eeeeee" stroke="#9e9e9e"/><text x="400" y="80" fill="#666">expert 2</text>
<rect x="360" y="100" width="80" height="32" rx="4" fill="#e8f5e9" stroke="#2e7d32"/><text x="400" y="120" fill="#1a1a2e">expert 3 (active)</text>
<rect x="360" y="140" width="80" height="32" rx="4" fill="#eeeeee" stroke="#9e9e9e"/><text x="400" y="160" fill="#666">expert 4</text>
<text x="400" y="190" font-style="italic" fill="#666">&#8230; up to N experts</text>
</g>
<g transform="translate(480,46)">
<rect width="180" height="44" rx="6" fill="#fce4ec" stroke="#c2185b"/>
<text x="90" y="22" font-size="11" font-weight="600" text-anchor="middle" fill="#c2185b">weighted sum</text>
<text x="90" y="36" font-size="10" text-anchor="middle" fill="#c2185b">y = &#931; g&#7522; &#183; E&#7522;(x)</text>
</g>
<text x="360" y="240" font-size="11" text-anchor="middle" fill="#1a1a2e">Training: gradient flows through ALL N experts. Inference: only k experts touch memory bandwidth.</text>
<text x="360" y="258" font-size="10" font-style="italic" text-anchor="middle" fill="#666">DeepSeek V4: N=256, k=8 (~37B active out of 671B). Qwen3-235B: N=128, k=8.</text>
</svg>