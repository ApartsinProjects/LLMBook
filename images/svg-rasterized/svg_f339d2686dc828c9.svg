<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The Kirchenbauer green-list algorithm in three steps." aria-labelledby="fig542title" role="img" style="max-width:970px;width:100%;height:auto;background:#fafafa;border-radius:8px;" viewBox="0 0 970 380" xmlns="http://www.w3.org/2000/svg">
<title id="fig542title">Kirchenbauer green-list watermarking</title>
<text fill="#222" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" x="380" y="24">Green-list watermarking: bias the distribution, detect the bias</text>
<g font-family="Georgia, serif" font-size="11">
<rect fill="#fff" height="120" rx="6" stroke="#444" width="220" x="20" y="60"></rect>
<text fill="#222" font-weight="bold" text-anchor="middle" x="130" y="84">Step 1: hash previous token</text>
<text fill="#444" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="130" y="106">seed = hash(token[t-1], key)</text>
<text fill="#444" text-anchor="middle" x="130" y="126">→ pseudo-random</text>
<text fill="#444" text-anchor="middle" x="130" y="142">partition of vocab</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="130" y="166">γ = 0.25 → 25% green</text>
<text fill="#222" font-size="22" font-weight="bold" x="270" y="124">→</text>
<rect fill="#fff" height="120" rx="6" stroke="#444" width="220" x="300" y="60"></rect>
<text fill="#222" font-weight="bold" text-anchor="middle" x="410" y="84">Step 2: bias the logits</text>
<g transform="translate(310,95)">
<rect fill="#a4d99a" height="40" stroke="#2ca02c" width="14" x="0" y="0"></rect>
<rect fill="#f4a87a" height="30" stroke="#d62728" width="14" x="16" y="10"></rect>
<rect fill="#a4d99a" height="20" stroke="#2ca02c" width="14" x="32" y="20"></rect>
<rect fill="#a4d99a" height="35" stroke="#2ca02c" width="14" x="48" y="5"></rect>
<rect fill="#f4a87a" height="15" stroke="#d62728" width="14" x="64" y="25"></rect>
<rect fill="#a4d99a" height="25" stroke="#2ca02c" width="14" x="80" y="15"></rect>
<rect fill="#f4a87a" height="18" stroke="#d62728" width="14" x="96" y="22"></rect>
<rect fill="#a4d99a" height="32" stroke="#2ca02c" width="14" x="112" y="8"></rect>
<rect fill="#a4d99a" height="12" stroke="#2ca02c" width="14" x="128" y="28"></rect>
<rect fill="#f4a87a" height="22" stroke="#d62728" width="14" x="144" y="18"></rect>
<rect fill="#a4d99a" height="26" stroke="#2ca02c" width="14" x="160" y="14"></rect>
<rect fill="#a4d99a" height="14" stroke="#2ca02c" width="14" x="176" y="26"></rect>
<rect fill="#f4a87a" height="20" stroke="#d62728" width="14" x="192" y="20"></rect>
</g>
<text fill="#444" text-anchor="middle" x="410" y="155">logits[green] += δ (e.g. 2.0)</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="410" y="170">green tokens upweighted, sample</text>
<text fill="#1f77b4" font-size="13" font-weight="bold" text-anchor="middle" x="380" y="208">Step 3: detection via z-test</text>
<rect fill="#e8f1fb" height="120" rx="6" stroke="#1f77b4" width="640" x="60" y="220"></rect>
<text fill="#222" font-weight="bold" x="80" y="244">Count green tokens in candidate text:</text>
<text fill="#444" font-family="Consolas, monospace" font-size="10" x="80" y="262">z = (n_green − γ·T) / √(T·γ·(1−γ))</text>
<text fill="#444" x="80" y="282">Human-written: z ≈ 0 (green frequency = γ by chance)</text>
<text fill="#444" x="80" y="298">Watermarked: z ≫ 4 typical (p &lt; 10⁻⁴ false-positive at T=200 tokens)</text>
<text fill="#444" x="80" y="320"><tspan fill="#d62728" font-weight="bold">Caveats:</tspan> paraphrase erases signal · long-tail rare-token outputs detect poorly · key needed for verification</text>
<text fill="#666" font-style="italic" text-anchor="middle" x="380" y="365">SynthID-Text (DeepMind 2024) generalizes to tournament selection, in production on Gemini.</text>
</g>
</svg>