<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="GPT-2: stacked decoder blocks with causal self-attention" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 640 220" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="220" width="640"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="320" y="22">GPT-2: stacked decoder blocks with causal self-attention</text>
<g font-size="11" text-anchor="middle">
<rect fill="#e3e8f5" height="40" rx="6" stroke="#3d4d8a" stroke-width="1.5" width="80" x="20" y="50"></rect>
<text fill="#1a1a2e" x="60" y="75">tokens x₁..xₜ</text>
<text fill="#555" x="120" y="74">→</text>
<rect fill="#fef3e0" height="40" rx="6" stroke="#a67c1a" stroke-width="1.5" width="100" x="140" y="50"></rect>
<text fill="#1a1a2e" x="190" y="68">token + pos</text>
<text fill="#1a1a2e" x="190" y="82">embeddings</text>
<text fill="#555" x="260" y="74">→</text>
<g transform="translate(280,40)">
<rect fill="#ecf6ee" height="120" rx="8" stroke="#1f7a3a" stroke-width="2" width="160"></rect>
<text fill="#1f7a3a" font-weight="700" x="80" y="18">N = 48 blocks</text>
<rect fill="#ffffff" height="22" rx="4" stroke="#1f7a3a" width="132" x="14" y="28"></rect>
<text fill="#1a1a2e" x="80" y="44">masked self-attention</text>
<rect fill="#ffffff" height="22" rx="4" stroke="#1f7a3a" width="132" x="14" y="54"></rect>
<text fill="#1a1a2e" x="80" y="70">LayerNorm + residual</text>
<rect fill="#ffffff" height="22" rx="4" stroke="#1f7a3a" width="132" x="14" y="80"></rect>
<text fill="#1a1a2e" x="80" y="96">feed-forward (4d)</text>
<rect fill="#ffffff" height="14" rx="3" stroke="#1f7a3a" stroke-dasharray="2,2" width="132" x="14" y="105"></rect>
<text fill="#5a4a3a" font-size="9" x="80" y="115">repeat 48x</text>
</g>
<text fill="#555" x="460" y="100">→</text>
<rect fill="#f5e3e8" height="40" rx="6" stroke="#7a2a4a" stroke-width="1.5" width="140" x="480" y="80"></rect>
<text fill="#1a1a2e" x="550" y="98">unembed + softmax</text>
<text fill="#1a1a2e" x="550" y="112">over 50,257 tokens</text>
</g>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="320" y="200">Causal mask means token t attends only to positions ≤ t, enabling autoregressive next-token prediction.</text>
</svg>