<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="YaRN per-dimension ramp: high-frequency RoPE dimensions keep their original scale, low-frequency dimensions are NTK-scaled, intermediate dimensions blend smoothly between the two." role="img" viewbox="0 0 640 230" xmlns="http://www.w3.org/2000/svg">
<rect fill="#333" height="2" width="560" x="40" y="170"></rect>
<rect fill="#333" height="132" width="2" x="40" y="40"></rect>
<text fill="#333" font-size="11" x="40" y="195">high-freq (local)</text>
<text fill="#333" font-size="11" text-anchor="middle" x="280" y="195">intermediate</text>
<text fill="#333" font-size="11" text-anchor="end" x="600" y="195">low-freq (global)</text>
<text fill="#333" font-size="11" x="20" y="50">1.0</text>
<text fill="#333" font-size="11" x="20" y="172">0.0</text>
<text fill="#333" font-size="12" font-weight="bold" x="20" y="25">ramp gamma</text>
<line stroke="#1f77b4" stroke-width="3" x1="40" x2="220" y1="170" y2="170"></line>
<line stroke="#1f77b4" stroke-width="3" x1="220" x2="420" y1="170" y2="50"></line>
<line stroke="#1f77b4" stroke-width="3" x1="420" x2="600" y1="50" y2="50"></line>
<circle cx="220" cy="170" fill="#1f77b4" r="4"></circle>
<circle cx="420" cy="50" fill="#1f77b4" r="4"></circle>
<text fill="#1f77b4" font-size="10" text-anchor="middle" x="130" y="160">no scaling</text>
<text fill="#1f77b4" font-size="10" text-anchor="middle" x="320" y="115">blend</text>
<text fill="#1f77b4" font-size="10" text-anchor="middle" x="510" y="40">full NTK scaling</text>
<text fill="#666" font-size="10" text-anchor="middle" x="220" y="215">L / beta_fast</text>
<text fill="#666" font-size="10" text-anchor="middle" x="420" y="215">L / beta_slow</text>
</svg>