<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Naive contiguous KV cache (reserves L_max per request)" style="font-family: sans-serif; max-width: 100%; height: auto;" viewbox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="200" width="720"></rect>
<text fill="#1a4078" font-size="13" font-weight="700" x="20" y="25">Naive contiguous KV cache (reserves L_max per request)</text>
<g transform="translate(20,40)">
<rect fill="#cccccc" height="24" stroke="#888" width="640" x="0" y="0"></rect>
<rect fill="#1f7a3a" height="24" width="120" x="0" y="0"></rect>
<text fill="#ffffff" font-size="11" text-anchor="middle" x="60" y="17">used 120</text>
<text fill="#666" font-size="11" text-anchor="middle" x="400" y="17">reserved but unused (waste)</text>
</g>
<text fill="#1a4078" font-size="13" font-weight="700" x="20" y="100">PagedAttention (16-token blocks, allocate on demand)</text>
<g font-size="10" text-anchor="middle" transform="translate(20,115)">
<g fill="#1f7a3a">
<rect height="24" width="38" x="0" y="0"></rect><rect height="24" width="38" x="42" y="0"></rect>
<rect height="24" width="38" x="84" y="0"></rect><rect height="24" width="38" x="126" y="0"></rect>
<rect height="24" width="38" x="168" y="0"></rect><rect height="24" width="38" x="210" y="0"></rect>
<rect height="24" width="38" x="252" y="0"></rect>
</g>
<rect fill="#a67c1a" height="24" width="38" x="294" y="0"></rect>
<text fill="#ffffff" x="313" y="17">8/16</text>
<text fill="#ffffff" x="125" y="17">block</text>
<g fill="#dddddd" stroke="#bbbbbb">
<rect height="24" width="38" x="336" y="0"></rect><rect height="24" width="38" x="378" y="0"></rect>
<rect height="24" width="38" x="420" y="0"></rect><rect height="24" width="38" x="462" y="0"></rect>
<rect height="24" width="38" x="504" y="0"></rect><rect height="24" width="38" x="546" y="0"></rect>
<rect height="24" width="38" x="588" y="0"></rect>
</g>
<text fill="#777" x="490" y="17">free pool (reusable for any request)</text>
</g>
<text fill="#444" font-size="11" x="20" y="180">Naive wastes the entire grey region; PagedAttention wastes at most one partial block (orange) per sequence.</text>
</svg>