<text x="40" y="344" font-weight="bold" fill="#cc8400">Defense in depth principle:</text>
<text x="40" y="364" fill="#444">no single layer suffices. A signed safetensors file inside a TEE still falls to a poisoned training corpus.</text>
<text x="40" y="384" fill="#444" font-style="italic">SLSA + signing + scanning + TEE + multimodal filters compose to harden the full chain from data to runtime.</text>
