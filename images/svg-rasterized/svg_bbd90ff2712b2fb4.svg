<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three planning strategies arrayed left-to-right by compute cost: ReAct (one step at a time), Plan-and-Execute (linear plan with replanning), and Tree Search (branching exploration)" role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewbox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow-planning" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"></path>
</marker>
</defs>
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="360" y="22">Agent planning spectrum: simple to compute-heavy</text>
<g transform="translate(20,50)">
<rect fill="#f7fafc" height="200" rx="8" stroke="#3a73a8" stroke-width="1.5" width="210" x="0" y="0"></rect>
<text fill="#3a73a8" font-size="13" font-weight="600" text-anchor="middle" x="105" y="22">ReAct loop</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="105" y="38">1 step at a time</text>
<circle cx="40" cy="90" fill="#bee3f8" r="18" stroke="#3a73a8" stroke-width="1.5"></circle>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="40" y="94">obs</text>
<circle cx="105" cy="90" fill="#bee3f8" r="18" stroke="#3a73a8" stroke-width="1.5"></circle>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="105" y="94">think</text>
<circle cx="170" cy="90" fill="#bee3f8" r="18" stroke="#3a73a8" stroke-width="1.5"></circle>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="170" y="94">act</text>
<path d="M58,90 L87,90" marker-end="url(#arrow-planning)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M123,90 L152,90" marker-end="url(#arrow-planning)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M170,108 Q170,150 105,150 Q40,150 40,108" fill="none" marker-end="url(#arrow-planning)" stroke="#4a5568" stroke-width="1.5"></path>
<text fill="#718096" font-size="10" text-anchor="middle" x="105" y="180">Cost: ~1 LLM call/step</text>
</g>
<g transform="translate(255,50)">
<rect fill="#f7fafc" height="200" rx="8" stroke="#d97706" stroke-width="1.5" width="210" x="0" y="0"></rect>
<text fill="#d97706" font-size="13" font-weight="600" text-anchor="middle" x="105" y="22">Plan and Execute</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="105" y="38">plan then run with replan</text>
<rect fill="#fef3c7" height="22" rx="4" stroke="#d97706" stroke-width="1.5" width="150" x="30" y="60"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="105" y="75">1. Plan all steps</text>
<rect fill="#fef3c7" height="22" rx="4" stroke="#d97706" stroke-width="1.5" width="150" x="30" y="92"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="105" y="107">2. Execute step</text>
<rect fill="#fef3c7" height="22" rx="4" stroke="#d97706" stroke-width="1.5" width="150" x="30" y="124"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="105" y="139">3. Reflect, maybe replan</text>
<path d="M105,82 L105,92" marker-end="url(#arrow-planning)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M105,114 L105,124" marker-end="url(#arrow-planning)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M180,135 Q200,123 180,103" fill="none" marker-end="url(#arrow-planning)" stroke="#4a5568" stroke-dasharray="3,3" stroke-width="1.5"></path>
<text fill="#718096" font-size="10" text-anchor="middle" x="105" y="180">Cost: 1 plan + 1 per step</text>
</g>
<g transform="translate(490,50)">
<rect fill="#f7fafc" height="200" rx="8" stroke="#047857" stroke-width="1.5" width="210" x="0" y="0"></rect>
<text fill="#047857" font-size="13" font-weight="600" text-anchor="middle" x="105" y="22">Tree Search (LATS)</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="105" y="38">branch, score, prune</text>
<circle cx="105" cy="65" fill="#a7f3d0" r="9" stroke="#047857" stroke-width="1.5"></circle>
<circle cx="60" cy="105" fill="#a7f3d0" r="9" stroke="#047857" stroke-width="1.5"></circle>
<circle cx="105" cy="105" fill="#a7f3d0" r="9" stroke="#047857" stroke-width="1.5"></circle>
<circle cx="150" cy="105" fill="#a7f3d0" r="9" stroke="#047857" stroke-width="1.5"></circle>
<circle cx="40" cy="145" fill="#a7f3d0" r="9" stroke="#047857" stroke-width="1.5"></circle>
<circle cx="80" cy="145" fill="#a7f3d0" r="9" stroke="#047857" stroke-width="1.5"></circle>
<circle cx="130" cy="145" fill="#a7f3d0" r="9" stroke="#047857" stroke-width="1.5"></circle>
<circle cx="170" cy="145" fill="#a7f3d0" r="9" stroke="#047857" stroke-width="1.5"></circle>
<line stroke="#4a5568" stroke-width="1.2" x1="105" x2="60" y1="74" y2="96"></line>
<line stroke="#4a5568" stroke-width="1.2" x1="105" x2="105" y1="74" y2="96"></line>
<line stroke="#4a5568" stroke-width="1.2" x1="105" x2="150" y1="74" y2="96"></line>
<line stroke="#4a5568" stroke-width="1.2" x1="60" x2="40" y1="114" y2="136"></line>
<line stroke="#4a5568" stroke-width="1.2" x1="60" x2="80" y1="114" y2="136"></line>
<line stroke="#4a5568" stroke-width="1.2" x1="150" x2="130" y1="114" y2="136"></line>
<line stroke="#4a5568" stroke-width="1.2" x1="150" x2="170" y1="114" y2="136"></line>
<text fill="#718096" font-size="10" text-anchor="middle" x="105" y="180">Cost: dozens of LLM calls</text>
</g>
</svg>