<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="RLVR loop: prompt to policy to response to verifier to policy update" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="200" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="360" y="22">RLVR loop: prompt to policy to response to verifier to policy update</text>
<g font-size="11" text-anchor="middle">
<rect fill="#e3e8f5" height="50" rx="6" stroke="#3d4d8a" stroke-width="1.5" width="110" x="20" y="70"></rect>
<text fill="#1a1a2e" x="75" y="92">prompt q</text>
<text fill="#555" font-size="9" x="75" y="108">(math problem)</text>
<text fill="#555" x="140" y="98">→</text>
<rect fill="#fef3e0" height="50" rx="6" stroke="#a67c1a" stroke-width="1.5" width="120" x="155" y="70"></rect>
<text fill="#1a1a2e" x="215" y="92">policy πθ</text>
<text fill="#555" font-size="9" x="215" y="108">sample G traces</text>
<text fill="#555" x="285" y="98">→</text>
<rect fill="#ecf6ee" height="50" rx="6" stroke="#1f7a3a" stroke-width="1.5" width="130" x="300" y="70"></rect>
<text fill="#1a1a2e" x="365" y="90">response s</text>
<text fill="#555" font-size="9" x="365" y="106">"... ANSWER: 42"</text>
<text fill="#555" x="440" y="98">→</text>
<rect fill="#f5e3e8" height="50" rx="6" stroke="#7a2a4a" stroke-width="1.5" width="130" x="455" y="70"></rect>
<text fill="#1a1a2e" x="520" y="90">verifier V(s,q)</text>
<text fill="#555" font-size="9" x="520" y="106">binary reward 0 / 1</text>
<text fill="#555" x="595" y="98">→</text>
<rect fill="#fde8e8" height="50" rx="6" stroke="#e94560" stroke-width="1.5" width="95" x="610" y="70"></rect>
<text fill="#1a1a2e" x="657" y="90">PPO / GRPO</text>
<text fill="#555" font-size="9" x="657" y="106">update θ</text>
</g>
<path d="M 657 120 Q 657 160 215 160 Q 215 130 215 120" fill="none" marker-end="url(#rlvrArrow)" stroke="#888" stroke-dasharray="4,3" stroke-width="1.5"></path>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="430" y="178">gradient step on πθ with KL anchor to π_ref</text>
<defs><marker id="rlvrArrow" markerheight="6" markerwidth="6" orient="auto" refx="8" refy="5" viewbox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888"></path></marker></defs>
</svg>