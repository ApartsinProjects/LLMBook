<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="NL-to-Analytics pipeline. A natural language question is converted to SQL or code, executed against a data source, and the results are visualized with a narrative explanation. Validation checks at each stage guard against hallucinated queries and misleading charts." font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 -8 820 328" xmlns="http://www.w3.org/2000/svg">
<defs><filter height="116%" id="stdShadow2" width="108%" x="-4%" y="-4%"><fedropshadow dx="1" dy="2" flood-opacity="0.08" stddeviation="2"></fedropshadow></filter><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<marker id="arrNL" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3">
<polygon fill="#1a1a2e" points="0 0, 8 3, 0 6"></polygon>
</marker>
</defs>
<text fill="#1a1a2e" font-size="16" font-weight="700" text-anchor="middle" x="410" y="28">NL-to-Analytics Pipeline</text>
<!-- Stage 1: NL Question -->
<rect fill="#e3f2fd" height="100" rx="8" stroke="#1565c0" stroke-linecap="round" stroke-width="2" width="140" x="30" y="55"></rect>
<text fill="#1565c0" font-size="12" font-weight="700" text-anchor="middle" x="100" y="80">NL Question</text>
<text fill="#555" font-size="11" text-anchor="middle" x="100" y="100">"Show revenue by</text>
<text fill="#555" font-size="11" text-anchor="middle" x="100" y="115">region for Q3"</text>
<text fill="#888" font-size="11" text-anchor="middle" x="100" y="142">Business user input</text>
<line marker-end="url(#arrNL)" stroke="#1a1a2e" stroke-linecap="round" stroke-width="2" x1="175" x2="205" y1="105" y2="105"></line>
<!-- Stage 2: LLM Code Gen -->
<rect fill="#f3e5f5" height="100" rx="8" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="140" x="210" y="55"></rect>
<text fill="#8e44ad" font-size="12" font-weight="700" text-anchor="middle" x="280" y="80">LLM Code Gen</text>
<rect fill="white" height="20" rx="3" stroke="#ce93d8" stroke-linecap="round" stroke-width="1" width="120" x="220" y="92"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="280" y="106">Schema linking</text>
<rect fill="white" height="20" rx="3" stroke="#ce93d8" stroke-linecap="round" stroke-width="1" width="120" x="220" y="116"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="280" y="130">SQL / Python gen</text>
<line marker-end="url(#arrNL)" stroke="#1a1a2e" stroke-linecap="round" stroke-width="2" x1="355" x2="385" y1="105" y2="105"></line>
<!-- Stage 3: Execute -->
<rect fill="#fff3e0" height="100" rx="8" stroke="#e65100" stroke-linecap="round" stroke-width="2" width="130" x="390" y="55"></rect>
<text fill="#e65100" font-size="12" font-weight="700" text-anchor="middle" x="455" y="80">Execute</text>
<rect fill="white" height="20" rx="3" stroke="#ffcc80" stroke-linecap="round" stroke-width="1" width="110" x="400" y="92"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="455" y="106">Run query safely</text>
<rect fill="white" height="20" rx="3" stroke="#ffcc80" stroke-linecap="round" stroke-width="1" width="110" x="400" y="116"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="455" y="130">Capture results</text>
<line marker-end="url(#arrNL)" stroke="#1a1a2e" stroke-linecap="round" stroke-width="2" x1="525" x2="555" y1="105" y2="105"></line>
<!-- Stage 4: Visualize + Narrate -->
<rect fill="#e8f5e9" height="100" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="150" x="560" y="55"></rect>
<text fill="#27ae60" font-size="12" font-weight="700" text-anchor="middle" x="635" y="78">Viz + Narrate</text>
<rect fill="white" height="20" rx="3" stroke="#a5d6a7" stroke-linecap="round" stroke-width="1" width="130" x="570" y="92"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="635" y="106">Chart spec (Vega-Lite)</text>
<rect fill="white" height="20" rx="3" stroke="#a5d6a7" stroke-linecap="round" stroke-width="1" width="130" x="570" y="116"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="635" y="130">Insight narration</text>
<!-- Validation bar -->
<rect fill="#e94560" height="22" opacity="0.1" rx="4" stroke="#e94560" stroke-linecap="round" stroke-width="1" width="680" x="30" y="175"></rect>
<text fill="#c62828" font-size="11" font-weight="600" text-anchor="middle" x="370" y="190">Validation at each stage: schema check, SQL syntax, result sanity, chart accuracy</text>
<!-- Bottom comparison -->
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="410" y="225">Traditional BI vs. NL-to-Analytics</text>
<rect fill="#fef9e7" height="65" rx="6" stroke="#f39c12" stroke-linecap="round" stroke-width="1" width="330" x="50" y="240"></rect>
<text fill="#e67e22" font-size="11" font-weight="600" text-anchor="middle" x="215" y="260">Traditional BI</text>
<text fill="#555" font-size="11" text-anchor="middle" x="215" y="278">Analyst writes SQL, builds dashboard, schedules refresh</text>
<text fill="#555" font-size="11" text-anchor="middle" x="215" y="294">Days to new insight; requires technical skill</text>
<rect fill="#e8f5e9" height="65" rx="6" stroke="#27ae60" stroke-linecap="round" stroke-width="1" width="330" x="420" y="240"></rect>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="585" y="260">NL-to-Analytics</text>
<text fill="#555" font-size="11" text-anchor="middle" x="585" y="278">User asks question in plain language, gets chart + narrative</text>
<text fill="#555" font-size="11" text-anchor="middle" x="585" y="294">Seconds to insight; no SQL knowledge required</text>
</svg>