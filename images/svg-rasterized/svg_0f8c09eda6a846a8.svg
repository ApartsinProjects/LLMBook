<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="A single training step touches all four branches of mathematics in this appendix." viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figA5title" style="max-width:720px;width:100%;height:auto;background:#fafafa;border-radius:8px;">
<title id="figA5title">Forward and backward pass: where each branch of math lives</title>
<defs>
<marker id="arrA5fwd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/>
</marker>
<marker id="arrA5bwd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 z" fill="#d62728"/>
</marker>
</defs>
<text x="360" y="24" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">One transformer step, four branches of math</text>
<g font-family="Georgia, serif" font-size="11">
<rect x="30" y="80" width="110" height="60" rx="6" fill="#e8f1fb" stroke="#1f77b4"/>
<text x="85" y="105" text-anchor="middle" font-weight="bold">Embedding</text>
<text x="85" y="122" text-anchor="middle" fill="#444">linear algebra</text>
<rect x="170" y="80" width="110" height="60" rx="6" fill="#e8f1fb" stroke="#1f77b4"/>
<text x="225" y="105" text-anchor="middle" font-weight="bold">Self-attention</text>
<text x="225" y="122" text-anchor="middle" fill="#444">lin alg + prob</text>
<rect x="310" y="80" width="110" height="60" rx="6" fill="#e8f1fb" stroke="#1f77b4"/>
<text x="365" y="100" text-anchor="middle" font-weight="bold">Feed-forward</text>
<text x="365" y="116" text-anchor="middle" fill="#444">lin alg +</text>
<text x="365" y="130" text-anchor="middle" fill="#444">calculus (act)</text>
<rect x="450" y="80" width="110" height="60" rx="6" fill="#e8f1fb" stroke="#1f77b4"/>
<text x="505" y="100" text-anchor="middle" font-weight="bold">Output softmax</text>
<text x="505" y="116" text-anchor="middle" fill="#444">probability</text>
<text x="505" y="130" text-anchor="middle" fill="#444">→ vocab dist.</text>
<rect x="590" y="80" width="110" height="60" rx="6" fill="#fde9e9" stroke="#d62728"/>
<text x="645" y="100" text-anchor="middle" font-weight="bold">Loss</text>
<text x="645" y="116" text-anchor="middle" fill="#444">information theory</text>
<text x="645" y="130" text-anchor="middle" fill="#444">cross-entropy</text>
<line x1="140" y1="110" x2="170" y2="110" stroke="#1f77b4" stroke-width="2" marker-end="url(#arrA5fwd)"/>
<line x1="280" y1="110" x2="310" y2="110" stroke="#1f77b4" stroke-width="2" marker-end="url(#arrA5fwd)"/>
<line x1="420" y1="110" x2="450" y2="110" stroke="#1f77b4" stroke-width="2" marker-end="url(#arrA5fwd)"/>
<line x1="560" y1="110" x2="590" y2="110" stroke="#1f77b4" stroke-width="2" marker-end="url(#arrA5fwd)"/>
<text x="365" y="68" text-anchor="middle" fill="#1f77b4" font-weight="bold">Forward pass</text>
<rect x="200" y="220" width="320" height="60" rx="6" fill="#fde9e9" stroke="#d62728"/>
<text x="360" y="245" text-anchor="middle" font-weight="bold">Backpropagation: ∂L/∂w via chain rule</text>
<text x="360" y="263" text-anchor="middle" fill="#444">calculus (∇L) → gradient descent update</text>
<path d="M 645 140 Q 645 200 520 220" stroke="#d62728" stroke-width="2" fill="none" marker-end="url(#arrA5bwd)"/>
<path d="M 200 250 Q 90 220 85 140" stroke="#d62728" stroke-width="2" fill="none" marker-end="url(#arrA5bwd)"/>
<text x="700" y="180" text-anchor="end" fill="#d62728" font-weight="bold">Backward pass</text>
<rect x="270" y="310" width="180" height="36" rx="6" fill="#e9f7e9" stroke="#2ca02c"/>
<text x="360" y="325" text-anchor="middle" font-weight="bold">Weight update</text>
<text x="360" y="340" text-anchor="middle" fill="#444">w ← w − η ∇L (calculus)</text>
</g>
</svg>