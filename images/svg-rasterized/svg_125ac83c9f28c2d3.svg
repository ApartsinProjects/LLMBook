<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Topic stack management showing how the system tracks topic switches, saves context for suspended topics, and resumes them when the user returns." role="img" viewBox="0 -9 740 329" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow_06c1d0" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<!-- Timeline -->
<line stroke="#ddd" stroke-linecap="round" stroke-width="2" x1="60" x2="700" y1="80" y2="80"></line>
<!-- Turn markers -->
<circle cx="100" cy="80" fill="#3498db" r="6"></circle>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="100.0" x2="100.0" y1="62.0" y2="72.0"></line>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="100" y="60">T1</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="100" y="100">Laptop</text>
<circle cx="200" cy="80" fill="#3498db" r="6"></circle>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="200.0" x2="200.0" y1="62.0" y2="72.0"></line>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="200" y="60">T2</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="200" y="100">Laptop</text>
<circle cx="300" cy="80" fill="#e74c3c" r="6"></circle>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="300.0" x2="300.0" y1="62.0" y2="72.0"></line>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="300" y="60">T3</text>
<text fill="#e74c3c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="300" y="100">Shipping</text>
<circle cx="400" cy="80" fill="#e74c3c" r="6"></circle>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="400.0" x2="400.0" y1="62.0" y2="72.0"></line>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="400" y="60">T4</text>
<text fill="#e74c3c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="400" y="100">Shipping</text>
<circle cx="500" cy="80" fill="#27ae60" r="6"></circle>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="500.0" x2="500.0" y1="62.0" y2="72.0"></line>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="500" y="60">T5</text>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="500" y="100">Returns</text>
<circle cx="600" cy="80" fill="#3498db" r="6"></circle>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="600.0" x2="600.0" y1="62.0" y2="72.0"></line>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="600" y="60">T6</text>
<text fill="#3498db" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="600" y="100">Laptop</text>
<circle cx="680" cy="80" fill="#3498db" r="6"></circle>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="680.0" x2="680.0" y1="62.0" y2="72.0"></line>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="680" y="60">T7</text>
<text fill="#3498db" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="680" y="100">Laptop</text>
<!-- Topic switch annotations -->
<path d="M 250 80 Q 250 50 300 50" fill="none" stroke="#e74c3c" stroke-dasharray="4" stroke-linecap="round" stroke-width="1.5"></path>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="275.0" x2="296.0" y1="44.0" y2="73.1"></line>
<text fill="#e74c3c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="275" y="42">switch</text>
<path d="M 450 80 Q 450 50 500 50" fill="none" stroke="#27ae60" stroke-dasharray="4" stroke-linecap="round" stroke-width="1.5"></path>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="475.0" x2="496.0" y1="44.0" y2="73.1"></line>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="475" y="42">switch</text>
<path d="M 550 80 Q 550 50 600 50" fill="none" stroke="#3498db" stroke-dasharray="4" stroke-linecap="round" stroke-width="1.5"></path>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="575.0" x2="596.0" y1="44.0" y2="73.1"></line>
<text fill="#3498db" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="575" y="42">resume</text>
<!-- Topic stack visualization -->
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="118.0" x2="182.0" y1="139.5" y2="160.0"></line>
<text fill="#1a1a2e" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" x="120" y="145">Topic Stack Over Time:</text>
<!-- Stack at T2 -->
<rect fill="#3498db" filter="url(#shadow_06c1d0)" height="28" rx="4" stroke="none" width="100" x="80" y="160"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="130" y="179">Laptop</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="130" y="202">at T2</text>
<!-- Stack at T4 -->
<rect fill="#e74c3c" height="28" rx="4" stroke="none" width="100" x="240" y="160"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="290" y="179">Shipping</text>
<rect fill="#3498db" height="28" opacity="0.5" rx="4" stroke="none" width="100" x="240" y="192"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="290" y="211">Laptop (saved)</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="290" y="234">at T4</text>
<!-- Stack at T5 -->
<rect fill="#27ae60" height="28" rx="4" stroke="none" width="100" x="400" y="160"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="450" y="179">Returns</text>
<rect fill="#e74c3c" height="28" opacity="0.5" rx="4" stroke="none" width="100" x="400" y="192"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="450" y="211">Shipping</text>
<rect fill="#3498db" height="28" opacity="0.3" rx="4" stroke="none" width="100" x="400" y="224"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="450" y="243">Laptop</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="450" y="268">at T5</text>
<!-- Stack at T6 (resumed) -->
<rect fill="#3498db" height="28" rx="4" stroke="none" width="100" x="560" y="160"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="610" y="179">Laptop (resumed)</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="610" y="202">at T6</text>
</svg>