<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Residual vector quantization chain. The latent vector z_t enters as the initial residual r_0. Codebook 1 finds its nearest entry e_1, which is subtracted to leave a smaller residual r_1. Codebook 2 quantizes r_1 to e_2, leaving r_2, and so on through codebook K. Each codebook captures a finer scale of detail: codebook 1 the coarse spectral envelope, middle codebooks prosody and fricatives, the last codebooks high-frequency crispness. The reconstructed latent is the sum of all the chosen entries e_1 through e_K. A note shows that dropping the last codebooks lowers bitrate with a small quality cost, while dropping the first destroys intelligibility." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 810 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="rvqZ" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bbdefb"></stop><stop offset="100%" stop-color="#1e88e5"></stop></lineargradient>
<lineargradient id="rvqCb1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"></stop><stop offset="100%" stop-color="#2e7d32"></stop></lineargradient>
<lineargradient id="rvqCb2" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#dcedc8"></stop><stop offset="100%" stop-color="#558b2f"></stop></lineargradient>
<lineargradient id="rvqCbK" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffe0b2"></stop><stop offset="100%" stop-color="#ef6c00"></stop></lineargradient>
<lineargradient id="rvqSum" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3e0"></stop><stop offset="100%" stop-color="#ffb74d"></stop></lineargradient>
<filter height="116%" id="rvqShadow" width="116%" x="-8%" y="-8%"><fedropshadow dx="1" dy="1.5" flood-opacity="0.18" stddeviation="1.5"></fedropshadow></filter>
<marker id="rvqArrow" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"></path></marker>
<marker id="rvqArrowS" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#fb8c00"></path></marker>
</defs>
<rect fill="#fafafa" height="360" rx="8" width="810" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="405" y="26">Residual vector quantization: each codebook cleans up the leftover residual</text>
<!-- z_t input -->
<rect fill="url(#rvqZ)" filter="url(#rvqShadow)" height="54" rx="9" width="78" x="22" y="92"></rect>
<text fill="#fff" font-size="13" font-weight="700" text-anchor="middle" x="61" y="116">zᵗ</text>
<text fill="#e3f2fd" font-size="9.5" text-anchor="middle" x="61" y="134">r₀ = zᵗ</text>
<line marker-end="url(#rvqArrow)" stroke="#777" stroke-width="2" x1="100" x2="132" y1="119" y2="119"></line>
<!-- stage helper to draw codebook + residual; manual placement -->
<!-- Codebook 1 -->
<rect fill="url(#rvqCb1)" filter="url(#rvqShadow)" height="66" rx="9" width="104" x="132" y="86"></rect>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="184" y="108">codebook 1</text>
<text fill="#e8f5e9" font-size="9.5" text-anchor="middle" x="184" y="125">e₁ = nearest(r₀)</text>
<text fill="#c8e6c9" font-size="9" text-anchor="middle" x="184" y="140">coarse envelope</text>
<!-- subtract node 1 -->
<circle cx="270" cy="119" fill="#fff" r="15" stroke="#2e7d32" stroke-width="1.6"></circle>
<text fill="#2e7d32" font-size="14" font-weight="700" text-anchor="middle" x="270" y="124">−</text>
<line marker-end="url(#rvqArrow)" stroke="#777" stroke-width="2" x1="236" x2="255" y1="119" y2="119"></line>
<text fill="#888" font-size="9.5" text-anchor="middle" x="295" y="100">r₁ = r₀ − e₁</text>
<line marker-end="url(#rvqArrow)" stroke="#777" stroke-width="2" x1="285" x2="312" y1="119" y2="119"></line>
<!-- Codebook 2 -->
<rect fill="url(#rvqCb2)" filter="url(#rvqShadow)" height="66" rx="9" width="104" x="312" y="86"></rect>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="364" y="108">codebook 2</text>
<text fill="#f1f8e9" font-size="9.5" text-anchor="middle" x="364" y="125">e₂ = nearest(r₁)</text>
<text fill="#dcedc8" font-size="9" text-anchor="middle" x="364" y="140">prosody, fricatives</text>
<circle cx="450" cy="119" fill="#fff" r="15" stroke="#558b2f" stroke-width="1.6"></circle>
<text fill="#558b2f" font-size="14" font-weight="700" text-anchor="middle" x="450" y="124">−</text>
<line marker-end="url(#rvqArrow)" stroke="#777" stroke-width="2" x1="416" x2="435" y1="119" y2="119"></line>
<text fill="#888" font-size="9.5" text-anchor="middle" x="475" y="100">r₂ = r₁ − e₂</text>
<line marker-end="url(#rvqArrow)" stroke="#777" stroke-dasharray="5,3" stroke-width="2" x1="465" x2="492" y1="119" y2="119"></line>
<text fill="#999" font-size="16" font-weight="700" text-anchor="middle" x="520" y="124">⋯</text>
<line marker-end="url(#rvqArrow)" stroke="#777" stroke-dasharray="5,3" stroke-width="2" x1="536" x2="560" y1="119" y2="119"></line>
<!-- Codebook K -->
<rect fill="url(#rvqCbK)" filter="url(#rvqShadow)" height="66" rx="9" width="104" x="560" y="86"></rect>
<text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="612" y="108">codebook K</text>
<text fill="#fff3e0" font-size="9.5" text-anchor="middle" x="612" y="125">eᵖ = nearest(rᵖ₋₁)</text>
<text fill="#ffe0b2" font-size="9" text-anchor="middle" x="612" y="140">hi-freq crispness</text>
<line marker-end="url(#rvqArrow)" stroke="#777" stroke-width="2" x1="664" x2="690" y1="119" y2="119"></line>
<text fill="#888" font-size="9.5" text-anchor="middle" x="730" y="100">rᵖ (tiny)</text>
<rect fill="#eceff1" height="42" rx="8" stroke="#b0bec5" stroke-width="1.2" width="96" x="690" y="98"></rect>
<text fill="#546e7a" font-size="10.5" text-anchor="middle" x="738" y="118">residual → 0</text>
<text fill="#90a4ae" font-size="9" text-anchor="middle" x="738" y="132">as K grows</text>
<!-- sum row: e1..eK feed into sum -->
<g fill="none" stroke="#fb8c00" stroke-dasharray="4,2" stroke-width="1.5">
<path d="M184,152 C184,210 360,210 388,224" marker-end="url(#rvqArrowS)"></path>
<path d="M364,152 C364,200 392,210 398,222" marker-end="url(#rvqArrowS)"></path>
<path d="M612,152 C612,210 460,210 432,224" marker-end="url(#rvqArrowS)"></path>
</g>
<rect fill="url(#rvqSum)" filter="url(#rvqShadow)" height="44" rx="9" width="160" x="330" y="226"></rect>
<text fill="#5d4037" font-size="12.5" font-weight="700" text-anchor="middle" x="410" y="248">ẑᵗ = Σᵗ₋₁ᵖ eᵖ</text>
<text fill="#6d4c41" font-size="9.5" text-anchor="middle" x="410" y="264">reconstructed latent</text>
<!-- note box -->
<rect fill="#e8f5e9" height="46" rx="9" stroke="#a5d6a7" stroke-width="1" width="570" x="120" y="298"></rect>
<text fill="#2e7d32" font-size="11" font-weight="600" text-anchor="middle" x="405" y="318">Codebooks are not one flat 1024ᵆ table: each captures a different scale of detail.</text>
<text fill="#388e3c" font-size="10.5" text-anchor="middle" x="405" y="336">Drop codebooks 7–8 → −25% bitrate, ~0.1 MOS hit. Drop codebook 1 → intelligibility collapses.</text>
</svg>