<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Simplified decision tree for vector database selection based on scale and operational requirements." role="img" viewbox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_3d75a6_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#e3f2fd"></stop></lineargradient>
<lineargradient id="grad_3d75a6_f8f9fa" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f8f9fa"></stop></lineargradient>
<lineargradient id="grad_3d75a6_ffcdd2" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffdce1"></stop><stop offset="100%" stop-color="#ffcdd2"></stop></lineargradient>
<lineargradient id="grad_3d75a6_c8e6c9" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d7f5d8"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
<filter height="115%" id="shadow_3d75a6" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrCost_31_3" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"></path></marker>
</defs>
<rect fill="url(#grad_3d75a6_f8f9fa)" filter="url(#shadow_3d75a6)" height="210" rx="10" stroke="#ddd" stroke-linecap="round" width="690" x="5" y="5"></rect>
<!-- Root -->
<rect fill="url(#grad_3d75a6_e3f2fd)" height="30" rx="5" stroke="#1976d2" stroke-linecap="round" width="200" x="250" y="45"></rect>
<text fill="#1565c0" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="350" y="65">How many vectors?</text>
<!-- Left branch: < 100K -->
<line marker-end="url(#arrCost_31_3)" stroke="#607d8b" stroke-linecap="round" stroke-width="1" x1="300" x2="135" y1="75" y2="98"></line>
<rect fill="url(#grad_3d75a6_c8e6c9)" height="28" rx="5" stroke="#388e3c" stroke-linecap="round" width="200" x="30" y="100"></rect>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="130" y="119">&lt;100K: ChromaDB or FAISS</text>
<!-- Middle branch: 100K-10M -->
<line marker-end="url(#arrCost_31_3)" stroke="#607d8b" stroke-linecap="round" stroke-width="1" x1="350" x2="350" y1="75" y2="98"></line>
<rect fill="#fff9c4" height="28" rx="5" stroke="#f9a825" stroke-linecap="round" width="200" x="250" y="100"></rect>
<text fill="#f57f17" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="119">100K-10M: Need managed?</text>
<!-- Right branch: > 10M -->
<line marker-end="url(#arrCost_31_3)" stroke="#607d8b" stroke-linecap="round" stroke-width="1" x1="400" x2="565" y1="75" y2="98"></line>
<rect fill="url(#grad_3d75a6_ffcdd2)" height="28" rx="5" stroke="#c62828" stroke-linecap="round" width="200" x="470" y="100"></rect>
<text fill="#c62828" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="570" y="119">&gt;10M: Qdrant / Milvus</text>
<!-- Sub-branches for middle -->
<line marker-end="url(#arrCost_31_3)" stroke="#607d8b" stroke-linecap="round" stroke-width="1" x1="300" x2="185" y1="128" y2="153"></line>
<rect fill="#e8f5e9" height="28" rx="5" stroke="#66bb6a" stroke-linecap="round" width="200" x="80" y="155"></rect>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="180" y="174">Yes: Pinecone / Weaviate Cloud</text>
<line marker-end="url(#arrCost_31_3)" stroke="#607d8b" stroke-linecap="round" stroke-width="1" x1="400" x2="515" y1="128" y2="153"></line>
<rect fill="#e8f5e9" height="28" rx="5" stroke="#66bb6a" stroke-linecap="round" width="200" x="420" y="155"></rect>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="520" y="174">No: pgvector / Qdrant / LanceDB</text>
<!-- Bottom note -->
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="205">Consider hybrid search needs, existing infrastructure, and operational maturity</text>
</svg>