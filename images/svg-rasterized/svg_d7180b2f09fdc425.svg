<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="MusicLM hierarchical pipeline: MuLan text-music joint embedding produces conditioning tokens which condition a semantic transformer producing w2v-BERT semantic tokens which condition an acoustic transformer producing SoundStream tokens which decode to waveform" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 820 240" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="240" width="820"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="410" y="22">MusicLM hierarchical decomposition: three transformers, three token rates</text>
<defs>
<marker id="mlArr" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#666"></path></marker>
</defs>
<g font-size="10">
<rect fill="#bbdefb" height="80" rx="8" stroke="#1976d2" stroke-width="1.5" width="120" x="20" y="80"></rect>
<text fill="#0d47a1" font-weight="700" text-anchor="middle" x="80" y="100">Text prompt</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="80" y="118">"upbeat lo-fi"</text>
<text fill="#1976d2" font-size="9" text-anchor="middle" x="80" y="136">"with rhodes piano"</text>
<line marker-end="url(#mlArr)" stroke="#666" stroke-width="2" x1="140" x2="168" y1="120" y2="120"></line>
<rect fill="#fff3e0" height="80" rx="8" stroke="#ef6c00" stroke-width="1.5" width="120" x="168" y="80"></rect>
<text fill="#e65100" font-weight="700" text-anchor="middle" x="228" y="100">MuLan</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="228" y="118">text-music CLIP</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="228" y="132">joint embedding</text>
<text fill="#ef6c00" font-size="9" text-anchor="middle" x="228" y="146">conditioning tokens</text>
<line marker-end="url(#mlArr)" stroke="#666" stroke-width="2" x1="288" x2="316" y1="120" y2="120"></line>
<rect fill="#c8e6c9" height="80" rx="8" stroke="#2e7d32" stroke-width="1.5" width="140" x="316" y="80"></rect>
<text fill="#1b5e20" font-weight="700" text-anchor="middle" x="386" y="100">Semantic transformer</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="386" y="118">w2v-BERT tokens</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="386" y="132">25 Hz, high-level</text>
<text fill="#2e7d32" font-size="9" text-anchor="middle" x="386" y="146">structure tokens</text>
<line marker-end="url(#mlArr)" stroke="#666" stroke-width="2" x1="456" x2="484" y1="120" y2="120"></line>
<rect fill="#e1bee7" height="80" rx="8" stroke="#6a1b9a" stroke-width="1.5" width="140" x="484" y="80"></rect>
<text fill="#4a148c" font-weight="700" text-anchor="middle" x="554" y="100">Acoustic transformer</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="554" y="118">SoundStream tokens</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="554" y="132">600 Hz, audio detail</text>
<text fill="#6a1b9a" font-size="9" text-anchor="middle" x="554" y="146">12 RVQ codebooks</text>
<line marker-end="url(#mlArr)" stroke="#666" stroke-width="2" x1="624" x2="652" y1="120" y2="120"></line>
<rect fill="#ffcdd2" height="80" rx="8" stroke="#c62828" stroke-width="1.5" width="140" x="652" y="80"></rect>
<text fill="#b71c1c" font-weight="700" text-anchor="middle" x="722" y="100">SoundStream</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="722" y="118">decoder</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="722" y="132">24 kHz</text>
<text fill="#c62828" font-size="9" text-anchor="middle" x="722" y="146">waveform out</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="410" y="195">Coarse to fine: 30 s prompt becomes 750 semantic tokens, then 540 k acoustic tokens, then 720 k samples</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="410" y="213">Each stage trained separately on the upstream stage's tokens as conditioning</text>
</g>
</svg>