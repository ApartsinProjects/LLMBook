<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="SentencePiece training and encoding flow: raw Unicode corpus feeds the trainer which produces a model file containing a vocabulary and unigram scores; at inference the same model file encodes new text via Viterbi to subword pieces and decodes pieces back to the original string." role="img" style="max-width:720px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="spArr" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"></path></marker></defs>
<text fill="#222" font-size="14" font-weight="700" text-anchor="middle" x="360" y="22">SentencePiece: training (top) and encoding / decoding (bottom)</text>
<g font-size="11" text-anchor="middle">
<rect fill="#e3f2fd" height="50" rx="6" stroke="#1565c0" width="140" x="20" y="50"></rect>
<text fill="#0d47a1" font-weight="700" x="90" y="73">raw text</text>
<text fill="#444" x="90" y="90">UTF-8 bytes, no</text>
<text fill="#444" x="90" y="100">pre-tokenization</text>
<rect fill="#fff3e0" height="50" rx="6" stroke="#ef6c00" width="160" x="200" y="50"></rect>
<text fill="#e65100" font-weight="700" x="280" y="73">SentencePieceTrainer</text>
<text fill="#444" x="280" y="90">unigram or BPE</text>
<text fill="#444" x="280" y="100">vocab_size, char_coverage</text>
<rect fill="#e8f5e9" height="50" rx="6" stroke="#2e7d32" width="160" x="400" y="50"></rect>
<text fill="#1b5e20" font-weight="700" x="480" y="73">model file (.model)</text>
<text fill="#444" x="480" y="90">vocab + unigram log-probs</text>
<text fill="#444" x="480" y="100">+ normalization rules</text>
<line marker-end="url(#spArr)" stroke="#555" stroke-width="1.3" x1="160" x2="198" y1="75" y2="75"></line>
<line marker-end="url(#spArr)" stroke="#555" stroke-width="1.3" x1="360" x2="398" y1="75" y2="75"></line>
<rect fill="#e3f2fd" height="50" rx="6" stroke="#1565c0" width="140" x="20" y="150"></rect>
<text fill="#0d47a1" font-weight="700" x="90" y="173">new text</text>
<text fill="#444" x="90" y="190">"Language models"</text>
<rect fill="#fff3e0" height="50" rx="6" stroke="#ef6c00" width="160" x="200" y="150"></rect>
<text fill="#e65100" font-weight="700" x="280" y="173">encode (Viterbi)</text>
<text fill="#444" x="280" y="190">arg max ∏ P(t_i)</text>
<rect fill="#ede7f6" height="50" rx="6" stroke="#6a1b9a" width="160" x="400" y="150"></rect>
<text fill="#4527a0" font-weight="700" x="480" y="173">pieces / IDs</text>
<text fill="#444" x="480" y="190">[▁Lang, uage, ▁models]</text>
<rect fill="#ffebee" height="50" rx="6" stroke="#c62828" width="120" x="580" y="150"></rect>
<text fill="#b71c1c" font-weight="700" x="640" y="173">decode</text>
<text fill="#444" x="640" y="190">lossless round-trip</text>
<line marker-end="url(#spArr)" stroke="#555" stroke-width="1.3" x1="160" x2="198" y1="175" y2="175"></line>
<line marker-end="url(#spArr)" stroke="#555" stroke-width="1.3" x1="360" x2="398" y1="175" y2="175"></line>
<line marker-end="url(#spArr)" stroke="#555" stroke-width="1.3" x1="560" x2="578" y1="175" y2="175"></line>
<line marker-end="url(#spArr)" stroke="#888" stroke-dasharray="3,3" stroke-width="1.1" x1="480" x2="280" y1="100" y2="148"></line>
<text fill="#888" font-style="italic" x="360" y="130">same model file loaded at inference</text>
</g>
</svg>