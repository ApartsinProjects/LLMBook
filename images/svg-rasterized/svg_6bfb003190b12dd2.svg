<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Four-tier benchmark pyramid for retrieval: classical IR at the bottom, BEIR cross-domain, MTEB embedding aggregates, and RAG-specific end-to-end benchmarks at the top" role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewbox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="340" y="22">Four-tier retrieval benchmark landscape</text>
<polygon fill="#dbeafe" points="160,310 520,310 480,250 200,250" stroke="#3a73a8" stroke-width="1.5"></polygon>
<text fill="#2d3748" font-size="13" font-weight="600" text-anchor="middle" x="340" y="278">1. Classical IR (foundational)</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="340" y="295">MS MARCO, TREC-DL, NQ, HotpotQA, FEVER, SciFact, ClueWeb22</text>
<polygon fill="#bee3f8" points="200,250 480,250 440,190 240,190" stroke="#3a73a8" stroke-width="1.5"></polygon>
<text fill="#2d3748" font-size="13" font-weight="600" text-anchor="middle" x="340" y="218">2. Cross-domain transfer</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="340" y="235">BEIR (18 datasets, 9 domains), MIRACL (multilingual)</text>
<polygon fill="#fed7aa" points="240,190 440,190 400,130 280,130" stroke="#d97706" stroke-width="1.5"></polygon>
<text fill="#2d3748" font-size="12" font-weight="600" text-anchor="middle" x="340" y="158">3. Embedding leaderboards</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="340" y="175">MTEB, MMTEB (100+ tasks, 250+ langs)</text>
<polygon fill="#fecaca" points="280,130 400,130 380,75 300,75" stroke="#b91c1c" stroke-width="1.5"></polygon>
<text fill="#2d3748" font-size="11" font-weight="600" text-anchor="middle" x="340" y="100">4. End-to-end RAG</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="340" y="115">FRAMES, RAGAS, BEIR-RAG</text>
<text fill="#4a5568" font-size="10" font-weight="600" x="60" y="100">Asks:</text>
<text fill="#b91c1c" font-size="9" x="60" y="115">does the RAG pipeline work?</text>
<text fill="#d97706" font-size="9" x="60" y="158">does this embedder generalize?</text>
<text fill="#3a73a8" font-size="9" x="60" y="218">does training transfer?</text>
<text fill="#3a73a8" font-size="9" x="60" y="278">does ranking work at all?</text>
<text fill="#4a5568" font-size="10" font-weight="600" text-anchor="end" x="625" y="100">Risk:</text>
<text fill="#b91c1c" font-size="9" text-anchor="end" x="625" y="115">contamination + small N</text>
<text fill="#d97706" font-size="9" text-anchor="end" x="625" y="158">ceiling, gaming</text>
<text fill="#3a73a8" font-size="9" text-anchor="end" x="625" y="218">per-task variance</text>
<text fill="#3a73a8" font-size="9" text-anchor="end" x="625" y="278">old, contamination</text>
<text fill="#718096" font-size="10" font-style="italic" text-anchor="middle" x="340" y="335">Pair public numbers with an in-domain set of 200+ queries you wrote yourself.</text>
</svg>