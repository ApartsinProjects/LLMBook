<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The five-layer pedagogically-scaffolded tutor architecture" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="fig-75-4-1-title fig-75-4-1-desc">
<title id="fig-75-4-1-title">The five-layer pedagogically-scaffolded tutor architecture</title>
<desc id="fig-75-4-1-desc">Pipeline of five stacked layers between student input (left) and student-visible output (right). Layer 1 domain-bounded retrieval (Khan curriculum, no open web). Layer 2 Socratic prompt design (refuses to give answers, the prompt change Sal Khan asked for after his daughter's algebra demo). Layer 3 output filter classifier (accuracy + age-appropriate + on-lesson). Layer 4 teacher visibility (dashboard). Layer 5 engagement throttling (no homework-doing after hours).</desc>
<rect x="0" y="0" width="760" height="380" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">Scaffolded tutor pattern (Khanmigo, Magic School, Duolingo Max all instantiate it)</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- student in -->
<rect x="20" y="160" width="80" height="60" fill="#eaf1ff" stroke="#2c5fa0" rx="4"/>
<text x="60" y="184" text-anchor="middle" font-weight="700" fill="#2c5fa0">Student</text>
<text x="60" y="200" text-anchor="middle" font-size="10">query</text>

<line x1="100" y1="190" x2="120" y2="190" stroke="#5a6573" stroke-width="2" marker-end="url(#arr12)"/>

<!-- layer 1 -->
<rect x="120" y="160" width="115" height="60" fill="#eef5ec" stroke="#1f6f3a" rx="4"/>
<text x="177" y="178" text-anchor="middle" font-weight="700" fill="#1f6f3a">1. Retrieval</text>
<text x="177" y="194" text-anchor="middle" font-size="10">Khan curriculum,</text>
<text x="177" y="208" text-anchor="middle" font-size="10">no open web</text>

<line x1="235" y1="190" x2="255" y2="190" stroke="#5a6573" stroke-width="2" marker-end="url(#arr12)"/>

<!-- layer 2 -->
<rect x="255" y="152" width="125" height="60" fill="#fff5d6" stroke="#b8860b" rx="4"/>
<text x="317" y="178" text-anchor="middle" font-weight="700" fill="#7a5a08">2. Socratic prompt</text>
<text x="317" y="194" text-anchor="middle" font-size="10">"never give answer,</text>
<text x="317" y="208" text-anchor="middle" font-size="10">always ask question"</text>

<line x1="380" y1="190" x2="400" y2="190" stroke="#5a6573" stroke-width="2" marker-end="url(#arr12)"/>

<!-- layer 3 -->
<rect x="400" y="160" width="115" height="60" fill="#ede4f7" stroke="#5a3d99" rx="4"/>
<text x="457" y="178" text-anchor="middle" font-weight="700" fill="#5a3d99">3. Output filter</text>
<text x="457" y="194" text-anchor="middle" font-size="10">accuracy, age-ok,</text>
<text x="457" y="208" text-anchor="middle" font-size="10">on-lesson classifier</text>

<line x1="515" y1="190" x2="535" y2="190" stroke="#5a6573" stroke-width="2" marker-end="url(#arr12)"/>

<!-- layer 5 (rate limit, throttling) -->
<rect x="535" y="160" width="115" height="60" fill="#f1d6d0" stroke="#b2351e" rx="4"/>
<text x="592" y="178" text-anchor="middle" font-weight="700" fill="#b2351e">5. Throttle</text>
<text x="592" y="194" text-anchor="middle" font-size="10">rate limit + after-</text>
<text x="592" y="208" text-anchor="middle" font-size="10">hours rules</text>

<line x1="650" y1="190" x2="670" y2="190" stroke="#5a6573" stroke-width="2" marker-end="url(#arr12)"/>

<!-- student out -->
<rect x="670" y="160" width="70" height="60" fill="#eaf1ff" stroke="#2c5fa0" rx="4"/>
<text x="705" y="184" text-anchor="middle" font-weight="700" fill="#2c5fa0">Hint to</text>
<text x="705" y="200" text-anchor="middle" font-weight="700" fill="#2c5fa0">student</text>

<!-- side branch: teacher visibility -->
<line x1="380" y1="220" x2="380" y2="280" stroke="#5a6573" stroke-width="2" marker-end="url(#arr12)"/>
<rect x="280" y="285" width="200" height="60" fill="#dfeaf5" stroke="#2c5fa0" rx="4"/>
<text x="380" y="305" text-anchor="middle" font-weight="700" fill="#2c5fa0">4. Teacher dashboard</text>
<text x="380" y="322" text-anchor="middle" font-size="10">student queries · LLM replies ·</text>
<text x="380" y="336" text-anchor="middle" font-size="10">struggle hotspots</text>

<!-- origin annotation -->
<text x="380" y="90" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6573">Layer 2 originated when Khanmigo confidently solved Sal Khan's daughter's algebra and Sal politely asked the team to stop.</text>
<text x="380" y="108" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6573">The single-prompt fix that made the product pedagogically credible.</text>

<defs><marker id="arr12" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a6573"/></marker></defs>
</g>
</svg>