<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The 2025-2026 manufacturing LLM landscape in one frame." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" style="max-width:880px;background:#fafafa;border:1px solid #ddd;font-family:sans-serif;">
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle">Four named-vendor cases: 2025-2026 manufacturing LLM deployments</text>
<rect x="40" y="60" width="200" height="140" fill="#fff" stroke="#27ae60" stroke-width="2"/>
<text x="140" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#117a65">Foxconn Foxbrain (2025)</text>
<text x="50" y="106" font-size="10">Llama-base fine-tune</text>
<text x="50" y="120" font-size="10">on Foxconn floor data</text>
<text x="50" y="138" font-size="10" font-weight="700">Pattern:</text>
<text x="50" y="150" font-size="10">manufacturer-internal LLM</text>
<text x="50" y="164" font-size="10">end-to-end owned</text>
<text x="50" y="178" font-size="10" font-weight="700">Uses:</text>
<text x="50" y="190" font-size="10">code-gen + maint Q&amp;A</text>
<rect x="260" y="60" width="200" height="140" fill="#fff" stroke="#27ae60" stroke-width="2"/>
<text x="360" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#117a65">Siemens Industrial Copilot</text>
<text x="270" y="106" font-size="10">integrated with TIA Portal</text>
<text x="270" y="120" font-size="10">RAG over Siemens manuals</text>
<text x="270" y="138" font-size="10" font-weight="700">Pattern:</text>
<text x="270" y="150" font-size="10">OEM-shipped per-equipment</text>
<text x="270" y="164" font-size="10">copilot</text>
<text x="270" y="178" font-size="10" font-weight="700">Uses:</text>
<text x="270" y="190" font-size="10">ladder-logic + equipment Q&amp;A</text>
<rect x="480" y="60" width="200" height="140" fill="#fff" stroke="#27ae60" stroke-width="2"/>
<text x="580" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#117a65">Bosch (2025-2026)</text>
<text x="490" y="106" font-size="10">central platform model</text>
<text x="490" y="120" font-size="10">per-site retrieval corpora</text>
<text x="490" y="138" font-size="10" font-weight="700">Pattern:</text>
<text x="490" y="150" font-size="10">multi-plant operational</text>
<text x="490" y="164" font-size="10">rollout, augmentation</text>
<text x="490" y="178" font-size="10" font-weight="700">Uses:</text>
<text x="490" y="190" font-size="10">shop-floor work-order draft</text>
<rect x="700" y="60" width="160" height="140" fill="#fff" stroke="#27ae60" stroke-width="2"/>
<text x="780" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#117a65">GE Vernova (2025-26)</text>
<text x="710" y="106" font-size="10">heavy-equipment</text>
<text x="710" y="120" font-size="10">field-service AI</text>
<text x="710" y="138" font-size="10" font-weight="700">Pattern:</text>
<text x="710" y="150" font-size="10">copilot above existing</text>
<text x="710" y="164" font-size="10">mobile field app</text>
<text x="710" y="178" font-size="10" font-weight="700">Uses:</text>
<text x="710" y="190" font-size="10">gas / wind / grid maint</text>
<text x="440" y="230" font-size="12" font-weight="700" text-anchor="middle">Three industry-wide postmortems that shaped the reference architecture</text>
<rect x="40" y="250" width="260" height="110" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
<text x="170" y="272" font-size="12" font-weight="700" text-anchor="middle" fill="#922b21">2024 torque-spec hallucination</text>
<text x="50" y="294" font-size="10">automotive supplier pilot</text>
<text x="50" y="308" font-size="10">no mandatory citation</text>
<text x="50" y="328" font-size="10" font-weight="700">Lesson:</text>
<text x="50" y="342" font-size="10">cite manual page + revision,</text>
<text x="50" y="354" font-size="10">refuse outside corpus</text>
<rect x="310" y="250" width="260" height="110" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
<text x="440" y="272" font-size="12" font-weight="700" text-anchor="middle" fill="#922b21">2023-24 procurement-agent pauses</text>
<text x="320" y="294" font-size="10">Fortune 500 manufacturers</text>
<text x="320" y="308" font-size="10">acted on individual signals,</text>
<text x="320" y="322" font-size="10">missed macro context</text>
<text x="320" y="342" font-size="10" font-weight="700">Lesson:</text>
<text x="320" y="354" font-size="10">brief-and-recommend, human on contracts</text>
<rect x="580" y="250" width="280" height="110" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
<text x="720" y="272" font-size="12" font-weight="700" text-anchor="middle" fill="#922b21">Pre-LLM: Boeing 737 MAX MCAS (2018-19)</text>
<text x="590" y="294" font-size="10">automation overrode pilot judgment</text>
<text x="590" y="308" font-size="10">no transparency, no override path</text>
<text x="590" y="328" font-size="10" font-weight="700">Lesson:</text>
<text x="590" y="342" font-size="10">LLM never holds the safety case,</text>
<text x="590" y="354" font-size="10">no unilateral authority over OT</text>
</svg>