<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: a two-stage retrieval architecture. Stage 1 is a cheap candidate generator (CF, two-tower, BM25) that maps millions of items to a few hundred candidates with low latency. Stage 2 is an LLM reranker that reads the top 50 plus the user query and writes the final top-k list with optional justifications, taking 100 to 300 milliseconds. The latency budget bar at the bottom shows where each stage spends its time." role="img" viewbox="0 0 820 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arr386" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="3.5" viewbox="0 0 7 7"><path d="M0,0 L7,3.5 L0,7 z" fill="#444"></path></marker>
<filter height="115%" id="ds386" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<!-- Catalog -->
<rect fill="#ecf0f1" filter="url(#ds386)" height="60" rx="6" stroke="#2c3e50" stroke-width="2" width="130" x="20" y="80"></rect>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="85" y="105">Catalog</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="85" y="123">millions of items</text>
<!-- Stage 1 -->
<rect fill="#eaf5ff" filter="url(#ds386)" height="80" rx="8" stroke="#2980b9" stroke-width="2" width="200" x="190" y="70"></rect>
<text fill="#1f618d" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="290" y="92">Stage 1: Candidate Generator</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="290" y="112">CF / two-tower / BM25 + dense</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle" x="290" y="132">10 to 50 ms; top-500</text>
<!-- Candidates -->
<rect fill="#fef5e7" filter="url(#ds386)" height="60" rx="6" stroke="#e67e22" stroke-width="2" width="130" x="430" y="80"></rect>
<text fill="#a05a16" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="495" y="105">Candidates</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="495" y="123">top-50 to top-200</text>
<!-- Stage 2 -->
<rect fill="#e8f5e9" filter="url(#ds386)" height="80" rx="8" stroke="#27ae60" stroke-width="2" width="200" x="600" y="70"></rect>
<text fill="#1e8449" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="700" y="92">Stage 2: LLM Reranker</text>
<text fill="#444" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="700" y="112">rerank + justify</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle" x="700" y="132">100 to 300 ms; top-5</text>
<!-- Arrows -->
<line marker-end="url(#arr386)" stroke="#444" stroke-width="2" x1="152" x2="188" y1="110" y2="110"></line>
<line marker-end="url(#arr386)" stroke="#444" stroke-width="2" x1="392" x2="428" y1="110" y2="110"></line>
<line marker-end="url(#arr386)" stroke="#444" stroke-width="2" x1="562" x2="598" y1="110" y2="110"></line>
<!-- Latency bar -->
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" x="20" y="195">Total latency budget (typ. 500 ms):</text>
<rect fill="#2980b9" height="22" stroke="#1f618d" stroke-width="1" width="48" x="20" y="210"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle" x="44" y="225">cand-gen</text>
<rect fill="#27ae60" height="22" stroke="#1e8449" stroke-width="1" width="320" x="68" y="210"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle" x="228" y="225">LLM rerank (dominates)</text>
<rect fill="#ecf0f1" height="22" stroke="#7f8c8d" stroke-width="1" width="112" x="388" y="210"></rect>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-style="italic" text-anchor="middle" x="444" y="225">network + slack</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="9" text-anchor="end" x="500" y="248">~50 ms     ~300 ms     ~150 ms</text>
<!-- Counter-pattern: full-LLM scoring -->
<text fill="#c0392b" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" x="20" y="280">Counter-pattern (full-LLM scoring): does NOT fit in this budget for catalogs &gt; 10K items.</text>
</svg>