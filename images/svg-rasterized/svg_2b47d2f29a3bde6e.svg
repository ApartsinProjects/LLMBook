<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Byte Pair Encoding builds its vocabulary bottom-up. Words start split into individual characters. At each step the algorithm counts every adjacent symbol pair across the whole corpus, finds the single most frequent pair, and merges it into one new token, adding that merge to a merge table. After merging the most frequent pair e-s into es, then es-t into est, then l-o into lo, frequent suffixes and word fragments emerge as single tokens. The same merge table is later replayed to tokenize new text." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="bpeChar" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e3f2fd"></stop><stop offset="100%" stop-color="#90caf9"></stop></lineargradient>
<lineargradient id="bpeMerge" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"></stop><stop offset="100%" stop-color="#43a047"></stop></lineargradient>
<lineargradient id="bpeHot" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffe0b2"></stop><stop offset="100%" stop-color="#fb8c00"></stop></lineargradient>
<lineargradient id="bpeTable" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ede7f6"></stop><stop offset="100%" stop-color="#b39ddb"></stop></lineargradient>
<filter height="112%" id="bpeShadow" width="112%" x="-6%" y="-6%"><fedropshadow dx="1" dy="2" flood-opacity="0.18" stddeviation="2"></fedropshadow></filter>
<marker id="bpeArrow" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"></path></marker>
</defs>
<rect fill="#fafafa" height="400" rx="8" width="800" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="400" y="26">BPE bottom-up: count pairs, merge the most frequent, repeat</text>
<!-- column headers -->
<text fill="#1e88e5" font-size="12" font-weight="600" text-anchor="middle" x="120" y="58">start: characters</text>
<text fill="#fb8c00" font-size="12" font-weight="600" text-anchor="middle" x="355" y="58">after merge 1: e+s</text>
<text fill="#43a047" font-size="12" font-weight="600" text-anchor="middle" x="590" y="58">after merge 2: es+t</text>
<!-- helper: token chips. Word 'lowest' across stages -->
<!-- stage 0 -->
<g font-size="12" font-weight="600" text-anchor="middle">
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="40" y="78"></rect><text fill="#1565c0" x="53" y="97">l</text>
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="68" y="78"></rect><text fill="#1565c0" x="81" y="97">o</text>
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="96" y="78"></rect><text fill="#1565c0" x="109" y="97">w</text>
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="124" y="78"></rect><text fill="#1565c0" x="137" y="97">e</text>
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="152" y="78"></rect><text fill="#1565c0" x="165" y="97">s</text>
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="180" y="78"></rect><text fill="#1565c0" x="193" y="97">t</text>
</g>
<text fill="#888" font-size="10" text-anchor="middle" x="123" y="126">"lowest" = 6 tokens</text>
<!-- highlight e+s pair -->
<rect fill="none" height="36" rx="6" stroke="#fb8c00" stroke-dasharray="4,2" stroke-width="2.2" width="58" x="123" y="74"></rect>
<text fill="#fb8c00" font-size="10" font-weight="600" text-anchor="middle" x="152" y="150">most frequent pair</text>
<!-- arrow to stage 1 -->
<line marker-end="url(#bpeArrow)" stroke="#777" stroke-width="2" x1="212" x2="272" y1="92" y2="92"></line>
<!-- stage 1 -->
<g font-size="12" font-weight="600" text-anchor="middle">
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="276" y="78"></rect><text fill="#1565c0" x="289" y="97">l</text>
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="304" y="78"></rect><text fill="#1565c0" x="317" y="97">o</text>
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="332" y="78"></rect><text fill="#1565c0" x="345" y="97">w</text>
<rect fill="url(#bpeHot)" height="28" rx="5" width="40" x="360" y="78"></rect><text fill="#fff" x="380" y="97">es</text>
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="402" y="78"></rect><text fill="#1565c0" x="415" y="97">t</text>
</g>
<text fill="#888" font-size="10" text-anchor="middle" x="352" y="126">5 tokens</text>
<rect fill="none" height="36" rx="6" stroke="#43a047" stroke-dasharray="4,2" stroke-width="2.2" width="68" x="360" y="74"></rect>
<text fill="#43a047" font-size="10" font-weight="600" text-anchor="middle" x="394" y="150">next: es + t</text>
<!-- arrow to stage 2 -->
<line marker-end="url(#bpeArrow)" stroke="#777" stroke-width="2" x1="434" x2="496" y1="92" y2="92"></line>
<!-- stage 2 -->
<g font-size="12" font-weight="600" text-anchor="middle">
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="500" y="78"></rect><text fill="#1565c0" x="513" y="97">l</text>
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="528" y="78"></rect><text fill="#1565c0" x="541" y="97">o</text>
<rect fill="url(#bpeChar)" height="28" rx="5" width="26" x="556" y="78"></rect><text fill="#1565c0" x="569" y="97">w</text>
<rect fill="url(#bpeMerge)" height="28" rx="5" width="50" x="584" y="78"></rect><text fill="#fff" x="609" y="97">est</text>
</g>
<text fill="#888" font-size="10" text-anchor="middle" x="567" y="126">4 tokens: suffix learned</text>
<!-- the loop box -->
<rect fill="#fff" height="180" rx="10" stroke="#cfd8dc" stroke-width="1.4" width="430" x="40" y="180"></rect>
<text fill="#333" font-size="12" font-weight="600" text-anchor="middle" x="255" y="204">the merge loop (repeat to target vocab size)</text>
<!-- step circles -->
<g>
<circle cx="110" cy="252" fill="url(#bpeChar)" filter="url(#bpeShadow)" r="30"></circle><text fill="#1565c0" font-size="10" font-weight="600" text-anchor="middle" x="110" y="249">count</text><text fill="#1565c0" font-size="10" font-weight="600" text-anchor="middle" x="110" y="262">pairs</text>
<circle cx="255" cy="252" fill="url(#bpeHot)" filter="url(#bpeShadow)" r="30"></circle><text fill="#fff" font-size="10" font-weight="600" text-anchor="middle" x="255" y="249">pick</text><text fill="#fff" font-size="10" font-weight="600" text-anchor="middle" x="255" y="262">top</text>
<circle cx="400" cy="252" fill="url(#bpeMerge)" filter="url(#bpeShadow)" r="30"></circle><text fill="#fff" font-size="10" font-weight="600" text-anchor="middle" x="400" y="249">merge</text><text fill="#fff" font-size="10" font-weight="600" text-anchor="middle" x="400" y="262">+ record</text>
</g>
<line marker-end="url(#bpeArrow)" stroke="#777" stroke-width="2" x1="140" x2="221" y1="252" y2="252"></line>
<line marker-end="url(#bpeArrow)" stroke="#777" stroke-width="2" x1="285" x2="366" y1="252" y2="252"></line>
<path d="M400 282 C 400 330, 110 330, 110 284" fill="none" marker-end="url(#bpeArrow)" stroke="#777" stroke-dasharray="5,3" stroke-width="1.8"></path>
<text fill="#888" font-size="10" text-anchor="middle" x="255" y="346">loop until vocabulary is full</text>
<!-- merge table -->
<rect fill="url(#bpeTable)" filter="url(#bpeShadow)" height="180" rx="10" width="262" x="500" y="180"></rect>
<text fill="#4527a0" font-size="12" font-weight="700" text-anchor="middle" x="631" y="206">merge table (ordered)</text>
<g fill="#311b92" font-size="12" font-weight="600">
<rect fill="#fff" height="30" opacity="0.85" rx="5" width="222" x="520" y="220"></rect><text x="532" y="240">1.  e + s → es</text>
<rect fill="#fff" height="30" opacity="0.85" rx="5" width="222" x="520" y="256"></rect><text x="532" y="276">2.  es + t → est</text>
<rect fill="#fff" height="30" opacity="0.85" rx="5" width="222" x="520" y="292"></rect><text x="532" y="312">3.  l + o → lo</text>
</g>
<text fill="#4527a0" font-size="10" text-anchor="middle" x="631" y="346">replayed in order to tokenize new text</text>
<text fill="#888" font-size="11" text-anchor="middle" x="400" y="386">WordPiece uses the same loop but picks the pair with the highest likelihood gain, not raw frequency.</text>
</svg>