<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The four main soft prompt methods differ in where they insert their learnable parameters. Prompt Tuning touches only the input embedding layer; Prefix Tuning and P-Tuning v2 inject learned key-value pairs into every attention layer; P-Tuning v1 uses a trainable encoder to place embeddings at chosen input positions." font-family="Segoe UI, system-ui, sans-serif" role="img" viewbox="0 0 760 310" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_pt" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e3f2fd"></stop><stop offset="100%" stop-color="#bbdefb"></stop></lineargradient>
<lineargradient id="grad_pfx" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f3e5f5"></stop><stop offset="100%" stop-color="#e1bee7"></stop></lineargradient>
<lineargradient id="grad_pt2" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e8f5e9"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
</defs>
<!-- Legend -->
<!-- Column labels -->
<text fill="#1565c0" font-size="12" font-weight="bold" text-anchor="middle" x="140" y="50">Prompt Tuning</text>
<text fill="#6a1b9a" font-size="12" font-weight="bold" text-anchor="middle" x="350" y="50">Prefix Tuning / P-Tuning v2</text>
<text fill="#2e7d32" font-size="12" font-weight="bold" text-anchor="middle" x="580" y="50">P-Tuning v1</text>
<!-- Prompt Tuning diagram -->
<rect fill="url(#grad_pt)" height="34" rx="5" stroke="#1565c0" stroke-width="1.5" width="160" x="60" y="60"></rect>
<text fill="#1565c0" font-size="11" text-anchor="middle" x="140" y="82">Soft tokens [Layer 0]</text>
<rect fill="#f5f5f5" height="28" rx="4" stroke="#999" stroke-width="1" width="160" x="60" y="102"></rect>
<text fill="#555" font-size="10" text-anchor="middle" x="140" y="121">Transformer Block 1</text>
<rect fill="#f5f5f5" height="28" rx="4" stroke="#999" stroke-width="1" width="160" x="60" y="138"></rect>
<text fill="#555" font-size="10" text-anchor="middle" x="140" y="157">Transformer Block 2</text>
<text fill="#999" font-size="10" text-anchor="middle" x="140" y="184">... (no changes)</text>
<rect fill="#f5f5f5" height="28" rx="4" stroke="#999" stroke-width="1" width="160" x="60" y="192"></rect>
<text fill="#555" font-size="10" text-anchor="middle" x="140" y="211">Transformer Block N</text>
<text fill="#1565c0" font-size="10" text-anchor="middle" x="140" y="243">Parameters: &lt; 0.01%</text>
<!-- Prefix Tuning / P-Tuning v2 diagram -->
<rect fill="url(#grad_pfx)" height="34" rx="5" stroke="#6a1b9a" stroke-width="1.5" width="170" x="265" y="60"></rect>
<text fill="#6a1b9a" font-size="11" text-anchor="middle" x="350" y="82">Prefix KV [Layer 0]</text>
<rect fill="url(#grad_pfx)" height="28" rx="4" stroke="#6a1b9a" stroke-width="1.5" width="170" x="265" y="102"></rect>
<text fill="#6a1b9a" font-size="10" text-anchor="middle" x="350" y="121">Prefix KV [Block 1]</text>
<rect fill="url(#grad_pfx)" height="28" rx="4" stroke="#6a1b9a" stroke-width="1.5" width="170" x="265" y="138"></rect>
<text fill="#6a1b9a" font-size="10" text-anchor="middle" x="350" y="157">Prefix KV [Block 2]</text>
<text fill="#6a1b9a" font-size="10" text-anchor="middle" x="350" y="184">... (every layer)</text>
<rect fill="url(#grad_pfx)" height="28" rx="4" stroke="#6a1b9a" stroke-width="1.5" width="170" x="265" y="192"></rect>
<text fill="#6a1b9a" font-size="10" text-anchor="middle" x="350" y="211">Prefix KV [Block N]</text>
<text fill="#6a1b9a" font-size="10" text-anchor="middle" x="350" y="243">Parameters: 0.1 - 1%</text>
<!-- P-Tuning v1 diagram -->
<rect fill="url(#grad_pt2)" height="34" rx="5" stroke="#2e7d32" stroke-width="1.5" width="160" x="500" y="60"></rect>
<text fill="#2e7d32" font-size="11" text-anchor="middle" x="580" y="75">LSTM/MLP Encoder</text>
<text fill="#2e7d32" font-size="10" text-anchor="middle" x="580" y="89">(generates embeddings)</text>
<rect fill="#f5f5f5" height="28" rx="4" stroke="#999" stroke-width="1" width="160" x="500" y="102"></rect>
<text fill="#555" font-size="10" text-anchor="middle" x="580" y="121">Input layer (selected positions)</text>
<rect fill="#f5f5f5" height="28" rx="4" stroke="#999" stroke-width="1" width="160" x="500" y="138"></rect>
<text fill="#555" font-size="10" text-anchor="middle" x="580" y="157">Transformer Block 2</text>
<text fill="#999" font-size="10" text-anchor="middle" x="580" y="184">... (no changes)</text>
<rect fill="#f5f5f5" height="28" rx="4" stroke="#999" stroke-width="1" width="160" x="500" y="192"></rect>
<text fill="#555" font-size="10" text-anchor="middle" x="580" y="211">Transformer Block N</text>
<text fill="#2e7d32" font-size="10" text-anchor="middle" x="580" y="243">Parameters: ~0.01-0.1%</text>
<!-- Timeline row -->
<rect fill="#fafafa" height="36" rx="6" stroke="#ddd" stroke-width="1" width="720" x="20" y="260"></rect>
<text fill="#333" font-size="11" font-weight="bold" text-anchor="middle" x="380" y="274">Timeline</text>
<text fill="#1565c0" font-size="10" text-anchor="middle" x="100" y="288">Prompt Tuning 2021</text>
<text fill="#6a1b9a" font-size="10" text-anchor="middle" x="290" y="288">Prefix Tuning 2021</text>
<text fill="#2e7d32" font-size="10" text-anchor="middle" x="490" y="288">P-Tuning v1 2021</text>
<text fill="#e65100" font-size="10" text-anchor="middle" x="660" y="288">P-Tuning v2 2022</text>
</svg>