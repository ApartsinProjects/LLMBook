<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: Alerting for LLM Applications" role="img" style="font-family: sans-serif;" viewBox="0 -9 750 269" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow5b" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<!-- Performance alerts -->
<rect fill="white" height="190" rx="10" stroke="#2980b9" stroke-linecap="round" stroke-width="2" width="220" x="20" y="50"></rect>
<rect fill="#2980b9" height="35" rx="10" width="220" x="20" y="50"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="130" y="73">Performance</text>
<text fill="#333" font-size="11" x="35" y="105">Latency p95 &gt; 5s</text>
<text fill="#333" font-size="11" x="35" y="125">Error rate &gt; 1%</text>
<text fill="#333" font-size="11" x="35" y="145">Token/request &gt; 2x baseline</text>
<text fill="#333" font-size="11" x="35" y="165">Timeout rate &gt; 0.5%</text>
<text fill="#333" font-size="11" x="35" y="185">Queue depth &gt; 100</text>
<!-- Cost alerts -->
<rect fill="white" height="190" rx="10" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="220" x="265" y="50"></rect>
<rect fill="#f39c12" height="35" rx="10" width="220" x="265" y="50"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="375" y="73">Cost &amp; Usage</text>
<text fill="#333" font-size="11" x="280" y="105">Daily spend &gt; $X threshold</text>
<text fill="#333" font-size="11" x="280" y="125">Cost per request spike &gt; 3x</text>
<text fill="#333" font-size="11" x="280" y="145">Token usage anomaly</text>
<text fill="#333" font-size="11" x="280" y="165">Rate limit approaching</text>
<text fill="#333" font-size="11" x="280" y="185">Unused prompt cache drop</text>
<!-- Quality alerts -->
<rect fill="white" height="190" rx="10" stroke="#e74c3c" stroke-linecap="round" stroke-width="2" width="220" x="510" y="50"></rect>
<rect fill="#e74c3c" height="35" rx="10" width="220" x="510" y="50"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="620" y="73">Quality &amp; Safety</text>
<text fill="#333" font-size="11" x="525" y="105">Faithfulness score &lt; 0.7</text>
<text fill="#333" font-size="11" x="525" y="125">Hallucination rate &gt; 5%</text>
<text fill="#333" font-size="11" x="525" y="145">Safety filter triggers &gt; N</text>
<text fill="#333" font-size="11" x="525" y="165">User thumbs-down spike</text>
<text fill="#333" font-size="11" x="525" y="185">Prompt injection detected</text>
</svg>