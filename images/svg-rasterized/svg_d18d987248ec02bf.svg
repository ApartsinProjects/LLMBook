<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Enterprise LLM gateway: five integration domains around a central control plane" viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="460" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Five enterprise integration domains meeting at the LLM gateway</text>
<!-- Central gateway -->
<g transform="translate(380,200)">
<rect x="0" y="8" width="120" height="80" rx="6" fill="#1a1a2e"/>
<text x="60" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">LLM Gateway</text>
<text x="60" y="40" font-size="9" text-anchor="middle" fill="#ffffff">LiteLLM Proxy</text>
<text x="60" y="54" font-size="9" text-anchor="middle" fill="#ffffff">Kong + Istio</text>
<text x="60" y="68" font-size="8" font-style="italic" text-anchor="middle" fill="#cfcfcf">+10-50 ms latency</text>
</g>
<!-- 5 domain boxes around it -->
<!-- 1. Identity (top) -->
<g transform="translate(380,60)">
<rect x="0" y="8" width="120" height="64" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
<text x="60" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">Identity &amp; Access</text>
<text x="60" y="34" font-size="9" text-anchor="middle" fill="#1a1a2e">Okta, Azure AD/Entra</text>
<text x="60" y="48" font-size="9" text-anchor="middle" fill="#1a1a2e">OAuth2 / SAML</text>
<text x="60" y="62" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">per-team budgets</text>
</g>
<!-- 2. Data (right) -->
<g transform="translate(620,180)">
<rect x="0" y="8" width="140" height="64" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="70" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">Data &amp; Context</text>
<text x="70" y="34" font-size="9" text-anchor="middle" fill="#1a1a2e">Snowflake, BigQuery,</text>
<text x="70" y="48" font-size="9" text-anchor="middle" fill="#1a1a2e">Databricks (row-level)</text>
<text x="70" y="62" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">RAG with RLS</text>
</g>
<!-- 3. Workflow (bottom right) -->
<g transform="translate(580,340)">
<rect x="0" y="8" width="160" height="64" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
<text x="80" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">Workflow / System of Record</text>
<text x="80" y="34" font-size="9" text-anchor="middle" fill="#1a1a2e">ServiceNow tickets,</text>
<text x="80" y="48" font-size="9" text-anchor="middle" fill="#1a1a2e">Salesforce records</text>
<text x="80" y="62" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">structured outputs</text>
</g>
<!-- 4. Observability (bottom left) -->
<g transform="translate(140,340)">
<rect x="0" y="8" width="160" height="64" rx="6" fill="#e3e8f5" stroke="#3d4d8a" stroke-width="2"/>
<text x="80" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#3d4d8a">Observability &amp; Audit</text>
<text x="80" y="34" font-size="9" text-anchor="middle" fill="#1a1a2e">Langfuse / LangSmith,</text>
<text x="80" y="48" font-size="9" text-anchor="middle" fill="#1a1a2e">Datadog, Grafana</text>
<text x="80" y="62" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">separate audit log</text>
</g>
<!-- 5. Compliance (left) -->
<g transform="translate(120,180)">
<rect x="0" y="8" width="140" height="64" rx="6" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="2"/>
<text x="70" y="18" font-size="11" font-weight="700" text-anchor="middle" fill="#7a2a2a">Compliance</text>
<text x="70" y="34" font-size="9" text-anchor="middle" fill="#1a1a2e">PII redaction, AI Act,</text>
<text x="70" y="48" font-size="9" text-anchor="middle" fill="#1a1a2e">HIPAA, SOC 2, ISO 27001</text>
<text x="70" y="62" font-size="8" font-style="italic" text-anchor="middle" fill="#5a4a3a">policy at the edge</text>
</g>
<!-- Connectors -->
<g stroke="#1a1a2e" stroke-width="1.5" fill="none">
<path d="M 440 124 L 440 200" marker-end="url(#arr572)"/>
<path d="M 620 220 L 500 240" marker-end="url(#arr572)"/>
<path d="M 580 360 L 500 280" marker-end="url(#arr572)"/>
<path d="M 220 340 L 400 280" marker-end="url(#arr572)"/>
<path d="M 260 220 L 380 240" marker-end="url(#arr572)"/>
</g>
<!-- Downstream LLM backends -->
<g transform="translate(380,408)">
<rect x="-130" y="0" width="380" height="42" rx="4" fill="#fafafa" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="60" y="16" font-size="10" font-weight="700" text-anchor="middle" fill="#1a1a2e">Downstream model layer</text>
<text x="60" y="32" font-size="9" text-anchor="middle" fill="#5a4a3a">Azure OpenAI regional / Bedrock PrivateLink / self-hosted vLLM / Anthropic API</text>
</g>
<path d="M 440 280 L 440 408" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr572)"/>
<defs><marker id="arr572" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#1a1a2e"/></marker></defs>
</svg>