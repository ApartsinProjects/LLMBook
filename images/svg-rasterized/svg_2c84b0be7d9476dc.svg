<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="GPipe (all-forward-then-all-backward) versus 1F1B (one-forward-one-backward) pipeline schedules across four stages and four micro-batches, showing how 1F1B reduces idle bubble time and peak activation memory" role="img" style="font-family: sans-serif; max-width: 100%; height: auto;" viewbox="-20 -20 940 460" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="460" width="940" x="-20" y="-20"></rect>
<!-- GPipe -->
<g transform="translate(40, 60)">
<text fill="#1a4078" font-size="14" font-weight="700" x="0" y="0">GPipe (all-F-then-all-B), 4 stages × 4 micro-batches</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" x="0" y="18">Large idle bubbles at start, middle (between F and B), and end.</text>
<!-- Stage labels -->
<g transform="translate(0, 28)">
<text font-size="10" font-weight="600" text-anchor="end" x="-4" y="22">S0</text>
<text font-size="10" font-weight="600" text-anchor="end" x="-4" y="42">S1</text>
<text font-size="10" font-weight="600" text-anchor="end" x="-4" y="62">S2</text>
<text font-size="10" font-weight="600" text-anchor="end" x="-4" y="82">S3</text>
</g>
<!-- GPipe grid 16 time slots, 4 stages. Each slot 38 wide, 16 tall. -->
<!-- Stage 0: F1 F2 F3 F4 _ _ _ _ _ _ _ _ B4 B3 B2 B1 -->
<!-- Stage 1: _ F1 F2 F3 F4 _ _ _ _ _ _ B4 B3 B2 B1 _ -->
<!-- Stage 2: _ _ F1 F2 F3 F4 _ _ _ _ B4 B3 B2 B1 _ _ -->
<!-- Stage 3: _ _ _ F1 F2 F3 F4 B4 B3 B2 B1 _ _ _ _ _ -->
<g transform="translate(0, 38)">
