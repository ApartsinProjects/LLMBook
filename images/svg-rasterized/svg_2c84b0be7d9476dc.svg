<!-- 1F1B -->
<g transform="translate(40, 250)">
<text fill="#1f7a3a" font-size="14" font-weight="700" x="0" y="0">1F1B (one-forward-one-backward), same shape, much smaller bubble</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" x="0" y="18">After warm-up, each stage strictly alternates F and B. Steady-state has zero idle.</text>
<g transform="translate(0, 28)">
