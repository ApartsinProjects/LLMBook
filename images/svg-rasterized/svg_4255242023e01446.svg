<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="QLoRA stack: 4-bit quantized base weights frozen, paired with a small set of trainable LoRA adapter matrices that absorb the fine-tuning gradient." role="img" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
<rect x="40" y="40" width="240" height="140" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" rx="6"/><text x="160" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a148c">Base (frozen)</text><text x="160" y="90" font-size="12" text-anchor="middle">4-bit NF4 weights</text><text x="160" y="115" font-size="12" text-anchor="middle">paged optimizer</text><text x="160" y="140" font-size="11" text-anchor="middle" fill="#888">~16 GB for 70B</text><rect x="340" y="40" width="240" height="140" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="6"/><text x="460" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">LoRA Adapter (trainable)</text><text x="460" y="95" font-size="12" text-anchor="middle">A (r x d) + B (d x r)</text><text x="460" y="120" font-size="12" text-anchor="middle">r typically 16-64</text><text x="460" y="145" font-size="11" text-anchor="middle" fill="#888">~0.1 GB trainable</text><path d="M 280 110 L 340 110" stroke="#555" stroke-width="2" marker-end="url(#a17)"/><defs><marker id="a17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
</svg>