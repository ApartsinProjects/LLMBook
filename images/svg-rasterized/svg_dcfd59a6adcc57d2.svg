<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: 2.3 TIES (TRIM, Elect Sign, merge)" font-family="Segoe UI, system-ui, sans-serif" role="img" viewbox="0 -10 700 290" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_571eb4_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#f3e5f5"></stop></lineargradient>
<lineargradient id="grad_571eb4_ffcdd2" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffdce1"></stop><stop offset="100%" stop-color="#ffcdd2"></stop></lineargradient>
<lineargradient id="grad_571eb4_c8e6c9" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d7f5d8"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
<lineargradient id="grad_571eb4_f5f5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f5f5f5"></stop></lineargradient>
<lineargradient id="grad_571eb4_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_571eb4" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<!-- Step 1: Trim -->
<rect fill="url(#grad_571eb4_e8f4fd)" filter="url(#shadow_571eb4)" height="110" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="1.5" width="190" x="30" y="50"></rect>
<text fill="#1565c0" font-size="13" font-weight="bold" text-anchor="middle" x="125" y="75">1. TRIM</text>
<text fill="#555" font-size="11" text-anchor="middle" x="125" y="98">Remove small changes</text>
<text fill="#555" font-size="11" text-anchor="middle" x="125" y="115">(likely noise)</text>
<rect fill="url(#grad_571eb4_c8e6c9)" height="15" stroke="#2e7d32" stroke-linecap="round" stroke-width="1" width="20" x="55" y="128"></rect>
<rect fill="url(#grad_571eb4_ffcdd2)" height="15" stroke="#c62828" stroke-linecap="round" stroke-width="1" width="20" x="80" y="128"></rect>
<rect fill="url(#grad_571eb4_c8e6c9)" height="15" stroke="#2e7d32" stroke-linecap="round" stroke-width="1" width="20" x="105" y="128"></rect>
<rect fill="#eee" height="15" stroke="#999" stroke-dasharray="2" stroke-linecap="round" stroke-width="1" width="20" x="130" y="128"></rect>
<rect fill="#eee" height="15" stroke="#999" stroke-dasharray="2" stroke-linecap="round" stroke-width="1" width="20" x="155" y="128"></rect>
<text fill="#888" font-size="11" text-anchor="middle" x="125" y="155">Dashed = trimmed</text>
<!-- Arrow -->
<text fill="#333" font-size="24" text-anchor="middle" x="235" y="110">→</text>
<!-- Step 2: Elect Sign -->
<rect fill="#e8f5e9" height="110" rx="8" stroke="#2e7d32" stroke-linecap="round" stroke-width="1.5" width="190" x="255" y="50"></rect>
<text fill="#2e7d32" font-size="13" font-weight="bold" text-anchor="middle" x="350" y="75">2. ELECT SIGN</text>
<text fill="#555" font-size="11" text-anchor="middle" x="350" y="98">Majority vote on</text>
<text fill="#555" font-size="11" text-anchor="middle" x="350" y="115">direction of change</text>
<text fill="#2e7d32" font-size="11" x="285" y="140">Model A: +0.3</text>
<text fill="#c62828" font-size="11" x="285" y="155">Model B: -0.1</text>
<text fill="#2e7d32" font-size="11" font-weight="bold" x="380" y="148">Elect: +</text>
<!-- Arrow -->
<text fill="#333" font-size="24" text-anchor="middle" x="460" y="110">→</text>
<!-- Step 3: Merge -->
<rect fill="url(#grad_571eb4_f3e5f5)" height="110" rx="8" stroke="#7b1fa2" stroke-linecap="round" stroke-width="1.5" width="190" x="480" y="50"></rect>
<text fill="#7b1fa2" font-size="13" font-weight="bold" text-anchor="middle" x="575" y="75">3. MERGE</text>
<text fill="#555" font-size="11" text-anchor="middle" x="575" y="98">Average only values</text>
<text fill="#555" font-size="11" text-anchor="middle" x="575" y="115">matching elected sign</text>
<text fill="#555" font-size="11" text-anchor="middle" x="575" y="140">Keep +0.3 from A</text>
<text fill="#555" font-size="11" text-anchor="middle" x="575" y="155">Zero out -0.1 from B</text>
<!-- Result -->
<rect fill="url(#grad_571eb4_f5f5f5)" height="60" rx="6" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="440" x="130" y="200"></rect>
<text fill="#333" font-size="12" font-weight="bold" text-anchor="middle" x="350" y="225">Result: Cleaner merge with less destructive interference</text>
<text fill="#555" font-size="11" text-anchor="middle" x="350" y="245">Particularly effective when merging 3+ models with conflicting changes</text>
</svg>