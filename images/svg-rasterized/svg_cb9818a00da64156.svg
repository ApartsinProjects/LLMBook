<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="RLHF (PPO) vs DPO vs GRPO: model footprint and training loop" style="font-family:sans-serif;max-width:100%;height:auto;" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="260" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="360" y="22">RLHF (PPO) vs DPO vs GRPO: model footprint and training loop</text>
<g transform="translate(20,46)">
<rect fill="#fff3e0" height="200" rx="8" stroke="#a67c1a" stroke-width="2" width="220"></rect>
<text fill="#a67c1a" font-size="12" font-weight="700" text-anchor="middle" x="110" y="22">PPO (classical RLHF)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="110" y="44">4 models in memory:</text>
<text fill="#1a1a2e" font-family="monospace" font-size="10" text-anchor="middle" x="110" y="62">policy + ref + reward + value</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="110" y="86">loop: sample → score →</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="110" y="102">advantage(GAE) → clipped update</text>
<text fill="#a67c1a" font-size="10" font-style="italic" text-anchor="middle" x="110" y="132">Best: subjective quality</text>
<text fill="#a67c1a" font-size="10" font-style="italic" text-anchor="middle" x="110" y="148">at frontier scale (GPT-4, Claude)</text>
<text fill="#666" font-size="10" text-anchor="middle" x="110" y="170">Cost: high, infra-heavy</text>
</g>
<g transform="translate(250,46)">
<rect fill="#e8f5e9" height="200" rx="8" stroke="#2e7d32" stroke-width="2" width="220"></rect>
<text fill="#2e7d32" font-size="12" font-weight="700" text-anchor="middle" x="110" y="22">DPO</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="110" y="44">2 models in memory:</text>
<text fill="#1a1a2e" font-family="monospace" font-size="10" text-anchor="middle" x="110" y="62">policy + ref</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="110" y="86">loop: offline preference pairs</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="110" y="102">log-sigmoid contrastive loss</text>
<text fill="#2e7d32" font-size="10" font-style="italic" text-anchor="middle" x="110" y="132">Best: fast iteration,</text>
<text fill="#2e7d32" font-size="10" font-style="italic" text-anchor="middle" x="110" y="148">stable, SFT-like training</text>
<text fill="#666" font-size="10" text-anchor="middle" x="110" y="170">Cost: low</text>
</g>
<g transform="translate(480,46)">
<rect fill="#e3f2fd" height="200" rx="8" stroke="#1565c0" stroke-width="2" width="220"></rect>
<text fill="#0d47a1" font-size="12" font-weight="700" text-anchor="middle" x="110" y="22">GRPO</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="110" y="44">3 models in memory:</text>
<text fill="#1a1a2e" font-family="monospace" font-size="10" text-anchor="middle" x="110" y="62">policy + ref + reward</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="110" y="86">loop: sample G → score →</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="110" y="102">group-mean baseline, no value net</text>
<text fill="#0d47a1" font-size="10" font-style="italic" text-anchor="middle" x="110" y="132">Best: verifiable rewards</text>
<text fill="#0d47a1" font-size="10" font-style="italic" text-anchor="middle" x="110" y="148">(math, code, DeepSeek-R1)</text>
<text fill="#666" font-size="10" text-anchor="middle" x="110" y="170">Cost: medium</text>
</g>
</svg>