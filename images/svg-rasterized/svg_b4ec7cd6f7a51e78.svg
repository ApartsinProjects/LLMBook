<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="EHR-as-integration-hub vendor map for healthcare LLMs, mid-2026" aria-labelledby="fig-74-5-1-title fig-74-5-1-desc" role="img" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg">
<title id="fig-74-5-1-title">EHR-as-integration-hub vendor map for healthcare LLMs, mid-2026</title>
<desc id="fig-74-5-1-desc">Center: Epic Systems hub (dominant US EHR). Spokes connect to four category clusters: Ambient documentation (Abridge, Microsoft Dragon Copilot ex-Nuance DAX $19.7B, Suki, DeepScribe — 250K+ clinicians, $1.2-1.8B ARR), Clinical decision support (Glass Health), Patient-facing low-acuity (Hippocratic AI $278M, 1.5M monthly interactions), Revenue-cycle &amp; coding (3M HIS, Optum — $4-5B revenue, 30-50% productivity).</desc>
<rect fill="#fbfcfe" height="380" width="760" x="0" y="0"></rect>
<text fill="#1f2d3d" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="380" y="22">EHR is the integration hub — Epic-centered vendor map, mid-2026</text>
<g fill="#1f2d3d" font-family="Helvetica, Arial, sans-serif" font-size="11">
<!-- center hub: Epic -->
<circle cx="380" cy="190" fill="#fff5d6" r="55" stroke="#b8860b" stroke-width="2"></circle>
<text fill="#7a5a08" font-weight="700" text-anchor="middle" x="380" y="185">Epic Systems</text>
<text fill="#7a5a08" font-size="10" text-anchor="middle" x="380" y="200">dominant U.S. EHR</text>
<text fill="#7a5a08" font-size="10" text-anchor="middle" x="380" y="214">+ Azure OpenAI</text>
<!-- spokes -->
<line stroke="#5a6573" stroke-width="2" x1="380" x2="380" y1="135" y2="85"></line>
<line stroke="#5a6573" stroke-width="2" x1="435" x2="600" y1="190" y2="190"></line>
<line stroke="#5a6573" stroke-width="2" x1="380" x2="380" y1="245" y2="295"></line>
<line stroke="#5a6573" stroke-width="2" x1="325" x2="155" y1="190" y2="190"></line>
<!-- top: ambient docs -->
<rect fill="#dfeaf5" height="38" rx="4" stroke="#2c5fa0" width="400" x="180" y="50"></rect>
<text fill="#2c5fa0" font-weight="700" text-anchor="middle" x="380" y="68">Ambient documentation — 250K+ clinicians, $1.2-1.8B ARR</text>
<text fill="#2c5fa0" font-size="10" text-anchor="middle" x="380" y="82">Abridge ($200M raised) · MS Dragon Copilot (ex-Nuance DAX, $19.7B) · Suki · DeepScribe</text>
<!-- right: clinical decision support -->
<rect fill="#eef5ec" height="60" rx="4" stroke="#1f6f3a" width="155" x="600" y="160"></rect>
<text fill="#1f6f3a" font-weight="700" text-anchor="middle" x="677" y="180">Clinical decision support</text>
<text font-size="10" text-anchor="middle" x="677" y="198">Glass Health</text>
<text font-size="10" text-anchor="middle" x="677" y="212">(stays outside SaMD)</text>
<!-- bottom: revenue cycle and coding -->
<rect fill="#f1d6d0" height="44" rx="4" stroke="#b2351e" width="400" x="180" y="295"></rect>
<text fill="#b2351e" font-weight="700" text-anchor="middle" x="380" y="313">Revenue cycle &amp; coding — $4-5B revenue</text>
<text fill="#b2351e" font-size="10" text-anchor="middle" x="380" y="328">3M Health Info Systems + Optum · 30-50% productivity gain on routine coding</text>
<!-- left: patient-facing low-acuity -->
<rect fill="#ede4f7" height="60" rx="4" stroke="#5a3d99" width="150" x="5" y="160"></rect>
<text fill="#5a3d99" font-weight="700" text-anchor="middle" x="80" y="180">Patient-facing low-acuity</text>
<text font-size="10" text-anchor="middle" x="80" y="198">Hippocratic AI ($278M)</text>
<text font-size="10" text-anchor="middle" x="80" y="212">1.5M interactions/mo</text>
<!-- bottom note -->
<rect fill="#fafafe" height="28" rx="4" stroke="#a8b9d4" width="600" x="80" y="350"></rect>
<text font-size="11" font-style="italic" text-anchor="middle" x="380" y="370">Total 2026 healthcare-LLM market: ~$5-7B annualized; concentrated by EHR-integration depth, not by base model</text>
</g>
</svg>