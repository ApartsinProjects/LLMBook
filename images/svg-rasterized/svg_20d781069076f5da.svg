<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Swap augmentation: each labelled pair becomes two training examples in opposite orders, forcing the judge to be order-invariant" role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow-swap" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"></path>
</marker>
</defs>
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="360" y="22">Swap augmentation: defeats position bias at training time</text>
<g transform="translate(40,60)">
<rect fill="#dbeafe" height="220" rx="8" stroke="#3a73a8" stroke-width="1.5" width="240"></rect>
<text fill="#3a73a8" font-size="12" font-weight="600" text-anchor="middle" x="120" y="22">Original pair (1 example)</text>
<rect fill="#fff" height="35" rx="4" stroke="#3a73a8" width="100" x="15" y="40"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="65" y="56">r_1</text>
<text fill="#4a5568" font-size="8" text-anchor="middle" x="65" y="69">"the better one"</text>
<text fill="#2d3748" font-size="11" text-anchor="middle" x="125" y="60">vs</text>
<rect fill="#fff" height="35" rx="4" stroke="#3a73a8" width="90" x="135" y="40"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="180" y="56">r_2</text>
<text fill="#4a5568" font-size="8" text-anchor="middle" x="180" y="69">"the worse one"</text>
<rect fill="#d1fae5" height="28" rx="4" stroke="#047857" width="140" x="50" y="95"></rect>
<text fill="#047857" font-size="11" font-weight="600" text-anchor="middle" x="120" y="113">verdict: y = 1 (r_1 wins)</text>
<text fill="#b91c1c" font-size="11" font-weight="600" text-anchor="middle" x="120" y="155">Risk: judge learns</text>
<text fill="#b91c1c" font-size="11" font-weight="600" text-anchor="middle" x="120" y="170">"left position wins"</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="120" y="195">15-25% position-flip rate</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="120" y="208">on un-augmented training</text>
</g>
<path d="M290,170 L370,170" marker-end="url(#arrow-swap)" stroke="#4a5568" stroke-width="2"></path>
<text fill="#4a5568" font-size="10" font-weight="600" text-anchor="middle" x="330" y="160">swap</text>
<g transform="translate(380,60)">
<rect fill="#d1fae5" height="220" rx="8" stroke="#047857" stroke-width="1.5" width="300"></rect>
<text fill="#047857" font-size="12" font-weight="600" text-anchor="middle" x="150" y="22">Swap-augmented (2 examples)</text>
<rect fill="#fff" height="35" rx="4" stroke="#047857" width="100" x="15" y="40"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="65" y="56">r_1</text>
<text fill="#2d3748" font-size="11" text-anchor="middle" x="125" y="60">vs</text>
<rect fill="#fff" height="35" rx="4" stroke="#047857" width="90" x="135" y="40"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="180" y="56">r_2</text>
<rect fill="#d1fae5" height="22" rx="3" stroke="#047857" width="120" x="80" y="80"></rect>
<text fill="#047857" font-size="10" font-weight="600" text-anchor="middle" x="140" y="95">y = 1 (r_1 wins)</text>
<rect fill="#fff" height="35" rx="4" stroke="#047857" width="90" x="15" y="115"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="60" y="131">r_2</text>
<text fill="#2d3748" font-size="11" text-anchor="middle" x="115" y="135">vs</text>
<rect fill="#fff" height="35" rx="4" stroke="#047857" width="100" x="125" y="115"></rect>
<text fill="#2d3748" font-size="10" text-anchor="middle" x="175" y="131">r_1</text>
<rect fill="#d1fae5" height="22" rx="3" stroke="#047857" width="120" x="80" y="155"></rect>
<text fill="#047857" font-size="10" font-weight="600" text-anchor="middle" x="140" y="170">y = 2 (r_1 still wins)</text>
<text fill="#047857" font-size="11" font-weight="600" text-anchor="middle" x="150" y="200">Forced: order-invariant</text>
<text fill="#4a5568" font-size="10" text-anchor="middle" x="150" y="215">2-5% position-flip rate</text>
</g>
</svg>