<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="BERTopic four-stage pipeline: documents flow through embed (sentence transformer), reduce (UMAP from 384 to 5 dimensions), cluster (HDBSCAN density clustering), and represent (c-TF-IDF keyword labels)." role="img" viewbox="0 0 780 220" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="bt_arrow" markerheight="7" markerwidth="10" orient="auto" refx="9" refy="3.5">
<polygon fill="#555" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<rect fill="#fafafa" height="210" rx="10" stroke="#ddd" width="770" x="5" y="5"></rect>
<!-- Documents -->
<rect fill="#fff" height="60" rx="6" stroke="#999" width="110" x="20" y="80"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" x="75" y="105">Documents</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="75" y="123">raw text</text>
<!-- Embed -->
<rect fill="#fff3e0" height="60" rx="6" stroke="#ef6c00" stroke-width="1.5" width="120" x="160" y="80"></rect>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="220" y="105">1. Embed</text>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="220" y="123">SBERT, 384-d</text>
<!-- Reduce -->
<rect fill="#e3f2fd" height="60" rx="6" stroke="#1565c0" stroke-width="1.5" width="120" x="310" y="80"></rect>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="370" y="105">2. Reduce</text>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="370" y="123">UMAP → 5-d</text>
<!-- Cluster -->
<rect fill="#f3e5f5" height="60" rx="6" stroke="#7b1fa2" stroke-width="1.5" width="120" x="460" y="80"></rect>
<text fill="#4a148c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="520" y="105">3. Cluster</text>
<text fill="#4a148c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="520" y="123">HDBSCAN</text>
<!-- Represent -->
<rect fill="#e8f5e9" height="60" rx="6" stroke="#2e7d32" stroke-width="1.5" width="170" x="610" y="80"></rect>
<text fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="695" y="105">4. Represent</text>
<text fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="695" y="123">c-TF-IDF keywords</text>
<!-- Arrows -->
<line marker-end="url(#bt_arrow)" stroke="#555" stroke-width="2" x1="130" x2="158" y1="110" y2="110"></line>
<line marker-end="url(#bt_arrow)" stroke="#555" stroke-width="2" x1="280" x2="308" y1="110" y2="110"></line>
<line marker-end="url(#bt_arrow)" stroke="#555" stroke-width="2" x1="430" x2="458" y1="110" y2="110"></line>
<line marker-end="url(#bt_arrow)" stroke="#555" stroke-width="2" x1="580" x2="608" y1="110" y2="110"></line>
<!-- Caption row -->
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="220" y="170">semantic vectors</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="370" y="170">low-d points</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="520" y="170">topic IDs</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="695" y="170">"refund, order, ..."</text>
</svg>