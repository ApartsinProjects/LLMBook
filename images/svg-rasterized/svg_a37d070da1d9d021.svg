<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="LLM defense-in-depth stack with four nested layers: Layer 1 Input Validation (regex, blocklist, Prompt Guard), Layer 2 Prompt Hardening (sandwich, delimiters, instructions), Layer 3 Output Scanning (toxicity, PII, code execution), Layer 4 Monitoring and Alerting (anomaly detection, audit logs)." role="img" style="font-family: sans-serif;" viewBox="0 -11 700 291" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow2" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<!-- Concentric layers -->
<rect fill="#fce4ec" filter="url(#shadow2)" height="45" rx="8" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="600" x="50" y="45"></rect>
<text fill="#e94560" font-size="13" font-weight="600" text-anchor="middle" x="350" y="73">Layer 1: Input Validation (regex, blocklist, Prompt Guard)</text>
<rect fill="#fff3e0" filter="url(#shadow2)" height="45" rx="8" stroke="#ff9800" stroke-linecap="round" stroke-width="2" width="540" x="80" y="100"></rect>
<text fill="#ff9800" font-size="13" font-weight="600" text-anchor="middle" x="350" y="128">Layer 2: Prompt Hardening (sandwich, delimiters, instructions)</text>
<rect fill="#e8f4fd" filter="url(#shadow2)" height="45" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="480" x="110" y="155"></rect>
<text fill="#3498db" font-size="13" font-weight="600" text-anchor="middle" x="350" y="183">Layer 3: Output Scanning (toxicity, PII, code execution)</text>
<rect fill="#e8f5e9" filter="url(#shadow2)" height="45" rx="8" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="420" x="140" y="210"></rect>
<text fill="#27ae60" font-size="13" font-weight="600" text-anchor="middle" x="350" y="238">Layer 4: Monitoring &amp; Alerting (anomaly detection, audit logs)</text>
</svg>