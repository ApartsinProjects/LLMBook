<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Sardana inference-aware scaling shifts optimum toward more tokens per parameter" viewBox="-45 -15 925 455" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="440" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Inference-aware scaling pushes the optimum to smaller models trained longer</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Sardana et al. arXiv:2401.00448 (2024); 2026 models annotated</text>
<g transform="translate(80,80)">
<line x1="0" y1="300" x2="720" y2="300" stroke="#1a1a2e" stroke-width="1.5"/>
<line x1="0" y1="0" x2="0" y2="300" stroke="#1a1a2e" stroke-width="1.5"/>
<!-- x: tokens-per-parameter ratio (log) -->
<g font-size="9" fill="#5a4a3a" text-anchor="middle">
<text x="0" y="318">20:1</text><line x1="0" y1="296" x2="0" y2="300" stroke="#1a1a2e"/>
<text x="144" y="318">100:1</text><line x1="144" y1="296" x2="144" y2="300" stroke="#1a1a2e"/>
<text x="288" y="318">1000:1</text><line x1="288" y1="296" x2="288" y2="300" stroke="#1a1a2e"/>
<text x="432" y="318">10,000:1</text><line x1="432" y1="296" x2="432" y2="300" stroke="#1a1a2e"/>
<text x="576" y="318">60,000:1</text><line x1="576" y1="296" x2="576" y2="300" stroke="#1a1a2e"/>
<text x="720" y="318">100,000:1</text><line x1="720" y1="296" x2="720" y2="300" stroke="#1a1a2e"/>
</g>
<text x="360" y="338" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e">Training tokens per parameter (log scale)</text>
<g font-size="9" fill="#5a4a3a" text-anchor="end">
<text x="-6" y="304">High</text>
<text x="-6" y="6">Low</text>
</g>
<text x="-40" y="150" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 -40 150)">Total amortized cost (train + inference)</text>
<!-- Chinchilla optimum at 20:1 (training-only) -->
<g>
<circle cx="0" cy="100" r="10" fill="#7a2a2a"/>
<text x="0" y="80" font-size="10" font-weight="700" text-anchor="middle" fill="#7a2a2a">Chinchilla 20:1</text>
<text x="0" y="68" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">training-only optimum</text>
</g>
<!-- Curves -->
<!-- Training-only Chinchilla curve: minimum near x=0 (20:1) -->
<path d="M 0 100 Q 60 105 120 115 Q 200 130 280 150 Q 380 175 480 200 Q 580 225 720 255" fill="none" stroke="#7a2a2a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="700" y="245" font-size="10" font-weight="700" text-anchor="end" fill="#7a2a2a">training cost only</text>
<!-- Inference-aware curve: minimum shifted right -->
<path d="M 0 220 Q 70 200 140 175 Q 220 160 320 155 Q 420 160 520 175 Q 620 200 720 240" fill="none" stroke="#1a4078" stroke-width="2.5"/>
<text x="370" y="148" font-size="10" font-weight="700" text-anchor="middle" fill="#1a4078">amortized: training + 1B inferences/day &#x00D7; 2 years</text>
<!-- Inference-aware optimum marker -->
<g>
<circle cx="320" cy="155" r="10" fill="#1a4078"/>
<text x="320" y="135" font-size="10" font-weight="700" text-anchor="middle" fill="#1a4078">Sardana optimum ~1000:1</text>
</g>
<!-- 2026 models annotated -->
<g>
<g transform="translate(432,160)">
<circle r="6" fill="#1f7a3a" stroke="#0f3a1c" stroke-width="1.5"/>
<text x="0" y="-10" font-size="9" font-weight="700" text-anchor="middle" fill="#1f7a3a">Llama-3.1 8B (~15T tok)</text>
</g>
<g transform="translate(576,178)">
<circle r="6" fill="#1f7a3a" stroke="#0f3a1c" stroke-width="1.5"/>
<text x="0" y="-10" font-size="9" font-weight="700" text-anchor="middle" fill="#1f7a3a">Qwen3-0.6B</text>
<text x="0" y="22" font-size="8" fill="#5a4a3a" text-anchor="middle">60,000:1</text>
</g>
<g transform="translate(680,225)">
<circle r="6" fill="#1f7a3a" stroke="#0f3a1c" stroke-width="1.5"/>
<text x="0" y="-10" font-size="9" font-weight="700" text-anchor="middle" fill="#1f7a3a">Liquid LFM2.5-350M</text>
<text x="0" y="22" font-size="8" fill="#5a4a3a" text-anchor="middle">80,000:1 (Apr 2026)</text>
</g>
<g transform="translate(288,180)">
<circle r="6" fill="#1f7a3a" stroke="#0f3a1c" stroke-width="1.5"/>
<text x="0" y="-10" font-size="9" font-weight="700" text-anchor="middle" fill="#1f7a3a">SmolLM2 360M</text>
</g>
</g>
<!-- arrow showing the shift -->
<path d="M 20 110 Q 170 70 300 145" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr585)"/>
<text x="170" y="68" font-size="10" font-style="italic" text-anchor="middle" fill="#1a1a2e">2024 paper shifted the field's optimum 50x to the right</text>
<defs><marker id="arr585" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#1a1a2e"/></marker></defs>
</g>
</svg>