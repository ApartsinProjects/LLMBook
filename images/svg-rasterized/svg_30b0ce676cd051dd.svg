<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="DeepSeek V4 CSA: weights-public vs kernel-ready lag in 2026" viewBox="-5 0 885 380" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="380" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">DeepSeek V4 Compressed Sparse Attention: open weights vs fast kernels</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Q1-Q2 2026; the kernel lag is the real adoption gate</text>
<g transform="translate(80,80)">
<line x1="0" y1="160" x2="720" y2="160" stroke="#1a1a2e" stroke-width="2"/>
<g font-size="10" fill="#5a4a3a" text-anchor="middle">
<text x="0" y="180">Jan</text><line x1="0" y1="155" x2="0" y2="165" stroke="#1a1a2e"/>
<text x="144" y="180">Feb</text><line x1="144" y1="155" x2="144" y2="165" stroke="#1a1a2e"/>
<text x="288" y="180">Mar</text><line x1="288" y1="155" x2="288" y2="165" stroke="#1a1a2e"/>
<text x="432" y="180">Apr</text><line x1="432" y1="155" x2="432" y2="165" stroke="#1a1a2e"/>
<text x="576" y="180">May</text><line x1="576" y1="155" x2="576" y2="165" stroke="#1a1a2e"/>
<text x="720" y="180">Jun 2026</text><line x1="720" y1="155" x2="720" y2="165" stroke="#1a1a2e"/>
</g>
<!-- Weights public -->
<g transform="translate(0,100)">
<circle r="9" fill="#1f7a3a" stroke="#0f3a1c" stroke-width="2"/>
<text y="-12" font-size="10" font-weight="700" fill="#1f7a3a">DeepSeek V4 release</text>
<text y="0" font-size="9" fill="#1a1a2e">(weights public, MoE+CSA)</text>
</g>
<!-- 3-5x slow window -->
<rect x="0" y="200" width="432" height="50" rx="3" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="2"/>
<text x="216" y="220" font-size="11" font-weight="700" text-anchor="middle" fill="#7a2a2a">"the weights are public, the inference is 3-5x slow"</text>
<text x="216" y="236" font-size="10" text-anchor="middle" fill="#1a1a2e">fallback path through generic attention &#8212; 4-6 weeks</text>
<!-- vLLM CSA -->
<g transform="translate(432,100)">
<circle r="9" fill="#a67c1a" stroke="#5a4a3a" stroke-width="2"/>
<text y="-12" font-size="10" font-weight="700" fill="#a67c1a">vLLM CSA kernel ships</text>
<text y="0" font-size="9" fill="#1a1a2e">(first parity, ~70% of FA-4 throughput)</text>
</g>
<!-- TensorRT-LLM CSA -->
<g transform="translate(648,100)">
<circle r="9" fill="#1a4078" stroke="#0f1f3d" stroke-width="2"/>
<text y="-12" font-size="10" font-weight="700" fill="#1a4078">TensorRT-LLM CSA</text>
<text y="0" font-size="9" fill="#1a1a2e">(NVIDIA-optimized, FA-4-class)</text>
</g>
<!-- arrows down -->
<g stroke="#1a1a2e" stroke-width="1" stroke-dasharray="3,2">
<line x1="0" y1="110" x2="0" y2="160"/>
<line x1="432" y1="110" x2="432" y2="160"/>
<line x1="648" y1="110" x2="648" y2="160"/>
</g>
<!-- bandwidth annotations -->
<g transform="translate(72,265)">
<rect x="-20" y="0" width="40" height="14" fill="#7a2a2a"/>
<text x="0" y="11" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">3-5&#x00D7;</text>
</g>
<g transform="translate(540,265)">
<rect x="-20" y="0" width="40" height="14" fill="#a67c1a"/>
<text x="0" y="11" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">~1.4&#x00D7;</text>
</g>
<g transform="translate(684,265)">
<rect x="-20" y="0" width="40" height="14" fill="#1f7a3a"/>
<text x="0" y="11" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">1.0&#x00D7;</text>
</g>
<text x="360" y="300" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">Effective slowdown vs dense-attention baseline (lower is better)</text>
</g>
</svg>