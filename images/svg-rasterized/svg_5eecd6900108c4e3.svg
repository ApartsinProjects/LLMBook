<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Safety datasets organized by what they measure" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig513title" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;">
<title id="fig513title">Safety datasets organized by what they measure</title>
<text x="380" y="24" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Safety datasets: what each one measures (2026)</text>
<g font-family="Georgia, serif" font-size="11">
<rect x="20" y="60" width="230" height="310" rx="8" fill="#fde9e9" stroke="#d62728"/>
<text x="135" y="84" text-anchor="middle" font-weight="bold" fill="#d62728" font-size="13">Harmful-output refusal</text>
<text x="35" y="110" font-weight="bold" fill="#222">HarmBench (Mazeika 2024)</text>
<text x="35" y="126" fill="#444">400 prompts · 7 categories</text>
<text x="35" y="142" fill="#666" font-style="italic">cybercrime, hate, weapons</text>
<text x="35" y="158" fill="#444">cross-lab refusal standard</text>
<text x="35" y="184" font-weight="bold" fill="#222">AdvBench (Zou 2023)</text>
<text x="35" y="200" fill="#444">520 prompts, GCG-original</text>
<text x="35" y="216" fill="#666" font-style="italic">automated attack target</text>
<text x="35" y="242" font-weight="bold" fill="#222">JailbreakBench (Chao 2024)</text>
<text x="35" y="258" fill="#444">leaderboard + fixed harms</text>
<text x="35" y="274" fill="#666" font-style="italic">academic comparability</text>
<text x="35" y="300" font-weight="bold" fill="#222">Anthropic HH-RLHF</text>
<text x="35" y="316" fill="#444">preference pairs for RLHF</text>
<text x="35" y="332" fill="#666" font-style="italic">canonical safety-tune set</text>
<rect x="265" y="60" width="230" height="310" rx="8" fill="#fff5d9" stroke="#cc8400"/>
<text x="380" y="84" text-anchor="middle" font-weight="bold" fill="#cc8400" font-size="13">Bias and fairness</text>
<text x="280" y="110" font-weight="bold" fill="#222">Anthropic Global Opinions</text>
<text x="280" y="126" fill="#444">Pew survey alignment</text>
<text x="280" y="142" fill="#666" font-style="italic">whose worldview?</text>
<text x="280" y="168" font-weight="bold" fill="#222">BBQ (NYU 2022)</text>
<text x="280" y="184" fill="#444">58K · 11 demographic axes</text>
<text x="280" y="200" fill="#666" font-style="italic">ambig vs disambig context</text>
<text x="280" y="226" font-weight="bold" fill="#222">Winogender (Rudinger 2018)</text>
<text x="280" y="242" fill="#444">gender-pronoun coreference</text>
<text x="280" y="258" fill="#666" font-style="italic">historical baseline</text>
<text x="280" y="284" font-weight="bold" fill="#222">Anthropic discrim-eval</text>
<text x="280" y="300" fill="#444">matched-candidate decisions</text>
<text x="280" y="316" fill="#666" font-style="italic">hiring, loans, etc.</text>
<rect x="510" y="60" width="230" height="310" rx="8" fill="#e9f7e9" stroke="#2ca02c"/>
<text x="625" y="84" text-anchor="middle" font-weight="bold" fill="#2ca02c" font-size="13">Truthfulness / hallucination</text>
<text x="525" y="110" font-weight="bold" fill="#222">TruthfulQA (Lin 2021)</text>
<text x="525" y="126" fill="#444">817 questions, common myths</text>
<text x="525" y="142" fill="#666" font-style="italic">"why drive on the left?"</text>
<text x="525" y="168" font-weight="bold" fill="#222">HaluEval (Patronus 2023)</text>
<text x="525" y="184" fill="#444">35K samples, QA/dialog/sum</text>
<text x="525" y="200" fill="#666" font-style="italic">train hallucination detector</text>
<text x="525" y="226" font-weight="bold" fill="#222">MT-Bench (LMSYS 2023)</text>
<text x="525" y="242" fill="#444">80 multi-turn quality Qs</text>
<text x="525" y="258" fill="#666" font-style="italic">GPT-4-judge scored</text>
<text x="525" y="290" fill="#222" font-weight="bold">→ use TruthfulQA + HaluEval</text>
<text x="525" y="306" fill="#222" font-weight="bold">→ for hallucination eval</text>
<text x="525" y="332" fill="#666" font-style="italic">production: RAGAS instead</text>
</g>
</svg>