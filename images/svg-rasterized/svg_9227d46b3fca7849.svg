<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The vertical NLP library stack as it consolidated by 2026." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" style="max-width:880px;background:#fafafa;border:1px solid #ddd;font-family:sans-serif;">
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle">Vertical NLP library stack: healthcare, finance, legal, education</text>
<rect x="40" y="60" width="200" height="240" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="140" y="84" font-size="13" font-weight="700" fill="#922b21" text-anchor="middle">Healthcare</text>
<text x="50" y="106" font-size="10" font-weight="700">Data exchange:</text>
<text x="50" y="120" font-size="10">FHIR (HL7, 2011+)</text>
<text x="50" y="134" font-size="10">smart-on-fhir client</text>
<text x="50" y="154" font-size="10" font-weight="700">NLP pipelines:</text>
<text x="50" y="168" font-size="10">spaCy 3.7+ (Explosion)</text>
<text x="50" y="182" font-size="10">scispaCy (AllenAI, PubMed)</text>
<text x="50" y="196" font-size="10">MedSpaCy (clinical notes)</text>
<text x="50" y="210" font-size="10">BioMedICUS (U Minn)</text>
<text x="50" y="230" font-size="10" font-weight="700">Embeddings:</text>
<text x="50" y="244" font-size="10">BiomedBERT (Microsoft)</text>
<text x="50" y="264" font-size="10" font-weight="700">ML workflows:</text>
<text x="50" y="278" font-size="10">PyHealth (UIUC)</text>
<text x="50" y="292" font-size="10">fhir.resources, fhirpy</text>
<rect x="250" y="60" width="200" height="240" fill="#fff" stroke="#27ae60" stroke-width="2"/>
<text x="350" y="84" font-size="13" font-weight="700" fill="#117a65" text-anchor="middle">Finance</text>
<text x="260" y="106" font-size="10" font-weight="700">Filings corpus:</text>
<text x="260" y="120" font-size="10">SEC EDGAR (free, 1984+)</text>
<text x="260" y="134" font-size="10">sec-edgar-api</text>
<text x="260" y="154" font-size="10" font-weight="700">Sentiment / classification:</text>
<text x="260" y="168" font-size="10">FinBERT (Yang et al. 2020)</text>
<text x="260" y="188" font-size="10" font-weight="700">Open finance LLMs:</text>
<text x="260" y="202" font-size="10">FinGPT (AI4Finance)</text>
<text x="260" y="222" font-size="10" font-weight="700">Research platform:</text>
<text x="260" y="236" font-size="10">openbb (open Bloomberg)</text>
<text x="260" y="256" font-size="10" font-weight="700">Market data:</text>
<text x="260" y="270" font-size="10">yfinance (prototypes)</text>
<text x="260" y="284" font-size="10">polygon, databento (prod)</text>
<rect x="460" y="60" width="180" height="240" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
<text x="550" y="84" font-size="13" font-weight="700" fill="#6c3483" text-anchor="middle">Legal</text>
<text x="470" y="106" font-size="10" font-weight="700">Case law corpus:</text>
<text x="470" y="120" font-size="10">CourtListener (Free Law Proj)</text>
<text x="470" y="134" font-size="10">courtlistener-api</text>
<text x="470" y="154" font-size="10" font-weight="700">Domain encoder:</text>
<text x="470" y="168" font-size="10">Legal-BERT (community)</text>
<text x="470" y="188" font-size="10" font-weight="700">Retrieval embeddings:</text>
<text x="470" y="202" font-size="10">Voyage-law (specialized)</text>
<text x="470" y="216" font-size="10">BGE family (general)</text>
<text x="470" y="246" font-size="10" font-style="italic">For generation,</text>
<text x="470" y="260" font-size="10" font-style="italic">frontier LLMs typically</text>
<text x="470" y="274" font-size="10" font-style="italic">outperform Legal-BERT</text>
<rect x="650" y="60" width="190" height="240" fill="#fff" stroke="#f39c12" stroke-width="2"/>
<text x="745" y="84" font-size="13" font-weight="700" fill="#9a6816" text-anchor="middle">Education</text>
<text x="660" y="106" font-size="10" font-weight="700">Tool interop:</text>
<text x="660" y="120" font-size="10">LTI (IMS Global, 2010+)</text>
<text x="660" y="140" font-size="10" font-weight="700">Content portability:</text>
<text x="660" y="154" font-size="10">Common Cartridge / IMS</text>
<text x="660" y="174" font-size="10" font-weight="700">LMS APIs:</text>
<text x="660" y="188" font-size="10">Canvas (Instructure)</text>
<text x="660" y="202" font-size="10">Moodle, Blackboard,</text>
<text x="660" y="216" font-size="10">Schoology (each its own)</text>
<text x="660" y="246" font-size="10" font-style="italic">Universal LTI tool ships</text>
<text x="660" y="260" font-size="10" font-style="italic">to all LMS with one</text>
<text x="660" y="274" font-size="10" font-style="italic">integration</text>
</svg>