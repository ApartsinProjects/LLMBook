<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Finance LLM use cases by ship-readiness, mid-2026" aria-labelledby="fig-73-1-1-title fig-73-1-1-desc" role="img" viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg">
<title id="fig-73-1-1-title">Finance LLM use cases by ship-readiness, mid-2026</title>
<desc id="fig-73-1-1-desc">Two columns. Left shows five shipping use cases; right shows three regulator-blocked categories.</desc>
<rect fill="#fbfcfe" height="400" width="760" x="0" y="0"></rect>
<text fill="#1f2d3d" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="380" y="22">Finance LLM use cases under SR 11-7: what ships and what is still blocked</text>
<g fill="#1f2d3d" font-family="Helvetica, Arial, sans-serif" font-size="11">
<!-- left column -->
<rect fill="#eef5ec" height="340" rx="6" stroke="#1f6f3a" width="380" x="20" y="50"></rect>
<text fill="#1f6f3a" font-weight="700" text-anchor="middle" x="210" y="72">Ships reliably (SR 11-7 audit survives)</text>
<rect fill="#fff" height="56" stroke="#1f6f3a" width="340" x="40" y="86"></rect>
<text font-weight="700" x="50" y="104">1. Equity research synthesis</text>
<text font-size="10" x="50" y="120">BloombergGPT 50B params, 363B tok, $2.7M</text>
<text font-size="10" x="50" y="134">Hebbia (buy-side), FactSet Mercury</text>
<rect fill="#fff" height="56" stroke="#1f6f3a" width="340" x="40" y="148"></rect>
<text font-weight="700" x="50" y="166">2. Sentiment &amp; event extraction</text>
<text font-size="10" x="50" y="182">BlackRock Aladdin LLM-sentiment (2024-25)</text>
<text font-size="10" x="50" y="196">private-data alpha, not standard signals</text>
<rect fill="#fff" height="56" stroke="#1f6f3a" width="340" x="40" y="210"></rect>
<text font-weight="700" x="50" y="228">3. Code generation (quant + middle office)</text>
<text font-size="10" x="50" y="244">Goldman + Morgan Stanley Copilot Enterprise</text>
<text font-size="10" x="50" y="258">15-30% productivity gain on routine code</text>
<rect fill="#fff" height="56" stroke="#1f6f3a" width="340" x="40" y="272"></rect>
<text font-weight="700" x="50" y="290">4. Compliance / KYC summarization</text>
<text font-size="10" x="50" y="306">Tiered review (junior + senior analyst)</text>
<text font-size="10" x="50" y="320">Big-4 banks: full audit log</text>
<rect fill="#fff" height="48" stroke="#1f6f3a" width="340" x="40" y="334"></rect>
<text font-weight="700" x="50" y="350">5. Customer operations</text>
<text font-size="10" x="50" y="366">Bank of America Erica: 2B+ interactions</text>
<text font-size="10" x="50" y="378">Drafting assistants for human agents</text>
<!-- right column -->
<rect fill="#f1d6d0" height="340" rx="6" stroke="#b2351e" width="330" x="410" y="50"></rect>
<text fill="#b2351e" font-weight="700" text-anchor="middle" x="575" y="72">Blocked or pilot-only</text>
<rect fill="#fff" height="90" stroke="#b2351e" width="290" x="430" y="92"></rect>
<text font-weight="700" x="440" y="110">Autonomous LLM trading signals</text>
<text font-size="10" x="440" y="128">Hedge-fund quant pods only</text>
<text font-size="10" x="440" y="144">LLM is a feature generator,</text>
<text font-size="10" x="440" y="158">not a decision maker</text>
<text fill="#b2351e" font-size="10" x="440" y="174">arbitraged-away on standard signals</text>
<rect fill="#fff" height="90" stroke="#b2351e" width="290" x="430" y="192"></rect>
<text font-weight="700" x="440" y="210">LLM-driven credit decisions</text>
<text font-size="10" x="440" y="228">Blocked by ECOA</text>
<text font-size="10" x="440" y="244">+ Fair Housing Act fair-lending review</text>
<text font-size="10" x="440" y="260">Decision flows through documented MRM</text>
<text fill="#b2351e" font-size="10" x="440" y="276">LLM informs only the application packet</text>
<rect fill="#fff" height="90" stroke="#b2351e" width="290" x="430" y="292"></rect>
<text font-weight="700" x="440" y="310">Autonomous advisory chatbots</text>
<text font-size="10" x="440" y="328">Blocked by SEC + FINRA</text>
<text font-size="10" x="440" y="344">suitability rules</text>
<text font-size="10" x="440" y="360">LLM helps human advisor only</text>
<text fill="#b2351e" font-size="10" x="440" y="376">pilots exist; production rare</text>
</g>
</svg>