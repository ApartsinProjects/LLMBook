<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="CAG architecture: at indexing time the full corpus is prefilled once through the LLM, producing a KV cache that is persisted; at query time only the new user question is prefilled and concatenated with the cached keys and values during attention, skipping the cost of re-reading the corpus." role="img" viewbox="0 0 780 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="cag_corpus" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3e0"></stop><stop offset="100%" stop-color="#ffe0b2"></stop></lineargradient>
<lineargradient id="cag_cache" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e8f5e9"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
<lineargradient id="cag_query" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e3f2fd"></stop><stop offset="100%" stop-color="#bbdefb"></stop></lineargradient>
<marker id="cag_arrow" markerheight="7" markerwidth="10" orient="auto" refx="9" refy="3.5">
<polygon fill="#555" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<rect fill="#fafafa" height="310" rx="10" stroke="#ddd" width="770" x="5" y="5"></rect>
<!-- Index-time row -->
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" x="25" y="40">Index-time (once)</text>
<rect fill="url(#cag_corpus)" height="60" rx="6" stroke="#ef6c00" stroke-width="1.5" width="140" x="25" y="55"></rect>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="95" y="80">Static corpus</text>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="95" y="98">e.g. 120K tokens</text>
<rect fill="#fff" height="60" rx="6" stroke="#888" stroke-width="1.5" width="160" x="220" y="55"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="300" y="80">LLM prefill</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="300" y="98">forward pass, all layers</text>
<rect fill="url(#cag_cache)" height="60" rx="6" stroke="#2e7d32" stroke-width="1.5" width="200" x="430" y="55"></rect>
<text fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="530" y="80">KV cache (K, V tensors)</text>
<text fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="530" y="98">persisted, "soft tokens"</text>
<line marker-end="url(#cag_arrow)" stroke="#555" stroke-width="2" x1="165" x2="218" y1="85" y2="85"></line>
<line marker-end="url(#cag_arrow)" stroke="#555" stroke-width="2" x1="380" x2="428" y1="85" y2="85"></line>
<!-- Divider -->
<line stroke="#ccc" stroke-dasharray="4,4" x1="20" x2="760" y1="150" y2="150"></line>
<!-- Query-time row -->
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" x="25" y="175">Query-time (per request)</text>
<rect fill="url(#cag_query)" height="60" rx="6" stroke="#1565c0" stroke-width="1.5" width="140" x="25" y="190"></rect>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="95" y="215">User question</text>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="95" y="233">~30 tokens</text>
<rect fill="#fff" height="60" rx="6" stroke="#888" stroke-width="1.5" width="160" x="220" y="190"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="300" y="215">Attention</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="300" y="233">Q_new · [K_cache ; K_new]</text>
<rect fill="url(#cag_cache)" height="60" rx="6" stroke="#2e7d32" stroke-width="1.5" width="200" x="430" y="190"></rect>
<text fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="530" y="215">Loaded KV cache (reused)</text>
<text fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="530" y="233">no re-prefill cost</text>
<rect fill="#fff" height="60" rx="6" stroke="#888" stroke-width="1.5" width="100" x="660" y="190"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="710" y="215">Answer</text>
<line marker-end="url(#cag_arrow)" stroke="#555" stroke-width="2" x1="165" x2="218" y1="220" y2="220"></line>
<line marker-end="url(#cag_arrow)" stroke="#555" stroke-width="2" x1="380" x2="428" y1="220" y2="220"></line>
<line marker-end="url(#cag_arrow)" stroke="#555" stroke-width="2" x1="630" x2="658" y1="220" y2="220"></line>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="380" y="285">Per-query cost = prefill(question) + decode(answer). Corpus prefill cost is amortized across all queries.</text>
</svg>