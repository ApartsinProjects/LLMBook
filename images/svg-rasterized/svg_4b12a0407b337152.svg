<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Noisy labels are like an orchestra where a few musicians are playing the wrong piece. The challenge is figuring out who " role="img" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_a140c2_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_a140c2_f0e6ff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff5ff"></stop><stop offset="100%" stop-color="#f0e6ff"></stop></lineargradient>
<lineargradient id="grad_a140c2_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_a140c2" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowL" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><path d="M0,0 L8,3 L0,6" fill="#0f3460"></path></marker>
</defs>
<!-- Unlabeled Data -->
<rect fill="url(#grad_a140c2_e8f4fd)" filter="url(#shadow_a140c2)" height="60" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="140" x="20" y="40"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="90" y="65">Unlabeled Data</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="90" y="85">10,000 examples</text>
<line marker-end="url(#arrowL)" stroke="#0f3460" stroke-linecap="round" stroke-width="1.5" x1="160" x2="200" y1="70" y2="70"></line>
<!-- LLM Pre-Labeler -->
<rect fill="#1a1a2e" height="80" rx="8" width="160" x="200" y="30"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="280" y="58">LLM Pre-Labeler</text>
<text fill="#ccc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="280" y="78">Labels + confidence</text>
<text fill="#ccc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="280" y="95">scores for each example</text>
<!-- Confidence Router -->
<line marker-end="url(#arrowL)" stroke="#0f3460" stroke-linecap="round" stroke-width="1.5" x1="360" x2="410" y1="70" y2="70"></line>
<rect fill="url(#grad_a140c2_fef9e7)" height="80" rx="8" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="140" x="410" y="30"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="480" y="55">Confidence Router</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="480" y="78">High conf &gt; 0.85</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="480" y="93">Low conf &lt; 0.85</text>
<!-- High confidence path -->
<line marker-end="url(#arrowL)" stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" x1="550" x2="590" y1="50" y2="50"></line>
<rect fill="#e8f5e9" height="55" rx="6" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="100" x="590" y="20"></rect>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="640" y="42">Auto-Accept</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="640" y="60">~70% of data</text>
<!-- Low confidence path -->
<line marker-end="url(#arrowL)" stroke="#e94560" stroke-linecap="round" stroke-width="1.5" x1="550" x2="590" y1="90" y2="130"></line>
<rect fill="url(#grad_a140c2_f0e6ff)" height="55" rx="6" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="130" x="560" y="120"></rect>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="625" y="142">Human Review</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="625" y="162">~30% of data</text>
<!-- Merge -->
<line stroke="#27ae60" stroke-dasharray="4,3" stroke-linecap="round" stroke-width="1" x1="640" x2="640" y1="75" y2="195"></line>
<line stroke="#8e44ad" stroke-dasharray="4,3" stroke-linecap="round" stroke-width="1" x1="625" x2="625" y1="175" y2="195"></line>
<rect fill="#1a1a2e" height="50" rx="8" width="170" x="520" y="200"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="605" y="222">Labeled Dataset</text>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="605" y="240">10,000 labeled examples</text>
</svg>