<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three TTS lineages compared: VITS, codec LMs, flow matching" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 880 380" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="380" width="880"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="440" y="22">Three 2024-26 TTS lineages: VITS, codec LMs, flow matching</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="440" y="40">All three collapsed the 2018 four-model pipeline into end-to-end neural systems</text>
<g font-size="10">
<g transform="translate(30,55)">
<rect fill="#e3e8f5" height="305" rx="8" stroke="#3d4d8a" stroke-width="2" width="270"></rect>
<text fill="#3d4d8a" font-weight="700" text-anchor="middle" x="135" y="22">VITS lineage (2021+)</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="135" y="40">conditional VAE + adversarial</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="135" y="68">Kim et al. 2021</text>
<text fill="#1a1a2e" x="20" y="92">- text encoder</text>
<text fill="#1a1a2e" x="20" y="108">- stochastic duration predictor</text>
<text fill="#1a1a2e" x="20" y="124">- normalizing flow on prior</text>
<text fill="#1a1a2e" x="20" y="140">- HiFi-GAN decoder</text>
<text fill="#1a1a2e" x="20" y="156">- monotonic alignment search</text>
<text fill="#1a1a2e" font-weight="700" x="20" y="186">Strengths:</text>
<text fill="#5a4a3a" font-size="9" x="30" y="202">MOS within 0.1 of natural</text>
<text fill="#5a4a3a" font-size="9" x="30" y="216">trainable on single GPU</text>
<text fill="#7a2a4a" font-weight="700" x="20" y="240">Limits:</text>
<text fill="#5a4a3a" font-size="9" x="30" y="256">no zero-shot cloning</text>
<text fill="#27ae60" font-size="9" font-weight="700" text-anchor="middle" x="135" y="290">Ancestor of most</text>
<text fill="#27ae60" font-size="9" font-weight="700" text-anchor="middle" x="135" y="302">open-source TTS</text>
</g>
<g transform="translate(310,55)">
<rect fill="#fef3e0" height="305" rx="8" stroke="#a67c1a" stroke-width="2" width="270"></rect>
<text fill="#a67c1a" font-weight="700" text-anchor="middle" x="135" y="22">Codec LM lineage (2023+)</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="135" y="40">audio as discrete tokens</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="135" y="68">Bark, VALL-E, Tortoise</text>
<text fill="#1a1a2e" x="20" y="92">- EnCodec 8 codebooks</text>
<text fill="#1a1a2e" x="20" y="108">- 75 tok/s, 600 tok/s total</text>
<text fill="#1a1a2e" x="20" y="124">- semantic transformer</text>
<text fill="#1a1a2e" x="20" y="140">- coarse-acoustic transformer</text>
<text fill="#1a1a2e" x="20" y="156">- fine-acoustic (NAR cross book)</text>
<text fill="#1a1a2e" font-weight="700" x="20" y="186">Strengths:</text>
<text fill="#5a4a3a" font-size="9" x="30" y="202">zero-shot cloning</text>
<text fill="#5a4a3a" font-size="9" x="30" y="216">"audio is just a vocab"</text>
<text fill="#7a2a4a" font-weight="700" x="20" y="240">Limits:</text>
<text fill="#5a4a3a" font-size="9" x="30" y="256">600 tok/s eats context</text>
<text fill="#27ae60" font-size="9" font-weight="700" text-anchor="middle" x="135" y="290">ElevenLabs v3,</text>
<text fill="#27ae60" font-size="9" font-weight="700" text-anchor="middle" x="135" y="302">Cartesia Sonic, PlayHT</text>
</g>
<g transform="translate(590,55)">
<rect fill="#e8f5e9" height="305" rx="8" stroke="#27ae60" stroke-width="2" width="260"></rect>
<text fill="#27ae60" font-weight="700" text-anchor="middle" x="130" y="22">Flow-matching lineage (2024+)</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="130" y="40">denoise mel like an image</text>
<text fill="#1a1a2e" font-weight="700" text-anchor="middle" x="130" y="68">F5-TTS, Voicebox</text>
<text fill="#1a1a2e" x="20" y="92">- 333M DiT (Chen et al. 2024)</text>
<text fill="#1a1a2e" x="20" y="108">- byte-level text input</text>
<text fill="#1a1a2e" x="20" y="124">- no phoneme/duration/aligner</text>
<text fill="#1a1a2e" x="20" y="140">- 100k hr multilingual training</text>
<text fill="#1a1a2e" x="20" y="156">- BigVGAN off-the-shelf vocoder</text>
<text fill="#1a1a2e" font-weight="700" x="20" y="186">Strengths:</text>
<text fill="#5a4a3a" font-size="9" x="30" y="202">5-sec zero-shot clone</text>
<text fill="#5a4a3a" font-size="9" x="30" y="216">code-switching multilingual</text>
<text fill="#5a4a3a" font-size="9" x="30" y="230">0.15 RTF on A100</text>
<text fill="#7a2a4a" font-weight="700" x="20" y="254">Limits:</text>
<text fill="#5a4a3a" font-size="9" x="30" y="270">16-32 steps, slower than VITS</text>
<text fill="#27ae60" font-size="9" font-weight="700" text-anchor="middle" x="130" y="295">2024 SOTA open-weight</text>
</g>
</g>
</svg>