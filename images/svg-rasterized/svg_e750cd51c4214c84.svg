<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-labelledby="fig1117-title fig1117-desc" role="img" style="max-width: 100%; height: auto; font-family: system-ui, sans-serif;" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" aria-label="Anatomy of a prompt mapped to chat API roles. The five structural components (instruction, context, output format, examples, input data) are distributed across three message roles. The right panel shows how each card becomes one entry in the messages[] array sent to the model. Color carries the mapping: purple = system, blue = few-shot example pairs, green = the actual user query, orange = the model's response.">
<title id="fig1117-title">Anatomy of a prompt mapped to chat API message roles</title>
<desc id="fig1117-desc">Three vertically stacked message cards (System, Few-shot examples, User) show how the five prompt components (instruction, context, output format, examples, input data) are distributed across the three chat API roles. Each card pairs the abstract component labels with a concrete excerpt of real prompt text. A bottom panel shows the assistant response that the model returns.</desc>
<defs>
<marker id="f1117arrow" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M0,0 L10,5 L0,10 z" fill="#555"></path>
</marker>
<filter height="115%" id="f1117shadow" width="104%" x="-2%" y="-2%">
<fedropshadow dx="0" dy="2" flood-opacity="0.08" stddeviation="2"></fedropshadow>
</filter>
</defs>
<!-- ============== SYSTEM MESSAGE CARD ============== -->
<g transform="translate(40, 40)">
<rect fill="#f5eef8" filter="url(#f1117shadow)" height="135" rx="10" stroke="#8e44ad" stroke-width="2" width="700"></rect>
<!-- Role badge -->
<rect fill="#8e44ad" height="22" rx="11" width="92" x="12" y="12"></rect>
<text fill="#fff" font-size="11" font-weight="700" letter-spacing="0.05em" text-anchor="middle" x="58" y="28">SYSTEM</text>
<!-- Component tags (right) -->
<g font-size="10" font-weight="600">
<rect fill="#8e44ad" height="22" opacity="0.18" rx="3" width="80" x="120" y="12"></rect>
<text fill="#5e2680" text-anchor="middle" x="160" y="28">instruction</text>
<rect fill="#8e44ad" height="22" opacity="0.18" rx="3" width="68" x="208" y="12"></rect>
<text fill="#5e2680" text-anchor="middle" x="242" y="28">context</text>
<rect fill="#8e44ad" height="22" opacity="0.18" rx="3" width="105" x="284" y="12"></rect>
<text fill="#5e2680" text-anchor="middle" x="336" y="28">output format</text>
</g>
<!-- Example text -->
<text fill="#333" font-size="13" font-style="italic" x="22" y="62">"You are a senior Python code reviewer. Look for bugs in the snippet below.</text>
<text fill="#333" font-size="13" font-style="italic" x="22" y="82">Use a calm, instructive tone. The reader is a junior developer.</text>
<text fill="#333" font-size="13" font-style="italic" x="22" y="102">Output JSON with keys: <tspan fill="#5e2680" font-family="ui-monospace, monospace">bug_type</tspan>,</text>
<text fill="#333" font-size="13" font-style="italic" x="22" y="120"><tspan fill="#5e2680" font-family="ui-monospace, monospace">severity</tspan> (low / med / high), and <tspan fill="#5e2680" font-family="ui-monospace, monospace">fix</tspan>."</text>
</g>
<!-- ============== FEW-SHOT EXAMPLES CARD ============== -->
<g transform="translate(40, 195)">
<rect fill="#eaf4fc" filter="url(#f1117shadow)" height="120" rx="10" stroke="#3498db" stroke-dasharray="4 3" stroke-width="2" width="700"></rect>
<rect fill="#3498db" height="22" rx="11" width="148" x="12" y="12"></rect>
<text fill="#fff" font-size="11" font-weight="700" letter-spacing="0.05em" text-anchor="middle" x="86" y="28">FEW-SHOT (optional)</text>
<g font-size="10" font-weight="600">
<rect fill="#3498db" height="22" opacity="0.18" rx="3" width="80" x="172" y="12"></rect>
<text fill="#1d6fa5" text-anchor="middle" x="212" y="28">examples</text>
</g>
<!-- 1st example -->
<text fill="#666" font-size="11" font-weight="700" x="22" y="62">User:</text>
<text fill="#333" font-family="ui-monospace, monospace" font-size="12" x="62" y="62">def add(a, b): return a - b</text>
<text fill="#666" font-size="11" font-weight="700" x="22" y="80">Assistant:</text>
<text fill="#333" font-family="ui-monospace, monospace" font-size="12" x="92" y="80">{"bug_type": "logic", "severity": "high", "fix": "return a + b"}</text>
<!-- ... more examples elided -->
<text fill="#888" font-size="11" font-style="italic" x="22" y="105">...more (user, assistant) pairs as needed...</text>
</g>
<!-- ============== USER MESSAGE CARD ============== -->
<g transform="translate(40, 335)">
<rect fill="#eafaf1" filter="url(#f1117shadow)" height="100" rx="10" stroke="#27ae60" stroke-width="2" width="700"></rect>
<rect fill="#27ae60" height="22" rx="11" width="60" x="12" y="12"></rect>
<text fill="#fff" font-size="11" font-weight="700" letter-spacing="0.05em" text-anchor="middle" x="42" y="28">USER</text>
<g font-size="10" font-weight="600">
<rect fill="#27ae60" height="22" opacity="0.18" rx="3" width="80" x="84" y="12"></rect>
<text fill="#0f6b3a" text-anchor="middle" x="124" y="28">input data</text>
</g>
<text fill="#333" font-family="ui-monospace, monospace" font-size="13" x="22" y="62">def divide(a, b):</text>
<text fill="#333" font-family="ui-monospace, monospace" font-size="13" x="22" y="80">    return a / b   # what about b == 0 ?</text>
</g>
<!-- Down-arrow from USER -> MODEL -->
<line marker-end="url(#f1117arrow)" stroke="#555" stroke-width="2" x1="390" x2="390" y1="445" y2="475"></line>
<!-- Model badge -->
<g transform="translate(330, 477)">
<rect fill="#fff" height="36" rx="18" stroke="#555" stroke-width="2" width="120"></rect>
<text fill="#333" font-size="13" font-weight="700" text-anchor="middle" x="60" y="23">LLM</text>
</g>
<!-- ============== ASSISTANT RESPONSE CARD ============== -->
<g transform="translate(40, 525)">
<rect fill="#fef3e6" filter="url(#f1117shadow)" height="80" rx="10" stroke="#e67e22" stroke-width="2" width="700"></rect>
<rect fill="#e67e22" height="22" rx="11" width="100" x="12" y="12"></rect>
<text fill="#fff" font-size="11" font-weight="700" letter-spacing="0.05em" text-anchor="middle" x="62" y="28">ASSISTANT</text>
<text fill="#333" font-family="ui-monospace, monospace" font-size="13" x="22" y="58">{"bug_type": "ZeroDivisionError", "severity": "high",</text>
<text fill="#333" font-family="ui-monospace, monospace" font-size="13" x="22" y="74"> "fix": "raise ValueError if b == 0 before dividing"}</text>
</g>
<!-- ============== RIGHT PANEL: chat API JSON ============== -->
<g transform="translate(770, 40)">
<rect fill="#fafafa" height="395" rx="10" stroke="#ccc" stroke-width="1.2" width="200"></rect>
<text fill="#333" font-size="11" font-weight="700" text-anchor="middle" x="100" y="22">Chat API messages[]</text>
<line stroke="#ddd" x1="10" x2="190" y1="30" y2="30"></line>
<g fill="#333" font-family="ui-monospace, monospace" font-size="10">
<text x="10" y="48">[</text>
<text x="22" y="62">{</text>
<text x="34" y="76"><tspan fill="#8e44ad">"role"</tspan>: <tspan fill="#0a7d33">"system"</tspan>,</text>
<text x="34" y="90"><tspan fill="#8e44ad">"content"</tspan>: ...</text>
<text x="22" y="104">},</text>
<text x="22" y="120">{</text>
<text x="34" y="134"><tspan fill="#3498db">"role"</tspan>: <tspan fill="#0a7d33">"user"</tspan>,</text>
<text x="34" y="148"><tspan fill="#3498db">"content"</tspan>: "def add..."</text>
<text x="22" y="162">},</text>
<text x="22" y="178">{</text>
<text x="34" y="192"><tspan fill="#3498db">"role"</tspan>: <tspan fill="#0a7d33">"assistant"</tspan>,</text>
<text x="34" y="206"><tspan fill="#3498db">"content"</tspan>: "{...}"</text>
<text x="22" y="220">},</text>
<text fill="#888" font-style="italic" x="34" y="240">// more pairs...</text>
<text x="22" y="260">{</text>
<text x="34" y="274"><tspan fill="#27ae60">"role"</tspan>: <tspan fill="#0a7d33">"user"</tspan>,</text>
<text x="34" y="288"><tspan fill="#27ae60">"content"</tspan>: "def divide..."</text>
<text x="22" y="302">}</text>
<text x="10" y="316">]</text>
</g>
<line stroke="#ddd" x1="10" x2="190" y1="335" y2="335"></line>
<text fill="#666" font-size="10" text-anchor="middle" x="100" y="354">color = card source</text>
<text fill="#666" font-size="10" text-anchor="middle" x="100" y="372">role string is what</text>
<text fill="#666" font-size="10" text-anchor="middle" x="100" y="386">the API actually sees</text>
</g>
</svg>