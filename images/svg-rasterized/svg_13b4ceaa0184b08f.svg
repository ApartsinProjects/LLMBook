<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The bifurcated finance LLM vendor stack, mid-2026" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="fig-73-5-1-title fig-73-5-1-desc">
<title id="fig-73-5-1-title">The bifurcated finance LLM vendor stack, mid-2026</title>
<desc id="fig-73-5-1-desc">Two columns. Left: institutional workflows (Bloomberg Terminal AI + BloombergGPT, FactSet Mercury, Hebbia, AlphaSense, BlackRock Aladdin, JPMorgan IndexGPT). Right: retail-facing (BofA Erica, Capital One Eno, Wells Fargo Fargo, Citi chatbot suite). Bottom layer: frontier platform substrate (Azure OpenAI Service, AWS Bedrock, Anthropic Enterprise, Google Vertex AI).</desc>
<rect x="0" y="0" width="760" height="360" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">Bifurcated finance LLM market: institutional vs retail, mid-2026</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- left column institutional -->
<rect x="30" y="50" width="350" height="200" fill="#dfeaf5" stroke="#2c5fa0" rx="6"/>
<text x="205" y="72" text-anchor="middle" font-weight="700" fill="#2c5fa0">Institutional workflows</text>
<text x="205" y="86" text-anchor="middle" font-size="10" fill="#2c5fa0">(research, trading, risk — buy specialized)</text>

<rect x="50" y="98" width="150" height="40" fill="#fff" stroke="#2c5fa0"/>
<text x="125" y="116" text-anchor="middle" font-weight="700" font-size="11">Bloomberg</text>
<text x="125" y="130" text-anchor="middle" font-size="10">Terminal + 50B BloombergGPT</text>

<rect x="210" y="98" width="160" height="40" fill="#fff" stroke="#2c5fa0"/>
<text x="290" y="116" text-anchor="middle" font-weight="700" font-size="11">FactSet</text>
<text x="290" y="130" text-anchor="middle" font-size="10">Mercury AI</text>

<rect x="50" y="148" width="150" height="40" fill="#fff" stroke="#2c5fa0"/>
<text x="125" y="166" text-anchor="middle" font-weight="700" font-size="11">Hebbia</text>
<text x="125" y="180" text-anchor="middle" font-size="10">diligence binder extraction</text>

<rect x="210" y="148" width="160" height="40" fill="#fff" stroke="#2c5fa0"/>
<text x="290" y="166" text-anchor="middle" font-weight="700" font-size="11">AlphaSense</text>
<text x="290" y="180" text-anchor="middle" font-size="10">broker research search</text>

<rect x="50" y="198" width="150" height="40" fill="#fff" stroke="#2c5fa0"/>
<text x="125" y="216" text-anchor="middle" font-weight="700" font-size="11">BlackRock Aladdin</text>
<text x="125" y="230" text-anchor="middle" font-size="10">$20T+ AUM analyzed</text>

<rect x="210" y="198" width="160" height="40" fill="#fff" stroke="#2c5fa0"/>
<text x="290" y="216" text-anchor="middle" font-weight="700" font-size="11">JPM IndexGPT</text>
<text x="290" y="230" text-anchor="middle" font-size="10">thematic basket builder (in-house)</text>

<!-- right column retail -->
<rect x="395" y="50" width="335" height="200" fill="#eef5ec" stroke="#1f6f3a" rx="6"/>
<text x="562" y="72" text-anchor="middle" font-weight="700" fill="#1f6f3a">Retail-facing deployments</text>
<text x="562" y="86" text-anchor="middle" font-size="10" fill="#1f6f3a">(chatbot / mobile-app voice — buy/build on frontier)</text>

<rect x="415" y="98" width="145" height="40" fill="#fff" stroke="#1f6f3a"/>
<text x="487" y="116" text-anchor="middle" font-weight="700" font-size="11">BofA Erica</text>
<text x="487" y="130" text-anchor="middle" font-size="10">2B+ interactions by 2022</text>

<rect x="570" y="98" width="145" height="40" fill="#fff" stroke="#1f6f3a"/>
<text x="642" y="116" text-anchor="middle" font-weight="700" font-size="11">Capital One Eno</text>
<text x="642" y="130" text-anchor="middle" font-size="10">Tier 3 with guardrails</text>

<rect x="415" y="148" width="145" height="40" fill="#fff" stroke="#1f6f3a"/>
<text x="487" y="166" text-anchor="middle" font-weight="700" font-size="11">Wells Fargo Fargo</text>
<text x="487" y="180" text-anchor="middle" font-size="10">balance + transactions only</text>

<rect x="570" y="148" width="145" height="40" fill="#fff" stroke="#1f6f3a"/>
<text x="642" y="166" text-anchor="middle" font-weight="700" font-size="11">Citi chatbot suite</text>
<text x="642" y="180" text-anchor="middle" font-size="10">scope-classifier guardrails</text>

<rect x="495" y="198" width="160" height="40" fill="#fff" stroke="#1f6f3a"/>
<text x="575" y="216" text-anchor="middle" font-weight="700" font-size="11">Spellbook-style mid-mkt</text>
<text x="575" y="230" text-anchor="middle" font-size="10">verticalized SaaS</text>

<!-- platform substrate row -->
<rect x="30" y="270" width="700" height="80" fill="#fff5d6" stroke="#b8860b" rx="6"/>
<text x="380" y="292" text-anchor="middle" font-weight="700" fill="#7a5a08">Frontier platform substrate (no-retention regulated SKUs)</text>
<rect x="50" y="302" width="160" height="34" fill="#fff" stroke="#b8860b"/>
<text x="130" y="324" text-anchor="middle" font-size="11">Azure OpenAI Service</text>
<rect x="220" y="302" width="160" height="34" fill="#fff" stroke="#b8860b"/>
<text x="300" y="324" text-anchor="middle" font-size="11">AWS Bedrock</text>
<rect x="390" y="302" width="160" height="34" fill="#fff" stroke="#b8860b"/>
<text x="470" y="324" text-anchor="middle" font-size="11">Anthropic Enterprise</text>
<rect x="560" y="302" width="160" height="34" fill="#fff" stroke="#b8860b"/>
<text x="640" y="324" text-anchor="middle" font-size="11">Google Vertex AI</text>
</g>
</svg>