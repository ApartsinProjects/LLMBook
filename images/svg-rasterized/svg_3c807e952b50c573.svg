<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The query-understanding pipeline. One natural-language input fans out into three parallel LLM tasks. Their outputs merge into a single structured query that the downstream retriever consumes." role="img" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrqu" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="3.5" viewBox="0 0 7 7"><path d="M0,0 L7,3.5 L0,7 z" fill="#444"></path></marker>
<filter height="115%" id="dsqu" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>

<!-- User text -->
<rect fill="#ecf0f1" filter="url(#dsqu)" height="60" rx="6" stroke="#2c3e50" stroke-width="2" width="200" x="20" y="140"></rect>
<text fill="#2c3e50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="120" y="160">User text</text>
<text fill="#666" font-family="monospace" font-size="10" text-anchor="middle" x="120" y="180">"wireless headphones</text>
<text fill="#666" font-family="monospace" font-size="10" text-anchor="middle" x="120" y="194">under $200, anc"</text>

<!-- Three LLM steps -->
<rect fill="#fef5e7" filter="url(#dsqu)" height="60" rx="6" stroke="#e67e22" stroke-width="2" width="200" x="290" y="30"></rect>
<text fill="#e67e22" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="390" y="50">Query Expansion</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="390" y="68">add synonyms,</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="390" y="82">related terms</text>

<rect fill="#eaf5ff" filter="url(#dsqu)" height="60" rx="6" stroke="#2980b9" stroke-width="2" width="200" x="290" y="140"></rect>
<text fill="#2980b9" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="390" y="160">Intent Classification</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="390" y="178">informational, transactional,</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="390" y="192">navigational, comparison</text>

<rect fill="#e8f8f5" filter="url(#dsqu)" height="60" rx="6" stroke="#16a085" stroke-width="2" width="200" x="290" y="250"></rect>
<text fill="#16a085" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="390" y="270">Slot Filling</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="390" y="288">category=headphones,</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle" x="390" y="302">price_max=200, anc=true</text>

<!-- Merge -->
<rect fill="#f5eef8" filter="url(#dsqu)" height="80" rx="6" stroke="#8e44ad" stroke-width="2" width="220" x="560" y="130"></rect>
<text fill="#8e44ad" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="670" y="152">Structured Query JSON</text>
<text fill="#444" font-family="monospace" font-size="10" text-anchor="middle" x="670" y="172">{terms, intent, slots}</text>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle" x="670" y="192">consumed by retriever</text>

<!-- Arrows -->
<line marker-end="url(#arrqu)" stroke="#444" stroke-width="1.5" x1="222" x2="288" y1="160" y2="60"></line>
<line marker-end="url(#arrqu)" stroke="#444" stroke-width="1.5" x1="222" x2="288" y1="170" y2="170"></line>
<line marker-end="url(#arrqu)" stroke="#444" stroke-width="1.5" x1="222" x2="288" y1="180" y2="280"></line>
<line marker-end="url(#arrqu)" stroke="#444" stroke-width="1.5" x1="492" x2="558" y1="60" y2="160"></line>
<line marker-end="url(#arrqu)" stroke="#444" stroke-width="1.5" x1="492" x2="558" y1="170" y2="170"></line>
<line marker-end="url(#arrqu)" stroke="#444" stroke-width="1.5" x1="492" x2="558" y1="280" y2="180"></line>
</svg>