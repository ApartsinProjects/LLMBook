<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The fundamental tradeoff that bounds every watermark: stronger embedding (larger δ for green-list text or pixel amplitude for images) raises robustness but also raises perceptibility, so the 'sweet spot' lives in a narrow band." viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig545title" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;">
<title id="fig545title">Imperceptibility vs robustness: the fundamental watermark tradeoff</title>
<text x="380" y="24" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Imperceptibility-robustness tradeoff and where attacks land</text>
<g font-family="Georgia, serif" font-size="11">
<line x1="80" y1="320" x2="680" y2="320" stroke="#222" stroke-width="1.5"/>
<line x1="80" y1="60" x2="80" y2="320" stroke="#222" stroke-width="1.5"/>
<text x="380" y="350" text-anchor="middle" font-weight="bold" fill="#222">Embedding strength (δ for text, pixel amplitude for image) →</text>
<text x="60" y="190" text-anchor="middle" transform="rotate(-90, 60, 190)" font-weight="bold" fill="#222">survival probability</text>
<path d="M 100 310 Q 200 250 380 130 T 660 70" stroke="#2ca02c" stroke-width="3" fill="none"/>
<text x="660" y="60" text-anchor="end" fill="#2ca02c" font-weight="bold">robustness (rises with δ)</text>
<path d="M 100 310 Q 200 300 380 230 T 660 80" stroke="#d62728" stroke-width="3" fill="none" stroke-dasharray="5 3"/>
<text x="660" y="100" text-anchor="end" fill="#d62728" font-weight="bold">perceptibility (also rises)</text>
<line x1="380" y1="60" x2="380" y2="320" stroke="#cc8400" stroke-width="2" stroke-dasharray="6 4"/>
<text x="380" y="50" text-anchor="middle" fill="#cc8400" font-weight="bold">"sweet spot" (most schemes)</text>
<circle cx="200" cy="280" r="6" fill="#1f77b4"/>
<text x="200" y="270" text-anchor="middle" fill="#222" font-size="10">weak embed</text>
<text x="200" y="298" text-anchor="middle" fill="#666" font-size="10">invisible, easy to wipe</text>
<circle cx="600" cy="120" r="6" fill="#1f77b4"/>
<text x="600" y="110" text-anchor="middle" fill="#222" font-size="10">strong embed</text>
<text x="600" y="138" text-anchor="middle" fill="#666" font-size="10">robust but visible</text>
<rect x="100" y="220" width="200" height="80" rx="6" fill="#fde9e9" stroke="#d62728"/>
<text x="200" y="240" text-anchor="middle" font-weight="bold" fill="#d62728">Attacks that exploit the gap</text>
<text x="200" y="258" text-anchor="middle" fill="#444">text: paraphrase (LLM call)</text>
<text x="200" y="272" text-anchor="middle" fill="#444">image: DDIM invert + regen</text>
<text x="200" y="286" text-anchor="middle" fill="#444">audio: re-vocode + mild pitch</text>
<rect x="420" y="220" width="240" height="80" rx="6" fill="#e9f7e9" stroke="#2ca02c"/>
<text x="540" y="240" text-anchor="middle" font-weight="bold" fill="#2ca02c">Realistic defense posture</text>
<text x="540" y="258" text-anchor="middle" fill="#444">watermark deters casual misuse</text>
<text x="540" y="272" text-anchor="middle" fill="#444">+ C2PA + detectors + policy</text>
<text x="540" y="286" text-anchor="middle" fill="#444">solves ~80% of the problem</text>
</g>
</svg>