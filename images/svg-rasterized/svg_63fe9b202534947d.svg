<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Triage pattern: a fast classical ML model handles the easy, predictable parts of the request stream while the LLM tackles the nuanced, open-ended cases. The diagram shows two parallel tracks merging at the routing layer." font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 760 423" xmlns="http://www.w3.org/2000/svg">
<!-- Input -->
<rect fill="url(#grad_5ef9e9_e8f4fd)" filter="url(#shadow_5ef9e9)" height="50" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="160" x="300" y="45"></rect>
<text fill="#3498db" font-size="13" font-weight="600" text-anchor="middle" x="380" y="75">Incoming Request</text>
<!-- Arrow down -->
<line marker-end="url(#arrowDown)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="380" x2="380" y1="95" y2="125"></line>
<!-- Classifier -->
<rect fill="#e8f5e9" height="55" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="180" x="290" y="125"></rect>
<text fill="#27ae60" font-size="13" font-weight="700" text-anchor="middle" x="380" y="150">Fast Classifier</text>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="168">TF-IDF+LR, ~0.1ms, ~<span>&#36;</span>0</text>
<!-- Confidence check diamond -->
<polygon fill="#fef9e7" points="380,200 460,245 380,290 300,245" stroke="#f39c12" stroke-linecap="round" stroke-width="2"></polygon>
<text fill="#f39c12" font-size="11" font-weight="600" text-anchor="middle" x="380" y="240">Confidence</text>
<text fill="#f39c12" font-size="11" font-weight="600" text-anchor="middle" x="380" y="255">&gt; threshold?</text>
<!-- High confidence path (left) -->
<line marker-end="url(#arrowLeft)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="300" x2="140" y1="245" y2="245"></line>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="220" y="235">Yes (80%)</text>
<rect fill="#e8f5e9" height="50" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="140" x="30" y="220"></rect>
<text fill="#27ae60" font-size="12" font-weight="600" text-anchor="middle" x="100" y="250">Direct Response</text>
<!-- Low confidence path (right) -->
<line marker-end="url(#arrowRight)" stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="460" x2="570" y1="245" y2="245"></line>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="515" y="235">No (20%)</text>
<rect fill="#fde8ec" height="60" rx="10" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="160" x="570" y="215"></rect>
<text fill="#e94560" font-size="13" font-weight="700" text-anchor="middle" x="650" y="240">LLM Analysis</text>
<text fill="#555" font-size="11" text-anchor="middle" x="650" y="258">GPT-4o, ~500ms, ~<span>&#36;</span>0.01</text>
<!-- Both converge to output -->
<line stroke="#27ae60" stroke-linecap="round" stroke-width="1.5" x1="100" x2="100" y1="270" y2="350"></line>
<line marker-end="url(#arrowRight2)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="100" x2="310" y1="350" y2="350"></line>
<line stroke="#e94560" stroke-linecap="round" stroke-width="1.5" x1="650" x2="650" y1="275" y2="350"></line>
<line marker-end="url(#arrowLeft2)" stroke="#888" stroke-linecap="round" stroke-width="1.5" x1="650" x2="470" y1="350" y2="350"></line>
<rect fill="url(#grad_5ef9e9_f0e6ff)" height="45" rx="10" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="160" x="310" y="330"></rect>
<text fill="#8e44ad" font-size="12" font-weight="600" text-anchor="middle" x="390" y="358">Final Output</text>
<!-- Cost summary -->
<rect fill="none" height="20" rx="4" width="360" x="200" y="388"></rect>
<text fill="#555" font-size="11" text-anchor="middle" x="380" y="403">Avg cost: 0.80 x <span>&#36;</span>0 + 0.20 x <span>&#36;</span>0.01 = <span>&#36;</span>0.002/query (80% savings vs. LLM-only)</text>
<defs>
<lineargradient id="grad_5ef9e9_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<lineargradient id="grad_5ef9e9_f0e6ff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff5ff"></stop><stop offset="100%" stop-color="#f0e6ff"></stop></lineargradient>
<filter height="115%" id="shadow_5ef9e9" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowDown" markerheight="7" markerwidth="10" orient="auto" refx="5" refy="7"><polygon fill="#888" points="0 0, 5 7, 10 0"></polygon></marker>
<marker id="arrowLeft" markerheight="7" markerwidth="10" orient="auto" refx="0" refy="3.5"><polygon fill="#27ae60" points="10 0, 0 3.5, 10 7"></polygon></marker>
<marker id="arrowRight" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5"><polygon fill="#e94560" points="0 0, 10 3.5, 0 7"></polygon></marker>
<marker id="arrowRight2" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5"><polygon fill="#888" points="0 0, 10 3.5, 0 7"></polygon></marker>
<marker id="arrowLeft2" markerheight="7" markerwidth="10" orient="auto" refx="0" refy="3.5"><polygon fill="#888" points="10 0, 0 3.5, 10 7"></polygon></marker>
</defs>
</svg>