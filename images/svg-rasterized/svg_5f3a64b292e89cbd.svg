<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 640 300" role="img" aria-label="Two overlapping bell curves showing the validation distribution shifted from the production distribution, illustrating covariate shift" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<defs>
<marker id="arrow-drift" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
</marker>
</defs>
<text x="320" y="22" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">Covariate shift: when production stops looking like validation</text>

<line x1="60" y1="240" x2="600" y2="240" stroke="#4a5568" stroke-width="1.5"/>
<line x1="60" y1="60" x2="60" y2="240" stroke="#4a5568" stroke-width="1.5"/>
<text x="330" y="270" font-size="11" fill="#4a5568" text-anchor="middle">feature / token / embedding axis</text>
<text x="30" y="150" font-size="11" fill="#4a5568" text-anchor="middle" transform="rotate(-90 30 150)">density</text>

<path d="M60,240 Q160,240 220,140 Q260,80 300,140 Q360,240 460,240" fill="#3a73a8" fill-opacity="0.25" stroke="#3a73a8" stroke-width="2"/>
<text x="260" y="110" font-size="11" font-weight="600" fill="#3a73a8" text-anchor="middle">P_validation</text>
<text x="260" y="125" font-size="9" fill="#3a73a8" text-anchor="middle">frozen at training</text>

<path d="M180,240 Q280,240 340,140 Q380,80 420,140 Q480,240 580,240" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="2"/>
<text x="430" y="110" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">P_production</text>
<text x="430" y="125" font-size="9" fill="#d97706" text-anchor="middle">slowly moving</text>

<line x1="300" y1="80" x2="300" y2="240" stroke="#3a73a8" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="380" y1="80" x2="380" y2="240" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
<path d="M300,170 L380,170" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow-drift)"/>
<text x="340" y="165" font-size="10" font-weight="600" fill="#b91c1c" text-anchor="middle">shift</text>

<text x="320" y="290" font-size="10" font-style="italic" fill="#718096" text-anchor="middle">KL(P_prod ‖ P_val) is what every drift detector approximates along some marginal.</text>
</svg>