<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="OWASP Top 10 for LLMs grouped into three attack families: Input Manipulation (LLM01 Prompt Injection, LLM04 Model DoS, LLM09 Overreliance), Data and Model Exploitation (LLM03 Data Poisoning, LLM05 Supply Chain, others), and a third family of trust-boundary violations, each with its own defense stack." role="img" style="font-family: sans-serif;" viewBox="0 -8 840 428" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow-a1" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<!-- Family 1: Input Manipulation -->
<rect fill="#fce4ec" filter="url(#shadow-a1)" height="350" rx="12" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="260" x="20" y="50"></rect>
<rect fill="#e94560" height="40" rx="12" width="260" x="20" y="50"></rect>
<rect fill="#e94560" height="15" width="260" x="20" y="75"></rect>
<text fill="white" font-size="14" font-weight="700" text-anchor="middle" x="150" y="76">Input Manipulation</text>
<rect fill="white" height="52" rx="8" stroke="#e94560" stroke-linecap="round" stroke-width="1.5" width="230" x="35" y="100"></rect>
<text fill="#e94560" font-size="13" font-weight="600" text-anchor="middle" x="150" y="120">LLM01: Prompt Injection</text>
<text fill="#555" font-size="11" text-anchor="middle" x="150" y="140">Direct + indirect manipulation</text>
<rect fill="white" height="52" rx="8" stroke="#e94560" stroke-linecap="round" stroke-width="1.5" width="230" x="35" y="162"></rect>
<text fill="#e94560" font-size="13" font-weight="600" text-anchor="middle" x="150" y="182">LLM04: Model DoS</text>
<text fill="#555" font-size="11" text-anchor="middle" x="150" y="202">Resource exhaustion via queries</text>
<rect fill="white" height="52" rx="8" stroke="#e94560" stroke-linecap="round" stroke-width="1.5" width="230" x="35" y="224"></rect>
<text fill="#e94560" font-size="13" font-weight="600" text-anchor="middle" x="150" y="244">LLM09: Overreliance</text>
<text fill="#555" font-size="11" text-anchor="middle" x="150" y="264">Trusting outputs blindly</text>
<rect fill="#e94560" height="30" opacity="0.15" rx="6" width="190" x="55" y="295"></rect>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="150" y="315">Defense: Input validation</text>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="150" y="335">+ rate limiting</text>
<text fill="#e94560" font-size="11" font-weight="600" text-anchor="middle" x="150" y="355">+ human oversight</text>
<!-- Family 2: Data &amp; Model Exploitation -->
<rect fill="#fff3e0" filter="url(#shadow-a1)" height="350" rx="12" stroke="#ff9800" stroke-linecap="round" stroke-width="2" width="260" x="290" y="50"></rect>
<rect fill="#ff9800" height="40" rx="12" width="260" x="290" y="50"></rect>
<rect fill="#ff9800" height="15" width="260" x="290" y="75"></rect>
<text fill="white" font-size="14" font-weight="700" text-anchor="middle" x="420" y="76">Data &amp; Model Exploitation</text>
<rect fill="white" height="52" rx="8" stroke="#ff9800" stroke-linecap="round" stroke-width="1.5" width="230" x="305" y="100"></rect>
<text fill="#ff9800" font-size="13" font-weight="600" text-anchor="middle" x="420" y="120">LLM03: Data Poisoning</text>
<text fill="#555" font-size="11" text-anchor="middle" x="420" y="140">Corrupted training data</text>
<rect fill="white" height="52" rx="8" stroke="#ff9800" stroke-linecap="round" stroke-width="1.5" width="230" x="305" y="162"></rect>
<text fill="#ff9800" font-size="13" font-weight="600" text-anchor="middle" x="420" y="182">LLM05: Supply Chain</text>
<text fill="#555" font-size="11" text-anchor="middle" x="420" y="202">Compromised models or plugins</text>
<rect fill="white" height="52" rx="8" stroke="#ff9800" stroke-linecap="round" stroke-width="1.5" width="230" x="305" y="224"></rect>
<text fill="#ff9800" font-size="13" font-weight="600" text-anchor="middle" x="420" y="244">LLM10: Model Theft</text>
<text fill="#555" font-size="11" text-anchor="middle" x="420" y="264">Unauthorized weight extraction</text>
<rect fill="#ff9800" height="30" opacity="0.15" rx="6" width="190" x="325" y="295"></rect>
<text fill="#ff9800" font-size="11" font-weight="600" text-anchor="middle" x="420" y="315">Defense: Provenance checks</text>
<text fill="#ff9800" font-size="11" font-weight="600" text-anchor="middle" x="420" y="335">+ access controls</text>
<text fill="#ff9800" font-size="11" font-weight="600" text-anchor="middle" x="420" y="355">+ integrity monitoring</text>
<!-- Family 3: Trust Boundary Violations -->
<rect fill="#e8f4fd" filter="url(#shadow-a1)" height="350" rx="12" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="260" x="560" y="50"></rect>
<rect fill="#3498db" height="40" rx="12" width="260" x="560" y="50"></rect>
<rect fill="#3498db" height="15" width="260" x="560" y="75"></rect>
<text fill="white" font-size="14" font-weight="700" text-anchor="middle" x="690" y="76">Trust Boundary Violations</text>
<rect fill="white" height="52" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="1.5" width="230" x="575" y="100"></rect>
<text fill="#3498db" font-size="13" font-weight="600" text-anchor="middle" x="690" y="120">LLM02: Insecure Output</text>
<text fill="#555" font-size="11" text-anchor="middle" x="690" y="140">Unvalidated model responses</text>
<rect fill="white" height="52" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="1.5" width="230" x="575" y="162"></rect>
<text fill="#3498db" font-size="13" font-weight="600" text-anchor="middle" x="690" y="182">LLM06: Info Disclosure</text>
<text fill="#555" font-size="11" text-anchor="middle" x="690" y="202">Leaking PII, secrets, prompts</text>
<rect fill="white" height="52" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="1.5" width="230" x="575" y="224"></rect>
<text fill="#3498db" font-size="13" font-weight="600" text-anchor="middle" x="690" y="244">LLM07: Insecure Plugins</text>
<text fill="#555" font-size="11" text-anchor="middle" x="690" y="264">Excessive plugin permissions</text>
<rect fill="white" height="52" rx="8" stroke="#3498db" stroke-linecap="round" stroke-width="1.5" width="230" x="575" y="284"></rect>
<text fill="#3498db" font-size="13" font-weight="600" text-anchor="middle" x="690" y="304">LLM08: Excessive Agency</text>
<text fill="#555" font-size="11" text-anchor="middle" x="690" y="324">Unintended autonomous actions</text>
<text fill="#3498db" font-size="11" font-weight="600" text-anchor="middle" x="690" y="363">Defense: Output filtering</text>
<text fill="#3498db" font-size="11" font-weight="600" text-anchor="middle" x="690" y="381">+ least privilege + sandboxing</text>
</svg>