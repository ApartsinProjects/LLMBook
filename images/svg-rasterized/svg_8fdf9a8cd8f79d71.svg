<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Speculative decoding: draft model proposes γ tokens, target model verifies in parallel" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="240" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="360" y="22">Speculative decoding: draft model proposes γ tokens, target model verifies in parallel</text>
<g transform="translate(20,46)">
<rect fill="#e3f2fd" height="44" rx="6" stroke="#1565c0" width="160"></rect>
<text fill="#0d47a1" font-size="11" font-weight="600" text-anchor="middle" x="80" y="22">draft model (small)</text>
<text fill="#0d47a1" font-size="10" text-anchor="middle" x="80" y="36">M_draft, ~1B params</text>
</g>
<g transform="translate(220,46)">
<rect fill="#fff3e0" height="44" rx="6" stroke="#a67c1a" width="200"></rect>
<text fill="#a67c1a" font-size="11" font-weight="600" text-anchor="middle" x="100" y="22">proposes γ=5 tokens autoregressively</text>
<text fill="#a67c1a" font-size="10" text-anchor="middle" x="100" y="36">t₁', t₂', t₃', t₄', t₅'</text>
</g>
<g transform="translate(460,46)">
<rect fill="#e8f5e9" height="44" rx="6" stroke="#2e7d32" width="240"></rect>
<text fill="#1b5e20" font-size="11" font-weight="600" text-anchor="middle" x="120" y="22">target model verifies in ONE forward</text>
<text fill="#1b5e20" font-size="10" text-anchor="middle" x="120" y="36">M_target, ~70B params</text>
</g>
<g transform="translate(20,116)">
<rect fill="#f5f5f5" height="100" rx="8" stroke="#888" stroke-dasharray="4,3" width="680"></rect>
<text fill="#1a1a2e" font-size="12" font-weight="700" text-anchor="middle" x="340" y="22">Acceptance loop (Leviathan et al., 2023)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="340" y="42">For i = 1..γ: accept tᵢ' with prob min(1, p_target(tᵢ')/p_draft(tᵢ'))</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="340" y="60">First reject → sample correction from (p_target − p_draft)⁺ and stop</text>
<text fill="#666" font-size="10" font-style="italic" text-anchor="middle" x="340" y="80">Output distribution is provably identical to plain target sampling.</text>
</g>
</svg>