<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Universal recipe funnel: seven domains pipe through tokenizers into a shared transformer" role="img" style="font-family:sans-serif;max-width:100%;height:auto;" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="480" width="900"></rect>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="450" y="22">The universal recipe: domain tokenizer + standard transformer</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="450" y="40">Same architecture (BERT, T5, LLaMA, GPT) powers seven domain models</text>
<!-- Domain inputs (left column) -->
<g fill="#1a1a2e" font-size="10">
<g transform="translate(20,70)">
<rect fill="#ecf6ee" height="42" rx="6" stroke="#1f7a3a" stroke-width="1.5" width="180"></rect>
<text fill="#1f7a3a" font-weight="700" text-anchor="middle" x="90" y="18">DNA</text>
<text font-size="9" text-anchor="middle" x="90" y="34">Evo-2: 4 bases, 1Mbp ctx</text>
</g>
<g transform="translate(20,120)">
<rect fill="#ecf6ee" height="42" rx="6" stroke="#1f7a3a" stroke-width="1.5" width="180"></rect>
<text fill="#1f7a3a" font-weight="700" text-anchor="middle" x="90" y="18">Proteins</text>
<text font-size="9" text-anchor="middle" x="90" y="34">ESM-2: 20 amino acids</text>
</g>
<g transform="translate(20,170)">
<rect fill="#ecf6ee" height="42" rx="6" stroke="#1f7a3a" stroke-width="1.5" width="180"></rect>
<text fill="#1f7a3a" font-weight="700" text-anchor="middle" x="90" y="18">Molecules</text>
<text font-size="9" text-anchor="middle" x="90" y="34">SMILES / SELFIES</text>
</g>
<g transform="translate(20,220)">
<rect fill="#ecf6ee" height="42" rx="6" stroke="#1f7a3a" stroke-width="1.5" width="180"></rect>
<text fill="#1f7a3a" font-weight="700" text-anchor="middle" x="90" y="18">Time series</text>
<text font-size="9" text-anchor="middle" x="90" y="34">Chronos: 4096 value bins</text>
</g>
<g transform="translate(20,270)">
<rect fill="#ecf6ee" height="42" rx="6" stroke="#1f7a3a" stroke-width="1.5" width="180"></rect>
<text fill="#1f7a3a" font-weight="700" text-anchor="middle" x="90" y="18">Audio / music</text>
<text font-size="9" text-anchor="middle" x="90" y="34">EnCodec RVQ: ~75 tok/s</text>
</g>
<g transform="translate(20,320)">
<rect fill="#ecf6ee" height="42" rx="6" stroke="#1f7a3a" stroke-width="1.5" width="180"></rect>
<text fill="#1f7a3a" font-weight="700" text-anchor="middle" x="90" y="18">Images / video</text>
<text font-size="9" text-anchor="middle" x="90" y="34">VQ-VAE codebook indices</text>
</g>
<g transform="translate(20,370)">
<rect fill="#ecf6ee" height="42" rx="6" stroke="#1f7a3a" stroke-width="1.5" width="180"></rect>
<text fill="#1f7a3a" font-weight="700" text-anchor="middle" x="90" y="18">EHR</text>
<text font-size="9" text-anchor="middle" x="90" y="34">ICD-10 + procedure codes</text>
</g>
</g>
<!-- Tokenizer column -->
<g transform="translate(250,70)">
<rect fill="#fef3e0" height="350" rx="10" stroke="#a67c1a" stroke-width="2" width="180"></rect>
<text fill="#a67c1a" font-size="12" font-weight="700" text-anchor="middle" x="90" y="22">Domain tokenizer</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="90" y="40">(the only creative step)</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="90" y="80">Pre-tokenize</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="90" y="100">domain-specific rules</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="90" y="135">BPE / Unigram /</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="90" y="150">VQ / quantization</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="90" y="170">learn vocabulary</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="90" y="210">Optional merge</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="90" y="225">with base tokenizer</text>
<text fill="#1f7a3a" font-size="10" font-weight="700" text-anchor="middle" x="90" y="265">Output: int[N]</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="90" y="282">"a token sequence is</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="90" y="296">a token sequence"</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="90" y="330">vocab size: 4 to 65k</text>
</g>
<!-- Transformer block -->
<g transform="translate(480,140)">
<rect fill="#e3e8f5" height="210" rx="12" stroke="#3d4d8a" stroke-width="2.5" width="210"></rect>
<text fill="#3d4d8a" font-size="13" font-weight="700" text-anchor="middle" x="105" y="26">Standard transformer</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="105" y="46">BERT / T5 / LLaMA / GPT</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="105" y="80">attention layers</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="105" y="100">FFN layers</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="105" y="120">positional encoding</text>
<text fill="#3d4d8a" font-size="10" font-weight="700" text-anchor="middle" x="105" y="155">objective:</text>
<text fill="#1a1a2e" font-size="9" text-anchor="middle" x="105" y="170">next-token prediction</text>
<text fill="#1a1a2e" font-size="9" text-anchor="middle" x="105" y="184">or masked-LM</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="105" y="198">(unchanged from NLP)</text>
</g>
<!-- Inherited ecosystem (right) -->
<g transform="translate(720,80)">
<rect fill="#f5e3e8" height="330" rx="10" stroke="#7a2a4a" stroke-width="2" width="160"></rect>
<text fill="#7a2a4a" font-size="12" font-weight="700" text-anchor="middle" x="80" y="22">Inherited for free</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="80" y="50">scaling laws</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="80" y="80">attention mechanisms</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="80" y="110">PEFT / LoRA</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="80" y="140">fine-tuning recipes</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="80" y="170">eval frameworks</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="80" y="200">distillation</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="80" y="230">RLHF / DPO</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="80" y="260">vLLM / flash attention</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="80" y="290">HF ecosystem</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="80" y="316">decades of NLP infra</text>
</g>
<!-- Arrows -->
<g fill="none" stroke="#1a1a2e" stroke-width="1.5">
<path d="M 200 90 L 250 145"></path>
<path d="M 200 140 L 250 175"></path>
<path d="M 200 190 L 250 215"></path>
<path d="M 200 240 L 250 245"></path>
<path d="M 200 290 L 250 275"></path>
<path d="M 200 340 L 250 305"></path>
<path d="M 200 390 L 250 335"></path>
<path d="M 430 245 L 480 245" marker-end="url(#arr804)" stroke-width="2.5"></path>
<path d="M 690 245 L 720 245" marker-end="url(#arr804)" stroke-width="2.5"></path>
</g>
<defs>
<marker id="arr804" markerheight="10" markerunits="strokeWidth" markerwidth="10" orient="auto" refx="9" refy="3.5"><polygon fill="#1a1a2e" points="0 0, 10 3.5, 0 7"></polygon></marker>
</defs>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="450" y="460">Every successful non-text LLM (Evo-2, ESM-2, Chronos, AudioLM, BEHRT) follows this three-step pipeline.</text>
</svg>