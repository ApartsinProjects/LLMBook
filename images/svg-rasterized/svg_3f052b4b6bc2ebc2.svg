<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Ragas four-metric map: a 2x2 of question, retrieved context, generated answer, and ground truth, with arrows showing which inputs each metric compares. Faithfulness compares answer to context, answer relevance compares answer to question, context precision and context recall compare retrieved context to question and to ground truth respectively." role="img" viewbox="0 0 780 320" xmlns="http://www.w3.org/2000/svg">
<rect fill="#fafafa" height="310" rx="10" stroke="#ddd" width="770" x="5" y="5"></rect>
<rect fill="#e3f2fd" height="55" rx="6" stroke="#1565c0" width="180" x="25" y="35"></rect>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="115" y="58">Question q</text>
<text fill="#1565c0" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="115" y="76">"What changed in v3.2?"</text>
<rect fill="#fff3e0" height="55" rx="6" stroke="#e65100" width="180" x="285" y="35"></rect>
<text fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="375" y="58">Retrieved context C</text>
<text fill="#e65100" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="375" y="76">top-k chunks</text>
<rect fill="#e8f5e9" height="55" rx="6" stroke="#2e7d32" width="180" x="545" y="35"></rect>
<text fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="635" y="58">Generated answer a</text>
<text fill="#2e7d32" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="635" y="76">LLM output</text>
<rect fill="#f3e5f5" height="55" rx="6" stroke="#7b1fa2" width="180" x="285" y="225"></rect>
<text fill="#4a148c" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="375" y="248">Ground truth g</text>
<text fill="#7b1fa2" font-family="Consolas, monospace" font-size="10" text-anchor="middle" x="375" y="266">human reference</text>
<g fill="none" stroke="#c62828" stroke-width="2">
<line x1="465" x2="543" y1="62" y2="62"></line>
<polygon fill="#c62828" points="543 62, 535 58, 535 66"></polygon>
</g>
<text fill="#c62828" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" x="468" y="55">Faithfulness</text>
<text fill="#c62828" font-family="Segoe UI, system-ui, sans-serif" font-size="9" x="468" y="79">(a entailed by C?)</text>
<g fill="none" stroke="#1565c0" stroke-width="2">
<path d="M115,90 Q115,160 545,90"></path>
<polygon fill="#1565c0" points="545 90, 538 88, 540 95"></polygon>
</g>
<text fill="#1565c0" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" x="270" y="130">Answer relevance</text>
<text fill="#1565c0" font-family="Segoe UI, system-ui, sans-serif" font-size="9" x="270" y="145">(a addresses q?)</text>
<g fill="none" stroke="#e65100" stroke-width="2">
<line x1="205" x2="283" y1="62" y2="62"></line>
<polygon fill="#e65100" points="283 62, 275 58, 275 66"></polygon>
</g>
<text fill="#e65100" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" x="208" y="55">Context precision</text>
<text fill="#e65100" font-family="Segoe UI, system-ui, sans-serif" font-size="9" x="208" y="79">(C ranked usefully for q?)</text>
<g fill="none" stroke="#7b1fa2" stroke-width="2">
<line x1="375" x2="375" y1="222" y2="92"></line>
<polygon fill="#7b1fa2" points="375 92, 372 100, 378 100"></polygon>
</g>
<text fill="#7b1fa2" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" x="385" y="160">Context recall</text>
<text fill="#7b1fa2" font-family="Segoe UI, system-ui, sans-serif" font-size="9" x="385" y="175">(g supported by C?)</text>
<rect fill="#fff" height="40" rx="6" stroke="#888" stroke-dasharray="4,3" width="720" x="25" y="170"></rect>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle" x="385" y="195">Each metric is computed by an LLM-as-judge; Ragas pins the judge model and version.</text>
</svg>