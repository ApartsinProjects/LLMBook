<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 290" role="img" aria-label="Eval-in-prod: the loop that keeps your test set honest" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;">
<defs>
<marker id="arrow-evalprod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
</marker>
</defs>
<text x="360" y="22" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">Eval-in-prod: the loop that keeps your test set honest</text>

<rect x="30" y="115" width="130" height="50" rx="8" fill="#dbeafe" stroke="#3a73a8" stroke-width="1.5"/>
<text x="95" y="138" font-size="11" font-weight="600" fill="#2d3748" text-anchor="middle">Production traffic</text>
<text x="95" y="153" font-size="9" fill="#4a5568" text-anchor="middle">live user queries</text>

<rect x="195" y="115" width="130" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="260" y="138" font-size="11" font-weight="600" fill="#2d3748" text-anchor="middle">Sample 50-100/wk</text>
<text x="260" y="153" font-size="9" fill="#4a5568" text-anchor="middle">stratified by intent</text>

<rect x="360" y="115" width="130" height="50" rx="8" fill="#fed7aa" stroke="#d97706" stroke-width="1.5"/>
<text x="425" y="138" font-size="11" font-weight="600" fill="#2d3748" text-anchor="middle">Label</text>
<text x="425" y="153" font-size="9" fill="#4a5568" text-anchor="middle">human or LLM-judge</text>

<rect x="525" y="115" width="170" height="50" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="610" y="138" font-size="11" font-weight="600" fill="#2d3748" text-anchor="middle">Merge into golden set</text>
<text x="610" y="153" font-size="9" fill="#4a5568" text-anchor="middle">eval distribution tracks prod</text>

<rect x="360" y="220" width="170" height="50" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
<text x="445" y="243" font-size="11" font-weight="600" fill="#2d3748" text-anchor="middle">Deploy decision</text>
<text x="445" y="258" font-size="9" fill="#4a5568" text-anchor="middle">prompt / model / index update</text>

<rect x="195" y="220" width="130" height="50" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="260" y="243" font-size="11" font-weight="600" fill="#2d3748" text-anchor="middle">Re-run eval</text>
<text x="260" y="258" font-size="9" fill="#4a5568" text-anchor="middle">on refreshed set</text>

<path d="M160,140 L190,140" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-evalprod)"/>
<path d="M325,140 L355,140" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-evalprod)"/>
<path d="M490,140 L520,140" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-evalprod)"/>
<path d="M610,165 Q610,200 530,235" stroke="#4a5568" stroke-width="1.5" fill="none" marker-end="url(#arrow-evalprod)"/>
<path d="M360,245 L325,245" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-evalprod)"/>
<path d="M260,220 Q200,200 95,165" stroke="#4a5568" stroke-width="1.5" fill="none" marker-end="url(#arrow-evalprod)"/>

<text x="95" y="60" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">Without this loop: test set stales,</text>
<text x="95" y="75" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">dashboard greens up, prod degrades.</text>
</svg>