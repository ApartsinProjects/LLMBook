<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="AWQ: identify salient weight channels via activation magnitude, then pre-scale" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="220" width="720"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="360" y="22">AWQ: identify salient weight channels via activation magnitude, then pre-scale</text>
<g transform="translate(30,46)">
<rect fill="#fff3e0" height="150" rx="8" stroke="#a67c1a" width="200"></rect>
<text fill="#a67c1a" font-size="11" font-weight="700" text-anchor="middle" x="100" y="22">Step 1: activation calibration</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="100" y="42">run 128 samples through layer</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="100" y="58">measure per-channel mean(|x_c|)</text>
<text fill="#a67c1a" font-size="10" font-weight="700" text-anchor="middle" x="100" y="78">~1% of channels have</text>
<text fill="#a67c1a" font-size="10" font-weight="700" text-anchor="middle" x="100" y="92">10-100× larger activations</text>
<text fill="#a67c1a" font-size="10" font-style="italic" text-anchor="middle" x="100" y="116">these are the "salient" channels</text>
<text fill="#a67c1a" font-size="10" font-style="italic" text-anchor="middle" x="100" y="132">whose weights matter most</text>
</g>
<g transform="translate(260,46)">
<rect fill="#e3f2fd" height="150" rx="8" stroke="#1565c0" width="200"></rect>
<text fill="#0d47a1" font-size="11" font-weight="700" text-anchor="middle" x="100" y="22">Step 2: scale &amp; quantize</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="100" y="42">multiply W's salient cols by s_c</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="100" y="58">divide x's salient rows by s_c</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="100" y="78">output Wx is invariant</text>
<text fill="#0d47a1" font-size="10" font-weight="700" text-anchor="middle" x="100" y="100">then quantize W' to 4-bit</text>
<text fill="#1565c0" font-size="10" font-style="italic" text-anchor="middle" x="100" y="120">salient weights now fit the</text>
<text fill="#1565c0" font-size="10" font-style="italic" text-anchor="middle" x="100" y="134">quantization grid more accurately</text>
</g>
<g transform="translate(490,46)">
<rect fill="#e8f5e9" height="150" rx="8" stroke="#2e7d32" width="200"></rect>
<text fill="#1b5e20" font-size="11" font-weight="700" text-anchor="middle" x="100" y="22">Step 3: deploy</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="100" y="42">store 4-bit W' + scales s</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="100" y="58">no runtime reconstruction</text>
<text fill="#1a1a2e" font-size="10" text-anchor="middle" x="100" y="78">runs in standard INT4 kernels</text>
<text fill="#1b5e20" font-size="10" font-weight="700" text-anchor="middle" x="100" y="100">Result on Llama-3.1-8B:</text>
<text fill="#1b5e20" font-size="10" text-anchor="middle" x="100" y="116">ppl 6.38 (vs FP16 6.14)</text>
<text fill="#1b5e20" font-size="10" text-anchor="middle" x="100" y="130">memory 4.5 GB (vs 16.1 GB)</text>
</g>
</svg>