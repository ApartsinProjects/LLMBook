<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="ReAct Thought-Action-Observation loop with explicit feedback edge and termination on FINAL ANSWER" role="img" viewbox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="rxArrow" markerheight="10" markerwidth="10" orient="auto" refx="8" refy="3">
<path d="M0,0 L0,6 L8,3 z" fill="#3a4a7a"></path>
</marker>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="360" y="22">The ReAct Thought / Action / Observation loop</text>
<rect fill="#f0e6ff" height="80" rx="10" stroke="#8e44ad" stroke-width="2" width="170" x="40" y="80"></rect>
<text fill="#2d3436" font-size="13" font-weight="700" text-anchor="middle" x="125" y="108">Thought</text>
<text fill="#444" font-size="10" text-anchor="middle" x="125" y="128">LLM reasons over</text>
<text fill="#444" font-size="10" text-anchor="middle" x="125" y="143">trajectory so far</text>
<rect fill="#e8f5e9" height="80" rx="10" stroke="#27ae60" stroke-width="2" width="170" x="270" y="80"></rect>
<text fill="#2d3436" font-size="13" font-weight="700" text-anchor="middle" x="355" y="108">Action</text>
<text fill="#444" font-size="10" text-anchor="middle" x="355" y="128">emit tool_name(args)</text>
<text fill="#444" font-size="10" text-anchor="middle" x="355" y="143">or FINAL_ANSWER</text>
<rect fill="#e8f4fd" height="80" rx="10" stroke="#3498db" stroke-width="2" width="170" x="500" y="80"></rect>
<text fill="#2d3436" font-size="13" font-weight="700" text-anchor="middle" x="585" y="108">Observation</text>
<text fill="#444" font-size="10" text-anchor="middle" x="585" y="128">tool returns result;</text>
<text fill="#444" font-size="10" text-anchor="middle" x="585" y="143">appended to context</text>
<line marker-end="url(#rxArrow)" stroke="#3a4a7a" stroke-width="2" x1="210" x2="270" y1="120" y2="120"></line>
<line marker-end="url(#rxArrow)" stroke="#3a4a7a" stroke-width="2" x1="440" x2="500" y1="120" y2="120"></line>
<path d="M 585 160 Q 585 220 125 220 Q 125 200 125 160" fill="none" marker-end="url(#rxArrow)" stroke="#3a4a7a" stroke-width="2"></path>
<text fill="#444" font-size="11" font-style="italic" text-anchor="middle" x="355" y="238">Observation feeds back into the next Thought; loop until FINAL_ANSWER or step budget S.</text>
<rect fill="#fff8e1" height="32" rx="6" stroke="#d97706" stroke-width="1.5" width="170" x="270" y="180"></rect>
<text fill="#5a4a3a" font-size="11" font-weight="700" text-anchor="middle" x="355" y="201">if FINAL_ANSWER: stop</text>
<line marker-end="url(#rxArrow)" stroke="#3a4a7a" stroke-width="2" x1="355" x2="355" y1="160" y2="180"></line>
</g>
</svg>