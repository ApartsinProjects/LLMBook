<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Matryoshka embedding structure: a single 768-dimensional vector contains nested valid embeddings at 64d (about 90% recall), 128d, 256d (about 96% recall), 512d, and full 768d (100% recall), enabling truncation to any prefix." role="img" viewbox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad_63166f_e8eaf6" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7f9ff"></stop><stop offset="100%" stop-color="#e8eaf6"></stop></lineargradient>
<filter height="115%" id="shadow_63166f" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
</defs>
<!-- Full 768-dim bar -->
<rect fill="url(#grad_63166f_e8eaf6)" filter="url(#shadow_63166f)" height="40" rx="6" stroke="#3f51b5" stroke-linecap="round" stroke-width="1.5" width="600" x="50" y="30"></rect>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="13" text-anchor="middle" x="350" y="55">Full 768 dimensions</text>
<!-- Nested sub-regions -->
<rect fill="#e94560" height="35" opacity="0.8" rx="5" width="75" x="50" y="90"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="87" y="112">64d</text>
<rect fill="#f39c12" height="35" opacity="0.8" rx="5" width="75" x="125" y="90"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="162" y="112">128d</text>
<rect fill="#27ae60" height="35" opacity="0.8" rx="5" width="125" x="200" y="90"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="262" y="112">256d</text>
<rect fill="#3498db" height="35" opacity="0.8" rx="5" width="150" x="325" y="90"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="400" y="112">512d</text>
<rect fill="#8e44ad" height="35" opacity="0.8" rx="5" width="175" x="475" y="90"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="562" y="112">768d (full)</text>
<!-- Labels -->
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="87.0" x2="87.2" y1="137.0" y2="127.0"></line>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="87" y="150">~90% recall</text>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="262.0" x2="262.2" y1="137.0" y2="127.0"></line>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="262" y="150">~96% recall</text>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="562.0" x2="562.2" y1="137.0" y2="127.0"></line>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="562" y="150">100% recall</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="350" y="185">Truncate to any prefix for a valid embedding</text>
</svg>