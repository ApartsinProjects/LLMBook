<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Chinchilla compute-optimal frontier (log-log)" style="font-family:sans-serif;max-width:100%;height:auto;" viewbox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="360" width="620"></rect>
<text fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle" x="310" y="22">Chinchilla compute-optimal frontier (log-log)</text>
<line stroke="#1a1a2e" stroke-width="1.5" x1="80" x2="580" y1="300" y2="300"></line>
<line stroke="#1a1a2e" stroke-width="1.5" x1="80" x2="80" y1="60" y2="300"></line>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="330" y="335">parameters N (log scale)</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" transform="rotate(-90 20 180)" x="20" y="180">tokens D (log scale)</text>
<text fill="#555" font-size="9" x="100" y="316">1B</text>
<text fill="#555" font-size="9" x="220" y="316">10B</text>
<text fill="#555" font-size="9" x="340" y="316">70B</text>
<text fill="#555" font-size="9" x="460" y="316">300B</text>
<text fill="#555" font-size="9" text-anchor="end" x="60" y="290">100B</text>
<text fill="#555" font-size="9" text-anchor="end" x="60" y="220">1T</text>
<text fill="#555" font-size="9" text-anchor="end" x="60" y="150">10T</text>
<text fill="#555" font-size="9" text-anchor="end" x="60" y="80">100T</text>
<path d="M 100 290 L 580 60" fill="none" stroke="#3d4d8a" stroke-width="2.2"></path>
<text fill="#3d4d8a" font-size="10" font-weight="600" x="460" y="72">D = 20 N (Chinchilla)</text>
<path d="M 100 250 L 580 20" fill="none" stroke="#27ae60" stroke-dasharray="5,3" stroke-width="1.5"></path>
<text fill="#27ae60" font-size="9" x="200" y="240">isocompute C = 6 N D (higher)</text>
<path d="M 100 320 L 540 90" fill="none" stroke="#c0392b" stroke-dasharray="5,3" stroke-width="1.5"></path>
<text fill="#c0392b" font-size="9" x="400" y="180">isocompute (lower budget)</text>
<circle cx="460" cy="265" fill="#e67e22" r="5" stroke="#1a1a2e"></circle>
<text fill="#1a1a2e" font-size="10" x="380" y="262">GPT-3 (175B, 300B tok) - undertrained</text>
<circle cx="340" cy="200" fill="#27ae60" r="5" stroke="#1a1a2e"></circle>
<text fill="#1a1a2e" font-size="10" x="348" y="197">Chinchilla (70B, 1.4T tok) - optimal</text>
<circle cx="220" cy="110" fill="#8e44ad" r="5" stroke="#1a1a2e"></circle>
<text fill="#1a1a2e" font-size="10" x="228" y="107">Llama-3 8B (15T tok) - over-trained</text>
</svg>