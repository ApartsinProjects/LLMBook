<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;" aria-label="LLaVA mid-fusion: visual tokens prepended to text in the LLM's embedding space">
<rect width="720" height="240" fill="#ffffff"/>
<text x="360" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">LLaVA mid-fusion: visual tokens prepended to text in the LLM's embedding space</text>
<g transform="translate(30,50)">
<rect width="120" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
<text x="60" y="28" font-size="11" font-weight="700" text-anchor="middle" fill="#0d47a1">image I</text>
<text x="60" y="46" font-size="10" text-anchor="middle" fill="#0d47a1">336&#215;336 px</text>
</g>
<g transform="translate(170,50)">
<rect width="120" height="60" rx="6" fill="#fff3e0" stroke="#a67c1a"/>
<text x="60" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">CLIP ViT-L/14</text>
<text x="60" y="40" font-size="10" text-anchor="middle" fill="#a67c1a">frozen</text>
<text x="60" y="54" font-size="9" text-anchor="middle" fill="#666">&#8594; 576&#215;1024</text>
</g>
<g transform="translate(310,50)">
<rect width="120" height="60" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
<text x="60" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#c2185b">MLP &#966;</text>
<text x="60" y="38" font-size="10" text-anchor="middle" fill="#c2185b">2-layer, trainable</text>
<text x="60" y="52" font-size="9" text-anchor="middle" fill="#666">&#8594; 576&#215;4096</text>
</g>
<g transform="translate(30,140)">
<rect width="260" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="130" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#1b5e20">text T</text>
<text x="130" y="40" font-size="10" text-anchor="middle" fill="#1b5e20">embedding(T) &#8594; T&#215;4096</text>
</g>
<g transform="translate(450,50)">
<rect width="230" height="150" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
<text x="115" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#4a148c">LLM (Mistral/Vicuna)</text>
<text x="115" y="46" font-size="10" text-anchor="middle" fill="#6a1b9a">input = [visual tokens ; text tokens]</text>
<text x="115" y="64" font-size="10" text-anchor="middle" fill="#6a1b9a">(576 + |T|) &#215; 4096 sequence</text>
<text x="115" y="100" font-size="11" font-weight="600" text-anchor="middle" fill="#4a148c">cross-attention happens INSIDE</text>
<text x="115" y="116" font-size="10" text-anchor="middle" fill="#6a1b9a">the LLM's normal self-attention</text>
<text x="115" y="130" font-size="10" text-anchor="middle" fill="#6a1b9a">(no extra modules needed)</text>
</g>
<line x1="150" y1="80" x2="170" y2="80" stroke="#444" stroke-width="2" marker-end="url(#llavArr)"/>
<line x1="290" y1="80" x2="310" y2="80" stroke="#444" stroke-width="2" marker-end="url(#llavArr)"/>
<line x1="430" y1="80" x2="450" y2="80" stroke="#444" stroke-width="2" marker-end="url(#llavArr)"/>
<line x1="290" y1="170" x2="450" y2="125" stroke="#444" stroke-width="2" marker-end="url(#llavArr)"/>
<defs><marker id="llavArr" markerwidth="8" markerheight="8" refx="7" refy="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#444"/></marker></defs>
</svg>