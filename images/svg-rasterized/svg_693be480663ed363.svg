<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Top-2-of-8 MoE routing on a single token. The router emits softmax weights, the top-$k$ experts are activated, and their outputs are combined into $y$. The other six experts contribute nothing to this token, so the active FLOP count is $2/8$ of a dense layer of equivalent size." style="font-family: sans-serif; max-width: 100%; height: auto;" viewbox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="260" width="720"></rect>
<!-- Token input -->
<rect fill="#1a4078" height="40" rx="4" width="100" x="20" y="110"></rect>
<text fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" x="70" y="135">Token x</text>
<!-- Router -->
<rect fill="#a67c1a" height="60" rx="4" width="110" x="160" y="100"></rect>
<text fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle" x="215" y="125">Router</text>
<text fill="#ffffff" font-size="11" text-anchor="middle" x="215" y="143">softmax(W_r x)</text>
<line marker-end="url(#arrow)" stroke="#333" stroke-width="2" x1="120" x2="160" y1="130" y2="130"></line>
<!-- Experts column -->
<g font-size="11" text-anchor="middle">
<rect fill="#cccccc" height="30" rx="3" width="100" x="320" y="20"></rect>
<text fill="#555" x="370" y="40">FFN expert 1</text>
<rect fill="#1f7a3a" height="30" rx="3" width="100" x="320" y="58"></rect>
<text fill="#ffffff" font-weight="600" x="370" y="78">FFN expert 2  (selected)</text>
<rect fill="#cccccc" height="30" rx="3" width="100" x="320" y="96"></rect>
<text fill="#555" x="370" y="116">FFN expert 3</text>
<rect fill="#cccccc" height="30" rx="3" width="100" x="320" y="134"></rect>
<text fill="#555" x="370" y="154">FFN expert 4</text>
<rect fill="#1f7a3a" height="30" rx="3" width="100" x="320" y="172"></rect>
<text fill="#ffffff" font-weight="600" x="370" y="192">FFN expert 5  (selected)</text>
<rect fill="#cccccc" height="30" rx="3" width="100" x="320" y="210"></rect>
<text fill="#555" x="370" y="230">FFN experts 6-8 ...</text>
</g>
<line marker-end="url(#arrow)" stroke="#1f7a3a" stroke-width="2" x1="270" x2="320" y1="130" y2="73"></line>
<line marker-end="url(#arrow)" stroke="#1f7a3a" stroke-width="2" x1="270" x2="320" y1="130" y2="187"></line>
<!-- Combine -->
<rect fill="#1a4078" height="40" rx="4" width="120" x="490" y="110"></rect>
<text fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle" x="550" y="128">Weighted sum</text>
<text fill="#ffffff" font-size="10" text-anchor="middle" x="550" y="143">g_2 FFN_2 + g_5 FFN_5</text>
<line marker-end="url(#arrow)" stroke="#1f7a3a" stroke-width="2" x1="420" x2="490" y1="73" y2="125"></line>
<line marker-end="url(#arrow)" stroke="#1f7a3a" stroke-width="2" x1="420" x2="490" y1="187" y2="135"></line>
<!-- Output -->
<rect fill="#4a7fc0" height="40" rx="4" width="60" x="650" y="110"></rect>
<text fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" x="680" y="135">y</text>
<line marker-end="url(#arrow)" stroke="#333" stroke-width="2" x1="610" x2="650" y1="130" y2="130"></line>
<defs>
<marker id="arrow" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10">
<polygon fill="#333" points="0 0, 10 5, 0 10"></polygon>
</marker>
</defs>
</svg>