<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="RAPTOR recursive tree: leaf chunks at the bottom, then clustered LLM summaries at level 1, then summary-of-summaries at level 2, with a root node at the top. Each level reduces node count by roughly 5x." role="img" viewbox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="raptor_leaf" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3e0"></stop><stop offset="100%" stop-color="#ffe0b2"></stop></lineargradient>
<lineargradient id="raptor_l1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e3f2fd"></stop><stop offset="100%" stop-color="#bbdefb"></stop></lineargradient>
<lineargradient id="raptor_l2" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f3e5f5"></stop><stop offset="100%" stop-color="#e1bee7"></stop></lineargradient>
<lineargradient id="raptor_root" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e8f5e9"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
</defs>
<rect fill="#fafafa" height="310" rx="10" stroke="#ddd" width="750" x="5" y="5"></rect>
<!-- Root (Layer 3) -->
<rect fill="url(#raptor_root)" height="30" rx="6" stroke="#2e7d32" stroke-width="1.5" width="130" x="315" y="25"></rect>
<text fill="#1b5e20" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="380" y="45">Root summary</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="20" y="45">Layer 3</text>
<!-- Layer 2: 2 nodes -->
<rect fill="url(#raptor_l2)" height="30" rx="6" stroke="#7b1fa2" width="110" x="220" y="95"></rect>
<rect fill="url(#raptor_l2)" height="30" rx="6" stroke="#7b1fa2" width="110" x="430" y="95"></rect>
<text fill="#4a148c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="275" y="115">L2 summary A</text>
<text fill="#4a148c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="485" y="115">L2 summary B</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="20" y="115">Layer 2</text>
<!-- Layer 1: 4 nodes -->
<rect fill="url(#raptor_l1)" height="28" rx="6" stroke="#1565c0" width="95" x="115" y="165"></rect>
<rect fill="url(#raptor_l1)" height="28" rx="6" stroke="#1565c0" width="95" x="245" y="165"></rect>
<rect fill="url(#raptor_l1)" height="28" rx="6" stroke="#1565c0" width="95" x="395" y="165"></rect>
<rect fill="url(#raptor_l1)" height="28" rx="6" stroke="#1565c0" width="95" x="525" y="165"></rect>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="162" y="184">L1 sum</text>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="292" y="184">L1 sum</text>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="442" y="184">L1 sum</text>
<text fill="#0d47a1" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="572" y="184">L1 sum</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="20" y="184">Layer 1</text>
<!-- Layer 0: 8 leaf chunks -->
<g fill="url(#raptor_leaf)" stroke="#ef6c00">
<rect height="26" rx="4" width="65" x="75" y="240"></rect>
<rect height="26" rx="4" width="65" x="150" y="240"></rect>
<rect height="26" rx="4" width="65" x="225" y="240"></rect>
<rect height="26" rx="4" width="65" x="300" y="240"></rect>
<rect height="26" rx="4" width="65" x="375" y="240"></rect>
<rect height="26" rx="4" width="65" x="450" y="240"></rect>
<rect height="26" rx="4" width="65" x="525" y="240"></rect>
<rect height="26" rx="4" width="65" x="600" y="240"></rect>
</g>
<g fill="#bf360c" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle">
<text x="107" y="257">chunk 1</text>
<text x="182" y="257">chunk 2</text>
<text x="257" y="257">chunk 3</text>
<text x="332" y="257">chunk 4</text>
<text x="407" y="257">chunk 5</text>
<text x="482" y="257">chunk 6</text>
<text x="557" y="257">chunk 7</text>
<text x="632" y="257">chunk 8</text>
</g>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="20" y="257">Layer 0</text>
<!-- Edges -->
<g stroke="#999" stroke-width="1">
<line x1="345" x2="275" y1="55" y2="95"></line>
<line x1="415" x2="485" y1="55" y2="95"></line>
<line x1="275" x2="162" y1="125" y2="165"></line>
<line x1="275" x2="292" y1="125" y2="165"></line>
<line x1="485" x2="442" y1="125" y2="165"></line>
<line x1="485" x2="572" y1="125" y2="165"></line>
<line x1="162" x2="107" y1="193" y2="240"></line>
<line x1="162" x2="182" y1="193" y2="240"></line>
<line x1="292" x2="257" y1="193" y2="240"></line>
<line x1="292" x2="332" y1="193" y2="240"></line>
<line x1="442" x2="407" y1="193" y2="240"></line>
<line x1="442" x2="482" y1="193" y2="240"></line>
<line x1="572" x2="557" y1="193" y2="240"></line>
<line x1="572" x2="632" y1="193" y2="240"></line>
</g>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="540" y="290">cluster + LLM summary at each level</text>
</svg>