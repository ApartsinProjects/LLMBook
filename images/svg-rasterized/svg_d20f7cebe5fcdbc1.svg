<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: Evaluation and Iteration" role="img" viewbox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
<rect fill="url(#grad_996ea5_f8f9fa)" filter="url(#shadow_996ea5)" height="190" rx="10" stroke="#ddd" stroke-linecap="round" width="690" x="5" y="5"></rect>
<!-- Cycle steps -->
<rect fill="url(#grad_996ea5_e3f2fd)" height="45" rx="6" stroke="#1976d2" stroke-linecap="round" width="130" x="30" y="55"></rect>
<text fill="#1565c0" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="95" y="75">Configure</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="95" y="90">Strategy + params</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="16" x="175" y="82">→</text>
<rect fill="#e8f5e9" height="45" rx="6" stroke="#388e3c" stroke-linecap="round" width="130" x="195" y="55"></rect>
<text fill="#2e7d32" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="260" y="75">Chunk + Embed</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="260" y="90">Process test docs</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="16" x="340" y="82">→</text>
<rect fill="url(#grad_996ea5_fce4ec)" height="45" rx="6" stroke="#c62828" stroke-linecap="round" width="130" x="360" y="55"></rect>
<text fill="#c62828" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="425" y="75">Evaluate</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="425" y="90">Recall@k, MRR</text>
<text fill="#999" font-family="Segoe UI, system-ui, sans-serif" font-size="16" x="505" y="82">→</text>
<rect fill="url(#grad_996ea5_fff3e0)" height="45" rx="6" stroke="#e65100" stroke-linecap="round" width="130" x="525" y="55"></rect>
<text fill="#e65100" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="590" y="75">Analyze</text>
<text fill="#555" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="590" y="90">Failure cases</text>
<!-- Feedback loop -->
<path d="M590 105 L590 140 L95 140 L95 105" fill="none" marker-end="url(#loopArrow)" stroke="#999" stroke-dasharray="5,3" stroke-linecap="round" stroke-width="1.5"></path>
<text fill="#666" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="350" y="158">Iterate: adjust strategy, chunk size, overlap, metadata</text>
<defs>
<lineargradient id="grad_996ea5_e3f2fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f2ffff"></stop><stop offset="100%" stop-color="#e3f2fd"></stop></lineargradient>
<lineargradient id="grad_996ea5_f8f9fa" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#f8f9fa"></stop></lineargradient>
<lineargradient id="grad_996ea5_fce4ec" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff3fb"></stop><stop offset="100%" stop-color="#fce4ec"></stop></lineargradient>
<lineargradient id="grad_996ea5_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<filter height="115%" id="shadow_996ea5" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
