<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Diagram: MemGPT / Letta Architecture" role="img" viewbox="0 -9 720 389" xmlns="http://www.w3.org/2000/svg">
<!-- LLM Agent box -->
<rect fill="#0d3b66" filter="url(#shadow_78d815)" height="70" rx="12" stroke="none" width="280" x="220" y="45"></rect>
<text fill="white" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="360" y="72">LLM Agent (Controller)</text>
<text fill="#aaa" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="360" y="100">Decides when to read/write/search memory</text>
<!-- Memory function calls -->
<line marker-end="url(#memArrow2)" stroke="#3498db" stroke-linecap="round" stroke-width="2" x1="260" x2="140" y1="115" y2="160"></line>
<line marker-end="url(#memArrow2)" stroke="#6a1b9a" stroke-linecap="round" stroke-width="2" x1="360" x2="360" y1="115" y2="160"></line>
<line marker-end="url(#memArrow2)" stroke="#27ae60" stroke-linecap="round" stroke-width="2" x1="460" x2="580" y1="115" y2="160"></line>
<!-- Three memory tiers -->
<rect fill="url(#grad_78d815_e8f4fd)" height="90" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="200" x="40" y="165"></rect>
<text fill="#2980b9" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="140" y="190">Working Context</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="55" y="210">In-context "scratchpad"</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="55" y="226">Editable by the agent</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="55" y="242">Fast, limited capacity</text>
<rect fill="#f5eef8" height="90" rx="10" stroke="#6a1b9a" stroke-linecap="round" stroke-width="2" width="200" x="260" y="165"></rect>
<text fill="#6a1b9a" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="360" y="190">Archival Memory</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="275" y="210">Vector store (unlimited)</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="275" y="226">Semantic search retrieval</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="275" y="242">Slow, persistent</text>
<rect fill="#e8f5e9" height="90" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="200" x="480" y="165"></rect>
<text fill="#27ae60" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="580" y="190">Recall Memory</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="495" y="210">Conversation history</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="495" y="226">Searchable past turns</text>
<text fill="#888" font-family="Segoe UI, system-ui, sans-serif" font-size="11" x="495" y="242">Paginated access</text>
<!-- Function labels -->
<rect fill="url(#grad_78d815_dbeafe)" height="35" rx="6" stroke="#3498db" stroke-linecap="round" stroke-width="1" width="160" x="60" y="280"></rect>
<text fill="#2980b9" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="140" y="302">core_memory_append()</text>
<rect fill="#ede9fe" height="35" rx="6" stroke="#6a1b9a" stroke-linecap="round" stroke-width="1" width="160" x="240" y="280"></rect>
<text fill="#6a1b9a" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="320" y="302">archival_insert()</text>
<rect fill="#ede9fe" height="35" rx="6" stroke="#6a1b9a" stroke-linecap="round" stroke-width="1" width="160" x="420" y="280"></rect>
<text fill="#6a1b9a" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="500" y="302">archival_search()</text>
<rect fill="#dcfce7" height="35" rx="6" stroke="#27ae60" stroke-linecap="round" stroke-width="1" width="160" x="240" y="325"></rect>
<text fill="#27ae60" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="320" y="347">recall_search()</text>
<rect fill="url(#grad_78d815_dbeafe)" height="35" rx="6" stroke="#3498db" stroke-linecap="round" stroke-width="1" width="160" x="420" y="325"></rect>
<text fill="#2980b9" font-family="Consolas, monospace" font-size="11" text-anchor="middle" x="500" y="347">core_memory_replace()</text>
<defs>
<lineargradient id="grad_78d815_dbeafe" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#eaf9ff"></stop><stop offset="100%" stop-color="#dbeafe"></stop></lineargradient>
<lineargradient id="grad_78d815_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_78d815" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="memArrow2" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5">
<polygon fill="#555" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
</svg>