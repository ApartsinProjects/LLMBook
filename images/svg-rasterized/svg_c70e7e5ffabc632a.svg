<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The Purdue model (ISA-95 / ANSI standard) mapped to where an LLM is permitted in a 2026 manufacturing deployment." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" style="max-width:880px;background:#fafafa;border:1px solid #ddd;font-family:sans-serif;">
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle">Purdue model: where the LLM may live and where it must not</text>
<line x1="60" y1="60" x2="60" y2="400" stroke="#333" stroke-width="2"/>
<line x1="60" y1="400" x2="820" y2="400" stroke="#333" stroke-width="2"/>
<text x="40" y="220" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(-90 40 220)">Trust / determinism increases</text>
<rect x="80" y="70" width="720" height="50" fill="#d4efdf" stroke="#27ae60"/>
<text x="92" y="92" font-size="11" font-weight="700" fill="#117a65">Level 5: Enterprise IT (cloud)</text>
<text x="92" y="108" font-size="10">Frontier LLMs (Claude, GPT-4.1) for research, drafting; PLM and ERP integration</text>
<rect x="80" y="125" width="720" height="50" fill="#d4efdf" stroke="#27ae60"/>
<text x="92" y="147" font-size="11" font-weight="700" fill="#117a65">Level 4: Site Business (plant-floor IT)</text>
<text x="92" y="163" font-size="10">Air-gapped vLLM / NIM serving Llama-3 70B; per-site retrieval over local SOP corpus</text>
<rect x="80" y="180" width="720" height="40" fill="#fcf3cf" stroke="#f1c40f"/>
<text x="92" y="200" font-size="11" font-weight="700" fill="#7d6608">DMZ: one-way data diode / audited gateway (signed instructions only)</text>
<text x="92" y="214" font-size="10">Human approval required for any change-management ticket flowing down</text>
<rect x="80" y="225" width="720" height="40" fill="#fadbd8" stroke="#c0392b"/>
<text x="92" y="244" font-size="11" font-weight="700" fill="#922b21">Level 3: Manufacturing Operations Management (MES, historian)</text>
<text x="92" y="258" font-size="10" fill="#922b21">No LLM: deterministic OEE, batch records, recipe management; reads up to L4 only</text>
<rect x="80" y="270" width="720" height="40" fill="#fadbd8" stroke="#c0392b"/>
<text x="92" y="289" font-size="11" font-weight="700" fill="#922b21">Level 2: Supervisory Control (SCADA, HMI)</text>
<text x="92" y="303" font-size="10" fill="#922b21">No LLM: real-time alarm aggregation, setpoint visualization</text>
<rect x="80" y="315" width="720" height="40" fill="#fadbd8" stroke="#c0392b"/>
<text x="92" y="334" font-size="11" font-weight="700" fill="#922b21">Level 1: Basic Control (PLCs, DCS controllers, motor drives)</text>
<text x="92" y="348" font-size="10" fill="#922b21">No LLM: deterministic control loops; IEC 61131-3 ladder logic; ISO 26262 / IEC 61508</text>
<rect x="80" y="360" width="720" height="35" fill="#fadbd8" stroke="#c0392b"/>
<text x="92" y="378" font-size="11" font-weight="700" fill="#922b21">Level 0: Physical Process (sensors, actuators, the machine itself)</text>
<text x="92" y="391" font-size="10" fill="#922b21">No LLM: the physical world; injury, scrap, fire if the wrong number arrives</text>
<text x="830" y="92" font-size="10" fill="#117a65">LLM-safe</text>
<text x="830" y="147" font-size="10" fill="#117a65">LLM-safe</text>
<text x="830" y="200" font-size="10" fill="#7d6608">Approval</text>
<text x="830" y="244" font-size="10" fill="#922b21">NO LLM</text>
<text x="830" y="289" font-size="10" fill="#922b21">NO LLM</text>
<text x="830" y="334" font-size="10" fill="#922b21">NO LLM</text>
<text x="830" y="378" font-size="10" fill="#922b21">NO LLM</text>
</svg>