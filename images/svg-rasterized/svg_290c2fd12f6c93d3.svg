<line marker-end="url(#arr15_1)" stroke="#e94560" stroke-linecap="round" stroke-width="2" x1="430" x2="580" y1="60" y2="120"></line>
<rect fill="url(#grad_2f02dd_e8f4fd)" filter="url(#shadow1)" height="180" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="148" x="56" y="120"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="130" y="150">Cost Reduction</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="130" y="175">10x to 100x cheaper</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="130" y="195">than human annotation.</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="130" y="215">Generate thousands of</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="130" y="235">examples for pennies.</text>
<rect fill="url(#grad_2f02dd_f0e6ff)" filter="url(#shadow1)" height="180" rx="10" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="148" x="206" y="120"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="280" y="150">Privacy</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="280" y="175">Generate realistic data</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="280" y="195">without exposing PII.</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="280" y="215">HIPAA/GDPR compliant</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="280" y="235">training data.</text>
<rect fill="#e8f5e9" filter="url(#shadow1)" height="180" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="148" x="356" y="120"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="430" y="150">Coverage</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="430" y="175">Fill gaps in rare edge</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="430" y="195">cases and low-resource</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="430" y="215">languages. Target specific</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="430" y="235">distribution gaps.</text>
<rect fill="url(#grad_2f02dd_fef9e7)" filter="url(#shadow1)" height="180" rx="10" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="148" x="506" y="120"></rect>
<text fill="#0f3460" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="580" y="150">Scale</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="580" y="175">Generate millions of</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="580" y="195">examples in hours,</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="580" y="215">not months. Iterate</text>
<text fill="#333" font-family="Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle" x="580" y="235">rapidly on data needs.</text>
