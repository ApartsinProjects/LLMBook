<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg role="img" aria-label="Apple Intelligence three-tier routing: on-device, Private Cloud Compute, partner cloud" viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;max-width:100%;height:auto;">
<rect width="880" height="420" fill="#ffffff"/>
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Apple Intelligence three-tier routing (iOS 19, 2026)</text>
<text x="440" y="40" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Most queries never leave the phone; the classifier on-device decides</text>
<!-- Layer 1: phone (~70-85%) -->
<g transform="translate(60,70)">
<rect x="0" y="8" width="200" height="320" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
<text x="100" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">On-device</text>
<text x="100" y="38" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">iPhone 17, M-series</text>
<g font-size="10" fill="#1a1a2e">
<text x="14" y="64">Apple Foundation</text>
<text x="14" y="78">Model ~3B (QAT)</text>
<text x="14" y="98">Runtime: MLX on</text>
<text x="14" y="112">ANE + GPU</text>
<text x="14" y="132">Unified memory:</text>
<text x="14" y="146">8-32 GB shared</text>
<text x="14" y="166">First token ~200 ms</text>
<text x="14" y="180">TPOT ~30-60 tok/s</text>
<text x="14" y="200">Net cost per query: $0</text>
<text x="14" y="214">Network latency: 0 ms</text>
</g>
<rect x="14" y="250" width="172" height="56" rx="3" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
<text x="100" y="270" font-size="22" font-weight="700" text-anchor="middle" fill="#1f7a3a">70-85%</text>
<text x="100" y="290" font-size="9" font-style="italic" text-anchor="middle" fill="#1a1a2e">of routine queries</text>
</g>
<!-- Layer 2: Private Cloud Compute (~10-25%) -->
<g transform="translate(340,70)">
<rect x="0" y="8" width="200" height="320" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
<text x="100" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Private Cloud Compute</text>
<text x="100" y="38" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Apple datacenter, MLX</text>
<g font-size="10" fill="#1a1a2e">
<text x="14" y="64">Larger Apple model</text>
<text x="14" y="78">attested enclave</text>
<text x="14" y="98">Hardened MLX</text>
<text x="14" y="112">inference fabric</text>
<text x="14" y="132">Cryptographic proof</text>
<text x="14" y="146">of "stateless run"</text>
<text x="14" y="166">First token ~500 ms</text>
<text x="14" y="180">includes net hop</text>
<text x="14" y="200">Triggered by:</text>
<text x="14" y="214">privacy + complexity</text>
</g>
<rect x="14" y="250" width="172" height="56" rx="3" fill="#ffffff" stroke="#a67c1a" stroke-width="1"/>
<text x="100" y="270" font-size="22" font-weight="700" text-anchor="middle" fill="#a67c1a">10-25%</text>
<text x="100" y="290" font-size="9" font-style="italic" text-anchor="middle" fill="#1a1a2e">complex private queries</text>
</g>
<!-- Layer 3: partner cloud (~3-7%) -->
<g transform="translate(620,70)">
<rect x="0" y="8" width="200" height="320" rx="8" fill="#f8e3e3" stroke="#7a2a2a" stroke-width="2.5"/>
<text x="100" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#7a2a2a">Partner cloud (consent)</text>
<text x="100" y="38" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">Apple-Anthropic / OpenAI</text>
<g font-size="10" fill="#1a1a2e">
<text x="14" y="64">Frontier capability</text>
<text x="14" y="78">Claude / GPT</text>
<text x="14" y="98">Explicit per-query</text>
<text x="14" y="112">consent prompt</text>
<text x="14" y="132">For multi-hop</text>
<text x="14" y="146">research, code synth,</text>
<text x="14" y="160">novel-domain tasks</text>
<text x="14" y="180">First token ~1-2 s</text>
<text x="14" y="200">Apple pays partner</text>
<text x="14" y="214">per million tokens</text>
</g>
<rect x="14" y="250" width="172" height="56" rx="3" fill="#ffffff" stroke="#7a2a2a" stroke-width="1"/>
<text x="100" y="270" font-size="22" font-weight="700" text-anchor="middle" fill="#7a2a2a">3-7%</text>
<text x="100" y="290" font-size="9" font-style="italic" text-anchor="middle" fill="#1a1a2e">frontier-needed queries</text>
</g>
<!-- arrows escalation -->
<g stroke="#1a1a2e" stroke-width="2" fill="none">
<path d="M 260 230 L 340 230" marker-end="url(#arr583)"/>
<path d="M 540 230 L 620 230" marker-end="url(#arr583)"/>
</g>
<text x="300" y="222" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">escalate</text>
<text x="580" y="222" font-size="9" font-style="italic" text-anchor="middle" fill="#5a4a3a">consent + escalate</text>
<defs><marker id="arr583" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#1a1a2e"/></marker></defs>
</svg>