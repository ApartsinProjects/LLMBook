<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three evaluation axes for unlearning: Forget Quality (forget-set accuracy, target near random), Retain Quality (retain-set accuracy, target unchanged), and Privacy (membership inference AUC, target 0.5)." role="img" style="font-family: sans-serif;" viewBox="0 -10 600 270" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow2" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<rect fill="#fce4ec" filter="url(#shadow2)" height="180" rx="12" stroke="#e94560" stroke-linecap="round" stroke-width="2" width="175" x="20" y="55"></rect>
<text fill="#e94560" font-size="13" font-weight="700" text-anchor="middle" x="107" y="83">Forget Quality</text>
<text fill="#333" font-size="11" text-anchor="middle" x="107" y="110">Can the model still</text>
<text fill="#333" font-size="11" text-anchor="middle" x="107" y="128">reproduce the data?</text>
<text fill="#666" font-size="11" text-anchor="middle" x="107" y="158">Metric: accuracy on</text>
<text fill="#666" font-size="11" text-anchor="middle" x="107" y="176">forget set (lower = better)</text>
<text fill="#e94560" font-size="11" text-anchor="middle" x="107" y="210">Target: near random</text>
<rect fill="#e8f5e9" filter="url(#shadow2)" height="180" rx="12" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="175" x="212" y="55"></rect>
<text fill="#27ae60" font-size="13" font-weight="700" text-anchor="middle" x="300" y="83">Retain Quality</text>
<text fill="#333" font-size="11" text-anchor="middle" x="300" y="110">Does the model still</text>
<text fill="#333" font-size="11" text-anchor="middle" x="300" y="128">work on other tasks?</text>
<text fill="#666" font-size="11" text-anchor="middle" x="300" y="158">Metric: accuracy on</text>
<text fill="#666" font-size="11" text-anchor="middle" x="300" y="176">retain set (higher = better)</text>
<text fill="#27ae60" font-size="11" text-anchor="middle" x="300" y="210">Target: unchanged</text>
<rect fill="#f0e6ff" filter="url(#shadow2)" height="180" rx="12" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="175" x="405" y="55"></rect>
<text fill="#8e44ad" font-size="13" font-weight="700" text-anchor="middle" x="492" y="83">Privacy</text>
<text fill="#333" font-size="11" text-anchor="middle" x="492" y="110">Can an attacker detect</text>
<text fill="#333" font-size="11" text-anchor="middle" x="492" y="128">the removed data?</text>
<text fill="#666" font-size="11" text-anchor="middle" x="492" y="158">Metric: MIA AUC</text>
<text fill="#666" font-size="11" text-anchor="middle" x="492" y="176">(closer to 0.5 = better)</text>
<text fill="#8e44ad" font-size="11" text-anchor="middle" x="492" y="210">Target: 0.5 (random)</text>
</svg>