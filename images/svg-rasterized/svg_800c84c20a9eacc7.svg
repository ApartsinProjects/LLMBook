<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Ablation study of a RAG pipeline: baseline scores 0.847; removing chain-of-thought drops it 15.9% (largest impact), system prompt 6.6%, GPT-4o swap 5.2%, reranker 3.3%, few-shot 2.8%." role="img" style="font-family: sans-serif;" viewBox="0 -9 750 337" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow3" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="375" y="25">Ablation Study: <a aria-label="RAG" href="../../part-7-retrieval-information-extraction-with-llms/module-32-rag/index.html">RAG</a> Pipeline Components</text>
<!-- Full system -->
<rect fill="#27ae60" filter="url(#shadow3)" height="50" opacity="0.9" rx="8" width="720" x="15" y="45"></rect>
<text fill="white" font-size="12" font-weight="600" text-anchor="middle" x="375" y="65">Full System (Baseline): System Prompt + Few-Shot + Section 9.1 + Reranker + GPT-4o</text>
<text fill="white" font-size="11" text-anchor="end" x="710" y="82">Score: 0.847</text>
<!-- Ablation rows -->
<rect fill="#fef9e7" height="36" rx="6" stroke="#f39c12" stroke-linecap="round" stroke-width="1" width="720" x="15" y="105"></rect>
<text fill="#333" font-size="11" x="30" y="128">Ablation 1: Remove system prompt</text>
<rect fill="#f39c12" height="24" rx="4" width="80" x="560" y="111"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="600" y="128">0.791</text>
<text fill="#c0392b" font-size="11" font-weight="600" x="660" y="128">↓ 6.6%</text>
<rect fill="#fef9e7" height="36" rx="6" stroke="#f39c12" stroke-linecap="round" stroke-width="1" width="720" x="15" y="150"></rect>
<text fill="#333" font-size="11" x="30" y="173">Ablation 2: Remove few-shot examples</text>
<rect fill="#f39c12" height="24" rx="4" width="80" x="560" y="156"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="600" y="173">0.823</text>
<text fill="#c0392b" font-size="11" font-weight="600" x="660" y="173">↓ 2.8%</text>
<rect fill="#fef9e7" height="36" rx="6" stroke="#f39c12" stroke-linecap="round" stroke-width="1" width="720" x="15" y="195"></rect>
<text fill="#333" font-size="11" x="30" y="218">Ablation 3: Remove chain-of-thought</text>
<rect fill="#e74c3c" height="24" rx="4" width="80" x="560" y="201"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="600" y="218">0.712</text>
<text fill="#c0392b" font-size="11" font-weight="600" x="660" y="218">↓ 15.9%</text>
<rect fill="#fef9e7" height="36" rx="6" stroke="#f39c12" stroke-linecap="round" stroke-width="1" width="720" x="15" y="240"></rect>
<text fill="#333" font-size="11" x="30" y="263">Ablation 4: Remove reranker (top-k only)</text>
<rect fill="#f39c12" height="24" rx="4" width="80" x="560" y="246"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="600" y="263">0.819</text>
<text fill="#c0392b" font-size="11" font-weight="600" x="660" y="263">↓ 3.3%</text>
<rect fill="#fef9e7" height="36" rx="6" stroke="#f39c12" stroke-linecap="round" stroke-width="1" width="720" x="15" y="285"></rect>
<text fill="#333" font-size="11" x="30" y="308">Ablation 5: Replace GPT-4o with GPT-4o-mini</text>
<rect fill="#f39c12" height="24" rx="4" width="80" x="560" y="291"></rect>
<text fill="white" font-size="11" font-weight="600" text-anchor="middle" x="600" y="308">0.803</text>
<text fill="#c0392b" font-size="11" font-weight="600" x="660" y="308">↓ 5.2%</text>
</svg>