<text x="370" y="229" fill="#94a3b8" font-style="italic">rare</text>
<text x="490" y="221" font-weight="700" fill="#1a1a2e">Voice clone</text>
<text x="490" y="236" fill="#3d4f3d">speaker sim</text>
