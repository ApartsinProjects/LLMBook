<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Modality matrix table with inputs on rows (text, image, audio, video) and outputs on columns (text, image, audio, video). Each cell labels the eval regime: text-text is standard NLP, image-text is VQA, audio-text is ASR, video-text is video QA, text-image is image generation, text-audio is TTS, text-video is video gen. Cross-modal cells show the benchmark families." role="img" style="max-width:100%;height:auto;" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="mm435shadow" x="-4%" y="-4%" width="108%" height="108%">
<feDropShadow dx="1" dy="1" stdDeviation="1.2" flood-opacity="0.16"/>
</filter>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">The modality matrix: every cell is a separate eval regime</text>
<text x="120" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Input \ Output</text>
<g font-size="11" font-weight="700" fill="#1a1a2e" text-anchor="middle">
<text x="250" y="50">Text out</text>
<text x="370" y="50">Image out</text>
<text x="490" y="50">Audio out</text>
<text x="610" y="50">Video out</text>
</g>
<g font-size="11" font-weight="700" fill="#1a1a2e" text-anchor="end">
<text x="115" y="92">Text in</text>
<text x="115" y="160">Image in</text>
<text x="115" y="228">Audio in</text>
<text x="115" y="296">Video in</text>
</g>
<g stroke="#94a3b8" stroke-width="0.6">
<rect x="190" y="62" width="120" height="56" rx="4" fill="#f1f5f9" filter="url(#mm435shadow)"/>
<rect x="310" y="62" width="120" height="56" rx="4" fill="#e3f2fd" filter="url(#mm435shadow)"/>
<rect x="430" y="62" width="120" height="56" rx="4" fill="#fff3e0" filter="url(#mm435shadow)"/>
<rect x="550" y="62" width="120" height="56" rx="4" fill="#fce4ec" filter="url(#mm435shadow)"/>
