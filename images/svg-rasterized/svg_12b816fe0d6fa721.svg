<rect x="550" y="130" width="120" height="56" rx="4" fill="#f5f5f5" filter="url(#mm435shadow)"/>
<rect x="190" y="198" width="120" height="56" rx="4" fill="#fff3e0" filter="url(#mm435shadow)"/>
<rect x="310" y="198" width="120" height="56" rx="4" fill="#f5f5f5" filter="url(#mm435shadow)"/>
<rect x="430" y="198" width="120" height="56" rx="4" fill="#e8f5e9" filter="url(#mm435shadow)"/>
<rect x="550" y="198" width="120" height="56" rx="4" fill="#f5f5f5" filter="url(#mm435shadow)"/>
<rect x="190" y="266" width="120" height="56" rx="4" fill="#fce4ec" filter="url(#mm435shadow)"/>
<rect x="310" y="266" width="120" height="56" rx="4" fill="#f5f5f5" filter="url(#mm435shadow)"/>
