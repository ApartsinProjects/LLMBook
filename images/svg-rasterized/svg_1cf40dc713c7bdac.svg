<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Production training tooling stack" role="img" style="font-family: sans-serif; max-width: 100%; height: auto;" viewbox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="420" width="900"></rect>
<!-- Layer 1: Framework -->
<g transform="translate(60, 60)">
<rect fill="#eef4fa" height="60" rx="6" stroke="#1a4078" stroke-width="2" width="780" x="0" y="0"></rect>
<text fill="#1a4078" font-size="13" font-weight="700" x="14" y="22">Framework layer</text>
<text fill="#1a1a2e" font-size="12" x="120" y="22">• PyTorch + FSDP2</text>
<text fill="#1a1a2e" font-size="12" x="260" y="22">• Megatron-Core</text>
<text fill="#1a1a2e" font-size="12" x="390" y="22">• NeMo</text>
<text fill="#1a1a2e" font-size="12" x="470" y="22">• DeepSpeed</text>
<text fill="#1a1a2e" font-size="12" x="580" y="22">• MosaicML Composer</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" x="14" y="46">Sharding strategy, parallelism config, autograd graph</text>
</g>
<!-- Layer 2: Distributed primitives -->
<g transform="translate(60, 130)">
<rect fill="#ecf6ee" height="60" rx="6" stroke="#1f7a3a" stroke-width="2" width="780" x="0" y="0"></rect>
<text fill="#1f7a3a" font-size="13" font-weight="700" x="14" y="22">Distributed primitives</text>
<text fill="#1a1a2e" font-size="12" x="170" y="22">• NCCL / RCCL / oneCCL</text>
<text fill="#1a1a2e" font-size="12" x="350" y="22">• TorchElastic / c10d rendezvous</text>
<text fill="#1a1a2e" font-size="12" x="600" y="22">• UCC, MPI</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" x="14" y="46">Collectives, rendezvous, failure detection</text>
</g>
<!-- Layer 3: Orchestration -->
<g transform="translate(60, 200)">
<rect fill="#fef3e0" height="60" rx="6" stroke="#a67c1a" stroke-width="2" width="780" x="0" y="0"></rect>
<text fill="#a67c1a" font-size="13" font-weight="700" x="14" y="22">Orchestration</text>
<text fill="#1a1a2e" font-size="12" x="130" y="22">• Slurm</text>
<text fill="#1a1a2e" font-size="12" x="200" y="22">• Kubeflow / Kueue</text>
<text fill="#1a1a2e" font-size="12" x="350" y="22">• SkyPilot</text>
<text fill="#1a1a2e" font-size="12" x="440" y="22">• AWS Batch / SageMaker</text>
<text fill="#1a1a2e" font-size="12" x="650" y="22">• Ray Train</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" x="14" y="46">Provisioning, spot recovery, elastic scheduling</text>
</g>
<!-- Layer 4: Observability -->
<g transform="translate(60, 270)">
<rect fill="#fce8e8" height="60" rx="6" stroke="#9a2828" stroke-width="2" width="780" x="0" y="0"></rect>
<text fill="#9a2828" font-size="13" font-weight="700" x="14" y="22">Observability</text>
<text fill="#1a1a2e" font-size="12" x="140" y="22">• Weights &amp; Biases</text>
<text fill="#1a1a2e" font-size="12" x="290" y="22">• MLflow</text>
<text fill="#1a1a2e" font-size="12" x="370" y="22">• TensorBoard</text>
<text fill="#1a1a2e" font-size="12" x="480" y="22">• Datadog / Prometheus</text>
<text fill="#1a1a2e" font-size="12" x="660" y="22">• nsys / dcgm</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" x="14" y="46">Per-rank loss, gradient norm, MFU, thermal, NCCL flame graphs</text>
</g>
<!-- Layer 5: Storage -->
<g transform="translate(60, 340)">
<rect fill="#f3e8fc" height="60" rx="6" stroke="#5f2a8a" stroke-width="2" width="780" x="0" y="0"></rect>
<text fill="#5f2a8a" font-size="13" font-weight="700" x="14" y="22">Storage</text>
<text fill="#1a1a2e" font-size="12" x="100" y="22">• Lustre / GPFS</text>
<text fill="#1a1a2e" font-size="12" x="240" y="22">• Tectonic</text>
<text fill="#1a1a2e" font-size="12" x="340" y="22">• FSx for Lustre</text>
<text fill="#1a1a2e" font-size="12" x="470" y="22">• GCSFuse / S3 Mountpoint</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" x="14" y="46">Parallel checkpoints, dataset, GPUDirect-Storage</text>
</g>
</svg>