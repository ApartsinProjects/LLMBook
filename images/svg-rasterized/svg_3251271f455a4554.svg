<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Multi-judge ensemble: residual biases partly cancel" role="img" style="max-width:100%;height:auto;display:block;margin:1.5rem auto;font-family:sans-serif;" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow-ensemble" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"></path>
</marker>
</defs>
<text fill="#2d3748" font-size="14" font-weight="600" text-anchor="middle" x="360" y="22">Multi-judge ensemble: residual biases partly cancel</text>
<rect fill="#dbeafe" height="50" rx="8" stroke="#3a73a8" stroke-width="1.5" width="160" x="30" y="80"></rect>
<text fill="#2d3748" font-size="11" font-weight="600" text-anchor="middle" x="110" y="103">Comparison (q, r_A, r_B)</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="110" y="117">same input to all judges</text>
<rect fill="#fef3c7" height="40" rx="8" stroke="#d97706" stroke-width="1.5" width="160" x="260" y="40"></rect>
<text fill="#d97706" font-size="10" font-weight="600" text-anchor="middle" x="340" y="58">GPT-4 judge</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="340" y="72">verdict: A wins</text>
<rect fill="#fce7f3" height="40" rx="8" stroke="#be185d" stroke-width="1.5" width="160" x="260" y="95"></rect>
<text fill="#be185d" font-size="10" font-weight="600" text-anchor="middle" x="340" y="113">Claude judge</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="340" y="127">verdict: A wins</text>
<rect fill="#d1fae5" height="40" rx="8" stroke="#047857" stroke-width="1.5" width="160" x="260" y="150"></rect>
<text fill="#047857" font-size="10" font-weight="600" text-anchor="middle" x="340" y="168">Prometheus judge</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="340" y="182">verdict: B wins</text>
<rect fill="#fef3c7" height="50" rx="8" stroke="#d97706" stroke-width="1.5" width="180" x="490" y="80"></rect>
<text fill="#d97706" font-size="11" font-weight="600" text-anchor="middle" x="580" y="103">Majority: A wins</text>
<text fill="#4a5568" font-size="9" text-anchor="middle" x="580" y="117">confidence: 2/3</text>
<path d="M190,95 L256,60" marker-end="url(#arrow-ensemble)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M190,105 L256,115" marker-end="url(#arrow-ensemble)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M190,120 L256,170" marker-end="url(#arrow-ensemble)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M420,60 L488,95" marker-end="url(#arrow-ensemble)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M420,115 L488,107" marker-end="url(#arrow-ensemble)" stroke="#4a5568" stroke-width="1.5"></path>
<path d="M420,170 L488,120" marker-end="url(#arrow-ensemble)" stroke="#4a5568" stroke-width="1.5"></path>
<text fill="#4a5568" font-size="10" font-style="italic" text-anchor="middle" x="360" y="230">Each judge has its own residual biases (RLHF style preferences,</text>
<text fill="#4a5568" font-size="10" font-style="italic" text-anchor="middle" x="360" y="244">vocabulary leanings, position effects). Because the biases are</text>
<text fill="#4a5568" font-size="10" font-style="italic" text-anchor="middle" x="360" y="258">partially uncorrelated, the majority verdict has lower residual</text>
<text fill="#4a5568" font-size="10" font-style="italic" text-anchor="middle" x="360" y="272">bias than any individual judge. Stack with length-controlled</text>
<text fill="#4a5568" font-size="10" font-style="italic" text-anchor="middle" x="360" y="286">scoring (AlpacaEval LC) for the strongest signal.</text>
</svg>