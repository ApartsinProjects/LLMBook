<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="L2 regularization geometry: elliptical contours of the data loss are centered at the unregularized minimum; a circular L2 penalty is centered at the origin. The regularized solution sits where the smallest data-loss contour first touches the L2 ball, pulling the optimum toward zero in every direction without driving any single weight exactly to zero." role="img" style="max-width:700px;width:100%;height:auto;background:#fafafa;border-radius:8px;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="l2Arr" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#444"></path></marker>
</defs>
<text fill="#222" font-size="14" font-weight="700" text-anchor="middle" x="350" y="22">L2 regularization shrinks the optimum toward the origin</text>
<g transform="translate(80,40)">
<line stroke="#888" stroke-width="1" x1="0" x2="540" y1="120" y2="120"></line>
<line stroke="#888" stroke-width="1" x1="270" x2="270" y1="0" y2="240"></line>
<text fill="#666" font-size="11" x="540" y="135">w₁</text>
<text fill="#666" font-size="11" x="260" y="10">w₂</text>
<ellipse cx="380" cy="80" fill="none" rx="110" ry="60" stroke="#1565c0" stroke-width="1.4"></ellipse>
<ellipse cx="380" cy="80" fill="none" rx="70" ry="38" stroke="#1565c0" stroke-width="1.4"></ellipse>
<ellipse cx="380" cy="80" fill="none" rx="35" ry="20" stroke="#1565c0" stroke-width="1.4"></ellipse>
<circle cx="380" cy="80" fill="#0d47a1" r="5"></circle>
<text fill="#0d47a1" font-size="12" font-weight="700" x="400" y="78">unregularized min  w*</text>
<text fill="#1565c0" font-size="11" x="400" y="92">(large weights, may overfit)</text>
<circle cx="270" cy="120" fill="none" r="100" stroke="#e65100" stroke-dasharray="6 4" stroke-width="1.4"></circle>
<text fill="#e65100" font-size="11" x="160" y="225">L2 ball  Σ wᵢ² ≤ t (radius set by λ)</text>
<circle cx="333" cy="98" fill="#2e7d32" r="6" stroke="#1b5e20" stroke-width="1.5"></circle>
<text fill="#1b5e20" font-size="12" font-weight="700" x="343" y="113">regularized min  w₆</text>
<line marker-end="url(#l2Arr)" stroke="#444" stroke-dasharray="3 3" stroke-width="1" x1="270" x2="333" y1="120" y2="98"></line>
<text fill="#444" font-size="11" x="288" y="143">shrinkage</text>
</g>
</svg>