<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Linear chain of four boxes: Source, Build, Attestation, Verify and deploy" role="img" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
<rect x="20" y="80" width="100" height="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="4"/><text x="70" y="110" font-size="12" font-weight="bold" text-anchor="middle">Source</text><rect x="170" y="80" width="100" height="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="4"/><text x="220" y="110" font-size="12" font-weight="bold" text-anchor="middle">Build</text><rect x="320" y="80" width="120" height="50" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="4"/><text x="380" y="108" font-size="12" font-weight="bold" text-anchor="middle">Attestation</text><text x="380" y="124" font-size="10" text-anchor="middle">(signed)</text><rect x="490" y="80" width="100" height="50" fill="#fce4ec" stroke="#ad1457" stroke-width="2" rx="4"/><text x="540" y="108" font-size="12" font-weight="bold" text-anchor="middle">Verify</text><text x="540" y="124" font-size="10" text-anchor="middle">+ deploy</text><path d="M 120 105 L 170 105" stroke="#555" stroke-width="2"/><path d="M 270 105 L 320 105" stroke="#555" stroke-width="2"/><path d="M 440 105 L 490 105" stroke="#555" stroke-width="2"/>
