<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The 2026 multi-stage recommendation funnel as deployed at Spotify, Pinterest, YouTube, Amazon, Netflix, and TikTok." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" style="max-width:880px;background:#fafafa;border:1px solid #ddd;font-family:sans-serif;">
<text x="440" y="22" font-size="14" font-weight="700" text-anchor="middle">The 2026 recommendation funnel: where LLMs do (and do not) live</text>
<rect x="40" y="60" width="160" height="80" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
<text x="120" y="80" font-size="11" font-weight="700" text-anchor="middle">1. Candidate generation</text>
<text x="120" y="98" font-size="10" text-anchor="middle">millions -&gt; ~10,000</text>
<text x="120" y="114" font-size="10" text-anchor="middle">CLIP + FAISS / ScaNN</text>
<text x="120" y="130" font-size="10" text-anchor="middle">few ms</text>
<line x1="200" y1="100" x2="240" y2="100" stroke="#333" stroke-width="2" marker-end="url(#ah78)"/>
<defs><marker id="ah78" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker></defs>
<rect x="240" y="60" width="160" height="80" fill="#fcf3cf" stroke="#f1c40f" stroke-width="2"/>
<text x="320" y="80" font-size="11" font-weight="700" text-anchor="middle">2. First-stage rank</text>
<text x="320" y="98" font-size="10" text-anchor="middle">10,000 -&gt; ~1,000</text>
<text x="320" y="114" font-size="10" text-anchor="middle">GBDT or small TF</text>
<text x="320" y="130" font-size="10" text-anchor="middle">~10 ms</text>
<line x1="400" y1="100" x2="440" y2="100" stroke="#333" stroke-width="2" marker-end="url(#ah78)"/>
<rect x="440" y="60" width="160" height="80" fill="#fcf3cf" stroke="#f1c40f" stroke-width="2"/>
<text x="520" y="80" font-size="11" font-weight="700" text-anchor="middle">3. Final-stage rank</text>
<text x="520" y="98" font-size="10" text-anchor="middle">1,000 -&gt; ~100</text>
<text x="520" y="114" font-size="10" text-anchor="middle">DLRM / transformer</text>
<text x="520" y="130" font-size="10" text-anchor="middle">~30 ms</text>
<line x1="600" y1="100" x2="640" y2="100" stroke="#333" stroke-width="2" marker-end="url(#ah78)"/>
<rect x="640" y="60" width="160" height="80" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
<text x="720" y="80" font-size="11" font-weight="700" text-anchor="middle">4. LLM rerank + explain</text>
<text x="720" y="98" font-size="10" text-anchor="middle">100 -&gt; top 10 + reason</text>
<text x="720" y="114" font-size="10" text-anchor="middle">Claude Haiku, GPT-mini</text>
<text x="720" y="130" font-size="10" text-anchor="middle">~300 ms</text>
<rect x="40" y="180" width="160" height="40" fill="#e8daef" stroke="#8e44ad"/>
<text x="120" y="200" font-size="10" text-anchor="middle">item / user embeddings</text>
<text x="120" y="214" font-size="10" text-anchor="middle">(LLM-derived for cold start)</text>
<rect x="640" y="180" width="160" height="40" fill="#e8daef" stroke="#8e44ad"/>
<text x="720" y="200" font-size="10" text-anchor="middle">"because you liked X"</text>
<text x="720" y="214" font-size="10" text-anchor="middle">(Spotify Daylist, Netflix)</text>
<text x="120" y="244" font-size="11" font-style="italic" fill="#16a085" text-anchor="middle">LLM upstream</text>
<text x="720" y="244" font-size="11" font-style="italic" fill="#16a085" text-anchor="middle">LLM downstream</text>
<text x="420" y="244" font-size="11" font-style="italic" fill="#7d6608" text-anchor="middle">LLMs do NOT run here (cost &gt; budget)</text>
<text x="120" y="262" font-size="10" text-anchor="middle">item desc -&gt; embedding</text>
<text x="720" y="262" font-size="10" text-anchor="middle">explain, refine, converse</text>
<text x="420" y="262" font-size="10" text-anchor="middle">trillions / day, ms-scale</text>
<text x="440" y="300" font-size="11" font-weight="700" text-anchor="middle">Total p95 budget: ~400 ms per user request, trillions of requests / day across the industry</text>
</svg>