<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Four-stage prompt chain that routes each stage to an appropriately sized model: Stage 1 Extract (gpt-4o-mini), Stage 2 Analyze (gpt-4o), Stage 3 Validate (gpt-4o-mini), Stage 4 Format (gpt-4o-mini); outputs cascade as raw text into entities into validated entities into final output." font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 0 740 300" xmlns="http://www.w3.org/2000/svg">
<!-- Stage 1 -->
<rect fill="url(#grad_351dbb_e8f4fd)" filter="url(#shadow_351dbb)" height="80" rx="10" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="150" x="20" y="50"></rect>
<text fill="#3498db" font-size="11" font-weight="700" text-anchor="middle" x="95" y="75">Stage 1: Extract</text>
<text fill="#555" font-size="11" text-anchor="middle" x="95" y="93">Parse raw input into</text>
<text fill="#555" font-size="11" text-anchor="middle" x="95" y="106">structured entities</text>
<text fill="#888" font-size="11" text-anchor="middle" x="95" y="122">Model: gpt-4o-mini</text>
<!-- Arrow -->
<line marker-end="url(#arrowCh)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="170" x2="210" y1="90" y2="90"></line>
<!-- Stage 2 -->
<rect fill="url(#grad_351dbb_f0e6ff)" height="80" rx="10" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="150" x="215" y="50"></rect>
<text fill="#8e44ad" font-size="11" font-weight="700" text-anchor="middle" x="290" y="75">Stage 2: Analyze</text>
<text fill="#555" font-size="11" text-anchor="middle" x="290" y="93">Reason about entities</text>
<text fill="#555" font-size="11" text-anchor="middle" x="290" y="106">and relationships</text>
<text fill="#888" font-size="11" text-anchor="middle" x="290" y="122">Model: gpt-4o</text>
<!-- Arrow -->
<line marker-end="url(#arrowCh)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="365" x2="405" y1="90" y2="90"></line>
<!-- Stage 3 -->
<rect fill="url(#grad_351dbb_fef9e7)" height="80" rx="10" stroke="#f39c12" stroke-linecap="round" stroke-width="2" width="150" x="410" y="50"></rect>
<text fill="#f39c12" font-size="11" font-weight="700" text-anchor="middle" x="485" y="75">Stage 3: Validate</text>
<text fill="#555" font-size="11" text-anchor="middle" x="485" y="93">Check constraints</text>
<text fill="#555" font-size="11" text-anchor="middle" x="485" y="106">and consistency</text>
<text fill="#888" font-size="11" text-anchor="middle" x="485" y="122">Model: gpt-4o-mini</text>
<!-- Arrow -->
<line marker-end="url(#arrowCh)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="560" x2="595" y1="90" y2="90"></line>
<!-- Stage 4 -->
<rect fill="#e8f5e9" height="80" rx="10" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="120" x="600" y="50"></rect>
<text fill="#27ae60" font-size="11" font-weight="700" text-anchor="middle" x="660" y="75">Stage 4: Format</text>
<text fill="#555" font-size="11" text-anchor="middle" x="660" y="93">Produce final</text>
<text fill="#555" font-size="11" text-anchor="middle" x="660" y="106">structured output</text>
<text fill="#888" font-size="11" text-anchor="middle" x="660" y="122">Model: gpt-4o-mini</text>
<!-- Data flow annotations -->
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="95.0" x2="95.0" y1="142.0" y2="132.0"></line>
<text fill="#3498db" font-size="11" text-anchor="middle" x="95" y="155">Raw text</text>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="290.0" x2="290.0" y1="142.0" y2="132.0"></line>
<text fill="#8e44ad" font-size="11" text-anchor="middle" x="290" y="155">Entities (JSON)</text>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="485.0" x2="485.0" y1="142.0" y2="132.0"></line>
<text fill="#f39c12" font-size="11" text-anchor="middle" x="485" y="155">Analysis + flags</text>
<line data-annotation-line="auto" opacity="0.7" stroke="#999" stroke-dasharray="4 3" stroke-width="1" x1="660.0" x2="660.0" y1="142.0" y2="132.0"></line>
<text fill="#27ae60" font-size="11" text-anchor="middle" x="660" y="155">Validated result</text>
<!-- Cost comparison box -->
<rect fill="#f8f8ff" height="90" rx="8" stroke="#ddd" stroke-linecap="round" stroke-width="1" width="540" x="100" y="185"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="middle" x="370" y="207">Cost Comparison</text>
<text fill="#555" font-size="11" text-anchor="middle" x="370" y="228">Monolithic (1 gpt-4o call): ~2,000 tokens in, ~800 out = <span>&#36;</span>0.034</text>
<text fill="#555" font-size="11" text-anchor="middle" x="370" y="248">Chained (3 mini + 1 gpt-4o): stages 1,3,4 use mini = <span>&#36;</span>0.019</text>
<text fill="#27ae60" font-size="11" font-weight="600" text-anchor="middle" x="370" y="268">Savings: 44% cost reduction with better reliability</text>
<defs>
<lineargradient id="grad_351dbb_fef9e7" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffff6"></stop><stop offset="100%" stop-color="#fef9e7"></stop></lineargradient>
<lineargradient id="grad_351dbb_f0e6ff" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff5ff"></stop><stop offset="100%" stop-color="#f0e6ff"></stop></lineargradient>
<lineargradient id="grad_351dbb_e8f4fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7ffff"></stop><stop offset="100%" stop-color="#e8f4fd"></stop></lineargradient>
<filter height="115%" id="shadow_351dbb" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowCh" markerheight="6" markerwidth="6" orient="auto" refx="5" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888"></path></marker>
</defs>
</svg>