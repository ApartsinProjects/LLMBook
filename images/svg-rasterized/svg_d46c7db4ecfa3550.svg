<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Deep research pipelines chain planning, gathering, verification, refinement, and synthesis into a multi-phase workflow with iteration." font-family="Segoe UI, system-ui, sans-serif" role="img" viewBox="0 -13 720 213" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="adr" markerheight="5" markerwidth="5" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"></path></marker>
</defs>
<rect fill="#e3f2fd" height="55" rx="6" stroke="#1565c0" stroke-width="1.5" width="120" x="10" y="45"></rect>
<text fill="#0d47a1" font-size="11" font-weight="bold" text-anchor="middle" x="70" y="67">Plan</text>
<text fill="#555" font-size="11" text-anchor="middle" x="70" y="82">Query tree</text>
<text fill="#555" font-size="11" text-anchor="middle" x="70" y="92">+ source plan</text>
<line marker-end="url(#adr)" stroke="#333" stroke-width="1.2" x1="130" x2="150" y1="72" y2="72"></line>
<rect fill="#fff3e0" height="55" rx="6" stroke="#e65100" stroke-width="1.5" width="110" x="155" y="45"></rect>
<text fill="#e65100" font-size="11" font-weight="bold" text-anchor="middle" x="210" y="67">Gather</text>
<text fill="#555" font-size="11" text-anchor="middle" x="210" y="82">Parallel search</text>
<text fill="#555" font-size="11" text-anchor="middle" x="210" y="92">across N sources</text>
<line marker-end="url(#adr)" stroke="#333" stroke-width="1.2" x1="265" x2="285" y1="72" y2="72"></line>
<rect fill="#fce4ec" height="55" rx="6" stroke="#c62828" stroke-width="1.5" width="110" x="290" y="45"></rect>
<text fill="#c62828" font-size="11" font-weight="bold" text-anchor="middle" x="345" y="67">Verify</text>
<text fill="#555" font-size="11" text-anchor="middle" x="345" y="82">Cross-check</text>
<text fill="#555" font-size="11" text-anchor="middle" x="345" y="92">+ credibility</text>
<line marker-end="url(#adr)" stroke="#333" stroke-width="1.2" x1="400" x2="420" y1="72" y2="72"></line>
<rect fill="#e8f5e9" height="55" rx="6" stroke="#2e7d32" stroke-width="1.5" width="110" x="425" y="45"></rect>
<text fill="#2e7d32" font-size="11" font-weight="bold" text-anchor="middle" x="480" y="67">Refine</text>
<text fill="#555" font-size="11" text-anchor="middle" x="480" y="82">Fill gaps via</text>
<text fill="#555" font-size="11" text-anchor="middle" x="480" y="92">follow-up queries</text>
<line marker-end="url(#adr)" stroke="#333" stroke-width="1.2" x1="535" x2="555" y1="72" y2="72"></line>
<rect fill="#f3e5f5" height="55" rx="6" stroke="#7b1fa2" stroke-width="1.5" width="130" x="560" y="45"></rect>
<text fill="#7b1fa2" font-size="11" font-weight="bold" text-anchor="middle" x="625" y="67">Synthesize</text>
<text fill="#555" font-size="11" text-anchor="middle" x="625" y="82">Structured report</text>
<text fill="#555" font-size="11" text-anchor="middle" x="625" y="92">with citations</text>
<path d="M 480 100 C 480 145 345 145 345 100" fill="none" marker-end="url(#adr)" stroke="#888" stroke-dasharray="4,3" stroke-width="1"></path>
<text fill="#888" font-size="11" text-anchor="middle" x="415" y="140">iterate until sufficient</text>
<text fill="#888" font-size="11" text-anchor="middle" x="360" y="185">Typical execution: 1 to 10 minutes, 10 to 50 LLM calls, multiple source types</text>
</svg>