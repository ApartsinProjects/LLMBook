<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="OWASP Top 10 for LLM + MITRE ATLAS: four attack classes with numeric thresholds" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="fig-76-3-1-title fig-76-3-1-desc">
<title id="fig-76-3-1-title">OWASP Top 10 for LLM + MITRE ATLAS: four attack classes with numeric thresholds</title>
<desc id="fig-76-3-1-desc">Four-row table. Prompt injection (OWASP #1, MITRE ATLAS ML.T0051): unfixable structurally, defence in depth. Training-data poisoning: 0.001% of corpus suffices (Carlini 2024 "Poisoning Web-Scale Practical"). Membership inference / extraction: differential privacy epsilon~8 cuts attack 30-50%, 1-3% accuracy cost. Model extraction: rate limits + watermark + ToS + litigation (OpenAI/DeepSeek 2025).</desc>
<rect x="0" y="0" width="760" height="380" fill="#fbfcfe"/>
<text x="380" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2d3d">LLM-specific attack surface: OWASP Top 10 + MITRE ATLAS canon</text>

<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2d3d">
<!-- header -->
<rect x="20" y="48" width="200" height="30" fill="#fafafe" stroke="#a8b9d4"/>
<text x="120" y="68" text-anchor="middle" font-weight="700">Attack class</text>
<rect x="220" y="48" width="250" height="30" fill="#fafafe" stroke="#a8b9d4"/>
<text x="345" y="68" text-anchor="middle" font-weight="700">Numeric threshold</text>
<rect x="470" y="48" width="270" height="30" fill="#fafafe" stroke="#a8b9d4"/>
<text x="605" y="68" text-anchor="middle" font-weight="700">Production defence</text>

<!-- row 1: prompt injection -->
<rect x="20" y="80" width="200" height="60" fill="#f1d6d0" stroke="#b2351e"/>
<text x="120" y="100" text-anchor="middle" font-weight="700" fill="#b2351e">Prompt injection</text>
<text x="120" y="116" text-anchor="middle" font-size="10">OWASP #1, ATLAS ML.T0051</text>
<text x="120" y="130" text-anchor="middle" font-size="10">(Greshake 2023)</text>
<rect x="220" y="80" width="250" height="60" fill="#fafafe" stroke="#a8b9d4"/>
<text x="345" y="106" text-anchor="middle" font-weight="700" fill="#b2351e">Structurally unfixable</text>
<text x="345" y="124" text-anchor="middle" font-size="10">no clean trusted/untrusted boundary</text>
<rect x="470" y="88" width="270" height="60" fill="#eef5ec" stroke="#1f6f3a"/>
<text x="605" y="100" text-anchor="middle" font-size="10">input class. · output filter ·</text>
<text x="605" y="114" text-anchor="middle" font-size="10">scoped tool perms ·</text>
<text x="605" y="128" text-anchor="middle" font-size="10">defence-in-depth, no single layer</text>

<!-- row 2: training-data poisoning -->
<rect x="20" y="145" width="200" height="60" fill="#f1d6d0" stroke="#b2351e"/>
<text x="120" y="165" text-anchor="middle" font-weight="700" fill="#b2351e">Training-data poisoning</text>
<text x="120" y="181" text-anchor="middle" font-size="10">backdoors at vanishing fractions</text>
<text x="120" y="195" text-anchor="middle" font-size="10">(Carlini et al. 2024)</text>
<rect x="220" y="145" width="250" height="60" fill="#fafafe" stroke="#a8b9d4"/>
<text x="345" y="171" text-anchor="middle" font-weight="700" fill="#b2351e">~0.001% of corpus</text>
<text x="345" y="189" text-anchor="middle" font-size="10">a few thousand docs in multi-B corpus</text>
<rect x="470" y="137" width="270" height="60" fill="#eef5ec" stroke="#1f6f3a"/>
<text x="605" y="165" text-anchor="middle" font-size="10">provenance tracking +5-10% data prep</text>
<text x="605" y="179" text-anchor="middle" font-size="10">loss anomaly detection</text>
<text x="605" y="193" text-anchor="middle" font-size="10">$50-100K post-train probe</text>

<!-- row 3: membership inference -->
<rect x="20" y="210" width="200" height="60" fill="#f1d6d0" stroke="#b2351e"/>
<text x="120" y="230" text-anchor="middle" font-weight="700" fill="#b2351e">Membership inference</text>
<text x="120" y="246" text-anchor="middle" font-size="10">+ verbatim extraction</text>
<text x="120" y="260" text-anchor="middle" font-size="10">(fine-tuned models)</text>
<rect x="220" y="210" width="250" height="60" fill="#fafafe" stroke="#a8b9d4"/>
<text x="345" y="232" text-anchor="middle" font-weight="700" fill="#b2351e">1K-10K API queries per record</text>
<text x="345" y="254" text-anchor="middle" font-size="10">to extract under standard adversarial setup</text>
<rect x="470" y="210" width="270" height="60" fill="#eef5ec" stroke="#1f6f3a"/>
<text x="605" y="230" text-anchor="middle" font-size="10">DP epsilon=8 cuts attack 30-50%</text>
<text x="605" y="244" text-anchor="middle" font-size="10">at 1-3% accuracy cost</text>
<text x="605" y="258" text-anchor="middle" font-size="10">+ rate-limit probing</text>

<!-- row 4: model extraction -->
<rect x="20" y="275" width="200" height="60" fill="#f1d6d0" stroke="#b2351e"/>
<text x="120" y="295" text-anchor="middle" font-weight="700" fill="#b2351e">Model extraction</text>
<text x="120" y="311" text-anchor="middle" font-size="10">OpenAI vs DeepSeek 2025</text>
<text x="120" y="325" text-anchor="middle" font-size="10">commercial-IP threat</text>
<rect x="220" y="275" width="250" height="60" fill="#fafafe" stroke="#a8b9d4"/>
<text x="345" y="297" text-anchor="middle" font-weight="700" fill="#b2351e">train smaller model on outputs</text>
<text x="345" y="313" text-anchor="middle" font-size="10">cryptographic mitigations underdeveloped</text>
<rect x="470" y="275" width="270" height="60" fill="#eef5ec" stroke="#1f6f3a"/>
<text x="605" y="295" text-anchor="middle" font-size="10">rate limits · output watermark</text>
<text x="605" y="309" text-anchor="middle" font-size="10">ToS enforcement</text>
<text x="605" y="323" text-anchor="middle" font-size="10">active litigation posture</text>

<!-- bottom note -->
<rect x="20" y="345" width="720" height="22" fill="#fafafe" stroke="#a8b9d4"/>
<text x="380" y="361" text-anchor="middle" font-size="10" font-style="italic">The SOC-LLM "auto-execute after timeout" footgun is retired industry-wide: confidence intervals and an upstream kill-switch only</text>
</g>
</svg>