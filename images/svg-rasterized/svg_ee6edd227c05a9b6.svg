<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The three axes of parallelism. Data parallel replicates the model and splits the batch; pipeline parallel splits the layer stack; tensor parallel splits a single weight matrix. Production training composes all three." role="img" style="font-family: sans-serif; max-width: 100%; height: auto;" viewbox="0 0 880 400" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="400" width="880"></rect>
<!-- Panel 1: Data Parallel -->
<g transform="translate(20, 44)">
<rect fill="#eef4fa" height="320" rx="8" stroke="#1a4078" stroke-width="2" width="270" x="0" y="16"></rect>
<text fill="#1a4078" font-size="15" font-weight="700" text-anchor="middle" x="135" y="26">Data Parallel</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="135" y="46">Same model, split batch</text>
<g transform="translate(30, 38)">
<rect fill="#ffffff" height="60" rx="4" stroke="#1a4078" stroke-width="1.5" width="90" x="0" y="32"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="45" y="58">GPU 0</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="45" y="78">Full model</text>
</g>
<g transform="translate(150, 38)">
<rect fill="#ffffff" height="60" rx="4" stroke="#1a4078" stroke-width="1.5" width="90" x="0" y="32"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="45" y="58">GPU 1</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="45" y="78">Full model</text>
</g>
<g transform="translate(30, 118)">
<rect fill="#ffffff" height="60" rx="4" stroke="#1a4078" stroke-width="1.5" width="90" x="0" y="32"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="45" y="58">GPU 2</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="45" y="78">Full model</text>
</g>
<g transform="translate(150, 118)">
<rect fill="#ffffff" height="60" rx="4" stroke="#1a4078" stroke-width="1.5" width="90" x="0" y="32"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="45" y="58">GPU 3</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="45" y="78">Full model</text>
</g>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="135" y="240">batch[0:64]   batch[64:128]</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="135" y="258">batch[128:192]  batch[192:256]</text>
<text fill="#1a4078" font-size="11" font-weight="600" text-anchor="middle" x="135" y="290">Comm: all-reduce gradients</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="135" y="306">once per step</text>
</g>
<!-- Panel 2: Pipeline / Model Parallel -->
<g transform="translate(305, 44)">
<rect fill="#ecf6ee" height="320" rx="8" stroke="#1f7a3a" stroke-width="2" width="270" x="0" y="16"></rect>
<text fill="#1f7a3a" font-size="15" font-weight="700" text-anchor="middle" x="135" y="26">Pipeline Parallel</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="135" y="46">Layers across GPUs</text>
<g transform="translate(85, 70)">
<rect fill="#ffffff" height="40" rx="4" stroke="#1f7a3a" stroke-width="1.5" width="100" x="0" y="0"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="50" y="18">GPU 0</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="50" y="34">Layers 0-23</text>
</g>
<g transform="translate(85, 120)">
<rect fill="#ffffff" height="40" rx="4" stroke="#1f7a3a" stroke-width="1.5" width="100" x="0" y="0"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="50" y="18">GPU 1</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="50" y="34">Layers 24-47</text>
</g>
<g transform="translate(85, 170)">
<rect fill="#ffffff" height="40" rx="4" stroke="#1f7a3a" stroke-width="1.5" width="100" x="0" y="0"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="50" y="18">GPU 2</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="50" y="34">Layers 48-71</text>
</g>
<g transform="translate(85, 220)">
<rect fill="#ffffff" height="40" rx="4" stroke="#1f7a3a" stroke-width="1.5" width="100" x="0" y="0"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="50" y="18">GPU 3</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="50" y="34">Layers 72-95</text>
</g>
<path d="M 135 110 L 135 120" marker-end="url(#arrgreen)" stroke="#1f7a3a" stroke-width="2"></path>
<path d="M 135 160 L 135 170" marker-end="url(#arrgreen)" stroke="#1f7a3a" stroke-width="2"></path>
<path d="M 135 210 L 135 220" marker-end="url(#arrgreen)" stroke="#1f7a3a" stroke-width="2"></path>
<text fill="#1f7a3a" font-size="11" font-weight="600" text-anchor="middle" x="135" y="290">Comm: activations</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="135" y="306">point-to-point send/recv</text>
</g>
<!-- Panel 3: Tensor Parallel -->
<g transform="translate(590, 44)">
<rect fill="#fef3e0" height="320" rx="8" stroke="#a67c1a" stroke-width="2" width="270" x="0" y="16"></rect>
<text fill="#a67c1a" font-size="15" font-weight="700" text-anchor="middle" x="135" y="26">Tensor Parallel</text>
<text fill="#5a4a3a" font-size="11" font-style="italic" text-anchor="middle" x="135" y="46">One matrix split 4 ways</text>
<g transform="translate(30, 32)">
<rect fill="#ffffff" height="120" rx="4" stroke="#a67c1a" stroke-width="1.5" width="210" x="0" y="48"></rect>
<text fill="#1a1a2e" font-size="11" font-weight="600" text-anchor="middle" x="105" y="70">Weight matrix W (d × 4d)</text>
<line stroke="#a67c1a" stroke-dasharray="3,3" stroke-width="1" x1="0" x2="210" y1="88" y2="88"></line>
<line stroke="#a67c1a" stroke-dasharray="3,3" stroke-width="1" x1="52" x2="52" y1="88" y2="168"></line>
<line stroke="#a67c1a" stroke-dasharray="3,3" stroke-width="1" x1="105" x2="105" y1="88" y2="168"></line>
<line stroke="#a67c1a" stroke-dasharray="3,3" stroke-width="1" x1="157" x2="157" y1="88" y2="168"></line>
<text fill="#a67c1a" font-size="11" font-weight="600" text-anchor="middle" x="26" y="128">GPU 0</text>
<text fill="#a67c1a" font-size="11" font-weight="600" text-anchor="middle" x="78" y="128">GPU 1</text>
<text fill="#a67c1a" font-size="11" font-weight="600" text-anchor="middle" x="131" y="128">GPU 2</text>
<text fill="#a67c1a" font-size="11" font-weight="600" text-anchor="middle" x="183" y="128">GPU 3</text>
</g>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="135" y="225">Each GPU holds W[:, k:k+d]</text>
<text fill="#1a1a2e" font-size="11" text-anchor="middle" x="135" y="245">Computes partial Y, all-reduces</text>
<text fill="#a67c1a" font-size="11" font-weight="600" text-anchor="middle" x="135" y="290">Comm: all-reduce activations</text>
<text fill="#5a4a3a" font-size="10" font-style="italic" text-anchor="middle" x="135" y="306">per layer</text>
</g>
<defs>
<marker id="arrgreen" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="4">
<polygon fill="#1f7a3a" points="0 0, 8 4, 0 8"></polygon>
</marker>
</defs>
</svg>