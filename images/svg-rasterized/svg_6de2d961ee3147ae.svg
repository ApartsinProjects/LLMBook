<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Evolutionary model-merging loop: a population of N merge configurations is applied (Merge), each candidate is scored on a benchmark suite (Evaluate), then Select and Mutate produces the next generation; the cycle repeats for K generations." font-family="Segoe UI, system-ui, sans-serif" role="img" viewbox="0 -10 700 230" xmlns="http://www.w3.org/2000/svg">
<!-- Population -->
<rect fill="url(#grad_7d95de_e8eaf6)" filter="url(#shadow_7d95de)" height="60" rx="6" stroke="#3949ab" stroke-linecap="round" stroke-width="1.5" width="130" x="40" y="55"></rect>
<text fill="#3949ab" font-size="12" font-weight="bold" text-anchor="middle" x="105" y="80">Population</text>
<text fill="#555" font-size="11" text-anchor="middle" x="105" y="100">N merge configs</text>
<!-- Arrow -->
<line marker-end="url(#arrowE)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="172" x2="210" y1="85" y2="85"></line>
<defs>
<lineargradient id="grad_7d95de_fff3e0" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffef"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient>
<lineargradient id="grad_7d95de_f3e5f5" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff4ff"></stop><stop offset="100%" stop-color="#f3e5f5"></stop></lineargradient>
<lineargradient id="grad_7d95de_e8eaf6" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f7f9ff"></stop><stop offset="100%" stop-color="#e8eaf6"></stop></lineargradient>
<lineargradient id="grad_7d95de_c8e6c9" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d7f5d8"></stop><stop offset="100%" stop-color="#c8e6c9"></stop></lineargradient>
<filter height="115%" id="shadow_7d95de" width="115%" x="-5%" y="-5%"><fedropshadow dx="2" dy="2" flood-opacity="0.1" stddeviation="3"></fedropshadow></filter>
<marker id="arrowE" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3"><polygon fill="#333" points="0 0, 8 3, 0 6"></polygon></marker></defs>
<!-- Merge -->
<rect fill="url(#grad_7d95de_c8e6c9)" height="60" rx="6" stroke="#2e7d32" stroke-linecap="round" stroke-width="1.5" width="120" x="215" y="55"></rect>
<text fill="#2e7d32" font-size="12" font-weight="bold" text-anchor="middle" x="275" y="80">Merge</text>
<text fill="#555" font-size="11" text-anchor="middle" x="275" y="100">Apply each config</text>
<line marker-end="url(#arrowE)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="337" x2="375" y1="85" y2="85"></line>
<!-- Evaluate -->
<rect fill="url(#grad_7d95de_fff3e0)" height="60" rx="6" stroke="#e65100" stroke-linecap="round" stroke-width="1.5" width="120" x="380" y="55"></rect>
<text fill="#e65100" font-size="12" font-weight="bold" text-anchor="middle" x="440" y="80">Evaluate</text>
<text fill="#555" font-size="11" text-anchor="middle" x="440" y="100">Benchmark suite</text>
<line marker-end="url(#arrowE)" stroke="#333" stroke-linecap="round" stroke-width="1.5" x1="502" x2="540" y1="85" y2="85"></line>
<!-- Select + Mutate -->
<rect fill="url(#grad_7d95de_f3e5f5)" height="60" rx="6" stroke="#7b1fa2" stroke-linecap="round" stroke-width="1.5" width="120" x="545" y="55"></rect>
<text fill="#7b1fa2" font-size="12" font-weight="bold" text-anchor="middle" x="605" y="80">Select + Mutate</text>
<text fill="#555" font-size="11" text-anchor="middle" x="605" y="100">Next generation</text>
<!-- Loop back arrow -->
<path d="M 605 117 L 605 165 L 105 165 L 105 117" fill="none" marker-end="url(#arrowE)" stroke="#888" stroke-dasharray="6" stroke-linecap="round" stroke-width="1.5"></path>
<text fill="#888" font-size="11" text-anchor="middle" x="350" y="185">Repeat for K generations</text>
</svg>