<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="NIST AI Risk Management Framework: a top-level GOVERN function oversees three continuously cycling sub-functions, MAP (context, stakeholders, risks), MEASURE (metrics, testing, monitoring), and MANAGE (mitigate, respond, improve)." role="img" style="font-family: sans-serif;" viewBox="0 -11 600 291" xmlns="http://www.w3.org/2000/svg">
<defs><lineargradient id="stdGrad3" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:0.7"></stop><stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.3"></stop></lineargradient>
<filter height="115%" id="shadow1" width="110%" x="-5%" y="-5%">
<fedropshadow dx="1" dy="2" flood-opacity="0.12" stddeviation="2"></fedropshadow>
</filter>
</defs>
<rect fill="#1a1a2e" filter="url(#shadow1)" height="40" rx="20" width="240" x="180" y="50"></rect>
<text fill="white" font-size="14" font-weight="700" text-anchor="middle" x="300" y="76">GOVERN</text>
<rect fill="#e8f4fd" filter="url(#shadow1)" height="60" rx="12" stroke="#3498db" stroke-linecap="round" stroke-width="2" width="170" x="30" y="130"></rect>
<text fill="#3498db" font-size="13" font-weight="600" text-anchor="middle" x="115" y="155">MAP</text>
<text fill="#666" font-size="11" text-anchor="middle" x="115" y="175">Context, stakeholders, risks</text>
<rect fill="#f0e6ff" filter="url(#shadow1)" height="60" rx="12" stroke="#8e44ad" stroke-linecap="round" stroke-width="2" width="170" x="215" y="130"></rect>
<text fill="#8e44ad" font-size="13" font-weight="600" text-anchor="middle" x="300" y="155">MEASURE</text>
<text fill="#666" font-size="11" text-anchor="middle" x="300" y="175">Metrics, testing, monitoring</text>
<rect fill="#e8f5e9" filter="url(#shadow1)" height="60" rx="12" stroke="#27ae60" stroke-linecap="round" stroke-width="2" width="170" x="400" y="130"></rect>
<text fill="#27ae60" font-size="13" font-weight="600" text-anchor="middle" x="485" y="155">MANAGE</text>
<text fill="#666" font-size="11" text-anchor="middle" x="485" y="175">Mitigate, respond, improve</text>
<!-- Arrows from GOVERN down -->
<line stroke="#888" stroke-linecap="round" stroke-width="2" x1="220" x2="115" y1="90" y2="130"></line>
<line stroke="#888" stroke-linecap="round" stroke-width="2" x1="300" x2="300" y1="90" y2="130"></line>
<line stroke="#888" stroke-linecap="round" stroke-width="2" x1="380" x2="485" y1="90" y2="130"></line>
<!-- Circular arrows between MAP, MEASURE, MANAGE -->
<line marker-end="url(#arr)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="200" x2="215" y1="160" y2="160"></line>
<line marker-end="url(#arr)" stroke="#888" stroke-linecap="round" stroke-width="2" x1="385" x2="400" y1="160" y2="160"></line>
<text fill="#555" font-size="12" text-anchor="middle" x="300" y="230">GOVERN provides overarching structure;</text>
<text fill="#555" font-size="12" text-anchor="middle" x="300" y="248">MAP, MEASURE, MANAGE operate continuously.</text>
<defs>
<marker id="arr" markerheight="6" markerwidth="8" orient="auto" refx="8" refy="3">
<polygon fill="#888" points="0 0, 8 3, 0 6"></polygon>
</marker>
</defs>
</svg>