<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="The Part X safety-platform landscape divides cleanly into three roles." viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig511title" style="max-width:760px;width:100%;height:auto;background:#fafafa;border-radius:8px;">
<title id="fig511title">Safety platforms by role and cost</title>
<text x="380" y="24" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Safety platforms: three roles, three cost tiers (2026)</text>
<g font-family="Georgia, serif" font-size="11">
<rect x="20" y="60" width="230" height="240" rx="8" fill="#e8f1fb" stroke="#1f77b4"/>
<text x="135" y="84" text-anchor="middle" font-weight="bold" fill="#1f77b4" font-size="13">Moderation APIs</text>
<text x="135" y="100" text-anchor="middle" fill="#666">pre-classify input/output</text>
<text x="35" y="124" font-weight="bold" fill="#222">OpenAI Moderation</text>
<text x="35" y="140" fill="#444">13 categories, FREE</text>
<text x="35" y="156" fill="#666" font-style="italic">"default first filter"</text>
<text x="35" y="180" font-weight="bold" fill="#222">Anthropic safety classifier</text>
<text x="35" y="196" fill="#444">on-by-default w/ Claude API</text>
<text x="35" y="220" font-weight="bold" fill="#222">Azure Content Safety</text>
<text x="35" y="236" fill="#444">SOC2/HIPAA/FedRAMP</text>
<text x="35" y="260" font-weight="bold" fill="#222">Google Cloud Safety</text>
<text x="35" y="276" fill="#444">GCP / Vertex AI native</text>
<rect x="265" y="60" width="230" height="240" rx="8" fill="#fde9e9" stroke="#d62728"/>
<text x="380" y="84" text-anchor="middle" font-weight="bold" fill="#d62728" font-size="13">Red-team platforms</text>
<text x="380" y="100" text-anchor="middle" fill="#666">probe for vulnerabilities</text>
<text x="280" y="124" font-weight="bold" fill="#222">Garak (NVIDIA)</text>
<text x="280" y="140" fill="#444">"nmap for LLMs", FREE</text>
<text x="280" y="156" fill="#666" font-style="italic">probes + detectors</text>
<text x="280" y="180" font-weight="bold" fill="#222">PyRIT (Microsoft)</text>
<text x="280" y="196" fill="#444">multi-turn campaigns</text>
<text x="280" y="220" font-weight="bold" fill="#222">Haize Labs</text>
<text x="280" y="236" fill="#444">managed red-team SaaS</text>
<text x="280" y="260" font-weight="bold" fill="#222">Giskard</text>
<text x="280" y="276" fill="#444">unit-tests for ML</text>
<rect x="510" y="60" width="230" height="240" rx="8" fill="#fff5d9" stroke="#cc8400"/>
<text x="625" y="84" text-anchor="middle" font-weight="bold" fill="#cc8400" font-size="13">Compliance / governance</text>
<text x="625" y="100" text-anchor="middle" fill="#666">audit-ready evidence</text>
<text x="525" y="124" font-weight="bold" fill="#222">Credo AI</text>
<text x="525" y="140" fill="#444">NIST AI RMF, EU AI Act</text>
<text x="525" y="156" fill="#666" font-style="italic">enterprise SaaS</text>
<text x="525" y="180" font-weight="bold" fill="#222">Fairly AI</text>
<text x="525" y="196" fill="#444">ISO/IEC 42001 reports</text>
<text x="525" y="220" font-weight="bold" fill="#222">ModelBench</text>
<text x="525" y="236" fill="#444">eval-to-policy mapping</text>
<text x="525" y="260" font-weight="bold" fill="#222">→ paid SaaS</text>
<text x="525" y="276" fill="#666" font-style="italic">trigger: EU AI Act audit</text>
</g>
</svg>