<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Comparison of three RoPE context-extension schemes across the frequency spectrum, from high-frequency short-range bands on the left to low-frequency long-range bands on the right. Position Interpolation divides every band by the scale factor s uniformly. NTK-aware scaling leaves high-frequency bands near their trained values and progressively stretches the low-frequency bands. YaRN keeps short-wavelength bands untouched, fully interpolates long-wavelength bands by s, and uses a smooth ramp for the intermediate band region." role="img" style="max-width:100%;height:auto;font-family:system-ui, -apple-system, sans-serif;" viewbox="0 0 800 430" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="ropeUntouched" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c8e6c9"></stop><stop offset="100%" stop-color="#43a047"></stop></lineargradient>
<lineargradient id="ropePartial" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffe0b2"></stop><stop offset="100%" stop-color="#fb8c00"></stop></lineargradient>
<lineargradient id="ropeFull" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffcdd2"></stop><stop offset="100%" stop-color="#e53935"></stop></lineargradient>
<lineargradient id="ropeSpectrum" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#43a047"></stop><stop offset="50%" stop-color="#fb8c00"></stop><stop offset="100%" stop-color="#e53935"></stop></lineargradient>
<filter height="112%" id="ropeShadow" width="112%" x="-6%" y="-6%"><fedropshadow dx="1" dy="1.5" flood-opacity="0.18" stddeviation="1.5"></fedropshadow></filter>
</defs>
<rect fill="#fafafa" height="430" rx="8" width="800" x="0" y="0"></rect>
<text fill="#333" font-size="15" font-weight="600" text-anchor="middle" x="400" y="26">How PI, NTK-aware, and YaRN rescale the RoPE frequency bands</text>
<!-- spectrum axis -->
<rect fill="url(#ropeSpectrum)" height="14" opacity="0.85" rx="7" width="600" x="150" y="46"></rect>
<text fill="#2e7d32" font-size="11" font-weight="600" text-anchor="start" x="150" y="80">high freq (small i)</text>
<text fill="#888" font-size="10" text-anchor="start" x="150" y="94">short-range, sub-token detail</text>
<text fill="#c62828" font-size="11" font-weight="600" text-anchor="end" x="750" y="80">low freq (large i)</text>
<text fill="#888" font-size="10" text-anchor="end" x="750" y="94">long-range, coarse position</text>
<!-- Row helper labels -->
<g fill="#333" font-size="13" font-weight="600">
<text x="20" y="140">PI</text>
<text x="20" y="240">NTK</text>
<text x="20" y="340">YaRN</text>
</g>
<g fill="#888" font-size="10">
<text x="20" y="156">θₙ/s all</text>
<text x="20" y="256">base-rescale</text>
<text x="20" y="356">band-wise</text>
</g>
<!-- PI row: uniform squeeze -->
<g filter="url(#ropeShadow)">
<rect fill="url(#ropeFull)" height="42" rx="7" width="600" x="150" y="118"></rect>
</g>
<text fill="#fff" font-size="12" font-weight="600" text-anchor="middle" x="450" y="144">every band divided by s (uniform compression)</text>
<text fill="#888" font-size="10" text-anchor="middle" x="450" y="178">short-range acuity squeezed below training distribution</text>
<!-- NTK row: gradient from untouched to stretched -->
<g filter="url(#ropeShadow)">
<rect fill="url(#ropeUntouched)" height="42" rx="7" width="180" x="150" y="218"></rect>
<rect fill="url(#ropePartial)" height="42" width="210" x="330" y="218"></rect>
<rect fill="url(#ropeFull)" height="42" rx="7" width="210" x="540" y="218"></rect>
</g>
<text fill="#fff" font-size="11" font-weight="600" text-anchor="middle" x="240" y="244">~unchanged</text>
<text fill="#fff" font-size="11" font-weight="600" text-anchor="middle" x="435" y="244">progressively stretched</text>
<text fill="#fff" font-size="11" font-weight="600" text-anchor="middle" x="645" y="244">most stretched</text>
<text fill="#888" font-size="10" text-anchor="middle" x="450" y="278">exponent s⁻²ⁱᳯ⁽ᵈ⁻²⁾ near 0 at left, approaches −1 at right</text>
<!-- YaRN row: three discrete regions -->
<g filter="url(#ropeShadow)">
<rect fill="url(#ropeUntouched)" height="42" rx="7" width="210" x="150" y="318"></rect>
<rect fill="url(#ropePartial)" height="42" width="180" x="360" y="318"></rect>
<rect fill="url(#ropeFull)" height="42" rx="7" width="210" x="540" y="318"></rect>
</g>
<text fill="#fff" font-size="11" font-weight="600" text-anchor="middle" x="255" y="344">untouched</text>
<text fill="#fff" font-size="10" font-weight="600" text-anchor="middle" x="450" y="338">ramp γ(i)</text>
<text fill="#fff3e0" font-size="9" text-anchor="middle" x="450" y="352">smooth blend</text>
<text fill="#fff" font-size="11" font-weight="600" text-anchor="middle" x="645" y="344">full PI (÷ s)</text>
<text fill="#888" font-size="9" text-anchor="middle" x="255" y="378">λ ≪ Lᵗᵣᵀіₙ</text>
<text fill="#888" font-size="9" text-anchor="middle" x="450" y="378">λ ≈ Lᵗᵣᵀіₙ</text>
<text fill="#888" font-size="9" text-anchor="middle" x="645" y="378">λ ≫ Lᵗᵣᵀіₙ</text>
<!-- legend -->
<g fill="#555" font-size="10">
<rect fill="url(#ropeUntouched)" height="12" rx="3" width="14" x="200" y="398"></rect><text x="220" y="408">keep trained θₙ</text>
<rect fill="url(#ropePartial)" height="12" rx="3" width="14" x="350" y="398"></rect><text x="370" y="408">partial stretch</text>
<rect fill="url(#ropeFull)" height="12" rx="3" width="14" x="500" y="398"></rect><text x="520" y="408">full interpolation θₙ/s</text>
</g>
</svg>