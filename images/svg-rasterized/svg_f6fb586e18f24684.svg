<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg aria-label="Three multimodal product shapes side by side: Conversational assistant with sub-second latency budget and realtime omni model, Document QA with 2 to 5 second latency budget and ColPali-style page retrieval plus VLM, and Visual catalog search with sub-200 millisecond latency budget and pure joint-embedding retrieval" role="img" style="max-width:100%;height:auto;" viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter height="108%" id="ps334shadow" width="108%" x="-4%" y="-4%">
<fedropshadow dx="1" dy="2" flood-opacity="0.16" stddeviation="1.4"></fedropshadow>
</filter>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle" x="380" y="22">Three multimodal product shapes</text>
<text fill="#4a5568" font-size="11" text-anchor="middle" x="380" y="40">Latency budget shapes the stack more than feature requirements do.</text>
<g transform="translate(20, 60)">
<rect fill="#fff8e1" filter="url(#ps334shadow)" height="210" rx="8" stroke="#d97706" stroke-width="1.5" width="220" x="0" y="0"></rect>
<rect fill="#d97706" height="24" rx="8" width="220" x="0" y="0"></rect>
<text fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" x="110" y="17">Conversational assistant</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="110" y="44">"chat that hears and sees"</text>
<rect fill="#fff" height="34" rx="4" stroke="#d97706" stroke-width="1" width="180" x="20" y="56"></rect>
<text fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle" x="110" y="74">GPT-4o Realtime / Gemini Live</text>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="110" y="88">native omni model</text>
<rect fill="#fef3c7" height="20" rx="4" stroke="#d97706" stroke-dasharray="3,2" stroke-width="1" width="180" x="20" y="98"></rect>
<text fill="#5a4a3a" font-size="9" text-anchor="middle" x="110" y="112">optional RAG callouts</text>
<text fill="#b91c1c" font-size="11" font-weight="700" text-anchor="middle" x="110" y="148">Latency &lt; 1 s (hard)</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="110" y="166">Cost: per-minute pricing</text>
<text fill="#5a4a3a" font-size="10" text-anchor="middle" x="110" y="184">Quality: conversational, not perfect</text>
<text fill="#5a4a3a" font-size="9" font-style="italic" text-anchor="middle" x="110" y="202">Voice agents, helpdesk bots</text>
</g>
<g transform="translate(270, 60)">
<rect fill="#e3f2fd" filter="url(#ps334shadow)" height="210" rx="8" stroke="#3a73a8" stroke-width="1.5" width="220" x="0" y="0"></rect>
<rect fill="#3a73a8" height="24" rx="8" width="220" x="0" y="0"></rect>
<text fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" x="110" y="17">Document QA</text>
<text fill="#1a4078" font-size="10" text-anchor="middle" x="110" y="44">"ask a 300-page PDF"</text>
<rect fill="#fff" height="22" rx="4" stroke="#3a73a8" stroke-width="1" width="180" x="20" y="56"></rect>
<text fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle" x="110" y="71">ColPali / ColQwen retriever</text>
<rect fill="#fff" height="22" rx="4" stroke="#3a73a8" stroke-width="1" width="180" x="20" y="84"></rect>
<text fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle" x="110" y="99">VLM generator (4o, Gemini Pro)</text>
<rect fill="#eff6ff" height="14" rx="4" stroke="#3a73a8" stroke-dasharray="3,2" stroke-width="1" width="180" x="20" y="112"></rect>
<text fill="#1a4078" font-size="9" text-anchor="middle" x="110" y="123">citation extractor</text>
<text fill="#d97706" font-size="11" font-weight="700" text-anchor="middle" x="110" y="148">Latency 2-5 s (soft)</text>
<text fill="#1a4078" font-size="10" text-anchor="middle" x="110" y="166">Cost: per-query, retrieval dominates</text>
<text fill="#1a4078" font-size="10" text-anchor="middle" x="110" y="184">Quality: high (faithfulness gates)</text>
<text fill="#1a4078" font-size="9" font-style="italic" text-anchor="middle" x="110" y="202">Legal, medical, internal KB</text>
</g>
<g transform="translate(520, 60)">
<rect fill="#e8f5e9" filter="url(#ps334shadow)" height="210" rx="8" stroke="#047857" stroke-width="1.5" width="220" x="0" y="0"></rect>
<rect fill="#047857" height="24" rx="8" width="220" x="0" y="0"></rect>
<text fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" x="110" y="17">Visual search</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="110" y="44">"shop the look"</text>
<rect fill="#fff" height="22" rx="4" stroke="#047857" stroke-width="1" width="180" x="20" y="56"></rect>
<text fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle" x="110" y="71">SigLIP / CLIP query encoder</text>
<rect fill="#fff" height="22" rx="4" stroke="#047857" stroke-width="1" width="180" x="20" y="84"></rect>
<text fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle" x="110" y="99">HNSW / Qdrant ANN index</text>
<rect fill="#f0fdf4" height="14" rx="4" stroke="#047857" stroke-dasharray="3,2" stroke-width="1" width="180" x="20" y="112"></rect>
<text fill="#3d4f3d" font-size="9" text-anchor="middle" x="110" y="123">no generator typically</text>
<text fill="#b91c1c" font-size="11" font-weight="700" text-anchor="middle" x="110" y="148">Latency &lt; 200 ms</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="110" y="166">Cost: ~<span>&amp;dollar;</span>0.0005 / query</text>
<text fill="#3d4f3d" font-size="10" text-anchor="middle" x="110" y="184">Quality: "good enough", not perfect</text>
<text fill="#3d4f3d" font-size="9" font-style="italic" text-anchor="middle" x="110" y="202">Ecommerce, media catalog</text>
</g>
</g>
</svg>