<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Choosing between a standard and a reasoning model</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Three quick gates: multi-step logic, verifiability, latency budget.</text>

  <!-- Q1 diamond -->
  <g transform="translate(650, 150)">
    <polygon points="0,-60 200,0 0,60 -200,0" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="0" y="-8" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Q1. Does the task need</text>
    <text x="0" y="12" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">multi-step logic?</text>
    <text x="0" y="32" font-size="11" text-anchor="middle" fill="#5a4a3a">(planning, math, code, proofs)</text>
  </g>

  <!-- NO1 standard model (left) -->
  <g transform="translate(170, 250)">
    <rect x="0" y="0" width="240" height="80" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="120" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#5a4a3a">Use a standard model</text>
    <text x="120" y="50" font-size="11" text-anchor="middle" fill="#1a1a2e">Retrieval, summarization,</text>
    <text x="120" y="66" font-size="11" text-anchor="middle" fill="#1a1a2e">chat, classification.</text>
  </g>

  <!-- Q1 -> NO1 (No, left) -->
  <path d="M 470 170 Q 360 200 290 250" fill="none" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="370" y="180" width="36" height="20" rx="3" fill="#ffffff" stroke="#5a4a3a" stroke-width="1"/>
  <text x="388" y="195" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">No</text>

  <!-- Q1 -> Q2 (Yes, down) -->
  <line x1="650" y1="210" x2="650" y2="290" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="660" y="232" width="36" height="20" rx="3" fill="#ffffff" stroke="#5a4a3a" stroke-width="1"/>
  <text x="678" y="247" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Yes</text>

  <!-- Q2 diamond -->
  <g transform="translate(650, 350)">
    <polygon points="0,-60 200,0 0,60 -200,0" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="0" y="-8" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Q2. Is the answer</text>
    <text x="0" y="12" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">verifiable?</text>
    <text x="0" y="32" font-size="11" text-anchor="middle" fill="#5a4a3a">(unit tests, ground truth, eval)</text>
  </g>

  <!-- MAYBE (left from Q2 No) -->
  <g transform="translate(170, 450)">
    <rect x="0" y="0" width="260" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="130" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Consider, then test</text>
    <text x="130" y="50" font-size="11" text-anchor="middle" fill="#1a1a2e">Reasoning may help, but</text>
    <text x="130" y="66" font-size="11" text-anchor="middle" fill="#1a1a2e">measure on a held-out set first.</text>
  </g>

  <path d="M 470 370 Q 360 400 300 450" fill="none" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="370" y="380" width="36" height="20" rx="3" fill="#ffffff" stroke="#5a4a3a" stroke-width="1"/>
  <text x="388" y="395" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">No</text>

  <!-- Q2 -> Q3 (Yes, down) -->
  <line x1="650" y1="410" x2="650" y2="490" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="660" y="432" width="36" height="20" rx="3" fill="#ffffff" stroke="#5a4a3a" stroke-width="1"/>
  <text x="678" y="447" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Yes</text>

  <!-- Q3 diamond -->
  <g transform="translate(650, 550)">
    <polygon points="0,-60 200,0 0,60 -200,0" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="0" y="-8" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Q3. Is the latency</text>
    <text x="0" y="12" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">budget acceptable?</text>
    <text x="0" y="32" font-size="11" text-anchor="middle" fill="#5a4a3a">(reasoning ~ 5 to 30x slower)</text>
  </g>

  <!-- NO3 (left from Q3 No) -->
  <g transform="translate(170, 650)">
    <rect x="0" y="0" width="260" height="80" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="130" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#5a4a3a">Standard model + better prompting</text>
    <text x="130" y="50" font-size="11" text-anchor="middle" fill="#1a1a2e">Few-shot, scratchpad, self-check;</text>
    <text x="130" y="66" font-size="11" text-anchor="middle" fill="#1a1a2e">cheaper and faster.</text>
  </g>
  <path d="M 470 570 Q 360 600 300 650" fill="none" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="370" y="580" width="36" height="20" rx="3" fill="#ffffff" stroke="#5a4a3a" stroke-width="1"/>
  <text x="388" y="595" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">No</text>

  <!-- YES3 (right from Q3 Yes) -->
  <g transform="translate(870, 510)">
    <rect x="0" y="0" width="260" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="130" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Use a reasoning model</text>
    <text x="130" y="50" font-size="11" text-anchor="middle" fill="#1a1a2e">o-series, R1, QwQ, Gemini 2.5</text>
    <text x="130" y="66" font-size="11" text-anchor="middle" fill="#1a1a2e">with thinking enabled.</text>
  </g>
  <path d="M 850 540 Q 920 530 870 530" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="850" y1="550" x2="870" y2="550" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="855" y="555" width="36" height="20" rx="3" fill="#ffffff" stroke="#5a4a3a" stroke-width="1"/>
  <text x="873" y="570" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Yes</text>

  <!-- Side callout -->
  <g transform="translate(960, 150)">
    <rect x="0" y="0" width="280" height="200" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why these three gates?</text>
    <text x="20" y="52" font-size="11" fill="#1a1a2e">1. Reasoning models pay off on tasks</text>
    <text x="20" y="68" font-size="11" fill="#1a1a2e">that need search and self-correction.</text>
    <text x="20" y="92" font-size="11" fill="#1a1a2e">2. Without verifiability you cannot tell</text>
    <text x="20" y="108" font-size="11" fill="#1a1a2e">if the extra cost actually helps.</text>
    <text x="20" y="132" font-size="11" fill="#1a1a2e">3. Hidden thinking can add seconds to</text>
    <text x="20" y="148" font-size="11" fill="#1a1a2e">tens of seconds per call; chat UIs and</text>
    <text x="20" y="164" font-size="11" fill="#1a1a2e">realtime agents may not tolerate it.</text>
    <text x="20" y="188" font-size="11" font-style="italic" fill="#5a4a3a">Rule of thumb: default to standard.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 740)">
    <rect x="0" y="0" width="1180" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="40" font-size="12" fill="#1a1a2e">Reasoning models earn their cost only when the task needs multi-step logic, has a verifiable answer, and tolerates the latency.</text>
  </g>
</svg>
