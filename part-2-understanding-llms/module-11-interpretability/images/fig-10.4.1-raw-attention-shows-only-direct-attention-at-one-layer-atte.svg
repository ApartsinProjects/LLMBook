<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Raw attention vs. attention rollout</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Raw attention shows one layer; rollout multiplies the layer-wise matrices to capture indirect, multi-hop information flow.</text>

  <!-- LEFT: Raw Attention -->
  <g transform="translate(70, 100)">
    <rect x="0" y="0" width="560" height="500" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="280" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#b3401b">Raw Attention</text>
    <text x="280" y="54" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">single layer, single head</text>

    <!-- Token row -->
    <g transform="translate(40, 100)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1a1a2e">Sentence: "The cat sat. It purred."</text>
      <g font-size="13" fill="#1a1a2e" font-weight="700">
        <text x="40" y="40">The</text>
        <text x="120" y="40">cat</text>
        <text x="200" y="40">sat</text>
        <text x="280" y="40">.</text>
        <text x="340" y="40">It</text>
        <text x="420" y="40">purred</text>
      </g>
    </g>

    <!-- Direct arc from 'It' to 'cat' -->
    <g transform="translate(40, 180)">
      <path d="M 360 0 Q 240 -50 130 0" fill="none" stroke="#b3401b" stroke-width="3"/>
      <text x="240" y="-40" font-size="12" text-anchor="middle" font-weight="700" fill="#b3401b">0.7</text>
    </g>

    <!-- Properties -->
    <g transform="translate(30, 260)">
      <rect x="0" y="0" width="500" height="42" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1"/>
      <text x="14" y="26" font-size="13" fill="#1a1a2e"><tspan font-weight="700">Reading: </tspan>"it" attends to "cat" with weight 0.7</text>

      <rect x="0" y="55" width="500" height="42" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1"/>
      <text x="14" y="81" font-size="13" fill="#1a1a2e"><tspan font-weight="700">Scope: </tspan>only one layer (or head) is visible</text>

      <rect x="0" y="110" width="500" height="60" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="14" y="134" font-size="13" fill="#1a1a2e"><tspan font-weight="700" fill="#b3401b">Risk: </tspan>misses indirect, multi-hop information flow</text>
      <text x="14" y="154" font-size="12" fill="#5a4a3a">Earlier layers may have already mixed "cat" into other tokens.</text>
    </g>
  </g>

  <!-- RIGHT: Attention Rollout -->
  <g transform="translate(670, 100)">
    <rect x="0" y="0" width="560" height="500" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="280" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Attention Rollout</text>
    <text x="280" y="54" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">product of attention across layers</text>

    <!-- Token row -->
    <g transform="translate(40, 100)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1a1a2e">Same sentence, all layers combined</text>
      <g font-size="13" fill="#1a1a2e" font-weight="700">
        <text x="40" y="40">The</text>
        <text x="120" y="40">cat</text>
        <text x="200" y="40">sat</text>
        <text x="280" y="40">.</text>
        <text x="340" y="40">It</text>
        <text x="420" y="40">purred</text>
      </g>
    </g>

    <!-- Multiple arcs from 'It' -->
    <g transform="translate(40, 180)">
      <!-- to cat 0.45 -->
      <path d="M 360 0 Q 240 -50 130 0" fill="none" stroke="#1f7a3a" stroke-width="3"/>
      <text x="240" y="-42" font-size="12" text-anchor="middle" font-weight="700" fill="#1f7a3a">0.45</text>
      <!-- to sat 0.25 -->
      <path d="M 360 0 Q 290 -32 215 0" fill="none" stroke="#1f7a3a" stroke-width="2"/>
      <text x="290" y="-22" font-size="11" text-anchor="middle" font-weight="700" fill="#1f7a3a">0.25</text>
      <!-- to The 0.15 -->
      <path d="M 360 0 Q 200 -75 50 0" fill="none" stroke="#1f7a3a" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="160" y="-58" font-size="11" text-anchor="middle" font-weight="700" fill="#1f7a3a">0.15</text>
    </g>

    <!-- Properties -->
    <g transform="translate(30, 260)">
      <rect x="0" y="0" width="500" height="42" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="14" y="26" font-size="13" fill="#1a1a2e"><tspan font-weight="700">Reading: </tspan>"it" traces back to cat (0.45), sat (0.25), The (0.15)</text>

      <rect x="0" y="55" width="500" height="42" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="14" y="81" font-size="13" fill="#1a1a2e"><tspan font-weight="700">Scope: </tspan>accounts for every layer at once</text>

      <rect x="0" y="110" width="500" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="14" y="134" font-size="13" fill="#1a1a2e"><tspan font-weight="700" fill="#1f7a3a">Benefit: </tspan>captures indirect flow through earlier layers</text>
      <text x="14" y="154" font-size="12" fill="#5a4a3a">Computed as the product (with identity skip) of layer attention matrices.</text>
    </g>
  </g>

  <!-- Diagnose callout -->
  <g transform="translate(70, 545)">
    <rect x="0" y="0" width="1160" height="50" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Use when</text>
    <text x="14" y="40" font-size="12" fill="#1a1a2e">Reach for rollout when you want a global story (which token did the model "really" rely on); use raw attention when you need to debug a specific head.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(70, 620)">
    <rect x="0" y="0" width="1160" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Raw attention answers "where did this layer look"; rollout answers "where did information end up flowing from", which is usually closer to the question you actually wanted to ask.</text>
  </g>
</svg>
