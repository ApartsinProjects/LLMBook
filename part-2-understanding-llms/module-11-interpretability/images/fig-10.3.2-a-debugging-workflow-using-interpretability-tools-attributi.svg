<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">A Debugging Workflow Using Interpretability Tools</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">From bug report to fix in four steps: attribute, localise, intervene; loop back if the fix regresses.</text>

  <!-- Stage 1 BUG -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="240" height="270" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <circle cx="35" cy="35" r="20" fill="#b3401b"/>
    <text x="35" y="41" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="120" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Bug Report</text>
    <text x="120" y="58" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">observable failure</text>

    <text x="20" y="100" font-size="12" font-weight="700" fill="#1a1a2e">Symptom:</text>
    <text x="20" y="120" font-size="12" fill="#1a1a2e">Model hallucinates X</text>
    <text x="20" y="138" font-size="12" fill="#1a1a2e">on prompts of form Y.</text>

    <text x="20" y="170" font-size="12" font-weight="700" fill="#1a1a2e">Repro:</text>
    <text x="20" y="190" font-size="11" fill="#5a4a3a">- failing prompt</text>
    <text x="20" y="206" font-size="11" fill="#5a4a3a">- expected vs actual</text>
    <text x="20" y="222" font-size="11" fill="#5a4a3a">- minimal example</text>

    <rect x="20" y="238" width="200" height="22" rx="4" fill="#ffffff" stroke="#b3401b"/>
    <text x="120" y="253" font-size="11" text-anchor="middle" fill="#b3401b">Goal: explain, then fix.</text>
  </g>

  <!-- Stage 2 ATTR -->
  <g transform="translate(345, 130)">
    <rect x="0" y="0" width="240" height="270" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <circle cx="35" cy="35" r="20" fill="#1a4078"/>
    <text x="35" y="41" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="125" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Attribute</text>
    <text x="125" y="58" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">which inputs caused it?</text>

    <text x="20" y="92" font-size="12" font-weight="700" fill="#1a1a2e">Question:</text>
    <text x="20" y="110" font-size="11" fill="#1a1a2e">which input tokens push</text>
    <text x="20" y="125" font-size="11" fill="#1a1a2e">the model toward X?</text>

    <text x="20" y="155" font-size="12" font-weight="700" fill="#1a1a2e">Tools:</text>
    <g transform="translate(20, 168)">
      <rect x="0"  y="0"  width="55" height="22" rx="11" fill="#ffffff" stroke="#1a4078"/>
      <text x="27" y="15" font-size="11" text-anchor="middle" fill="#1a4078">IG</text>
      <rect x="62" y="0"  width="60" height="22" rx="11" fill="#ffffff" stroke="#1a4078"/>
      <text x="92" y="15" font-size="11" text-anchor="middle" fill="#1a4078">SHAP</text>
      <rect x="129" y="0" width="80" height="22" rx="11" fill="#ffffff" stroke="#1a4078"/>
      <text x="169" y="15" font-size="11" text-anchor="middle" fill="#1a4078">attention</text>
    </g>
    <text x="20" y="218" font-size="12" font-weight="700" fill="#1a1a2e">Output:</text>
    <text x="20" y="236" font-size="11" fill="#5a4a3a">heatmap over input tokens;</text>
    <text x="20" y="251" font-size="11" fill="#5a4a3a">few tokens dominate.</text>
  </g>

  <!-- Stage 3 LOC -->
  <g transform="translate(630, 130)">
    <rect x="0" y="0" width="240" height="270" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <circle cx="35" cy="35" r="20" fill="#7a5e1a"/>
    <text x="35" y="41" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="125" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">Localise</text>
    <text x="125" y="58" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">which layers and heads?</text>

    <text x="20" y="92" font-size="12" font-weight="700" fill="#1a1a2e">Question:</text>
    <text x="20" y="110" font-size="11" fill="#1a1a2e">which internal components</text>
    <text x="20" y="125" font-size="11" fill="#1a1a2e">carry the bug signal?</text>

    <text x="20" y="155" font-size="12" font-weight="700" fill="#1a1a2e">Tools:</text>
    <g transform="translate(20, 168)">
      <rect x="0"   y="0" width="105" height="22" rx="11" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="52"  y="15" font-size="11" text-anchor="middle" fill="#7a5e1a">activation patching</text>
      <rect x="112" y="0" width="90"  height="22" rx="11" fill="#ffffff" stroke="#7a5e1a"/>
      <text x="157" y="15" font-size="11" text-anchor="middle" fill="#7a5e1a">causal tracing</text>
    </g>
    <text x="20" y="218" font-size="12" font-weight="700" fill="#1a1a2e">Output:</text>
    <text x="20" y="236" font-size="11" fill="#5a4a3a">circuit diagram, e.g.</text>
    <text x="20" y="251" font-size="11" fill="#5a4a3a">"layer 18 head 7 + MLP".</text>
  </g>

  <!-- Stage 4 FIX -->
  <g transform="translate(915, 130)">
    <rect x="0" y="0" width="240" height="270" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <circle cx="35" cy="35" r="20" fill="#1f7a3a"/>
    <text x="35" y="41" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
    <text x="135" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Fix</text>
    <text x="135" y="58" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">edit, steer, or retrain</text>

    <text x="20" y="92" font-size="12" font-weight="700" fill="#1a1a2e">Question:</text>
    <text x="20" y="110" font-size="11" fill="#1a1a2e">cheapest intervention</text>
    <text x="20" y="125" font-size="11" fill="#1a1a2e">that removes the bug?</text>

    <text x="20" y="155" font-size="12" font-weight="700" fill="#1a1a2e">Tools:</text>
    <g transform="translate(20, 168)">
      <rect x="0"  y="0" width="60" height="22" rx="11" fill="#ffffff" stroke="#1f7a3a"/>
      <text x="30" y="15" font-size="11" text-anchor="middle" fill="#1f7a3a">ROME</text>
      <rect x="67" y="0" width="55" height="22" rx="11" fill="#ffffff" stroke="#1f7a3a"/>
      <text x="94" y="15" font-size="11" text-anchor="middle" fill="#1f7a3a">RepE</text>
      <rect x="129" y="0" width="80" height="22" rx="11" fill="#ffffff" stroke="#1f7a3a"/>
      <text x="169" y="15" font-size="11" text-anchor="middle" fill="#1f7a3a">fine-tune</text>
    </g>
    <text x="20" y="218" font-size="12" font-weight="700" fill="#1a1a2e">Output:</text>
    <text x="20" y="236" font-size="11" fill="#5a4a3a">patched weights or steering</text>
    <text x="20" y="251" font-size="11" fill="#5a4a3a">vector; rerun bug test.</text>
  </g>

  <!-- arrows between stages -->
  <line x1="300" y1="265" x2="343" y2="265" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="585" y1="265" x2="628" y2="265" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="870" y1="265" x2="913" y2="265" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- feedback loop arrow from FIX back to BUG -->
  <path d="M 1035 400 C 1035 470 180 470 180 400" stroke="#722f8a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrLoop)"/>
  <text x="610" y="465" font-size="12" text-anchor="middle" fill="#722f8a" font-style="italic">if regression or new failure, restart the loop with the new bug report</text>

  <!-- Why callout -->
  <g transform="translate(60, 495)">
    <rect x="0" y="0" width="560" height="105" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Why this order?</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">Each step narrows the search space:</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">- Attribute reduces from prompt → tokens (input space).</text>
    <text x="20" y="86" font-size="12" fill="#1a1a2e">- Localise reduces from model → layers/heads (model space).</text>
    <text x="20" y="103" font-size="11" fill="#5a4a3a" font-style="italic">Skipping straight to Fix risks tuning the wrong knob.</text>
  </g>

  <g transform="translate(640, 495)">
    <rect x="0" y="0" width="600" height="105" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Choosing the intervention</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">- 1 fact, 1 location → <tspan font-weight="700">ROME</tspan> (cheap, surgical edit).</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">- Behaviour direction across many prompts → <tspan font-weight="700">RepE steering</tspan>.</text>
    <text x="20" y="88" font-size="12" fill="#1a1a2e">- Distributional shift in many components → <tspan font-weight="700">fine-tune</tspan>.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Treat interpretability tools as a debugger, not a microscope: each step asks a sharper question, and the cheapest fix that removes the symptom wins.</text>
  </g>
</svg>
