<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>Debugging workflow using interpretability tools</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Debugging workflow with interpretability tools</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Four steps from bug report to fix; loop back if a regression appears</text>

  <g transform="translate(60, 110)">
    <rect width="220" height="200" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <circle cx="30" cy="32" r="18" fill="#b3401b"/>
    <text x="30" y="38" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="125" y="38" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Bug report</text>
    <text x="110" y="80" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">observable failure</text>
    <text x="110" y="120" font-size="11" text-anchor="middle" fill="#1a1a2e">- symptom</text>
    <text x="110" y="140" font-size="11" text-anchor="middle" fill="#1a1a2e">- repro prompt</text>
    <text x="110" y="160" font-size="11" text-anchor="middle" fill="#1a1a2e">- expected vs actual</text>
  </g>

  <g transform="translate(310, 110)">
    <rect width="220" height="200" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <circle cx="30" cy="32" r="18" fill="#1a4078"/>
    <text x="30" y="38" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="125" y="38" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Attribute</text>
    <text x="110" y="80" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">which input tokens?</text>
    <text x="110" y="120" font-size="11" text-anchor="middle" fill="#1a1a2e">- integrated gradients</text>
    <text x="110" y="140" font-size="11" text-anchor="middle" fill="#1a1a2e">- SHAP</text>
    <text x="110" y="160" font-size="11" text-anchor="middle" fill="#1a1a2e">- attention rollout</text>
  </g>

  <g transform="translate(560, 110)">
    <rect width="220" height="200" rx="8" fill="#fef3e0" stroke="#a67c1a" stroke-width="2.5"/>
    <circle cx="30" cy="32" r="18" fill="#a67c1a"/>
    <text x="30" y="38" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="125" y="38" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Localise</text>
    <text x="110" y="80" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">which layers and heads?</text>
    <text x="110" y="120" font-size="11" text-anchor="middle" fill="#1a1a2e">- activation patching</text>
    <text x="110" y="140" font-size="11" text-anchor="middle" fill="#1a1a2e">- causal tracing</text>
    <text x="110" y="160" font-size="11" text-anchor="middle" fill="#1a1a2e">- circuit diagrams</text>
  </g>

  <g transform="translate(810, 110)">
    <rect width="220" height="200" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <circle cx="30" cy="32" r="18" fill="#1f7a3a"/>
    <text x="30" y="38" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
    <text x="135" y="38" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Fix</text>
    <text x="110" y="80" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">edit, steer, or retrain</text>
    <text x="110" y="120" font-size="11" text-anchor="middle" fill="#1a1a2e">- ROME (surgical edit)</text>
    <text x="110" y="140" font-size="11" text-anchor="middle" fill="#1a1a2e">- RepE (steering vector)</text>
    <text x="110" y="160" font-size="11" text-anchor="middle" fill="#1a1a2e">- fine-tune</text>
  </g>

  <g stroke="#1a1a2e" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="280" y1="200" x2="308" y2="200"/>
    <line x1="530" y1="200" x2="558" y2="200"/>
    <line x1="780" y1="200" x2="808" y2="200"/>
  </g>

  <path d="M 920 320 L 920 370 L 170 370 L 170 320" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrPurple)"/>
  <text x="545" y="362" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">if regression, restart the loop</text>

  <g transform="translate(60, 400)">
    <rect width="980" height="180" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#a67c1a">Why this order?</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">Each step narrows the search: Attribute reduces from prompt to tokens; Localise reduces from model to layers/heads.</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">Skipping straight to Fix risks tuning the wrong knob.</text>
    <text x="20" y="98" font-size="13" font-weight="700" fill="#a67c1a">Choosing the intervention</text>
    <text x="20" y="120" font-size="12" fill="#1a1a2e">- 1 fact, 1 location: ROME (cheap surgical edit)</text>
    <text x="20" y="140" font-size="12" fill="#1a1a2e">- behaviour direction across many prompts: RepE steering vector</text>
    <text x="20" y="160" font-size="12" fill="#1a1a2e">- distributional shift in many components: fine-tune</text>
  </g>
</svg>
