<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>Production LLM training architecture</title>
  <rect width="1100" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrPT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
    <marker id="arrPTpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Production LLM training architecture</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Four cooperating systems wrap every training step</text>

  <!-- Data Pipeline -->
  <g transform="translate(40, 110)">
    <rect width="240" height="260" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="120" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">1. Data pipeline</text>

    <rect x="20" y="58" width="200" height="50" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="120" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">Object storage</text>
    <text x="120" y="98" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">S3 / GCS shards</text>

    <rect x="20" y="120" width="200" height="50" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="120" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">Mosaic streaming</text>
    <text x="120" y="160" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">deterministic, resumable</text>

    <rect x="20" y="182" width="200" height="50" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="120" y="204" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">Data mixing</text>
    <text x="120" y="222" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">domain weights</text>
  </g>

  <line x1="285" y1="240" x2="320" y2="240" stroke="#5a4a3a" stroke-width="2.5" marker-end="url(#arrPT)"/>

  <!-- Training framework -->
  <g transform="translate(325, 110)">
    <rect width="240" height="260" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="120" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. Trainer</text>

    <rect x="20" y="58" width="200" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="120" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Megatron-Core</text>
    <text x="120" y="98" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">optimizer + comm</text>

    <rect x="20" y="120" width="200" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="120" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">4-D parallelism</text>
    <text x="120" y="160" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">TP + PP + DP + CP</text>

    <rect x="20" y="182" width="200" height="50" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="120" y="204" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">FlashAttention + FP8</text>
    <text x="120" y="222" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">low-precision math</text>
  </g>

  <line x1="570" y1="240" x2="605" y2="240" stroke="#5a4a3a" stroke-width="2.5" marker-end="url(#arrPT)"/>

  <!-- Fault tolerance -->
  <g transform="translate(610, 110)">
    <rect width="240" height="260" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="120" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">3. Fault tolerance</text>

    <rect x="20" y="58" width="200" height="50" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
    <text x="120" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">TorchElastic</text>
    <text x="120" y="98" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">elastic rendezvous</text>

    <rect x="20" y="120" width="200" height="50" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
    <text x="120" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">Health monitor</text>
    <text x="120" y="160" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">XID, NCCL, stragglers</text>

    <rect x="20" y="182" width="200" height="50" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
    <text x="120" y="204" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">Auto-recovery</text>
    <text x="120" y="222" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">quarantine, resume</text>
  </g>

  <line x1="855" y1="240" x2="890" y2="240" stroke="#5a4a3a" stroke-width="2.5" marker-end="url(#arrPT)"/>

  <!-- Checkpointing -->
  <g transform="translate(895, 110)">
    <rect width="170" height="260" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
    <text x="85" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">4. Checkpoint</text>

    <rect x="10" y="58" width="150" height="50" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="85" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">PyTorch DCP</text>
    <text x="85" y="98" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">sharded format</text>

    <rect x="10" y="120" width="150" height="50" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="85" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Async staging</text>
    <text x="85" y="160" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">background copy</text>

    <rect x="10" y="182" width="150" height="50" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
    <text x="85" y="204" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Reshardable</text>
    <text x="85" y="222" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">resume any shape</text>
  </g>

  <!-- Recovery feedback arc -->
  <path d="M 980 110 Q 980 80 600 80 Q 460 80 460 108" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrPTpurple)"/>
  <text x="700" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#722f8a">recover from checkpoint after a failure</text>

  <!-- Takeaway -->
  <g transform="translate(40, 400)">
    <rect width="1020" height="140" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Four cooperating systems wrap every step</text>
    <text x="510" y="60" font-size="12" text-anchor="middle" fill="#1a1a2e">Streaming data; 4-D-parallel trainer; fault tolerance; async resharding checkpoints.</text>
    <text x="510" y="86" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">At 10k+ GPUs, a failure occurs every few hours; sync saves would stall the cluster.</text>
    <text x="510" y="112" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">A single replica cannot fit a frontier model, so 4-D parallelism is required.</text>
  </g>
</svg>
