<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">1F1B Pipeline Parallel Schedule</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Interleaving forward (F) and backward (B) micro-batches keeps every GPU busy and shrinks the bubble.</text>

  <!-- Time axis -->
  <text x="120" y="110" font-size="13" font-weight="700" fill="#5a4a3a">GPU</text>
  <text x="650" y="110" font-size="13" font-weight="700" fill="#5a4a3a" text-anchor="middle">Time -- each cell is one micro-batch step</text>

  <!-- Helper grid: 14 columns starting at x=160, cell width 70, height 50 -->
  <!-- Column tick labels -->
  <g font-size="11" fill="#5a4a3a" text-anchor="middle">
    <text x="195" y="135">t1</text><text x="265" y="135">t2</text><text x="335" y="135">t3</text>
    <text x="405" y="135">t4</text><text x="475" y="135">t5</text><text x="545" y="135">t6</text>
    <text x="615" y="135">t7</text><text x="685" y="135">t8</text><text x="755" y="135">t9</text>
    <text x="825" y="135">t10</text><text x="895" y="135">t11</text><text x="965" y="135">t12</text>
    <text x="1035" y="135">t13</text><text x="1105" y="135">t14</text>
  </g>

  <!-- Row backgrounds -->
  <g>
    <rect x="160" y="145" width="980" height="50" fill="#f7f7f9" stroke="#5a4a3a" stroke-width="0.5"/>
    <rect x="160" y="200" width="980" height="50" fill="#f7f7f9" stroke="#5a4a3a" stroke-width="0.5"/>
    <rect x="160" y="255" width="980" height="50" fill="#f7f7f9" stroke="#5a4a3a" stroke-width="0.5"/>
    <rect x="160" y="310" width="980" height="50" fill="#f7f7f9" stroke="#5a4a3a" stroke-width="0.5"/>
  </g>

  <!-- GPU labels -->
  <g font-size="13" font-weight="700" fill="#1a1a2e">
    <text x="100" y="178">GPU 0</text>
    <text x="100" y="233">GPU 1</text>
    <text x="100" y="288">GPU 2</text>
    <text x="100" y="343">GPU 3</text>
  </g>
  <text x="100" y="195" font-size="11" fill="#5a4a3a">layers 1-6</text>
  <text x="100" y="250" font-size="11" fill="#5a4a3a">layers 7-12</text>
  <text x="100" y="305" font-size="11" fill="#5a4a3a">layers 13-18</text>
  <text x="100" y="360" font-size="11" fill="#5a4a3a">layers 19-24</text>

  <!-- Cells: F = blue, B = orange, idle = gray (bubble) -->
  <!-- Schedule (1F1B with 4 stages, 4 micro-batches), F1..F4 then B1..B4 staggered -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <!-- Row GPU 0: F1 F2 F3 F4 _ _ B1 B2 B3 B4 _ _ _ _ -->
    <g>
      <rect x="160" y="148" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="194" y="176" fill="#1a4078">F1</text>
      <rect x="230" y="148" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="264" y="176" fill="#1a4078">F2</text>
      <rect x="300" y="148" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="334" y="176" fill="#1a4078">F3</text>
      <rect x="370" y="148" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="404" y="176" fill="#1a4078">F4</text>
      <rect x="440" y="148" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="510" y="148" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="580" y="148" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="614" y="176" fill="#b3401b">B1</text>
      <rect x="650" y="148" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="684" y="176" fill="#b3401b">B2</text>
      <rect x="720" y="148" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="754" y="176" fill="#b3401b">B3</text>
      <rect x="790" y="148" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="824" y="176" fill="#b3401b">B4</text>
      <rect x="860" y="148" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="930" y="148" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="1000" y="148" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="1070" y="148" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    </g>
    <!-- GPU 1: _ F1 F2 F3 F4 _ _ B1 B2 B3 B4 _ _ _ -->
    <g>
      <rect x="160" y="203" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="230" y="203" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="264" y="231" fill="#1a4078">F1</text>
      <rect x="300" y="203" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="334" y="231" fill="#1a4078">F2</text>
      <rect x="370" y="203" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="404" y="231" fill="#1a4078">F3</text>
      <rect x="440" y="203" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="474" y="231" fill="#1a4078">F4</text>
      <rect x="510" y="203" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="580" y="203" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="650" y="203" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="684" y="231" fill="#b3401b">B1</text>
      <rect x="720" y="203" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="754" y="231" fill="#b3401b">B2</text>
      <rect x="790" y="203" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="824" y="231" fill="#b3401b">B3</text>
      <rect x="860" y="203" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="894" y="231" fill="#b3401b">B4</text>
      <rect x="930" y="203" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="1000" y="203" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="1070" y="203" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    </g>
    <!-- GPU 2: _ _ F1 F2 F3 F4 _ _ B1 B2 B3 B4 _ _ -->
    <g>
      <rect x="160" y="258" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="230" y="258" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="300" y="258" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="334" y="286" fill="#1a4078">F1</text>
      <rect x="370" y="258" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="404" y="286" fill="#1a4078">F2</text>
      <rect x="440" y="258" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="474" y="286" fill="#1a4078">F3</text>
      <rect x="510" y="258" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="544" y="286" fill="#1a4078">F4</text>
      <rect x="580" y="258" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="650" y="258" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="720" y="258" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="754" y="286" fill="#b3401b">B1</text>
      <rect x="790" y="258" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="824" y="286" fill="#b3401b">B2</text>
      <rect x="860" y="258" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="894" y="286" fill="#b3401b">B3</text>
      <rect x="930" y="258" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="964" y="286" fill="#b3401b">B4</text>
      <rect x="1000" y="258" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="1070" y="258" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    </g>
    <!-- GPU 3: _ _ _ F1 F2 F3 F4 B1 B2 B3 B4 _ _ _  (1F1B: B1 immediately after F4 here) -->
    <g>
      <rect x="160" y="313" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="230" y="313" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="300" y="313" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="370" y="313" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="404" y="341" fill="#1a4078">F1</text>
      <rect x="440" y="313" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="474" y="341" fill="#1a4078">F2</text>
      <rect x="510" y="313" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="544" y="341" fill="#1a4078">F3</text>
      <rect x="580" y="313" width="68" height="44" rx="3" fill="#eef4fa" stroke="#1a4078"/><text x="614" y="341" fill="#1a4078">F4</text>
      <rect x="650" y="313" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="684" y="341" fill="#b3401b">B1</text>
      <rect x="720" y="313" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="754" y="341" fill="#b3401b">B2</text>
      <rect x="790" y="313" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="824" y="341" fill="#b3401b">B3</text>
      <rect x="860" y="313" width="68" height="44" rx="3" fill="#fdeee8" stroke="#b3401b"/><text x="894" y="341" fill="#b3401b">B4</text>
      <rect x="930" y="313" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="1000" y="313" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
      <rect x="1070" y="313" width="68" height="44" rx="3" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    </g>
  </g>

  <!-- Bubble brackets (warm-up + cool-down) -->
  <g stroke="#b3401b" stroke-width="1.5" fill="none">
    <path d="M 160 380 L 160 395 L 368 395 L 368 380"/>
    <path d="M 930 380 L 930 395 L 1138 395 L 1138 380"/>
  </g>
  <text x="264" y="412" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">warm-up bubble</text>
  <text x="1034" y="412" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">cool-down bubble</text>

  <!-- Legend -->
  <g transform="translate(160, 430)" font-size="12">
    <rect x="0" y="0" width="22" height="16" rx="2" fill="#eef4fa" stroke="#1a4078"/>
    <text x="30" y="13" fill="#1a1a2e">F = forward pass on a micro-batch</text>
    <rect x="290" y="0" width="22" height="16" rx="2" fill="#fdeee8" stroke="#b3401b"/>
    <text x="320" y="13" fill="#1a1a2e">B = backward pass on the same micro-batch</text>
    <rect x="700" y="0" width="22" height="16" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <text x="730" y="13" fill="#1a1a2e">idle (pipeline bubble, GPU has no work)</text>
  </g>

  <!-- Explanation panel -->
  <g transform="translate(60, 475)">
    <rect width="760" height="160" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#1f7a3a">How 1F1B works</text>
    <text x="20" y="54" font-size="12" fill="#1a1a2e">1. Split the model across GPUs by layer (here: 4 stages, 6 layers each).</text>
    <text x="20" y="76" font-size="12" fill="#1a1a2e">2. Split the global mini-batch into K micro-batches (here K = 4).</text>
    <text x="20" y="98" font-size="12" fill="#1a1a2e">3. Each stage runs forward on micro-batch i, then immediately starts</text>
    <text x="20" y="116" font-size="12" fill="#1a1a2e">    backward on the oldest in-flight one, alternating 1F-1B steady-state.</text>
    <text x="20" y="138" font-size="12" fill="#1a1a2e">4. Activations are kept only for in-flight micro-batches, capping memory.</text>
  </g>

  <!-- Callout: bubble fraction -->
  <g transform="translate(840, 475)">
    <rect width="400" height="160" rx="10" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7a5e1a">Bubble fraction</text>
    <text x="20" y="54" font-size="12" fill="#1a1a2e">For P stages and K micro-batches:</text>
    <text x="20" y="80" font-size="14" font-weight="700" fill="#7a5e1a">bubble approx (P - 1) / (K + P - 1)</text>
    <text x="20" y="106" font-size="12" fill="#1a1a2e">More micro-batches per step = smaller bubble,</text>
    <text x="20" y="124" font-size="12" fill="#1a1a2e">but each one carries more activation memory.</text>
    <text x="20" y="146" font-size="12" fill="#1a1a2e">Typical sweet spot: K = 4 to 8 times P.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 660)">
    <rect width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Pipeline parallelism splits the model by layer; the 1F1B schedule overlaps forward and backward micro-batches so the warm-up / cool-down "bubble" of idle time becomes a small fraction of total step time.</text>
  </g>
</svg>
