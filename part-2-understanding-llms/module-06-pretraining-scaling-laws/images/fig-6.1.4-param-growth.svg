<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="700" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">LLM Parameter Growth, 2018–2024</text>
  <text x="700" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Same data, two views: linear shows the visceral hockey stick; log shows the law (and where it bends)</text>

  <!-- LEFT: LINEAR -->
  <g>
    <rect x="50" y="100" width="660" height="500" rx="10" fill="#fafbfc" stroke="#cfd8e3" stroke-width="1.5"/>
    <text x="380" y="128" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Linear scale — the hockey stick</text>
    <text x="380" y="148" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">classic exponential shape: nothing happens, then everything happens</text>

    <line x1="120" y1="540" x2="680" y2="540" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="120" y1="180" x2="120" y2="540" stroke="#1a1a2e" stroke-width="1.5"/>

    <g font-size="11" fill="#5a4a3a">
      <line x1="116" y1="540" x2="120" y2="540" stroke="#1a1a2e"/>
      <text x="112" y="544" text-anchor="end">0</text>
      <line x1="116" y1="468" x2="120" y2="468" stroke="#1a1a2e"/>
      <text x="112" y="472" text-anchor="end">200B</text>
      <line x1="116" y1="396" x2="120" y2="396" stroke="#1a1a2e"/>
      <text x="112" y="400" text-anchor="end">400B</text>
      <line x1="116" y1="324" x2="120" y2="324" stroke="#1a1a2e"/>
      <text x="112" y="328" text-anchor="end">600B</text>
      <line x1="116" y1="252" x2="120" y2="252" stroke="#1a1a2e"/>
      <text x="112" y="256" text-anchor="end">800B</text>
      <line x1="116" y1="180" x2="120" y2="180" stroke="#1a1a2e"/>
      <text x="112" y="184" text-anchor="end">1T</text>
    </g>
    <text x="60" y="370" font-size="12" text-anchor="middle" fill="#5a4a3a" transform="rotate(-90 60 370)">parameters (linear)</text>

    <g font-size="11" fill="#5a4a3a">
      <line x1="160" y1="540" x2="160" y2="544" stroke="#1a1a2e"/>
      <text x="160" y="558" text-anchor="middle">2018</text>
      <line x1="240" y1="540" x2="240" y2="544" stroke="#1a1a2e"/>
      <text x="240" y="558" text-anchor="middle">2019</text>
      <line x1="320" y1="540" x2="320" y2="544" stroke="#1a1a2e"/>
      <text x="320" y="558" text-anchor="middle">2020</text>
      <line x1="400" y1="540" x2="400" y2="544" stroke="#1a1a2e"/>
      <text x="400" y="558" text-anchor="middle">2021</text>
      <line x1="480" y1="540" x2="480" y2="544" stroke="#1a1a2e"/>
      <text x="480" y="558" text-anchor="middle">2022</text>
      <line x1="560" y1="540" x2="560" y2="544" stroke="#1a1a2e"/>
      <text x="560" y="558" text-anchor="middle">2023</text>
      <line x1="640" y1="540" x2="640" y2="544" stroke="#1a1a2e"/>
      <text x="640" y="558" text-anchor="middle">2024</text>
    </g>
    <text x="400" y="585" font-size="12" text-anchor="middle" fill="#5a4a3a">year</text>

    <!-- exponential curve through GPT-1, GPT-2, GPT-3, GPT-4 -->
    <path d="M 160 540 C 220 540 280 540 320 477 C 360 440 440 360 560 180"
          fill="none" stroke="#1f7a3a" stroke-width="3"/>

    <circle cx="160" cy="540" r="6" fill="#1f7a3a"/>
    <text x="170" y="535" font-size="11" font-weight="700" fill="#1f7a3a">GPT-1 (117M)</text>

    <circle cx="240" cy="539" r="6" fill="#1f7a3a"/>
    <text x="250" y="534" font-size="11" font-weight="700" fill="#1f7a3a">GPT-2 (1.5B)</text>

    <circle cx="320" cy="477" r="7" fill="#1f7a3a"/>
    <text x="320" y="462" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">GPT-3</text>
    <text x="320" y="447" font-size="10" text-anchor="middle" fill="#5a4a3a">175B</text>

    <circle cx="560" cy="180" r="9" fill="#1f7a3a"/>
    <text x="560" y="165" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">GPT-4</text>
    <text x="560" y="148" font-size="10" text-anchor="middle" fill="#5a4a3a">~1T (est.)</text>

    <g>
      <line x1="240" y1="538" x2="305" y2="500" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="305" y="495" font-size="11" font-style="italic" fill="#5a4a3a">all of 2018-2020</text>
      <text x="305" y="510" font-size="11" font-style="italic" fill="#5a4a3a">looks like ~zero here</text>
    </g>
  </g>

  <!-- RIGHT: LOG -->
  <g>
    <rect x="730" y="100" width="620" height="500" rx="10" fill="#fafbfc" stroke="#cfd8e3" stroke-width="1.5"/>
    <text x="1040" y="128" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">Log scale — the slope IS the rate</text>
    <text x="1040" y="148" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">straight line = constant exponent; bend = the rate changing</text>

    <line x1="800" y1="540" x2="1320" y2="540" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="800" y1="180" x2="800" y2="540" stroke="#1a1a2e" stroke-width="1.5"/>

    <g font-size="11" fill="#5a4a3a">
      <line x1="796" y1="540" x2="800" y2="540" stroke="#1a1a2e"/>
      <text x="792" y="544" text-anchor="end">100M</text>
      <line x1="796" y1="450" x2="800" y2="450" stroke="#1a1a2e"/>
      <text x="792" y="454" text-anchor="end">1B</text>
      <line x1="796" y1="360" x2="800" y2="360" stroke="#1a1a2e"/>
      <text x="792" y="364" text-anchor="end">10B</text>
      <line x1="796" y1="270" x2="800" y2="270" stroke="#1a1a2e"/>
      <text x="792" y="274" text-anchor="end">100B</text>
      <line x1="796" y1="180" x2="800" y2="180" stroke="#1a1a2e"/>
      <text x="792" y="184" text-anchor="end">1T</text>
    </g>
    <text x="745" y="370" font-size="12" text-anchor="middle" fill="#5a4a3a" transform="rotate(-90 745 370)">parameters (log)</text>

    <g font-size="11" fill="#5a4a3a">
      <line x1="830" y1="540" x2="830" y2="544" stroke="#1a1a2e"/>
      <text x="830" y="558" text-anchor="middle">2018</text>
      <line x1="912" y1="540" x2="912" y2="544" stroke="#1a1a2e"/>
      <text x="912" y="558" text-anchor="middle">2019</text>
      <line x1="994" y1="540" x2="994" y2="544" stroke="#1a1a2e"/>
      <text x="994" y="558" text-anchor="middle">2020</text>
      <line x1="1076" y1="540" x2="1076" y2="544" stroke="#1a1a2e"/>
      <text x="1076" y="558" text-anchor="middle">2021</text>
      <line x1="1158" y1="540" x2="1158" y2="544" stroke="#1a1a2e"/>
      <text x="1158" y="558" text-anchor="middle">2022</text>
      <line x1="1240" y1="540" x2="1240" y2="544" stroke="#1a1a2e"/>
      <text x="1240" y="558" text-anchor="middle">2023</text>
      <line x1="1322" y1="540" x2="1322" y2="544" stroke="#1a1a2e"/>
      <text x="1322" y="558" text-anchor="middle">2024</text>
    </g>
    <text x="1040" y="585" font-size="12" text-anchor="middle" fill="#5a4a3a">year</text>

    <!-- Extrapolation of pre-2020 trend (10x/yr) -->
    <line x1="830" y1="534" x2="1075" y2="183" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="940" y="290" font-size="11" font-style="italic" fill="#722f8a">extrapolated 10×/yr trend</text>

    <!-- Actual data -->
    <polyline points="830,534 912,434 994,248 1240,180" fill="none" stroke="#1f7a3a" stroke-width="3"/>

    <circle cx="830" cy="534" r="6" fill="#1f7a3a"/>
    <text x="830" y="520" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">GPT-1</text>

    <circle cx="912" cy="434" r="6" fill="#1f7a3a"/>
    <text x="912" y="420" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">GPT-2</text>

    <circle cx="994" cy="248" r="7" fill="#1f7a3a"/>
    <text x="994" y="234" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">GPT-3</text>

    <circle cx="1240" cy="180" r="8" fill="#1f7a3a"/>
    <text x="1240" y="166" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">GPT-4</text>

    <!-- Bend callout -->
    <g>
      <rect x="1010" y="350" width="220" height="58" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="1120" y="370" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">⚠ The line bends</text>
      <text x="1120" y="388" font-size="11" text-anchor="middle" fill="#1a1a2e">2018-2020: ~12×/yr (steep)</text>
      <text x="1120" y="402" font-size="11" text-anchor="middle" fill="#1a1a2e">2020-2023: ~1.8×/yr (flat)</text>
    </g>

    <!-- Contemporary models -->
    <circle cx="912" cy="396" r="5" fill="none" stroke="#1a4078" stroke-width="1.5"/>
    <text x="924" y="400" font-size="10" fill="#1a4078">BERT (340M)</text>
    <circle cx="994" cy="328" r="5" fill="none" stroke="#1a4078" stroke-width="1.5"/>
    <text x="1006" y="332" font-size="10" fill="#1a4078">T5 (11B)</text>
    <circle cx="1322" cy="200" r="5" fill="none" stroke="#1a4078" stroke-width="1.5"/>
    <text x="1310" y="195" font-size="10" text-anchor="end" fill="#1a4078">DeepSeek-V3 (671B)</text>
    <circle cx="1322" cy="375" r="5" fill="none" stroke="#1a4078" stroke-width="1.5"/>
    <text x="1310" y="378" font-size="10" text-anchor="end" fill="#1a4078">Llama-3 (70B)</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(50, 620)">
    <rect x="0" y="0" width="1300" height="110" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#1f7a3a">Why both views</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Linear shows the gut truth: GPT-4 towers, every prior model is a rounding error. The right picture for "look how big things got."</text>
    <text x="20" y="72" font-size="12" fill="#1a1a2e">Log shows the rule: each tick is 10×. The right picture for "is the growth rate steady, accelerating, or slowing?"</text>
    <text x="20" y="94" font-size="12" font-style="italic" fill="#5a4a3a">Honest answer in 2024: parameter scaling has slowed. Capability gains now come from data quality, post-training, and inference-time compute (test-time scaling).</text>
  </g>
</svg>
