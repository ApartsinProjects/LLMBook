<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text x="700" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Encoder-Only Lineage: BERT → ModernBERT</text>
  <text x="700" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Each generation kept the bidirectional core but added one signature improvement; ModernBERT proves the family is still alive in 2024</text>

  <!-- ============ COMPACT TIMELINE ROW ============ -->
  <g>
    <!-- spine -->
    <line x1="120" y1="160" x2="1280" y2="160" stroke="#1a1a2e" stroke-width="2"/>

    <!-- Year ticks -->
    <g font-size="11" fill="#5a4a3a">
      <line x1="160" y1="155" x2="160" y2="170" stroke="#1a1a2e"/><text x="160" y="190" text-anchor="middle">2018</text>
      <line x1="320" y1="155" x2="320" y2="170" stroke="#1a1a2e"/><text x="320" y="190" text-anchor="middle">2019</text>
      <line x1="480" y1="155" x2="480" y2="170" stroke="#1a1a2e"/><text x="480" y="190" text-anchor="middle">2020</text>
      <line x1="640" y1="155" x2="640" y2="170" stroke="#1a1a2e"/><text x="640" y="190" text-anchor="middle">2021</text>
      <line x1="800" y1="155" x2="800" y2="170" stroke="#1a1a2e"/><text x="800" y="190" text-anchor="middle">2022</text>
      <line x1="960" y1="155" x2="960" y2="170" stroke="#1a1a2e"/><text x="960" y="190" text-anchor="middle">2023</text>
      <line x1="1120" y1="155" x2="1120" y2="170" stroke="#1a1a2e"/><text x="1120" y="190" text-anchor="middle">2024</text>
    </g>

    <!-- "quiet years" gap annotation -->
    <rect x="650" y="135" width="450" height="20" rx="10" fill="#fafbfc" stroke="#cfd8e3" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="875" y="149" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">2022-2023 quiet — field shifts to decoder-only LLMs</text>

    <!-- Model dots (size proportional to log(params)) -->
    <!-- BERT 340M ~ r=12 -->
    <circle cx="160" cy="160" r="12" fill="#1f7a3a" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="160" y="115" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">BERT</text>
    <text x="160" y="100" font-size="10" text-anchor="middle" fill="#5a4a3a">340 M</text>

    <!-- RoBERTa 355M ~ r=12 -->
    <circle cx="320" cy="160" r="12" fill="#1f7a3a" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="320" y="115" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">RoBERTa</text>
    <text x="320" y="100" font-size="10" text-anchor="middle" fill="#5a4a3a">355 M</text>

    <!-- DeBERTa 1.5B ~ r=18 (largest) -->
    <circle cx="480" cy="160" r="18" fill="#1f7a3a" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="480" y="115" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">DeBERTa</text>
    <text x="480" y="100" font-size="10" text-anchor="middle" fill="#5a4a3a">1.5 B</text>

    <!-- DeBERTa V3 304M ~ r=11 (smaller!) -->
    <circle cx="640" cy="160" r="11" fill="#1f7a3a" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="640" y="115" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">DeBERTa V3</text>
    <text x="640" y="100" font-size="10" text-anchor="middle" fill="#5a4a3a">304 M (smaller!)</text>

    <!-- ModernBERT 395M ~ r=12, highlighted -->
    <circle cx="1120" cy="160" r="13" fill="#7a5e1a" stroke="#1a1a2e" stroke-width="2"/>
    <text x="1120" y="115" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">ModernBERT</text>
    <text x="1120" y="100" font-size="10" text-anchor="middle" fill="#5a4a3a">395 M</text>

    <!-- Legend for dot size -->
    <g transform="translate(1280, 80)">
      <text x="0" y="0" font-size="10" fill="#5a4a3a">dot size = log(params)</text>
    </g>
  </g>

  <!-- ============ FEATURE EVOLUTION MATRIX ============ -->
  <g transform="translate(120, 230)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#1a1a2e">What each generation added</text>
    <text x="0" y="20" font-size="11" font-style="italic" fill="#5a4a3a">filled dot = present in this model · arrow = the new thing introduced</text>

    <!-- Column headers (model names) -->
    <g font-size="11" font-weight="700" fill="#1a4078">
      <text x="450" y="55" text-anchor="middle">BERT</text>
      <text x="600" y="55" text-anchor="middle">RoBERTa</text>
      <text x="750" y="55" text-anchor="middle">DeBERTa</text>
      <text x="900" y="55" text-anchor="middle">DeBERTa V3</text>
      <text x="1100" y="55" text-anchor="middle">ModernBERT</text>
    </g>

    <!-- Feature rows -->
    <!-- Row helpers: y=cell mid -->
    <!-- Row: Bidirectional MLM (in all) -->
    <text x="0" y="95" font-size="12" fill="#1a1a2e">Bidirectional MLM</text>
    <text x="220" y="95" font-size="11" font-style="italic" fill="#5a4a3a">the foundation</text>
    <circle cx="450" cy="91" r="8" fill="#1f7a3a"/><text x="467" y="95" font-size="10" font-weight="700" fill="#1f7a3a">←new</text>
    <circle cx="600" cy="91" r="8" fill="#1f7a3a"/>
    <circle cx="750" cy="91" r="8" fill="#1f7a3a"/>
    <circle cx="900" cy="91" r="8" fill="#1f7a3a"/>
    <circle cx="1100" cy="91" r="8" fill="#7a5e1a"/>

    <!-- Row: Next-Sentence Prediction (NSP) — only BERT, dropped after -->
    <line x1="0" y1="115" x2="1200" y2="115" stroke="#cfd8e3" stroke-width="0.8"/>
    <text x="0" y="135" font-size="12" fill="#1a1a2e">Next-Sentence Prediction</text>
    <text x="220" y="135" font-size="11" font-style="italic" fill="#b3401b">found unhelpful, dropped</text>
    <circle cx="450" cy="131" r="8" fill="#1f7a3a"/>
    <circle cx="600" cy="131" r="8" fill="none" stroke="#b3401b" stroke-width="1.5"/>
    <text x="617" y="135" font-size="10" font-weight="700" fill="#b3401b">×removed</text>
    <circle cx="750" cy="131" r="8" fill="none" stroke="#b3401b" stroke-width="1.5"/>
    <circle cx="900" cy="131" r="8" fill="none" stroke="#b3401b" stroke-width="1.5"/>
    <circle cx="1100" cy="131" r="8" fill="none" stroke="#b3401b" stroke-width="1.5"/>

    <!-- Row: Better training recipe (RoBERTa) -->
    <line x1="0" y1="155" x2="1200" y2="155" stroke="#cfd8e3" stroke-width="0.8"/>
    <text x="0" y="175" font-size="12" fill="#1a1a2e">10× longer + larger batch</text>
    <text x="220" y="175" font-size="11" font-style="italic" fill="#5a4a3a">just train it more</text>
    <circle cx="450" cy="171" r="8" fill="none" stroke="#cfd8e3" stroke-width="1.5"/>
    <circle cx="600" cy="171" r="8" fill="#1f7a3a"/><text x="617" y="175" font-size="10" font-weight="700" fill="#1f7a3a">←new</text>
    <circle cx="750" cy="171" r="8" fill="#1f7a3a"/>
    <circle cx="900" cy="171" r="8" fill="#1f7a3a"/>
    <circle cx="1100" cy="171" r="8" fill="#7a5e1a"/>

    <!-- Row: Disentangled attention (DeBERTa) -->
    <line x1="0" y1="195" x2="1200" y2="195" stroke="#cfd8e3" stroke-width="0.8"/>
    <text x="0" y="215" font-size="12" fill="#1a1a2e">Disentangled attention</text>
    <text x="220" y="215" font-size="11" font-style="italic" fill="#5a4a3a">separate content + position</text>
    <circle cx="450" cy="211" r="8" fill="none" stroke="#cfd8e3" stroke-width="1.5"/>
    <circle cx="600" cy="211" r="8" fill="none" stroke="#cfd8e3" stroke-width="1.5"/>
    <circle cx="750" cy="211" r="8" fill="#1f7a3a"/><text x="767" y="215" font-size="10" font-weight="700" fill="#1f7a3a">←new</text>
    <circle cx="900" cy="211" r="8" fill="#1f7a3a"/>
    <circle cx="1100" cy="211" r="8" fill="#7a5e1a"/>

    <!-- Row: ELECTRA-style pretraining (DeBERTa V3) -->
    <line x1="0" y1="235" x2="1200" y2="235" stroke="#cfd8e3" stroke-width="0.8"/>
    <text x="0" y="255" font-size="12" fill="#1a1a2e">ELECTRA-style pretraining</text>
    <text x="220" y="255" font-size="11" font-style="italic" fill="#5a4a3a">replaced-token detection</text>
    <circle cx="450" cy="251" r="8" fill="none" stroke="#cfd8e3" stroke-width="1.5"/>
    <circle cx="600" cy="251" r="8" fill="none" stroke="#cfd8e3" stroke-width="1.5"/>
    <circle cx="750" cy="251" r="8" fill="none" stroke="#cfd8e3" stroke-width="1.5"/>
    <circle cx="900" cy="251" r="8" fill="#1f7a3a"/><text x="917" y="255" font-size="10" font-weight="700" fill="#1f7a3a">←new</text>
    <circle cx="1100" cy="251" r="8" fill="#7a5e1a"/>

    <!-- Row: FlashAttention 2 + RoPE + 8K (ModernBERT) -->
    <line x1="0" y1="275" x2="1200" y2="275" stroke="#cfd8e3" stroke-width="0.8"/>
    <text x="0" y="295" font-size="12" fill="#1a1a2e">FlashAttention 2 + RoPE + 8K ctx</text>
    <text x="220" y="295" font-size="11" font-style="italic" fill="#5a4a3a">modern transformer toolkit</text>
    <circle cx="450" cy="291" r="8" fill="none" stroke="#cfd8e3" stroke-width="1.5"/>
    <circle cx="600" cy="291" r="8" fill="none" stroke="#cfd8e3" stroke-width="1.5"/>
    <circle cx="750" cy="291" r="8" fill="none" stroke="#cfd8e3" stroke-width="1.5"/>
    <circle cx="900" cy="291" r="8" fill="none" stroke="#cfd8e3" stroke-width="1.5"/>
    <circle cx="1100" cy="291" r="8" fill="#7a5e1a"/><text x="1117" y="295" font-size="10" font-weight="700" fill="#7a5e1a">←new</text>
    <line x1="0" y1="310" x2="1200" y2="310" stroke="#cfd8e3" stroke-width="0.8"/>
  </g>

  <!-- ============ Why-encoder-still-matters callout ============ -->
  <g transform="translate(120, 580)">
    <rect x="0" y="0" width="1160" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7a5e1a">Why encoder-only didn't die</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">Decoder LLMs are bad at <tspan font-weight="700">retrieval embeddings, classification, and re-ranking</tspan> — tasks that need a single dense vector per input, not autoregressive generation.</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">Encoder models stay 5-10× cheaper at these jobs. ModernBERT (2024) brought RoPE + FlashAttn to a 395 M model that matches or beats far bigger LLMs on MTEB.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(120, 685)">
    <rect x="0" y="0" width="1160" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">Each step inherited everything useful from its predecessor and added exactly one signature change. The lineage is cumulative, not parallel.</text>
  </g>
</svg>
