<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrMute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">Mixture-of-Experts Layer with Top-2 Routing</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each token activates only 2 of 6 experts; the router learns which experts to wake up.</text>

  <!-- Token (input) -->
  <g>
    <rect x="540" y="100" width="220" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="650" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Token hidden state x</text>
    <text x="650" y="148" font-size="12" text-anchor="middle" fill="#5a4a3a">one position in the sequence</text>
  </g>
  <line x1="650" y1="160" x2="650" y2="195" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Router -->
  <g>
    <rect x="490" y="200" width="320" height="80" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="650" y="228" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a2e">Router (gating network)</text>
    <text x="650" y="250" font-size="12" text-anchor="middle" fill="#5a4a3a">softmax(W_g x), keep top-2 logits, renormalize</text>
    <text x="650" y="268" font-size="12" font-style="italic" text-anchor="middle" fill="#722f8a">picks: Expert 1 (0.62), Expert 2 (0.38)</text>
  </g>

  <!-- Six expert columns -->
  <!-- positions: experts at x = 80, 260, 440, 620, 800, 980 width 160 -->
  <!-- routing arrows from router center to each expert top -->
  <line x1="560" y1="282" x2="160" y2="335" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="600" y1="282" x2="340" y2="335" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="282" x2="520" y2="335" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrMute)"/>
  <line x1="680" y1="282" x2="700" y2="335" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrMute)"/>
  <line x1="720" y1="282" x2="880" y2="335" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrMute)"/>
  <line x1="760" y1="282" x2="1060" y2="335" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrMute)"/>

  <!-- Expert 1 (active) -->
  <g>
    <rect x="80" y="340" width="160" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="160" y="368" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Expert 1</text>
    <text x="160" y="390" font-size="12" text-anchor="middle" fill="#5a4a3a">FFN, active</text>
    <text x="160" y="418" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">w = 0.62</text>
  </g>
  <!-- Expert 2 (active) -->
  <g>
    <rect x="260" y="340" width="160" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="340" y="368" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Expert 2</text>
    <text x="340" y="390" font-size="12" text-anchor="middle" fill="#5a4a3a">FFN, active</text>
    <text x="340" y="418" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">w = 0.38</text>
  </g>
  <!-- Experts 3-6 (skipped) -->
  <g>
    <rect x="440" y="340" width="160" height="100" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="520" y="368" font-size="14" font-weight="700" text-anchor="middle" fill="#5a4a3a">Expert 3</text>
    <text x="520" y="390" font-size="12" text-anchor="middle" fill="#5a4a3a">skipped</text>
    <text x="520" y="418" font-size="12" text-anchor="middle" fill="#5a4a3a">no compute</text>
  </g>
  <g>
    <rect x="620" y="340" width="160" height="100" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="700" y="368" font-size="14" font-weight="700" text-anchor="middle" fill="#5a4a3a">Expert 4</text>
    <text x="700" y="390" font-size="12" text-anchor="middle" fill="#5a4a3a">skipped</text>
    <text x="700" y="418" font-size="12" text-anchor="middle" fill="#5a4a3a">no compute</text>
  </g>
  <g>
    <rect x="800" y="340" width="160" height="100" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="880" y="368" font-size="14" font-weight="700" text-anchor="middle" fill="#5a4a3a">Expert 5</text>
    <text x="880" y="390" font-size="12" text-anchor="middle" fill="#5a4a3a">skipped</text>
    <text x="880" y="418" font-size="12" text-anchor="middle" fill="#5a4a3a">no compute</text>
  </g>
  <g>
    <rect x="980" y="340" width="160" height="100" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="1060" y="368" font-size="14" font-weight="700" text-anchor="middle" fill="#5a4a3a">Expert 6</text>
    <text x="1060" y="390" font-size="12" text-anchor="middle" fill="#5a4a3a">skipped</text>
    <text x="1060" y="418" font-size="12" text-anchor="middle" fill="#5a4a3a">no compute</text>
  </g>

  <!-- Weighted sum -->
  <line x1="160" y1="442" x2="610" y2="495" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="442" x2="640" y2="495" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="490" y="500" width="320" height="70" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="650" y="528" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a2e">Weighted sum &#8594; output y</text>
    <text x="650" y="552" font-size="12" text-anchor="middle" fill="#5a4a3a">y = 0.62 &#118833; E1(x) + 0.38 &#118833; E2(x)</text>
  </g>

  <!-- Why callout -->
  <g transform="translate(60, 460)">
    <rect x="0" y="0" width="380" height="130" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Why sparse activation</text>
    <text x="16" y="50" font-size="12" fill="#1a1a2e">Total parameters: 6 experts of size N.</text>
    <text x="16" y="68" font-size="12" fill="#1a1a2e">Active per token: 2 of N (about 33%).</text>
    <text x="16" y="92" font-size="12" fill="#1a1a2e">FLOPs per token stay near a dense 2N model</text>
    <text x="16" y="110" font-size="12" fill="#1a1a2e">while capacity grows with the expert count.</text>
  </g>

  <g transform="translate(860, 460)">
    <rect x="0" y="0" width="380" height="130" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Diagnose: load balancing</text>
    <text x="16" y="50" font-size="12" fill="#1a1a2e">Without an auxiliary loss, the router collapses</text>
    <text x="16" y="68" font-size="12" fill="#1a1a2e">to a few favorite experts. Add a load-balance</text>
    <text x="16" y="92" font-size="12" fill="#1a1a2e">term so each expert gets a similar share of</text>
    <text x="16" y="110" font-size="12" fill="#1a1a2e">tokens across the batch.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">MoE decouples parameter count from per-token compute. Big total capacity, small per-token cost; the router decides which experts pay attention.</text>
  </g>
</svg>
