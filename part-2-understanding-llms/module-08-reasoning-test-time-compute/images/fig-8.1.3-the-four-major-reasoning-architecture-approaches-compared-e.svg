<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1180" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">Four Reasoning Architectures Compared</text>
  <text x="550" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">From a single linear chain to branching search and tool-using loops; each trades cost for reliability differently.</text>

  <!-- Card 1: Chain-of-Thought -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="1020" height="240" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="1020" height="36" rx="10" fill="#1a4078"/>
    <text x="20" y="24" font-size="15" font-weight="700" fill="#ffffff">1.  Chain-of-Thought (CoT)</text>
    <text x="1000" y="24" font-size="12" text-anchor="end" fill="#eef4fa">single-pass linear reasoning</text>

    <!-- Visual: linear chain -->
    <g transform="translate(20, 60)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#5a4a3a">Visual signature</text>
      <g transform="translate(0, 24)">
        <rect x="0" y="20" width="80" height="36" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
        <text x="40" y="42" font-size="12" text-anchor="middle" fill="#1a1a2e">Question</text>
        <line x1="80" y1="38" x2="100" y2="38" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
        <rect x="100" y="20" width="80" height="36" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
        <text x="140" y="42" font-size="12" text-anchor="middle" fill="#1a1a2e">Step 1</text>
        <line x1="180" y1="38" x2="200" y2="38" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
        <rect x="200" y="20" width="80" height="36" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
        <text x="240" y="42" font-size="12" text-anchor="middle" fill="#1a1a2e">Step 2</text>
        <line x1="280" y1="38" x2="300" y2="38" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
        <rect x="300" y="20" width="80" height="36" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
        <text x="340" y="42" font-size="12" text-anchor="middle" fill="#1a1a2e">Step 3</text>
        <line x1="380" y1="38" x2="400" y2="38" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
        <rect x="400" y="20" width="80" height="36" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
        <text x="440" y="42" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Answer</text>
      </g>
      <text x="0" y="120" font-size="11" font-style="italic" fill="#5a4a3a">1 model call. Reasoning is visible. No backtracking.</text>
    </g>

    <!-- When to use -->
    <g transform="translate(540, 60)">
      <rect x="0" y="0" width="220" height="160" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.2"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#7a5e1a">When to use</text>
      <text x="12" y="44" font-size="12" fill="#1a1a2e">moderate problems with</text>
      <text x="12" y="60" font-size="12" fill="#1a1a2e">a clear deductive path</text>
      <text x="12" y="86" font-size="12" font-weight="700" fill="#7a5e1a">Cost: ~1x baseline</text>
      <text x="12" y="106" font-size="12" font-weight="700" fill="#7a5e1a">Reliability: medium</text>
      <text x="12" y="132" font-size="11" font-style="italic" fill="#5a4a3a">brittle on long chains;</text>
      <text x="12" y="148" font-size="11" font-style="italic" fill="#5a4a3a">one bad step ruins it.</text>
    </g>

    <!-- Example -->
    <g transform="translate(780, 60)">
      <rect x="0" y="0" width="220" height="160" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#1a4078">Example prompt</text>
      <text x="12" y="44" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">"Roger has 5 balls. He</text>
      <text x="12" y="60" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">buys 2 cans of 3 balls."</text>
      <text x="12" y="80" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">Let's think step by step:</text>
      <text x="12" y="98" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">  2 x 3 = 6</text>
      <text x="12" y="114" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">  5 + 6 = 11</text>
      <text x="12" y="134" font-size="11" font-family="Consolas, monospace" font-weight="700" fill="#1f7a3a">Answer: 11</text>
    </g>
  </g>

  <!-- Card 2: Tree-of-Thoughts -->
  <g transform="translate(40, 350)">
    <rect x="0" y="0" width="1020" height="240" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="1020" height="36" rx="10" fill="#1f7a3a"/>
    <text x="20" y="24" font-size="15" font-weight="700" fill="#ffffff">2.  Tree-of-Thoughts (ToT)</text>
    <text x="1000" y="24" font-size="12" text-anchor="end" fill="#ecf6ee">explore branches, prune, backtrack</text>

    <g transform="translate(20, 60)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#5a4a3a">Visual signature</text>
      <g transform="translate(20, 30)">
        <!-- root -->
        <rect x="180" y="0" width="80" height="32" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
        <text x="220" y="20" font-size="12" text-anchor="middle" fill="#1a1a2e">Question</text>
        <!-- level 1: 3 branches -->
        <line x1="200" y1="32" x2="60" y2="60" stroke="#1f7a3a" stroke-width="1.2"/>
        <line x1="220" y1="32" x2="220" y2="60" stroke="#1f7a3a" stroke-width="1.2"/>
        <line x1="240" y1="32" x2="380" y2="60" stroke="#1f7a3a" stroke-width="1.2"/>
        <rect x="20" y="60" width="80" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1.2"/>
        <text x="60" y="80" font-size="11" text-anchor="middle" fill="#b3401b">A (prune)</text>
        <rect x="180" y="60" width="80" height="32" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
        <text x="220" y="80" font-size="12" text-anchor="middle" fill="#1a1a2e">B</text>
        <rect x="340" y="60" width="80" height="32" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
        <text x="380" y="80" font-size="12" text-anchor="middle" fill="#1a1a2e">C</text>
        <!-- level 2 from B and C -->
        <line x1="220" y1="92" x2="180" y2="120" stroke="#1f7a3a" stroke-width="1.2"/>
        <line x1="220" y1="92" x2="260" y2="120" stroke="#1f7a3a" stroke-width="1.2"/>
        <line x1="380" y1="92" x2="380" y2="120" stroke="#1f7a3a" stroke-width="1.2"/>
        <rect x="140" y="120" width="80" height="32" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1.2"/>
        <text x="180" y="140" font-size="11" text-anchor="middle" fill="#b3401b">B1 (prune)</text>
        <rect x="220" y="120" width="80" height="32" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
        <text x="260" y="140" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">B2 best</text>
        <rect x="340" y="120" width="80" height="32" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
        <text x="380" y="140" font-size="12" text-anchor="middle" fill="#1a1a2e">C1</text>
      </g>
    </g>

    <g transform="translate(540, 60)">
      <rect x="0" y="0" width="220" height="160" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.2"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#7a5e1a">When to use</text>
      <text x="12" y="44" font-size="12" fill="#1a1a2e">puzzles, planning, search</text>
      <text x="12" y="60" font-size="12" fill="#1a1a2e">where you can score</text>
      <text x="12" y="76" font-size="12" fill="#1a1a2e">partial states</text>
      <text x="12" y="100" font-size="12" font-weight="700" fill="#7a5e1a">Cost: 5 to 50x</text>
      <text x="12" y="120" font-size="12" font-weight="700" fill="#7a5e1a">Reliability: high</text>
      <text x="12" y="146" font-size="11" font-style="italic" fill="#5a4a3a">needs a value function.</text>
    </g>

    <g transform="translate(780, 60)">
      <rect x="0" y="0" width="220" height="160" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Example task</text>
      <text x="12" y="44" font-size="12" fill="#1a1a2e">Game of 24:</text>
      <text x="12" y="62" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">[4, 9, 10, 13] -&gt; 24</text>
      <text x="12" y="86" font-size="11" fill="#1a1a2e">Try (13-9)*(10-4)</text>
      <text x="12" y="102" font-size="11" fill="#1a1a2e">Try (10-4)*(13-9)</text>
      <text x="12" y="118" font-size="11" fill="#1a1a2e">Try 4+9+10+13 = 36 X</text>
      <text x="12" y="142" font-size="11" font-weight="700" font-family="Consolas, monospace" fill="#722f8a">Score &amp; backtrack</text>
    </g>
  </g>

  <!-- Card 3: Self-Consistency -->
  <g transform="translate(40, 610)">
    <rect x="0" y="0" width="1020" height="240" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <rect x="0" y="0" width="1020" height="36" rx="10" fill="#722f8a"/>
    <text x="20" y="24" font-size="15" font-weight="700" fill="#ffffff">3.  Self-Consistency (sample &amp; vote)</text>
    <text x="1000" y="24" font-size="12" text-anchor="end" fill="#f4ecf7">parallel CoTs, majority answer wins</text>

    <g transform="translate(20, 60)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#5a4a3a">Visual signature</text>
      <g transform="translate(0, 30)">
        <rect x="0" y="50" width="80" height="36" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
        <text x="40" y="72" font-size="12" text-anchor="middle" fill="#1a1a2e">Question</text>
        <!-- 5 parallel chains -->
        <line x1="80" y1="68" x2="120" y2="20" stroke="#722f8a" stroke-width="1.2"/>
        <line x1="80" y1="68" x2="120" y2="50" stroke="#722f8a" stroke-width="1.2"/>
        <line x1="80" y1="68" x2="120" y2="80" stroke="#722f8a" stroke-width="1.2"/>
        <line x1="80" y1="68" x2="120" y2="110" stroke="#722f8a" stroke-width="1.2"/>
        <line x1="80" y1="68" x2="120" y2="140" stroke="#722f8a" stroke-width="1.2"/>
        <rect x="120" y="6" width="120" height="28" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
        <text x="180" y="24" font-size="11" text-anchor="middle" fill="#1a1a2e">CoT sample 1 -&gt; 11</text>
        <rect x="120" y="36" width="120" height="28" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
        <text x="180" y="54" font-size="11" text-anchor="middle" fill="#1a1a2e">CoT sample 2 -&gt; 11</text>
        <rect x="120" y="66" width="120" height="28" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1.2"/>
        <text x="180" y="84" font-size="11" text-anchor="middle" fill="#b3401b">CoT sample 3 -&gt; 9</text>
        <rect x="120" y="96" width="120" height="28" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
        <text x="180" y="114" font-size="11" text-anchor="middle" fill="#1a1a2e">CoT sample 4 -&gt; 11</text>
        <rect x="120" y="126" width="120" height="28" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
        <text x="180" y="144" font-size="11" text-anchor="middle" fill="#1a1a2e">CoT sample 5 -&gt; 11</text>
        <!-- merge -->
        <line x1="240" y1="20" x2="280" y2="80" stroke="#722f8a" stroke-width="1.2"/>
        <line x1="240" y1="50" x2="280" y2="80" stroke="#722f8a" stroke-width="1.2"/>
        <line x1="240" y1="80" x2="280" y2="80" stroke="#722f8a" stroke-width="1.2"/>
        <line x1="240" y1="110" x2="280" y2="80" stroke="#722f8a" stroke-width="1.2"/>
        <line x1="240" y1="140" x2="280" y2="80" stroke="#722f8a" stroke-width="1.2"/>
        <rect x="280" y="60" width="160" height="40" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
        <text x="360" y="78" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Vote: 11 (4 of 5)</text>
        <text x="360" y="93" font-size="11" text-anchor="middle" fill="#1f7a3a">final answer</text>
      </g>
    </g>

    <g transform="translate(540, 60)">
      <rect x="0" y="0" width="220" height="160" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.2"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#7a5e1a">When to use</text>
      <text x="12" y="44" font-size="12" fill="#1a1a2e">tasks with one correct</text>
      <text x="12" y="60" font-size="12" fill="#1a1a2e">answer (math, code, QA)</text>
      <text x="12" y="84" font-size="12" font-weight="700" fill="#7a5e1a">Cost: N x baseline</text>
      <text x="12" y="100" font-size="12" font-style="italic" fill="#7a5e1a">(N = 5 to 40 typical)</text>
      <text x="12" y="124" font-size="12" font-weight="700" fill="#7a5e1a">Reliability: high</text>
      <text x="12" y="148" font-size="11" font-style="italic" fill="#5a4a3a">trivially parallel.</text>
    </g>

    <g transform="translate(780, 60)">
      <rect x="0" y="0" width="220" height="160" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#722f8a">Example</text>
      <text x="12" y="42" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">temperature = 0.7</text>
      <text x="12" y="58" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">n_samples = 40</text>
      <text x="12" y="82" font-size="11" fill="#1a1a2e">Sample 40 CoT chains,</text>
      <text x="12" y="98" font-size="11" fill="#1a1a2e">extract final integer,</text>
      <text x="12" y="114" font-size="11" fill="#1a1a2e">return mode.</text>
      <text x="12" y="138" font-size="11" font-style="italic" fill="#5a4a3a">+8-15 pts on GSM8K vs.</text>
      <text x="12" y="152" font-size="11" font-style="italic" fill="#5a4a3a">single-shot CoT.</text>
    </g>
  </g>

  <!-- Card 4: ReAct / Reflexion -->
  <g transform="translate(40, 870)">
    <rect x="0" y="0" width="1020" height="240" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <rect x="0" y="0" width="1020" height="36" rx="10" fill="#b3401b"/>
    <text x="20" y="24" font-size="15" font-weight="700" fill="#ffffff">4.  ReAct / Reflexion (act, observe, revise)</text>
    <text x="1000" y="24" font-size="12" text-anchor="end" fill="#fdeee8">interleaved thought + tool call + critique</text>

    <g transform="translate(20, 60)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#5a4a3a">Visual signature</text>
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="90" height="32" rx="4" fill="#ffffff" stroke="#b3401b" stroke-width="1.2"/>
        <text x="45" y="20" font-size="12" text-anchor="middle" fill="#1a1a2e">Thought</text>
        <line x1="90" y1="16" x2="110" y2="16" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
        <rect x="110" y="0" width="80" height="32" rx="4" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.2"/>
        <text x="150" y="20" font-size="12" text-anchor="middle" fill="#1a1a2e">Action</text>
        <line x1="190" y1="16" x2="210" y2="16" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
        <rect x="210" y="0" width="100" height="32" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/>
        <text x="260" y="20" font-size="12" text-anchor="middle" fill="#1a1a2e">Observation</text>
        <line x1="310" y1="16" x2="330" y2="16" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
        <rect x="330" y="0" width="90" height="32" rx="4" fill="#ffffff" stroke="#b3401b" stroke-width="1.2"/>
        <text x="375" y="20" font-size="12" text-anchor="middle" fill="#1a1a2e">Thought 2</text>

        <!-- loop arrow -->
        <path d="M 375 32 Q 375 70 200 70 Q 45 70 45 32" fill="none" stroke="#b3401b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
        <text x="200" y="86" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">loop until done; Reflexion adds a self-critique each cycle</text>

        <!-- final -->
        <line x1="420" y1="16" x2="450" y2="16" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
        <rect x="450" y="0" width="80" height="32" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
        <text x="490" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Answer</text>
      </g>
    </g>

    <g transform="translate(540, 60)">
      <rect x="0" y="0" width="220" height="160" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.2"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#7a5e1a">When to use</text>
      <text x="12" y="44" font-size="12" fill="#1a1a2e">tasks needing tools,</text>
      <text x="12" y="60" font-size="12" fill="#1a1a2e">live data, or multi-turn</text>
      <text x="12" y="76" font-size="12" fill="#1a1a2e">course correction</text>
      <text x="12" y="100" font-size="12" font-weight="700" fill="#7a5e1a">Cost: K iterations</text>
      <text x="12" y="120" font-size="12" font-weight="700" fill="#7a5e1a">Reliability: high</text>
      <text x="12" y="146" font-size="11" font-style="italic" fill="#5a4a3a">needs a stop condition.</text>
    </g>

    <g transform="translate(780, 60)">
      <rect x="0" y="0" width="220" height="160" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.2"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#b3401b">Example trace</text>
      <text x="12" y="42" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">Th: need stock price</text>
      <text x="12" y="58" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">Act: search("AAPL")</text>
      <text x="12" y="74" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">Obs: $189.42</text>
      <text x="12" y="90" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">Th: compute YoY return</text>
      <text x="12" y="106" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">Act: calc(189/170-1)</text>
      <text x="12" y="122" font-size="11" font-family="Consolas, monospace" fill="#1a1a2e">Obs: 0.114</text>
      <text x="12" y="142" font-size="11" font-family="Consolas, monospace" font-weight="700" fill="#1f7a3a">Final: +11.4% YoY</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 1130)">
    <rect x="0" y="0" width="1020" height="44" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="14" y="20" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="14" y="36" font-size="12" fill="#1a1a2e">Pick the architecture by problem shape: linear logic (CoT), branchy search (ToT), variance-prone single answers (Self-Consistency), or live tools (ReAct).</text>
  </g>
</svg>
