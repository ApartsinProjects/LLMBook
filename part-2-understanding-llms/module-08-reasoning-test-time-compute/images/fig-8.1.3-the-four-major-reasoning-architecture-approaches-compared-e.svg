<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <title>Four reasoning architectures compared</title>
  <rect width="1100" height="620" fill="#ffffff"/>

  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">Four reasoning architectures</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each trades cost for reliability in a different shape</text>

  <!-- Card 1: Chain-of-Thought -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="500" height="220" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#1a4078">1. Chain-of-Thought</text>
    <text x="480" y="32" font-size="11" font-style="italic" text-anchor="end" fill="#5a4a3a">single linear pass</text>

    <!-- Linear chain -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="80" height="30" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <text x="40" y="20" font-size="11" text-anchor="middle" fill="#1a1a2e">Q</text>
      <line x1="80" y1="15" x2="100" y2="15" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arrR)"/>
      <rect x="100" y="0" width="80" height="30" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <text x="140" y="20" font-size="11" text-anchor="middle" fill="#1a1a2e">Step 1</text>
      <line x1="180" y1="15" x2="200" y2="15" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arrR)"/>
      <rect x="200" y="0" width="80" height="30" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
      <text x="240" y="20" font-size="11" text-anchor="middle" fill="#1a1a2e">Step 2</text>
      <line x1="280" y1="15" x2="300" y2="15" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arrR)"/>
      <rect x="300" y="0" width="80" height="30" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="340" y="20" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">Answer</text>
    </g>

    <text x="20" y="135" font-size="12" font-weight="700" fill="#1a4078">Cost</text>
    <text x="70" y="135" font-size="12" fill="#1a1a2e">~1x</text>
    <text x="20" y="158" font-size="12" font-weight="700" fill="#1a4078">Reliability</text>
    <text x="100" y="158" font-size="12" fill="#1a1a2e">medium</text>
    <text x="20" y="186" font-size="11" font-style="italic" fill="#5a4a3a">brittle on long chains; one bad step ruins it</text>
  </g>

  <!-- Card 2: Tree-of-Thoughts -->
  <g transform="translate(560, 100)">
    <rect x="0" y="0" width="500" height="220" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#1f7a3a">2. Tree-of-Thoughts</text>
    <text x="480" y="32" font-size="11" font-style="italic" text-anchor="end" fill="#5a4a3a">branch, score, prune</text>

    <!-- Tree -->
    <g transform="translate(140, 60)">
      <rect x="80" y="0" width="60" height="24" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="110" y="16" font-size="11" text-anchor="middle" fill="#1a1a2e">Q</text>
      <line x1="100" y1="24" x2="40" y2="44" stroke="#1f7a3a" stroke-width="1.2"/>
      <line x1="110" y1="24" x2="110" y2="44" stroke="#1f7a3a" stroke-width="1.2"/>
      <line x1="120" y1="24" x2="180" y2="44" stroke="#1f7a3a" stroke-width="1.2"/>
      <rect x="10" y="44" width="60" height="24" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1.2"/>
      <text x="40" y="60" font-size="10" text-anchor="middle" fill="#b3401b">prune</text>
      <rect x="80" y="44" width="60" height="24" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="110" y="60" font-size="11" text-anchor="middle" fill="#1a1a2e">B</text>
      <rect x="150" y="44" width="60" height="24" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="180" y="60" font-size="11" text-anchor="middle" fill="#1a1a2e">C</text>
      <line x1="110" y1="68" x2="110" y2="88" stroke="#1f7a3a" stroke-width="1.2"/>
      <rect x="80" y="88" width="60" height="24" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="110" y="104" font-size="10" font-weight="700" text-anchor="middle" fill="#722f8a">best</text>
    </g>

    <text x="20" y="135" font-size="12" font-weight="700" fill="#1f7a3a">Cost</text>
    <text x="70" y="135" font-size="12" fill="#1a1a2e">5 to 50x</text>
    <text x="20" y="158" font-size="12" font-weight="700" fill="#1f7a3a">Reliability</text>
    <text x="100" y="158" font-size="12" fill="#1a1a2e">high</text>
    <text x="20" y="186" font-size="11" font-style="italic" fill="#5a4a3a">needs a value function to score partial states</text>
  </g>

  <!-- Card 3: Self-Consistency -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="500" height="220" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#722f8a">3. Self-Consistency</text>
    <text x="480" y="32" font-size="11" font-style="italic" text-anchor="end" fill="#5a4a3a">sample N, take majority</text>

    <!-- Parallel chains -->
    <g transform="translate(40, 50)">
      <rect x="0" y="32" width="60" height="24" rx="4" fill="#ffffff" stroke="#722f8a" stroke-width="1.2"/>
      <text x="30" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">Q</text>
      <line x1="60" y1="44" x2="100" y2="14" stroke="#722f8a" stroke-width="1"/>
      <line x1="60" y1="44" x2="100" y2="32" stroke="#722f8a" stroke-width="1"/>
      <line x1="60" y1="44" x2="100" y2="50" stroke="#722f8a" stroke-width="1"/>
      <line x1="60" y1="44" x2="100" y2="68" stroke="#722f8a" stroke-width="1"/>
      <line x1="60" y1="44" x2="100" y2="86" stroke="#722f8a" stroke-width="1"/>
      <text x="120" y="18" font-size="10" fill="#1a1a2e">CoT -&gt; 11</text>
      <text x="120" y="36" font-size="10" fill="#1a1a2e">CoT -&gt; 11</text>
      <text x="120" y="54" font-size="10" fill="#b3401b">CoT -&gt; 9</text>
      <text x="120" y="72" font-size="10" fill="#1a1a2e">CoT -&gt; 11</text>
      <text x="120" y="90" font-size="10" fill="#1a1a2e">CoT -&gt; 11</text>
      <line x1="190" y1="18" x2="250" y2="50" stroke="#722f8a" stroke-width="1"/>
      <line x1="190" y1="36" x2="250" y2="50" stroke="#722f8a" stroke-width="1"/>
      <line x1="190" y1="72" x2="250" y2="50" stroke="#722f8a" stroke-width="1"/>
      <line x1="190" y1="90" x2="250" y2="50" stroke="#722f8a" stroke-width="1"/>
      <rect x="250" y="38" width="100" height="24" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="300" y="54" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">Vote -&gt; 11</text>
    </g>

    <text x="20" y="180" font-size="12" font-weight="700" fill="#722f8a">Cost</text>
    <text x="70" y="180" font-size="12" fill="#1a1a2e">N x baseline (5 to 40)</text>
    <text x="280" y="180" font-size="12" font-weight="700" fill="#722f8a">Reliability</text>
    <text x="360" y="180" font-size="12" fill="#1a1a2e">high</text>
    <text x="20" y="202" font-size="11" font-style="italic" fill="#5a4a3a">trivially parallel; +8 to 15 pts on GSM8K vs single CoT</text>
  </g>

  <!-- Card 4: ReAct -->
  <g transform="translate(560, 340)">
    <rect x="0" y="0" width="500" height="220" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#b3401b">4. ReAct / Reflexion</text>
    <text x="480" y="32" font-size="11" font-style="italic" text-anchor="end" fill="#5a4a3a">think, act, observe, repeat</text>

    <!-- Loop -->
    <g transform="translate(40, 58)">
      <rect x="0" y="0" width="80" height="26" rx="4" fill="#ffffff" stroke="#b3401b" stroke-width="1.2"/>
      <text x="40" y="17" font-size="11" text-anchor="middle" fill="#1a1a2e">Thought</text>
      <line x1="80" y1="13" x2="100" y2="13" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arrR)"/>
      <rect x="100" y="0" width="80" height="26" rx="4" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.2"/>
      <text x="140" y="17" font-size="11" text-anchor="middle" fill="#1a1a2e">Action</text>
      <line x1="180" y1="13" x2="200" y2="13" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arrR)"/>
      <rect x="200" y="0" width="100" height="26" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/>
      <text x="250" y="17" font-size="11" text-anchor="middle" fill="#1a1a2e">Observation</text>
      <path d="M 300 26 Q 300 56 150 56 Q 40 56 40 26" fill="none" stroke="#b3401b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
      <text x="170" y="80" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">loop until done</text>
    </g>

    <text x="20" y="180" font-size="12" font-weight="700" fill="#b3401b">Cost</text>
    <text x="70" y="180" font-size="12" fill="#1a1a2e">K iterations</text>
    <text x="280" y="180" font-size="12" font-weight="700" fill="#b3401b">Reliability</text>
    <text x="360" y="180" font-size="12" fill="#1a1a2e">high</text>
    <text x="20" y="202" font-size="11" font-style="italic" fill="#5a4a3a">needs tools and a stop condition</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 580)">
    <rect x="0" y="0" width="1020" height="32" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">Pick by problem shape: linear logic (CoT), branchy search (ToT), variance-prone answer (Self-Consistency), live tools (ReAct)</text>
  </g>
</svg>
