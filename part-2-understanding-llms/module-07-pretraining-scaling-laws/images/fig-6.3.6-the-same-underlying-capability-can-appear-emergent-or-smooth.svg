<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The same capability looks emergent or smooth, depending on the metric</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Identical model checkpoints, two evaluation rules; one yields a sudden jump, the other a continuous improvement.</text>

  <!-- LEFT LANE: Exact Match (looks emergent) -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="580" height="430" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="290" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Metric A: Exact Match (binary)</text>
    <text x="290" y="48" font-size="12" text-anchor="middle" fill="#5a4a3a">"Did the model produce the exact target string?" yes / no</text>

    <!-- Chart area -->
    <g transform="translate(60, 70)">
      <!-- Axes -->
      <line x1="0" y1="240" x2="460" y2="240" stroke="#1a1a2e" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="240" stroke="#1a1a2e" stroke-width="1.5"/>
      <!-- Y ticks -->
      <line x1="-5" y1="240" x2="0" y2="240" stroke="#1a1a2e"/><text x="-10" y="244" font-size="11" text-anchor="end" fill="#1a1a2e">0%</text>
      <line x1="-5" y1="120" x2="0" y2="120" stroke="#1a1a2e"/><text x="-10" y="124" font-size="11" text-anchor="end" fill="#1a1a2e">50%</text>
      <line x1="-5" y1="12" x2="0" y2="12" stroke="#1a1a2e"/><text x="-10" y="16" font-size="11" text-anchor="end" fill="#1a1a2e">100%</text>
      <!-- X ticks -->
      <text x="60" y="258" font-size="11" text-anchor="middle" fill="#1a1a2e">Small</text>
      <text x="230" y="258" font-size="11" text-anchor="middle" fill="#1a1a2e">Medium</text>
      <text x="400" y="258" font-size="11" text-anchor="middle" fill="#1a1a2e">Large</text>
      <text x="230" y="278" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a2e">Model scale (log)</text>
      <text x="-44" y="120" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 -44 120)">Accuracy</text>

      <!-- Step-like curve: ~0, ~0, jump to ~95 -->
      <polyline points="60,236 145,234 230,232 315,228 360,210 380,80 400,18" fill="none" stroke="#b3401b" stroke-width="2.5"/>
      <!-- Data points -->
      <circle cx="60" cy="236" r="6" fill="#b3401b"/>
      <text x="60" y="226" font-size="11" text-anchor="middle" fill="#b3401b" font-weight="600">0%</text>
      <circle cx="230" cy="232" r="6" fill="#b3401b"/>
      <text x="230" y="222" font-size="11" text-anchor="middle" fill="#b3401b" font-weight="600">0%</text>
      <circle cx="400" cy="18" r="6" fill="#b3401b"/>
      <text x="400" y="10" font-size="11" text-anchor="middle" fill="#b3401b" font-weight="600">95%</text>

      <!-- Annotation -->
      <text x="320" y="160" font-size="11" fill="#b3401b" font-style="italic">"sudden jump"</text>
      <line x1="320" y1="155" x2="370" y2="115" stroke="#b3401b" stroke-width="1" stroke-dasharray="3 3"/>
    </g>

    <!-- Verdict pill -->
    <g transform="translate(80, 380)">
      <rect x="0" y="0" width="420" height="38" rx="6" fill="#b3401b" opacity="0.9"/>
      <text x="210" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Conclusion: capability looks EMERGENT</text>
    </g>
  </g>

  <!-- RIGHT LANE: Log-Likelihood (smooth) -->
  <g transform="translate(660, 100)">
    <rect x="0" y="0" width="580" height="430" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="290" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Metric B: Log-Likelihood (continuous)</text>
    <text x="290" y="48" font-size="12" text-anchor="middle" fill="#5a4a3a">"How much probability mass did the model place on the target?"</text>

    <g transform="translate(60, 70)">
      <line x1="0" y1="240" x2="460" y2="240" stroke="#1a1a2e" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="240" stroke="#1a1a2e" stroke-width="1.5"/>
      <line x1="-5" y1="240" x2="0" y2="240" stroke="#1a1a2e"/><text x="-10" y="244" font-size="11" text-anchor="end" fill="#1a1a2e">low</text>
      <line x1="-5" y1="120" x2="0" y2="120" stroke="#1a1a2e"/><text x="-10" y="124" font-size="11" text-anchor="end" fill="#1a1a2e">med</text>
      <line x1="-5" y1="12" x2="0" y2="12" stroke="#1a1a2e"/><text x="-10" y="16" font-size="11" text-anchor="end" fill="#1a1a2e">high</text>
      <text x="60" y="258" font-size="11" text-anchor="middle" fill="#1a1a2e">Small</text>
      <text x="230" y="258" font-size="11" text-anchor="middle" fill="#1a1a2e">Medium</text>
      <text x="400" y="258" font-size="11" text-anchor="middle" fill="#1a1a2e">Large</text>
      <text x="230" y="278" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a2e">Model scale (log)</text>
      <text x="-44" y="120" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 -44 120)">log P(target)</text>

      <!-- Smooth curve -->
      <polyline points="60,210 145,170 230,128 315,82 400,40" fill="none" stroke="#1f7a3a" stroke-width="2.5"/>
      <circle cx="60" cy="210" r="6" fill="#1f7a3a"/>
      <text x="60" y="200" font-size="11" text-anchor="middle" fill="#1f7a3a" font-weight="600">low</text>
      <circle cx="230" cy="128" r="6" fill="#1f7a3a"/>
      <text x="240" y="120" font-size="11" text-anchor="start" fill="#1f7a3a" font-weight="600">medium</text>
      <circle cx="400" cy="40" r="6" fill="#1f7a3a"/>
      <text x="400" y="30" font-size="11" text-anchor="middle" fill="#1f7a3a" font-weight="600">high</text>

      <text x="160" y="100" font-size="11" fill="#1f7a3a" font-style="italic">"steady gain"</text>
    </g>

    <g transform="translate(80, 380)">
      <rect x="0" y="0" width="420" height="38" rx="6" fill="#1f7a3a" opacity="0.9"/>
      <text x="210" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Conclusion: capability grows SMOOTHLY</text>
    </g>
  </g>

  <!-- Center bridge: same checkpoints -->
  <g transform="translate(540, 195)">
    <rect x="0" y="0" width="220" height="50" rx="25" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="110" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">SAME 3 CHECKPOINTS</text>
    <text x="110" y="40" font-size="11" text-anchor="middle" fill="#1a1a2e">evaluated two ways</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="1140" height="120" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">"Emergence" is often a property of the metric, not the model. Binary, all-or-nothing scoring (exact match, multiple-choice accuracy)</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">hides gradual progress until a threshold is crossed, then reports a sharp discontinuity. Continuous metrics (log-likelihood, BrierScore,</text>
    <text x="20" y="86" font-size="12" fill="#1a1a2e">token-level F1) reveal that the underlying capability has been improving smoothly all along.</text>
    <text x="20" y="108" font-size="12" font-weight="600" fill="#1f7a3a">Practical advice: before claiming an emergent jump, re-plot the data with a continuous metric. (Schaeffer et al., 2023)</text>
  </g>
</svg>
