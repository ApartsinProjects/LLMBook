<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Multi-token prediction: one backbone, several future tokens</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">A shared transformer feeds parallel heads that each predict a different offset into the future.</text>

  <!-- Input context strip -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="460" height="56" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="230" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">INPUT CONTEXT (tokens t-3 .. t)</text>
    <text x="230" y="44" font-size="14" text-anchor="middle" fill="#1a1a2e" font-style="italic">"The cat sat on"</text>
  </g>
  <line x1="650" y1="156" x2="650" y2="195" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Backbone -->
  <g transform="translate(370, 200)">
    <rect x="0" y="0" width="560" height="100" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="280" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">Shared Transformer Backbone</text>
    <text x="280" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">Stack of N decoder blocks, processed once per training step</text>
    <text x="280" y="74" font-size="11" text-anchor="middle" fill="#5a4a3a">Output: hidden state h_t (one vector per position)</text>
    <text x="280" y="90" font-size="11" text-anchor="middle" fill="#5a4a3a" font-style="italic">All gradient signals from every head flow back through these weights</text>
  </g>

  <!-- Three branching arrows -->
  <line x1="500" y1="300" x2="280" y2="365" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="650" y1="300" x2="650" y2="365" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="800" y1="300" x2="1020" y2="365" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Branch labels -->
  <text x="365" y="338" font-size="11" text-anchor="middle" fill="#5a4a3a">offset +1</text>
  <text x="650" y="338" font-size="11" text-anchor="middle" fill="#5a4a3a">offset +2</text>
  <text x="935" y="338" font-size="11" text-anchor="middle" fill="#5a4a3a">offset +3</text>

  <!-- Three heads -->
  <g transform="translate(140, 370)">
    <rect x="0" y="0" width="280" height="120" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="140" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Head 1: next token (t+1)</text>
    <text x="140" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">Predicts: <tspan font-weight="700">"the"</tspan></text>
    <text x="140" y="74" font-size="11" text-anchor="middle" fill="#5a4a3a">Standard LM head; unchanged from</text>
    <text x="140" y="90" font-size="11" text-anchor="middle" fill="#5a4a3a">a vanilla decoder loss.</text>
    <text x="140" y="108" font-size="11" text-anchor="middle" fill="#722f8a" font-weight="600">Loss: cross-entropy on x_{t+1}</text>
  </g>

  <g transform="translate(510, 370)">
    <rect x="0" y="0" width="280" height="120" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="140" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Head 2: token at t+2</text>
    <text x="140" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">Predicts: <tspan font-weight="700">"mat"</tspan></text>
    <text x="140" y="74" font-size="11" text-anchor="middle" fill="#5a4a3a">Looks two steps ahead; forces the</text>
    <text x="140" y="90" font-size="11" text-anchor="middle" fill="#5a4a3a">backbone to encode plan, not just</text>
    <text x="140" y="108" font-size="11" text-anchor="middle" fill="#722f8a" font-weight="600">the literal next word.</text>
  </g>

  <g transform="translate(880, 370)">
    <rect x="0" y="0" width="280" height="120" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="140" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Head 3: token at t+3</text>
    <text x="140" y="52" font-size="12" text-anchor="middle" fill="#1a1a2e">Predicts: <tspan font-weight="700">"."</tspan></text>
    <text x="140" y="74" font-size="11" text-anchor="middle" fill="#5a4a3a">Three-step horizon; sharpens long-</text>
    <text x="140" y="90" font-size="11" text-anchor="middle" fill="#5a4a3a">range structure (sentence ending,</text>
    <text x="140" y="108" font-size="11" text-anchor="middle" fill="#722f8a" font-weight="600">syntactic closure).</text>
  </g>

  <!-- Side callout: why this helps -->
  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="540" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Why add extra heads?</text>
    <text x="14" y="42" font-size="12" fill="#1a1a2e">Each head provides an additional supervision signal per token, so the</text>
    <text x="14" y="58" font-size="12" fill="#1a1a2e">backbone learns richer representations without extra forward passes,</text>
    <text x="14" y="74" font-size="12" fill="#1a1a2e">and inference can use speculative decoding from the auxiliary heads.</text>
  </g>

  <g transform="translate(680, 520)">
    <rect x="0" y="0" width="540" height="80" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Cost</text>
    <text x="14" y="42" font-size="12" fill="#1a1a2e">Heads are tiny (typically 1 linear layer over the vocabulary). The backbone</text>
    <text x="14" y="58" font-size="12" fill="#1a1a2e">dominates compute, so adding K heads adds &lt;5 percent FLOPs while giving</text>
    <text x="14" y="74" font-size="12" fill="#1a1a2e">K loss terms per position.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">One shared backbone, multiple cheap prediction heads at staggered horizons; richer learning signal per token, near-zero extra compute, and free speculative decoding at inference time.</text>
  </g>
</svg>
