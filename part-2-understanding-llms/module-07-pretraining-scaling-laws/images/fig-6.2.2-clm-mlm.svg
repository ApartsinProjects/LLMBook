<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>Causal LM vs Masked LM pretraining objectives</title>
  <rect width="1100" height="600" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Causal LM vs Masked LM</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Two ways to turn raw text into a self-supervised loss</text>

  <g transform="translate(60, 100)">
    <rect width="470" height="360" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <rect x="0" y="0" width="470" height="50" rx="10" fill="#1a4078"/>
    <text x="235" y="32" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Causal LM (GPT)</text>

    <text x="235" y="82" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">predict next token, left-to-right</text>

    <g transform="translate(40, 100)">
      <rect width="60" height="36" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="30" y="24" font-size="13" text-anchor="middle" fill="#1a1a2e">The</text>
      <rect x="70" width="60" height="36" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="100" y="24" font-size="13" text-anchor="middle" fill="#1a1a2e">cat</text>
      <rect x="140" width="60" height="36" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="170" y="24" font-size="13" text-anchor="middle" fill="#1a1a2e">sat</text>
      <rect x="210" width="60" height="36" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="240" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">?</text>
      <rect x="280" width="60" height="36" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="310" y="24" font-size="13" text-anchor="middle" fill="#888">on</text>
    </g>
    <text x="235" y="170" font-size="11" text-anchor="middle" fill="#5a4a3a">visible (left)         target         hidden (future)</text>

    <text x="40" y="208" font-size="12" font-weight="700" fill="#1a4078">- Left-only context (causal mask)</text>
    <text x="40" y="232" font-size="12" font-weight="700" fill="#1a4078">- Predicts the next token</text>
    <text x="40" y="256" font-size="12" font-weight="700" fill="#1a4078">- Dense signal at every position</text>
    <text x="40" y="280" font-size="12" font-weight="700" fill="#1a4078">- Best for: generation, chat, code</text>

    <rect x="40" y="300" width="390" height="42" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
    <text x="235" y="326" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">L = - Sigma log P(x_t | x_1...x_{t-1})</text>
  </g>

  <g transform="translate(570, 100)">
    <rect width="470" height="360" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <rect x="0" y="0" width="470" height="50" rx="10" fill="#1f7a3a"/>
    <text x="235" y="32" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Masked LM (BERT)</text>

    <text x="235" y="82" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">predict masked tokens, both sides visible</text>

    <g transform="translate(40, 100)">
      <rect width="60" height="36" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="30" y="24" font-size="13" text-anchor="middle" fill="#1a1a2e">The</text>
      <rect x="70" width="60" height="36" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="100" y="24" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">[MASK]</text>
      <rect x="140" width="60" height="36" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="170" y="24" font-size="13" text-anchor="middle" fill="#1a1a2e">sat</text>
      <rect x="210" width="60" height="36" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="240" y="24" font-size="13" text-anchor="middle" fill="#1a1a2e">on</text>
      <rect x="280" width="60" height="36" rx="4" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="310" y="24" font-size="13" text-anchor="middle" fill="#1a1a2e">mat</text>
    </g>
    <text x="235" y="170" font-size="11" text-anchor="middle" fill="#5a4a3a">all visible; only the masked slot is scored</text>

    <text x="40" y="208" font-size="12" font-weight="700" fill="#1f7a3a">- Bidirectional context (full attn)</text>
    <text x="40" y="232" font-size="12" font-weight="700" fill="#1f7a3a">- Target: ~15% masked tokens</text>
    <text x="40" y="256" font-size="12" font-weight="700" fill="#1f7a3a">- Sparser per-position signal</text>
    <text x="40" y="280" font-size="12" font-weight="700" fill="#1f7a3a">- Best for: classification, embeddings</text>

    <rect x="40" y="300" width="390" height="42" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
    <text x="235" y="326" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">L = - Sigma_{t in M} log P(x_t | x_{not M})</text>
  </g>

  <g transform="translate(60, 490)">
    <rect width="980" height="90" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#a67c1a">Key idea</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">CLM gets a training signal at every token but only sees the past, which is why it generates well.</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">MLM sees both sides and learns richer per-slot representations; that's why it dominates classification and embedding tasks.</text>
  </g>
</svg>
