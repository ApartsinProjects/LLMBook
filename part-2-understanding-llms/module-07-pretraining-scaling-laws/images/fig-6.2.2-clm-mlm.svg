<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Causal LM vs Masked LM Pretraining Objectives</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Two ways to turn raw text into a self-supervised loss; they differ in context, target, and signal density.</text>

  <!-- Two-lane layout -->
  <!-- Left lane: CLM -->
  <g transform="translate(60, 100)">
    <rect width="580" height="490" rx="12" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="290" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1a4078">Causal LM (GPT family)</text>
    <text x="290" y="56" font-size="12" text-anchor="middle" fill="#5a4a3a">Predict the next token, left-to-right</text>

    <!-- Token strip -->
    <g transform="translate(40, 90)" font-size="14">
      <rect x="0"   y="0" width="100" height="44" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="50" y="28" text-anchor="middle" fill="#1a1a2e">The</text>
      <rect x="110" y="0" width="100" height="44" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="160" y="28" text-anchor="middle" fill="#1a1a2e">cat</text>
      <rect x="220" y="0" width="100" height="44" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="270" y="28" text-anchor="middle" fill="#1a1a2e">sat</text>
      <rect x="330" y="0" width="100" height="44" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="380" y="28" text-anchor="middle" font-weight="700" fill="#1f7a3a">?</text>
      <rect x="440" y="0" width="60" height="44" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="470" y="28" text-anchor="middle" fill="#5a4a3a">on</text>
    </g>

    <text x="290" y="170" font-size="12" text-anchor="middle" fill="#5a4a3a">Visible context (left)                         Target                         Hidden (future)</text>

    <!-- Attention arrows: only left-to-right -->
    <g stroke="#1a4078" stroke-width="1.5" fill="none" opacity="0.7">
      <path d="M 90 138 Q 240 200 380 138" marker-end="url(#arr)"/>
      <path d="M 200 138 Q 290 195 380 138" marker-end="url(#arr)"/>
      <path d="M 310 138 Q 345 175 380 138" marker-end="url(#arr)"/>
    </g>

    <text x="290" y="225" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Predict: "on"</text>

    <!-- Properties -->
    <g transform="translate(30, 250)" font-size="13" fill="#1a1a2e">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="5" fill="#1a4078"/>
        <text x="26" y="14">Context: left-only (causal mask)</text>
      </g>
      <g transform="translate(0, 36)">
        <circle cx="10" cy="10" r="5" fill="#1a4078"/>
        <text x="26" y="14">Target: the next single token</text>
      </g>
      <g transform="translate(0, 72)">
        <circle cx="10" cy="10" r="5" fill="#1a4078"/>
        <text x="26" y="14">Loss applied at every position (dense signal)</text>
      </g>
      <g transform="translate(0, 108)">
        <circle cx="10" cy="10" r="5" fill="#1a4078"/>
        <text x="26" y="14">Generation: same loop, sample one token, append</text>
      </g>
      <g transform="translate(0, 144)">
        <circle cx="10" cy="10" r="5" fill="#1a4078"/>
        <text x="26" y="14">Best for: open-ended text generation, chat, code</text>
      </g>
    </g>

    <!-- Equation strip -->
    <g transform="translate(40, 425)">
      <rect width="500" height="48" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1"/>
      <text x="250" y="20" font-size="11" text-anchor="middle" fill="#5a4a3a">objective</text>
      <text x="250" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">L = -Sigma_t  log P(x_t | x_1 ... x_(t-1))</text>
    </g>
  </g>

  <!-- Right lane: MLM -->
  <g transform="translate(660, 100)">
    <rect width="580" height="490" rx="12" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="290" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Masked LM (BERT family)</text>
    <text x="290" y="56" font-size="12" text-anchor="middle" fill="#5a4a3a">Predict masked tokens using both sides of the context</text>

    <!-- Token strip -->
    <g transform="translate(40, 90)" font-size="14">
      <rect x="0"   y="0" width="100" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="50" y="28" text-anchor="middle" fill="#1a1a2e">The</text>
      <rect x="110" y="0" width="100" height="44" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="160" y="28" text-anchor="middle" font-weight="700" fill="#b3401b">[MASK]</text>
      <rect x="220" y="0" width="100" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="270" y="28" text-anchor="middle" fill="#1a1a2e">sat</text>
      <rect x="330" y="0" width="100" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="380" y="28" text-anchor="middle" fill="#1a1a2e">on</text>
      <rect x="440" y="0" width="100" height="44" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="490" y="28" text-anchor="middle" fill="#1a1a2e">the mat</text>
    </g>

    <text x="290" y="170" font-size="12" text-anchor="middle" fill="#5a4a3a">Bidirectional visible context; only the masked slot is scored</text>

    <!-- Attention arrows: bidirectional into the mask -->
    <g stroke="#1f7a3a" stroke-width="1.5" fill="none" opacity="0.7">
      <path d="M 90 138 Q 130 195 160 145" marker-end="url(#arr)"/>
      <path d="M 270 138 Q 220 195 175 145" marker-end="url(#arr)"/>
      <path d="M 380 138 Q 280 200 175 145" marker-end="url(#arr)"/>
      <path d="M 490 138 Q 340 215 175 145" marker-end="url(#arr)"/>
    </g>

    <text x="290" y="225" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">Predict: "cat"</text>

    <!-- Properties -->
    <g transform="translate(30, 250)" font-size="13" fill="#1a1a2e">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="5" fill="#1f7a3a"/>
        <text x="26" y="14">Context: bidirectional (full attention)</text>
      </g>
      <g transform="translate(0, 36)">
        <circle cx="10" cy="10" r="5" fill="#1f7a3a"/>
        <text x="26" y="14">Target: the masked tokens (typically 15%)</text>
      </g>
      <g transform="translate(0, 72)">
        <circle cx="10" cy="10" r="5" fill="#1f7a3a"/>
        <text x="26" y="14">Loss applied only at masked slots (sparser signal)</text>
      </g>
      <g transform="translate(0, 108)">
        <circle cx="10" cy="10" r="5" fill="#1f7a3a"/>
        <text x="26" y="14">Cannot directly generate fluent text token-by-token</text>
      </g>
      <g transform="translate(0, 144)">
        <circle cx="10" cy="10" r="5" fill="#1f7a3a"/>
        <text x="26" y="14">Best for: classification, embeddings, NER, retrieval</text>
      </g>
    </g>

    <g transform="translate(40, 425)">
      <rect width="500" height="48" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="250" y="20" font-size="11" text-anchor="middle" fill="#5a4a3a">objective</text>
      <text x="250" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">L = -Sigma_(t in M)  log P(x_t | x_(\M))</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 615)">
    <rect width="1180" height="62" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#7a5e1a">Key idea</text>
    <text x="20" y="44" font-size="12" fill="#1a1a2e">CLM gets a training signal at every token but only sees the past, which is why it generates well. MLM sees both sides and learns</text>
    <text x="20" y="60" font-size="12" fill="#1a1a2e">richer representations per masked slot, which is why it dominates classification and embedding benchmarks.</text>
  </g>
</svg>
