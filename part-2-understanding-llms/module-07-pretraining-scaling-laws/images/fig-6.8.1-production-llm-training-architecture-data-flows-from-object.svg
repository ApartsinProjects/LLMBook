<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Production LLM training architecture</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Data flows from object storage through the trainer; fault tolerance and async checkpointing wrap every step.</text>

  <!-- Four stage panels in a row -->
  <!-- Stage 1: Data Pipeline -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="280" height="380" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="140" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">1. Data Pipeline</text>
    <text x="140" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">Stream and mix petabyte corpora</text>

    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="240" height="80" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="120" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Object Storage</text>
      <text x="120" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">S3 / GCS / Azure Blob</text>
      <text x="120" y="60" font-size="11" text-anchor="middle" fill="#5a4a3a">Sharded shuffled tokens</text>
      <text x="120" y="74" font-size="11" text-anchor="middle" fill="#5a4a3a">(MDS / WebDataset)</text>
    </g>
    <line x1="140" y1="160" x2="140" y2="190" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="240" height="70" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="120" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Mosaic Streaming</text>
      <text x="120" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">Deterministic resumable</text>
      <text x="120" y="58" font-size="11" text-anchor="middle" fill="#5a4a3a">prefetch and decompression</text>
    </g>
    <line x1="140" y1="275" x2="140" y2="300" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <g transform="translate(20, 305)">
      <rect x="0" y="0" width="240" height="60" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="120" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Data Mixing</text>
      <text x="120" y="44" font-size="11" text-anchor="middle" fill="#1a1a2e">Domain weights, curriculum</text>
    </g>
  </g>

  <!-- Inter-panel arrow 1 -->
  <line x1="335" y1="295" x2="375" y2="295" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Stage 2: Training Framework -->
  <g transform="translate(380, 110)">
    <rect x="0" y="0" width="280" height="380" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="140" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. Training Framework</text>
    <text x="140" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">Distributed forward / backward / step</text>

    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="240" height="70" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="120" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Megatron-Core</text>
      <text x="120" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">NVIDIA training engine</text>
      <text x="120" y="58" font-size="11" text-anchor="middle" fill="#5a4a3a">Optimizer, scheduler, comm</text>
    </g>
    <line x1="140" y1="150" x2="140" y2="180" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="240" height="80" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="120" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">4-D Parallelism</text>
      <text x="120" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">TP + PP + DP + CP</text>
      <text x="120" y="60" font-size="11" text-anchor="middle" fill="#5a4a3a">Tensor, Pipeline, Data,</text>
      <text x="120" y="74" font-size="11" text-anchor="middle" fill="#5a4a3a">Context parallel groups</text>
    </g>
    <line x1="140" y1="275" x2="140" y2="300" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <g transform="translate(20, 305)">
      <rect x="0" y="0" width="240" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="120" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">FlashAttention + FP8</text>
      <text x="120" y="44" font-size="11" text-anchor="middle" fill="#1a1a2e">Kernels and low-precision math</text>
    </g>
  </g>

  <line x1="665" y1="295" x2="705" y2="295" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Stage 3: Fault Tolerance -->
  <g transform="translate(710, 110)">
    <rect x="0" y="0" width="280" height="380" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="140" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">3. Fault Tolerance</text>
    <text x="140" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">Survive node and GPU failures</text>

    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="240" height="70" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="120" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">TorchElastic</text>
      <text x="120" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">Elastic process group</text>
      <text x="120" y="58" font-size="11" text-anchor="middle" fill="#5a4a3a">Re-rendezvous on failure</text>
    </g>
    <line x1="140" y1="150" x2="140" y2="180" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="240" height="70" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="120" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">Health Monitor</text>
      <text x="120" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">XID errors, NCCL hangs,</text>
      <text x="120" y="58" font-size="11" text-anchor="middle" fill="#5a4a3a">straggler detection</text>
    </g>
    <line x1="140" y1="265" x2="140" y2="295" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <g transform="translate(20, 300)">
      <rect x="0" y="0" width="240" height="65" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
      <text x="120" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">Auto-Recovery</text>
      <text x="120" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">Quarantine bad node,</text>
      <text x="120" y="58" font-size="11" text-anchor="middle" fill="#5a4a3a">resume from last checkpoint</text>
    </g>
  </g>

  <line x1="995" y1="295" x2="1035" y2="295" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Stage 4: Checkpointing -->
  <g transform="translate(1040, 110)">
    <rect x="0" y="0" width="220" height="380" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="110" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#722f8a">4. Checkpointing</text>
    <text x="110" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">Persist state, allow re-shard</text>

    <g transform="translate(15, 70)">
      <rect x="0" y="0" width="190" height="70" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="95" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">PyTorch DCP</text>
      <text x="95" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">Distributed checkpoint</text>
      <text x="95" y="58" font-size="11" text-anchor="middle" fill="#5a4a3a">format (sharded)</text>
    </g>
    <line x1="110" y1="150" x2="110" y2="180" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <g transform="translate(15, 185)">
      <rect x="0" y="0" width="190" height="70" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="95" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Async Staging</text>
      <text x="95" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">Copy GPU -&gt; host -&gt; S3</text>
      <text x="95" y="58" font-size="11" text-anchor="middle" fill="#5a4a3a">in background</text>
    </g>
    <line x1="110" y1="265" x2="110" y2="295" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

    <g transform="translate(15, 300)">
      <rect x="0" y="0" width="190" height="65" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="95" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Reshardable</text>
      <text x="95" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">Resume on different</text>
      <text x="95" y="58" font-size="11" text-anchor="middle" fill="#5a4a3a">parallelism degree</text>
    </g>
  </g>

  <!-- Cross-cutting feedback arc: checkpoint -> trainer (recovery loop) -->
  <path d="M 1150 110 Q 1150 70 850 70 L 520 70 Q 520 90 520 108" fill="none" stroke="#722f8a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="850" y="62" font-size="11" text-anchor="middle" fill="#722f8a" font-style="italic">recover from checkpoint after a failure</text>

  <!-- Bottom takeaway -->
  <g transform="translate(50, 530)">
    <rect x="0" y="0" width="1210" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">A production training stack is four cooperating systems: a streaming data pipeline, a 4-D-parallel trainer, a fault-tolerance layer that handles inevitable</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">hardware failures, and an async checkpointer that lets training resume on a (possibly different) cluster topology with minimal lost work.</text>
  </g>

  <g transform="translate(50, 625)">
    <rect x="0" y="0" width="1210" height="70" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Why each layer matters</text>
    <text x="14" y="42" font-size="11" fill="#1a1a2e">Data: GPUs starve without high-throughput streaming.   Trainer: a single replica cannot fit a frontier model, so 4-D parallelism is required.</text>
    <text x="14" y="58" font-size="11" fill="#1a1a2e">Fault tolerance: at 10k+ GPUs, a failure occurs every few hours.   Checkpointing: synchronous saves stall the cluster, so async + reshardable is essential.</text>
  </g>
</svg>
