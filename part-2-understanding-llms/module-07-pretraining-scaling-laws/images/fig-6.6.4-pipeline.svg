<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>1F1B Pipeline Parallel Schedule</title>
  <rect width="1100" height="540" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">1F1B Pipeline Schedule</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Interleaving forward and backward shrinks the bubble</text>

  <!-- GPU labels -->
  <g font-size="13" font-weight="700" fill="#1a1a2e">
    <text x="40" y="135">GPU 0</text>
    <text x="40" y="180">GPU 1</text>
    <text x="40" y="225">GPU 2</text>
    <text x="40" y="270">GPU 3</text>
  </g>

  <text x="600" y="100" font-size="11" fill="#5a4a3a" text-anchor="middle">time -&gt;</text>

  <!-- Row backgrounds -->
  <g>
    <rect x="120" y="115" width="900" height="30" fill="#f7f7f9" stroke="#5a4a3a" stroke-width="0.5"/>
    <rect x="120" y="160" width="900" height="30" fill="#f7f7f9" stroke="#5a4a3a" stroke-width="0.5"/>
    <rect x="120" y="205" width="900" height="30" fill="#f7f7f9" stroke="#5a4a3a" stroke-width="0.5"/>
    <rect x="120" y="250" width="900" height="30" fill="#f7f7f9" stroke="#5a4a3a" stroke-width="0.5"/>
  </g>

  <!-- Cells -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <!-- GPU 0 -->
    <rect x="125" y="117" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="155" y="135" fill="#1a4078">F1</text>
    <rect x="190" y="117" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="220" y="135" fill="#1a4078">F2</text>
    <rect x="255" y="117" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="285" y="135" fill="#1a4078">F3</text>
    <rect x="320" y="117" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="350" y="135" fill="#1a4078">F4</text>
    <rect x="385" y="117" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="450" y="117" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="515" y="117" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="545" y="135" fill="#b3401b">B1</text>
    <rect x="580" y="117" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="610" y="135" fill="#b3401b">B2</text>
    <rect x="645" y="117" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="675" y="135" fill="#b3401b">B3</text>
    <rect x="710" y="117" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="740" y="135" fill="#b3401b">B4</text>
    <rect x="775" y="117" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="840" y="117" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="905" y="117" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>

    <!-- GPU 1 -->
    <rect x="125" y="162" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="190" y="162" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="220" y="180" fill="#1a4078">F1</text>
    <rect x="255" y="162" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="285" y="180" fill="#1a4078">F2</text>
    <rect x="320" y="162" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="350" y="180" fill="#1a4078">F3</text>
    <rect x="385" y="162" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="415" y="180" fill="#1a4078">F4</text>
    <rect x="450" y="162" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="515" y="162" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="580" y="162" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="610" y="180" fill="#b3401b">B1</text>
    <rect x="645" y="162" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="675" y="180" fill="#b3401b">B2</text>
    <rect x="710" y="162" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="740" y="180" fill="#b3401b">B3</text>
    <rect x="775" y="162" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="805" y="180" fill="#b3401b">B4</text>
    <rect x="840" y="162" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="905" y="162" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>

    <!-- GPU 2 -->
    <rect x="125" y="207" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="190" y="207" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="255" y="207" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="285" y="225" fill="#1a4078">F1</text>
    <rect x="320" y="207" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="350" y="225" fill="#1a4078">F2</text>
    <rect x="385" y="207" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="415" y="225" fill="#1a4078">F3</text>
    <rect x="450" y="207" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="480" y="225" fill="#1a4078">F4</text>
    <rect x="515" y="207" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="580" y="207" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="645" y="207" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="675" y="225" fill="#b3401b">B1</text>
    <rect x="710" y="207" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="740" y="225" fill="#b3401b">B2</text>
    <rect x="775" y="207" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="805" y="225" fill="#b3401b">B3</text>
    <rect x="840" y="207" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="870" y="225" fill="#b3401b">B4</text>
    <rect x="905" y="207" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>

    <!-- GPU 3 -->
    <rect x="125" y="252" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="190" y="252" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="255" y="252" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="320" y="252" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="350" y="270" fill="#1a4078">F1</text>
    <rect x="385" y="252" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="415" y="270" fill="#1a4078">F2</text>
    <rect x="450" y="252" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="480" y="270" fill="#1a4078">F3</text>
    <rect x="515" y="252" width="60" height="26" rx="2" fill="#eef4fa" stroke="#1a4078"/><text x="545" y="270" fill="#1a4078">F4</text>
    <rect x="580" y="252" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="610" y="270" fill="#b3401b">B1</text>
    <rect x="645" y="252" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="675" y="270" fill="#b3401b">B2</text>
    <rect x="710" y="252" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="740" y="270" fill="#b3401b">B3</text>
    <rect x="775" y="252" width="60" height="26" rx="2" fill="#fdeee8" stroke="#b3401b"/><text x="805" y="270" fill="#b3401b">B4</text>
    <rect x="840" y="252" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <rect x="905" y="252" width="60" height="26" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
  </g>

  <!-- Bubble brackets -->
  <g stroke="#b3401b" stroke-width="1.5" fill="none">
    <path d="M 125 290 L 125 302 L 320 302 L 320 290"/>
    <path d="M 840 290 L 840 302 L 965 302 L 965 290"/>
  </g>
  <text x="222" y="320" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">warm-up bubble</text>
  <text x="902" y="320" font-size="11" font-style="italic" text-anchor="middle" fill="#b3401b">cool-down bubble</text>

  <!-- Legend -->
  <g transform="translate(120, 340)" font-size="11">
    <rect x="0" y="0" width="18" height="14" rx="2" fill="#eef4fa" stroke="#1a4078"/>
    <text x="24" y="11" fill="#1a1a2e">F = forward</text>
    <rect x="160" y="0" width="18" height="14" rx="2" fill="#fdeee8" stroke="#b3401b"/>
    <text x="184" y="11" fill="#1a1a2e">B = backward</text>
    <rect x="330" y="0" width="18" height="14" rx="2" fill="#f0f0f0" stroke="#5a4a3a" stroke-dasharray="3 3"/>
    <text x="354" y="11" fill="#1a1a2e">idle (bubble)</text>
  </g>

  <!-- Bubble fraction callout -->
  <g transform="translate(120, 380)">
    <rect width="450" height="120" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#7a5e1a">Bubble fraction</text>
    <text x="225" y="56" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">approx (P - 1) / (K + P - 1)</text>
    <text x="20" y="82" font-size="11" fill="#1a1a2e">P = stages; K = micro-batches per step.</text>
    <text x="20" y="102" font-size="11" font-style="italic" fill="#5a4a3a">More micro-batches -&gt; smaller bubble, more activation memory.</text>
  </g>

  <g transform="translate(590, 380)">
    <rect width="430" height="120" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">How it works</text>
    <text x="20" y="50" font-size="11" fill="#1a1a2e">1. Split model by layer (4 stages here)</text>
    <text x="20" y="70" font-size="11" fill="#1a1a2e">2. Split mini-batch into K micro-batches</text>
    <text x="20" y="90" font-size="11" fill="#1a1a2e">3. Alternate 1F-1B once steady state hits</text>
    <text x="20" y="110" font-size="11" font-style="italic" fill="#5a4a3a">Sweet spot: K = 4 to 8 times P.</text>
  </g>
</svg>
