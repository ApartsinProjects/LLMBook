<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Distributed Data-Parallel (DDP) Training</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each GPU holds the full model and a slice of the batch; gradients are synchronized via all-reduce.</text>

  <!-- Step 1: Batch split -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#5a4a3a">Step 1: shard the mini-batch</text>
    <rect x="0" y="14" width="380" height="46" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="190" y="42" font-size="13" text-anchor="middle" fill="#1a1a2e">Global mini-batch (e.g. 96 samples)</text>

    <!-- arrows -->
    <line x1="80"  y1="62" x2="155" y2="115" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="190" y1="62" x2="190" y2="115" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="300" y1="62" x2="225" y2="115" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Three GPU columns -->
  <g font-size="12" fill="#1a1a2e">
    <!-- GPU 0 -->
    <g transform="translate(120, 220)">
      <rect width="280" height="280" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="140" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">GPU 0</text>

      <rect x="20" y="48" width="240" height="40" rx="5" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="140" y="73" font-size="12" text-anchor="middle">Full model replica</text>

      <rect x="20" y="100" width="240" height="36" rx="5" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <text x="140" y="123" font-size="12" text-anchor="middle">Data shard 0 (batch[0:32])</text>

      <rect x="20" y="148" width="240" height="36" rx="5" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
      <text x="140" y="171" font-size="12" text-anchor="middle">Forward, then backward pass</text>

      <rect x="20" y="196" width="240" height="64" rx="5" fill="#fff5dc" stroke="#d4b96a" stroke-width="1"/>
      <text x="140" y="218" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">Local gradient g_0</text>
      <text x="140" y="244" font-size="11" text-anchor="middle" fill="#5a4a3a">computed only from shard 0</text>
    </g>

    <!-- GPU 1 -->
    <g transform="translate(510, 220)">
      <rect width="280" height="280" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="140" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">GPU 1</text>

      <rect x="20" y="48" width="240" height="40" rx="5" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="140" y="73" font-size="12" text-anchor="middle">Full model replica</text>

      <rect x="20" y="100" width="240" height="36" rx="5" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <text x="140" y="123" font-size="12" text-anchor="middle">Data shard 1 (batch[32:64])</text>

      <rect x="20" y="148" width="240" height="36" rx="5" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
      <text x="140" y="171" font-size="12" text-anchor="middle">Forward, then backward pass</text>

      <rect x="20" y="196" width="240" height="64" rx="5" fill="#fff5dc" stroke="#d4b96a" stroke-width="1"/>
      <text x="140" y="218" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">Local gradient g_1</text>
      <text x="140" y="244" font-size="11" text-anchor="middle" fill="#5a4a3a">computed only from shard 1</text>
    </g>

    <!-- GPU 2 -->
    <g transform="translate(900, 220)">
      <rect width="280" height="280" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="140" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">GPU 2</text>

      <rect x="20" y="48" width="240" height="40" rx="5" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="140" y="73" font-size="12" text-anchor="middle">Full model replica</text>

      <rect x="20" y="100" width="240" height="36" rx="5" fill="#eef4fa" stroke="#1a4078" stroke-width="1"/>
      <text x="140" y="123" font-size="12" text-anchor="middle">Data shard 2 (batch[64:96])</text>

      <rect x="20" y="148" width="240" height="36" rx="5" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
      <text x="140" y="171" font-size="12" text-anchor="middle">Forward, then backward pass</text>

      <rect x="20" y="196" width="240" height="64" rx="5" fill="#fff5dc" stroke="#d4b96a" stroke-width="1"/>
      <text x="140" y="218" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">Local gradient g_2</text>
      <text x="140" y="244" font-size="11" text-anchor="middle" fill="#5a4a3a">computed only from shard 2</text>
    </g>
  </g>

  <!-- All-reduce arrows down to bar -->
  <g stroke="#1f7a3a" stroke-width="2" fill="none">
    <line x1="260" y1="500" x2="260" y2="555" marker-end="url(#arrGreen)"/>
    <line x1="650" y1="500" x2="650" y2="555" marker-end="url(#arrGreen)"/>
    <line x1="1040" y1="500" x2="1040" y2="555" marker-end="url(#arrGreen)"/>
  </g>

  <!-- All-reduce bar -->
  <g transform="translate(120, 560)">
    <rect width="1060" height="64" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="530" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">All-Reduce: average gradients across GPUs (NCCL ring)</text>
    <text x="530" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">g_avg = (g_0 + g_1 + g_2) / 3 -- every GPU ends up holding the same averaged gradient</text>
  </g>

  <!-- Step 3: Optimizer step -->
  <g transform="translate(120, 644)">
    <rect width="1060" height="44" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="530" y="28" font-size="13" text-anchor="middle" fill="#1a1a2e">Each GPU independently applies optimizer.step() with g_avg, so all replicas stay in sync (bit-identical weights).</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 706)">
    <rect width="1180" height="48" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="20" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="38" font-size="12" fill="#1a1a2e">DDP scales batch size, not model size. It works only when one full model fits on a single GPU; communication cost = one all-reduce of the gradient tensor per step.</text>
  </g>
</svg>
