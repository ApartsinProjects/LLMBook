<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Speculative decoding: draft gamma tokens, verify in one pass</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">A small draft model proposes several tokens; the target model checks them all in a single forward pass.</text>

  <!-- Step 1: Draft -->
  <g transform="translate(80,110)">
    <rect x="0" y="0" width="1140" height="160" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#1a4078">Step 1: Draft (fast model)</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">Generate gamma = 4 candidate tokens autoregressively. Each step is cheap because the draft model is small.</text>

    <!-- token boxes -->
    <g transform="translate(40,80)">
      <rect x="0" y="0" width="180" height="60" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="90" y="28" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a2e">"sat"</text>
      <text x="90" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">draft pos 1</text>

      <rect x="220" y="0" width="180" height="60" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="310" y="28" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a2e">"on"</text>
      <text x="310" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">draft pos 2</text>

      <rect x="440" y="0" width="180" height="60" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="530" y="28" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a2e">"the"</text>
      <text x="530" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">draft pos 3</text>

      <rect x="660" y="0" width="180" height="60" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
      <text x="750" y="28" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a2e">"mat"</text>
      <text x="750" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">draft pos 4</text>

      <text x="940" y="36" font-size="12" font-style="italic" fill="#5a4a3a">gamma = 4 drafted tokens</text>
    </g>
  </g>

  <!-- arrow down -->
  <line x1="650" y1="280" x2="650" y2="320" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="660" y="305" font-size="11" fill="#5a4a3a">send all 4 to target model in parallel</text>

  <!-- Step 2: Verify -->
  <g transform="translate(80,330)">
    <rect x="0" y="0" width="1140" height="190" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#1f7a3a">Step 2: Verify (target model, ONE forward pass)</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">The big model scores all 4 drafted tokens at once. Accept the longest prefix that matches its own distribution; reject the first mismatch.</text>

    <g transform="translate(40,80)">
      <!-- accepted -->
      <rect x="0" y="0" width="180" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="90" y="28" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a2e">"sat"</text>
      <text x="90" y="50" font-size="12" text-anchor="middle" fill="#1f7a3a" font-weight="700">ACCEPT</text>
      <text x="90" y="68" font-size="11" text-anchor="middle" fill="#5a4a3a">matches target</text>

      <rect x="220" y="0" width="180" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="310" y="28" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a2e">"on"</text>
      <text x="310" y="50" font-size="12" text-anchor="middle" fill="#1f7a3a" font-weight="700">ACCEPT</text>
      <text x="310" y="68" font-size="11" text-anchor="middle" fill="#5a4a3a">matches target</text>

      <rect x="440" y="0" width="180" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
      <text x="530" y="28" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a2e">"the"</text>
      <text x="530" y="50" font-size="12" text-anchor="middle" fill="#1f7a3a" font-weight="700">ACCEPT</text>
      <text x="530" y="68" font-size="11" text-anchor="middle" fill="#5a4a3a">matches target</text>

      <!-- rejected -->
      <rect x="660" y="0" width="180" height="80" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
      <text x="750" y="28" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a2e">"mat"</text>
      <text x="750" y="50" font-size="12" text-anchor="middle" fill="#b3401b" font-weight="700">REJECT</text>
      <text x="750" y="68" font-size="11" text-anchor="middle" fill="#5a4a3a">target prefers different token</text>

      <text x="940" y="46" font-size="12" font-style="italic" fill="#5a4a3a">3 accepted in 1 pass</text>
    </g>
  </g>

  <line x1="650" y1="525" x2="650" y2="565" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Resample -->
  <g transform="translate(80,575)">
    <rect x="0" y="0" width="1140" height="100" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#722f8a">Step 3: Resample at the rejected position</text>
    <text x="20" y="54" font-size="12" fill="#1a1a2e">Use the target model's own distribution at position 4 to sample a corrected token (e.g. "rug"). Then loop: draft the next gamma tokens.</text>
    <text x="20" y="76" font-size="12" fill="#1a1a2e">Net result: target performed 1 forward pass and produced 3 accepted + 1 corrected = 4 tokens (versus 4 sequential passes naively).</text>
  </g>

  <!-- loop arrow back to top -->
  <path d="M 1220 625 L 1260 625 L 1260 80 L 80 80 L 80 110" fill="none" stroke="#722f8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrPurple)"/>
  <text x="1240" y="350" font-size="12" font-weight="700" fill="#722f8a" transform="rotate(90 1240 350)">repeat: draft, verify, resample</text>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 695)">
    <rect x="0" y="0" width="1140" height="55" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">Speculative decoding turns sequential decoding into parallel verification: the big model still has the final say, but it does so once per gamma drafted tokens.</text>
  </g>
</svg>
