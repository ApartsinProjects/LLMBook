<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">2:4 structured sparsity: keep 2 of every 4 weights</text>
  <text x="650" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">A regular pattern that NVIDIA Sparse Tensor Cores can accelerate directly: 50% memory, ~2x throughput.</text>

  <!-- Stage 1: Dense -->
  <g transform="translate(60, 110)">
    <text x="180" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">1. Dense weight row</text>
    <text x="180" y="20" font-size="11" text-anchor="middle" fill="#5a4a3a">8 weights, grouped into two blocks of 4</text>

    <!-- Group 1: 0.3, 0.0, 0.7, 0.0 -->
    <g transform="translate(0, 40)">
      <rect x="0"   y="0" width="60" height="60" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
      <text x="30" y="36" font-size="14" text-anchor="middle" fill="#1a1a2e">0.3</text>
      <rect x="62"  y="0" width="60" height="60" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
      <text x="92" y="36" font-size="14" text-anchor="middle" fill="#1a1a2e">0.0</text>
      <rect x="124" y="0" width="60" height="60" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
      <text x="154" y="36" font-size="14" text-anchor="middle" fill="#1a1a2e">0.7</text>
      <rect x="186" y="0" width="60" height="60" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
      <text x="216" y="36" font-size="14" text-anchor="middle" fill="#1a1a2e">0.0</text>

      <!-- group bracket -->
      <path d="M0 70 L0 78 L246 78 L246 70" stroke="#1a4078" stroke-width="1.4" fill="none"/>
      <text x="123" y="96" font-size="11" text-anchor="middle" fill="#1a4078" font-weight="700">group of 4</text>

      <!-- group 2 -->
      <rect x="270" y="0" width="60" height="60" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
      <text x="300" y="36" font-size="14" text-anchor="middle" fill="#1a1a2e">0.0</text>
      <rect x="332" y="0" width="60" height="60" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
      <text x="362" y="36" font-size="14" text-anchor="middle" fill="#1a1a2e">0.5</text>
      <rect x="394" y="0" width="60" height="60" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
      <text x="424" y="36" font-size="14" text-anchor="middle" fill="#1a1a2e">0.0</text>
      <rect x="456" y="0" width="60" height="60" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
      <text x="486" y="36" font-size="14" text-anchor="middle" fill="#1a1a2e">0.9</text>
      <path d="M270 70 L270 78 L516 78 L516 70" stroke="#1a4078" stroke-width="1.4" fill="none"/>
      <text x="393" y="96" font-size="11" text-anchor="middle" fill="#1a4078" font-weight="700">group of 4</text>
    </g>
  </g>

  <!-- Arrow down to prune -->
  <line x1="650" y1="240" x2="650" y2="280" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="670" y="266" font-size="12" font-style="italic" fill="#b3401b">prune (2:4 mask)</text>

  <!-- Stage 2: Pruned + bit pattern -->
  <g transform="translate(60, 300)">
    <text x="180" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">2. Apply 2:4 mask -- keep top-2 magnitudes per group</text>

    <g transform="translate(0, 30)">
      <!-- Group 1 -->
      <rect x="0"   y="0" width="60" height="60" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="30" y="36" font-size="14" text-anchor="middle" fill="#b3401b" font-weight="700">0.3</text>
      <text x="30" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#1f7a3a">1</text>

      <rect x="62"  y="0" width="60" height="60" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.4" stroke-dasharray="4 3"/>
      <text x="92" y="36" font-size="14" text-anchor="middle" fill="#5a4a3a">0</text>
      <text x="92" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#b3401b">0</text>

      <rect x="124" y="0" width="60" height="60" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="154" y="36" font-size="14" text-anchor="middle" fill="#b3401b" font-weight="700">0.7</text>
      <text x="154" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#1f7a3a">1</text>

      <rect x="186" y="0" width="60" height="60" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.4" stroke-dasharray="4 3"/>
      <text x="216" y="36" font-size="14" text-anchor="middle" fill="#5a4a3a">0</text>
      <text x="216" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#b3401b">0</text>

      <text x="123" y="106" font-size="11" text-anchor="middle" font-weight="700" fill="#1a4078">mask: 1 0 1 0</text>

      <!-- Group 2 -->
      <rect x="270" y="0" width="60" height="60" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.4" stroke-dasharray="4 3"/>
      <text x="300" y="36" font-size="14" text-anchor="middle" fill="#5a4a3a">0</text>
      <text x="300" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#b3401b">0</text>

      <rect x="332" y="0" width="60" height="60" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="362" y="36" font-size="14" text-anchor="middle" fill="#b3401b" font-weight="700">0.5</text>
      <text x="362" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#1f7a3a">1</text>

      <rect x="394" y="0" width="60" height="60" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.4" stroke-dasharray="4 3"/>
      <text x="424" y="36" font-size="14" text-anchor="middle" fill="#5a4a3a">0</text>
      <text x="424" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#b3401b">0</text>

      <rect x="456" y="0" width="60" height="60" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="486" y="36" font-size="14" text-anchor="middle" fill="#b3401b" font-weight="700">0.9</text>
      <text x="486" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#1f7a3a">1</text>

      <text x="393" y="106" font-size="11" text-anchor="middle" font-weight="700" fill="#1a4078">mask: 0 1 0 1</text>
    </g>
  </g>

  <line x1="650" y1="450" x2="650" y2="490" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="670" y="476" font-size="12" font-style="italic" fill="#1f7a3a">compress</text>

  <!-- Stage 3: Compressed values + 2-bit indices -->
  <g transform="translate(60, 510)">
    <text x="180" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">3. Compressed: 4 values + 2-bit index per kept weight</text>

    <g transform="translate(0, 24)">
      <rect x="0"   y="0" width="60" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.8"/>
      <text x="30" y="32" font-size="14" text-anchor="middle" fill="#1f7a3a" font-weight="700">0.3</text>
      <rect x="62"  y="0" width="60" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.8"/>
      <text x="92" y="32" font-size="14" text-anchor="middle" fill="#1f7a3a" font-weight="700">0.7</text>
      <rect x="124" y="0" width="60" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.8"/>
      <text x="154" y="32" font-size="14" text-anchor="middle" fill="#1f7a3a" font-weight="700">0.5</text>
      <rect x="186" y="0" width="60" height="50" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.8"/>
      <text x="216" y="32" font-size="14" text-anchor="middle" fill="#1f7a3a" font-weight="700">0.9</text>
      <text x="123" y="72" font-size="11" text-anchor="middle" fill="#5a4a3a">values (4 floats)</text>

      <!-- indices -->
      <rect x="270" y="0" width="60" height="50" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.6"/>
      <text x="300" y="32" font-size="13" text-anchor="middle" fill="#7a5e1a" font-weight="700">00</text>
      <rect x="332" y="0" width="60" height="50" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.6"/>
      <text x="362" y="32" font-size="13" text-anchor="middle" fill="#7a5e1a" font-weight="700">10</text>
      <rect x="394" y="0" width="60" height="50" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.6"/>
      <text x="424" y="32" font-size="13" text-anchor="middle" fill="#7a5e1a" font-weight="700">01</text>
      <rect x="456" y="0" width="60" height="50" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.6"/>
      <text x="486" y="32" font-size="13" text-anchor="middle" fill="#7a5e1a" font-weight="700">11</text>
      <text x="393" y="72" font-size="11" text-anchor="middle" fill="#5a4a3a">indices (2 bits each, position within group)</text>
    </g>
  </g>

  <!-- Right side panels -->
  <g transform="translate(720, 100)">
    <rect x="0" y="0" width="520" height="160" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="14" font-weight="700" fill="#7a5e1a">The 2:4 contract</text>
    <text x="14" y="50" font-size="12" fill="#1a1a2e">In every group of 4 contiguous weights along the K dimension,</text>
    <text x="14" y="68" font-size="12" fill="#1a1a2e">exactly 2 must be zero. The mask is fixed and known to the kernel.</text>
    <text x="14" y="92" font-size="12" fill="#1a1a2e">Sparse Tensor Cores skip the zero lanes entirely; only the 2 kept</text>
    <text x="14" y="110" font-size="12" fill="#1a1a2e">weights are loaded and multiplied.</text>
    <text x="14" y="138" font-size="12" font-style="italic" fill="#7a5e1a">Unstructured 50% sparsity does NOT trigger this fast path.</text>
  </g>

  <g transform="translate(720, 290)">
    <rect x="0" y="0" width="520" height="160" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="14" font-weight="700" fill="#1f7a3a">What you get on Ampere/Hopper</text>
    <text x="14" y="50" font-size="12" fill="#1a1a2e">Memory:    50% of dense (only 2 of 4 weights stored)</text>
    <text x="14" y="68" font-size="12" fill="#1a1a2e">Bandwidth: 50% of dense (half the bytes loaded per matmul)</text>
    <text x="14" y="86" font-size="12" fill="#1a1a2e">Compute:   ~2x throughput on Sparse Tensor Cores</text>
    <text x="14" y="110" font-size="12" fill="#1a1a2e">Index overhead: 2 bits per kept weight (negligible).</text>
    <text x="14" y="138" font-size="12" font-style="italic" fill="#1f7a3a">Accuracy loss is typically &lt; 1 perplexity point after fine-tuning.</text>
  </g>

  <g transform="translate(720, 480)">
    <rect x="0" y="0" width="520" height="120" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="14" font-weight="700" fill="#722f8a">Why this pattern, not 1:4 or 3:8?</text>
    <text x="14" y="50" font-size="12" fill="#1a1a2e">2:4 hits a sweet spot: enough density for accuracy, enough</text>
    <text x="14" y="68" font-size="12" fill="#1a1a2e">sparsity to halve bandwidth, and small enough indexing (2 bits)</text>
    <text x="14" y="86" font-size="12" fill="#1a1a2e">to fit cleanly in the Tensor Core MMA instruction.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 660)">
    <rect x="0" y="0" width="1140" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">2:4 sparsity is hardware-friendly because the zero positions are predictable: the GPU can pre-bake a fast path that</text>
    <text x="20" y="64" font-size="12" fill="#1a1a2e">skips half the multiplies. Random 50% sparsity offers no such speedup, only memory savings.</text>
  </g>
</svg>
