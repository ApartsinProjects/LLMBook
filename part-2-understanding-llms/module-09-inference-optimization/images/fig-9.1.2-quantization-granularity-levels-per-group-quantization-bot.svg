<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Quantization granularity, from coarse to fine</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">More scales per matrix means better accuracy at the cost of a few extra bytes per weight.</text>

  <!-- Three panels side-by-side -->
  <!-- Panel 1: Per-Tensor -->
  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="380" height="440" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="44" rx="10" fill="#b3401b"/>
    <text x="190" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Per-Tensor</text>
    <text x="190" y="68" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">1 scale for the entire matrix</text>

    <!-- Matrix grid 8x8, single tint -->
    <g transform="translate(75, 100)">
      <rect x="-4" y="-4" width="248" height="248" fill="#b3401b" opacity="0.25" stroke="#b3401b" stroke-width="2"/>
      <g stroke="#ffffff" stroke-width="1">
        <!-- 8x8 cells of width 30 -->
        <g fill="#f4a583">
          <rect x="0" y="0" width="240" height="240"/>
        </g>
        <!-- vertical lines -->
        <line x1="30" y1="0" x2="30" y2="240"/><line x1="60" y1="0" x2="60" y2="240"/>
        <line x1="90" y1="0" x2="90" y2="240"/><line x1="120" y1="0" x2="120" y2="240"/>
        <line x1="150" y1="0" x2="150" y2="240"/><line x1="180" y1="0" x2="180" y2="240"/>
        <line x1="210" y1="0" x2="210" y2="240"/>
        <line y1="30" x1="0" y2="30" x2="240"/><line y1="60" x1="0" y2="60" x2="240"/>
        <line y1="90" x1="0" y2="90" x2="240"/><line y1="120" x1="0" y2="120" x2="240"/>
        <line y1="150" x1="0" y2="150" x2="240"/><line y1="180" x1="0" y2="180" x2="240"/>
        <line y1="210" x1="0" y2="210" x2="240"/>
      </g>
      <text x="120" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">scale = s</text>
    </g>

    <text x="190" y="380" font-size="12" text-anchor="middle" fill="#1a1a2e" font-weight="700">Cheapest, lowest accuracy</text>
    <text x="190" y="400" font-size="11" text-anchor="middle" fill="#5a4a3a">One outlier weight blows up s,</text>
    <text x="190" y="416" font-size="11" text-anchor="middle" fill="#5a4a3a">crushing precision everywhere.</text>
  </g>

  <!-- Panel 2: Per-Channel -->
  <g transform="translate(460, 110)">
    <rect x="0" y="0" width="380" height="440" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="44" rx="10" fill="#7a5e1a"/>
    <text x="190" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Per-Channel</text>
    <text x="190" y="68" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">1 scale per row (output channel)</text>

    <g transform="translate(75, 100)">
      <rect x="-4" y="-4" width="248" height="248" fill="#7a5e1a" opacity="0.15" stroke="#7a5e1a" stroke-width="2"/>
      <!-- 8 rows, each different tint -->
      <g>
        <rect x="0" y="0"   width="240" height="30" fill="#fde2b0"/>
        <rect x="0" y="30"  width="240" height="30" fill="#f7c884"/>
        <rect x="0" y="60"  width="240" height="30" fill="#f0b266"/>
        <rect x="0" y="90"  width="240" height="30" fill="#e89a4a"/>
        <rect x="0" y="120" width="240" height="30" fill="#dc8232"/>
        <rect x="0" y="150" width="240" height="30" fill="#c46b25"/>
        <rect x="0" y="180" width="240" height="30" fill="#a85a20"/>
        <rect x="0" y="210" width="240" height="30" fill="#8a4a1a"/>
      </g>
      <g stroke="#ffffff" stroke-width="1">
        <line y1="30" x1="0" y2="30" x2="240"/><line y1="60" x1="0" y2="60" x2="240"/>
        <line y1="90" x1="0" y2="90" x2="240"/><line y1="120" x1="0" y2="120" x2="240"/>
        <line y1="150" x1="0" y2="150" x2="240"/><line y1="180" x1="0" y2="180" x2="240"/>
        <line y1="210" x1="0" y2="210" x2="240"/>
      </g>
      <!-- s_i labels on right -->
      <text x="252" y="20" font-size="11" fill="#1a1a2e">s1</text>
      <text x="252" y="50" font-size="11" fill="#1a1a2e">s2</text>
      <text x="252" y="80" font-size="11" fill="#1a1a2e">s3</text>
      <text x="252" y="110" font-size="11" fill="#1a1a2e">s4</text>
      <text x="252" y="140" font-size="11" fill="#1a1a2e">s5</text>
      <text x="252" y="170" font-size="11" fill="#1a1a2e">s6</text>
      <text x="252" y="200" font-size="11" fill="#1a1a2e">s7</text>
      <text x="252" y="230" font-size="11" fill="#1a1a2e">s8</text>
    </g>

    <text x="190" y="380" font-size="12" text-anchor="middle" fill="#1a1a2e" font-weight="700">Standard for INT8 inference</text>
    <text x="190" y="400" font-size="11" text-anchor="middle" fill="#5a4a3a">Outliers are isolated to one row,</text>
    <text x="190" y="416" font-size="11" text-anchor="middle" fill="#5a4a3a">protecting all the others.</text>
  </g>

  <!-- Panel 3: Per-Group -->
  <g transform="translate(850, 110)">
    <rect x="0" y="0" width="380" height="440" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="44" rx="10" fill="#1f7a3a"/>
    <text x="190" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Per-Group (g = 128)</text>
    <text x="190" y="68" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">1 scale + 1 zero-point per 128 values</text>

    <g transform="translate(75, 100)">
      <rect x="-4" y="-4" width="248" height="248" fill="#1f7a3a" opacity="0.15" stroke="#1f7a3a" stroke-width="2"/>
      <!-- 8 rows x 4 column-groups, each cell its own tint -->
      <g>
        <!-- generate 32 cells with assorted greens -->
        <rect x="0"   y="0"   width="60" height="30" fill="#d4eed7"/>
        <rect x="60"  y="0"   width="60" height="30" fill="#b6e0bb"/>
        <rect x="120" y="0"   width="60" height="30" fill="#92cf99"/>
        <rect x="180" y="0"   width="60" height="30" fill="#6fb978"/>

        <rect x="0"   y="30"  width="60" height="30" fill="#a8d6ad"/>
        <rect x="60"  y="30"  width="60" height="30" fill="#7ec486"/>
        <rect x="120" y="30"  width="60" height="30" fill="#5db069"/>
        <rect x="180" y="30"  width="60" height="30" fill="#3f9b4d"/>

        <rect x="0"   y="60"  width="60" height="30" fill="#c8e6cb"/>
        <rect x="60"  y="60"  width="60" height="30" fill="#9cd2a3"/>
        <rect x="120" y="60"  width="60" height="30" fill="#74bd7e"/>
        <rect x="180" y="60"  width="60" height="30" fill="#509f5d"/>

        <rect x="0"   y="90"  width="60" height="30" fill="#b9deb9"/>
        <rect x="60"  y="90"  width="60" height="30" fill="#88c993"/>
        <rect x="120" y="90"  width="60" height="30" fill="#5ab068"/>
        <rect x="180" y="90"  width="60" height="30" fill="#379447"/>

        <rect x="0"   y="120" width="60" height="30" fill="#d8eedb"/>
        <rect x="60"  y="120" width="60" height="30" fill="#a4d4ab"/>
        <rect x="120" y="120" width="60" height="30" fill="#75b780"/>
        <rect x="180" y="120" width="60" height="30" fill="#4a9956"/>

        <rect x="0"   y="150" width="60" height="30" fill="#c3e3c8"/>
        <rect x="60"  y="150" width="60" height="30" fill="#92cb9b"/>
        <rect x="120" y="150" width="60" height="30" fill="#65b272"/>
        <rect x="180" y="150" width="60" height="30" fill="#3d934c"/>

        <rect x="0"   y="180" width="60" height="30" fill="#d0e8d3"/>
        <rect x="60"  y="180" width="60" height="30" fill="#9cd0a3"/>
        <rect x="120" y="180" width="60" height="30" fill="#6fb87a"/>
        <rect x="180" y="180" width="60" height="30" fill="#469b53"/>

        <rect x="0"   y="210" width="60" height="30" fill="#bedebf"/>
        <rect x="60"  y="210" width="60" height="30" fill="#8cc796"/>
        <rect x="120" y="210" width="60" height="30" fill="#5fae6c"/>
        <rect x="180" y="210" width="60" height="30" fill="#388f47"/>
      </g>
      <g stroke="#ffffff" stroke-width="1">
        <line x1="60" y1="0" x2="60" y2="240"/><line x1="120" y1="0" x2="120" y2="240"/>
        <line x1="180" y1="0" x2="180" y2="240"/>
        <line y1="30" x1="0" y2="30" x2="240"/><line y1="60" x1="0" y2="60" x2="240"/>
        <line y1="90" x1="0" y2="90" x2="240"/><line y1="120" x1="0" y2="120" x2="240"/>
        <line y1="150" x1="0" y2="150" x2="240"/><line y1="180" x1="0" y2="180" x2="240"/>
        <line y1="210" x1="0" y2="210" x2="240"/>
      </g>
      <!-- group label -->
      <rect x="0" y="0" width="60" height="30" fill="none" stroke="#1a1a2e" stroke-width="2"/>
      <text x="30" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e" font-weight="700">group</text>
    </g>

    <text x="190" y="380" font-size="12" text-anchor="middle" fill="#1a1a2e" font-weight="700">Best accuracy for 4-bit (GPTQ, AWQ)</text>
    <text x="190" y="400" font-size="11" text-anchor="middle" fill="#5a4a3a">Each 128-value strip gets its own</text>
    <text x="190" y="416" font-size="11" text-anchor="middle" fill="#5a4a3a">scale + zero-point: ~0.5 bits overhead.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="1180" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Granularity is the dial that trades a few bytes of metadata for accuracy. Per-tensor is fragile, per-channel is the INT8 default,</text>
    <text x="20" y="62" font-size="12" fill="#1a1a2e">and per-group (g=128) is what makes 4-bit weight quantization actually usable in modern LLMs.</text>
  </g>
</svg>
