<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">GPTQ vs AWQ: two paths to 4-bit weight quantization</text>
  <text x="650" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Both produce INT4 weights; they differ in what information they use to decide how to round.</text>

  <!-- GPTQ lane -->
  <g transform="translate(70, 100)">
    <rect x="0" y="0" width="560" height="470" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="560" height="44" rx="10" fill="#1a4078"/>
    <text x="280" y="29" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">GPTQ</text>
    <text x="280" y="68" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Hessian-aware, error-compensating quantization</text>

    <!-- Mechanism box -->
    <rect x="20" y="86" width="520" height="118" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
    <text x="36" y="108" font-size="13" font-weight="700" fill="#1a4078">How it rounds</text>
    <text x="36" y="130" font-size="12" fill="#1a1a2e">Walks the weight matrix column by column, left to right.</text>
    <text x="36" y="150" font-size="12" fill="#1a1a2e">When column j is rounded, the residual error is propagated</text>
    <text x="36" y="168" font-size="12" fill="#1a1a2e">to columns j+1..n using the inverse Hessian, so later columns</text>
    <text x="36" y="186" font-size="12" fill="#1a1a2e">absorb the rounding loss of earlier ones.</text>

    <!-- Mini matrix -->
    <g transform="translate(40, 220)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1a4078">Column-by-column sweep</text>
      <g transform="translate(0, 14)">
        <rect x="0" y="0" width="40" height="40" fill="#1f7a3a" opacity="0.85"/>
        <rect x="42" y="0" width="40" height="40" fill="#cfe3d4"/>
        <rect x="84" y="0" width="40" height="40" fill="#cfe3d4"/>
        <rect x="126" y="0" width="40" height="40" fill="#cfe3d4"/>
        <rect x="168" y="0" width="40" height="40" fill="#cfe3d4"/>
        <text x="20" y="25" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">done</text>
        <text x="62" y="25" font-size="11" text-anchor="middle" fill="#1a1a2e">+e</text>
        <text x="104" y="25" font-size="11" text-anchor="middle" fill="#1a1a2e">+e</text>
        <text x="146" y="25" font-size="11" text-anchor="middle" fill="#1a1a2e">+e</text>
        <text x="188" y="25" font-size="11" text-anchor="middle" fill="#1a1a2e">+e</text>
        <text x="0" y="60" font-size="11" fill="#5a4a3a">round col 0; push error e into cols 1..4 (weighted by H^-1)</text>
      </g>
    </g>

    <!-- Properties -->
    <g transform="translate(20, 320)">
      <rect x="0" y="0" width="252" height="60" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.2"/>
      <text x="12" y="22" font-size="12" font-weight="700" fill="#722f8a">Calibration</text>
      <text x="12" y="42" font-size="12" fill="#1a1a2e">~128 samples, H = X^T X</text>
      <rect x="266" y="0" width="254" height="60" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.2"/>
      <text x="278" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Cost</text>
      <text x="278" y="42" font-size="12" fill="#1a1a2e">slow (minutes-hours per layer)</text>
      <rect x="0" y="70" width="520" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="12" y="92" font-size="12" font-weight="700" fill="#1f7a3a">Strength</text>
      <text x="12" y="112" font-size="12" fill="#1a1a2e">Lowest perplexity at 4-bit; gold standard for accuracy.</text>
    </g>
  </g>

  <!-- AWQ lane -->
  <g transform="translate(670, 100)">
    <rect x="0" y="0" width="560" height="470" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="560" height="44" rx="10" fill="#1f7a3a"/>
    <text x="280" y="29" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">AWQ</text>
    <text x="280" y="68" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Activation-aware channel scaling</text>

    <rect x="20" y="86" width="520" height="118" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.2"/>
    <text x="36" y="108" font-size="13" font-weight="700" fill="#1f7a3a">How it rounds</text>
    <text x="36" y="130" font-size="12" fill="#1a1a2e">Inspects activations to find channels with the largest magnitude.</text>
    <text x="36" y="150" font-size="12" fill="#1a1a2e">Pre-multiplies those salient channels by a scaling factor s,</text>
    <text x="36" y="168" font-size="12" fill="#1a1a2e">then rounds. The inverse 1/s is folded into the next layer,</text>
    <text x="36" y="186" font-size="12" fill="#1a1a2e">so important channels survive INT4 with minimal damage.</text>

    <!-- Channel grid -->
    <g transform="translate(40, 220)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1f7a3a">Channel-wise scaling (salient channels protected)</text>
      <g transform="translate(0, 14)">
        <rect x="0" y="0" width="40" height="40" fill="#cfe3d4"/>
        <rect x="42" y="0" width="40" height="40" fill="#1f7a3a" opacity="0.9"/>
        <rect x="84" y="0" width="40" height="40" fill="#cfe3d4"/>
        <rect x="126" y="0" width="40" height="40" fill="#1f7a3a" opacity="0.9"/>
        <rect x="168" y="0" width="40" height="40" fill="#cfe3d4"/>
        <text x="20" y="25" font-size="11" text-anchor="middle" fill="#1a1a2e">x1</text>
        <text x="62" y="25" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">x s</text>
        <text x="104" y="25" font-size="11" text-anchor="middle" fill="#1a1a2e">x1</text>
        <text x="146" y="25" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">x s</text>
        <text x="188" y="25" font-size="11" text-anchor="middle" fill="#1a1a2e">x1</text>
        <text x="0" y="60" font-size="11" fill="#5a4a3a">scale up salient channels before rounding; fold 1/s into next layer</text>
      </g>
    </g>

    <g transform="translate(20, 320)">
      <rect x="0" y="0" width="252" height="60" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.2"/>
      <text x="12" y="22" font-size="12" font-weight="700" fill="#722f8a">Calibration</text>
      <text x="12" y="42" font-size="12" fill="#1a1a2e">tiny set; no retraining needed</text>
      <rect x="266" y="0" width="254" height="60" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.2"/>
      <text x="278" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Cost</text>
      <text x="278" y="42" font-size="12" fill="#1a1a2e">fast (seconds per layer)</text>
      <rect x="0" y="70" width="520" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.2"/>
      <text x="12" y="92" font-size="12" font-weight="700" fill="#1f7a3a">Strength</text>
      <text x="12" y="112" font-size="12" fill="#1a1a2e">Best speed/quality tradeoff; near-GPTQ accuracy at much lower cost.</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">GPTQ corrects rounding error column by column using the Hessian; AWQ avoids it up front by scaling the channels that activations care about most.</text>
  </g>
</svg>
