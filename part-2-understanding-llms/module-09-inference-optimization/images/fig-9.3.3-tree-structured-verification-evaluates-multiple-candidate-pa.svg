<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <title>Tree-structured speculative verification</title>
  <rect width="1100" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Tree-structured speculative verification</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Target model verifies many branches in one forward pass</text>

  <g transform="translate(40, 220)">
    <rect width="170" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="85" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Context</text>
    <text x="85" y="50" font-size="13" text-anchor="middle" fill="#1a1a2e">"the"</text>
  </g>

  <g transform="translate(280, 130)">
    <rect width="100" height="50" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="50" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">"a"</text>
    <text x="50" y="40" font-size="10" text-anchor="middle" fill="#5a4a3a">accepted</text>
  </g>
  <g transform="translate(280, 240)">
    <rect width="100" height="50" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="50" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">"his"</text>
    <text x="50" y="40" font-size="10" text-anchor="middle" fill="#5a4a3a">rejected</text>
  </g>

  <g transform="translate(440, 80)">
    <rect width="100" height="50" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="50" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">"cat"</text>
    <text x="50" y="40" font-size="10" text-anchor="middle" fill="#5a4a3a">accepted</text>
  </g>
  <g transform="translate(440, 170)">
    <rect width="100" height="50" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="50" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">"dog"</text>
    <text x="50" y="40" font-size="10" text-anchor="middle" fill="#5a4a3a">rejected</text>
  </g>

  <g transform="translate(600, 80)">
    <rect width="100" height="50" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="50" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">"sat"</text>
    <text x="50" y="40" font-size="10" text-anchor="middle" fill="#5a4a3a">accepted</text>
  </g>

  <line x1="210" y1="250" x2="278" y2="155" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="210" y1="250" x2="278" y2="265" stroke="#b3401b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <line x1="380" y1="155" x2="438" y2="105" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="380" y1="155" x2="438" y2="195" stroke="#b3401b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <line x1="540" y1="105" x2="598" y2="105" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrG)"/>

  <g transform="translate(770, 130)">
    <rect width="280" height="160" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="140" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Accepted path</text>
    <text x="140" y="62" font-size="13" text-anchor="middle" fill="#1a1a2e">"the" -&gt; "a" -&gt; "cat" -&gt; "sat"</text>
    <text x="140" y="100" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">3 new tokens</text>
    <text x="140" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">1 forward pass</text>
    <text x="140" y="142" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">vs 3 sequential decodes</text>
  </g>

  <g transform="translate(60, 340)">
    <rect width="470" height="150" rx="8" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#a67c1a">How it works</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">1. Draft model proposes a tree of likely continuations,</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">    branching where it is uncertain.</text>
    <text x="20" y="92" font-size="12" fill="#1a1a2e">2. Target scores every node in one batched forward pass</text>
    <text x="20" y="110" font-size="12" fill="#1a1a2e">    using a tree-shaped attention mask.</text>
    <text x="20" y="132" font-size="12" fill="#1a1a2e">3. Longest valid path is committed; bad branches dropped.</text>
  </g>

  <g transform="translate(560, 340)">
    <rect width="490" height="150" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#722f8a">Why a tree beats a chain</text>
    <text x="20" y="52" font-size="12" fill="#1a1a2e">A linear speculation accepts up to k tokens only if</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">every guess is correct. One bad guess kills the rest.</text>
    <text x="20" y="92" font-size="12" fill="#1a1a2e">Trees hedge: 2-3 sibling proposals per uncertain slot.</text>
    <text x="20" y="110" font-size="12" fill="#1a1a2e">All branches share one forward pass, so cost stays close</text>
    <text x="20" y="128" font-size="12" fill="#1a1a2e">to a single decode while accept-length rises.</text>
  </g>

  <g transform="translate(60, 510)">
    <rect width="990" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">Verifying a tree of candidates in one forward pass amortizes the target's cost across many tentative tokens.</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">The accepted path is the same one the target would have produced sequentially, so output quality is unchanged.</text>
  </g>
</svg>
