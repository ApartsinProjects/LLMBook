<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Explanation Methods: Faithfulness vs Compute Cost</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Approximate positioning on a 2D plane; up-and-right is more faithful but more expensive. Pick the cheapest method on the frontier for your budget.</text>

  <!-- Plot area -->
  <!-- chart bounds: x 140..980, y 110..620 -->
  <g>
    <!-- background -->
    <rect x="140" y="110" width="840" height="510" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>

    <!-- gridlines -->
    <g stroke="#e5e5e5" stroke-width="1">
      <line x1="140" y1="212" x2="980" y2="212"/>
      <line x1="140" y1="314" x2="980" y2="314"/>
      <line x1="140" y1="416" x2="980" y2="416"/>
      <line x1="140" y1="518" x2="980" y2="518"/>
      <line x1="308" y1="110" x2="308" y2="620"/>
      <line x1="476" y1="110" x2="476" y2="620"/>
      <line x1="644" y1="110" x2="644" y2="620"/>
      <line x1="812" y1="110" x2="812" y2="620"/>
    </g>

    <!-- Axes -->
    <line x1="140" y1="620" x2="980" y2="620" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="140" y1="110" x2="140" y2="620" stroke="#1a1a2e" stroke-width="1.5"/>

    <!-- X axis label and ticks -->
    <text x="560" y="670" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Compute cost per explanation  →</text>
    <text x="170" y="640" font-size="11" text-anchor="middle" fill="#5a4a3a">cheap (1× fwd)</text>
    <text x="476" y="640" font-size="11" text-anchor="middle" fill="#5a4a3a">moderate (10–50×)</text>
    <text x="812" y="640" font-size="11" text-anchor="middle" fill="#5a4a3a">expensive (100s–1000s×)</text>

    <!-- Y axis label -->
    <text transform="translate(95, 365) rotate(-90)" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Faithfulness  →</text>
    <text x="125" y="615" font-size="11" text-anchor="end" fill="#5a4a3a">low</text>
    <text x="125" y="416" font-size="11" text-anchor="end" fill="#5a4a3a">med</text>
    <text x="125" y="212" font-size="11" text-anchor="end" fill="#5a4a3a">high</text>

    <!-- Pareto frontier (curve from low-cheap to high-expensive) -->
    <path d="M 195 555 C 350 510 480 360 720 230 S 920 175 950 165" stroke="#1f7a3a" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
    <text x="780" y="195" font-size="11" font-style="italic" fill="#1f7a3a">Pareto frontier</text>

    <!-- Quadrant tint: top-right "preferred" -->
    <rect x="644" y="110" width="336" height="200" fill="#ecf6ee" opacity="0.35"/>
    <text x="965" y="130" font-size="11" text-anchor="end" fill="#1f7a3a" font-style="italic">faithful but slow</text>

    <!-- bottom-left "fast and loose" -->
    <rect x="140" y="450" width="336" height="170" fill="#fdeee8" opacity="0.35"/>
    <text x="160" y="600" font-size="11" fill="#b3401b" font-style="italic">fast but unreliable</text>

    <!-- Method points -->
    <!-- Raw Attention: cheap, low faithfulness -->
    <g>
      <circle cx="195" cy="555" r="12" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="195" y="559" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">RA</text>
      <text x="215" y="555" font-size="12" font-weight="700" fill="#1a1a2e">Raw Attention</text>
      <text x="215" y="572" font-size="11" fill="#5a4a3a">just read off attention weights</text>
    </g>

    <!-- Rollout -->
    <g>
      <circle cx="280" cy="490" r="12" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="280" y="494" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">RO</text>
      <text x="300" y="490" font-size="12" font-weight="700" fill="#1a1a2e">Attention Rollout</text>
      <text x="300" y="507" font-size="11" fill="#5a4a3a">multiply attention across layers</text>
    </g>

    <!-- Grad x Attn -->
    <g>
      <circle cx="430" cy="410" r="12" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
      <text x="430" y="414" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">G×A</text>
      <text x="450" y="410" font-size="12" font-weight="700" fill="#1a1a2e">Gradient × Attention</text>
      <text x="450" y="427" font-size="11" fill="#5a4a3a">single backward pass</text>
    </g>

    <!-- IG -->
    <g>
      <circle cx="600" cy="320" r="12" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
      <text x="600" y="324" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">IG</text>
      <text x="620" y="320" font-size="12" font-weight="700" fill="#1a1a2e">Integrated Gradients</text>
      <text x="620" y="337" font-size="11" fill="#5a4a3a">~ 20–50 backward passes</text>
    </g>

    <!-- LRP -->
    <g>
      <circle cx="720" cy="248" r="12" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="720" y="252" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">LRP</text>
      <text x="740" y="245" font-size="12" font-weight="700" fill="#1a1a2e">Layer-wise Relevance</text>
      <text x="740" y="262" font-size="11" fill="#5a4a3a">custom backward rules</text>
    </g>

    <!-- SHAP -->
    <g>
      <circle cx="900" cy="170" r="14" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
      <text x="900" y="174" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">SHAP</text>
      <text x="780" y="155" font-size="12" font-weight="700" text-anchor="end" fill="#1a1a2e">Perturbation / SHAP</text>
      <text x="780" y="172" font-size="11" text-anchor="end" fill="#5a4a3a">100s–1000s of forward passes</text>
    </g>

    <!-- Caret arrow showing direction "more faithful + more expensive" -->
    <path d="M 200 595 L 950 130" stroke="#1a1a2e" stroke-width="0.6" stroke-dasharray="2 4" fill="none" opacity="0.5"/>

  </g>

  <!-- Right-side legend / decision callout -->
  <g transform="translate(1010, 110)">
    <rect x="0" y="0" width="270" height="510" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="135" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5e1a">How to choose</text>

    <text x="15" y="60" font-size="12" font-weight="700" fill="#1a1a2e">By budget</text>
    <text x="15" y="80" font-size="11" fill="#1a1a2e">- Real-time UI →</text>
    <text x="15" y="95" font-size="11" fill="#1a1a2e">  RA, Rollout, G×A</text>
    <text x="15" y="115" font-size="11" fill="#1a1a2e">- Offline analysis →</text>
    <text x="15" y="130" font-size="11" fill="#1a1a2e">  IG, LRP</text>
    <text x="15" y="150" font-size="11" fill="#1a1a2e">- Audit / paper →</text>
    <text x="15" y="165" font-size="11" fill="#1a1a2e">  SHAP, perturbation</text>

    <line x1="15" y1="185" x2="255" y2="185" stroke="#d4b96a" stroke-width="1"/>

    <text x="15" y="208" font-size="12" font-weight="700" fill="#1a1a2e">Color = method family</text>
    <g transform="translate(15, 220)">
      <circle cx="10" cy="14" r="7" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="25" y="18" font-size="11" fill="#1a1a2e">attention-only</text>
      <circle cx="10" cy="36" r="7" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="25" y="40" font-size="11" fill="#1a1a2e">gradient-based</text>
      <circle cx="10" cy="58" r="7" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="25" y="62" font-size="11" fill="#1a1a2e">propagation rules</text>
      <circle cx="10" cy="80" r="7" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="25" y="84" font-size="11" fill="#1a1a2e">perturbation / sampling</text>
    </g>

    <line x1="15" y1="320" x2="255" y2="320" stroke="#d4b96a" stroke-width="1"/>

    <text x="15" y="343" font-size="12" font-weight="700" fill="#1a1a2e">Caveats</text>
    <text x="15" y="362" font-size="11" fill="#1a1a2e">- Positions are approximate;</text>
    <text x="15" y="377" font-size="11" fill="#1a1a2e">  exact values depend on the</text>
    <text x="15" y="392" font-size="11" fill="#1a1a2e">  task and faithfulness metric.</text>
    <text x="15" y="412" font-size="11" fill="#1a1a2e">- Raw attention often fails</text>
    <text x="15" y="427" font-size="11" fill="#1a1a2e">  faithfulness checks, even</text>
    <text x="15" y="442" font-size="11" fill="#1a1a2e">  when it "looks plausible".</text>
    <text x="15" y="462" font-size="11" fill="#1a1a2e">- SHAP cost grows with the</text>
    <text x="15" y="477" font-size="11" fill="#1a1a2e">  number of features being</text>
    <text x="15" y="492" font-size="11" fill="#1a1a2e">  attributed.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 685)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Faithfulness and compute cost trade off along a Pareto frontier; pick the cheapest method that meets your faithfulness bar, not the flashiest one.</text>
  </g>
</svg>
