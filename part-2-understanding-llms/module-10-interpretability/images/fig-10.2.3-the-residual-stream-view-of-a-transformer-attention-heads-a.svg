<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The residual stream view of a transformer</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Attention heads and MLPs read from a shared bus, compute, and add their result back; nothing gets overwritten.</text>

  <!-- Residual stream "highway" -->
  <g>
    <rect x="60" y="320" width="1180" height="60" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="80" y="340" font-size="13" font-weight="700" fill="#1a4078">RESIDUAL STREAM</text>
    <text x="80" y="358" font-size="11" fill="#5a4a3a">shared d_model-dim bus, position by position</text>
    <line x1="60" y1="350" x2="1240" y2="350" stroke="#1a4078" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>
  </g>

  <!-- Embed (left) -->
  <g transform="translate(80, 250)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="50" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Embed</text>
    <text x="50" y="48" font-size="11" text-anchor="middle" fill="#5a4a3a">init stream</text>
  </g>
  <line x1="130" y1="310" x2="130" y2="320" stroke="#722f8a" stroke-width="1.6" marker-end="url(#arrW)"/>

  <!-- Components above and below -->
  <!-- Attn 0.0 -->
  <g transform="translate(220, 180)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Attn 0.0</text>
    <text x="60" y="46" font-size="11" text-anchor="middle" fill="#5a4a3a">head</text>
  </g>
  <line x1="260" y1="320" x2="260" y2="245" stroke="#1f7a3a" stroke-width="1.4" marker-end="url(#arrR)"/>
  <line x1="300" y1="240" x2="300" y2="320" stroke="#722f8a" stroke-width="1.4" marker-end="url(#arrW)"/>

  <!-- Attn 0.1 -->
  <g transform="translate(380, 410)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Attn 0.1</text>
    <text x="60" y="46" font-size="11" text-anchor="middle" fill="#5a4a3a">head</text>
  </g>
  <line x1="420" y1="380" x2="420" y2="405" stroke="#1f7a3a" stroke-width="1.4" marker-end="url(#arrR)"/>
  <line x1="460" y1="410" x2="460" y2="385" stroke="#722f8a" stroke-width="1.4" marker-end="url(#arrW)"/>

  <!-- MLP 0 -->
  <g transform="translate(540, 180)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">MLP 0</text>
    <text x="60" y="46" font-size="11" text-anchor="middle" fill="#5a4a3a">feed-forward</text>
  </g>
  <line x1="580" y1="320" x2="580" y2="245" stroke="#1f7a3a" stroke-width="1.4" marker-end="url(#arrR)"/>
  <line x1="620" y1="240" x2="620" y2="320" stroke="#722f8a" stroke-width="1.4" marker-end="url(#arrW)"/>

  <!-- Attn 1.0 -->
  <g transform="translate(700, 410)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Attn 1.0</text>
    <text x="60" y="46" font-size="11" text-anchor="middle" fill="#5a4a3a">head</text>
  </g>
  <line x1="740" y1="380" x2="740" y2="405" stroke="#1f7a3a" stroke-width="1.4" marker-end="url(#arrR)"/>
  <line x1="780" y1="410" x2="780" y2="385" stroke="#722f8a" stroke-width="1.4" marker-end="url(#arrW)"/>

  <!-- MLP 1 -->
  <g transform="translate(860, 180)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">MLP 1</text>
    <text x="60" y="46" font-size="11" text-anchor="middle" fill="#5a4a3a">feed-forward</text>
  </g>
  <line x1="900" y1="320" x2="900" y2="245" stroke="#1f7a3a" stroke-width="1.4" marker-end="url(#arrR)"/>
  <line x1="940" y1="240" x2="940" y2="320" stroke="#722f8a" stroke-width="1.4" marker-end="url(#arrW)"/>

  <!-- Output -->
  <g transform="translate(1070, 250)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Output</text>
    <text x="60" y="46" font-size="11" text-anchor="middle" fill="#5a4a3a">final stream</text>
  </g>
  <line x1="1130" y1="320" x2="1130" y2="315" stroke="#1f7a3a" stroke-width="1.6" marker-end="url(#arrR)"/>

  <!-- Read/Write legend -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="380" height="60" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#1a1a2e">Read &amp; write into the same bus</text>
    <line x1="14" y1="38" x2="40" y2="38" stroke="#1f7a3a" stroke-width="1.6" marker-end="url(#arrR)"/>
    <text x="46" y="42" font-size="11" fill="#1a1a2e">read (project from stream)</text>
    <line x1="200" y1="38" x2="226" y2="38" stroke="#722f8a" stroke-width="1.6" marker-end="url(#arrW)"/>
    <text x="232" y="42" font-size="11" fill="#1a1a2e">write (add back to stream)</text>
  </g>

  <!-- Note callout -->
  <g transform="translate(900, 100)">
    <rect x="0" y="0" width="320" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Why it matters</text>
    <text x="14" y="40" font-size="11" fill="#1a1a2e">Each component reads from and writes</text>
    <text x="14" y="54" font-size="11" fill="#1a1a2e">to the shared residual stream.</text>
  </g>

  <!-- Per-position label -->
  <g transform="translate(80, 510)">
    <text x="0" y="0" font-size="12" font-style="italic" fill="#5a4a3a">Picture this stream existing at every token position; components communicate across positions only through attention.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">A transformer is best read as components communicating through a residual highway, not as a strict feed-forward stack; this view explains skip-connections, lens methods, and circuit composition.</text>
  </g>
</svg>
