<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Illustrative performance gap on multilingual QA</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Accuracy on a shared QA benchmark falls steeply as the language gets less web data</text>

  <!-- Plot frame -->
  <g>
    <line x1="180" y1="120" x2="180" y2="490" stroke="#1a1a2e" stroke-width="1.2"/>
    <line x1="180" y1="490" x2="1100" y2="490" stroke="#1a1a2e" stroke-width="1.2"/>
    <text x="105" y="305" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 105 305)">QA accuracy (%)</text>
    <text x="640" y="555" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Languages, grouped by training-data resource level</text>
  </g>

  <!-- Y-axis ticks and gridlines -->
  <g font-size="11" fill="#5a4a3a" text-anchor="end">
    <g stroke="#e0e0e0" stroke-width="0.7" stroke-dasharray="3,3">
      <line x1="180" y1="490" x2="1100" y2="490"/>
      <line x1="180" y1="416" x2="1100" y2="416"/>
      <line x1="180" y1="342" x2="1100" y2="342"/>
      <line x1="180" y1="268" x2="1100" y2="268"/>
      <line x1="180" y1="194" x2="1100" y2="194"/>
      <line x1="180" y1="120" x2="1100" y2="120"/>
    </g>
    <text x="170" y="494">0</text>
    <text x="170" y="420">20</text>
    <text x="170" y="346">40</text>
    <text x="170" y="272">60</text>
    <text x="170" y="198">80</text>
    <text x="170" y="124">100</text>
  </g>

  <!-- Group bands (background tints) -->
  <g opacity="0.35">
    <rect x="200" y="120" width="290" height="370" fill="#ecf6ee"/>
    <rect x="500" y="120" width="290" height="370" fill="#fef3e0"/>
    <rect x="800" y="120" width="200" height="370" fill="#fdeee8"/>
  </g>

  <!-- Group labels -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="345" y="138" fill="#1f7a3a">High-resource</text>
    <text x="645" y="138" fill="#7a5e1a">Medium-resource</text>
    <text x="900" y="138" fill="#b3401b">Low-resource</text>
  </g>

  <!-- Bars: y=490 baseline, scale: 1% = 3.7 px (370 px / 100%) -->
  <!-- High-resource: green -->
  <g>
    <rect x="225" y="164" width="80" height="326" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="265" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a3a">88%</text>
    <text x="265" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">EN</text>

    <rect x="320" y="175" width="80" height="315" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="360" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a3a">85%</text>
    <text x="360" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">DE</text>

    <rect x="415" y="179" width="80" height="311" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="455" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a3a">84%</text>
    <text x="455" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">ZH</text>
  </g>

  <!-- Medium-resource: orange -->
  <g>
    <rect x="525" y="231" width="80" height="259" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <text x="565" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5e1a">70%</text>
    <text x="565" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">AR</text>

    <rect x="620" y="250" width="80" height="240" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <text x="660" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5e1a">65%</text>
    <text x="660" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">HI</text>

    <rect x="715" y="268" width="80" height="222" fill="#fef3e0" stroke="#d4b96a" stroke-width="2"/>
    <text x="755" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5e1a">60%</text>
    <text x="755" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">SW</text>
  </g>

  <!-- Low-resource: red -->
  <g>
    <rect x="820" y="331" width="80" height="159" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="860" y="323" text-anchor="middle" font-size="13" font-weight="700" fill="#b3401b">43%</text>
    <text x="860" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">YO</text>

    <rect x="915" y="364" width="80" height="126" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="955" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#b3401b">34%</text>
    <text x="955" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">QU</text>
  </g>

  <!-- Gap annotation: arrow showing 88 -> 34 = 54 point gap -->
  <g>
    <line x1="1030" y1="164" x2="1030" y2="364" stroke="#b3401b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <rect x="1045" y="240" width="105" height="48" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="1097" y="260" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">54-point</text>
    <text x="1097" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">gap</text>
  </g>

  <!-- Legend with language codes -->
  <g transform="translate(180, 580)">
    <text x="0" y="14" font-size="11" font-style="italic" fill="#5a4a3a">EN English  -  DE German  -  ZH Chinese  -  AR Arabic  -  HI Hindi  -  SW Swahili  -  YO Yoruba  -  QU Quechua</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 615)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#b3401b">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Even strong multilingual models trail English by 40+ accuracy points on low-resource languages; "multilingual" does not mean "equally good in every language."</text>
  </g>
</svg>
