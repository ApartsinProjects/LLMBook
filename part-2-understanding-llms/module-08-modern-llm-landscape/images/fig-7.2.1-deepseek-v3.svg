<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">DeepSeek V3: four stacked innovations</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Each layer attacks a different cost: memory, compute, sample efficiency, and bit-width</text>

  <!-- Vertical stack of 4 layers, with a "what it saves" column on the right -->

  <!-- Layer 1: MLA -->
  <g transform="translate(150, 110)">
    <rect x="0" y="0" width="640" height="115" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#1a4078">1. Multi-head Latent Attention (MLA)</text>
    <text x="20" y="58" font-size="12" fill="#1a1a2e">Compress K and V into a low-rank latent vector before caching.</text>
    <text x="20" y="78" font-size="12" fill="#1a1a2e">At decode time, reconstruct heads from the latent on the fly.</text>
    <text x="20" y="100" font-size="11" font-style="italic" fill="#5a4a3a">Replaces standard multi-head attention's full K/V cache.</text>
  </g>
  <g transform="translate(810, 110)">
    <rect x="0" y="0" width="340" height="115" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="170" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Saves: memory bandwidth</text>
    <text x="20" y="55" font-size="12" fill="#1a1a2e">KV cache shrinks by roughly 5 to 10x</text>
    <text x="20" y="75" font-size="12" fill="#1a1a2e">at long context, so more tokens fit</text>
    <text x="20" y="95" font-size="12" fill="#1a1a2e">on the same GPU and decode is faster.</text>
  </g>

  <!-- Layer 2: MoE -->
  <g transform="translate(150, 240)">
    <rect x="0" y="0" width="640" height="115" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#1f7a3a">2. Mixture of Experts (MoE)</text>
    <text x="20" y="58" font-size="12" fill="#1a1a2e">256 expert FFNs per layer; a router activates 8 experts per token.</text>
    <text x="20" y="78" font-size="12" fill="#1a1a2e">Total parameters: 671B. Active per token: 37B.</text>
    <text x="20" y="100" font-size="11" font-style="italic" fill="#5a4a3a">Scales capacity without scaling per-token compute.</text>
  </g>
  <g transform="translate(810, 240)">
    <rect x="0" y="0" width="340" height="115" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="170" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Saves: per-token FLOPs</text>
    <text x="20" y="55" font-size="12" fill="#1a1a2e">Only 5.5% of weights touch any one</text>
    <text x="20" y="75" font-size="12" fill="#1a1a2e">token, so 671B parameters cost about</text>
    <text x="20" y="95" font-size="12" fill="#1a1a2e">the same as a dense 37B model.</text>
  </g>

  <!-- Layer 3: MTP -->
  <g transform="translate(150, 370)">
    <rect x="0" y="0" width="640" height="115" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#722f8a">3. Multi-Token Prediction (MTP)</text>
    <text x="20" y="58" font-size="12" fill="#1a1a2e">During training, predict the next 2 tokens instead of just the next 1.</text>
    <text x="20" y="78" font-size="12" fill="#1a1a2e">Auxiliary heads share the trunk; main objective is unchanged.</text>
    <text x="20" y="100" font-size="11" font-style="italic" fill="#5a4a3a">Forces representations to encode longer-range structure.</text>
  </g>
  <g transform="translate(810, 370)">
    <rect x="0" y="0" width="340" height="115" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="170" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Saves: training tokens</text>
    <text x="20" y="55" font-size="12" fill="#1a1a2e">Better sample efficiency; also enables</text>
    <text x="20" y="75" font-size="12" fill="#1a1a2e">speculative decoding at inference for</text>
    <text x="20" y="95" font-size="12" fill="#1a1a2e">a free latency win.</text>
  </g>

  <!-- Layer 4: FP8 -->
  <g transform="translate(150, 500)">
    <rect x="0" y="0" width="640" height="115" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#b3401b">4. FP8 mixed-precision training</text>
    <text x="20" y="58" font-size="12" fill="#1a1a2e">Most matmuls run in FP8; sensitive ops (norms, accums) stay in higher precision.</text>
    <text x="20" y="78" font-size="12" fill="#1a1a2e">Custom scaling tames overflow on the narrow exponent range.</text>
    <text x="20" y="100" font-size="11" font-style="italic" fill="#5a4a3a">First successful FP8 training run at frontier scale.</text>
  </g>
  <g transform="translate(810, 500)">
    <rect x="0" y="0" width="340" height="115" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="170" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Saves: GPU dollars</text>
    <text x="20" y="55" font-size="12" fill="#1a1a2e">FP8 nearly doubles throughput vs.</text>
    <text x="20" y="75" font-size="12" fill="#1a1a2e">BF16, halving the cluster cost of</text>
    <text x="20" y="95" font-size="12" fill="#1a1a2e">an end-to-end pretraining run.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 650)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">DeepSeek V3 stacks four orthogonal efficiency tricks; together they let a 671B-parameter model train and serve at a fraction of the cost of a dense frontier system.</text>
  </g>
</svg>
