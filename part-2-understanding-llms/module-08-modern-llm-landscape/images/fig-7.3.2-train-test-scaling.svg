<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="44" font-size="26" font-weight="600" text-anchor="middle" fill="#1a1a2e">Train-Time vs Test-Time Scaling</text>
  <text x="650" y="70" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Two ways to spend compute for better answers: front-load it once, or pay per query at inference.</text>

  <!-- LEFT LANE: TRAIN-TIME -->
  <g>
    <rect x="40" y="100" width="610" height="490" rx="12" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="345" y="130" font-size="18" font-weight="700" text-anchor="middle" fill="#1a4078">Train-Time Scaling</text>
    <text x="345" y="151" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">"Pay once, serve cheap forever."</text>

    <!-- Items -->
    <g transform="translate(80, 180)">
      <rect x="0" y="0" width="530" height="70" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
      <text x="20" y="28" font-size="14" font-weight="700" fill="#1a1a2e">1. Invest compute ONCE</text>
      <text x="20" y="50" font-size="12" fill="#5a4a3a">Months of GPU time during pretraining; sunk cost.</text>
    </g>

    <g transform="translate(80, 270)">
      <rect x="0" y="0" width="530" height="70" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
      <text x="20" y="28" font-size="14" font-weight="700" fill="#1a1a2e">2. Larger model, more data</text>
      <text x="20" y="50" font-size="12" fill="#5a4a3a">Chinchilla-style scaling: parameters and tokens grow together.</text>
    </g>

    <g transform="translate(80, 360)">
      <rect x="0" y="0" width="530" height="70" rx="8" fill="#ffffff" stroke="#1a4078" stroke-width="2"/>
      <text x="20" y="28" font-size="14" font-weight="700" fill="#1a1a2e">3. Fixed cost per query</text>
      <text x="20" y="50" font-size="12" fill="#5a4a3a">One forward pass; latency and price are predictable.</text>
    </g>

    <!-- Cost shape: tall capex bar, flat marginal -->
    <g transform="translate(80, 460)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1a4078">Cost shape over time</text>
      <line x1="0" y1="60" x2="530" y2="60" stroke="#1a1a2e" stroke-width="1"/>
      <rect x="10" y="14" width="40" height="46" fill="#1a4078"/>
      <text x="30" y="78" font-size="11" text-anchor="middle" fill="#1a4078">train</text>
      <!-- flat inference bars -->
      <rect x="80" y="50" width="20" height="10" fill="#5a4a3a" opacity="0.7"/>
      <rect x="110" y="50" width="20" height="10" fill="#5a4a3a" opacity="0.7"/>
      <rect x="140" y="50" width="20" height="10" fill="#5a4a3a" opacity="0.7"/>
      <rect x="170" y="50" width="20" height="10" fill="#5a4a3a" opacity="0.7"/>
      <rect x="200" y="50" width="20" height="10" fill="#5a4a3a" opacity="0.7"/>
      <rect x="230" y="50" width="20" height="10" fill="#5a4a3a" opacity="0.7"/>
      <rect x="260" y="50" width="20" height="10" fill="#5a4a3a" opacity="0.7"/>
      <rect x="290" y="50" width="20" height="10" fill="#5a4a3a" opacity="0.7"/>
      <rect x="320" y="50" width="20" height="10" fill="#5a4a3a" opacity="0.7"/>
      <rect x="350" y="50" width="20" height="10" fill="#5a4a3a" opacity="0.7"/>
      <rect x="380" y="50" width="20" height="10" fill="#5a4a3a" opacity="0.7"/>
      <rect x="410" y="50" width="20" height="10" fill="#5a4a3a" opacity="0.7"/>
      <text x="270" y="78" font-size="11" text-anchor="middle" fill="#5a4a3a">cheap, flat per-query inference</text>
    </g>
  </g>

  <!-- RIGHT LANE: TEST-TIME -->
  <g>
    <rect x="660" y="100" width="610" height="490" rx="12" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="965" y="130" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Test-Time Scaling</text>
    <text x="965" y="151" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">"Think harder when the question is hard."</text>

    <g transform="translate(700, 180)">
      <rect x="0" y="0" width="530" height="70" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="2"/>
      <text x="20" y="28" font-size="14" font-weight="700" fill="#1a1a2e">1. Additional compute PER QUERY</text>
      <text x="20" y="50" font-size="12" fill="#5a4a3a">Inference budget grows with task difficulty.</text>
    </g>

    <g transform="translate(700, 270)">
      <rect x="0" y="0" width="530" height="70" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="2"/>
      <text x="20" y="28" font-size="14" font-weight="700" fill="#1a1a2e">2. Chain-of-thought, search, self-verify</text>
      <text x="20" y="50" font-size="12" fill="#5a4a3a">Sample many traces, prune, vote, refine.</text>
    </g>

    <g transform="translate(700, 360)">
      <rect x="0" y="0" width="530" height="70" rx="8" fill="#ffffff" stroke="#1f7a3a" stroke-width="2"/>
      <text x="20" y="28" font-size="14" font-weight="700" fill="#1a1a2e">3. Variable cost per query</text>
      <text x="20" y="50" font-size="12" fill="#5a4a3a">Easy queries: cheap. Hard queries: 100x more tokens.</text>
    </g>

    <!-- Cost shape: small capex (use base model), spiky inference -->
    <g transform="translate(700, 460)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1f7a3a">Cost shape over time</text>
      <line x1="0" y1="60" x2="530" y2="60" stroke="#1a1a2e" stroke-width="1"/>
      <rect x="10" y="40" width="40" height="20" fill="#1f7a3a"/>
      <text x="30" y="78" font-size="11" text-anchor="middle" fill="#1f7a3a">train</text>
      <!-- variable inference bars -->
      <rect x="80" y="48" width="20" height="12" fill="#1f7a3a"/>
      <rect x="110" y="20" width="20" height="40" fill="#1f7a3a"/>
      <rect x="140" y="44" width="20" height="16" fill="#1f7a3a"/>
      <rect x="170" y="10" width="20" height="50" fill="#1f7a3a"/>
      <rect x="200" y="50" width="20" height="10" fill="#1f7a3a"/>
      <rect x="230" y="25" width="20" height="35" fill="#1f7a3a"/>
      <rect x="260" y="40" width="20" height="20" fill="#1f7a3a"/>
      <rect x="290" y="5" width="20" height="55" fill="#1f7a3a"/>
      <rect x="320" y="46" width="20" height="14" fill="#1f7a3a"/>
      <rect x="350" y="30" width="20" height="30" fill="#1f7a3a"/>
      <rect x="380" y="48" width="20" height="12" fill="#1f7a3a"/>
      <rect x="410" y="15" width="20" height="45" fill="#1f7a3a"/>
      <text x="255" y="78" font-size="11" text-anchor="middle" fill="#1f7a3a">spiky, query-dependent inference</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 620)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#7a5e1a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">The two are complementary, not rivals. Strong base models keep inference cheap; test-time compute lets a single model stretch up to harder problems on demand.</text>
  </g>
</svg>
