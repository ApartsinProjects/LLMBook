<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>ORM vs PRM: outcome-only vs step-level reward signal</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">ORM vs PRM: outcome vs per-step signal</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">PRMs score every step so wrong moves are caught immediately</text>

  <g transform="translate(60, 100)">
    <rect width="490" height="380" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <rect x="0" y="0" width="490" height="44" rx="10" fill="#b3401b"/>
    <text x="245" y="29" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">ORM (outcome only)</text>

    <text x="245" y="74" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">only the final answer is judged</text>

    <g transform="translate(30, 90)">
      <rect width="130" height="50" rx="6" fill="#ffffff" stroke="#5a4a3a" stroke-width="1.4"/>
      <text x="65" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 1</text>
      <text x="65" y="40" font-size="11" text-anchor="middle" fill="#5a4a3a">no signal</text>

      <rect x="150" width="130" height="50" rx="6" fill="#ffffff" stroke="#5a4a3a" stroke-width="1.4"/>
      <text x="215" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 2</text>
      <text x="215" y="40" font-size="11" text-anchor="middle" fill="#5a4a3a">no signal</text>

      <rect x="300" width="130" height="50" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="365" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 3 (wrong)</text>
      <text x="365" y="40" font-size="11" text-anchor="middle" fill="#b3401b">still no signal</text>

      <line x1="130" y1="25" x2="148" y2="25" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
      <line x1="280" y1="25" x2="298" y2="25" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
    </g>

    <rect x="80" y="200" width="330" height="80" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="245" y="226" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Final answer: WRONG</text>
    <text x="245" y="250" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">where did it go wrong? unknown</text>
    <text x="245" y="268" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">credit assignment must be inferred</text>

    <text x="30" y="316" font-size="12" font-weight="700" fill="#a67c1a">Sparse signal</text>
    <text x="30" y="336" font-size="11" fill="#1a1a2e">- high variance for RL</text>
    <text x="30" y="354" font-size="11" fill="#1a1a2e">- nothing for tree search to prune</text>
    <text x="30" y="372" font-size="11" fill="#1a1a2e">- need many trajectories to learn anything</text>
  </g>

  <g transform="translate(570, 100)">
    <rect width="490" height="380" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <rect x="0" y="0" width="490" height="44" rx="10" fill="#1f7a3a"/>
    <text x="245" y="29" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">PRM (per-step)</text>

    <text x="245" y="74" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">every step gets its own correctness score</text>

    <g transform="translate(30, 90)">
      <rect width="130" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.4"/>
      <text x="65" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 1</text>
      <text x="65" y="40" font-size="11" text-anchor="middle" fill="#1f7a3a">P=0.95</text>

      <rect x="150" width="130" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.4"/>
      <text x="215" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 2</text>
      <text x="215" y="40" font-size="11" text-anchor="middle" fill="#1f7a3a">P=0.88</text>

      <rect x="300" width="130" height="50" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
      <text x="365" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 3</text>
      <text x="365" y="40" font-size="11" text-anchor="middle" fill="#b3401b">P=0.12</text>

      <line x1="130" y1="25" x2="148" y2="25" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
      <line x1="280" y1="25" x2="298" y2="25" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
    </g>

    <rect x="80" y="200" width="330" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="245" y="226" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Error caught at step 3</text>
    <text x="245" y="250" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">score collapsed 0.88 to 0.12</text>
    <text x="245" y="268" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">backtrack to step 2, re-sample step 3</text>

    <text x="30" y="316" font-size="12" font-weight="700" fill="#1f7a3a">Dense credit assignment</text>
    <text x="30" y="336" font-size="11" fill="#1a1a2e">- powers Best-of-N over partial paths</text>
    <text x="30" y="354" font-size="11" fill="#1a1a2e">- guides MCTS expansion</text>
    <text x="30" y="372" font-size="11" fill="#1a1a2e">- supervision for o1, Math-Shepherd</text>
  </g>

  <g transform="translate(60, 500)">
    <rect width="1000" height="80" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#a67c1a">Key idea</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">ORMs answer "did this trajectory succeed?"; PRMs answer "is this step correct?" Denser PRM signal is costlier to collect</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">but unlocks backtracking, search guidance, and lower-variance RL: the foundation of test-time-compute reasoners.</text>
  </g>
</svg>
