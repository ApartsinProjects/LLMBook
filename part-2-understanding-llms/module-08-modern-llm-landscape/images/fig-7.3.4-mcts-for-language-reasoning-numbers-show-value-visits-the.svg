<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">MCTS for language reasoning: search the tree of partial solutions</text>
  <text x="650" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each node shows  value-sum / visit-count . The most-visited high-value branch wins.</text>

  <!-- Root: Problem -->
  <g>
    <rect x="430" y="110" width="220" height="70" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="540" y="138" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Problem</text>
    <text x="540" y="160" font-size="12" text-anchor="middle" fill="#1a1a2e">root state · 33 visits</text>
  </g>

  <!-- Edges from root -->
  <line x1="490" y1="180" x2="200" y2="240" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="180" x2="540" y2="240" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <line x1="590" y1="180" x2="880" y2="240" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 1c (left, low value) -->
  <g>
    <rect x="80" y="240" width="220" height="100" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="190" y="266" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 1c</text>
    <text x="190" y="292" font-size="13" text-anchor="middle" fill="#1a1a2e">value-sum / visits</text>
    <text x="190" y="313" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">1 / 8</text>
    <text x="190" y="330" font-size="11" text-anchor="middle" fill="#5a4a3a">avg value 0.13 — pruned</text>
  </g>

  <!-- Step 1a (center, best) -->
  <g>
    <rect x="430" y="240" width="220" height="100" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="540" y="266" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 1a</text>
    <text x="540" y="292" font-size="13" text-anchor="middle" fill="#1a1a2e">value-sum / visits</text>
    <text x="540" y="313" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">12 / 15</text>
    <text x="540" y="330" font-size="11" text-anchor="middle" fill="#5a4a3a">avg value 0.80 — expand</text>
  </g>

  <!-- Step 1b (right, mid) -->
  <g>
    <rect x="780" y="240" width="220" height="100" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="890" y="266" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 1b</text>
    <text x="890" y="292" font-size="13" text-anchor="middle" fill="#1a1a2e">value-sum / visits</text>
    <text x="890" y="313" font-size="16" font-weight="700" text-anchor="middle" fill="#7a5e1a">5 / 10</text>
    <text x="890" y="330" font-size="11" text-anchor="middle" fill="#5a4a3a">avg value 0.50 — explore</text>
  </g>

  <!-- Edge to Step 2a -->
  <line x1="540" y1="340" x2="540" y2="395" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- Step 2a -->
  <g>
    <rect x="430" y="395" width="220" height="100" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="540" y="421" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Step 2a</text>
    <text x="540" y="447" font-size="13" text-anchor="middle" fill="#1a1a2e">value-sum / visits</text>
    <text x="540" y="468" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">8 / 9</text>
    <text x="540" y="485" font-size="11" text-anchor="middle" fill="#5a4a3a">avg value 0.89 — exploit</text>
  </g>

  <!-- Edge to Answer -->
  <line x1="540" y1="495" x2="540" y2="535" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- Answer -->
  <g>
    <rect x="410" y="535" width="260" height="60" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="540" y="561" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Answer  ✓</text>
    <text x="540" y="582" font-size="11" text-anchor="middle" fill="#5a4a3a">terminal node, verified correct</text>
  </g>

  <!-- MCTS algorithm callout (right) -->
  <g transform="translate(1040, 110)">
    <rect x="0" y="0" width="240" height="485" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="120" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">MCTS  4-step loop</text>

    <text x="14" y="58" font-size="12" font-weight="700" fill="#722f8a">1. Select</text>
    <text x="14" y="76" font-size="11" fill="#1a1a2e">From root, walk down by</text>
    <text x="14" y="90" font-size="11" fill="#1a1a2e">UCB1: pick the child that</text>
    <text x="14" y="104" font-size="11" fill="#1a1a2e">maximizes</text>
    <text x="14" y="121" font-size="11" font-style="italic" fill="#1a1a2e">  Q  +  c · sqrt(ln N / n)</text>

    <text x="14" y="153" font-size="12" font-weight="700" fill="#722f8a">2. Expand</text>
    <text x="14" y="171" font-size="11" fill="#1a1a2e">Sample k candidate next</text>
    <text x="14" y="185" font-size="11" fill="#1a1a2e">steps from the LLM as</text>
    <text x="14" y="199" font-size="11" fill="#1a1a2e">new child nodes.</text>

    <text x="14" y="231" font-size="12" font-weight="700" fill="#722f8a">3. Simulate</text>
    <text x="14" y="249" font-size="11" fill="#1a1a2e">Roll out a quick solution</text>
    <text x="14" y="263" font-size="11" fill="#1a1a2e">from the new node, OR</text>
    <text x="14" y="277" font-size="11" fill="#1a1a2e">query a PRM / value head</text>
    <text x="14" y="291" font-size="11" fill="#1a1a2e">for an estimated value v.</text>

    <text x="14" y="323" font-size="12" font-weight="700" fill="#722f8a">4. Backpropagate</text>
    <text x="14" y="341" font-size="11" fill="#1a1a2e">Walk back to root,</text>
    <text x="14" y="355" font-size="11" fill="#1a1a2e">incrementing each ancestor's</text>
    <text x="14" y="369" font-size="11" fill="#1a1a2e">visit count and value-sum.</text>

    <text x="14" y="401" font-size="12" font-weight="700" fill="#722f8a">After budget T</text>
    <text x="14" y="419" font-size="11" fill="#1a1a2e">Pick the most-visited</text>
    <text x="14" y="433" font-size="11" fill="#1a1a2e">child of the root (here:</text>
    <text x="14" y="447" font-size="11" fill="#1a1a2e">Step 1a with 15 visits).</text>
    <text x="14" y="465" font-size="11" font-style="italic" fill="#5a4a3a">Visits, not value, are the</text>
    <text x="14" y="479" font-size="11" font-style="italic" fill="#5a4a3a">final commitment criterion.</text>
  </g>

  <!-- Legend (left side bottom) -->
  <g transform="translate(80, 395)">
    <rect x="0" y="0" width="220" height="160" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Reading the nodes</text>
    <text x="14" y="44" font-size="11" fill="#1a1a2e">value-sum / visits  =  Q-stats</text>
    <text x="14" y="62" font-size="11" fill="#1a1a2e">accumulated by the search.</text>

    <circle cx="22" cy="84" r="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="36" y="88" font-size="11" fill="#1a1a2e">high avg value, exploit</text>

    <circle cx="22" cy="106" r="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
    <text x="36" y="110" font-size="11" fill="#1a1a2e">mid value, keep exploring</text>

    <circle cx="22" cy="128" r="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="36" y="132" font-size="11" fill="#1a1a2e">low value, prune branch</text>

    <text x="14" y="152" font-size="11" font-style="italic" fill="#5a4a3a">Bold edges = winning path</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 615)">
    <rect x="0" y="0" width="970" height="65" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="44" font-size="12" fill="#1a1a2e">MCTS treats reasoning as a tree of partial solutions. UCB1 balances exploiting high-value nodes against exploring under-visited ones,</text>
    <text x="20" y="60" font-size="12" fill="#1a1a2e">and a PRM (or rollout) supplies the per-step value estimate that drives the search.</text>
  </g>
</svg>
