<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The frontier LLM ecosystem (mid 2025)</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Two tiers of providers, positioned by capability breadth and openness of weights</text>

  <!-- Axes frame -->
  <g>
    <rect x="120" y="100" width="900" height="490" fill="#fafbfc" stroke="#d4d4d4" stroke-width="1"/>
    <!-- X axis label -->
    <text x="570" y="625" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Openness of weights and research</text>
    <text x="160" y="610" font-size="12" fill="#5a4a3a">Closed (API only)</text>
    <text x="980" y="610" font-size="12" text-anchor="end" fill="#5a4a3a">Open weights</text>
    <line x1="120" y1="595" x2="1020" y2="595" stroke="#1a1a2e" stroke-width="1.2"/>
    <!-- Y axis label -->
    <text x="60" y="345" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 60 345)">Capability and reasoning depth</text>
    <text x="105" y="115" font-size="12" text-anchor="end" fill="#5a4a3a">Frontier</text>
    <text x="105" y="585" font-size="12" text-anchor="end" fill="#5a4a3a">Strong</text>
    <line x1="120" y1="100" x2="120" y2="595" stroke="#1a1a2e" stroke-width="1.2"/>

    <!-- Tier dividing band -->
    <line x1="120" y1="320" x2="1020" y2="320" stroke="#d4b96a" stroke-width="1" stroke-dasharray="6,4"/>
    <text x="1015" y="315" font-size="11" font-style="italic" text-anchor="end" fill="#7a5e1a">tier boundary</text>
  </g>

  <!-- Tier 1 banner (top) -->
  <g>
    <rect x="135" y="115" width="200" height="28" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="235" y="134" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">TIER 1: Frontier leaders</text>
  </g>

  <!-- Tier 2 banner -->
  <g>
    <rect x="135" y="335" width="220" height="28" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="245" y="354" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">TIER 2: Strong competitors</text>
  </g>

  <!-- Tier 1 providers (closed-weight, frontier capability) -->
  <!-- OpenAI: closed, high capability -->
  <g transform="translate(220,180)">
    <rect x="0" y="0" width="190" height="100" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="95" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">OpenAI</text>
    <text x="95" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">GPT-4o</text>
    <text x="95" y="66" font-size="12" text-anchor="middle" fill="#1a1a2e">o1, o3 (reasoning)</text>
    <text x="95" y="88" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">closed weights</text>
  </g>

  <!-- Anthropic: closed, high capability -->
  <g transform="translate(470,180)">
    <rect x="0" y="0" width="190" height="100" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="95" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Anthropic</text>
    <text x="95" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">Claude 3.5</text>
    <text x="95" y="66" font-size="12" text-anchor="middle" fill="#1a1a2e">Claude 4 family</text>
    <text x="95" y="88" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">closed weights</text>
  </g>

  <!-- Google DeepMind: partly closed, very capable -->
  <g transform="translate(720,180)">
    <rect x="0" y="0" width="200" height="100" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Google DeepMind</text>
    <text x="100" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">Gemini 2.0 / 2.5</text>
    <text x="100" y="66" font-size="12" text-anchor="middle" fill="#1a1a2e">Pro and Flash</text>
    <text x="100" y="88" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">closed (some open Gemma)</text>
  </g>

  <!-- Tier 2 providers -->
  <!-- DeepSeek: open, strong -->
  <g transform="translate(740,400)">
    <rect x="0" y="0" width="190" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="95" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">DeepSeek</text>
    <text x="95" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">V3 (671B MoE)</text>
    <text x="95" y="66" font-size="12" text-anchor="middle" fill="#1a1a2e">R1 (reasoning)</text>
    <text x="95" y="88" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">open weights</text>
  </g>

  <!-- Meta: open weights -->
  <g transform="translate(490,400)">
    <rect x="0" y="0" width="190" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="95" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Meta AI</text>
    <text x="95" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">Llama 3</text>
    <text x="95" y="66" font-size="12" text-anchor="middle" fill="#1a1a2e">Llama 4</text>
    <text x="95" y="88" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">open weights</text>
  </g>

  <!-- xAI: closed, strong -->
  <g transform="translate(220,400)">
    <rect x="0" y="0" width="190" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="95" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">xAI</text>
    <text x="95" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">Grok 3</text>
    <text x="95" y="66" font-size="12" text-anchor="middle" fill="#1a1a2e">Grok 4 (preview)</text>
    <text x="95" y="88" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">mostly closed</text>
  </g>

  <!-- Side callout -->
  <g transform="translate(1050, 130)">
    <rect x="0" y="0" width="220" height="200" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="110" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">How to read this map</text>
    <text x="14" y="52" font-size="12" fill="#1a1a2e">Vertical axis: how far a lab</text>
    <text x="14" y="68" font-size="12" fill="#1a1a2e">pushes the capability frontier.</text>
    <text x="14" y="92" font-size="12" fill="#1a1a2e">Horizontal axis: whether</text>
    <text x="14" y="108" font-size="12" fill="#1a1a2e">weights are downloadable.</text>
    <text x="14" y="132" font-size="12" fill="#1a1a2e">Tier 1 leads on capability;</text>
    <text x="14" y="148" font-size="12" fill="#1a1a2e">Tier 2 closes the gap, often</text>
    <text x="14" y="164" font-size="12" fill="#1a1a2e">with open weights and</text>
    <text x="14" y="180" font-size="12" fill="#1a1a2e">lower training cost.</text>
  </g>

  <!-- Side callout 2 -->
  <g transform="translate(1050, 350)">
    <rect x="0" y="0" width="220" height="180" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="110" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Why two tiers?</text>
    <text x="14" y="52" font-size="12" fill="#1a1a2e">Tier 1 labs train on the</text>
    <text x="14" y="68" font-size="12" fill="#1a1a2e">largest clusters and ship</text>
    <text x="14" y="84" font-size="12" fill="#1a1a2e">novel reasoning modes first.</text>
    <text x="14" y="108" font-size="12" fill="#1a1a2e">Tier 2 ships competitive</text>
    <text x="14" y="124" font-size="12" fill="#1a1a2e">models 6 to 12 months later</text>
    <text x="14" y="140" font-size="12" fill="#1a1a2e">at a fraction of the cost,</text>
    <text x="14" y="156" font-size="12" fill="#1a1a2e">often with open weights.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 660)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">A small group of closed-weight labs (OpenAI, Anthropic, Google) defines the frontier; an active second tier (DeepSeek, Meta, xAI) closes the gap with open or cheaper alternatives.</text>
  </g>
</svg>
