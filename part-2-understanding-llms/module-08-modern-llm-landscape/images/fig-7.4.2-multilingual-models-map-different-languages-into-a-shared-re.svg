<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Multilingual models map languages into a shared representation</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Sentences with the same meaning land near each other regardless of source language</text>

  <!-- Left column: input languages -->
  <g>
    <text x="190" y="115" font-size="15" font-weight="700" text-anchor="middle" fill="#1a4078">Input sentences</text>
    <text x="190" y="135" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">same meaning, different scripts</text>
  </g>

  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#1a4078">English</text>
    <text x="14" y="46" font-size="13" fill="#1a1a2e">The cat sleeps.</text>
  </g>
  <g transform="translate(80, 240)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#1a4078">French</text>
    <text x="14" y="46" font-size="13" fill="#1a1a2e">Le chat dort.</text>
  </g>
  <g transform="translate(80, 320)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#1a4078">Japanese</text>
    <text x="14" y="46" font-size="15" fill="#1a1a2e">猫が寝ている。</text>
  </g>
  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#1a4078">Arabic</text>
    <text x="14" y="46" font-size="15" fill="#1a1a2e" direction="rtl">القطة نائمة.</text>
  </g>

  <!-- Encoder block (middle) -->
  <g transform="translate(360, 230)">
    <rect x="0" y="0" width="180" height="170" rx="10" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="90" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Multilingual</text>
    <text x="90" y="56" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">encoder</text>
    <text x="90" y="86" font-size="11" text-anchor="middle" fill="#1a1a2e">shared subword</text>
    <text x="90" y="102" font-size="11" text-anchor="middle" fill="#1a1a2e">vocabulary +</text>
    <text x="90" y="118" font-size="11" text-anchor="middle" fill="#1a1a2e">shared transformer</text>
    <text x="90" y="148" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">trained on 100+ languages</text>
  </g>

  <!-- Arrows from inputs to encoder -->
  <g stroke="#1a1a2e" stroke-width="1.5" fill="none">
    <path d="M 300 190 L 360 270" marker-end="url(#arr)"/>
    <path d="M 300 270 L 360 295" marker-end="url(#arr)"/>
    <path d="M 300 350 L 360 335" marker-end="url(#arr)"/>
    <path d="M 300 430 L 360 365" marker-end="url(#arr)"/>
  </g>

  <!-- Single arrow to representation space -->
  <g stroke="#1a1a2e" stroke-width="1.8" fill="none">
    <path d="M 545 315 L 620 315" marker-end="url(#arr)"/>
  </g>

  <!-- Shared representation space (right): a 2D scatter -->
  <g transform="translate(620, 130)">
    <rect x="0" y="0" width="450" height="430" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="225" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">Shared representation space</text>
    <text x="225" y="48" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">a single high-dimensional vector space, projected to 2D</text>

    <!-- Faint grid -->
    <g stroke="#cfe1cf" stroke-width="0.6">
      <line x1="40" y1="80" x2="40" y2="400"/>
      <line x1="40" y1="400" x2="420" y2="400"/>
    </g>

    <!-- Cluster: "the cat sleeps" meanings -->
    <g>
      <ellipse cx="180" cy="180" rx="95" ry="65" fill="none" stroke="#1f7a3a" stroke-width="1.5" stroke-dasharray="5,4"/>
      <text x="180" y="115" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">"the cat sleeps" cluster</text>

      <circle cx="150" cy="170" r="7" fill="#1a4078"/>
      <text x="150" y="158" font-size="11" text-anchor="middle" fill="#1a1a2e">EN</text>

      <circle cx="190" cy="160" r="7" fill="#1a4078"/>
      <text x="190" y="148" font-size="11" text-anchor="middle" fill="#1a1a2e">FR</text>

      <circle cx="215" cy="195" r="7" fill="#1a4078"/>
      <text x="222" y="200" font-size="11" fill="#1a1a2e">JA</text>

      <circle cx="160" cy="210" r="7" fill="#1a4078"/>
      <text x="148" y="225" font-size="11" fill="#1a1a2e">AR</text>
    </g>

    <!-- Other clusters for context -->
    <g opacity="0.6">
      <ellipse cx="340" cy="180" rx="55" ry="40" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="340" y="180" font-size="11" text-anchor="middle" fill="#5a4a3a">"the dog runs"</text>

      <ellipse cx="120" cy="340" rx="55" ry="40" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="120" y="340" font-size="11" text-anchor="middle" fill="#5a4a3a">"it is raining"</text>

      <ellipse cx="320" cy="340" rx="55" ry="40" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="320" y="340" font-size="11" text-anchor="middle" fill="#5a4a3a">"good morning"</text>
    </g>
  </g>

  <!-- Side callout -->
  <g transform="translate(1090, 160)">
    <rect x="0" y="0" width="190" height="200" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="95" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Why it matters</text>
    <text x="14" y="52" font-size="12" fill="#1a1a2e">Knowledge learned in</text>
    <text x="14" y="68" font-size="12" fill="#1a1a2e">English transfers to other</text>
    <text x="14" y="84" font-size="12" fill="#1a1a2e">languages "for free."</text>
    <text x="14" y="112" font-size="12" fill="#1a1a2e">Fine-tune on French QA</text>
    <text x="14" y="128" font-size="12" fill="#1a1a2e">data and the model gets</text>
    <text x="14" y="144" font-size="12" fill="#1a1a2e">better at Spanish QA too,</text>
    <text x="14" y="160" font-size="12" fill="#1a1a2e">because both share the</text>
    <text x="14" y="176" font-size="12" fill="#1a1a2e">same internal space.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 610)">
    <rect x="0" y="0" width="1180" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">A multilingual model is not many models in one; it is a single representation space where translations of the same sentence collapse to nearly the same point.</text>
  </g>
</svg>
