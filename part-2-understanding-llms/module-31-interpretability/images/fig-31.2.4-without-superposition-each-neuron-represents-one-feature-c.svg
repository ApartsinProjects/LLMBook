<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Superposition: more features than neurons</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a">Without superposition, each neuron carries one concept; with superposition, neurons share concepts to fit more capacity.</text>

  <!-- LEFT lane: No Superposition -->
  <g transform="translate(70, 100)">
    <rect x="0" y="0" width="560" height="500" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="280" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">No Superposition</text>
    <text x="280" y="56" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">monosemantic, low capacity</text>

    <!-- Three neurons with one feature each -->
    <g transform="translate(40, 90)">
      <!-- Neuron 1 -->
      <circle cx="80" cy="80" r="48" fill="#ffffff" stroke="#1f7a3a" stroke-width="2.5"/>
      <text x="80" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Neuron 1</text>
      <text x="80" y="94" font-size="13" text-anchor="middle" fill="#1f7a3a" font-weight="700">cat</text>

      <!-- Neuron 2 -->
      <circle cx="240" cy="80" r="48" fill="#ffffff" stroke="#1f7a3a" stroke-width="2.5"/>
      <text x="240" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Neuron 2</text>
      <text x="240" y="94" font-size="13" text-anchor="middle" fill="#1f7a3a" font-weight="700">dog</text>

      <!-- Neuron 3 -->
      <circle cx="400" cy="80" r="48" fill="#ffffff" stroke="#1f7a3a" stroke-width="2.5"/>
      <text x="400" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Neuron 3</text>
      <text x="400" y="94" font-size="13" text-anchor="middle" fill="#1f7a3a" font-weight="700">blue</text>
    </g>

    <!-- Properties -->
    <g transform="translate(30, 270)">
      <rect x="0" y="0" width="500" height="40" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="14" y="25" font-size="13" fill="#1a1a2e"><tspan font-weight="700">Rule: </tspan>1 feature = 1 neuron</text>

      <rect x="0" y="55" width="500" height="40" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1"/>
      <text x="14" y="80" font-size="13" fill="#1a1a2e"><tspan font-weight="700">Pro: </tspan>clean, easy to interpret and probe</text>

      <rect x="0" y="110" width="500" height="60" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
      <text x="14" y="134" font-size="13" fill="#1a1a2e"><tspan font-weight="700" fill="#b3401b">Limit: </tspan>capacity is hard-capped</text>
      <text x="14" y="154" font-size="12" fill="#5a4a3a">3 neurons can store at most 3 features.</text>
    </g>
  </g>

  <!-- RIGHT lane: Superposition -->
  <g transform="translate(670, 100)">
    <rect x="0" y="0" width="560" height="500" rx="10" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="280" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#7a5e1a">Superposition</text>
    <text x="280" y="56" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">polysemantic, high capacity</text>

    <!-- Three neurons each with multiple features -->
    <g transform="translate(40, 90)">
      <circle cx="80" cy="80" r="48" fill="#ffffff" stroke="#7a5e1a" stroke-width="2.5"/>
      <text x="80" y="70" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Neuron 1</text>
      <text x="80" y="88" font-size="11" text-anchor="middle" fill="#7a5e1a">cat + legal</text>
      <text x="80" y="103" font-size="11" text-anchor="middle" fill="#7a5e1a">+ Tuesday</text>

      <circle cx="240" cy="80" r="48" fill="#ffffff" stroke="#7a5e1a" stroke-width="2.5"/>
      <text x="240" y="70" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Neuron 2</text>
      <text x="240" y="88" font-size="11" text-anchor="middle" fill="#7a5e1a">dog + blue</text>
      <text x="240" y="103" font-size="11" text-anchor="middle" fill="#7a5e1a">+ verb</text>

      <circle cx="400" cy="80" r="48" fill="#ffffff" stroke="#7a5e1a" stroke-width="2.5"/>
      <text x="400" y="70" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Neuron 3</text>
      <text x="400" y="88" font-size="11" text-anchor="middle" fill="#7a5e1a">blue + code</text>
      <text x="400" y="103" font-size="11" text-anchor="middle" fill="#7a5e1a">+ negation</text>
    </g>

    <!-- Properties -->
    <g transform="translate(30, 270)">
      <rect x="0" y="0" width="500" height="40" rx="6" fill="#ffffff" stroke="#7a5e1a" stroke-width="1"/>
      <text x="14" y="25" font-size="13" fill="#1a1a2e"><tspan font-weight="700">Rule: </tspan>features share neurons via near-orthogonal directions</text>

      <rect x="0" y="55" width="500" height="40" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1"/>
      <text x="14" y="80" font-size="13" fill="#1a1a2e"><tspan font-weight="700" fill="#1f7a3a">Pro: </tspan>5+ features fit in 3 neurons (higher capacity)</text>

      <rect x="0" y="110" width="500" height="60" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1"/>
      <text x="14" y="134" font-size="13" fill="#1a1a2e"><tspan font-weight="700" fill="#b3401b">Cost: </tspan>polysemantic neurons are hard to interpret</text>
      <text x="14" y="154" font-size="12" fill="#5a4a3a">SAEs and dictionary learning try to recover the underlying features.</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Real LLMs sit on the right: many sparsely-active features compete for the same neurons, which is why "what does this neuron do" rarely has a single clean answer.</text>
  </g>
</svg>
