<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">MHA, MQA, and GQA, side by side</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Same 32 query heads, different sharing strategies for K and V; the KV-cache shrinks accordingly.</text>

  <!-- Three lanes -->
  <!-- MHA -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="380" height="490" rx="10" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="44" rx="10" fill="#b3401b"/>
    <text x="190" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">MHA -- Multi-Head</text>
    <text x="190" y="68" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">Original Transformer (Vaswani et al.)</text>

    <!-- 8 Q heads (representing 32) -->
    <text x="190" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">32 Q heads</text>
    <g transform="translate(30, 110)">
      <g fill="#1a4078">
        <rect x="0" y="0" width="35" height="22" rx="3"/><rect x="42" y="0" width="35" height="22" rx="3"/>
        <rect x="84" y="0" width="35" height="22" rx="3"/><rect x="126" y="0" width="35" height="22" rx="3"/>
        <rect x="168" y="0" width="35" height="22" rx="3"/><rect x="210" y="0" width="35" height="22" rx="3"/>
        <rect x="252" y="0" width="35" height="22" rx="3"/><rect x="294" y="0" width="35" height="22" rx="3"/>
      </g>
      <text x="160" y="42" font-size="11" text-anchor="middle" fill="#5a4a3a">(8 of 32 shown)</text>
    </g>

    <text x="190" y="180" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">32 K heads</text>
    <g transform="translate(30, 192)">
      <g fill="#1f7a3a">
        <rect x="0" y="0" width="35" height="22" rx="3"/><rect x="42" y="0" width="35" height="22" rx="3"/>
        <rect x="84" y="0" width="35" height="22" rx="3"/><rect x="126" y="0" width="35" height="22" rx="3"/>
        <rect x="168" y="0" width="35" height="22" rx="3"/><rect x="210" y="0" width="35" height="22" rx="3"/>
        <rect x="252" y="0" width="35" height="22" rx="3"/><rect x="294" y="0" width="35" height="22" rx="3"/>
      </g>
    </g>

    <text x="190" y="246" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">32 V heads</text>
    <g transform="translate(30, 258)">
      <g fill="#722f8a">
        <rect x="0" y="0" width="35" height="22" rx="3"/><rect x="42" y="0" width="35" height="22" rx="3"/>
        <rect x="84" y="0" width="35" height="22" rx="3"/><rect x="126" y="0" width="35" height="22" rx="3"/>
        <rect x="168" y="0" width="35" height="22" rx="3"/><rect x="210" y="0" width="35" height="22" rx="3"/>
        <rect x="252" y="0" width="35" height="22" rx="3"/><rect x="294" y="0" width="35" height="22" rx="3"/>
      </g>
    </g>

    <!-- KV cache footprint -->
    <rect x="30" y="320" width="320" height="80" rx="6" fill="#ffffff" stroke="#b3401b" stroke-width="1.5"/>
    <text x="190" y="342" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">KV cache per layer</text>
    <text x="190" y="365" font-size="14" text-anchor="middle" fill="#1a1a2e">32 x d_head (K) + 32 x d_head (V)</text>
    <text x="190" y="388" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">Baseline (1.0x)</text>

    <text x="190" y="430" font-size="12" text-anchor="middle" fill="#1a1a2e" font-weight="700">Best quality, biggest cache</text>
    <text x="190" y="450" font-size="11" text-anchor="middle" fill="#5a4a3a">Memory bandwidth becomes</text>
    <text x="190" y="466" font-size="11" text-anchor="middle" fill="#5a4a3a">the decoder bottleneck.</text>
  </g>

  <!-- MQA -->
  <g transform="translate(460, 100)">
    <rect x="0" y="0" width="380" height="490" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="44" rx="10" fill="#1a4078"/>
    <text x="190" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">MQA -- Multi-Query</text>
    <text x="190" y="68" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">PaLM, Falcon</text>

    <text x="190" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">32 Q heads</text>
    <g transform="translate(30, 110)">
      <g fill="#1a4078">
        <rect x="0" y="0" width="35" height="22" rx="3"/><rect x="42" y="0" width="35" height="22" rx="3"/>
        <rect x="84" y="0" width="35" height="22" rx="3"/><rect x="126" y="0" width="35" height="22" rx="3"/>
        <rect x="168" y="0" width="35" height="22" rx="3"/><rect x="210" y="0" width="35" height="22" rx="3"/>
        <rect x="252" y="0" width="35" height="22" rx="3"/><rect x="294" y="0" width="35" height="22" rx="3"/>
      </g>
    </g>

    <text x="190" y="180" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">1 shared K</text>
    <g transform="translate(160, 192)">
      <rect x="0" y="0" width="60" height="22" rx="3" fill="#1f7a3a"/>
    </g>

    <text x="190" y="246" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">1 shared V</text>
    <g transform="translate(160, 258)">
      <rect x="0" y="0" width="60" height="22" rx="3" fill="#722f8a"/>
    </g>

    <rect x="30" y="320" width="320" height="80" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="190" y="342" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">KV cache per layer</text>
    <text x="190" y="365" font-size="14" text-anchor="middle" fill="#1a1a2e">1 x d_head (K) + 1 x d_head (V)</text>
    <text x="190" y="388" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">~32x smaller</text>

    <text x="190" y="430" font-size="12" text-anchor="middle" fill="#1a1a2e" font-weight="700">Tiny cache, some quality loss</text>
    <text x="190" y="450" font-size="11" text-anchor="middle" fill="#5a4a3a">All Q heads attend to one</text>
    <text x="190" y="466" font-size="11" text-anchor="middle" fill="#5a4a3a">K, V; can train-instability prone.</text>
  </g>

  <!-- GQA -->
  <g transform="translate(860, 100)">
    <rect x="0" y="0" width="380" height="490" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="44" rx="10" fill="#1f7a3a"/>
    <text x="190" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">GQA -- Grouped-Query</text>
    <text x="190" y="68" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">Llama 2/3, Mistral</text>

    <text x="190" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">32 Q heads, in 8 groups of 4</text>
    <g transform="translate(30, 110)">
      <!-- 8 groups of 4 mini-heads each -->
      <g fill="#1a4078">
        <rect x="0" y="0" width="35" height="22" rx="3"/><rect x="42" y="0" width="35" height="22" rx="3"/>
        <rect x="84" y="0" width="35" height="22" rx="3"/><rect x="126" y="0" width="35" height="22" rx="3"/>
        <rect x="168" y="0" width="35" height="22" rx="3"/><rect x="210" y="0" width="35" height="22" rx="3"/>
        <rect x="252" y="0" width="35" height="22" rx="3"/><rect x="294" y="0" width="35" height="22" rx="3"/>
      </g>
      <!-- group brackets -->
      <line x1="0" y1="28" x2="77" y2="28" stroke="#5a4a3a" stroke-width="1.5"/>
      <line x1="84" y1="28" x2="161" y2="28" stroke="#5a4a3a" stroke-width="1.5"/>
      <line x1="168" y1="28" x2="245" y2="28" stroke="#5a4a3a" stroke-width="1.5"/>
      <line x1="252" y1="28" x2="329" y2="28" stroke="#5a4a3a" stroke-width="1.5"/>
    </g>

    <text x="190" y="180" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">8 K groups</text>
    <g transform="translate(80, 192)">
      <g fill="#1f7a3a">
        <rect x="0" y="0" width="22" height="22" rx="3"/><rect x="29" y="0" width="22" height="22" rx="3"/>
        <rect x="58" y="0" width="22" height="22" rx="3"/><rect x="87" y="0" width="22" height="22" rx="3"/>
        <rect x="116" y="0" width="22" height="22" rx="3"/><rect x="145" y="0" width="22" height="22" rx="3"/>
        <rect x="174" y="0" width="22" height="22" rx="3"/><rect x="203" y="0" width="22" height="22" rx="3"/>
      </g>
    </g>

    <text x="190" y="246" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">8 V groups</text>
    <g transform="translate(80, 258)">
      <g fill="#722f8a">
        <rect x="0" y="0" width="22" height="22" rx="3"/><rect x="29" y="0" width="22" height="22" rx="3"/>
        <rect x="58" y="0" width="22" height="22" rx="3"/><rect x="87" y="0" width="22" height="22" rx="3"/>
        <rect x="116" y="0" width="22" height="22" rx="3"/><rect x="145" y="0" width="22" height="22" rx="3"/>
        <rect x="174" y="0" width="22" height="22" rx="3"/><rect x="203" y="0" width="22" height="22" rx="3"/>
      </g>
    </g>

    <rect x="30" y="320" width="320" height="80" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="190" y="342" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">KV cache per layer</text>
    <text x="190" y="365" font-size="14" text-anchor="middle" fill="#1a1a2e">8 x d_head (K) + 8 x d_head (V)</text>
    <text x="190" y="388" font-size="12" text-anchor="middle" fill="#5a4a3a" font-style="italic">~4x smaller, near-MHA quality</text>

    <text x="190" y="430" font-size="12" text-anchor="middle" fill="#1a1a2e" font-weight="700">Best of both worlds</text>
    <text x="190" y="450" font-size="11" text-anchor="middle" fill="#5a4a3a">Each group of 4 Q heads</text>
    <text x="190" y="466" font-size="11" text-anchor="middle" fill="#5a4a3a">shares one K, V pair.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 610)">
    <rect x="0" y="0" width="1180" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">All three keep 32 query heads. The difference is how aggressively K and V are shared, which directly sets the KV-cache size,</text>
    <text x="20" y="62" font-size="12" fill="#1a1a2e">the dominant memory cost during long-context generation. GQA is now the default in production-grade open models.</text>
  </g>
</svg>
