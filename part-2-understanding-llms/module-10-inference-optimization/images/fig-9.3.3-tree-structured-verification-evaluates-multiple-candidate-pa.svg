<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Tree-structured speculative verification</text>
  <text x="650" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">A draft model proposes several candidate continuations; the target model verifies all branches in one forward pass and accepts the longest valid path.</text>

  <!-- Context -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="110" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">Context</text>
    <text x="110" y="56" font-size="14" text-anchor="middle" fill="#1a1a2e">"the"</text>

    <text x="110" y="110" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">prefix tokens already accepted</text>
  </g>

  <!-- Tree -->
  <g transform="translate(0,0)">
    <!-- Level 1: a / his -->
    <rect x="380" y="120" width="100" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.2"/>
    <text x="430" y="146" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">"a"</text>
    <text x="430" y="166" font-size="11" text-anchor="middle" fill="#5a4a3a">accepted</text>

    <rect x="380" y="220" width="100" height="60" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="430" y="246" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">"his"</text>
    <text x="430" y="266" font-size="11" text-anchor="middle" fill="#5a4a3a">rejected</text>

    <!-- Level 2 from "a": cat / dog -->
    <rect x="600" y="80" width="100" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.2"/>
    <text x="650" y="106" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">"cat"</text>
    <text x="650" y="126" font-size="11" text-anchor="middle" fill="#5a4a3a">accepted</text>

    <rect x="600" y="160" width="100" height="60" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="650" y="186" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">"dog"</text>
    <text x="650" y="206" font-size="11" text-anchor="middle" fill="#5a4a3a">rejected</text>

    <!-- Level 2 from "his" (subtree pruned, drawn faded) -->
    <rect x="600" y="240" width="100" height="60" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="650" y="266" font-size="13" text-anchor="middle" fill="#5a4a3a">"old"</text>
    <text x="650" y="284" font-size="11" text-anchor="middle" fill="#5a4a3a">pruned</text>

    <!-- Level 3: small / old / sat -->
    <rect x="820" y="40" width="100" height="60" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="870" y="66" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">"small"</text>
    <text x="870" y="86" font-size="11" text-anchor="middle" fill="#5a4a3a">rejected</text>

    <rect x="820" y="120" width="100" height="60" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.2"/>
    <text x="870" y="146" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">"sat"</text>
    <text x="870" y="166" font-size="11" text-anchor="middle" fill="#5a4a3a">accepted</text>

    <rect x="820" y="200" width="100" height="60" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="870" y="226" font-size="13" text-anchor="middle" fill="#5a4a3a">"old"</text>
    <text x="870" y="244" font-size="11" text-anchor="middle" fill="#5a4a3a">pruned</text>

    <!-- Edges from Context -->
    <line x1="280" y1="160" x2="378" y2="150" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <line x1="280" y1="160" x2="378" y2="240" stroke="#b3401b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrR)"/>

    <!-- Edges from "a" -->
    <line x1="480" y1="140" x2="598" y2="110" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <line x1="480" y1="160" x2="598" y2="190" stroke="#b3401b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrR)"/>

    <!-- Edges from "his" (faded) -->
    <line x1="480" y1="260" x2="598" y2="270" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Edges from "cat" -->
    <line x1="700" y1="100" x2="818" y2="70" stroke="#b3401b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
    <line x1="700" y1="120" x2="818" y2="150" stroke="#1f7a3a" stroke-width="2" marker-end="url(#arrG)"/>

    <!-- Edges from "dog" -->
    <line x1="700" y1="190" x2="818" y2="230" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Right panel: best path / mechanism -->
  <g transform="translate(990, 100)">
    <rect x="0" y="0" width="270" height="200" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="135" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Accepted path</text>
    <text x="135" y="60" font-size="14" text-anchor="middle" fill="#1a1a2e">"the" -&gt; "a" -&gt;</text>
    <text x="135" y="80" font-size="14" text-anchor="middle" fill="#1a1a2e">"cat" -&gt; "sat"</text>
    <text x="135" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">3 new tokens</text>
    <text x="135" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">in 1 forward pass</text>
    <text x="135" y="172" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(vs. 3 sequential decode steps)</text>
  </g>

  <!-- How it works -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="600" height="200" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="14" font-weight="700" fill="#7a5e1a">How tree verification works</text>
    <text x="14" y="50" font-size="12" fill="#1a1a2e">1. A small draft model proposes a tree of likely continuations</text>
    <text x="14" y="68" font-size="12" fill="#1a1a2e">    (not just a single sequence). Branches encode hedges where</text>
    <text x="14" y="86" font-size="12" fill="#1a1a2e">    the draft is uncertain.</text>
    <text x="14" y="110" font-size="12" fill="#1a1a2e">2. The target model receives the entire tree as one batch with</text>
    <text x="14" y="128" font-size="12" fill="#1a1a2e">    a tree-shaped attention mask, scoring every node in parallel.</text>
    <text x="14" y="152" font-size="12" fill="#1a1a2e">3. The longest path of tokens whose target probabilities pass</text>
    <text x="14" y="170" font-size="12" fill="#1a1a2e">    the acceptance test is committed; pruned branches are dropped.</text>
  </g>

  <g transform="translate(680, 380)">
    <rect x="0" y="0" width="580" height="200" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="14" font-weight="700" fill="#722f8a">Why a tree beats a chain</text>
    <text x="14" y="50" font-size="12" fill="#1a1a2e">Linear speculation accepts up to k tokens only if every guess</text>
    <text x="14" y="68" font-size="12" fill="#1a1a2e">in the chain is correct. One bad guess kills the rest.</text>
    <text x="14" y="92" font-size="12" fill="#1a1a2e">Trees hedge: at uncertain positions the draft proposes 2-3</text>
    <text x="14" y="110" font-size="12" fill="#1a1a2e">siblings, so the target can pick the right branch and keep going.</text>
    <text x="14" y="138" font-size="12" fill="#1a1a2e">All branches are scored in the same forward pass, so the cost</text>
    <text x="14" y="156" font-size="12" fill="#1a1a2e">stays close to one decode step while expected accept length grows.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 660)">
    <rect x="0" y="0" width="1140" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Verifying a tree of candidates in one forward pass amortizes the target model's cost across many tentative tokens; the</text>
    <text x="20" y="64" font-size="12" fill="#1a1a2e">accepted path is whichever branch the target itself would have produced, so output quality is unchanged.</text>
  </g>
</svg>
