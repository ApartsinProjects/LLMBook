<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a4078"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">PagedAttention: logical KV blocks map to non-contiguous physical pages</text>
  <text x="650" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">A block table indirects each sequence's KV cache into fixed-size GPU pages, eliminating fragmentation and enabling sharing.</text>

  <!-- Logical view -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#1a1a2e">Logical view (per sequence)</text>
    <text x="0" y="20" font-size="11" fill="#5a4a3a">Each sequence sees a contiguous list of 16-token blocks.</text>

    <!-- Seq A: 45 tokens -> 3 blocks -->
    <g transform="translate(0, 40)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#1a4078">Seq A (45 tokens)</text>
      <g transform="translate(0, 24)">
        <rect x="0"   y="0" width="78" height="46" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
        <text x="39" y="20" font-size="12" text-anchor="middle" fill="#1a4078" font-weight="700">A.blk0</text>
        <text x="39" y="36" font-size="11" text-anchor="middle" fill="#5a4a3a">tok 0-15</text>
        <rect x="86"  y="0" width="78" height="46" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
        <text x="125" y="20" font-size="12" text-anchor="middle" fill="#1a4078" font-weight="700">A.blk1</text>
        <text x="125" y="36" font-size="11" text-anchor="middle" fill="#5a4a3a">tok 16-31</text>
        <rect x="172" y="0" width="78" height="46" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1.6"/>
        <text x="211" y="20" font-size="12" text-anchor="middle" fill="#1a4078" font-weight="700">A.blk2</text>
        <text x="211" y="36" font-size="11" text-anchor="middle" fill="#5a4a3a">tok 32-44</text>
      </g>
    </g>

    <!-- Seq B -->
    <g transform="translate(0, 130)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#b3401b">Seq B (28 tokens)</text>
      <g transform="translate(0, 24)">
        <rect x="0"  y="0" width="78" height="46" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1.6"/>
        <text x="39" y="20" font-size="12" text-anchor="middle" fill="#b3401b" font-weight="700">B.blk0</text>
        <text x="39" y="36" font-size="11" text-anchor="middle" fill="#5a4a3a">tok 0-15</text>
        <rect x="86" y="0" width="78" height="46" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1.6"/>
        <text x="125" y="20" font-size="12" text-anchor="middle" fill="#b3401b" font-weight="700">B.blk1</text>
        <text x="125" y="36" font-size="11" text-anchor="middle" fill="#5a4a3a">tok 16-27</text>
      </g>
    </g>

    <!-- Seq C: shared prefix + own -->
    <g transform="translate(0, 220)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#722f8a">Seq C (shares prefix with A)</text>
      <g transform="translate(0, 24)">
        <rect x="0"  y="0" width="78" height="46" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.6" stroke-dasharray="4 3"/>
        <text x="39" y="20" font-size="12" text-anchor="middle" fill="#722f8a" font-weight="700">shared</text>
        <text x="39" y="36" font-size="11" text-anchor="middle" fill="#5a4a3a">= A.blk0</text>
        <rect x="86" y="0" width="78" height="46" rx="4" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.6"/>
        <text x="125" y="20" font-size="12" text-anchor="middle" fill="#722f8a" font-weight="700">C.own</text>
        <text x="125" y="36" font-size="11" text-anchor="middle" fill="#5a4a3a">tok 16-...</text>
      </g>
    </g>
  </g>

  <!-- Block table -->
  <g transform="translate(440, 100)">
    <text x="120" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a2e">Block table (indirection)</text>
    <text x="120" y="20" font-size="11" text-anchor="middle" fill="#5a4a3a">Per-sequence map: logical block -> physical page id</text>

    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="240" height="280" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.6"/>
      <!-- Header -->
      <line x1="0" y1="28" x2="240" y2="28" stroke="#7a5e1a"/>
      <text x="60" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">seq</text>
      <text x="130" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">logical</text>
      <text x="200" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">phys</text>

      <!-- Rows -->
      <g font-size="12" fill="#1a1a2e">
        <text x="60"  y="48" text-anchor="middle">A</text>
        <text x="130" y="48" text-anchor="middle">blk0</text>
        <text x="200" y="48" text-anchor="middle" font-weight="700" fill="#1a4078">P0</text>

        <text x="60"  y="68" text-anchor="middle">A</text>
        <text x="130" y="68" text-anchor="middle">blk1</text>
        <text x="200" y="68" text-anchor="middle" font-weight="700" fill="#1a4078">P3</text>

        <text x="60"  y="88" text-anchor="middle">A</text>
        <text x="130" y="88" text-anchor="middle">blk2</text>
        <text x="200" y="88" text-anchor="middle" font-weight="700" fill="#1a4078">P1</text>

        <text x="60"  y="118" text-anchor="middle">B</text>
        <text x="130" y="118" text-anchor="middle">blk0</text>
        <text x="200" y="118" text-anchor="middle" font-weight="700" fill="#b3401b">P4</text>

        <text x="60"  y="138" text-anchor="middle">B</text>
        <text x="130" y="138" text-anchor="middle">blk1</text>
        <text x="200" y="138" text-anchor="middle" font-weight="700" fill="#b3401b">P2</text>

        <text x="60"  y="168" text-anchor="middle">C</text>
        <text x="130" y="168" text-anchor="middle">shared</text>
        <text x="200" y="168" text-anchor="middle" font-weight="700" fill="#722f8a">P0</text>

        <text x="60"  y="188" text-anchor="middle">C</text>
        <text x="130" y="188" text-anchor="middle">own</text>
        <text x="200" y="188" text-anchor="middle" font-weight="700" fill="#722f8a">P5</text>
      </g>
      <text x="120" y="232" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Seq C reuses P0 (prefix sharing)</text>
      <text x="120" y="252" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Pages need not be adjacent.</text>
    </g>
  </g>

  <!-- Physical memory grid -->
  <g transform="translate(800, 100)">
    <text x="220" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a2e">Physical GPU memory pages</text>
    <text x="220" y="20" font-size="11" text-anchor="middle" fill="#5a4a3a">Fixed-size pages allocated from a free list (any order).</text>

    <g transform="translate(0, 40)">
      <!-- 6 pages, 3 cols x 2 rows -->
      <!-- P0 shared -->
      <rect x="0" y="0" width="130" height="80" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
      <text x="65" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">P0</text>
      <text x="65" y="48" font-size="11" text-anchor="middle" fill="#1a1a2e">A.blk0 = C.shared</text>
      <text x="65" y="64" font-size="11" font-style="italic" text-anchor="middle" fill="#722f8a">refs: A, C</text>

      <rect x="145" y="0" width="130" height="80" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
      <text x="210" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">P1</text>
      <text x="210" y="50" font-size="11" text-anchor="middle" fill="#1a1a2e">A.blk2</text>

      <rect x="290" y="0" width="130" height="80" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="355" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">P2</text>
      <text x="355" y="50" font-size="11" text-anchor="middle" fill="#1a1a2e">B.blk1</text>

      <rect x="0" y="95" width="130" height="80" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
      <text x="65" y="123" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">P3</text>
      <text x="65" y="145" font-size="11" text-anchor="middle" fill="#1a1a2e">A.blk1</text>

      <rect x="145" y="95" width="130" height="80" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
      <text x="210" y="123" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">P4</text>
      <text x="210" y="145" font-size="11" text-anchor="middle" fill="#1a1a2e">B.blk0</text>

      <rect x="290" y="95" width="130" height="80" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
      <text x="355" y="123" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">P5</text>
      <text x="355" y="145" font-size="11" text-anchor="middle" fill="#1a1a2e">C.own</text>

      <!-- Free pages -->
      <rect x="0"   y="190" width="130" height="50" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="65" y="220" font-size="12" text-anchor="middle" fill="#5a4a3a">P6 (free)</text>
      <rect x="145" y="190" width="130" height="50" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="210" y="220" font-size="12" text-anchor="middle" fill="#5a4a3a">P7 (free)</text>
      <rect x="290" y="190" width="130" height="50" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="355" y="220" font-size="12" text-anchor="middle" fill="#5a4a3a">P8 (free)</text>
    </g>
  </g>

  <!-- Connectors: from logical groups to block table to physical -->
  <!-- Logical -> block table arrows -->
  <line x1="320" y1="160" x2="430" y2="160" stroke="#1a4078" stroke-width="1.4" marker-end="url(#arrA)"/>
  <line x1="180" y1="250" x2="430" y2="240" stroke="#b3401b" stroke-width="1.4" marker-end="url(#arrB)"/>
  <line x1="180" y1="340" x2="430" y2="320" stroke="#722f8a" stroke-width="1.4" marker-end="url(#arrC)"/>

  <!-- Block table -> physical -->
  <line x1="690" y1="200" x2="790" y2="180" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="690" y1="280" x2="790" y2="280" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Callout -->
  <g transform="translate(60, 580)">
    <rect x="0" y="0" width="540" height="100" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#7a5e1a">Why pages?</text>
    <text x="14" y="44" font-size="12" fill="#1a1a2e">Without paging, the engine pre-reserves max_seq_len for every</text>
    <text x="14" y="62" font-size="12" fill="#1a1a2e">request, leaving most of the cache empty. With pages, memory</text>
    <text x="14" y="80" font-size="12" fill="#1a1a2e">grows one block at a time, and equal prefixes share one page.</text>
  </g>

  <g transform="translate(640, 580)">
    <rect x="0" y="0" width="600" height="100" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="14" y="44" font-size="12" fill="#1a1a2e">Each sequence sees a tidy contiguous KV cache; physically the</text>
    <text x="14" y="62" font-size="12" fill="#1a1a2e">blocks are scattered across pages. The block table is the only</text>
    <text x="14" y="80" font-size="12" fill="#1a1a2e">place that knows the mapping, and it is what enables sharing.</text>
  </g>
</svg>
