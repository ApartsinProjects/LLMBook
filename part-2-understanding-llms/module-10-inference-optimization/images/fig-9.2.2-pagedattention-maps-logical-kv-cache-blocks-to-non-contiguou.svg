<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>PagedAttention: logical KV blocks map to non-contiguous physical pages</title>
  <rect width="1100" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a4a3a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">PagedAttention</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Block table indirects each sequence's KV cache into fixed-size GPU pages</text>

  <!-- Logical view -->
  <g transform="translate(40, 110)">
    <text x="160" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Logical view</text>
    <text x="160" y="20" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">contiguous per sequence</text>

    <rect x="0" y="40" width="320" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="62" font-size="12" font-weight="700" fill="#1a4078">Seq A</text>
    <text x="20" y="78" font-size="11" fill="#5a4a3a">blk 0, 1, 2</text>

    <rect x="0" y="100" width="320" height="50" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="122" font-size="12" font-weight="700" fill="#b3401b">Seq B</text>
    <text x="20" y="138" font-size="11" fill="#5a4a3a">blk 0, 1</text>

    <rect x="0" y="160" width="320" height="50" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="20" y="182" font-size="12" font-weight="700" fill="#722f8a">Seq C</text>
    <text x="20" y="198" font-size="11" fill="#5a4a3a">shared prefix + own</text>
  </g>

  <!-- Block table -->
  <g transform="translate(400, 110)">
    <text x="150" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Block table</text>
    <text x="150" y="20" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">logical to physical map</text>

    <rect x="0" y="40" width="300" height="170" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="2"/>
    <line x1="0" y1="68" x2="300" y2="68" stroke="#a67c1a"/>
    <text x="50" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">seq</text>
    <text x="150" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">logical</text>
    <text x="250" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#7a5e1a">phys</text>

    <g font-size="12" fill="#1a1a2e">
      <text x="50" y="86" text-anchor="middle">A</text>
      <text x="150" y="86" text-anchor="middle">blk0</text>
      <text x="250" y="86" text-anchor="middle" font-weight="700" fill="#1a4078">P0</text>

      <text x="50" y="106" text-anchor="middle">A</text>
      <text x="150" y="106" text-anchor="middle">blk1</text>
      <text x="250" y="106" text-anchor="middle" font-weight="700" fill="#1a4078">P3</text>

      <text x="50" y="126" text-anchor="middle">B</text>
      <text x="150" y="126" text-anchor="middle">blk0</text>
      <text x="250" y="126" text-anchor="middle" font-weight="700" fill="#b3401b">P4</text>

      <text x="50" y="146" text-anchor="middle">B</text>
      <text x="150" y="146" text-anchor="middle">blk1</text>
      <text x="250" y="146" text-anchor="middle" font-weight="700" fill="#b3401b">P2</text>

      <text x="50" y="166" text-anchor="middle">C</text>
      <text x="150" y="166" text-anchor="middle">shared</text>
      <text x="250" y="166" text-anchor="middle" font-weight="700" fill="#722f8a">P0</text>

      <text x="50" y="186" text-anchor="middle">C</text>
      <text x="150" y="186" text-anchor="middle">own</text>
      <text x="250" y="186" text-anchor="middle" font-weight="700" fill="#722f8a">P5</text>
    </g>
  </g>

  <!-- Physical pages -->
  <g transform="translate(760, 110)">
    <text x="150" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Physical pages</text>
    <text x="150" y="20" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">any order; P0 shared</text>

    <rect x="0" y="40" width="90" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="45" y="60" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">P0</text>
    <text x="45" y="78" font-size="10" text-anchor="middle" fill="#722f8a">A and C</text>

    <rect x="100" y="40" width="90" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="145" y="60" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">P1</text>
    <text x="145" y="78" font-size="10" text-anchor="middle" fill="#5a4a3a">free</text>

    <rect x="210" y="40" width="90" height="50" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="255" y="60" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">P2</text>
    <text x="255" y="78" font-size="10" text-anchor="middle" fill="#5a4a3a">B.blk1</text>

    <rect x="0" y="100" width="90" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="45" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">P3</text>
    <text x="45" y="138" font-size="10" text-anchor="middle" fill="#5a4a3a">A.blk1</text>

    <rect x="100" y="100" width="90" height="50" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="145" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">P4</text>
    <text x="145" y="138" font-size="10" text-anchor="middle" fill="#5a4a3a">B.blk0</text>

    <rect x="210" y="100" width="90" height="50" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="255" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">P5</text>
    <text x="255" y="138" font-size="10" text-anchor="middle" fill="#5a4a3a">C.own</text>
  </g>

  <!-- Arrows -->
  <line x1="360" y1="170" x2="400" y2="170" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="170" x2="760" y2="170" stroke="#5a4a3a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Takeaway -->
  <g transform="translate(40, 380)">
    <rect x="0" y="0" width="1020" height="140" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Why pages</text>
    <text x="510" y="62" font-size="12" text-anchor="middle" fill="#1a1a2e">Each sequence sees a tidy contiguous KV cache; physically the blocks are scattered.</text>
    <text x="510" y="82" font-size="12" text-anchor="middle" fill="#1a1a2e">Memory grows one block at a time, and equal prefixes share one page.</text>
    <text x="510" y="112" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Block table is the only place that knows the mapping, and it is what enables sharing.</text>
  </g>
</svg>
