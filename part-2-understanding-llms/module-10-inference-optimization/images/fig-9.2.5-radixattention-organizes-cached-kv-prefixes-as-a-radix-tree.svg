<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">RadixAttention: cached KV prefixes organized as a radix tree</text>
  <text x="650" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Common prefixes are stored once at the top of the tree; each request walks down to its own private leaf.</text>

  <!-- Tree -->
  <g transform="translate(0,0)">
    <!-- Root -->
    <rect x="580" y="100" width="140" height="60" rx="8" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.6"/>
    <text x="650" y="125" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Root</text>
    <text x="650" y="145" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">empty prefix</text>

    <!-- System prompt node (large, shared) -->
    <rect x="490" y="210" width="320" height="100" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.4"/>
    <text x="650" y="236" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a3a">System prompt KV</text>
    <text x="650" y="258" font-size="12" text-anchor="middle" fill="#1a1a2e">~2,000 tokens, computed once</text>
    <text x="650" y="278" font-size="12" text-anchor="middle" fill="#1a1a2e">refcount = 3 (A, B, C share it)</text>
    <text x="650" y="298" font-size="11" font-style="italic" text-anchor="middle" fill="#1f7a3a">SHARED edge: prefix match</text>

    <!-- Branching: 3 user nodes -->
    <rect x="220" y="380" width="220" height="100" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.8"/>
    <text x="330" y="404" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">User A</text>
    <text x="330" y="424" font-size="12" text-anchor="middle" fill="#1a1a2e">"Translate to French..."</text>
    <text x="330" y="444" font-size="11" text-anchor="middle" fill="#5a4a3a">+ 180 tokens (private)</text>
    <text x="330" y="464" font-size="11" font-style="italic" text-anchor="middle" fill="#1a4078">refcount = 1</text>

    <rect x="540" y="380" width="220" height="100" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.8"/>
    <text x="650" y="404" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">User B</text>
    <text x="650" y="424" font-size="12" text-anchor="middle" fill="#1a1a2e">"Summarize doc..."</text>
    <text x="650" y="444" font-size="11" text-anchor="middle" fill="#5a4a3a">+ 95 tokens (private)</text>
    <text x="650" y="464" font-size="11" font-style="italic" text-anchor="middle" fill="#1a4078">refcount = 1</text>

    <rect x="860" y="380" width="220" height="100" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.8"/>
    <text x="970" y="404" font-size="14" font-weight="700" text-anchor="middle" fill="#1a4078">User C</text>
    <text x="970" y="424" font-size="12" text-anchor="middle" fill="#1a1a2e">"Write code that..."</text>
    <text x="970" y="444" font-size="11" text-anchor="middle" fill="#5a4a3a">+ 210 tokens (private)</text>
    <text x="970" y="464" font-size="11" font-style="italic" text-anchor="middle" fill="#1a4078">refcount = 1</text>

    <!-- C has a sub-branch: two follow-ups share its prefix -->
    <rect x="800" y="540" width="160" height="70" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.6"/>
    <text x="880" y="564" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">C-followup-1</text>
    <text x="880" y="584" font-size="11" text-anchor="middle" fill="#1a1a2e">+ 40 tokens</text>
    <text x="880" y="600" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">reuses prefix</text>

    <rect x="980" y="540" width="160" height="70" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.6"/>
    <text x="1060" y="564" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">C-followup-2</text>
    <text x="1060" y="584" font-size="11" text-anchor="middle" fill="#1a1a2e">+ 22 tokens</text>
    <text x="1060" y="600" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">LRU evictable</text>

    <!-- Edges -->
    <line x1="650" y1="160" x2="650" y2="208" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="600" y1="310" x2="370" y2="378" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="650" y1="310" x2="650" y2="378" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="700" y1="310" x2="930" y2="378" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="930" y1="480" x2="880" y2="538" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="1010" y1="480" x2="1060" y2="538" stroke="#1a1a2e" stroke-width="1.2" marker-end="url(#arr)"/>
  </g>

  <!-- Side: legend / mechanism -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="400" height="220" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="14" font-weight="700" fill="#7a5e1a">How the radix tree helps</text>
    <text x="14" y="50" font-size="12" fill="#1a1a2e">1. New request arrives. Engine walks the tree</text>
    <text x="14" y="68" font-size="12" fill="#1a1a2e">    matching token IDs from the root.</text>
    <text x="14" y="92" font-size="12" fill="#1a1a2e">2. Longest matching prefix is reused: those KV</text>
    <text x="14" y="110" font-size="12" fill="#1a1a2e">    blocks are NOT recomputed.</text>
    <text x="14" y="134" font-size="12" fill="#1a1a2e">3. The diverging suffix becomes a new child</text>
    <text x="14" y="152" font-size="12" fill="#1a1a2e">    node and is computed normally.</text>
    <text x="14" y="176" font-size="12" fill="#1a1a2e">4. Refcounts track sharing; LRU evicts cold</text>
    <text x="14" y="194" font-size="12" fill="#1a1a2e">    leaves when GPU memory is tight.</text>
  </g>

  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="400" height="190" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="14" font-weight="700" fill="#722f8a">Edge labels = token sequences</text>
    <text x="14" y="50" font-size="12" fill="#1a1a2e">Each edge stores the token IDs from parent to</text>
    <text x="14" y="68" font-size="12" fill="#1a1a2e">child, plus the page IDs holding their KV.</text>
    <text x="14" y="94" font-size="12" fill="#1a1a2e">Sibling edges always begin with different</text>
    <text x="14" y="112" font-size="12" fill="#1a1a2e">tokens, so prefix matching is unambiguous.</text>
    <text x="14" y="138" font-size="12" fill="#1a1a2e">A 2,000-token system prompt occupies one</text>
    <text x="14" y="156" font-size="12" fill="#1a1a2e">edge -- shared by every downstream request.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(80, 660)">
    <rect x="0" y="0" width="1140" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">RadixAttention generalizes prefix sharing: any common prefix (system prompt, few-shot examples, multi-turn history) lives</text>
    <text x="20" y="64" font-size="12" fill="#1a1a2e">at one tree node and is reused by every descendant request, turning duplicated prefill into a single cached subtree.</text>
  </g>
</svg>
