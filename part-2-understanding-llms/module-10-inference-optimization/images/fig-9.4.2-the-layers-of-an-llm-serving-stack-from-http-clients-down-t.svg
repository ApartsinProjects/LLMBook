<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="650" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">The LLM serving stack</text>
  <text x="650" y="66" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Six layers between an HTTP request and a GPU tensor core, each owning a different bottleneck.</text>

  <!-- Layered stack: 6 horizontal bands -->
  <!-- Layer 1: HTTP Clients -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="700" height="62" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="26" font-size="15" font-weight="700" fill="#1a4078">1. HTTP Clients</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">OpenAI-compatible API: SDKs, curl, browser apps; speak JSON over HTTPS.</text>
  </g>
  <g transform="translate(880, 100)">
    <rect x="0" y="0" width="270" height="62" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#7a5e1a">Concern</text>
    <text x="14" y="40" font-size="11" fill="#1a1a2e">Auth, rate limits, retries,</text>
    <text x="14" y="55" font-size="11" fill="#1a1a2e">SSE for streaming.</text>
  </g>

  <!-- Layer 2: API Server -->
  <g transform="translate(150, 178)">
    <rect x="0" y="0" width="700" height="62" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="26" font-size="15" font-weight="700" fill="#1a4078">2. API Server</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">FastAPI / gRPC; tokenize input, validate params, stream tokens back.</text>
  </g>
  <g transform="translate(880, 178)">
    <rect x="0" y="0" width="270" height="62" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#7a5e1a">Concern</text>
    <text x="14" y="40" font-size="11" fill="#1a1a2e">Request fan-in, OpenAI</text>
    <text x="14" y="55" font-size="11" fill="#1a1a2e">schema, observability.</text>
  </g>

  <!-- Layer 3: Scheduler -->
  <g transform="translate(150, 256)">
    <rect x="0" y="0" width="700" height="62" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="26" font-size="15" font-weight="700" fill="#1f7a3a">3. Request Scheduler</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Continuous batching, priority queues, preemption; what makes throughput scale.</text>
  </g>
  <g transform="translate(880, 256)">
    <rect x="0" y="0" width="270" height="62" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#7a5e1a">Concern</text>
    <text x="14" y="40" font-size="11" fill="#1a1a2e">Tail latency, fairness,</text>
    <text x="14" y="55" font-size="11" fill="#1a1a2e">SLA classes.</text>
  </g>

  <!-- Layer 4: KV Cache Manager -->
  <g transform="translate(150, 334)">
    <rect x="0" y="0" width="700" height="62" rx="6" fill="#fef3e0" stroke="#7a5e1a" stroke-width="2"/>
    <text x="20" y="26" font-size="15" font-weight="700" fill="#7a5e1a">4. KV Cache Manager</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">PagedAttention: fixed-size blocks, prefix sharing, eviction; treats VRAM like an OS treats RAM.</text>
  </g>
  <g transform="translate(880, 334)">
    <rect x="0" y="0" width="270" height="62" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#7a5e1a">Concern</text>
    <text x="14" y="40" font-size="11" fill="#1a1a2e">VRAM fragmentation,</text>
    <text x="14" y="55" font-size="11" fill="#1a1a2e">cache hit rate, OOM.</text>
  </g>

  <!-- Layer 5: Model Executor -->
  <g transform="translate(150, 412)">
    <rect x="0" y="0" width="700" height="62" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="20" y="26" font-size="15" font-weight="700" fill="#722f8a">5. Model Executor</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Tensor parallel, pipeline parallel, fused kernels (FlashAttention); orchestrates GPUs.</text>
  </g>
  <g transform="translate(880, 412)">
    <rect x="0" y="0" width="270" height="62" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#7a5e1a">Concern</text>
    <text x="14" y="40" font-size="11" fill="#1a1a2e">Kernel launch overhead,</text>
    <text x="14" y="55" font-size="11" fill="#1a1a2e">all-reduce bandwidth.</text>
  </g>

  <!-- Layer 6: GPU Hardware -->
  <g transform="translate(150, 490)">
    <rect x="0" y="0" width="700" height="62" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="26" font-size="15" font-weight="700" fill="#b3401b">6. GPU Hardware</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">SMs, tensor cores, HBM; the only layer that does real arithmetic.</text>
  </g>
  <g transform="translate(880, 490)">
    <rect x="0" y="0" width="270" height="62" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#7a5e1a">Concern</text>
    <text x="14" y="40" font-size="11" fill="#1a1a2e">FLOPs vs HBM bandwidth,</text>
    <text x="14" y="55" font-size="11" fill="#1a1a2e">power, thermal throttling.</text>
  </g>

  <!-- Down arrows between layers -->
  <line x1="500" y1="162" x2="500" y2="178" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="240" x2="500" y2="256" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="318" x2="500" y2="334" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="396" x2="500" y2="412" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="474" x2="500" y2="490" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Vertical labels: request flow / abstraction -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="50" height="452" rx="6" fill="#ffffff" stroke="#5a4a3a" stroke-width="1"/>
    <text x="25" y="100" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a" transform="rotate(-90, 25, 100)">request flows down</text>
    <text x="25" y="350" font-size="11" font-weight="700" text-anchor="middle" fill="#5a4a3a" transform="rotate(-90, 25, 350)">tokens stream up</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="1180" height="70" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">A modern LLM server (vLLM, TGI, SGLang) is a layered system, not a single binary. When you tune throughput or latency, identify</text>
    <text x="20" y="62" font-size="12" fill="#1a1a2e">which layer owns the bottleneck (scheduler? KV cache? kernel?) before reaching for a bigger GPU.</text>
  </g>
</svg>
