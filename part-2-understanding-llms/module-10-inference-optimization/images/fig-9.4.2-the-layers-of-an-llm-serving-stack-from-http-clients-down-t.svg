<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <title>The six layers of an LLM serving stack</title>
  <rect width="1100" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">The LLM serving stack</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Six layers between an HTTP request and a GPU tensor core</text>

  <g transform="translate(150, 100)">
    <rect width="800" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#1a4078">1. HTTP clients</text>
    <text x="400" y="32" font-size="12" text-anchor="middle" fill="#5a4a3a">auth, retries, streaming</text>
  </g>
  <line x1="550" y1="150" x2="550" y2="166" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g transform="translate(150, 168)">
    <rect width="800" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#1a4078">2. API server</text>
    <text x="400" y="32" font-size="12" text-anchor="middle" fill="#5a4a3a">tokenize, validate, OpenAI schema</text>
  </g>
  <line x1="550" y1="218" x2="550" y2="234" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g transform="translate(150, 236)">
    <rect width="800" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#1f7a3a">3. Request scheduler</text>
    <text x="400" y="32" font-size="12" text-anchor="middle" fill="#5a4a3a">continuous batching, tail latency</text>
  </g>
  <line x1="550" y1="286" x2="550" y2="302" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g transform="translate(150, 304)">
    <rect width="800" height="50" rx="6" fill="#fef3e0" stroke="#a67c1a" stroke-width="2"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#a67c1a">4. KV cache manager</text>
    <text x="400" y="32" font-size="12" text-anchor="middle" fill="#5a4a3a">PagedAttention, hit rate</text>
  </g>
  <line x1="550" y1="354" x2="550" y2="370" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g transform="translate(150, 372)">
    <rect width="800" height="50" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#722f8a">5. Model executor</text>
    <text x="400" y="32" font-size="12" text-anchor="middle" fill="#5a4a3a">TP, PP, fused kernels</text>
  </g>
  <line x1="550" y1="422" x2="550" y2="438" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g transform="translate(150, 440)">
    <rect width="800" height="50" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#b3401b">6. GPU hardware</text>
    <text x="400" y="32" font-size="12" text-anchor="middle" fill="#5a4a3a">SMs, tensor cores, HBM</text>
  </g>

  <g transform="translate(60, 100)">
    <rect width="80" height="390" rx="6" fill="#fafbfc" stroke="#888" stroke-width="1"/>
    <text x="40" y="170" font-size="12" font-weight="700" text-anchor="middle" fill="#5a4a3a" transform="rotate(-90, 40, 170)">request down</text>
    <text x="40" y="330" font-size="12" font-weight="700" text-anchor="middle" fill="#5a4a3a" transform="rotate(-90, 40, 330)">tokens up</text>
  </g>

  <g transform="translate(60, 520)">
    <rect width="980" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">A modern LLM server (vLLM, TGI, SGLang) is a layered system, not a single binary.</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">Identify the bottlenecked layer (scheduler? KV cache? kernel?) before reaching for a bigger GPU.</text>
  </g>
</svg>
