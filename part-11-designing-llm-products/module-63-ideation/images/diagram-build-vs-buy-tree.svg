<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" font-family="Helvetica, Arial, sans-serif">
  <rect width="1500" height="1100" fill="#ffffff"/>

  <text x="750" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Build vs Buy: five questions, seven endpoints</text>
  <text x="750" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Walk top to bottom. The first decision is the only one that asks about your product; the rest are constraints.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <polygon points="750,110 980,170 750,230 520,170" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
  <text x="750" y="160" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Q1. Is the use case</text>
  <text x="750" y="180" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">differentiating?</text>
  <text x="750" y="205" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(would a competitor with</text>
  <text x="750" y="219" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">the same vendor be the same?)</text>

  <line x1="660" y1="220" x2="290" y2="290" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="430" y="260" font-size="13" font-weight="700" fill="#1a1a2e">NO (table stakes)</text>

  <line x1="840" y1="220" x2="1210" y2="290" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1060" y="260" font-size="13" font-weight="700" fill="#1a1a2e">YES (differentiating)</text>

  <g transform="translate(140, 295)">
    <rect x="0" y="0" width="320" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="160" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Endpoint A: Pure SaaS</text>
    <text x="160" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">Buy the product (Copilot, Glean, Notion AI)</text>
    <text x="160" y="66" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Days to deploy. $/seat. High lock-in.</text>
  </g>

  <polygon points="1210,290 1430,350 1210,410 990,350" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
  <text x="1210" y="340" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Q2. Data sovereignty</text>
  <text x="1210" y="360" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">required?</text>
  <text x="1210" y="385" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(regulated industry, EU AI Act)</text>

  <line x1="1010" y1="385" x2="780" y2="460" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="870" y="425" font-size="13" font-weight="700" fill="#1a1a2e">NO</text>

  <line x1="1300" y1="400" x2="1340" y2="455" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1340" y="430" font-size="13" font-weight="700" fill="#1a1a2e">YES</text>

  <polygon points="780,460 1010,520 780,580 550,520" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
  <text x="780" y="510" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Q3. Refresh cadence:</text>
  <text x="780" y="530" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">need monthly frontier?</text>
  <text x="780" y="555" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(or is an 18-month-old model OK?)</text>

  <line x1="690" y1="570" x2="430" y2="660" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="540" y="615" font-size="13" font-weight="700" fill="#1a1a2e">YES (need frontier)</text>

  <line x1="870" y1="570" x2="1110" y2="660" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="950" y="620" font-size="13" font-weight="700" fill="#1a1a2e">NO (stable open weights OK)</text>

  <g transform="translate(260, 665)">
    <rect x="0" y="0" width="340" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="170" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Endpoint B: API + thin wrapper</text>
    <text x="170" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">Closed-API model, custom prompt/orchestration</text>
    <text x="170" y="66" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Weeks. $0.50-$30/1M tok. Medium lock.</text>
  </g>

  <polygon points="1110,660 1330,720 1110,780 890,720" fill="#f4ecf7" stroke="#722f8a" stroke-width="2.5"/>
  <text x="1110" y="710" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Q4. Utilization &gt; 50%</text>
  <text x="1110" y="730" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">all day?</text>
  <text x="1110" y="755" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(crossover from section 47.2)</text>

  <line x1="970" y1="755" x2="820" y2="820" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="870" y="800" font-size="13" font-weight="700" fill="#1a1a2e">NO</text>

  <line x1="1250" y1="755" x2="1340" y2="820" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1310" y="800" font-size="13" font-weight="700" fill="#1a1a2e">YES</text>

  <g transform="translate(620, 825)">
    <rect x="0" y="0" width="380" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="190" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Endpoint C: Open weights on managed inference</text>
    <text x="190" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">Together / Fireworks / Groq</text>
    <text x="190" y="66" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Months. $0.20-$2/1M tok. Lower lock.</text>
  </g>

  <g transform="translate(1170, 825)">
    <rect x="0" y="0" width="320" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="160" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Endpoint D: Self-hosted vLLM</text>
    <text x="160" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">Owned GPUs, open weights</text>
    <text x="160" y="66" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Months. $0.05-$1/1M tok. You own it.</text>
  </g>

  <polygon points="1340,455 1500,500 1340,545 1180,500" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
  <text x="1340" y="495" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">Q5. Domain-specific</text>
  <text x="1340" y="512" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">IP differentiator?</text>

  <line x1="1340" y1="545" x2="1340" y2="610" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1280" y="580" font-size="13" font-weight="700" fill="#1a1a2e">YES</text>

  <line x1="1200" y1="525" x2="1340" y2="820" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="1190" y="660" font-size="11" font-style="italic" fill="#5a4a3a">NO falls back to D</text>

  <g transform="translate(1180, 615)">
    <rect x="0" y="0" width="320" height="80" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
    <text x="160" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Endpoint E: Custom fine-tune</text>
    <text x="160" y="48" font-size="12" text-anchor="middle" fill="#1a1a2e">Fine-tune open weights + self-host</text>
    <text x="160" y="66" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Months to quarters. Differentiating IP only.</text>
  </g>

  <g transform="translate(140, 950)">
    <rect x="0" y="0" width="1220" height="110" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="610" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Endpoint F: From-scratch pretraining (almost no one in 2026)</text>
    <text x="610" y="50" font-size="12" text-anchor="middle" fill="#1a1a2e">Reserved for foundation-model labs and a small number of frontier sovereign-AI programs.</text>
    <text x="610" y="68" font-size="12" text-anchor="middle" fill="#1a1a2e">If you arrive here from the tree, re-walk Q1 through Q5: the answer is almost certainly one of A through E.</text>
    <text x="610" y="92" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Time: years. Cost: $10M-$1B+. Vendor risk: zero. Engineering risk: highest in the industry.</text>
  </g>

  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="160" height="120" rx="6" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>
    <text x="80" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Legend</text>
    <polygon points="80,32 110,46 80,60 50,46" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
    <text x="80" y="78" font-size="11" text-anchor="middle" fill="#1a1a2e">Decision</text>
    <rect x="20" y="84" width="120" height="14" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="80" y="94" font-size="10" text-anchor="middle" fill="#1f7a3a">Mainstream endpoint</text>
    <rect x="20" y="102" width="120" height="14" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="80" y="112" font-size="10" text-anchor="middle" fill="#b3401b">Niche endpoint</text>
  </g>
</svg>
