<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrDot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a5e1a"/>
    </marker>
  </defs>
  <text x="650" y="38" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a2e">Building a Domain-Specific Tokenizer</text>
  <text x="650" y="62" font-size="13" text-anchor="middle" fill="#5a4a3a" font-style="italic">Domain rules guide pre-tokenization; BPE learns merges; the new vocab is fused with the base tokenizer.</text>

  <!-- Pipeline (left to right) -->
  <g transform="translate(40, 110)">
    <!-- Raw -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="180" height="80" rx="8" fill="#1a1a2e" stroke="#0f3460"/>
      <text x="90" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Raw domain text</text>
      <text x="90" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#ffffff">proteins, code,</text>
      <text x="90" y="64" font-size="11" font-style="italic" text-anchor="middle" fill="#ffffff">molecules, DNA, ...</text>
    </g>

    <!-- Pre-tokenizer -->
    <g transform="translate(220, 50)">
      <rect x="0" y="0" width="200" height="100" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="100" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">1. Pre-tokenizer</text>
      <text x="100" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">domain-specific rules</text>
      <text x="100" y="64" font-size="11" text-anchor="middle" fill="#1a1a2e">split on codons,</text>
      <text x="100" y="78" font-size="11" text-anchor="middle" fill="#1a1a2e">amino acids, SMILES bonds,</text>
      <text x="100" y="92" font-size="11" text-anchor="middle" fill="#1a1a2e">code indents, etc.</text>
    </g>

    <!-- Train -->
    <g transform="translate(460, 50)">
      <rect x="0" y="0" width="200" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="100" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. BPE / Unigram</text>
      <text x="100" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">learn merges on corpus</text>
      <text x="100" y="68" font-size="11" text-anchor="middle" fill="#1a1a2e">iteratively merge most</text>
      <text x="100" y="82" font-size="11" text-anchor="middle" fill="#1a1a2e">frequent token pairs</text>
    </g>

    <!-- Vocab -->
    <g transform="translate(700, 50)">
      <rect x="0" y="0" width="200" height="100" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
      <text x="100" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">3. Domain vocab</text>
      <text x="100" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">domain-specific subwords</text>
      <text x="100" y="68" font-size="11" text-anchor="middle" fill="#1a1a2e">e.g. "MKTL", "(=O)",</text>
      <text x="100" y="82" font-size="11" text-anchor="middle" fill="#1a1a2e">"def", "ATG"</text>
    </g>

    <!-- Merge -->
    <g transform="translate(940, 50)">
      <rect x="0" y="0" width="200" height="100" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="100" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">4. Vocab merge</text>
      <text x="100" y="44" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">union with base tokenizer</text>
      <text x="100" y="68" font-size="11" text-anchor="middle" fill="#1a1a2e">avoid id collisions,</text>
      <text x="100" y="82" font-size="11" text-anchor="middle" fill="#1a1a2e">resize embedding matrix</text>
    </g>

    <!-- Final -->
    <g transform="translate(1180, 60)">
      <rect x="0" y="0" width="80" height="80" rx="8" fill="#1a1a2e" stroke="#0f3460"/>
      <text x="40" y="32" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">Final</text>
      <text x="40" y="48" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">tokenizer</text>
      <text x="40" y="66" font-size="11" font-style="italic" text-anchor="middle" fill="#ffffff">NL + domain</text>
    </g>

    <!-- Arrows -->
    <line x1="180" y1="100" x2="218" y2="100" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="420" y1="100" x2="458" y2="100" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="439" y="92" font-size="11" text-anchor="middle" fill="#5a4a3a">domain units</text>
    <line x1="660" y1="100" x2="698" y2="100" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="679" y="92" font-size="11" text-anchor="middle" fill="#5a4a3a">learned merges</text>
    <line x1="900" y1="100" x2="938" y2="100" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="1140" y1="100" x2="1178" y2="100" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Domain examples row (below) -->
  <g transform="translate(40, 320)">
    <text x="610" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Example pre-tokenization rules per domain</text>
    <text x="610" y="20" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">these inform the rules box upstream</text>

    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="290" height="120" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
      <text x="145" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Proteins</text>
      <text x="14" y="46" font-size="11" fill="#1a1a2e">Sequence: M K T L V P E ...</text>
      <text x="14" y="64" font-size="11" fill="#1a1a2e">Rule: split per residue</text>
      <text x="14" y="82" font-size="11" fill="#1a1a2e">Tokens: ['MKTL', 'VP', 'E', ...]</text>
      <text x="14" y="104" font-size="11" font-style="italic" fill="#5a4a3a">20 amino acids form a tight alphabet</text>
    </g>

    <g transform="translate(310, 40)">
      <rect x="0" y="0" width="290" height="120" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
      <text x="145" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Code</text>
      <text x="14" y="46" font-size="11" fill="#1a1a2e">Source: def f(x): return x</text>
      <text x="14" y="64" font-size="11" fill="#1a1a2e">Rule: split keywords + indent</text>
      <text x="14" y="82" font-size="11" fill="#1a1a2e">Tokens: ['def', ' f(', 'x', '):', 'return']</text>
      <text x="14" y="104" font-size="11" font-style="italic" fill="#5a4a3a">indentation matters in Python</text>
    </g>

    <g transform="translate(620, 40)">
      <rect x="0" y="0" width="290" height="120" rx="8" fill="#fef3e0" stroke="#7a5e1a" stroke-width="1.5"/>
      <text x="145" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5e1a">Chemistry (SMILES)</text>
      <text x="14" y="46" font-size="11" fill="#1a1a2e">String: CC(=O)O</text>
      <text x="14" y="64" font-size="11" fill="#1a1a2e">Rule: split on bonds, brackets</text>
      <text x="14" y="82" font-size="11" fill="#1a1a2e">Tokens: ['C', 'C', '(=O)', 'O']</text>
      <text x="14" y="104" font-size="11" font-style="italic" fill="#5a4a3a">[NH], [O-] are atomic units</text>
    </g>

    <g transform="translate(930, 40)">
      <rect x="0" y="0" width="290" height="120" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.5"/>
      <text x="145" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">DNA</text>
      <text x="14" y="46" font-size="11" fill="#1a1a2e">Sequence: ATGGCCAATCG...</text>
      <text x="14" y="64" font-size="11" fill="#1a1a2e">Rule: 3-mer (codon) split</text>
      <text x="14" y="82" font-size="11" fill="#1a1a2e">Tokens: ['ATG', 'GCC', 'AAT', 'CG']</text>
      <text x="14" y="104" font-size="11" font-style="italic" fill="#5a4a3a">k-mers preserve reading frame</text>
    </g>
  </g>

  <!-- Dotted "inform rules" arrow from examples up to Pre-tokenizer -->
  <path d="M 610 360 C 610 240, 360 240, 360 222" fill="none" stroke="#7a5e1a" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrDot)"/>
  <text x="430" y="252" font-size="11" font-weight="700" fill="#7a5e1a">examples inform pre-tokenizer rules</text>

  <!-- Why / Use-when callout -->
  <g transform="translate(40, 510)">
    <rect x="0" y="0" width="600" height="98" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#7a5e1a">Use a domain tokenizer when</text>
    <text x="14" y="44" font-size="11" fill="#1a1a2e">- The base tokenizer (GPT-2, Llama) shatters domain strings into many tokens.</text>
    <text x="14" y="60" font-size="11" fill="#1a1a2e">- Common domain motifs (codons, SMILES atoms, code keywords) deserve a single id.</text>
    <text x="14" y="76" font-size="11" fill="#1a1a2e">- You will pre-train or continue-train, so you can resize the embedding matrix.</text>
    <text x="14" y="92" font-size="11" font-style="italic" fill="#5a4a3a">A halved sequence length cuts both training cost and inference latency.</text>
  </g>

  <g transform="translate(660, 510)">
    <rect x="0" y="0" width="600" height="98" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#b3401b">Pitfalls to avoid</text>
    <text x="14" y="44" font-size="11" fill="#1a1a2e">- Vocab id collisions when merging; always offset new ids past the base vocab.</text>
    <text x="14" y="60" font-size="11" fill="#1a1a2e">- Forgetting to expand the embedding and unembedding matrices to the new size.</text>
    <text x="14" y="76" font-size="11" fill="#1a1a2e">- Training merges on a tiny corpus, leading to under-merged, brittle vocabulary.</text>
    <text x="14" y="92" font-size="11" font-style="italic" fill="#5a4a3a">Aim for at least tens of millions of tokens of in-domain training data.</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 626)">
    <rect x="0" y="0" width="1220" height="56" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="44" font-size="12" fill="#1a1a2e">A domain tokenizer is a four-step pipeline: rule-based pre-tokenization, BPE/Unigram merge learning, domain-vocabulary extraction, and fusion with the base vocab so the model can read both English and your domain in the same forward pass.</text>
  </g>
</svg>
