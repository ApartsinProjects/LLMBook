<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="760" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Serious forecasters disagree by a factor of two</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Five published AGI-timeline positions, May 2026. Bars show median and 25-75% interval where stated.</text>

  <line x1="180" y1="630" x2="1320" y2="630" stroke="#1a1a2e" stroke-width="2.5"/>

  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="180" y1="160" x2="180" y2="630"/>
    <line x1="294" y1="160" x2="294" y2="630"/>
    <line x1="408" y1="160" x2="408" y2="630"/>
    <line x1="522" y1="160" x2="522" y2="630"/>
    <line x1="636" y1="160" x2="636" y2="630"/>
    <line x1="750" y1="160" x2="750" y2="630"/>
    <line x1="864" y1="160" x2="864" y2="630"/>
    <line x1="978" y1="160" x2="978" y2="630"/>
    <line x1="1092" y1="160" x2="1092" y2="630"/>
    <line x1="1206" y1="160" x2="1206" y2="630"/>
    <line x1="1320" y1="160" x2="1320" y2="630"/>
  </g>
  <g font-size="12" font-weight="700" fill="#5a4a3a" text-anchor="middle">
    <text x="180" y="652">2026</text>
    <text x="294" y="652">2027</text>
    <text x="408" y="652">2028</text>
    <text x="522" y="652">2029</text>
    <text x="636" y="652">2030</text>
    <text x="750" y="652">2031</text>
    <text x="864" y="652">2032</text>
    <text x="978" y="652">2033</text>
    <text x="1092" y="652">2034</text>
    <text x="1206" y="652">2035</text>
  </g>

  <g>
    <text x="160" y="195" font-size="13" font-weight="700" text-anchor="end" fill="#1a1a2e">Amodei (Anthropic)</text>
    <text x="160" y="211" font-size="11" font-style="italic" text-anchor="end" fill="#b3401b">Bullish</text>
    <rect x="180" y="186" width="280" height="22" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <line x1="237" y1="180" x2="237" y2="214" stroke="#b3401b" stroke-width="3.5"/>
    <text x="290" y="178" font-size="11" font-style="italic" fill="#b3401b">median ~2026-27</text>
  </g>

  <g>
    <text x="160" y="275" font-size="13" font-weight="700" text-anchor="end" fill="#1a1a2e">Hassabis (DeepMind)</text>
    <text x="160" y="291" font-size="11" font-style="italic" text-anchor="end" fill="#1f7a3a">Mainstream</text>
    <rect x="408" y="266" width="570" height="22" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <line x1="636" y1="260" x2="636" y2="294" stroke="#1f7a3a" stroke-width="3.5"/>
    <text x="640" y="258" font-size="11" font-style="italic" fill="#1f7a3a">median 2030</text>
  </g>

  <g>
    <text x="160" y="355" font-size="13" font-weight="700" text-anchor="end" fill="#1a1a2e">Metaculus median</text>
    <text x="160" y="371" font-size="11" font-style="italic" text-anchor="end" fill="#1f7a3a">Mainstream</text>
    <rect x="522" y="346" width="456" height="22" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <line x1="429" y1="340" x2="429" y2="374" stroke="#1f7a3a" stroke-width="3.5"/>
    <text x="437" y="338" font-size="11" font-style="italic" fill="#1f7a3a">median March 2028</text>
  </g>

  <g>
    <text x="160" y="435" font-size="13" font-weight="700" text-anchor="end" fill="#1a1a2e">Polymarket</text>
    <text x="160" y="451" font-size="11" font-style="italic" text-anchor="end" fill="#1a4078">Skeptical</text>
    <rect x="294" y="426" width="114" height="22" fill="#eef4fa" stroke="#1a4078" stroke-width="2" opacity="0.45"/>
    <text x="290" y="418" font-size="11" font-style="italic" fill="#1a4078">only 9% to 2027</text>
    <text x="464" y="442" font-size="11" font-style="italic" fill="#5a4a3a">(market-implied bearish)</text>
  </g>

  <g>
    <text x="160" y="515" font-size="13" font-weight="700" text-anchor="end" fill="#1a1a2e">80,000 Hours synthesis</text>
    <text x="160" y="531" font-size="11" font-style="italic" text-anchor="end" fill="#1f7a3a">Mainstream</text>
    <rect x="294" y="506" width="912" height="22" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <line x1="465" y1="500" x2="465" y2="534" stroke="#1f7a3a" stroke-width="3.5"/>
    <text x="475" y="498" font-size="11" font-style="italic" fill="#1f7a3a">median 2028-30</text>
  </g>

  <g transform="translate(180, 130)">
    <rect x="0" y="0" width="180" height="20" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="90" y="14" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">Bullish (2026-28)</text>
  </g>
  <g transform="translate(380, 130)">
    <rect x="0" y="0" width="180" height="20" rx="4" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="90" y="14" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">Mainstream (2028-33)</text>
  </g>
  <g transform="translate(580, 130)">
    <rect x="0" y="0" width="180" height="20" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="90" y="14" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">Skeptical (post-2033)</text>
  </g>
  <g transform="translate(780, 130)">
    <line x1="0" y1="10" x2="20" y2="10" stroke="#1a1a2e" stroke-width="3.5"/>
    <text x="28" y="14" font-size="11" fill="#1a1a2e">median</text>
    <rect x="80" y="0" width="20" height="20" fill="none" stroke="#1a1a2e" stroke-width="2"/>
    <text x="108" y="14" font-size="11" fill="#1a1a2e">25 to 75% interval</text>
  </g>

  <g transform="translate(180, 680)">
    <rect x="0" y="0" width="1140" height="58" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#a67c1a">Takeaway</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">The 2027 to 2033 spread is not a single uncertainty; it is a definitional gap. "Powerful AI" (Amodei), "human-level on most tasks"</text>
    <text x="20" y="56" font-size="12" fill="#1a1a2e">(Hassabis), and the Metaculus general-AI question all describe different thresholds. Track capabilities, not the headline year.</text>
  </g>
</svg>
