<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="900" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Frontier alignment ships as a layered defense, not a single fix</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Three production layers, three attack classes. No single layer catches everything; depth is the point.</text>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/>
    </marker>
    <marker id="arr-blk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <g transform="translate(540, 120)">
    <rect x="0" y="0" width="320" height="100" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="160" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Attack 1: jailbreak prompt</text>
    <text x="160" y="56" font-size="12" text-anchor="middle" fill="#1a1a2e">"ignore prior instructions..."</text>
    <text x="160" y="76" font-size="12" text-anchor="middle" fill="#1a1a2e">role-play / DAN / context-hop</text>
    <text x="160" y="93" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">aimed at the surface prompt</text>
  </g>

  <g transform="translate(160, 240)">
    <rect x="0" y="0" width="320" height="100" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="160" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Attack 2: prompt injection</text>
    <text x="160" y="56" font-size="12" text-anchor="middle" fill="#1a1a2e">malicious instructions hidden</text>
    <text x="160" y="76" font-size="12" text-anchor="middle" fill="#1a1a2e">inside retrieved or tool data</text>
    <text x="160" y="93" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">aimed at the inner reasoning</text>
  </g>

  <g transform="translate(920, 240)">
    <rect x="0" y="0" width="320" height="100" rx="8" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="160" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">Attack 3: unsafe completion</text>
    <text x="160" y="56" font-size="12" text-anchor="middle" fill="#1a1a2e">PII / CSAM / weapon synthesis</text>
    <text x="160" y="76" font-size="12" text-anchor="middle" fill="#1a1a2e">surfaces despite earlier filters</text>
    <text x="160" y="93" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">aimed at the output channel</text>
  </g>

  <g transform="translate(280, 390)">
    <rect x="0" y="0" width="840" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="420" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Layer 1: RLHF / RLAIF (training-time)</text>
    <text x="420" y="52" font-size="13" text-anchor="middle" fill="#1a1a2e">Reward-modeled or constitution-supervised preference learning baked into the weights.</text>
    <text x="420" y="72" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Catches: medium cases (deceptive completions, common jailbreak patterns).</text>
    <text x="420" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Section 32.x / Chapter 25 stack</text>
  </g>

  <g transform="translate(280, 530)">
    <rect x="0" y="0" width="840" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="420" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Layer 2: Constitution / SAE steering (inference-time)</text>
    <text x="420" y="52" font-size="13" text-anchor="middle" fill="#1a1a2e">System-prompt constitution (Anthropic) or SAE feature clamps (Golden Gate -&gt; cross-layer transcoder).</text>
    <text x="420" y="72" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Catches: hard cases (subtle values misalignment, hallucinated authority).</text>
    <text x="420" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Constitutional AI / C3AI / SAE production work</text>
  </g>

  <g transform="translate(280, 670)">
    <rect x="0" y="0" width="840" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="420" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Layer 3: Output classifier (post-generation)</text>
    <text x="420" y="52" font-size="13" text-anchor="middle" fill="#1a1a2e">Independent model + regex screen for hard-prohibited content.</text>
    <text x="420" y="72" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Catches: easy cases (PII, CSAM, weapon synthesis instructions).</text>
    <text x="420" y="90" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Operates on the rendered output before it ships to the user.</text>
  </g>

  <line x1="700" y1="220" x2="700" y2="388" stroke="#b3401b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="710" y="305" font-size="11" font-style="italic" fill="#b3401b">to weights</text>

  <line x1="320" y1="340" x2="500" y2="530" stroke="#b3401b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="330" y="450" font-size="11" font-style="italic" fill="#b3401b">to inner reasoning</text>

  <line x1="1080" y1="340" x2="900" y2="670" stroke="#b3401b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="1010" y="500" font-size="11" font-style="italic" fill="#b3401b">to output channel</text>

  <line x1="700" y1="490" x2="700" y2="528" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr-blk)"/>
  <line x1="700" y1="630" x2="700" y2="668" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr-blk)"/>

  <g transform="translate(60, 390)">
    <rect x="0" y="0" width="200" height="120" rx="6" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>
    <text x="100" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Legend</text>
    <line x1="14" y1="36" x2="42" y2="36" stroke="#b3401b" stroke-width="3"/>
    <polygon points="42,32 50,36 42,40" fill="#b3401b"/>
    <text x="56" y="40" font-size="11" fill="#1a1a2e">attack vector</text>
    <line x1="14" y1="58" x2="42" y2="58" stroke="#1a1a2e" stroke-width="2"/>
    <polygon points="42,54 50,58 42,62" fill="#1a1a2e"/>
    <text x="56" y="62" font-size="11" fill="#1a1a2e">forward control flow</text>
    <rect x="14" y="78" width="14" height="14" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="34" y="90" font-size="11" fill="#1a1a2e">attack class</text>
    <rect x="14" y="98" width="14" height="14" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="34" y="110" font-size="11" fill="#1a1a2e">defense layer</text>
  </g>

  <g transform="translate(1160, 390)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="110" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">User-facing API</text>
    <text x="110" y="42" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">final completion</text>
  </g>

  <line x1="1120" y1="720" x2="1170" y2="445" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr-blk)"/>

  <g transform="translate(60, 815)">
    <rect x="0" y="0" width="1280" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#a67c1a">Why three layers, not one</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">Each layer catches a different class of failure. A jailbreak that bypasses RLHF may still trip the output classifier; a prompt injection that slips past the constitution still has to clear</text>
    <text x="20" y="56" font-size="12" fill="#1a1a2e">the regex/classifier screen. Depth is what makes commercial APIs robust at production scale.</text>
  </g>
</svg>
