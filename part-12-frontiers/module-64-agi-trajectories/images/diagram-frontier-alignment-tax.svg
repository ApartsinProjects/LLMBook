<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">The alignment tax has shrunk to zero (or reversed) by 2026</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Capability score before vs after the alignment recipe applied. Bars are paired by lab and year.</text>

  <!-- Chart area: x=160..1240 (1080 wide), y=140..620 (480 tall) -->
  <!-- y axis = capability score 50-90 (40-point range). y_px = 620 - (v-50)/40 * 480 -->

  <text x="60" y="385" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 60 385)">Aggregate capability score (% on MT-Bench / MMLU / GSM8K composite)</text>

  <!-- gridlines: 50, 60, 70, 80, 90 -->
  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="160" y1="620" x2="1240" y2="620"/>
    <line x1="160" y1="500" x2="1240" y2="500"/>
    <line x1="160" y1="380" x2="1240" y2="380"/>
    <line x1="160" y1="260" x2="1240" y2="260"/>
    <line x1="160" y1="140" x2="1240" y2="140"/>
  </g>
  <g font-size="11" fill="#5a4a3a" text-anchor="end">
    <text x="152" y="624">50%</text>
    <text x="152" y="504">60%</text>
    <text x="152" y="384">70%</text>
    <text x="152" y="264">80%</text>
    <text x="152" y="144">90%</text>
  </g>

  <line x1="160" y1="140" x2="160" y2="620" stroke="#1a1a2e" stroke-width="1.2"/>
  <line x1="160" y1="620" x2="1240" y2="620" stroke="#1a1a2e" stroke-width="1.2"/>

  <!-- Bars: 5 paired bars across x.
       Pair groups centered at x = 270, 470, 670, 870, 1070 with paired bars of width 50 each.
       Base bar left edge: cx-55, aligned bar right edge: cx+55. -->

  <!-- Year labels above each pair -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">
    <text x="270" y="115">2022</text>
    <text x="470" y="115">2023</text>
    <text x="670" y="115">2024</text>
    <text x="870" y="115">2025</text>
    <text x="1070" y="115">2026</text>
  </g>

  <!-- Labels below each pair -->
  <g font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a2e">
    <text x="270" y="650">Anthropic</text>
    <text x="270" y="664" font-size="10" font-weight="400" fill="#5a4a3a">Claude 1 (CAI v1)</text>

    <text x="470" y="650">OpenAI</text>
    <text x="470" y="664" font-size="10" font-weight="400" fill="#5a4a3a">GPT-3.5 (RLHF)</text>

    <text x="670" y="650">Meta</text>
    <text x="670" y="664" font-size="10" font-weight="400" fill="#5a4a3a">Llama-2 (RLHF + DPO)</text>

    <text x="870" y="650">DeepSeek</text>
    <text x="870" y="664" font-size="10" font-weight="400" fill="#5a4a3a">DeepSeek-R1 (GRPO)</text>

    <text x="1070" y="650">Anthropic</text>
    <text x="1070" y="664" font-size="10" font-weight="400" fill="#5a4a3a">Claude Opus 4.6 (CAI v3 + SAE)</text>
  </g>

  <!-- Pair 1: 2022 Anthropic CAI v1 - base 65, aligned 60 (5-pt tax) -->
  <!-- base=65: y=620-15/40*480 = 620-180 = 440. height=180 -->
  <!-- aligned=60: y=620-10/40*480 = 620-120 = 500. height=120 -->
  <rect x="215" y="440" width="50" height="180" fill="#5a7da6"/>
  <rect x="275" y="500" width="50" height="120" fill="#0f3460"/>
  <text x="240" y="432" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">65</text>
  <text x="300" y="492" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">60</text>
  <!-- gap annotation -->
  <line x1="265" y1="440" x2="275" y2="500" stroke="#a23434" stroke-width="1.5"/>
  <text x="350" y="475" font-size="11" font-weight="700" fill="#a23434">-5 pts tax</text>

  <!-- Pair 2: 2023 OpenAI GPT-3.5 - base 70, aligned 67 (3-pt tax) -->
  <rect x="415" y="380" width="50" height="240" fill="#5a7da6"/>
  <rect x="475" y="416" width="50" height="204" fill="#0f3460"/>
  <text x="440" y="372" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">70</text>
  <text x="500" y="408" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">67</text>
  <line x1="465" y1="380" x2="475" y2="416" stroke="#a23434" stroke-width="1.5"/>
  <text x="550" y="403" font-size="11" font-weight="700" fill="#a23434">-3 pts tax</text>

  <!-- Pair 3: 2024 Meta Llama-2 - base 73, aligned 72 (1-pt tax, nearly closed) -->
  <rect x="615" y="344" width="50" height="276" fill="#5a7da6"/>
  <rect x="675" y="356" width="50" height="264" fill="#0f3460"/>
  <text x="640" y="336" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">73</text>
  <text x="700" y="348" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">72</text>
  <line x1="665" y1="344" x2="675" y2="356" stroke="#c89c3c" stroke-width="1.5"/>
  <text x="750" y="352" font-size="11" font-weight="700" fill="#c89c3c">-1 pt tax</text>

  <!-- Pair 4: 2025 DeepSeek-R1 - base 78, aligned 81 (3-pt gain!) -->
  <rect x="815" y="284" width="50" height="336" fill="#5a7da6"/>
  <rect x="875" y="248" width="50" height="372" fill="#0f3460"/>
  <text x="840" y="276" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">78</text>
  <text x="900" y="240" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">81</text>
  <line x1="865" y1="284" x2="875" y2="248" stroke="#4a7c5a" stroke-width="1.5"/>
  <text x="950" y="266" font-size="11" font-weight="700" fill="#4a7c5a">+3 pts gain</text>

  <!-- Pair 5: 2026 Anthropic Opus 4.6 - base 82, aligned 88 (6-pt gain) -->
  <rect x="1015" y="236" width="50" height="384" fill="#5a7da6"/>
  <rect x="1075" y="164" width="50" height="456" fill="#0f3460"/>
  <text x="1040" y="228" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">82</text>
  <text x="1100" y="156" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">88</text>
  <line x1="1065" y1="236" x2="1075" y2="164" stroke="#4a7c5a" stroke-width="1.5"/>
  <text x="1150" y="200" font-size="11" font-weight="700" fill="#4a7c5a">+6 pts gain</text>

  <!-- Trend arrow showing direction across years -->
  <defs>
    <marker id="aligntax-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a23434"/>
    </marker>
  </defs>
  <path d="M 350 460 Q 700 380 1120 200" fill="none" stroke="#a23434" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#aligntax-arrow)" opacity="0.45"/>

  <!-- Legend -->
  <g transform="translate(160, 686)">
    <rect x="0" y="0" width="20" height="14" fill="#5a7da6"/>
    <text x="28" y="12" font-size="12" fill="#1a1a2e">base model (no alignment)</text>
    <rect x="220" y="0" width="20" height="14" fill="#0f3460"/>
    <text x="248" y="12" font-size="12" fill="#1a1a2e">aligned model (RLHF / CAI / GRPO)</text>
    <line x1="500" y1="7" x2="540" y2="7" stroke="#a23434" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="548" y="12" font-size="12" fill="#1a1a2e">tax-to-bonus trend</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="160" y="720" width="1080" height="76" fill="#f7f9fc" stroke="#0f3460" stroke-width="1.2" rx="3"/>
  <text x="700" y="744" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Alignment used to be a trade-off; now it is a co-benefit</text>
  <text x="700" y="766" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Through 2022-23, RLHF cost a few capability points. By 2024, the gap closed. From 2025 on, well-aligned models outperform their bases because</text>
  <text x="700" y="782" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">the alignment recipe (CAI v3, GRPO, SAE steering) also improves instruction-following, reasoning, and refusal calibration.</text>
</svg>
