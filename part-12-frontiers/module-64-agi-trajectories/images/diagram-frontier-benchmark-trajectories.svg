<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Saturating yesterday's benchmark, climbing today's: frontier scores 2023-2026</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Top-of-leaderboard scores by quarter, single best general-purpose model. Dashed lines mark expert-human baselines.</text>

  <!-- Chart area: x=160..1240 (1080 wide), y=130..640 (510 tall) -->
  <!-- x = quarters from Q1 2023 to Q2 2026 (14 quarters); x_px = 160 + (q/13)*1080 -->
  <!-- y = 0 to 100%; y_px = 640 - (v/100)*510 -->

  <text x="60" y="385" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 60 385)">Top frontier-model score (%)</text>

  <!-- gridlines: 0, 20, 40, 60, 80, 100 -->
  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="160" y1="640" x2="1240" y2="640"/>
    <line x1="160" y1="538" x2="1240" y2="538"/>
    <line x1="160" y1="436" x2="1240" y2="436"/>
    <line x1="160" y1="334" x2="1240" y2="334"/>
    <line x1="160" y1="232" x2="1240" y2="232"/>
    <line x1="160" y1="130" x2="1240" y2="130"/>
  </g>
  <g font-size="11" fill="#5a4a3a" text-anchor="end">
    <text x="152" y="644">0%</text>
    <text x="152" y="542">20%</text>
    <text x="152" y="440">40%</text>
    <text x="152" y="338">60%</text>
    <text x="152" y="236">80%</text>
    <text x="152" y="134">100%</text>
  </g>

  <!-- x-axis: quarters -->
  <line x1="160" y1="640" x2="1240" y2="640" stroke="#1a1a2e" stroke-width="1.2"/>
  <line x1="160" y1="130" x2="160" y2="640" stroke="#1a1a2e" stroke-width="1.2"/>

  <g font-size="11" fill="#5a4a3a" text-anchor="middle">
    <text x="160" y="660">Q1'23</text>
    <text x="243" y="660">Q3'23</text>
    <text x="326" y="660">Q1'24</text>
    <text x="409" y="660">Q3'24</text>
    <text x="492" y="660">Q1'25</text>
    <text x="575" y="660">Q3'25</text>
    <text x="658" y="660">Q1'26</text>
    <text x="741" y="660">Q3'26 (proj.)</text>
  </g>

  <!-- Expert-human baselines (dashed) -->
  <line x1="160" y1="181" x2="1240" y2="181" stroke="#888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="1248" y="184" font-size="10" fill="#666">expert ~90%</text>

  <!-- Series. Quarters: Q1'23=0, Q2=1, Q3=2, Q4=3, Q1'24=4, Q2=5, Q3=6, Q4=7, Q1'25=8, Q2=9, Q3=10, Q4=11, Q1'26=12, Q2=13 -->
  <!-- x_px(q) = 160 + q * (1080/13) = 160 + q * 83.08 -->
  <!-- y_px(v) = 640 - v * 5.1 -->

  <!-- MMLU (saturating, green dotted - was the old benchmark) -->
  <polyline points="160,355 243,304 326,253 409,212 492,191 575,176 658,166 741,161"
            fill="none" stroke="#888" stroke-width="2.5" stroke-dasharray="4,4"/>
  <g fill="#888" stroke="#888">
    <circle cx="160" cy="355" r="4"/>
    <circle cx="243" cy="304" r="4"/>
    <circle cx="326" cy="253" r="4"/>
    <circle cx="409" cy="212" r="4"/>
    <circle cx="492" cy="191" r="4"/>
    <circle cx="575" cy="176" r="4"/>
    <circle cx="658" cy="166" r="4"/>
  </g>
  <text x="745" y="160" font-size="11" font-weight="700" fill="#888">MMLU (saturated)</text>

  <!-- SWE-bench Verified -->
  <polyline points="409,615 492,580 575,498 658,386 741,232 820,191"
            fill="none" stroke="#4a7c5a" stroke-width="3"/>
  <g fill="#4a7c5a" stroke="#4a7c5a">
    <circle cx="409" cy="615" r="5"/>
    <circle cx="492" cy="580" r="5"/>
    <circle cx="575" cy="498" r="5"/>
    <circle cx="658" cy="386" r="5"/>
    <circle cx="741" cy="232" r="5"/>
  </g>
  <text x="745" y="222" font-size="11" font-weight="700" fill="#4a7c5a">SWE-bench Verified</text>

  <!-- GPQA Diamond -->
  <polyline points="160,558 243,538 326,477 409,406 492,304 575,253 658,212 741,191"
            fill="none" stroke="#c89c3c" stroke-width="3"/>
  <g fill="#c89c3c" stroke="#c89c3c">
    <circle cx="160" cy="558" r="5"/>
    <circle cx="326" cy="477" r="5"/>
    <circle cx="492" cy="304" r="5"/>
    <circle cx="658" cy="212" r="5"/>
    <circle cx="741" cy="191" r="5"/>
  </g>
  <text x="745" y="186" font-size="11" font-weight="700" fill="#c89c3c">GPQA Diamond</text>

  <!-- HLE (newest, steep recent climb) -->
  <polyline points="492,630 575,614 658,569 741,412"
            fill="none" stroke="#0f3460" stroke-width="3.5"/>
  <g fill="#0f3460" stroke="#0f3460">
    <circle cx="492" cy="630" r="5"/>
    <circle cx="575" cy="614" r="5"/>
    <circle cx="658" cy="569" r="5"/>
    <circle cx="741" cy="412" r="6"/>
  </g>
  <text x="500" y="613" font-size="10" fill="#0f3460">launch Jan'25</text>
  <text x="640" y="402" font-size="10" font-weight="700" fill="#0f3460">Gemini 3.1 Pro 44.7%</text>
  <text x="745" y="416" font-size="11" font-weight="700" fill="#0f3460">HLE</text>

  <!-- FrontierMath -->
  <polyline points="492,630 575,625 658,605 741,492"
            fill="none" stroke="#a23434" stroke-width="3"/>
  <g fill="#a23434" stroke="#a23434">
    <circle cx="492" cy="630" r="5"/>
    <circle cx="575" cy="625" r="5"/>
    <circle cx="658" cy="605" r="5"/>
    <circle cx="741" cy="492" r="5"/>
  </g>
  <text x="745" y="496" font-size="11" font-weight="700" fill="#a23434">FrontierMath</text>

  <!-- ARC-AGI-2 -->
  <polyline points="409,635 492,625 575,580 658,548 741,304"
            fill="none" stroke="#7c3aed" stroke-width="3"/>
  <g fill="#7c3aed" stroke="#7c3aed">
    <circle cx="409" cy="635" r="5"/>
    <circle cx="492" cy="625" r="5"/>
    <circle cx="575" cy="580" r="5"/>
    <circle cx="658" cy="548" r="5"/>
    <circle cx="741" cy="304" r="5"/>
  </g>
  <text x="745" y="308" font-size="11" font-weight="700" fill="#7c3aed">ARC-AGI-2 (high-budget)</text>

  <!-- Annotation: launch markers -->
  <line x1="492" y1="640" x2="492" y2="660" stroke="#0f3460" stroke-width="1.2"/>
  <line x1="492" y1="640" x2="492" y2="110" stroke="#0f3460" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <text x="490" y="106" font-size="10" font-weight="700" text-anchor="end" fill="#0f3460">HLE / FrontierMath launch (Jan 2025)</text>

  <!-- Right edge labels with current scores -->
  <g font-size="11">
    <rect x="745" y="151" width="180" height="14" fill="#ffffff" opacity="0.85"/>
    <rect x="745" y="178" width="180" height="14" fill="#ffffff" opacity="0.85"/>
    <rect x="745" y="213" width="180" height="14" fill="#ffffff" opacity="0.85"/>
    <rect x="745" y="295" width="180" height="14" fill="#ffffff" opacity="0.85"/>
    <rect x="745" y="405" width="180" height="14" fill="#ffffff" opacity="0.85"/>
    <rect x="745" y="487" width="180" height="14" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Bottom takeaway -->
  <rect x="160" y="690" width="1080" height="100" fill="#f7f9fc" stroke="#0f3460" stroke-width="1.2" rx="3"/>
  <text x="700" y="716" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Each new benchmark launches "hard", saturates, and is replaced</text>
  <text x="700" y="738" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">MMLU is essentially solved (mid-90s). GPQA Diamond and SWE-bench are sliding past expert-human baselines.</text>
  <text x="700" y="754" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">HLE (launched Jan 2025) saw the steepest climb in benchmark history: 8% to 44.7% in 15 months. FrontierMath and ARC-AGI-2 are flatter:</text>
  <text x="700" y="770" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">they are the hardest signals the field has. Watch all three together; a model that moves only one has likely been optimised to that one.</text>
  <text x="700" y="786" font-size="11" font-style="italic" text-anchor="middle" fill="#888">Sources: artificialanalysis.ai · arcprize.org · epoch.ai · papers cited in 64.1.</text>
</svg>
