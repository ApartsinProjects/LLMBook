<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Augmentation dominates in aggregate, displacement is concentrated in specific roles</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Left: Anthropic 2025 labor-market study (Claude usage logs). Right: workforce contraction in 2025 within aggressive-adopter firms.</text>

  <!-- LEFT PANEL: Aggregate stacked bar -->
  <g transform="translate(0, 0)">
    <text x="290" y="120" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">Aggregate (Claude usage, all roles)</text>
    <text x="290" y="142" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Anthropic Economic Index, Dec 2025</text>

    <!-- Single stacked horizontal bar -->
    <g transform="translate(70, 180)">
      <!-- automation slice (21.3%) -->
      <rect x="0" y="0" width="93.7" height="60" fill="#a23434"/>
      <text x="47" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">21.3%</text>
      <text x="47" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#a23434">automation</text>
      <text x="47" y="96" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">model executes,</text>
      <text x="47" y="110" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">minimal review</text>

      <!-- augmentation slice (78.7%) -->
      <rect x="93.7" y="0" width="346.3" height="60" fill="#0f3460"/>
      <text x="266.8" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">78.7%</text>
      <text x="266.8" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">augmentation</text>
      <text x="266.8" y="96" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">human-in-the-loop,</text>
      <text x="266.8" y="110" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">job done better/faster</text>
    </g>

    <!-- 2026 inflection question -->
    <g transform="translate(70, 310)">
      <rect x="0" y="0" width="440" height="100" fill="#f7f9fc" stroke="#0f3460" stroke-width="1.2" rx="3"/>
      <text x="220" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Will it stay this way through 2027?</text>
      <text x="14" y="40" font-size="10.5" fill="#1a1a2e">Agentic Computer Use, autonomous customer support,</text>
      <text x="14" y="56" font-size="10.5" fill="#1a1a2e">and Claude Code-style background agents are coming online.</text>
      <text x="14" y="76" font-size="10.5" fill="#1a1a2e">If those scale, automation share rises mechanically. The 2027</text>
      <text x="14" y="92" font-size="10.5" fill="#1a1a2e">data either confirms ~70% augmentation or shows the flip.</text>
    </g>

    <!-- Layoff context -->
    <g transform="translate(70, 440)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#1a1a2e">2025 U.S. layoff attribution</text>

      <!-- Stacked bar: AI-attributed slice -->
      <rect x="0" y="14" width="22" height="32" fill="#a23434"/>
      <rect x="22" y="14" width="418" height="32" fill="#888"/>
      <text x="11" y="34" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">5%</text>
      <text x="231" y="34" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">95% (other causes)</text>

      <text x="0" y="64" font-size="11" fill="#1a1a2e">~55,000 of 1.17M U.S. layoffs in 2025 were AI-attributed</text>
      <text x="0" y="80" font-size="10" font-style="italic" fill="#5a4a3a">Source: U.S. BLS layoff classification</text>
    </g>
  </g>

  <!-- Divider line -->
  <line x1="650" y1="100" x2="650" y2="700" stroke="#d4d4d4" stroke-width="1.5"/>

  <!-- RIGHT PANEL: Concentrated impact bar chart -->
  <g transform="translate(0, 0)">
    <text x="1020" y="120" font-size="16" font-weight="700" text-anchor="middle" fill="#a23434">Concentrated impact (aggressive-adopter firms)</text>
    <text x="1020" y="142" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Per-role workforce contraction, 2024-2025</text>

    <!-- Horizontal bar chart: 6 roles -->
    <!-- Chart area: x=720..1340 (620 wide), bars start at x=900 -->
    <!-- y_start=180, row height = 56 -->

    <!-- Headers -->
    <text x="720" y="172" font-size="11" font-weight="700" fill="#1a1a2e">Role</text>
    <text x="900" y="172" font-size="11" font-weight="700" fill="#1a1a2e">% workforce change within adopter firms (red = contraction, green = expansion)</text>

    <!-- 0%, 20%, 40%, 60% gridlines -->
    <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
      <line x1="900" y1="180" x2="900" y2="640"/>
      <line x1="990" y1="180" x2="990" y2="640"/>
      <line x1="1080" y1="180" x2="1080" y2="640"/>
      <line x1="1170" y1="180" x2="1170" y2="640"/>
      <line x1="1260" y1="180" x2="1260" y2="640"/>
    </g>
    <g font-size="10" fill="#5a4a3a" text-anchor="middle">
      <text x="900" y="658">0%</text>
      <text x="990" y="658">15%</text>
      <text x="1080" y="658">30%</text>
      <text x="1170" y="658">45%</text>
      <text x="1260" y="658">60%</text>
    </g>

    <!-- Bars. width scale: 1% = 6 px. base x=900. -->
    <!-- Row 1: Junior copy writers, ~50% -->
    <text x="720" y="208" font-size="12" font-weight="600" fill="#1a1a2e">Junior copywriters</text>
    <rect x="900" y="194" width="300" height="24" fill="#a23434"/>
    <text x="1208" y="211" font-size="11" font-weight="700" fill="#a23434">~50%</text>

    <!-- Row 2: Voice-over artists, ~45% -->
    <text x="720" y="264" font-size="12" font-weight="600" fill="#1a1a2e">Voice-over artists</text>
    <rect x="900" y="250" width="270" height="24" fill="#a23434"/>
    <text x="1178" y="267" font-size="11" font-weight="700" fill="#a23434">~45%</text>

    <!-- Row 3: Tier-1 customer support, ~35% -->
    <text x="720" y="320" font-size="12" font-weight="600" fill="#1a1a2e">Tier-1 customer support</text>
    <rect x="900" y="306" width="210" height="24" fill="#a23434"/>
    <text x="1118" y="323" font-size="11" font-weight="700" fill="#a23434">~35%</text>

    <!-- Row 4: Paralegals, ~30% -->
    <text x="720" y="376" font-size="12" font-weight="600" fill="#1a1a2e">Paralegals</text>
    <rect x="900" y="362" width="180" height="24" fill="#c89c3c"/>
    <text x="1088" y="379" font-size="11" font-weight="700" fill="#c89c3c">~30%</text>

    <!-- Row 5: Basic translation, ~25% -->
    <text x="720" y="432" font-size="12" font-weight="600" fill="#1a1a2e">Basic translation</text>
    <rect x="900" y="418" width="150" height="24" fill="#c89c3c"/>
    <text x="1058" y="435" font-size="11" font-weight="700" fill="#c89c3c">~25%</text>

    <!-- Row 6: Basic graphic design, ~22% -->
    <text x="720" y="488" font-size="12" font-weight="600" fill="#1a1a2e">Basic graphic design</text>
    <rect x="900" y="474" width="132" height="24" fill="#c89c3c"/>
    <text x="1040" y="491" font-size="11" font-weight="700" fill="#c89c3c">~22%</text>

    <!-- Row 7: Senior software engineers, +12% hiring (rendered as green bar growing right from the zero line for clarity) -->
    <text x="720" y="544" font-size="12" font-weight="600" fill="#1a1a2e">Senior SWE (augmented)</text>
    <rect x="900" y="530" width="72" height="24" fill="#4a7c5a"/>
    <text x="980" y="547" font-size="11" font-weight="700" fill="#4a7c5a">+12% hiring (net add)</text>

    <!-- Row 8: AI/ML engineers, +85% (off-scale, capped to chart edge with annotation) -->
    <text x="720" y="600" font-size="12" font-weight="600" fill="#1a1a2e">AI / ML engineers</text>
    <rect x="900" y="586" width="380" height="24" fill="#4a7c5a"/>
    <text x="1290" y="603" font-size="11" font-weight="700" fill="#4a7c5a">+85% hiring</text>

    <!-- 0% reference line emphasized -->
    <line x1="900" y1="180" x2="900" y2="620" stroke="#1a1a2e" stroke-width="1.5"/>

    <text x="700" y="700" font-size="11" font-style="italic" fill="#5a4a3a">Reductions show contraction within firms that adopted aggressively; lower-impact firms have flatter curves.</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="60" y="720" width="1280" height="80" fill="#f7f9fc" stroke="#0f3460" stroke-width="1.2" rx="3"/>
  <text x="700" y="746" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Both panels are true at once: aggregate augmentation is dominant; per-role displacement is real and concentrated</text>
  <text x="700" y="768" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">The mainstream-economics framing ("AI just shifts the jobs") is correct at the aggregate. The per-role view is what specific workers experience.</text>
  <text x="700" y="784" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Policy that averages over occupations misses the concentrated impact; product strategy that averages over teams misses where adoption is fast.</text>
</svg>
