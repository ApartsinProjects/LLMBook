<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Two 2027 futures for the augmentation / automation split</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">The 2025 split is empirically measured (Anthropic). The 2027 split is two scenarios; the 18 months in between will arbitrate.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <text x="240" y="135" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a2e">2025 (measured)</text>
  <text x="240" y="156" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Anthropic labor study</text>

  <rect x="160" y="180" width="160" height="248" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
  <text x="240" y="304" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Augmentation</text>
  <text x="240" y="326" font-size="22" font-weight="700" text-anchor="middle" fill="#1f7a3a">78.7%</text>

  <rect x="160" y="428" width="160" height="68" fill="#fdeee8" stroke="#b3401b" stroke-width="2.5"/>
  <text x="240" y="458" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Automation</text>
  <text x="240" y="478" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">21.3%</text>

  <text x="700" y="135" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">Fork: 18 months of agentic-system deployment</text>
  <text x="700" y="156" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">does the curve hold or inflect?</text>

  <text x="1160" y="135" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a2e">2027 (two scenarios)</text>

  <polygon points="340,300 600,250 600,250 600,260 700,300" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5" opacity="0.8"/>
  <path d="M 320 304 Q 500 260 700 290" fill="none" stroke="#1f7a3a" stroke-width="20" opacity="0.45"/>

  <polygon points="340,460 600,510 600,510 600,520 700,490" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5" opacity="0.8"/>
  <path d="M 320 462 Q 500 510 700 490" fill="none" stroke="#b3401b" stroke-width="8" opacity="0.45"/>

  <g transform="translate(700, 220)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="90" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Scenario A</text>
    <text x="90" y="42" font-size="12" text-anchor="middle" fill="#1a1a2e">augmentation</text>
    <text x="90" y="58" font-size="12" text-anchor="middle" fill="#1a1a2e">share holds &gt; 70%</text>
    <text x="90" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Industry 4.0 trajectory</text>
  </g>

  <g transform="translate(700, 460)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="90" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Scenario B</text>
    <text x="90" y="42" font-size="12" text-anchor="middle" fill="#1a1a2e">augmentation falls</text>
    <text x="90" y="58" font-size="12" text-anchor="middle" fill="#1a1a2e">toward 50%</text>
    <text x="90" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">faster displacement</text>
  </g>

  <g transform="translate(900, 220)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="100" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Augmentation</text>
    <text x="100" y="56" font-size="20" font-weight="700" text-anchor="middle" fill="#1f7a3a">~72%</text>
    <text x="100" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">net jobs created &gt; lost</text>
  </g>

  <g transform="translate(900, 320)">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="100" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Automation</text>
    <text x="100" y="44" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">~28%</text>
  </g>

  <g transform="translate(900, 410)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="100" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1f7a3a">Augmentation</text>
    <text x="100" y="56" font-size="20" font-weight="700" text-anchor="middle" fill="#1f7a3a">~52%</text>
    <text x="100" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">large policy implications</text>
  </g>

  <g transform="translate(900, 510)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Automation</text>
    <text x="100" y="56" font-size="20" font-weight="700" text-anchor="middle" fill="#b3401b">~48%</text>
    <text x="100" y="74" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">retraining demand spikes</text>
  </g>

  <line x1="880" y1="260" x2="900" y2="260" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="880" y1="500" x2="900" y2="500" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="880" y1="270" x2="900" y2="350" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="880" y1="510" x2="900" y2="550" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4,3"/>

  <g transform="translate(420, 600)">
    <rect x="0" y="0" width="560" height="120" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="280" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Three indicators arbitrate the fork</text>
    <text x="20" y="50" font-size="12" fill="#1a1a2e">1. Agentic-coding adoption rate (SWE-bench Verified by autonomous agents).</text>
    <text x="20" y="70" font-size="12" fill="#1a1a2e">2. Share of customer-support tier-1 jobs absorbed by Computer-Use-class agents.</text>
    <text x="20" y="90" font-size="12" fill="#1a1a2e">3. AI-attributed share of BLS layoffs (currently ~5%; track quarterly).</text>
    <text x="20" y="110" font-size="11" font-style="italic" fill="#5a4a3a">All three rising fast = Scenario B; only the first rising = Scenario A.</text>
  </g>

  <g transform="translate(140, 740)">
    <rect x="0" y="0" width="1120" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#a67c1a">Why the fork matters</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">Both scenarios produce productivity gains. They differ on who captures the surplus: in A, workers stay employed at higher-leverage roles; in B, surplus accrues to capital faster than workers can</text>
    <text x="20" y="56" font-size="12" fill="#1a1a2e">retrain. Policy response (UBI, retraining funds, AI taxes) is set by which scenario actually plays out.</text>
  </g>
</svg>
