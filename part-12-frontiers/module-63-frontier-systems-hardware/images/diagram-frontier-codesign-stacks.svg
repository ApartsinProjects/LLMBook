<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>Training and inference: from two stacks to one</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrCD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f3460"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Training and inference fused</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Layers that were once siloed are now jointly optimized</text>

  <!-- Left: 2023 -->
  <g transform="translate(40, 110)">
    <text x="200" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#5a4a3a">2023: separate stacks</text>

    <rect x="0" y="20" width="190" height="50" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="95" y="42" font-size="13" font-weight="700" text-anchor="middle" fill="#1a4078">Training</text>
    <text x="95" y="60" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Chinchilla optimum</text>

    <rect x="210" y="20" width="190" height="50" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="2"/>
    <text x="305" y="42" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">Inference</text>
    <text x="305" y="60" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">throughput / latency</text>

    <rect x="0" y="84" width="190" height="40" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
    <text x="95" y="108" font-size="11" text-anchor="middle" fill="#1a1a2e">FA-2 / standard MHA</text>
    <rect x="210" y="84" width="190" height="40" rx="4" fill="#ffffff" stroke="#b3401b" stroke-width="1.2"/>
    <text x="305" y="108" font-size="11" text-anchor="middle" fill="#1a1a2e">PagedAttention</text>

    <rect x="0" y="134" width="190" height="40" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
    <text x="95" y="158" font-size="11" text-anchor="middle" fill="#1a1a2e">bf16 mixed precision</text>
    <rect x="210" y="134" width="190" height="40" rx="4" fill="#ffffff" stroke="#b3401b" stroke-width="1.2"/>
    <text x="305" y="158" font-size="11" text-anchor="middle" fill="#1a1a2e">int8 / int4 post-hoc</text>

    <rect x="0" y="184" width="190" height="40" rx="4" fill="#ffffff" stroke="#1a4078" stroke-width="1.2"/>
    <text x="95" y="208" font-size="11" text-anchor="middle" fill="#1a1a2e">all params trained</text>
    <rect x="210" y="184" width="190" height="40" rx="4" fill="#ffffff" stroke="#b3401b" stroke-width="1.2"/>
    <text x="305" y="208" font-size="11" text-anchor="middle" fill="#1a1a2e">routing retrofitted</text>
  </g>

  <!-- Arrow -->
  <path d="M 470 240 L 590 240" fill="none" stroke="#0f3460" stroke-width="3" marker-end="url(#arrCD)"/>
  <text x="530" y="226" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">layers fuse</text>
  <text x="530" y="258" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">2024-26</text>

  <!-- Right: 2026 -->
  <g transform="translate(620, 110)">
    <text x="220" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">2026: one co-designed stack</text>

    <rect x="0" y="20" width="440" height="50" rx="6" fill="#0f3460" stroke="#0f3460" stroke-width="2"/>
    <text x="220" y="42" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Inference-aware scaling laws</text>
    <text x="220" y="60" font-size="11" font-style="italic" text-anchor="middle" fill="#d4dfee">train longer to serve cheaper</text>

    <rect x="0" y="84" width="440" height="40" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/>
    <text x="220" y="108" font-size="11" text-anchor="middle" fill="#1a1a2e">FA-4 kernel: training and serving share it</text>

    <rect x="0" y="134" width="440" height="40" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/>
    <text x="220" y="158" font-size="11" text-anchor="middle" fill="#1a1a2e">QAT: quantization scheduled from step 0</text>

    <rect x="0" y="184" width="440" height="40" rx="4" fill="#eef4fa" stroke="#1a4078" stroke-width="1.2"/>
    <text x="220" y="208" font-size="11" text-anchor="middle" fill="#1a1a2e">MoE: trained all, serve sparse</text>
  </g>

  <!-- Timeline -->
  <text x="550" y="400" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">When each fusion happened</text>
  <g transform="translate(120, 420)">
    <line x1="0" y1="20" x2="860" y2="20" stroke="#5a4a3a" stroke-width="1.5"/>
    <g font-size="11" fill="#5a4a3a" text-anchor="middle">
      <line x1="0" y1="16" x2="0" y2="24" stroke="#5a4a3a" stroke-width="1.5"/>
      <text x="0" y="44">2022</text>
      <line x1="215" y1="16" x2="215" y2="24" stroke="#5a4a3a" stroke-width="1.5"/>
      <text x="215" y="44">2023</text>
      <line x1="430" y1="16" x2="430" y2="24" stroke="#5a4a3a" stroke-width="1.5"/>
      <text x="430" y="44">2024</text>
      <line x1="645" y1="16" x2="645" y2="24" stroke="#5a4a3a" stroke-width="1.5"/>
      <text x="645" y="44">2025</text>
      <line x1="860" y1="16" x2="860" y2="24" stroke="#5a4a3a" stroke-width="1.5"/>
      <text x="860" y="44">2026</text>
    </g>
    <circle cx="100" cy="20" r="6" fill="#1a4078"/>
    <text x="100" y="6" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">FA-1</text>
    <circle cx="320" cy="20" r="6" fill="#1a4078"/>
    <text x="320" y="6" font-size="11" font-weight="700" text-anchor="middle" fill="#1a4078">FA-2 + GQA</text>
    <circle cx="500" cy="20" r="6" fill="#1f7a3a"/>
    <text x="500" y="6" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">Sardana</text>
    <circle cx="640" cy="20" r="6" fill="#722f8a"/>
    <text x="640" y="6" font-size="11" font-weight="700" text-anchor="middle" fill="#722f8a">EAGLE + Medusa</text>
    <circle cx="830" cy="20" r="6" fill="#b3401b"/>
    <text x="830" y="6" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">FA-4 + HERMES</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 500)">
    <rect width="1020" height="80" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">"Train then serve" is no longer the right mental model</text>
    <text x="510" y="54" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a2e">Token-to-parameter ratios chosen for serving, MoE routes baked into pretraining, draft heads co-trained.</text>
  </g>
</svg>
