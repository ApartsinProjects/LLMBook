<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Training and inference stopped being separate stacks</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Three layers that were once siloed are now jointly optimized: scaling-law math, attention kernels, and quantization schedules.</text>

  <!-- Left column: 2023 separate stacks -->
  <text x="320" y="118" font-size="18" font-weight="700" text-anchor="middle" fill="#5a4a3a">2023: two stacks, separate teams</text>

  <!-- Training stack (left of left column) -->
  <g>
    <rect x="100" y="148" width="200" height="60" fill="#e8edf5" stroke="#0f3460" stroke-width="1.2" rx="4"/>
    <text x="200" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">Training</text>
    <text x="200" y="192" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Chinchilla optimum</text>

    <rect x="100" y="220" width="200" height="50" fill="#ffffff" stroke="#0f3460" stroke-width="1" rx="3"/>
    <text x="200" y="240" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">FA-2 / standard MHA</text>
    <text x="200" y="256" font-size="10" text-anchor="middle" fill="#5a4a3a">tile size for training</text>

    <rect x="100" y="280" width="200" height="50" fill="#ffffff" stroke="#0f3460" stroke-width="1" rx="3"/>
    <text x="200" y="300" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">bf16 mixed-precision</text>
    <text x="200" y="316" font-size="10" text-anchor="middle" fill="#5a4a3a">no quantization</text>

    <rect x="100" y="340" width="200" height="50" fill="#ffffff" stroke="#0f3460" stroke-width="1" rx="3"/>
    <text x="200" y="360" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">all params trained</text>
    <text x="200" y="376" font-size="10" text-anchor="middle" fill="#5a4a3a">dense or MoE-trained</text>

    <rect x="100" y="400" width="200" height="50" fill="#ffffff" stroke="#0f3460" stroke-width="1" rx="3"/>
    <text x="200" y="420" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">H100 cluster, NVLink</text>
    <text x="200" y="436" font-size="10" text-anchor="middle" fill="#5a4a3a">co-located</text>
  </g>

  <!-- Inference stack (right of left column) -->
  <g>
    <rect x="340" y="148" width="200" height="60" fill="#e8edf5" stroke="#a23434" stroke-width="1.2" rx="4"/>
    <text x="440" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#a23434">Inference</text>
    <text x="440" y="192" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">throughput / latency</text>

    <rect x="340" y="220" width="200" height="50" fill="#ffffff" stroke="#a23434" stroke-width="1" rx="3"/>
    <text x="440" y="240" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">PagedAttention</text>
    <text x="440" y="256" font-size="10" text-anchor="middle" fill="#5a4a3a">tile size for batching</text>

    <rect x="340" y="280" width="200" height="50" fill="#ffffff" stroke="#a23434" stroke-width="1" rx="3"/>
    <text x="440" y="300" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">int8 / int4 post-hoc</text>
    <text x="440" y="316" font-size="10" text-anchor="middle" fill="#5a4a3a">quality penalty</text>

    <rect x="340" y="340" width="200" height="50" fill="#ffffff" stroke="#a23434" stroke-width="1" rx="3"/>
    <text x="440" y="360" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">routing decisions</text>
    <text x="440" y="376" font-size="10" text-anchor="middle" fill="#5a4a3a">retrofitted to model</text>

    <rect x="340" y="400" width="200" height="50" fill="#ffffff" stroke="#a23434" stroke-width="1" rx="3"/>
    <text x="440" y="420" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">whatever fits</text>
    <text x="440" y="436" font-size="10" text-anchor="middle" fill="#5a4a3a">A10G to H100</text>
  </g>

  <!-- Center merge arrow -->
  <defs>
    <marker id="arrowcd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f3460"/>
    </marker>
  </defs>

  <path d="M 560 300 Q 700 300 800 300" fill="none" stroke="#0f3460" stroke-width="3" marker-end="url(#arrowcd)"/>
  <text x="680" y="288" font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">2024-26: layers fuse</text>
  <text x="680" y="318" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">(Sardana, MoE, QAT, EAGLE)</text>

  <!-- Right column: 2026 fused stack -->
  <text x="1060" y="118" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a2e">2026: one co-designed stack</text>

  <!-- Fused stack -->
  <g>
    <rect x="840" y="148" width="440" height="60" fill="#0f3460" stroke="#0f3460" stroke-width="1.5" rx="4"/>
    <text x="1060" y="172" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Inference-aware scaling laws</text>
    <text x="1060" y="194" font-size="11" font-style="italic" text-anchor="middle" fill="#d4dfee">Sardana et al. 2024 · train longer to serve cheaper</text>

    <rect x="840" y="220" width="440" height="50" fill="#e8edf5" stroke="#0f3460" stroke-width="1.2" rx="3"/>
    <text x="1060" y="240" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">FA-4 attention kernel</text>
    <text x="1060" y="258" font-size="10" text-anchor="middle" fill="#5a4a3a">same primitive used in training and serving</text>

    <rect x="840" y="280" width="440" height="50" fill="#e8edf5" stroke="#0f3460" stroke-width="1.2" rx="3"/>
    <text x="1060" y="300" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">QAT (quantization-aware training)</text>
    <text x="1060" y="318" font-size="10" text-anchor="middle" fill="#5a4a3a">BitNet b1.58, MXFP4, AWQ-aware schedule</text>

    <rect x="840" y="340" width="440" height="50" fill="#e8edf5" stroke="#0f3460" stroke-width="1.2" rx="3"/>
    <text x="1060" y="360" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">MoE: trained all, serve sparse</text>
    <text x="1060" y="378" font-size="10" text-anchor="middle" fill="#5a4a3a">DeepSeek V4 (671B / 37B active), Qwen3-235B</text>

    <rect x="840" y="400" width="440" height="50" fill="#e8edf5" stroke="#0f3460" stroke-width="1.2" rx="3"/>
    <text x="1060" y="420" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Speculative-decoding draft heads</text>
    <text x="1060" y="438" font-size="10" text-anchor="middle" fill="#5a4a3a">Medusa, EAGLE: target and draft co-trained</text>

    <rect x="840" y="460" width="440" height="50" fill="#e8edf5" stroke="#0f3460" stroke-width="1.2" rx="3"/>
    <text x="1060" y="480" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Multi-stage HERMES pipeline</text>
    <text x="1060" y="498" font-size="10" text-anchor="middle" fill="#5a4a3a">prefill on Blackwell, generate on Groq / Cerebras</text>
  </g>

  <!-- Shared-layer indicator (vertical brace highlighting these merged layers) -->
  <path d="M 836 220 L 824 220 L 824 510 L 836 510" fill="none" stroke="#0f3460" stroke-width="2"/>
  <text x="780" y="365" font-size="11" font-weight="700" text-anchor="middle" fill="#0f3460" transform="rotate(-90 780 365)">co-designed layers</text>

  <!-- Bottom timeline -->
  <text x="700" y="560" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a2e">When each fusion happened</text>

  <g transform="translate(180, 590)">
    <!-- timeline axis -->
    <line x1="0" y1="40" x2="1040" y2="40" stroke="#1a1a2e" stroke-width="1.5"/>

    <!-- year ticks -->
    <g font-size="11" fill="#5a4a3a" text-anchor="middle">
      <line x1="0" y1="36" x2="0" y2="44" stroke="#1a1a2e" stroke-width="1.5"/>
      <text x="0" y="62">2022</text>
      <line x1="260" y1="36" x2="260" y2="44" stroke="#1a1a2e" stroke-width="1.5"/>
      <text x="260" y="62">2023</text>
      <line x1="520" y1="36" x2="520" y2="44" stroke="#1a1a2e" stroke-width="1.5"/>
      <text x="520" y="62">2024</text>
      <line x1="780" y1="36" x2="780" y2="44" stroke="#1a1a2e" stroke-width="1.5"/>
      <text x="780" y="62">2025</text>
      <line x1="1040" y1="36" x2="1040" y2="44" stroke="#1a1a2e" stroke-width="1.5"/>
      <text x="1040" y="62">2026</text>
    </g>

    <!-- Events as labelled circles above the line -->
    <g>
      <circle cx="130" cy="40" r="8" fill="#0f3460"/>
      <line x1="130" y1="32" x2="130" y2="14" stroke="#5a4a3a" stroke-width="1"/>
      <text x="130" y="6" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">FA-1</text>

      <circle cx="390" cy="40" r="8" fill="#0f3460"/>
      <line x1="390" y1="32" x2="390" y2="14" stroke="#5a4a3a" stroke-width="1"/>
      <text x="390" y="6" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">FA-2 + GQA</text>

      <circle cx="600" cy="40" r="8" fill="#0f3460"/>
      <line x1="600" y1="32" x2="600" y2="14" stroke="#5a4a3a" stroke-width="1"/>
      <text x="600" y="6" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">Sardana inf-aware</text>

      <circle cx="700" cy="40" r="8" fill="#0f3460"/>
      <line x1="700" y1="32" x2="700" y2="14" stroke="#5a4a3a" stroke-width="1"/>
      <text x="700" y="-12" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">DeepSeek MoE</text>
      <text x="700" y="0" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">+ EAGLE / Medusa</text>

      <circle cx="900" cy="40" r="8" fill="#0f3460"/>
      <line x1="900" y1="32" x2="900" y2="14" stroke="#5a4a3a" stroke-width="1"/>
      <text x="900" y="6" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">BitNet b1.58 2B4T</text>

      <circle cx="1010" cy="40" r="8" fill="#a23434"/>
      <line x1="1010" y1="32" x2="1010" y2="14" stroke="#5a4a3a" stroke-width="1"/>
      <text x="1010" y="6" font-size="11" font-weight="700" text-anchor="middle" fill="#a23434">FA-4 + HERMES</text>
    </g>

  </g>

  <!-- Bottom takeaway -->
  <rect x="180" y="734" width="1040" height="68" fill="#f7f9fc" stroke="#0f3460" stroke-width="1.2" rx="3"/>
  <text x="700" y="758" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">"Train it, then serve it" is no longer the right mental model</text>
  <text x="700" y="780" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Every frontier model in 2026 is designed to inference cheaply: token-to-parameter ratios chosen for serving, MoE routes baked into pretraining,</text>
  <text x="700" y="794" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">draft heads co-trained, quantization scheduled from step 0. Treat training and inference as one optimization, not two.</text>
</svg>
