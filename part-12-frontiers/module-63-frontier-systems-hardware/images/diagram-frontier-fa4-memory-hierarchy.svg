<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">FlashAttention-4 on Blackwell: tile data toward the registers, never the other way</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Memory hierarchy on a B200 SM with asymmetric tensor / SFU partitions. Bandwidth gap between tiers spans 4 orders of magnitude.</text>

  <!-- Three-tier hierarchy as nested boxes -->
  <!-- HBM (outer), L1/SRAM, Registers (inner) -->

  <!-- HBM box -->
  <rect x="120" y="120" width="1160" height="500" fill="#f7f9fc" stroke="#0f3460" stroke-width="2" rx="8"/>
  <text x="700" y="148" font-size="18" font-weight="700" text-anchor="middle" fill="#0f3460">HBM3e (off-chip)</text>
  <text x="700" y="168" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">192 GB capacity · ~8 TB/s bandwidth · ~400 ns latency</text>

  <!-- HBM tile representations on left side -->
  <g transform="translate(160, 200)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1a1a2e">Full Q, K, V matrices live here</text>
    <!-- Stylized Q matrix -->
    <g transform="translate(0, 20)">
      <text x="0" y="14" font-size="11" font-weight="700" fill="#5a4a3a">Q (seqlen x d_head)</text>
      <rect x="0" y="20" width="80" height="80" fill="#d4dfee" stroke="#0f3460" stroke-width="1"/>
      <rect x="0" y="20" width="80" height="16" fill="#0f3460" opacity="0.85"/>
      <rect x="0" y="36" width="80" height="16" fill="#0f3460" opacity="0.55"/>
      <rect x="0" y="52" width="80" height="16" fill="#0f3460" opacity="0.35"/>
      <rect x="0" y="68" width="80" height="16" fill="#0f3460" opacity="0.18"/>
    </g>
    <g transform="translate(120, 20)">
      <text x="0" y="14" font-size="11" font-weight="700" fill="#5a4a3a">K (seqlen x d_head)</text>
      <rect x="0" y="20" width="80" height="80" fill="#d4dfee" stroke="#0f3460" stroke-width="1"/>
      <rect x="0" y="20" width="16" height="80" fill="#0f3460" opacity="0.85"/>
      <rect x="16" y="20" width="16" height="80" fill="#0f3460" opacity="0.55"/>
      <rect x="32" y="20" width="16" height="80" fill="#0f3460" opacity="0.35"/>
      <rect x="48" y="20" width="16" height="80" fill="#0f3460" opacity="0.18"/>
    </g>
    <g transform="translate(240, 20)">
      <text x="0" y="14" font-size="11" font-weight="700" fill="#5a4a3a">V (seqlen x d_head)</text>
      <rect x="0" y="20" width="80" height="80" fill="#d4dfee" stroke="#0f3460" stroke-width="1"/>
      <rect x="0" y="20" width="80" height="16" fill="#4a7c5a" opacity="0.75"/>
      <rect x="0" y="36" width="80" height="16" fill="#4a7c5a" opacity="0.55"/>
      <rect x="0" y="52" width="80" height="16" fill="#4a7c5a" opacity="0.35"/>
      <rect x="0" y="68" width="80" height="16" fill="#4a7c5a" opacity="0.18"/>
    </g>
  </g>

  <!-- Naive attention failure box -->
  <g transform="translate(180, 380)">
    <rect x="0" y="0" width="380" height="120" fill="#ffffff" stroke="#a23434" stroke-width="1.5" rx="4"/>
    <text x="190" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#a23434">Why the naive kernel fails on long context</text>
    <text x="14" y="44" font-size="11" fill="#1a1a2e">S = Q K^T  (seqlen x seqlen)  materialised here</text>
    <text x="14" y="62" font-size="11" fill="#1a1a2e">P = softmax(S / sqrt(d))  also seqlen x seqlen</text>
    <text x="14" y="80" font-size="11" font-style="italic" fill="#a23434">For seqlen=128k, S is ~32 GB. Round-trips dominate.</text>
    <text x="14" y="100" font-size="11" font-style="italic" fill="#a23434">Tensor cores starve waiting on HBM reads.</text>
  </g>

  <!-- SRAM box (nested inside HBM) -->
  <rect x="620" y="200" width="600" height="380" fill="#e8edf5" stroke="#0f3460" stroke-width="2" rx="6"/>
  <text x="920" y="228" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">SRAM / L1 (on-chip, per-SM)</text>
  <text x="920" y="246" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">228 KB per SM · ~20 TB/s · ~10 ns</text>

  <!-- Tiles inside SRAM showing the FA4 tiling pattern -->
  <g transform="translate(660, 270)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#1a1a2e">FA-4 tiles: Q-block stays, K/V blocks stream</text>

    <!-- Q tile -->
    <rect x="0" y="18" width="80" height="80" fill="#0f3460" opacity="0.85" stroke="#0f3460" stroke-width="1.5"/>
    <text x="40" y="62" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">Q tile</text>
    <text x="40" y="78" font-size="9" text-anchor="middle" fill="#ffffff">resident</text>

    <!-- K tile -->
    <rect x="100" y="18" width="80" height="80" fill="#0f3460" opacity="0.55" stroke="#0f3460" stroke-width="1.5"/>
    <text x="140" y="62" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">K tile</text>
    <text x="140" y="78" font-size="9" text-anchor="middle" fill="#ffffff">streamed</text>

    <!-- V tile -->
    <rect x="200" y="18" width="80" height="80" fill="#4a7c5a" opacity="0.65" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="240" y="62" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">V tile</text>
    <text x="240" y="78" font-size="9" text-anchor="middle" fill="#ffffff">streamed</text>

    <!-- Online softmax accumulator -->
    <rect x="320" y="18" width="100" height="80" fill="#c89c3c" opacity="0.65" stroke="#c89c3c" stroke-width="1.5"/>
    <text x="370" y="56" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a2e">online softmax</text>
    <text x="370" y="74" font-size="10" text-anchor="middle" fill="#1a1a2e">m, l running stats</text>

    <!-- Arrows showing the tile iteration -->
    <line x1="180" y1="118" x2="180" y2="138" stroke="#0f3460" stroke-width="1.5"/>
    <line x1="240" y1="118" x2="240" y2="138" stroke="#0f3460" stroke-width="1.5"/>
    <text x="210" y="156" font-size="11" font-weight="700" text-anchor="middle" fill="#0f3460">for each K, V tile in seqlen:</text>
    <text x="210" y="172" font-size="10" text-anchor="middle" fill="#5a4a3a">load to SRAM, compute, accumulate</text>
  </g>

  <!-- Asymmetric SM partitions inside SRAM box -->
  <g transform="translate(660, 460)">
    <rect x="0" y="0" width="180" height="100" fill="#ffffff" stroke="#0f3460" stroke-width="1.5" rx="4"/>
    <text x="90" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3460">Tensor partition</text>
    <text x="90" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">tcgen05 MMA</text>
    <text x="90" y="58" font-size="11" text-anchor="middle" fill="#1a1a2e">GEMM throughput</text>
    <text x="90" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">handles Q K^T and P V</text>

    <rect x="200" y="0" width="180" height="100" fill="#ffffff" stroke="#a23434" stroke-width="1.5" rx="4"/>
    <text x="290" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#a23434">SFU partition</text>
    <text x="290" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">exp, division</text>
    <text x="290" y="58" font-size="11" text-anchor="middle" fill="#1a1a2e">softmax math</text>
    <text x="290" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">overlaps with MMA</text>

    <!-- Pipelining arrow -->
    <path d="M 95 100 Q 190 130 285 100" fill="none" stroke="#0f3460" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="190" y="125" font-size="11" font-weight="700" text-anchor="middle" fill="#0f3460">async pipelining</text>
  </g>

  <!-- Registers box (innermost) -->
  <rect x="1020" y="380" width="180" height="160" fill="#0f3460" stroke="#0f3460" stroke-width="2" rx="4"/>
  <text x="1110" y="408" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Registers</text>
  <text x="1110" y="426" font-size="10" text-anchor="middle" fill="#d4dfee">~64 KB / thread block</text>
  <text x="1110" y="442" font-size="10" text-anchor="middle" fill="#d4dfee">~80 TB/s · ~1 ns</text>

  <text x="1110" y="476" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">m_i, l_i, O_i</text>
  <text x="1110" y="494" font-size="9" text-anchor="middle" fill="#d4dfee">running max, sum, output</text>
  <text x="1110" y="510" font-size="9" text-anchor="middle" fill="#d4dfee">never spill to HBM</text>
  <text x="1110" y="528" font-size="9" text-anchor="middle" fill="#d4dfee">until kernel exit</text>

  <!-- Big arrow from HBM (left) to Registers (right) showing tile motion -->
  <defs>
    <marker id="arrowfa4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f3460"/>
    </marker>
  </defs>

  <!-- Bandwidth comparison bar at bottom -->
  <text x="700" y="660" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">Bandwidth across the hierarchy (log)</text>

  <g transform="translate(280, 685)">
    <!-- HBM -->
    <rect x="0" y="0" width="200" height="22" fill="#5a7da6"/>
    <text x="100" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">HBM3e ~8 TB/s</text>
    <!-- SRAM -->
    <rect x="230" y="0" width="320" height="22" fill="#0f3460"/>
    <text x="390" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">SRAM ~20 TB/s</text>
    <!-- Registers -->
    <rect x="570" y="0" width="500" height="22" fill="#1a1a2e"/>
    <text x="820" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Registers ~80 TB/s</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="120" y="734" width="1160" height="68" fill="#f7f9fc" stroke="#0f3460" stroke-width="1.2" rx="3"/>
  <text x="700" y="758" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">FA-4's new move: pipeline the tensor (MMA) and SFU (softmax) partitions asymmetrically inside one SM</text>
  <text x="700" y="780" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">FA-1 through FA-3 already kept tiles in SRAM. FA-4's contribution is scheduling MMA and softmax on different SM partitions so they run in parallel.</text>
  <text x="700" y="794" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Result: ~2x speedup over FA-3 on the same Blackwell silicon, by eliminating the bubbles where softmax stalled the GEMM pipeline.</text>
</svg>
