<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="900" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">DeMo collapses 140 GB of gradients into ~140 MB per step</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">One optimizer step on a heterogeneous worker fleet, with Solana attestation in place of an InfiniBand fabric.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <g transform="translate(60, 130)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#1a4078">Worker fleet (heterogeneous)</text>
    <rect x="0" y="14" width="200" height="56" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="36" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">W1: cloud H100</text>
    <text x="100" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">80 GB HBM</text>

    <rect x="0" y="84" width="200" height="56" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="106" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">W2: university A100</text>
    <text x="100" y="126" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">40 GB HBM</text>

    <rect x="0" y="154" width="200" height="56" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="176" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">W3: hobbyist RTX 4090</text>
    <text x="100" y="196" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">24 GB GDDR6X</text>

    <rect x="0" y="224" width="200" height="56" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="100" y="246" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">W4: rented L40S</text>
    <text x="100" y="266" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">48 GB GDDR6</text>
  </g>

  <g transform="translate(330, 130)">
    <text x="120" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Step 1: local momentum + top-k extract</text>
    <rect x="0" y="14" width="280" height="240" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="140" y="42" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Each worker, locally</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">1. compute full gradient g</text>
    <text x="20" y="90" font-size="12" fill="#1a1a2e">2. update local momentum m</text>
    <text x="20" y="112" font-size="12" fill="#1a1a2e">3. select top-k (~0.1%)</text>
    <text x="20" y="134" font-size="12" fill="#1a1a2e">     components of m</text>
    <text x="20" y="156" font-size="12" fill="#1a1a2e">4. signed sparse vector</text>
    <text x="20" y="178" font-size="12" fill="#1a1a2e">     to send: ~140 MB</text>
    <rect x="20" y="194" width="240" height="48" rx="4" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="140" y="214" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">vs 140 GB dense full</text>
    <text x="140" y="230" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">~1000x compression</text>
  </g>

  <line x1="270" y1="195" x2="328" y2="195" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(660, 130)">
    <text x="120" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Step 2: sparse sync</text>
    <rect x="0" y="14" width="280" height="240" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="140" y="42" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Solana attestation layer</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">1. each worker submits</text>
    <text x="20" y="90" font-size="12" fill="#1a1a2e">     sparse update hash</text>
    <text x="20" y="112" font-size="12" fill="#1a1a2e">2. peers verify a fraction</text>
    <text x="20" y="134" font-size="12" fill="#1a1a2e">     via re-execution</text>
    <text x="20" y="156" font-size="12" fill="#1a1a2e">3. valid updates aggregated</text>
    <text x="20" y="178" font-size="12" fill="#1a1a2e">     by element-wise mean</text>
    <rect x="20" y="194" width="240" height="48" rx="4" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="140" y="214" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">audit cost: ~20-30%</text>
    <text x="140" y="230" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">verifiability tax</text>
  </g>

  <line x1="600" y1="250" x2="660" y2="250" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(990, 130)">
    <text x="120" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Step 3: global merge</text>
    <rect x="0" y="14" width="280" height="240" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="140" y="42" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Each worker, locally</text>
    <text x="20" y="68" font-size="12" fill="#1a1a2e">1. download aggregated</text>
    <text x="20" y="90" font-size="12" fill="#1a1a2e">     sparse update</text>
    <text x="20" y="112" font-size="12" fill="#1a1a2e">2. apply to local params</text>
    <text x="20" y="134" font-size="12" fill="#1a1a2e">3. keep residual momentum</text>
    <text x="20" y="156" font-size="12" fill="#1a1a2e">     for next step</text>
    <rect x="20" y="174" width="240" height="64" rx="4" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="140" y="194" font-size="11" font-weight="700" text-anchor="middle" fill="#a67c1a">Convergence quality:</text>
    <text x="140" y="210" font-size="11" text-anchor="middle" fill="#1a1a2e">comparable to centralized DDP</text>
    <text x="140" y="226" font-size="11" text-anchor="middle" fill="#1a1a2e">at 1B-10B scale</text>
  </g>

  <path d="M 1130 270 Q 1130 350 700 380 Q 270 410 160 410 Q 100 410 100 350 Q 100 290 160 280" fill="none" stroke="#5a4a3a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="700" y="410" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">next optimizer step</text>

  <g transform="translate(60, 480)">
    <text x="640" y="0" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a2e">Bandwidth budget: DeMo vs DDP vs FSDP</text>
    <rect x="0" y="20" width="1280" height="280" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="6,4"/>

    <text x="120" y="60" font-size="13" font-weight="700" text-anchor="end" fill="#1a1a2e">Synchronous DDP</text>
    <rect x="140" y="44" width="1100" height="24" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
    <text x="690" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1a4078">~140 GB / step (full gradient, all-reduce)</text>

    <text x="120" y="110" font-size="13" font-weight="700" text-anchor="end" fill="#1a1a2e">FSDP / ZeRO-3</text>
    <rect x="140" y="94" width="700" height="24" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="490" y="112" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">~70 GB / step (shard + reduce-scatter)</text>

    <text x="120" y="160" font-size="13" font-weight="700" text-anchor="end" fill="#1a1a2e">DiLoCo (local SGD)</text>
    <rect x="140" y="144" width="220" height="24" fill="#f4ecf7" stroke="#722f8a" stroke-width="2"/>
    <text x="250" y="162" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">~14 GB / step</text>

    <text x="120" y="210" font-size="13" font-weight="700" text-anchor="end" fill="#1a1a2e">DeMo / DisTrO</text>
    <rect x="140" y="194" width="18" height="24" fill="#fff5dc" stroke="#d4b96a" stroke-width="2"/>
    <text x="180" y="212" font-size="12" font-weight="700" fill="#a67c1a">~140 MB / step</text>

    <text x="640" y="260" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Bandwidth per step at 70B parameters in fp16. Bars are roughly to scale.</text>
  </g>

  <g transform="translate(60, 810)">
    <rect x="0" y="0" width="1280" height="60" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#a67c1a">Why this changes the deployment model</text>
    <text x="20" y="42" font-size="12" fill="#1a1a2e">At 140 MB per step a 1 Gbps home connection is sufficient. The InfiniBand-or-nothing constraint that made hyperscaler training mandatory through 2024 is no longer mathematical;</text>
    <text x="20" y="56" font-size="12" fill="#1a1a2e">it is operational. Verifiability and convergence at GPT-4 scale are the remaining open questions.</text>
  </g>
</svg>
