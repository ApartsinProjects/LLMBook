<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">What runs comfortably on the device in your pocket (and on your desk)</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Open-weight model fit by device RAM tier, mid-2026. 4-bit quantization assumed except where noted.</text>

  <!-- Layout: 4 device-tier columns x 1 vertical model-size ladder -->
  <!-- Columns at x=180-460 (RAM 4GB), 460-740 (8GB), 740-1020 (16GB), 1020-1300 (32GB) -->
  <!-- Rows: header (y=110-160), then 5 model-size tiers (y=160-700) -->

  <!-- Column headers (device tiers) -->
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">
    <rect x="180" y="118" width="280" height="44" fill="#e8edf5" stroke="#0f3460" stroke-width="1.2"/>
    <text x="320" y="140">iPhone 17 / Galaxy S26</text>
    <text x="320" y="156" font-size="11" font-weight="500" fill="#5a4a3a">4-6 GB usable</text>

    <rect x="460" y="118" width="280" height="44" fill="#e8edf5" stroke="#0f3460" stroke-width="1.2"/>
    <text x="600" y="140">Pixel 11 Pro / iPad mini</text>
    <text x="600" y="156" font-size="11" font-weight="500" fill="#5a4a3a">8-12 GB usable</text>

    <rect x="740" y="118" width="280" height="44" fill="#e8edf5" stroke="#0f3460" stroke-width="1.2"/>
    <text x="880" y="140">MacBook Air M4 16GB</text>
    <text x="880" y="156" font-size="11" font-weight="500" fill="#5a4a3a">12-14 GB usable</text>

    <rect x="1020" y="118" width="280" height="44" fill="#e8edf5" stroke="#0f3460" stroke-width="1.2"/>
    <text x="1160" y="140">Mac Studio M4 Max 32GB</text>
    <text x="1160" y="156" font-size="11" font-weight="500" fill="#5a4a3a">26-28 GB usable</text>
  </g>

  <!-- Row labels (model size tiers) on right -->
  <g font-size="12" font-weight="600" text-anchor="start" fill="#1a1a2e">
    <text x="80" y="200">&lt;1B params</text>
    <text x="80" y="218" font-size="10" font-weight="400" fill="#5a4a3a">~0.5 GB</text>
    <text x="80" y="290">1-3B params</text>
    <text x="80" y="308" font-size="10" font-weight="400" fill="#5a4a3a">~1.5 GB</text>
    <text x="80" y="380">3-8B params</text>
    <text x="80" y="398" font-size="10" font-weight="400" fill="#5a4a3a">~5 GB</text>
    <text x="80" y="470">8-15B params</text>
    <text x="80" y="488" font-size="10" font-weight="400" fill="#5a4a3a">~9 GB</text>
    <text x="80" y="560">30B+ params</text>
    <text x="80" y="578" font-size="10" font-weight="400" fill="#5a4a3a">~18 GB</text>
  </g>

  <!-- Cells. Fill colors:
       - Green (fits): #4a7c5a or #d4ebd9 light
       - Yellow (tight): #c89c3c or #f5e6c4 light
       - Gray (doesn't fit): #cccccc -->

  <!-- Row 1: <1B - fits everywhere -->
  <g>
    <rect x="180" y="170" width="280" height="80" fill="#d4ebd9" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="320" y="200" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">SmolLM2-360M</text>
    <text x="320" y="220" font-size="11" text-anchor="middle" fill="#1a1a2e">Qwen3-0.6B</text>
    <text x="320" y="238" font-size="11" text-anchor="middle" fill="#1a1a2e">Liquid LFM2.5-350M</text>

    <rect x="460" y="170" width="280" height="80" fill="#d4ebd9" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="600" y="200" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">SmolLM2-1.7B</text>
    <text x="600" y="220" font-size="11" text-anchor="middle" fill="#1a1a2e">Qwen3-0.6B fp16</text>
    <text x="600" y="238" font-size="11" text-anchor="middle" fill="#1a1a2e">Liquid LFM2.5-350M</text>

    <rect x="740" y="170" width="280" height="80" fill="#d4ebd9" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="880" y="200" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">All small models</text>
    <text x="880" y="220" font-size="11" text-anchor="middle" fill="#1a1a2e">fp16, multiple in</text>
    <text x="880" y="238" font-size="11" text-anchor="middle" fill="#1a1a2e">memory at once</text>

    <rect x="1020" y="170" width="280" height="80" fill="#d4ebd9" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="1160" y="200" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">trivial fit</text>
    <text x="1160" y="220" font-size="11" text-anchor="middle" fill="#1a1a2e">use larger instead</text>
  </g>

  <!-- Row 2: 1-3B -->
  <g>
    <rect x="180" y="250" width="280" height="80" fill="#f5e6c4" stroke="#c89c3c" stroke-width="1.5"/>
    <text x="320" y="280" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Apple Foundation 3B</text>
    <text x="320" y="298" font-size="11" text-anchor="middle" fill="#1a1a2e">Phi-4-mini</text>
    <text x="320" y="316" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">tight; ANE-only path</text>

    <rect x="460" y="250" width="280" height="80" fill="#d4ebd9" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="600" y="280" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Gemma 3 2B</text>
    <text x="600" y="298" font-size="11" text-anchor="middle" fill="#1a1a2e">Phi-4-mini</text>
    <text x="600" y="316" font-size="11" text-anchor="middle" fill="#1a1a2e">Apple Foundation 3B</text>

    <rect x="740" y="250" width="280" height="80" fill="#d4ebd9" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="880" y="280" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">all 1-3B fp16</text>
    <text x="880" y="298" font-size="11" text-anchor="middle" fill="#1a1a2e">+ app working memory</text>

    <rect x="1020" y="250" width="280" height="80" fill="#d4ebd9" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="1160" y="280" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">trivial</text>
  </g>

  <!-- Row 3: 3-8B -->
  <g>
    <rect x="180" y="330" width="280" height="80" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
    <text x="320" y="370" font-size="13" font-weight="700" text-anchor="middle" fill="#666">not feasible</text>

    <rect x="460" y="330" width="280" height="80" fill="#f5e6c4" stroke="#c89c3c" stroke-width="1.5"/>
    <text x="600" y="360" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Llama-3.2 7B 4-bit</text>
    <text x="600" y="378" font-size="11" text-anchor="middle" fill="#1a1a2e">Mistral 7B 4-bit</text>
    <text x="600" y="396" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">slow tokens/s</text>

    <rect x="740" y="330" width="280" height="80" fill="#d4ebd9" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="880" y="358" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Qwen3-7B 4-bit</text>
    <text x="880" y="376" font-size="11" text-anchor="middle" fill="#1a1a2e">Llama-3.2 8B 4-bit</text>
    <text x="880" y="394" font-size="11" text-anchor="middle" fill="#1a1a2e">DeepSeek-Coder 7B</text>

    <rect x="1020" y="330" width="280" height="80" fill="#d4ebd9" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="1160" y="370" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Qwen3-7B fp16</text>
    <text x="1160" y="388" font-size="11" text-anchor="middle" fill="#1a1a2e">Llama-3.2 8B fp16</text>
  </g>

  <!-- Row 4: 8-15B -->
  <g>
    <rect x="180" y="410" width="280" height="80" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
    <text x="320" y="450" font-size="13" font-weight="700" text-anchor="middle" fill="#666">not feasible</text>

    <rect x="460" y="410" width="280" height="80" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
    <text x="600" y="450" font-size="13" font-weight="700" text-anchor="middle" fill="#666">not feasible</text>

    <rect x="740" y="410" width="280" height="80" fill="#f5e6c4" stroke="#c89c3c" stroke-width="1.5"/>
    <text x="880" y="440" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Llama-3.2 13B 4-bit</text>
    <text x="880" y="458" font-size="11" text-anchor="middle" fill="#1a1a2e">Mistral Nemo 12B 4-bit</text>
    <text x="880" y="476" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">single model only</text>

    <rect x="1020" y="410" width="280" height="80" fill="#d4ebd9" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="1160" y="440" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Llama-3.2 13B fp16</text>
    <text x="1160" y="458" font-size="11" text-anchor="middle" fill="#1a1a2e">Mistral Nemo 12B fp16</text>
    <text x="1160" y="476" font-size="11" text-anchor="middle" fill="#1a1a2e">Mixtral 8x7B 4-bit (MoE)</text>
  </g>

  <!-- Row 5: 30B+ -->
  <g>
    <rect x="180" y="490" width="280" height="80" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
    <text x="320" y="530" font-size="13" font-weight="700" text-anchor="middle" fill="#666">not feasible</text>

    <rect x="460" y="490" width="280" height="80" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
    <text x="600" y="530" font-size="13" font-weight="700" text-anchor="middle" fill="#666">not feasible</text>

    <rect x="740" y="490" width="280" height="80" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
    <text x="880" y="530" font-size="13" font-weight="700" text-anchor="middle" fill="#666">not feasible on 16 GB</text>

    <rect x="1020" y="490" width="280" height="80" fill="#d4ebd9" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="1160" y="520" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Qwen3-32B 4-bit</text>
    <text x="1160" y="538" font-size="11" text-anchor="middle" fill="#1a1a2e">Llama-3.3 70B 4-bit (tight)</text>
    <text x="1160" y="556" font-size="11" text-anchor="middle" fill="#1a1a2e">DeepSeek-V3 4-bit (MoE)</text>
  </g>

  <!-- Arrow + annotation: "the line that moved" -->
  <line x1="630" y1="600" x2="1010" y2="600" stroke="#0f3460" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="1010,600 1000,594 1000,606" fill="#0f3460"/>
  <text x="820" y="592" font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">Apple Silicon unified memory moved the practical ceiling from ~7B (2023) to ~30B (2026)</text>

  <!-- Legend -->
  <g transform="translate(180, 624)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#1a1a2e">Legend</text>
    <rect x="100" y="0" width="20" height="16" fill="#d4ebd9" stroke="#4a7c5a" stroke-width="1.5"/>
    <text x="128" y="13" font-size="12" fill="#1a1a2e">fits, comfortable</text>
    <rect x="290" y="0" width="20" height="16" fill="#f5e6c4" stroke="#c89c3c" stroke-width="1.5"/>
    <text x="318" y="13" font-size="12" fill="#1a1a2e">fits, tight</text>
    <rect x="430" y="0" width="20" height="16" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
    <text x="458" y="13" font-size="12" fill="#1a1a2e">does not fit at 4-bit</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="180" y="680" width="1120" height="100" fill="#f7f9fc" stroke="#0f3460" stroke-width="1.2" rx="3"/>
  <text x="740" y="708" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">The unified-memory line is the key boundary, not the discrete-GPU line</text>
  <text x="740" y="730" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">A 24 GB discrete GPU dedicates all RAM to the model. A 32 GB Apple Silicon Mac shares unified memory across model and OS,</text>
  <text x="740" y="746" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">so the practical "developer laptop fit" jumped from 7B in 2023 to 30B in 2026. Quantization closed the quality gap;</text>
  <text x="740" y="762" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">unified memory closed the capacity gap. Both changes together rewrote the edge-vs-cloud decision.</text>
</svg>
