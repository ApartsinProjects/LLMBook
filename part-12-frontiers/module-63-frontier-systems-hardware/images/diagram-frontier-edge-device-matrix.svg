<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <title>What fits on device, 2026</title>
  <rect width="1100" height="620" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">What fits on device, 2026</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Open-weight model by device RAM. 4-bit quantization unless noted.</text>

  <!-- Column headers -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#0f3460">
    <rect x="180" y="100" width="220" height="38" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="290" y="124">Phone (4-6 GB)</text>
    <rect x="400" y="100" width="220" height="38" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="510" y="124">Tablet (8-12 GB)</text>
    <rect x="620" y="100" width="220" height="38" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="730" y="124">Laptop (16 GB)</text>
    <rect x="840" y="100" width="220" height="38" fill="#eef4fa" stroke="#1a4078" stroke-width="1.5"/>
    <text x="950" y="124">Workstation (32 GB)</text>
  </g>

  <!-- Row labels -->
  <g font-size="12" font-weight="700" fill="#1a1a2e">
    <text x="20" y="172">&lt; 1B</text>
    <text x="20" y="222">1-3B</text>
    <text x="20" y="272">3-8B</text>
    <text x="20" y="322">8-15B</text>
    <text x="20" y="372">30B+</text>
  </g>

  <!-- Row 1: <1B -->
  <rect x="180" y="148" width="220" height="44" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="290" y="176" font-size="12" text-anchor="middle" fill="#1a1a2e">SmolLM2, Qwen3-0.6B</text>
  <rect x="400" y="148" width="220" height="44" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="510" y="176" font-size="12" text-anchor="middle" fill="#1a1a2e">SmolLM2-1.7B fp16</text>
  <rect x="620" y="148" width="220" height="44" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="730" y="176" font-size="12" text-anchor="middle" fill="#1a1a2e">multiple at once</text>
  <rect x="840" y="148" width="220" height="44" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="950" y="176" font-size="12" text-anchor="middle" fill="#1a1a2e">trivial</text>

  <!-- Row 2: 1-3B -->
  <rect x="180" y="198" width="220" height="44" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/>
  <text x="290" y="220" font-size="12" text-anchor="middle" fill="#1a1a2e">Phi-4-mini, Apple 3B</text>
  <text x="290" y="234" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">tight</text>
  <rect x="400" y="198" width="220" height="44" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="510" y="226" font-size="12" text-anchor="middle" fill="#1a1a2e">Gemma 3 2B, Phi-4-mini</text>
  <rect x="620" y="198" width="220" height="44" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="730" y="226" font-size="12" text-anchor="middle" fill="#1a1a2e">all 1-3B fp16</text>
  <rect x="840" y="198" width="220" height="44" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="950" y="226" font-size="12" text-anchor="middle" fill="#1a1a2e">trivial</text>

  <!-- Row 3: 3-8B -->
  <rect x="180" y="248" width="220" height="44" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
  <text x="290" y="276" font-size="12" text-anchor="middle" fill="#666">no fit</text>
  <rect x="400" y="248" width="220" height="44" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/>
  <text x="510" y="270" font-size="12" text-anchor="middle" fill="#1a1a2e">Llama-3.2 7B 4-bit</text>
  <text x="510" y="284" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">slow tokens/s</text>
  <rect x="620" y="248" width="220" height="44" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="730" y="276" font-size="12" text-anchor="middle" fill="#1a1a2e">Qwen3-7B, Llama-3.2 8B</text>
  <rect x="840" y="248" width="220" height="44" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="950" y="276" font-size="12" text-anchor="middle" fill="#1a1a2e">7-8B fp16</text>

  <!-- Row 4: 8-15B -->
  <rect x="180" y="298" width="220" height="44" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
  <text x="290" y="326" font-size="12" text-anchor="middle" fill="#666">no fit</text>
  <rect x="400" y="298" width="220" height="44" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
  <text x="510" y="326" font-size="12" text-anchor="middle" fill="#666">no fit</text>
  <rect x="620" y="298" width="220" height="44" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/>
  <text x="730" y="320" font-size="12" text-anchor="middle" fill="#1a1a2e">Llama-3.2 13B 4-bit</text>
  <text x="730" y="334" font-size="10" font-style="italic" text-anchor="middle" fill="#5a4a3a">single model only</text>
  <rect x="840" y="298" width="220" height="44" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="950" y="326" font-size="12" text-anchor="middle" fill="#1a1a2e">Mixtral 8x7B 4-bit</text>

  <!-- Row 5: 30B+ -->
  <rect x="180" y="348" width="220" height="44" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
  <text x="290" y="376" font-size="12" text-anchor="middle" fill="#666">no fit</text>
  <rect x="400" y="348" width="220" height="44" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
  <text x="510" y="376" font-size="12" text-anchor="middle" fill="#666">no fit</text>
  <rect x="620" y="348" width="220" height="44" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
  <text x="730" y="376" font-size="12" text-anchor="middle" fill="#666">no fit</text>
  <rect x="840" y="348" width="220" height="44" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
  <text x="950" y="370" font-size="12" text-anchor="middle" fill="#1a1a2e">Qwen3-32B 4-bit</text>
  <text x="950" y="384" font-size="11" text-anchor="middle" fill="#1a1a2e">Llama-3.3 70B 4-bit</text>

  <!-- The line that moved -->
  <line x1="180" y1="430" x2="1060" y2="430" stroke="#722f8a" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="620" y="422" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Apple Silicon unified memory moved the ceiling from 7B (2023) to 30B (2026)</text>

  <!-- Legend -->
  <g transform="translate(180, 460)">
    <rect x="0" y="0" width="20" height="14" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="28" y="12" font-size="12" fill="#1a1a2e">fits comfortably</text>
    <rect x="170" y="0" width="20" height="14" fill="#fef3e0" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="198" y="12" font-size="12" fill="#1a1a2e">fits but tight</text>
    <rect x="320" y="0" width="20" height="14" fill="#dddddd" stroke="#888" stroke-width="1.5"/>
    <text x="348" y="12" font-size="12" fill="#1a1a2e">does not fit at 4-bit</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 500)">
    <rect x="0" y="0" width="1020" height="100" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Unified memory, not discrete VRAM, is the 2026 edge boundary</text>
    <text x="510" y="56" font-size="12" text-anchor="middle" fill="#1a1a2e">Quantization closed the quality gap; unified memory closed the capacity gap.</text>
    <text x="510" y="78" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">Together they rewrote the edge-vs-cloud decision.</text>
  </g>
</svg>
