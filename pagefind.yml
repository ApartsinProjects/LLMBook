# Pagefind config for "Building Conversational AI with LLMs and Agents"
# Indexes the HTML book content; excludes build artifacts and dependencies.

site: "."
output_path: "pagefind"

# Skip non-content directories. Pagefind uses glob patterns.
exclude_selectors:
  - "header.chapter-header"
  - "nav"
  - "footer"
  - ".chapter-nav"
  - ".prerequisites"
  - "pre"            # code blocks add a lot of low-value noise
  - "script"
  - "style"
  - ".math-block"    # math equations confuse the indexer
  - ".epigraph"

glob: "{front-matter,part-*,appendices,toc.html,index.html}/**/*.html"

# Force the site language (one section index lacks lang=en)
force_language: "en"
