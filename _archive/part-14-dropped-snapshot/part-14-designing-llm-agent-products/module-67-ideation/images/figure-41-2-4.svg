<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>LLM product iteration cycle</title>
  <rect width="1100" height="540" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">LLM product iteration cycle</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">A 1-2 week loop, no release event needed</text>

  <defs>
    <linearGradient id="g4124A" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#eef4fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dbe6f2" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g4124B" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ecf6ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d8ecdd" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g4124C" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f4ecf7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e6d6ed" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g4124D" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5dc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fae9be" stop-opacity="1"/>
    </linearGradient>
    <marker id="arr4124" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <!-- Stage 1: Evaluate (top-left) -->
  <g transform="translate(160, 130)">
    <rect x="0" y="0" width="220" height="90" rx="10" fill="url(#g4124A)" stroke="#0f3460" stroke-width="2.5"/>
    <text x="110" y="36" font-size="16" font-weight="700" text-anchor="middle" fill="#0f3460">1. Evaluate</text>
    <text x="110" y="58" font-size="12" text-anchor="middle" fill="#1a1a2e">run fresh eval set,</text>
    <text x="110" y="76" font-size="12" text-anchor="middle" fill="#1a1a2e">surface failure cases</text>
  </g>

  <!-- Stage 2: Tune (top-right) -->
  <g transform="translate(720, 130)">
    <rect x="0" y="0" width="220" height="90" rx="10" fill="url(#g4124B)" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="110" y="36" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">2. Tune</text>
    <text x="110" y="58" font-size="12" text-anchor="middle" fill="#1a1a2e">prompts, retrieval,</text>
    <text x="110" y="76" font-size="12" text-anchor="middle" fill="#1a1a2e">or fine-tune data</text>
  </g>

  <!-- Stage 3: A/B test (bottom-right) -->
  <g transform="translate(720, 350)">
    <rect x="0" y="0" width="220" height="90" rx="10" fill="url(#g4124C)" stroke="#722f8a" stroke-width="2.5"/>
    <text x="110" y="36" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">3. A/B test</text>
    <text x="110" y="58" font-size="12" text-anchor="middle" fill="#1a1a2e">candidate vs prod</text>
    <text x="110" y="76" font-size="12" text-anchor="middle" fill="#1a1a2e">on real-user slice</text>
  </g>

  <!-- Stage 4: Ship (bottom-left) -->
  <g transform="translate(160, 350)">
    <rect x="0" y="0" width="220" height="90" rx="10" fill="url(#g4124D)" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="110" y="36" font-size="16" font-weight="700" text-anchor="middle" fill="#a67c1a">4. Ship</text>
    <text x="110" y="58" font-size="12" text-anchor="middle" fill="#1a1a2e">deploy winner,</text>
    <text x="110" y="76" font-size="12" text-anchor="middle" fill="#1a1a2e">add regressions to eval</text>
  </g>

  <!-- Centre annotation -->
  <g transform="translate(420, 240)">
    <rect x="0" y="0" width="260" height="100" rx="10" fill="#ffffff" stroke="#5a4a3a" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="130" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#5a4a3a">1-2 week loop</text>
    <text x="130" y="56" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">prompts and routing change</text>
    <text x="130" y="72" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">without a code release;</text>
    <text x="130" y="88" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">eval set grows every cycle</text>
  </g>

  <!-- Cyclic arrows (clockwise) -->
  <!-- Evaluate -> Tune (top) -->
  <line x1="380" y1="175" x2="715" y2="175" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr4124)"/>
  <!-- Tune -> A/B test (right) -->
  <line x1="830" y1="220" x2="830" y2="345" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr4124)"/>
  <!-- A/B test -> Ship (bottom) -->
  <line x1="715" y1="395" x2="385" y2="395" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr4124)"/>
  <!-- Ship -> Evaluate (left) -->
  <line x1="270" y1="345" x2="270" y2="225" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr4124)"/>

  <!-- Takeaway -->
  <g transform="translate(40, 470)">
    <rect x="0" y="0" width="1020" height="60" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Unlike traditional software, LLM behavior changes without a code deploy</text>
    <text x="510" y="46" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">A prompt edit or routing tweak ships behavior the same hour, so the cycle is faster than feature-cadence releases.</text>
  </g>
</svg>
