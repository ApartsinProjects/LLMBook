<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="850" fill="#ffffff"/>

  <text x="700" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Self-host breakeven is a utilization story, not a scale story</text>
  <text x="700" y="74" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4a3a">Cost per million tokens vs sustained GPU utilization for Llama-4-70B (4-bit on H100 at $3/hr) vs OpenRouter API.</text>

  <text x="700" y="765" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e">Sustained GPU utilization (%)</text>
  <text x="60" y="430" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a2e" transform="rotate(-90 60 430)">Cost per 1M tokens (USD)</text>

  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="160" y1="700" x2="1320" y2="700"/>
    <line x1="160" y1="585" x2="1320" y2="585"/>
    <line x1="160" y1="470" x2="1320" y2="470"/>
    <line x1="160" y1="355" x2="1320" y2="355"/>
    <line x1="160" y1="240" x2="1320" y2="240"/>
    <line x1="160" y1="125" x2="1320" y2="125"/>
  </g>
  <g font-size="11" fill="#5a4a3a" text-anchor="end">
    <text x="150" y="704">$0.00</text>
    <text x="150" y="589">$0.50</text>
    <text x="150" y="474">$1.00</text>
    <text x="150" y="359">$1.50</text>
    <text x="150" y="244">$2.00</text>
    <text x="150" y="129">$2.50</text>
  </g>

  <line x1="160" y1="125" x2="160" y2="700" stroke="#1a1a2e" stroke-width="1.2"/>
  <line x1="160" y1="700" x2="1320" y2="700" stroke="#1a1a2e" stroke-width="1.2"/>

  <g stroke="#d4d4d4" stroke-width="0.8" stroke-dasharray="2,3">
    <line x1="276" y1="125" x2="276" y2="700"/>
    <line x1="392" y1="125" x2="392" y2="700"/>
    <line x1="508" y1="125" x2="508" y2="700"/>
    <line x1="624" y1="125" x2="624" y2="700"/>
    <line x1="740" y1="125" x2="740" y2="700"/>
    <line x1="856" y1="125" x2="856" y2="700"/>
    <line x1="972" y1="125" x2="972" y2="700"/>
    <line x1="1088" y1="125" x2="1088" y2="700"/>
    <line x1="1204" y1="125" x2="1204" y2="700"/>
  </g>
  <g font-size="11" fill="#5a4a3a" text-anchor="middle">
    <text x="160" y="720">10</text>
    <text x="276" y="720">20</text>
    <text x="392" y="720">30</text>
    <text x="508" y="720">40</text>
    <text x="624" y="720">50</text>
    <text x="740" y="720">60</text>
    <text x="856" y="720">70</text>
    <text x="972" y="720">80</text>
    <text x="1088" y="720">90</text>
    <text x="1204" y="720">100</text>
  </g>

  <line x1="160" y1="603" x2="1320" y2="603" stroke="#1a4078" stroke-width="3"/>
  <text x="1080" y="595" font-size="13" font-weight="700" fill="#1a4078">API (OpenRouter): $0.30/1M flat</text>

  <polyline points="160,148 218,253 276,332 334,388 392,427 450,455 508,477 566,493 624,506 682,517 740,525 798,533 856,539 914,544 972,549 1030,553 1088,556 1146,560 1204,562 1262,565 1320,568" fill="none" stroke="#1f7a3a" stroke-width="3"/>
  <text x="280" y="200" font-size="13" font-weight="700" fill="#1f7a3a">Self-hosted vLLM on H100</text>
  <text x="280" y="216" font-size="12" font-style="italic" fill="#1f7a3a">cost = $3 / (12.6M tok/hr / 1M / u)</text>

  <line x1="972" y1="125" x2="972" y2="700" stroke="#d4b96a" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="982" y="148" font-size="13" font-weight="700" fill="#a67c1a">Breakeven @ 80%</text>
  <circle cx="972" cy="603" r="7" fill="#d4b96a" stroke="#1a1a2e" stroke-width="1.5"/>

  <g transform="translate(990, 600)">
    <rect x="0" y="-22" width="240" height="44" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="120" y="-5" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">$0.30 / 1M at u = 80%</text>
    <text x="120" y="13" font-size="11" text-anchor="middle" fill="#1a1a2e">below this, API wins on cost</text>
  </g>

  <g transform="translate(220, 380)">
    <rect x="0" y="0" width="260" height="64" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.5"/>
    <text x="130" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#b3401b">API zone</text>
    <text x="130" y="42" font-size="11" text-anchor="middle" fill="#1a1a2e">at u &lt; 80% the per-token cost</text>
    <text x="130" y="56" font-size="11" text-anchor="middle" fill="#1a1a2e">of self-hosting exceeds $0.30</text>
  </g>

  <g transform="translate(1040, 642)">
    <rect x="0" y="0" width="240" height="50" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="120" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#1f7a3a">Self-host zone</text>
    <text x="120" y="40" font-size="11" text-anchor="middle" fill="#1a1a2e">at u &gt; 80% self-host wins</text>
  </g>

  <g transform="translate(160, 790)">
    <rect x="0" y="0" width="1160" height="44" rx="6" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
    <text x="20" y="20" font-size="13" font-weight="700" fill="#a67c1a">Takeaway</text>
    <text x="20" y="38" font-size="12" fill="#1a1a2e">A 1M-request-per-day workload at 30% utilization still loses to the API. The same workload at 80% wins by 3x. Utilization, not raw volume, is the crossover variable.</text>
  </g>
</svg>
