<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Realtime API protocols</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Realtime API protocols</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">WebSocket bidirectional vs WebRTC peer-to-peer</text>
  <defs><linearGradient id="g_38_2_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_38_2_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_38_2_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_38_2_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_38_2_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_38_2_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_38_2_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_38_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_38_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_38_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_38_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<text x="280" y="100" font-size="15" font-weight="700" text-anchor="middle" fill="#0f3460">WebSocket realtime</text><g transform="translate(40,130)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_38_2_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Client</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">browser/app</text></g><g transform="translate(310,130)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_38_2_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">WS gateway</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">duplex JSON+PCM</text></g><g transform="translate(580,130)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_38_2_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">LLM service</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">OpenAI / Gemini</text></g><line x1="241" y1="175" x2="309" y2="175" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_38_2_1)"/><line x1="511" y1="175" x2="579" y2="175" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_38_2_1)"/><line x1="579" y1="195" x2="511" y2="195" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG_38_2_1)"/><line x1="309" y1="195" x2="241" y2="195" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG_38_2_1)"/><text x="820" y="100" font-size="15" font-weight="700" text-anchor="middle" fill="#b3401b">WebRTC realtime</text><g transform="translate(40,280)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_38_2_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Client</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">browser/app</text></g><g transform="translate(310,280)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_38_2_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">TURN/STUN</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">NAT traversal</text></g><g transform="translate(580,280)"><rect x="0" y="0" width="200" height="90" rx="10" fill="url(#g_38_2_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="100" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Model peer</text><text x="100" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">audio/video tracks</text></g><line x1="241" y1="325" x2="309" y2="325" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_38_2_1)"/><line x1="511" y1="325" x2="579" y2="325" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_38_2_1)"/><line x1="579" y1="345" x2="511" y2="345" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG_38_2_1)"/><line x1="309" y1="345" x2="241" y2="345" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#arrG_38_2_1)"/><g transform="translate(40,410)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">WebSocket is simpler, WebRTC is lower latency</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">WebSocket: easy auth, server-side recording, +50ms over WebRTC.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">WebRTC: best for voice agents; harder to operate (TURN servers, codec negotiation).</text></g></svg>
