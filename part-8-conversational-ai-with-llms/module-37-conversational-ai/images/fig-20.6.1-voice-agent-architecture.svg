<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <title>Voice agent architecture: pipeline vs agentic loop</title>
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722f8a"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Voice pipeline vs voice agent</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Linear chain answers one shot; agentic loop reasons and calls tools</text>

  <g transform="translate(60, 100)">
    <rect width="980" height="100" rx="10" fill="#eef4fa" stroke="#1a4078" stroke-width="2.5"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#1a4078">1. Simple pipeline (single-shot)</text>

    <rect x="60" y="48" width="180" height="40" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="150" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">STT</text>

    <rect x="400" y="48" width="180" height="40" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="490" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">LLM</text>

    <rect x="740" y="48" width="180" height="40" rx="6" fill="#ffffff" stroke="#1a4078" stroke-width="1.5"/>
    <text x="830" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">TTS</text>

    <line x1="240" y1="68" x2="398" y2="68" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="580" y1="68" x2="738" y2="68" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <g transform="translate(60, 220)">
    <rect width="980" height="200" rx="10" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#1f7a3a">2. Voice agent (multi-step loop)</text>

    <rect x="40" y="60" width="140" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="110" y="95" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">STT</text>

    <g transform="translate(200, 50)">
      <rect width="540" height="130" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="270" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#722f8a">Agent loop</text>

      <rect x="20" y="44" width="150" height="64" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="95" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Reason</text>

      <rect x="195" y="44" width="150" height="64" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="270" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Tool calls</text>

      <rect x="370" y="44" width="150" height="64" rx="6" fill="#ffffff" stroke="#722f8a" stroke-width="1.5"/>
      <text x="445" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a2e">Compose</text>

      <line x1="170" y1="76" x2="194" y2="76" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
      <line x1="345" y1="76" x2="369" y2="76" stroke="#1a1a2e" stroke-width="1.4" marker-end="url(#arr)"/>
      <path d="M 445 110 Q 270 130 95 110" fill="none" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrPurple)"/>
    </g>

    <rect x="760" y="80" width="180" height="60" rx="6" fill="#ffffff" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="850" y="115" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Streaming TTS</text>

    <line x1="180" y1="90" x2="218" y2="90" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="740" y1="110" x2="758" y2="110" stroke="#1a1a2e" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <g transform="translate(60, 440)">
    <rect width="980" height="60" rx="6" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#a67c1a">Latency management</text>
    <text x="20" y="46" font-size="12" fill="#1a1a2e">Mask tool-call delay with progressive responses, filler speech, and parallel tool calls.</text>
  </g>

  <g transform="translate(60, 520)">
    <rect width="980" height="64" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1f7a3a">Key idea</text>
    <text x="20" y="48" font-size="12" fill="#1a1a2e">A pipeline answers in one shot. An agent wraps a reasoning loop with tool calls, then streams filler audio to mask multi-second latency.</text>
  </g>
</svg>
