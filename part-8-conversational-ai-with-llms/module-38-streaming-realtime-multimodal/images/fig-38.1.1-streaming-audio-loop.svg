<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Streaming audio loop</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Streaming audio loop</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each box adds latency; overlap as much as possible</text>
  <defs><linearGradient id="g_38_1_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_38_1_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_38_1_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_38_1_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_38_1_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_38_1_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_38_1_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_38_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_38_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_38_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_38_1_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,150)"><rect x="0" y="0" width="150" height="90" rx="10" fill="url(#g_38_1_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="75" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Mic capture</text><text x="75" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">20ms frames</text></g><g transform="translate(210,150)"><rect x="0" y="0" width="150" height="90" rx="10" fill="url(#g_38_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="75" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">VAD</text><text x="75" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">endpoint detect</text></g><g transform="translate(380,150)"><rect x="0" y="0" width="150" height="90" rx="10" fill="url(#g_38_1_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="75" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Streaming ASR</text><text x="75" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">partials</text></g><g transform="translate(550,150)"><rect x="0" y="0" width="160" height="90" rx="10" fill="url(#g_38_1_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="80" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">LLM</text><text x="80" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">incremental decode</text></g><g transform="translate(730,150)"><rect x="0" y="0" width="160" height="90" rx="10" fill="url(#g_38_1_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="80" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Streaming TTS</text><text x="80" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">chunked audio</text></g><g transform="translate(910,150)"><rect x="0" y="0" width="150" height="90" rx="10" fill="url(#g_38_1_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="75" y="37" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Speaker</text><text x="75" y="57" font-size="11" text-anchor="middle" fill="#1a1a2e">playback</text></g><line x1="191" y1="195" x2="209" y2="195" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_38_1_1)"/><line x1="361" y1="195" x2="379" y2="195" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_38_1_1)"/><line x1="531" y1="195" x2="549" y2="195" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_38_1_1)"/><line x1="711" y1="195" x2="729" y2="195" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_38_1_1)"/><line x1="891" y1="195" x2="909" y2="195" stroke="#b3401b" stroke-width="2.5" marker-end="url(#arrR_38_1_1)"/><path d="M 910 250 Q 800 350 400 350 Q 100 350 100 270" fill="none" stroke="#5a4a3a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr_38_1_1)"/><text x="550" y="370" font-size="12" font-weight="400" text-anchor="middle" fill="#5a4a3a" font-style="italic">Barge-in: user speaks, cancel TTS</text><g transform="translate(40,400)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Latency is additive but overlappable</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">VAD + partial ASR + speculative LLM + chunked TTS can hit &lt;300 ms voice-to-voice on a 2026 GPU.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Barge-in handling is the hardest UX bit: cancel mid-stream cleanly.</text></g></svg>
