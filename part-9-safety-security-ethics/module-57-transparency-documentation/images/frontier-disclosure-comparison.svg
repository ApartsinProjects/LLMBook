<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Frontier-lab disclosure frameworks (2026)</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Frontier-lab disclosure frameworks (2026)</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Each lab has its own structure; coverage of risk categories varies</text>
  <defs><linearGradient id="g_57_3_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_57_3_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_57_3_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_57_3_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_57_3_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_57_3_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_57_3_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_57_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_57_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_57_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_57_3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(60,130)"><rect x="0" y="0" width="320" height="56" rx="10" fill="url(#g_57_3_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="160" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">OpenAI Preparedness</text></g><g transform="translate(400,130)"><rect x="0" y="0" width="660" height="56" rx="10" fill="url(#g_57_3_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="330" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Cyber, CBRN, Persuasion, Autonomy</text></g><g transform="translate(60,200)"><rect x="0" y="0" width="320" height="56" rx="10" fill="url(#g_57_3_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="160" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Anthropic RSP</text></g><g transform="translate(400,200)"><rect x="0" y="0" width="660" height="56" rx="10" fill="url(#g_57_3_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="330" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">ASL-1 .. ASL-4 capability tiers</text></g><g transform="translate(60,270)"><rect x="0" y="0" width="320" height="56" rx="10" fill="url(#g_57_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="160" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Google Frontier</text></g><g transform="translate(400,270)"><rect x="0" y="0" width="660" height="56" rx="10" fill="url(#g_57_3_1_green)" stroke="#1f7a3a" stroke-width="2.5"/><text x="330" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a3a">Misuse, Misalignment, Mistakes</text></g><g transform="translate(60,340)"><rect x="0" y="0" width="320" height="56" rx="10" fill="url(#g_57_3_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="160" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Meta CompactSafety</text></g><g transform="translate(400,340)"><rect x="0" y="0" width="660" height="56" rx="10" fill="url(#g_57_3_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="330" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Critical, High, Moderate</text></g><g transform="translate(40,440)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Frameworks rhyme but do not align</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Auditing one model under multiple frameworks remains a manual cross-walk.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Cross-walks (NIST AI RMF, ISO 42001) are emerging but not yet a shared standard.</text></g></svg>
