<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Helvetica, Arial, sans-serif">
  <title>Multimodal guardrail stack</title>
  <rect width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Multimodal guardrail stack</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Per-modality classifiers feed a unified policy engine</text>
  <defs><linearGradient id="g_50_5_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_50_5_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_50_5_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_50_5_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_50_5_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_50_5_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_50_5_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_50_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_50_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_50_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_50_5_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<g transform="translate(40,130)"><rect x="0" y="0" width="170" height="80" rx="10" fill="url(#g_50_5_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="85" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Image input</text></g><g transform="translate(40,230)"><rect x="0" y="0" width="170" height="80" rx="10" fill="url(#g_50_5_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="85" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Audio input</text></g><g transform="translate(40,330)"><rect x="0" y="0" width="170" height="80" rx="10" fill="url(#g_50_5_1_purple)" stroke="#722f8a" stroke-width="2.5"/><text x="85" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#722f8a">Text input</text></g><g transform="translate(250,130)"><rect x="0" y="0" width="200" height="80" rx="10" fill="url(#g_50_5_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">NSFW / CSAM</text><text x="100" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">image classifier</text></g><g transform="translate(250,230)"><rect x="0" y="0" width="200" height="80" rx="10" fill="url(#g_50_5_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Voice ID</text><text x="100" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">speaker spoofing</text></g><g transform="translate(250,330)"><rect x="0" y="0" width="200" height="80" rx="10" fill="url(#g_50_5_1_navy)" stroke="#0f3460" stroke-width="2.5"/><text x="100" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3460">Toxicity</text><text x="100" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">text classifier</text></g><g transform="translate(490,230)"><rect x="0" y="0" width="240" height="80" rx="10" fill="url(#g_50_5_1_amber)" stroke="#a67c1a" stroke-width="2.5"/><text x="120" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#a67c1a">Policy engine</text><text x="120" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">merge + apply rules</text></g><g transform="translate(770,230)"><rect x="0" y="0" width="290" height="80" rx="10" fill="url(#g_50_5_1_red)" stroke="#b3401b" stroke-width="2.5"/><text x="145" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#b3401b">Decision</text><text x="145" y="52" font-size="11" text-anchor="middle" fill="#1a1a2e">allow / sanitize / block</text></g><line x1="211" y1="170" x2="249" y2="170" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_50_5_1)"/><line x1="211" y1="270" x2="249" y2="270" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_50_5_1)"/><line x1="211" y1="370" x2="249" y2="370" stroke="#722f8a" stroke-width="2.5" marker-end="url(#arr_50_5_1)"/><line x1="451" y1="170" x2="489" y2="270" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_50_5_1)"/><line x1="451" y1="270" x2="489" y2="270" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_50_5_1)"/><line x1="451" y1="370" x2="489" y2="270" stroke="#0f3460" stroke-width="2.5" marker-end="url(#arr_50_5_1)"/><line x1="731" y1="270" x2="769" y2="270" stroke="#a67c1a" stroke-width="2.5" marker-end="url(#arrA_50_5_1)"/><g transform="translate(40,460)"><rect x="0" y="0" width="1020" height="72" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">One policy, multiple sensors</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Each modality has its own classifier; the policy engine reconciles them into a single decision.</text><text x="510" y="52" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">Catch cross-modal attacks (image with embedded text instructions) at the policy layer.</text></g></svg>
