<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <title>Watermark detection rate vs perturbation</title>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Watermark detection rate vs perturbation</text>
  <text x="550" y="60" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Three perturbation classes, three watermark technologies</text>
  <defs><linearGradient id="g_56_2_1_navy" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_56_2_1_navy2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="100%" stop-color="#dbe6f2"/></linearGradient><linearGradient id="g_56_2_1_green" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ecf6ee"/><stop offset="100%" stop-color="#d8ecdd"/></linearGradient><linearGradient id="g_56_2_1_purple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f4ecf7"/><stop offset="100%" stop-color="#e6d4ef"/></linearGradient><linearGradient id="g_56_2_1_amber" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5dc"/><stop offset="100%" stop-color="#fae9be"/></linearGradient><linearGradient id="g_56_2_1_red" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fdeee8"/><stop offset="100%" stop-color="#f9d9c9"/></linearGradient><linearGradient id="g_56_2_1_neutral" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient><marker id="arr_56_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/></marker><marker id="arrG_56_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/></marker><marker id="arrA_56_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c1a"/></marker><marker id="arrR_56_2_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401b"/></marker></defs>
<text x="185" y="410" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Light</text><rect x="120" y="148" width="70" height="232" rx="6" fill="url(#g_56_2_1_green)" stroke="#1f7a3a" stroke-width="2"/><text x="155" y="140" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">97%</text><rect x="198" y="152" width="70" height="228" rx="6" fill="url(#g_56_2_1_navy)" stroke="#0f3460" stroke-width="2"/><text x="233" y="144" font-size="11" font-weight="700" text-anchor="middle" fill="#0f3460">95%</text><rect x="276" y="140" width="70" height="240" rx="6" fill="url(#g_56_2_1_red)" stroke="#b3401b" stroke-width="2"/><text x="311" y="132" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">100%</text><text x="435" y="410" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Moderate</text><rect x="370" y="169" width="70" height="211" rx="6" fill="url(#g_56_2_1_green)" stroke="#1f7a3a" stroke-width="2"/><text x="405" y="161" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">88%</text><rect x="448" y="193" width="70" height="187" rx="6" fill="url(#g_56_2_1_navy)" stroke="#0f3460" stroke-width="2"/><text x="483" y="185" font-size="11" font-weight="700" text-anchor="middle" fill="#0f3460">78%</text><rect x="526" y="140" width="70" height="240" rx="6" fill="url(#g_56_2_1_red)" stroke="#b3401b" stroke-width="2"/><text x="561" y="132" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">100%</text><text x="685" y="410" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a2e">Heavy</text><rect x="620" y="232" width="70" height="148" rx="6" fill="url(#g_56_2_1_green)" stroke="#1f7a3a" stroke-width="2"/><text x="655" y="224" font-size="11" font-weight="700" text-anchor="middle" fill="#1f7a3a">62%</text><rect x="698" y="282" width="70" height="98" rx="6" fill="url(#g_56_2_1_navy)" stroke="#0f3460" stroke-width="2"/><text x="733" y="274" font-size="11" font-weight="700" text-anchor="middle" fill="#0f3460">41%</text><rect x="776" y="380" width="70" height="0" rx="6" fill="url(#g_56_2_1_red)" stroke="#b3401b" stroke-width="2"/><text x="811" y="372" font-size="11" font-weight="700" text-anchor="middle" fill="#b3401b">0%</text><rect x="60" y="100" width="20" height="20" rx="4" fill="url(#g_56_2_1_green)" stroke="#1f7a3a" stroke-width="2"/><text x="88" y="116" font-size="13" font-weight="700" text-anchor="start" fill="#1f7a3a">SynthID-Text</text><rect x="340" y="100" width="20" height="20" rx="4" fill="url(#g_56_2_1_navy)" stroke="#0f3460" stroke-width="2"/><text x="368" y="116" font-size="13" font-weight="700" text-anchor="start" fill="#0f3460">SynthID-Image</text><rect x="620" y="100" width="20" height="20" rx="4" fill="url(#g_56_2_1_red)" stroke="#b3401b" stroke-width="2"/><text x="648" y="116" font-size="13" font-weight="700" text-anchor="start" fill="#b3401b">C2PA metadata</text><g transform="translate(40,450)"><rect x="0" y="0" width="1020" height="54" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/><text x="510" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Detection drops fast under heavy perturbation</text><text x="510" y="34" font-size="11" font-weight="400" text-anchor="middle" fill="#a67c1a" font-style="italic">C2PA disappears once metadata is stripped; SynthID degrades smoothly.</text></g></svg>
