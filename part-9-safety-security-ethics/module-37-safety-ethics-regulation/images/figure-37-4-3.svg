<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="Helvetica, Arial, sans-serif">
  <title>Regulatory approaches vary by jurisdiction</title>
  <rect width="1100" height="500" fill="#ffffff"/>

  <text x="550" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f3460">Regulatory approaches by jurisdiction</text>
  <text x="550" y="64" font-size="13" font-style="italic" text-anchor="middle" fill="#5a4a3a">Design to the strictest applicable regime</text>

  <defs>
    <linearGradient id="g3743EU" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fdeee8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f9d9c9" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g3743US" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5dc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fae9be" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g3743CN" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f4ecf7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e6d6ed" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g3743UK" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ecf6ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d8ecdd" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Spectrum strip background -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="1020" height="20" rx="10" fill="#eef4fa" stroke="#5a4a3a" stroke-width="1.5"/>
    <text x="20" y="46" font-size="11" font-style="italic" fill="#b3401b">Binding</text>
    <text x="990" y="46" font-size="11" font-style="italic" text-anchor="end" fill="#1f7a3a">Principles-based</text>
  </g>

  <!-- EU -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="240" height="200" rx="10" fill="url(#g3743EU)" stroke="#b3401b" stroke-width="2.5"/>
    <text x="120" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#b3401b">EU</text>
    <text x="120" y="56" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">AI Act</text>
    <line x1="20" y1="74" x2="220" y2="74" stroke="#b3401b" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="120" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#b3401b">Binding obligations</text>
    <text x="120" y="125" font-size="11" text-anchor="middle" fill="#1a1a2e">risk-tier classification,</text>
    <text x="120" y="142" font-size="11" text-anchor="middle" fill="#1a1a2e">conformity assessments,</text>
    <text x="120" y="159" font-size="11" text-anchor="middle" fill="#1a1a2e">CE marking</text>
    <text x="120" y="184" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Up to 7% global turnover</text>
  </g>

  <!-- US -->
  <g transform="translate(300, 160)">
    <rect x="0" y="0" width="240" height="200" rx="10" fill="url(#g3743US)" stroke="#a67c1a" stroke-width="2.5"/>
    <text x="120" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#a67c1a">US</text>
    <text x="120" y="56" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">sectoral + voluntary</text>
    <line x1="20" y1="74" x2="220" y2="74" stroke="#a67c1a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="120" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#a67c1a">Sector-specific</text>
    <text x="120" y="125" font-size="11" text-anchor="middle" fill="#1a1a2e">NIST AI RMF (voluntary),</text>
    <text x="120" y="142" font-size="11" text-anchor="middle" fill="#1a1a2e">FTC, HHS, FDA rules,</text>
    <text x="120" y="159" font-size="11" text-anchor="middle" fill="#1a1a2e">state laws (CA, CO, NYC)</text>
    <text x="120" y="184" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Patchwork enforcement</text>
  </g>

  <!-- China -->
  <g transform="translate(560, 160)">
    <rect x="0" y="0" width="240" height="200" rx="10" fill="url(#g3743CN)" stroke="#722f8a" stroke-width="2.5"/>
    <text x="120" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#722f8a">China</text>
    <text x="120" y="56" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">CAC oversight</text>
    <line x1="20" y1="74" x2="220" y2="74" stroke="#722f8a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="120" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#722f8a">Notification regime</text>
    <text x="120" y="125" font-size="11" text-anchor="middle" fill="#1a1a2e">Cyberspace Administration</text>
    <text x="120" y="142" font-size="11" text-anchor="middle" fill="#1a1a2e">pre-deployment filing,</text>
    <text x="120" y="159" font-size="11" text-anchor="middle" fill="#1a1a2e">generative AI rules (2023)</text>
    <text x="120" y="184" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Content-aligned</text>
  </g>

  <!-- UK -->
  <g transform="translate(820, 160)">
    <rect x="0" y="0" width="240" height="200" rx="10" fill="url(#g3743UK)" stroke="#1f7a3a" stroke-width="2.5"/>
    <text x="120" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#1f7a3a">UK</text>
    <text x="120" y="56" font-size="12" font-style="italic" text-anchor="middle" fill="#5a4a3a">pro-innovation</text>
    <line x1="20" y1="74" x2="220" y2="74" stroke="#1f7a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="120" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#1f7a3a">Principles-based</text>
    <text x="120" y="125" font-size="11" text-anchor="middle" fill="#1a1a2e">existing regulators apply</text>
    <text x="120" y="142" font-size="11" text-anchor="middle" fill="#1a1a2e">cross-cutting principles,</text>
    <text x="120" y="159" font-size="11" text-anchor="middle" fill="#1a1a2e">AI Safety Institute</text>
    <text x="120" y="184" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">No single AI law</text>
  </g>

  <!-- Takeaway -->
  <g transform="translate(40, 400)">
    <rect x="0" y="0" width="1020" height="70" rx="10" fill="#fff5dc" stroke="#a67c1a" stroke-width="1.5"/>
    <text x="510" y="28" font-size="13" font-weight="700" text-anchor="middle" fill="#a67c1a">Multinational deployments inherit the strictest applicable regime</text>
    <text x="510" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">Design to EU AI Act requirements first, then validate against local sectoral and notification rules.</text>
    <text x="510" y="65" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a3a">GDPR (EU) and similar privacy frameworks apply orthogonally to any system processing personal data.</text>
  </g>
</svg>
